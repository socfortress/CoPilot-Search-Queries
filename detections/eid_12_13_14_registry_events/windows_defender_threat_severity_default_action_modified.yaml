name: Windows Defender Threat Severity Default Action Modified
id: 5a9e1b2c-8f7d-4a1e-9b3c-0f6d7e5a4b1f
version: 1
schema_version: "1.0"
date: "2025-07-11"
author: Matt Anderson (Huntress)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 5a9e1b2c-8f7d-4a1e-9b3c-0f6d7e5a4b1f
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects modifications or creations of Windows Defender's default threat action
  settings based on severity to 'allow' or take 'no action'. This is a highly
  suspicious configuration change that effectively disables Defender's ability
  to automatically mitigate threats of a certain severity level, allowing
  malicious software to run unimpeded. An attacker might use this technique to
  bypass defenses before executing payloads. MITRE ATT&CK: T1685.

data_source:
  - Sysmon EventID 12/13/14 - Registry Events

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_win_system_eventID: "12"
              - term:
                  data_win_system_eventID: "13"
              - term:
                  data_win_system_eventID: "14"
            minimum_should_match: 1
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\Microsoft\\\\Windows Defender\\\\Threats\\\\ThreatSeverityDefaultAction\\\\*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetObject: "*\\\\1"
              - wildcard:
                  data_win_eventdata_targetObject: "*\\\\2"
              - wildcard:
                  data_win_eventdata_targetObject: "*\\\\4"
              - wildcard:
                  data_win_eventdata_targetObject: "*\\\\5"
            minimum_should_match: 1
        - bool:
            should:
              - term:
                  data_win_eventdata_details:
                    value: "DWORD (0x00000006)"
                    case_insensitive: true
              - term:
                  data_win_eventdata_details:
                    value: "DWORD (0x00000009)"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\Microsoft\Windows Defender\Threats\ThreatSeverityDefaultAction\*';
  data_win_eventdata_targetObject matches '*\1'; data_win_eventdata_targetObject
  matches '*\2', among other conditions.

known_false_positives: >
  Legitimate administration via scripts or tools (e.g., SCCM, Intune, GPO
  enforcement). Correlate with administrative activity.. Software installations
  that legitimately modify Defender settings (less common for these specific
  keys). Baseline expected activity in your environment and tune this detection
  before relying on it for automated response.

references:
  - https://learn.microsoft.com/en-us/powershell/module/defender/set-mppreference
  - https://learn.microsoft.com/en-us/windows-hardware/customize/desktop/unattend/security-malware-windows-defender-threatseveritydefaultaction
  - https://research.splunk.com/endpoint/7215831c-8252-4ae3-8d43-db588e82f952
  - https://gist.github.com/Dump-GUY/8daef859f382b895ac6fd0cf094555d2
  - https://thedfirreport.com/2021/10/18/icedid-to-xinglocker-ransomware-in-24-hours/
  - https://attack.mitre.org/techniques/T1685/

response:
  message: >
    Windows Defender Threat Severity Default Action Modified detected on host
    $agent_name$. Matched data_win_eventdata_targetObject:
    $data_win_eventdata_targetObject$. Matched data_win_eventdata_details:
    $data_win_eventdata_details$. MITRE ATT&CK: T1685
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685
  custom_tags:
    - defender
    - threat
    - severity
    - registry
    - sysmon
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13" OR data_win_system_eventID:"14") AND data_win_eventdata_targetObject:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr]\\[Tt][Hh][Rr][Ee][Aa][Tt][Ss]\\[Tt][Hh][Rr][Ee][Aa][Tt][Ss][Ee][Vv][Ee][Rr][Ii][Tt][Yy][Dd][Ee][Ff][Aa][Uu][Ll][Tt][Aa][Cc][Tt][Ii][Oo][Nn]\\.*/ AND (data_win_eventdata_targetObject:/.*\\1/ OR data_win_eventdata_targetObject:/.*\\2/ OR data_win_eventdata_targetObject:/.*\\4/ OR data_win_eventdata_targetObject:/.*\\5/) AND (data_win_eventdata_details:/[Dd][Ww][Oo][Rr][Dd] \(0[Xx]00000006\)/ OR data_win_eventdata_details:/[Dd][Ww][Oo][Rr][Dd] \(0[Xx]00000009\)/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 1e8a9b4d-3c2a-4f9b-8d1e-7c6a5b4f3d2e
    name: PowerShell Defender Threat Severity Default Action Set to 'Allow' or 'NoAction'
    reason: 'Process-creation twin: Set-MpPreference -*ThreatIDDefaultAction/HighThreatDefaultAction is the usual command that writes this ThreatSeverityDefaultAction registry value, giving the parent process and command line.'
  - id: windows-defender-asr-threat-tamper-001
    name: Windows Defender ASR or Threat Configuration Tamper
    reason: Same command-line tampering of Defender threat/ASR configuration; attackers neuter several Defender controls in one script.
  - id: a982fc9c-6333-4ffb-a51d-addb04e8b529
    name: Windows Defender Exclusions Added - Registry
    reason: 'Typically paired: after setting default actions to allow, the actor adds path/process exclusions so the payload is not scanned or remediated.'
  - id: 0eb46774-f1ab-4a74-8238-1155855f2263
    name: Disable Windows Defender Functionalities Via Registry Keys
    reason: Companion registry change disabling real-time protection/AV features, part of the same defense-impairment sweep.
  - id: 93d298a1-d28f-47f1-a468-d971e7796679
    name: Disable Tamper Protection on Windows Defender
    reason: Tamper Protection must be off for Defender registry settings to stick, so it is a precursor or companion to this change.
  - id: 17769c90-230e-488b-a463-e05c08e9d48f
    name: Powershell Defender Exclusion
    reason: PowerShell Add-MpPreference exclusions are the common follow-on to weakening Defender before dropping payloads.
  - id: 801bd44f-ceed-4eb6-887c-11544633c0aa
    name: Windows Defender Configuration Changes
    reason: Defender's own operational log (event 5007) records the configuration change, independently confirming the registry write.
  - id: b28e58e4-2a72-4fae-bdee-0fbe904db642
    name: Windows Defender Real-time Protection Disabled
    reason: 'Escalation of the same intent: once threat actions are neutralised the actor often disables real-time protection outright.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Defender tampering commands (Set-MpPreference, exclusions, service stop)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss]et-[Mm]p[Pp]reference.*/ OR data_win_eventdata_commandLine:/.*[Aa]dd-[Mm]p[Pp]reference.*/ OR data_win_eventdata_commandLine:/.*[Dd]isable[Rr]ealtime[Mm]onitoring.*/ OR data_win_eventdata_commandLine:/.*[Tt]hreat[Ii][Dd]?[Ss]?[Ee]?[Vv]?[Ee]?[Rr]?[Ii]?[Tt]?[Yy]?[Dd]efault[Aa]ction.*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc].*(stop|config|delete).*([Ww]in[Dd]efend|[Ss]ense|[Ww]d[Ff]ilter).*/ OR data_win_eventdata_commandLine:/.*[Rr]eg.*[Ww]indows [Dd]efender.*/)
    pivot_on:
    - host
    window: 2h
  - name: Other Defender registry changes (exclusions, disable flags, tamper protection)
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13" OR data_win_system_eventID:"14") AND data_win_eventdata_targetObject:/.*[Mm]icrosoft\\([Ww]indows [Dd]efender|[Ww]indows [Dd]efender [Ss]ecurity [Cc]enter)\\.*/ AND (data_win_eventdata_targetObject:/.*(Exclusions|DisableAntiSpyware|DisableRealtimeMonitoring|DisableBehaviorMonitoring|TamperProtection|DisableIOAVProtection|DisableAntiVirus).*/)
    pivot_on:
    - host
    window: 2h
  - name: Process that wrote the Defender setting and its launch chain
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Pp]ower[Ss]hell|[Pp]wsh|[Cc]md|[Rr]eg|[Ww]mic|[Mm]shta|[Ww]script|[Cc]script|[Rr]und[Ll][Ll]32)\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*([Ee]nc|[Ee]ncoded[Cc]ommand|[Ff]rom[Bb]ase64|[Dd]ownload[Ss]tring|[Ii][Ee][Xx]|[Ii]nvoke-[Ee]xpression|[Hh]idden|[Bb]ypass).*/))
    pivot_on:
    - host
    window: 1h
  - name: Payload staging and execution after Defender weakened
    query: (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.(exe|dll|ps1|bat|vbs|hta|js|scr)/ AND data_win_eventdata_targetFilename:/.*(\\[Tt]emp\\|\\[Pp]rogram[Dd]ata\\|\\[Uu]sers\\[Pp]ublic\\|\\[Aa]pp[Dd]ata\\).*/) OR (data_win_system_eventID:"3" AND data_win_eventdata_initiated:"true" AND data_win_eventdata_image:/.*(\\[Tt]emp\\|\\[Pp]rogram[Dd]ata\\|\\[Uu]sers\\[Pp]ublic\\|\\[Aa]pp[Dd]ata\\).*/)
    pivot_on:
    - host
    window: 2h
  - name: 'Ransomware precursors: shadow copy and backup destruction'
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Vv]ssadmin.*[Dd]elete.*/ OR data_win_eventdata_commandLine:/.*[Ww]mic.*[Ss]hadowcopy.*[Dd]elete.*/ OR data_win_eventdata_commandLine:/.*[Bb]cdedit.*([Rr]ecoveryenabled|[Bb]ootstatuspolicy).*/ OR data_win_eventdata_commandLine:/.*[Ww]base[Dd]mi[Nn]?.*[Dd]elete.*/ OR data_win_eventdata_commandLine:/.*[Ww]badmin.*[Dd]elete.*/)
    pivot_on:
    - host
    window: 4h
