name: Narrator's Feedback-Hub Persistence
id: f663a6d9-9d1b-49b8-b2b1-0637914d199a
version: 1
schema_version: "1.0"
date: "2022-03-26"
author: Dmitriy Lifanov, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: f663a6d9-9d1b-49b8-b2b1-0637914d199a
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects abusing Windows 10 Narrator's Feedback-Hub. MITRE ATT&CK: T1547.001.

data_source:
  - Sysmon EventID 12/13/14 - Registry Events

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_win_system_eventID: "12"
              - term:
                  data_win_system_eventID: "13"
              - term:
                  data_win_system_eventID: "14"
            minimum_should_match: 1
        
        - bool:
            should:
              - bool:
                  must:
                    - term:
                        data_win_eventdata_eventType:
                          value: "DeleteValue"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_targetObject:
                          value: "*\\\\AppXypsaf9f1qserqevf0sws76dx4k9a5206\\\\Shell\\\\open\\\\command\\\\DelegateExecute"
                          case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\AppXypsaf9f1qserqevf0sws76dx4k9a5206\\\\Shell\\\\open\\\\command\\\\(Default)"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_eventType
    - data_win_eventdata_targetObject
    - data_win_eventdata_image
    - data_win_eventdata_details

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_eventType equals
  'DeleteValue'; data_win_eventdata_targetObject matches
  '*\AppXypsaf9f1qserqevf0sws76dx4k9a5206\Shell\open\command\DelegateExecute';
  data_win_eventdata_targetObject matches
  '*\AppXypsaf9f1qserqevf0sws76dx4k9a5206\Shell\open\command\(Default)'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://giuliocomi.blogspot.com/2019/10/abusing-windows-10-narrators-feedback.html
  - https://attack.mitre.org/techniques/T1547/001/

response:
  message: >
    Narrator's Feedback-Hub Persistence detected on host $agent_name$. Matched
    data_win_eventdata_eventType: $data_win_eventdata_eventType$. Matched
    data_win_eventdata_targetObject: $data_win_eventdata_targetObject$. MITRE
    ATT&CK: T1547.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_eventType
      type: other
    - field: data_win_eventdata_targetObject
      type: registry_key

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1547.001
  custom_tags:
    - narrator
    - feedback
    - persistence
    - registry
    - sysmon
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13" OR data_win_system_eventID:"14") AND ((data_win_eventdata_eventType:/[Dd][Ee][Ll][Ee][Tt][Ee][Vv][Aa][Ll][Uu][Ee]/ AND data_win_eventdata_targetObject:/.*\\[Aa][Pp][Pp][Xx][Yy][Pp][Ss][Aa][Ff]9[Ff]1[Qq][Ss][Ee][Rr][Qq][Ee][Vv][Ff]0[Ss][Ww][Ss]76[Dd][Xx]4[Kk]9[Aa]5206\\[Ss][Hh][Ee][Ll][Ll]\\[Oo][Pp][Ee][Nn]\\[Cc][Oo][Mm][Mm][Aa][Nn][Dd]\\[Dd][Ee][Ll][Ee][Gg][Aa][Tt][Ee][Ee][Xx][Ee][Cc][Uu][Tt][Ee]/) OR data_win_eventdata_targetObject:/.*\\[Aa][Pp][Pp][Xx][Yy][Pp][Ss][Aa][Ff]9[Ff]1[Qq][Ss][Ee][Rr][Qq][Ee][Vv][Ff]0[Ss][Ww][Ss]76[Dd][Xx]4[Kk]9[Aa]5206\\[Ss][Hh][Ee][Ll][Ll]\\[Oo][Pp][Ee][Nn]\\[Cc][Oo][Mm][Mm][Aa][Nn][Dd]\\\([Dd][Ee][Ff][Aa][Uu][Ll][Tt]\)/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 152f3630-77c1-4284-bcc0-4cc68ab2f6e7
    name: Shell Open Registry Keys Manipulation
    reason: 'Same primitive: hijacking a shell\open\command (Default/DelegateExecute) handler so a trusted app launch runs attacker code.'
  - id: 46dd5308-4572-4d12-aa43-8938f0184d4f
    name: Bypass UAC Using DelegateExecute
    reason: Same DelegateExecute value tampering in a Classes\...\shell\open\command key, used for elevation instead of persistence; shows intent.
  - id: baca5663-583c-45f9-b5dc-ea96a22ce542
    name: Sticky Key Like Backdoor Usage - Registry
    reason: Sibling accessibility-feature hijack (IFEO debugger on utilman/sethc/narrator); attackers stack these for pre-logon SYSTEM access.
  - id: 9577edbb-851f-4243-8c91-1d5b50c1a39b
    name: Atbroker Registry Change
    reason: Accessibility assistive-technology registry abuse (ATBroker) - same family of accessibility persistence and often co-deployed.
  - id: dd3ee8cc-f751-41c9-ba53-5a32ed47e563
    name: Registry Modification of MS-settings Protocol Handler
    reason: Another shell\open\command handler hijack of a built-in app/protocol handler, triggered by a user-launched Windows component.
  - id: fdbf0b9d-0182-4c43-893b-a1eaab92d085
    name: Potential Persistence Via Custom Protocol Handler
    reason: Custom protocol handler registration is the same open\command redirection technique for persistence/execution.
  - id: 7f4c43f9-b1a5-4c7d-b24a-b41bf3a3ebf2
    name: Registry Tampering by Potentially Suspicious Processes
    reason: Identifies the (scripting/LOLBin) process that wrote the key; the registry edit is its follow-on persistence step.
  - id: f59c3faf-50f3-464b-9f4c-1b67ab512d99
    name: Common Autorun Keys Modification
    reason: Attackers pair a handler hijack with a conventional Run-key as redundant persistence.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Narrator / Feedback Hub launch or child processes (trigger of hijacked handler)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Nn][Aa][Rr][Rr][Aa][Tt][Oo][Rr].[Ee][Xx][Ee].*/ OR data_win_eventdata_parentImage:/.*\\[Nn][Aa][Rr][Rr][Aa][Tt][Oo][Rr].[Ee][Xx][Ee].*/ OR data_win_eventdata_parentImage:/.*\\[Nn][Aa][Rr][Rr][Aa][Tt][Oo][Rr][Qq][Uu][Ii][Cc][Kk][Ss][Tt][Aa][Rr][Tt].[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Nn][Aa][Rr][Rr][Aa][Tt][Oo][Rr][Qq][Uu][Ii][Cc][Kk][Ss][Tt][Aa][Rr][Tt].[Ee][Xx][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Ff][Ee][Ee][Dd][Bb][Aa][Cc][Kk][Hh][Uu][Bb].*/ OR data_win_eventdata_commandLine:/.*[Ff][Ee][Ee][Dd][Bb][Aa][Cc][Kk][Hh][Uu][Bb].*/)
    pivot_on:
    - host
    window: 6h
  - name: Value written to the Feedback Hub AppX shell\open\command key (the payload path)
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Aa][Pp][Pp][Xx][Yy][Pp][Ss][Aa][Ff]9[Ff]1[Qq][Ss][Ee][Rr][Qq][Ee][Vv][Ff]0[Ss][Ww][Ss]76[Dd][Xx]4[Kk]9[Aa]5206.*/
    pivot_on:
    - host
    window: 2h
  - name: reg/PowerShell command line editing shell open command or the AppX key
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Aa][Pp][Pp][Xx][Yy][Pp][Ss][Aa][Ff]9[Ff]1[Qq][Ss][Ee][Rr][Qq][Ee][Vv][Ff]0[Ss][Ww][Ss]76[Dd][Xx]4[Kk]9[Aa]5206.*/ OR (data_win_eventdata_commandLine:/.*[Ss][Hh][Ee][Ll][Ll]\\[Oo][Pp][Ee][Nn]\\[Cc][Oo][Mm][Mm][Aa][Nn][Dd].*/ AND (data_win_eventdata_commandLine:/.*[Rr][Ee][Gg](\.exe)? +add.*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Ii][Tt][Ee][Mm][Pp][Rr][Oo][Pp][Ee][Rr][Tt][Yy].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Ww]-[Ii][Tt][Ee][Mm][Pp][Rr][Oo][Pp][Ee][Rr][Tt][Yy].*/)))
    pivot_on:
    - host
    window: 2h
  - name: 'Sibling accessibility hijacks: IFEO debugger on utilman/sethc/osk/narrator, SilentProcessExit'
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:/.*[Ii][Mm][Aa][Gg][Ee] [Ff][Ii][Ll][Ee] [Ee][Xx][Ee][Cc][Uu][Tt][Ii][Oo][Nn] [Oo][Pp][Tt][Ii][Oo][Nn][Ss]\\([Uu][Tt][Ii][Ll][Mm][Aa][Nn]|[Ss][Ee][Tt][Hh][Cc]|[Oo][Ss][Kk]|[Nn][Aa][Rr][Rr][Aa][Tt][Oo][Rr]|[Mm][Aa][Gg][Nn][Ii][Ff][Yy]|[Dd][Ii][Ss][Pp][Ll][Aa][Yy][Ss][Ww][Ii][Tt][Cc][Hh]|[Aa][Tt][Bb][Rr][Oo][Kk][Ee][Rr])\.[Ee][Xx][Ee].*/ OR data_win_eventdata_targetObject:/.*[Ss][Ii][Ll][Ee][Nn][Tt][Pp][Rr][Oo][Cc][Ee][Ss][Ss][Ee][Xx][Ii][Tt].*/)
    pivot_on:
    - host
    window: 24h
  - name: Payload staged in user-writable paths (exe/dll/script) around the registry change
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]|\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\([Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]|[Rr][Oo][Aa][Mm][Ii][Nn][Gg])|\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]).*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Pp][Ss]1|[Bb][Aa][Tt]|[Vv][Bb][Ss]|[Jj][Ss]|[Hh][Tt][Aa]|[Cc][Mm][Dd])/
    pivot_on:
    - host
    window: 2h
