name: Narrator's Feedback-Hub Persistence
id: f663a6d9-9d1b-49b8-b2b1-0637914d199a
version: 1
schema_version: "1.0"
date: "2022-03-26"
author: Dmitriy Lifanov, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: f663a6d9-9d1b-49b8-b2b1-0637914d199a
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects abusing Windows 10 Narrator's Feedback-Hub. MITRE ATT&CK: T1547.001.

data_source:
  - Sysmon EventID 12/13/14 - Registry Events

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_win_system_eventID: "12"
              - term:
                  data_win_system_eventID: "13"
              - term:
                  data_win_system_eventID: "14"
            minimum_should_match: 1
        
        - bool:
            should:
              - bool:
                  must:
                    - term:
                        data_win_eventdata_eventType:
                          value: "DeleteValue"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_targetObject:
                          value: "*\\\\AppXypsaf9f1qserqevf0sws76dx4k9a5206\\\\Shell\\\\open\\\\command\\\\DelegateExecute"
                          case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\AppXypsaf9f1qserqevf0sws76dx4k9a5206\\\\Shell\\\\open\\\\command\\\\(Default)"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_eventType
    - data_win_eventdata_targetObject
    - data_win_eventdata_image
    - data_win_eventdata_details

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_eventType equals
  'DeleteValue'; data_win_eventdata_targetObject matches
  '*\AppXypsaf9f1qserqevf0sws76dx4k9a5206\Shell\open\command\DelegateExecute';
  data_win_eventdata_targetObject matches
  '*\AppXypsaf9f1qserqevf0sws76dx4k9a5206\Shell\open\command\(Default)'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://giuliocomi.blogspot.com/2019/10/abusing-windows-10-narrators-feedback.html
  - https://attack.mitre.org/techniques/T1547/001/

response:
  message: >
    Narrator's Feedback-Hub Persistence detected on host $agent_name$. Matched
    data_win_eventdata_eventType: $data_win_eventdata_eventType$. Matched
    data_win_eventdata_targetObject: $data_win_eventdata_targetObject$. MITRE
    ATT&CK: T1547.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_eventType
      type: other
    - field: data_win_eventdata_targetObject
      type: registry_key

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1547.001
  custom_tags:
    - narrator
    - feedback
    - persistence
    - registry
    - sysmon
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13" OR data_win_system_eventID:"14") AND ((data_win_eventdata_eventType:/[Dd][Ee][Ll][Ee][Tt][Ee][Vv][Aa][Ll][Uu][Ee]/ AND data_win_eventdata_targetObject:/.*\\[Aa][Pp][Pp][Xx][Yy][Pp][Ss][Aa][Ff]9[Ff]1[Qq][Ss][Ee][Rr][Qq][Ee][Vv][Ff]0[Ss][Ww][Ss]76[Dd][Xx]4[Kk]9[Aa]5206\\[Ss][Hh][Ee][Ll][Ll]\\[Oo][Pp][Ee][Nn]\\[Cc][Oo][Mm][Mm][Aa][Nn][Dd]\\[Dd][Ee][Ll][Ee][Gg][Aa][Tt][Ee][Ee][Xx][Ee][Cc][Uu][Tt][Ee]/) OR data_win_eventdata_targetObject:/.*\\[Aa][Pp][Pp][Xx][Yy][Pp][Ss][Aa][Ff]9[Ff]1[Qq][Ss][Ee][Rr][Qq][Ee][Vv][Ff]0[Ss][Ww][Ss]76[Dd][Xx]4[Kk]9[Aa]5206\\[Ss][Hh][Ee][Ll][Ll]\\[Oo][Pp][Ee][Nn]\\[Cc][Oo][Mm][Mm][Aa][Nn][Dd]\\\([Dd][Ee][Ff][Aa][Uu][Ll][Tt]\)/)

