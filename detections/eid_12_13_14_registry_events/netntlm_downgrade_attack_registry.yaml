name: NetNTLM Downgrade Attack - Registry
id: d67572a0-e2ec-45d6-b8db-c100d14b8ef2
version: 1
schema_version: "1.0"
date: "2024-12-03"
author: Florian Roth (Nextron Systems), wagga, Nasreddine Bencherchali (Splunk STRT)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: d67572a0-e2ec-45d6-b8db-c100d14b8ef2
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects NetNTLM downgrade attack. MITRE ATT&CK: T1685, T1112.

data_source:
  - Sysmon EventID 12/13/14 - Registry Events

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_win_system_eventID: "12"
              - term:
                  data_win_system_eventID: "13"
              - term:
                  data_win_system_eventID: "14"
            minimum_should_match: 1
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*SYSTEM\\\\*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*ControlSet*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\Control\\\\Lsa*"
              case_insensitive: true
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_targetObject:
                          value: "*\\\\lmcompatibilitylevel"
                          case_insensitive: true
                    - bool:
                        should:
                          - term:
                              data_win_eventdata_details:
                                value: "DWORD (0x00000000)"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_details:
                                value: "DWORD (0x00000001)"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_details:
                                value: "DWORD (0x00000002)"
                                case_insensitive: true
                        minimum_should_match: 1
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_targetObject:
                          value: "*\\\\NtlmMinClientSec"
                          case_insensitive: true
                    - bool:
                        should:
                          - term:
                              data_win_eventdata_details:
                                value: "DWORD (0x00000000)"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_details:
                                value: "DWORD (0x00000010)"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_details:
                                value: "DWORD (0x00000020)"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_details:
                                value: "DWORD (0x00000030)"
                                case_insensitive: true
                        minimum_should_match: 1
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\RestrictSendingNTLMTraffic"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*SYSTEM\*'; data_win_eventdata_targetObject matches '*ControlSet*';
  data_win_eventdata_targetObject matches '*\Control\Lsa*', among other
  conditions.

known_false_positives: >
  Services or tools that set the values to more restrictive values. Baseline
  expected activity in your environment and tune this detection before relying
  on it for automated response.

references:
  - https://web.archive.org/web/20171113231705/https://www.optiv.com/blog/post-exploitation-using-netntlm-downgrade-attacks
  - https://www.ultimatewindowssecurity.com/wiki/page.aspx?spid=NSrpcservers
  - https://attack.mitre.org/techniques/T1685/
  - https://attack.mitre.org/techniques/T1112/

response:
  message: >
    NetNTLM Downgrade Attack - Registry detected on host $agent_name$. Matched
    data_win_eventdata_targetObject: $data_win_eventdata_targetObject$. Matched
    data_win_eventdata_details: $data_win_eventdata_details$. MITRE ATT&CK:
    T1685, T1112
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685
    - T1112
  custom_tags:
    - netntlm
    - downgrade
    - attack
    - registry
    - sysmon
    - persistence
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13" OR data_win_system_eventID:"14") AND data_win_eventdata_targetObject:/.*[Ss][Yy][Ss][Tt][Ee][Mm]\\.*/ AND data_win_eventdata_targetObject:/.*[Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt].*/ AND data_win_eventdata_targetObject:/.*\\[Cc][Oo][Nn][Tt][Rr][Oo][Ll]\\[Ll][Ss][Aa].*/ AND ((data_win_eventdata_targetObject:/.*\\[Ll][Mm][Cc][Oo][Mm][Pp][Aa][Tt][Ii][Bb][Ii][Ll][Ii][Tt][Yy][Ll][Ee][Vv][Ee][Ll]/ AND (data_win_eventdata_details:/[Dd][Ww][Oo][Rr][Dd] \(0[Xx]00000000\)/ OR data_win_eventdata_details:/[Dd][Ww][Oo][Rr][Dd] \(0[Xx]00000001\)/ OR data_win_eventdata_details:/[Dd][Ww][Oo][Rr][Dd] \(0[Xx]00000002\)/)) OR (data_win_eventdata_targetObject:/.*\\[Nn][Tt][Ll][Mm][Mm][Ii][Nn][Cc][Ll][Ii][Ee][Nn][Tt][Ss][Ee][Cc]/ AND (data_win_eventdata_details:/[Dd][Ww][Oo][Rr][Dd] \(0[Xx]00000000\)/ OR data_win_eventdata_details:/[Dd][Ww][Oo][Rr][Dd] \(0[Xx]00000010\)/ OR data_win_eventdata_details:/[Dd][Ww][Oo][Rr][Dd] \(0[Xx]00000020\)/ OR data_win_eventdata_details:/[Dd][Ww][Oo][Rr][Dd] \(0[Xx]00000030\)/)) OR data_win_eventdata_targetObject:/.*\\[Rr][Ee][Ss][Tt][Rr][Ii][Cc][Tt][Ss][Ee][Nn][Dd][Ii][Nn][Gg][Nn][Tt][Ll][Mm][Tt][Rr][Aa][Ff][Ff][Ii][Cc]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d3abac66-f11c-4ed0-8acb-50cc29c97eed
    name: NetNTLM Downgrade Attack
    reason: 'Security-log counterpart: the same lmcompatibilitylevel/NtlmMinClientSec/RestrictSendingNTLMTraffic change seen via audit events; confirms the downgrade took effect on this host.'
  - id: e9d4ab66-a532-4ef7-a502-66a9e4a34f5d
    name: NTLMv1 Logon Between Client and Server
    reason: 'Direct consequence of the downgrade: once LmCompatibilityLevel is lowered, NTLMv1 logons appear whose challenge-response is trivially crackable.'
  - id: b99a1518-1ad5-4f65-bc95-1ffff97a8fd0
    name: HackTool - Inveigh Execution
    reason: Inveigh/Responder-style poisoning is the usual reason to force weaker NetNTLM so captured hashes can be cracked or relayed.
  - id: 5589ab4f-a767-433c-961d-c91f3f704db1
    name: Potential SMB Relay Attack Tool Execution
    reason: Attackers pair the downgrade with NTLM relay/capture tooling right after weakening NTLM settings.
  - id: 8eef149c-bd26-49f2-9e5a-9b00e3af499b
    name: Pass the Hash Activity 2
    reason: Captured or cracked NTLM material is replayed as pass-the-hash for lateral movement; follow-on to the downgrade.
  - id: d6a9b252-c666-4de6-8806-5561bbbd3bdc
    name: Wdigest Enable UseLogonCredential
    reason: Co-occurring LSA credential-hardening tampering by the same operator to expose cleartext or weak credentials.
  - id: 1a2d6c47-75b0-45bd-b133-2c0be75349fd
    name: Wdigest CredGuard Registry Modification
    reason: Registry tampering under the same LSA/credential-protection keys, indicating a credential-access preparation phase.
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: Credential extraction tooling commonly run on the host after NTLM protections are weakened.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Reg/PowerShell commands setting NTLM or LSA policy values
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:(*lmcompatibilitylevel* OR *NtlmMinClientSec* OR *RestrictSendingNTLMTraffic* OR *NoLMHash* OR *UseLogonCredential*)
    pivot_on:
    - host
    window: 2h
  - name: NTLM relay / poisoning tooling executed
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Ii]nveigh|[Rr]esponder|[Nn]tlmrelayx|[Ss]mbrelayx|[Mm]ulti[Rr]elay).*/ OR data_win_eventdata_commandLine:(*Invoke-Inveigh* OR *ntlmrelayx* OR *Responder.py* OR *smbrelayx*))
    pivot_on:
    - host
    window: 4h
  - name: 'Credential store access: LSASS handle or SAM/SECURITY hive save'
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:*reg*save* AND (data_win_eventdata_commandLine:*sam* OR data_win_eventdata_commandLine:*security*))
    pivot_on:
    - host
    window: 4h
  - name: NTLMv1 logons on this host
    query: data_win_system_eventID:"4624" AND data_win_eventdata_authenticationPackageName:"NTLM" AND data_win_eventdata_lmPackageName:"NTLM V1"
    pivot_on:
    - host
    window: 6h
  - name: Outbound SMB connections from non-system processes
    query: data_win_system_eventID:"3" AND (data_win_eventdata_destinationPort:"445" OR data_win_eventdata_destinationPort:"139") AND data_win_eventdata_initiated:"true" AND NOT data_win_eventdata_image:"System"
    pivot_on:
    - host
    window: 2h
