name: Esentutl Volume Shadow Copy Service Keys
id: 5aad0995-46ab-41bd-a9ff-724f41114971
version: 1
schema_version: "1.0"
date: "2022-12-25"
author: Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 5aad0995-46ab-41bd-a9ff-724f41114971
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the volume shadow copy service initialization and processing via
  esentutl. Registry keys such as
  HKLM\\System\\CurrentControlSet\\Services\\VSS\\Diag\\VolSnap\\Volume are
  captured. MITRE ATT&CK: T1003.002.

data_source:
  - Sysmon EventID 12/13/14 - Registry Events

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_win_system_eventID: "12"
              - term:
                  data_win_system_eventID: "13"
              - term:
                  data_win_system_eventID: "14"
            minimum_should_match: 1
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*System\\\\CurrentControlSet\\\\Services\\\\VSS*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_image:
              value: "*esentutl.exe"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_targetObject"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*System\\\\CurrentControlSet\\\\Services\\\\VSS\\\\Start*"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_image
    - data_win_eventdata_details

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*System\CurrentControlSet\Services\VSS*'; data_win_eventdata_image matches
  '*esentutl.exe'; data_win_eventdata_targetObject matches
  '*System\CurrentControlSet\Services\VSS\Start*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1003.002/T1003.002.md#atomic-test-3---esentutlexe-sam-copy
  - https://attack.mitre.org/techniques/T1003/002/

response:
  message: >
    Esentutl Volume Shadow Copy Service Keys detected on host $agent_name$.
    Matched data_win_eventdata_targetObject: $data_win_eventdata_targetObject$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1003.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.002
  custom_tags:
    - esentutl
    - volume
    - shadow
    - registry
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13" OR data_win_system_eventID:"14") AND data_win_eventdata_targetObject:/.*[Ss][Yy][Ss][Tt][Ee][Mm]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt]\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\[Vv][Ss][Ss].*/ AND data_win_eventdata_image:/.*[Ee][Ss][Ee][Nn][Tt][Uu][Tt][Ll]\.[Ee][Xx][Ee]/ AND _exists_:data_win_eventdata_targetObject AND NOT (data_win_eventdata_targetObject:/.*[Ss][Yy][Ss][Tt][Ee][Mm]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt]\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\[Vv][Ss][Ss]\\[Ss][Tt][Aa][Rr][Tt].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d372f928-ce4f-11eb-a762-acde48001122
    name: Esentutl SAM Copy
    reason: Same esentutl /vss credential-copy technique (Atomic T1003.002 test 3); the VSS registry keys are the side effect of this command line.
  - id: 7df1713a-1a5b-4a4b-a071-dc83b144a101
    name: Esentutl Gather Credentials
    reason: Process-creation view of esentutl being used to copy credential stores; confirms the command line behind the VSS key touch.
  - id: b17ea6f7-6e90-447e-a799-e6c0a493d6ce
    name: Shadow Copies Creation Using Operating Systems Utilities
    reason: 'Precursor: attacker often creates a shadow copy first so esentutl /vss can read locked SAM/NTDS files.'
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: 'Follow-on cleanup: shadow copies created for the dump are deleted to remove traces.'
  - id: c73124a7-3e89-44a3-bdc1-25fe4df754b1
    name: Copy From VolumeShadowCopy Via Cmd.EXE
    reason: Alternative way of pulling locked credential files out of a shadow copy on the same host.
  - id: f57f8d16-1f39-4dcb-a604-6c73d9b54b3d
    name: Sensitive File Access Via Volume Shadow Copy Backup
    reason: Co-occurring access to SAM/SYSTEM/NTDS through VSS, the same goal as the esentutl VSS use.
  - id: 11b1ed55-154d-4e82-8ad7-83739298f720
    name: NTDS.DIT Creation By Uncommon Process
    reason: On a domain controller, esentutl VSS copy yields ntds.dit written to disk by a non-standard process.
  - id: 3a8da4e0-36c1-40d2-8b29-b3e890d5172a
    name: NTDS Exfiltration Filename Patterns
    reason: Staging of the dumped database under known exfil filenames after the copy.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Esentutl executions with VSS/copy arguments
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Ee][Ss][Ee][Nn][Tt][Uu][Tt][Ll]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*\/[Vv][Ss][Ss].*/ OR data_win_eventdata_commandLine:/.*\/[Yy].*/ OR data_win_eventdata_commandLine:/.*[Ss][Aa][Mm].*/ OR data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss].*/)
    pivot_on:
    - host
    window: 1h
  - name: Credential hive or NTDS files written to disk
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:*\\ntds.dit* OR data_win_eventdata_targetFilename:*\\SAM* OR data_win_eventdata_targetFilename:*\\SYSTEM* OR data_win_eventdata_targetFilename:*\\SECURITY*) AND NOT data_win_eventdata_targetFilename:*\\Windows\\System32\\config\\*
    pivot_on:
    - host
    window: 2h
  - name: Shadow copy creation or listing tools on host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*[Ss][Hh][Aa][Dd][Oo][Ww].*/ OR data_win_eventdata_commandLine:/.*[Ww][Mm][Ii][Cc].*[Ss][Hh][Aa][Dd][Oo][Ww][Cc][Oo][Pp][Yy].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Kk][Ss][Hh][Aa][Dd][Oo][Ww].*/ OR data_win_eventdata_commandLine:/.*[Gg][Ll][Oo][Bb][Aa][Ll][Rr][Oo][Oo][Tt]\\[Dd][Ee][Vv][Ii][Cc][Ee]\\[Hh][Aa][Rr][Dd][Dd][Ii][Ss][Kk][Vv][Oo][Ll][Uu][Mm][Ee][Ss][Hh][Aa][Dd][Oo][Ww].*/)
    pivot_on:
    - host
    window: 2h
  - name: Archiving or exfil of dumped credential files
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*([Ss][Aa][Mm]|[Nn][Tt][Dd][Ss]|[Ss][Yy][Ss][Tt][Ee][Mm])\.?[a-zA-Z]*.*/) AND (data_win_eventdata_image:/.*(\\7z\.exe|\\rar\.exe|\\tar\.exe|\\certutil\.exe|\\curl\.exe|\\bitsadmin\.exe)/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]-[Aa][Rr][Cc][Hh][Ii][Vv][Ee].*/)
    pivot_on:
    - host
    window: 4h
  - name: Registry access by esentutl to VSS service keys
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13" OR data_win_system_eventID:"14") AND data_win_eventdata_image:/.*[Ee][Ss][Ee][Nn][Tt][Uu][Tt][Ll]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
