name: Registry Persistence Mechanisms in Recycle Bin
id: 277efb8f-60be-4f10-b4d3-037802f37167
version: 1
schema_version: "1.0"
date: "2022-12-06"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 277efb8f-60be-4f10-b4d3-037802f37167
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects persistence registry keys for Recycle Bin. MITRE ATT&CK: T1547.

data_source:
  - Sysmon EventID 12/13/14 - Registry Events

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_win_system_eventID: "12"
              - term:
                  data_win_system_eventID: "13"
              - term:
                  data_win_system_eventID: "14"
            minimum_should_match: 1
        
        - bool:
            should:
              - bool:
                  must:
                    - term:
                        data_win_eventdata_eventType:
                          value: "RenameKey"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_newName:
                          value: "*\\\\CLSID\\\\{645FF040-5081-101B-9F08-00AA002F954E}\\\\shell\\\\open*"
                          case_insensitive: true
              - bool:
                  must:
                    - term:
                        data_win_eventdata_eventType:
                          value: "SetValue"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_targetObject:
                          value: "*\\\\CLSID\\\\{645FF040-5081-101B-9F08-00AA002F954E}\\\\shell\\\\open\\\\command\\\\(Default)*"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_eventType
    - data_win_eventdata_newName
    - data_win_eventdata_targetObject
    - data_win_eventdata_image
    - data_win_eventdata_details

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_eventType equals
  'RenameKey'; data_win_eventdata_newName matches
  '*\CLSID\{645FF040-5081-101B-9F08-00AA002F954E}\shell\open*';
  data_win_eventdata_eventType equals 'SetValue', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/vxunderground/VXUG-Papers/blob/751edb8d50f95bd7baa730adf2c6c3bb1b034276/The%20Persistence%20Series/Persistence%20via%20Recycle%20Bin/Persistence_via_Recycle_Bin.pdf
  - https://persistence-info.github.io/Data/recyclebin.html
  - https://www.hexacorn.com/blog/2018/05/28/beyond-good-ol-run-key-part-78-2/
  - https://attack.mitre.org/techniques/T1547/

response:
  message: >
    Registry Persistence Mechanisms in Recycle Bin detected on host
    $agent_name$. Matched data_win_eventdata_eventType:
    $data_win_eventdata_eventType$. Matched data_win_eventdata_newName:
    $data_win_eventdata_newName$. MITRE ATT&CK: T1547
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_eventType
      type: other
    - field: data_win_eventdata_newName
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1547
  custom_tags:
    - registry
    - persistence
    - mechanisms
    - sysmon
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13" OR data_win_system_eventID:"14") AND ((data_win_eventdata_eventType:/[Rr][Ee][Nn][Aa][Mm][Ee][Kk][Ee][Yy]/ AND data_win_eventdata_newName:/.*\\[Cc][Ll][Ss][Ii][Dd]\\\{645[Ff][Ff]040-5081-101[Bb]-9[Ff]08-00[Aa][Aa]002[Ff]954[Ee]\}\\[Ss][Hh][Ee][Ll][Ll]\\[Oo][Pp][Ee][Nn].*/) OR (data_win_eventdata_eventType:/[Ss][Ee][Tt][Vv][Aa][Ll][Uu][Ee]/ AND data_win_eventdata_targetObject:/.*\\[Cc][Ll][Ss][Ii][Dd]\\\{645[Ff][Ff]040-5081-101[Bb]-9[Ff]08-00[Aa][Aa]002[Ff]954[Ee]\}\\[Ss][Hh][Ee][Ll][Ll]\\[Oo][Pp][Ee][Nn]\\[Cc][Oo][Mm][Mm][Aa][Nn][Dd]\\\([Dd][Ee][Ff][Aa][Uu][Ll][Tt]\).*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 790317c0-0a36-4a6a-a105-6e576bf99a14
    name: COM Object Hijacking Via Modification Of Default System CLSID Default Value
    reason: 'Same technique family: attacker rewrites the (Default) of a well-known system CLSID so a trusted shell object launches their payload; often paired with the Recycle Bin CLSID trick.'
  - id: windows-com-hijacking-inprocserver32-001
    name: Windows COM Hijacking InprocServer32 Modification
    reason: 'Co-occurring CLSID-based persistence: operators who hijack the Recycle Bin shell\open\command frequently also plant InprocServer32 DLL hijacks for redundancy.'
  - id: 9df5f547-c86a-433e-b533-f2794357e242
    name: Classes Autorun Keys Modification
    reason: The Recycle Bin key lives under HKCR/Classes; this detects other autorun writes in the Classes hive from the same tooling.
  - id: f59c3faf-50f3-464b-9f4c-1b67ab512d99
    name: Common Autorun Keys Modification
    reason: Attackers typically stack the Recycle Bin trigger with a classic Run/RunOnce persistence write on the same host as a fallback.
  - id: 73bba97f-a82d-42ce-b315-9182e76c57b1
    name: Imports Registry Key From a File
    reason: The shell\open\command value is often planted by importing a .reg file via reg.exe import, a precursor delivering this exact registry write.
  - id: de587dce-915e-4218-aac4-835ca6af6f70
    name: Potential Persistence Attempt Via Run Keys Using Reg.EXE
    reason: reg.exe add is the same command-line mechanism used to set the Recycle Bin command value; shows the operator's persistence toolkit on this host.
  - id: 9c5037d1-c568-49b3-88c7-9846a5bdc2be
    name: Suspicious Run Key from Download
    reason: 'Precursor/co-occurrence: a downloaded dropper writing persistence from a user-writable path indicates the initial payload that this key then re-launches.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Registry tools or scripts writing the Recycle Bin CLSID
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*645[Ff][Ff]040-5081-101[Bb]-9[Ff]08-00[Aa][Aa]002[Ff]954[Ee].*/ OR (data_win_eventdata_commandLine:/.*[Rr][Ee][Gg](\.[Ee][Xx][Ee])? +([Aa][Dd][Dd]|[Ii][Mm][Pp][Oo][Rr][Tt]).*/ AND data_win_eventdata_commandLine:/.*[Cc][Ll][Ss][Ii][Dd].*[Ss][Hh][Ee][Ll][Ll].*/))
    pivot_on:
    - host
    window: 2h
  - name: Explorer spawning payload from Recycle Bin open (trigger execution)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_image:/.*\\([Cc][Mm][Dd]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]|[Mm][Ss][Hh][Tt][Aa]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Rr][Uu][Nn][Dd][Ll][Ll]32|[Rr][Ee][Gg][Ss][Vv][Rr]32)\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\(AppData|Temp|Users\\Public|ProgramData)\\.*/)
    pivot_on:
    - host
    window: 24h
  - name: Other registry persistence writes (Run keys, COM hijacks, Winlogon, services)
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/ OR data_win_eventdata_targetObject:/.*[Ii][Nn][Pp][Rr][Oo][Cc][Ss][Ee][Rr][Vv][Ee][Rr]32.*/ OR data_win_eventdata_targetObject:/.*[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]\\([Ss][Hh][Ee][Ll][Ll]|[Uu][Ss][Ee][Rr][Ii][Nn][Ii][Tt]).*/ OR data_win_eventdata_targetObject:/.*[Ii][Mm][Aa][Gg][Ee] [Ff][Ii][Ll][Ee] [Ee][Xx][Ee][Cc][Uu][Tt][Ii][Oo][Nn] [Oo][Pp][Tt][Ii][Oo][Nn][Ss].*/ OR data_win_eventdata_targetObject:/.*[Tt][Rr][Ee][Aa][Tt][Aa][Ss].*/)
    pivot_on:
    - host
    window: 4h
  - name: Payload file dropped to user-writable paths before the registry write
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\(AppData|Temp|Users\\Public|ProgramData)\\.*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Pp][Ss]1|[Bb][Aa][Tt]|[Vv][Bb][Ss]|[Jj][Ss]|[Hh][Tt][Aa]|[Rr][Ee][Gg])/
    pivot_on:
    - host
    window: 2h
