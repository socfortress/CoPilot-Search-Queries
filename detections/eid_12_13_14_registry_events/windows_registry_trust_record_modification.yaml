name: Windows Registry Trust Record Modification
id: 295a59c1-7b79-4b47-a930-df12c15fc9c2
version: 1
schema_version: "1.0"
date: "2023-06-21"
author: Antonlovesdnb, Trent Liffick (@tliffick)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 295a59c1-7b79-4b47-a930-df12c15fc9c2
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Alerts on trust record modification within the registry, indicating usage of
  macros. MITRE ATT&CK: T1566.001.

data_source:
  - Sysmon EventID 12/13/14 - Registry Events

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_win_system_eventID: "12"
              - term:
                  data_win_system_eventID: "13"
              - term:
                  data_win_system_eventID: "14"
            minimum_should_match: 1
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\Security\\\\Trusted Documents\\\\TrustRecords*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_image
    - data_win_eventdata_details

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\Security\Trusted Documents\TrustRecords*'.

known_false_positives: >
  This will alert on legitimate macro usage as well, additional tuning is
  required. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://outflank.nl/blog/2018/01/16/hunting-for-evil-detect-macros-being-executed/
  - http://az4n6.blogspot.com/2016/02/more-on-trust-records-macros-and.html
  - https://twitter.com/inversecos/status/1494174785621819397
  - https://attack.mitre.org/techniques/T1566/001/

response:
  message: >
    Windows Registry Trust Record Modification detected on host $agent_name$.
    Matched data_win_eventdata_targetObject: $data_win_eventdata_targetObject$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1566.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1566.001
  custom_tags:
    - registry
    - trust
    - record
    - sysmon
    - initial_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13" OR data_win_system_eventID:"14") AND data_win_eventdata_targetObject:/.*\\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]\\[Tt][Rr][Uu][Ss][Tt][Ee][Dd] [Dd][Oo][Cc][Uu][Mm][Ee][Nn][Tt][Ss]\\[Tt][Rr][Uu][Ss][Tt][Rr][Ee][Cc][Oo][Rr][Dd][Ss].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 438025f9-5856-4663-83f7-52f878a70a50
    name: Suspicious Microsoft Office Child Process
    reason: Enabling macros (TrustRecords write) is immediately followed by the macro spawning a shell/script child from Word/Excel; this is the execution that confirms the trust click was malicious.
  - id: aa3a6f94-890e-4e22-b634-ffdfd54792cc
    name: Suspicious Binary In User Directory Spawned From Office Application
    reason: After the user trusts a phishing document, the macro commonly drops and launches a payload from a user-writable directory.
  - id: 4ae3e30b-b03f-43aa-87e3-b622f4048eed
    name: Potential Arbitrary File Download Using Office Application
    reason: A trusted macro document often downloads its second stage via an Office-spawned download utility.
  - id: b1c50487-1967-4315-a026-6491686d860e
    name: Office Macro File Creation From Suspicious Process
    reason: 'Precursor: the macro-enabled attachment is written to disk by a mail client, browser or archiver before the user trusts it.'
  - id: f99abdf0-6283-4e71-bd2b-b5c048a94743
    name: Potentially Suspicious Office Document Executed From Trusted Location
    reason: 'Adjacent trust-bypass: documents opened from trusted locations run macros without prompts, an alternative to writing a TrustRecord.'
  - id: e6ce8457-68b1-485b-9bdd-3c2b5d679aa9
    name: VBA DLL Loaded Via Office Application
    reason: Loading the VBA runtime into Office proves macro code actually executed after trust was granted.
  - id: 3b5ba899-9842-4bc2-acc2-12308498bf42
    name: Office Application Initiated Network Connection Over Uncommon Ports
    reason: Office process making outbound connections after macro enablement indicates macro-driven staging or C2.
  - id: 9c5037d1-c568-49b3-88c7-9846a5bdc2be
    name: Suspicious Run Key from Download
    reason: 'Typical follow-on: the macro-delivered payload establishes Run key persistence from a downloaded file.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Office application spawning shell, script host or LOLBin
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\([Ww][Ii][Nn][Ww][Oo][Rr][Dd]|[Ee][Xx][Cc][Ee][Ll]|[Pp][Oo][Ww][Ee][Rr][Pp][Nn][Tt])\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Cc][Mm][Dd]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Mm][Ss][Hh][Tt][Aa]|[Rr][Uu][Nn][Dd][Ll][Ll]32|[Rr][Ee][Gg][Ss][Vv][Rr]32|[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: Macro document delivered to disk (doc/xls with macros) by mail, browser or archiver
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.([Dd][Oo][Cc][Mm]|[Xx][Ll][Ss][Mm]|[Pp][Pp][Tt][Mm]|[Dd][Oo][Cc]|[Xx][Ll][Ss]|[Xx][Ll][Ss][Bb])/ AND data_win_eventdata_image:/.*\\([Oo][Uu][Tt][Ll][Oo][Oo][Kk]|[Cc][Hh][Rr][Oo][Mm][Ee]|[Ff][Ii][Rr][Ee][Ff][Oo][Xx]|[Mm][Ss][Ee][Dd][Gg][Ee]|[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]|7[Zz]|[Ww][Ii][Nn][Rr][Aa][Rr]|[Tt][Ee][Aa][Mm][Ss])\.?[Ee]?[Xx]?[Ee]?.*/
    pivot_on:
    - host
    window: 4h
  - name: Office process dropping executable or script payloads
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*\\([Ww][Ii][Nn][Ww][Oo][Rr][Dd]|[Ee][Xx][Cc][Ee][Ll]|[Pp][Oo][Ww][Ee][Rr][Pp][Nn][Tt])\.[Ee][Xx][Ee]/ AND data_win_eventdata_targetFilename:/.*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Pp][Ss]1|[Vv][Bb][Ss]|[Jj][Ss]|[Hh][Tt][Aa]|[Bb][Aa][Tt]|[Ll][Nn][Kk]|[Ss][Cc][Rr])/
    pivot_on:
    - host
    window: 1h
  - name: Office process network connections and DNS
    query: (data_win_system_eventID:"3" OR data_win_system_eventID:"22") AND data_win_eventdata_image:/.*\\([Ww][Ii][Nn][Ww][Oo][Rr][Dd]|[Ee][Xx][Cc][Ee][Ll]|[Pp][Oo][Ww][Ee][Rr][Pp][Nn][Tt])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: Macro security settings weakened or persistence written after trust
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:/.*[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]\\[Aa][Cc][Cc][Ee][Ss][Ss][Vv][Bb][Oo][Mm].*/ OR data_win_eventdata_targetObject:/.*[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]\\[Vv][Bb][Aa][Ww][Aa][Rr][Nn][Ii][Nn][Gg][Ss].*/ OR data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/ OR data_win_eventdata_targetObject:/.*[Oo][Ff][Ff][Ii][Cc][Ee]\\.*\\[Ww][Ii][Nn][Ww][Oo][Rr][Dd]\\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy].*/)
    pivot_on:
    - host
    window: 4h
