name: HybridConnectionManager Service Installation - Registry
id: ac8866c7-ce44-46fd-8c17-b24acff96ca8
version: 1
schema_version: "1.0"
date: "2022-11-27"
author: Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: ac8866c7-ce44-46fd-8c17-b24acff96ca8
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the installation of the Azure Hybrid Connection Manager service to
  allow remote code execution from Azure function. MITRE ATT&CK: T1608.

data_source:
  - Sysmon EventID 12/13/14 - Registry Events

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_win_system_eventID: "12"
              - term:
                  data_win_system_eventID: "13"
              - term:
                  data_win_system_eventID: "14"
            minimum_should_match: 1
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\Services\\\\HybridConnectionManager*"
                    case_insensitive: true
              - bool:
                  must:
                    - term:
                        data_win_eventdata_eventType:
                          value: "SetValue"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_details:
                          value: "*Microsoft.HybridConnectionManager.Listener.exe*"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_eventType
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\Services\HybridConnectionManager*'; data_win_eventdata_eventType equals
  'SetValue'; data_win_eventdata_details matches
  '*Microsoft.HybridConnectionManager.Listener.exe*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/Cyb3rWard0g/status/1381642789369286662
  - https://attack.mitre.org/techniques/T1608/

response:
  message: >
    HybridConnectionManager Service Installation - Registry detected on host
    $agent_name$. Matched data_win_eventdata_targetObject:
    $data_win_eventdata_targetObject$. Matched data_win_eventdata_eventType:
    $data_win_eventdata_eventType$. MITRE ATT&CK: T1608
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_eventType
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1608
  custom_tags:
    - hybridconnectionmanager
    - service
    - installation
    - registry
    - sysmon
    - resource_development
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13" OR data_win_system_eventID:"14") AND (data_win_eventdata_targetObject:/.*\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\[Hh][Yy][Bb][Rr][Ii][Dd][Cc][Oo][Nn][Nn][Ee][Cc][Tt][Ii][Oo][Nn][Mm][Aa][Nn][Aa][Gg][Ee][Rr].*/ OR (data_win_eventdata_eventType:/[Ss][Ee][Tt][Vv][Aa][Ll][Uu][Ee]/ AND data_win_eventdata_details:/.*[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\.[Hh][Yy][Bb][Rr][Ii][Dd][Cc][Oo][Nn][Nn][Ee][Cc][Tt][Ii][Oo][Nn][Mm][Aa][Nn][Aa][Gg][Ee][Rr]\.[Ll][Ii][Ss][Tt][Ee][Nn][Ee][Rr]\.[Ee][Xx][Ee].*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7bd3902d-8b8b-4dd4-838a-c6862d40150d
    name: DNS HybridConnectionManager Service Bus
    reason: Once the HCM listener service is installed it resolves *.servicebus.windows.net to open its relay channel; confirms the installed service is live and reaching Azure Relay.
  - id: 0ee4d8a5-4e67-4faf-acfa-62a78457d1f2
    name: HybridConnectionManager Service Installation
    reason: Same installation seen from the Security log (4697 service install); corroborates the registry write with the SCM-level service creation.
  - id: e043f529-8514-4205-8ab0-7f7d2927b400
    name: DNS Query To AzureWebsites.NET By Non-Browser Process
    reason: The attacker's Azure Function backend is hosted on azurewebsites.net; a non-browser process resolving it is the control-plane side of the HCM-based remote execution channel.
  - id: 5c80b618-0dbb-46e6-acbb-03d90bcb6d83
    name: Network Connection Initiated To AzureWebsites.NET By Non-Browser Process
    reason: 'Network counterpart: the host or listener connecting to the attacker-controlled Azure Function after the relay service is set up.'
  - id: f2485272-a156-4773-82d7-1d178bc4905b
    name: Suspicious Service Installed
    reason: HCM install writes a new service key (ImagePath) in the registry; generic suspicious-service registry detection often co-fires on the same Services key creation.
  - id: ff151c33-45fa-475d-af4f-c2f93571f4fe
    name: Azure AD Health Monitoring Agent Registry Keys Access
    reason: Attacker with a foothold abusing Azure hybrid components often also probes Azure AD Connect/Health agent registry keys for cloud credentials.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: HybridConnectionManager listener process execution
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:*HybridConnectionManager* OR data_win_eventdata_image:*Microsoft.HybridConnectionManager.Listener* OR data_win_eventdata_commandLine:*HybridConnectionManager*)
    pivot_on:
    - host
    window: 4h
  - name: Service Bus / Azure Relay DNS resolution
    query: data_win_system_eventID:"22" AND (data_win_eventdata_queryName:*servicebus.windows.net* OR data_win_eventdata_queryName:*azurewebsites.net*)
    pivot_on:
    - host
    window: 4h
  - name: Outbound connections to Azure Service Bus relay
    query: data_win_system_eventID:"3" AND (data_win_eventdata_destinationHostname:*servicebus.windows.net* OR data_win_eventdata_destinationHostname:*azurewebsites.net* OR data_win_eventdata_image:*HybridConnectionManager*)
    pivot_on:
    - host
    window: 4h
  - name: HCM installer drop and service creation commands
    query: (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:*HybridConnectionManager*) OR (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Ss][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Mm][Ss][Ii][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/) AND data_win_eventdata_commandLine:*HybridConnectionManager*)
    pivot_on:
    - host
    window: 2h
  - name: Commands spawned by the HCM listener
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:*HybridConnectionManager*
    pivot_on:
    - host
    window: 24h
