e][Xx][Ee]\\[Dd][Ee][Bb][Uu][Gg][Gg][Ee][Rr]/ OR data_win_eventdata_targetObject:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Nn][Tt]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Ii][Mm][Aa][Gg][Ee] [Ff][Ii][Ll][Ee] [Ee][Xx][Ee][Cc][Uu][Tt][Ii][Oo][Nn] [Oo][Pp][Tt][Ii][Oo][Nn][Ss]\\[Dd][Ii][Ss][Pp][Ll][Aa][Yy][Ss][Ww][Ii][Tt][Cc][Hh]\.[Ee][Xx][Ee]\\[Dd][Ee][Bb][Uu][Gg][Gg][Ee][Rr]/ OR data_win_eventdata_targetObject:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Nn][Tt]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Ii][Mm][Aa][Gg][Ee] [Ff][Ii][Ll][Ee] [Ee][Xx][Ee][Cc][Uu][Tt][Ii][Oo][Nn] [Oo][Pp][Tt][Ii][Oo][Nn][Ss]\\[Aa][Tt][Bb][Rr][Oo][Kk][Ee][Rr]\.[Ee][Xx][Ee]\\[Dd][Ee][Bb][Uu][Gg][Gg][Ee][Rr]/ OR data_win_eventdata_targetObject:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Nn][Tt]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Ii][Mm][Aa][Gg][Ee] [Ff][Ii][Ll][Ee] [Ee][Xx][Ee][Cc][Uu][Tt][Ii][Oo][Nn] [Oo][Pp][Tt][Ii][Oo][Nn][Ss]\\[Hh][Ee][Ll][Pp][Pp][Aa][Nn][Ee]\.[Ee][Xx][Ee]\\[Dd][Ee][Bb][Uu][Gg][Gg][Ee][Rr]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 1070db9a-3e5d-412e-8e7b-7183b616e1b3
    name: Persistence Via Sticky Key Backdoor
    reason: Same sticky-keys backdoor installed via process creation (reg/cmd setting the IFEO Debugger or replacing sethc); process-side view of the same registry write.
  - id: ae215552-081e-44c7-805f-be16f975c8a2
    name: Suspicious Debugger Registration Cmdline
    reason: Command line that registers an IFEO Debugger for accessibility binaries is the usual cause of this registry write.
  - id: 2fdefcb3-dbda-401e-ae23-f0db027628bc
    name: Sticky Key Like Backdoor Execution
    reason: 'Follow-on: attacker triggers the hijacked sethc/utilman/osk at the lock screen, spawning a SYSTEM shell from winlogon.'
  - id: e9b61244-893f-427c-b287-3e708f321c6b
    name: Potential Privilege Escalation Using Symlink Between Osk and Cmd
    reason: Alternative osk/cmd accessibility-binary hijack giving the same login-screen SYSTEM shell; co-occurs on hosts using this persistence family.
  - id: 092af964-4233-4373-b4ba-d86ea2890288
    name: Add Debugger Entry To AeDebug For Persistence
    reason: Same debugger-registration persistence technique via AeDebug; attackers often stack several debugger-hijack persistence keys.
  - id: bbf59793-6efb-4fa1-95ca-a7d288e52c88
    name: Winlogon Notify Key Logon Persistence
    reason: Winlogon-based logon persistence commonly planted alongside the login-screen backdoor to survive reboot.
  - id: c9b86500-1ec2-4de6-9120-d744c8fb5caf
    name: Potential KamiKakaBot Activity - Winlogon Shell Persistence
    reason: Winlogon Shell registry persistence, a sibling logon-time persistence mechanism an operator may add.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Shell spawned by winlogon/utilman/sethc (accessibility backdoor triggered)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\([Ss][Ee][Tt][Hh][Cc]|[Uu][Tt][Ii][Ll][Mm][Aa][Nn]|[Oo][Ss][Kk]|[Mm][Aa][Gg][Nn][Ii][Ff][Yy]|[Nn][Aa][Rr][Rr][Aa][Tt][Oo][Rr]|[Dd][Ii][Ss][Pp][Ll][Aa][Yy][Ss][Ww][Ii][Tt][Cc][Hh]|[Aa][Tt][Bb][Rr][Oo][Kk][Ee][Rr])\.[Ee][Xx][Ee]/) AND data_win_eventdata_image:/.*\\([Cc][Mm][Dd]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Mm][Ss][Hh][Tt][Aa])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 24h
  - name: Command line setting IFEO Debugger or replacing accessibility binaries
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ii][Mm][Aa][Gg][Ee] [Ff][Ii][Ll][Ee] [Ee][Xx][Ee][Cc][Uu][Tt][Ii][Oo][Nn] [Oo][Pp][Tt][Ii][Oo][Nn][Ss].*/ OR (data_win_eventdata_commandLine:/.*(takeown|icacls|copy|move|mklink).*/ AND data_win_eventdata_commandLine:/.*([Ss][Ee][Tt][Hh][Cc]|[Uu][Tt][Ii][Ll][Mm][Aa][Nn]|[Oo][Ss][Kk]|[Mm][Aa][Gg][Nn][Ii][Ff][Yy]|[Nn][Aa][Rr][Rr][Aa][Tt][Oo][Rr]).*/))
    pivot_on:
    - host
    window: 2h
  - name: Other debugger/Winlogon/AeDebug persistence registry writes
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:/.*[Aa][Ee][Dd][Ee][Bb][Uu][Gg]\\[Dd][Ee][Bb][Uu][Gg][Gg][Ee][Rr].*/ OR data_win_eventdata_targetObject:/.*[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]\\([Ss][Hh][Ee][Ll][Ll]|[Uu][Ss][Ee][Rr][Ii][Nn][Ii][Tt]|[Nn][Oo][Tt][Ii][Ff][Yy]).*/ OR data_win_eventdata_targetObject:/.*[Ss][Ee][Tt][Uu][Pp]\\[Cc][Mm][Dd][Ll][Ii][Nn][Ee]/ OR data_win_eventdata_targetObject:/.*[Dd][Bb][Gg][Mm][Aa][Nn][Aa][Gg][Ee][Dd][Dd][Ee][Bb][Uu][Gg][Gg][Ee][Rr]/)
    pivot_on:
    - host
    window: 4h
  - name: Account creation, RDP enablement or firewall changes after backdoor install
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Nn][Ee][Tt]1? +[Uu][Ss][Ee][Rr] .*\/[Aa][Dd][Dd].*/ OR data_win_eventdata_commandLine:/.*[Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp] +[Aa][Dd][Mm][Ii][Nn][Ii][Ss][Tt][Rr][Aa][Tt][Oo][Rr][Ss].*\/[Aa][Dd][Dd].*/ OR data_win_eventdata_commandLine:/.*[Ff][Dd][Ee][Nn][Yy][Tt][Ss][Cc][Oo][Nn][Nn][Ee][Cc][Tt][Ii][Oo][Nn][Ss].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt][Ss][Hh] .*[Aa][Dd][Vv][Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll].*/)
    pivot_on:
    - host
    window: 6h
  - name: Credential dumping or LSASS access from SYSTEM shell on this host
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ss][Aa][Mm]|[Ss][Yy][Ss][Tt][Ee][Mm]|[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]) +.*[Ss][Aa][Vv][Ee].*|.*[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz].*|.*[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp].*/)
    pivot_on:
    - host
    window: 6h
