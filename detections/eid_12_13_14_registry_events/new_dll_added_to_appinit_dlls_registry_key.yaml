name: New DLL Added to AppInit_DLLs Registry Key
id: 4f84b697-c9ed-4420-8ab5-e09af5b2345d
version: 1
schema_version: "1.0"
date: "2022-12-25"
author: Ilyas Ochkov, oscd.community, Tim Shelton
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 4f84b697-c9ed-4420-8ab5-e09af5b2345d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  DLLs that are specified in the AppInit_DLLs value in the Registry key
  HKLM\Software\Microsoft\Windows NT\CurrentVersion\Windows are loaded by
  user32.dll into every process that loads user32.dll. MITRE ATT&CK: T1546.010.

data_source:
  - Sysmon EventID 12/13/14 - Registry Events

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_win_system_eventID: "12"
              - term:
                  data_win_system_eventID: "13"
              - term:
                  data_win_system_eventID: "14"
            minimum_should_match: 1
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\SOFTWARE\\\\Microsoft\\\\Windows NT\\\\CurrentVersion\\\\Windows\\\\AppInit_Dlls"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\SOFTWARE\\\\Wow6432Node\\\\Microsoft\\\\Windows NT\\\\CurrentVersion\\\\Windows\\\\AppInit_Dlls"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_newName:
                    value: "*\\\\SOFTWARE\\\\Microsoft\\\\Windows NT\\\\CurrentVersion\\\\Windows\\\\AppInit_Dlls"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_newName:
                    value: "*\\\\SOFTWARE\\\\Wow6432Node\\\\Microsoft\\\\Windows NT\\\\CurrentVersion\\\\Windows\\\\AppInit_Dlls"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_details"
        - bool:
            must_not:
              - term:
                  data_win_eventdata_details:
                    value: "(Empty)"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_newName
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Windows\AppInit_Dlls';
  data_win_eventdata_targetObject matches
  '*\SOFTWARE\Wow6432Node\Microsoft\Windows
  NT\CurrentVersion\Windows\AppInit_Dlls'; data_win_eventdata_newName matches
  '*\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Windows\AppInit_Dlls', among
  other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://eqllib.readthedocs.io/en/latest/analytics/822dc4c5-b355-4df8-bd37-29c458997b8f.html
  - https://attack.mitre.org/techniques/T1546/010/

response:
  message: >
    New DLL Added to AppInit_DLLs Registry Key detected on host $agent_name$.
    Matched data_win_eventdata_targetObject: $data_win_eventdata_targetObject$.
    Matched data_win_eventdata_newName: $data_win_eventdata_newName$. MITRE
    ATT&CK: T1546.010
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_newName
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1546.010
  custom_tags:
    - added
    - appinit
    - registry
    - sysmon
    - privilege_escalation
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13" OR data_win_system_eventID:"14") AND (data_win_eventdata_targetObject:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Nn][Tt]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Aa][Pp][Pp][Ii][Nn][Ii][Tt]_[Dd][Ll][Ll][Ss]/ OR data_win_eventdata_targetObject:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Ww][Oo][Ww]6432[Nn][Oo][Dd][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Nn][Tt]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Aa][Pp][Pp][Ii][Nn][Ii][Tt]_[Dd][Ll][Ll][Ss]/ OR data_win_eventdata_newName:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Nn][Tt]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Aa][Pp][Pp][Ii][Nn][Ii][Tt]_[Dd][Ll][Ll][Ss]/ OR data_win_eventdata_newName:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Ww][Oo][Ww]6432[Nn][Oo][Dd][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Nn][Tt]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Aa][Pp][Pp][Ii][Nn][Ii][Tt]_[Dd][Ll][Ll][Ss]/) AND _exists_:data_win_eventdata_details AND NOT (data_win_eventdata_details:/\([Ee][Mm][Pp][Tt][Yy]\)/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 6aa1d992-5925-4e9f-a49b-845e51d1de01
    name: New DLL Added to AppCertDlls Registry Key
    reason: Sibling registry-based DLL injection persistence (AppCertDlls loads into every CreateProcess-calling process); attackers often plant both AppInit_DLLs and AppCertDlls for redundancy
  - id: 9c5037d1-c568-49b3-88c7-9846a5bdc2be
    name: Suspicious Run Key from Download
    reason: Attacker establishing persistence via Run key alongside AppInit_DLLs, with payload dropped from a download
  - id: eeb30123-9fbd-4ee8-aaa0-2e545bbed6dc
    name: Security Support Provider (SSP) Added to LSA Configuration
    reason: Another registry-configured DLL loaded into a privileged process (lsass); co-occurs when the operator is staging credential-theft DLLs
  - id: b3503044-60ce-4bf4-bbcb-e3db98788823
    name: DLL Load via LSASS
    reason: AppInit/LSA-style DLL registration that gets the malicious DLL loaded into lsass, a follow-on of registry DLL persistence
  - id: 1908fcc1-1b92-4272-8214-0fbaf2fa5163
    name: Malicious DLL File Dropped in the Teams or OneDrive Folder
    reason: 'Precursor: the DLL referenced by AppInit_DLLs must first be dropped to disk, commonly in user-writable app folders'
  - id: 13c02350-4177-4e45-ac17-cf7ca628ff5e
    name: Files With System DLL Name In Unsuspected Locations
    reason: 'Precursor: payload DLL masquerading under a system DLL name before being registered in AppInit_DLLs'
  - id: b6f91281-20aa-446a-b986-38a92813a18f
    name: DLL Search Order Hijackig Via Additional Space in Path
    reason: Related DLL-based execution/persistence technique frequently dropped by the same operator on the host
  - id: de587dce-915e-4218-aac4-835ca6af6f70
    name: Potential Persistence Attempt Via Run Keys Using Reg.EXE
    reason: Reg.exe is also the common way to write AppInit_DLLs; Run-key persistence set at the same time indicates layered persistence
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Writer process and DLL path set into AppInit_DLLs / LoadAppInit_DLLs
    query: (data_win_system_eventID:"13" OR data_win_system_eventID:"12" OR data_win_system_eventID:"14") AND (data_win_eventdata_targetObject:*AppInit_DLLs* OR data_win_eventdata_targetObject:*LoadAppInit_DLLs* OR data_win_eventdata_targetObject:*RequireSignedAppInit_DLLs*)
    pivot_on:
    - host
    window: 4h
  - name: Reg.exe or PowerShell modifying AppInit/AppCert DLL keys
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:*AppInit_DLLs* OR data_win_eventdata_commandLine:*LoadAppInit_DLLs* OR data_win_eventdata_commandLine:*AppCertDlls*)
    pivot_on:
    - host
    window: 2h
  - name: DLL file created in user-writable or temp paths (payload staging)
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Dd][Ll][Ll]/) AND (data_win_eventdata_targetFilename:*\Users\* OR data_win_eventdata_targetFilename:*\ProgramData\* OR data_win_eventdata_targetFilename:*\Temp\* OR data_win_eventdata_targetFilename:*\Windows\Tasks\* OR data_win_eventdata_targetFilename:*\Public\*)
    pivot_on:
    - host
    window: 4h
  - name: Unsigned or user-path DLL loaded into processes (AppInit injection effect)
    query: data_win_system_eventID:"7" AND (data_win_eventdata_imageLoaded:*\Users\* OR data_win_eventdata_imageLoaded:*\ProgramData\* OR data_win_eventdata_imageLoaded:*\Temp\*) AND data_win_eventdata_signed:"false"
    pivot_on:
    - host
    window: 2h
  - name: 'Other registry persistence: Run keys, Winlogon, IFEO, LSA packages, AppCertDlls'
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:*CurrentVersion\Run* OR data_win_eventdata_targetObject:*\Winlogon\* OR data_win_eventdata_targetObject:*Image File Execution Options* OR data_win_eventdata_targetObject:*AppCertDlls* OR data_win_eventdata_targetObject:*\Control\Lsa\Security Packages* OR data_win_eventdata_targetObject:*\Control\Lsa\Authentication Packages*)
    pivot_on:
    - host
    window: 4h
