name: Office Application Startup - Office Test
id: 3d27f6dd-1c74-4687-b4fa-ca849d128d1c
version: 1
schema_version: "1.0"
date: "2023-11-08"
author: omkar72
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 3d27f6dd-1c74-4687-b4fa-ca849d128d1c
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the addition of office test registry that allows a user to specify an
  arbitrary DLL that will be executed every time an Office application is
  started. MITRE ATT&CK: T1137.002.

data_source:
  - Sysmon EventID 12/13/14 - Registry Events

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_win_system_eventID: "12"
              - term:
                  data_win_system_eventID: "13"
              - term:
                  data_win_system_eventID: "14"
            minimum_should_match: 1
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\Software\\\\Microsoft\\\\Office test\\\\Special\\\\Perf*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_image
    - data_win_eventdata_details

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\Software\Microsoft\Office test\Special\Perf*'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://unit42.paloaltonetworks.com/unit42-technical-walkthrough-office-test-persistence-method-used-in-recent-sofacy-attacks/
  - https://attack.mitre.org/techniques/T1137/002/

response:
  message: >
    Office Application Startup - Office Test detected on host $agent_name$.
    Matched data_win_eventdata_targetObject: $data_win_eventdata_targetObject$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1137.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1137.002
  custom_tags:
    - office
    - application
    - startup
    - registry
    - sysmon
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13" OR data_win_system_eventID:"14") AND data_win_eventdata_targetObject:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Oo][Ff][Ff][Ii][Cc][Ee] [Tt][Ee][Ss][Tt]\\[Ss][Pp][Ee][Cc][Ii][Aa][Ll]\\[Pp][Ee][Rr][Ff].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 8e1cb247-6cf6-42fa-b440-3f27d57e9936
    name: Potential Persistence Via Microsoft Office Add-In
    reason: 'Sibling Office persistence (T1137): attackers often plant an add-in alongside the Office test Perf key so one survives removal of the other'
  - id: 0e20c89d-2264-44ae-8238-aeeaba609ece
    name: Potential Persistence Via Microsoft Office Startup Folder
    reason: Same Office-startup persistence family; a payload dropped in an Office startup folder is a redundant foothold to the Office test DLL
  - id: a10a2c40-2c4d-49f8-b557-1a946bc55d9d
    name: Uncommon File Created In Office Startup Folder
    reason: Redundant Office-launch persistence staged in the Office startup folder on the same host
  - id: 829a3bdf-34da-4051-9cf4-8ed221a8ae4f
    name: Microsoft Office DLL Sideload
    reason: Office loading an attacker DLL from an unexpected path is the execution stage of the Office test persistence once an Office app is launched
  - id: f7375e28-5c14-432f-b8d1-1db26c832df3
    name: Potential Arbitrary DLL Load Using Winword
    reason: Winword loading an arbitrary DLL is the same payload-execution outcome the Perf key produces at Office startup
  - id: 438025f9-5856-4663-83f7-52f878a70a50
    name: Suspicious Microsoft Office Child Process
    reason: 'Post-trigger behaviour: the implanted DLL or Office start launches shells or LOLBins as children of Office'
  - id: f59c3faf-50f3-464b-9f4c-1b67ab512d99
    name: Common Autorun Keys Modification
    reason: Attackers who write the Office test key typically also add Run-key persistence in the same registry session
  - id: a166f74e-bf44-409d-b9ba-ea4b2dd8b3cd
    name: Macro Enabled In A Potentially Suspicious Document
    reason: 'Common precursor: a macro document gained execution and then wrote the Office test registry persistence'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: DLL dropped to user-writable path (candidate Office test payload)
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\([Aa][Pp][Pp][Dd][Aa][Tt][Aa]|[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]|[Tt][Ee][Mm][Pp]|[Pp][Uu][Bb][Ll][Ii][Cc])\\.*\.[Dd][Ll][Ll]/
    pivot_on:
    - host
    window: 2h
  - name: Office process loading DLL from user-writable location
    query: data_win_system_eventID:"7" AND data_win_eventdata_image:/.*\\([Ww][Ii][Nn][Ww][Oo][Rr][Dd]|[Ee][Xx][Cc][Ee][Ll]|[Pp][Oo][Ww][Ee][Rr][Pp][Nn][Tt]|[Oo][Uu][Tt][Ll][Oo][Oo][Kk]|[Mm][Ss][Aa][Cc][Cc][Ee][Ss][Ss])\.[Ee][Xx][Ee]/ AND data_win_eventdata_imageLoaded:/.*\\([Aa][Pp][Pp][Dd][Aa][Tt][Aa]|[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]|[Tt][Ee][Mm][Pp]|[Pp][Uu][Bb][Ll][Ii][Cc])\\.*\.[Dd][Ll][Ll]/
    pivot_on:
    - host
    window: 6h
  - name: Shell or LOLBin spawned by an Office application
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\([Ww][Ii][Nn][Ww][Oo][Rr][Dd]|[Ee][Xx][Cc][Ee][Ll]|[Pp][Oo][Ww][Ee][Rr][Pp][Nn][Tt]|[Oo][Uu][Tt][Ll][Oo][Oo][Kk]|[Mm][Ss][Aa][Cc][Cc][Ee][Ss][Ss])\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Cc][Mm][Dd]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]|[Rr][Uu][Nn][Dd][Ll][Ll]32|[Rr][Ee][Gg][Ss][Vv][Rr]32|[Mm][Ss][Hh][Tt][Aa]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 6h
  - name: Office security controls weakened or other Office persistence keys set
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND data_win_eventdata_targetObject:/.*[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Oo][Ff][Ff][Ii][Cc][Ee]\\.*\\([Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]\\([Vv][Bb][Aa][Ww][Aa][Rr][Nn][Ii][Nn][Gg][Ss]|[Aa][Cc][Cc][Ee][Ss][Ss][Vv][Bb][Oo][Mm]|[Pp][Rr][Oo][Tt][Ee][Cc][Tt][Ee][Dd][Vv][Ii][Ee][Ww])|[Ww][Oo][Rr][Dd]\\[Aa][Dd][Dd]-[Ii][Nn][Ss]|[Ee][Xx][Cc][Ee][Ll]\\[Oo][Pp][Ee][Nn])/
    pivot_on:
    - host
    window: 24h
