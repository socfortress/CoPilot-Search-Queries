name: Potential Qakbot Registry Activity
id: 1c8e96cd-2bed-487d-9de0-b46c90cade56
version: 1
schema_version: "1.0"
date: "2023-03-13"
author: Hieu Tran
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 1c8e96cd-2bed-487d-9de0-b46c90cade56
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a registry key used by IceID in a campaign that distributes malicious
  OneNote files. MITRE ATT&CK: T1112.

data_source:
  - Sysmon EventID 12/13/14 - Registry Events

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_win_system_eventID: "12"
              - term:
                  data_win_system_eventID: "13"
              - term:
                  data_win_system_eventID: "14"
            minimum_should_match: 1
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\Software\\\\firm\\\\soft\\\\Name"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_image
    - data_win_eventdata_details

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\Software\firm\soft\Name'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.zscaler.com/blogs/security-research/onenote-growing-threat-malware-distribution
  - https://attack.mitre.org/techniques/T1112/

response:
  message: >
    Potential Qakbot Registry Activity detected on host $agent_name$. Matched
    data_win_eventdata_targetObject: $data_win_eventdata_targetObject$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1112
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
  custom_tags:
    - qakbot
    - registry
    - sysmon
    - persistence
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13" OR data_win_system_eventID:"14") AND data_win_eventdata_targetObject:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Ff][Ii][Rr][Mm]\\[Ss][Oo][Ff][Tt]\\[Nn][Aa][Mm][Ee]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: cf879ffb-793a-4753-9a14-bc8f37cc90df
    name: Potential Qakbot Rundll32 Execution
    reason: Qakbot/IcedID payload DLL is run through rundll32 right before or after it stores its config under Software\firm\soft\Name; same host confirms the loader stage.
  - id: 339ed3d6-5490-46d0-96a7-8abe33078f58
    name: Qakbot Rundll32 Exports Execution
    reason: Rundll32 calling known Qakbot export names is the DLL execution that writes this registry config key.
  - id: bfd34392-c591-4009-b938-9fd985a28b85
    name: Qakbot Rundll32 Fake DLL Extension Execution
    reason: Qakbot DLLs disguised with fake extensions (.dat/.jpg) loaded by rundll32 are the typical delivery of the implant that creates this key.
  - id: 0033cf83-fb87-446d-9cac-43d63ad4d5a9
    name: Qakbot Regsvr32 Calc Pattern
    reason: Alternative Qakbot DLL launch via regsvr32 on the same host precedes registry config persistence.
  - id: 4fcac6eb-0287-4090-8eea-2602e4c20040
    name: Potential QBot Activity
    reason: Generic QBot process-creation indicators on the same host corroborate the registry artifact.
  - id: 2bd8e100-5b3b-4b6a-bbb5-b129d3ddddc5
    name: IcedID Malware Suspicious Single Digit DLL Execution Via Rundll32
    reason: The registry key is tied to the IcedID OneNote campaign; IcedID drops a single-digit-named DLL executed by rundll32 in the same chain.
  - id: 86588b36-c6d3-465f-9cee-8f9093e07798
    name: Scheduled Task Executing Payload from Registry
    reason: Qakbot/IcedID store payload or config in registry and persist via scheduled tasks that read it back; follow-on persistence.
  - id: c4eeeeae-89f4-43a7-8b48-8d1bdfa66c78
    name: Scheduled Task Executing Encoded Payload from Registry
    reason: Follow-on persistence stage where an encoded payload kept in the registry is launched by a scheduled task.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: OneNote/Office spawning script or LOLBin children (OneNote lure execution)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Oo][Nn][Ee][Nn][Oo][Tt][Ee].*\.[Ee][Xx][Ee]/ AND (data_win_eventdata_image:/.*\\(cmd|wscript|cscript|mshta|powershell|rundll32|regsvr32|curl)\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: Rundll32/regsvr32 loading DLLs from user-writable or fake-extension paths
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*([Aa][Pp][Pp][Dd][Aa][Tt][Aa]|[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]|\\[Tt][Ee][Mm][Pp]\\|[Pp][Uu][Bb][Ll][Ii][Cc]\\|[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]).*/ OR data_win_eventdata_commandLine:/.*\.(dat|jpg|png|tmp|txt|gif|ocx|log)[ ,",].*/)
    pivot_on:
    - host
    window: 2h
  - name: Rundll32/regsvr32 outbound network connections (C2 beaconing)
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ee][Rr][Ff][Aa][Uu][Ll][Tt]\.[Ee][Xx][Ee]/) AND data_win_eventdata_initiated:"true"
    pivot_on:
    - host
    window: 4h
  - name: Scheduled task creation or registry-stored payload persistence
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*\/[Cc][Rr][Ee][Aa][Tt][Ee].*/) OR ((data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/)
    pivot_on:
    - host
    window: 4h
  - name: Discovery and credential-theft tooling after Qakbot/IcedID foothold
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*([Nn][Ee][Tt] [Gg][Rr][Oo][Uu][Pp]|[Nn][Ll][Tt][Ee][Ss][Tt]|[Ww][Hh][Oo][Aa][Mm][Ii] \/[Aa][Ll][Ll]|[Aa][Rr][Pp] -[Aa]|[Nn][Ee][Tt][Ss][Tt][Aa][Tt]|[Dd][Oo][Mm][Aa][Ii][Nn]_[Tt][Rr][Uu][Ss][Tt][Ss]|[Ss][Ee][Tt] [Dd][Oo][Mm][Aa][Ii][Nn]).*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss].*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/)
    pivot_on:
    - host
    window: 6h
