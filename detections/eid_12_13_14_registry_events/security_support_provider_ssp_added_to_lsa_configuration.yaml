name: Security Support Provider (SSP) Added to LSA Configuration
id: eeb30123-9fbd-4ee8-aaa0-2e545bbed6dc
version: 1
schema_version: "1.0"
date: "2026-03-30"
author: iwillkeepwatch
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: eeb30123-9fbd-4ee8-aaa0-2e545bbed6dc
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the addition of a SSP to the registry. Upon a reboot or API call, SSP
  DLLs gain access to encrypted and plaintext passwords stored in Windows. MITRE
  ATT&CK: T1547.005.

data_source:
  - Sysmon EventID 12/13/14 - Registry Events

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_win_system_eventID: "12"
              - term:
                  data_win_system_eventID: "13"
              - term:
                  data_win_system_eventID: "14"
            minimum_should_match: 1
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\Control\\\\Lsa\\\\Security Packages"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\Control\\\\Lsa\\\\OSConfig\\\\Security Packages"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            must_not:
              - bool:
                  should:
                    - term:
                        data_win_eventdata_image:
                          value: "C:\\Windows\\system32\\msiexec.exe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_image:
                          value: "C:\\Windows\\syswow64\\MsiExec.exe"
                          case_insensitive: true
                    - bool:
                        must_not:
                          - exists:
                              field: "data_win_eventdata_image"
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_image
    - data_win_eventdata_details

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\Control\Lsa\Security Packages'; data_win_eventdata_targetObject matches
  '*\Control\Lsa\OSConfig\Security Packages'; data_win_eventdata_image equals
  'C:\Windows\system32\msiexec.exe', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://powersploit.readthedocs.io/en/latest/Persistence/Install-SSP/
  - https://github.com/EmpireProject/Empire/blob/08cbd274bef78243d7a8ed6443b8364acd1fc48b/data/module_source/persistence/Install-SSP.ps1#L157
  - https://attack.mitre.org/techniques/T1547/005/

response:
  message: >
    Security Support Provider (SSP) Added to LSA Configuration detected on host
    $agent_name$. Matched data_win_eventdata_targetObject:
    $data_win_eventdata_targetObject$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1547.005
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1547.005
  custom_tags:
    - security
    - support
    - provider
    - registry
    - sysmon
    - privilege_escalation
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13" OR data_win_system_eventID:"14") AND (data_win_eventdata_targetObject:/.*\\[Cc][Oo][Nn][Tt][Rr][Oo][Ll]\\[Ll][Ss][Aa]\\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy] [Pp][Aa][Cc][Kk][Aa][Gg][Ee][Ss]/ OR data_win_eventdata_targetObject:/.*\\[Cc][Oo][Nn][Tt][Rr][Oo][Ll]\\[Ll][Ss][Aa]\\[Oo][Ss][Cc][Oo][Nn][Ff][Ii][Gg]\\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy] [Pp][Aa][Cc][Kk][Aa][Gg][Ee][Ss]/) AND NOT (data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Mm][Ss][Ii][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Ww][Oo][Ww]64\\[Mm][Ss][Ii][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]/ OR NOT _exists_:data_win_eventdata_image)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 857c8db3-c89b-42fb-882b-f681c7cf4da2
    name: Unsigned Image Loaded Into LSASS Process
    reason: 'Payoff of this registry change: after reboot or AddSecurityPackage the registered SSP DLL is loaded into lsass.exe; an unsigned load confirms the SSP is live.'
  - id: b3503044-60ce-4bf4-bbcb-e3db98788823
    name: DLL Load via LSASS
    reason: 'Companion persistence path: LSA-loaded DLLs registered via registry (Authentication/Notification packages, Security Packages) execute inside LSASS to harvest credentials.'
  - id: b7966f4a-b333-455b-8370-8ca53c229762
    name: Dropping Of Password Filter DLL
    reason: 'Sibling LSA credential-capture implant: attackers who register an SSP often also stage a password filter DLL and its Notification Packages key for the same plaintext-harvest purpose.'
  - id: 0442defa-b4a2-41c9-ae2c-ea7042fc4701
    name: Potential Credential Dumping Attempt Using New NetworkProvider - REG
    reason: Parallel registry-based credential-sniffing provider (NetworkProvider order key) used with the same intent as a rogue SSP, often by the same tooling.
  - id: baef1ec6-2ca9-47a3-97cc-4cf2bda10b77
    name: Potential Credential Dumping Attempt Using New NetworkProvider - CLI
    reason: Command-line variant of the rogue credential provider registration, commonly run alongside or instead of SSP install when hardening blocks one route.
  - id: 8c0eca51-0f88-4db2-9183-fdfb10c703f9
    name: LSA PPL Protection Setting Modification via CommandLine
    reason: 'Precursor: LSA RunAsPPL must be disabled before an unsigned SSP DLL can load into lsass, so tampering with it shortly before this alert is causal.'
  - id: 5ef9853e-4d0e-4a70-846f-a9ca37d876da
    name: Potential Credential Dumping Activity Via LSASS
    reason: 'Fallback/parallel credential theft: if SSP is not yet loaded the actor reads LSASS memory directly on the same host.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: LSA registry configuration tampering (Notification/Authentication Packages, RunAsPPL, WDigest)
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:/.*[Cc][Oo][Nn][Tt][Rr][Oo][Ll]\\[Ll][Ss][Aa]\\([Nn][Oo][Tt][Ii][Ff][Ii][Cc][Aa][Tt][Ii][Oo][Nn] [Pp][Aa][Cc][Kk][Aa][Gg][Ee][Ss]|[Aa][Uu][Tt][Hh][Ee][Nn][Tt][Ii][Cc][Aa][Tt][Ii][Oo][Nn] [Pp][Aa][Cc][Kk][Aa][Gg][Ee][Ss]|[Rr][Uu][Nn][Aa][Ss][Pp][Pp][Ll]).*/ OR data_win_eventdata_targetObject:/.*[Ww][Dd][Ii][Gg][Ee][Ss][Tt]\\[Uu][Ss][Ee][Ll][Oo][Gg][Oo][Nn][Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll].*/ OR data_win_eventdata_targetObject:/.*[Nn][Ee][Tt][Ww][Oo][Rr][Kk][Pp][Rr][Oo][Vv][Ii][Dd][Ee][Rr]\\[Oo][Rr][Dd][Ee][Rr].*/)
    pivot_on:
    - host
    window: 2h
  - name: Unsigned or unusual DLL loaded into lsass.exe
    query: data_win_system_eventID:"7" AND data_win_eventdata_image:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ AND NOT data_win_eventdata_signed:"true"
    pivot_on:
    - host
    window: 6h
  - name: DLL written into System32 or a staging path (candidate SSP/password filter binary)
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.[Dd][Ll][Ll]/ AND (data_win_eventdata_targetFilename:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/)
    pivot_on:
    - host
    window: 2h
  - name: Tooling used to install an SSP (mimilib, Install-SSP, AddSecurityPackage)
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:*mimilib* OR data_win_eventdata_commandLine:*Install\-SSP* OR data_win_eventdata_commandLine:*AddSecurityPackage* OR data_win_eventdata_commandLine:*Security\ Packages*)) OR (data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*Install\-SSP* OR data_win_eventdata_scriptBlockText:*AddSecurityPackage* OR data_win_eventdata_scriptBlockText:*mimilib*))
    pivot_on:
    - host
    window: 2h
  - name: 'Credential harvest artifacts: kiwissp.log / mimilsa.log or LSASS access'
    query: (data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:*kiwissp* OR data_win_eventdata_targetFilename:*mimilsa.log* OR data_win_eventdata_targetFilename:*mimilib.dll*)) OR (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 6h
