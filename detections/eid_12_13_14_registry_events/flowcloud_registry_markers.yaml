name: FlowCloud Registry Markers
id: 5118765f-6657-4ddb-a487-d7bd673abbf1
version: 1
schema_version: "1.0"
date: "2024-03-20"
author: NVISO
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 5118765f-6657-4ddb-a487-d7bd673abbf1
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects FlowCloud malware registry markers from threat group TA410. The
  malware stores its configuration in the registry alongside drivers utilized by
  the malware's keylogger components. MITRE ATT&CK: T1112.

data_source:
  - Sysmon EventID 12/13/14 - Registry Events

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_win_system_eventID: "12"
              - term:
                  data_win_system_eventID: "13"
              - term:
                  data_win_system_eventID: "14"
            minimum_should_match: 1
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\HARDWARE\\\\{2DB80286-1784-48b5-A751-B6ED1F490303}*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\HARDWARE\\\\{804423C2-F490-4ac3-BFA5-13DEDE63A71A}*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\HARDWARE\\\\{A5124AF5-DF23-49bf-B0ED-A18ED3DEA027}*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\SYSTEM\\\\Setup\\\\PrintResponsor\\\\*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_image
    - data_win_eventdata_details

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\HARDWARE\{2DB80286-1784-48b5-A751-B6ED1F490303}*';
  data_win_eventdata_targetObject matches
  '*\HARDWARE\{804423C2-F490-4ac3-BFA5-13DEDE63A71A}*';
  data_win_eventdata_targetObject matches
  '*\HARDWARE\{A5124AF5-DF23-49bf-B0ED-A18ED3DEA027}*', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.proofpoint.com/us/blog/threat-insight/ta410-group-behind-lookback-attacks-against-us-utilities-sector-returns-new
  - https://attack.mitre.org/techniques/T1112/

response:
  message: >
    FlowCloud Registry Markers detected on host $agent_name$. Matched
    data_win_eventdata_targetObject: $data_win_eventdata_targetObject$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1112
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
  custom_tags:
    - flowcloud
    - registry
    - markers
    - sysmon
    - persistence
    - defense_impairment
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13" OR data_win_system_eventID:"14") AND (data_win_eventdata_targetObject:/.*\\[Hh][Aa][Rr][Dd][Ww][Aa][Rr][Ee]\\\{2[Dd][Bb]80286-1784-48[Bb]5-[Aa]751-[Bb]6[Ee][Dd]1[Ff]490303\}.*/ OR data_win_eventdata_targetObject:/.*\\[Hh][Aa][Rr][Dd][Ww][Aa][Rr][Ee]\\\{804423[Cc]2-[Ff]490-4[Aa][Cc]3-[Bb][Ff][Aa]5-13[Dd][Ee][Dd][Ee]63[Aa]71[Aa]\}.*/ OR data_win_eventdata_targetObject:/.*\\[Hh][Aa][Rr][Dd][Ww][Aa][Rr][Ee]\\\{[Aa]5124[Aa][Ff]5-[Dd][Ff]23-49[Bb][Ff]-[Bb]0[Ee][Dd]-[Aa]18[Ee][Dd]3[Dd][Ee][Aa]027\}.*/ OR data_win_eventdata_targetObject:/.*\\[Ss][Yy][Ss][Tt][Ee][Mm]\\[Ss][Ee][Tt][Uu][Pp]\\[Pp][Rr][Ii][Nn][Tt][Rr][Ee][Ss][Pp][Oo][Nn][Ss][Oo][Rr]\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 2c4523d5-d481-4ed0-8ec3-7fbf0cb41a75
    name: Driver Load From A Temporary Directory
    reason: FlowCloud stores keylogger driver config in these registry keys; the driver itself is loaded from a non-standard path, so a driver-load from Temp on the same host confirms the keylogger component is active
  - id: 431a1fdb-4799-4f3b-91c3-a683b003fc49
    name: New Kernel Driver Via SC.EXE
    reason: FlowCloud installs a kernel-mode keylogger driver; sc.exe creating a kernel driver service is the likely installation step preceding or following the registry config markers
  - id: 17a1be64-8d88-40bf-b5ff-a4f7a50ebcc8
    name: Suspicious New Service Creation
    reason: FlowCloud persists via a service (and driver service) pointing at its loader; a new suspicious service is the persistence step tied to the registry configuration being written
  - id: f674e36a-4b91-431e-8aef-f8a96c2aca35
    name: CurrentControlSet Autorun Keys Modification
    reason: Persistence writes under CurrentControlSet (Services) typically accompany the HARDWARE/PrintResponsor config keys when the implant installs itself
  - id: f59c3faf-50f3-464b-9f4c-1b67ab512d99
    name: Common Autorun Keys Modification
    reason: Run-key persistence written by the same implant process shortly before or after storing its configuration in the registry
  - id: 799a5f48-0ac1-4e0f-9152-71d137d48c2a
    name: Abusable DLL Potential Sideloading From Suspicious Location
    reason: TA410 deploys FlowCloud via DLL sideloading of a legitimate signed binary; an image load of an abusable DLL from a user-writable location is the loader stage that writes these markers
  - id: 9e9a9002-56c4-40fd-9eff-e4b09bfa5f6c
    name: DLL Load By System Process From Suspicious Locations
    reason: FlowCloud loaders run inside system/service processes; a system process loading a DLL from a suspicious path ties the registry writer to its malicious module
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: All registry writes under the FlowCloud HARDWARE GUID keys and PrintResponsor
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13" OR data_win_system_eventID:"14") AND (data_win_eventdata_targetObject:/.*\{(2[Dd][Bb]80286-1784-48[Bb]5-[Aa]751-[Bb]6[Ee][Dd]1[Ff]490303|804423[Cc]2-[Ff]490-4[Aa][Cc]3-[Bb][Ff][Aa]5-13[Dd][Ee][Dd][Ee]63[Aa]71[Aa]|[Aa]5124[Aa][Ff]5-[Dd][Ff]23-49[Bb][Ff]-[Bb]0[Ee][Dd]-[Aa]18[Ee][Dd]3[Dd][Ee][Aa]027)\}.*/ OR data_win_eventdata_targetObject:/.*[Pp][Rr][Ii][Nn][Tt][Rr][Ee][Ss][Pp][Oo][Nn][Ss][Oo][Rr].*/)
    pivot_on:
    - host
    window: 24h
  - name: Driver service and kernel driver registration (keylogger driver install)
    query: (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt]\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\.*\\([Ii][Mm][Aa][Gg][Ee][Pp][Aa][Tt][Hh]|[Tt][Yy][Pp][Ee])/ AND data_win_eventdata_details:("0x00000001" OR *.sys* OR *\\Temp\\* OR *\\ProgramData\\* OR *\\Users\\*)) OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Ss][Cc](\.[Ee][Xx][Ee])? +[Cc][Rr][Ee][Aa][Tt][Ee].*([Tt][Yy][Pp][Ee]= *([Kk][Ee][Rr][Nn][Ee][Ll]|[Ff][Ii][Ll][Ee][Ss][Yy][Ss])).*/)
    pivot_on:
    - host
    window: 4h
  - name: Driver or DLL image loaded from user-writable path
    query: (data_win_system_eventID:"6" OR data_win_system_eventID:"7") AND data_win_eventdata_imageLoaded:/.*\\([Pp]rogram[Dd]ata|[Tt]emp|[Uu]sers\\[^\\]+\\[Aa]pp[Dd]ata|[Uu]sers\\[Pp]ublic|[Ww]indows\\[Tt]asks)\\.*\.([Ss][Yy][Ss]|[Dd][Ll][Ll])/
    pivot_on:
    - host
    window: 4h
  - name: Executable or DLL dropped in user-writable staging path
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\([Pp]rogram[Dd]ata|[Tt]emp|[Uu]sers\\[Pp]ublic|[Aa]pp[Dd]ata\\[Rr]oaming|[Aa]pp[Dd]ata\\[Ll]ocal)\\.*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Ss][Yy][Ss]|[Dd][Aa][Tt])/
    pivot_on:
    - host
    window: 4h
  - name: Outbound connections or DNS from the registry-writing process path
    query: (data_win_system_eventID:"3" AND data_win_eventdata_initiated:"true" AND data_win_eventdata_image:/.*\\([Pp]rogram[Dd]ata|[Tt]emp|[Uu]sers\\[Pp]ublic|[Aa]pp[Dd]ata)\\.*/) OR (data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Ss]vchost|[Rr]undll32|[Ss]poolsv)\.[Ee][Xx][Ee]/ AND NOT data_win_eventdata_destinationIp:(10.* OR 192.168.* OR 127.*))
    pivot_on:
    - host
    window: 6h
