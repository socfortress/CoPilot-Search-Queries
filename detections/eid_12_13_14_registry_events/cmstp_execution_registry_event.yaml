name: CMSTP Execution Registry Event
id: b6d235fc-1d38-4b12-adbe-325f06728f37
version: 1
schema_version: "1.0"
date: "2020-12-23"
author: Nik Seetharaman
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: b6d235fc-1d38-4b12-adbe-325f06728f37
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: production
type: TTP

description: >
  Detects various indicators of Microsoft Connection Manager Profile Installer
  execution. MITRE ATT&CK: T1218.003.

data_source:
  - Sysmon EventID 12/13/14 - Registry Events

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_win_system_eventID: "12"
              - term:
                  data_win_system_eventID: "13"
              - term:
                  data_win_system_eventID: "14"
            minimum_should_match: 1
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\cmmgr32.exe*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_image
    - data_win_eventdata_details

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\cmmgr32.exe*'.

known_false_positives: >
  Legitimate CMSTP use (unlikely in modern enterprise environments). Baseline
  expected activity in your environment and tune this detection before relying
  on it for automated response.

references:
  - https://web.archive.org/web/20190720093911/http://www.endurant.io/cmstp/detecting-cmstp-enabled-code-execution-and-uac-bypass-with-sysmon/
  - https://attack.mitre.org/techniques/T1218/003/

response:
  message: >
    CMSTP Execution Registry Event detected on host $agent_name$. Matched
    data_win_eventdata_targetObject: $data_win_eventdata_targetObject$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1218.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218.003
  custom_tags:
    - cmstp
    - registry
    - sysmon
    - execution
    - stealth
    - g0069
    - car_2019_04_001
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13" OR data_win_system_eventID:"14") AND data_win_eventdata_targetObject:/.*\\[Cc][Mm][Mm][Gg][Rr]32\.[Ee][Xx][Ee].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7d4cdc5a-0076-40ca-aac8-f7e714570e47
    name: CMSTP Execution Process Creation
    reason: The cmstp.exe process launch that writes the cmmgr32.exe registry keys; direct same-event-chain confirmation of the execution.
  - id: e66779cc-383e-4224-a3a4-267eeb585c40
    name: Bypass UAC via CMSTP
    reason: cmstp.exe /au or /s with a malicious INF is the UAC-bypass form of the same execution that touches cmmgr32 registry state.
  - id: 4b60e6f2-bf39-47b4-b4ea-398e33cfe253
    name: CMSTP UAC Bypass via COM Object Access
    reason: The elevated dllhost/COM autoelevation (CMSTPLUA/CMLUAUTIL) stage that follows cmstp INF processing, giving high-integrity code execution.
  - id: 75e508f7-932d-4ebc-af77-269237a84ce1
    name: DLL Loaded From Suspicious Location Via Cmspt.EXE
    reason: CMSTP INF can register a payload DLL/scriptlet; cmstp loading a DLL from a user-writable path shows the payload actually executing.
  - id: 3b4b232a-af90-427c-a22f-30b0c0837b95
    name: CMSTP Execution Process Access
    reason: cmstp.exe accessing another process (UAC bypass/injection tradecraft) is the Sysmon EID 10 footprint of the same technique.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: cmstp.exe launched with INF install switches
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Cc][Mm][Ss][Tt][Pp]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*\.[Ii][Nn][Ff].*/ OR data_win_eventdata_commandLine:*\/au* OR data_win_eventdata_commandLine:*\/ni* OR data_win_eventdata_commandLine:*\/s*)
    pivot_on:
    - host
    window: 1h
  - name: INF or scriptlet payload files dropped to user-writable paths
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\.[Ii][Nn][Ff]/ OR data_win_eventdata_targetFilename:/.*\.[Ss][Cc][Tt]/ OR data_win_eventdata_targetFilename:/.*\.[Dd][Ll][Ll]/) AND (data_win_eventdata_targetFilename:*\\Temp\\* OR data_win_eventdata_targetFilename:*\\AppData\\* OR data_win_eventdata_targetFilename:*\\Users\\Public\\* OR data_win_eventdata_targetFilename:*\\ProgramData\\*)
    pivot_on:
    - host
    window: 1h
  - name: cmstp.exe or dllhost outbound connection to fetch a remote scriptlet
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*\\[Cc][Mm][Ss][Tt][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Dd][Ll][Ll][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
  - name: Shell or script interpreter spawned from cmstp.exe or its elevated COM host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Cc][Mm][Ss][Tt][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Dd][Ll][Ll][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
