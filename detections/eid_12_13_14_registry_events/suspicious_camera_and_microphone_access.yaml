name: Suspicious Camera and Microphone Access
id: 62120148-6b7a-42be-8b91-271c04e281a3
version: 1
schema_version: "1.0"
date: "2022-10-09"
author: Den Iuzvyk
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 62120148-6b7a-42be-8b91-271c04e281a3
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects Processes accessing the camera and microphone from suspicious folder.
  MITRE ATT&CK: T1125, T1123.

data_source:
  - Sysmon EventID 12/13/14 - Registry Events

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_win_system_eventID: "12"
              - term:
                  data_win_system_eventID: "13"
              - term:
                  data_win_system_eventID: "14"
            minimum_should_match: 1
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\Software\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\CapabilityAccessManager\\\\ConsentStore\\\\*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\NonPackaged*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*microphone*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*webcam*"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*:#Windows#Temp#*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*:#$Recycle.bin#*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*:#Temp#*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*:#Users#Public#*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*:#Users#Default#*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*:#Users#Desktop#*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_image
    - data_win_eventdata_details

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\Software\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\*';
  data_win_eventdata_targetObject matches '*\NonPackaged*';
  data_win_eventdata_targetObject matches '*microphone*', among other
  conditions.

known_false_positives: >
  Unlikely, there could be conferencing software running from a Temp folder
  accessing the devices. Baseline expected activity in your environment and tune
  this detection before relying on it for automated response.

references:
  - https://medium.com/@7a616368/can-you-track-processes-accessing-the-camera-and-microphone-7e6885b37072
  - https://attack.mitre.org/techniques/T1125/
  - https://attack.mitre.org/techniques/T1123/

response:
  message: >
    Suspicious Camera and Microphone Access detected on host $agent_name$.
    Matched data_win_eventdata_targetObject: $data_win_eventdata_targetObject$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1125, T1123
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1125
    - T1123
  custom_tags:
    - camera
    - microphone
    - registry
    - sysmon
    - collection
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13" OR data_win_system_eventID:"14") AND data_win_eventdata_targetObject:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Cc][Aa][Pp][Aa][Bb][Ii][Ll][Ii][Tt][Yy][Aa][Cc][Cc][Ee][Ss][Ss][Mm][Aa][Nn][Aa][Gg][Ee][Rr]\\[Cc][Oo][Nn][Ss][Ee][Nn][Tt][Ss][Tt][Oo][Rr][Ee]\\.*/ AND data_win_eventdata_targetObject:/.*\\[Nn][Oo][Nn][Pp][Aa][Cc][Kk][Aa][Gg][Ee][Dd].*/ AND (data_win_eventdata_targetObject:/.*[Mm][Ii][Cc][Rr][Oo][Pp][Hh][Oo][Nn][Ee].*/ OR data_win_eventdata_targetObject:/.*[Ww][Ee][Bb][Cc][Aa][Mm].*/) AND (data_win_eventdata_targetObject:/.*:\#[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\#[Tt][Ee][Mm][Pp]\#.*/ OR data_win_eventdata_targetObject:/.*:\#\$[Rr][Ee][Cc][Yy][Cc][Ll][Ee]\.[Bb][Ii][Nn]\#.*/ OR data_win_eventdata_targetObject:/.*:\#[Tt][Ee][Mm][Pp]\#.*/ OR data_win_eventdata_targetObject:/.*:\#[Uu][Ss][Ee][Rr][Ss]\#[Pp][Uu][Bb][Ll][Ii][Cc]\#.*/ OR data_win_eventdata_targetObject:/.*:\#[Uu][Ss][Ee][Rr][Ss]\#[Dd][Ee][Ff][Aa][Uu][Ll][Tt]\#.*/ OR data_win_eventdata_targetObject:/.*:\#[Uu][Ss][Ee][Rr][Ss]\#[Dd][Ee][Ss][Kk][Tt][Oo][Pp]\#.*/)

