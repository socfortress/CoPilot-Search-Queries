name: Suspicious Camera and Microphone Access
id: 62120148-6b7a-42be-8b91-271c04e281a3
version: 1
schema_version: "1.0"
date: "2022-10-09"
author: Den Iuzvyk
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 62120148-6b7a-42be-8b91-271c04e281a3
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects Processes accessing the camera and microphone from suspicious folder.
  MITRE ATT&CK: T1125, T1123.

data_source:
  - Sysmon EventID 12/13/14 - Registry Events

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_win_system_eventID: "12"
              - term:
                  data_win_system_eventID: "13"
              - term:
                  data_win_system_eventID: "14"
            minimum_should_match: 1
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\Software\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\CapabilityAccessManager\\\\ConsentStore\\\\*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\NonPackaged*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*microphone*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*webcam*"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*:#Windows#Temp#*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*:#$Recycle.bin#*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*:#Temp#*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*:#Users#Public#*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*:#Users#Default#*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*:#Users#Desktop#*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_image
    - data_win_eventdata_details

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\Software\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\*';
  data_win_eventdata_targetObject matches '*\NonPackaged*';
  data_win_eventdata_targetObject matches '*microphone*', among other
  conditions.

known_false_positives: >
  Unlikely, there could be conferencing software running from a Temp folder
  accessing the devices. Baseline expected activity in your environment and tune
  this detection before relying on it for automated response.

references:
  - https://medium.com/@7a616368/can-you-track-processes-accessing-the-camera-and-microphone-7e6885b37072
  - https://attack.mitre.org/techniques/T1125/
  - https://attack.mitre.org/techniques/T1123/

response:
  message: >
    Suspicious Camera and Microphone Access detected on host $agent_name$.
    Matched data_win_eventdata_targetObject: $data_win_eventdata_targetObject$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1125, T1123
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1125
    - T1123
  custom_tags:
    - camera
    - microphone
    - registry
    - sysmon
    - collection
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13" OR data_win_system_eventID:"14") AND data_win_eventdata_targetObject:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Cc][Aa][Pp][Aa][Bb][Ii][Ll][Ii][Tt][Yy][Aa][Cc][Cc][Ee][Ss][Ss][Mm][Aa][Nn][Aa][Gg][Ee][Rr]\\[Cc][Oo][Nn][Ss][Ee][Nn][Tt][Ss][Tt][Oo][Rr][Ee]\\.*/ AND data_win_eventdata_targetObject:/.*\\[Nn][Oo][Nn][Pp][Aa][Cc][Kk][Aa][Gg][Ee][Dd].*/ AND (data_win_eventdata_targetObject:/.*[Mm][Ii][Cc][Rr][Oo][Pp][Hh][Oo][Nn][Ee].*/ OR data_win_eventdata_targetObject:/.*[Ww][Ee][Bb][Cc][Aa][Mm].*/) AND (data_win_eventdata_targetObject:/.*:\#[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\#[Tt][Ee][Mm][Pp]\#.*/ OR data_win_eventdata_targetObject:/.*:\#\$[Rr][Ee][Cc][Yy][Cc][Ll][Ee]\.[Bb][Ii][Nn]\#.*/ OR data_win_eventdata_targetObject:/.*:\#[Tt][Ee][Mm][Pp]\#.*/ OR data_win_eventdata_targetObject:/.*:\#[Uu][Ss][Ee][Rr][Ss]\#[Pp][Uu][Bb][Ll][Ii][Cc]\#.*/ OR data_win_eventdata_targetObject:/.*:\#[Uu][Ss][Ee][Rr][Ss]\#[Dd][Ee][Ff][Aa][Uu][Ll][Tt]\#.*/ OR data_win_eventdata_targetObject:/.*:\#[Uu][Ss][Ee][Rr][Ss]\#[Dd][Ee][Ss][Kk][Tt][Oo][Pp]\#.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 8cd538a4-62d5-4e83-810b-12d41e428d6e
    name: Processes Accessing the Microphone and Webcam
    reason: Same CapabilityAccessManager consent-store behaviour seen from Security-log telemetry; confirms which process actually opened the device.
  - id: 932fb0d8-692b-4b0f-a26e-5643a50fe7d6
    name: Audio Capture via PowerShell
    reason: Scripted microphone recording is a sibling audio-surveillance technique used by the same implant/operator.
  - id: 83865853-59aa-449e-9600-74b9d89a6d6e
    name: Audio Capture via SoundRecorder
    reason: Built-in microphone recording that co-occurs with covert mic access from a temp-path process.
  - id: 2158f96f-43c2-43cb-952a-ab4580f32382
    name: Screen Capture Activity Via Psr.EXE
    reason: Spyware/RAT surveillance pairs device capture with screen capture; psr.exe is a common built-in screenshot method.
  - id: d4a11f63-2390-411c-9adf-d791fd152830
    name: Windows Screen Capture with CopyFromScreen
    reason: Scripted screenshotting alongside camera/mic access indicates a full surveillance implant collecting visual data.
  - id: 965e2db9-eddb-4cf6-a986-7a967df651e4
    name: Potential Keylogger Activity
    reason: Keylogging is the typical companion collection capability of RATs that also enable webcam/mic.
  - id: 2f3039c8-e8fe-43a9-b5cf-dcd424a2522d
    name: File Creation Related To RAT Clients
    reason: A Temp/Public process touching the camera is often a freshly dropped RAT client; its dropped artifacts precede the device access.
  - id: 4d07b1f4-cb00-4470-b9f8-b0191d48ff52
    name: DNS Query To Remote Access Software Domain From Non-Browser App
    reason: Surveillance capture implies a remote-control channel; non-browser DNS to remote-access domains reveals the C2 path.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Process execution from the same suspicious staging folders
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\[Ww]indows\[Tt]emp\|\[Uu]sers\[Pp]ublic\|\[Aa]pp[Dd]ata\[Ll]ocal\[Tt]emp\|\\$[Rr]ecycle\.[Bb]in\).*/
    pivot_on:
    - host
    window: 2h
  - name: Executables dropped into Temp/Public/Recycle Bin before device access
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(\[Tt]emp\|\[Uu]sers\[Pp]ublic\|\\$[Rr]ecycle\.[Bb]in\).*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Ss][Cc][Rr])/
    pivot_on:
    - host
    window: 4h
  - name: Media capture and screen-grab tooling or scripts
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*(\[Ss]ound[Rr]ecorder|\[Pp]sr|\[Ff][Ff]mpeg|\[Dd][Xx][Cc]ap)\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*(dshow|waveIn|CopyFromScreen|Get-Clipboard).*/)) OR (data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*(CopyFromScreen|waveInOpen|mciSendString|GetAsyncKeyState|SetWindowsHookEx).*/)
    pivot_on:
    - host
    window: 2h
  - name: Network and DNS activity from user-writable paths
    query: (data_win_system_eventID:"3" AND data_win_eventdata_initiated:"true" AND data_win_eventdata_image:/.*(\[Tt]emp\|\[Uu]sers\[Pp]ublic\|\\$[Rr]ecycle\.[Bb]in\).*/) OR (data_win_system_eventID:"22" AND data_win_eventdata_image:/.*(\[Tt]emp\|\[Uu]sers\[Pp]ublic\|\\$[Rr]ecycle\.[Bb]in\).*/)
    pivot_on:
    - host
    window: 2h
  - name: Autostart persistence pointing at user-writable paths
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:/.*[Cc]urrent[Vv]ersion\[Rr]un.*/ OR data_win_eventdata_targetObject:/.*[Ww]inlogon\([Ss]hell|[Uu]serinit).*/) AND data_win_eventdata_details:/.*(\[Tt]emp\|\[Uu]sers\[Pp]ublic\|\\$[Rr]ecycle\.[Bb]in\).*/
    pivot_on:
    - host
    window: 4h
