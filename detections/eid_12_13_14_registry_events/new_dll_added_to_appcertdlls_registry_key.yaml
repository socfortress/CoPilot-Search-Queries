name: New DLL Added to AppCertDlls Registry Key
id: 6aa1d992-5925-4e9f-a49b-845e51d1de01
version: 1
schema_version: "1.0"
date: "2021-11-27"
author: Ilyas Ochkov, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 6aa1d992-5925-4e9f-a49b-845e51d1de01
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Dynamic-link libraries (DLLs) that are specified in the AppCertDLLs value in
  the Registry key can be abused to obtain persistence and privilege escalation
  by causing a malicious DLL to be loaded and run in the context of separate
  processes on the computer. MITRE ATT&CK: T1546.009.

data_source:
  - Sysmon EventID 12/13/14 - Registry Events

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_win_system_eventID: "12"
              - term:
                  data_win_system_eventID: "13"
              - term:
                  data_win_system_eventID: "14"
            minimum_should_match: 1
        
        - bool:
            should:
              - term:
                  data_win_eventdata_targetObject:
                    value: "HKLM\\SYSTEM\\CurrentControlSet\\Control\\Session Manager\\AppCertDlls"
                    case_insensitive: true
              - term:
                  data_win_eventdata_newName:
                    value: "HKLM\\SYSTEM\\CurentControlSet\\Control\\Session Manager\\AppCertDlls"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_newName
    - data_win_eventdata_image
    - data_win_eventdata_details

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject equals
  'HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\AppCertDlls';
  data_win_eventdata_newName equals
  'HKLM\SYSTEM\CurentControlSet\Control\Session Manager\AppCertDlls'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - http://www.hexacorn.com/blog/2013/01/19/beyond-good-ol-run-key-part-3/
  - https://eqllib.readthedocs.io/en/latest/analytics/14f90406-10a0-4d36-a672-31cabe149f2f.html
  - https://attack.mitre.org/techniques/T1546/009/

response:
  message: >
    New DLL Added to AppCertDlls Registry Key detected on host $agent_name$.
    Matched data_win_eventdata_targetObject: $data_win_eventdata_targetObject$.
    Matched data_win_eventdata_newName: $data_win_eventdata_newName$. MITRE
    ATT&CK: T1546.009
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_newName
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1546.009
  custom_tags:
    - added
    - appcertdlls
    - registry
    - sysmon
    - privilege_escalation
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13" OR data_win_system_eventID:"14") AND (data_win_eventdata_targetObject:/[Hh][Kk][Ll][Mm]\\[Ss][Yy][Ss][Tt][Ee][Mm]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt]\\[Cc][Oo][Nn][Tt][Rr][Oo][Ll]\\[Ss][Ee][Ss][Ss][Ii][Oo][Nn] [Mm][Aa][Nn][Aa][Gg][Ee][Rr]\\[Aa][Pp][Pp][Cc][Ee][Rr][Tt][Dd][Ll][Ll][Ss]/ OR data_win_eventdata_newName:/[Hh][Kk][Ll][Mm]\\[Ss][Yy][Ss][Tt][Ee][Mm]\\[Cc][Uu][Rr][Ee][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt]\\[Cc][Oo][Nn][Tt][Rr][Oo][Ll]\\[Ss][Ee][Ss][Ss][Ii][Oo][Nn] [Mm][Aa][Nn][Aa][Gg][Ee][Rr]\\[Aa][Pp][Pp][Cc][Ee][Rr][Tt][Dd][Ll][Ll][Ss]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 4f84b697-c9ed-4420-8ab5-e09af5b2345d
    name: New DLL Added to AppInit_DLLs Registry Key
    reason: 'Sibling DLL-injection persistence: attackers often seed AppInit_DLLs alongside AppCertDlls so the same payload loads into every process via a second mechanism.'
  - id: eeb30123-9fbd-4ee8-aaa0-2e545bbed6dc
    name: Security Support Provider (SSP) Added to LSA Configuration
    reason: Another registry-registered DLL loaded into a privileged system process (lsass); a co-occurring write suggests a multi-vector persistence/credential-theft toolkit.
  - id: b3503044-60ce-4bf4-bbcb-e3db98788823
    name: DLL Load via LSASS
    reason: AppCertDlls DLLs load into every process that calls CreateProcess, including system processes; an unexpected DLL in lsass is the credential-access follow-on.
  - id: 56321594-9087-49d9-bf10-524fe8479452
    name: Potential Persistence Via Netsh Helper DLL
    reason: Same operator tradecraft of registering a malicious DLL in a registry-driven loader, commonly deployed together as redundant persistence.
  - id: de587dce-915e-4218-aac4-835ca6af6f70
    name: Potential Persistence Attempt Via Run Keys Using Reg.EXE
    reason: reg.exe is the usual tool that writes AppCertDlls too; Run key persistence is the typical backup persistence set alongside it.
  - id: 9c5037d1-c568-49b3-88c7-9846a5bdc2be
    name: Suspicious Run Key from Download
    reason: Persistence pointing at a freshly downloaded payload on the same host shows how the dropped DLL arrived and ties the registry write to initial delivery.
  - id: 4f73421b-5a0b-4bbf-a892-5a7fb99bea66
    name: Mavinject Inject DLL Into Running Process
    reason: Alternate DLL-injection route used to execute the same payload immediately in a running process while AppCertDlls provides the persistent path.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Command line referencing AppCertDlls (reg.exe/PowerShell writer)
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Aa][Pp][Pp][Cc][Ee][Rr][Tt][Dd][Ll][Ll][Ss].*/
    pivot_on:
    - host
    window: 1h
  - name: DLL files dropped in system or user-writable paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(\\[Ww]indows\\[Ss]ystem32\\|\\[Tt]emp\\|\\[Pp]rogram[Dd]ata\\|\\[Aa]pp[Dd]ata\\|\\[Pp]ublic\\).*\.[Dd][Ll][Ll]/
    pivot_on:
    - host
    window: 2h
  - name: Sibling DLL-loader persistence keys written (AppInit, LSA, Winlogon, IFEO)
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:/.*[Aa][Pp][Pp][Ii][Nn][Ii][Tt]_[Dd][Ll][Ll][Ss].*/ OR data_win_eventdata_targetObject:/.*\\[Cc]ontrol\\[Ll][Ss][Aa]\\.*/ OR data_win_eventdata_targetObject:/.*[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]\\[Nn]otify.*/ OR data_win_eventdata_targetObject:/.*[Ii]mage [Ff]ile [Ee]xecution [Oo]ptions.*/)
    pivot_on:
    - host
    window: 4h
  - name: rundll32/regsvr32 executing a DLL from a writable location
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Rr][Uu][Nn][Dd][Ll][Ll]32|[Rr][Ee][Gg][Ss][Vv][Rr]32)\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*(\\[Ww]indows\\[Ss]ystem32\\|\\[Tt]emp\\|\\[Pp]rogram[Dd]ata\\|\\[Aa]pp[Dd]ata\\|\\[Pp]ublic\\|\\[Uu]sers\\).*\.[Dd][Ll][Ll].*/
    pivot_on:
    - host
    window: 2h
  - name: LSASS access or remote thread injection after persistence
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR data_win_system_eventID:"8"
    pivot_on:
    - host
    window: 4h
