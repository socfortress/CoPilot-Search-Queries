name: OilRig APT Registry Persistence
id: 7bdf2a7c-3acc-4091-9581-0a77dad1c5b5
version: 1
schema_version: "1.0"
date: "2023-03-08"
author: Florian Roth (Nextron Systems), Markus Neis, Jonhnathan Ribeiro, Daniil Yugoslavskiy, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 7bdf2a7c-3acc-4091-9581-0a77dad1c5b5
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects OilRig registry persistence as reported by Nyotron in their March 2018
  report. MITRE ATT&CK: T1053.005, T1543.003, T1112, T1071.004.

data_source:
  - Sysmon EventID 12/13/14 - Registry Events

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_win_system_eventID: "12"
              - term:
                  data_win_system_eventID: "13"
              - term:
                  data_win_system_eventID: "14"
            minimum_should_match: 1
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*SOFTWARE\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\UMe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*SOFTWARE\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\UT"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_image
    - data_win_eventdata_details

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*SOFTWARE\Microsoft\Windows\CurrentVersion\UMe';
  data_win_eventdata_targetObject matches
  '*SOFTWARE\Microsoft\Windows\CurrentVersion\UT'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://web.archive.org/web/20180402134442/https://nyotron.com/wp-content/uploads/2018/03/Nyotron-OilRig-Malware-Report-March-2018C.pdf
  - https://attack.mitre.org/techniques/T1053/005/
  - https://attack.mitre.org/techniques/T1543/003/
  - https://attack.mitre.org/techniques/T1112/
  - https://attack.mitre.org/techniques/T1071/004/

response:
  message: >
    OilRig APT Registry Persistence detected on host $agent_name$. Matched
    data_win_eventdata_targetObject: $data_win_eventdata_targetObject$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1053.005, T1543.003, T1112, T1071.004
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1053.005
    - T1543.003
    - T1112
    - T1071.004
  custom_tags:
    - oilrig
    - registry
    - persistence
    - sysmon
    - privilege_escalation
    - execution
    - defense_impairment
    - g0049
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13" OR data_win_system_eventID:"14") AND (data_win_eventdata_targetObject:/.*[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Uu][Mm][Ee]/ OR data_win_eventdata_targetObject:/.*[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Uu][Tt]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: ce6e34ca-966d-41c9-8d93-5b06c8b97a06
    name: OilRig APT Activity
    reason: 'Same actor (G0049): process-creation indicators (OilRig scheduled task / command patterns) co-occur with the UMe/UT registry values written by the same implant.'
  - id: 24357373-078f-44ed-9ac4-6d334a668a11
    name: Direct Autorun Keys Modification
    reason: UMe/UT sit under CurrentVersion; the same dropper often also writes standard autorun keys directly via reg.exe for redundant persistence.
  - id: f59c3faf-50f3-464b-9f4c-1b67ab512d99
    name: Common Autorun Keys Modification
    reason: 'Registry-level persistence companion: Run/RunOnce value writes by the same malicious image that planted the OilRig keys.'
  - id: de587dce-915e-4218-aac4-835ca6af6f70
    name: Potential Persistence Attempt Via Run Keys Using Reg.EXE
    reason: Operators using reg.exe to add Run entries after the implant's registry staging indicates layered persistence.
  - id: 81325ce1-be01-4250-944f-b4789644556f
    name: Schedule Task Creation From Env Variable Or Potentially Suspicious Path Via Schtasks.EXE
    reason: OilRig (T1053.005) pairs registry staging with a scheduled task running the dropped script/payload from a user-writable path.
  - id: 17a1be64-8d88-40bf-b5ff-a4f7a50ebcc8
    name: Suspicious New Service Creation
    reason: 'Rule tags T1543.003: the implant may install a service as an alternate persistence mechanism alongside the registry values.'
  - id: 2452e632-9e0d-11eb-bacd-acde48001122
    name: DNS Exfiltration Using Nslookup App
    reason: OilRig tooling (Helminth/ISMAgent) communicates over DNS tunneling (T1071.004); nslookup-driven DNS exfil is the likely follow-on C2 channel once persistence is established.
  - id: 98a96a5a-64a0-4c42-92c5-489da3866cb0
    name: DNS Exfiltration and Tunneling Tools Execution
    reason: DNS tunneling tools (dnscat/iodine style) are the C2/exfil step after OilRig persistence is planted.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other autorun/service registry writes by the same host
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:/.*[Cc]urrent[Vv]ersion\\[Rr]un.*/ OR data_win_eventdata_targetObject:/.*[Cc]urrent[Cc]ontrol[Ss]et\\[Ss]ervices\\.*/ OR data_win_eventdata_targetObject:/.*[Ww]inlogon\\([Ss]hell|[Uu]serinit).*/)
    pivot_on:
    - host
    window: 2h
  - name: Scheduled task creation via schtasks
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss]chtasks\.exe/ AND data_win_eventdata_commandLine:/.*[\/-][Cc]reate.*/
    pivot_on:
    - host
    window: 4h
  - name: nslookup / DNS-tunnelling process activity
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Nn]slookup\.exe/ OR data_win_eventdata_commandLine:/.*([Dd]nscat|[Ii]odine|[Dd]ns2tcp|[Rr]esolve-[Dd]nsname).*/)
    pivot_on:
    - host
    window: 4h
  - name: Script interpreters launching from user-writable paths
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Pp]ower[Ss]hell|[Ww]script|[Cc]script|[Mm]shta)\.exe/) AND (data_win_eventdata_commandLine:/.*([Aa]pp[Dd]ata|[Pp]rogram[Dd]ata|\\[Tt]emp\\|[Pp]ublic).*/)
    pivot_on:
    - host
    window: 2h
  - name: Executables or scripts dropped to user-writable paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(\\[Aa]pp[Dd]ata\\|\\[Pp]rogram[Dd]ata\\|\\[Pp]ublic\\|\\[Tt]emp\\).*\.(exe|dll|ps1|vbs|js|bat)/
    pivot_on:
    - host
    window: 2h
