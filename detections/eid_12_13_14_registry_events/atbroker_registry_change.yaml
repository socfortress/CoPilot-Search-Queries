name: Atbroker Registry Change
id: 9577edbb-851f-4243-8c91-1d5b50c1a39b
version: 1
schema_version: "1.0"
date: "2023-01-19"
author: Mateusz Wydra, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 9577edbb-851f-4243-8c91-1d5b50c1a39b
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects creation/modification of Assistive Technology applications and
  persistence with usage of 'at'. MITRE ATT&CK: T1218, T1547.

data_source:
  - Sysmon EventID 12/13/14 - Registry Events

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_win_system_eventID: "12"
              - term:
                  data_win_system_eventID: "13"
              - term:
                  data_win_system_eventID: "14"
            minimum_should_match: 1
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*Software\\\\Microsoft\\\\Windows NT\\\\CurrentVersion\\\\Accessibility\\\\ATs*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*Software\\\\Microsoft\\\\Windows NT\\\\CurrentVersion\\\\Accessibility\\\\Configuration*"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_image"
        - exists:
            field: "data_win_eventdata_targetObject"
        - exists:
            field: "data_win_eventdata_details"
        - bool:
            must_not:
              - bool:
                  should:
                    - bool:
                        must:
                          - term:
                              data_win_eventdata_image:
                                value: "C:\\Windows\\system32\\atbroker.exe"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_targetObject:
                                value: "*\\\\Microsoft\\\\Windows NT\\\\CurrentVersion\\\\Accessibility\\\\Configuration*"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_details:
                                value: "(Empty)"
                                case_insensitive: true
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "C:\\\\Windows\\\\Installer\\\\MSI*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_targetObject:
                                value: "*Software\\\\Microsoft\\\\Windows NT\\\\CurrentVersion\\\\Accessibility\\\\ATs*"
                                case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_image
    - data_win_eventdata_details

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*Software\Microsoft\Windows NT\CurrentVersion\Accessibility\ATs*';
  data_win_eventdata_targetObject matches '*Software\Microsoft\Windows
  NT\CurrentVersion\Accessibility\Configuration*'; data_win_eventdata_image
  equals 'C:\Windows\system32\atbroker.exe', among other conditions.

known_false_positives: >
  Creation of non-default, legitimate at usage. Baseline expected activity in
  your environment and tune this detection before relying on it for automated
  response.

references:
  - http://www.hexacorn.com/blog/2016/07/22/beyond-good-ol-run-key-part-42/
  - https://lolbas-project.github.io/lolbas/Binaries/Atbroker/
  - https://attack.mitre.org/techniques/T1218/
  - https://attack.mitre.org/techniques/T1547/

response:
  message: >
    Atbroker Registry Change detected on host $agent_name$. Matched
    data_win_eventdata_targetObject: $data_win_eventdata_targetObject$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1218,
    T1547
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218
    - T1547
  custom_tags:
    - atbroker
    - registry
    - change
    - sysmon
    - privilege_escalation
    - stealth
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13" OR data_win_system_eventID:"14") AND (data_win_eventdata_targetObject:/.*[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Nn][Tt]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Aa][Cc][Cc][Ee][Ss][Ss][Ii][Bb][Ii][Ll][Ii][Tt][Yy]\\[Aa][Tt][Ss].*/ OR data_win_eventdata_targetObject:/.*[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Nn][Tt]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Aa][Cc][Cc][Ee][Ss][Ss][Ii][Bb][Ii][Ll][Ii][Tt][Yy]\\[Cc][Oo][Nn][Ff][Ii][Gg][Uu][Rr][Aa][Tt][Ii][Oo][Nn].*/) AND _exists_:data_win_eventdata_image AND _exists_:data_win_eventdata_targetObject AND _exists_:data_win_eventdata_details AND NOT ((data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Aa][Tt][Bb][Rr][Oo][Kk][Ee][Rr]\.[Ee][Xx][Ee]/ AND data_win_eventdata_targetObject:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Nn][Tt]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Aa][Cc][Cc][Ee][Ss][Ss][Ii][Bb][Ii][Ll][Ii][Tt][Yy]\\[Cc][Oo][Nn][Ff][Ii][Gg][Uu][Rr][Aa][Tt][Ii][Oo][Nn].*/ AND data_win_eventdata_details:/\([Ee][Mm][Pp][Tt][Yy]\)/) OR (data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Ee][Rr]\\[Mm][Ss][Ii].*/ AND data_win_eventdata_targetObject:/.*[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Nn][Tt]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Aa][Cc][Cc][Ee][Ss][Ss][Ii][Bb][Ii][Ll][Ii][Tt][Yy]\\[Aa][Tt][Ss].*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: f24bcaea-0cd1-11eb-adc1-0242ac120002
    name: Uncommon  Assistive Technology Applications Execution Via AtBroker.EXE
    reason: 'Direct execution path of the same abuse: atbroker.exe /start <name> launches the attacker-registered AT binary, proving the ATs registry entry was exercised'
  - id: baca5663-583c-45f9-b5dc-ea96a22ce542
    name: Sticky Key Like Backdoor Usage - Registry
    reason: Sibling accessibility-feature persistence in the registry (sethc/utilman IFEO debugger); attackers often plant several accessibility backdoors together
  - id: 1070db9a-3e5d-412e-8e7b-7183b616e1b3
    name: Persistence Via Sticky Key Backdoor
    reason: Command-line setup of an accessibility-binary backdoor on the same host; same persistence/logon-screen-access intent as the ATs key write
  - id: 2fdefcb3-dbda-401e-ae23-f0db027628bc
    name: Sticky Key Like Backdoor Execution
    reason: 'Follow-on: accessibility backdoor triggered at the logon screen (sethc/utilman spawning cmd) confirming the persistence is being used'
  - id: f663a6d9-9d1b-49b8-b2b1-0637914d199a
    name: Narrator's Feedback-Hub Persistence
    reason: Another accessibility-component (Narrator) registry hijack for persistence, co-occurring with AT-based abuse
  - id: 24357373-078f-44ed-9ac4-6d334a668a11
    name: Direct Autorun Keys Modification
    reason: Registry writes are often made via reg.exe; autorun key edits alongside the ATs write indicate layered persistence by the same operator
  - id: cbf93e5d-ca6c-4722-8bea-e9119007c248
    name: CurrentVersion NT Autorun Keys Modification
    reason: Same CurrentVersion\Windows NT hive; additional Winlogon/IFEO autostart values written by the same actor
  - id: de587dce-915e-4218-aac4-835ca6af6f70
    name: Potential Persistence Attempt Via Run Keys Using Reg.EXE
    reason: Parallel persistence mechanism commonly dropped together with the AT registration to survive reboots
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: AtBroker.exe executions and child processes
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Aa][Tt][Bb][Rr][Oo][Kk][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*[Aa][Tt][Bb][Rr][Oo][Kk][Ee][Rr]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: Accessibility feature backdoor registry (IFEO sethc/utilman/osk, ATs)
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:/.*[Ii][Mm][Aa][Gg][Ee] [Ff][Ii][Ll][Ee] [Ee][Xx][Ee][Cc][Uu][Tt][Ii][Oo][Nn] [Oo][Pp][Tt][Ii][Oo][Nn][Ss]\\(sethc|utilman|osk|narrator|magnify|displayswitch)\.exe.*/ OR data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Aa][Cc][Cc][Ee][Ss][Ss][Ii][Bb][Ii][Ll][Ii][Tt][Yy].*/)
    pivot_on:
    - host
    window: 2h
  - name: Binary dropped to disk that the AT registry value points to
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:*.exe OR data_win_eventdata_targetFilename:*.dll OR data_win_eventdata_targetFilename:*.bat OR data_win_eventdata_targetFilename:*.ps1) AND (data_win_eventdata_targetFilename:*\\Users\\* OR data_win_eventdata_targetFilename:*\\ProgramData\\* OR data_win_eventdata_targetFilename:*\\Temp\\* OR data_win_eventdata_targetFilename:*\\Windows\\System32\\*)
    pivot_on:
    - host
    window: 1h
  - name: reg.exe / PowerShell writing registry persistence
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*[Rr][Ee][Gg]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Aa][Dd][Dd].*/) OR (data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ AND data_win_eventdata_commandLine:/.*([Ss]et-[Ii]tem[Pp]roperty|[Nn]ew-[Ii]tem[Pp]roperty).*/)) AND data_win_eventdata_commandLine:/.*([Aa][Cc][Cc][Ee][Ss][Ss][Ii][Bb][Ii][Ll][Ii][Tt][Yy]|[Ii]mage [Ff]ile [Ee]xecution|[Ww]inlogon|\\[Rr]un).*/
    pivot_on:
    - host
    window: 1h
  - name: Interactive shell or SYSTEM process spawned from logon-screen accessibility binaries
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*(\\[Ww]inlogon|\\[Uu]tilman|\\[Ss]ethc|\\[Oo]sk|\\[Nn]arrator|\\[Mm]agnify|\\[Aa][Tt][Bb][Rr][Oo][Kk][Ee][Rr])\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*(\\[Cc][Mm][Dd]|\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|\\[Pp][Ww][Ss][Hh])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 6h
