name: Shell Open Registry Keys Manipulation
id: 152f3630-77c1-4284-bcc0-4cc68ab2f6e7
version: 1
schema_version: "1.0"
date: "2022-01-13"
author: Christian Burkard (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 152f3630-77c1-4284-bcc0-4cc68ab2f6e7
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the shell open key manipulation (exefile and ms-settings) used for
  persistence and the pattern of UAC Bypass using fodhelper.exe,
  computerdefaults.exe, slui.exe via registry keys (e.g. UACMe 33 or 62). MITRE
  ATT&CK: T1548.002, T1546.001.

data_source:
  - Sysmon EventID 12/13/14 - Registry Events

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_win_system_eventID: "12"
              - term:
                  data_win_system_eventID: "13"
              - term:
                  data_win_system_eventID: "14"
            minimum_should_match: 1
        
        - bool:
            should:
              - bool:
                  must:
                    - term:
                        data_win_eventdata_eventType:
                          value: "SetValue"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_targetObject:
                          value: "*Classes\\\\ms-settings\\\\shell\\\\open\\\\command\\\\SymbolicLinkValue"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_details:
                          value: "*\\\\Software\\\\Classes\\\\{*"
                          case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*Classes\\\\ms-settings\\\\shell\\\\open\\\\command\\\\DelegateExecute"
                    case_insensitive: true
              - bool:
                  must:
                    - term:
                        data_win_eventdata_eventType:
                          value: "SetValue"
                          case_insensitive: true
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_targetObject:
                                value: "*Classes\\\\ms-settings\\\\shell\\\\open\\\\command\\\\(Default)"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_targetObject:
                                value: "*Classes\\\\exefile\\\\shell\\\\open\\\\command\\\\(Default)"
                                case_insensitive: true
                        minimum_should_match: 1
                    - exists:
                        field: "data_win_eventdata_details"
                    - bool:
                        must_not:
                          - term:
                              data_win_eventdata_details:
                                value: "(Empty)"
                                case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_eventType
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_eventType equals
  'SetValue'; data_win_eventdata_targetObject matches
  '*Classes\ms-settings\shell\open\command\SymbolicLinkValue';
  data_win_eventdata_details matches '*\Software\Classes\{*', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/hfiref0x/UACME
  - https://winscripting.blog/2017/05/12/first-entry-welcome-and-uac-bypass/
  - https://github.com/RhinoSecurityLabs/Aggressor-Scripts/tree/master/UACBypass
  - https://tria.ge/211119-gs7rtshcfr/behavioral2 [Lokibot sample from Nov 2021]
  - https://attack.mitre.org/techniques/T1548/002/
  - https://attack.mitre.org/techniques/T1546/001/

response:
  message: >
    Shell Open Registry Keys Manipulation detected on host $agent_name$. Matched
    data_win_eventdata_eventType: $data_win_eventdata_eventType$. Matched
    data_win_eventdata_targetObject: $data_win_eventdata_targetObject$. MITRE
    ATT&CK: T1548.002, T1546.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_eventType
      type: other
    - field: data_win_eventdata_targetObject
      type: registry_key

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1548.002
    - T1546.001
  custom_tags:
    - shell
    - registry
    - manipulation
    - sysmon
    - persistence
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13" OR data_win_system_eventID:"14") AND ((data_win_eventdata_eventType:/[Ss][Ee][Tt][Vv][Aa][Ll][Uu][Ee]/ AND data_win_eventdata_targetObject:/.*[Cc][Ll][Aa][Ss][Ss][Ee][Ss]\\[Mm][Ss]-[Ss][Ee][Tt][Tt][Ii][Nn][Gg][Ss]\\[Ss][Hh][Ee][Ll][Ll]\\[Oo][Pp][Ee][Nn]\\[Cc][Oo][Mm][Mm][Aa][Nn][Dd]\\[Ss][Yy][Mm][Bb][Oo][Ll][Ii][Cc][Ll][Ii][Nn][Kk][Vv][Aa][Ll][Uu][Ee]/ AND data_win_eventdata_details:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Cc][Ll][Aa][Ss][Ss][Ee][Ss]\\\{.*/) OR data_win_eventdata_targetObject:/.*[Cc][Ll][Aa][Ss][Ss][Ee][Ss]\\[Mm][Ss]-[Ss][Ee][Tt][Tt][Ii][Nn][Gg][Ss]\\[Ss][Hh][Ee][Ll][Ll]\\[Oo][Pp][Ee][Nn]\\[Cc][Oo][Mm][Mm][Aa][Nn][Dd]\\[Dd][Ee][Ll][Ee][Gg][Aa][Tt][Ee][Ee][Xx][Ee][Cc][Uu][Tt][Ee]/ OR (data_win_eventdata_eventType:/[Ss][Ee][Tt][Vv][Aa][Ll][Uu][Ee]/ AND (data_win_eventdata_targetObject:/.*[Cc][Ll][Aa][Ss][Ss][Ee][Ss]\\[Mm][Ss]-[Ss][Ee][Tt][Tt][Ii][Nn][Gg][Ss]\\[Ss][Hh][Ee][Ll][Ll]\\[Oo][Pp][Ee][Nn]\\[Cc][Oo][Mm][Mm][Aa][Nn][Dd]\\\([Dd][Ee][Ff][Aa][Uu][Ll][Tt]\)/ OR data_win_eventdata_targetObject:/.*[Cc][Ll][Aa][Ss][Ss][Ee][Ss]\\[Ee][Xx][Ee][Ff][Ii][Ll][Ee]\\[Ss][Hh][Ee][Ll][Ll]\\[Oo][Pp][Ee][Nn]\\[Cc][Oo][Mm][Mm][Aa][Nn][Dd]\\\([Dd][Ee][Ff][Aa][Uu][Ll][Tt]\)/) AND _exists_:data_win_eventdata_details AND NOT (data_win_eventdata_details:/\([Ee][Mm][Pp][Tt][Yy]\)/)))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7f741dcf-fc22-4759-87b4-9ae8376676a2
    name: Bypass UAC via Fodhelper.exe
    reason: fodhelper.exe auto-elevates and reads HKCU ms-settings\shell\open\command; its launch right after the key write is the execution half of the same UACMe bypass
  - id: 3c05e90d-7eba-4324-9972-5d7f711a60a8
    name: UAC Bypass Tools Using ComputerDefaults
    reason: computerdefaults.exe is the other auto-elevating binary that consumes the ms-settings shell-open hijack, so the key write is followed by its launch
  - id: dd3ee8cc-f751-41c9-ba53-5a32ed47e563
    name: Registry Modification of MS-settings Protocol Handler
    reason: Same ms-settings handler key modified, seen from the reg.exe/process side; confirms the writer was a scripted command line
  - id: 46dd5308-4572-4d12-aa43-8938f0184d4f
    name: Bypass UAC Using DelegateExecute
    reason: DelegateExecute value is the other half of the ms-settings hijack (an empty DelegateExecute is needed for the command to run), co-occurring in the same registry sequence
  - id: 9e8894c0-0ae0-11ef-9d85-1f2942bec57c
    name: Suspicious Shell Open Command Registry Modification
    reason: Generic shell\open\command value writes by non-system processes cover the exefile/other class hijack variants of the same technique
  - id: 44a22d59-b175-4f13-8c16-cbaef5b581ff
    name: New File Association Using Exefile
    reason: Exefile association tampering is the persistence variant (T1546.001) of the exefile\shell\open\command write this rule also matches
  - id: 6ea3bf32-9680-422d-9f50-e90716b12a66
    name: UAC Bypass Via Wsreset
    reason: Sibling registry-based bypass (AppX shell open command hijack run through wsreset.exe) used interchangeably by the same tooling when ms-settings is blocked
  - id: 48437c39-9e5f-47fb-af95-3d663c3f2919
    name: UAC Disabled
    reason: After elevation attackers commonly weaken UAC (EnableLUA/ConsentPrompt) to make later elevated actions silent
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Auto-elevating UAC-bypass binaries launched (fodhelper/computerdefaults/slui/sdclt/eventvwr/wsreset)
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Ff][Oo][Dd][Hh][Ee][Ll][Pp][Ee][Rr]|[Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr][Dd][Ee][Ff][Aa][Uu][Ll][Tt][Ss]|[Ss][Ll][Uu][Ii]|[Ss][Dd][Cc][Ll][Tt]|[Ee][Vv][Ee][Nn][Tt][Vv][Ww][Rr]|[Ww][Ss][Rr][Ee][Ss][Ee][Tt])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: High-integrity child spawned by an auto-elevating binary (hijacked command executed)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\([Ff][Oo][Dd][Hh][Ee][Ll][Pp][Ee][Rr]|[Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr][Dd][Ee][Ff][Aa][Uu][Ll][Tt][Ss]|[Ss][Ll][Uu][Ii]|[Ss][Dd][Cc][Ll][Tt]|[Ee][Vv][Ee][Nn][Tt][Vv][Ww][Rr]|[Ww][Ss][Rr][Ee][Ss][Ee][Tt])\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Cc][Mm][Dd]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]|[Mm][Ss][Hh][Tt][Aa]|[Rr][Uu][Nn][Dd][Ll][Ll]32|[Rr][Ee][Gg][Ss][Vv][Rr]32|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: Registry hijack cleanup or sibling shell-open/DelegateExecute writes
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13" OR data_win_system_eventID:"14") AND data_win_eventdata_targetObject:/.*([Mm][Ss]-[Ss][Ee][Tt][Tt][Ii][Nn][Gg][Ss]|[Ee][Xx][Ee][Ff][Ii][Ll][Ee]|[Mm][Ss][Cc][Ff][Ii][Ll][Ee]|[Aa][Pp][Pp][Xx][^\\]*)\\[Ss][Hh][Ee][Ll][Ll]\\[Oo][Pp][Ee][Nn]\\[Cc][Oo][Mm][Mm][Aa][Nn][Dd].*/
    pivot_on:
    - host
    window: 4h
  - name: UAC / defender weakening registry writes after elevation
    query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*[Pp][Oo][Ll][Ii][Cc][Ii][Ee][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]\\(EnableLUA|ConsentPromptBehaviorAdmin|LocalAccountTokenFilterPolicy|PromptOnSecureDesktop).*/ OR data_win_eventdata_targetObject:/.*[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr]\\(Exclusions|Real-Time Protection).*/)
    pivot_on:
    - host
    window: 2h
  - name: Persistence autostart writes following the privilege escalation
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn]([Oo][Nn][Cc][Ee])?\\.*/ OR data_win_eventdata_targetObject:/.*[Ss][Yy][Ss][Tt][Ee][Mm]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt]\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\.*/ OR data_win_eventdata_targetObject:/.*[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]\\([Ss][Hh][Ee][Ll][Ll]|[Uu][Ss][Ee][Rr][Ii][Nn][Ii][Tt]).*/)
    pivot_on:
    - host
    window: 4h
