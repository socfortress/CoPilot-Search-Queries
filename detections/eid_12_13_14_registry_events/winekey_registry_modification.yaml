name: WINEKEY Registry Modification
id: b98968aa-dbc0-4a9c-ac35-108363cbf8d5
version: 1
schema_version: "1.0"
date: "2021-11-27"
author: omkar72
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: b98968aa-dbc0-4a9c-ac35-108363cbf8d5
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential malicious modification of run keys by winekey or team9
  backdoor. MITRE ATT&CK: T1547.

data_source:
  - Sysmon EventID 12/13/14 - Registry Events

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_win_system_eventID: "12"
              - term:
                  data_win_system_eventID: "13"
              - term:
                  data_win_system_eventID: "14"
            minimum_should_match: 1
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*Software\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Run\\\\Backup Mgr"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_image
    - data_win_eventdata_details

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*Software\Microsoft\Windows\CurrentVersion\Run\Backup Mgr'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.fireeye.com/blog/threat-research/2020/10/kegtap-and-singlemalt-with-a-ransomware-chaser.html
  - https://attack.mitre.org/techniques/T1547/

response:
  message: >
    WINEKEY Registry Modification detected on host $agent_name$. Matched
    data_win_eventdata_targetObject: $data_win_eventdata_targetObject$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1547
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1547
  custom_tags:
    - winekey
    - registry
    - sysmon
    - privilege_escalation
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13" OR data_win_system_eventID:"14") AND data_win_eventdata_targetObject:/.*[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn]\\[Bb][Aa][Cc][Kk][Uu][Pp] [Mm][Gg][Rr]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: de587dce-915e-4218-aac4-835ca6af6f70
    name: Potential Persistence Attempt Via Run Keys Using Reg.EXE
    reason: KEGTAP/winekey commonly writes its Run value with reg.exe; this is the process-creation view of the same Run-key write, giving the parent and command line.
  - id: 24357373-078f-44ed-9ac4-6d334a668a11
    name: Direct Autorun Keys Modification
    reason: Same CurrentVersion\Run persistence mechanism seen from the command line; confirms the key was written by a scripted installer and not just a stray registry event.
  - id: c80e66d8-1780-48a9-b412-46663fd21ac0
    name: Suspicious Autorun Registry Modified via WMI
    reason: Alternative way the same actor may plant autorun values; co-occurs when the loader falls back from direct registry writes.
  - id: f35c5d71-b489-4e22-a115-f003df287317
    name: Potential CobaltStrike Process Patterns
    reason: KEGTAP/SINGLEMALT backdoors are followed by BEACON staging; process patterns of Cobalt Strike on the same host are the direct follow-on.
  - id: 15619216-e993-4721-b590-4c520615a67d
    name: Potential Meterpreter/CobaltStrike Activity
    reason: 'Post-backdoor hands-on activity: named-pipe/service-style BEACON execution typically starts minutes to hours after the Run key is planted.'
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: In the KEGTAP-to-ransomware chain operators dump LSASS for credentials after BEACON lands, preceding lateral movement.
  - id: 5afee48e-67dd-4e03-a783-f74259dcf998
    name: Potential LSASS Process Dump Via Procdump
    reason: Alternate credential-theft tooling used by the same operators once persistence is established.
  - id: c37510b8-2107-4b78-aa32-72f251e7a844
    name: Potential Ryuk Ransomware Activity
    reason: The referenced campaign ended in Ryuk ransomware deployment; this is the end-of-chain impact if the backdoor is not contained.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Run key values written by temp/user-writable binaries
    query: (data_win_system_eventID:"13") AND data_win_eventdata_targetObject:/.*[Cc]urrent[Vv]ersion\\[Rr]un.*/ AND (data_win_eventdata_details:*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\* OR data_win_eventdata_details:*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\* OR data_win_eventdata_details:*\\[Tt][Ee][Mm][Pp]\\* OR data_win_eventdata_details:*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\* OR data_win_eventdata_details:*[Pp]ower[Ss]hell* OR data_win_eventdata_details:*[Ww][Ss]cript* OR data_win_eventdata_details:*[Rr]undll32*)
    pivot_on:
    - host
    window: 2h
  - name: Scripting/LOLBin process launched from user-writable path
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\(wscript|cscript|mshta|rundll32|regsvr32|powershell)\.exe/ OR data_win_eventdata_image:/.*\\(wscript|cscript|mshta|rundll32|regsvr32)\.exe/) AND (data_win_eventdata_commandLine:*\\[Aa]pp[Dd]ata\\* OR data_win_eventdata_commandLine:*\\[Pp]rogram[Dd]ata\\* OR data_win_eventdata_commandLine:*\\[Tt]emp\\* OR data_win_eventdata_commandLine:*[Ff]rom[Bb]ase64*)
    pivot_on:
    - host
    window: 2h
  - name: Outbound connections or DNS from script hosts and rundll32 (backdoor C2 check-in)
    query: (data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\(wscript|cscript|mshta|rundll32|regsvr32|powershell|svchost)\.exe/ AND data_win_eventdata_initiated:"true" AND NOT data_win_eventdata_destinationIp:/(10\..*|192\.168\..*|127\..*)/) OR (data_win_system_eventID:"22" AND data_win_eventdata_image:/.*\\(wscript|cscript|mshta|rundll32|regsvr32)\.exe/)
    pivot_on:
    - host
    window: 4h
  - name: Discovery commands typical of post-backdoor recon (nltest, net group, whoami, adfind)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:*[Nn]ltest*[Dd]omain_trusts* OR data_win_eventdata_commandLine:*[Nn]et*[Gg]roup*[Dd]omain* OR data_win_eventdata_commandLine:*[Ww]hoami*\/all* OR data_win_eventdata_image:*\\[Aa]d[Ff]ind.exe OR data_win_eventdata_commandLine:*[Aa]d[Ff]ind*)
    pivot_on:
    - host
    window: 6h
  - name: Credential dumping and shadow copy/backup destruction following persistence
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:*\\lsass.exe) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:*comsvcs*MiniDump* OR data_win_eventdata_commandLine:*[Vv]ssadmin*[Dd]elete*[Ss]hadows* OR data_win_eventdata_commandLine:*[Bb]cdedit*[Rr]ecoveryenabled* OR data_win_eventdata_commandLine:*[Ww]badmin*[Dd]elete*))
    pivot_on:
    - host
    window: 6h
