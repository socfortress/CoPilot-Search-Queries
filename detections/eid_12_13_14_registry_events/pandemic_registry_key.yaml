name: Pandemic Registry Key
id: 47e0852a-cf81-4494-a8e6-31864f8c86ed
version: 1
schema_version: "1.0"
date: "2022-10-09"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 47e0852a-cf81-4494-a8e6-31864f8c86ed
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects Pandemic Windows Implant. MITRE ATT&CK: T1105.

data_source:
  - Sysmon EventID 12/13/14 - Registry Events

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_win_system_eventID: "12"
              - term:
                  data_win_system_eventID: "13"
              - term:
                  data_win_system_eventID: "14"
            minimum_should_match: 1
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\SYSTEM\\\\CurrentControlSet\\\\services\\\\null\\\\Instance*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_image
    - data_win_eventdata_details

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\SYSTEM\CurrentControlSet\services\null\Instance*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://wikileaks.org/vault7/#Pandemic
  - https://twitter.com/MalwareJake/status/870349480356454401
  - https://attack.mitre.org/techniques/T1105/

response:
  message: >
    Pandemic Registry Key detected on host $agent_name$. Matched
    data_win_eventdata_targetObject: $data_win_eventdata_targetObject$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1105
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1105
  custom_tags:
    - pandemic
    - registry
    - sysmon
    - command_and_control
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13" OR data_win_system_eventID:"14") AND data_win_eventdata_targetObject:/.*\\[Ss][Yy][Ss][Tt][Ee][Mm]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt]\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\[Nn][Uu][Ll][Ll]\\[Ii][Nn][Ss][Tt][Aa][Nn][Cc][Ee].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 431a1fdb-4799-4f3b-91c3-a683b003fc49
    name: New Kernel Driver Via SC.EXE
    reason: 'Pandemic is a kernel file-system filter driver registered as a service; sc.exe create type=kernel is a direct way to create the services
  
      ull key this alert detects.'
  - id: 17a1be64-8d88-40bf-b5ff-a4f7a50ebcc8
    name: Suspicious New Service Creation
    reason: Implant install creates a masquerading service entry ('null'); the same step may appear as a process event just before the registry write.
  - id: a2ea3ae7-d3d0-40a0-a55c-25a45c87cac1
    name: Suspicious Driver Install by pnputil.exe
    reason: Alternative driver-staging route to install the Pandemic filter driver without sc.exe, preceding the Instance registry keys.
  - id: 2c4523d5-d481-4ed0-8ec3-7fbf0cb41a75
    name: Driver Load From A Temporary Directory
    reason: Once registered the implant driver must load into the kernel; a driver loaded from a temp path confirms the key is a live driver.
  - id: 39b64854-5497-4b57-a448-40977b8c9679
    name: Malicious Driver Load By Name
    reason: 'Follow-on Sysmon EID 6 driver-load telemetry confirming the filter driver actually loaded after the services
  
      ull key appeared.'
  - id: 4931188c-178e-4ee7-a348-39e8a7a56821
    name: Filter Driver Unloaded Via Fltmc.EXE
    reason: A minifilter implant is manipulated or removed with fltmc; filter load/unload on the same host ties directly to this key.
  - id: 4d7cda18-1b12-4e52-b45c-d28653210df8
    name: Sysmon Driver Unloaded Via Fltmc.EXE
    reason: An operator with a filter-driver implant may unload Sysmon's minifilter to blind the registry telemetry that raised this alert.
  - id: 855bc8b5-2ae8-402e-a9ed-b889e6df1900
    name: Copy From Or To Admin Share Or Sysvol Folder
    reason: Pandemic replaces files served over SMB shares; admin-share copy activity is how it is staged to or from the compromised file server.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Service / kernel driver creation tooling on this host
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\[Ss][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*([Cc][Rr][Ee][Aa][Tt][Ee]|[Cc][Oo][Nn][Ff][Ii][Gg]).*/ AND data_win_eventdata_commandLine:/.*[Kk][Ee][Rr][Nn][Ee][Ll].*/) OR (data_win_eventdata_image:/.*\\[Ff][Ll][Tt][Mm][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*([Ll][Oo][Aa][Dd]|[Uu][Nn][Ll][Oo][Aa][Dd]).*/) OR (data_win_eventdata_image:/.*\\[Pp][Nn][Pp][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*(\-[Ii]|\/[Aa][Dd][Dd]-[Dd][Rr][Ii][Vv][Ee][Rr]|\/[Ii][Nn][Ss][Tt][Aa][Ll][Ll]).*/))
    pivot_on:
    - host
    window: 2h
  - name: Driver files (.sys) dropped on this host
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.[Ss][Yy][Ss]/ AND NOT data_win_eventdata_targetFilename:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\([Ww][Ii][Nn][Ss][Xx][Ss]|[Ss][Ee][Rr][Vv][Ii][Cc][Ii][Nn][Gg]|[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee][Dd][Ii][Ss][Tt][Rr][Ii][Bb][Uu][Tt][Ii][Oo][Nn]).*/
    pivot_on:
    - host
    window: 4h
  - name: Kernel driver loads that are unsigned or outside System32
    query: data_win_system_eventID:"6" AND (data_win_eventdata_signed:"false" OR NOT data_win_eventdata_imageLoaded:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\.*/)
    pivot_on:
    - host
    window: 4h
  - name: Service registry configuration written on this host
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt]\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\.*\\([Ii][Mm][Aa][Gg][Ee][Pp][Aa][Tt][Hh]|[Ss][Tt][Aa][Rr][Tt]|[Tt][Yy][Pp][Ee]|[Ii][Nn][Ss][Tt][Aa][Nn][Cc][Ee][Ss]|[Aa][Ll][Tt][Ii][Tt][Uu][Dd][Ee]).*/
    pivot_on:
    - host
    window: 2h
  - name: Admin-share / UNC file copy activity from this host
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*\\\\.*\\([Cc]\$|[Aa][Dd][Mm][Ii][Nn]\$|[Ii][Pp][Cc]\$).*/ AND (data_win_eventdata_commandLine:/.*([Cc][Oo][Pp][Yy]|[Xx][Cc][Oo][Pp][Yy]|[Rr][Oo][Bb][Oo][Cc][Oo][Pp][Yy]|[Mm][Oo][Vv][Ee]).*/ OR data_win_eventdata_image:/.*\\[Rr][Oo][Bb][Oo][Cc][Oo][Pp][Yy]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 4h
