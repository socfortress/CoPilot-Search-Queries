name: Path To Screensaver Binary Modified
id: 67a6c006-3fbe-46a7-9074-2ba3b82c3000
version: 1
schema_version: "1.0"
date: "2021-11-27"
author: Bartlomiej Czyz @bczyz1, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 67a6c006-3fbe-46a7-9074-2ba3b82c3000
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects value modification of registry key containing path to binary used as
  screensaver. MITRE ATT&CK: T1546.002.

data_source:
  - Sysmon EventID 12/13/14 - Registry Events

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_win_system_eventID: "12"
              - term:
                  data_win_system_eventID: "13"
              - term:
                  data_win_system_eventID: "14"
            minimum_should_match: 1
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\Control Panel\\\\Desktop\\\\SCRNSAVE.EXE"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\rundll32.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\explorer.exe"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_image
    - data_win_eventdata_details

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\Control Panel\Desktop\SCRNSAVE.EXE'; data_win_eventdata_image matches
  '*\rundll32.exe'; data_win_eventdata_image matches '*\explorer.exe'.

known_false_positives: >
  Legitimate modification of screensaver. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1546.002/T1546.002.md
  - https://www.welivesecurity.com/wp-content/uploads/2017/08/eset-gazer.pdf
  - https://attack.mitre.org/techniques/T1546/002/

response:
  message: >
    Path To Screensaver Binary Modified detected on host $agent_name$. Matched
    data_win_eventdata_targetObject: $data_win_eventdata_targetObject$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1546.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1546.002
  custom_tags:
    - screensaver
    - binary
    - modified
    - registry
    - sysmon
    - persistence
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13" OR data_win_system_eventID:"14") AND data_win_eventdata_targetObject:/.*\\[Cc][Oo][Nn][Tt][Rr][Oo][Ll] [Pp][Aa][Nn][Ee][Ll]\\[Dd][Ee][Ss][Kk][Tt][Oo][Pp]\\[Ss][Cc][Rr][Nn][Ss][Aa][Vv][Ee]\.[Ee][Xx][Ee]/ AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 40b6e656-4e11-4c0c-8772-c1cc6dae34ce
    name: ScreenSaver Registry Key Set
    reason: Sibling registry detection on the same Control Panel Desktop screensaver values (SCRNSAVE.EXE, timeout); a full screensaver hijack usually sets several together.
  - id: 97aa2e88-555c-450d-85a6-229bcd87efb8
    name: Suspicious Screensaver Binary File Creation
    reason: 'Precursor: attacker drops the malicious .scr/PE that SCRNSAVE.EXE is then pointed at.'
  - id: c048f047-7e2a-4888-b302-55f509d4a91d
    name: SCR File Write Event
    reason: 'Precursor: a .scr file written to disk shortly before the registry value is repointed to it.'
  - id: 15bd98ea-55f4-4d37-b09a-e7caa0fa2221
    name: Rundll32 InstallScreenSaver Execution
    reason: Alternative screensaver install/launch path (desk.cpl InstallScreenSaver) used by the same actor.
  - id: 9c5037d1-c568-49b3-88c7-9846a5bdc2be
    name: Suspicious Run Key from Download
    reason: Attackers stack redundant autostart mechanisms; a Run key to a downloaded binary alongside the screensaver hijack confirms persistence staging.
  - id: de587dce-915e-4218-aac4-835ca6af6f70
    name: Potential Persistence Attempt Via Run Keys Using Reg.EXE
    reason: Co-occurring registry persistence via reg.exe on the same host, indicating a scripted multi-mechanism routine.
  - id: 74babdd6-a758-4549-9632-26535279e654
    name: Suspicious Executable File Creation
    reason: 'Precursor: the payload binary the screensaver value points to is first dropped in a suspicious location.'
  - id: 24357373-078f-44ed-9ac4-6d334a668a11
    name: Direct Autorun Keys Modification
    reason: Command-line autorun registry edits from the same process lineage that modified SCRNSAVE.EXE.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Screensaver .scr dropped on disk
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.[Ss][Cc][Rr]/
    pivot_on:
    - host
    window: 2h
  - name: Other screensaver settings changed (active, secure, timeout)
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND data_win_eventdata_targetObject:/.*\[Cc]ontrol [Pp]anel\[Dd]esktop\([Ss]creen[Ss]ave[Aa]ctive|[Ss]creen[Ss]aver[Ii]s[Ss]ecure|[Ss]creen[Ss]ave[Tt]ime[Oo]ut|[Ss][Cc][Rr][Nn][Ss][Aa][Vv][Ee]\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 4h
  - name: Screensaver executed or installed via rundll32/desk.cpl
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\.[Ss][Cc][Rr]/ OR data_win_eventdata_commandLine:/.*\.[Ss][Cc][Rr].*/ OR data_win_eventdata_commandLine:/.*[Ii]nstall[Ss]creen[Ss]aver.*/)
    pivot_on:
    - host
    window: 6h
  - name: Scripting tools editing Control Panel Desktop values
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Cc]ontrol [Pp]anel\[Dd]esktop.*/ AND data_win_eventdata_image:/.*\([Rr][Ee][Gg]|[Pp]owershell|[Cc][Mm][Dd]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Outbound connections from .scr or user-writable binaries
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*\.[Ss][Cc][Rr]/ OR data_win_eventdata_image:/.*\[Uu][Ss][Ee][Rr][Ss]\.*\([Aa][Pp][Pp][Dd][Aa][Tt][Aa]|[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]).*/)
    pivot_on:
    - host
    window: 6h
