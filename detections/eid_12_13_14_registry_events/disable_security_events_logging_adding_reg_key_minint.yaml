name: Disable Security Events Logging Adding Reg Key MiniNt
id: 919f2ef0-be2d-4a7a-b635-eb2b41fde044
version: 1
schema_version: "1.0"
date: "2021-11-27"
author: Ilyas Ochkov, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 919f2ef0-be2d-4a7a-b635-eb2b41fde044
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the addition of a key 'MiniNt' to the registry. Upon a reboot, Windows
  Event Log service will stop writing events. MITRE ATT&CK: T1685.001, T1112.

data_source:
  - Sysmon EventID 12/13/14 - Registry Events

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_win_system_eventID: "12"
              - term:
                  data_win_system_eventID: "13"
              - term:
                  data_win_system_eventID: "14"
            minimum_should_match: 1
        
        - bool:
            should:
              - bool:
                  must:
                    - term:
                        data_win_eventdata_targetObject:
                          value: "HKLM\\SYSTEM\\CurrentControlSet\\Control\\MiniNt"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_eventType:
                          value: "CreateKey"
                          case_insensitive: true
              - term:
                  data_win_eventdata_newName:
                    value: "HKLM\\SYSTEM\\CurrentControlSet\\Control\\MiniNt"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_eventType
    - data_win_eventdata_newName
    - data_win_eventdata_image
    - data_win_eventdata_details

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject equals
  'HKLM\SYSTEM\CurrentControlSet\Control\MiniNt'; data_win_eventdata_eventType
  equals 'CreateKey'; data_win_eventdata_newName equals
  'HKLM\SYSTEM\CurrentControlSet\Control\MiniNt'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/0gtweet/status/1182516740955226112
  - https://www.hackingarticles.in/defense-evasion-windows-event-logging-t1562-002/
  - https://attack.mitre.org/techniques/T1685/001/
  - https://attack.mitre.org/techniques/T1112/

response:
  message: >
    Disable Security Events Logging Adding Reg Key MiniNt detected on host
    $agent_name$. Matched data_win_eventdata_targetObject:
    $data_win_eventdata_targetObject$. Matched data_win_eventdata_eventType:
    $data_win_eventdata_eventType$. MITRE ATT&CK: T1685.001, T1112
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_eventType
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685.001
    - T1112
  custom_tags:
    - disable
    - security
    - logging
    - registry
    - sysmon
    - persistence
    - defense_impairment
    - car_2022_03_001
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13" OR data_win_system_eventID:"14") AND ((data_win_eventdata_targetObject:/[Hh][Kk][Ll][Mm]\\[Ss][Yy][Ss][Tt][Ee][Mm]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt]\\[Cc][Oo][Nn][Tt][Rr][Oo][Ll]\\[Mm][Ii][Nn][Ii][Nn][Tt]/ AND data_win_eventdata_eventType:/[Cc][Rr][Ee][Aa][Tt][Ee][Kk][Ee][Yy]/) OR data_win_eventdata_newName:/[Hh][Kk][Ll][Mm]\\[Ss][Yy][Ss][Tt][Ee][Mm]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt]\\[Cc][Oo][Nn][Tt][Rr][Oo][Ll]\\[Mm][Ii][Nn][Ii][Nn][Tt]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 2f78da12-f7c7-430b-8b19-a28f269b77a3
    name: Disable Windows Event Logging Via Registry
    reason: Sibling log-blinding technique via registry; attackers often stack several event-log disabling methods before the reboot that makes MiniNt effective
  - id: fdb829a8-db84-4832-b64b-3e964cd44f01
    name: Windows Eventlog Cleared Via Wevtutil
    reason: 'Typical companion: existing logs are wiped with wevtutil cl to erase pre-MiniNt evidence while future events are suppressed'
  - id: 236e7c8e-c9d9-11eb-a824-acde48001122
    name: Disable Logs Using WevtUtil
    reason: wevtutil sl /e:false disables individual channels live, the no-reboot alternative or complement to MiniNt
  - id: 0a13e132-651d-11eb-ae93-0242ac130002
    name: Audit Policy Tampering Via Auditpol
    reason: Auditpol removes Security-log audit categories; same goal of blinding Windows auditing, usually run by the same actor in the same session
  - id: d7b81144-b866-48a4-9bcc-275dc69d870e
    name: Windows EventLog Autologger Session Registry Modification Via CommandLine
    reason: Registry-based Autologger/ETW session tampering via reg.exe, the same registry-edit tradecraft against logging infrastructure
  - id: a238b5d0-ce2d-4414-a676-7a531b3d13d6
    name: ETW Trace Evasion Activity
    reason: ETW tampering is a parallel telemetry-blinding step that precedes noisy follow-on activity
  - id: 87911521-7098-470b-a459-9a57fc80bdfd
    name: Sysmon Configuration Update
    reason: Attacker who blinds Windows logs often also weakens Sysmon, which is the telemetry that detected MiniNt
  - id: b28e58e4-2a72-4fae-bdee-0fbe904db642
    name: Windows Defender Real-time Protection Disabled
    reason: 'Defense impairment co-occurs: AV disabled alongside logging so payloads run unseen and unrecorded'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other event-log and audit tampering on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll].*(cl|clear-log|sl|set-log).*/ OR data_win_eventdata_commandLine:/.*[Aa][Uu][Dd][Ii][Tt][Pp][Oo][Ll].*/ OR data_win_eventdata_commandLine:/.*[Cc][Ll][Ee][Aa][Rr]-[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Mm][Oo][Vv][Ee]-[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg].*/)
    pivot_on:
    - host
    window: 2h
  - name: Registry tampering of EventLog, Sysmon, ETW and security services
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:/.*[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg].*/ OR data_win_eventdata_targetObject:/.*[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\[Ss][Yy][Ss][Mm][Oo][Nn].*/ OR data_win_eventdata_targetObject:/.*[Ww][Mm][Ii]\\[Aa][Uu][Tt][Oo][Ll][Oo][Gg][Gg][Ee][Rr].*/ OR data_win_eventdata_targetObject:/.*[Ww][Ii][Nn][Dd][Ee][Ff][Ee][Nn][Dd].*[Dd][Ii][Ss][Aa][Bb][Ll][Ee].*/ OR data_win_eventdata_targetObject:/.*[Cc][Oo][Nn][Tt][Rr][Oo][Ll]\\[Mm][Ii][Nn][Ii][Nn][Tt].*/)
    pivot_on:
    - host
    window: 4h
  - name: Process that wrote MiniNt and its child activity
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*(\\[Rr][Ee][Gg]|\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|\\[Cc][Mm][Dd]|\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt])\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Nn][Tt].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Gg] [Aa][Dd][Dd].*/))
    pivot_on:
    - host
    window: 1h
  - name: 'Defense impairment: Defender disable, exclusions, shadow copy and boot config changes'
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Aa][Dd][Dd]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*[Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Bb][Cc][Dd][Ee][Dd][Ii][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ff][Ll][Tt][Mm][Cc].*[Uu][Nn][Ll][Oo][Aa][Dd].*/)
    pivot_on:
    - host
    window: 2h
  - name: Reboot or shutdown commands soon after MiniNt (to activate it)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ss][Hh][Uu][Tt][Dd][Oo][Ww][Nn]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Ss][Tt][Aa][Rr][Tt]-[Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Ss][Hh][Uu][Tt][Dd][Oo][Ww][Nn].* -[Rr].*/ OR data_win_eventdata_commandLine:/.*[Ss][Hh][Uu][Tt][Dd][Oo][Ww][Nn].* \/[Rr].*/)
    pivot_on:
    - host
    window: 1h
