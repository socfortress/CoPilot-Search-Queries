name: Disable Security Events Logging Adding Reg Key MiniNt
id: 919f2ef0-be2d-4a7a-b635-eb2b41fde044
version: 1
schema_version: "1.0"
date: "2021-11-27"
author: Ilyas Ochkov, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 919f2ef0-be2d-4a7a-b635-eb2b41fde044
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the addition of a key 'MiniNt' to the registry. Upon a reboot, Windows
  Event Log service will stop writing events. MITRE ATT&CK: T1685.001, T1112.

data_source:
  - Sysmon EventID 12/13/14 - Registry Events

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_win_system_eventID: "12"
              - term:
                  data_win_system_eventID: "13"
              - term:
                  data_win_system_eventID: "14"
            minimum_should_match: 1
        
        - bool:
            should:
              - bool:
                  must:
                    - term:
                        data_win_eventdata_targetObject:
                          value: "HKLM\\SYSTEM\\CurrentControlSet\\Control\\MiniNt"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_eventType:
                          value: "CreateKey"
                          case_insensitive: true
              - term:
                  data_win_eventdata_newName:
                    value: "HKLM\\SYSTEM\\CurrentControlSet\\Control\\MiniNt"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_eventType
    - data_win_eventdata_newName
    - data_win_eventdata_image
    - data_win_eventdata_details

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject equals
  'HKLM\SYSTEM\CurrentControlSet\Control\MiniNt'; data_win_eventdata_eventType
  equals 'CreateKey'; data_win_eventdata_newName equals
  'HKLM\SYSTEM\CurrentControlSet\Control\MiniNt'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/0gtweet/status/1182516740955226112
  - https://www.hackingarticles.in/defense-evasion-windows-event-logging-t1562-002/
  - https://attack.mitre.org/techniques/T1685/001/
  - https://attack.mitre.org/techniques/T1112/

response:
  message: >
    Disable Security Events Logging Adding Reg Key MiniNt detected on host
    $agent_name$. Matched data_win_eventdata_targetObject:
    $data_win_eventdata_targetObject$. Matched data_win_eventdata_eventType:
    $data_win_eventdata_eventType$. MITRE ATT&CK: T1685.001, T1112
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_eventType
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685.001
    - T1112
  custom_tags:
    - disable
    - security
    - logging
    - registry
    - sysmon
    - persistence
    - defense_impairment
    - car_2022_03_001
  product:
