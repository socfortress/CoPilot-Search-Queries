name: Potential Credential Dumping Via LSASS SilentProcessExit Technique
id: 55e29995-75e7-451a-bef0-6225e2f13597
version: 1
schema_version: "1.0"
date: "2022-12-19"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 55e29995-75e7-451a-bef0-6225e2f13597
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects changes to the Registry in which a monitor program gets registered to
  dump the memory of the lsass.exe process. MITRE ATT&CK: T1003.001.

data_source:
  - Sysmon EventID 12/13/14 - Registry Events

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_win_system_eventID: "12"
              - term:
                  data_win_system_eventID: "13"
              - term:
                  data_win_system_eventID: "14"
            minimum_should_match: 1
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*Microsoft\\\\Windows NT\\\\CurrentVersion\\\\SilentProcessExit\\\\lsass.exe*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_image
    - data_win_eventdata_details

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*Microsoft\Windows NT\CurrentVersion\SilentProcessExit\lsass.exe*'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.deepinstinct.com/2021/02/16/lsass-memory-dumps-are-stealthier-than-ever-before-part-2/
  - https://oddvar.moe/2018/04/10/persistence-using-globalflags-in-image-file-execution-options-hidden-from-autoruns-exe/
  - https://attack.mitre.org/techniques/T1003/001/

response:
  message: >
    Potential Credential Dumping Via LSASS SilentProcessExit Technique detected
    on host $agent_name$. Matched data_win_eventdata_targetObject:
    $data_win_eventdata_targetObject$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1003.001
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.001
  custom_tags:
    - credential
    - dumping
    - lsass
    - registry
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13" OR data_win_system_eventID:"14") AND data_win_eventdata_targetObject:/.*[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Nn][Tt]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Ss][Ii][Ll][Ee][Nn][Tt][Pp][Rr][Oo][Cc][Ee][Ss][Ss][Ee][Xx][Ii][Tt]\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c3e76af5-4ce0-4a14-9c9a-25ceb8fda182
    name: WerFault LSASS Process Memory Dump
    reason: SilentProcessExit makes WerFault.exe write the lsass dump file when lsass exits; this is the dump artifact the registry setup exists to produce.
  - id: e5b33f7d-eb93-48b6-9851-09e1e610b6d7
    name: Credential Dumping Attempt Via WerFault
    reason: WerFault opening a handle on lsass.exe is the execution phase of the SilentProcessExit chain that follows the registry configuration.
  - id: 9a4ccd1a-3526-4d99-b980-9f9c5d3a6ff3
    name: Potential Credential Dumping Via WER
    reason: 'Same Windows Error Reporting abuse path: WerFault spawned/used to dump lsass, directly follows SilentProcessExit key setup.'
  - id: a5a2d357-1ab8-4675-a967-ef9990a59391
    name: LSASS Process Memory Dump Files
    reason: Dump file (lsass*.dmp) created in the LocalDumpFolder configured under SilentProcessExit confirms the dump succeeded.
  - id: a18e0862-127b-43ca-be12-1a542c75c7c5
    name: LSASS Process Crashed - Application
    reason: The technique requires lsass to be terminated/crashed to trigger the silent exit monitor; the attacker typically forces this right after setting the keys.
  - id: 5afee48e-67dd-4e03-a783-f74259dcf998
    name: Potential LSASS Process Dump Via Procdump
    reason: The MonitorProcess value is commonly procdump.exe -ma lsass, so procdump execution against lsass is the likely registered monitor.
  - id: 33efc23c-6ea2-4503-8cfe-bdf82ce8f719
    name: Lsass Full Dump Request Via DumpType Registry Settings
    reason: Co-occurring registry tuning (DumpType=2) used with the same WER-based lsass dump tradecraft.
  - id: b3503044-60ce-4bf4-bbcb-e3db98788823
    name: DLL Load via LSASS
    reason: Registry-based lsass manipulation by the same operator; persistence/credential-access via lsass-related keys on the host.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: SilentProcessExit / IFEO GlobalFlag registry configuration for any process
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13" OR data_win_system_eventID:"14") AND (data_win_eventdata_targetObject:/.*[Ss][Ii][Ll][Ee][Nn][Tt][Pp][Rr][Oo][Cc][Ee][Ss][Ss][Ee][Xx][Ii][Tt].*/ OR (data_win_eventdata_targetObject:/.*[Ii]mage [Ff]ile [Ee]xecution [Oo]ptions.*/ AND data_win_eventdata_targetObject:/.*[Gg]lobal[Ff]lag.*/))
    pivot_on:
    - host
    window: 4h
  - name: WerFault launching a monitor process or accessing lsass
    query: (data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Ww][Ee][Rr][Ff][Aa][Uu][Ll][Tt]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_sourceImage:/.*[Ww][Ee][Rr][Ff][Aa][Uu][Ll][Tt].*/)
    pivot_on:
    - host
    window: 1h
  - name: Dump files written (lsass dmp, WerFault/procdump output)
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Ll][Ss][Aa][Ss][Ss].*\.[Dd][Mm][Pp]/ OR (data_win_eventdata_image:/.*[Ww][Ee][Rr][Ff][Aa][Uu][Ll][Tt]\.[Ee][Xx][Ee]/ AND data_win_eventdata_targetFilename:/.*\.[Dd][Mm][Pp]/))
    pivot_on:
    - host
    window: 2h
  - name: 'Process that set the keys: reg.exe/PowerShell/procdump touching SilentProcessExit or lsass'
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Ii][Ll][Ee][Nn][Tt][Pp][Rr][Oo][Cc][Ee][Ss][Ss][Ee][Xx][Ii][Tt].*/ OR data_win_eventdata_commandLine:/.*[Mm][Oo][Nn][Ii][Tt][Oo][Rr][Pp][Rr][Oo][Cc][Ee][Ss][Ss].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Pp][Oo][Rr][Tt][Ii][Nn][Gg][Mm][Oo][Dd][Ee].*/ OR data_win_eventdata_image:/.*[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp](64)?\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: Exfil or archiving of dump files after capture
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*\.[Dd][Mm][Pp].*/ AND (data_win_eventdata_image:/.*(7z|[Rr]ar|[Tt]ar|[Cc]url|[Cc]ertutil|[Bb]itsadmin)[A-Za-z]*\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Cc]ompress-[Aa]rchive|[Cc]opy|[Ss]cp).*/))
    pivot_on:
    - host
    window: 6h
