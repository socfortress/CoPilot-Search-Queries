name: Run Once Task Configuration in Registry
id: c74d7efc-8826-45d9-b8bb-f04fac9e4eff
version: 1
schema_version: "1.0"
date: "2024-03-25"
author: Avneet Singh @v3t0_, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: c74d7efc-8826-45d9-b8bb-f04fac9e4eff
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Rule to detect the configuration of Run Once registry key. Configured payload
  can be run by runonce.exe /AlternateShellStartup. MITRE ATT&CK: T1112.

data_source:
  - Sysmon EventID 12/13/14 - Registry Events

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_win_system_eventID: "12"
              - term:
                  data_win_system_eventID: "13"
              - term:
                  data_win_system_eventID: "14"
            minimum_should_match: 1
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\Microsoft\\\\Active Setup\\\\Installed Components*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\StubPath"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_details"
        - bool:
            must_not:
              - bool:
                  should:
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_details:
                                value: "*C:\\\\Program Files\\\\Google\\\\Chrome\\\\Application\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_details:
                                value: "*\\\\Installer\\\\chrmstp.exe\" --configure-user-settings --verbose-logging --system-level*"
                                case_insensitive: true
                    - bool:
                        must:
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_details:
                                      value: "*C:\\\\Program Files (x86)\\\\Microsoft\\\\Edge\\\\Application\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_details:
                                      value: "*C:\\\\Program Files\\\\Microsoft\\\\Edge\\\\Application\\\\*"
                                      case_insensitive: true
                              minimum_should_match: 1
                          - wildcard:
                              data_win_eventdata_details:
                                value: "*\\\\Installer\\\\setup.exe\" --configure-user-settings --verbose-logging --system-level --msedge --channel=stable"
                                case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_details
    - data_win_eventdata_image

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\Microsoft\Active Setup\Installed Components*';
  data_win_eventdata_targetObject matches '*\StubPath';
  data_win_eventdata_details matches '*C:\Program
  Files\Google\Chrome\Application\*', among other conditions.

known_false_positives: >
  Legitimate modification of the registry key by legitimate program. Baseline
  expected activity in your environment and tune this detection before relying
  on it for automated response.

references:
  - https://twitter.com/pabraeken/status/990717080805789697
  - https://lolbas-project.github.io/lolbas/Binaries/Runonce/
  - https://attack.mitre.org/techniques/T1112/

response:
  message: >
    Run Once Task Configuration in Registry detected on host $agent_name$.
    Matched data_win_eventdata_targetObject: $data_win_eventdata_targetObject$.
    Matched data_win_eventdata_details: $data_win_eventdata_details$. MITRE
    ATT&CK: T1112
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_details
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
  custom_tags:
    - configuration
    - registry
    - sysmon
    - persistence
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13" OR data_win_system_eventID:"14") AND data_win_eventdata_targetObject:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Aa][Cc][Tt][Ii][Vv][Ee] [Ss][Ee][Tt][Uu][Pp]\\[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Ee][Dd] [Cc][Oo][Mm][Pp][Oo][Nn][Ee][Nn][Tt][Ss].*/ AND data_win_eventdata_targetObject:/.*\\[Ss][Tt][Uu][Bb][Pp][Aa][Tt][Hh]/ AND _exists_:data_win_eventdata_details AND NOT ((data_win_eventdata_details:/.*[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Gg][Oo][Oo][Gg][Ll][Ee]\\[Cc][Hh][Rr][Oo][Mm][Ee]\\[Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn]\\.*/ AND data_win_eventdata_details:/.*\\[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Ee][Rr]\\[Cc][Hh][Rr][Mm][Ss][Tt][Pp]\.[Ee][Xx][Ee]\" --[Cc][Oo][Nn][Ff][Ii][Gg][Uu][Rr][Ee]-[Uu][Ss][Ee][Rr]-[Ss][Ee][Tt][Tt][Ii][Nn][Gg][Ss] --[Vv][Ee][Rr][Bb][Oo][Ss][Ee]-[Ll][Oo][Gg][Gg][Ii][Nn][Gg] --[Ss][Yy][Ss][Tt][Ee][Mm]-[Ll][Ee][Vv][Ee][Ll].*/) OR ((data_win_eventdata_details:/.*[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ee][Dd][Gg][Ee]\\[Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn]\\.*/ OR data_win_eventdata_details:/.*[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ee][Dd][Gg][Ee]\\[Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn]\\.*/) AND data_win_eventdata_details:/.*\\[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Ee][Rr]\\[Ss][Ee][Tt][Uu][Pp]\.[Ee][Xx][Ee]\" --[Cc][Oo][Nn][Ff][Ii][Gg][Uu][Rr][Ee]-[Uu][Ss][Ee][Rr]-[Ss][Ee][Tt][Tt][Ii][Nn][Gg][Ss] --[Vv][Ee][Rr][Bb][Oo][Ss][Ee]-[Ll][Oo][Gg][Gg][Ii][Nn][Gg] --[Ss][Yy][Ss][Tt][Ee][Mm]-[Ll][Ee][Vv][Ee][Ll] --[Mm][Ss][Ee][Dd][Gg][Ee] --[Cc][Hh][Aa][Nn][Nn][Ee][Ll]=[Ss][Tt][Aa][Bb][Ll][Ee]/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 24357373-078f-44ed-9ac4-6d334a668a11
    name: Direct Autorun Keys Modification
    reason: Same actor often writes Run keys via reg.exe/command line alongside the Active Setup StubPath as redundant persistence.
  - id: de587dce-915e-4218-aac4-835ca6af6f70
    name: Potential Persistence Attempt Via Run Keys Using Reg.EXE
    reason: reg add to Run keys is the usual sibling command to a StubPath write; both indicate scripted registry persistence setup.
  - id: f59c3faf-50f3-464b-9f4c-1b67ab512d99
    name: Common Autorun Keys Modification
    reason: Attackers layer HKCU/HKLM Run key value sets with Active Setup so persistence survives removal of one mechanism.
  - id: b29aed60-ebd1-442b-9cb5-16a1d0324adb
    name: Wow6432Node CurrentVersion Autorun Keys Modification
    reason: Active Setup also exists under Wow6432Node; 32-bit payloads write the matching Wow6432Node autorun keys.
  - id: 02ee49e2-e294-4d0f-9278-f5b3212fc588
    name: New RUN Key Pointing to Suspicious Folder
    reason: If the StubPath payload sits in a user-writable path, a Run key pointing to the same folder confirms malicious persistence.
  - id: 9c5037d1-c568-49b3-88c7-9846a5bdc2be
    name: Suspicious Run Key from Download
    reason: 'Precursor pattern: a downloaded dropper registers autostart entries, then also plants a StubPath value.'
  - id: c80e66d8-1780-48a9-b412-46663fd21ac0
    name: Suspicious Autorun Registry Modified via WMI
    reason: Registry persistence written through WMI StdRegProv is an alternative route to the same StubPath/Run writes.
  - id: 8d85cf08-bf97-4260-ba49-986a2a65129c
    name: Suspicious PowerShell In Registry Run Keys
    reason: StubPath value holding a PowerShell command is the same fileless autostart tradecraft as PowerShell stored in Run keys.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Active Setup StubPath payload executed via runonce.exe or spawned from Active Setup
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Rr][Uu][Nn][Oo][Nn][Cc][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Rr][Uu][Nn][Oo][Nn][Cc][Ee]\.[Ee][Xx][Ee].*[Aa][Ll][Tt][Ee][Rr][Nn][Aa][Tt][Ee][Ss][Hh][Ee][Ll][Ll][Ss][Tt][Aa][Rr][Tt][Uu][Pp].*/ OR data_win_eventdata_commandLine:/.*[Aa][Cc][Tt][Ii][Vv][Ee][Ss][Ee][Tt][Uu][Pp].*/)
    pivot_on:
    - host
    window: 4h
  - name: Other writes to Active Setup Installed Components StubPath
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13" OR data_win_system_eventID:"14") AND data_win_eventdata_targetObject:/.*[Aa][Cc][Tt][Ii][Vv][Ee] [Ss][Ee][Tt][Uu][Pp]\\[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Ee][Dd] [Cc][Oo][Mm][Pp][Oo][Nn][Ee][Nn][Tt][Ss].*/
    pivot_on:
    - host
    window: 24h
  - name: Run/RunOnce autostart values written on this host
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn]([Oo][Nn][Cc][Ee])?\\.*/
    pivot_on:
    - host
    window: 4h
  - name: Registry editing tools writing persistence (reg.exe, regedit, powershell Set-ItemProperty)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Tt][Uu][Bb][Pp][Aa][Tt][Hh].*/ OR (data_win_eventdata_commandLine:/.*[Rr][Ee][Gg](\.[Ee][Xx][Ee])? +[Aa][Dd][Dd].*/ AND data_win_eventdata_commandLine:/.*([Rr][Uu][Nn]|[Aa][Cc][Tt][Ii][Vv][Ee] [Ss][Ee][Tt][Uu][Pp]).*/) OR data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Ii][Tt][Ee][Mm][Pp][Rr][Oo][Pp][Ee][Rr][Tt][Yy].*[Rr][Uu][Nn].*/)
    pivot_on:
    - host
    window: 2h
  - name: Payload staging from user-writable paths (executables created in Temp/AppData/ProgramData/Public)
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\|\\[Tt][Ee][Mm][Pp]\\|\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\|\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\).*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Pp][Ss]1|[Bb][Aa][Tt]|[Vv][Bb][Ss]|[Jj][Ss])/
    pivot_on:
    - host
    window: 2h
