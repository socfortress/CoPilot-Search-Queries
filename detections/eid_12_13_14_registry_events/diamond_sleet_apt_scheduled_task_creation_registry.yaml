name: Diamond Sleet APT Scheduled Task Creation - Registry
id: 9f9f92ba-5300-43a4-b435-87d1ee571688
version: 1
schema_version: "1.0"
date: "2023-10-24"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 9f9f92ba-5300-43a4-b435-87d1ee571688
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects registry event related to the creation of a scheduled task used by
  Diamond Sleet APT during exploitation of Team City CVE-2023-42793
  vulnerability. MITRE ATT&CK: T1685.

data_source:
  - Sysmon EventID 12/13/14 - Registry Events

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_win_system_eventID: "12"
              - term:
                  data_win_system_eventID: "13"
              - term:
                  data_win_system_eventID: "14"
            minimum_should_match: 1
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\SOFTWARE\\\\Microsoft\\\\Windows NT\\\\CurrentVersion\\\\Schedule\\\\TaskCache\\\\Tree\\\\*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*Windows TeamCity Settings User Interface*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_image
    - data_win_eventdata_details

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Schedule\TaskCache\Tree\*';
  data_win_eventdata_targetObject matches '*Windows TeamCity Settings User
  Interface*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.microsoft.com/en-us/security/blog/2023/10/18/multiple-north-korean-threat-actors-exploiting-the-teamcity-cve-2023-42793-vulnerability/
  - https://attack.mitre.org/techniques/T1685/

response:
  message: >
    Diamond Sleet APT Scheduled Task Creation - Registry detected on host
    $agent_name$. Matched data_win_eventdata_targetObject:
    $data_win_eventdata_targetObject$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1685
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685
  custom_tags:
    - diamond
    - sleet
    - scheduled
    - registry
    - sysmon
    - defense_impairment
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13" OR data_win_system_eventID:"14") AND data_win_eventdata_targetObject:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Nn][Tt]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Ss][Cc][Hh][Ee][Dd][Uu][Ll][Ee]\\[Tt][Aa][Ss][Kk][Cc][Aa][Cc][Hh][Ee]\\[Tt][Rr][Ee][Ee]\\.*/ AND data_win_eventdata_targetObject:/.*[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Tt][Ee][Aa][Mm][Cc][Ii][Tt][Yy] [Ss][Ee][Tt][Tt][Ii][Nn][Gg][Ss] [Uu][Ss][Ee][Rr] [Ii][Nn][Tt][Ee][Rr][Ff][Aa][Cc][Ee].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 3b8e5084-4de9-449a-a40d-0e11014f2e2d
    name: Diamond Sleet APT Scheduled Task Creation
    reason: Same 'Windows TeamCity Settings User Interface' task seen via Security 4698; independent confirmation that the registry TaskCache write was a real task creation by the same actor.
  - id: b5495d8d-24ad-4a44-8caf-ceae9a07a5c2
    name: Diamond Sleet APT Process Activity Indicators
    reason: Process-level IOCs of the same TeamCity CVE-2023-42793 intrusion; the scheduled task launches these payloads.
  - id: d1b65d98-37d7-4ff6-b139-2d87c1af3042
    name: Diamond Sleet APT DLL Sideloading Indicators
    reason: Diamond Sleet's task runs a legitimate binary that sideloads a malicious DLL; this is the execution stage following task persistence.
  - id: e1212b32-55ff-4dfb-a595-62b572248056
    name: Diamond Sleet APT File Creation Indicators
    reason: Payload/DLL drops by the actor immediately precede registering the task that executes them.
  - id: fba38e0f-4607-4344-bb8f-a4b50cdeef7f
    name: Diamond Sleet APT DNS Communication Indicators
    reason: 'Next step after persistence: implant beaconing to Diamond Sleet C2 domains from the same host.'
  - id: 4720b7df-40c3-48fd-bbdf-fd4b3c464f0d
    name: Scheduled TaskCache Change by Uncommon Program
    reason: Same TaskCache registry persistence mechanism written by a non-standard process, corroborating tool-created tasks.
  - id: 80e1f67a-4596-4351-98f5-a9c3efabac95
    name: Suspicious Scheduled Task Write to System32 Tasks
    reason: Task XML file written to System32/Tasks is the file-side artifact of the same task registration.
  - id: 89ca78fd-b37c-4310-b3d3-81a023f83936
    name: Schtasks Creation Or Modification With SYSTEM Privileges
    reason: Actor typically registers the task via schtasks running as SYSTEM, the process-creation view of this registry write.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Process activity under TeamCity build agent / Java parent (CVE-2023-42793 exploitation)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*[Jj][Aa][Vv][Aa].*/ OR data_win_eventdata_parentImage:/.*[Tt][Ee][Aa][Mm][Cc][Ii][Tt][Yy].*/ OR data_win_eventdata_parentImage:/.*[Tt][Cc][Bb][Uu][Ii][Ll][Dd].*/) AND (data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 4h
  - name: schtasks creating the TeamCity-named task or tasks from user-writable paths
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:*TeamCity* OR data_win_eventdata_commandLine:*ProgramData* OR data_win_eventdata_commandLine:*\\Temp\\* OR data_win_eventdata_commandLine:*AppData* OR data_win_eventdata_commandLine:*Public*)
    pivot_on:
    - host
    window: 2h
  - name: Executable or DLL dropped in ProgramData/Temp/Public on this host
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*\\.([Dd][Ll][Ll]|[Ee][Xx][Ee])/ OR data_win_eventdata_targetFilename:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*\\.([Dd][Ll][Ll]|[Ee][Xx][Ee])/ OR data_win_eventdata_targetFilename:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*\\.([Dd][Ll][Ll]|[Ee][Xx][Ee])/)
    pivot_on:
    - host
    window: 4h
  - name: LSASS access or credential dumping tooling after persistence
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:*comsvcs* OR data_win_eventdata_commandLine:*MiniDump* OR data_win_eventdata_commandLine:*sekurlsa* OR data_win_eventdata_commandLine:*procdump*))
    pivot_on:
    - host
    window: 4h
  - name: Outbound connections from unusual paths or via DLL-sideload hosts
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:"true" AND (data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_image:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/)
    pivot_on:
    - host
    window: 4h
