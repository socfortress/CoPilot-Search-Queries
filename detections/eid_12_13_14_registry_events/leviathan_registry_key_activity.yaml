name: Leviathan Registry Key Activity
id: 70d43542-cd2d-483c-8f30-f16b436fd7db
version: 1
schema_version: "1.0"
date: "2023-09-19"
author: Aidan Bracher
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 70d43542-cd2d-483c-8f30-f16b436fd7db
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects registry key used by Leviathan APT in Malaysian focused campaign.
  MITRE ATT&CK: T1547.001.

data_source:
  - Sysmon EventID 12/13/14 - Registry Events

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_win_system_eventID: "12"
              - term:
                  data_win_system_eventID: "13"
              - term:
                  data_win_system_eventID: "14"
            minimum_should_match: 1
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\Software\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Run\\\\ntkd*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_image
    - data_win_eventdata_details

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\Software\Microsoft\Windows\CurrentVersion\Run\ntkd*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.elastic.co/blog/advanced-techniques-used-in-malaysian-focused-apt-campaign
  - https://attack.mitre.org/techniques/T1547/001/

response:
  message: >
    Leviathan Registry Key Activity detected on host $agent_name$. Matched
    data_win_eventdata_targetObject: $data_win_eventdata_targetObject$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1547.001
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1547.001
  custom_tags:
    - leviathan
    - registry
    - sysmon
    - privilege_escalation
    - persistence
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13" OR data_win_system_eventID:"14") AND data_win_eventdata_targetObject:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn]\\[Nn][Tt][Kk][Dd].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 9c5037d1-c568-49b3-88c7-9846a5bdc2be
    name: Suspicious Run Key from Download
    reason: Same Run-key persistence write; this variant fires when the value points at a downloaded/user-writable payload, confirming the ntkd entry launches attacker-dropped code.
  - id: f59c3faf-50f3-464b-9f4c-1b67ab512d99
    name: Common Autorun Keys Modification
    reason: Generic Run/RunOnce value-set on the same host; shows whether the ntkd write is one of several autostart entries planted by the intruder.
  - id: b29aed60-ebd1-442b-9cb5-16a1d0324adb
    name: Wow6432Node CurrentVersion Autorun Keys Modification
    reason: The 32-bit Run key hive is the alternate location for the same persistence; a 32-bit implant may register there too.
  - id: Windows_Autoruns_Run_Key_Value_Set_By_Suspicious Process
    name: Windows Autoruns Run Key Value Set By Suspicious Process
    reason: Identifies the writing process (script host, Office, LOLBin) behind the Run-key set, i.e. the dropper that installed ntkd.
  - id: de587dce-915e-4218-aac4-835ca6af6f70
    name: Potential Persistence Attempt Via Run Keys Using Reg.EXE
    reason: Command-line route (reg add ...Run) to install the same persistence; process-creation view of how the key was written.
  - id: 7b434893-c57d-4f41-908d-6a17bf1ae98f
    name: Network Connection Initiated From Process Located In Potentially Suspicious Or Uncommon Location
    reason: After persistence is placed, the implant in a user-writable folder beacons out to the campaign C2 (follow-on callback).
  - id: e593cf51-88db-4ee1-b920-37e89012a3c9
    name: Potentially Suspicious Rundll32 Activity
    reason: Persisted payloads are commonly DLLs launched via rundll32 from the Run value; this catches execution of that loader.
  - id: cea72823-df4d-4567-950c-0b579eaf0846
    name: Potential Dropper Script Execution Via WScript/CScript/MSHTA
    reason: 'Precursor: the script dropper stage that typically writes the Run key and drops the payload.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other Run/RunOnce values pointing to user-writable paths
    query: (data_win_system_eventID:"13" OR data_win_system_eventID:"12") AND data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/ AND (data_win_eventdata_details:*ProgramData* OR data_win_eventdata_details:*AppData* OR data_win_eventdata_details:*Temp* OR data_win_eventdata_details:*Users\\Public*)
    pivot_on:
    - host
    window: 2h
  - name: Executables/DLLs dropped into ProgramData, Public, Temp or AppData
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(ProgramData|Users\\Public|AppData\\.*|Windows\\Temp)\\.*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Ss][Cc][Rr]|[Vv][Bb][Ss]|[Jj][Ss]|[Pp][Ss]1)/
    pivot_on:
    - host
    window: 2h
  - name: Process launched from ProgramData, Public, Temp or AppData
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(ProgramData|Users\\Public|AppData\\.*|Windows\\Temp)\\.*\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Outbound connections from processes in user-writable folders
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:"true" AND data_win_eventdata_image:/.*(ProgramData|Users\\Public|AppData\\.*|Windows\\Temp)\\.*/ AND NOT data_win_eventdata_destinationIp:/(10\..*|192\.168\..*|127\..*)/
    pivot_on:
    - host
    window: 4h
  - name: Rundll32/Regsvr32 loading DLLs from user-writable paths
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Rr][Uu][Nn][Dd][Ll][Ll]32|[Rr][Ee][Gg][Ss][Vv][Rr]32)\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:*ProgramData* OR data_win_eventdata_commandLine:*AppData* OR data_win_eventdata_commandLine:*Temp* OR data_win_eventdata_commandLine:*Users\\Public*)
    pivot_on:
    - host
    window: 2h
