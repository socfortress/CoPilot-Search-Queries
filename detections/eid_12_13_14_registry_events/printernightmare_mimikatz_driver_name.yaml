  asset_type: Endpoint
  mitre_attack_id:
    - T1204
  custom_tags:
    - printernightmare
    - mimikatz
    - driver
    - registry
    - sysmon
    - execution
    - cve_2021_1675
    - cve_2021_34527
  product:
