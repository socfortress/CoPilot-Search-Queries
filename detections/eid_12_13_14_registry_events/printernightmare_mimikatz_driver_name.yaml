name: PrinterNightmare Mimikatz Driver Name
id: ba6b9e43-1d45-4d3c-a504-1043a64c8469
version: 1
schema_version: "1.0"
date: "2023-06-12"
author: Markus Neis, @markus_neis, Florian Roth
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: ba6b9e43-1d45-4d3c-a504-1043a64c8469
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects static QMS 810 and mimikatz driver name used by Mimikatz as exploited
  in CVE-2021-1675 and CVE-2021-34527. MITRE ATT&CK: T1204.

data_source:
  - Sysmon EventID 12/13/14 - Registry Events

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_win_system_eventID: "12"
              - term:
                  data_win_system_eventID: "13"
              - term:
                  data_win_system_eventID: "14"
            minimum_should_match: 1
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\Control\\\\Print\\\\Environments\\\\Windows x64\\\\Drivers\\\\Version-3\\\\QMS 810\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetObject:
                    value: "*\\\\Control\\\\Print\\\\Environments\\\\Windows x64\\\\Drivers\\\\Version-3\\\\mimikatz*"
                    case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_targetObject:
                          value: "*legitprinter*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_targetObject:
                          value: "*\\\\Control\\\\Print\\\\Environments\\\\Windows*"
                          case_insensitive: true
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_targetObject:
                                value: "*\\\\Control\\\\Print\\\\Environments*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_targetObject:
                                value: "*\\\\CurrentVersion\\\\Print\\\\Printers*"
                                case_insensitive: true
                        minimum_should_match: 1
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_targetObject:
                                value: "*Gentil Kiwi*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_targetObject:
                                value: "*mimikatz printer*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_targetObject:
                                value: "*Kiwi Legit Printer*"
                                case_insensitive: true
                        minimum_should_match: 1
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_image
    - data_win_eventdata_details

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\Control\Print\Environments\Windows x64\Drivers\Version-3\QMS 810\*';
  data_win_eventdata_targetObject matches '*\Control\Print\Environments\Windows
  x64\Drivers\Version-3\mimikatz*'; data_win_eventdata_targetObject matches
  '*legitprinter*', among other conditions.

known_false_positives: >
  Legitimate installation of printer driver QMS 810, Texas Instruments
  microLaser printer (unlikely). Baseline expected activity in your environment
  and tune this detection before relying on it for automated response.

references:
  - https://github.com/gentilkiwi/mimikatz/commit/c21276072b3f2a47a21e215a46962a17d54b3760
  - https://www.lexjansen.com/sesug/1993/SESUG93035.pdf
  - https://learn.microsoft.com/en-us/openspecs/windows_protocols/ms-rprn/4464eaf0-f34f-40d5-b970-736437a21913
  - https://nvd.nist.gov/vuln/detail/cve-2021-1675
  - https://nvd.nist.gov/vuln/detail/cve-2021-34527
  - https://attack.mitre.org/techniques/T1204/

response:
  message: >
    PrinterNightmare Mimikatz Driver Name detected on host $agent_name$. Matched
    data_win_eventdata_targetObject: $data_win_eventdata_targetObject$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1204
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1204
  custom_tags:
    - printernightmare
    - mimikatz
    - driver
    - registry
    - sysmon
    - execution
    - cve_2021_1675
    - cve_2021_34527
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13" OR data_win_system_eventID:"14") AND (data_win_eventdata_targetObject:/.*\\[Cc][Oo][Nn][Tt][Rr][Oo][Ll]\\[Pp][Rr][Ii][Nn][Tt]\\[Ee][Nn][Vv][Ii][Rr][Oo][Nn][Mm][Ee][Nn][Tt][Ss]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Xx]64\\[Dd][Rr][Ii][Vv][Ee][Rr][Ss]\\[Vv][Ee][Rr][Ss][Ii][Oo][Nn]-3\\[Qq][Mm][Ss] 810\\.*/ OR data_win_eventdata_targetObject:/.*\\[Cc][Oo][Nn][Tt][Rr][Oo][Ll]\\[Pp][Rr][Ii][Nn][Tt]\\[Ee][Nn][Vv][Ii][Rr][Oo][Nn][Mm][Ee][Nn][Tt][Ss]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Xx]64\\[Dd][Rr][Ii][Vv][Ee][Rr][Ss]\\[Vv][Ee][Rr][Ss][Ii][Oo][Nn]-3\\[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz].*/ OR (data_win_eventdata_targetObject:/.*[Ll][Ee][Gg][Ii][Tt][Pp][Rr][Ii][Nn][Tt][Ee][Rr].*/ AND data_win_eventdata_targetObject:/.*\\[Cc][Oo][Nn][Tt][Rr][Oo][Ll]\\[Pp][Rr][Ii][Nn][Tt]\\[Ee][Nn][Vv][Ii][Rr][Oo][Nn][Mm][Ee][Nn][Tt][Ss]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss].*/) OR ((data_win_eventdata_targetObject:/.*\\[Cc][Oo][Nn][Tt][Rr][Oo][Ll]\\[Pp][Rr][Ii][Nn][Tt]\\[Ee][Nn][Vv][Ii][Rr][Oo][Nn][Mm][Ee][Nn][Tt][Ss].*/ OR data_win_eventdata_targetObject:/.*\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Pp][Rr][Ii][Nn][Tt]\\[Pp][Rr][Ii][Nn][Tt][Ee][Rr][Ss].*/) AND (data_win_eventdata_targetObject:/.*[Gg][Ee][Nn][Tt][Ii][Ll] [Kk][Ii][Ww][Ii].*/ OR data_win_eventdata_targetObject:/.*[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz] [Pp][Rr][Ii][Nn][Tt][Ee][Rr].*/ OR data_win_eventdata_targetObject:/.*[Kk][Ii][Ww][Ii] [Ll][Ee][Gg][Ii][Tt] [Pp][Rr][Ii][Nn][Tt][Ee][Rr].*/)))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 2131cfb3-8c12-45e8-8fa0-31f5924e9f07
    name: CVE-2021-1675 Print Spooler Exploitation Filename Pattern
    reason: 'Same PrintNightmare exploit: the malicious driver DLL is dropped into the spooler drivers directory just before the mimikatz driver registry entry is written'
  - id: ce7066a6-508a-42d3-995b-2952c65dc2ce
    name: Drop Binaries Into Spool Drivers Color Folder
    reason: Payload DLL staged in the spool drivers color folder is the file-side precursor of the rogue driver registration
  - id: 5b2bbc47-dead-4ef7-8908-0cf73fcbecbf
    name: Potential PrintNightmare Exploitation Attempt
    reason: Spooler deleting temp driver files after AddPrinterDriverEx is the cleanup trace of the same exploit run
  - id: 8fe1c584-ee61-444b-be21-e9054b229694
    name: CVE-2021-1675 Print Spooler Exploitation IPC Access
    reason: Remote RPC access to the spooler pipe is the network delivery of the driver install that creates this registry key
  - id: 214e8f95-100a-4e04-bb31-ef6cba8ce07e
    name: DCERPC SMB Spoolss Named Pipe
    reason: Spoolss named-pipe use is the MS-RPRN channel through which the exploit registers the driver
  - id: dcdbc940-0bff-46b2-95f3-2d73f848e33b
    name: Suspicious Spool Service Child Process
    reason: Successful driver load runs the payload as SYSTEM under spoolsv.exe, spawning shells or tools as its child
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: The mimikatz driver name implies mimikatz was used; its execution is the direct follow-on credential theft
  - id: 5ef9853e-4d0e-4a70-846f-a9ca37d876da
    name: Potential Credential Dumping Activity Via LSASS
    reason: After SYSTEM execution via the spooler, LSASS memory access is the expected credential dumping step
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Files dropped into spool drivers directory
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Ss][Pp][Oo][Oo][Ll]\\[Dd][Rr][Ii][Vv][Ee][Rr][Ss]\\.*/
    pivot_on:
    - host
    window: 2h
  - name: Child processes spawned by the print spooler
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ss][Pp][Oo][Oo][Ll][Ss][Vv]\.[Ee][Xx][Ee]/ AND NOT data_win_eventdata_image:/.*\\[Ww][Ww][Aa][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Mimikatz execution or LSASS access on host
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:*sekurlsa* OR data_win_eventdata_commandLine:*mimikatz* OR data_win_eventdata_commandLine:*lsadump*))
    pivot_on:
    - host
    window: 4h
  - name: Print driver and printer registry changes
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:/.*[Cc]ontrol\\[Pp]rint\\.*/ OR data_win_eventdata_targetObject:/.*[Cc]urrent[Vv]ersion\\[Pp]rint\\.*/)
    pivot_on:
    - host
    window: 4h
  - name: Lateral movement or new account after SYSTEM compromise
    query: (data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3") OR data_win_system_eventID:"4720" OR data_win_system_eventID:"4732"
    pivot_on:
    - host
    window: 6h
