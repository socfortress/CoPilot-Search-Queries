name: New PortProxy Registry Entry Added
id: a54f842a-3713-4b45-8c84-5f136fdebd3c
version: 1
schema_version: "1.0"
date: "2024-03-25"
author: Andreas Hunkeler (@Karneades)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: a54f842a-3713-4b45-8c84-5f136fdebd3c
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the modification of the PortProxy registry key which is used for port
  forwarding. MITRE ATT&CK: T1090.

data_source:
  - Sysmon EventID 12/13/14 - Registry Events

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_win_system_eventID: "12"
              - term:
                  data_win_system_eventID: "13"
              - term:
                  data_win_system_eventID: "14"
            minimum_should_match: 1
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*\\\\Services\\\\PortProxy\\\\v4tov4\\\\tcp\\\\*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_image
    - data_win_eventdata_details

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*\Services\PortProxy\v4tov4\tcp\*'.

known_false_positives: >
  WSL2 network bridge PowerShell script used for WSL/Kubernetes/Docker (e.g.
  https://github.com/microsoft/WSL/issues/4150#issuecomment-504209723). Synergy
  Software KVM (https://symless.com/synergy). Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://www.fireeye.com/blog/threat-research/2019/01/bypassing-network-restrictions-through-rdp-tunneling.html
  - https://adepts.of0x.cc/netsh-portproxy-code/
  - https://www.dfirnotes.net/portproxy_detection/
  - https://attack.mitre.org/techniques/T1090/

response:
  message: >
    New PortProxy Registry Entry Added detected on host $agent_name$. Matched
    data_win_eventdata_targetObject: $data_win_eventdata_targetObject$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1090
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1090
  custom_tags:
    - portproxy
    - registry
    - entry
    - sysmon
    - lateral_movement
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13" OR data_win_system_eventID:"14") AND data_win_eventdata_targetObject:/.*\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\[Pp][Oo][Rr][Tt][Pp][Rr][Oo][Xx][Yy]\\[Vv]4[Tt][Oo][Vv]4\\[Tt][Cc][Pp]\\.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 322ed9ec-fcab-4f67-9a34-e7c6aef43614
    name: New Port Forwarding Rule Added Via Netsh.EXE
    reason: The netsh 'interface portproxy add v4tov4' command is what writes this PortProxy registry key; the process-creation event is the direct cause and shows the exact command line and parent.
  - id: 782d6f3e-4c5d-4b8c-92a3-1d05fed72e63
    name: RDP Port Forwarding Rule Added Via Netsh.EXE
    reason: A portproxy rule to port 3389 means RDP is being relayed through this host as a pivot for lateral movement.
  - id: cd5cfd80-aa5f-44c0-9c20-108c4ae12e3c
    name: New Firewall Rule Added Via Netsh.EXE
    reason: A listening portproxy only works if the listen port is allowed inbound, so attackers pair it with a netsh firewall allow rule.
  - id: 01aeb693-138d-49d2-9403-c4f52d7d3d62
    name: RDP Connection Allowed Via Netsh.EXE
    reason: Opening the firewall for RDP alongside a portproxy shows the host is being prepared as an RDP relay.
  - id: 3f6b7b62-61aa-45db-96bd-9c31b36b653c
    name: RDP Sensitive Settings Changed
    reason: Attackers enable or reconfigure RDP (fDenyTSConnections and similar) on the same host before forwarding traffic to it.
  - id: f38ce0b9-5e97-4b47-a211-7dc8d8b871da
    name: Potential RDP Tunneling Via Plink
    reason: Plink is the alternative tunnelling method to portproxy for exposing RDP; both appearing on one host indicates layered pivoting.
  - id: 327f48c1-a6db-4eb8-875a-f6981f1b0183
    name: Port Forwarding Activity Via SSH.EXE
    reason: SSH local/remote forwarding is the sibling tunnelling technique to a portproxy rule and often used by the same operator to chain pivots.
  - id: 8a3038e8-9c9d-46f8-b184-66234a160f6f
    name: Potential Remote Desktop Tunneling
    reason: Detects RDP tunneled over a forwarded port, the follow-on traffic that the portproxy rule enables.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: netsh portproxy / port-forward command and parent process
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Pp][Oo][Rr][Tt][Pp][Rr][Oo][Xx][Yy].*/
    pivot_on:
    - host
    window: 1h
  - name: Firewall opened or RDP enabled to support the relay
    query: (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Aa][Dd][Vv][Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll].*[Aa][Dd][Dd].*/) OR ((data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:/.*[Ff][Dd][Ee][Nn][Yy][Tt][Ss][Cc][Oo][Nn][Nn][Ee][Cc][Tt][Ii][Oo][Nn][Ss].*/ OR data_win_eventdata_targetObject:/.*[Ss][Hh][Aa][Rr][Ee][Dd][Aa][Cc][Cc][Ee][Ss][Ss]\\[Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll].*/))
    pivot_on:
    - host
    window: 2h
  - name: Inbound connections to the relay from internal hosts on forwarded ports
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:"false" AND (data_win_eventdata_destinationPort:"3389" OR data_win_eventdata_destinationPort:"445" OR data_win_eventdata_destinationPort:"5985" OR data_win_eventdata_destinationPort:"22" OR data_win_eventdata_destinationPort:"1433")
    pivot_on:
    - host
    window: 4h
  - name: Network logons to this host after relay set up
    query: data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"10")
    pivot_on:
    - host
    window: 4h
  - name: Alternate tunnelling tools on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\(plink|chisel|ngrok|frpc|socat)\.exe/ OR data_win_eventdata_commandLine:/.*[Ss][Ss][Hh].* -[LlRrDd] .*/)
    pivot_on:
    - host
    window: 2h
