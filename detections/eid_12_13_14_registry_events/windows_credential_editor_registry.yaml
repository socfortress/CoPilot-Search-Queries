name: Windows Credential Editor Registry
id: a6b33c02-8305-488f-8585-03cb2a7763f2
version: 1
schema_version: "1.0"
date: "2021-11-27"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: a6b33c02-8305-488f-8585-03cb2a7763f2
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the use of Windows Credential Editor (WCE). MITRE ATT&CK: T1003.001.

data_source:
  - Sysmon EventID 12/13/14 - Registry Events

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_win_system_eventID: "12"
              - term:
                  data_win_system_eventID: "13"
              - term:
                  data_win_system_eventID: "14"
            minimum_should_match: 1
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*Services\\\\WCESERVICE\\\\Start*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_image
    - data_win_eventdata_details

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*Services\WCESERVICE\Start*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.ampliasecurity.com/research/windows-credentials-editor/
  - https://attack.mitre.org/techniques/T1003/001/

response:
  message: >
    Windows Credential Editor Registry detected on host $agent_name$. Matched
    data_win_eventdata_targetObject: $data_win_eventdata_targetObject$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1003.001
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.001
  custom_tags:
    - credential
    - editor
    - registry
    - sysmon
    - credential_access
    - s0005
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13" OR data_win_system_eventID:"14") AND data_win_eventdata_targetObject:/.*[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\[Ww][Cc][Ee][Ss][Ee][Rr][Vv][Ii][Cc][Ee]\\[Ss][Tt][Aa][Rr][Tt].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7aa7009a-28b9-4344-8c1f-159489a390df
    name: HackTool - Windows Credential Editor (WCE) Execution
    reason: 'Same tool: the wce.exe process launch (-w/-s/-e/-g flags) that installs WCESERVICE is the direct precursor of this registry write.'
  - id: 4976aa50-8f41-45c6-8b15-ab3fc10e79ed
    name: Credential Dumping Tools Service Execution - System
    reason: WCE registers and starts a WCESERVICE service; System log 7045 for the same service name corroborates the registry key creation.
  - id: f0d1feba-4344-4ca9-8121-a6c97bd6df52
    name: Credential Dumping Tools Service Execution - Security
    reason: Security 4697 service-install event for WCESERVICE/other dumper services is the same install seen from the audit channel.
  - id: 8fbf3271-1ef6-4e94-8210-03c2317947f6
    name: Cred Dump Tools Dropped Files
    reason: WCE/dumper binaries and output files (wce.exe, wceaux.dll, dump output) are dropped to disk before and after the service is registered.
  - id: 857c8db3-c89b-42fb-882b-f681c7cf4da2
    name: Unsigned Image Loaded Into LSASS Process
    reason: WCE injects wceaux.dll into lsass.exe to read/modify cached logon credentials; this is the injection/image-load evidence.
  - id: f239b326-2f41-4d6b-9dfa-c846a60ef505
    name: Password Dumper Remote Thread in LSASS
    reason: WCE's credential read/modify path uses a remote thread in LSASS; confirms the service actually executed its credential theft.
  - id: 961d0ba2-3eea-4303-a930-2cf78bbfcc5e
    name: HackTool - Credential Dumping Tools Named Pipe Created
    reason: Dumper services (WCE, pwdump family) communicate via named pipes created when the service runs.
  - id: fdfcbd78-48f1-4a4b-90ac-d82241e368c5
    name: PsExec Service Execution
    reason: Harvested hashes/tickets from WCE are typically used next for pass-the-hash remote execution via PsExec services on other hosts.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: WCE execution and cred-editor command lines on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Ww][Cc][Ee](64|32)?\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Ww][Cc][Ee][Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ww][Cc][Ee][A-Za-z0-9_]*\.[Ee][Xx][Ee]\s+-[WwSsEeGgLlRr].*/ OR data_win_eventdata_hashes:*[Ww][Cc][Ee]*)
    pivot_on:
    - host
    window: 1h
  - name: LSASS access or injection (wceaux.dll / dumper) on this host
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"8" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"7" AND data_win_eventdata_image:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_imageLoaded:/.*[Ww][Cc][Ee][Aa][Uu][Xx].*/)
    pivot_on:
    - host
    window: 1h
  - name: WCE / dumper files dropped (wce.exe, wceaux.dll, wce_creds output)
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Ww][Cc][Ee][Aa][Uu][Xx]\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*\\[Ww][Cc][Ee](64|32)?\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetFilename:/.*[Ww][Cc][Ee]_[Cc][Rr][Ee][Dd][Ss].*/ OR data_win_eventdata_targetFilename:/.*\\(creds|hashes|pwdump)[A-Za-z0-9_]*\.(txt|dmp)/)
    pivot_on:
    - host
    window: 2h
  - name: Service-based remote execution used with harvested credentials
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Pp][Ss][Ee][Xx][Ee][Cc]|[Pp][Aa][Ee][Xx][Ee][Cc]|[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Ss][Cc]\.[Ee][Xx][Ee]\s+\\\\.*[Cc][Rr][Ee][Aa][Tt][Ee].*/)) OR (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\.*\\[Ii][Mm][Aa][Gg][Ee][Pp][Aa][Tt][Hh].*/)
    pivot_on:
    - host
    window: 4h
  - name: Network (type 3/9) logons by this account after credential theft
    query: data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"9") AND (data_win_eventdata_authenticationPackageName:"NTLM" OR data_win_eventdata_logonProcessName:*[Nn][Tt][Ll][Mm]*)
    pivot_on:
    - user
    window: 6h
