name: RedMimicry Winnti Playbook Registry Manipulation
id: 5b175490-b652-4b02-b1de-5b5b4083c5f8
version: 1
schema_version: "1.0"
date: "2021-11-27"
author: Alexander Rausch
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 5b175490-b652-4b02-b1de-5b5b4083c5f8
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects actions caused by the RedMimicry Winnti playbook. MITRE ATT&CK: T1112.

data_source:
  - Sysmon EventID 12/13/14 - Registry Events

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_win_system_eventID: "12"
              - term:
                  data_win_system_eventID: "13"
              - term:
                  data_win_system_eventID: "14"
            minimum_should_match: 1
        
        - wildcard:
            data_win_eventdata_targetObject:
              value: "*HKLM\\\\SOFTWARE\\\\Microsoft\\\\HTMLHelp\\\\data*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetObject
    - data_win_eventdata_image
    - data_win_eventdata_details

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon registry event logging (EventIDs 12/13/14) enabled in the
  Sysmon configuration for the monitored keys and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetObject matches
  '*HKLM\SOFTWARE\Microsoft\HTMLHelp\data*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://redmimicry.com
  - https://attack.mitre.org/techniques/T1112/

response:
  message: >
    RedMimicry Winnti Playbook Registry Manipulation detected on host
    $agent_name$. Matched data_win_eventdata_targetObject:
    $data_win_eventdata_targetObject$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1112
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetObject
      type: registry_key
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
  custom_tags:
    - redmimicry
    - winnti
    - playbook
    - registry
    - sysmon
    - persistence
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13" OR data_win_system_eventID:"14") AND data_win_eventdata_targetObject:/.*[Hh][Kk][Ll][Mm]\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Hh][Tt][Mm][Ll][Hh][Ee][Ll][Pp]\\[Dd][Aa][Tt][Aa].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 130c9e58-28ac-4f83-8574-0a4cc913b97e
    name: Potential Winnti Dropper Activity
    reason: "Precursor: the RedMimicry Winnti playbook drops gthread-3.6.dll, sigcmm-2.4.dll and Windows\\Temp\tmp.bat before the implant stores its config/payload under HKLM\\SOFTWARE\\Microsoft\\HTMLHelp\\data."
  - id: 95022b85-ff2a-49fa-939a-d7b8f56eeb9b
    name: HackTool - RedMimicry Winnti Playbook Execution
    reason: 'Same playbook, process side: rundll32/cmd launching the playbook DLLs or tmp.bat is the loader that writes the HTMLHelp registry data.'
  - id: 73d70463-75c9-4258-92c6-17500fe972f2
    name: Winnti Pipemon Characteristics
    reason: Winnti-family implant behaviour on the same host confirms the registry write is real Winnti tooling rather than a stray key.
  - id: 3121461b-5aa0-4a41-b910-66d25524edbb
    name: Winnti Malware HK University Campaign
    reason: Another Winnti execution pattern; co-occurrence on the host indicates an active Winnti intrusion.
  - id: 4c21b805-4dd7-469f-b47d-7383a8fcb437
    name: Potential Iviewers.DLL Sideloading
    reason: The RedMimicry Winnti playbook uses DLL sideloading of signed binaries to run its loader, which then stages data in the registry.
  - id: c74d7efc-8826-45d9-b8bb-f04fac9e4eff
    name: Run Once Task Configuration in Registry
    reason: 'Follow-on persistence: after staging payload in the registry the implant needs an autostart (RunOnce) to reload it after reboot.'
  - id: 24357373-078f-44ed-9ac4-6d334a668a11
    name: Direct Autorun Keys Modification
    reason: 'Follow-on persistence: reg.exe or a script writing Run keys to relaunch the loader that reads the HTMLHelp data blob.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Winnti playbook DLL/batch dropped to disk
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Gg][Tt][Hh][Rr][Ee][Aa][Dd]-3\.6\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*[Ss][Ii][Gg][Cc][Mm][Mm]-2\.4\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\[Tt][Ee][Mm][Pp]\[Tt][Mm][Pp]\.[Bb][Aa][Tt]/)
    pivot_on:
    - host
    window: 4h
  - name: Loader execution via rundll32/cmd with playbook artifacts
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*[Gg][Tt][Hh][Rr][Ee][Aa][Dd]-3\.6.*/ OR data_win_eventdata_commandLine:/.*[Ss][Ii][Gg][Cc][Mm][Mm]-2\.4.*/ OR data_win_eventdata_commandLine:/.*[Tt][Mm][Pp]\.[Bb][Aa][Tt].*/ OR data_win_eventdata_commandLine:/.*[Hh][Tt][Mm][Ll][Hh][Ee][Ll][Pp].*/)
    pivot_on:
    - host
    window: 2h
  - name: Registry persistence (Run/service/ServiceDll/Winlogon/IFEO) on host
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\[Rr][Uu][Nn].*/ OR data_win_eventdata_targetObject:/.*[Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt]\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\.*/ OR data_win_eventdata_targetObject:/.*[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Dd][Ll][Ll].*/ OR data_win_eventdata_targetObject:/.*[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]\[Ss][Hh][Ee][Ll][Ll].*/ OR data_win_eventdata_targetObject:/.*[Ii][Mm][Aa][Gg][Ee] [Ff][Ii][Ll][Ee] [Ee][Xx][Ee][Cc][Uu][Tt][Ii][Oo][Nn] [Oo][Pp][Tt][Ii][Oo][Nn][Ss].*/)
    pivot_on:
    - host
    window: 4h
  - name: Playbook DLLs loaded into a process
    query: data_win_system_eventID:"7" AND (data_win_eventdata_imageLoaded:/.*[Gg][Tt][Hh][Rr][Ee][Aa][Dd]-3\.6\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*[Ss][Ii][Gg][Cc][Mm][Mm]-2\.4\.[Dd][Ll][Ll]/)
    pivot_on:
    - host
    window: 2h
  - name: Outbound connections from rundll32/cmd (implant C2)
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/) AND data_win_eventdata_initiated:"true"
    pivot_on:
    - host
    window: 2h
