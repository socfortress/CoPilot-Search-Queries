name: Clear PowerShell History - PowerShell Module
id: f99276ad-d122-4989-a09a-d00904a5f9d2
version: 1
schema_version: "1.0"
date: "2022-12-02"
author: Ilyas Ochkov, Jonhnathan Ribeiro, Daniil Yugoslavskiy, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: f99276ad-d122-4989-a09a-d00904a5f9d2
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects keywords that could indicate clearing PowerShell history. MITRE
  ATT&CK: T1070.003.

data_source:
  - PowerShell Module Logging EventID 4103

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4103"
        
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_payload:
                          value: "*Set-PSReadlineOption*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_payload:
                          value: "*–HistorySaveStyle*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_payload:
                          value: "*SaveNothing*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_payload:
                          value: "*Set-PSReadlineOption*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_payload:
                          value: "*-HistorySaveStyle*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_payload:
                          value: "*SaveNothing*"
                          case_insensitive: true
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_payload:
                                value: "*del*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_payload:
                                value: "*Remove-Item*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_payload:
                                value: "*rm*"
                                case_insensitive: true
                        minimum_should_match: 1
                    - wildcard:
                        data_win_eventdata_payload:
                          value: "*(Get-PSReadlineOption).HistorySavePath*"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_payload
    - data_win_eventdata_contextInfo
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Module Logging (EventID 4103) enabled via GPO and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where data_win_eventdata_payload
  matches '*Set-PSReadlineOption*'; data_win_eventdata_payload matches
  '*–HistorySaveStyle*'; data_win_eventdata_payload matches '*SaveNothing*',
  among other conditions.

known_false_positives: >
  Legitimate PowerShell scripts. Baseline expected activity in your environment
  and tune this detection before relying on it for automated response.

references:
  - https://gist.github.com/hook-s3c/7363a856c3cdbadeb71085147f042c1a
  - https://attack.mitre.org/techniques/T1070/003/

response:
  message: >
    Clear PowerShell History - PowerShell Module detected on host $agent_name$.
    Matched data_win_eventdata_payload: $data_win_eventdata_payload$. Matched
    data_win_eventdata_contextInfo: $data_win_eventdata_contextInfo$. MITRE
    ATT&CK: T1070.003
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_payload
      type: powershell_script
    - field: data_win_eventdata_contextInfo
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1070.003
  custom_tags:
    - clear
    - powershell
    - history
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4103" AND ((data_win_eventdata_payload:/.*[Ss][Ee][Tt]-[Pp][Ss][Rr][Ee][Aa][Dd][Ll][Ii][Nn][Ee][Oo][Pp][Tt][Ii][Oo][Nn].*/ AND data_win_eventdata_payload:/.*–[Hh][Ii][Ss][Tt][Oo][Rr][Yy][Ss][Aa][Vv][Ee][Ss][Tt][Yy][Ll][Ee].*/ AND data_win_eventdata_payload:/.*[Ss][Aa][Vv][Ee][Nn][Oo][Tt][Hh][Ii][Nn][Gg].*/) OR (data_win_eventdata_payload:/.*[Ss][Ee][Tt]-[Pp][Ss][Rr][Ee][Aa][Dd][Ll][Ii][Nn][Ee][Oo][Pp][Tt][Ii][Oo][Nn].*/ AND data_win_eventdata_payload:/.*-[Hh][Ii][Ss][Tt][Oo][Rr][Yy][Ss][Aa][Vv][Ee][Ss][Tt][Yy][Ll][Ee].*/ AND data_win_eventdata_payload:/.*[Ss][Aa][Vv][Ee][Nn][Oo][Tt][Hh][Ii][Nn][Gg].*/) OR ((data_win_eventdata_payload:/.*[Dd][Ee][Ll].*/ OR data_win_eventdata_payload:/.*[Rr][Ee][Mm][Oo][Vv][Ee]-[Ii][Tt][Ee][Mm].*/ OR data_win_eventdata_payload:/.*[Rr][Mm].*/) AND data_win_eventdata_payload:/.*\([Gg][Ee][Tt]-[Pp][Ss][Rr][Ee][Aa][Dd][Ll][Ii][Nn][Ee][Oo][Pp][Tt][Ii][Oo][Nn]\)\.[Hh][Ii][Ss][Tt][Oo][Rr][Yy][Ss][Aa][Vv][Ee][Pp][Aa][Tt][Hh].*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 26b692dc-1722-49b2-b496-a8258aa6371d
    name: Clear PowerShell History - PowerShell
    reason: Same PSReadLine history-wipe behaviour seen via EID 4104 script block logging; co-fires and confirms the exact script that cleared history.
  - id: 602f5669-6927-4688-84db-0d4b7afb2150
    name: Disable Powershell Command History
    reason: Set-PSReadlineOption -HistorySaveStyle SaveNothing prevents future command capture; attacker pairing forward-looking suppression with clearing past history.
  - id: bde47d4b-9987-405c-94c7-b080410e8ea7
    name: Clearing Windows Console History
    reason: Removal of ConsoleHost_history.txt is the same anti-forensic goal executed through a different command; indicates operator hiding interactive commands.
  - id: fecfd1a1-cc78-4313-a1ea-2ee2e8ec27a7
    name: PowerShell Logging Disabled Via Registry Key Tampering
    reason: History clearing is often paired with disabling script block/module logging so later PowerShell activity is invisible.
  - id: fdb829a8-db84-4832-b64b-3e964cd44f01
    name: Windows Eventlog Cleared Via Wevtutil
    reason: 'Next anti-forensic step: after wiping PSReadLine history the operator clears Windows event logs with wevtutil cl.'
  - id: d99b79d2-0a6f-4f46-ad8b-260b6e17f982
    name: Security Eventlog Cleared
    reason: EID 1102 confirms the cleanup phase escalated from shell history to Security log erasure on the same host.
  - id: de41232e-12e8-49fa-86bc-c05c7e722df9
    name: Suspicious PowerShell Download - PoshModule
    reason: History is wiped after hands-on-keyboard payload staging; download cradles in the same session are the activity being covered up.
  - id: c1344fa2-323b-4d2e-9176-84b4d4821c88
    name: Windows Defender Exclusions Added - PowerShell
    reason: Interactive operators typically weaken Defender (exclusions) in the same session before tooling, then clear history to hide it.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Event log clearing and audit-log tampering on host
    query: (data_win_system_eventID:"1102" OR data_win_system_eventID:"104" OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll].*[Cc][Ll].*/ OR data_win_eventdata_commandLine:/.*[Cc][Ll][Ee][Aa][Rr]-[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg].*/ OR data_win_eventdata_commandLine:/.*[Aa][Uu][Dd][Ii][Tt][Pp][Oo][Ll].*/)))
    pivot_on:
    - host
    window: 2h
  - name: Deletion of PowerShell/console history files
    query: (data_win_system_eventID:"23" OR data_win_system_eventID:"26" OR data_win_system_eventID:"1") AND (data_win_eventdata_targetFilename:/.*[Cc][Oo][Nn][Ss][Oo][Ll][Ee][Hh][Oo][Ss][Tt]_[Hh][Ii][Ss][Tt][Oo][Rr][Yy].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Nn][Ss][Oo][Ll][Ee][Hh][Oo][Ss][Tt]_[Hh][Ii][Ss][Tt][Oo][Rr][Yy].*/ OR data_win_eventdata_commandLine:/.*[Pp][Ss][Rr][Ee][Aa][Dd][Ll][Ii][Nn][Ee].*[Hh][Ii][Ss][Tt][Oo][Rr][Yy].*/)
    pivot_on:
    - host
    window: 2h
  - name: PowerShell logging / Defender tampering via registry
    query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*[Ss][Cc][Rr][Ii][Pp][Tt][Bb][Ll][Oo][Cc][Kk][Ll][Oo][Gg][Gg][Ii][Nn][Gg].*/ OR data_win_eventdata_targetObject:/.*[Mm][Oo][Dd][Uu][Ll][Ee][Ll][Oo][Gg][Gg][Ii][Nn][Gg].*/ OR data_win_eventdata_targetObject:/.*[Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr].*[Ee][Xx][Cc][Ll][Uu][Ss][Ii][Oo][Nn][Ss].*/ OR data_win_eventdata_targetObject:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee][Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg].*/)
    pivot_on:
    - host
    window: 4h
  - name: Preceding download cradles and encoded PowerShell script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Ff][Rr][Oo][Mm][Bb][Aa][Ss][Ee]64[Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Aa][Mm][Ss][Ii][Uu][Tt][Ii][Ll][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Tt][Aa][Rr][Tt]-[Bb][Ii][Tt][Ss][Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr].*/)
    pivot_on:
    - host
    window: 6h
  - name: Shell-spawned discovery and persistence commands on host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Nn][Ee][Tt] [Uu][Ss][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt] [Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss].*/[Cc][Rr][Ee][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Gg] [Aa][Dd][Dd].*[Rr][Uu][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ww][Hh][Oo][Aa][Mm][Ii].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ll][Tt][Ee][Ss][Tt].*/)
    pivot_on:
    - host
    window: 2h
