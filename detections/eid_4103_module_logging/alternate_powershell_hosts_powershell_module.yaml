name: Alternate PowerShell Hosts - PowerShell Module
id: 64e8e417-c19a-475a-8d19-98ea705394cc
version: 1
schema_version: "1.0"
date: "2025-10-17"
author: Roberto Rodriguez @Cyb3rWard0g
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 64e8e417-c19a-475a-8d19-98ea705394cc
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects alternate PowerShell hosts potentially bypassing detections looking
  for powershell.exe. MITRE ATT&CK: T1059.001.

data_source:
  - PowerShell Module Logging EventID 4103

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4103"
        
        - wildcard:
            data_win_eventdata_contextInfo: "*"
        - exists:
            field: "data_win_eventdata_contextInfo"
        - exists:
            field: "data_win_eventdata_payload"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_contextInfo:
                          value: "*= powershell*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_contextInfo:
                          value: "*= C:\\\\Windows\\\\System32\\\\WindowsPowerShell\\\\v1.0\\\\powershell*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_contextInfo:
                          value: "*= C:\\\\Windows\\\\SysWOW64\\\\WindowsPowerShell\\\\v1.0\\\\powershell*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_contextInfo:
                          value: "*= C:/Windows/System32/WindowsPowerShell/v1.0/powershell*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_contextInfo:
                          value: "*= C:/Windows/SysWOW64/WindowsPowerShell/v1.0/powershell*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_contextInfo:
                          value: "*= \\\\\\?\\?\\\\C:Windows\\\\System32\\\\WindowsPowerShell\\\\v1.0\\\\powershell*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_contextInfo:
                          value: "*= \\\\\\?\\?\\\\C:Windows\\\\SysWOW64\\\\WindowsPowerShell\\\\v1.0\\\\powershell*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_contextInfo:
                          value: "*= C:\\\\WINDOWS\\\\System32\\\\sdiagnhost.exe -Embedding*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_contextInfo:
                          value: "*ConfigSyncRun.exe*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_contextInfo:
                          value: "*C:\\\\Windows\\\\system32\\\\dsac.exe*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_contextInfo:
                          value: "*C:\\\\Windows\\\\system32\\\\wsmprovhost.exe -Embedding*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_payload:
                          value: "*Update-Help*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_payload:
                          value: "*Failed to update Help for the module*"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_contextInfo
    - data_win_eventdata_payload
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Module Logging (EventID 4103) enabled via GPO and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where data_win_eventdata_contextInfo
  matches '*'; data_win_eventdata_contextInfo matches '*= powershell*';
  data_win_eventdata_contextInfo matches '*=
  C:\Windows\System32\WindowsPowerShell\v1.0\powershell*', among other
  conditions.

known_false_positives: >
  Programs using PowerShell directly without invocation of a dedicated
  interpreter. MSP Detection Searcher. Citrix ConfigSync.ps1. Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://threathunterplaybook.com/hunts/windows/190610-PwshAlternateHosts/notebook.html
  - https://attack.mitre.org/techniques/T1059/001/

response:
  message: >
    Alternate PowerShell Hosts - PowerShell Module detected on host
    $agent_name$. Matched data_win_eventdata_contextInfo:
    $data_win_eventdata_contextInfo$. Matched data_win_eventdata_payload:
    $data_win_eventdata_payload$. MITRE ATT&CK: T1059.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_contextInfo
      type: other
    - field: data_win_eventdata_payload
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
  custom_tags:
    - alternate
    - powershell
    - hosts
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4103" AND data_win_eventdata_contextInfo:/.*/ AND _exists_:data_win_eventdata_contextInfo AND _exists_:data_win_eventdata_payload AND NOT (data_win_eventdata_contextInfo:/.*= [Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ OR data_win_eventdata_contextInfo:/.*= [Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\\[Vv]1\.0\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ OR data_win_eventdata_contextInfo:/.*= [Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Ww][Oo][Ww]64\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\\[Vv]1\.0\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ OR data_win_eventdata_contextInfo:/.*= [Cc]:\/[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\/[Ss][Yy][Ss][Tt][Ee][Mm]32\/[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\/[Vv]1\.0\/[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ OR data_win_eventdata_contextInfo:/.*= [Cc]:\/[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\/[Ss][Yy][Ss][Ww][Oo][Ww]64\/[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\/[Vv]1\.0\/[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ OR data_win_eventdata_contextInfo:/.*= \\\?\?\\[Cc]:[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\\[Vv]1\.0\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ OR data_win_eventdata_contextInfo:/.*= \\\?\?\\[Cc]:[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Ww][Oo][Ww]64\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\\[Vv]1\.0\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ OR data_win_eventdata_contextInfo:/.*= [Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ss][Dd][Ii][Aa][Gg][Nn][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee] -[Ee][Mm][Bb][Ee][Dd][Dd][Ii][Nn][Gg].*/ OR data_win_eventdata_contextInfo:/.*[Cc][Oo][Nn][Ff][Ii][Gg][Ss][Yy][Nn][Cc][Rr][Uu][Nn]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_contextInfo:/.*[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Dd][Ss][Aa][Cc]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_contextInfo:/.*[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ww][Ss][Mm][Pp][Rr][Oo][Vv][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee] -[Ee][Mm][Bb][Ee][Dd][Dd][Ii][Nn][Gg].*/ OR data_win_eventdata_payload:/.*[Uu][Pp][Dd][Aa][Tt][Ee]-[Hh][Ee][Ll][Pp].*/ OR data_win_eventdata_payload:/.*[Ff][Aa][Ii][Ll][Ee][Dd] [Tt][Oo] [Uu][Pp][Dd][Aa][Tt][Ee] [Hh][Ee][Ll][Pp] [Ff][Oo][Rr] [Tt][Hh][Ee] [Mm][Oo][Dd][Uu][Ll][Ee].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 6812a10b-60ea-420c-832f-dfcc33b646ba
    name: Potential PowerShell Execution Via DLL
    reason: rundll32/DLL-loaded System.Management.Automation is the classic way to run PowerShell in a non-powershell.exe host, producing exactly this 4103 host-name mismatch
  - id: 96b9f619-aa91-478f-bacb-c3e50f8df575
    name: Remote PowerShell Session (PS Module)
    reason: wsmprovhost-style remoting is a legitimate alternate host; the same 4103 telemetry confirms or rules out lateral movement as the source
  - id: 734f8d9b-42b8-41b2-bcf5-abaf49d5a3c8
    name: Remote PowerShell Session Host Process (WinRM)
    reason: process-creation view of wsmprovhost.exe, tells whether the alternate host is inbound WinRM remoting
  - id: de41232e-12e8-49fa-86bc-c05c7e722df9
    name: Suspicious PowerShell Download - PoshModule
    reason: typical next step once PowerShell runs in an unmonitored host is a download cradle fetching the stage-2 payload
  - id: 8d31a8ce-46b5-4dd6-bdc3-680931f1db86
    name: Bad Opsec Powershell Code Artifacts
    reason: offensive-framework script artifacts in the same module log show the alternate host is running attacker tooling
  - id: 30edb182-aa75-42c0-b0a9-e998bb29067c
    name: Potential AMSI Bypass Via .NET Reflection
    reason: custom PowerShell hosts are used to dodge detections and are often paired with an AMSI bypass before payload load
  - id: ea9bf0fa-edec-4fb8-8b78-b119f2528186
    name: Windows Defender AMSI Trigger Detected
    reason: a Defender AMSI hit on content run inside the non-standard host confirms the script was malicious
  - id: b3512211-c67e-4707-bedc-66efc7848863
    name: Potential PowerShell Downgrade Attack
    reason: PowerShell v2 downgrade is another evasion of PowerShell logging, often combined with host-substitution tradecraft
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Non-PowerShell processes loading the PowerShell engine
    query: data_win_system_eventID:"7" AND data_win_eventdata_imageLoaded:*System.Management.Automation* AND NOT (data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]_[Ii][Ss][Ee]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
  - name: Script blocks with download cradles or AMSI/reflection tampering
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*DownloadString* OR data_win_eventdata_scriptBlockText:*DownloadFile* OR data_win_eventdata_scriptBlockText:*Invoke-WebRequest* OR data_win_eventdata_scriptBlockText:*Net.WebClient* OR data_win_eventdata_scriptBlockText:*FromBase64String* OR data_win_eventdata_scriptBlockText:*AmsiUtils* OR data_win_eventdata_scriptBlockText:*Reflection.Assembly*)
    pivot_on:
    - host
    window: 1h
  - name: Outbound connections from rundll32/mshta/InstallUtil/wsmprovhost/msbuild
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ss][Mm][Pp][Rr][Oo][Vv][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Bb][Uu][Ii][Ll][Dd]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
  - name: WinRM host or PowerShell-engine invocation from other binaries
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ww][Ss][Mm][Pp][Rr][Oo][Vv][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:*System.Management.Automation* OR data_win_eventdata_commandLine:*[Ee]ncoded[Cc]ommand*)
    pivot_on:
    - host
    window: 2h
  - name: Autorun persistence written near the alternate host activity
    query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:*CurrentVersion\\Run* OR data_win_eventdata_targetObject:*Winlogon\\Shell* OR data_win_eventdata_targetObject:*Winlogon\\Userinit*)
    pivot_on:
    - host
    window: 4h
