[Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Dd][Ss][Aa][Cc]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_contextInfo:/.*[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ww][Ss][Mm][Pp][Rr][Oo][Vv][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee] -[Ee][Mm][Bb][Ee][Dd][Dd][Ii][Nn][Gg].*/ OR data_win_eventdata_payload:/.*[Uu][Pp][Dd][Aa][Tt][Ee]-[Hh][Ee][Ll][Pp].*/ OR data_win_eventdata_payload:/.*[Ff][Aa][Ii][Ll][Ee][Dd] [Tt][Oo] [Uu][Pp][Dd][Aa][Tt][Ee] [Hh][Ee][Ll][Pp] [Ff][Oo][Rr] [Tt][Hh][Ee] [Mm][Oo][Dd][Uu][Ll][Ee].*/)

