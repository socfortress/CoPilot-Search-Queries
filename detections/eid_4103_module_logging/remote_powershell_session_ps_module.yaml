name: Remote PowerShell Session (PS Module)
id: 96b9f619-aa91-478f-bacb-c3e50f8df575
version: 1
schema_version: "1.0"
date: "2023-01-20"
author: Roberto Rodriguez @Cyb3rWard0g, Tim Shelton
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 96b9f619-aa91-478f-bacb-c3e50f8df575
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects remote PowerShell sessions. MITRE ATT&CK: T1059.001, T1021.006.

data_source:
  - PowerShell Module Logging EventID 4103

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4103"
        
        - wildcard:
            data_win_eventdata_contextInfo:
              value: "* = ServerRemoteHost *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_contextInfo:
              value: "*wsmprovhost.exe*"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_contextInfo"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_contextInfo:
                    value: "*\\\\Windows\\\\system32\\\\WindowsPowerShell\\\\v1.0\\\\Modules\\\\Microsoft.PowerShell.Archive\\\\Microsoft.PowerShell.Archive.psm1*"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_contextInfo
    - data_win_eventdata_payload
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Module Logging (EventID 4103) enabled via GPO and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where data_win_eventdata_contextInfo
  matches '* = ServerRemoteHost *'; data_win_eventdata_contextInfo matches
  '*wsmprovhost.exe*'; data_win_eventdata_contextInfo matches
  '*\Windows\system32\WindowsPowerShell\v1.0\Modules\Microsoft.PowerShell.Archive\Microsoft.PowerShell.Archive.psm1*'.

known_false_positives: >
  Legitimate use remote PowerShell sessions. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://threathunterplaybook.com/hunts/windows/190511-RemotePwshExecution/notebook.html
  - https://attack.mitre.org/techniques/T1059/001/
  - https://attack.mitre.org/techniques/T1021/006/

response:
  message: >
    Remote PowerShell Session (PS Module) detected on host $agent_name$. Matched
    data_win_eventdata_contextInfo: $data_win_eventdata_contextInfo$. Matched
    data_win_eventdata_payload: $data_win_eventdata_payload$. MITRE ATT&CK:
    T1059.001, T1021.006
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_contextInfo
      type: other
    - field: data_win_eventdata_payload
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
    - T1021.006
  custom_tags:
    - powershell
    - session
    - module
    - execution
    - lateral_movement
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4103" AND data_win_eventdata_contextInfo:/.* = [Ss][Ee][Rr][Vv][Ee][Rr][Rr][Ee][Mm][Oo][Tt][Ee][Hh][Oo][Ss][Tt] .*/ AND data_win_eventdata_contextInfo:/.*[Ww][Ss][Mm][Pp][Rr][Oo][Vv][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee].*/ AND _exists_:data_win_eventdata_contextInfo AND NOT (data_win_eventdata_contextInfo:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\\[Vv]1\.0\\[Mm][Oo][Dd][Uu][Ll][Ee][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\.[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Aa][Rr][Cc][Hh][Ii][Vv][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\.[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Aa][Rr][Cc][Hh][Ii][Vv][Ee]\.[Pp][Ss][Mm]1.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c539afac-c12a-46ed-b1bd-5a5567c9f045
    name: Potential Remote PowerShell Session Initiated
    reason: 'Network-side view of the same WinRM session: inbound connection to 5985/5986 immediately precedes the wsmprovhost-hosted 4103 module log.'
  - id: 734f8d9b-42b8-41b2-bcf5-abaf49d5a3c8
    name: Remote PowerShell Session Host Process (WinRM)
    reason: Process-creation of wsmprovhost.exe is the host process of this same inbound remoting session, corroborating it from the Sysmon side.
  - id: 5cc2cda8-f261-4d88-a2de-e9e193c86716
    name: Suspicious Processes Spawned by WinRM
    reason: 'Follow-on: the remote operator typically spawns cmd/net/whoami children from the WinRM host once connected.'
  - id: ad1f4bb9-8dfb-4765-adb6-2a7cfb6c0f94
    name: Suspicious WSMAN Provider Image Loads
    reason: Loading of WSMAN provider DLLs into non-standard processes is the signature of PowerShell remoting being hosted or abused, co-occurring with the session.
  - id: 79df3f68-dccb-48e9-9171-b75cbc37c51d
    name: Potential Lateral Movement via Windows Remote Shell
    reason: WinRS is the alternative WinRM lateral-movement channel; an actor using remoting often mixes PS remoting and winrs against the same targets.
  - id: a197e378-d31b-41c0-9635-cfdf1c1bb423
    name: HackTool - WinRM Access Via Evil-WinRM
    reason: Evil-WinRM operator tooling produces exactly this inbound wsmprovhost session on the victim; confirms attacker-driven rather than admin remoting.
  - id: 9df0dd3a-1a5c-47e3-a2bc-30ed177646a0
    name: Remote Code Execute via Winrm.vbs
    reason: Another WinRM-based remote execution path used for lateral movement, likely from the same source host.
  - id: cb909b3e-512b-11ec-aa31-3e22fbd008af
    name: Possible Lateral Movement PowerShell Spawn
    reason: PowerShell spawned by remote-execution parents (WinRM/WMI/DCOM) is the process-level consequence of the remote session landing.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Inbound WinRM connections (5985/5986) to this host
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:"false" AND (data_win_eventdata_destinationPort:"5985" OR data_win_eventdata_destinationPort:"5986")
    pivot_on:
    - host
    window: 1h
  - name: Processes spawned by WinRM host wsmprovhost
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Ww][Ss][Mm][Pp][Rr][Oo][Vv][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Network logons (type 3) and explicit-credential logons to this host
    query: (data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3" AND NOT data_win_eventdata_targetUserName:/.*\$/) OR data_win_system_eventID:"4648"
    pivot_on:
    - host
    - user
    window: 1h
  - name: 'Remote operator script blocks: download, encoding, AMSI and credential access'
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*DownloadString* OR data_win_eventdata_scriptBlockText:*Invoke\-WebRequest* OR data_win_eventdata_scriptBlockText:*FromBase64String* OR data_win_eventdata_scriptBlockText:*AmsiUtils* OR data_win_eventdata_scriptBlockText:*Get\-Credential* OR data_win_eventdata_scriptBlockText:*Invoke\-Mimikatz* OR data_win_eventdata_scriptBlockText:*sekurlsa*)
    pivot_on:
    - host
    window: 1h
  - name: Staging, persistence and tooling dropped after remote session
    query: (data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\(Temp|ProgramData|Users\\Public)\\.*\.(exe|dll|ps1|bat|zip)/)) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:*schtasks* OR data_win_eventdata_commandLine:*sc.exe* OR data_win_eventdata_commandLine:*"net user"* OR data_win_eventdata_commandLine:*"net localgroup"*))
    pivot_on:
    - host
    window: 2h
