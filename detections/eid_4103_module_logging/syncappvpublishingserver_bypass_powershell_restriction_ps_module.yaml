name: SyncAppvPublishingServer Bypass Powershell Restriction - PS Module
id: fe5ce7eb-dad8-467c-84a9-31ec23bd644a
version: 1
schema_version: "1.0"
date: "2022-12-02"
author: Ensar Şamil, @sblmsrsn, OSCD Community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: fe5ce7eb-dad8-467c-84a9-31ec23bd644a
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects SyncAppvPublishingServer process execution which usually utilized by
  adversaries to bypass PowerShell execution restrictions. MITRE ATT&CK: T1218.

data_source:
  - PowerShell Module Logging EventID 4103

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4103"
        
        - wildcard:
            data_win_eventdata_contextInfo:
              value: "*SyncAppvPublishingServer.exe*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_contextInfo
    - data_win_eventdata_payload
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Module Logging (EventID 4103) enabled via GPO and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where data_win_eventdata_contextInfo
  matches '*SyncAppvPublishingServer.exe*'.

known_false_positives: >
  App-V clients. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://lolbas-project.github.io/lolbas/Binaries/Syncappvpublishingserver/
  - https://attack.mitre.org/techniques/T1218/

response:
  message: >
    SyncAppvPublishingServer Bypass Powershell Restriction - PS Module detected
    on host $agent_name$. Matched data_win_eventdata_contextInfo:
    $data_win_eventdata_contextInfo$. Matched data_win_eventdata_payload:
    $data_win_eventdata_payload$. MITRE ATT&CK: T1218
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_contextInfo
      type: other
    - field: data_win_eventdata_payload
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218
  custom_tags:
    - syncappvpublishingserver
    - bypass
    - powershell
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4103" AND data_win_eventdata_contextInfo:/.*[Ss][Yy][Nn][Cc][Aa][Pp][Pp][Vv][Pp][Uu][Bb][Ll][Ii][Ss][Hh][Ii][Nn][Gg][Ss][Ee][Rr][Vv][Ee][Rr]\.[Ee][Xx][Ee].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: fbd7c32d-db2a-4418-b92c-566eb8911133
    name: SyncAppvPublishingServer Execute Arbitrary PowerShell Code
    reason: Same LOLBin seen at process creation (Sysmon 1); confirms the launcher command line and parent process behind the 4103 module-logging hit.
  - id: 36475a7d-0f6d-4dce-9b01-6aeb473bbaf1
    name: SyncAppvPublishingServer VBS Execute Arbitrary PowerShell Code
    reason: SyncAppvPublishingServer.vbs is the script-host variant of the same PowerShell-restriction bypass; both variants point to the same operator tradecraft.
  - id: 9c7e131a-0f2c-4ae0-9d43-b04f4e266d43
    name: Uncommon Child Process Of Appvlp.EXE
    reason: Appvlp.exe is the sibling App-V signed-binary proxy used to launch arbitrary children; an operator who has SyncAppvPublishingServer blocked often pivots to it.
  - id: 09576804-7a05-458e-a817-eb718ca91f54
    name: Suspicious PowerShell IEX Execution Patterns
    reason: The code smuggled through SyncAppvPublishingServer is typically an IEX payload stage; this is the likely next step.
  - id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
    name: PowerShell Download and Execution Cradles
    reason: The bypass is used to run a download cradle that pulls a second-stage payload from the network.
  - id: 88f680b8-070e-402c-ae11-d2914f2257f1
    name: PowerShell Base64 Encoded IEX Cmdlet
    reason: Payload passed through the App-V launcher is commonly base64-encoded IEX content to evade logging and inspection.
  - id: cf2e938e-9a3e-4fe8-a347-411642b28a9f
    name: Potential PowerShell Execution Policy Tampering - ProcCreation
    reason: 'Co-occurring effort to defeat PowerShell restrictions: attackers combine policy tampering with the App-V bypass when constrained execution blocks them.'
  - id: 1321dc4e-a1fe-481d-a016-52c45f0c8b4f
    name: Windows Defender Exclusions Added
    reason: 'Common follow-on after a restriction bypass: add exclusions so the staged payload survives AV scanning.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: SyncAppvPublishingServer / Appvlp process launch with command line
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Ss][Yy][Nn][Cc][Aa][Pp][Pp][Vv][Pp][Uu][Bb][Ll][Ii][Ss][Hh][Ii][Nn][Gg][Ss][Ee][Rr][Vv][Ee][Rr].*/ OR data_win_eventdata_image:/.*[Aa][Pp][Pp][Vv][Ll][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Ss][Yy][Nn][Cc][Aa][Pp][Pp][Vv][Pp][Uu][Bb][Ll][Ii][Ss][Hh][Ii][Nn][Gg][Ss][Ee][Rr][Vv][Ee][Rr].*/)
    pivot_on:
    - host
    window: 1h
  - name: PowerShell script blocks with download cradle, IEX or encoded payload
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*DownloadString* OR data_win_eventdata_scriptBlockText:*DownloadFile* OR data_win_eventdata_scriptBlockText:*Invoke-WebRequest* OR data_win_eventdata_scriptBlockText:*Net.WebClient* OR data_win_eventdata_scriptBlockText:*FromBase64String* OR data_win_eventdata_scriptBlockText:*Invoke-Expression*)
    pivot_on:
    - host
    window: 1h
  - name: Outbound connections from PowerShell after bypass
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt])\.?[Ee]?[Xx]?[Ee]?/
    pivot_on:
    - host
    window: 1h
  - name: Executable or script files dropped in user-writable paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(\[Tt]emp\|\[Aa]pp[Dd]ata\|\[Pp]ublic\|\[Pp]rogram[Dd]ata\).*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Pp][Ss]1|[Vv][Bb][Ss]|[Jj][Ss]|[Bb][Aa][Tt])/
    pivot_on:
    - host
    window: 2h
  - name: Defender tampering or execution-policy changes via PowerShell
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:*Add-MpPreference* OR data_win_eventdata_commandLine:*Set-MpPreference* OR data_win_eventdata_commandLine:*ExclusionPath* OR data_win_eventdata_commandLine:*Set-ExecutionPolicy* OR data_win_eventdata_commandLine:*DisableRealtimeMonitoring*)
    pivot_on:
    - host
    window: 2h
