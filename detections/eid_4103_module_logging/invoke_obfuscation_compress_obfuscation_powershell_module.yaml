name: Invoke-Obfuscation COMPRESS OBFUSCATION - PowerShell Module
id: 7034cbbb-cc55-4dc2-8dad-36c0b942e8f1
version: 1
schema_version: "1.0"
date: "2022-11-29"
author: Timur Zinniatullin, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 7034cbbb-cc55-4dc2-8dad-36c0b942e8f1
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects Obfuscated Powershell via COMPRESS OBFUSCATION. MITRE ATT&CK: T1027,
  T1059.001.

data_source:
  - PowerShell Module Logging EventID 4103

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4103"
        
        - wildcard:
            data_win_eventdata_payload:
              value: "*new-object*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_payload:
              value: "*text.encoding]::ascii*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_payload:
                    value: "*system.io.compression.deflatestream*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_payload:
                    value: "*system.io.streamreader*"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_payload:
              value: "*readtoend"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_payload
    - data_win_eventdata_contextInfo
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Module Logging (EventID 4103) enabled via GPO and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where data_win_eventdata_payload
  matches '*new-object*'; data_win_eventdata_payload matches
  '*text.encoding]::ascii*'; data_win_eventdata_payload matches
  '*system.io.compression.deflatestream*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/SigmaHQ/sigma/issues/1009
  - https://attack.mitre.org/techniques/T1027/
  - https://attack.mitre.org/techniques/T1059/001/

response:
  message: >
    Invoke-Obfuscation COMPRESS OBFUSCATION - PowerShell Module detected on host
    $agent_name$. Matched data_win_eventdata_payload:
    $data_win_eventdata_payload$. Matched data_win_eventdata_contextInfo:
    $data_win_eventdata_contextInfo$. MITRE ATT&CK: T1027, T1059.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_payload
      type: powershell_script
    - field: data_win_eventdata_contextInfo
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1027
    - T1059.001
  custom_tags:
    - invoke
    - obfuscation
    - compress
    - powershell
    - stealth
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4103" AND data_win_eventdata_payload:/.*[Nn][Ee][Ww]-[Oo][Bb][Jj][Ee][Cc][Tt].*/ AND data_win_eventdata_payload:/.*[Tt][Ee][Xx][Tt]\.[Ee][Nn][Cc][Oo][Dd][Ii][Nn][Gg]\]::[Aa][Ss][Cc][Ii][Ii].*/ AND (data_win_eventdata_payload:/.*[Ss][Yy][Ss][Tt][Ee][Mm]\.[Ii][Oo]\.[Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss][Ii][Oo][Nn]\.[Dd][Ee][Ff][Ll][Aa][Tt][Ee][Ss][Tt][Rr][Ee][Aa][Mm].*/ OR data_win_eventdata_payload:/.*[Ss][Yy][Ss][Tt][Ee][Mm]\.[Ii][Oo]\.[Ss][Tt][Rr][Ee][Aa][Mm][Rr][Ee][Aa][Dd][Ee][Rr].*/) AND data_win_eventdata_payload:/.*[Rr][Ee][Aa][Dd][Tt][Oo][Ee][Nn][Dd]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 2f211361-7dce-442d-b78a-c04039677378
    name: Invoke-Obfuscation Obfuscated IEX Invocation - PowerShell Module
    reason: Compressed payloads are almost always detonated through an obfuscated IEX; the same Invoke-Obfuscation session typically emits both module-logging events.
  - id: 7eedcc9d-9fdb-4d94-9c54-474e8affc0c7
    name: Invoke-Obfuscation COMPRESS OBFUSCATION
    reason: Same DeflateStream/StreamReader launcher seen on the powershell.exe command line (EID 1); confirms the compressed one-liner was passed at process launch.
  - id: d75d6b6b-adb9-48f7-824b-ac2e786efe1f
    name: Suspicious FromBase64String Usage On Gzip Archive - Process Creation
    reason: Base64 plus gzip/deflate decompression is the same decode-in-memory staging pattern, often the carrier for the compressed blob.
  - id: de41232e-12e8-49fa-86bc-c05c7e722df9
    name: Suspicious PowerShell Download - PoshModule
    reason: The decompressed stage is commonly a download cradle that fetches the next payload, the likely next step after unpacking.
  - id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
    name: PowerShell Download and Execution Cradles
    reason: Follow-on network retrieval and execution by the PowerShell process that ran the decompressed script.
  - id: e0d6c087-2d1c-47fd-8799-3904103c5a98
    name: AMSI Bypass Pattern Assembly GetType
    reason: Compression hides the AMSI-bypass and loader code from content scanning; AMSI tampering in the unpacked script is a typical companion.
  - id: 9c0295ce-d60d-40bd-bd74-84673b7592b1
    name: Suspicious Encoded And Obfuscated Reflection Assembly Load Function Call
    reason: Decompressed bytes are often a .NET assembly loaded reflectively in memory, the next step after inflating the payload.
  - id: bbb80e91-5746-4fbe-8898-122e2cafdbf4
    name: Suspicious PowerShell Invocations - Generic - PowerShell Module
    reason: Other suspicious PowerShell invocations in the same 4103 stream on this host indicate the obfuscated script is part of broader hands-on activity.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Decompression/decoding primitives in script blocks (Deflate/Gzip/Base64)
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Dd][Ee][Ff][Ll][Aa][Tt][Ee][Ss][Tt][Rr][Ee][Aa][Mm].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Zz][Ii][Pp][Ss][Tt][Rr][Ee][Aa][Mm].*/ OR data_win_eventdata_scriptBlockText:/.*[Ff][Rr][Oo][Mm][Bb][Aa][Ss][Ee]64[Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Mm][Ee][Mm][Oo][Rr][Yy][Ss][Tt][Rr][Ee][Aa][Mm].*/)
    pivot_on:
    - host
    window: 1h
  - name: 'Unpacked payload stage: download cradle, reflective load or IEX in script blocks'
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Rr][Ee][Ff][Ll][Ee][Cc][Tt][Ii][Oo][Nn]\.[Aa][Ss][Ss][Ee][Mm][Bb][Ll][Yy].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ee][Xx][Pp][Rr][Ee][Ss][Ss][Ii][Oo][Nn].*/ OR data_win_eventdata_scriptBlockText:/.*[Aa][Mm][Ss][Ii][Uu][Tt][Ii][Ll][Ss].*/)
    pivot_on:
    - host
    window: 1h
  - name: PowerShell outbound network connections (payload fetch / C2)
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Files dropped by PowerShell (executables and scripts)
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh])\.[Ee][Xx][Ee]/ AND data_win_eventdata_targetFilename:/.*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Pp][Ss]1|[Bb][Aa][Tt]|[Vv][Bb][Ss]|[Jj][Ss]|[Ll][Nn][Kk])/
    pivot_on:
    - host
    window: 2h
  - name: Suspicious child processes spawned by PowerShell
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh])\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Cc][Mm][Dd]|[Rr][Uu][Nn][Dd][Ll][Ll]32|[Mm][Ss][Hh][Tt][Aa]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Rr][Ee][Gg][Ss][Vv][Rr]32|[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]|[Ww][Hh][Oo][Aa][Mm][Ii]|[Nn][Ee][Tt]|[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
