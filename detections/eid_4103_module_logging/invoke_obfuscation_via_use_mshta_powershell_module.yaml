name: Invoke-Obfuscation Via Use MSHTA - PowerShell Module
id: 07ad2ea8-6a55-4ac6-bf3e-91b8e59676eb
version: 1
schema_version: "1.0"
date: "2023-01-04"
author: Nikita Nazarov, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 07ad2ea8-6a55-4ac6-bf3e-91b8e59676eb
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects Obfuscated Powershell via use MSHTA in Scripts. MITRE ATT&CK: T1027,
  T1059.001.

data_source:
  - PowerShell Module Logging EventID 4103

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4103"
        
        - wildcard:
            data_win_eventdata_payload:
              value: "*set*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_payload: "*&&*"
        - wildcard:
            data_win_eventdata_payload:
              value: "*mshta*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_payload:
              value: "*vbscript:createobject*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_payload:
              value: "*.run*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_payload:
              value: "*(window.close)*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_payload
    - data_win_eventdata_contextInfo
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Module Logging (EventID 4103) enabled via GPO and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where data_win_eventdata_payload
  matches '*set*'; data_win_eventdata_payload matches '*&&*';
  data_win_eventdata_payload matches '*mshta*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/SigmaHQ/sigma/issues/1009
  - https://attack.mitre.org/techniques/T1027/
  - https://attack.mitre.org/techniques/T1059/001/

response:
  message: >
    Invoke-Obfuscation Via Use MSHTA - PowerShell Module detected on host
    $agent_name$. Matched data_win_eventdata_payload:
    $data_win_eventdata_payload$. Matched data_win_eventdata_contextInfo:
    $data_win_eventdata_contextInfo$. MITRE ATT&CK: T1027, T1059.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_payload
      type: powershell_script
    - field: data_win_eventdata_contextInfo
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1027
    - T1059.001
  custom_tags:
    - invoke
    - obfuscation
    - mshta
    - powershell
    - stealth
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4103" AND data_win_eventdata_payload:/.*[Ss][Ee][Tt].*/ AND data_win_eventdata_payload:/.*\&\&.*/ AND data_win_eventdata_payload:/.*[Mm][Ss][Hh][Tt][Aa].*/ AND data_win_eventdata_payload:/.*[Vv][Bb][Ss][Cc][Rr][Ii][Pp][Tt]:[Cc][Rr][Ee][Aa][Tt][Ee][Oo][Bb][Jj][Ee][Cc][Tt].*/ AND data_win_eventdata_payload:/.*\.[Rr][Uu][Nn].*/ AND data_win_eventdata_payload:/.*\([Ww][Ii][Nn][Dd][Oo][Ww]\.[Cc][Ll][Oo][Ss][Ee]\).*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: ac20ae82-8758-4f38-958e-b44a3140ca88
    name: Invoke-Obfuscation Via Use MSHTA
    reason: Same cmd /c set ... && mshta vbscript:CreateObject(Wscript.Shell).Run(...)(window.close) launcher seen at process-creation level; confirms the obfuscated mshta command line actually executed.
  - id: e55a5195-4724-480e-a77e-3ebe64bd3759
    name: Invoke-Obfuscation Via Use MSHTA - PowerShell
    reason: Same launcher captured in 4104 script-block logging; co-occurs with the 4103 module log for the same PowerShell invocation.
  - id: 9b3af1e6-5b68-11eb-ae93-0242ac130002
    name: Detect MSHTA Url in Command Line
    reason: mshta pulling remote content is the usual payload-delivery step of a vbscript:/HTA launcher.
  - id: b98d0db6-511d-45de-ad02-e82a98729620
    name: Remotely Hosted HTA File Executed Via Mshta.EXE
    reason: 'Follow-on: the mshta stage fetches and runs a remote HTA as the next payload.'
  - id: 03cc0c25-389f-4bf8-b48d-11878079f1ca
    name: Suspicious MSHTA Child Process
    reason: The WScript.Shell.Run in the launcher makes mshta spawn a child (powershell/cmd) that carries the real payload.
  - id: 4aa5d062-e893-11eb-9eb2-acde48001122
    name: Mshta spawning Rundll32 OR Regsvr32 Process
    reason: Common post-mshta proxy-execution step loading a DLL payload.
  - id: 2f211361-7dce-442d-b78a-c04039677378
    name: Invoke-Obfuscation Obfuscated IEX Invocation - PowerShell Module
    reason: Obfuscated IEX in the same module log often accompanies the encoded stage-two launched by the mshta wrapper.
  - id: 88a22f69-62f9-4b8a-aa00-6b0212f2f05a
    name: Invoke-Obfuscation Via Use Rundll32 - PowerShell Module
    reason: Sibling Invoke-Obfuscation launcher variant; an operator trying several launcher styles on the same host.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Child processes spawned by mshta.exe
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: mshta.exe network connections or DNS lookups
    query: (data_win_system_eventID:"3" OR data_win_system_eventID:"22") AND (data_win_eventdata_image:/.*[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
  - name: mshta command lines with vbscript/javascript/remote HTA
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*([Vv][Bb][Ss][Cc][Rr][Ii][Pp][Tt]|[Jj][Aa][Vv][Aa][Ss][Cc][Rr][Ii][Pp][Tt]|[Hh][Tt][Tt][Pp]|\.[Hh][Tt][Aa]).*/)
    pivot_on:
    - host
    window: 2h
  - name: HTA/script files dropped to disk
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.([Hh][Tt][Aa]|[Vv][Bb][Ss]|[Vv][Bb][Ee]|[Jj][Ss][Ee]?|[Pp][Ss]1)/
    pivot_on:
    - host
    window: 2h
  - name: PowerShell script blocks with download, IEX or encoded stage
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*([Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg]|[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt]|[Ff][Rr][Oo][Mm][Bb][Aa][Ss][Ee]64[Ss][Tt][Rr][Ii][Nn][Gg]|[Ii][Nn][Vv][Oo][Kk][Ee]-[Ee][Xx][Pp][Rr][Ee][Ss][Ss][Ii][Oo][Nn]).*/ OR data_win_eventdata_scriptBlockText:/.*[Mm][Ss][Hh][Tt][Aa].*/)
    pivot_on:
    - host
    window: 1h
