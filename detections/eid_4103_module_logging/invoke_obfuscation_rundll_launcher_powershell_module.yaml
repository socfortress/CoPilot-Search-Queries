name: Invoke-Obfuscation RUNDLL LAUNCHER - PowerShell Module
id: a23791fe-8846-485a-b16b-ca691e1b03d4
version: 1
schema_version: "1.0"
date: "2022-11-29"
author: Timur Zinniatullin, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: a23791fe-8846-485a-b16b-ca691e1b03d4
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects Obfuscated Powershell via RUNDLL LAUNCHER. MITRE ATT&CK: T1027,
  T1059.001.

data_source:
  - PowerShell Module Logging EventID 4103

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4103"
        
        - wildcard:
            data_win_eventdata_payload:
              value: "*rundll32.exe*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_payload:
              value: "*shell32.dll*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_payload:
              value: "*shellexec_rundll*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_payload:
              value: "*powershell*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_payload
    - data_win_eventdata_contextInfo
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Module Logging (EventID 4103) enabled via GPO and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where data_win_eventdata_payload
  matches '*rundll32.exe*'; data_win_eventdata_payload matches '*shell32.dll*';
  data_win_eventdata_payload matches '*shellexec_rundll*', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/SigmaHQ/sigma/issues/1009
  - https://attack.mitre.org/techniques/T1027/
  - https://attack.mitre.org/techniques/T1059/001/

response:
  message: >
    Invoke-Obfuscation RUNDLL LAUNCHER - PowerShell Module detected on host
    $agent_name$. Matched data_win_eventdata_payload:
    $data_win_eventdata_payload$. Matched data_win_eventdata_contextInfo:
    $data_win_eventdata_contextInfo$. MITRE ATT&CK: T1027, T1059.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_payload
      type: powershell_script
    - field: data_win_eventdata_contextInfo
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1027
    - T1059.001
  custom_tags:
    - invoke
    - obfuscation
    - rundll
    - powershell
    - stealth
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4103" AND data_win_eventdata_payload:/.*[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee].*/ AND data_win_eventdata_payload:/.*[Ss][Hh][Ee][Ll][Ll]32\.[Dd][Ll][Ll].*/ AND data_win_eventdata_payload:/.*[Ss][Hh][Ee][Ll][Ll][Ee][Xx][Ee][Cc]_[Rr][Uu][Nn][Dd][Ll][Ll].*/ AND data_win_eventdata_payload:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 88a22f69-62f9-4b8a-aa00-6b0212f2f05a
    name: Invoke-Obfuscation Via Use Rundll32 - PowerShell Module
    reason: Sibling Invoke-Obfuscation launcher variant in the same 4103 module log; both firing means the same obfuscation framework produced the rundll32 PowerShell launch.
  - id: 2f211361-7dce-442d-b78a-c04039677378
    name: Invoke-Obfuscation Obfuscated IEX Invocation - PowerShell Module
    reason: Obfuscated launchers typically end in an obfuscated IEX of the decoded payload, so the IEX variant is the expected next stage on the same session.
  - id: 7034cbbb-cc55-4dc2-8dad-36c0b942e8f1
    name: Invoke-Obfuscation COMPRESS OBFUSCATION - PowerShell Module
    reason: Same Invoke-Obfuscation toolkit; compress/deflate-wrapped payload is a common inner layer behind a launcher wrapper.
  - id: de41232e-12e8-49fa-86bc-c05c7e722df9
    name: Suspicious PowerShell Download - PoshModule
    reason: Once the obfuscated launcher runs, the decoded stage commonly pulls a second-stage payload via WebClient/Invoke-WebRequest.
  - id: e593cf51-88db-4ee1-b920-37e89012a3c9
    name: Potentially Suspicious Rundll32 Activity
    reason: The launcher's rundll32 shell32.dll,ShellExec_RunDLL call appears as a process-creation event with suspicious rundll32 arguments.
  - id: f40017b3-cb2e-4335-ab5d-3babf679c1de
    name: Remote DLL Load Via Rundll32.EXE
    reason: Rundll32 abuse in the launcher can be followed by rundll32 loading a remote or staged DLL as the real payload.
  - id: ae9c6a7c-9521-42a6-915e-5aaa8689d529
    name: CobaltStrike Load by Rundll32
    reason: Obfuscated PowerShell/rundll32 launchers are a common delivery path for Cobalt Strike beacon DLLs loaded through rundll32.
  - id: e0d6c087-2d1c-47fd-8799-3904103c5a98
    name: AMSI Bypass Pattern Assembly GetType
    reason: Obfuscated PowerShell stagers commonly disable AMSI in the next script block before running the payload.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Rundll32 spawned by a script interpreter on this host
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ AND data_win_eventdata_parentImage:/.*([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]|[Cc][Mm][Dd]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: Child processes spawned by rundll32 (shell, LOLBin or payload)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*(cmd|powershell|pwsh|mshta|regsvr32|wscript|cscript|certutil|bitsadmin|wmic)\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Rundll32 outbound network connections
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Rundll32 loading DLLs from user-writable paths
    query: data_win_system_eventID:"7" AND data_win_eventdata_image:/.*[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ AND data_win_eventdata_imageLoaded:/.*([Tt][Ee][Mm][Pp]|[Aa][Pp][Pp][Dd][Aa][Tt][Aa]|[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]|[Pp][Uu][Bb][Ll][Ii][Cc]|[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]).*/
    pivot_on:
    - host
    window: 2h
  - name: PowerShell script blocks with download cradles, AMSI tampering or in-memory loading
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*DownloadString* OR data_win_eventdata_scriptBlockText:*DownloadFile* OR data_win_eventdata_scriptBlockText:*Invoke-WebRequest* OR data_win_eventdata_scriptBlockText:*amsiInitFailed* OR data_win_eventdata_scriptBlockText:*AmsiUtils* OR data_win_eventdata_scriptBlockText:*FromBase64String* OR data_win_eventdata_scriptBlockText:*Reflection.Assembly*)
    pivot_on:
    - host
    window: 2h
