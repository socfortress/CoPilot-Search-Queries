name: Bad Opsec Powershell Code Artifacts
id: 8d31a8ce-46b5-4dd6-bdc3-680931f1db86
version: 1
schema_version: "1.0"
date: "2022-12-25"
author: ok @securonix invrep_de, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 8d31a8ce-46b5-4dd6-bdc3-680931f1db86
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  focuses on trivial artifacts observed in variants of prevalent offensive ps1
  payloads, including Cobalt Strike Beacon, PoshC2, Powerview, Letmein, Empire,
  Powersploit, and other attack payloads that often undergo minimal changes by
  attackers due to bad opsec. MITRE ATT&CK: T1059.001.

data_source:
  - PowerShell Module Logging EventID 4103

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4103"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_payload:
                    value: "*$DoIt*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_payload:
                    value: "*harmj0y*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_payload:
                    value: "*mattifestation*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_payload:
                    value: "*_RastaMouse*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_payload:
                    value: "*tifkin_*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_payload:
                    value: "*0xdeadbeef*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_payload
    - data_win_eventdata_contextInfo
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Module Logging (EventID 4103) enabled via GPO and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where data_win_eventdata_payload
  matches '*$DoIt*'; data_win_eventdata_payload matches '*harmj0y*';
  data_win_eventdata_payload matches '*mattifestation*', among other conditions.

known_false_positives: >
  Moderate-to-low; Despite the shorter length/lower entropy for some of these,
  because of high specificity, fp appears to be fairly limited in many
  environments. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://newtonpaul.com/analysing-fileless-malware-cobalt-strike-beacon/
  - https://labs.sentinelone.com/top-tier-russian-organized-cybercrime-group-unveils-fileless-stealthy-powertrick-backdoor-for-high-value-targets/
  - https://www.mdeditor.tw/pl/pgRt
  - https://attack.mitre.org/techniques/T1059/001/

response:
  message: >
    Bad Opsec Powershell Code Artifacts detected on host $agent_name$. Matched
    data_win_eventdata_payload: $data_win_eventdata_payload$. Matched
    data_win_eventdata_contextInfo: $data_win_eventdata_contextInfo$. MITRE
    ATT&CK: T1059.001
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_payload
      type: powershell_script
    - field: data_win_eventdata_contextInfo
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
  custom_tags:
    - opsec
    - powershell
    - artifacts
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4103" AND (data_win_eventdata_payload:/.*\$[Dd][Oo][Ii][Tt].*/ OR data_win_eventdata_payload:/.*[Hh][Aa][Rr][Mm][Jj]0[Yy].*/ OR data_win_eventdata_payload:/.*[Mm][Aa][Tt][Tt][Ii][Ff][Ee][Ss][Tt][Aa][Tt][Ii][Oo][Nn].*/ OR data_win_eventdata_payload:/.*_[Rr][Aa][Ss][Tt][Aa][Mm][Oo][Uu][Ss][Ee].*/ OR data_win_eventdata_payload:/.*[Tt][Ii][Ff][Kk][Ii][Nn]_.*/ OR data_win_eventdata_payload:/.*0[Xx][Dd][Ee][Aa][Dd][Bb][Ee][Ee][Ff].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: de41232e-12e8-49fa-86bc-c05c7e722df9
    name: Suspicious PowerShell Download - PoshModule
    reason: Offensive ps1 payloads (Beacon stagers, PoshC2, Empire) are normally pulled in by a download cradle in the same module-logging stream just before the tool artifacts appear.
  - id: bbb80e91-5746-4fbe-8898-122e2cafdbf4
    name: Suspicious PowerShell Invocations - Generic - PowerShell Module
    reason: Same 4103 telemetry; generic offensive cmdlet invocations co-occur with the tool-author artifacts when a PowerSploit/Empire payload runs.
  - id: 8ff28fdd-e2fa-4dfa-aeda-ef3d61c62090
    name: Suspicious PowerShell Invocations - Specific - PowerShell Module
    reason: Specific offensive cmdlet invocations (PowerView/PowerSploit-style) executed by the same payload that carries the author artifacts.
  - id: 2f211361-7dce-442d-b78a-c04039677378
    name: Invoke-Obfuscation Obfuscated IEX Invocation - PowerShell Module
    reason: Payloads containing these artifacts are often delivered through obfuscated IEX launchers; the obfuscated stager is the precursor of the logged payload.
  - id: e0d6c087-2d1c-47fd-8799-3904103c5a98
    name: AMSI Bypass Pattern Assembly GetType
    reason: Attackers typically patch AMSI before running a known-signature ps1 payload so it is not blocked; the bypass directly precedes the artifact execution.
  - id: bc1dc6b8-c954-11eb-bade-acde48001122
    name: Detect Empire with PowerShell Script Block Logging
    reason: Empire is one of the named payload families; its script block signatures confirm the same payload in 4104 telemetry.
  - id: 8148c29c-c952-11eb-9255-acde48001122
    name: Detect Mimikatz With PowerShell Script Block Logging
    reason: 'Next step for PowerSploit/Empire operators: Invoke-Mimikatz credential theft loaded through the same PowerShell session.'
  - id: ae9c6a7c-9521-42a6-915e-5aaa8689d529
    name: CobaltStrike Load by Rundll32
    reason: Cobalt Strike Beacon is a named source of these artifacts; rundll32 beacon loading is a follow-on or parallel implant channel on the same host.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Download cradles and encoded/reflective loaders in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Nn][Ee][Tt]\.[Ww][Ee][Bb][Cc][Ll][Ii][Ee][Nn][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Ff][Rr][Oo][Mm][Bb][Aa][Ss][Ee]64[Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Rr][Ee][Ff][Ll][Ee][Cc][Tt][Ii][Oo][Nn]\.[Aa][Ss][Ss][Ee][Mm][Bb][Ll][Yy].*/ OR data_win_eventdata_scriptBlockText:/.*[Vv][Ii][Rr][Tt][Uu][Aa][Ll][Aa][Ll][Ll][Oo][Cc].*/)
    pivot_on:
    - host
    window: 1h
  - name: AMSI and ETW tampering or script logging disablement
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Aa][Mm][Ss][Ii][Uu][Tt][Ii][Ll][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*[Aa][Mm][Ss][Ii][Ii][Nn][Ii][Tt][Ff][Aa][Ii][Ll][Ee][Dd].*/ OR data_win_eventdata_scriptBlockText:/.*[Ee][Tt][Ww][Ee][Vv][Ee][Nn][Tt][Ww][Rr][Ii][Tt][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Cc][Rr][Ii][Pp][Tt][Bb][Ll][Oo][Cc][Kk][Ll][Oo][Gg][Gg][Ii][Nn][Gg].*/)
    pivot_on:
    - host
    window: 1h
  - name: PowerShell reaching out to the network (C2 staging)
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll](_[Ii][Ss][Ee])?\.[Ee][Xx][Ee]/ AND data_win_eventdata_initiated:"true"
    pivot_on:
    - host
    window: 2h
  - name: Credential theft and AD recon cmdlets from PowerSploit/PowerView
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Dd][Oo][Mm][Aa][Ii][Nn][A-Za-z]+.*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Kk][Ee][Rr][Bb][Ee][Rr][Oo][Aa][Ss][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Ff][Ii][Nn][Dd]-[Ll][Oo][Cc][Aa][Ll][Aa][Dd][Mm][Ii][Nn][Aa][Cc][Cc][Ee][Ss][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ss][Hh][Aa][Rr][Pp][Hh][Oo][Uu][Nn][Dd].*/)
    pivot_on:
    - host
    window: 4h
  - name: Beacon-style injection and LSASS access following payload
    query: (data_win_system_eventID:"8" OR data_win_system_eventID:"10") AND (data_win_eventdata_sourceImage:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ OR data_win_eventdata_targetImage:/.*[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
