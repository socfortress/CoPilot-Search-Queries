name: Suspicious Get-ADDBAccount Usage
id: b140afd9-474b-4072-958e-2ebb435abd68
version: 1
schema_version: "1.0"
date: "2022-03-16"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: b140afd9-474b-4072-958e-2ebb435abd68
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious invocation of the Get-ADDBAccount script that reads from a
  ntds.dit file and may be used to get access to credentials without using any
  credential dumpers. MITRE ATT&CK: T1003.003.

data_source:
  - PowerShell Module Logging EventID 4103

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4103"
        
        - wildcard:
            data_win_eventdata_payload:
              value: "*Get-ADDBAccount*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_payload:
              value: "*BootKey *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_payload:
              value: "*DatabasePath *"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_payload
    - data_win_eventdata_contextInfo
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Module Logging (EventID 4103) enabled via GPO and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where data_win_eventdata_payload
  matches '*Get-ADDBAccount*'; data_win_eventdata_payload matches '*BootKey *';
  data_win_eventdata_payload matches '*DatabasePath *'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.n00py.io/2022/03/manipulating-user-passwords-without-mimikatz/
  - https://github.com/MichaelGrafnetter/DSInternals/blob/7ba59c12ee9a1cb430d7dc186a3366842dd612c8/Documentation/PowerShell/Get-ADDBAccount.md
  - https://attack.mitre.org/techniques/T1003/003/

response:
  message: >
    Suspicious Get-ADDBAccount Usage detected on host $agent_name$. Matched
    data_win_eventdata_payload: $data_win_eventdata_payload$. Matched
    data_win_eventdata_contextInfo: $data_win_eventdata_contextInfo$. MITRE
    ATT&CK: T1003.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_payload
      type: powershell_script
    - field: data_win_eventdata_contextInfo
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.003
  custom_tags:
    - addbaccount
    - powershell
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4103" AND data_win_eventdata_payload:/.*[Gg][Ee][Tt]-[Aa][Dd][Dd][Bb][Aa][Cc][Cc][Oo][Uu][Nn][Tt].*/ AND data_win_eventdata_payload:/.*[Bb][Oo][Oo][Tt][Kk][Ee][Yy] .*/ AND data_win_eventdata_payload:/.*[Dd][Aa][Tt][Aa][Bb][Aa][Ss][Ee][Pp][Aa][Tt][Hh] .*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: da63bc76-61ae-11eb-ae93-0242ac130002
    name: Ntdsutil Export NTDS
    reason: Common alternative way to obtain the same ntds.dit + SYSTEM hive that Get-ADDBAccount -DatabasePath/-BootKey needs offline
  - id: f57f8d16-1f39-4dcb-a604-6c73d9b54b3d
    name: Sensitive File Access Via Volume Shadow Copy Backup
    reason: ntds.dit is locked online; attacker typically copies it from a shadow copy before parsing it with DSInternals
  - id: c73124a7-3e89-44a3-bdc1-25fe4df754b1
    name: Copy From VolumeShadowCopy Via Cmd.EXE
    reason: Precursor staging of ntds.dit/SYSTEM hive from a VSS snapshot into the DatabasePath read by Get-ADDBAccount
  - id: fd877b94-9bb5-4191-bb25-d79cbd93c167
    name: Dumping of Sensitive Hives Via Reg.EXE
    reason: reg save of SYSTEM hive supplies the BootKey that Get-ADDBAccount requires to decrypt hashes
  - id: 43d91656-a9b2-4541-b7e2-6a9bd3a13f4e
    name: DSInternals Suspicious PowerShell Cmdlets
    reason: Same DSInternals module; process-creation view of Get-ADDBAccount/Get-BootKey/Get-ADReplAccount used in the same session
  - id: 846c7a87-8e14-4569-9d49-ecfd4276a01c
    name: DSInternals Suspicious PowerShell Cmdlets - ScriptBlock
    reason: 4104 script-block view of the same DSInternals cmdlets; confirms the full pipeline (Get-BootKey, Get-ADDBAccount, Set-ADDBAccountPassword)
  - id: 4e7050dd-e548-483f-b7d6-527ab4fa784d
    name: NTDS.DIT Creation By Uncommon Parent Process
    reason: Creation of the ntds.dit copy on disk that Get-ADDBAccount then reads
  - id: 3a8da4e0-36c1-40d2-8b29-b3e890d5172a
    name: NTDS Exfiltration Filename Patterns
    reason: 'Follow-on: dumped ntds.dit / extracted hashes staged under known exfil filenames'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: ntds.dit / SYSTEM hive staging via ntdsutil, VSS, reg save or esentutl
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt].*/ OR (data_win_eventdata_commandLine:/.*[Rr][Ee][Gg].*[Ss][Aa][Vv][Ee].*/ AND data_win_eventdata_commandLine:/.*[Hh][Kk][Ll][Mm]\\[Ss][Yy][Ss][Tt][Ee][Mm].*/) OR data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*[Ss][Hh][Aa][Dd][Oo][Ww].*/ OR data_win_eventdata_commandLine:/.*[Ss][Hh][Aa][Dd][Oo][Ww][Cc][Oo][Pp][Yy].*/ OR data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll].*/)
    pivot_on:
    - host
    window: 2h
  - name: ntds.dit or SYSTEM/SAM hive file created on disk
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt].*/ OR data_win_eventdata_targetFilename:/.*[Ss][Yy][Ss][Tt][Ee][Mm]\.([Ss][Aa][Vv][Ee]|[Hh][Ii][Vv][Ee]).*/ OR data_win_eventdata_targetFilename:/.*[Ss][Aa][Mm]\.[Ss][Aa][Vv][Ee].*/ OR data_win_eventdata_targetFilename:/.*[Nn][Tt][Dd][Ss]_?[Ee][Xx][Pp][Oo][Rr][Tt].*/)
    pivot_on:
    - host
    window: 2h
  - name: DSInternals module import and AD offline-database cmdlets in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Dd][Ss][Ii][Nn][Tt][Ee][Rr][Nn][Aa][Ll][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Bb][Oo][Oo][Tt][Kk][Ee][Yy].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Aa][Dd][Rr][Ee][Pp][Ll][Aa][Cc][Cc][Oo][Uu][Nn][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Ee][Tt]-[Aa][Dd][Dd][Bb][Aa][Cc][Cc][Oo][Uu][Nn][Tt][Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Ss][Tt][Aa][Ll][Ll]-[Mm][Oo][Dd][Uu][Ll][Ee].*[Dd][Ss][Ii][Nn][Tt][Ee][Rr][Nn][Aa][Ll][Ss].*/)
    pivot_on:
    - host
    window: 2h
  - name: Archiving or exfiltration of dumped hash output after Get-ADDBAccount
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Rr][Cc][Ll][Oo][Nn][Ee]|[Ww][Ii][Nn][Rr][Aa][Rr]|7[Zz]|7[Zz][Gg]|[Cc][Uu][Rr][Ll]|[Ww][Gg][Ee][Tt])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]-[Aa][Rr][Cc][Hh][Ii][Vv][Ee].*/)) OR (data_win_system_eventID:"3" AND data_win_eventdata_initiated:"true" AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh])\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 4h
  - name: Pass-the-hash style logons with NTLM from this account after hash theft
    query: data_win_system_eventID:"4624" AND data_win_eventdata_logonType:("3" OR "9") AND data_win_eventdata_authenticationPackageName:"NTLM"
    pivot_on:
    - user
    window: 6h
