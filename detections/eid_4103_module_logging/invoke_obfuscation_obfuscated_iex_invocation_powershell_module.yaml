name: Invoke-Obfuscation Obfuscated IEX Invocation - PowerShell Module
id: 2f211361-7dce-442d-b78a-c04039677378
version: 1
schema_version: "1.0"
date: "2022-12-31"
author: Daniel Bohannon (@Mandiant/@FireEye), oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 2f211361-7dce-442d-b78a-c04039677378
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects all variations of obfuscated powershell IEX invocation code generated
  by Invoke-Obfuscation framework from the code block cited in the reference
  section below. MITRE ATT&CK: T1027, T1059.001.

data_source:
  - PowerShell Module Logging EventID 4103

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4103"
        
        - bool:
            should:
              - regexp:
                  data_win_eventdata_payload: ".*(\\$PSHome\\[[ ]*[0-9]{1,3}[ ]*\\][ ]*\\+[ ]*\\$PSHome\\[).*"
              - regexp:
                  data_win_eventdata_payload: ".*(\\$ShellId\\[[ ]*[0-9]{1,3}[ ]*\\][ ]*\\+[ ]*\\$ShellId\\[).*"
              - regexp:
                  data_win_eventdata_payload: ".*(\\$env:Public\\[[ ]*[0-9]{1,3}[ ]*\\][ ]*\\+[ ]*\\$env:Public\\[).*"
              - regexp:
                  data_win_eventdata_payload: ".*(\\$env:ComSpec\\[([ ]*[0-9]{1,3}[ ]*,){2}).*"
              - regexp:
                  data_win_eventdata_payload: ".*(\\*mdr\\*[^A-Za-z0-9_][ ]*\\)\\.Name).*"
              - regexp:
                  data_win_eventdata_payload: ".*(\\$VerbosePreference\\.ToString\\().*"
              - regexp:
                  data_win_eventdata_payload: ".*(\\[String\\][ ]*\\$VerbosePreference).*"
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_payload
    - data_win_eventdata_contextInfo
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Module Logging (EventID 4103) enabled via GPO and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where data_win_eventdata_payload
  matches the regex /.*(\$PSHome\[[ ]*[0-9]{1,3}[ ]*\][ ]*\+[ ]*\$PSHome\[).*/;
  data_win_eventdata_payload matches the regex /.*(\$ShellId\[[ ]*[0-9]{1,3}[
  ]*\][ ]*\+[ ]*\$ShellId\[).*/; data_win_eventdata_payload matches the regex
  /.*(\$env:Public\[[ ]*[0-9]{1,3}[ ]*\][ ]*\+[ ]*\$env:Public\[).*/, among
  other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/danielbohannon/Invoke-Obfuscation/blob/f20e7f843edd0a3a7716736e9eddfa423395dd26/Out-ObfuscatedStringCommand.ps1#L873-L888
  - https://attack.mitre.org/techniques/T1027/
  - https://attack.mitre.org/techniques/T1059/001/

response:
  message: >
    Invoke-Obfuscation Obfuscated IEX Invocation - PowerShell Module detected on
    host $agent_name$. Matched data_win_eventdata_payload:
    $data_win_eventdata_payload$. Matched data_win_eventdata_contextInfo:
    $data_win_eventdata_contextInfo$. MITRE ATT&CK: T1027, T1059.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_payload
      type: powershell_script
    - field: data_win_eventdata_contextInfo
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1027
    - T1059.001
  custom_tags:
    - invoke
    - obfuscation
    - obfuscated
    - powershell
    - stealth
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4103" AND (data_win_eventdata_payload:/.*(\$PSHome\[[ ]*[0-9]{1,3}[ ]*\][ ]*\+[ ]*\$PSHome\[).*/ OR data_win_eventdata_payload:/.*(\$ShellId\[[ ]*[0-9]{1,3}[ ]*\][ ]*\+[ ]*\$ShellId\[).*/ OR data_win_eventdata_payload:/.*(\$env:Public\[[ ]*[0-9]{1,3}[ ]*\][ ]*\+[ ]*\$env:Public\[).*/ OR data_win_eventdata_payload:/.*(\$env:ComSpec\[([ ]*[0-9]{1,3}[ ]*,){2}).*/ OR data_win_eventdata_payload:/.*(\*mdr\*[^A-Za-z0-9_][ ]*\)\.Name).*/ OR data_win_eventdata_payload:/.*(\$VerbosePreference\.ToString\().*/ OR data_win_eventdata_payload:/.*(\[String\][ ]*\$VerbosePreference).*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7034cbbb-cc55-4dc2-8dad-36c0b942e8f1
    name: Invoke-Obfuscation COMPRESS OBFUSCATION - PowerShell Module
    reason: Same Invoke-Obfuscation framework and 4103 log source; operators often layer compression encoding with obfuscated IEX on the same payload.
  - id: a23791fe-8846-485a-b16b-ca691e1b03d4
    name: Invoke-Obfuscation RUNDLL LAUNCHER - PowerShell Module
    reason: Another Invoke-Obfuscation launcher variant; several launcher styles on one host indicate a generated obfuscation toolkit, not a one-off string.
  - id: 88a22f69-62f9-4b8a-aa00-6b0212f2f05a
    name: Invoke-Obfuscation Via Use Rundll32 - PowerShell Module
    reason: Invoke-Obfuscation launcher that re-executes the obfuscated payload through rundll32; a likely sibling to the IEX invocation.
  - id: 07ad2ea8-6a55-4ac6-bf3e-91b8e59676eb
    name: Invoke-Obfuscation Via Use MSHTA - PowerShell Module
    reason: Invoke-Obfuscation launcher via mshta; indicates the same operator tooling wrapping the obfuscated payload in a LOLBin.
  - id: bbb80e91-5746-4fbe-8898-122e2cafdbf4
    name: Suspicious PowerShell Invocations - Generic - PowerShell Module
    reason: Obfuscated IEX is typically the tail of a download cradle or in-memory loader; generic suspicious invocation patterns in 4103 confirm the payload stage.
  - id: de41232e-12e8-49fa-86bc-c05c7e722df9
    name: Suspicious PowerShell Download - PoshModule
    reason: Obfuscated IEX usually executes content fetched by a WebClient/Invoke-WebRequest cradle; this is the download precursor.
  - id: e0d6c087-2d1c-47fd-8799-3904103c5a98
    name: AMSI Bypass Pattern Assembly GetType
    reason: Obfuscated loaders commonly patch AMSI just before running the decoded IEX payload to avoid content scanning.
  - id: ea9bf0fa-edec-4fb8-8b78-b119f2528186
    name: Windows Defender AMSI Trigger Detected
    reason: Defender's AMSI hook firing on the same host shows the deobfuscated script content was actually scanned and flagged as malicious.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Encoded or obfuscated PowerShell process launches
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND (data_win_eventdata_commandLine:/.*[Ee]nc[Oo]d[Ee]d[Cc]ommand.*/ OR data_win_eventdata_commandLine:*FromBase64String* OR data_win_eventdata_commandLine:*iex* OR data_win_eventdata_commandLine:*hidden* OR data_win_eventdata_commandLine:*-nop*)
    pivot_on:
    - host
    window: 1h
  - name: Parent process that spawned PowerShell (Office, script host, LOLBin)
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND data_win_eventdata_parentImage:/.*(winword|excel|outlook|mshta|wscript|cscript|rundll32|wmiprvse|regsvr32|cmd)\.exe/
    pivot_on:
    - host
    window: 1h
  - name: Script blocks with download cradles, decoding or AMSI tampering
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*DownloadString* OR data_win_eventdata_scriptBlockText:*DownloadFile* OR data_win_eventdata_scriptBlockText:*Net.WebClient* OR data_win_eventdata_scriptBlockText:*Invoke-WebRequest* OR data_win_eventdata_scriptBlockText:*amsiInitFailed* OR data_win_eventdata_scriptBlockText:*AmsiUtils* OR data_win_eventdata_scriptBlockText:*FromBase64String* OR data_win_eventdata_scriptBlockText:*GzipStream*)
    pivot_on:
    - host
    window: 1h
  - name: Outbound network connections from PowerShell
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND data_win_eventdata_initiated:"true"
    pivot_on:
    - host
    window: 2h
  - name: Executables or scripts dropped to disk by PowerShell
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND data_win_eventdata_targetFilename:/.*\.(exe|dll|ps1|bat|vbs|js|hta|lnk)/
    pivot_on:
    - host
    window: 2h
