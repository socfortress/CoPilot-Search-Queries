name: Zip A Folder With PowerShell For Staging In Temp  - PowerShell Module
id: daf7eb81-35fd-410d-9d7a-657837e602bb
version: 1
schema_version: "1.0"
date: "2023-12-18"
author: Nasreddine Bencherchali (Nextron Systems), frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: daf7eb81-35fd-410d-9d7a-657837e602bb
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects PowerShell scripts that make use of the "Compress-Archive" Cmdlet in
  order to compress folders and files where the output is stored in a
  potentially suspicious location that is used often by malware for
  exfiltration. An adversary might compress data (e.g., sensitive documents)
  that is collected prior to exfiltration in order to make it portable and
  minimize the amount of data sent over the network. MITRE ATT&CK: T1074.001.

data_source:
  - PowerShell Module Logging EventID 4103

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4103"
        
        - wildcard:
            data_win_eventdata_contextInfo:
              value: "*Compress-Archive -Path*-DestinationPath $env:TEMP*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_contextInfo:
              value: "*Compress-Archive -Path*-DestinationPath*\\\\AppData\\\\Local\\\\Temp\\\\*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_contextInfo:
              value: "*Compress-Archive -Path*-DestinationPath*:\\\\Windows\\\\Temp\\\\*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_contextInfo
    - data_win_eventdata_payload
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Module Logging (EventID 4103) enabled via GPO and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where data_win_eventdata_contextInfo
  matches '*Compress-Archive -Path*-DestinationPath $env:TEMP*';
  data_win_eventdata_contextInfo matches '*Compress-Archive
  -Path*-DestinationPath*\AppData\Local\Temp\*'; data_win_eventdata_contextInfo
  matches '*Compress-Archive -Path*-DestinationPath*:\Windows\Temp\*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1074.001/T1074.001.md
  - https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-347a
  - https://attack.mitre.org/techniques/T1074/001/

response:
  message: >
    Zip A Folder With PowerShell For Staging In Temp - PowerShell Module
    detected on host $agent_name$. Matched data_win_eventdata_contextInfo:
    $data_win_eventdata_contextInfo$. Matched data_win_eventdata_payload:
    $data_win_eventdata_payload$. MITRE ATT&CK: T1074.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_contextInfo
      type: other
    - field: data_win_eventdata_payload
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1074.001
  custom_tags:
    - folder
    - powershell
    - staging
    - collection
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4103" AND data_win_eventdata_contextInfo:/.*[Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]-[Aa][Rr][Cc][Hh][Ii][Vv][Ee] -[Pp][Aa][Tt][Hh].*-[Dd][Ee][Ss][Tt][Ii][Nn][Aa][Tt][Ii][Oo][Nn][Pp][Aa][Tt][Hh] \$[Ee][Nn][Vv]:[Tt][Ee][Mm][Pp].*/ AND data_win_eventdata_contextInfo:/.*[Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]-[Aa][Rr][Cc][Hh][Ii][Vv][Ee] -[Pp][Aa][Tt][Hh].*-[Dd][Ee][Ss][Tt][Ii][Nn][Aa][Tt][Ii][Oo][Nn][Pp][Aa][Tt][Hh].*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\.*/ AND data_win_eventdata_contextInfo:/.*[Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]-[Aa][Rr][Cc][Hh][Ii][Vv][Ee] -[Pp][Aa][Tt][Hh].*-[Dd][Ee][Ss][Tt][Ii][Nn][Aa][Tt][Ii][Oo][Nn][Pp][Aa][Tt][Hh].*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 85a8e5ba-bd03-4bfb-bbfa-a4409a8f8b98
    name: Folder Compress To Potentially Suspicious Output Via Compress-Archive Cmdlet
    reason: Same Compress-Archive-to-Temp staging seen as a process-creation command line (Sysmon EID 1); confirms the parent process and full arguments behind the module-log hit.
  - id: a6a39bdb-935c-4f0a-ab77-35f4bbf44d33
    name: Potentially Suspicious Powershell Script Execution From Temp Folder
    reason: 'Precursor: the staging script itself is often a PowerShell script dropped and run from a Temp folder before it zips collected data.'
  - id: ec570e53-4c76-45a9-804d-dc3f355ff7a7
    name: 7Zip Compressing Dump Files
    reason: 'Co-occurring staging: attackers who zip data with Compress-Archive also use 7-Zip to compress credential or memory dumps for exfiltration.'
  - id: 9fbf5927-5261-4284-a71d-f681029ea574
    name: Compress Data and Lock With Password for Exfiltration With 7-ZIP
    reason: 'Follow-on hardening of the staged archive: password-protected 7z archives are made so the staged data evades DLP inspection before transfer.'
  - id: faa48cae-6b25-4f00-a094-08947fef582f
    name: Rar Usage with Password and Compression Level
    reason: Alternative archiver used for the same collection-then-compress stage; shows the operator re-staging data with RAR on this host.
  - id: 7d1aaf3d-4304-425c-b7c3-162055e0b3ab
    name: Potential Data Exfiltration Activity Via CommandLine Tools
    reason: 'Next step: the staged zip in Temp is pushed out with command-line transfer tools such as curl or scp.'
  - id: 32e0baea-b3f1-11eb-a2ce-acde48001122
    name: Detect RClone Command-Line Usage
    reason: 'Next step: rclone is the commonly used exfiltration tool to ship a staged archive to cloud storage.'
  - id: 643bdcac-8b82-49f4-9fd9-25a90b929f3b
    name: Renamed MegaSync Execution
    reason: 'Next step: cloud sync clients such as MegaSync are used to exfiltrate staged archives in Temp.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Archive files created in Temp staging locations
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Tt][Ee][Mm][Pp]\\.*\.([Zz][Ii][Pp]|7[Zz]|[Rr][Aa][Rr]|[Cc][Aa][Bb])/
    pivot_on:
    - host
    window: 2h
  - name: Compress-Archive and archiver process execution
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]-[Aa][Rr][Cc][Hh][Ii][Vv][Ee].*/ OR data_win_eventdata_image:/.*\\(7[Zz]|7[Zz][Aa]|[Rr][Aa][Rr]|[Ww][Ii][Nn][Rr][Aa][Rr])\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: Exfiltration and cloud-sync tool execution
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Rr][Cc][Ll][Oo][Nn][Ee]|[Cc][Uu][Rr][Ll]|[Ww][Ii][Nn][Ss][Cc][Pp]|[Pp][Ss][Cc][Pp]|[Mm][Ee][Gg][Aa][Ss][Yy][Nn][Cc]|[Mm][Ee][Gg][Aa][Cc][Mm][Dd])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Ii][Nn][Vv][Oo][Kk][Ee]-[Rr][Ee][Ss][Tt][Mm][Ee][Tt][Hh][Oo][Dd]|[Ss][Tt][Aa][Rr][Tt]-[Bb][Ii][Tt][Ss][Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr]|-[Uu][Pp][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee]).*/)
    pivot_on:
    - host
    window: 4h
  - name: Outbound connections from PowerShell or transfer tools
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]|[Cc][Uu][Rr][Ll]|[Rr][Cc][Ll][Oo][Nn][Ee]|[Ww][Ii][Nn][Ss][Cc][Pp])(_[Ii][Ss][Ee])?\.[Ee][Xx][Ee]/ AND data_win_eventdata_initiated:"true"
    pivot_on:
    - host
    window: 4h
  - name: Script blocks collecting files before compression
    query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*([Gg][Ee][Tt]-[Cc][Hh][Ii][Ll][Dd][Ii][Tt][Ee][Mm]|[Cc][Oo][Pp][Yy]-[Ii][Tt][Ee][Mm]).*([Dd][Oo][Cc][Uu][Mm][Ee][Nn][Tt][Ss]|[Dd][Ee][Ss][Kk][Tt][Oo][Pp]|\.([Dd][Oo][Cc][Xx]?|[Xx][Ll][Ss][Xx]?|[Pp][Dd][Ff]|[Kk][Ee][Yy]|[Pp][Ff][Xx])).*/
    pivot_on:
    - host
    window: 2h
