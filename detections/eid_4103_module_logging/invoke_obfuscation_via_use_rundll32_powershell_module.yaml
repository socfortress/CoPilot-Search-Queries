name: Invoke-Obfuscation Via Use Rundll32 - PowerShell Module
id: 88a22f69-62f9-4b8a-aa00-6b0212f2f05a
version: 1
schema_version: "1.0"
date: "2022-11-29"
author: Nikita Nazarov, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 88a22f69-62f9-4b8a-aa00-6b0212f2f05a
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects Obfuscated Powershell via use Rundll32 in Scripts. MITRE ATT&CK:
  T1027, T1059.001.

data_source:
  - PowerShell Module Logging EventID 4103

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4103"
        
        - wildcard:
            data_win_eventdata_payload: "*&&*"
        - wildcard:
            data_win_eventdata_payload:
              value: "*rundll32*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_payload:
              value: "*shell32.dll*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_payload:
              value: "*shellexec_rundll*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_payload:
                    value: "*value*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_payload:
                    value: "*invoke*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_payload:
                    value: "*comspec*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_payload:
                    value: "*iex*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_payload
    - data_win_eventdata_contextInfo
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Module Logging (EventID 4103) enabled via GPO and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where data_win_eventdata_payload
  matches '*&&*'; data_win_eventdata_payload matches '*rundll32*';
  data_win_eventdata_payload matches '*shell32.dll*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/SigmaHQ/sigma/issues/1009
  - https://attack.mitre.org/techniques/T1027/
  - https://attack.mitre.org/techniques/T1059/001/

response:
  message: >
    Invoke-Obfuscation Via Use Rundll32 - PowerShell Module detected on host
    $agent_name$. Matched data_win_eventdata_payload:
    $data_win_eventdata_payload$. Matched data_win_eventdata_contextInfo:
    $data_win_eventdata_contextInfo$. MITRE ATT&CK: T1027, T1059.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_payload
      type: powershell_script
    - field: data_win_eventdata_contextInfo
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1027
    - T1059.001
  custom_tags:
    - invoke
    - obfuscation
    - rundll32
    - powershell
    - stealth
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4103" AND data_win_eventdata_payload:/.*\&\&.*/ AND data_win_eventdata_payload:/.*[Rr][Uu][Nn][Dd][Ll][Ll]32.*/ AND data_win_eventdata_payload:/.*[Ss][Hh][Ee][Ll][Ll]32\.[Dd][Ll][Ll].*/ AND data_win_eventdata_payload:/.*[Ss][Hh][Ee][Ll][Ll][Ee][Xx][Ee][Cc]_[Rr][Uu][Nn][Dd][Ll][Ll].*/ AND (data_win_eventdata_payload:/.*[Vv][Aa][Ll][Uu][Ee].*/ OR data_win_eventdata_payload:/.*[Ii][Nn][Vv][Oo][Kk][Ee].*/ OR data_win_eventdata_payload:/.*[Cc][Oo][Mm][Ss][Pp][Ee][Cc].*/ OR data_win_eventdata_payload:/.*[Ii][Ee][Xx].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a5a30a6e-75ca-4233-8b8c-42e0f2037d3b
    name: Invoke-Obfuscation Via Use Rundll32 - PowerShell
    reason: Same Invoke-Obfuscation rundll32/shell32 ShellExec_RunDLL launcher seen in 4104 script-block logging; confirms the decoded script text for the same execution.
  - id: a23791fe-8846-485a-b16b-ca691e1b03d4
    name: Invoke-Obfuscation RUNDLL LAUNCHER - PowerShell Module
    reason: Sibling Invoke-Obfuscation RUNDLL launcher variant in 4103; the operator often tries several launcher styles in sequence on the same host.
  - id: f241cf1b-3a6b-4e1a-b4f9-133c00dd95ca
    name: Invoke-Obfuscation RUNDLL LAUNCHER - Security
    reason: Same rundll32 launcher captured at process creation (4688); shows the parent process that spawned the obfuscated launcher.
  - id: 2f211361-7dce-442d-b78a-c04039677378
    name: Invoke-Obfuscation Obfuscated IEX Invocation - PowerShell Module
    reason: Obfuscated IEX is the usual payload-execution stage inside an Invoke-Obfuscation wrapper; co-occurs with the rundll32 launcher.
  - id: 07ad2ea8-6a55-4ac6-bf3e-91b8e59676eb
    name: Invoke-Obfuscation Via Use MSHTA - PowerShell Module
    reason: Alternative Invoke-Obfuscation LOLBin launcher (mshta) from the same toolkit, commonly cycled when one launcher is blocked.
  - id: de41232e-12e8-49fa-86bc-c05c7e722df9
    name: Suspicious PowerShell Download - PoshModule
    reason: The deobfuscated payload usually fetches a second stage (DownloadString/WebClient); this is the likely next step after the launcher runs.
  - id: ea9bf0fa-edec-4fb8-8b78-b119f2528186
    name: Windows Defender AMSI Trigger Detected
    reason: Obfuscated PowerShell content frequently trips AMSI on deobfuscation; an AMSI hit at the same time corroborates malicious script content.
  - id: 8d85cf08-bf97-4260-ba49-986a2a65129c
    name: Suspicious PowerShell In Registry Run Keys
    reason: 'Persistence follow-on: obfuscated PowerShell is commonly planted in Run keys after the initial execution succeeds.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Rundll32 shell32 ShellExec_RunDLL process launches
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Ss][Hh][Ee][Ll][Ll]32.*[Ss][Hh][Ee][Ll][Ll][Ee][Xx][Ee][Cc]_[Rr][Uu][Nn][Dd][Ll][Ll].*/
    pivot_on:
    - host
    window: 1h
  - name: PowerShell/cmd child processes spawned by rundll32
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ AND (data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Cc][Mm][Dd]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
  - name: Script blocks with IEX, download cradles or AMSI bypass
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Nn][Ee][Tt]\.[Ww][Ee][Bb][Cc][Ll][Ii][Ee][Nn][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ee][Xx][Pp][Rr][Ee][Ss][Ss][Ii][Oo][Nn].*/ OR data_win_eventdata_scriptBlockText:/.*[Ff][Rr][Oo][Mm][Bb][Aa][Ss][Ee]64[Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Aa][Mm][Ss][Ii][Uu][Tt][Ii][Ll][Ss].*/)
    pivot_on:
    - host
    window: 1h
  - name: Outbound network connections from PowerShell or rundll32
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: Executable or script files dropped by PowerShell
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_targetFilename:/.*\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetFilename:/.*\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*\.[Pp][Ss]1/ OR data_win_eventdata_targetFilename:/.*\.[Bb][Aa][Tt]/ OR data_win_eventdata_targetFilename:/.*\.[Vv][Bb][Ss]/)
    pivot_on:
    - host
    window: 4h
