name: Suspicious PowerShell Invocations - Generic - PowerShell Module
id: bbb80e91-5746-4fbe-8898-122e2cafdbf4
version: 1
schema_version: "1.0"
date: "2023-01-03"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: bbb80e91-5746-4fbe-8898-122e2cafdbf4
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious PowerShell invocation command parameters. MITRE ATT&CK:
  T1059.001.

data_source:
  - PowerShell Module Logging EventID 4103

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4103"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_contextInfo:
                    value: "* -enc *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_contextInfo:
                    value: "* -EncodedCommand *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_contextInfo:
                    value: "* -ec *"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_contextInfo:
                    value: "* -w hidden *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_contextInfo:
                    value: "* -window hidden *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_contextInfo:
                    value: "* -windowstyle hidden *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_contextInfo:
                    value: "* -w 1 *"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_contextInfo:
                    value: "* -noni *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_contextInfo:
                    value: "* -noninteractive *"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_contextInfo
    - data_win_eventdata_payload
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Module Logging (EventID 4103) enabled via GPO and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where data_win_eventdata_contextInfo
  matches '* -enc *'; data_win_eventdata_contextInfo matches '* -EncodedCommand
  *'; data_win_eventdata_contextInfo matches '* -ec *', among other conditions.

known_false_positives: >
  Very special / sneaky PowerShell scripts. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - Internal Research
  - https://attack.mitre.org/techniques/T1059/001/

response:
  message: >
    Suspicious PowerShell Invocations - Generic - PowerShell Module detected on
    host $agent_name$. Matched data_win_eventdata_contextInfo:
    $data_win_eventdata_contextInfo$. Matched data_win_eventdata_payload:
    $data_win_eventdata_payload$. MITRE ATT&CK: T1059.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_contextInfo
      type: other
    - field: data_win_eventdata_payload
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
  custom_tags:
    - powershell
    - invocations
    - module
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4103" AND (data_win_eventdata_contextInfo:/.* -[Ee][Nn][Cc] .*/ OR data_win_eventdata_contextInfo:/.* -[Ee][Nn][Cc][Oo][Dd][Ee][Dd][Cc][Oo][Mm][Mm][Aa][Nn][Dd] .*/ OR data_win_eventdata_contextInfo:/.* -[Ee][Cc] .*/) AND (data_win_eventdata_contextInfo:/.* -[Ww] [Hh][Ii][Dd][Dd][Ee][Nn] .*/ OR data_win_eventdata_contextInfo:/.* -[Ww][Ii][Nn][Dd][Oo][Ww] [Hh][Ii][Dd][Dd][Ee][Nn] .*/ OR data_win_eventdata_contextInfo:/.* -[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Tt][Yy][Ll][Ee] [Hh][Ii][Dd][Dd][Ee][Nn] .*/ OR data_win_eventdata_contextInfo:/.* -[Ww] 1 .*/) AND (data_win_eventdata_contextInfo:/.* -[Nn][Oo][Nn][Ii] .*/ OR data_win_eventdata_contextInfo:/.* -[Nn][Oo][Nn][Ii][Nn][Tt][Ee][Rr][Aa][Cc][Tt][Ii][Vv][Ee] .*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 30e92f50-bb5a-4884-98b5-d20aa80f3d7a
    name: Hidden Powershell in Link File Pattern
    reason: 'Precursor: a malicious LNK is a common delivery vector launching the same hidden, encoded, non-interactive PowerShell stager.'
  - id: e32d4572-9826-4738-b651-95fa63747e8a
    name: Base64 Encoded PowerShell Command Detected
    reason: Same -enc behaviour seen at process creation (EID 1); confirms the launcher command line and parent process.
  - id: c4db14d9-7909-48b4-a054-aa14d89dbb19
    name: Malicious PowerShell Process - Encoded Command
    reason: Co-occurring process-creation view of the encoded hidden PowerShell invocation, exposing parent and full command line.
  - id: ee18ed37-0802-4268-9435-b3b91aaa18db
    name: PowerShell - Connect To Internet With Hidden Window
    reason: 'Likely next step: the hidden PowerShell stager reaches out to fetch its second-stage payload.'
  - id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
    name: PowerShell Download and Execution Cradles
    reason: Decoded encoded commands typically contain IEX/DownloadString cradles that pull and run the next stage.
  - id: 30edb182-aa75-42c0-b0a9-e998bb29067c
    name: Potential AMSI Bypass Via .NET Reflection
    reason: Encoded stagers commonly patch AMSI via reflection before loading the real payload in the same session.
  - id: c148a894-dd93-11eb-bf2a-acde48001122
    name: Powershell Disable Security Monitoring
    reason: 'Follow-on defense evasion: the attacker disables Defender real-time monitoring after gaining PowerShell execution.'
  - id: 17769c90-230e-488b-a463-e05c08e9d48f
    name: Powershell Defender Exclusion
    reason: 'Follow-on: Defender exclusions added so the dropped payload survives AV.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Decoded script blocks with download/AMSI/reflection on this host
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*DownloadString* OR data_win_eventdata_scriptBlockText:*DownloadFile* OR data_win_eventdata_scriptBlockText:*Invoke-WebRequest* OR data_win_eventdata_scriptBlockText:*Net.WebClient* OR data_win_eventdata_scriptBlockText:*FromBase64String* OR data_win_eventdata_scriptBlockText:*AmsiUtils* OR data_win_eventdata_scriptBlockText:*Reflection.Assembly* OR data_win_eventdata_scriptBlockText:*VirtualAlloc*)
    pivot_on:
    - host
    window: 1h
  - name: PowerShell spawned by Office, script hosts or LNK launchers
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_parentImage:/.*([Ww][Ii][Nn][Ww][Oo][Rr][Dd]|[Ee][Xx][Cc][Ee][Ll]|[Oo][Uu][Tt][Ll][Oo][Oo][Kk]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Mm][Ss][Hh][Tt][Aa]|[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:*.lnk*)
    pivot_on:
    - host
    window: 1h
  - name: Outbound connections from PowerShell (payload staging / C2)
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ AND data_win_eventdata_initiated:"true"
    pivot_on:
    - host
    window: 1h
  - name: Executables or scripts dropped by PowerShell in user-writable paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_targetFilename:*.exe OR data_win_eventdata_targetFilename:*.dll OR data_win_eventdata_targetFilename:*.ps1 OR data_win_eventdata_targetFilename:*.bat OR data_win_eventdata_targetFilename:*.vbs)
    pivot_on:
    - host
    window: 2h
  - name: Defender tampering or persistence registry writes after PowerShell
    query: (data_win_system_eventID:"13" OR data_win_system_eventID:"12") AND (data_win_eventdata_targetObject:*Windows\ Defender* OR data_win_eventdata_targetObject:*CurrentVersion\\Run* OR data_win_eventdata_targetObject:*Exclusions*)
    pivot_on:
    - host
    window: 4h
