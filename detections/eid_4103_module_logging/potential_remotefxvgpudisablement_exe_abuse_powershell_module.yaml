name: Potential RemoteFXvGPUDisablement.EXE Abuse - PowerShell Module
id: 38a7625e-b2cb-485d-b83d-aff137d859f4
version: 1
schema_version: "1.0"
date: "2023-05-09"
author: Nasreddine Bencherchali (Nextron Systems), frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 38a7625e-b2cb-485d-b83d-aff137d859f4
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects PowerShell module creation where the module Contents are set to
  "function Get-VMRemoteFXPhysicalVideoAdapter". This could be a sign of
  potential abuse of the "RemoteFXvGPUDisablement.exe" binary which is known to
  be vulnerable to module load-order hijacking. MITRE ATT&CK: T1218.

data_source:
  - PowerShell Module Logging EventID 4103

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4103"
        
        - wildcard:
            data_win_eventdata_payload:
              value: "*ModuleContents=function Get-VMRemoteFXPhysicalVideoAdapter {*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_payload
    - data_win_eventdata_contextInfo
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Module Logging (EventID 4103) enabled via GPO and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where data_win_eventdata_payload
  matches '*ModuleContents=function Get-VMRemoteFXPhysicalVideoAdapter {*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1218/T1218.md
  - https://github.com/redcanaryco/AtomicTestHarnesses/blob/7e1e4da116801e3d6fcc6bedb207064577e40572/TestHarnesses/T1218_SignedBinaryProxyExecution/InvokeRemoteFXvGPUDisablementCommand.ps1
  - https://attack.mitre.org/techniques/T1218/

response:
  message: >
    Potential RemoteFXvGPUDisablement.EXE Abuse - PowerShell Module detected on
    host $agent_name$. Matched data_win_eventdata_payload:
    $data_win_eventdata_payload$. Matched data_win_eventdata_contextInfo:
    $data_win_eventdata_contextInfo$. MITRE ATT&CK: T1218
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_payload
      type: powershell_script
    - field: data_win_eventdata_contextInfo
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218
  custom_tags:
    - remotefxvgpudisablement
    - abuse
    - powershell
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4103" AND data_win_eventdata_payload:/.*[Mm][Oo][Dd][Uu][Ll][Ee][Cc][Oo][Nn][Tt][Ee][Nn][Tt][Ss]=[Ff][Uu][Nn][Cc][Tt][Ii][Oo][Nn] [Gg][Ee][Tt]-[Vv][Mm][Rr][Ee][Mm][Oo][Tt][Ee][Ff][Xx][Pp][Hh][Yy][Ss][Ii][Cc][Aa][Ll][Vv][Ii][Dd][Ee][Oo][Aa][Dd][Aa][Pp][Tt][Ee][Rr] \{.*/

correlation:
  # Authored by the correlation engine for review.
  enrichment_searches:
  # NEW ad-hoc searches the engine runs around an alert from this rule, scoped to
  # the alert's host/user/IP within the window (not existing CoPilot Searches).
    - name: "Sysmon activity on this host in the window"
      query: 'data_win_system_channel:"Microsoft-Windows-Sysmon/Operational"'
      pivot_on: [host]
      window: 1h
    - name: "Process creation on this host"
      query: 'data_win_system_eventID:"1"'
      pivot_on: [host]
      window: 1h
    - name: "Network connections from this host"
      query: 'data_win_system_eventID:"3"'
      pivot_on: [host]
      window: 1h
    - name: "High-severity alerts on this host"
      query: 'rule_level:>=10'
      pivot_on: [host]
      window: 1h
