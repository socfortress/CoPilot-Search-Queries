name: Potential RemoteFXvGPUDisablement.EXE Abuse - PowerShell Module
id: 38a7625e-b2cb-485d-b83d-aff137d859f4
version: 1
schema_version: "1.0"
date: "2023-05-09"
author: Nasreddine Bencherchali (Nextron Systems), frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 38a7625e-b2cb-485d-b83d-aff137d859f4
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects PowerShell module creation where the module Contents are set to
  "function Get-VMRemoteFXPhysicalVideoAdapter". This could be a sign of
  potential abuse of the "RemoteFXvGPUDisablement.exe" binary which is known to
  be vulnerable to module load-order hijacking. MITRE ATT&CK: T1218.

data_source:
  - PowerShell Module Logging EventID 4103

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4103"
        
        - wildcard:
            data_win_eventdata_payload:
              value: "*ModuleContents=function Get-VMRemoteFXPhysicalVideoAdapter {*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_payload
    - data_win_eventdata_contextInfo
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Module Logging (EventID 4103) enabled via GPO and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where data_win_eventdata_payload
  matches '*ModuleContents=function Get-VMRemoteFXPhysicalVideoAdapter {*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1218/T1218.md
  - https://github.com/redcanaryco/AtomicTestHarnesses/blob/7e1e4da116801e3d6fcc6bedb207064577e40572/TestHarnesses/T1218_SignedBinaryProxyExecution/InvokeRemoteFXvGPUDisablementCommand.ps1
  - https://attack.mitre.org/techniques/T1218/

response:
  message: >
    Potential RemoteFXvGPUDisablement.EXE Abuse - PowerShell Module detected on
    host $agent_name$. Matched data_win_eventdata_payload:
    $data_win_eventdata_payload$. Matched data_win_eventdata_contextInfo:
    $data_win_eventdata_contextInfo$. MITRE ATT&CK: T1218
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_payload
      type: powershell_script
    - field: data_win_eventdata_contextInfo
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218
  custom_tags:
    - remotefxvgpudisablement
    - abuse
    - powershell
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4103" AND data_win_eventdata_payload:/.*[Mm][Oo][Dd][Uu][Ll][Ee][Cc][Oo][Nn][Tt][Ee][Nn][Tt][Ss]=[Ff][Uu][Nn][Cc][Tt][Ii][Oo][Nn] [Gg][Ee][Tt]-[Vv][Mm][Rr][Ee][Mm][Oo][Tt][Ee][Ff][Xx][Pp][Hh][Yy][Ss][Ii][Cc][Aa][Ll][Vv][Ii][Dd][Ee][Oo][Aa][Dd][Aa][Pp][Tt][Ee][Rr] \{.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a6fc3c46-23b8-4996-9ea2-573f4c4d88c5
    name: RemoteFXvGPUDisablement Abuse Via AtomicTestHarnesses
    reason: 'Same technique seen at process-creation level: the Invoke-AtomicRemoteFXvGPUDisablementCommand harness is what launches RemoteFXvGPUDisablement.exe and causes the fake Get-VMRemoteFXPhysicalVideoAdapter module to load.'
  - id: e3845023-ca9a-4024-b2b2-5422156d5527
    name: PowerShell Module File Created By Non-PowerShell Process
    reason: Module load-order hijack requires a rogue .psm1/.psd1 to be dropped first; this catches the staging of the malicious module before the 4103 module-content event.
  - id: e8a52bbd-bced-459f-bd93-64db45ce7657
    name: Potential Suspicious PowerShell Module File Created
    reason: 'Precursor: attacker-planted module file in a path searched ahead of the legitimate Hyper-V module, which is what the 4103 ModuleContents event then reflects.'
  - id: c31364f7-8be6-4b77-8483-dd2b5a7b69a3
    name: Import PowerShell Modules From Suspicious Directories - ProcCreation
    reason: Hijacked module resolution from a user-writable directory is the same load-from-untrusted-path behaviour, seen on the command line.
  - id: 64e8e417-c19a-475a-8d19-98ea705394cc
    name: Alternate PowerShell Hosts - PowerShell Module
    reason: Signed binary hosting a PowerShell runtime (RemoteFXvGPUDisablement.exe) produces module-logging events from a non-powershell.exe host, the same signal this rule family covers.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: RemoteFXvGPUDisablement.exe execution and its child processes
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Rr][Ee][Mm][Oo][Tt][Ee][Ff][Xx][Vv][Gg][Pp][Uu][Dd][Ii][Ss][Aa][Bb][Ll][Ee][Mm][Ee][Nn][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Rr][Ee][Mm][Oo][Tt][Ee][Ff][Xx][Vv][Gg][Pp][Uu][Dd][Ii][Ss][Aa][Bb][Ll][Ee][Mm][Ee][Nn][Tt]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
  - name: PowerShell module files (.psm1/.psd1) dropped in user-writable paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(\.[Pp][Ss][Mm]1|\.[Pp][Ss][Dd]1)/ AND data_win_eventdata_targetFilename:/.*(\\[Tt][Ee][Mm][Pp]\\|\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\|\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\|\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\|\\[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]\\).*/
    pivot_on:
    - host
    window: 2h
  - name: Script blocks referencing the fake RemoteFX module or the Atomic harness
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*Get-VMRemoteFXPhysicalVideoAdapter* OR data_win_eventdata_scriptBlockText:*RemoteFXvGPUDisablement* OR data_win_eventdata_scriptBlockText:*AtomicTestHarnesses*)
    pivot_on:
    - host
    window: 1h
  - name: PowerShell spawning LOLBins or shells after module load
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh])\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Cc][Mm][Dd]|[Rr][Uu][Nn][Dd][Ll][Ll]32|[Mm][Ss][Hh][Tt][Aa]|[Rr][Ee][Gg][Ss][Vv][Rr]32|[Ww][Mm][Ii][Cc]|[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]|[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: Outbound connections from PowerShell or the RemoteFX binary
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]|[Rr][Ee][Mm][Oo][Tt][Ee][Ff][Xx][Vv][Gg][Pp][Uu][Dd][Ii][Ss][Aa][Bb][Ll][Ee][Mm][Ee][Nn][Tt])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
