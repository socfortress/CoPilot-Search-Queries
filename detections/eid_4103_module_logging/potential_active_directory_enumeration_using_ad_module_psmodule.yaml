name: Potential Active Directory Enumeration Using AD Module - PsModule
id: 74176142-4684-4d8a-8b0a-713257e7df8e
version: 1
schema_version: "1.0"
date: "2023-01-22"
author: Nasreddine Bencherchali (Nextron Systems), frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 74176142-4684-4d8a-8b0a-713257e7df8e
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects usage of the "Import-Module" cmdlet to load the
  "Microsoft.ActiveDirectory.Management.dl" DLL. Which is often used by
  attackers to perform AD enumeration.

data_source:
  - PowerShell Module Logging EventID 4103

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4103"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_payload:
                    value: "*Import-Module *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_payload:
                    value: "*ipmo *"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_payload:
              value: "*Microsoft.ActiveDirectory.Management.dll*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_payload
    - data_win_eventdata_contextInfo
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Module Logging (EventID 4103) enabled via GPO and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where data_win_eventdata_payload
  matches '*Import-Module *'; data_win_eventdata_payload matches '*ipmo *';
  data_win_eventdata_payload matches
  '*Microsoft.ActiveDirectory.Management.dll*'.

known_false_positives: >
  Legitimate use of the library for administrative activity. Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://github.com/samratashok/ADModule
  - https://twitter.com/cyb3rops/status/1617108657166061568?s=20
  - https://www.ired.team/offensive-security-experiments/active-directory-kerberos-abuse/active-directory-enumeration-with-ad-module-without-rsat-or-admin-privileges

response:
  message: >
    Potential Active Directory Enumeration Using AD Module - PsModule detected
    on host $agent_name$. Matched data_win_eventdata_payload:
    $data_win_eventdata_payload$. Matched data_win_eventdata_contextInfo:
    $data_win_eventdata_contextInfo$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_payload
      type: powershell_script
    - field: data_win_eventdata_contextInfo
      type: other

tags:
  asset_type: Endpoint
  custom_tags:
    - active
    - directory
    - enumeration
    - powershell
    - reconnaissance
    - discovery
    - impact
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4103" AND (data_win_eventdata_payload:/.*[Ii][Mm][Pp][Oo][Rr][Tt]-[Mm][Oo][Dd][Uu][Ll][Ee] .*/ OR data_win_eventdata_payload:/.*[Ii][Pp][Mm][Oo] .*/) AND data_win_eventdata_payload:/.*[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\.[Aa][Cc][Tt][Ii][Vv][Ee][Dd][Ii][Rr][Ee][Cc][Tt][Oo][Rr][Yy]\.[Mm][Aa][Nn][Aa][Gg][Ee][Mm][Ee][Nn][Tt]\.[Dd][Ll][Ll].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 9e620995-f2d8-4630-8430-4afd89f77604
    name: Potential Active Directory Enumeration Using AD Module - PsScript
    reason: Same ADModule DLL import seen in script block logging (4104); confirms the loaded DLL was actually used from a script.
  - id: 70bc5215-526f-4477-963c-a47a5c9ebd12
    name: Potential Active Directory Enumeration Using AD Module - ProcCreation
    reason: Process-creation view of the same Import-Module of Microsoft.ActiveDirectory.Management.dll; corroborates via command line and parent process.
  - id: dcd74b95-3f36-4ed9-9598-0490951643aa
    name: PowerView PowerShell Cmdlets - ScriptBlock
    reason: Attackers who load the AD module without RSAT often pair or swap it with PowerView for the same domain enumeration.
  - id: 0b6ee3f4-04e3-11ec-a87d-acde48001122
    name: Get ADUser with PowerShell
    reason: Get-ADUser is the first cmdlet used once the AD module DLL is imported; the direct follow-on enumeration.
  - id: cdfa73b6-3c9d-4bb8-97f8-ddbd8921f5c5
    name: Potential Unconstrained Delegation Discovery Via Get-ADComputer - ScriptBlock
    reason: AD module Get-ADComputer queries for delegation targets are a typical next step toward Kerberos abuse.
  - id: 114c6bfe-9406-11ec-bcce-acde48001122
    name: Disabled Kerberos Pre-Authentication Discovery With Get-ADUser
    reason: Hunting AS-REP roastable accounts through the AD module is a common goal of this enumeration.
  - id: 1eeed653-dbc8-4187-ad0c-eeebb20e6599
    name: Potential SPN Enumeration Via Setspn.EXE
    reason: SPN enumeration for Kerberoasting often accompanies AD module enumeration on the same host.
  - id: de41232e-12e8-49fa-86bc-c05c7e722df9
    name: Suspicious PowerShell Download - PoshModule
    reason: The standalone ADModule DLL is usually downloaded into memory or to disk first; this catches the staging that precedes the import.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: AD cmdlet usage in script blocks on this host
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Gg]et-AD(User|Computer|Group|GroupMember|Domain|DomainController|Forest|Trust|ObjectUser|DefaultDomainPasswordPolicy|FineGrainedPasswordPolicy).*/ OR data_win_eventdata_scriptBlockText:*Get-ADObject* OR data_win_eventdata_scriptBlockText:*Search-ADAccount*)
    pivot_on:
    - host
    window: 2h
  - name: Kerberoast / AS-REP roast indicators in script blocks
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*servicePrincipalName* OR data_win_eventdata_scriptBlockText:*DoesNotRequirePreAuth* OR data_win_eventdata_scriptBlockText:*Invoke-Kerberoast* OR data_win_eventdata_scriptBlockText:*Get-DomainUser* OR data_win_eventdata_scriptBlockText:*TrustedForDelegation*)
    pivot_on:
    - host
    window: 4h
  - name: Native AD recon tooling executed on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Nn][Ll][Tt][Ee][Ss][Tt]|[Dd][Ss][Qq][Uu][Ee][Rr][Yy]|[Aa][Dd][Ff][Ii][Nn][Dd]|[Ss][Ee][Tt][Ss][Pp][Nn]|[Ss][Hh][Aa][Rr][Pp][Hh][Oo][Uu][Nn][Dd]|[Cc][Ss][Vv][Dd][Ee]|[Ll][Dd][Ii][Ff][Dd][Ee])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:*"net group"* OR data_win_eventdata_commandLine:*"/domain"*)
    pivot_on:
    - host
    window: 2h
  - name: 'Staging of AD module DLL: download or file write'
    query: (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:*Microsoft.ActiveDirectory.Management*) OR (data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:*ActiveDirectory.Management.dll* AND (data_win_eventdata_scriptBlockText:*DownloadString* OR data_win_eventdata_scriptBlockText:*DownloadFile* OR data_win_eventdata_scriptBlockText:*Invoke-WebRequest* OR data_win_eventdata_scriptBlockText:*FromBase64String*))
    pivot_on:
    - host
    window: 1h
  - name: LDAP/AD network connections from PowerShell
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh])\.[Ee][Xx][Ee]/ AND (data_win_eventdata_destinationPort:"389" OR data_win_eventdata_destinationPort:"636" OR data_win_eventdata_destinationPort:"3268" OR data_win_eventdata_destinationPort:"9389")
    pivot_on:
    - host
    window: 2h
