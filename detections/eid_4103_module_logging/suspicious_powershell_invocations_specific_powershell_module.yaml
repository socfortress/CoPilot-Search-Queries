name: Suspicious PowerShell Invocations - Specific - PowerShell Module
id: 8ff28fdd-e2fa-4dfa-aeda-ef3d61c62090
version: 1
schema_version: "1.0"
date: "2025-02-17"
author: Florian Roth (Nextron Systems), Jonhnathan Ribeiro
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 8ff28fdd-e2fa-4dfa-aeda-ef3d61c62090
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious PowerShell invocation command parameters. MITRE ATT&CK:
  T1059.001.

data_source:
  - PowerShell Module Logging EventID 4103

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4103"
        
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_contextInfo:
                          value: "*-nop*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_contextInfo:
                          value: "* -w *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_contextInfo:
                          value: "*hidden*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_contextInfo:
                          value: "* -c *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_contextInfo:
                          value: "*[Convert]::FromBase64String*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_contextInfo:
                          value: "* -w *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_contextInfo:
                          value: "*hidden*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_contextInfo:
                          value: "*-noni*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_contextInfo:
                          value: "*-nop*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_contextInfo:
                          value: "* -c *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_contextInfo:
                          value: "*iex*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_contextInfo:
                          value: "*New-Object*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_contextInfo:
                          value: "* -w *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_contextInfo:
                          value: "*hidden*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_contextInfo:
                          value: "*-ep*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_contextInfo:
                          value: "*bypass*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_contextInfo:
                          value: "*-Enc*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_contextInfo:
                          value: "*powershell*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_contextInfo:
                          value: "*reg*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_contextInfo:
                          value: "*add*"
                          case_insensitive: true
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_contextInfo:
                                value: "*\\\\software\\\\microsoft\\\\windows\\\\currentversion\\\\run*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_contextInfo:
                                value: "*\\\\software\\\\wow6432node\\\\microsoft\\\\windows\\\\currentversion\\\\run*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_contextInfo:
                                value: "*\\\\software\\\\microsoft\\\\windows\\\\currentversion\\\\policies\\\\explorer\\\\run*"
                                case_insensitive: true
                        minimum_should_match: 1
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_contextInfo:
                          value: "*bypass*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_contextInfo:
                          value: "*-noprofile*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_contextInfo:
                          value: "*-windowstyle*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_contextInfo:
                          value: "*hidden*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_contextInfo:
                          value: "*new-object*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_contextInfo:
                          value: "*system.net.webclient*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_contextInfo:
                          value: "*.download*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_contextInfo:
                          value: "*iex*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_contextInfo:
                          value: "*New-Object*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_contextInfo:
                          value: "*Net.WebClient*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_contextInfo:
                          value: "*.Download*"
                          case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_contextInfo"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_contextInfo:
                          value: "*(New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_contextInfo:
                          value: "*Write-ChocolateyWarning*"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_contextInfo
    - data_win_eventdata_payload
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Module Logging (EventID 4103) enabled via GPO and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where data_win_eventdata_contextInfo
  matches '*-nop*'; data_win_eventdata_contextInfo matches '* -w *';
  data_win_eventdata_contextInfo matches '*hidden*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - Internal Research
  - https://github.com/HackTricks-wiki/hacktricks/blob/e4c7b21b8f36c97c35b7c622732b38a189ce18f7/src/windows-hardening/windows-local-privilege-escalation/privilege-escalation-with-autorun-binaries.md
  - https://attack.mitre.org/techniques/T1059/001/

response:
  message: >
    Suspicious PowerShell Invocations - Specific - PowerShell Module detected on
    host $agent_name$. Matched data_win_eventdata_contextInfo:
    $data_win_eventdata_contextInfo$. Matched data_win_eventdata_payload:
    $data_win_eventdata_payload$. MITRE ATT&CK: T1059.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_contextInfo
      type: other
    - field: data_win_eventdata_payload
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
  custom_tags:
    - powershell
    - invocations
    - specific
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4103" AND ((data_win_eventdata_contextInfo:/.*-[Nn][Oo][Pp].*/ AND data_win_eventdata_contextInfo:/.* -[Ww] .*/ AND data_win_eventdata_contextInfo:/.*[Hh][Ii][Dd][Dd][Ee][Nn].*/ AND data_win_eventdata_contextInfo:/.* -[Cc] .*/ AND data_win_eventdata_contextInfo:/.*\[[Cc][Oo][Nn][Vv][Ee][Rr][Tt]\]::[Ff][Rr][Oo][Mm][Bb][Aa][Ss][Ee]64[Ss][Tt][Rr][Ii][Nn][Gg].*/) OR (data_win_eventdata_contextInfo:/.* -[Ww] .*/ AND data_win_eventdata_contextInfo:/.*[Hh][Ii][Dd][Dd][Ee][Nn].*/ AND data_win_eventdata_contextInfo:/.*-[Nn][Oo][Nn][Ii].*/ AND data_win_eventdata_contextInfo:/.*-[Nn][Oo][Pp].*/ AND data_win_eventdata_contextInfo:/.* -[Cc] .*/ AND data_win_eventdata_contextInfo:/.*[Ii][Ee][Xx].*/ AND data_win_eventdata_contextInfo:/.*[Nn][Ee][Ww]-[Oo][Bb][Jj][Ee][Cc][Tt].*/) OR (data_win_eventdata_contextInfo:/.* -[Ww] .*/ AND data_win_eventdata_contextInfo:/.*[Hh][Ii][Dd][Dd][Ee][Nn].*/ AND data_win_eventdata_contextInfo:/.*-[Ee][Pp].*/ AND data_win_eventdata_contextInfo:/.*[Bb][Yy][Pp][Aa][Ss][Ss].*/ AND data_win_eventdata_contextInfo:/.*-[Ee][Nn][Cc].*/) OR (data_win_eventdata_contextInfo:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ AND data_win_eventdata_contextInfo:/.*[Rr][Ee][Gg].*/ AND data_win_eventdata_contextInfo:/.*[Aa][Dd][Dd].*/ AND (data_win_eventdata_contextInfo:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/ OR data_win_eventdata_contextInfo:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Ww][Oo][Ww]6432[Nn][Oo][Dd][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/ OR data_win_eventdata_contextInfo:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Pp][Oo][Ll][Ii][Cc][Ii][Ee][Ss]\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\\[Rr][Uu][Nn].*/)) OR (data_win_eventdata_contextInfo:/.*[Bb][Yy][Pp][Aa][Ss][Ss].*/ AND data_win_eventdata_contextInfo:/.*-[Nn][Oo][Pp][Rr][Oo][Ff][Ii][Ll][Ee].*/ AND data_win_eventdata_contextInfo:/.*-[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Tt][Yy][Ll][Ee].*/ AND data_win_eventdata_contextInfo:/.*[Hh][Ii][Dd][Dd][Ee][Nn].*/ AND data_win_eventdata_contextInfo:/.*[Nn][Ee][Ww]-[Oo][Bb][Jj][Ee][Cc][Tt].*/ AND data_win_eventdata_contextInfo:/.*[Ss][Yy][Ss][Tt][Ee][Mm]\.[Nn][Ee][Tt]\.[Ww][Ee][Bb][Cc][Ll][Ii][Ee][Nn][Tt].*/ AND data_win_eventdata_contextInfo:/.*\.[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd].*/) OR (data_win_eventdata_contextInfo:/.*[Ii][Ee][Xx].*/ AND data_win_eventdata_contextInfo:/.*[Nn][Ee][Ww]-[Oo][Bb][Jj][Ee][Cc][Tt].*/ AND data_win_eventdata_contextInfo:/.*[Nn][Ee][Tt]\.[Ww][Ee][Bb][Cc][Ll][Ii][Ee][Nn][Tt].*/ AND data_win_eventdata_contextInfo:/.*\.[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd].*/)) AND _exists_:data_win_eventdata_contextInfo AND NOT (data_win_eventdata_contextInfo:/.*\([Nn][Ee][Ww]-[Oo][Bb][Jj][Ee][Cc][Tt] [Ss][Yy][Ss][Tt][Ee][Mm]\.[Nn][Ee][Tt]\.[Ww][Ee][Bb][Cc][Ll][Ii][Ee][Nn][Tt]\)\.[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg]\('[Hh][Tt][Tt][Pp][Ss]:\/\/[Cc][Oo][Mm][Mm][Uu][Nn][Ii][Tt][Yy]\.[Cc][Hh][Oo][Cc][Oo][Ll][Aa][Tt][Ee][Yy]\.[Oo][Rr][Gg]\/[Ii][Nn][Ss][Tt][Aa][Ll][Ll]\.[Pp][Ss]1.*/ OR data_win_eventdata_contextInfo:/.*[Ww][Rr][Ii][Tt][Ee]-[Cc][Hh][Oo][Cc][Oo][Ll][Aa][Tt][Ee][Yy][Ww][Aa][Rr][Nn][Ii][Nn][Gg].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: de41232e-12e8-49fa-86bc-c05c7e722df9
    name: Suspicious PowerShell Download - PoshModule
    reason: Same 4103 module-logging source; the WebClient/DownloadString cradle is the payload-staging step this launcher line typically performs, so both firing means the download actually executed.
  - id: 403c2cc0-7f6b-4925-9423-bfa573bed7eb
    name: Suspicious PowerShell Download - Powershell Script
    reason: Script-block (4104) view of the same download cradle; confirms the fetched content and URL behind the hidden/-nop/iex launch.
  - id: bbb80e91-5746-4fbe-8898-122e2cafdbf4
    name: Suspicious PowerShell Invocations - Generic - PowerShell Module
    reason: Sibling rule on the same 4103 telemetry covering generic malicious invocation patterns; co-fires when the same session uses other known attacker idioms.
  - id: 2f211361-7dce-442d-b78a-c04039677378
    name: Invoke-Obfuscation Obfuscated IEX Invocation - PowerShell Module
    reason: The encoded/IEX launch is often wrapped in Invoke-Obfuscation; obfuscated IEX in the same session indicates a tooling-generated stager.
  - id: e0d6c087-2d1c-47fd-8799-3904103c5a98
    name: AMSI Bypass Pattern Assembly GetType
    reason: Hidden -ep bypass loaders commonly patch AMSI right before running the downloaded payload, so an AMSI bypass in the script block is the immediate follow-on.
  - id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
    name: PowerShell Download and Execution Cradles
    reason: Process-creation (EID 1) command-line view of the same cradle; ties the 4103 event to the parent process that launched powershell.exe.
  - id: 8d85cf08-bf97-4260-ba49-986a2a65129c
    name: Suspicious PowerShell In Registry Run Keys
    reason: One branch of this rule is a powershell reg add to Run keys; this registry-side detection confirms the persistence value was actually written.
  - id: de587dce-915e-4218-aac4-835ca6af6f70
    name: Potential Persistence Attempt Via Run Keys Using Reg.EXE
    reason: Run-key persistence via reg.exe spawned from the PowerShell session is the likely next step after the launcher executes.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: PowerShell outbound network connections (payload/C2 fetch)
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: PowerShell DNS lookups for download/C2 domains
    query: data_win_system_eventID:"22" AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: Files dropped by PowerShell in user-writable paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh])\.[Ee][Xx][Ee]/ AND data_win_eventdata_targetFilename:/.*\\([Tt][Ee][Mm][Pp]|[Aa][Pp][Pp][Dd][Aa][Tt][Aa]|[Pp][Uu][Bb][Ll][Ii][Cc]|[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa])\.*/
    pivot_on:
    - host
    window: 2h
  - name: Run-key persistence written by PowerShell/reg.exe
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/ AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]|[Rr][Ee][Gg])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 4h
  - name: Script blocks with download cradle, AMSI bypass or in-memory load
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Aa][Mm][Ss][Ii][Uu][Tt][Ii][Ll][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*[Rr][Ee][Ff][Ll][Ee][Cc][Tt][Ii][Oo][Nn]\.[Aa][Ss][Ss][Ee][Mm][Bb][Ll][Yy].*/ OR data_win_eventdata_scriptBlockText:/.*[Vv][Ii][Rr][Tt][Uu][Aa][Ll][Aa][Ll][Ll][Oo][Cc].*/)
    pivot_on:
    - host
    window: 1h
