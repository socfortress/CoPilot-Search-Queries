name: Suspicious Computer Machine Password by PowerShell
id: e3818659-5016-4811-a73c-dde4679169d2
version: 1
schema_version: "1.0"
date: "2022-02-21"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: e3818659-5016-4811-a73c-dde4679169d2
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  The Reset-ComputerMachinePassword cmdlet changes the computer account password
  that the computers use to authenticate to the domain controllers in the
  domain. You can use it to reset the password of the local computer. MITRE
  ATT&CK: T1078.

data_source:
  - PowerShell Module Logging EventID 4103

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4103"
        
        - wildcard:
            data_win_eventdata_contextInfo:
              value: "*Reset-ComputerMachinePassword*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_contextInfo
    - data_win_eventdata_payload
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Module Logging (EventID 4103) enabled via GPO and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where data_win_eventdata_contextInfo
  matches '*Reset-ComputerMachinePassword*'.

known_false_positives: >
  Administrator PowerShell scripts. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.management/reset-computermachinepassword?view=powershell-5.1
  - https://thedfirreport.com/2022/02/21/qbot-and-zerologon-lead-to-full-domain-compromise/
  - https://attack.mitre.org/techniques/T1078/

response:
  message: >
    Suspicious Computer Machine Password by PowerShell detected on host
    $agent_name$. Matched data_win_eventdata_contextInfo:
    $data_win_eventdata_contextInfo$. Matched data_win_eventdata_payload:
    $data_win_eventdata_payload$. MITRE ATT&CK: T1078
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_contextInfo
      type: other
    - field: data_win_eventdata_payload
      type: powershell_script

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1078
  custom_tags:
    - computer
    - machine
    - password
    - powershell
    - privilege_escalation
    - persistence
    - initial_access
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4103" AND data_win_eventdata_contextInfo:/.*[Rr][Ee][Ss][Ee][Tt]-[Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr][Mm][Aa][Cc][Hh][Ii][Nn][Ee][Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: de16d92c-c446-4d53-8938-10aeef41c8b6
    name: Computer Password Change Via Ksetup.EXE
    reason: Alternative way to rotate the same computer-account secret; either one reveals a host being taken out of sync with the domain, often ahead of Reset-ComputerMachinePassword.
  - id: dcc6a01e-9471-44a0-a699-71ea96f8ed8b
    name: Exploitation Attempt Of CVE-2020-1472 - Execution of ZeroLogon PoC
    reason: ZeroLogon blanks a DC machine password, and the attacker then resets the DC secret back with Reset-ComputerMachinePassword to hide the break (QBot/ZeroLogon DFIR report reference).
  - id: 611eab06-a145-4dfa-a295-3ccc5c20f59a
    name: Mimikatz DC Sync
    reason: After a machine-account takeover on a DC, the next step is DCSync replication to pull all domain hashes.
  - id: 17d619c1-e020-4347-957e-1d1207455c93
    name: Active Directory Replication from Non Machine Account
    reason: Confirms directory replication (DCSync) by a non-DC account following a machine-password reset on the DC.
  - id: 74176142-4684-4d8a-8b0a-713257e7df8e
    name: Potential Active Directory Enumeration Using AD Module - PsModule
    reason: Same 4103 PowerShell telemetry; AD-module enumeration is the typical reconnaissance preceding domain-controller attacks.
  - id: 4fcac6eb-0287-4090-8eea-2602e4c20040
    name: Potential QBot Activity
    reason: The referenced intrusion chained QBot into ZeroLogon and machine-password reset; QBot execution on the host is the likely entry point.
  - id: 41243735-89a7-4c83-bcdd-570aa78f00a1
    name: Domain Controller Discovery with Nltest
    reason: Attackers locate DCs with nltest before targeting their machine accounts.
  - id: 6e2a900a-ced9-4e4a-a9c2-13e706f9518a
    name: HackTool - Potential Remote Credential Dumping Activity Via CrackMapExec Or Impacket-Secretsdump
    reason: Remote secretsdump output files follow a successful domain/DC compromise via a reset machine credential.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other PowerShell module-logging events invoking machine-account or secure-channel cmdlets
    query: data_win_system_eventID:"4103" AND (data_win_eventdata_contextInfo:/.*[Tt][Ee][Ss][Tt]-[Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr][Ss][Ee][Cc][Uu][Rr][Ee][Cc][Hh][Aa][Nn][Nn][Ee][Ll].*/ OR data_win_eventdata_contextInfo:/.*[Ss][Ee][Tt]-[Aa][Dd][Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr].*/ OR data_win_eventdata_contextInfo:/.*[Aa][Dd][Dd]-[Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr].*/ OR data_win_eventdata_contextInfo:/.*[Rr][Ee][Ss][Ee][Tt]-[Aa][Dd][Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr].*/ OR data_win_eventdata_contextInfo:/.*[Rr][Ee][Mm][Oo][Vv][Ee]-[Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr].*/)
    pivot_on:
    - host
    window: 2h
  - name: 'Domain/secure-channel tooling: nltest, netdom, ksetup, klist or ZeroLogon-style commands'
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Nn][Ll][Tt][Ee][Ss][Tt].*(sc_reset|sc_verify|dclist|dsgetdc|trusted_domains).*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt][Dd][Oo][Mm].*([Rr][Ee][Ss][Ee][Tt][Pp][Ww][Dd]|[Rr][Ee][Mm][Oo][Vv][Ee]|[Jj][Oo][Ii][Nn]).*/ OR data_win_eventdata_commandLine:/.*[Kk][Ss][Ee][Tt][Uu][Pp].*[Ss][Ee][Tt][Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr][Pp][Aa][Ss][Ss].*/ OR data_win_eventdata_commandLine:/.*[Zz][Ee][Rr][Oo][Ll][Oo][Gg][Oo][Nn].*/)
    pivot_on:
    - host
    window: 2h
  - name: DCSync / secretsdump / Mimikatz credential tooling following the reset
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Dd][Uu][Mm][Pp]::[Dd][Cc][Ss][Yy][Nn][Cc].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Cc][Rr][Ee][Tt][Ss][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa]::.*/ OR data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll].*/ OR data_win_eventdata_image:/.*\\[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz].*/)) OR (data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz].*/ OR data_win_eventdata_scriptBlockText:/.*[Dd][Cc][Ss][Yy][Nn][Cc].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Aa][Dd][Dd][Bb][Aa][Cc][Cc][Oo][Uu][Nn][Tt].*/))
    pivot_on:
    - host
    window: 4h
  - name: Remote execution (PsExec/WMI/WinRM/admin shares) after credential reset
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Pp][Ss][Ee][Xx][Ee][Cc]|[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc])\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ww][Ss][Mm][Pp][Rr][Oo][Vv][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*\\\\[^ ]+\\([Aa][Dd][Mm][Ii][Nn]|[Cc]|[Ii][Pp][Cc])\$.*/)
    pivot_on:
    - host
    window: 4h
  - name: Outbound SMB/RPC/LDAP/Kerberos from PowerShell to domain controllers
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll](_[Ii][Ss][Ee])?\.[Ee][Xx][Ee]/ AND data_win_eventdata_destinationPort:(88 OR 135 OR 389 OR 445 OR 636 OR 3268)
    pivot_on:
    - host
    window: 2h
