name: PowerShell Get Clipboard
id: 4cbd4f12-2e22-43e3-882f-bff3247ffb78
version: 1
schema_version: "1.0"
date: "2023-01-04"
author: Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 4cbd4f12-2e22-43e3-882f-bff3247ffb78
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  A General detection for the Get-Clipboard commands in PowerShell logs. This
  could be an adversary capturing clipboard contents. MITRE ATT&CK: T1115.

data_source:
  - PowerShell Module Logging EventID 4103

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4103"
        
        - wildcard:
            data_win_eventdata_payload:
              value: "*Get-Clipboard*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_payload
    - data_win_eventdata_contextInfo
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Module Logging (EventID 4103) enabled via GPO and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where data_win_eventdata_payload
  matches '*Get-Clipboard*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/OTRF/detection-hackathon-apt29/issues/16
  - https://github.com/OTRF/ThreatHunter-Playbook/blob/2d4257f630f4c9770f78d0c1df059f891ffc3fec/docs/evals/apt29/detections/7.A.2_F4609F7E-C4DB-4327-91D4-59A58C962A02.md
  - https://attack.mitre.org/techniques/T1115/

response:
  message: >
    PowerShell Get Clipboard detected on host $agent_name$. Matched
    data_win_eventdata_payload: $data_win_eventdata_payload$. Matched
    data_win_eventdata_contextInfo: $data_win_eventdata_contextInfo$. MITRE
    ATT&CK: T1115
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_payload
      type: powershell_script
    - field: data_win_eventdata_contextInfo
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1115
  custom_tags:
    - powershell
    - clipboard
    - collection
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4103" AND data_win_eventdata_payload:/.*[Gg][Ee][Tt]-[Cc][Ll][Ii][Pp][Bb][Oo][Aa][Rr][Dd].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b9aeac14-2ffd-4ad3-b967-1354a4e628c3
    name: PowerShell Get-Clipboard Cmdlet Via CLI
    reason: Same Get-Clipboard behaviour seen from the process-creation side; confirms the command line, parent process and user that invoked the clipboard read.
  - id: d81d4d3d-76b5-4f21-ab51-b17d5164c106
    name: Windows PowerShell FakeCAPTCHA Clipboard Execution
    reason: Opposite clipboard abuse (victim pastes attacker-written clipboard into Run/PowerShell); on the same host it shows clipboard use as an initial-access vector preceding in-memory PowerShell.
  - id: c1dda054-d638-4c16-afc8-53e007f3fbc5
    name: Automated Collection Command PowerShell
    reason: Scripted collection toolkits commonly sweep the clipboard alongside file harvesting in the same PowerShell session.
  - id: f576a613-2392-4067-9d1a-9345fb58d8d1
    name: Automated Collection Command Prompt
    reason: Batch-driven collection on the same host that often accompanies clipboard capture during data gathering.
  - id: 2158f96f-43c2-43cb-952a-ab4580f32382
    name: Screen Capture Activity Via Psr.EXE
    reason: 'Companion user-input collection: clipboard theft is frequently paired with screen recording/capture in the same user session.'
  - id: 603c6630-5225-49c1-8047-26c964553e0e
    name: Enumerate Credentials from Windows Credential Manager With PowerShell
    reason: Clipboard often holds copied passwords/tokens; credential store enumeration in PowerShell is the sibling credential-harvest action.
  - id: daf7eb81-35fd-410d-9d7a-657837e602bb
    name: Zip A Folder With PowerShell For Staging In Temp  - PowerShell Module
    reason: 'Follow-on: collected data is compressed in PowerShell before exfiltration.'
  - id: de41232e-12e8-49fa-86bc-c05c7e722df9
    name: Suspicious PowerShell Download - PoshModule
    reason: 'Precursor: the PowerShell stager that pulls the collection script usually appears in 4103 logging just before Get-Clipboard runs.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Script blocks reading clipboard and staging output
    query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*([Gg]et-[Cc]lipboard|[Cc]lipboard::[Gg]et[Tt]ext|[Ww]indows.[Ff]orms.[Cc]lipboard).*/ AND data_win_eventdata_scriptBlockText:/.*([Oo]ut-[Ff]ile|[Aa]dd-[Cc]ontent|[Ss]et-[Cc]ontent|[Ii]nvoke-[Ww]eb[Rr]equest|[Ii]nvoke-[Rr]est[Mm]ethod|[Ss]end-[Mm]ail[Mm]essage|[Uu]pload).*/
    pivot_on:
    - host
    window: 1h
  - name: PowerShell spawned by Office/script hosts or launched encoded/hidden
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\([Pp]ower[Ss]hell|[Pp]wsh)\.[Ee][Xx][Ee]/ AND (data_win_eventdata_parentImage:/.*\([Ww][Ii][Nn][Ww][Oo][Rr][Dd]|[Ee][Xx][Cc][Ee][Ll]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Mm][Ss][Hh][Tt][Aa]|[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*( -[Ee][Nn][Cc]| -[Ee]ncodedcommand| -[Ww]indow[Ss]tyle +[Hh]idden| -[Ww] +[Hh]idden).*/)
    pivot_on:
    - host
    window: 1h
  - name: Keystroke and screen-capture primitives in script blocks
    query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*([Gg]et[Aa]sync[Kk]ey[Ss]tate|[Ss]et[Ww]indows[Hh]ook[Ee]x|[Gg]et-[Kk]eystrokes|[Cc]opy[Ff]rom[Ss]creen|[Gg]et[Ff]oreground[Ww]indow|[Ii]nput[Cc]apture).*/
    pivot_on:
    - host
    window: 2h
  - name: Archive or upload of staged output after clipboard read
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\([Cc][Uu][Rr][Ll]|[Ww][Gg][Ee][Tt]|7[Zz]|[Rr][Aa][Rr]|[Rr][Cc][Ll][Oo][Nn][Ee])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Cc]ompress-[Aa]rchive|[Uu]pload[Ff]ile|[Uu]pload[Ss]tring|[Ii]nvoke-[Ww]eb[Rr]equest.*[Pp]ost).*/)) OR (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.([Zz][Ii][Pp]|7[Zz]|[Rr][Aa][Rr]|[Tt][Xx][Tt])/ AND data_win_eventdata_targetFilename:/.*([Tt]emp|[Aa]pp[Dd]ata|[Pp]ublic).*/)
    pivot_on:
    - host
    window: 2h
  - name: Outbound network connections initiated by PowerShell
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\([Pp]ower[Ss]hell|[Pp]wsh)\.[Ee][Xx][Ee]/ AND data_win_eventdata_initiated:"true"
    pivot_on:
    - host
    window: 1h
