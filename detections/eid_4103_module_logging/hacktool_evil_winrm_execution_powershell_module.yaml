name: HackTool - Evil-WinRm Execution - PowerShell Module
id: 9fe55ea2-4cd6-4491-8a54-dd6871651b51
version: 1
schema_version: "1.0"
date: "2024-02-25"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 9fe55ea2-4cd6-4491-8a54-dd6871651b51
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of Evil-WinRM via PowerShell Module logs by leveraging
  the hardcoded strings inside the utility.

data_source:
  - PowerShell Module Logging EventID 4103

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4103"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_contextInfo:
                    value: "*:\\\\Windows\\\\System32\\\\wsmprovhost.exe*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_contextInfo:
                    value: "*:\\\\Windows\\\\SysWOW64\\\\wsmprovhost.exe*"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_payload:
                    value: "*value=\"(get-location).path*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_payload:
                    value: "*value=\"(get-item*).length*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_payload:
                    value: "*Invoke-Binary *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_payload:
                    value: "*Donut-Loader -process_id*-donutfile*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_payload:
                    value: "*Bypass-4MSI*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_payload:
                    value: "*IEX ([System.Text.Encoding]::ASCII.GetString([System.Convert]::FromBase64String($a))).replace('???','')*"
                    case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_payload:
                          value: "*$servicios = Get-ItemProperty \"registry::HKLM\\\\System\\\\CurrentControlSet\\\\Services\\\\\"*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_payload:
                          value: "*Where-Object {$_.imagepath -notmatch \"system\" -and $_.imagepath -ne $null } | Select-Object pschildname,imagepath*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_payload:
                          value: "*$a +=  \\\\\"$($_.FullName.Replace('\\\\','/'))/\\\\\"}else{  $a += \\\\\"$($_.FullName.Replace('\\\\', '/'))\\\\\" }*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_payload:
                          value: "*$a=@();$*"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_contextInfo
    - data_win_eventdata_payload
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Module Logging (EventID 4103) enabled via GPO and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where data_win_eventdata_contextInfo
  matches '*:\Windows\System32\wsmprovhost.exe*'; data_win_eventdata_contextInfo
  matches '*:\Windows\SysWOW64\wsmprovhost.exe*'; data_win_eventdata_payload
  matches '*value="(get-location).path*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/Hackplayers/evil-winrm/blob/7514b055d67ec19836e95c05bd63e7cc47c4c2aa/evil-winrm.rb
  - https://github.com/search?q=repo%3AHackplayers%2Fevil-winrm++shell.run%28&type=code

response:
  message: >
    HackTool - Evil-WinRm Execution - PowerShell Module detected on host
    $agent_name$. Matched data_win_eventdata_contextInfo:
    $data_win_eventdata_contextInfo$. Matched data_win_eventdata_payload:
    $data_win_eventdata_payload$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_contextInfo
      type: other
    - field: data_win_eventdata_payload
      type: powershell_script

tags:
  asset_type: Endpoint
  custom_tags:
    - hacktool
    - winrm
    - powershell
    - lateral_movement
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4103" AND (data_win_eventdata_contextInfo:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ww][Ss][Mm][Pp][Rr][Oo][Vv][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_contextInfo:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Ww][Oo][Ww]64\\[Ww][Ss][Mm][Pp][Rr][Oo][Vv][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee].*/) AND (data_win_eventdata_payload:/.*[Vv][Aa][Ll][Uu][Ee]=\"\([Gg][Ee][Tt]-[Ll][Oo][Cc][Aa][Tt][Ii][Oo][Nn]\)\.[Pp][Aa][Tt][Hh].*/ OR data_win_eventdata_payload:/.*[Vv][Aa][Ll][Uu][Ee]=\"\([Gg][Ee][Tt]-[Ii][Tt][Ee][Mm].*\)\.[Ll][Ee][Nn][Gg][Tt][Hh].*/ OR data_win_eventdata_payload:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Bb][Ii][Nn][Aa][Rr][Yy] .*/ OR data_win_eventdata_payload:/.*[Dd][Oo][Nn][Uu][Tt]-[Ll][Oo][Aa][Dd][Ee][Rr] -[Pp][Rr][Oo][Cc][Ee][Ss][Ss]_[Ii][Dd].*-[Dd][Oo][Nn][Uu][Tt][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_payload:/.*[Bb][Yy][Pp][Aa][Ss][Ss]-4[Mm][Ss][Ii].*/ OR data_win_eventdata_payload:/.*[Ii][Ee][Xx] \(\[[Ss][Yy][Ss][Tt][Ee][Mm]\.[Tt][Ee][Xx][Tt]\.[Ee][Nn][Cc][Oo][Dd][Ii][Nn][Gg]\]::[Aa][Ss][Cc][Ii][Ii]\.[Gg][Ee][Tt][Ss][Tt][Rr][Ii][Nn][Gg]\(\[[Ss][Yy][Ss][Tt][Ee][Mm]\.[Cc][Oo][Nn][Vv][Ee][Rr][Tt]\]::[Ff][Rr][Oo][Mm][Bb][Aa][Ss][Ee]64[Ss][Tt][Rr][Ii][Nn][Gg]\(\$[Aa]\)\)\)\.[Rr][Ee][Pp][Ll][Aa][Cc][Ee]\('...',''\).*/ OR (data_win_eventdata_payload:/.*\$[Ss][Ee][Rr][Vv][Ii][Cc][Ii][Oo][Ss] = [Gg][Ee][Tt]-[Ii][Tt][Ee][Mm][Pp][Rr][Oo][Pp][Ee][Rr][Tt][Yy] \"[Rr][Ee][Gg][Ii][Ss][Tt][Rr][Yy]::[Hh][Kk][Ll][Mm]\\[Ss][Yy][Ss][Tt][Ee][Mm]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt]\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\\".*/ AND data_win_eventdata_payload:/.*[Ww][Hh][Ee][Rr][Ee]-[Oo][Bb][Jj][Ee][Cc][Tt] \{\$_\.[Ii][Mm][Aa][Gg][Ee][Pp][Aa][Tt][Hh] -[Nn][Oo][Tt][Mm][Aa][Tt][Cc][Hh] \"[Ss][Yy][Ss][Tt][Ee][Mm]\" -[Aa][Nn][Dd] \$_\.[Ii][Mm][Aa][Gg][Ee][Pp][Aa][Tt][Hh] -[Nn][Ee] \$[Nn][Uu][Ll][Ll] \} \| [Ss][Ee][Ll][Ee][Cc][Tt]-[Oo][Bb][Jj][Ee][Cc][Tt] [Pp][Ss][Cc][Hh][Ii][Ll][Dd][Nn][Aa][Mm][Ee],[Ii][Mm][Aa][Gg][Ee][Pp][Aa][Tt][Hh].*/) OR (data_win_eventdata_payload:/.*\$[Aa] \+=  \\\"\$\(\$_\.[Ff][Uu][Ll][Ll][Nn][Aa][Mm][Ee]\.[Rr][Ee][Pp][Ll][Aa][Cc][Ee]\('\\','\/'\)\)\/\\\"\}[Ee][Ll][Ss][Ee]\{  \$[Aa] \+= \\\"\$\(\$_\.[Ff][Uu][Ll][Ll][Nn][Aa][Mm][Ee]\.[Rr][Ee][Pp][Ll][Aa][Cc][Ee]\('\\', '\/'\)\)\\\" \}.*/ AND data_win_eventdata_payload:/.*\$[Aa]=\@\(\);\$.*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 96b9f619-aa91-478f-bacb-c3e50f8df575
    name: Remote PowerShell Session (PS Module)
    reason: 'Same 4103 telemetry: the generic wsmprovhost remote-shell session that Evil-WinRM rides on; confirms the session itself and its user.'
  - id: c539afac-c12a-46ed-b1bd-5a5567c9f045
    name: Potential Remote PowerShell Session Initiated
    reason: Inbound connection to WinRM ports 5985/5986 is the network precursor of the Evil-WinRM shell hitting this host.
  - id: 13acf386-b8c6-4fe0-9a6e-c4756b974698
    name: Remote PowerShell Sessions Network Connections (WinRM)
    reason: Security-log view of the same WinRM connection; gives the source IP of the attacker's Evil-WinRM client.
  - id: 734f8d9b-42b8-41b2-bcf5-abaf49d5a3c8
    name: Remote PowerShell Session Host Process (WinRM)
    reason: wsmprovhost.exe is the host process that Evil-WinRM commands execute in; its creation marks the session start.
  - id: a197e378-d31b-41c0-9635-cfdf1c1bb423
    name: HackTool - WinRM Access Via Evil-WinRM
    reason: Process-creation detection of the same tool's artifacts (Evil-WinRM spawns), corroborating the 4103 payload strings.
  - id: 5cc2cda8-f261-4d88-a2de-e9e193c86716
    name: Suspicious Processes Spawned by WinRM
    reason: 'Follow-on: commands run through the Evil-WinRM shell appear as children of wsmprovhost.exe.'
  - id: ad1f4bb9-8dfb-4765-adb6-2a7cfb6c0f94
    name: Suspicious WSMAN Provider Image Loads
    reason: WSMAN provider DLLs loading into unexpected processes indicates WinRM-based execution, often alongside Evil-WinRM Invoke-Binary/Donut loading.
  - id: aa35a627-33fb-4d04-a165-d33b4afca3e8
    name: Remote LSASS Process Access Through Windows Remote Management
    reason: 'Likely next step: credential theft from LSASS through the remote WinRM shell after initial access.'
  - id: ea9bf0fa-edec-4fb8-8b78-b119f2528186
    name: Windows Defender AMSI Trigger Detected
    reason: Evil-WinRM's Bypass-4MSI and Invoke-Binary/Donut payloads commonly trip AMSI before or after the bypass lands.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Processes spawned by wsmprovhost (commands run in the remote shell)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Ww][Ss][Mm][Pp][Rr][Oo][Vv][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: AMSI bypass / in-memory loader script blocks (Bypass-4MSI, Donut, Invoke-Binary)
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:*Bypass-4MSI* OR data_win_eventdata_scriptBlockText:*Invoke-Binary* OR data_win_eventdata_scriptBlockText:*Donut-Loader* OR data_win_eventdata_scriptBlockText:*amsiInitFailed* OR data_win_eventdata_scriptBlockText:*AmsiUtils*)
    pivot_on:
    - host
    window: 1h
  - name: Inbound WinRM connections (5985/5986) to this host
    query: data_win_system_eventID:"3" AND (data_win_eventdata_destinationPort:"5985" OR data_win_eventdata_destinationPort:"5986")
    pivot_on:
    - host
    window: 2h
  - name: Remote logon preceding the WinRM session (network logon type 3)
    query: data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3" AND NOT data_win_eventdata_targetUserName:*$
    pivot_on:
    - host
    - user
    window: 2h
  - name: 'Credential access: LSASS access, injection and dump tooling'
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR data_win_system_eventID:"8" OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:*comsvcs* OR data_win_eventdata_commandLine:*procdump* OR data_win_eventdata_commandLine:*mimikatz* OR data_win_eventdata_commandLine:*sekurlsa*))
    pivot_on:
    - host
    window: 1h
