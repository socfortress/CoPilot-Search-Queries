name: HackTool - Evil-WinRm Execution - PowerShell Module
id: 9fe55ea2-4cd6-4491-8a54-dd6871651b51
version: 1
schema_version: "1.0"
date: "2024-02-25"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 9fe55ea2-4cd6-4491-8a54-dd6871651b51
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of Evil-WinRM via PowerShell Module logs by leveraging
  the hardcoded strings inside the utility.

data_source:
  - PowerShell Module Logging EventID 4103

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "4103"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_contextInfo:
                    value: "*:\\\\Windows\\\\System32\\\\wsmprovhost.exe*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_contextInfo:
                    value: "*:\\\\Windows\\\\SysWOW64\\\\wsmprovhost.exe*"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_payload:
                    value: "*value=\"(get-location).path*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_payload:
                    value: "*value=\"(get-item*).length*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_payload:
                    value: "*Invoke-Binary *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_payload:
                    value: "*Donut-Loader -process_id*-donutfile*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_payload:
                    value: "*Bypass-4MSI*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_payload:
                    value: "*IEX ([System.Text.Encoding]::ASCII.GetString([System.Convert]::FromBase64String($a))).replace('???','')*"
                    case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_payload:
                          value: "*$servicios = Get-ItemProperty \"registry::HKLM\\\\System\\\\CurrentControlSet\\\\Services\\\\\"*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_payload:
                          value: "*Where-Object {$_.imagepath -notmatch \"system\" -and $_.imagepath -ne $null } | Select-Object pschildname,imagepath*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_payload:
                          value: "*$a +=  \\\\\"$($_.FullName.Replace('\\\\','/'))/\\\\\"}else{  $a += \\\\\"$($_.FullName.Replace('\\\\', '/'))\\\\\" }*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_payload:
                          value: "*$a=@();$*"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_contextInfo
    - data_win_eventdata_payload
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires PowerShell Module Logging (EventID 4103) enabled via GPO and the
  Microsoft-Windows-PowerShell/Operational channel collected by the Wazuh agent
  (eventchannel localfile entry in ossec.conf), ingested into the wazuh-*
  indices. The detection looks for events where data_win_eventdata_contextInfo
  matches '*:\Windows\System32\wsmprovhost.exe*'; data_win_eventdata_contextInfo
  matches '*:\Windows\SysWOW64\wsmprovhost.exe*'; data_win_eventdata_payload
  matches '*value="(get-location).path*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/Hackplayers/evil-winrm/blob/7514b055d67ec19836e95c05bd63e7cc47c4c2aa/evil-winrm.rb
  - https://github.com/search?q=repo%3AHackplayers%2Fevil-winrm++shell.run%28&type=code

response:
  message: >
    HackTool - Evil-WinRm Execution - PowerShell Module detected on host
    $agent_name$. Matched data_win_eventdata_contextInfo:
    $data_win_eventdata_contextInfo$. Matched data_win_eventdata_payload:
    $data_win_eventdata_payload$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_contextInfo
      type: other
    - field: data_win_eventdata_payload
      type: powershell_script

tags:
  asset_type: Endpoint
  custom_tags:
    - hacktool
    - winrm
    - powershell
    - lateral_movement
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"4103" AND (data_win_eventdata_contextInfo:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ww][Ss][Mm][Pp][Rr][Oo][Vv][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_contextInfo:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Ww][Oo][Ww]64\\[Ww][Ss][Mm][Pp][Rr][Oo][Vv][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee].*/) AND (data_win_eventdata_payload:/.*[Vv][Aa][Ll][Uu][Ee]=\"\([Gg][Ee][Tt]-[Ll][Oo][Cc][Aa][Tt][Ii][Oo][Nn]\)\.[Pp][Aa][Tt][Hh].*/ OR data_win_eventdata_payload:/.*[Vv][Aa][Ll][Uu][Ee]=\"\([Gg][Ee][Tt]-[Ii][Tt][Ee][Mm].*\)\.[Ll][Ee][Nn][Gg][Tt][Hh].*/ OR data_win_eventdata_payload:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Bb][Ii][Nn][Aa][Rr][Yy] .*/ OR data_win_eventdata_payload:/.*[Dd][Oo][Nn][Uu][Tt]-[Ll][Oo][Aa][Dd][Ee][Rr] -[Pp][Rr][Oo][Cc][Ee][Ss][Ss]_[Ii][Dd].*-[Dd][Oo][Nn][Uu][Tt][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_payload:/.*[Bb][Yy][Pp][Aa][Ss][Ss]-4[Mm][Ss][Ii].*/ OR data_win_eventdata_payload:/.*[Ii][Ee][Xx] \(\[[Ss][Yy][Ss][Tt][Ee][Mm]\.[Tt][Ee][Xx][Tt]\.[Ee][Nn][Cc][Oo][Dd][Ii][Nn][Gg]\]::[Aa][Ss][Cc][Ii][Ii]\.[Gg][Ee][Tt][Ss][Tt][Rr][Ii][Nn][Gg]\(\[[Ss][Yy][Ss][Tt][Ee][Mm]\.[Cc][Oo][Nn][Vv][Ee][Rr][Tt]\]::[Ff][Rr][Oo][Mm][Bb][Aa][Ss][Ee]64[Ss][Tt][Rr][Ii][Nn][Gg]\(\$[Aa]\)\)\)\.[Rr][Ee][Pp][Ll][Aa][Cc][Ee]\('...',''\).*/ OR (data_win_eventdata_payload:/.*\$[Ss][Ee][Rr][Vv][Ii][Cc][Ii][Oo][Ss] = [Gg][Ee][Tt]-[Ii][Tt][Ee][Mm][Pp][Rr][Oo][Pp][Ee][Rr][Tt][Yy] \"[Rr][Ee][Gg][Ii][Ss][Tt][Rr][Yy]::[Hh][Kk][Ll][Mm]\\[Ss][Yy][Ss][Tt][Ee][Mm]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt]\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\\".*/ AND data_win_eventdata_payload:/.*[Ww][Hh][Ee][Rr][Ee]-[Oo][Bb][Jj][Ee][Cc][Tt] \{\$_\.[Ii][Mm][Aa][Gg][Ee][Pp][Aa][Tt][Hh] -[Nn][Oo][Tt][Mm][Aa][Tt][Cc][Hh] \"[Ss][Yy][Ss][Tt][Ee][Mm]\" -[Aa][Nn][Dd] \$_\.[Ii][Mm][Aa][Gg][Ee][Pp][Aa][Tt][Hh] -[Nn][Ee] \$[Nn][Uu][Ll][Ll] \} \| [Ss][Ee][Ll][Ee][Cc][Tt]-[Oo][Bb][Jj][Ee][Cc][Tt] [Pp][Ss][Cc][Hh][Ii][Ll][Dd][Nn][Aa][Mm][Ee],[Ii][Mm][Aa][Gg][Ee][Pp][Aa][Tt][Hh].*/) OR (data_win_eventdata_payload:/.*\$[Aa] \+=  \\\"\$\(\$_\.[Ff][Uu][Ll][Ll][Nn][Aa][Mm][Ee]\.[Rr][Ee][Pp][Ll][Aa][Cc][Ee]\('\\','\/'\)\)\/\\\"\}[Ee][Ll][Ss][Ee]\{  \$[Aa] \+= \\\"\$\(\$_\.[Ff][Uu][Ll][Ll][Nn][Aa][Mm][Ee]\.[Rr][Ee][Pp][Ll][Aa][Cc][Ee]\('\\', '\/'\)\)\\\" \}.*/ AND data_win_eventdata_payload:/.*\$[Aa]=\@\(\);\$.*/))

correlation:
  # Authored by the correlation engine for review.
  enrichment_searches:
  # Rule-specific telemetry pivots the engine runs around an alert from this rule,
  # scoped to the alert's host/user/IP within the window (behaviour-targeted, not a sweep).
    - name: "Download / AMSI-bypass / encoded script blocks on this host"
      query: 'data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Nn][Ee][Tt]\.[Ww][Ee][Bb][Cc][Ll][Ii][Ee][Nn][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Ff][Rr][Oo][Mm][Bb][Aa][Ss][Ee]64[Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Ee][Xx].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ee][Xx][Pp][Rr][Ee][Ss][Ss][Ii][Oo][Nn].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Tt][Aa][Rr][Tt]-[Bb][Ii][Tt][Ss][Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr].*/ OR data_win_eventdata_scriptBlockText:/.*[Aa][Mm][Ss][Ii][Uu][Tt][Ii][Ll][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*-[Ee][Nn][Cc].*/ OR data_win_eventdata_scriptBlockText:/.*-[Ee][Nn][Cc][Oo][Dd][Ee][Dd][Cc][Oo][Mm][Mm][Aa][Nn][Dd].*/ OR data_win_eventdata_scriptBlockText:/.*[Rr][Ee][Ff][Ll][Ee][Cc][Tt][Ii][Oo][Nn]\.[Aa][Ss][Ss][Ee][Mm][Bb][Ll][Yy].*/)'
      pivot_on: [host]
      window: 1h
    - name: "Follow-on LOLBin / signed-binary-proxy execution on this host"
      query: 'data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|\\[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Aa][Ss][Mm]\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Cc][Ss]\.[Ee][Xx][Ee]|\\[Mm][Ss][Bb][Uu][Ii][Ll][Dd]\.[Ee][Xx][Ee]|\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]|\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]|\\[Cc][Mm][Ss][Tt][Pp]\.[Ee][Xx][Ee]|\\[Oo][Dd][Bb][Cc][Cc][Oo][Nn][Ff]\.[Ee][Xx][Ee]|\\[Ff][Oo][Rr][Ff][Ii][Ll][Ee][Ss]\.[Ee][Xx][Ee]|\\[Pp][Cc][Aa][Ll][Uu][Aa]\.[Ee][Xx][Ee]|\\[Mm][Aa][Vv][Ii][Nn][Jj][Ee][Cc][Tt]\.[Ee][Xx][Ee]|\\[Ss][Cc][Rr][Ii][Pp][Tt][Rr][Uu][Nn][Nn][Ee][Rr]\.[Ee][Xx][Ee])/'
      pivot_on: [host]
      window: 1h
    - name: "Outbound connections by script interpreters on this host"
      query: 'data_win_system_eventID:"3" AND data_win_eventdata_image:/.*(\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]|\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]_[Ii][Ss][Ee]\.[Ee][Xx][Ee]|\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]|\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee])/'
      pivot_on: [host]
      window: 1h
