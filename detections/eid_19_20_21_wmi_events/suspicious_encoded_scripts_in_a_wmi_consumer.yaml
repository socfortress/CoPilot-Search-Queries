name: Suspicious Encoded Scripts in a WMI Consumer
id: 83844185-1c5b-45bc-bcf3-b5bf3084ca5b
version: 1
schema_version: "1.0"
date: "2022-10-09"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 83844185-1c5b-45bc-bcf3-b5bf3084ca5b
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious encoded payloads in WMI Event Consumers. MITRE ATT&CK:
  T1047, T1546.003.

data_source:
  - Sysmon EventID 19/20/21 - WMI Event

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_win_system_eventID: "19"
              - term:
                  data_win_system_eventID: "20"
              - term:
                  data_win_system_eventID: "21"
            minimum_should_match: 1
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_destination:
                    value: "*V3JpdGVQcm9jZXNzTWVtb3J5*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_destination:
                    value: "*dyaXRlUHJvY2Vzc01lbW9ye*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_destination:
                    value: "*Xcml0ZVByb2Nlc3NNZW1vcn*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_destination:
                    value: "*VGhpcyBwcm9ncmFtIGNhbm5vdCBiZSBydW4gaW4gRE9TIG1vZG*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_destination:
                    value: "*RoaXMgcHJvZ3JhbSBjYW5ub3QgYmUgcnVuIGluIERPUyBtb2Rl*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_destination:
                    value: "*UaGlzIHByb2dyYW0gY2Fubm90IGJlIHJ1biBpbiBET1MgbW9kZ*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_destination:
                    value: "*VGhpcyBwcm9ncmFtIG11c3QgYmUgcnVuIHVuZGVyIFdpbjMy*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_destination:
                    value: "*RoaXMgcHJvZ3JhbSBtdXN0IGJlIHJ1biB1bmRlciBXaW4zM*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_destination:
                    value: "*UaGlzIHByb2dyYW0gbXVzdCBiZSBydW4gdW5kZXIgV2luMz*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_destination
    - data_win_eventdata_operation
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon WMI event logging (EventIDs 19/20/21) enabled in the Sysmon
  configuration and the Microsoft-Windows-Sysmon/Operational channel collected
  by the Wazuh agent. The detection looks for events where
  data_win_eventdata_destination matches '*V3JpdGVQcm9jZXNzTWVtb3J5*';
  data_win_eventdata_destination matches '*dyaXRlUHJvY2Vzc01lbW9ye*';
  data_win_eventdata_destination matches '*Xcml0ZVByb2Nlc3NNZW1vcn*', among
  other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/RiccardoAncarani/LiquidSnake
  - https://attack.mitre.org/techniques/T1047/
  - https://attack.mitre.org/techniques/T1546/003/

response:
  message: >
    Suspicious Encoded Scripts in a WMI Consumer detected on host $agent_name$.
    Matched data_win_eventdata_destination: $data_win_eventdata_destination$.
    Matched data_win_eventdata_operation: $data_win_eventdata_operation$. MITRE
    ATT&CK: T1047, T1546.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_destination
      type: other
    - field: data_win_eventdata_operation
      type: operation

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1047
    - T1546.003
  custom_tags:
    - encoded
    - consumer
    - wmi_event
    - sysmon
    - privilege_escalation
    - execution
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"19" OR data_win_system_eventID:"20" OR data_win_system_eventID:"21") AND (data_win_eventdata_destination:/.*[Vv]3[Jj][Pp][Dd][Gg][Vv][Qq][Cc][Mm]9[Jj][Zz][Xx][Nn][Zz][Tt][Ww][Vv][Tt][Bb]3[Jj]5.*/ OR data_win_eventdata_destination:/.*[Dd][Yy][Aa][Xx][Rr][Ll][Uu][Hh][Jj][Vv][Yy]2[Vv][Zz][Cc]01[Ll][Bb][Ww]9[Yy][Ee].*/ OR data_win_eventdata_destination:/.*[Xx][Cc][Mm][Ll]0[Zz][Vv][Bb][Yy][Bb]2[Nn][Ll][Cc]3[Nn][Nn][Zz][Ww]1[Vv][Cc][Nn].*/ OR data_win_eventdata_destination:/.*[Vv][Gg][Hh][Pp][Cc][Yy][Bb][Ww][Cc][Mm]9[Nn][Cc][Mm][Ff][Tt][Ii][Gg][Nn][Hh][Bb][Mm]5[Vv][Dd][Cc][Bb][Ii][Zz][Ss][Bb][Yy][Dd][Ww]4[Gg][Aa][Ww]4[Gg][Rr][Ee]9[Tt][Ii][Gg]1[Vv][Zz][Gg].*/ OR data_win_eventdata_destination:/.*[Rr][Oo][Aa][Xx][Mm][Gg][Cc][Hh][Jj][Vv][Zz]3[Jj][Hh][Bb][Ss][Bb][Jj][Yy][Ww]5[Uu][Bb]3[Qq][Gg][Yy][Mm][Uu][Gg][Cc][Nn][Vv][Uu][Ii][Gg][Ll][Uu][Ii][Ee][Rr][Pp][Uu][Yy][Bb][Tt][Bb]2[Rr][Ll].*/ OR data_win_eventdata_destination:/.*[Uu][Aa][Gg][Ll][Zz][Ii][Hh][Bb][Yy][Bb]2[Dd][Yy][Yy][Ww]0[Gg][Yy]2[Ff][Uu][Bb][Mm]90[Ii][Gg][Jj][Ll][Ii][Hh][Jj]1[Bb][Ii][Bb][Pp][Bb][Ii][Bb][Ee][Tt]1[Mm][Gg][Bb][Ww]9[Kk][Zz].*/ OR data_win_eventdata_destination:/.*[Vv][Gg][Hh][Pp][Cc][Yy][Bb][Ww][Cc][Mm]9[Nn][Cc][Mm][Ff][Tt][Ii][Gg]11[Cc]3[Qq][Gg][Yy][Mm][Uu][Gg][Cc][Nn][Vv][Uu][Ii][Hh][Vv][Uu][Zz][Gg][Vv][Yy][Ii][Ff][Dd][Pp][Bb][Jj][Mm][Yy].*/ OR data_win_eventdata_destination:/.*[Rr][Oo][Aa][Xx][Mm][Gg][Cc][Hh][Jj][Vv][Zz]3[Jj][Hh][Bb][Ss][Bb][Tt][Dd][Xx][Nn]0[Ii][Gg][Jj][Ll][Ii][Hh][Jj]1[Bb][Ii][Bb]1[Bb][Mm][Rr][Ll][Cc][Ii][Bb][Xx][Aa][Ww]4[Zz][Mm].*/ OR data_win_eventdata_destination:/.*[Uu][Aa][Gg][Ll][Zz][Ii][Hh][Bb][Yy][Bb]2[Dd][Yy][Yy][Ww]0[Gg][Bb][Xx][Vv][Zz][Dd][Cc][Bb][Ii][Zz][Ss][Bb][Yy][Dd][Ww]4[Gg][Dd][Ww]5[Kk][Zz][Xx][Ii][Gg][Vv]2[Ll][Uu][Mm][Zz].*/)

correlation:
  # Authored by the correlation engine for review. Related CoPilot Searches to run
  # around an alert from this rule, scoped to the same host/user/IP within the window.
  related_rules:
    - id: ec570e53-4c76-45a9-804d-dc3f355ff7a7
      name: "7Zip Compressing Dump Files"
      reason: "next kill-chain tactic: Collection"
    - id: 0255a820-e564-4e40-af2b-6ac61160335c
      name: "A New Trust Was Created To A Domain"
      reason: "next kill-chain tactic: Persistence"
    - id: 35ba1d85-724d-42a3-889f-2e2362bcaf23
      name: "AD Privileged Users or Groups Reconnaissance"
      reason: "next kill-chain tactic: Discovery"
    - id: 0a1255c5-d732-4b62-ac02-b5152d34fb83
      name: "ADExplorer Writing Complete AD Snapshot Into .dat File"
      reason: "next kill-chain tactic: Discovery"
    - id: 1ea13e8c-03ea-409b-877d-ce5c3d2c1cb3
      name: "ADFS Database Named Pipe Connection By Uncommon Tool"
      reason: "next kill-chain tactic: Collection"
    - id: 75bf09fa-1dd7-4d18-9af9-dd9e492562eb
      name: "ADSI-Cache File Creation By Uncommon Tool"
      reason: "next kill-chain tactic: Command and Control"
  window: 1h
  enrichment_searches:
  # Rule-specific telemetry pivots the engine runs around an alert from this rule,
  # scoped to the alert's host/user/IP within the window (behaviour-targeted, not a sweep).
    - name: "WMI process execution on this host"
      query: '(data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*[Pp][Rr][Oo][Cc][Ee][Ss][Ss] [Cc][Aa][Ll][Ll] [Cc][Rr][Ee][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*\/[Nn][Oo][Dd][Ee]:.*/) OR data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*(\\[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee]\.[Ee][Xx][Ee])/ OR data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Mm][Ii][Mm][Ee][Tt][Hh][Oo][Dd].*/ OR data_win_eventdata_commandLine:/.*[Gg][Ee][Tt]-[Ww][Mm][Ii][Oo][Bb][Jj][Ee][Cc][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Cc][Ii][Mm][Mm][Ee][Tt][Hh][Oo][Dd].*/))'
      pivot_on: [host]
      window: 2h
    - name: "Autostart persistence written on this host (Run keys, services, IFEO)"
      query: '(data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/ OR data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn][Oo][Nn][Cc][Ee].*/ OR data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt]\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\.*/ OR data_win_eventdata_targetObject:/.*[Ii][Mm][Aa][Gg][Ee] [Ff][Ii][Ll][Ee] [Ee][Xx][Ee][Cc][Uu][Tt][Ii][Oo][Nn] [Oo][Pp][Tt][Ii][Oo][Nn][Ss]\\.*/ OR data_win_eventdata_targetObject:/.*[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]\\[Ss][Hh][Ee][Ll][Ll].*/ OR data_win_eventdata_targetObject:/.*[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]\\[Uu][Ss][Ee][Rr][Ii][Nn][Ii][Tt].*/ OR data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\\[Rr][Uu][Nn].*/ OR data_win_eventdata_targetObject:/.*[Pp][Oo][Ll][Ii][Cc][Ii][Ee][Ss]\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\\[Rr][Uu][Nn].*/ OR data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ll][Oo][Aa][Dd].*/)'
      pivot_on: [host]
      window: 2h
    - name: "Follow-on LOLBin / signed-binary-proxy execution on this host"
      query: 'data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|\\[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Aa][Ss][Mm]\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Cc][Ss]\.[Ee][Xx][Ee]|\\[Mm][Ss][Bb][Uu][Ii][Ll][Dd]\.[Ee][Xx][Ee]|\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]|\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]|\\[Cc][Mm][Ss][Tt][Pp]\.[Ee][Xx][Ee]|\\[Oo][Dd][Bb][Cc][Cc][Oo][Nn][Ff]\.[Ee][Xx][Ee]|\\[Ff][Oo][Rr][Ff][Ii][Ll][Ee][Ss]\.[Ee][Xx][Ee]|\\[Pp][Cc][Aa][Ll][Uu][Aa]\.[Ee][Xx][Ee]|\\[Mm][Aa][Vv][Ii][Nn][Jj][Ee][Cc][Tt]\.[Ee][Xx][Ee]|\\[Ss][Cc][Rr][Ii][Pp][Tt][Rr][Uu][Nn][Nn][Ee][Rr]\.[Ee][Xx][Ee])/'
      pivot_on: [host]
      window: 1h
    - name: "UAC-bypass / privilege-escalation binaries on this host"
      query: 'data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*(\\[Ff][Oo][Dd][Hh][Ee][Ll][Pp][Ee][Rr]\.[Ee][Xx][Ee]|\\[Ee][Vv][Ee][Nn][Tt][Vv][Ww][Rr]\.[Ee][Xx][Ee]|\\[Ss][Dd][Cc][Ll][Tt]\.[Ee][Xx][Ee]|\\[Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr][Dd][Ee][Ff][Aa][Uu][Ll][Tt][Ss]\.[Ee][Xx][Ee]|\\[Ss][Ll][Uu][Ii]\.[Ee][Xx][Ee]|\\[Ww][Ss][Rr][Ee][Ss][Ee][Tt]\.[Ee][Xx][Ee])/ OR data_win_eventdata_parentImage:/.*(\\[Ff][Oo][Dd][Hh][Ee][Ll][Pp][Ee][Rr]\.[Ee][Xx][Ee]|\\[Ee][Vv][Ee][Nn][Tt][Vv][Ww][Rr]\.[Ee][Xx][Ee]|\\[Ss][Dd][Cc][Ll][Tt]\.[Ee][Xx][Ee]|\\[Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr][Dd][Ee][Ff][Aa][Uu][Ll][Tt][Ss]\.[Ee][Xx][Ee]|\\[Ss][Ll][Uu][Ii]\.[Ee][Xx][Ee]|\\[Ww][Ss][Rr][Ee][Ss][Ee][Tt]\.[Ee][Xx][Ee])/)'
      pivot_on: [host]
      window: 2h
