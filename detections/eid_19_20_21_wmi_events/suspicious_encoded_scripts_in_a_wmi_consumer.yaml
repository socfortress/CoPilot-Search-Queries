name: Suspicious Encoded Scripts in a WMI Consumer
id: 83844185-1c5b-45bc-bcf3-b5bf3084ca5b
version: 1
schema_version: "1.0"
date: "2022-10-09"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 83844185-1c5b-45bc-bcf3-b5bf3084ca5b
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious encoded payloads in WMI Event Consumers. MITRE ATT&CK:
  T1047, T1546.003.

data_source:
  - Sysmon EventID 19/20/21 - WMI Event

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_win_system_eventID: "19"
              - term:
                  data_win_system_eventID: "20"
              - term:
                  data_win_system_eventID: "21"
            minimum_should_match: 1
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_destination:
                    value: "*V3JpdGVQcm9jZXNzTWVtb3J5*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_destination:
                    value: "*dyaXRlUHJvY2Vzc01lbW9ye*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_destination:
                    value: "*Xcml0ZVByb2Nlc3NNZW1vcn*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_destination:
                    value: "*VGhpcyBwcm9ncmFtIGNhbm5vdCBiZSBydW4gaW4gRE9TIG1vZG*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_destination:
                    value: "*RoaXMgcHJvZ3JhbSBjYW5ub3QgYmUgcnVuIGluIERPUyBtb2Rl*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_destination:
                    value: "*UaGlzIHByb2dyYW0gY2Fubm90IGJlIHJ1biBpbiBET1MgbW9kZ*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_destination:
                    value: "*VGhpcyBwcm9ncmFtIG11c3QgYmUgcnVuIHVuZGVyIFdpbjMy*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_destination:
                    value: "*RoaXMgcHJvZ3JhbSBtdXN0IGJlIHJ1biB1bmRlciBXaW4zM*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_destination:
                    value: "*UaGlzIHByb2dyYW0gbXVzdCBiZSBydW4gdW5kZXIgV2luMz*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_destination
    - data_win_eventdata_operation
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon WMI event logging (EventIDs 19/20/21) enabled in the Sysmon
  configuration and the Microsoft-Windows-Sysmon/Operational channel collected
  by the Wazuh agent. The detection looks for events where
  data_win_eventdata_destination matches '*V3JpdGVQcm9jZXNzTWVtb3J5*';
  data_win_eventdata_destination matches '*dyaXRlUHJvY2Vzc01lbW9ye*';
  data_win_eventdata_destination matches '*Xcml0ZVByb2Nlc3NNZW1vcn*', among
  other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/RiccardoAncarani/LiquidSnake
  - https://attack.mitre.org/techniques/T1047/
  - https://attack.mitre.org/techniques/T1546/003/

response:
  message: >
    Suspicious Encoded Scripts in a WMI Consumer detected on host $agent_name$.
    Matched data_win_eventdata_destination: $data_win_eventdata_destination$.
    Matched data_win_eventdata_operation: $data_win_eventdata_operation$. MITRE
    ATT&CK: T1047, T1546.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_destination
      type: other
    - field: data_win_eventdata_operation
      type: operation

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1047
    - T1546.003
  custom_tags:
    - encoded
    - consumer
    - wmi_event
    - sysmon
    - privilege_escalation
    - execution
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"19" OR data_win_system_eventID:"20" OR data_win_system_eventID:"21") AND (data_win_eventdata_destination:/.*[Vv]3[Jj][Pp][Dd][Gg][Vv][Qq][Cc][Mm]9[Jj][Zz][Xx][Nn][Zz][Tt][Ww][Vv][Tt][Bb]3[Jj]5.*/ OR data_win_eventdata_destination:/.*[Dd][Yy][Aa][Xx][Rr][Ll][Uu][Hh][Jj][Vv][Yy]2[Vv][Zz][Cc]01[Ll][Bb][Ww]9[Yy][Ee].*/ OR data_win_eventdata_destination:/.*[Xx][Cc][Mm][Ll]0[Zz][Vv][Bb][Yy][Bb]2[Nn][Ll][Cc]3[Nn][Nn][Zz][Ww]1[Vv][Cc][Nn].*/ OR data_win_eventdata_destination:/.*[Vv][Gg][Hh][Pp][Cc][Yy][Bb][Ww][Cc][Mm]9[Nn][Cc][Mm][Ff][Tt][Ii][Gg][Nn][Hh][Bb][Mm]5[Vv][Dd][Cc][Bb][Ii][Zz][Ss][Bb][Yy][Dd][Ww]4[Gg][Aa][Ww]4[Gg][Rr][Ee]9[Tt][Ii][Gg]1[Vv][Zz][Gg].*/ OR data_win_eventdata_destination:/.*[Rr][Oo][Aa][Xx][Mm][Gg][Cc][Hh][Jj][Vv][Zz]3[Jj][Hh][Bb][Ss][Bb][Jj][Yy][Ww]5[Uu][Bb]3[Qq][Gg][Yy][Mm][Uu][Gg][Cc][Nn][Vv][Uu][Ii][Gg][Ll][Uu][Ii][Ee][Rr][Pp][Uu][Yy][Bb][Tt][Bb]2[Rr][Ll].*/ OR data_win_eventdata_destination:/.*[Uu][Aa][Gg][Ll][Zz][Ii][Hh][Bb][Yy][Bb]2[Dd][Yy][Yy][Ww]0[Gg][Yy]2[Ff][Uu][Bb][Mm]90[Ii][Gg][Jj][Ll][Ii][Hh][Jj]1[Bb][Ii][Bb][Pp][Bb][Ii][Bb][Ee][Tt]1[Mm][Gg][Bb][Ww]9[Kk][Zz].*/ OR data_win_eventdata_destination:/.*[Vv][Gg][Hh][Pp][Cc][Yy][Bb][Ww][Cc][Mm]9[Nn][Cc][Mm][Ff][Tt][Ii][Gg]11[Cc]3[Qq][Gg][Yy][Mm][Uu][Gg][Cc][Nn][Vv][Uu][Ii][Hh][Vv][Uu][Zz][Gg][Vv][Yy][Ii][Ff][Dd][Pp][Bb][Jj][Mm][Yy].*/ OR data_win_eventdata_destination:/.*[Rr][Oo][Aa][Xx][Mm][Gg][Cc][Hh][Jj][Vv][Zz]3[Jj][Hh][Bb][Ss][Bb][Tt][Dd][Xx][Nn]0[Ii][Gg][Jj][Ll][Ii][Hh][Jj]1[Bb][Ii][Bb]1[Bb][Mm][Rr][Ll][Cc][Ii][Bb][Xx][Aa][Ww]4[Zz][Mm].*/ OR data_win_eventdata_destination:/.*[Uu][Aa][Gg][Ll][Zz][Ii][Hh][Bb][Yy][Bb]2[Dd][Yy][Yy][Ww]0[Gg][Bb][Xx][Vv][Zz][Dd][Cc][Bb][Ii][Zz][Ss][Bb][Yy][Dd][Ww]4[Gg][Dd][Ww]5[Kk][Zz][Xx][Ii][Gg][Vv]2[Ll][Uu][Mm][Zz].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 692f0bec-83ba-4d04-af7e-e884a96059b6
    name: Potential WMI Lateral Movement WmiPrvSE Spawned PowerShell
    reason: 'Precursor/landing: PowerShell spawned by WmiPrvSE.exe is how a remote WMI operator (e.g. wmiexec/LiquidSnake) lands on this host - the same arrival that then registers the encoded WMI consumer this rule caught.'
  - id: 9e07f6e7-83aa-45c6-998e-0af26efd0a85
    name: Powershell WMI Persistence
    reason: 'Precursor/creation: the New-CimInstance/Set-WmiInstance into root/subscription that builds the __EventFilter + Consumer + Binding is the exact command whose resulting EID 19/20/21 binding this rule fires on.'
  - id: ebef4391-1a81-4761-a40a-1db446c0e625
    name: NewActiveScriptEventConsumer Creation Attempt via Wmic.EXE
    reason: 'Precursor/creation: wmic.exe creating an ActiveScriptEventConsumer is an alternate command that registers the very consumer whose base64 PE/shellcode payload this rule decodes.'
  - id: windows-mof-event-triggered-execution-wmi-001
    name: Windows MOF Event Triggered Execution via WMI
    reason: 'Precursor/creation: mofcomp.exe compiling a MOF is a third way to install the WMI permanent subscription, so a mofcomp hit just before is the creation step behind this encoded consumer.'
  - id: 1816994b-42e1-4fb1-afd2-134d88184f71
    name: PowerShell Base64 Encoded WMI Classes
    reason: 'Precursor/same-tradecraft: base64-encoded WMI class use in PowerShell is the identical encode-the-WMI-payload obfuscation, often the staging of the subscription this rule found as an encoded consumer.'
  - id: windows-wmi-permanent-event-subscription-001
    name: Windows WMI Permanent Event Subscription
    reason: 'Co-occurring: the broad EID 19/20/21 permanent-subscription detection fires on the same binding event; its SYSTEM-level survives-reboot context confirms this encoded consumer is persistence, not a one-off.'
  - id: fe21810c-2a8c-478f-8dd3-5a287fb2a0e0
    name: Suspicious Scripting in a WMI Consumer
    reason: 'Co-occurring/sibling: inspects the same consumer''s script text for download-cradle scripting; a hit on the same host/window means the same consumer carries both an encoded PE and a live scripting stager.'
  - id: 493fb4ab-cdcc-4c4f-818c-0e363bd1e4bb
    name: WMI Event Consumer Created Named Pipe
    reason: 'Follow-on/execution: scrcons.exe (the ActiveScriptEventConsumer host) creating a named pipe is the LiquidSnake execution signature - the encoded consumer firing and opening its named-pipe C2 channel.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: WMI event-subscription creation commands on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*([Ee][Vv][Ee][Nn][Tt][Cc][Oo][Nn][Ss][Uu][Mm][Ee][Rr]|[Ee][Vv][Ee][Nn][Tt][Ff][Ii][Ll][Tt][Ee][Rr]|[Ff][Ii][Ll][Tt][Ee][Rr][Tt][Oo][Cc][Oo][Nn][Ss][Uu][Mm][Ee][Rr][Bb][Ii][Nn][Dd][Ii][Nn][Gg]|[Rr][Oo][Oo][Tt].[Ss][Uu][Bb][Ss][Cc][Rr][Ii][Pp][Tt][Ii][Oo][Nn]|[Ss][Ee][Tt]-[Ww][Mm][Ii][Ii][Nn][Ss][Tt][Aa][Nn][Cc][Ee]|[Rr][Ee][Gg][Ii][Ss][Tt][Ee][Rr]-[Ww][Mm][Ii][Ee][Vv][Ee][Nn][Tt]).*/ OR data_win_eventdata_image:/.*\\[Mm][Oo][Ff][Cc][Oo][Mm][Pp]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: WMI consumer host scrcons.exe executing on this host
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ss][Cc][Rr][Cc][Oo][Nn][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ss][Cc][Rr][Cc][Oo][Nn][Ss]\.[Ee][Xx][Ee]/)) OR (data_win_system_eventID:"7" AND data_win_eventdata_image:/.*\\[Ss][Cc][Rr][Cc][Oo][Nn][Ss]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_imageLoaded:/.*\\[Ss][Cc][Rr][Rr][Uu][Nn]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Jj][Ss][Cc][Rr][Ii][Pp][Tt]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Vv][Bb][Ss][Cc][Rr][Ii][Pp][Tt]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Ww][Bb][Ee][Mm][Dd][Ii][Ss][Pp]\.[Tt][Ll][Bb]/))
    pivot_on:
    - host
    window: 4h
  - name: In-memory injection and LSASS access from a script host on this host
    query: (data_win_system_eventID:"8" AND data_win_eventdata_sourceImage:/.*\\([Ss][Cc][Rr][Cc][Oo][Nn][Ss]|[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Mm][Ss][Hh][Tt][Aa]|[Rr][Uu][Nn][Dd][Ll][Ll]32)\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_sourceImage:/.*\\([Ss][Cc][Rr][Cc][Oo][Nn][Ss]|[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Rr][Uu][Nn][Dd][Ll][Ll]32)\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
  - name: Remote WMI lateral-movement landing (WmiPrvSE child processes) on this host
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee]\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]|[Cc][Mm][Dd]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Mm][Ss][Hh][Tt][Aa]|[Rr][Uu][Nn][Dd][Ll][Ll]32|[Rr][Ee][Gg][Ss][Vv][Rr]32|[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]|[Ww][Mm][Ii][Cc])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 4h
  - name: Encoded/reflective PowerShell lineage on this host
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*-[Ee][Nn][Cc].*/ OR data_win_eventdata_commandLine:/.*[Ff][Rr][Oo][Mm][Bb][Aa][Ss][Ee]64[Ss][Tt][Rr][Ii][Nn][Gg].*/)) OR (data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ff][Rr][Oo][Mm][Bb][Aa][Ss][Ee]64[Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Ww][Rr][Ii][Tt][Ee][Pp][Rr][Oo][Cc][Ee][Ss][Ss][Mm][Ee][Mm][Oo][Rr][Yy].*/ OR data_win_eventdata_scriptBlockText:/.*[Rr][Ee][Ff][Ll][Ee][Cc][Tt][Ii][Oo][Nn]\.[Aa][Ss][Ss][Ee][Mm][Bb][Ll][Yy].*/))
    pivot_on:
    - host
    window: 2h
