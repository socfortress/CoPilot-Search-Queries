name: WMI Event Subscription
id: 0f06a3a5-6a09-413f-8743-e6cf35561297
version: 1
schema_version: "1.0"
date: "2021-11-27"
author: Tom Ueltschi (@c_APT_ure)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 0f06a3a5-6a09-413f-8743-e6cf35561297
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects creation of WMI event subscription persistence method. MITRE ATT&CK:
  T1546.003.

data_source:
  - Sysmon EventID 19/20/21 - WMI Event

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_win_system_eventID: "19"
              - term:
                  data_win_system_eventID: "20"
              - term:
                  data_win_system_eventID: "21"
            minimum_should_match: 1
        
        - bool:
            should:
              - term:
                  data_win_system_eventID: "19"
              - term:
                  data_win_system_eventID: "20"
              - term:
                  data_win_system_eventID: "21"
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_operation
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon WMI event logging (EventIDs 19/20/21) enabled in the Sysmon
  configuration and the Microsoft-Windows-Sysmon/Operational channel collected
  by the Wazuh agent. The detection looks for events where
  data_win_system_eventID equals '19'; data_win_system_eventID equals '20';
  data_win_system_eventID equals '21'.

known_false_positives: >
  Exclude legitimate (vetted) use of WMI event subscription in your network.
  Baseline expected activity in your environment and tune this detection before
  relying on it for automated response.

references:
  - https://learn.microsoft.com/en-us/sysinternals/downloads/sysmon#event-id-19-wmievent-wmieventfilter-activity-detected
  - https://learn.microsoft.com/en-us/sysinternals/downloads/sysmon#event-id-20-wmievent-wmieventconsumer-activity-detected
  - https://learn.microsoft.com/en-us/sysinternals/downloads/sysmon#event-id-21-wmievent-wmieventconsumertofilter-activity-detected
  - https://attack.mitre.org/techniques/T1546/003/

response:
  message: >
    WMI Event Subscription detected on host $agent_name$. Matched
    data_win_eventdata_operation: $data_win_eventdata_operation$. Matched
    data_win_eventdata_user: $data_win_eventdata_user$. MITRE ATT&CK: T1546.003
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_operation
      type: operation
    - field: data_win_eventdata_user
      type: user

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1546.003
  custom_tags:
    - subscription
    - wmi_event
    - sysmon
    - privilege_escalation
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"19" OR data_win_system_eventID:"20" OR data_win_system_eventID:"21") AND (data_win_system_eventID:"19" OR data_win_system_eventID:"20" OR data_win_system_eventID:"21")

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: ebef4391-1a81-4761-a40a-1db446c0e625
    name: NewActiveScriptEventConsumer Creation Attempt via Wmic.EXE
    reason: 'Direct precursor: the wmic.exe CREATE command that registers the ActiveScriptEventConsumer whose FilterToConsumerBinding produces these EID 19/20/21 events - the process that planted the subscription.'
  - id: 9e07f6e7-83aa-45c6-998e-0af26efd0a85
    name: Powershell WMI Persistence
    reason: 'Direct precursor (Empire/CIM method): PowerShell New-CimInstance against root/subscription building __EventFilter + CommandLineEventConsumer - the script that creates exactly the subscription this rule observes.'
  - id: 1dd05363-104e-4b4a-b963-196a534b03a1
    name: Potential Suspicious Mofcomp Execution
    reason: 'Alternative precursor: mofcomp.exe compiling a malicious .mof installs the filter/consumer/binding into the WMI repository, generating these Sysmon WMI events.'
  - id: fe21810c-2a8c-478f-8dd3-5a287fb2a0e0
    name: Suspicious Scripting in a WMI Consumer
    reason: 'Co-occurring sibling on the same EID 19/20/21 events: inspects the consumer command for script download-and-exec markers (New-Object Net.WebClient, IEX, -enc), showing the bound consumer is malicious.'
  - id: 83844185-1c5b-45bc-bcf3-b5bf3084ca5b
    name: Suspicious Encoded Scripts in a WMI Consumer
    reason: 'Co-occurring sibling on the same WMI events: flags a base64 PE/shellcode payload embedded in the consumer destination - the high-confidence malicious case of this subscription.'
  - id: windows-wmi-permanent-event-subscription-001
    name: Windows WMI Permanent Event Subscription
    reason: Near-duplicate detector of the same EID 19/20/21 activity; its co-firing confirms a repository-backed PERMANENT subscription (runs as SYSTEM, survives reboot) rather than a transient in-process one.
  - id: b439f47d-ef52-4b29-9a2f-57d8a96cb6b8
    name: WMI ActiveScriptEventConsumers Activity Via Scrcons.EXE DLL Load
    reason: 'Follow-on execution: scrcons.exe loading vbscript/wsh scripting DLLs is the ActiveScriptEventConsumer from this subscription actually running its script when its trigger fires.'
  - id: 8a582fe2-0882-4b89-a82a-da6b2dc32937
    name: Suspicious WmiPrvSE Child Process
    reason: 'Follow-on execution: a CommandLineEventConsumer''s payload spawns as a child of WmiPrvSE.exe; its firing means this persistence triggered and ran code (certutil/mshta/rundll32/powershell).'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: WMI event-subscription creation command on this host (wmic/mofcomp/PowerShell)
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.* [Cc][Rr][Ee][Aa][Tt][Ee].*/ AND (data_win_eventdata_commandLine:/.*[Aa][Cc][Tt][Ii][Vv][Ee][Ss][Cc][Rr][Ii][Pp][Tt][Ee][Vv][Ee][Nn][Tt][Cc][Oo][Nn][Ss][Uu][Mm][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Mm][Aa][Nn][Dd][Ll][Ii][Nn][Ee][Ee][Vv][Ee][Nn][Tt][Cc][Oo][Nn][Ss][Uu][Mm][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*__[Ee][Vv][Ee][Nn][Tt][Ff][Ii][Ll][Tt][Ee][Rr].*/)) OR data_win_eventdata_image:/.*\\[Mm][Oo][Ff][Cc][Oo][Mm][Pp]\.[Ee][Xx][Ee]/ OR (data_win_eventdata_image:/.*(\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Ww][Mm][Ii][Ii][Nn][Ss][Tt][Aa][Nn][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Gg][Ii][Ss][Tt][Ee][Rr]-[Ww][Mm][Ii][Ee][Vv][Ee][Nn][Tt].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Gg][Ii][Ss][Tt][Ee][Rr]-[Cc][Ii][Mm][Ii][Nn][Dd][Ii][Cc][Aa][Tt][Ii][Oo][Nn][Ee][Vv][Ee][Nn][Tt].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Mm][Aa][Nn][Dd][Ll][Ii][Nn][Ee][Ee][Vv][Ee][Nn][Tt][Cc][Oo][Nn][Ss][Uu][Mm][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*__[Ee][Vv][Ee][Nn][Tt][Ff][Ii][Ll][Tt][Ee][Rr].*/)))
    pivot_on:
    - host
    window: 2h
  - name: WMI subscription creation in decoded PowerShell script blocks on this host
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*__[Ee][Vv][Ee][Nn][Tt][Ff][Ii][Ll][Tt][Ee][Rr].*/ OR data_win_eventdata_scriptBlockText:/.*[Cc][Oo][Mm][Mm][Aa][Nn][Dd][Ll][Ii][Nn][Ee][Ee][Vv][Ee][Nn][Tt][Cc][Oo][Nn][Ss][Uu][Mm][Ee][Rr].*/ OR data_win_eventdata_scriptBlockText:/.*[Aa][Cc][Tt][Ii][Vv][Ee][Ss][Cc][Rr][Ii][Pp][Tt][Ee][Vv][Ee][Nn][Tt][Cc][Oo][Nn][Ss][Uu][Mm][Ee][Rr].*/ OR data_win_eventdata_scriptBlockText:/.*[Ff][Ii][Ll][Tt][Ee][Rr][Tt][Oo][Cc][Oo][Nn][Ss][Uu][Mm][Ee][Rr][Bb][Ii][Nn][Dd][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Rr][Oo][Oo][Tt]\\[Ss][Uu][Bb][Ss][Cc][Rr][Ii][Pp][Tt][Ii][Oo][Nn].*/ OR data_win_eventdata_scriptBlockText:/.*[Rr][Oo][Oo][Tt]\/[Ss][Uu][Bb][Ss][Cc][Rr][Ii][Pp][Tt][Ii][Oo][Nn].*/ OR data_win_eventdata_scriptBlockText:/.*[Rr][Ee][Gg][Ii][Ss][Tt][Ee][Rr]-[Ww][Mm][Ii][Ee][Vv][Ee][Nn][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Ee][Tt]-[Ww][Mm][Ii][Ii][Nn][Ss][Tt][Aa][Nn][Cc][Ee].*/)
    pivot_on:
    - host
    window: 2h
  - name: MOF file written on this host (MOF-based WMI persistence staging)
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.[Mm][Oo][Ff]/
    pivot_on:
    - host
    window: 2h
  - name: WMI consumer payload execution on this host (child of WmiPrvSE / scrcons)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ss][Cc][Rr][Cc][Oo][Nn][Ss]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 4h
  - name: Outbound network beacon from the WMI consumer host process (scrcons / WmiPrvSE)
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*\\[Ss][Cc][Rr][Cc][Oo][Nn][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 4h
