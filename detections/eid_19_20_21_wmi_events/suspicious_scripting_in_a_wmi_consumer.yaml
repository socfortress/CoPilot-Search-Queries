name: Suspicious Scripting in a WMI Consumer
id: fe21810c-2a8c-478f-8dd3-5a287fb2a0e0
version: 1
schema_version: "1.0"
date: "2023-09-09"
author: Florian Roth (Nextron Systems), Jonhnathan Ribeiro
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: fe21810c-2a8c-478f-8dd3-5a287fb2a0e0
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious commands that are related to scripting/powershell in WMI
  Event Consumers. MITRE ATT&CK: T1059.005.

data_source:
  - Sysmon EventID 19/20/21 - WMI Event

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_win_system_eventID: "19"
              - term:
                  data_win_system_eventID: "20"
              - term:
                  data_win_system_eventID: "21"
            minimum_should_match: 1
        
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_destination:
                          value: "*new-object*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_destination:
                          value: "*net.webclient*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_destination:
                          value: "*.downloadstring*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_destination:
                          value: "*new-object*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_destination:
                          value: "*net.webclient*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_destination:
                          value: "*.downloadfile*"
                          case_insensitive: true
              - wildcard:
                  data_win_eventdata_destination:
                    value: "* iex(*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_destination:
                    value: "* -nop *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_destination:
                    value: "* -noprofile *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_destination:
                    value: "* -decode *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_destination:
                    value: "* -enc *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_destination:
                    value: "*WScript.Shell*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_destination:
                    value: "*System.Security.Cryptography.FromBase64Transform*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_destination
    - data_win_eventdata_operation
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon WMI event logging (EventIDs 19/20/21) enabled in the Sysmon
  configuration and the Microsoft-Windows-Sysmon/Operational channel collected
  by the Wazuh agent. The detection looks for events where
  data_win_eventdata_destination matches '*new-object*';
  data_win_eventdata_destination matches '*net.webclient*';
  data_win_eventdata_destination matches '*.downloadstring*', among other
  conditions.

known_false_positives: >
  Legitimate administrative scripts. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://in.security/an-intro-into-abusing-and-identifying-wmi-event-subscriptions-for-persistence/
  - https://github.com/Neo23x0/signature-base/blob/615bf1f6bac3c1bdc417025c40c073e6c2771a76/yara/gen_susp_lnk_files.yar#L19
  - https://github.com/RiccardoAncarani/LiquidSnake
  - https://attack.mitre.org/techniques/T1059/005/

response:
  message: >
    Suspicious Scripting in a WMI Consumer detected on host $agent_name$.
    Matched data_win_eventdata_destination: $data_win_eventdata_destination$.
    Matched data_win_eventdata_operation: $data_win_eventdata_operation$. MITRE
    ATT&CK: T1059.005
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_destination
      type: other
    - field: data_win_eventdata_operation
      type: operation

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.005
  custom_tags:
    - scripting
    - consumer
    - wmi_event
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"19" OR data_win_system_eventID:"20" OR data_win_system_eventID:"21") AND ((data_win_eventdata_destination:/.*[Nn][Ee][Ww]-[Oo][Bb][Jj][Ee][Cc][Tt].*/ AND data_win_eventdata_destination:/.*[Nn][Ee][Tt]\.[Ww][Ee][Bb][Cc][Ll][Ii][Ee][Nn][Tt].*/ AND data_win_eventdata_destination:/.*\.[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/) OR (data_win_eventdata_destination:/.*[Nn][Ee][Ww]-[Oo][Bb][Jj][Ee][Cc][Tt].*/ AND data_win_eventdata_destination:/.*[Nn][Ee][Tt]\.[Ww][Ee][Bb][Cc][Ll][Ii][Ee][Nn][Tt].*/ AND data_win_eventdata_destination:/.*\.[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee].*/) OR data_win_eventdata_destination:/.* [Ii][Ee][Xx]\(.*/ OR data_win_eventdata_destination:/.* -[Nn][Oo][Pp] .*/ OR data_win_eventdata_destination:/.* -[Nn][Oo][Pp][Rr][Oo][Ff][Ii][Ll][Ee] .*/ OR data_win_eventdata_destination:/.* -[Dd][Ee][Cc][Oo][Dd][Ee] .*/ OR data_win_eventdata_destination:/.* -[Ee][Nn][Cc] .*/ OR data_win_eventdata_destination:/.*[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ss][Hh][Ee][Ll][Ll].*/ OR data_win_eventdata_destination:/.*[Ss][Yy][Ss][Tt][Ee][Mm]\.[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]\.[Cc][Rr][Yy][Pp][Tt][Oo][Gg][Rr][Aa][Pp][Hh][Yy]\.[Ff][Rr][Oo][Mm][Bb][Aa][Ss][Ee]64[Tt][Rr][Aa][Nn][Ss][Ff][Oo][Rr][Mm].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 83844185-1c5b-45bc-bcf3-b5bf3084ca5b
    name: Suspicious Encoded Scripts in a WMI Consumer
    reason: 'Sibling EID 19/20/21 consumer detection: catches the base64/-enc encoded variant of the same malicious WMI consumer payload this rule flags in cleartext; both commonly fire on the same subscription registration.'
  - id: 0f06a3a5-6a09-413f-8743-e6cf35561297
    name: WMI Event Subscription
    reason: Fires on creation of the very WMI event subscription whose consumer carries this script, confirming a persistence object was actually registered rather than just a suspicious string appearing.
  - id: ebef4391-1a81-4761-a40a-1db446c0e625
    name: NewActiveScriptEventConsumer Creation Attempt via Wmic.EXE
    reason: 'Precursor install action: wmic.exe registering the ActiveScriptEventConsumer whose VBScript/JScript body this rule then flags, naming the process and user that planted the persistence.'
  - id: 1dd05363-104e-4b4a-b963-196a534b03a1
    name: Potential Suspicious Mofcomp Execution
    reason: 'Alternative install vector: mofcomp.exe compiling a malicious MOF that defines the event consumer, a precursor explaining how the scripting consumer got into the WMI repository.'
  - id: 9e07f6e7-83aa-45c6-998e-0af26efd0a85
    name: Powershell WMI Persistence
    reason: 'Precursor in PowerShell script-block logs: Set-WmiInstance/Register-WmiEvent building the subscription; the installing script frequently contains the very download cradle this consumer is set to run.'
  - id: f6d1dd2f-b8ce-40ca-bc23-062efb686b34
    name: Script Event Consumer Spawning Process
    reason: 'Follow-on execution proof: scrcons.exe spawning a child process means the ActiveScriptEventConsumer script actually fired on this host, turning suspected persistence into active execution.'
  - id: b439f47d-ef52-4b29-9a2f-57d8a96cb6b8
    name: WMI ActiveScriptEventConsumers Activity Via Scrcons.EXE DLL Load
    reason: 'Follow-on: scrcons.exe loading scripting DLLs confirms the WMI script-consumer host executed its VBScript/JScript payload, the runtime counterpart to this consumer-registration alert.'
  - id: 493fb4ab-cdcc-4c4f-818c-0e363bd1e4bb
    name: WMI Event Consumer Created Named Pipe
    reason: 'Matches this rule cited LiquidSnake reference: scrcons.exe creating a named pipe is the fileless lateral-movement tradecraft that abuses exactly this script-consumer mechanism.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: WMI script-consumer host (scrcons.exe) process activity on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ss][Cc][Rr][Cc][Oo][Nn][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ss][Cc][Rr][Cc][Oo][Nn][Ss]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: WMI consumer host (wmiprvse/scrcons) spawning a script interpreter
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\([Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee]\.[Ee][Xx][Ee]|[Ss][Cc][Rr][Cc][Oo][Nn][Ss]\.[Ee][Xx][Ee])/ AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]|[Cc][Mm][Dd]\.[Ee][Xx][Ee]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 2h
  - name: PowerShell download-cradle / encoded command in process command lines
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Nn][Ee][Tt]\.[Ww][Ee][Bb][Cc][Ll][Ii][Ee][Nn][Tt].*/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ii][Ee][Xx]\(.*/ OR data_win_eventdata_commandLine:/.* -[Ee][Nn][Cc] .*/ OR data_win_eventdata_commandLine:/.* -[Nn][Oo][Pp] .*/ OR data_win_eventdata_commandLine:/.*[Ff][Rr][Oo][Mm][Bb][Aa][Ss][Ee]64[Tt][Rr][Aa][Nn][Ss][Ff][Oo][Rr][Mm].*/)
    pivot_on:
    - host
    window: 2h
  - name: Download-cradle / base64 payload in PowerShell script-block logs
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Nn][Ee][Tt]\.[Ww][Ee][Bb][Cc][Ll][Ii][Ee][Nn][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Ff][Rr][Oo][Mm][Bb][Aa][Ss][Ee]64[Tt][Rr][Aa][Nn][Ss][Ff][Oo][Rr][Mm].*/ OR data_win_eventdata_scriptBlockText:/.*[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ss][Hh][Ee][Ll][Ll].*/)
    pivot_on:
    - host
    window: 4h
  - name: Outbound network connection by a script interpreter (second-stage pull)
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|[Ss][Cc][Rr][Cc][Oo][Nn][Ss]\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 2h
