][Nn][Dd][Oo][Ww][Ss]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr]\\[Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr] [Uu][Pp][Dd][Aa][Tt][Ee] [Ss][Ee][Rr][Vv][Ii][Cc][Ee]/ OR data_win_eventdata_taskName:/\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr]\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee] [Uu][Pp][Dd][Aa][Tt][Ee]/ OR data_win_eventdata_taskName:/\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Ee][Rr][Rr][Oo][Rr] [Rr][Ee][Pp][Oo][Rr][Tt][Ii][Nn][Gg]\\[Cc][Hh][Ee][Cc][Kk][Rr][Ee][Pp][Oo][Rr][Tt][Ii][Nn][Gg]/ OR data_win_eventdata_taskName:/\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Ee][Rr][Rr][Oo][Rr] [Rr][Ee][Pp][Oo][Rr][Tt][Ii][Nn][Gg]\\[Ss][Uu][Bb][Mm][Ii][Tt][Rr][Ee][Pp][Oo][Rr][Tt][Ii][Nn][Gg]/ OR data_win_eventdata_taskName:/\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Ff][Ii][Ll][Tt][Ee][Rr][Ii][Nn][Gg] [Pp][Ll][Aa][Tt][Ff][Oo][Rr][Mm]\\[Bb][Ff][Ee][Oo][Nn][Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss][Tt][Aa][Rr][Tt]/ OR data_win_eventdata_taskName:/\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr][Ss][Ee][Rr][Vv][Ii][Cc][Ee]/ OR data_win_eventdata_taskName:/\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr][Ss][Ee][Rr][Vv][Ii][Cc][Ee]2/ OR data_win_eventdata_taskName:/\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Uu][Pp][Dd][Aa][Tt][Ee]\\[Ss][Cc][Hh][Ee][Dd][Uu][Ll][Ee][Dd] [Aa][Uu][Tt][Oo][Cc][Hh][Ee][Cc][Kk]/ OR data_win_eventdata_taskName:/\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Uu][Pp][Dd][Aa][Tt][Ee]\\[Ss][Cc][Hh][Ee][Dd][Uu][Ll][Ee][Dd] [Cc][Hh][Ee][Cc][Kk]/ OR data_win_eventdata_taskName:/\\[Ww][Ii][Nn][Dd][Oo][Ww][Uu][Pp][Dd][Aa][Tt][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 8fa65166-f463-4fd2-ad4f-1436133c52e1
    name: Scheduled Tasks Names Used By SVR For GraphicalProton Backdoor
    reason: Same task-name IOC list seen via Security 4698 task-creation events; a hit there is the creation moment that precedes this Task Scheduler 129/140/141 activity, confirming the task was newly registered.
  - id: e64c8ef3-9f98-40c8-b71e-96110991cb4c
    name: DLL Names Used By SVR For GraphicalProton Backdoor
    reason: GraphicalProton is loaded as a DLL by a scheduled task; these known DLL names loading in the same host timeframe tie the task to the backdoor payload.
  - id: windows-graphicalproton-loaded-modules-001
    name: Windows Known GraphicalProton Loaded Modules
    reason: Module-load evidence of the backdoor running under the task, the execution stage that follows the persistence task being triggered.
  - id: 9f8573c9-22b4-40e3-89c1-72bc2b8d49ab
    name: Scheduled Task Creation Masquerading as System Processes
    reason: The IOC task names mimic Defender/Windows Update/IIS tasks; schtasks creation using masquerading names is the creation-side precursor of this alert.
  - id: 3a734d25-df5c-4b99-8034-af1ddb5883a4
    name: Suspicious Scheduled Task Creation
    reason: Generic 4698 task registration on the same host shortly before the task fires is the persistence installation step for the named task.
  - id: 39019a4e-317f-4ce3-ae63-309a8c6b53c5
    name: Suspicious Scheduled Task Creation Involving Temp Folder
    reason: Backdoor tasks often point at payloads staged in Temp/user-writable paths; co-occurrence shows the task action is the dropped implant.
  - id: 9ac94dc8-9042-493c-ba45-3b5e7c86b980
    name: Disable Important Scheduled Task
    reason: Operators using Defender-lookalike task names commonly also disable genuine Defender/maintenance tasks to reduce detection, a co-occurring defense-evasion step.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Task registered or modified via schtasks/PowerShell with SVR-style masquerade names
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Rr]egister-[Ss]cheduled[Tt]ask|[Nn]ew-[Ss]cheduled[Tt]ask).*/) AND data_win_eventdata_commandLine:/.*([Dd]efender|[Dd]efender[Ss]ervice|[Ww]indows[Uu]pdate|[Ii][Ii][Ss][Uu]pdate|[Aa][Tt][Pp][Uu]pd|[Ww][Ii][Mm][Ss][Dd][Ff][Ss]|[Ss]tartup[Aa]pp[Tt]ask|[Ss]peech[Mm]odel|[Bb]fe[Oo]n[Ss]ervice).*/
    pivot_on:
    - host
    window: 4h
  - name: Scheduled-task child process launching rundll32/regsvr32 or loading a DLL from a user-writable path
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*([Tt]askeng|[Tt]askhostw)\.[Ee][Xx][Ee]/ AND (data_win_eventdata_image:/.*([Rr]undll32|[Rr]egsvr32)\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Aa]pp[Dd]ata|[Tt]emp|[Pp]rogram[Dd]ata|[Pp]ublic|[Uu]sers\\[^\\]+\\).*\.[Dd][Ll][Ll].*/)
    pivot_on:
    - host
    window: 4h
  - name: DLL or executable dropped to disk by an interactive shell/script host before the task ran
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(\\[Aa]pp[Dd]ata\\|\\[Tt]emp\\|\\[Pp]rogram[Dd]ata\\|\\[Pp]ublic\\|\\[Ww]indows\\[Tt]asks\\).*\.([Dd][Ll][Ll]|[Ee][Xx][Ee]|[Xx][Mm][Ll])/
    pivot_on:
    - host
    window: 6h
  - name: Outbound connection or DNS from rundll32/regsvr32 or task-spawned binaries (GraphicalProton C2 over cloud/webmail)
    query: (data_win_system_eventID:"3" AND data_win_eventdata_image:/.*([Rr]undll32|[Rr]egsvr32)\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"22" AND data_win_eventdata_image:/.*([Rr]undll32|[Rr]egsvr32)\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"22" AND data_win_eventdata_queryName:/.*([Oo]nedrive|[Gg]raph\.[Mm]icrosoft|[Dd]ropbox|[Mm]ega\.[Nn]z).*/ AND NOT data_win_eventdata_image:/.*([Ee]dge|[Cc]hrome|[Ff]irefox|[Oo]ne[Dd]rive)\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 6h
  - name: Defender tampering alongside lookalike tasks
    query: (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ss]et-[Mm]p[Pp]reference|[Aa]dd-[Mm]p[Pp]reference|[Ss]chtasks.*\/([Dd]elete|[Cc]hange).*[Dd]efender).*/) OR (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Ww]indows [Dd]efender\\.*([Ee]xclusions|[Dd]isable[Aa]nti[Ss]pyware|[Dd]isable[Rr]ealtime).*/)
    pivot_on:
    - host
    window: 4h
