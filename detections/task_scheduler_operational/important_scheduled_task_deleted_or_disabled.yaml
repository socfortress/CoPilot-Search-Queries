name: Important Scheduled Task Deleted or Disabled
id: 9e3cb244-bdb8-4632-8c90-6079c8f4f16d
version: 1
schema_version: "1.0"
date: "2026-03-11"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 9e3cb244-bdb8-4632-8c90-6079c8f4f16d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects when adversaries try to stop system services or processes by deleting
  or disabling their respective scheduled tasks in order to conduct data
  destructive activities. MITRE ATT&CK: T1489.

data_source:
  - Windows Task Scheduler Operational Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - term:
                  data_win_system_eventID: "141"
              - term:
                  data_win_system_eventID: "142"
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_taskName:
                    value: "*\\\\Windows\\\\SystemRestore\\\\SR*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskName:
                    value: "*\\\\Windows\\\\Windows Defender\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskName:
                    value: "*\\\\Windows\\\\BitLocker*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskName:
                    value: "*\\\\Windows\\\\WindowsBackup\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskName:
                    value: "*\\\\Windows\\\\WindowsUpdate\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskName:
                    value: "*\\\\Windows\\\\UpdateOrchestrator\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskName:
                    value: "*\\\\Windows\\\\ExploitGuard*"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_userName"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_userName:
                          value: "*AUTHORI*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_userName:
                          value: "*AUTORI*"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_taskName
    - data_win_eventdata_userName

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_eventID equals '141'; data_win_system_eventID
  equals '142'; data_win_eventdata_taskName matches
  '*\Windows\SystemRestore\SR*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.socinvestigation.com/most-common-windows-event-ids-to-hunt-mind-map/
  - https://attack.mitre.org/techniques/T1489/

response:
  message: >
    Important Scheduled Task Deleted or Disabled detected on host $agent_name$.
    Matched data_win_eventdata_taskName: $data_win_eventdata_taskName$. Matched
    data_win_eventdata_userName: $data_win_eventdata_userName$. MITRE ATT&CK:
    T1489
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_taskName
      type: other
    - field: data_win_eventdata_userName
      type: user

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1489
  custom_tags:
    - important
    - scheduled
    - deleted
    - taskscheduler
    - impact
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"141" OR data_win_system_eventID:"142") AND (data_win_eventdata_taskName:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm][Rr][Ee][Ss][Tt][Oo][Rr][Ee]\\[Ss][Rr].*/ OR data_win_eventdata_taskName:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr]\\.*/ OR data_win_eventdata_taskName:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Bb][Ii][Tt][Ll][Oo][Cc][Kk][Ee][Rr].*/ OR data_win_eventdata_taskName:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Bb][Aa][Cc][Kk][Uu][Pp]\\.*/ OR data_win_eventdata_taskName:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Uu][Pp][Dd][Aa][Tt][Ee]\\.*/ OR data_win_eventdata_taskName:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Uu][Pp][Dd][Aa][Tt][Ee][Oo][Rr][Cc][Hh][Ee][Ss][Tt][Rr][Aa][Tt][Oo][Rr]\\.*/ OR data_win_eventdata_taskName:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ee][Xx][Pp][Ll][Oo][Ii][Tt][Gg][Uu][Aa][Rr][Dd].*/) AND _exists_:data_win_eventdata_userName AND NOT (data_win_eventdata_userName:/.*[Aa][Uu][Tt][Hh][Oo][Rr][Ii].*/ OR data_win_eventdata_userName:/.*[Aa][Uu][Tt][Oo][Rr][Ii].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: dbc1f800-0fe0-4bc0-9c66-292c2abe3f78
    name: Delete Important Scheduled Task
    reason: 'Process-creation twin: schtasks /delete on the same protected Defender/Backup/Update/SystemRestore task names would be the command that produced this Task Scheduler 141 event and names the parent process.'
  - id: 9ac94dc8-9042-493c-ba45-3b5e7c86b980
    name: Disable Important Scheduled Task
    reason: Process-creation twin for the disable path (schtasks /change /disable, event 142); shows the actor's command line and parent.
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: Neutralising SystemRestore/WindowsBackup tasks is a recovery-inhibition step; vssadmin/wmic shadow copy deletion is the paired action before encryption.
  - id: 639c9081-f482-47d3-a0bd-ddee3d4ecd76
    name: All Backups Deleted Via Wbadmin.EXE
    reason: Disabling WindowsBackup tasks followed by wbadmin delete backup completes destruction of backup recovery points.
  - id: c9fbe8e9-119d-40a6-9b59-dd58a5d84429
    name: Potential Ransomware or Unauthorized MBR Tampering Via Bcdedit.EXE
    reason: Ransomware playbooks pair disabling restore/backup tasks with bcdedit recoveryenabled No / ignoreallfailures to prevent boot repair.
  - id: db1c21e4-cd66-4b4e-85ca-590f0780529c
    name: Windows Recovery Environment Disabled Via Reagentc
    reason: Disabling WinRE alongside disabled backup/restore tasks removes the last offline recovery path before impact.
  - id: b28e58e4-2a72-4fae-bdee-0fbe904db642
    name: Windows Defender Real-time Protection Disabled
    reason: Deleting/disabling tasks under Windows Defender is defense evasion that typically accompanies actually turning off real-time protection on the same host.
  - id: 8f3a614f-6b98-4f7d-82dd-d0df38452a8b
    name: Windows Excessive Service Stop Attempt
    reason: T1489 service-stop wave (databases, backup, AV agents) commonly runs in the same minutes as scheduled-task neutralisation just before encryption.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: schtasks delete/disable command lines (who ran the task tampering)
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*\/[Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*\/[Dd][Ii][Ss][Aa][Bb][Ll][Ee].*/)
    pivot_on:
    - host
    window: 2h
  - name: Task Scheduler registrations/updates (replacement or persistence tasks)
    query: (data_win_system_eventID:"106" OR data_win_system_eventID:"140" OR data_win_system_eventID:"141" OR data_win_system_eventID:"142")
    pivot_on:
    - host
    window: 6h
  - name: 'Recovery inhibition: shadow copies, backups, boot recovery'
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*[Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ww][Bb][Aa][Dd][Mm][Ii][Nn].*[Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Hh][Aa][Dd][Oo][Ww][Cc][Oo][Pp][Yy].*[Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Bb][Cc][Dd][Ee][Dd][Ii][Tt].*([Rr][Ee][Cc][Oo][Vv][Ee][Rr][Yy][Ee][Nn][Aa][Bb][Ll][Ee][Dd]|[Ii][Gg][Nn][Oo][Rr][Ee][Aa][Ll][Ll][Ff][Aa][Ii][Ll][Uu][Rr][Ee][Ss]).*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Aa][Gg][Ee][Nn][Tt][Cc].*\/[Dd][Ii][Ss][Aa][Bb][Ll][Ee].*/)
    pivot_on:
    - host
    window: 2h
  - name: Security tooling and service stop/disable commands
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*[Dd][Ii][Ss][Aa][Bb][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Aa][Dd][Dd]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*[Ee][Xx][Cc][Ll][Uu][Ss][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt]1? [Ss][Tt][Oo][Pp] .*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc]\.?[Ee]?[Xx]?[Ee]? (stop|config).*/ OR data_win_eventdata_commandLine:/.*[Tt][Aa][Ss][Kk][Kk][Ii][Ll][Ll].*\/[Ff].*/)
    pivot_on:
    - host
    window: 2h
  - name: Ransom-note and mass-encryption file artefacts
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*([Dd][Ee][Cc][Rr][Yy][Pp][Tt]|[Rr][Ee][Aa][Dd][Mm][Ee]|[Hh][Oo][Ww][_ -]?[Tt][Oo]|[Rr][Ee][Cc][Oo][Vv][Ee][Rr]).*\.([Tt][Xx][Tt]|[Hh][Tt][Mm][Ll]?|[Hh][Tt][Aa])/ OR data_win_eventdata_targetFilename:/.*\.([Ll][Oo][Cc][Kk][Ee][Dd]|[Ee][Nn][Cc][Rr][Yy][Pp][Tt][Ee][Dd]|[Cc][Rr][Yy][Pp][Tt])/)
    pivot_on:
    - host
    window: 4h
