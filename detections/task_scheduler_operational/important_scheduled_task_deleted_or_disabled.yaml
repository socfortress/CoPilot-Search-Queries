name: Important Scheduled Task Deleted or Disabled
id: 9e3cb244-bdb8-4632-8c90-6079c8f4f16d
version: 1
schema_version: "1.0"
date: "2026-03-11"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 9e3cb244-bdb8-4632-8c90-6079c8f4f16d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects when adversaries try to stop system services or processes by deleting
  or disabling their respective scheduled tasks in order to conduct data
  destructive activities. MITRE ATT&CK: T1489.

data_source:
  - Windows Task Scheduler Operational Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - term:
                  data_win_system_eventID: "141"
              - term:
                  data_win_system_eventID: "142"
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_taskName:
                    value: "*\\\\Windows\\\\SystemRestore\\\\SR*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskName:
                    value: "*\\\\Windows\\\\Windows Defender\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskName:
                    value: "*\\\\Windows\\\\BitLocker*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskName:
                    value: "*\\\\Windows\\\\WindowsBackup\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskName:
                    value: "*\\\\Windows\\\\WindowsUpdate\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskName:
                    value: "*\\\\Windows\\\\UpdateOrchestrator\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_taskName:
                    value: "*\\\\Windows\\\\ExploitGuard*"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_userName"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_userName:
                          value: "*AUTHORI*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_userName:
                          value: "*AUTORI*"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_taskName
    - data_win_eventdata_userName

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_eventID equals '141'; data_win_system_eventID
  equals '142'; data_win_eventdata_taskName matches
  '*\Windows\SystemRestore\SR*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.socinvestigation.com/most-common-windows-event-ids-to-hunt-mind-map/
  - https://attack.mitre.org/techniques/T1489/

response:
  message: >
    Important Scheduled Task Deleted or Disabled detected on host $agent_name$.
    Matched data_win_eventdata_taskName: $data_win_eventdata_taskName$. Matched
    data_win_eventdata_userName: $data_win_eventdata_userName$. MITRE ATT&CK:
    T1489
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_taskName
      type: other
    - field: data_win_eventdata_userName
      type: user

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1489
  custom_tags:
    - important
    - scheduled
    - deleted
    - taskscheduler
    - impact
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"141" OR data_win_system_eventID:"142") AND (data_win_eventdata_taskName:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm][Rr][Ee][Ss][Tt][Oo][Rr][Ee]\\[Ss][Rr].*/ OR data_win_eventdata_taskName:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr]\\.*/ OR data_win_eventdata_taskName:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Bb][Ii][Tt][Ll][Oo][Cc][Kk][Ee][Rr].*/ OR data_win_eventdata_taskName:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Bb][Aa][Cc][Kk][Uu][Pp]\\.*/ OR data_win_eventdata_taskName:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Uu][Pp][Dd][Aa][Tt][Ee]\\.*/ OR data_win_eventdata_taskName:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Uu][Pp][Dd][Aa][Tt][Ee][Oo][Rr][Cc][Hh][Ee][Ss][Tt][Rr][Aa][Tt][Oo][Rr]\\.*/ OR data_win_eventdata_taskName:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ee][Xx][Pp][Ll][Oo][Ii][Tt][Gg][Uu][Aa][Rr][Dd].*/) AND _exists_:data_win_eventdata_userName AND NOT (data_win_eventdata_userName:/.*[Aa][Uu][Tt][Hh][Oo][Rr][Ii].*/ OR data_win_eventdata_userName:/.*[Aa][Uu][Tt][Oo][Rr][Ii].*/)

correlation:
  # Authored by the correlation engine for review. Related CoPilot Searches to run
  # around an alert from this rule, scoped to the same host/user/IP within the window.
  related_rules:
    - id: 48d91a3a-2363-43ba-a456-ca71ac3da5c2
      name: "Audit CVE Event"
      reason: "next kill-chain tactic: Impact"
    - id: eee8311f-a752-44f0-bf2f-6b007db16300
      name: "BlueSky Ransomware Artefacts"
      reason: "next kill-chain tactic: Impact"
    - id: 3f2c93c7-7b2a-4d58-bb8d-6f39422d8148
      name: "CVE-2024-49113 Exploitation Attempt - LDAP Nightmare"
      reason: "next kill-chain tactic: Impact"
  window: 1h
  enrichment_searches:
  # NEW ad-hoc searches the engine runs around an alert from this rule, scoped to
  # the alert's host/user/IP within the window (not existing CoPilot Searches).
    - name: "Sysmon activity on this host in the window"
      query: 'data_win_system_channel:"Microsoft-Windows-Sysmon/Operational"'
      pivot_on: [host]
      window: 1h
    - name: "Process creation on this host"
      query: 'data_win_system_eventID:"1"'
      pivot_on: [host]
      window: 1h
    - name: "Network connections from this host"
      query: 'data_win_system_eventID:"3"'
      pivot_on: [host]
      window: 1h
    - name: "High-severity alerts on this host"
      query: 'rule_level:>=10'
      pivot_on: [host]
      window: 1h
