name: Scheduled Task Executed Uncommon LOLBIN
id: f0767f15-0fb3-44b9-851e-e8d9a6d0005d
version: 1
schema_version: "1.0"
date: "2023-02-07"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: f0767f15-0fb3-44b9-851e-e8d9a6d0005d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of Scheduled Tasks where the program being run is
  located in a suspicious location or where it is an unusual program to be run
  from a Scheduled Task. MITRE ATT&CK: T1053.005.

data_source:
  - Windows Task Scheduler Operational Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "129"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_path:
                    value: "*\\\\calc.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_path:
                    value: "*\\\\cscript.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_path:
                    value: "*\\\\mshta.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_path:
                    value: "*\\\\mspaint.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_path:
                    value: "*\\\\notepad.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_path:
                    value: "*\\\\regsvr32.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_path:
                    value: "*\\\\wscript.exe"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_path

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_eventID equals '129'; data_win_eventdata_path
  matches '*\calc.exe'; data_win_eventdata_path matches '*\cscript.exe', among
  other conditions.

known_false_positives: >
  False positives may occur with some of the selected binaries if you have tasks
  using them (which could be very common in your environment). Exclude all the
  specific trusted tasks before using this rule. Baseline expected activity in
  your environment and tune this detection before relying on it for automated
  response.

references:
  - Internal Research
  - https://attack.mitre.org/techniques/T1053/005/

response:
  message: >
    Scheduled Task Executed Uncommon LOLBIN detected on host $agent_name$.
    Matched data_win_eventdata_path: $data_win_eventdata_path$. MITRE ATT&CK:
    T1053.005
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_path
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1053.005
  custom_tags:
    - scheduled
    - executed
    - uncommon
    - taskscheduler
    - privilege_escalation
    - execution
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"129" AND (data_win_eventdata_path:/.*\\[Cc][Aa][Ll][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_path:/.*\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_path:/.*\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_path:/.*\\[Mm][Ss][Pp][Aa][Ii][Nn][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_path:/.*\\[Nn][Oo][Tt][Ee][Pp][Aa][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_path:/.*\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_path:/.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 3a734d25-df5c-4b99-8034-af1ddb5883a4
    name: Suspicious Scheduled Task Creation
    reason: 'Direct precursor: the task that now launches a script-host/LOLBin had to be registered (EID 4698) shortly before this execution.'
  - id: 81325ce1-be01-4250-944f-b4789644556f
    name: Schedule Task Creation From Env Variable Or Potentially Suspicious Path Via Schtasks.EXE
    reason: 'Precursor: schtasks /create pointing at env-var or user-writable paths is how a task ends up running mshta/wscript/regsvr32.'
  - id: f2c64357-b1d2-41b7-849f-34d2682c0fad
    name: Suspicious Command Patterns In Scheduled Task Creation
    reason: 'Precursor: task creation embedding script-host or download commands explains why the task later executes an uncommon LOLBin.'
  - id: 80e1f67a-4596-4351-98f5-a9c3efabac95
    name: Suspicious Scheduled Task Write to System32 Tasks
    reason: 'Precursor: a task XML dropped directly into System32 Tasks (bypassing schtasks) that the Scheduler then executes.'
  - id: 4720b7df-40c3-48fd-bbdf-fd4b3c464f0d
    name: Scheduled TaskCache Change by Uncommon Program
    reason: 'Precursor: TaskCache registry tampering by a non-standard program registers or hides the persistent task now firing.'
  - id: 424273ea-7cf8-43a6-b712-375f925e481f
    name: Scheduled Task Executed From A Suspicious Location
    reason: 'Co-occurring EID 129 detection: the same malicious task often also runs a payload from Temp/AppData/Public, confirming the task is attacker-controlled.'
  - id: b6676963-0353-4f88-90f5-36c20d443c6a
    name: Cscript/Wscript Potentially Suspicious Child Process
    reason: 'Follow-on: when the task launches wscript/cscript, the script commonly spawns powershell/cmd to stage the real payload.'
  - id: 6f0947a4-1c5e-4e0d-8ac7-53159b8f23ca
    name: Potentially Suspicious Child Process Of Regsvr32
    reason: 'Follow-on: a task-launched regsvr32 (squiblydoo/scrobj) spawning shells or LOLBins is the execution stage of the persisted payload.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Task-launched LOLBin with script/remote payload arguments
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Mm][Ss][Hh][Tt][Aa]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Rr][Ee][Gg][Ss][Vv][Rr]32)\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:*http* OR data_win_eventdata_commandLine:*.hta* OR data_win_eventdata_commandLine:*.vbs* OR data_win_eventdata_commandLine:*.js* OR data_win_eventdata_commandLine:*.sct* OR data_win_eventdata_commandLine:*scrobj* OR data_win_eventdata_commandLine:*javascript*)
    pivot_on:
    - host
    window: 1h
  - name: Child processes spawned by script-host LOLBins
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\([Mm][Ss][Hh][Tt][Aa]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Rr][Ee][Gg][Ss][Vv][Rr]32)\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]|[Cc][Mm][Dd]|[Rr][Uu][Nn][Dd][Ll][Ll]32|[Cc][Uu][Rr][Ll]|[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: Network connections by task-launched LOLBins
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Mm][Ss][Hh][Tt][Aa]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Rr][Ee][Gg][Ss][Vv][Rr]32)\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Scheduled task registered, updated or created on host
    query: (data_win_system_eventID:"4698" OR data_win_system_eventID:"4702" OR data_win_system_eventID:"106" OR data_win_system_eventID:"140" OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss])\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:*[Cc][Rr][Ee][Aa][Tt][Ee]*))
    pivot_on:
    - host
    window: 24h
  - name: Script and payload files dropped to user-writable paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\([Tt]emp|[Aa]pp[Dd]ata|[Pp]ublic|[Pp]rogram[Dd]ata)\\.*\.(hta|vbs|vbe|js|jse|wsf|sct|dll|ps1|bat)/
    pivot_on:
    - host
    window: 4h
