name: Scheduled Task Executed Uncommon LOLBIN
id: f0767f15-0fb3-44b9-851e-e8d9a6d0005d
version: 1
schema_version: "1.0"
date: "2023-02-07"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: f0767f15-0fb3-44b9-851e-e8d9a6d0005d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of Scheduled Tasks where the program being run is
  located in a suspicious location or where it is an unusual program to be run
  from a Scheduled Task. MITRE ATT&CK: T1053.005.

data_source:
  - Windows Task Scheduler Operational Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "129"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_path:
                    value: "*\\\\calc.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_path:
                    value: "*\\\\cscript.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_path:
                    value: "*\\\\mshta.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_path:
                    value: "*\\\\mspaint.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_path:
                    value: "*\\\\notepad.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_path:
                    value: "*\\\\regsvr32.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_path:
                    value: "*\\\\wscript.exe"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_path

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_eventID equals '129'; data_win_eventdata_path
  matches '*\calc.exe'; data_win_eventdata_path matches '*\cscript.exe', among
  other conditions.

known_false_positives: >
  False positives may occur with some of the selected binaries if you have tasks
  using them (which could be very common in your environment). Exclude all the
  specific trusted tasks before using this rule. Baseline expected activity in
  your environment and tune this detection before relying on it for automated
  response.

references:
  - Internal Research
  - https://attack.mitre.org/techniques/T1053/005/

response:
  message: >
    Scheduled Task Executed Uncommon LOLBIN detected on host $agent_name$.
    Matched data_win_eventdata_path: $data_win_eventdata_path$. MITRE ATT&CK:
    T1053.005
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_path
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1053.005
  custom_tags:
    - scheduled
    - executed
    - uncommon
    - taskscheduler
    - privilege_escalation
    - execution
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"129" AND (data_win_eventdata_path:/.*\\[Cc][Aa][Ll][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_path:/.*\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_path:/.*\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_path:/.*\\[Mm][Ss][Pp][Aa][Ii][Nn][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_path:/.*\\[Nn][Oo][Tt][Ee][Pp][Aa][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_path:/.*\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_path:/.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/)

