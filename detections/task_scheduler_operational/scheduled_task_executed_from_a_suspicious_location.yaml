name: Scheduled Task Executed From A Suspicious Location
id: 424273ea-7cf8-43a6-b712-375f925e481f
version: 1
schema_version: "1.0"
date: "2023-02-07"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 424273ea-7cf8-43a6-b712-375f925e481f
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of Scheduled Tasks where the Program being run is
  located in a suspicious location or it's an unusale program to be run from a
  Scheduled Task. MITRE ATT&CK: T1053.005.

data_source:
  - Windows Task Scheduler Operational Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "129"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_path:
                    value: "*C:\\\\Windows\\\\Temp\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_path:
                    value: "*\\\\AppData\\\\Local\\\\Temp\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_path:
                    value: "*\\\\Desktop\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_path:
                    value: "*\\\\Downloads\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_path:
                    value: "*\\\\Users\\\\Public\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_path:
                    value: "*C:\\\\Temp\\\\*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_path

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_eventID equals '129'; data_win_eventdata_path
  matches '*C:\Windows\Temp\*'; data_win_eventdata_path matches
  '*\AppData\Local\Temp\*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - Internal Research
  - https://attack.mitre.org/techniques/T1053/005/

response:
  message: >
    Scheduled Task Executed From A Suspicious Location detected on host
    $agent_name$. Matched data_win_eventdata_path: $data_win_eventdata_path$.
    MITRE ATT&CK: T1053.005
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_path
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1053.005
  custom_tags:
    - scheduled
    - executed
    - location
    - taskscheduler
    - privilege_escalation
    - execution
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"129" AND (data_win_eventdata_path:/.*[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_path:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_path:/.*\\[Dd][Ee][Ss][Kk][Tt][Oo][Pp]\\.*/ OR data_win_eventdata_path:/.*\\[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]\\.*/ OR data_win_eventdata_path:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_path:/.*[Cc]:\\[Tt][Ee][Mm][Pp]\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 39019a4e-317f-4ce3-ae63-309a8c6b53c5
    name: Suspicious Scheduled Task Creation Involving Temp Folder
    reason: 'Precursor: the schtasks /create that registered a task pointing into Temp is what later fires Task Scheduler event 129 from that same path.'
  - id: c5c00f49-b3f9-45a6-997e-cfdecc6e1967
    name: Suspicious Schtasks Execution AppData Folder
    reason: 'Precursor: schtasks creating a task whose action lives in AppData, the creation-side view of the same user-writable payload location.'
  - id: 8a8379b8-780b-4dbf-b1e9-31c8d112fefb
    name: Schtasks From Suspicious Folders
    reason: 'Precursor: schtasks launched from or targeting Temp/Public/Downloads-style folders, establishing the persistence this execution event confirms.'
  - id: 3a734d25-df5c-4b99-8034-af1ddb5883a4
    name: Suspicious Scheduled Task Creation
    reason: 'Precursor: Security 4698 task-registration event for the task whose action path was later executed from a suspicious location.'
  - id: 80e1f67a-4596-4351-98f5-a9c3efabac95
    name: Suspicious Scheduled Task Write to System32 Tasks
    reason: 'Co-occurring: a task definition file written under System32 Tasks folder by a non-standard process, the on-disk artifact of the same task registration.'
  - id: 81325ce1-be01-4250-944f-b4789644556f
    name: Schedule Task Creation From Env Variable Or Potentially Suspicious Path Via Schtasks.EXE
    reason: 'Precursor: task creation using %TEMP%/%APPDATA%-style variables, which resolve to the suspicious path seen at execution.'
  - id: f0767f15-0fb3-44b9-851e-e8d9a6d0005d
    name: Scheduled Task Executed Uncommon LOLBIN
    reason: 'Co-occurring: same event 129 telemetry; a task launching a LOLBIN alongside a user-writable payload suggests a staged loader chain.'
  - id: 1321dc4e-a1fe-481d-a016-52c45f0c8b4f
    name: Windows Defender Exclusions Added
    reason: 'Follow-on: attackers commonly exclude the drop folder from Defender so the scheduled payload keeps running undetected.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Executable or script dropped into user-writable folders
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(\\[Tt][Ee][Mm][Pp]|\\[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]|\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]|\\[Dd][Ee][Ss][Kk][Tt][Oo][Pp])\\.*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Pp][Ss]1|[Bb][Aa][Tt]|[Vv][Bb][Ss]|[Jj][Ss]|[Cc][Mm][Dd]|[Hh][Tt][Aa])/
    pivot_on:
    - host
    window: 4h
  - name: Schtasks creating task with payload in user-writable path
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*\/[Cc][Rr][Ee][Aa][Tt][Ee].*(\\[Tt][Ee][Mm][Pp]\\|\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\|\\[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]\\|\\[Pp][Uu][Bb][Ll][Ii][Cc]\\|\\[Dd][Ee][Ss][Kk][Tt][Oo][Pp]\\|%[Tt][Ee][Mm][Pp]%|%[Aa][Pp][Pp][Dd][Aa][Tt][Aa]%).*/
    pivot_on:
    - host
    window: 24h
  - name: Process started from user-writable folder
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Tt][Ee][Mm][Pp]|\\[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]|\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]|\\[Dd][Ee][Ss][Kk][Tt][Oo][Pp])\\.*\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Network connections from binaries in user-writable folders
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*(\\[Tt][Ee][Mm][Pp]|\\[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]|\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]|\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa])\\.*/
    pivot_on:
    - host
    window: 2h
  - name: Defender exclusion or disable via command line
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Aa][Dd][Dd]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee]|[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee]).*([Ee][Xx][Cc][Ll][Uu][Ss][Ii][Oo][Nn]|[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee]).*/
    pivot_on:
    - host
    window: 2h
