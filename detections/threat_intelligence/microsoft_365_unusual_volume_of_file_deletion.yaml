name: Microsoft 365 - Unusual Volume of File Deletion
id: 78a34b67-3c39-4886-8fb4-61c46dc18ecd
version: 1
schema_version: "1.0"
date: "2022-10-09"
author: austinsonger
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 78a34b67-3c39-4886-8fb4-61c46dc18ecd
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: match
description: >
  Detects when a Microsoft Cloud App Security reported a user has deleted a
  unusual a large volume of files. MITRE ATT&CK: T1485.
data_source:
  - Office 365 Management Activity API
  - "Workload: ThreatIntelligence"
workload: ThreatIntelligence
how_to_implement: >
  Requires the Wazuh office365 module configured with an Azure AD application
  subscribed to the Office 365 Management Activity API for the relevant
  workload, ingested into the wazuh-* indices. The detection looks for events
  where data_office365_eventSource equals 'SecurityComplianceCenter';
  data_office365_eventName equals 'Unusual volume of file deletion';
  data_office365_status equals 'success'.
known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.
references:
  - https://learn.microsoft.com/en-us/defender-cloud-apps/anomaly-detection-policy
  - https://learn.microsoft.com/en-us/defender-cloud-apps/policy-template-reference
  - https://attack.mitre.org/techniques/T1485/
response:
  message: >
    Microsoft 365 - Unusual Volume of File Deletion detected for user
    $data_office365_UserId$. Matched data_office365_eventSource:
    $data_office365_eventSource$. Matched data_office365_eventName:
    $data_office365_eventName$. MITRE ATT&CK: T1485
  risk_score: 50
  severity: medium
  risk_objects:
    - field: data_office365_UserId
      type: user
      score: 50
  threat_objects:
    - field: data_office365_eventSource
      type: other
    - field: data_office365_eventName
      type: other
tags:
  asset_type: Cloud Identity
  mitre_attack_id:
    - T1485
  custom_tags:
    - microsoft
    - unusual
    - volume
    - o365
    - threat_management
    - impact
  product:
    - Office 365
  security_domain: cloud
graylog:
  query: data_office365_eventSource:/[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy][Cc][Oo][Mm][Pp][Ll][Ii][Aa][Nn][Cc][Ee][Cc][Ee][Nn][Tt][Ee][Rr]/ AND data_office365_eventName:/[Uu][Nn][Uu][Ss][Uu][Aa][Ll] [Vv][Oo][Ll][Uu][Mm][Ee] [Oo][Ff] [Ff][Ii][Ll][Ee] [Dd][Ee][Ll][Ee][Tt][Ii][Oo][Nn]/ AND data_office365_status:/[Ss][Uu][Cc][Cc][Ee][Ss][Ss]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: M365_Mass_File_Deletion
    name: M365 Mass File Deletion
    reason: 'Raw SharePoint/OneDrive FileRecycled audit twin of this MCAS anomaly: confirms the same user''s deletion burst and lists the exact sites and files behind the volume alert.'
  - id: bd132164-884a-48f1-aa2d-c6d646b04c69
    name: Microsoft 365 - Potential Ransomware Activity
    reason: Sibling Defender for Cloud Apps anomaly on the same user; cloud ransomware mass-encrypts then deletes originals, so an unusual deletion volume is often the ransomware symptom - co-occurrence strongly raises severity.
  - id: M365_Mass_File_Download
    name: M365 Mass File Download
    reason: 'Exfiltration-before-wipe (double extortion): the same account mass-downloading OneDrive/SharePoint files shortly before destroying them means the data was stolen first, not merely lost.'
  - id: d7eab125-5f94-43df-8710-795b80fa1189
    name: Microsoft 365 - Impossible Travel Activity
    reason: 'Account-takeover precursor: an impossible-travel sign-in on the same user is the likely compromising session that let an external actor wipe the files.'
  - id: c191e2fa-f9d6-4ccf-82af-4f2aba08359f
    name: Logon from a Risky IP Address
    reason: 'Account-takeover precursor: a logon from a Microsoft-flagged risky IP on the same user just before the deletions points to a compromised credential driving the destruction.'
  - id: 2e669ed8-742e-4fe5-b3c4-5a59b486c2ee
    name: Activity Performed by Terminated User
    reason: 'Insider/sabotage alternative cause: a terminated or departing user''s account performing the mass deletion is classic data-destruction-by-insider and reframes the incident from external ATO to an offboarding failure.'
  - id: 2b669496-d215-47d8-bd9a-f4a45bf07cda
    name: Data Exfiltration to Unsanctioned Apps
    reason: 'Exfil-before-wipe via shadow IT: the same user moving data to an unsanctioned app around the deletion time means files were copied out before being destroyed.'
  - id: M365_Mass_Email_Deletion_Evidence_Wipe
    name: M365 Mass Email Deletion - Evidence Wipe
    reason: 'Destruction spreading to the mailbox: the same account hard/soft-deleting mail outside Deleted Items alongside the file wipe is evidence-wiping to hide the intrusion and any alert notifications.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Raw file-deletion operations by this user
    query: (data_office365_Operation:"FileRecycled" OR data_office365_Operation:"FileDeleted" OR data_office365_Operation:"FileDeletedFirstStageRecycleBin" OR data_office365_Operation:"FileDeletedSecondStageRecycleBin" OR data_office365_Operation:"FileVersionsAllDeleted")
    pivot_on:
    - user
    window: 6h
  - name: Mass file download (exfiltration before wipe) by this user
    query: (data_office365_Operation:"FileDownloaded" OR data_office365_Operation:"FileSyncDownloadedFull")
    pivot_on:
    - user
    window: 6h
  - name: Sign-in and failed-auth activity from this source address
    query: (data_office365_Operation:"UserLoggedIn" OR data_office365_Operation:"UserLoginFailed")
    pivot_on:
    - ip
    window: 6h
  - name: Mailbox evidence-wipe and hiding rules by this user
    query: (data_office365_Operation:"HardDelete" OR data_office365_Operation:"SoftDelete" OR data_office365_Operation:/.*[Nn][Ee][Ww]-[Ii][Nn][Bb][Oo][Xx][Rr][Uu][Ll][Ee].*/ OR data_office365_Operation:/.*[Ss][Ee][Tt]-[Ii][Nn][Bb][Oo][Xx][Rr][Uu][Ll][Ee].*/ OR data_office365_Operation:/.*[Ss][Ee][Tt]-[Mm][Aa][Ii][Ll][Bb][Oo][Xx].*/)
    pivot_on:
    - user
    window: 24h
  - name: Retention and compliance-hold tampering by this user (prevents file recovery)
    query: (data_office365_Operation:/.*[Rr][Ee][Mm][Oo][Vv][Ee]-[Rr][Ee][Tt][Ee][Nn][Tt][Ii][Oo][Nn][Cc][Oo][Mm][Pp][Ll][Ii][Aa][Nn][Cc][Ee][Pp][Oo][Ll][Ii][Cc][Yy].*/ OR data_office365_Operation:/.*[Ss][Ee][Tt]-[Rr][Ee][Tt][Ee][Nn][Tt][Ii][Oo][Nn][Cc][Oo][Mm][Pp][Ll][Ii][Aa][Nn][Cc][Ee][Pp][Oo][Ll][Ii][Cc][Yy].*/ OR data_office365_Operation:/.*[Rr][Ee][Mm][Oo][Vv][Ee]-[Cc][Oo][Mm][Pp][Ll][Ii][Aa][Nn][Cc][Ee][Tt][Aa][Gg].*/)
    pivot_on:
    - user
    window: 24h
