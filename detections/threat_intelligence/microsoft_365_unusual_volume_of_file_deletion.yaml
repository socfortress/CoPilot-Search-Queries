name: Microsoft 365 - Unusual Volume of File Deletion
id: 78a34b67-3c39-4886-8fb4-61c46dc18ecd
version: 1
schema_version: "1.0"
date: "2022-10-09"
author: austinsonger
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 78a34b67-3c39-4886-8fb4-61c46dc18ecd
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: match
description: >
  Detects when a Microsoft Cloud App Security reported a user has deleted a
  unusual a large volume of files. MITRE ATT&CK: T1485.
data_source:
  - Office 365 Management Activity API
  - "Workload: ThreatIntelligence"
workload: ThreatIntelligence
how_to_implement: >
  Requires the Wazuh office365 module configured with an Azure AD application
  subscribed to the Office 365 Management Activity API for the relevant
  workload, ingested into the wazuh-* indices. The detection looks for events
  where data_office365_eventSource equals 'SecurityComplianceCenter';
  data_office365_eventName equals 'Unusual volume of file deletion';
  data_office365_status equals 'success'.
known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.
references:
  - https://learn.microsoft.com/en-us/defender-cloud-apps/anomaly-detection-policy
  - https://learn.microsoft.com/en-us/defender-cloud-apps/policy-template-reference
  - https://attack.mitre.org/techniques/T1485/
response:
  message: >
    Microsoft 365 - Unusual Volume of File Deletion detected for user
    $data_office365_UserId$. Matched data_office365_eventSource:
    $data_office365_eventSource$. Matched data_office365_eventName:
    $data_office365_eventName$. MITRE ATT&CK: T1485
  risk_score: 50
  severity: medium
  risk_objects:
    - field: data_office365_UserId
      type: user
      score: 50
  threat_objects:
    - field: data_office365_eventSource
      type: other
    - field: data_office365_eventName
      type: other
tags:
  asset_type: Cloud Identity
  mitre_attack_id:
    - T1485
  custom_tags:
    - microsoft
    - unusual
    - volume
    - o365
    - threat_management
    - impact
  product:
    - Office 365
  security_domain: cloud
graylog:
  query: data_office365_eventSource:/[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy][Cc][Oo][Mm][Pp][Ll][Ii][Aa][Nn][Cc][Ee][Cc][Ee][Nn][Tt][Ee][Rr]/ AND data_office365_eventName:/[Uu][Nn][Uu][Ss][Uu][Aa][Ll] [Vv][Oo][Ll][Uu][Mm][Ee] [Oo][Ff] [Ff][Ii][Ll][Ee] [Dd][Ee][Ll][Ee][Tt][Ii][Oo][Nn]/ AND data_office365_status:/[Ss][Uu][Cc][Cc][Ee][Ss][Ss]/

correlation:
  # Authored by the correlation engine for review. Related CoPilot Searches to run
  # around an alert from this rule, scoped to the same host/user/IP within the window.
  related_rules:
    - id: M365_Mass_File_Deletion
      name: "M365 Mass File Deletion"
      reason: "next kill-chain tactic: Impact"
    - id: M365_Suspicious_File_Deletion
      name: "M365 Suspicious File Deletion"
      reason: "next kill-chain tactic: Impact"
    - id: bd132164-884a-48f1-aa2d-c6d646b04c69
      name: "Microsoft 365 - Potential Ransomware Activity"
      reason: "next kill-chain tactic: Impact"
  window: 1h
