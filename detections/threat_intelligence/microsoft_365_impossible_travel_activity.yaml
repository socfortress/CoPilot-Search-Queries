name: Microsoft 365 - Impossible Travel Activity
id: d7eab125-5f94-43df-8710-795b80fa1189
version: 1
schema_version: "1.0"
date: "2021-11-27"
author: Austin Songer @austinsonger
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: d7eab125-5f94-43df-8710-795b80fa1189
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: match
description: >
  Detects when a Microsoft Cloud App Security reported a risky sign-in attempt
  due to a login associated with an impossible travel. MITRE ATT&CK: T1078.
data_source:
  - Office 365 Management Activity API
  - "Workload: ThreatIntelligence"
workload: ThreatIntelligence
how_to_implement: >
  Requires the Wazuh office365 module configured with an Azure AD application
  subscribed to the Office 365 Management Activity API for the relevant
  workload, ingested into the wazuh-* indices. The detection looks for events
  where data_office365_eventSource equals 'SecurityComplianceCenter';
  data_office365_eventName equals 'Impossible travel activity';
  data_office365_status equals 'success'.
known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.
references:
  - https://learn.microsoft.com/en-us/defender-cloud-apps/anomaly-detection-policy
  - https://learn.microsoft.com/en-us/defender-cloud-apps/policy-template-reference
  - https://attack.mitre.org/techniques/T1078/
response:
  message: >
    Microsoft 365 - Impossible Travel Activity detected for user
    $data_office365_UserId$. Matched data_office365_eventSource:
    $data_office365_eventSource$. Matched data_office365_eventName:
    $data_office365_eventName$. MITRE ATT&CK: T1078
  risk_score: 50
  severity: medium
  risk_objects:
    - field: data_office365_UserId
      type: user
      score: 50
  threat_objects:
    - field: data_office365_eventSource
      type: other
    - field: data_office365_eventName
      type: other
tags:
  asset_type: Cloud Identity
  mitre_attack_id:
    - T1078
  custom_tags:
    - microsoft
    - impossible
    - travel
    - o365
    - threat_management
    - privilege_escalation
    - persistence
    - initial_access
  product:
    - Office 365
  security_domain: cloud
graylog:
  query: data_office365_eventSource:/[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy][Cc][Oo][Mm][Pp][Ll][Ii][Aa][Nn][Cc][Ee][Cc][Ee][Nn][Tt][Ee][Rr]/ AND data_office365_eventName:/[Ii][Mm][Pp][Oo][Ss][Ss][Ii][Bb][Ll][Ee] [Tt][Rr][Aa][Vv][Ee][Ll] [Aa][Cc][Tt][Ii][Vv][Ii][Tt][Yy]/ AND data_office365_status:/[Ss][Uu][Cc][Cc][Ee][Ss][Ss]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 0f2468a2-5055-4212-a368-7321198ee706
    name: Activity from Infrequent Country
    reason: 'Pinpoints the far end of the impossible-travel pair: a successful sign-in from a country this account never operates from. Both flags on one user in the same window turns ''physically impossible'' into ''signed in from the attacker''s location''.'
  - id: d8b0a4fe-07a8-41be-bd39-b14afa025d95
    name: Activity from Anonymous IP Addresses
    reason: 'MCAS routinely raises this on the same compromised session: the attacker''s end of the travel pair is a Tor/VPN/proxy address, so an anonymous-IP flag on this user confirms the foreign login is attacker-controlled rather than the real user roaming.'
  - id: c191e2fa-f9d6-4ccf-82af-4f2aba08359f
    name: Logon from a Risky IP Address
    reason: Threat-intel reputation on the same source IP; if the anomalous sign-in came from a known-bad address it removes the benign 'misattributed GPS / corporate VPN' explanation for the impossible travel.
  - id: 13f2d3f5-6497-44a7-bf5f-dc13ffafe5dc
    name: Azure Login Bypassing Conditional Access Policies
    reason: 'Explains HOW the foreign login succeeded despite controls: legacy/basic auth that skips MFA and Conditional Access. A CA bypass on this user in the same window is the likely mechanism behind the impossible-travel sign-in.'
  - id: M365_Inbox_Rule_Created
    name: M365 Inbox Rule Created
    reason: 'The first move of the BEC playbook that follows an account takeover: an inbox rule that auto-forwards, redirects or silently deletes mail so the real user and the SOC never see the attacker''s activity. Expect it minutes after this sign-in.'
  - id: M365_Email_Forwarding_Created
    name: M365 Email Forwarding Created
    reason: Mailbox-level forwarding (Set-Mailbox ForwardingSmtpAddress) siphons a copy of all incoming mail to an attacker address — the standard post-takeover exfiltration channel configured right after a compromised sign-in like this one.
  - id: 60de9b57-dc4d-48b9-a6a0-b39e0469f876
    name: Disabling Multi Factor Authentication
    reason: 'Post-takeover persistence and lockout: having gotten in, the attacker disables strong authentication to keep access and stop the legitimate user from cleanly recovering. Seeing it on this user is high-confidence that the impossible-travel login was hostile.'
  - id: 2b669496-d215-47d8-bd9a-f4a45bf07cda
    name: Data Exfiltration to Unsanctioned Apps
    reason: 'The objective of the intrusion: the same MCAS engine flags this compromised user moving data to an unsanctioned app. Co-occurring with impossible travel it marks the takeover reaching the exfiltration stage.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Interactive sign-ins and failures for this user
    query: (data_office365_Operation:/.*[Uu][Ss][Ee][Rr][Ll][Oo][Gg][Gg][Ee][Dd][Ii][Nn].*/ OR data_office365_Operation:/.*[Uu][Ss][Ee][Rr][Ll][Oo][Gg][Ii][Nn][Ff][Aa][Ii][Ll][Ee][Dd].*/)
    pivot_on:
    - user
    window: 6h
  - name: Mailbox rule and forwarding changes by this user
    query: (data_office365_Operation:/.*[Nn][Ee][Ww]-[Ii][Nn][Bb][Oo][Xx][Rr][Uu][Ll][Ee].*/ OR data_office365_Operation:/.*[Ss][Ee][Tt]-[Ii][Nn][Bb][Oo][Xx][Rr][Uu][Ll][Ee].*/ OR data_office365_Operation:/.*[Ss][Ee][Tt]-[Mm][Aa][Ii][Ll][Bb][Oo][Xx].*/ OR data_office365_Operation:/.*[Nn][Ee][Ww]-[Tt][Rr][Aa][Nn][Ss][Pp][Oo][Rr][Tt][Rr][Uu][Ll][Ee].*/ OR data_office365_Operation:/.*[Ss][Ee][Tt]-[Tt][Rr][Aa][Nn][Ss][Pp][Oo][Rr][Tt][Rr][Uu][Ll][Ee].*/)
    pivot_on:
    - user
    window: 24h
  - name: SharePoint/OneDrive mass download and external sharing by this user
    query: (data_office365_Operation:/.*[Ff][Ii][Ll][Ee][Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ee][Dd].*/ OR data_office365_Operation:/.*[Ff][Ii][Ll][Ee][Ss][Yy][Nn][Cc][Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ee][Dd][Ff][Uu][Ll][Ll].*/ OR data_office365_Operation:/.*[Aa][Nn][Oo][Nn][Yy][Mm][Oo][Uu][Ss][Ll][Ii][Nn][Kk][Cc][Rr][Ee][Aa][Tt][Ee][Dd].*/ OR data_office365_Operation:/.*[Ss][Hh][Aa][Rr][Ii][Nn][Gg][Ii][Nn][Vv][Ii][Tt][Aa][Tt][Ii][Oo][Nn][Cc][Rr][Ee][Aa][Tt][Ee][Dd].*/)
    pivot_on:
    - user
    window: 6h
  - name: MFA, password and Conditional Access changes on this user
    query: (data_office365_Operation:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee] [Ss][Tt][Rr][Oo][Nn][Gg] [Aa][Uu][Tt][Hh][Ee][Nn][Tt][Ii][Cc][Aa][Tt][Ii][Oo][Nn].*/ OR data_office365_Operation:/.*[Ss][Ee][Tt]-[Cc][Oo][Nn][Dd][Ii][Tt][Ii][Oo][Nn][Aa][Ll][Aa][Cc][Cc][Ee][Ss][Ss][Pp][Oo][Ll][Ii][Cc][Yy].*/ OR data_office365_Operation:/.*[Rr][Ee][Ss][Ee][Tt] [Uu][Ss][Ee][Rr] [Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd].*/ OR data_office365_Operation:/.*[Uu][Pp][Dd][Aa][Tt][Ee] [Uu][Ss][Ee][Rr].*/)
    pivot_on:
    - user
    window: 24h
  - name: Other accounts touched by this client IP
    query: _exists_:data_office365_UserId
    pivot_on:
    - ip
    window: 6h
