name: Activity from Infrequent Country
id: 0f2468a2-5055-4212-a368-7321198ee706
version: 1
schema_version: "1.0"
date: "2022-10-09"
author: Austin Songer @austinsonger
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 0f2468a2-5055-4212-a368-7321198ee706
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: match
description: >
  Detects when a Microsoft Cloud App Security reported when an activity occurs
  from a location that wasn't recently or never visited by any user in the
  organization. MITRE ATT&CK: T1573.
data_source:
  - Office 365 Management Activity API
  - "Workload: ThreatIntelligence"
workload: ThreatIntelligence
how_to_implement: >
  Requires the Wazuh office365 module configured with an Azure AD application
  subscribed to the Office 365 Management Activity API for the relevant
  workload, ingested into the wazuh-* indices. The detection looks for events
  where data_office365_eventSource equals 'SecurityComplianceCenter';
  data_office365_eventName equals 'Activity from infrequent country';
  data_office365_status equals 'success'.
known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.
references:
  - https://learn.microsoft.com/en-us/defender-cloud-apps/anomaly-detection-policy
  - https://learn.microsoft.com/en-us/defender-cloud-apps/policy-template-reference
  - https://attack.mitre.org/techniques/T1573/
response:
  message: >
    Activity from Infrequent Country detected for user $data_office365_UserId$.
    Matched data_office365_eventSource: $data_office365_eventSource$. Matched
    data_office365_eventName: $data_office365_eventName$. MITRE ATT&CK: T1573
  risk_score: 50
  severity: medium
  risk_objects:
    - field: data_office365_UserId
      type: user
      score: 50
  threat_objects:
    - field: data_office365_eventSource
      type: other
    - field: data_office365_eventName
      type: other
tags:
  asset_type: Cloud Identity
  mitre_attack_id:
    - T1573
  custom_tags:
    - infrequent
    - country
    - o365
    - threat_management
    - command_and_control
  product:
    - Office 365
  security_domain: cloud
graylog:
  query: data_office365_eventSource:/[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy][Cc][Oo][Mm][Pp][Ll][Ii][Aa][Nn][Cc][Ee][Cc][Ee][Nn][Tt][Ee][Rr]/ AND data_office365_eventName:/[Aa][Cc][Tt][Ii][Vv][Ii][Tt][Yy] [Ff][Rr][Oo][Mm] [Ii][Nn][Ff][Rr][Ee][Qq][Uu][Ee][Nn][Tt] [Cc][Oo][Uu][Nn][Tt][Rr][Yy]/ AND data_office365_status:/[Ss][Uu][Cc][Cc][Ee][Ss][Ss]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d7eab125-5f94-43df-8710-795b80fa1189
    name: Microsoft 365 - Impossible Travel Activity
    reason: Same Defender for Cloud Apps sign-in geography anomaly class; impossible-travel firing for this user alongside the infrequent-country activity means the account is being used from the new country while the real owner is active elsewhere, turning one geo anomaly into confirmed account takeover.
  - id: d8b0a4fe-07a8-41be-bd39-b14afa025d95
    name: Activity from Anonymous IP Addresses
    reason: The infrequent country is frequently a Tor/VPN/anonymizer exit; this anomaly on the same user's sign-in confirms the source IP is deliberately masked, ruling out the traveling-employee false positive.
  - id: c191e2fa-f9d6-4ccf-82af-4f2aba08359f
    name: Logon from a Risky IP Address
    reason: Corroborates that the same session's source IP is threat-intel-flagged; a risky-IP logon for this user in the window shows the foreign activity originates from known-bad infrastructure, not benign travel.
  - id: 13f2d3f5-6497-44a7-bf5f-dc13ffafe5dc
    name: Azure Login Bypassing Conditional Access Policies
    reason: Geo-fencing Conditional Access would normally block a login from an infrequent country; a CA-bypass UserLoggedIn for the same user explains how the attacker's foreign session evaded location controls via the CMSI auth path.
  - id: M365_Inbox_Rule_Created
    name: M365 Inbox Rule Created
    reason: 'The canonical first hands-on-keyboard move after a foreign sign-in: a New-InboxRule planted to auto-delete or divert security and reply mail; appearing on this mailbox it confirms interactive takeover rather than a transient anomaly.'
  - id: M365_Email_Forwarding_Created
    name: M365 Email Forwarding Created
    reason: A Set-Mailbox forwarding address added shortly after the anomalous login is the attacker wiring up silent mail exfiltration from the seized mailbox, a direct escalation of this ATO signal.
  - id: M365_Mass_File_Download
    name: M365 Mass File Download
    reason: Bulk FileDownloaded from this user's SharePoint/OneDrive soon after the foreign sign-in escalates the geo anomaly into active data theft from the compromised account.
  - id: ee111937-1fe7-40f0-962a-0eb44d57d174
    name: Suspicious OAuth App File Download Activities
    reason: Attackers consent a malicious OAuth app to keep token-based access past a password reset and pull files through it; OAuth-app downloads for this user corroborate both persistence and exfiltration following the anomalous sign-in.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Corroborating Defender for Cloud Apps sign-in anomalies for this user
    query: data_office365_eventSource:/[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy][Cc][Oo][Mm][Pp][Ll][Ii][Aa][Nn][Cc][Ee][Cc][Ee][Nn][Tt][Ee][Rr]/ AND (data_office365_eventName:/[Ii][Mm][Pp][Oo][Ss][Ss][Ii][Bb][Ll][Ee] [Tt][Rr][Aa][Vv][Ee][Ll] [Aa][Cc][Tt][Ii][Vv][Ii][Tt][Yy]/ OR data_office365_eventName:/[Aa][Cc][Tt][Ii][Vv][Ii][Tt][Yy] [Ff][Rr][Oo][Mm] [Aa][Nn][Oo][Nn][Yy][Mm][Oo][Uu][Ss] [Ii][Pp] [Aa][Dd][Dd][Rr][Ee][Ss][Ss][Ee][Ss]/ OR data_office365_eventName:/[Ll][Oo][Gg] [Oo][Nn] [Ff][Rr][Oo][Mm] [Aa] [Rr][Ii][Ss][Kk][Yy] [Ii][Pp] [Aa][Dd][Dd][Rr][Ee][Ss][Ss]/)
    pivot_on:
    - user
    window: 6h
  - name: Sign-ins and sign-in failures from this source address
    query: (data_office365_Operation:/[Uu][Ss][Ee][Rr][Ll][Oo][Gg][Gg][Ee][Dd][Ii][Nn]/ OR data_office365_Operation:/[Uu][Ss][Ee][Rr][Ll][Oo][Gg][Ii][Nn][Ff][Aa][Ii][Ll][Ee][Dd]/)
    pivot_on:
    - ip
    window: 6h
  - name: Mailbox persistence (inbox rules, forwarding, delegation) by this user
    query: (data_office365_Operation:/[Nn][Ee][Ww]-[Ii][Nn][Bb][Oo][Xx][Rr][Uu][Ll][Ee]/ OR data_office365_Operation:/[Ss][Ee][Tt]-[Ii][Nn][Bb][Oo][Xx][Rr][Uu][Ll][Ee]/ OR data_office365_Operation:/[Ss][Ee][Tt]-[Mm][Aa][Ii][Ll][Bb][Oo][Xx]/ OR data_office365_Operation:/[Nn][Ee][Ww]-[Tt][Rr][Aa][Nn][Ss][Pp][Oo][Rr][Tt][Rr][Uu][Ll][Ee]/ OR data_office365_Operation:/[Aa][Dd][Dd]-[Mm][Aa][Ii][Ll][Bb][Oo][Xx][Pp][Ee][Rr][Mm][Ii][Ss][Ss][Ii][Oo][Nn]/ OR data_office365_Operation:/[Aa][Dd][Dd]-[Rr][Ee][Cc][Ii][Pp][Ii][Ee][Nn][Tt][Pp][Ee][Rr][Mm][Ii][Ss][Ss][Ii][Oo][Nn]/)
    pivot_on:
    - user
    window: 24h
  - name: Mass file download and external sharing by this user
    query: (data_office365_Operation:/[Ff][Ii][Ll][Ee][Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ee][Dd]/ OR data_office365_Operation:/[Ff][Ii][Ll][Ee][Ss][Yy][Nn][Cc][Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ee][Dd][Ff][Uu][Ll][Ll]/ OR data_office365_Operation:/[Aa][Nn][Oo][Nn][Yy][Mm][Oo][Uu][Ss][Ll][Ii][Nn][Kk][Cc][Rr][Ee][Aa][Tt][Ee][Dd]/ OR data_office365_Operation:/[Ss][Hh][Aa][Rr][Ii][Nn][Gg][Ii][Nn][Vv][Ii][Tt][Aa][Tt][Ii][Oo][Nn][Cc][Rr][Ee][Aa][Tt][Ee][Dd]/ OR data_office365_Operation:/[Mm][Aa][Ii][Ll][Ii][Tt][Ee][Mm][Ss][Aa][Cc][Cc][Ee][Ss][Ss][Ee][Dd]/)
    pivot_on:
    - user
    window: 24h
  - name: OAuth app consent and permission grants by this user
    query: (data_office365_Operation:/[Cc][Oo][Nn][Ss][Ee][Nn][Tt] [Tt][Oo] [Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn]/ OR data_office365_Operation:/[Aa][Dd][Dd] [Oo][Aa][Uu][Tt][Hh]2[Pp][Ee][Rr][Mm][Ii][Ss][Ss][Ii][Oo][Nn][Gg][Rr][Aa][Nn][Tt]/ OR data_office365_Operation:/[Aa][Dd][Dd] [Dd][Ee][Ll][Ee][Gg][Aa][Tt][Ee][Dd] [Pp][Ee][Rr][Mm][Ii][Ss][Ss][Ii][Oo][Nn] [Gg][Rr][Aa][Nn][Tt]/ OR data_office365_Operation:/[Aa][Dd][Dd] [Ss][Ee][Rr][Vv][Ii][Cc][Ee] [Pp][Rr][Ii][Nn][Cc][Ii][Pp][Aa][Ll]/)
    pivot_on:
    - user
    window: 24h
