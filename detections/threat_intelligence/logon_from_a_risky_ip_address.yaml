name: Logon from a Risky IP Address
id: c191e2fa-f9d6-4ccf-82af-4f2aba08359f
version: 1
schema_version: "1.0"
date: "2022-10-09"
author: Austin Songer @austinsonger
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: c191e2fa-f9d6-4ccf-82af-4f2aba08359f
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: match
description: >
  Detects when a Microsoft Cloud App Security reported when a user signs into
  your sanctioned apps from a risky IP address. MITRE ATT&CK: T1078.
data_source:
  - Office 365 Management Activity API
  - "Workload: ThreatIntelligence"
workload: ThreatIntelligence
how_to_implement: >
  Requires the Wazuh office365 module configured with an Azure AD application
  subscribed to the Office 365 Management Activity API for the relevant
  workload, ingested into the wazuh-* indices. The detection looks for events
  where data_office365_eventSource equals 'SecurityComplianceCenter';
  data_office365_eventName equals 'Log on from a risky IP address';
  data_office365_status equals 'success'.
known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.
references:
  - https://learn.microsoft.com/en-us/defender-cloud-apps/anomaly-detection-policy
  - https://learn.microsoft.com/en-us/defender-cloud-apps/policy-template-reference
  - https://attack.mitre.org/techniques/T1078/
response:
  message: >
    Logon from a Risky IP Address detected for user $data_office365_UserId$.
    Matched data_office365_eventSource: $data_office365_eventSource$. Matched
    data_office365_eventName: $data_office365_eventName$. MITRE ATT&CK: T1078
  risk_score: 50
  severity: medium
  risk_objects:
    - field: data_office365_UserId
      type: user
      score: 50
  threat_objects:
    - field: data_office365_eventSource
      type: other
    - field: data_office365_eventName
      type: other
tags:
  asset_type: Cloud Identity
  mitre_attack_id:
    - T1078
  custom_tags:
    - logon
    - risky
    - address
    - o365
    - threat_management
    - privilege_escalation
    - persistence
    - initial_access
  product:
    - Office 365
  security_domain: cloud
graylog:
  query: data_office365_eventSource:/[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy][Cc][Oo][Mm][Pp][Ll][Ii][Aa][Nn][Cc][Ee][Cc][Ee][Nn][Tt][Ee][Rr]/ AND data_office365_eventName:/[Ll][Oo][Gg] [Oo][Nn] [Ff][Rr][Oo][Mm] [Aa] [Rr][Ii][Ss][Kk][Yy] [Ii][Pp] [Aa][Dd][Dd][Rr][Ee][Ss][Ss]/ AND data_office365_status:/[Ss][Uu][Cc][Cc][Ee][Ss][Ss]/

correlation:
  # Authored by the correlation engine for review. Related CoPilot Searches to run
  # around an alert from this rule, scoped to the same host/user/IP within the window.
  related_rules:
    - id: d8b0a4fe-07a8-41be-bd39-b14afa025d95
      name: "Activity from Anonymous IP Addresses"
      reason: "next kill-chain tactic: Command and Control"
    - id: 0f2468a2-5055-4212-a368-7321198ee706
      name: "Activity from Infrequent Country"
      reason: "next kill-chain tactic: Command and Control"
    - id: 13f2d3f5-6497-44a7-bf5f-dc13ffafe5dc
      name: "Azure Login Bypassing Conditional Access Policies"
      reason: "next kill-chain tactic: Initial Access"
    - id: 2b669496-d215-47d8-bd9a-f4a45bf07cda
      name: "Data Exfiltration to Unsanctioned Apps"
      reason: "next kill-chain tactic: Exfiltration"
    - id: 60de9b57-dc4d-48b9-a6a0-b39e0469f876
      name: "Disabling Multi Factor Authentication"
      reason: "next kill-chain tactic: Persistence"
    - id: M365_Email_Forwarding_Created
      name: "M365 Email Forwarding Created"
      reason: "next kill-chain tactic: Collection"
  window: 1h
  enrichment_searches:
  # Rule-specific telemetry pivots the engine runs around an alert from this rule,
  # scoped to the alert's host/user/IP within the window (behaviour-targeted, not a sweep).
    - name: "Operations from this client address"
      query: '_exists_:data_office365_UserId'
      pivot_on: [ip]
      window: 6h
    - name: "Sign-in activity by this user"
      query: '(data_office365_Operation:/.*[Uu][Ss][Ee][Rr][Ll][Oo][Gg][Gg][Ee][Dd][Ii][Nn].*/ OR data_office365_Operation:/.*[Uu][Ss][Ee][Rr][Ll][Oo][Gg][Ii][Nn][Ff][Aa][Ii][Ll][Ee][Dd].*/)'
      pivot_on: [user]
      window: 6h
    - name: "Mailbox-rule / sharing / download operations by this user"
      query: '(data_office365_Operation:/.*[Nn][Ee][Ww]-[Ii][Nn][Bb][Oo][Xx][Rr][Uu][Ll][Ee].*/ OR data_office365_Operation:/.*[Ff][Ii][Ll][Ee][Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ee][Dd].*/ OR data_office365_Operation:/.*[Ss][Hh][Aa][Rr][Ii][Nn][Gg][Ss][Ee][Tt].*/ OR data_office365_Operation:/.*[Aa][Dd][Dd] [Mm][Ee][Mm][Bb][Ee][Rr] [Tt][Oo] [Rr][Oo][Ll][Ee].*/)'
      pivot_on: [user]
      window: 24h
    - name: "Mailbox-rule / app-consent persistence by this user"
      query: '(data_office365_Operation:/.*[Nn][Ee][Ww]-[Ii][Nn][Bb][Oo][Xx][Rr][Uu][Ll][Ee].*/ OR data_office365_Operation:/.*[Ss][Ee][Tt]-[Ii][Nn][Bb][Oo][Xx][Rr][Uu][Ll][Ee].*/ OR data_office365_Operation:/.*[Cc][Oo][Nn][Ss][Ee][Nn][Tt] [Tt][Oo] [Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn].*/ OR data_office365_Operation:/.*[Aa][Dd][Dd] [Ss][Ee][Rr][Vv][Ii][Cc][Ee] [Pp][Rr][Ii][Nn][Cc][Ii][Pp][Aa][Ll].*/ OR data_office365_Operation:/.*[Aa][Dd][Dd] [Dd][Ee][Ll][Ee][Gg][Aa][Tt][Ee][Dd] [Pp][Ee][Rr][Mm][Ii][Ss][Ss][Ii][Oo][Nn] [Gg][Rr][Aa][Nn][Tt].*/)'
      pivot_on: [user]
      window: 24h
