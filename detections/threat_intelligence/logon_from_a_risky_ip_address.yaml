name: Logon from a Risky IP Address
id: c191e2fa-f9d6-4ccf-82af-4f2aba08359f
version: 1
schema_version: "1.0"
date: "2022-10-09"
author: Austin Songer @austinsonger
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: c191e2fa-f9d6-4ccf-82af-4f2aba08359f
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: match
description: >
  Detects when a Microsoft Cloud App Security reported when a user signs into
  your sanctioned apps from a risky IP address. MITRE ATT&CK: T1078.
data_source:
  - Office 365 Management Activity API
  - "Workload: ThreatIntelligence"
workload: ThreatIntelligence
how_to_implement: >
  Requires the Wazuh office365 module configured with an Azure AD application
  subscribed to the Office 365 Management Activity API for the relevant
  workload, ingested into the wazuh-* indices. The detection looks for events
  where data_office365_eventSource equals 'SecurityComplianceCenter';
  data_office365_eventName equals 'Log on from a risky IP address';
  data_office365_status equals 'success'.
known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.
references:
  - https://learn.microsoft.com/en-us/defender-cloud-apps/anomaly-detection-policy
  - https://learn.microsoft.com/en-us/defender-cloud-apps/policy-template-reference
  - https://attack.mitre.org/techniques/T1078/
response:
  message: >
    Logon from a Risky IP Address detected for user $data_office365_UserId$.
    Matched data_office365_eventSource: $data_office365_eventSource$. Matched
    data_office365_eventName: $data_office365_eventName$. MITRE ATT&CK: T1078
  risk_score: 50
  severity: medium
  risk_objects:
    - field: data_office365_UserId
      type: user
      score: 50
  threat_objects:
    - field: data_office365_eventSource
      type: other
    - field: data_office365_eventName
      type: other
tags:
  asset_type: Cloud Identity
  mitre_attack_id:
    - T1078
  custom_tags:
    - logon
    - risky
    - address
    - o365
    - threat_management
    - privilege_escalation
    - persistence
    - initial_access
  product:
    - Office 365
  security_domain: cloud
graylog:
  query: data_office365_eventSource:/[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy][Cc][Oo][Mm][Pp][Ll][Ii][Aa][Nn][Cc][Ee][Cc][Ee][Nn][Tt][Ee][Rr]/ AND data_office365_eventName:/[Ll][Oo][Gg] [Oo][Nn] [Ff][Rr][Oo][Mm] [Aa] [Rr][Ii][Ss][Kk][Yy] [Ii][Pp] [Aa][Dd][Dd][Rr][Ee][Ss][Ss]/ AND data_office365_status:/[Ss][Uu][Cc][Cc][Ee][Ss][Ss]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d7eab125-5f94-43df-8710-795b80fa1189
    name: Microsoft 365 - Impossible Travel Activity
    reason: 'Same MCAS threat-intelligence sign-in anomaly on the same user: a successful login flagged as geographically impossible versus the legitimate session. Firing alongside this risky-IP logon is near-definitive confirmation of an active takeover rather than a benign VPN hop.'
  - id: d8b0a4fe-07a8-41be-bd39-b14afa025d95
    name: Activity from Anonymous IP Addresses
    reason: 'Co-occurring MCAS anomaly on the same session: risky IPs are frequently Tor/VPN/anonymizer exits, so Defender for Cloud Apps commonly raises both on one sign-in. A second anonymizing-source hit on the same user corroborates attacker-controlled network infrastructure.'
  - id: 0f2468a2-5055-4212-a368-7321198ee706
    name: Activity from Infrequent Country
    reason: 'Co-occurring MCAS anomaly: the risky IP geolocates to a country the tenant never signs in from. Same user, same session - a geography anomaly stacked on the IP-reputation anomaly strengthens the account-takeover verdict.'
  - id: 13f2d3f5-6497-44a7-bf5f-dc13ffafe5dc
    name: Azure Login Bypassing Conditional Access Policies
    reason: 'Follow-on by the same compromised identity: holding valid credentials (proven by this successful logon), the attacker mints an Intune Company Portal token with TokenSmith to satisfy device-trust and bypass Conditional Access, turning a one-off risky logon into durable CA-exempt access.'
  - id: 60de9b57-dc4d-48b9-a6a0-b39e0469f876
    name: Disabling Multi Factor Authentication
    reason: 'Classic post-takeover persistence and defense-impairment by the same user/IP: a ''Disable Strong Authentication'' event strips MFA so the attacker keeps access even after a password reset. Expect it shortly after a confirmed risky-IP logon.'
  - id: M365_Inbox_Rule_Created
    name: M365 Inbox Rule Created
    reason: 'Top post-takeover action from the hijacked session: New-InboxRule to auto-forward externally or hide (move/delete) mail for business email compromise and to silently intercept security and reply messages. Same user, minutes-to-hours after the risky logon.'
  - id: M365_Email_Forwarding_Created
    name: M365 Email Forwarding Created
    reason: 'The other canonical BEC persistence move after this account compromise: mailbox-level Set-Mailbox forwarding to an external/attacker-controlled address, exfiltrating a copy of all inbound mail. Same user and client IP as the risky logon.'
  - id: 2b669496-d215-47d8-bd9a-f4a45bf07cda
    name: Data Exfiltration to Unsanctioned Apps
    reason: 'MCAS exfiltration anomaly on the same compromised session: the attacker pushes organizational data into an unsanctioned app, directly realizing the objective the risky-IP logon enabled. Same user and client IP.'
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Sign-in success / failure activity by this user
    query: (data_office365_Operation:/.*[Uu][Ss][Ee][Rr][Ll][Oo][Gg][Gg][Ee][Dd][Ii][Nn].*/ OR data_office365_Operation:/.*[Uu][Ss][Ee][Rr][Ll][Oo][Gg][Ii][Nn][Ff][Aa][Ii][Ll][Ee][Dd].*/)
    pivot_on:
    - user
    window: 6h
  - name: Mailbox persistence (inbox rules / forwarding / delegation) by this user
    query: (data_office365_Operation:/.*[Nn][Ee][Ww]-[Ii][Nn][Bb][Oo][Xx][Rr][Uu][Ll][Ee].*/ OR data_office365_Operation:/.*[Ss][Ee][Tt]-[Ii][Nn][Bb][Oo][Xx][Rr][Uu][Ll][Ee].*/ OR data_office365_Operation:/.*[Ss][Ee][Tt]-[Mm][Aa][Ii][Ll][Bb][Oo][Xx].*/ OR data_office365_Operation:/.*[Aa][Dd][Dd]-[Mm][Aa][Ii][Ll][Bb][Oo][Xx][Pp][Ee][Rr][Mm][Ii][Ss][Ss][Ii][Oo][Nn].*/ OR data_office365_Operation:/.*[Aa][Dd][Dd]-[Rr][Ee][Cc][Ii][Pp][Ii][Ee][Nn][Tt][Pp][Ee][Rr][Mm][Ii][Ss][Ss][Ii][Oo][Nn].*/)
    pivot_on:
    - user
    window: 24h
  - name: MFA / conditional-access / credential tampering by this user
    query: (data_office365_Operation:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee] [Ss][Tt][Rr][Oo][Nn][Gg] [Aa][Uu][Tt][Hh][Ee][Nn][Tt][Ii][Cc][Aa][Tt][Ii][Oo][Nn].*/ OR data_office365_Operation:/.*[Ss][Ee][Tt]-[Cc][Oo][Nn][Dd][Ii][Tt][Ii][Oo][Nn][Aa][Ll][Aa][Cc][Cc][Ee][Ss][Ss][Pp][Oo][Ll][Ii][Cc][Yy].*/ OR data_office365_Operation:/.*[Uu][Pp][Dd][Aa][Tt][Ee] [Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Aa][Tt][Ii][Oo][Nn] [Pp][Oo][Ll][Ii][Cc][Yy].*/ OR data_office365_Operation:/.*[Rr][Ee][Ss][Ee][Tt] [Uu][Ss][Ee][Rr] [Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd].*/)
    pivot_on:
    - user
    window: 24h
  - name: Bulk file download / external sharing (exfiltration) by this user
    query: (data_office365_Operation:/.*[Ff][Ii][Ll][Ee][Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ee][Dd].*/ OR data_office365_Operation:/.*[Ff][Ii][Ll][Ee][Ss][Yy][Nn][Cc][Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ee][Dd][Ff][Uu][Ll][Ll].*/ OR data_office365_Operation:/.*[Aa][Nn][Oo][Nn][Yy][Mm][Oo][Uu][Ss][Ll][Ii][Nn][Kk][Cc][Rr][Ee][Aa][Tt][Ee][Dd].*/ OR data_office365_Operation:/.*[Cc][Oo][Mm][Pp][Aa][Nn][Yy][Ll][Ii][Nn][Kk][Cc][Rr][Ee][Aa][Tt][Ee][Dd].*/ OR data_office365_Operation:/.*[Ss][Hh][Aa][Rr][Ii][Nn][Gg][Ii][Nn][Vv][Ii][Tt][Aa][Tt][Ii][Oo][Nn][Cc][Rr][Ee][Aa][Tt][Ee][Dd].*/)
    pivot_on:
    - user
    window: 24h
  - name: 'Blast radius: sign-ins and sensitive operations from this risky client IP'
    query: (data_office365_Operation:/.*[Uu][Ss][Ee][Rr][Ll][Oo][Gg][Gg][Ee][Dd][Ii][Nn].*/ OR data_office365_Operation:/.*[Uu][Ss][Ee][Rr][Ll][Oo][Gg][Ii][Nn][Ff][Aa][Ii][Ll][Ee][Dd].*/ OR data_office365_Operation:/.*[Nn][Ee][Ww]-[Ii][Nn][Bb][Oo][Xx][Rr][Uu][Ll][Ee].*/ OR data_office365_Operation:/.*[Ss][Ee][Tt]-[Mm][Aa][Ii][Ll][Bb][Oo][Xx].*/ OR data_office365_Operation:/.*[Ff][Ii][Ll][Ee][Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ee][Dd].*/)
    pivot_on:
    - ip
    window: 6h
