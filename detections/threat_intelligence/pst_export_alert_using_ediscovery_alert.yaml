name: PST Export Alert Using eDiscovery Alert
id: 18b88d08-d73e-4f21-bc25-4b9892a4fdd0
version: 1
schema_version: "1.0"
date: "2022-11-17"
author: Sorina Ionescu
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 18b88d08-d73e-4f21-bc25-4b9892a4fdd0
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: match
description: >
  Alert on when a user has performed an eDiscovery search or exported a PST file
  from the search. This PST file usually has sensitive information including
  email body content. MITRE ATT&CK: T1114.
data_source:
  - Office 365 Management Activity API
  - "Workload: ThreatIntelligence"
workload: ThreatIntelligence
how_to_implement: >
  Requires the Wazuh office365 module configured with an Azure AD application
  subscribed to the Office 365 Management Activity API for the relevant
  workload, ingested into the wazuh-* indices. The detection looks for events
  where data_office365_eventSource equals 'SecurityComplianceCenter';
  data_office365_eventName equals 'eDiscovery search started or exported';
  data_office365_status equals 'success'.
known_false_positives: >
  PST export can be done for legitimate purposes but due to the sensitive nature
  of its content it must be monitored. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.
references:
  - https://learn.microsoft.com/en-us/microsoft-365/compliance/alert-policies?view=o365-worldwide
  - https://attack.mitre.org/techniques/T1114/
response:
  message: >
    PST Export Alert Using eDiscovery Alert detected for user
    $data_office365_UserId$. Matched data_office365_eventSource:
    $data_office365_eventSource$. Matched data_office365_eventName:
    $data_office365_eventName$. MITRE ATT&CK: T1114
  risk_score: 50
  severity: medium
  risk_objects:
    - field: data_office365_UserId
      type: user
      score: 50
  threat_objects:
    - field: data_office365_eventSource
      type: other
    - field: data_office365_eventName
      type: other
tags:
  asset_type: Cloud Identity
  mitre_attack_id:
    - T1114
  custom_tags:
    - export
    - alert
    - ediscovery
    - o365
    - threat_management
    - collection
  product:
    - Office 365
  security_domain: cloud
graylog:
  query: data_office365_eventSource:/[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy][Cc][Oo][Mm][Pp][Ll][Ii][Aa][Nn][Cc][Ee][Cc][Ee][Nn][Tt][Ee][Rr]/ AND data_office365_eventName:/[Ee][Dd][Ii][Ss][Cc][Oo][Vv][Ee][Rr][Yy] [Ss][Ee][Aa][Rr][Cc][Hh] [Ss][Tt][Aa][Rr][Tt][Ee][Dd] [Oo][Rr] [Ee][Xx][Pp][Oo][Rr][Tt][Ee][Dd]/ AND data_office365_status:/[Ss][Uu][Cc][Cc][Ee][Ss][Ss]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 6897cd82-6664-11ed-9022-0242ac120002
    name: PST Export Alert Using New-ComplianceSearchAction
    reason: 'The twin mechanism for the exact same outcome: PST export driven from ExchangePowerShell (New-ComplianceSearchAction -Export) instead of the compliance portal. A scripted actor, or a tenant where the portal eDiscovery alert is disabled, trips this on the same user, so it confirms and extends the same mailbox-collection export.'
  - id: d7eab125-5f94-43df-8710-795b80fa1189
    name: Microsoft 365 - Impossible Travel Activity
    reason: eDiscovery/PST export needs a privileged compliance identity; impossible-travel sign-ins on that same user in the window say the account was taken over, not a compliance officer at their desk running the search.
  - id: d8b0a4fe-07a8-41be-bd39-b14afa025d95
    name: Activity from Anonymous IP Addresses
    reason: 'A privileged mailbox-export traced to an anonymizing proxy/VPN is the compromised-account signature: a legitimate eDiscovery manager does not hide their origin, so this confirms the export was driven from attacker infrastructure.'
  - id: c191e2fa-f9d6-4ccf-82af-4f2aba08359f
    name: Logon from a Risky IP Address
    reason: A threat-intel-flagged sign-in for the same user around the export corroborates stolen credentials behind the eDiscovery privilege abuse.
  - id: M365_Email_Forwarding_Created
    name: M365 Email Forwarding Created
    reason: An actor bulk-grabbing existing mail via eDiscovery commonly also sets Set-Mailbox forwarding to keep exfiltrating all future mail; same-user forwarding is parallel ongoing collection on the compromised identity.
  - id: M365_Inbox_Rule_Created
    name: M365 Inbox Rule Created
    reason: New-InboxRule by the same user is the companion collection/hiding step (auto-forward, or route security replies to Deleted Items) expected alongside an eDiscovery mail grab in a BEC.
  - id: 2b669496-d215-47d8-bd9a-f4a45bf07cda
    name: Data Exfiltration to Unsanctioned Apps
    reason: The exported PST holds full email bodies and must leave the tenant; a CASB unsanctioned-app exfiltration alert on the same user is the data-egress follow-on for the staged export.
  - id: M365_Mass_Email_Deletion_Evidence_Wipe
    name: M365 Mass Email Deletion - Evidence Wipe
    reason: After collecting and exporting, the actor deletes mail to destroy traces of the access and of what was taken; mass deletion on the same user is the anti-forensics follow-on that closes the operation.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other eDiscovery / compliance-search operations by this user
    query: (data_office365_Operation:/.*[Cc][Oo][Mm][Pp][Ll][Ii][Aa][Nn][Cc][Ee][Ss][Ee][Aa][Rr][Cc][Hh].*/ OR data_office365_Operation:/.*[Ee][Dd][Ii][Ss][Cc][Oo][Vv][Ee][Rr][Yy].*/ OR data_office365_Operation:/.*[Ss][Ee][Aa][Rr][Cc][Hh][Ee][Xx][Pp][Oo][Rr][Tt][Ee][Dd].*/ OR data_office365_Operation:/.*[Ss][Ee][Aa][Rr][Cc][Hh][Ss][Tt][Aa][Rr][Tt][Ee][Dd].*/ OR data_office365_Operation:/.*[Ss][Ee][Aa][Rr][Cc][Hh][Cc][Rr][Ee][Aa][Tt][Ee][Dd].*/)
    pivot_on:
    - user
    window: 6h
  - name: eDiscovery / compliance role grants to this user
    query: (data_office365_Operation:/.*[Aa][Dd][Dd]-[Rr][Oo][Ll][Ee][Gg][Rr][Oo][Uu][Pp][Mm][Ee][Mm][Bb][Ee][Rr].*/ OR data_office365_Operation:/.*[Nn][Ee][Ww]-[Rr][Oo][Ll][Ee][Gg][Rr][Oo][Uu][Pp].*/ OR data_office365_Operation:/.*[Ss][Ee][Tt]-[Rr][Oo][Ll][Ee][Gg][Rr][Oo][Uu][Pp].*/ OR data_office365_Operation:/.*[Aa][Dd][Dd]-[Ee][Dd][Ii][Ss][Cc][Oo][Vv][Ee][Rr][Yy][Cc][Aa][Ss][Ee][Aa][Dd][Mm][Ii][Nn].*/ OR data_office365_Operation:/.*[Aa][Dd][Dd] [Mm][Ee][Mm][Bb][Ee][Rr] [Tt][Oo] [Rr][Oo][Ll][Ee].*/)
    pivot_on:
    - user
    window: 24h
  - name: Mailbox collection setup (forwarding / inbox rule / delegate) by this user
    query: (data_office365_Operation:/.*[Nn][Ee][Ww]-[Ii][Nn][Bb][Oo][Xx][Rr][Uu][Ll][Ee].*/ OR data_office365_Operation:/.*[Ss][Ee][Tt]-[Ii][Nn][Bb][Oo][Xx][Rr][Uu][Ll][Ee].*/ OR data_office365_Operation:/.*[Ss][Ee][Tt]-[Mm][Aa][Ii][Ll][Bb][Oo][Xx].*/ OR data_office365_Operation:/.*[Aa][Dd][Dd]-[Mm][Aa][Ii][Ll][Bb][Oo][Xx][Pp][Ee][Rr][Mm][Ii][Ss][Ss][Ii][Oo][Nn].*/ OR data_office365_Operation:/.*[Aa][Dd][Dd]-[Rr][Ee][Cc][Ii][Pp][Ii][Ee][Nn][Tt][Pp][Ee][Rr][Mm][Ii][Ss][Ss][Ii][Oo][Nn].*/)
    pivot_on:
    - user
    window: 24h
  - name: Mass mail deletion / compliance-search removal by this user
    query: (data_office365_Operation:/.*[Hh][Aa][Rr][Dd][Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_office365_Operation:/.*[Ss][Oo][Ff][Tt][Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_office365_Operation:/.*[Mm][Oo][Vv][Ee][Tt][Oo][Dd][Ee][Ll][Ee][Tt][Ee][Dd][Ii][Tt][Ee][Mm][Ss].*/ OR data_office365_Operation:/.*[Rr][Ee][Mm][Oo][Vv][Ee]-[Cc][Oo][Mm][Pp][Ll][Ii][Aa][Nn][Cc][Ee][Ss][Ee][Aa][Rr][Cc][Hh].*/)
    pivot_on:
    - user
    window: 6h
  - name: Operations from this client address
    query: _exists_:data_office365_UserId
    pivot_on:
    - ip
    window: 6h
