name: Microsoft 365 - Potential Ransomware Activity
id: bd132164-884a-48f1-aa2d-c6d646b04c69
version: 1
schema_version: "1.0"
date: "2022-10-09"
author: austinsonger
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: bd132164-884a-48f1-aa2d-c6d646b04c69
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: match
description: >
  Detects when a Microsoft Cloud App Security reported when a user uploads files
  to the cloud that might be infected with ransomware. MITRE ATT&CK: T1486.
data_source:
  - Office 365 Management Activity API
  - "Workload: ThreatIntelligence"
workload: ThreatIntelligence
how_to_implement: >
  Requires the Wazuh office365 module configured with an Azure AD application
  subscribed to the Office 365 Management Activity API for the relevant
  workload, ingested into the wazuh-* indices. The detection looks for events
  where data_office365_eventSource equals 'SecurityComplianceCenter';
  data_office365_eventName equals 'Potential ransomware activity';
  data_office365_status equals 'success'.
known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.
references:
  - https://learn.microsoft.com/en-us/defender-cloud-apps/anomaly-detection-policy
  - https://learn.microsoft.com/en-us/defender-cloud-apps/policy-template-reference
  - https://attack.mitre.org/techniques/T1486/
response:
  message: >
    Microsoft 365 - Potential Ransomware Activity detected for user
    $data_office365_UserId$. Matched data_office365_eventSource:
    $data_office365_eventSource$. Matched data_office365_eventName:
    $data_office365_eventName$. MITRE ATT&CK: T1486
  risk_score: 50
  severity: medium
  risk_objects:
    - field: data_office365_UserId
      type: user
      score: 50
  threat_objects:
    - field: data_office365_eventSource
      type: other
    - field: data_office365_eventName
      type: other
tags:
  asset_type: Cloud Identity
  mitre_attack_id:
    - T1486
  custom_tags:
    - microsoft
    - ransomware
    - o365
    - threat_management
    - impact
  product:
    - Office 365
  security_domain: cloud
graylog:
  query: data_office365_eventSource:/[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy][Cc][Oo][Mm][Pp][Ll][Ii][Aa][Nn][Cc][Ee][Cc][Ee][Nn][Tt][Ee][Rr]/ AND data_office365_eventName:/[Pp][Oo][Tt][Ee][Nn][Tt][Ii][Aa][Ll] [Rr][Aa][Nn][Ss][Oo][Mm][Ww][Aa][Rr][Ee] [Aa][Cc][Tt][Ii][Vv][Ii][Tt][Yy]/ AND data_office365_status:/[Ss][Uu][Cc][Cc][Ee][Ss][Ss]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 78a34b67-3c39-4886-8fb4-61c46dc18ecd
    name: Microsoft 365 - Unusual Volume of File Deletion
    reason: 'Defender for Cloud Apps sibling anomaly on the same user: ransomware deletes the original files right after encrypting the uploaded copies, so a mass-deletion verdict minutes around this one is the destruction half of the same impact event.'
  - id: M365_Mass_File_Deletion
    name: M365 Mass File Deletion
    reason: 'Raw audit-log confirmation of encrypt-then-wipe: a flood of FileRecycled by this user is the underlying evidence behind the cloud-side ransomware verdict, and deleting originals/versions is how ransomware blocks recovery.'
  - id: d7eab125-5f94-43df-8710-795b80fa1189
    name: Microsoft 365 - Impossible Travel Activity
    reason: 'Precursor account-takeover signal: an impossible-travel sign-in on this user shortly before the encryption means the ransomware is attacker-driven over a hijacked account rather than a local endpoint-sync infection - a materially different response.'
  - id: c191e2fa-f9d6-4ccf-82af-4f2aba08359f
    name: Logon from a Risky IP Address
    reason: 'Precursor initial-access signal: a sign-in from a threat-intel risky IP by the same user is how an attacker reaches the drive they then encrypt, confirming account compromise sits behind the ransomware verdict.'
  - id: d8b0a4fe-07a8-41be-bd39-b14afa025d95
    name: Activity from Anonymous IP Addresses
    reason: 'Precursor anonymizer signal: Tor/VPN-proxy activity by this user around the encryption indicates an attacker hiding origin while driving the file-encryption from a compromised account.'
  - id: M365_Mass_File_Download
    name: M365 Mass File Download
    reason: 'Double-extortion precursor: modern ransomware exfiltrates before it encrypts, so a mass-download burst by this user just prior is the steal half of a steal-then-encrypt operation on the same files.'
  - id: 2b669496-d215-47d8-bd9a-f4a45bf07cda
    name: Data Exfiltration to Unsanctioned Apps
    reason: 'Double-extortion exfil: a Defender verdict that this user pushed data to an unsanctioned app corroborates theft staged alongside the cloud encryption, raising the incident to extortion rather than destruction alone.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: File encryption burst by this user (modify / rename / sync-upload)
    query: (data_office365_Operation:/.*[Ff][Ii][Ll][Ee][Mm][Oo][Dd][Ii][Ff][Ii][Ee][Dd].*/ OR data_office365_Operation:/.*[Ff][Ii][Ll][Ee][Rr][Ee][Nn][Aa][Mm][Ee][Dd].*/ OR data_office365_Operation:/.*[Ff][Ii][Ll][Ee][Uu][Pp][Ll][Oo][Aa][Dd][Ee][Dd].*/ OR data_office365_Operation:/.*[Ff][Ii][Ll][Ee][Ss][Yy][Nn][Cc][Uu][Pp][Ll][Oo][Aa][Dd][Ee][Dd][Ff][Uu][Ll][Ll].*/)
    pivot_on:
    - user
    window: 6h
  - name: Anti-recovery deletion burst by this user (recycle / delete / version purge)
    query: (data_office365_Operation:/.*[Ff][Ii][Ll][Ee][Rr][Ee][Cc][Yy][Cc][Ll][Ee][Dd].*/ OR data_office365_Operation:/.*[Ff][Ii][Ll][Ee][Dd][Ee][Ll][Ee][Tt][Ee][Dd].*/ OR data_office365_Operation:/.*[Ff][Ii][Ll][Ee][Vv][Ee][Rr][Ss][Ii][Oo][Nn][Ss][Rr][Ee][Cc][Yy][Cc][Ll][Ee][Dd].*/ OR data_office365_Operation:/.*[Ff][Ii][Ll][Ee][Dd][Ee][Ll][Ee][Tt][Ee][Dd][Ff][Ii][Rr][Ss][Tt][Ss][Tt][Aa][Gg][Ee][Rr][Ee][Cc][Yy][Cc][Ll][Ee][Bb][Ii][Nn].*/)
    pivot_on:
    - user
    window: 6h
  - name: Steal-before-encrypt exfil by this user (download / anonymous share)
    query: (data_office365_Operation:/.*[Ff][Ii][Ll][Ee][Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ee][Dd].*/ OR data_office365_Operation:/.*[Ff][Ii][Ll][Ee][Ss][Yy][Nn][Cc][Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ee][Dd][Ff][Uu][Ll][Ll].*/ OR data_office365_Operation:/.*[Aa][Nn][Oo][Nn][Yy][Mm][Oo][Uu][Ss][Ll][Ii][Nn][Kk][Cc][Rr][Ee][Aa][Tt][Ee][Dd].*/ OR data_office365_Operation:/.*[Ss][Hh][Aa][Rr][Ii][Nn][Gg][Ss][Ee][Tt].*/)
    pivot_on:
    - user
    window: 6h
  - name: Sign-in session that owned this user (interactive logons and failures)
    query: (data_office365_Operation:/.*[Uu][Ss][Ee][Rr][Ll][Oo][Gg][Gg][Ee][Dd][Ii][Nn].*/ OR data_office365_Operation:/.*[Uu][Ss][Ee][Rr][Ll][Oo][Gg][Ii][Nn][Ff][Aa][Ii][Ll][Ee][Dd].*/)
    pivot_on:
    - user
    window: 6h
  - name: Other Defender for Cloud Apps anomaly verdicts on this user
    query: data_office365_eventSource:/[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy][Cc][Oo][Mm][Pp][Ll][Ii][Aa][Nn][Cc][Ee][Cc][Ee][Nn][Tt][Ee][Rr]/ AND NOT data_office365_eventName:/[Pp][Oo][Tt][Ee][Nn][Tt][Ii][Aa][Ll] [Rr][Aa][Nn][Ss][Oo][Mm][Ww][Aa][Rr][Ee] [Aa][Cc][Tt][Ii][Vv][Ii][Tt][Yy]/
    pivot_on:
    - user
    window: 24h
