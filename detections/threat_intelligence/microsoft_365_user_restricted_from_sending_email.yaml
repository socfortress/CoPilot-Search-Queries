name: Microsoft 365 - User Restricted from Sending Email
id: ff246f56-7f24-402a-baca-b86540e3925c
version: 1
schema_version: "1.0"
date: "2022-10-09"
author: austinsonger
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: ff246f56-7f24-402a-baca-b86540e3925c
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: match
description: >
  Detects when a Security Compliance Center reported a user who exceeded sending
  limits of the service policies and because of this has been restricted from
  sending email. MITRE ATT&CK: T1199.
data_source:
  - Office 365 Management Activity API
  - "Workload: ThreatIntelligence"
workload: ThreatIntelligence
how_to_implement: >
  Requires the Wazuh office365 module configured with an Azure AD application
  subscribed to the Office 365 Management Activity API for the relevant
  workload, ingested into the wazuh-* indices. The detection looks for events
  where data_office365_eventSource equals 'SecurityComplianceCenter';
  data_office365_eventName equals 'User restricted from sending email';
  data_office365_status equals 'success'.
known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.
references:
  - https://learn.microsoft.com/en-us/defender-cloud-apps/anomaly-detection-policy
  - https://learn.microsoft.com/en-us/defender-cloud-apps/policy-template-reference
  - https://attack.mitre.org/techniques/T1199/
response:
  message: >
    Microsoft 365 - User Restricted from Sending Email detected for user
    $data_office365_UserId$. Matched data_office365_eventSource:
    $data_office365_eventSource$. Matched data_office365_eventName:
    $data_office365_eventName$. MITRE ATT&CK: T1199
  risk_score: 50
  severity: medium
  risk_objects:
    - field: data_office365_UserId
      type: user
      score: 50
  threat_objects:
    - field: data_office365_eventSource
      type: other
    - field: data_office365_eventName
      type: other
tags:
  asset_type: Cloud Identity
  mitre_attack_id:
    - T1199
  custom_tags:
    - microsoft
    - restricted
    - sending
    - o365
    - threat_management
    - initial_access
  product:
    - Office 365
  security_domain: cloud
graylog:
  query: data_office365_eventSource:/[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy][Cc][Oo][Mm][Pp][Ll][Ii][Aa][Nn][Cc][Ee][Cc][Ee][Nn][Tt][Ee][Rr]/ AND data_office365_eventName:/[Uu][Ss][Ee][Rr] [Rr][Ee][Ss][Tt][Rr][Ii][Cc][Tt][Ee][Dd] [Ff][Rr][Oo][Mm] [Ss][Ee][Nn][Dd][Ii][Nn][Gg] [Ee][Mm][Aa][Ii][Ll]/ AND data_office365_status:/[Ss][Uu][Cc][Cc][Ee][Ss][Ss]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d7eab125-5f94-43df-8710-795b80fa1189
    name: Microsoft 365 - Impossible Travel Activity
    reason: Defender flags a sign-in to this mailbox from geographically impossible locations - the account-takeover session from which the mass outbound mail that tripped the send limit was almost certainly dispatched.
  - id: d8b0a4fe-07a8-41be-bd39-b14afa025d95
    name: Activity from Anonymous IP Addresses
    reason: Mass-mailing attackers operate a hijacked mailbox through Tor/VPN anonymizing proxies; an anonymized session on this same user is the likely origin of the restricted sending.
  - id: c191e2fa-f9d6-4ccf-82af-4f2aba08359f
    name: Logon from a Risky IP Address
    reason: A Microsoft-flagged risky-reputation IP signing into this account is the probable entry point that led to the mailbox being abused for bulk sending.
  - id: 3569aefd-e535-4391-8c18-24bd01a21eaf
    name: Suspicious Email Delivered In Microsoft 365
    reason: A malicious inbound phish that reached this user's inbox is a plausible initial-access cause of the credential theft now manifesting as the mailbox mass-sending and getting it blocked.
  - id: M365_Inbox_Rule_Created
    name: M365 Inbox Rule Created
    reason: Attackers create inbox rules to auto-delete the NDR/bounce and reply storm a mass-send generates, hiding the campaign from the mailbox owner - routinely configured in the same compromised session that triggers the restriction.
  - id: M365_Email_Forwarding_Created
    name: M365 Email Forwarding Created
    reason: Set-Mailbox forwarding siphons a copy of all mail to an attacker address - the collection half of the same compromised-mailbox operation whose outbound blast triggered the send restriction.
  - id: 60de9b57-dc4d-48b9-a6a0-b39e0469f876
    name: Disabling Multi Factor Authentication
    reason: After seizing the mailbox the attacker weakens MFA to retain access even after the send-restriction prompts the owner or helpdesk to reset the password.
  - id: 2b669496-d215-47d8-bd9a-f4a45bf07cda
    name: Data Exfiltration to Unsanctioned Apps
    reason: With outbound email now blocked by the restriction, a common next move is to pivot the compromised account to bulk data exfiltration through an unsanctioned app.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Mailbox hide/forward rules configured by this user
    query: (data_office365_Operation:/.*[Nn][Ee][Ww]-[Ii][Nn][Bb][Oo][Xx][Rr][Uu][Ll][Ee].*/ OR data_office365_Operation:/.*[Ss][Ee][Tt]-[Ii][Nn][Bb][Oo][Xx][Rr][Uu][Ll][Ee].*/ OR data_office365_Operation:/.*[Nn][Ee][Ww]-[Tt][Rr][Aa][Nn][Ss][Pp][Oo][Rr][Tt][Rr][Uu][Ll][Ee].*/ OR data_office365_Operation:/.*[Ss][Ee][Tt]-[Tt][Rr][Aa][Nn][Ss][Pp][Oo][Rr][Tt][Rr][Uu][Ll][Ee].*/ OR (data_office365_Operation:/.*[Ss][Ee][Tt]-[Mm][Aa][Ii][Ll][Bb][Oo][Xx].*/ AND data_office365_Parameters:/.*[Ff][Oo][Rr][Ww][Aa][Rr][Dd][Ii][Nn][Gg].*/))
    pivot_on:
    - user
    window: 24h
  - name: Defender anomalous sign-in detections for this user
    query: data_office365_eventSource:/.*[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy][Cc][Oo][Mm][Pp][Ll][Ii][Aa][Nn][Cc][Ee][Cc][Ee][Nn][Tt][Ee][Rr].*/ AND (data_office365_eventName:/.*[Ii][Mm][Pp][Oo][Ss][Ss][Ii][Bb][Ll][Ee] [Tt][Rr][Aa][Vv][Ee][Ll].*/ OR data_office365_eventName:/.*[Aa][Nn][Oo][Nn][Yy][Mm][Oo][Uu][Ss] [Ii][Pp].*/ OR data_office365_eventName:/.*[Rr][Ii][Ss][Kk][Yy] [Ii][Pp].*/ OR data_office365_eventName:/.*[Ii][Nn][Ff][Rr][Ee][Qq][Uu][Ee][Nn][Tt] [Cc][Oo][Uu][Nn][Tt][Rr][Yy].*/)
    pivot_on:
    - user
    window: 6h
  - name: Sign-ins and anomalies from this client IP across accounts
    query: (data_office365_Operation:/.*[Uu][Ss][Ee][Rr][Ll][Oo][Gg][Gg][Ee][Dd][Ii][Nn].*/ OR data_office365_Operation:/.*[Uu][Ss][Ee][Rr][Ll][Oo][Gg][Ii][Nn][Ff][Aa][Ii][Ll][Ee][Dd].*/ OR data_office365_eventName:/.*[Ii][Mm][Pp][Oo][Ss][Ss][Ii][Bb][Ll][Ee] [Tt][Rr][Aa][Vv][Ee][Ll].*/ OR data_office365_eventName:/.*[Aa][Nn][Oo][Nn][Yy][Mm][Oo][Uu][Ss] [Ii][Pp].*/ OR data_office365_eventName:/.*[Rr][Ii][Ss][Kk][Yy] [Ii][Pp].*/)
    pivot_on:
    - ip
    window: 6h
  - name: MFA weakening and OAuth consent persistence by this user
    query: (data_office365_Operation:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee] [Ss][Tt][Rr][Oo][Nn][Gg] [Aa][Uu][Tt][Hh][Ee][Nn][Tt][Ii][Cc][Aa][Tt][Ii][Oo][Nn].*/ OR data_office365_Operation:/.*[Uu][Pp][Dd][Aa][Tt][Ee] [Uu][Ss][Ee][Rr].*/ OR data_office365_Operation:/.*[Cc][Oo][Nn][Ss][Ee][Nn][Tt] [Tt][Oo] [Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn].*/ OR data_office365_Operation:/.*[Aa][Dd][Dd] [Dd][Ee][Ll][Ee][Gg][Aa][Tt][Ee][Dd] [Pp][Ee][Rr][Mm][Ii][Ss][Ss][Ii][Oo][Nn] [Gg][Rr][Aa][Nn][Tt].*/ OR data_office365_Operation:/.*[Aa][Dd][Dd] [Ss][Ee][Rr][Vv][Ii][Cc][Ee] [Pp][Rr][Ii][Nn][Cc][Ii][Pp][Aa][Ll].*/)
    pivot_on:
    - user
    window: 24h
  - name: Data exfiltration and bulk file activity by this user
    query: (data_office365_eventName:/.*[Dd][Aa][Tt][Aa] [Ee][Xx][Ff][Ii][Ll][Tt][Rr][Aa][Tt][Ii][Oo][Nn].*/ OR data_office365_Operation:/.*[Ff][Ii][Ll][Ee][Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ee][Dd].*/ OR data_office365_Operation:/.*[Aa][Nn][Oo][Nn][Yy][Mm][Oo][Uu][Ss][Ll][Ii][Nn][Kk].*/ OR data_office365_Operation:/.*[Ss][Hh][Aa][Rr][Ii][Nn][Gg][Ii][Nn][Vv][Ii][Tt][Aa][Tt][Ii][Oo][Nn].*/)
    pivot_on:
    - user
    window: 6h
