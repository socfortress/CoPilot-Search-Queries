name: Activity Performed by Terminated User
id: 2e669ed8-742e-4fe5-b3c4-5a59b486c2ee
version: 1
schema_version: "1.0"
date: "2022-10-09"
author: Austin Songer @austinsonger
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 2e669ed8-742e-4fe5-b3c4-5a59b486c2ee
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: match
description: >
  Detects when a Microsoft Cloud App Security reported for users whose account
  were terminated in Azure AD, but still perform activities in other platforms
  such as AWS or Salesforce. This is especially relevant for users who use
  another account to manage resources, since these accounts are often not
  terminated when a user leaves the company.
data_source:
  - Office 365 Management Activity API
  - "Workload: ThreatIntelligence"
workload: ThreatIntelligence
how_to_implement: >
  Requires the Wazuh office365 module configured with an Azure AD application
  subscribed to the Office 365 Management Activity API for the relevant
  workload, ingested into the wazuh-* indices. The detection looks for events
  where data_office365_eventSource equals 'SecurityComplianceCenter';
  data_office365_eventName equals 'Activity performed by terminated user';
  data_office365_status equals 'success'.
known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.
references:
  - https://learn.microsoft.com/en-us/defender-cloud-apps/anomaly-detection-policy
  - https://learn.microsoft.com/en-us/defender-cloud-apps/policy-template-reference
response:
  message: >
    Activity Performed by Terminated User detected for user
    $data_office365_UserId$. Matched data_office365_eventSource:
    $data_office365_eventSource$. Matched data_office365_eventName:
    $data_office365_eventName$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: data_office365_UserId
      type: user
      score: 50
  threat_objects:
    - field: data_office365_eventSource
      type: other
    - field: data_office365_eventName
      type: other
tags:
  asset_type: Cloud Identity
  custom_tags:
    - performed
    - terminated
    - o365
    - threat_management
    - impact
  product:
    - Office 365
  security_domain: cloud
graylog:
  query: data_office365_eventSource:/[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy][Cc][Oo][Mm][Pp][Ll][Ii][Aa][Nn][Cc][Ee][Cc][Ee][Nn][Tt][Ee][Rr]/ AND data_office365_eventName:/[Aa][Cc][Tt][Ii][Vv][Ii][Tt][Yy] [Pp][Ee][Rr][Ff][Oo][Rr][Mm][Ee][Dd] [Bb][Yy] [Tt][Ee][Rr][Mm][Ii][Nn][Aa][Tt][Ee][Dd] [Uu][Ss][Ee][Rr]/ AND data_office365_status:/[Ss][Uu][Cc][Cc][Ee][Ss][Ss]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 2b669496-d215-47d8-bd9a-f4a45bf07cda
    name: Data Exfiltration to Unsanctioned Apps
    reason: A still-active terminated identity moving corporate data into unsanctioned apps is the textbook departing-insider / orphaned-account exfiltration this alert should escalate into — same MCAS SecurityComplianceCenter surface, same UserId/ClientIP pivot.
  - id: M365_Mass_External_Sharing
    name: M365 Mass External Sharing
    reason: Departing/terminated users commonly bulk-share SharePoint/OneDrive files to anonymous links or personal/guest accounts to take data on the way out; a burst of external shares by the flagged identity confirms the orphaned account is actively exfiltrating.
  - id: M365_Mass_File_Download
    name: M365 Mass File Download
    reason: High-volume file download by the still-active account is the staging step that precedes or accompanies external sharing — the terminated identity pulling data in bulk before anyone notices and disables it.
  - id: 6897cd82-6664-11ed-9022-0242ac120002
    name: PST Export Alert Using New-ComplianceSearchAction
    reason: This rule warns about un-terminated accounts 'used to manage resources'; such a retained admin abusing New-ComplianceSearchAction -Export to bulk-dump mailbox content to PST is exactly the privileged-orphaned-account abuse the detection is describing.
  - id: ee111937-1fe7-40f0-962a-0eb44d57d174
    name: Suspicious OAuth App File Download Activities
    reason: OAuth app grants survive account disablement, so a terminated user keeping access through a consented app that then bulk-downloads SharePoint/OneDrive files is a direct persistence-plus-exfil follow-on for an identity that is supposed to be gone.
  - id: 60de9b57-dc4d-48b9-a6a0-b39e0469f876
    name: Disabling Multi Factor Authentication
    reason: Turning MFA off on the orphaned/terminated account is how access is kept frictionless after the ex-employee loses the corporate phone, or how an attacker hardens reuse of the dormant credential — a persistence move on the very identity flagged here.
  - id: M365_Email_Forwarding_Created
    name: M365 Email Forwarding Created
    reason: Mailbox forwarding to an external address lets a terminated user keep receiving corporate mail after losing the primary mailbox — the mail-side equivalent of the orphaned-account persistence this detection surfaces.
  - id: d7eab125-5f94-43df-8710-795b80fa1189
    name: Microsoft 365 - Impossible Travel Activity
    reason: Impossible travel on the same UserId disambiguates the core triage question this alert raises — whether the 'terminated user' activity is the ex-employee logging in remotely or an external actor who harvested the un-deprovisioned credential.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Interactive sign-ins by this (terminated) user
    query: (data_office365_Operation:/.*[Uu][Ss][Ee][Rr][Ll][Oo][Gg][Gg][Ee][Dd][Ii][Nn].*/ OR data_office365_Operation:/.*[Uu][Ss][Ee][Rr][Ll][Oo][Gg][Ii][Nn][Ff][Aa][Ii][Ll][Ee][Dd].*/)
    pivot_on:
    - user
    window: 6h
  - name: Bulk file download / external sharing by this user
    query: (data_office365_Operation:/.*[Ff][Ii][Ll][Ee][Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ee][Dd].*/ OR data_office365_Operation:/.*[Ff][Ii][Ll][Ee][Ss][Yy][Nn][Cc][Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ee][Dd][Ff][Uu][Ll][Ll].*/ OR data_office365_Operation:/.*[Ff][Ii][Ll][Ee][Aa][Cc][Cc][Ee][Ss][Ss][Ee][Dd].*/ OR data_office365_Operation:/.*[Ss][Hh][Aa][Rr][Ii][Nn][Gg][Ss][Ee][Tt].*/ OR data_office365_Operation:/.*[Aa][Nn][Oo][Nn][Yy][Mm][Oo][Uu][Ss][Ll][Ii][Nn][Kk][Cc][Rr][Ee][Aa][Tt][Ee][Dd].*/ OR data_office365_Operation:/.*[Aa][Dd][Dd][Ee][Dd][Tt][Oo][Ss][Ee][Cc][Uu][Rr][Ee][Ll][Ii][Nn][Kk].*/ OR data_office365_Operation:/.*[Ss][Hh][Aa][Rr][Ii][Nn][Gg][Ii][Nn][Vv][Ii][Tt][Aa][Tt][Ii][Oo][Nn][Cc][Rr][Ee][Aa][Tt][Ee][Dd].*/)
    pivot_on:
    - user
    window: 24h
  - name: Mailbox collection / PST export by this user
    query: (data_office365_Operation:/.*[Mm][Aa][Ii][Ll][Ii][Tt][Ee][Mm][Ss][Aa][Cc][Cc][Ee][Ss][Ss][Ee][Dd].*/ OR data_office365_Operation:/.*[Nn][Ee][Ww]-[Cc][Oo][Mm][Pp][Ll][Ii][Aa][Nn][Cc][Ee][Ss][Ee][Aa][Rr][Cc][Hh][Aa][Cc][Tt][Ii][Oo][Nn].*/ OR data_office365_Operation:/.*[Nn][Ee][Ww]-[Ii][Nn][Bb][Oo][Xx][Rr][Uu][Ll][Ee].*/ OR data_office365_Operation:/.*[Ss][Ee][Tt]-[Mm][Aa][Ii][Ll][Bb][Oo][Xx].*/ OR data_office365_Operation:/.*[Aa][Dd][Dd]-[Mm][Aa][Ii][Ll][Bb][Oo][Xx][Pp][Ee][Rr][Mm][Ii][Ss][Ss][Ii][Oo][Nn].*/)
    pivot_on:
    - user
    window: 24h
  - name: Access-retention / privilege changes by this user
    query: (data_office365_Operation:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee] [Ss][Tt][Rr][Oo][Nn][Gg] [Aa][Uu][Tt][Hh][Ee][Nn][Tt][Ii][Cc][Aa][Tt][Ii][Oo][Nn].*/ OR data_office365_Operation:/.*[Rr][Ee][Ss][Ee][Tt] [Uu][Ss][Ee][Rr] [Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd].*/ OR data_office365_Operation:/.*[Aa][Dd][Dd] [Mm][Ee][Mm][Bb][Ee][Rr] [Tt][Oo] [Rr][Oo][Ll][Ee].*/ OR data_office365_Operation:/.*[Cc][Oo][Nn][Ss][Ee][Nn][Tt] [Tt][Oo] [Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn].*/ OR data_office365_Operation:/.*[Aa][Dd][Dd] [Oo][Aa][Uu][Tt][Hh]2[Pp][Ee][Rr][Mm][Ii][Ss][Ss][Ii][Oo][Nn][Gg][Rr][Aa][Nn][Tt].*/ OR data_office365_Operation:/.*[Ss][Ee][Tt] [Ff][Ee][Dd][Ee][Rr][Aa][Tt][Ii][Oo][Nn] [Ss][Ee][Tt][Tt][Ii][Nn][Gg][Ss].*/)
    pivot_on:
    - user
    window: 24h
  - name: Other accounts operating from this client address
    query: _exists_:data_office365_UserId
    pivot_on:
    - ip
    window: 6h
