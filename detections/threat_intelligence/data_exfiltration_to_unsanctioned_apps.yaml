name: Data Exfiltration to Unsanctioned Apps
id: 2b669496-d215-47d8-bd9a-f4a45bf07cda
version: 1
schema_version: "1.0"
date: "2022-10-09"
author: Austin Songer @austinsonger
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 2b669496-d215-47d8-bd9a-f4a45bf07cda
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: match
description: >
  Detects when a Microsoft Cloud App Security reported when a user or IP address
  uses an app that is not sanctioned to perform an activity that resembles an
  attempt to exfiltrate information from your organization. MITRE ATT&CK: T1537.
data_source:
  - Office 365 Management Activity API
  - "Workload: ThreatIntelligence"
workload: ThreatIntelligence
how_to_implement: >
  Requires the Wazuh office365 module configured with an Azure AD application
  subscribed to the Office 365 Management Activity API for the relevant
  workload, ingested into the wazuh-* indices. The detection looks for events
  where data_office365_eventSource equals 'SecurityComplianceCenter';
  data_office365_eventName equals 'Data exfiltration to unsanctioned apps';
  data_office365_status equals 'success'.
known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.
references:
  - https://learn.microsoft.com/en-us/defender-cloud-apps/anomaly-detection-policy
  - https://learn.microsoft.com/en-us/defender-cloud-apps/policy-template-reference
  - https://attack.mitre.org/techniques/T1537/
response:
  message: >
    Data Exfiltration to Unsanctioned Apps detected for user
    $data_office365_UserId$. Matched data_office365_eventSource:
    $data_office365_eventSource$. Matched data_office365_eventName:
    $data_office365_eventName$. MITRE ATT&CK: T1537
  risk_score: 50
  severity: medium
  risk_objects:
    - field: data_office365_UserId
      type: user
      score: 50
  threat_objects:
    - field: data_office365_eventSource
      type: other
    - field: data_office365_eventName
      type: other
tags:
  asset_type: Cloud Identity
  mitre_attack_id:
    - T1537
  custom_tags:
    - exfiltration
    - unsanctioned
    - o365
    - threat_management
  product:
    - Office 365
  security_domain: cloud
graylog:
  query: data_office365_eventSource:/[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy][Cc][Oo][Mm][Pp][Ll][Ii][Aa][Nn][Cc][Ee][Cc][Ee][Nn][Tt][Ee][Rr]/ AND data_office365_eventName:/[Dd][Aa][Tt][Aa] [Ee][Xx][Ff][Ii][Ll][Tt][Rr][Aa][Tt][Ii][Oo][Nn] [Tt][Oo] [Uu][Nn][Ss][Aa][Nn][Cc][Tt][Ii][Oo][Nn][Ee][Dd] [Aa][Pp][Pp][Ss]/ AND data_office365_status:/[Ss][Uu][Cc][Cc][Ee][Ss][Ss]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: M365_Mass_File_Download
    name: M365 Mass File Download
    reason: 'Collection/staging precursor: before data can be pushed to an unsanctioned app it is first pulled down from SharePoint/OneDrive. A burst of FileDownloaded by the same UserId is the staging step this exfiltration alert summarizes.'
  - id: M365_Mass_External_Sharing
    name: M365 Mass External Sharing
    reason: 'Parallel exfil channel, same actor: sharing corporate files to anonymous/guest/#ext# recipients is a second route the data leaves by. Both firing on one user is strong corroboration of deliberate data egress, not a single anomaly.'
  - id: ee111937-1fe7-40f0-962a-0eb44d57d174
    name: Suspicious OAuth App File Download Activities
    reason: 'Near-identical behaviour from the app-consent lens: the ''unsanctioned app'' is frequently a consented OAuth app pulling files out of the tenant. This MCAS alert and that one firing together for one user pins the exfil to a specific third-party app.'
  - id: M365_Email_Forwarding_Created
    name: M365 Email Forwarding Created
    reason: 'Companion mail-exfil channel: an exfiltrating or compromised account commonly also plants an auto-forward to an external SMTP address, siphoning mail alongside the file exfiltration surfaced here.'
  - id: 6897cd82-6664-11ed-9022-0242ac120002
    name: PST Export Alert Using New-ComplianceSearchAction
    reason: 'Broader exfil campaign by the same user: a bulk mailbox export to PST via New-ComplianceSearchAction is a second large-scale data-theft vector. Seeing file exfil and mailbox export from one identity marks a concerted egress effort.'
  - id: d7eab125-5f94-43df-8710-795b80fa1189
    name: Microsoft 365 - Impossible Travel Activity
    reason: 'Account-takeover precursor: an impossible-travel sign-in on the same UserId points to a hijacked session driving the exfil, answering the key triage question of compromise versus insider.'
  - id: 2e669ed8-742e-4fe5-b3c4-5a59b486c2ee
    name: Activity Performed by Terminated User
    reason: 'Textbook insider-exfil cause: a terminated/departing user moving corporate data to a personal, unsanctioned app is precisely what produces this alert. Same UserId firing both confirms malicious insider egress rather than account compromise.'
  - id: d8b0a4fe-07a8-41be-bd39-b14afa025d95
    name: Activity from Anonymous IP Addresses
    reason: 'Concealment precursor: the exfil actor (insider covering tracks or external attacker) operating from Tor/VPN on the same user indicates intentional, hidden data theft rather than routine SaaS use.'
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Bulk SharePoint/OneDrive downloads by this user (exfil staging)
    query: data_office365_Operation:("FileDownloaded" OR "FileSyncDownloadedFull")
    pivot_on:
    - user
    window: 6h
  - name: External / anonymous file sharing by this user
    query: data_office365_Operation:("SharingSet" OR "AddedToSecureLink" OR "AnonymousLinkCreated" OR "SharingInvitationCreated") AND (data_office365_TargetUserOrGroupType:"Guest" OR data_office365_TargetUserOrGroupName:/.*#ext#.*/ OR data_office365_TargetUserOrGroupName:/.*[Aa]nonymous.*/)
    pivot_on:
    - user
    window: 6h
  - name: Mail-exfil setup by this user (forwarding, inbox & transport rules, delegation)
    query: data_office365_Operation:("New-InboxRule" OR "Set-InboxRule" OR "New-TransportRule" OR "Set-TransportRule" OR "Add-MailboxPermission" OR "Add-RecipientPermission") OR (data_office365_Operation:"Set-Mailbox" AND (data_office365_Parameters:/.*[Ff]orwarding[Ss]mtp[Aa]ddress.*/ OR data_office365_Parameters:/.*[Ff]orwarding[Aa]ddress.*/))
    pivot_on:
    - user
    window: 6h
  - name: OAuth app consent & permission grants by this user (how the unsanctioned app got access)
    query: data_office365_Operation:(/.*[Cc][Oo][Nn][Ss][Ee][Nn][Tt].*[Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn].*/ OR /.*[Oo][Aa][Uu][Tt][Hh]2[Pp][Ee][Rr][Mm][Ii][Ss][Ss][Ii][Oo][Nn][Gg][Rr][Aa][Nn][Tt].*/ OR /.*[Dd][Ee][Ll][Ee][Gg][Aa][Tt][Ee][Dd] [Pp][Ee][Rr][Mm][Ii][Ss][Ss][Ii][Oo][Nn] [Gg][Rr][Aa][Nn][Tt].*/ OR /.*[Aa][Pp][Pp] [Rr][Oo][Ll][Ee] [Aa][Ss][Ss][Ii][Gg][Nn][Mm][Ee][Nn][Tt].*/)
    pivot_on:
    - user
    window: 24h
  - name: Sign-in origin for this user (compromise vs insider triage)
    query: data_office365_Operation:("UserLoggedIn" OR "UserLoginFailed")
    pivot_on:
    - user
    window: 6h
