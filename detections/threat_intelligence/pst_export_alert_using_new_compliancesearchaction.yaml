name: PST Export Alert Using New-ComplianceSearchAction
id: 6897cd82-6664-11ed-9022-0242ac120002
version: 1
schema_version: "1.0"
date: "2022-11-17"
author: Nikita Khalimonenkov
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 6897cd82-6664-11ed-9022-0242ac120002
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: match
description: >
  Alert when a user has performed an export to a search using
  'New-ComplianceSearchAction' with the '-Export' flag. This detection will
  detect PST export even if the 'eDiscovery search or exported' alert is
  disabled in the O365.This rule will apply to ExchangePowerShell usage and from
  the cloud. MITRE ATT&CK: T1114.
data_source:
  - Office 365 Management Activity API
  - "Workload: ThreatIntelligence"
workload: ThreatIntelligence
how_to_implement: >
  Requires the Wazuh office365 module configured with an Azure AD application
  subscribed to the Office 365 Management Activity API for the relevant
  workload, ingested into the wazuh-* indices. The detection looks for events
  where data_office365_eventSource equals 'SecurityComplianceCenter';
  data_office365_Payload matches '*New-ComplianceSearchAction*';
  data_office365_Payload matches '*Export*', among other conditions.
known_false_positives: >
  Exporting a PST can be done for legitimate purposes by legitimate sources, but
  due to the sensitive nature of PST content, it must be monitored. Baseline
  expected activity in your environment and tune this detection before relying
  on it for automated response.
references:
  - https://learn.microsoft.com/en-us/powershell/module/exchange/new-compliancesearchaction?view=exchange-ps
  - https://attack.mitre.org/techniques/T1114/
response:
  message: >
    PST Export Alert Using New-ComplianceSearchAction detected for user
    $data_office365_UserId$. Matched data_office365_eventSource:
    $data_office365_eventSource$. Matched data_office365_Payload:
    $data_office365_Payload$. MITRE ATT&CK: T1114
  risk_score: 50
  severity: medium
  risk_objects:
    - field: data_office365_UserId
      type: user
      score: 50
  threat_objects:
    - field: data_office365_eventSource
      type: other
    - field: data_office365_Payload
      type: powershell_script
tags:
  asset_type: Cloud Identity
  mitre_attack_id:
    - T1114
  custom_tags:
    - export
    - alert
    - compliancesearchaction
    - o365
    - threat_management
    - collection
  product:
    - Office 365
  security_domain: cloud
graylog:
  query: data_office365_eventSource:/[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy][Cc][Oo][Mm][Pp][Ll][Ii][Aa][Nn][Cc][Ee][Cc][Ee][Nn][Tt][Ee][Rr]/ AND data_office365_Payload:/.*[Nn][Ee][Ww]-[Cc][Oo][Mm][Pp][Ll][Ii][Aa][Nn][Cc][Ee][Ss][Ee][Aa][Rr][Cc][Hh][Aa][Cc][Tt][Ii][Oo][Nn].*/ AND data_office365_Payload:/.*[Ee][Xx][Pp][Oo][Rr][Tt].*/ AND data_office365_Payload:/.*[Pp][Ss][Tt].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 18b88d08-d73e-4f21-bc25-4b9892a4fdd0
    name: PST Export Alert Using eDiscovery Alert
    reason: Same PST export seen through the O365 eDiscovery 'search started or exported' alert signal; both firing for one user in the window confirms a real mailbox export rather than a single-signal parsing fluke.
  - id: ee111937-1fe7-40f0-962a-0eb44d57d174
    name: Suspicious OAuth App File Download Activities
    reason: 'Follow-on: the staged eDiscovery PST is downloaded from Azure blob storage via the export tool; an abnormal bulk download by the same user is the collected mail actually leaving the tenant.'
  - id: 2b669496-d215-47d8-bd9a-f4a45bf07cda
    name: Data Exfiltration to Unsanctioned Apps
    reason: 'Follow-on exfiltration: after staging the mailbox PST the actor moves the collected data out through an unsanctioned app/client flagged by Defender for Cloud Apps.'
  - id: M365_Email_Forwarding_Created
    name: M365 Email Forwarding Created
    reason: 'Parallel email-collection persistence: an actor running a mass mailbox export commonly also sets Set-Mailbox forwarding to keep siphoning future mail from the same compromised account.'
  - id: M365_Inbox_Rule_Created
    name: M365 Inbox Rule Created
    reason: 'Parallel collection/evasion persistence: a New-InboxRule auto-forwarding or hiding mail on the same account is the per-mailbox companion to the bulk eDiscovery pull.'
  - id: M365_Mass_Email_Deletion_Evidence_Wipe
    name: M365 Mass Email Deletion - Evidence Wipe
    reason: 'Anti-forensic follow-on: bulk SoftDelete/HardDelete by the same user to wipe the phishing or fraud mail that enabled the intrusion behind the export.'
  - id: d7eab125-5f94-43df-8710-795b80fa1189
    name: Microsoft 365 - Impossible Travel Activity
    reason: 'Precursor account-takeover signal: a geovelocity-impossible sign-in on the very account that then ran the privileged PST export points to a hijacked compliance/eDiscovery session.'
  - id: c191e2fa-f9d6-4ccf-82af-4f2aba08359f
    name: Logon from a Risky IP Address
    reason: 'Precursor account-takeover signal: the account that exported the PST signed in from a reputation-flagged IP, indicating the eDiscovery privilege is being driven from attacker infrastructure.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Compliance-search / eDiscovery export workflow by this user
    query: (data_office365_Payload:/.*[Cc][Oo][Mm][Pp][Ll][Ii][Aa][Nn][Cc][Ee][Ss][Ee][Aa][Rr][Cc][Hh].*/ OR data_office365_Payload:/.*[Ss][Ee][Aa][Rr][Cc][Hh]-[Mm][Aa][Ii][Ll][Bb][Oo][Xx].*/ OR data_office365_Operation:/.*[Ss][Ee][Aa][Rr][Cc][Hh]-[Mm][Aa][Ii][Ll][Bb][Oo][Xx].*/)
    pivot_on:
    - user
    window: 24h
  - name: eDiscovery / privileged role grants by this user
    query: (data_office365_Operation:/.*[Aa][Dd][Dd] [Mm][Ee][Mm][Bb][Ee][Rr] [Tt][Oo] [Rr][Oo][Ll][Ee].*/ OR data_office365_Operation:/.*[Aa][Dd][Dd]-[Rr][Oo][Ll][Ee][Gg][Rr][Oo][Uu][Pp][Mm][Ee][Mm][Bb][Ee][Rr].*/ OR data_office365_Operation:/.*[Nn][Ee][Ww]-[Rr][Oo][Ll][Ee][Gg][Rr][Oo][Uu][Pp].*/ OR data_office365_Operation:/.*[Nn][Ee][Ww]-[Mm][Aa][Nn][Aa][Gg][Ee][Mm][Ee][Nn][Tt][Rr][Oo][Ll][Ee][Aa][Ss][Ss][Ii][Gg][Nn][Mm][Ee][Nn][Tt].*/ OR data_office365_Operation:/.*[Aa][Dd][Dd]-[Ee][Dd][Ii][Ss][Cc][Oo][Vv][Ee][Rr][Yy][Cc][Aa][Ss][Ee][Aa][Dd][Mm][Ii][Nn].*/)
    pivot_on:
    - user
    window: 24h
  - name: Bulk file download / external sharing by this user
    query: (data_office365_Operation:/.*[Ff][Ii][Ll][Ee][Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ee][Dd].*/ OR data_office365_Operation:/.*[Ff][Ii][Ll][Ee][Ss][Yy][Nn][Cc][Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ee][Dd][Ff][Uu][Ll][Ll].*/ OR data_office365_Operation:/.*[Aa][Nn][Oo][Nn][Yy][Mm][Oo][Uu][Ss][Ll][Ii][Nn][Kk][Cc][Rr][Ee][Aa][Tt][Ee][Dd].*/ OR data_office365_Operation:/.*[Ss][Hh][Aa][Rr][Ii][Nn][Gg][Ii][Nn][Vv][Ii][Tt][Aa][Tt][Ii][Oo][Nn][Cc][Rr][Ee][Aa][Tt][Ee][Dd].*/ OR data_office365_Operation:/.*[Aa][Dd][Dd][Ee][Dd][Tt][Oo][Ss][Ee][Cc][Uu][Rr][Ee][Ll][Ii][Nn][Kk].*/)
    pivot_on:
    - user
    window: 24h
  - name: Mail-collection persistence and mass deletion by this user
    query: (data_office365_Operation:/.*[Nn][Ee][Ww]-[Ii][Nn][Bb][Oo][Xx][Rr][Uu][Ll][Ee].*/ OR data_office365_Operation:/.*[Ss][Ee][Tt]-[Ii][Nn][Bb][Oo][Xx][Rr][Uu][Ll][Ee].*/ OR data_office365_Operation:/.*[Ss][Ee][Tt]-[Mm][Aa][Ii][Ll][Bb][Oo][Xx].*/ OR data_office365_Operation:/.*[Aa][Dd][Dd]-[Mm][Aa][Ii][Ll][Bb][Oo][Xx][Pp][Ee][Rr][Mm][Ii][Ss][Ss][Ii][Oo][Nn].*/ OR data_office365_Operation:/.*[Hh][Aa][Rr][Dd][Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_office365_Operation:/.*[Ss][Oo][Ff][Tt][Dd][Ee][Ll][Ee][Tt][Ee].*/)
    pivot_on:
    - user
    window: 6h
  - name: Security & Compliance Center activity from this client address
    query: data_office365_eventSource:/.*[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy][Cc][Oo][Mm][Pp][Ll][Ii][Aa][Nn][Cc][Ee][Cc][Ee][Nn][Tt][Ee][Rr].*/
    pivot_on:
    - ip
    window: 6h
