name: Unix Shell Configuration Modification
id: a94cdd87-6c54-4678-a6cc-2814ffe5a13d
version: 1
schema_version: "1.0"
date: "2023-03-15"
author: Peter Matkovski, IAI
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: a94cdd87-6c54-4678-a6cc-2814ffe5a13d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detect unix shell configuration modification. Adversaries may establish
  persistence through executing malicious commands triggered when a new shell is
  opened. MITRE ATT&CK: T1546.004.

data_source:
  - Linux Auditd via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_audit_type:
              value: "PATH"
              case_insensitive: true
        - bool:
            should:
              - term:
                  data_audit_file_name:
                    value: "/etc/shells"
                    case_insensitive: true
              - term:
                  data_audit_file_name:
                    value: "/etc/profile"
                    case_insensitive: true
              - wildcard:
                  data_audit_file_name:
                    value: "/etc/profile.d/*"
                    case_insensitive: true
              - term:
                  data_audit_file_name:
                    value: "/etc/bash.bashrc"
                    case_insensitive: true
              - term:
                  data_audit_file_name:
                    value: "/etc/bashrc"
                    case_insensitive: true
              - term:
                  data_audit_file_name:
                    value: "/etc/zsh/zprofile"
                    case_insensitive: true
              - term:
                  data_audit_file_name:
                    value: "/etc/zsh/zshrc"
                    case_insensitive: true
              - term:
                  data_audit_file_name:
                    value: "/etc/zsh/zlogin"
                    case_insensitive: true
              - term:
                  data_audit_file_name:
                    value: "/etc/zsh/zlogout"
                    case_insensitive: true
              - term:
                  data_audit_file_name:
                    value: "/etc/csh.cshrc"
                    case_insensitive: true
              - term:
                  data_audit_file_name:
                    value: "/etc/csh.login"
                    case_insensitive: true
              - term:
                  data_audit_file_name:
                    value: "/root/.bashrc"
                    case_insensitive: true
              - term:
                  data_audit_file_name:
                    value: "/root/.bash_profile"
                    case_insensitive: true
              - term:
                  data_audit_file_name:
                    value: "/root/.profile"
                    case_insensitive: true
              - term:
                  data_audit_file_name:
                    value: "/root/.zshrc"
                    case_insensitive: true
              - term:
                  data_audit_file_name:
                    value: "/root/.zprofile"
                    case_insensitive: true
              - wildcard:
                  data_audit_file_name:
                    value: "/home/*/.bashrc"
                    case_insensitive: true
              - wildcard:
                  data_audit_file_name:
                    value: "/home/*/.zshrc"
                    case_insensitive: true
              - wildcard:
                  data_audit_file_name:
                    value: "/home/*/.bash_profile"
                    case_insensitive: true
              - wildcard:
                  data_audit_file_name:
                    value: "/home/*/.zprofile"
                    case_insensitive: true
              - wildcard:
                  data_audit_file_name:
                    value: "/home/*/.profile"
                    case_insensitive: true
              - wildcard:
                  data_audit_file_name:
                    value: "/home/*/.bash_login"
                    case_insensitive: true
              - wildcard:
                  data_audit_file_name:
                    value: "/home/*/.bash_logout"
                    case_insensitive: true
              - wildcard:
                  data_audit_file_name:
                    value: "/home/*/.zlogin"
                    case_insensitive: true
              - wildcard:
                  data_audit_file_name:
                    value: "/home/*/.zlogout"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_audit_type
    - data_audit_file_name
    - data_audit_exe
    - data_audit_command
    - data_audit_execve_a0
    - data_audit_key

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires auditd running on the endpoint with audit rules covering the relevant
  syscalls/paths, and the Wazuh agent reading /var/log/audit/audit.log (default
  localfile entry). The detection looks for events where data_audit_type equals
  'PATH'; data_audit_file_name equals '/etc/shells'; data_audit_file_name equals
  '/etc/profile', among other conditions.

known_false_positives: >
  Admin or User activity are expected to generate some false positives. Baseline
  expected activity in your environment and tune this detection before relying
  on it for automated response.

references:
  - https://objective-see.org/blog/blog_0x68.html
  - https://web.archive.org/web/20221204161143/https://www.glitch-cat.com/p/green-lambert-and-attack
  - https://www.anomali.com/blog/pulling-linux-rabbit-rabbot-malware-out-of-a-hat
  - https://attack.mitre.org/techniques/T1546/004/

response:
  message: >
    Unix Shell Configuration Modification detected on host $agent_name$. Matched
    data_audit_type: $data_audit_type$. Matched data_audit_file_name:
    $data_audit_file_name$. MITRE ATT&CK: T1546.004
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_audit_type
      type: other
    - field: data_audit_file_name
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1546.004
  custom_tags:
    - shell
    - configuration
    - linux
    - auditd
    - privilege_escalation
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_audit_type:/[Pp][Aa][Tt][Hh]/ AND (data_audit_file_name:/\/[Ee][Tt][Cc]\/[Ss][Hh][Ee][Ll][Ll][Ss]/ OR data_audit_file_name:/\/[Ee][Tt][Cc]\/[Pp][Rr][Oo][Ff][Ii][Ll][Ee]/ OR data_audit_file_name:/\/[Ee][Tt][Cc]\/[Pp][Rr][Oo][Ff][Ii][Ll][Ee]\.[Dd]\/.*/ OR data_audit_file_name:/\/[Ee][Tt][Cc]\/[Bb][Aa][Ss][Hh]\.[Bb][Aa][Ss][Hh][Rr][Cc]/ OR data_audit_file_name:/\/[Ee][Tt][Cc]\/[Bb][Aa][Ss][Hh][Rr][Cc]/ OR data_audit_file_name:/\/[Ee][Tt][Cc]\/[Zz][Ss][Hh]\/[Zz][Pp][Rr][Oo][Ff][Ii][Ll][Ee]/ OR data_audit_file_name:/\/[Ee][Tt][Cc]\/[Zz][Ss][Hh]\/[Zz][Ss][Hh][Rr][Cc]/ OR data_audit_file_name:/\/[Ee][Tt][Cc]\/[Zz][Ss][Hh]\/[Zz][Ll][Oo][Gg][Ii][Nn]/ OR data_audit_file_name:/\/[Ee][Tt][Cc]\/[Zz][Ss][Hh]\/[Zz][Ll][Oo][Gg][Oo][Uu][Tt]/ OR data_audit_file_name:/\/[Ee][Tt][Cc]\/[Cc][Ss][Hh]\.[Cc][Ss][Hh][Rr][Cc]/ OR data_audit_file_name:/\/[Ee][Tt][Cc]\/[Cc][Ss][Hh]\.[Ll][Oo][Gg][Ii][Nn]/ OR data_audit_file_name:/\/[Rr][Oo][Oo][Tt]\/\.[Bb][Aa][Ss][Hh][Rr][Cc]/ OR data_audit_file_name:/\/[Rr][Oo][Oo][Tt]\/\.[Bb][Aa][Ss][Hh]_[Pp][Rr][Oo][Ff][Ii][Ll][Ee]/ OR data_audit_file_name:/\/[Rr][Oo][Oo][Tt]\/\.[Pp][Rr][Oo][Ff][Ii][Ll][Ee]/ OR data_audit_file_name:/\/[Rr][Oo][Oo][Tt]\/\.[Zz][Ss][Hh][Rr][Cc]/ OR data_audit_file_name:/\/[Rr][Oo][Oo][Tt]\/\.[Zz][Pp][Rr][Oo][Ff][Ii][Ll][Ee]/ OR data_audit_file_name:/\/[Hh][Oo][Mm][Ee]\/.*\/\.[Bb][Aa][Ss][Hh][Rr][Cc]/ OR data_audit_file_name:/\/[Hh][Oo][Mm][Ee]\/.*\/\.[Zz][Ss][Hh][Rr][Cc]/ OR data_audit_file_name:/\/[Hh][Oo][Mm][Ee]\/.*\/\.[Bb][Aa][Ss][Hh]_[Pp][Rr][Oo][Ff][Ii][Ll][Ee]/ OR data_audit_file_name:/\/[Hh][Oo][Mm][Ee]\/.*\/\.[Zz][Pp][Rr][Oo][Ff][Ii][Ll][Ee]/ OR data_audit_file_name:/\/[Hh][Oo][Mm][Ee]\/.*\/\.[Pp][Rr][Oo][Ff][Ii][Ll][Ee]/ OR data_audit_file_name:/\/[Hh][Oo][Mm][Ee]\/.*\/\.[Bb][Aa][Ss][Hh]_[Ll][Oo][Gg][Ii][Nn]/ OR data_audit_file_name:/\/[Hh][Oo][Mm][Ee]\/.*\/\.[Bb][Aa][Ss][Hh]_[Ll][Oo][Gg][Oo][Uu][Tt]/ OR data_audit_file_name:/\/[Hh][Oo][Mm][Ee]\/.*\/\.[Zz][Ll][Oo][Gg][Ii][Nn]/ OR data_audit_file_name:/\/[Hh][Oo][Mm][Ee]\/.*\/\.[Zz][Ll][Oo][Gg][Oo][Uu][Tt]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: linux-file-creation-profile-directory-001
    name: Linux File Creation In Profile Directory
    reason: Watches the very /etc/profile.d directory this rule also covers, but via file-creation/auth.log telemetry; a hit confirms a malicious login-time script was actually written there, corroborating the auditd PATH event.
  - id: linux-auditd-crontab-directory-files-modification-001
    name: Linux Auditd Crontab Directory Files Modification
    reason: Cron is the most common Linux persistence sibling; a write to /etc/cron* or /var/spool/cron beside a shell-config write signals deliberate multi-foothold persistence rather than a benign admin edit.
  - id: linux-service-file-created-in-systemd-directory-001
    name: Linux Service File Created In Systemd Directory
    reason: systemd unit persistence is the modern autostart equivalent of a shell-profile hook; the same intrusion frequently plants both a .service unit and a trojaned rc file for redundancy.
  - id: b3c8e2d1-4f1a-4b7c-9a22-91a6f2c4e8de
    name: Linux Init Script Persistence Detection
    reason: rc.local / init.d startup-script abuse is a parallel boot-time autostart technique; an attacker trojaning a shell profile commonly drops a second init-script hook on the same host.
  - id: linux-preload-hijack-via-preload-file-001
    name: Linux Preload Hijack Via Preload File
    reason: ld.so.preload library-injection is a higher-severity persistence+privesc foothold from the same Linux-persistence playbook; worth confirming on the host once one autostart hook is seen.
  - id: 49aae26c-450e-448b-911d-b3c13d178dfc
    name: Linux Keylogging with Pam.d
    reason: 'Same auditd PATH telemetry: trojaning a trusted login-time file (pam.d) to capture TTY input is the credential-harvest analog of a malicious .bashrc, a strong co-occurring motive and technique.'
  - id: a1b2c3d4-5e6f-7a8b-9c0d-e1f2a3b4c5d6
    name: Linux Sudoers File Access
    reason: Writing /etc or /root shell configs usually requires root; sudoers/NOPASSWD tampering is the matching privilege escalation and a classic persistence pairing to check for in the same window.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other autostart / persistence-config writes on this host (cron, systemd unit, ld.so.preload, rc.local, init.d, authorized_keys, pam.d)
    query: (data_audit_file_name:/.*\/[Cc][Rr][Oo][Nn].*/ OR data_audit_file_name:/.*[Ss][Yy][Ss][Tt][Ee][Mm][Dd]\/.*\.[Ss][Ee][Rr][Vv][Ii][Cc][Ee]/ OR data_audit_file_name:/.*[Ll][Dd]\.[Ss][Oo]\.[Pp][Rr][Ee][Ll][Oo][Aa][Dd].*/ OR data_audit_file_name:/.*[Rr][Cc]\.[Ll][Oo][Cc][Aa][Ll].*/ OR data_audit_file_name:/.*\/[Ii][Nn][Ii][Tt]\.[Dd]\/.*/ OR data_audit_file_name:/.*[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Ee][Dd]_[Kk][Ee][Yy][Ss].*/ OR data_audit_file_name:/.*\/[Pp][Aa][Mm]\.[Dd]\/.*/)
    pivot_on:
    - host
    window: 4h
  - name: 'Payload staging: downloader / ingress-transfer tool executed on this host (wget, curl, tftp, nc, socat, fetch)'
    query: ((data_audit_exe:/.*\/([Ww][Gg][Ee][Tt]|[Cc][Uu][Rr][Ll]|[Tt][Ff][Tt][Pp]|[Ff][Tt][Pp]|[Nn][Cc]|[Nn][Cc][Aa][Tt]|[Ss][Oo][Cc][Aa][Tt]|[Ff][Ee][Tt][Cc][Hh])/) OR (data_process_exec_process_binary:/.*\/([Ww][Gg][Ee][Tt]|[Cc][Uu][Rr][Ll]|[Tt][Ff][Tt][Pp]|[Ff][Tt][Pp]|[Nn][Cc]|[Nn][Cc][Aa][Tt]|[Ss][Oo][Cc][Aa][Tt]|[Ff][Ee][Tt][Cc][Hh])/))
    pivot_on:
    - host
    window: 4h
  - name: Credential / secret-file access on this host (/etc/shadow, /etc/sudoers, SSH private keys)
    query: ((data_audit_file_name:/.*\/[Ee][Tt][Cc]\/[Ss][Hh][Aa][Dd][Oo][Ww]/) OR (data_audit_file_name:/.*\/[Ee][Tt][Cc]\/[Gg][Ss][Hh][Aa][Dd][Oo][Ww]/) OR (data_audit_file_name:/.*[Ss][Uu][Dd][Oo][Ee][Rr][Ss].*/) OR (data_audit_file_name:/.*\/\.[Ss][Ss][Hh]\/.*/) OR (data_audit_file_name:/.*[Ii][Dd]_[Rr][Ss][Aa].*/) OR (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Hh][Aa][Dd][Oo][Ww].*/) OR (data_process_exec_process_arguments:/.*\/\.[Ss][Ss][Hh]\/.*/) OR (data_process_exec_process_arguments:/.*[Ii][Dd]_[Rr][Ss][Aa].*/))
    pivot_on:
    - host
    window: 2h
  - name: 'Privilege escalation: sudo / su / pkexec / doas executed on this host'
    query: ((data_audit_exe:/.*\/([Ss][Uu][Dd][Oo]|[Ss][Uu]|[Pp][Kk][Ee][Xx][Ee][Cc]|[Dd][Oo][Aa][Ss]|[Nn][Ee][Ww][Gg][Rr][Pp])/) OR (data_process_exec_process_binary:/.*\/([Ss][Uu][Dd][Oo]|[Ss][Uu]|[Pp][Kk][Ee][Xx][Ee][Cc]|[Dd][Oo][Aa][Ss]|[Nn][Ee][Ww][Gg][Rr][Pp])/))
    pivot_on:
    - host
    window: 2h
  - name: Reverse-shell / interpreter callback signatures on this host (/dev/tcp, pty.spawn, socket.socket)
    query: ((data_process_exec_process_arguments:/.*\/[Dd][Ee][Vv]\/[Tt][Cc][Pp]\/.*/) OR (data_process_exec_process_arguments:/.*[Pp][Tt][Yy]\.[Ss][Pp][Aa][Ww][Nn].*/) OR (data_process_exec_process_arguments:/.*[Ss][Oo][Cc][Kk][Ee][Tt]\.[Ss][Oo][Cc][Kk][Ee][Tt].*/) OR (data_audit_command:/.*\/[Dd][Ee][Vv]\/[Tt][Cc][Pp]\/.*/) OR (data_audit_execve_a0:/.*\/[Dd][Ee][Vv]\/[Tt][Cc][Pp]\/.*/))
    pivot_on:
    - host
    window: 1h
