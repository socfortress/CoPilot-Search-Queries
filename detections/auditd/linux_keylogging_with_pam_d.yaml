name: Linux Keylogging with Pam.d
id: 49aae26c-450e-448b-911d-b3c13d178dfc
version: 1
schema_version: "1.0"
date: "2022-12-18"
author: Pawel Mazur
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 49aae26c-450e-448b-911d-b3c13d178dfc
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detect attempt to enable auditing of TTY input. MITRE ATT&CK: T1003,
  T1056.001.

data_source:
  - Linux Auditd via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - bool:
                  must:
                    - term:
                        data_audit_type:
                          value: "PATH"
                          case_insensitive: true
                    - bool:
                        should:
                          - term:
                              data_audit_file_name:
                                value: "/etc/pam.d/system-auth"
                                case_insensitive: true
                          - term:
                              data_audit_file_name:
                                value: "/etc/pam.d/password-auth"
                                case_insensitive: true
                        minimum_should_match: 1
              - term:
                  data_audit_type:
                    value: "TTY"
                    case_insensitive: true
              - term:
                  data_audit_type:
                    value: "USER_TTY"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_audit_type
    - data_audit_file_name
    - data_audit_exe
    - data_audit_command
    - data_audit_execve_a0
    - data_audit_key

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires auditd running on the endpoint with audit rules covering the relevant
  syscalls/paths, and the Wazuh agent reading /var/log/audit/audit.log (default
  localfile entry). The detection looks for events where data_audit_type equals
  'PATH'; data_audit_file_name equals '/etc/pam.d/system-auth';
  data_audit_file_name equals '/etc/pam.d/password-auth', among other
  conditions.

known_false_positives: >
  Administrative work. Baseline expected activity in your environment and tune
  this detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1056.001/T1056.001.md
  - https://linux.die.net/man/8/pam_tty_audit
  - https://access.redhat.com/documentation/en-us/red_hat_enterprise_linux/6/html/security_guide/sec-configuring_pam_for_auditing
  - https://access.redhat.com/articles/4409591#audit-record-types-2
  - https://attack.mitre.org/techniques/T1003/
  - https://attack.mitre.org/techniques/T1056/001/

response:
  message: >
    Linux Keylogging with Pam.d detected on host $agent_name$. Matched
    data_audit_type: $data_audit_type$. Matched data_audit_file_name:
    $data_audit_file_name$. MITRE ATT&CK: T1003, T1056.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_audit_type
      type: other
    - field: data_audit_file_name
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003
    - T1056.001
  custom_tags:
    - keylogging
    - linux
    - auditd
    - collection
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: ((data_audit_type:/[Pp][Aa][Tt][Hh]/ AND (data_audit_file_name:/\/[Ee][Tt][Cc]\/[Pp][Aa][Mm]\.[Dd]\/[Ss][Yy][Ss][Tt][Ee][Mm]-[Aa][Uu][Tt][Hh]/ OR data_audit_file_name:/\/[Ee][Tt][Cc]\/[Pp][Aa][Mm]\.[Dd]\/[Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd]-[Aa][Uu][Tt][Hh]/)) OR data_audit_type:/[Tt][Tt][Yy]/ OR data_audit_type:/[Uu][Ss][Ee][Rr]_[Tt][Tt][Yy]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: linux-sudo-or-su-execution-001
    name: Linux Sudo Or Su Execution
    reason: pam_tty_audit is planted specifically to record the keystrokes typed at sudo/su password prompts; a sudo or su execution on this host inside the window is the credential actually being captured by the keylogger, turning a config change into an active credential-harvesting incident.
  - id: 977ef627-4539-4875-adf4-ed8f780c4922
    name: Auditing Configuration Changes on Linux Host
    reason: Enabling pam_tty_audit is itself a manipulation of the Linux audit subsystem; operators wiring up TTY keystroke capture routinely also edit /etc/audit rules and watches, so audit-config changes on the same host (same auditd sensor) corroborate that the keylogger is being configured rather than benign admin activity.
  - id: linux-auditd-possible-access-sudoers-file-001
    name: Linux Auditd Possible Access To Sudoers File
    reason: Reading /etc/sudoers enumerates which accounts can elevate - the recon that tells the attacker whose keystrokes are worth capturing - and commonly precedes planting a sudo-password keylogger on the same host.
  - id: linux-auditd-possible-access-credential-files-001
    name: Linux Auditd Possible Access To Credential Files
    reason: Alongside capturing live keystrokes, the operator typically reads /etc/shadow and /etc/passwd to harvest stored password hashes; credential-file access on the same host within the window expands this into a full credential-theft incident.
  - id: linux-pkexec-privilege-escalation-001
    name: Linux pkexec Privilege Escalation
    reason: Editing /etc/pam.d requires root; pkexec/PwnKit (CVE-2021-4034) is the most common local privilege escalation used to obtain that root, so a pkexec escalation on this host shortly before is the likely precursor that let the keylogger be installed.
  - id: fa4aaed5-4fe0-498d-bbc0-08e3346387ba
    name: Copy Passwd Or Shadow From TMP Path
    reason: A follow-on credential-theft action in the same session - staging a copy of /etc/passwd or /etc/shadow into /tmp for offline cracking or exfiltration - confirming the operator is after stored secrets in addition to the live keystrokes the keylogger collects.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: PAM / audit-subsystem tampering on this host (the keylogger being planted)
    query: ((data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Pp][Aa][Mm]\.[Dd]\/.*/) OR (data_process_exec_process_arguments:/.*[Pp][Aa][Mm]_[Tt][Tt][Yy]_[Aa][Uu][Dd][Ii][Tt].*/) OR (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Aa][Uu][Dd][Ii][Tt]\/.*/) OR (data_process_exec_process_binary:/.*\/[Aa][Uu][Dd][Ii][Tt][Cc][Tt][Ll]/))
    pivot_on:
    - host
    window: 2h
  - name: Harvesting captured TTY keystrokes from the audit log on this host
    query: ((data_process_exec_process_binary:/.*\/[Aa][Uu][Rr][Ee][Pp][Oo][Rr][Tt]/) OR (data_process_exec_process_binary:/.*\/[Aa][Uu][Ss][Ee][Aa][Rr][Cc][Hh]/) OR (data_process_exec_process_arguments:/.*\/[Vv][Aa][Rr]\/[Ll][Oo][Gg]\/[Aa][Uu][Dd][Ii][Tt]\/.*/) OR (data_process_exec_process_arguments:/.*--[Tt][Tt][Yy].*/))
    pivot_on:
    - host
    window: 6h
  - name: Sudo / su / pkexec / doas execution on this host (keystroke-capture targets)
    query: data_process_exec_process_binary:/.*(\/[Ss][Uu][Dd][Oo]|\/[Ss][Uu]|\/[Pp][Kk][Ee][Xx][Ee][Cc]|\/[Dd][Oo][Aa][Ss])/
    pivot_on:
    - host
    window: 2h
  - name: Stored-credential and private-key access on this host
    query: ((data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Gg]?[Ss][Hh][Aa][Dd][Oo][Ww].*/) OR (data_process_exec_process_arguments:/.*\.[Ss][Ss][Hh]\/.*/) OR (data_process_exec_process_arguments:/.*[Ii][Dd]_([Rr][Ss][Aa]|[Ee][Cc][Dd][Ss][Aa]|[Ee][Dd]25519).*/) OR (data_process_exec_process_arguments:/.*\.[Gg][Nn][Uu][Pp][Gg].*/) OR (data_process_exec_process_arguments:/.*\.[Nn][Ee][Tt][Rr][Cc].*/))
    pivot_on:
    - host
    window: 2h
  - name: Account creation or PAM-module backdoor persistence on this host
    query: ((data_process_exec_process_binary:/.*\/([Uu][Ss][Ee][Rr][Aa][Dd][Dd]|[Uu][Ss][Ee][Rr][Mm][Oo][Dd]|[Aa][Dd][Dd][Uu][Ss][Ee][Rr]|[Gg][Rr][Oo][Uu][Pp][Aa][Dd][Dd]|[Pp][Aa][Ss][Ss][Ww][Dd])/) OR (data_process_exec_process_arguments:/.*\/[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]\/[Pp][Aa][Mm]_.*\.[Ss][Oo].*/))
    pivot_on:
    - host
    window: 4h
