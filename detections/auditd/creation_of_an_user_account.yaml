name: Creation Of An User Account
id: 759d0d51-bc99-4b5e-9add-8f5b2c8e7512
version: 1
schema_version: "1.0"
date: "2022-12-20"
author: Marie Euler, Pawel Mazur
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 759d0d51-bc99-4b5e-9add-8f5b2c8e7512
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the creation of a new user account. Such accounts may be used for
  persistence that do not require persistent remote access tools to be deployed
  on the system. MITRE ATT&CK: T1136.001.

data_source:
  - Linux Auditd via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - bool:
                  must:
                    - term:
                        data_audit_type:
                          value: "SYSCALL"
                          case_insensitive: true
                    - wildcard:
                        data_audit_exe:
                          value: "*/useradd"
                          case_insensitive: true
              - term:
                  data_audit_type:
                    value: "ADD_USER"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_audit_type
    - data_audit_exe
    - data_audit_command
    - data_audit_execve_a0
    - data_audit_key

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires auditd running on the endpoint with audit rules covering the relevant
  syscalls/paths, and the Wazuh agent reading /var/log/audit/audit.log (default
  localfile entry). The detection looks for events where data_audit_type equals
  'SYSCALL'; data_audit_exe matches '*/useradd'; data_audit_type equals
  'ADD_USER'.

known_false_positives: >
  Admin activity. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://access.redhat.com/documentation/en-us/red_hat_enterprise_linux/7/html/security_guide/sec-understanding_audit_log_files
  - https://access.redhat.com/articles/4409591#audit-record-types-2
  - https://www.youtube.com/watch?v=VmvY5SQm5-Y&ab_channel=M45C07
  - https://attack.mitre.org/techniques/T1136/001/

response:
  message: >
    Creation Of An User Account detected on host $agent_name$. Matched
    data_audit_type: $data_audit_type$. Matched data_audit_exe:
    $data_audit_exe$. MITRE ATT&CK: T1136.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_audit_type
      type: other
    - field: data_audit_exe
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1136.001
  custom_tags:
    - account
    - linux
    - auditd
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: ((data_audit_type:/[Ss][Yy][Ss][Cc][Aa][Ll][Ll]/ AND data_audit_exe:/.*\/[Uu][Ss][Ee][Rr][Aa][Dd][Dd]/) OR data_audit_type:/[Aa][Dd][Dd]_[Uu][Ss][Ee][Rr]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: linux-auditd-add-user-001
    name: Linux Auditd Add User
    reason: Fires on the same type=ADD_USER auditd record this rule keys on, but matched from the raw full_log rather than the parsed data_audit_* fields; co-occurrence on the same host and second confirms the creation is a real event, not a field-parsing artifact.
  - id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
    name: Linux User Account Creation Detection
    reason: Detects the same creation from syslog full_log for both useradd and the adduser wrapper; it corroborates this auditd detection across data sources and catches the adduser path, which this rule's useradd/ADD_USER-only query can miss.
  - id: 6a50f16c-3b7b-42d1-b081-0fdd3ba70a73
    name: User Added To Root/Sudoers Group Using Usermod
    reason: 'The canonical next step after creating an account: usermod -aG root/sudo promotes the fresh account to privileged. A creation followed within the session by this is the rogue-admin persistence pattern, not routine onboarding.'
  - id: a1b2c3d4-5e6f-7a8b-9c0d-e1f2a3b4c5d6
    name: Linux Sudoers File Access
    reason: 'The alternative privilege grant: adding the new user to /etc/sudoers, often with NOPASSWD, gives passwordless root without touching group membership. Seen right after the creation it converts the account into a hidden admin.'
  - id: d4e5f6a7-8b9c-4d1e-a2b3-5f6e7a8b9c1d
    name: Linux SSH Configuration Access
    reason: 'Remote-access provisioning for the new account: editing sshd_config or dropping an authorized_keys file under /etc/ssh gives the created account durable key-based login, the usual way an operator reaches a persistence account.'
  - id: linux-sudo-or-su-execution-001
    name: Linux Sudo Or Su Execution
    reason: useradd requires root; sudo or su execution shortly before the creation is the privilege context the attacker used to run it, linking the escalation to the persistence action in one session.
  - id: linux-pkexec-privilege-escalation-001
    name: Linux pkexec Privilege Escalation
    reason: PwnKit (CVE-2021-4034) pkexec abuse yields root, exactly the capability a rogue useradd needs; firing just before the creation it explains how an unprivileged foothold gained the rights to add a user.
  - id: f74107df-b6c6-4e80-bf00-4170b658162b
    name: Sudo Privilege Escalation CVE-2019-14287
    reason: A sudo runas-restriction bypass to root; if it fires shortly before the account creation it is the likely escalation path that gave the attacker the privileges to create the persistence account.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: New account granted privileges via usermod, gpasswd, visudo or a sudoers edit on this host
    query: ((data_process_exec_process_binary:/.*\/([Uu][Ss][Ee][Rr][Mm][Oo][Dd]|[Gg][Pp][Aa][Ss][Ss][Ww][Dd]|[Vv][Ii][Ss][Uu][Dd][Oo])/) OR (data_audit_exe:/.*\/([Uu][Ss][Ee][Rr][Mm][Oo][Dd]|[Gg][Pp][Aa][Ss][Ss][Ww][Dd]|[Vv][Ii][Ss][Uu][Dd][Oo])/) OR (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Uu][Dd][Oo][Ee][Rr][Ss].*/))
    pivot_on:
    - host
    window: 6h
  - name: Password set for an account via passwd, chpasswd or an /etc/shadow edit on this host
    query: ((data_process_exec_process_binary:/.*\/([Pp][Aa][Ss][Ss][Ww][Dd]|[Cc][Hh][Pp][Aa][Ss][Ss][Ww][Dd])/) OR (data_audit_exe:/.*\/([Pp][Aa][Ss][Ss][Ww][Dd]|[Cc][Hh][Pp][Aa][Ss][Ss][Ww][Dd])/) OR (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Hh][Aa][Dd][Oo][Ww].*/))
    pivot_on:
    - host
    window: 6h
  - name: SSH remote access provisioned for the account (authorized_keys, sshd_config, ssh-keygen) on this host
    query: ((data_process_exec_process_binary:/.*\/[Ss][Ss][Hh]-[Kk][Ee][Yy][Gg][Ee][Nn]/) OR (data_audit_exe:/.*\/[Ss][Ss][Hh]-[Kk][Ee][Yy][Gg][Ee][Nn]/) OR (data_process_exec_process_arguments:/.*[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Ee][Dd]_[Kk][Ee][Yy][Ss].*/) OR (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Ss][Hh]\/.*/) OR (data_process_exec_process_arguments:/.*[Ss][Ss][Hh][Dd]_[Cc][Oo][Nn][Ff][Ii][Gg].*/))
    pivot_on:
    - host
    window: 6h
  - name: Privilege escalation around the creation (sudo, su, pkexec, doas) on this host
    query: ((data_process_exec_process_binary:/.*\/([Ss][Uu][Dd][Oo]|[Ss][Uu]|[Pp][Kk][Ee][Xx][Ee][Cc]|[Dd][Oo][Aa][Ss])/) OR (data_audit_exe:/.*\/([Ss][Uu][Dd][Oo]|[Ss][Uu]|[Pp][Kk][Ee][Xx][Ee][Cc]|[Dd][Oo][Aa][Ss])/))
    pivot_on:
    - host
    window: 2h
  - name: Direct account-database tampering (groupadd, vipw, vigr, /etc/passwd, /etc/group) on this host
    query: ((data_process_exec_process_binary:/.*\/([Gg][Rr][Oo][Uu][Pp][Aa][Dd][Dd]|[Vv][Ii][Pp][Ww]|[Vv][Ii][Gg][Rr])/) OR (data_audit_exe:/.*\/([Gg][Rr][Oo][Uu][Pp][Aa][Dd][Dd]|[Vv][Ii][Pp][Ww]|[Vv][Ii][Gg][Rr])/) OR (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Pp][Aa][Ss][Ss][Ww][Dd].*/) OR (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Gg][Rr][Oo][Uu][Pp].*/))
    pivot_on:
    - host
    window: 6h
