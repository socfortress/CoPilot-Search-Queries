name: Program Executions in Suspicious Folders
id: a39d7fa7-3fbd-4dc2-97e1-d87f546b1bbc
version: 1
schema_version: "1.0"
date: "2021-11-27"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: a39d7fa7-3fbd-4dc2-97e1-d87f546b1bbc
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects program executions in suspicious non-program folders related to
  malware or hacking activity. MITRE ATT&CK: T1587, T1584.

data_source:
  - Linux Auditd via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_audit_type:
              value: "SYSCALL"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_audit_exe:
                    value: "/tmp/*"
                    case_insensitive: true
              - wildcard:
                  data_audit_exe:
                    value: "/var/www/*"
                    case_insensitive: true
              - wildcard:
                  data_audit_exe:
                    value: "/home/*/public_html/*"
                    case_insensitive: true
              - wildcard:
                  data_audit_exe:
                    value: "/usr/local/apache2/*"
                    case_insensitive: true
              - wildcard:
                  data_audit_exe:
                    value: "/usr/local/httpd/*"
                    case_insensitive: true
              - wildcard:
                  data_audit_exe:
                    value: "/var/apache/*"
                    case_insensitive: true
              - wildcard:
                  data_audit_exe:
                    value: "/srv/www/*"
                    case_insensitive: true
              - wildcard:
                  data_audit_exe:
                    value: "/home/httpd/html/*"
                    case_insensitive: true
              - wildcard:
                  data_audit_exe:
                    value: "/srv/http/*"
                    case_insensitive: true
              - wildcard:
                  data_audit_exe:
                    value: "/usr/share/nginx/html/*"
                    case_insensitive: true
              - wildcard:
                  data_audit_exe:
                    value: "/var/lib/pgsql/data/*"
                    case_insensitive: true
              - wildcard:
                  data_audit_exe:
                    value: "/usr/local/mysql/data/*"
                    case_insensitive: true
              - wildcard:
                  data_audit_exe:
                    value: "/var/lib/mysql/*"
                    case_insensitive: true
              - wildcard:
                  data_audit_exe:
                    value: "/var/vsftpd/*"
                    case_insensitive: true
              - wildcard:
                  data_audit_exe:
                    value: "/etc/bind/*"
                    case_insensitive: true
              - wildcard:
                  data_audit_exe:
                    value: "/var/named/*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_audit_type
    - data_audit_exe
    - data_audit_command
    - data_audit_execve_a0
    - data_audit_key

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires auditd running on the endpoint with audit rules covering the relevant
  syscalls/paths, and the Wazuh agent reading /var/log/audit/audit.log (default
  localfile entry). The detection looks for events where data_audit_type equals
  'SYSCALL'; data_audit_exe matches '/tmp/*'; data_audit_exe matches
  '/var/www/*', among other conditions.

known_false_positives: >
  Admin activity (especially in /tmp folders). Crazy web applications. Baseline
  expected activity in your environment and tune this detection before relying
  on it for automated response.

references:
  - Internal Research
  - https://attack.mitre.org/techniques/T1587/
  - https://attack.mitre.org/techniques/T1584/

response:
  message: >
    Program Executions in Suspicious Folders detected on host $agent_name$.
    Matched data_audit_type: $data_audit_type$. Matched data_audit_exe:
    $data_audit_exe$. MITRE ATT&CK: T1587, T1584
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_audit_type
      type: other
    - field: data_audit_exe
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1587
    - T1584
  custom_tags:
    - program
    - executions
    - folders
    - linux
    - auditd
    - resource_development
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_audit_type:/[Ss][Yy][Ss][Cc][Aa][Ll][Ll]/ AND (data_audit_exe:/\/[Tt][Mm][Pp]\/.*/ OR data_audit_exe:/\/[Vv][Aa][Rr]\/[Ww][Ww][Ww]\/.*/ OR data_audit_exe:/\/[Hh][Oo][Mm][Ee]\/.*\/[Pp][Uu][Bb][Ll][Ii][Cc]_[Hh][Tt][Mm][Ll]\/.*/ OR data_audit_exe:/\/[Uu][Ss][Rr]\/[Ll][Oo][Cc][Aa][Ll]\/[Aa][Pp][Aa][Cc][Hh][Ee]2\/.*/ OR data_audit_exe:/\/[Uu][Ss][Rr]\/[Ll][Oo][Cc][Aa][Ll]\/[Hh][Tt][Tt][Pp][Dd]\/.*/ OR data_audit_exe:/\/[Vv][Aa][Rr]\/[Aa][Pp][Aa][Cc][Hh][Ee]\/.*/ OR data_audit_exe:/\/[Ss][Rr][Vv]\/[Ww][Ww][Ww]\/.*/ OR data_audit_exe:/\/[Hh][Oo][Mm][Ee]\/[Hh][Tt][Tt][Pp][Dd]\/[Hh][Tt][Mm][Ll]\/.*/ OR data_audit_exe:/\/[Ss][Rr][Vv]\/[Hh][Tt][Tt][Pp]\/.*/ OR data_audit_exe:/\/[Uu][Ss][Rr]\/[Ss][Hh][Aa][Rr][Ee]\/[Nn][Gg][Ii][Nn][Xx]\/[Hh][Tt][Mm][Ll]\/.*/ OR data_audit_exe:/\/[Vv][Aa][Rr]\/[Ll][Ii][Bb]\/[Pp][Gg][Ss][Qq][Ll]\/[Dd][Aa][Tt][Aa]\/.*/ OR data_audit_exe:/\/[Uu][Ss][Rr]\/[Ll][Oo][Cc][Aa][Ll]\/[Mm][Yy][Ss][Qq][Ll]\/[Dd][Aa][Tt][Aa]\/.*/ OR data_audit_exe:/\/[Vv][Aa][Rr]\/[Ll][Ii][Bb]\/[Mm][Yy][Ss][Qq][Ll]\/.*/ OR data_audit_exe:/\/[Vv][Aa][Rr]\/[Vv][Ss][Ff][Tt][Pp][Dd]\/.*/ OR data_audit_exe:/\/[Ee][Tt][Cc]\/[Bb][Ii][Nn][Dd]\/.*/ OR data_audit_exe:/\/[Vv][Aa][Rr]\/[Nn][Aa][Mm][Ee][Dd]\/.*/)

correlation:
  # Authored by the correlation engine for review.
  enrichment_searches:
  # Rule-specific telemetry pivots the engine runs around an alert from this rule,
  # scoped to the alert's host/user/IP within the window (behaviour-targeted, not a sweep).
    - name: "Shell / interpreter execution on this host"
      query: '(data_process_exec_process_binary:/.*(\/[Bb][Aa][Ss][Hh]|\/[Ss][Hh]|\/[Dd][Aa][Ss][Hh]|\/[Zz][Ss][Hh]|\/[Kk][Ss][Hh]|\/[Aa][Ss][Hh]|\/[Bb][Uu][Ss][Yy][Bb][Oo][Xx])/ OR data_process_exec_process_binary:/.*(\/[Pp][Yy][Tt][Hh][Oo][Nn]|\/[Pp][Yy][Tt][Hh][Oo][Nn]3|\/[Pp][Ee][Rr][Ll]|\/[Rr][Uu][Bb][Yy]|\/[Pp][Hh][Pp]|\/[Nn][Oo][Dd][Ee]|\/[Ll][Uu][Aa]|\/[Aa][Ww][Kk])/)'
      pivot_on: [host]
      window: 1h
    - name: "Reconnaissance commands on this host"
      query: 'data_process_exec_process_binary:/.*(\/[Ww][Hh][Oo][Aa][Mm][Ii]|\/[Ii][Dd]|\/[Uu][Nn][Aa][Mm][Ee]|\/[Hh][Oo][Ss][Tt][Nn][Aa][Mm][Ee]|\/[Hh][Oo][Ss][Tt][Nn][Aa][Mm][Ee][Cc][Tt][Ll]|\/[Ss][Ss]|\/[Nn][Ee][Tt][Ss][Tt][Aa][Tt]|\/[Ii][Ff][Cc][Oo][Nn][Ff][Ii][Gg]|\/[Aa][Rr][Pp]|\/[Ww]|\/[Ww][Hh][Oo]|\/[Ll][Aa][Ss][Tt]|\/[Ll][Ss][Oo][Ff]|\/[Nn][Mm][Aa][Pp]|\/[Dd][Ii][Gg]|\/[Ff][Ii][Nn][Dd])/'
      pivot_on: [host]
      window: 1h
    - name: "Privilege-escalation tooling executed on this host"
      query: 'data_process_exec_process_binary:/.*(\/[Ss][Uu][Dd][Oo]|\/[Ss][Uu]|\/[Pp][Kk][Ee][Xx][Ee][Cc]|\/[Dd][Oo][Aa][Ss]|\/[Ss][Ee][Tt][Cc][Aa][Pp]|\/[Cc][Hh][Ss][Hh]|\/[Nn][Ee][Ww][Gg][Rr][Pp])/'
      pivot_on: [host]
      window: 2h
