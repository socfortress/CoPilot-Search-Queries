name: Data Exfiltration with Wget
id: cb39d16b-b3b6-4a7a-8222-1cf24b686ffc
version: 1
schema_version: "1.0"
date: "2022-12-25"
author: Pawel Mazur
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: cb39d16b-b3b6-4a7a-8222-1cf24b686ffc
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects attempts to post the file with the usage of wget utility. The
  adversary can bypass the permission restriction with the misconfigured sudo
  permission for wget utility which could allow them to read files like
  /etc/shadow. MITRE ATT&CK: T1048.003.

data_source:
  - Linux Auditd via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_audit_type:
              value: "EXECVE"
              case_insensitive: true
        - term:
            data_audit_execve_a0:
              value: "wget"
              case_insensitive: true
        - wildcard:
            data_audit_execve_a1:
              value: "--post-file=*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_audit_type
    - data_audit_execve_a0
    - data_audit_execve_a1
    - data_audit_exe
    - data_audit_command
    - data_audit_key

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires auditd running on the endpoint with audit rules covering the relevant
  syscalls/paths, and the Wazuh agent reading /var/log/audit/audit.log (default
  localfile entry). The detection looks for events where data_audit_type equals
  'EXECVE'; data_audit_execve_a0 equals 'wget'; data_audit_execve_a1 matches
  '--post-file=*'.

known_false_positives: >
  Legitimate usage of wget utility to post a file. Baseline expected activity in
  your environment and tune this detection before relying on it for automated
  response.

references:
  - https://linux.die.net/man/1/wget
  - https://gtfobins.github.io/gtfobins/wget/
  - https://attack.mitre.org/techniques/T1048/003/

response:
  message: >
    Data Exfiltration with Wget detected on host $agent_name$. Matched
    data_audit_type: $data_audit_type$. Matched data_audit_execve_a0:
    $data_audit_execve_a0$. MITRE ATT&CK: T1048.003
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_audit_type
      type: other
    - field: data_audit_execve_a0
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1048.003
  custom_tags:
    - exfiltration
    - linux
    - auditd
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_audit_type:/[Ee][Xx][Ee][Cc][Vv][Ee]/ AND data_audit_execve_a0:/[Ww][Gg][Ee][Tt]/ AND data_audit_execve_a1:/--[Pp][Oo][Ss][Tt]-[Ff][Ii][Ll][Ee]=.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: linux-auditd-possible-access-credential-files-001
    name: Linux Auditd Possible Access To Credential Files
    reason: This rule's own scenario is wget abusing a sudo misconfig to read /etc/shadow; this detects the cat/less/vim read of /etc/shadow and /etc/passwd on the same host - the credential-dump step that produces the very hashes then posted out via wget --post-file. Same auditd data source, so it fires on the same telemetry stream.
  - id: fa4aaed5-4fe0-498d-bbc0-08e3346387ba
    name: Copy Passwd Or Shadow From TMP Path
    reason: Staging /etc/shadow or /etc/passwd into /tmp is the collection step immediately before exfil; wget --post-file= then uploads that staged hash file off the box, so this detection and the wget rule are the two halves of one shadow-theft-and-exfil sequence (this rule already lists the wget rule as its exfil follow-on).
  - id: linux-auditd-possible-access-sudoers-file-001
    name: Linux Auditd Possible Access To Sudoers File
    reason: 'Reading /etc/sudoers is how an operator discovers the misconfigured ''NOPASSWD: wget'' entry this rule''s description names as the privilege path; sudoers enumeration on the same host explains how wget was allowed to read root-only files before posting them out. Same auditd data source.'
  - id: linux-sudo-or-su-execution-001
    name: Linux Sudo Or Su Execution
    reason: The rule abuses a sudo permission for wget; a sudo/su invocation on the same host just before this fires is the actual privilege-escalation action (sudo wget --post-file) that let the attacker read and exfiltrate a protected file. Same auditd data source.
  - id: linux-auditd-data-transfer-size-limits-via-split-001
    name: Linux Auditd Data Transfer Size Limits Via Split
    reason: split -b chunks a large sensitive file into size-limited pieces to slip under egress/DLP thresholds; split on the same host before wget --post-file means the data was deliberately prepared for this exfil - both carry the 'Data Exfiltration' analytic story and the same auditd source.
  - id: 00b90cc1-17ec-402c-96ad-3a8117d7a582
    name: Suspicious Curl File Upload - Linux
    reason: curl adding a file to a web request (-F/-T/--upload-file/--data) is the exact same file-exfil behaviour as wget --post-file through the alternate downloader; an operator scripting one routinely falls back to the other, so catching it on the same host widens the picture of what was posted out and where.
  - id: c3d9e7f1-6a2b-4d8f-9c2b-5e6f7a8b9c0d
    name: Linux Suspicious Curl Data Exfiltration
    reason: A co-occurring curl exfil of ~/.aws credentials is the cloud-secret counterpart to this host-credential exfil; one hands-on-keyboard session often pushes both local hashes (wget --post-file) and cloud keys (curl) out, so this expands the stolen-data scope (this rule already lists the wget rule as its exfil sibling).
  - id: 3b4c5d6e-7f80-1234-5678-90abcdef1234
    name: Linux SSH Key Discovery
    reason: find/grep hunting for id_rsa and authorized_keys locates the private keys an operator exfiltrates; SSH-key discovery on the same host before wget --post-file points to the keys being the payload staged for this upload, enabling follow-on lateral movement.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other outbound transfer / exfiltration tooling on this host
    query: data_audit_exe:/.*(\/[Cc][Uu][Rr][Ll]|\/[Ss][Cc][Pp]|\/[Ss][Ff][Tt][Pp]|\/[Rr][Ss][Yy][Nn][Cc]|\/[Rr][Cc][Ll][Oo][Nn][Ee]|\/[Tt][Ff][Tt][Pp]|\/[Nn][Cc]|\/[Nn][Cc][Aa][Tt]|\/[Nn][Ee][Tt][Cc][Aa][Tt]|\/[Ss][Oo][Cc][Aa][Tt]|\/[Oo][Pp][Ee][Nn][Ss][Ss][Ll])/
    pivot_on:
    - host
    window: 2h
  - name: Collection staging via archive / compression / encryption on this host
    query: data_audit_exe:/.*(\/[Tt][Aa][Rr]|\/[Gg][Zz][Ii][Pp]|\/[Bb][Zz][Ii][Pp]2|\/[Xx][Zz]|\/[Zz][Ii][Pp]|\/7[Zz]|\/7[Zz][Aa]|\/7[Zz][Rr]|\/[Zz][Ss][Tt][Dd]|\/[Gg][Pp][Gg]|\/[Ss][Pp][Ll][Ii][Tt])/
    pivot_on:
    - host
    window: 2h
  - name: Secret / credential files referenced in command arguments on this host
    query: (data_audit_execve_a1:/.*(\/[Ee][Tt][Cc]\/[Ss][Hh][Aa][Dd][Oo][Ww]|\/[Ee][Tt][Cc]\/[Pp][Aa][Ss][Ss][Ww][Dd]|\.[Ss][Ss][Hh]\/|[Ii][Dd]_[Rr][Ss][Aa]|[Ii][Dd]_[Ee][Cc][Dd][Ss][Aa]|[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Ee][Dd]_[Kk][Ee][Yy][Ss]|\.[Aa][Ww][Ss]\/).*/ OR data_audit_execve_a2:/.*(\/[Ee][Tt][Cc]\/[Ss][Hh][Aa][Dd][Oo][Ww]|\/[Ee][Tt][Cc]\/[Pp][Aa][Ss][Ss][Ww][Dd]|\.[Ss][Ss][Hh]\/|[Ii][Dd]_[Rr][Ss][Aa]|[Ii][Dd]_[Ee][Cc][Dd][Ss][Aa]|[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Ee][Dd]_[Kk][Ee][Yy][Ss]|\.[Aa][Ww][Ss]\/).*/)
    pivot_on:
    - host
    window: 2h
  - name: Privilege-escalation binaries executed on this host
    query: data_audit_exe:/.*(\/[Ss][Uu][Dd][Oo]|\/[Ss][Uu]|\/[Pp][Kk][Ee][Xx][Ee][Cc]|\/[Dd][Oo][Aa][Ss])/
    pivot_on:
    - host
    window: 2h
  - name: Shell / interpreter execution on this host
    query: ((data_audit_exe:/.*(\/[Bb][Aa][Ss][Hh]|\/[Ss][Hh]|\/[Dd][Aa][Ss][Hh]|\/[Zz][Ss][Hh]|\/[Kk][Ss][Hh]|\/[Bb][Uu][Ss][Yy][Bb][Oo][Xx])/) OR (data_audit_exe:/.*(\/[Pp][Yy][Tt][Hh][Oo][Nn]|\/[Pp][Yy][Tt][Hh][Oo][Nn]3|\/[Pp][Ee][Rr][Ll]|\/[Rr][Uu][Bb][Yy]|\/[Pp][Hh][Pp]|\/[Nn][Oo][Dd][Ee]|\/[Aa][Ww][Kk])/))
    pivot_on:
    - host
    window: 1h
