name: Suspicious Commands Linux
id: 1543ae20-cbdf-4ec1-8d12-7664d667a825
version: 1
schema_version: "1.0"
date: "2022-10-05"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 1543ae20-cbdf-4ec1-8d12-7664d667a825
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects relevant commands often related to malware or hacking activity. MITRE
  ATT&CK: T1059.004.

data_source:
  - Linux Auditd via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - bool:
                  must:
                    - term:
                        data_audit_type:
                          value: "EXECVE"
                          case_insensitive: true
                    - term:
                        data_audit_execve_a0:
                          value: "chmod"
                          case_insensitive: true
                    - term:
                        data_audit_execve_a1: "777"
              - bool:
                  must:
                    - term:
                        data_audit_type:
                          value: "EXECVE"
                          case_insensitive: true
                    - term:
                        data_audit_execve_a0:
                          value: "chmod"
                          case_insensitive: true
                    - term:
                        data_audit_execve_a1:
                          value: "u+s"
                          case_insensitive: true
              - bool:
                  must:
                    - term:
                        data_audit_type:
                          value: "EXECVE"
                          case_insensitive: true
                    - term:
                        data_audit_execve_a0:
                          value: "cp"
                          case_insensitive: true
                    - term:
                        data_audit_execve_a1:
                          value: "/bin/ksh"
                          case_insensitive: true
              - bool:
                  must:
                    - term:
                        data_audit_type:
                          value: "EXECVE"
                          case_insensitive: true
                    - term:
                        data_audit_execve_a0:
                          value: "cp"
                          case_insensitive: true
                    - term:
                        data_audit_execve_a1:
                          value: "/bin/sh"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_audit_type
    - data_audit_execve_a0
    - data_audit_execve_a1
    - data_audit_exe
    - data_audit_command
    - data_audit_key

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires auditd running on the endpoint with audit rules covering the relevant
  syscalls/paths, and the Wazuh agent reading /var/log/audit/audit.log (default
  localfile entry). The detection looks for events where data_audit_type equals
  'EXECVE'; data_audit_execve_a0 equals 'chmod'; data_audit_execve_a1 equals
  '777', among other conditions.

known_false_positives: >
  Admin activity. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - Internal Research - mostly derived from exploit code including code in MSF
  - https://attack.mitre.org/techniques/T1059/004/

response:
  message: >
    Suspicious Commands Linux detected on host $agent_name$. Matched
    data_audit_type: $data_audit_type$. Matched data_audit_execve_a0:
    $data_audit_execve_a0$. MITRE ATT&CK: T1059.004
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_audit_type
      type: other
    - field: data_audit_execve_a0
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.004
  custom_tags:
    - linux
    - auditd
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: ((data_audit_type:/[Ee][Xx][Ee][Cc][Vv][Ee]/ AND data_audit_execve_a0:/[Cc][Hh][Mm][Oo][Dd]/ AND data_audit_execve_a1:"777") OR (data_audit_type:/[Ee][Xx][Ee][Cc][Vv][Ee]/ AND data_audit_execve_a0:/[Cc][Hh][Mm][Oo][Dd]/ AND data_audit_execve_a1:/[Uu]\+[Ss]/) OR (data_audit_type:/[Ee][Xx][Ee][Cc][Vv][Ee]/ AND data_audit_execve_a0:/[Cc][Pp]/ AND data_audit_execve_a1:/\/[Bb][Ii][Nn]\/[Kk][Ss][Hh]/) OR (data_audit_type:/[Ee][Xx][Ee][Cc][Vv][Ee]/ AND data_audit_execve_a0:/[Cc][Pp]/ AND data_audit_execve_a1:/\/[Bb][Ii][Nn]\/[Ss][Hh]/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: linux-setuid-using-chmod-utility-001
    name: Linux Setuid Using Chmod Utility
    reason: This rule's own 'chmod u+s' branch is exactly the setuid-bit set this detects; it widens the net to g+s/4755/4777, so the same privilege-escalation command trips both and confirms a SUID shell/backdoor is being armed rather than a benign chmod.
  - id: linux-setuid-using-setcap-utility-001
    name: Linux Setuid Using Setcap Utility
    reason: Granting cap_setuid via setcap is the capability-based equivalent of 'chmod u+s' - the same 'make this binary run as root' step by a different primitive, so an attacker arming a root-capable binary often uses it alongside or instead of the chmod this caught.
  - id: e2f3g4h5-6789-1011-1213-141516171819
    name: Linux File Permission Modification Detection
    reason: Broadens this rule's narrow literal 'chmod 777' to 755/754/+x - the same 'make the dropped payload executable' step done with an adjacent mode, catching arming of a file this rule's exact-match 777 branch would miss.
  - id: a39d7fa7-3fbd-4dc2-97e1-d87f546b1bbc
    name: Program Executions in Suspicious Folders
    reason: 'Same auditd EXECVE/SYSCALL telemetry on the same host: the file just made world-executable, or the copied shell, actually running from /tmp, /var/www or a web root - the execution that follows the arming this rule caught.'
  - id: 2fade0b6-7423-4835-9d4f-335b39b83867
    name: Shell Execution Of Process Located In Tmp Directory
    reason: 'Direct follow-on to the ''cp /bin/sh''/''cp /bin/ksh'' branch: a shell binary copied into /tmp and then executed is the staged SUID/root shell being used after it was placed.'
  - id: a2d9e2f3-0f43-4c7a-bcd9-9acfc0d723aa
    name: Suspicious Download and Execute Pattern via Curl/Wget
    reason: The download->chmod->execute chain this 'chmod 777' sits in the middle of; shows how the payload reached the host (curl/wget into /tmp or /dev/shm) immediately before it was armed and run.
  - id: 7f734ed0-4f47-46c0-837f-6ee62505abd9
    name: Potential Netcat Reverse Shell Execution
    reason: The shell this rule copies/arms is frequently wired to a 'nc -e /bin/sh' callback - the follow-on that turns a staged local shell into interactive C2 / hands-on-keyboard access.
  - id: linux-sudo-or-su-execution-001
    name: Linux Sudo Or Su Execution
    reason: The privilege elevation the whole 'cp /bin/sh' + 'chmod u+s' sequence builds toward; a sudo/su on the same host within the window corroborates a low-privilege-to-root transition rather than isolated file activity.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: SUID / capability enumeration via find or getcap on this host
    query: ((data_process_exec_process_binary:/.*\/[Ff][Ii][Nn][Dd]/ AND (data_process_exec_process_arguments:/.*\-[Pp][Ee][Rr][Mm].*/ OR data_process_exec_process_arguments:/.*4000.*/ OR data_process_exec_process_arguments:/.*[Uu]\+[Ss].*/)) OR (data_process_exec_process_binary:/.*\/[Gg][Ee][Tt][Cc][Aa][Pp]/))
    pivot_on:
    - host
    window: 4h
  - name: Ingress tool transfer via wget / curl / tftp on this host
    query: data_process_exec_process_binary:/.*\/([Ww][Gg][Ee][Tt]|[Cc][Uu][Rr][Ll]|[Tt][Ff][Tt][Pp])/
    pivot_on:
    - host
    window: 4h
  - name: Process executing from /tmp, /var/tmp or shared memory on this host
    query: data_process_exec_process_binary:/\/([Tt][Mm][Pp]|[Vv][Aa][Rr]\/[Tt][Mm][Pp]|[Dd][Ee][Vv]\/[Ss][Hh][Mm]|[Rr][Uu][Nn]\/[Ss][Hh][Mm])\/.*/
    pivot_on:
    - host
    window: 2h
  - name: Reverse shell / C2 callback indicators on this host
    query: ((data_process_exec_process_binary:/.*\/([Nn][Cc]|[Nn][Cc][Aa][Tt]|[Nn][Ee][Tt][Cc][Aa][Tt])/ AND data_process_exec_process_arguments:/.*\-[Ee].*/) OR (data_process_exec_process_arguments:/.*\/[Dd][Ee][Vv]\/[Tt][Cc][Pp]\/.*/) OR (data_process_exec_process_binary:/.*\/[Mm][Kk][Ff][Ii][Ff][Oo]/))
    pivot_on:
    - host
    window: 1h
  - name: Persistence install via cron / systemd / authorized_keys / ld.so.preload on this host
    query: ((data_process_exec_process_binary:/.*\/([Cc][Rr][Oo][Nn][Tt][Aa][Bb]|[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]|[Aa][Tt])/) OR (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Cc][Rr][Oo][Nn].*/) OR (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Yy][Ss][Tt][Ee][Mm][Dd]\/.*/) OR (data_process_exec_process_arguments:/.*[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Ee][Dd]_[Kk][Ee][Yy][Ss].*/) OR (data_process_exec_process_arguments:/.*[Ll][Dd]\.[Ss][Oo]\.[Pp][Rr][Ee][Ll][Oo][Aa][Dd].*/))
    pivot_on:
    - host
    window: 6h
