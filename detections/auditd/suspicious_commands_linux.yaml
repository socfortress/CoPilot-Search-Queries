name: Suspicious Commands Linux
id: 1543ae20-cbdf-4ec1-8d12-7664d667a825
version: 1
schema_version: "1.0"
date: "2022-10-05"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 1543ae20-cbdf-4ec1-8d12-7664d667a825
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects relevant commands often related to malware or hacking activity. MITRE
  ATT&CK: T1059.004.

data_source:
  - Linux Auditd via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - bool:
                  must:
                    - term:
                        data_audit_type:
                          value: "EXECVE"
                          case_insensitive: true
                    - term:
                        data_audit_execve_a0:
                          value: "chmod"
                          case_insensitive: true
                    - term:
                        data_audit_execve_a1: "777"
              - bool:
                  must:
                    - term:
                        data_audit_type:
                          value: "EXECVE"
                          case_insensitive: true
                    - term:
                        data_audit_execve_a0:
                          value: "chmod"
                          case_insensitive: true
                    - term:
                        data_audit_execve_a1:
                          value: "u+s"
                          case_insensitive: true
              - bool:
                  must:
                    - term:
                        data_audit_type:
                          value: "EXECVE"
                          case_insensitive: true
                    - term:
                        data_audit_execve_a0:
                          value: "cp"
                          case_insensitive: true
                    - term:
                        data_audit_execve_a1:
                          value: "/bin/ksh"
                          case_insensitive: true
              - bool:
                  must:
                    - term:
                        data_audit_type:
                          value: "EXECVE"
                          case_insensitive: true
                    - term:
                        data_audit_execve_a0:
                          value: "cp"
                          case_insensitive: true
                    - term:
                        data_audit_execve_a1:
                          value: "/bin/sh"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_audit_type
    - data_audit_execve_a0
    - data_audit_execve_a1
    - data_audit_exe
    - data_audit_command
    - data_audit_key

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires auditd running on the endpoint with audit rules covering the relevant
  syscalls/paths, and the Wazuh agent reading /var/log/audit/audit.log (default
  localfile entry). The detection looks for events where data_audit_type equals
  'EXECVE'; data_audit_execve_a0 equals 'chmod'; data_audit_execve_a1 equals
  '777', among other conditions.

known_false_positives: >
  Admin activity. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - Internal Research - mostly derived from exploit code including code in MSF
  - https://attack.mitre.org/techniques/T1059/004/

response:
  message: >
    Suspicious Commands Linux detected on host $agent_name$. Matched
    data_audit_type: $data_audit_type$. Matched data_audit_execve_a0:
    $data_audit_execve_a0$. MITRE ATT&CK: T1059.004
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_audit_type
      type: other
    - field: data_audit_execve_a0
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.004
  custom_tags:
    - linux
    - auditd
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: ((data_audit_type:/[Ee][Xx][Ee][Cc][Vv][Ee]/ AND data_audit_execve_a0:/[Cc][Hh][Mm][Oo][Dd]/ AND data_audit_execve_a1:"777") OR (data_audit_type:/[Ee][Xx][Ee][Cc][Vv][Ee]/ AND data_audit_execve_a0:/[Cc][Hh][Mm][Oo][Dd]/ AND data_audit_execve_a1:/[Uu]\+[Ss]/) OR (data_audit_type:/[Ee][Xx][Ee][Cc][Vv][Ee]/ AND data_audit_execve_a0:/[Cc][Pp]/ AND data_audit_execve_a1:/\/[Bb][Ii][Nn]\/[Kk][Ss][Hh]/) OR (data_audit_type:/[Ee][Xx][Ee][Cc][Vv][Ee]/ AND data_audit_execve_a0:/[Cc][Pp]/ AND data_audit_execve_a1:/\/[Bb][Ii][Nn]\/[Ss][Hh]/))

correlation:
  # Authored by the correlation engine for review.
  enrichment_searches:
  # NEW ad-hoc searches the engine runs around an alert from this rule, scoped to
  # the alert's host/user/IP within the window (not existing CoPilot Searches).
    - name: "Auditd activity on this host in the window"
      query: 'data_audit_type:*'
      pivot_on: [host]
      window: 1h
    - name: "Process execution (execve) on this host"
      query: 'data_audit_syscall:"execve"'
      pivot_on: [host]
      window: 1h
    - name: "High-severity alerts on this host"
      query: 'rule_level:>=10'
      pivot_on: [host]
      window: 1h
