name: Auditing Configuration Changes on Linux Host
id: 977ef627-4539-4875-adf4-ed8f780c4922
version: 1
schema_version: "1.0"
date: "2021-11-27"
author: Mikhail Larin, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 977ef627-4539-4875-adf4-ed8f780c4922
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detect changes in auditd configuration files. MITRE ATT&CK: T1685.

data_source:
  - Linux Auditd via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_audit_type:
              value: "PATH"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_audit_file_name:
                    value: "/etc/audit/*"
                    case_insensitive: true
              - term:
                  data_audit_file_name:
                    value: "/etc/libaudit.conf"
                    case_insensitive: true
              - wildcard:
                  data_audit_file_name:
                    value: "/etc/audisp/*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_audit_type
    - data_audit_file_name
    - data_audit_exe
    - data_audit_command
    - data_audit_execve_a0
    - data_audit_key

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires auditd running on the endpoint with audit rules covering the relevant
  syscalls/paths, and the Wazuh agent reading /var/log/audit/audit.log (default
  localfile entry). The detection looks for events where data_audit_type equals
  'PATH'; data_audit_file_name matches '/etc/audit/*'; data_audit_file_name
  equals '/etc/libaudit.conf', among other conditions.

known_false_positives: >
  Legitimate administrative activity. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://github.com/Neo23x0/auditd/blob/master/audit.rules
  - Self Experience
  - https://attack.mitre.org/techniques/T1685/

response:
  message: >
    Auditing Configuration Changes on Linux Host detected on host $agent_name$.
    Matched data_audit_type: $data_audit_type$. Matched data_audit_file_name:
    $data_audit_file_name$. MITRE ATT&CK: T1685
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_audit_type
      type: other
    - field: data_audit_file_name
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685
  custom_tags:
    - auditing
    - configuration
    - changes
    - linux
    - auditd
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_audit_type:/[Pp][Aa][Tt][Hh]/ AND (data_audit_file_name:/\/[Ee][Tt][Cc]\/[Aa][Uu][Dd][Ii][Tt]\/.*/ OR data_audit_file_name:/\/[Ee][Tt][Cc]\/[Ll][Ii][Bb][Aa][Uu][Dd][Ii][Tt]\.[Cc][Oo][Nn][Ff]/ OR data_audit_file_name:/\/[Ee][Tt][Cc]\/[Aa][Uu][Dd][Ii][Ss][Pp]\/.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: bed26dea-4525-47f4-b24a-76e30e44ffb0
    name: Audit Rules Deleted Via Auditctl
    reason: 'Runtime complement of the same blinding act: this alert is someone editing the auditd config/rules files on disk, while ''auditctl -D'' flushes the ruleset already loaded in the running kernel. Attackers routinely do both - gut audit.rules then reload/flush - so a near-simultaneous auditctl -D on the host confirms a deliberate takedown of auditing rather than a benign config touch.'
  - id: c830f15d-6f6e-430f-8074-6f73d6807841
    name: Logging Configuration Changes on Linux Host
    reason: 'Its exact sibling (same author and query structure) for the other host-logging channel: after gutting auditd the operator silences syslog/rsyslog/syslog-ng so no daemon records what comes next. Both config-tamper alerts firing on the host in the window means the attacker is methodically switching off every logging source, not touching one file.'
  - id: a5b977d6-8a81-4475-91b9-49dbfcd941f7
    name: Remove Immutable File Attribute - Auditd
    reason: 'Enabling precursor: hardened hosts set chattr +i on /etc/audit/audit.rules and auditd.conf, so any write fails with ''Operation not permitted'' until the immutable bit is cleared. A ''chattr -i'' on the host immediately before this alert is the step that made the audit config writable in the first place.'
  - id: de25eeb8-3655-4643-ac3a-b662d3f26b6b
    name: Disable Or Stop Services
    reason: 'Immediate follow-on: a weakened config only takes effect once auditd is restarted, and the blunter move is ''systemctl stop/disable auditd'' to kill logging outright. This rule catches that auditd service teardown via Tetragon, which keeps reporting after the daemon is gone.'
  - id: e3a8a052-111f-4606-9aee-f28ebeb76776
    name: Disabling Security Tools
    reason: 'Same hands-on defense-impairment phase: an operator tampering with auditd config usually also stops the firewall/EDR/other security tooling in the same minutes, so a co-occurring hit distinguishes a deliberate blinding sweep from a single stray admin edit.'
  - id: 80915f59-9b56-4616-9de0-fd0dea6c12fe
    name: Linux Logs Clearing Attempts
    reason: 'Cover-tracks follow-on: with auditing disabled the attacker deletes the /var/log/audit records already written (rm/shred/unlink) to erase what was captured before the blinding - the evidence-destruction half of the same anti-forensic act that began with editing the audit config.'
  - id: 3fcc9b35-39e4-44c0-a2ad-9e82b6902b31
    name: Syslog Clearing or Removal Via System Utilities
    reason: 'Parallel log destruction: attackers who blind auditd also purge syslog (truncate/cat/echo/mv) to remove the second on-disk record of their activity. Emptying syslog in the same window as this auditd config change signals systematic removal of every logging channel on the host.'
  - id: 1182f3b3-e716-4efa-99ab-d2685d04360f
    name: History File Deletion
    reason: 'Co-occurring interactive cover-tracks: operators who weaken auditing routinely wipe ~/.bash_history in the same session to hide the exact commands they ran, which places a live human on the host rather than an automated job and raises confidence that the config edit was malicious.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Editor or stream tool writing to the auditd configuration on this host
    query: ((data_process_exec_process_binary:/.*\/[Vv][Ii]/ OR data_process_exec_process_binary:/.*\/[Vv][Ii][Mm]/ OR data_process_exec_process_binary:/.*\/[Nn][Aa][Nn][Oo]/ OR data_process_exec_process_binary:/.*\/[Ee][Mm][Aa][Cc][Ss]/ OR data_process_exec_process_binary:/.*\/[Ss][Ee][Dd]/ OR data_process_exec_process_binary:/.*\/[Tt][Ee][Ee]/ OR data_process_exec_process_binary:/.*\/[Dd][Dd]/ OR data_process_exec_process_binary:/.*\/[Cc][Pp]/ OR data_process_exec_process_binary:/.*\/[Mm][Vv]/) AND (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Aa][Uu][Dd][Ii][Tt].*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Aa][Uu][Dd][Ii][Ss][Pp].*/ OR data_process_exec_process_arguments:/.*[Ll][Ii][Bb][Aa][Uu][Dd][Ii][Tt]\.[Cc][Oo][Nn][Ff].*/))
    pivot_on:
    - host
    window: 1h
  - name: Audit daemon disabled, rules reloaded, or service restarted/stopped on this host
    query: ((data_process_exec_process_binary:/.*\/[Aa][Uu][Dd][Ii][Tt][Cc][Tt][Ll]/ AND (data_process_exec_process_arguments:/.*-[Dd].*/ OR data_process_exec_process_arguments:/.*-[Ee] [012].*/)) OR data_process_exec_process_binary:/.*\/[Aa][Uu][Gg][Ee][Nn][Rr][Uu][Ll][Ee][Ss]/ OR ((data_process_exec_process_binary:/.*\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]/ OR data_process_exec_process_binary:/.*\/[Ss][Ee][Rr][Vv][Ii][Cc][Ee]/ OR data_process_exec_process_binary:/.*\/[Pp][Kk][Ii][Ll][Ll]/ OR data_process_exec_process_binary:/.*\/[Kk][Ii][Ll][Ll][Aa][Ll][Ll]/) AND data_process_exec_process_arguments:/.*[Aa][Uu][Dd][Ii][Tt][Dd].*/))
    pivot_on:
    - host
    window: 2h
  - name: Immutable attribute cleared on audit or log paths on this host
    query: (data_process_exec_process_binary:/.*\/[Cc][Hh][Aa][Tt][Tt][Rr]/ AND data_process_exec_process_arguments:/.*-[Ii].*/ AND (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Aa][Uu][Dd][Ii][Tt].*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Aa][Uu][Dd][Ii][Ss][Pp].*/ OR data_process_exec_process_arguments:/.*[Ll][Ii][Bb][Aa][Uu][Dd][Ii][Tt]\.[Cc][Oo][Nn][Ff].*/ OR data_process_exec_process_arguments:/.*\/[Vv][Aa][Rr]\/[Ll][Oo][Gg].*/))
    pivot_on:
    - host
    window: 1h
  - name: Privilege escalation to root preceding this activity on this host
    query: data_process_exec_process_binary:/.*\/[Ss][Uu][Dd][Oo]/ OR data_process_exec_process_binary:/.*\/[Ss][Uu]/ OR data_process_exec_process_binary:/.*\/[Pp][Kk][Ee][Xx][Ee][Cc]/ OR data_process_exec_process_binary:/.*\/[Dd][Oo][Aa][Ss]/
    pivot_on:
    - host
    window: 2h
  - name: Audit and authentication logs truncated, overwritten, or deleted on this host
    query: (data_process_exec_process_binary:/.*\/[Rr][Mm]/ OR data_process_exec_process_binary:/.*\/[Ss][Hh][Rr][Ee][Dd]/ OR data_process_exec_process_binary:/.*\/[Uu][Nn][Ll][Ii][Nn][Kk]/ OR data_process_exec_process_binary:/.*\/[Tt][Rr][Uu][Nn][Cc][Aa][Tt][Ee]/ OR data_process_exec_process_binary:/.*\/[Dd][Dd]/ OR data_process_exec_process_binary:/.*\/[Tt][Ee][Ee]/ OR data_process_exec_process_binary:/.*\/[Cc][Pp]/) AND (data_process_exec_process_arguments:/.*\/[Vv][Aa][Rr]\/[Ll][Oo][Gg]\/[Aa][Uu][Dd][Ii][Tt].*/ OR data_process_exec_process_arguments:/.*\/[Vv][Aa][Rr]\/[Ll][Oo][Gg]\/[Ss][Ee][Cc][Uu][Rr][Ee].*/ OR data_process_exec_process_arguments:/.*\/[Vv][Aa][Rr]\/[Ll][Oo][Gg]\/[Aa][Uu][Tt][Hh]\.[Ll][Oo][Gg].*/ OR data_process_exec_process_arguments:/.*[Ww][Tt][Mm][Pp].*/ OR data_process_exec_process_arguments:/.*[Bb][Tt][Mm][Pp].*/)
    pivot_on:
    - host
    window: 2h
