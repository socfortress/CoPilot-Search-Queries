graylog:
  query: data_audit_type:/[Pp][Aa][Tt][Hh]/ AND (data_audit_file_name:/\/[Vv][Aa][Rr]\/[Rr][Uu][Nn]\/[Aa][Ee][Pp][Mm][Oo][Nn][Ee][Nn][Dd]\.[Pp][Ii][Dd]/ OR data_audit_file_name:/\/[Vv][Aa][Rr]\/[Rr][Uu][Nn]\/[Aa][Uu][Dd][Ii][Tt][Dd]\.[Ll][Oo][Cc][Kk]/ OR data_audit_file_name:/\/[Vv][Aa][Rr]\/[Rr][Uu][Nn]\/[Cc][Mm][Aa]\.[Ll][Oo][Cc][Kk]/ OR data_audit_file_name:/\/[Vv][Aa][Rr]\/[Rr][Uu][Nn]\/[Cc][Oo][Nn][Ss][Oo][Ll][Ee]-[Kk][Ii][Tt]\.[Pp][Ii][Dd]/ OR data_audit_file_name:/\/[Vv][Aa][Rr]\/[Rr][Uu][Nn]\/[Cc][Oo][Nn][Ss][Oo][Ll][Ee][Kk][Ii][Tt]\.[Pp][Ii][Dd]/ OR data_audit_file_name:/\/[Vv][Aa][Rr]\/[Rr][Uu][Nn]\/[Dd][Aa][Ee][Mm][Oo][Nn]\.[Pp][Ii][Dd]/ OR data_audit_file_name:/\/[Vv][Aa][Rr]\/[Rr][Uu][Nn]\/[Hh][Aa][Ll][Dd]-[Aa][Dd][Dd][Oo][Nn]\.[Pp][Ii][Dd]/ OR data_audit_file_name:/\/[Vv][Aa][Rr]\/[Rr][Uu][Nn]\/[Hh][Aa][Ll][Dd]-[Ss][Mm][Aa][Rr][Tt][Dd]\.[Pp][Ii][Dd]/ OR data_audit_file_name:/\/[Vv][Aa][Rr]\/[Rr][Uu][Nn]\/[Hh][Aa][Ll][Dd][Rr][Uu][Nn][Dd]\.[Pp][Ii][Dd]/ OR data_audit_file_name:/\/[Vv][Aa][Rr]\/[Rr][Uu][Nn]\/[Hh][Pp]-[Hh][Ee][Aa][Ll][Tt][Hh]\.[Pp][Ii][Dd]/ OR data_audit_file_name:/\/[Vv][Aa][Rr]\/[Rr][Uu][Nn]\/[Hh][Pp][Aa][Ss][Mm][Ll][Ii][Tt]\.[Ll][Oo][Cc][Kk]/ OR data_audit_file_name:/\/[Vv][Aa][Rr]\/[Rr][Uu][Nn]\/[Hh][Pp][Aa][Ss][Mm][Ll][Ii][Tt][Ee][Dd]\.[Pp][Ii][Dd]/ OR data_audit_file_name:/\/[Vv][Aa][Rr]\/[Rr][Uu][Nn]\/[Kk][Dd][Ee][Vv][Rr][Uu][Nn][Dd]\.[Pp][Ii][Dd]/ OR data_audit_file_name:/\/[Vv][Aa][Rr]\/[Rr][Uu][Nn]\/[Ll][Ll][Dd][Pp][Aa][Dd]\.[Ll][Oo][Cc][Kk]/ OR data_audit_file_name:/\/[Vv][Aa][Rr]\/[Rr][Uu][Nn]\/[Mm][Cc][Ee][Ll][Oo][Gg]\.[Pp][Ii][Dd]/ OR data_audit_file_name:/\/[Vv][Aa][Rr]\/[Rr][Uu][Nn]\/[Ss][Yy][Ss][Tt][Ee][Mm]\.[Pp][Ii][Dd]/ OR data_audit_file_name:/\/[Vv][Aa][Rr]\/[Rr][Uu][Nn]\/[Uu][Vv][Pp]-[Ss][Rr][Vv]\.[Pp][Ii][Dd]/ OR data_audit_file_name:/\/[Vv][Aa][Rr]\/[Rr][Uu][Nn]\/[Vv][Mm][Tt][Oo][Oo][Ll][Aa][Gg][Tt]\.[Pp][Ii][Dd]/ OR data_audit_file_name:/\/[Vv][Aa][Rr]\/[Rr][Uu][Nn]\/[Xx][Ii][Nn][Ee][Tt][Dd]\.[Ll][Oo][Cc][Kk]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 5cd16c8f-44a6-4654-81e7-a84d6db507d4
    name: Process Execution From Shared Memory Directory
    reason: 'Precursor/co-indicator: BPFDoor is classically staged and executed fileless from /dev/shm so the implant never touches disk. An execution from shared memory on this host in the window is the likely source of the backdoor whose lock file just got touched.'
  - id: 9d4548fa-bba0-4e88-bd66-5d5bf516cda0
    name: Masquerading as Linux Crond Process
    reason: 'Core co-indicator: BPFDoor''s defining stealth trait is renaming its own process (argv[0]) to impersonate a legitimate daemon such as crond. A crond-masquerade on the same host directly corroborates that the thing accessing the disguised /var/run lock file is the backdoor, not the real service.'
  - id: 323ff3f5-0013-4847-bbd4-250b5edb62cc
    name: Modify System Firewall
    reason: 'Co-occurring enabling behavior: BPFDoor manipulates local iptables around activation, inserting then removing a rule so the operator''s magic-packet traffic reaches the implant. Firewall-rule removal on this host is the auditd view of that C2 pinhole being cleaned up.'
  - id: 3be619f4-d9ec-4ea8-a173-18fdd01996ab
    name: Flush Iptables Ufw Chain
    reason: 'Co-occurring enabling behavior, Tetragon source: the same iptables tampering BPFDoor performs to admit its C2 connection, caught from the process-exec stream (a chain flush / allow-all). Dual-source firewall confirmation raises confidence this is the backdoor opening the network for its operator.'
  - id: 4b3cb710-5e83-4715-8c45-8b2b5b3e5751
    name: Modification of ld.so.preload
    reason: 'Companion stealth layer: Red Menshen BPFDoor intrusions pair the implant with a userland ld.so.preload rootkit (libprocesshider-style) to hide the backdoor''s process and files. A preload modification on this host points to the rootkit concealing the implant that just touched its lock file.'
  - id: f7158a64-6204-4d6d-868a-6e6378b467e0
    name: Suspicious C2 Activities
    reason: 'Follow-on hands-on-keyboard: once the magic packet spawns a shell, the operator runs exactly the C2/ingress/lateral tooling this rule keys on (wget, curl, nc, socat, ssh, nmap). Seeing these on the same host after the lock-file access expands the backdoor alert into an active intrusion.'
  - id: 80915f59-9b56-4616-9de0-fd0dea6c12fe
    name: Linux Logs Clearing Attempts
    reason: 'Follow-on anti-forensics: BPFDoor operators are heavily anti-forensic and wipe system logs to cover tracks after working through the implant. rm/shred/unlink against /var/log on this host in the window corroborates active cleanup around the backdoor.'
  - id: 1182f3b3-e716-4efa-99ab-d2685d04360f
    name: History File Deletion
    reason: 'Follow-on anti-forensics: deleting ~/.bash_history to erase the operator''s interactive commands is a standard BPFDoor post-access step and pairs with log clearing. On the same host it confirms a human worked through the shell the backdoor provided.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Binary executed from memory or temporary staging directories
    query: (data_process_exec_process_binary:/\/[Dd][Ee][Vv]\/[Ss][Hh][Mm]\/.*/ OR data_process_exec_process_binary:/\/[Tt][Mm][Pp]\/.*/ OR data_process_exec_process_binary:/\/[Vv][Aa][Rr]\/[Tt][Mm][Pp]\/.*/)
    pivot_on:
    - host
    window: 4h
  - name: Firewall rule insertion or NAT redirect enabling inbound C2
    query: ((data_process_exec_process_binary:/.*\/[Ii][Pp][Tt][Aa][Bb][Ll][Ee][Ss]/ OR data_process_exec_process_binary:/.*\/[Ii][Pp]6[Tt][Aa][Bb][Ll][Ee][Ss]/ OR data_process_exec_process_binary:/.*\/[Nn][Ff][Tt]/) AND (data_process_exec_process_arguments:/.*-[AaIi] .*/ OR data_process_exec_process_arguments:/.*[Rr][Ee][Dd][Ii][Rr][Ee][Cc][Tt].*/ OR data_process_exec_process_arguments:/.* [Nn][Aa][Tt] .*/))
    pivot_on:
    - host
    window: 2h
  - name: Reverse shell via dev tcp, interpreter socket, or socat
    query: (data_process_exec_process_arguments:/.*\/[Dd][Ee][Vv]\/[Tt][Cc][Pp]\/.*/ OR data_process_exec_process_arguments:/.*\/[Dd][Ee][Vv]\/[Uu][Dd][Pp]\/.*/ OR (data_process_exec_process_binary:/.*\/[Nn][Cc]([Aa][Tt])?/ AND data_process_exec_process_arguments:/.*-[Ee] .*/) OR (data_process_exec_process_binary:/.*\/([Pp][Yy][Tt][Hh][Oo][Nn]3?|[Pp][Ee][Rr][Ll])/ AND data_process_exec_process_arguments:/.*[Ss][Oo][Cc][Kk][Ee][Tt].*/) OR (data_process_exec_process_binary:/.*\/[Ss][Oo][Cc][Aa][Tt]/ AND data_process_exec_process_arguments:/.*[Ee][Xx][Ee][Cc].*/))
    pivot_on:
    - host
    window: 1h
  - name: Reconnaissance and situational-awareness commands
    query: data_process_exec_process_binary:/.*\/([Ww][Hh][Oo][Aa][Mm][Ii]|[Ii][Dd]|[Uu][Nn][Aa][Mm][Ee]|[Hh][Oo][Ss][Tt][Nn][Aa][Mm][Ee]|[Ss][Ss]|[Nn][Ee][Tt][Ss][Tt][Aa][Tt]|[Ii][Ff][Cc][Oo][Nn][Ff][Ii][Gg]|[Ii][Pp]|[Aa][Rr][Pp]|[Ww]|[Ww][Hh][Oo]|[Ll][Aa][Ss][Tt]|[Ll][Ss][Oo][Ff])/
    pivot_on:
    - host
    window: 1h
  - name: Persistence via cron, systemd, init, or shell profiles
    query: ((data_process_exec_process_binary:/.*\/([Cc][Rr][Oo][Nn][Tt][Aa][Bb]|[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]|[Aa][Tt]|[Uu][Pp][Dd][Aa][Tt][Ee]-[Rr][Cc]\.[Dd])/) OR (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Cc][Rr][Oo][Nn].*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Yy][Ss][Tt][Ee][Mm][Dd]\/.*/ OR data_process_exec_process_arguments:/.*[Rr][Cc]\.[Ll][Oo][Cc][Aa][Ll].*/ OR data_process_exec_process_arguments:/.*\.[Bb][Aa][Ss][Hh][Rr][Cc].*/ OR data_process_exec_process_arguments:/.*[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Ee][Dd]_[Kk][Ee][Yy][Ss].*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ii][Nn][Ii][Tt]\.[Dd]\/.*/))
    pivot_on:
    - host
    window: 4h
