name: Modification of ld.so.preload
id: 4b3cb710-5e83-4715-8c45-8b2b5b3e5751
version: 1
schema_version: "1.0"
date: "2021-11-27"
author: E.M. Anhaus (originally from Atomic Blue Detections, Tony Lambert), oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 4b3cb710-5e83-4715-8c45-8b2b5b3e5751
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Identifies modification of ld.so.preload for shared object injection. This
  technique is used by attackers to load arbitrary code into processes. MITRE
  ATT&CK: T1574.006.

data_source:
  - Linux Auditd via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_audit_type:
              value: "PATH"
              case_insensitive: true
        - term:
            data_audit_file_name:
              value: "/etc/ld.so.preload"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_audit_type
    - data_audit_file_name
    - data_audit_exe
    - data_audit_command
    - data_audit_execve_a0
    - data_audit_key

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires auditd running on the endpoint with audit rules covering the relevant
  syscalls/paths, and the Wazuh agent reading /var/log/audit/audit.log (default
  localfile entry). The detection looks for events where data_audit_type equals
  'PATH'; data_audit_file_name equals '/etc/ld.so.preload'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1574.006/T1574.006.md
  - https://eqllib.readthedocs.io/en/latest/analytics/fd9b987a-1101-4ed3-bda6-a70300eaf57e.html
  - https://attack.mitre.org/techniques/T1574/006/

response:
  message: >
    Modification of ld.so.preload detected on host $agent_name$. Matched
    data_audit_type: $data_audit_type$. Matched data_audit_file_name:
    $data_audit_file_name$. MITRE ATT&CK: T1574.006
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_audit_type
      type: other
    - field: data_audit_file_name
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.006
  custom_tags:
    - preload
    - linux
    - auditd
    - privilege_escalation
    - persistence
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_audit_type:/[Pp][Aa][Tt][Hh]/ AND data_audit_file_name:/\/[Ee][Tt][Cc]\/[Ll][Dd]\.[Ss][Oo]\.[Pp][Rr][Ee][Ll][Oo][Aa][Dd]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: linux-preload-hijack-via-preload-file-001
    name: Linux Preload Hijack Via Preload File
    reason: Detects the exact same /etc/ld.so.preload modification from Tetragon/auth.log telemetry instead of auditd PATH events; a match on the same host corroborates this alert with a second independent sensor and often captures the command that wrote the file.
  - id: linux-auditd-preload-hijack-library-calls-001
    name: Linux Auditd Preload Hijack Library Calls
    reason: The LD_PRELOAD environment-variable form of the same T1574.006 shared-object injection; attackers commonly test the libc hook with LD_PRELOAD before persisting it in /etc/ld.so.preload, making this the immediate precursor or companion of this file change.
  - id: linux-medusa-rootkit-001
    name: Linux Medusa Rootkit
    reason: Medusa is a userland LD_PRELOAD rootkit (UNC3886/VoidLink) that installs via /etc/ld.so.preload and backs the original loader up as backup_ld.so; its file-creation indicators on this host would confirm the preload entry points at a known rootkit.
  - id: 49aae26c-450e-448b-911d-b3c13d178dfc
    name: Linux Keylogging with Pam.d
    reason: Symbiote/Medusa-class preload rootkits hook authentication to harvest credentials; PAM system-auth/password-auth modification or TTY-input auditing on the same host is the credential-theft payload this preload injection exists to deliver.
  - id: a5b977d6-8a81-4475-91b9-49dbfcd941f7
    name: Remove Immutable File Attribute - Auditd
    reason: chattr -i unlocks a protected /etc/ld.so.preload so it can be edited, and chattr +i then locks the malicious loader and .so against removal; immutable-attribute changes on this host directly bracket this modification.
  - id: 106d7cbd-80ff-4985-b682-a7043e5acb72
    name: Loading of Kernel Module via Insmod
    reason: A loadable kernel module is the kernel-mode alternative to a userland preload rootkit; an insmod on the same host indicates the actor is laying a second, lower-level rootkit foothold alongside this preload injection.
  - id: linux-pkexec-privilege-escalation-001
    name: Linux pkexec Privilege Escalation
    reason: Writing /etc/ld.so.preload requires root; PwnKit (CVE-2021-4034) via pkexec is a common non-interactive root-gaining exploit and a likely privilege-escalation precursor that enabled this modification.
  - id: linux-ingress-tool-transfer-hunting-001
    name: Linux Ingress Tool Transfer Hunting
    reason: The malicious shared object named in the preload entry must first reach disk; curl/wget ingress on this host shortly before the change is the probable payload-delivery precursor.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Preload file / LD_PRELOAD / preload-rootkit artifact referenced on this host
    query: (data_process_exec_process_arguments:/.*[Ll][Dd]\.[Ss][Oo]\.[Pp][Rr][Ee][Ll][Oo][Aa][Dd].*/ OR data_process_exec_process_arguments:/.*[Ll][Dd]_[Pp][Rr][Ee][Ll][Oo][Aa][Dd].*/ OR data_process_exec_process_arguments:/.*[Bb][Aa][Cc][Kk][Uu][Pp]_[Ll][Dd]\.[Ss][Oo].*/ OR data_audit_command:/.*[Ll][Dd]\.[Ss][Oo]\.[Pp][Rr][Ee][Ll][Oo][Aa][Dd].*/)
    pivot_on:
    - host
    window: 2h
  - name: Shared object (.so) staged in a world-writable or temp directory
    query: (data_process_exec_process_arguments:/.*\/[Tt][Mm][Pp]\/.*\.[Ss][Oo].*/ OR data_process_exec_process_arguments:/.*\/[Dd][Ee][Vv]\/[Ss][Hh][Mm]\/.*\.[Ss][Oo].*/ OR data_process_exec_process_arguments:/.*\/[Vv][Aa][Rr]\/[Tt][Mm][Pp]\/.*\.[Ss][Oo].*/ OR data_process_exec_process_arguments:/.*\/[Rr][Uu][Nn]\/.*\.[Ss][Oo].*/)
    pivot_on:
    - host
    window: 2h
  - name: Download tool fetching a shared object or dropping into a world-writable path
    query: ((data_process_exec_process_binary:/.*\/[Cc][Uu][Rr][Ll]/ OR data_process_exec_process_binary:/.*\/[Ww][Gg][Ee][Tt]/ OR data_process_exec_process_binary:/.*\/[Ss][Cc][Pp]/ OR data_process_exec_process_binary:/.*\/[Tt][Ff][Tt][Pp]/) AND (data_process_exec_process_arguments:/.*\.[Ss][Oo].*/ OR data_process_exec_process_arguments:/.*\/[Tt][Mm][Pp]\/.*/ OR data_process_exec_process_arguments:/.*\/[Dd][Ee][Vv]\/[Ss][Hh][Mm]\/.*/ OR data_process_exec_process_arguments:/.*\/[Vv][Aa][Rr]\/[Tt][Mm][Pp]\/.*/))
    pivot_on:
    - host
    window: 4h
  - name: Immutable-attribute (chattr) change on this host
    query: (data_process_exec_process_binary:/.*\/[Cc][Hh][Aa][Tt][Tt][Rr]/ OR data_audit_execve_a0:/.*[Cc][Hh][Aa][Tt][Tt][Rr].*/ OR data_audit_command:/.*[Cc][Hh][Aa][Tt][Tt][Rr].*/)
    pivot_on:
    - host
    window: 2h
  - name: Kernel module load (insmod/modprobe/kmod) on this host
    query: (data_process_exec_process_binary:/.*\/[Ii][Nn][Ss][Mm][Oo][Dd]/ OR data_process_exec_process_binary:/.*\/[Mm][Oo][Dd][Pp][Rr][Oo][Bb][Ee]/ OR data_process_exec_process_binary:/.*\/[Kk][Mm][Oo][Dd]/ OR data_audit_command:/.*[Ii][Nn][Ss][Mm][Oo][Dd].*/ OR data_audit_command:/.*[Mm][Oo][Dd][Pp][Rr][Oo][Bb][Ee].*/)
    pivot_on:
    - host
    window: 24h
