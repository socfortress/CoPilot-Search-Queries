name: Potential Abuse of Linux Magic System Request Key
id: ea61bb82-a5e0-42e6-8537-91d29500f1b9
version: 1
schema_version: "1.0"
date: "2025-05-23"
author: Milad Cheraghi
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: ea61bb82-a5e0-42e6-8537-91d29500f1b9
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the potential abuse of the Linux Magic SysRq (System Request) key by
  adversaries with root or sufficient privileges to silently manipulate or
  destabilize a system. By writing to /proc/sysrq-trigger, they can crash the
  system, kill processes, or disrupt forensic analysis—all while bypassing
  standard logging. Though intended for recovery and debugging, SysRq can be
  misused as a stealthy post-exploitation tool. It is controlled via
  /proc/sys/kernel/sysrq or permanently through /etc/sysctl.conf. MITRE ATT&CK:
  T1059.004, T1529, T1489, T1499.

data_source:
  - Linux Auditd via Wazuh agent

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_audit_type:
              value: "PATH"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_audit_file_name:
                    value: "*/sysrq"
                    case_insensitive: true
              - wildcard:
                  data_audit_file_name:
                    value: "*/sysctl.conf"
                    case_insensitive: true
              - wildcard:
                  data_audit_file_name:
                    value: "*/sysrq-trigger"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_audit_type
    - data_audit_file_name
    - data_audit_exe
    - data_audit_command
    - data_audit_execve_a0
    - data_audit_key

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires auditd running on the endpoint with audit rules covering the relevant
  syscalls/paths, and the Wazuh agent reading /var/log/audit/audit.log (default
  localfile entry). The detection looks for events where data_audit_type equals
  'PATH'; data_audit_file_name matches '*/sysrq'; data_audit_file_name matches
  '*/sysctl.conf', among other conditions.

known_false_positives: >
  Legitimate administrative activity. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://www.kernel.org/doc/html/v4.10/_sources/admin-guide/sysrq.txt
  - https://docs.redhat.com/en/documentation/red_hat_enterprise_linux/4/html/reference_guide/s3-proc-sys-kernel
  - https://www.splunk.com/en_us/blog/security/threat-update-awfulshred-script-wiper.html
  - https://attack.mitre.org/techniques/T1059/004/
  - https://attack.mitre.org/techniques/T1529/
  - https://attack.mitre.org/techniques/T1489/
  - https://attack.mitre.org/techniques/T1499/

response:
  message: >
    Potential Abuse of Linux Magic System Request Key detected on host
    $agent_name$. Matched data_audit_type: $data_audit_type$. Matched
    data_audit_file_name: $data_audit_file_name$. MITRE ATT&CK: T1059.004,
    T1529, T1489, T1499
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_audit_type
      type: other
    - field: data_audit_file_name
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.004
    - T1529
    - T1489
    - T1499
  custom_tags:
    - abuse
    - magic
    - system
    - linux
    - auditd
    - execution
    - impact
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_audit_type:/[Pp][Aa][Tt][Hh]/ AND (data_audit_file_name:/.*\/[Ss][Yy][Ss][Rr][Qq]/ OR data_audit_file_name:/.*\/[Ss][Yy][Ss][Cc][Tt][Ll]\.[Cc][Oo][Nn][Ff]/ OR data_audit_file_name:/.*\/[Ss][Yy][Ss][Rr][Qq]-[Tt][Rr][Ii][Gg][Gg][Ee][Rr]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: linux-system-reboot-via-sysrq-001
    name: Linux System Reboot Via System Request Key
    reason: 'Confirming sibling: this detection catches the auditd PATH write to /proc/sysrq-trigger, while this rule catches the matching ''echo b > /proc/sysrq-trigger'' reboot command in process/full_log telemetry. Seeing both proves a forced AwfulShred-style reboot rather than an admin reading the file.'
  - id: linux-unix-shell-enable-all-sysrq-functions-001
    name: Linux Unix Shell Enable All SysRq Functions
    reason: 'Direct precursor: writing 1 to /proc/sys/kernel/sysrq enables all SysRq functions, which must happen before the trigger can crash or reboot the host. Its appearance just before this PATH event is the attacker arming the Magic SysRq key.'
  - id: linux-auditd-data-destruction-command-001
    name: Linux Auditd Data Destruction Command
    reason: 'Co-occurring wiper payload: AwfulShred corrupts files with ''rm -rf --no-preserve-root'' and then reboots via SysRq. Finding this on the same host turns a lone /proc write into a confirmed data-destruction incident.'
  - id: linux-dd-file-overwrite-001
    name: Linux DD File Overwrite
    reason: 'Co-occurring wiper primitive: dd overwriting devices or files from /dev/zero or /dev/urandom is the destructive action a SysRq crash is meant to finalise and hide (AwfulShred / Industroyer2).'
  - id: a3b7c9d2-4f5e-4b6d-8c1a-2d3f4e5b6c7a
    name: Linux Critical Directory Deletion
    reason: 'Co-occurring impact: rm -rf of /boot, /var/log, /etc or /dev destroys boot, config and log data; a SysRq reboot right after wiping /boot leaves an unbootable host, which is the wiper''s goal.'
  - id: linux-stop-services-001
    name: Linux Stop Services
    reason: 'Preceding impact (T1489): wipers stop databases, backup and security services (systemctl stop / SERVICE_STOP) to unlock files and disable defences before destroying data and forcing the SysRq reboot.'
  - id: 80915f59-9b56-4616-9de0-fd0dea6c12fe
    name: Linux Logs Clearing Attempts
    reason: 'Co-occurring anti-forensics: this rule''s own premise is SysRq used to disrupt forensic analysis, so rm/shred/unlink of log files on the same host is the complementary track-covering before the crash.'
  - id: bed26dea-4525-47f4-b24a-76e30e44ffb0
    name: Audit Rules Deleted Via Auditctl
    reason: 'Co-occurring anti-forensics that blinds this very detection: ''auditctl -D'' deletes the audit rules that generate these PATH events, so its presence near a SysRq write means the attacker is going dark on the same sensor.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Disk and file wiper tooling on this host
    query: ((data_process_exec_process_binary:/.*\/([Dd][Dd]|[Ww][Ii][Pp][Ee][Ff][Ss]|[Ss][Hh][Rr][Ee][Dd]|[Cc][Rr][Yy][Pp][Tt][Ss][Ee][Tt][Uu][Pp])/) OR (data_process_exec_process_binary:/.*\/[Mm][Kk][Ff][Ss].*/) OR (data_process_exec_process_arguments:/.*of=\/.*/) OR (full_log:/.*no-preserve-root.*/) OR (full_log:/.*\/[Dd][Ee][Vv]\/([Zz][Ee][Rr][Oo]|[Uu][Rr][Aa][Nn][Dd][Oo][Mm]).*/))
    pivot_on:
    - host
    window: 2h
  - name: Service and daemon termination on this host
    query: ((full_log:/.*SERVICE_STOP.*/) OR (full_log:/.*[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll].*(stop|disable|mask).*/) OR (data_process_exec_process_binary:/.*\/([Kk][Ii][Ll][Ll][Aa][Ll][Ll]|[Pp][Kk][Ii][Ll][Ll])/) OR (data_process_exec_process_arguments:/.*[Ss][Ee][Rr][Vv][Ii][Cc][Ee].*(stop|disable).*/))
    pivot_on:
    - host
    window: 2h
  - name: System shutdown or reboot commands on this host
    query: ((data_process_exec_process_binary:/.*\/([Rr][Ee][Bb][Oo][Oo][Tt]|[Ss][Hh][Uu][Tt][Dd][Oo][Ww][Nn]|[Hh][Aa][Ll][Tt]|[Pp][Oo][Ww][Ee][Rr][Oo][Ff][Ff]|[Tt][Ee][Ll][Ii][Nn][Ii][Tt])/) OR (data_process_exec_process_arguments:/.*[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll].*(reboot|poweroff|halt).*/) OR (full_log:/.*[Ss][Hh][Uu][Tt][Dd][Oo][Ww][Nn].*/))
    pivot_on:
    - host
    window: 1h
  - name: Log, journal and shell-history tampering on this host
    query: ((data_process_exec_process_arguments:/.*\/[Vv][Aa][Rr]\/[Ll][Oo][Gg].*/) OR (full_log:/.*\/[Vv][Aa][Rr]\/[Ll][Oo][Gg].*/) OR (data_process_exec_process_arguments:/.*\.[Bb][Aa][Ss][Hh]_[Hh][Ii][Ss][Tt][Oo][Rr][Yy].*/) OR (full_log:/.*[Jj][Oo][Uu][Rr][Nn][Aa][Ll][Cc][Tt][Ll].*(vacuum|rotate).*/) OR (data_process_exec_process_arguments:/.*[Hh][Ii][Ss][Tt][Oo][Rr][Yy].*-[Cc].*/))
    pivot_on:
    - host
    window: 2h
  - name: Kernel parameter and module tampering on this host
    query: ((data_process_exec_process_binary:/.*\/([Ss][Yy][Ss][Cc][Tt][Ll]|[Ii][Nn][Ss][Mm][Oo][Dd]|[Mm][Oo][Dd][Pp][Rr][Oo][Bb][Ee]|[Rr][Mm][Mm][Oo][Dd])/) OR (data_process_exec_process_arguments:/.*\/[Pp][Rr][Oo][Cc]\/[Ss][Yy][Ss]\/[Kk][Ee][Rr][Nn][Ee][Ll].*/) OR (full_log:/.*\/[Pp][Rr][Oo][Cc]\/[Ss][Yy][Ss]\/[Kk][Ee][Rr][Nn][Ee][Ll].*/) OR (data_process_exec_process_arguments:/.*[Kk][Ee][Rr][Nn][Ee][Ll]\.[Ss][Yy][Ss][Rr][Qq].*/))
    pivot_on:
    - host
    window: 4h
