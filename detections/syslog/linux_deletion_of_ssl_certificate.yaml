name: Suspicious SSL Certificate Deletion
id: 3c7e5d91-8f2b-4e6a-9d4c-5b1f2e7c8a9d
version: 1
schema_version: "1.0"
date: "2026-01-29"
author: SOCFORTRESS LLC
status: production
type: TTP

description: >
  Detects attempts to delete SSL certificate files (*.pem, *.crt) under
  /etc/ssl/certs using commands like rm, rm -f, or rm -rf. This may
  indicate malicious attempts to remove or tamper with certificates.

data_source:
  - Wazuh Agent Logs
  - Linux Auditd
  - Syslog

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            location: "/var/log/tetragon/tetragon.log"
        - wildcard:
            full_log: "*/etc/ssl/certs/*"
        - bool:
            should:
              - wildcard:
                  full_log: "*.pem*"
              - wildcard:
                  full_log: "*.crt*"
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  full_log: "*\"/usr/bin/rm\"*"
              - wildcard:
                  full_log: "*rm -f*"
              - wildcard:
                  full_log: "*rm -rf*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary
    - rule_mitre_id
    - rule_description
    - full_log

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-01-28 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-01-28 23:59:59.999"

how_to_implement: >
  Requires Linux endpoints with Wazuh agents configured to log full process
  execution including command-line arguments. Monitoring deletion of SSL
  certificate files can reveal tampering or malicious cleanup activity.

known_false_positives: >
  Legitimate certificate rotation or system maintenance by trusted users.

references:
  - https://attack.mitre.org/techniques/T1485/
  - https://tetragon.io/docs/

response:
  message: >
    Suspicious deletion of SSL certificates detected on $agent_name$.
    Command: $data_process_exec_process_binary$ $data_process_exec_process_arguments$
    Parent: $data_process_exec_parent_binary$
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 80
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 80
  threat_objects:
    - field: data_process_exec_process_binary
      type: process

tags:
  analytic_story:
    - File Tampering
    - Certificate Security
  asset_type: Linux
  mitre_attack_id:
    - T1485
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: full_log:/.*\/etc\/ssl\/certs\/.*/ AND (full_log:/.*\.pem.*/ OR full_log:/.*\.crt.*/) AND (full_log:/.*\/usr\/bin\/rm.*/ OR full_log:/.*rm -f.*/ OR full_log:/.*rm -rf.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: linux-private-keys-certificate-enumeration-001
    name: Linux Private Keys and Certificate Enumeration
    reason: Cert/key enumeration before deletion suggests theft or targeted tampering of trust material
  - id: a3b7c9d2-4f5e-4b6d-8c1a-2d3f4e5b6c7a
    name: Linux Critical Directory Deletion
    reason: Broader critical directory deletion could encompass the certificate store
  - id: linux-auditd-data-destruction-command-001
    name: Linux Auditd Data Destruction Command
    reason: Certificate removal may be part of data destruction
  - id: linux-auditd-ssh-config-keys-deletion-001
    name: Linux Auditd SSH Config Keys Deletion
    reason: Parallel deletion of SSH keys indicates wiping of trust and authentication material
  - id: de25eeb8-3655-4643-ac3a-b662d3f26b6b
    name: Disable Or Stop Services
    reason: TLS-dependent services are often stopped or disabled around certificate removal
  - id: linux-ingress-tool-transfer-hunting-001
    name: Linux Ingress Tool Transfer Hunting
    reason: Rogue CA install usually follows removal; tool download may supply replacement certs
  - id: 80915f59-9b56-4616-9de0-fd0dea6c12fe
    name: Linux Logs Clearing Attempts
    reason: Log clearing frequently accompanies trust-store tampering
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Certificate store modifications and CA updates
    query: data_process_exec_process_binary:/.*(\\/[Uu][Pp][Dd][Aa][Tt][Ee]\-[Cc][Aa]\-[Cc][Ee][Rr][Tt][Ii][Ff][Ii][Cc][Aa][Tt][Ee][Ss]|\\/[Uu][Pp][Dd][Aa][Tt][Ee]\-[Cc][Aa]\-[Tt][Rr][Uu][Ss][Tt]|\\/[Cc][Pp]|\\/[Mm][Vv]|\\/[Oo][Pp][Ee][Nn][Ss][Ss][Ll]|\\/[Tt][Rr][Uu][Ss][Tt])/ AND data_process_exec_process_arguments:/.*(\/[Ee][Tt][Cc]\/[Ss][Ss][Ll]|\/[Uu][Ss][Rr]\/[Ll][Oo][Cc][Aa][Ll]\/[Ss][Hh][Aa][Rr][Ee]\/[Cc][Aa]\-[Cc][Ee][Rr][Tt][Ii][Ff][Ii][Cc][Aa][Tt][Ee][Ss]|\/[Ee][Tt][Cc]\/[Pp][Kk][Ii]|\.[Cc][Rr][Tt]|\.[Pp][Ee][Mm]|[Uu][Pp][Dd][Aa][Tt][Ee]\-[Cc][Aa]).*/
    pivot_on: host
    window: 2h
  - name: Certificate or private key enumeration
    query: data_process_exec_process_binary:/.*(\\/[Ff][Ii][Nn][Dd]|\\/[Ll][Oo][Cc][Aa][Tt][Ee]|\\/[Ll][Ss]|\\/[Cc][Aa][Tt]|\\/[Gg][Rr][Ee][Pp])/ AND data_process_exec_process_arguments:/.*(\.[Pp][Ee][Mm]|\.[Cc][Rr][Tt]|\.[Kk][Ee][Yy]|[Ii][Dd]_[Rr][Ss][Aa]|\/[Ee][Tt][Cc]\/[Ss][Ss][Ll]\/[Pp][Rr][Ii][Vv][Aa][Tt][Ee]).*/
    pivot_on: host
    window: 2h
  - name: TLS verification bypass in downloads
    query: data_process_exec_process_binary:/.*(\\/[Cc][Uu][Rr][Ll]|\\/[Ww][Gg][Ee][Tt])/ AND data_process_exec_process_arguments:/.*(\-[Kk]|\-\-[Ii][Nn][Ss][Ee][Cc][Uu][Rr][Ee]|\-\-[Nn][Oo]\-[Cc][Hh][Ee][Cc][Kk]\-[Cc][Ee][Rr][Tt][Ii][Ff][Ii][Cc][Aa][Tt][Ee]).*/
    pivot_on: host
    window: 1h
  - name: Recursive deletion or wipe tooling
    query: (data_process_exec_process_binary:/.*(\\/[Ss][Hh][Rr][Ee][Dd]|\\/[Ww][Ii][Pp][Ee][Ff][Ss])/ OR (data_process_exec_process_binary:/.*(\\/[Rr][Mm])/ AND data_process_exec_process_arguments:/.*(\-[Rr][Ff]|\-[Ff][Rr]|\-\-[Nn][Oo]\-[Pp][Rr][Ee][Ss][Ee][Rr][Vv][Ee]\-[Rr][Oo][Oo][Tt]).*/))
    pivot_on: host
    window: 2h
