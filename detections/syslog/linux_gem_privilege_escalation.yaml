name: Linux Gem Privilege Escalation
id: linux-gem-privilege-escalation-001
version: 1
schema_version: "1.0"
date: "2026-02-04"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  Detects the execution of Ruby Gem with elevated privileges that could lead to 
  privilege escalation. The gem command can execute arbitrary code through the 
  'open' command with -e flag or 'exec' command. If gem is granted sudo rights, 
  attackers can spawn shells or execute system commands as root.

data_source:
  - auth.log
  - Tetragon

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - wildcard:
            full_log: "*gem*"
        - bool:
            should:
              - wildcard:
                  full_log: "*open*"
              - wildcard:
                  full_log: "*exec*"
              - wildcard:
                  full_log: "*-e*"
              - wildcard:
                  full_log: "*system(*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-04 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-04 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with auth.log 
  monitoring and Tetragon process execution logging enabled. Ruby and gem must 
  be installed on the system.

known_false_positives: >
  Ruby developers may use gem with various commands legitimately. However, the 
  combination of sudo + gem open/exec with shell commands (-e, system()) is 
  rarely legitimate. Filter based on known development environments.

references:
  - https://gtfobins.github.io/gtfobins/gem/
  - https://attack.mitre.org/techniques/T1548/003/

response:
  message: >
    Gem privilege escalation detected on $agent_name$. 
    The sudo gem open/exec pattern can execute arbitrary commands as root. 
    MITRE ATT&CK: T1548.003
  risk_score: 30
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 30
  threat_objects: []

tags:
  analytic_story:
    - Linux Privilege Escalation
    - Linux Living Off The Land
  asset_type: Linux
  mitre_attack_id:
    - T1548.003
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: full_log:/.*gem.*/ AND (full_log:/.*open.*/ OR full_log:/.*exec.*/ OR full_log:/.*-e.*/ OR full_log:/.*system\(.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: linux-ruby-privilege-escalation-001
    name: Linux Ruby Privilege Escalation
    reason: Same Ruby sudo-abuse family; an attacker blocked on gem often tries ruby -e next.
  - id: linux-sudo-or-su-execution-001
    name: Linux Sudo Or Su Execution
    reason: The escalation runs through sudo; shows the invoking account and surrounding sudo use.
  - id: linux-auditd-possible-access-sudoers-file-001
    name: Linux Auditd Possible Access To Sudoers File
    reason: 'Precursor: attackers read sudoers to learn which binary is allowed under sudo.'
  - id: linux-whoami-user-discovery-001
    name: Linux Whoami User Discovery
    reason: Identity check typically follows a successful root shell.
  - id: linux-find-privilege-escalation-001
    name: Linux Find Privilege Escalation
    reason: Sibling sudo GTFOBins attempt commonly tried on the same host.
  - id: linux-setuid-using-chmod-utility-001
    name: Linux Setuid Using Chmod Utility
    reason: 'Root follow-on: planting a SUID shell for persistence.'
  - id: 759d0d51-bc99-4b5e-9add-8f5b2c8e7512
    name: Creation Of An User Account
    reason: 'Root follow-on: backdoor account creation.'
  - id: linux-ingress-tool-transfer-hunting-001
    name: Linux Ingress Tool Transfer Hunting
    reason: Enumeration or attack tooling downloaded before the escalation attempt.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: sudo -l and sudoers discovery
    query: ((full_log:/.*sudo.*/ AND full_log:/.*-l.*/) OR full_log:/.*\/etc\/sudoers.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/
    pivot_on: host
    window: 4h
  - name: Shell spawned by ruby/gem
    query: ((full_log:/.*gem.*/ OR full_log:/.*ruby.*/) AND (full_log:/.*\/bin\/sh.*/ OR full_log:/.*\/bin\/bash.*/ OR full_log:/.*system\(.*/)) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/
    pivot_on: host
    window: 2h
  - name: Post-root account and credential access
    query: (full_log:/.*useradd.*/ OR full_log:/.*adduser.*/ OR full_log:/.*\/etc\/shadow.*/ OR full_log:/.*authorized_keys.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/
    pivot_on: host
    window: 4h
  - name: Other GTFOBins sudo shells
    query: (full_log:/.*sudo.*/ AND (full_log:/.*awk.*/ OR full_log:/.*find .*-exec.*/ OR full_log:/.*python.* -c.*/ OR full_log:/.*perl -e.*/ OR full_log:/.*make --eval.*/)) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/
    pivot_on: host
    window: 2h
