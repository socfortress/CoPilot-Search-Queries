name: Linux doas Execution Detection
id: lnx-doas-001
version: 1
schema_version: "1.0"
date: "2026-01-30"
author: SOCFORTRESS LLC
status: production
type: TTP
description: >
  Detects execution of the `doas` command on Linux endpoints. This may indicate
  privilege escalation or administrative activity. Monitoring `doas` usage
  helps identify potentially unauthorized elevated access attempts.
data_source:
  - Wazuh Agent Logs
  - Linux Auditd
  - Syslog
search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - wildcard: { full_log: "*comm=\"doas\"*" }
              - wildcard: { full_log: "*exe=\"/usr/bin/doas\"*" }
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
_source:
  - timestamp
  - agent_name
  - data_process_exec_process_binary
  - data_process_exec_process_arguments
  - rule_mitre_id
  - rule_description
  - full_log
parameters:
  AGENT_NAME:
    description: "Agent name to filter"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time"
    type: datetime
    required: true
    example: "2026-01-28 00:00:00.000"
  END_TIME:
    description: "Query end time"
    type: datetime
    required: true
    example: "2026-01-28 23:59:59.999"
how_to_implement: >
  Requires Linux endpoints with Wazuh agents capturing process execution.
  Monitoring `doas` command usage helps detect unauthorized or abnormal
  privilege escalation activity.
known_false_positives: >
  Legitimate administrative use by authorized users.
references:
  - https://man.openbsd.org/doas
  - https://attack.mitre.org/techniques/T1548/
response:
  message: >
    Suspicious `doas` command execution detected on $agent_name$.
    Command: $full_log$
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: full_log
      type: process
tags:
  analytic_story:
    - Linux Privilege Escalation
  asset_type: Linux
  mitre_attack_id:
    - T1548
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (full_log:/.*comm.*doas.*/ OR full_log:/.*\/usr\/bin\/doas.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 5f3b8a12-2d4c-4e7b-9c6d-8a1f2b4c9e3f
    name: Doas Privilege Escalation Detection
    reason: Tetragon view of the same doas elevation; corroborates the executed command.
  - id: linux-sudo-or-su-execution-001
    name: Linux Sudo Or Su Execution
    reason: Alternative privilege-elevation tool used by the same actor.
  - id: linux-pkexec-privilege-escalation-001
    name: Linux pkexec Privilege Escalation
    reason: Another escalation path attempted when doas is limited.
  - id: linux-setuid-using-chmod-utility-001
    name: Linux Setuid Using Chmod Utility
    reason: Setuid abuse is a common root persistence step after doas access.
  - id: linux-auditd-crontab-listing-001
    name: Linux Auditd Crontab Listing
    reason: Root access frequently followed by cron inspection/persistence.
  - id: 6b14bac8-3e3a-4324-8109-42f0546a347f
    name: Scheduled Cron Task/Job - Linux
    reason: Root-level persistence via cron after elevation.
  - id: linux-whoami-user-discovery-001
    name: Linux Whoami User Discovery
    reason: Checking identity before and after elevation.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Commands run via doas
    query: (data_process_exec_process_binary:/.*doas.*/ OR data_process_exec_process_arguments:/.*doas.*/) AND NOT _exists_:data_win_system_eventID
    pivot_on: host
    window: 4h
  - name: Other elevation tools
    query: (data_process_exec_process_binary:/.*(sudo|su|pkexec).*/) AND NOT _exists_:data_win_system_eventID
    pivot_on: host
    window: 4h
  - name: Privileged config or credential file access
    query: (full_log:/.*(\/etc\/shadow|\/etc\/doas\.conf|\/etc\/sudoers|authorized_keys).*/) AND NOT rule_groups:/.*windows.*/
    pivot_on: host
    window: 4h
  - name: Account or persistence changes
    query: (data_process_exec_process_binary:/.*(useradd|usermod|adduser|chmod|crontab|systemctl).*/) AND NOT _exists_:data_win_system_eventID
    pivot_on: host
    window: 4h
