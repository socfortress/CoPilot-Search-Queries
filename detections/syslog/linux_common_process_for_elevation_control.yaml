name: Linux Common Process For Elevation Control
id: linux-common-process-elevation-control-001
version: 1
schema_version: "1.0"
date: "2026-02-04"
author: SOCFortress LLC
status: production
type: Hunting

description: >
  Detects the execution of common Linux processes used for elevation control, such 
  as chmod, chown, chattr, and setcap. These processes are often abused by adversaries 
  to gain persistence or escalate privileges on compromised hosts. If confirmed 
  malicious, this behavior could allow attackers to modify file attributes, change 
  file ownership, or set capabilities, potentially leading to unauthorized access 
  and control over critical system resources.

data_source:
  - Tetragon
  - auth.log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - wildcard:
                  full_log: "*\"/usr/bin/chmod\"*"
              - wildcard:
                  full_log: "*\"/usr/bin/chown\"*"
              - wildcard:
                  full_log: "*\"/usr/bin/chattr\"*"
              - wildcard:
                  full_log: "*\"/usr/sbin/setcap\"*"
              - wildcard:
                  full_log: "*\"/usr/bin/setfacl\"*"
              - wildcard:
                  full_log: "*\"/usr/bin/lchown\"*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-04 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-04 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with Tetragon 
  process execution logging enabled. Auth.log monitoring provides sudo command 
  visibility for these operations when executed with elevated privileges.

known_false_positives: >
  Administrators and system processes frequently use these commands for legitimate 
  file management. Filter based on known administrative users, expected file paths, 
  and automation scripts.

references:
  - https://attack.mitre.org/techniques/T1548/001/
  - https://github.com/Neo23x0/auditd/blob/master/audit.rules#L285-L297
  - https://github.com/microsoft/MSTIC-Sysmon/blob/main/linux/configs/attack-based/privilege_escalation/T1548.001_ElevationControl_CommonProcesses.xml

response:
  message: >
    Elevation control process detected on $agent_name$. 
    Commands like chmod, chown, chattr may indicate privilege escalation attempts. 
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 25
  severity: low
  risk_objects:
    - field: agent_name
      type: system
      score: 25
  threat_objects: []

tags:
  analytic_story:
    - Linux Persistence Techniques
    - China-Nexus Threat Activity
    - Linux Living Off The Land
    - Salt Typhoon
    - Linux Privilege Escalation
  asset_type: Linux
  mitre_attack_id:
    - T1548.001
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (full_log:/.*\/usr\/bin\/chmod.*/ OR full_log:/.*\/usr\/bin\/chown.*/ OR full_log:/.*\/usr\/bin\/chattr.*/ OR full_log:/.*\/usr\/sbin\/setcap.*/ OR full_log:/.*\/usr\/bin\/setfacl.*/ OR full_log:/.*\/usr\/bin\/lchown.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: linux-setuid-using-chmod-utility-001
    name: Linux Setuid Using Chmod Utility
    reason: chmod u+s is the specific elevation-control use of these tools; confirms an actual setuid grant
  - id: linux-setuid-using-setcap-utility-001
    name: Linux Setuid Using Setcap Utility
    reason: setcap granting cap_setuid is the capability-based variant of the same elevation
  - id: 6419afd1-3742-47a5-a7e6-b50386cd15f8
    name: Chmod Targeting Sensitive Directories
    reason: chmod on sensitive directories shows whether permission changes target system paths
  - id: linux-sudo-or-su-execution-001
    name: Linux Sudo Or Su Execution
    reason: identifies whether the permission change ran under sudo/su and as which user
  - id: fa4aaed5-4fe0-498d-bbc0-08e3346387ba
    name: Copy Passwd Or Shadow From TMP Path
    reason: permission edits alongside passwd/shadow copies indicate credential-file tampering
  - id: linux-sudoers-tmp-file-creation-001
    name: Linux Sudoers Tmp File Creation
    reason: chmod/chown around sudoers edits indicate a persistent privilege grant
  - id: 1182f3b3-e716-4efa-99ab-d2685d04360f
    name: History File Deletion
    reason: history cleanup after permission changes indicates anti-forensics
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Setuid/setgid/capability grants
    query: (data_process_exec_process_binary:/.*\/([Cc][Hh][Mm][Oo][Dd]|[Ss][Ee][Tt][Cc][Aa][Pp])/ AND data_process_exec_process_arguments:/.*([+][Ss]|[24]7[0-9][0-9]|[Cc][Aa][Pp]_[Ss][Ee][Tt][Uu][Ii][Dd]).*/)
    pivot_on:
    - host
    window: 2h
  - name: chmod/chown/chattr/setfacl on credential or sudo files
    query: data_process_exec_process_binary:/.*\/([Cc][Hh][Mm][Oo][Dd]|[Cc][Hh][Oo][Ww][Nn]|[Cc][Hh][Aa][Tt][Tt][Rr]|[Ss][Ee][Tt][Ff][Aa][Cc][Ll])/ AND data_process_exec_process_arguments:/.*(\/[Ee][Tt][Cc]\/([Ss][Hh][Aa][Dd][Oo][Ww]|[Pp][Aa][Ss][Ss][Ww][Dd]|[Ss][Uu][Dd][Oo][Ee][Rr][Ss])|\/[Rr][Oo][Oo][Tt]|[Ss][Ss][Hh]).*/
    pivot_on:
    - host
    window: 2h
  - name: Persistence tooling (cron, accounts, visudo)
    query: (data_process_exec_process_binary:/.*\/([Cc][Rr][Oo][Nn][Tt][Aa][Bb]|[Uu][Ss][Ee][Rr][Aa][Dd][Dd]|[Uu][Ss][Ee][Rr][Mm][Oo][Dd]|[Vv][Ii][Ss][Uu][Dd][Oo])/)
    pivot_on:
    - host
    window: 4h
  - name: Download and execute staging
    query: data_process_exec_process_binary:/.*\/([Cc][Uu][Rr][Ll]|[Ww][Gg][Ee][Tt]|[Ff][Tt][Pp]|[Tt][Ff][Tt][Pp]|[Nn][Cc]|[Nn][Cc][Aa][Tt]|[Ss][Oo][Cc][Aa][Tt])/
    pivot_on:
    - host
    window: 2h
  - name: Immutable attribute or history tampering
    query: (data_process_exec_process_binary:/.*\/([Cc][Hh][Aa][Tt][Tt][Rr]|[Ss][Hh][Rr][Ee][Dd]|[Ss][Ee][Tt][Ff][Aa][Cc][Ll])/ OR data_process_exec_process_arguments:/.*[Hh][Ii][Ss][Tt][Ff][Ii][Ll][Ee].*/ OR data_process_exec_process_arguments:/.*[Bb][Aa][Ss][Hh]_[Hh][Ii][Ss][Tt][Oo][Rr][Yy].*/)
    pivot_on:
    - host
    window: 4h
