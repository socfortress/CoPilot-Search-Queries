name: Suspicious Emacs Eval Execution via Sudo
id: 8c2f7b91-4a9e-4f6d-9d6e-3a0b6c91f4aa
version: 1
schema_version: "1.0"
date: "2026-01-29"
author: SOCFORTRESS LLC
status: production
type: TTP

description: >
  Detects suspicious usage of Emacs with the --eval argument executed in
  conjunction with sudo. Emacs --eval can be abused to execute arbitrary
  Lisp code, and when combined with elevated privileges, may indicate
  privilege escalation or defense evasion techniques.

data_source:
  - Wazuh Agent Logs
  - Linux Auditd
  - Syslog

search:
  index_pattern: "${INDEX_PATTERN}"

  size: 100

  sort:
    - timestamp: desc

  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"

        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"

        - wildcard:
            full_log: "*emacs*--eval*"

        - wildcard:
            full_log: "*sudo*"

        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"

      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"

  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary
    - rule_mitre_id
    - rule_description
    - full_log

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"

  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"

  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-01-28 00:00:00.000"

  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-01-28 23:59:59.999"

how_to_implement: >
  This detection requires Linux endpoints with Wazuh agents configured to
  capture full command-line arguments and parent process information.
  Monitoring interactive editors invoked with elevated privileges is
  critical for detecting living-off-the-land abuse.

known_false_positives: >
  Advanced users or administrators may legitimately use Emacs with sudo
  for system configuration tasks. Consider allowlisting known admin users
  or trusted maintenance workflows.

references:
  - https://attack.mitre.org/techniques/T1059/
  - https://gtfobins.github.io/gtfobins/emacs/

response:
  message: >
    Suspicious Emacs execution with --eval detected on $agent_name$ using sudo.
    Command: $data_process_exec_process_binary$ $data_process_exec_process_arguments$
    Parent: $data_process_exec_parent_binary$
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 70
  severity: high

  risk_objects:
    - field: agent_name
      type: system
      score: 70

  threat_objects:
    - field: data_process_exec_process_binary
      type: process

tags:
  analytic_story:
    - Privilege Escalation
    - Living off the Land
  asset_type: Linux
  mitre_attack_id:
    - T1059
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: full_log:/.*emacs.*--eval.*/ AND full_log:/.*sudo.*/ AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: linux-sudo-or-su-execution-001
    name: Linux Sudo Or Su Execution
    reason: The sudo invocation itself is the escalation vector; this shows the wider sudo/su use by the user
  - id: linux-common-process-elevation-control-001
    name: Linux Common Process For Elevation Control
    reason: Related elevation-control process activity on the same host
  - id: linux-auditd-possible-access-sudoers-file-001
    name: Linux Auditd Possible Access To Sudoers File
    reason: Sudoers inspection precedes finding an exploitable sudo rule such as emacs
  - id: linux-find-privilege-escalation-001
    name: Linux Find Privilege Escalation
    reason: Sibling GTFOBins escalation via find; attackers try multiple binaries
  - id: linux-gdb-privilege-escalation-001
    name: Linux GDB Privilege Escalation
    reason: Sibling GTFOBins escalation via gdb
  - id: linux-setuid-using-chmod-utility-001
    name: Linux Setuid Using Chmod Utility
    reason: Root shell from emacs is often followed by setuid persistence
  - id: linux-auditd-add-user-001
    name: Linux Auditd Add User
    reason: Post-escalation account creation for persistence
  - id: linux-whoami-user-discovery-001
    name: Linux Whoami User Discovery
    reason: whoami/id verification typically follows a successful escalation
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Sudo misconfiguration discovery
    query: data_process_exec_process_binary:/.*(\\/[Ss][Uu][Dd][Oo])/ AND data_process_exec_process_arguments:/.*(\-[Ll]|\-\-[Ll][Ii][Ss][Tt]).*/
    pivot_on: host
    window: 2h
  - name: Other GTFOBins programs launched via sudo
    query: data_process_exec_process_binary:/.*(\\/[Ss][Uu][Dd][Oo])/ AND data_process_exec_process_arguments:/.*([Vv][Ii][Mm]|[Nn][Aa][Nn][Oo]|[Ll][Ee][Ss][Ss]|[Aa][Ww][Kk]|[Ff][Ii][Nn][Dd]|[Pp][Yy][Tt][Hh][Oo][Nn]|[Pp][Ee][Rr][Ll]|[Rr][Uu][Bb][Yy]|[Gg][Dd][Bb]|[Ee][Nn][Vv]|\-\-[Ee][Vv][Aa][Ll]).*/
    pivot_on: host
    window: 2h
  - name: Root-level persistence or account changes
    query: data_process_exec_process_binary:/.*(\\/[Uu][Ss][Ee][Rr][Aa][Dd][Dd]|\\/[Uu][Ss][Ee][Rr][Mm][Oo][Dd]|\\/[Aa][Dd][Dd][Uu][Ss][Ee][Rr]|\\/[Pp][Aa][Ss][Ss][Ww][Dd]|\\/[Cc][Hh][Pp][Aa][Ss][Ss][Ww][Dd]|\\/[Vv][Ii][Ss][Uu][Dd][Oo]|\\/[Cc][Hh][Mm][Oo][Dd]|\\/[Cc][Hh][Oo][Ww][Nn])/ AND data_process_exec_process_arguments:/.*([Ss][Uu][Dd][Oo][Ee][Rr][Ss]|\/[Ee][Tt][Cc]\/[Pp][Aa][Ss][Ss][Ww][Dd]|\/[Ee][Tt][Cc]\/[Ss][Hh][Aa][Dd][Oo][Ww]|[Uu]+[Ss]|4755|[Nn][Oo][Pp][Aa][Ss][Ss][Ww][Dd]|\-[Aa][Gg]).*/
    pivot_on: host
    window: 2h
  - name: Credential file access
    query: data_process_exec_process_binary:/.*(\\/[Cc][Aa][Tt]|\\/[Ll][Ee][Ss][Ss]|\\/[Gg][Rr][Ee][Pp]|\\/[Cc][Pp]|\\/[Hh][Ee][Aa][Dd]|\\/[Tt][Aa][Ii][Ll])/ AND data_process_exec_process_arguments:/.*(\/[Ee][Tt][Cc]\/[Ss][Hh][Aa][Dd][Oo][Ww]|\/[Ee][Tt][Cc]\/[Ss][Uu][Dd][Oo][Ee][Rr][Ss]|[Ii][Dd]_[Rr][Ss][Aa]|\.[Ss][Ss][Hh]\/).*/
    pivot_on: host
    window: 2h
