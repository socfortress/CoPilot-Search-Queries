name: Linux OpenVPN Privilege Escalation
id: linux-openvpn-privilege-escalation-001
version: 1
schema_version: "1.0"
date: "2026-02-04"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  Detects the execution of OpenVPN with elevated privileges, specifically when 
  combined with the --dev, --script-security, and --up options. This GTFOBins 
  technique abuses OpenVPN's script execution capability to run arbitrary commands 
  as root, potentially leading to full system compromise.

data_source:
  - auth.log
  - Tetragon

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - wildcard:
            full_log: "*openvpn*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-04 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-04 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with auth.log 
  monitoring enabled. Tetragon provides additional process execution visibility 
  including the commands executed via OpenVPN's --up scripts.

known_false_positives: >
  Legitimate VPN configurations may use --up scripts for routing or DNS configuration. 
  Filter based on known administrative activities and expected script paths.

references:
  - https://gtfobins.github.io/gtfobins/openvpn/
  - https://en.wikipedia.org/wiki/OpenVPN
  - https://attack.mitre.org/techniques/T1548/003/

response:
  message: >
    OpenVPN privilege escalation attempt detected on $agent_name$. 
    The openvpn --script-security --up pattern can execute arbitrary commands as root. 
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 30
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 30
  threat_objects: []

tags:
  analytic_story:
    - Linux Privilege Escalation
    - Linux Living Off The Land
  asset_type: Linux
  mitre_attack_id:
    - T1548.003
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: full_log:/.*openvpn.*/ AND full_log:/.*--dev.*/ AND full_log:/.*--script-security.*/ AND full_log:/.*--up.*/ AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: linux-sudo-or-su-execution-001
    name: Linux Sudo Or Su Execution
    reason: Abuse requires sudo openvpn; sudo/su execution identifies the invoking account and other elevated commands
  - id: linux-setuid-using-chmod-utility-001
    name: Linux Setuid Using Chmod Utility
    reason: The --up script commonly plants a setuid shell for persistent root
  - id: 6a50f16c-3b7b-42d1-b081-0fdd3ba70a73
    name: User Added To Root/Sudoers Group Using Usermod
    reason: Root obtained through the up script is commonly followed by adding users to sudoers
  - id: 26f86252-1549-45e1-a212-eb26840e86bc
    name: File Download or Read to Pipe Execution
    reason: Up-script payloads often fetch and pipe remote content into a shell
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: openvpn run with script hooks
    query: (data_process_exec_process_binary:/.*\/(openvpn)/ AND data_process_exec_process_arguments:/.*(script-security|--up|--down|--dev).*/)
    pivot_on: host
    window: 1h
  - name: Shells spawned with interactive or command flags
    query: (data_process_exec_process_binary:/.*\/(bash|sh|dash|zsh)/ AND data_process_exec_process_arguments:/.*(-p|-c|-i).*/)
    pivot_on: host
    window: 1h
  - name: Setuid or capability planting
    query: (data_process_exec_process_binary:/.*\/(chmod|setcap)/ AND data_process_exec_process_arguments:/.*(\+s|[2467]755|[2467]777|cap_setuid).*/)
    pivot_on: host
    window: 2h
  - name: Account and sudoers manipulation
    query: data_process_exec_process_binary:/.*\/(useradd|usermod|adduser|chpasswd|passwd|visudo)/
    pivot_on: host
    window: 4h
  - name: Tunnel interface and route changes
    query: (data_process_exec_process_binary:/.*\/(ip|ifconfig|route)/ AND data_process_exec_process_arguments:/.*(tun|tap|route add|addr add).*/)
    pivot_on: host
    window: 2h
