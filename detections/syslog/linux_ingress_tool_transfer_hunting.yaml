name: Linux Ingress Tool Transfer Hunting
id: linux-ingress-tool-transfer-hunting-001
version: 1
schema_version: "1.0"
date: "2026-02-04"
author: SOCFortress LLC
status: production
type: Hunting

description: >
  Detects the use of 'curl' and 'wget' commands within a Linux environment for 
  potential ingress tool transfer. These utilities are commonly used for downloading 
  files, which can indicate potential malicious tool downloads. Monitoring helps 
  identify and differentiate between normal and potentially harmful usage.

data_source:
  - Tetragon

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - wildcard:
                  full_log: "*\"/usr/bin/curl\"*"
              - wildcard:
                  full_log: "*\"/usr/bin/wget\"*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-04 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-04 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with Tetragon 
  process execution logging enabled. Tetragon captures full command-line arguments 
  and network connection details via kprobes.

known_false_positives: >
  Legitimate use of curl and wget for system updates, package downloads, API calls, 
  and administrative tasks. Filter based on known administrative patterns, expected 
  URLs, and authorized users.

references:
  - https://gtfobins.github.io/gtfobins/curl/
  - https://gtfobins.github.io/gtfobins/wget/
  - https://curl.se/docs/manpage.html
  - https://attack.mitre.org/techniques/T1105/

response:
  message: >
    Ingress tool transfer activity detected on $agent_name$. 
    curl/wget execution may indicate file download activity. 
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 25
  severity: low
  risk_objects:
    - field: agent_name
      type: system
      score: 25
  threat_objects: []

tags:
  analytic_story:
    - Ingress Tool Transfer
    - Linux Living Off The Land
    - XorDDos
    - NPM Supply Chain Compromise
  asset_type: Linux
  mitre_attack_id:
    - T1105
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (full_log:/.*\/usr\/bin\/curl.*/ OR full_log:/.*\/usr\/bin\/wget.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a2d9e2f3-0f43-4c7a-bcd9-9acfc0d723aa
    name: Suspicious Download and Execute Pattern via Curl/Wget
    reason: 'Narrower form: download chained straight into execution.'
  - id: cf610c15-ed71-46e1-bdf8-2bd1a99de6c4
    name: Download File To Potentially Suspicious Directory Via Wget
    reason: Downloads landing in /tmp or similar are the high-risk subset of generic curl/wget use.
  - id: 26f86252-1549-45e1-a212-eb26840e86bc
    name: File Download or Read to Pipe Execution
    reason: Download-to-shell pipe is the execution step after the transfer.
  - id: a39d7fa7-3fbd-4dc2-97e1-d87f546b1bbc
    name: Program Executions in Suspicious Folders
    reason: Downloaded tool is then run from a staging folder.
  - id: 5cd16c8f-44a6-4654-81e7-a84d6db507d4
    name: Process Execution From Shared Memory Directory
    reason: Staging and running in /dev/shm after download.
  - id: e2f3g4h5-6789-1011-1213-141516171819
    name: Linux File Permission Modification Detection
    reason: chmod +x on the downloaded file is the standard next step.
  - id: b86d356d-6093-443d-971c-9b07db583c68
    name: Suspicious Curl Change User Agents - Linux
    reason: Spoofed curl user agents indicate evasive, malicious transfers.
  - id: f7158a64-6204-4d6d-868a-6e6378b467e0
    name: Suspicious C2 Activities
    reason: If the tool is an implant, C2 beaconing follows.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: chmod +x on staged files
    query: (full_log:/.*chmod.*/ AND (full_log:/.*\+x.*/ OR full_log:/.*7[0-7][0-7].*/) AND (full_log:/.*\/tmp\/.*/ OR full_log:/.*\/dev\/shm\/.*/ OR full_log:/.*\/var\/tmp\/.*/)) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/
    pivot_on: host
    window: 4h
  - name: Execution from staging directories
    query: ((full_log:/.*execve.*/ OR full_log:/.*exec.*/) AND (full_log:/.*\/tmp\/.*/ OR full_log:/.*\/dev\/shm\/.*/ OR full_log:/.*\/var\/tmp\/.*/)) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/
    pivot_on: host
    window: 4h
  - name: Download piped to shell
    query: ((full_log:/.*curl.*/ OR full_log:/.*wget.*/) AND (full_log:/.*\|.*sh.*/ OR full_log:/.*\|.*bash.*/ OR full_log:/.*-O- .*/ OR full_log:/.*-o \/tmp.*/)) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/
    pivot_on: host
    window: 4h
  - name: Raw-IP or paste-site download targets
    query: ((full_log:/.*curl.*/ OR full_log:/.*wget.*/) AND (full_log:/.*https?:\/\/[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}.*/ OR full_log:/.*pastebin.*/ OR full_log:/.*transfer\.sh.*/ OR full_log:/.*raw\.githubusercontent.*/)) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/
    pivot_on: host
    window: 24h
  - name: Persistence after transfer
    query: (full_log:/.*crontab.*/ OR full_log:/.*systemctl.*enable.*/ OR full_log:/.*\.bashrc.*/ OR full_log:/.*authorized_keys.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/
    pivot_on: host
    window: 6h
