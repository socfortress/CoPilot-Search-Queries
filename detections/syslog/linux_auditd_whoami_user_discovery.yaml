name: Linux Whoami User Discovery
id: linux-whoami-user-discovery-001
version: 1
schema_version: "1.0"
date: "2026-02-03"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  Detects the suspicious use of the whoami command, which may indicate an attacker 
  trying to gather information about the current user account on a compromised system. 
  The whoami command is commonly used to verify user privileges and identity, especially 
  during initial stages of an attack to assess the level of access.

data_source:
  - Tetragon
  - Linux Auditd
  - auth.log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - wildcard:
            full_log: "*whoami*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-03 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-03 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with Tetragon 
  or auditd process execution logging enabled. The index pattern should match your 
  Wazuh index naming convention.

known_false_positives: >
  Administrators may legitimately use whoami for troubleshooting or scripts. 
  Filter based on known automation scripts and authorized users. High frequency 
  of whoami execution may indicate reconnaissance.

references:
  - https://attack.mitre.org/techniques/T1033/
  - https://github.com/peass-ng/PEASS-ng/tree/master/linPEAS

response:
  message: >
    Whoami command execution detected on $agent_name$. 
    This may indicate user discovery or reconnaissance activity. 
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 25
  severity: low
  risk_objects:
    - field: agent_name
      type: system
      score: 25
  threat_objects: []

tags:
  analytic_story:
    - Linux Living Off The Land
    - Linux Privilege Escalation
    - Linux Persistence Techniques
    - Compromised Linux Host
  asset_type: Linux
  mitre_attack_id:
    - T1033
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: full_log:/.*whoami.*/ AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 0cf7a157-8879-41a2-8f55-388dd23746b7
    name: Linux Recon Indicators
    reason: Whoami is typically one line in a broader Linux recon script.
  - id: linux-system-network-configuration-discovery-001
    name: Linux System Network Configuration Discovery
    reason: Network enumeration follows identity checks in initial recon.
  - id: linux-sudo-or-su-execution-001
    name: Linux Sudo Or Su Execution
    reason: Checking privileges leads to sudo/su attempts.
  - id: linux-common-process-elevation-control-001
    name: Linux Common Process For Elevation Control
    reason: Elevation-control binaries show the actor moving to escalate.
  - id: ea3ecad2-db86-4a89-ad0b-132a10d2db55
    name: Interactive Bash Suspicious Children
    reason: Whoami from an interactive bash spawned by an app suggests a fresh shell foothold.
  - id: 7f734ed0-4f47-46c0-837f-6ee62505abd9
    name: Potential Netcat Reverse Shell Execution
    reason: Reverse shells are followed immediately by whoami to confirm access.
  - id: c4042d54-110d-45dd-a0e1-05c47822c937
    name: Python Spawning Pretty TTY Via PTY Module
    reason: TTY upgrade then whoami is the standard post-shell sequence.
  - id: 4d5e6f7a-8b90-2345-6789-01abcdef2345
    name: Linux Credential Discovery
    reason: Credential discovery is the next step after learning the user context.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Companion identity and host commands
    query: full_log:/.*(\bid\b|uname -a|hostname|groups|w -h|\blast\b|\/etc\/passwd|sudo -l).*/
    pivot_on: host
    window: 1h
  - name: Shell upgrade or reverse shell
    query: full_log:/.*(pty\.spawn|\/dev\/tcp|nc -e|bash -i|mkfifo|socat.*exec|script \/dev\/null).*/
    pivot_on: host
    window: 1h
  - name: Privilege escalation attempts
    query: full_log:/.*(sudo|su -|pkexec|setuid|chmod [0-9]*[4-7][0-9][0-9][0-9]|find .* -perm).*/
    pivot_on: user
    window: 2h
  - name: Staging and download from the shell
    query: full_log:/.*(curl|wget).*(\/tmp|\/dev\/shm|http).*/
    pivot_on: host
    window: 1h
  - name: Credential and key hunting
    query: full_log:/.*(\.ssh\/|id_rsa|\/etc\/shadow|\.bash_history|\.aws\/credentials).*/
    pivot_on: user
    window: 2h
