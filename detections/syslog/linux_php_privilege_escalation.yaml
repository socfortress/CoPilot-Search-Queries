name: Linux PHP Privilege Escalation
id: linux-php-privilege-escalation-001
version: 1
schema_version: "1.0"
date: "2026-02-04"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  Detects the execution of PHP commands with elevated privileges on a Linux system, 
  specifically when PHP is used with -r flag and 'system' function. This GTFOBins 
  technique abuses PHP's system() function to execute arbitrary commands as root, 
  potentially leading to full system compromise.

data_source:
  - auth.log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - wildcard:
            full_log: "*php*-r*system*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-04 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-04 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with auth.log 
  monitoring enabled. The pattern detects PHP -r with system() function calls 
  executed via sudo.

known_false_positives: >
  Developers may legitimately use PHP scripts with system calls. However, the 
  combination of sudo + php -r + system() is rarely used legitimately. Filter 
  based on known development workflows.

references:
  - https://gtfobins.github.io/gtfobins/php/
  - https://en.wikipedia.org/wiki/PHP
  - https://attack.mitre.org/techniques/T1548/003/

response:
  message: >
    PHP privilege escalation attempt detected on $agent_name$. 
    The php -r system() pattern can execute arbitrary commands as root. 
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 30
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 30
  threat_objects: []

tags:
  analytic_story:
    - Linux Privilege Escalation
    - Linux Living Off The Land
  asset_type: Linux
  mitre_attack_id:
    - T1548.003
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: full_log:/.*php.*-r.*system.*/ AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: linux-sudo-or-su-execution-001
    name: Linux Sudo Or Su Execution
    reason: PHP abuse is run through sudo; sudo/su execution shows the account and other elevated commands
  - id: c6714a24-d7d5-4283-a36b-3ffd091d5f7e
    name: Potential PHP Reverse Shell
    reason: php -r with system can be a reverse shell launcher; this catches the socket-based variant
  - id: 818f7b24-0fba-4c49-a073-8b755573b9c7
    name: Linux Webshell Indicators
    reason: Webshell indicators explain how an attacker got PHP execution on the host first
  - id: linux-setuid-using-chmod-utility-001
    name: Linux Setuid Using Chmod Utility
    reason: A root shell from PHP is commonly followed by planting a setuid binary
  - id: 26f86252-1549-45e1-a212-eb26840e86bc
    name: File Download or Read to Pipe Execution
    reason: Download-and-pipe-to-shell is a common follow-on payload stage
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: php command-line code execution
    query: (data_process_exec_process_binary:/.*\/(php)/ AND data_process_exec_process_arguments:/.*(-r|system|exec|passthru|shell_exec|popen|proc_open).*/)
    pivot_on: host
    window: 1h
  - name: PHP or shell reverse-shell socket patterns
    query: data_process_exec_process_arguments:/.*(fsockopen|\/dev\/tcp\/|stream_socket_client|bash -i|pfsockopen).*/
    pivot_on: host
    window: 1h
  - name: Setuid or capability planting
    query: (data_process_exec_process_binary:/.*\/(chmod|setcap)/ AND data_process_exec_process_arguments:/.*(\+s|[2467]755|[2467]777|cap_setuid).*/)
    pivot_on: host
    window: 2h
  - name: Payload download into temp or web directories
    query: (data_process_exec_process_binary:/.*\/(curl|wget)/ AND data_process_exec_process_arguments:/.*(\.php|\/tmp\/|\/var\/www|\/dev\/shm\/).*/)
    pivot_on: host
    window: 2h
  - name: Shadow or sudoers access
    query: full_log:/.*(\/etc\/shadow|\/etc\/sudoers).*/
    pivot_on: host
    window: 4h
