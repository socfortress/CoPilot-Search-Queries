name: Linux BusyBox Privilege Escalation
id: linux-busybox-privilege-escalation-001
version: 1
schema_version: "1.0"
date: "2026-02-03"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  Detects the execution of BusyBox with sudo privileges to spawn shells (sh, ash), 
  which can lead to privilege escalation on Linux systems. BusyBox is a multi-call 
  binary that combines many Unix utilities, and its shell capabilities can be abused 
  to gain root access.

data_source:
  - auth.log
  - Tetragon

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - wildcard:
            full_log: "*busybox*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-03 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-03 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with auth.log 
  monitoring enabled. Tetragon provides additional process execution visibility 
  including the shell spawning via busybox.

known_false_positives: >
  Embedded systems or minimal Linux installations may legitimately use BusyBox 
  for administrative tasks. Filter based on known system administration patterns 
  and expected environments.

references:
  - https://gtfobins.github.io/gtfobins/busybox/
  - https://man.archlinux.org/man/busybox.1.en
  - https://attack.mitre.org/techniques/T1548/003/

response:
  message: >
    BusyBox privilege escalation attempt detected on $agent_name$. 
    BusyBox shell spawning with elevated privileges detected. 
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 10
  severity: low
  risk_objects:
    - field: agent_name
      type: system
      score: 10
  threat_objects: []

tags:
  analytic_story:
    - Linux Privilege Escalation
    - Linux Living Off The Land
  asset_type: Linux
  mitre_attack_id:
    - T1548.003
    - T1059.004
  product:
    - Wazuh
  security_domain: endpointlinux_busybox_privilege_escalation

graylog:
  query: full_log:/.*busybox.*/ AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: linux-sudo-or-su-execution-001
    name: Linux Sudo Or Su Execution
    reason: BusyBox escalation runs via sudo; the sudo/su trail shows who ran it and as which target user
  - id: 26f86252-1549-45e1-a212-eb26840e86bc
    name: File Download or Read to Pipe Execution
    reason: a downloaded script or binary piped into a shell is a common way the busybox sudo step is staged
  - id: 2fade0b6-7423-4835-9d4f-335b39b83867
    name: Shell Execution Of Process Located In Tmp Directory
    reason: busybox or its payload run from /tmp suggests an attacker-staged binary, not admin use
  - id: linux-setuid-using-chmod-utility-001
    name: Linux Setuid Using Chmod Utility
    reason: after a root shell via busybox, setuid-bit creation is a typical persistence step
  - id: linux-sudoers-tmp-file-creation-001
    name: Linux Sudoers Tmp File Creation
    reason: a root shell gained is often followed by sudoers edits to make the access permanent
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Root shell spawned via sudo or busybox
    query: (data_process_exec_process_binary:/.*\/([Ss][Uu][Dd][Oo]|[Dd][Oo][Aa][Ss]|[Pp][Kk][Ee][Xx][Ee][Cc])/ OR (data_process_exec_process_binary:/.*\/[Bb][Uu][Ss][Yy][Bb][Oo][Xx]/)) AND data_process_exec_process_arguments:/.*([Ss][Hh]|[Aa][Ss][Hh]).*/
    pivot_on:
    - host
    window: 1h
  - name: Download or reverse-connect tooling on host
    query: data_process_exec_process_binary:/.*\/([Cc][Uu][Rr][Ll]|[Ww][Gg][Ee][Tt]|[Ff][Tt][Pp]|[Tt][Ff][Tt][Pp]|[Nn][Cc]|[Nn][Cc][Aa][Tt]|[Ss][Oo][Cc][Aa][Tt])/
    pivot_on:
    - host
    window: 2h
  - name: SUID/capability changes after escalation
    query: (data_process_exec_process_binary:/.*\/([Cc][Hh][Mm][Oo][Dd]|[Ss][Ee][Tt][Cc][Aa][Pp])/ AND data_process_exec_process_arguments:/.*([+][Ss]|[24]7[0-9][0-9]|[Cc][Aa][Pp]_[Ss][Ee][Tt][Uu][Ii][Dd]).*/)
    pivot_on:
    - host
    window: 4h
  - name: Persistence and account tooling run as root
    query: (data_process_exec_process_binary:/.*\/([Cc][Rr][Oo][Nn][Tt][Aa][Bb]|[Uu][Ss][Ee][Rr][Aa][Dd][Dd]|[Uu][Ss][Ee][Rr][Mm][Oo][Dd]|[Vv][Ii][Ss][Uu][Dd][Oo])/)
    pivot_on:
    - host
    window: 4h
