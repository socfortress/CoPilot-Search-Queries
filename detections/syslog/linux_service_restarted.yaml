name: Linux Service Restarted
id: linux-service-restarted-001
version: 1
schema_version: "1.0"
date: "2026-02-03"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  Detects the restarting or re-enabling of services on Linux systems using the 
  systemctl or service commands. This activity may indicate adversaries attempting 
  to maintain persistence or execute unauthorized actions through service manipulation.

data_source:
  - Tetragon
  - Linux Auditd
  - auth.log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - wildcard:
                  full_log: "*systemctl*"
              - wildcard:
                  full_log: "*service*"
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  full_log: "*restart*"
              - wildcard:
                  full_log: "*reload*"
              - wildcard:
                  full_log: "*reenable*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-03 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-03 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with Tetragon 
  or auditd process execution logging enabled. Auth.log monitoring provides sudo 
  command visibility. The index pattern should match your Wazuh index naming convention.

known_false_positives: >
  Administrators or network operators may use these commands for legitimate automation 
  and maintenance purposes. Filter based on known service names, authorized users, 
  and scheduled maintenance windows.

references:
  - https://attack.mitre.org/techniques/T1543/003/

response:
  message: >
    Service restart/reload activity detected on $agent_name$. 
    This may indicate persistence or unauthorized service manipulation. 
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 25
  severity: low
  risk_objects:
    - field: agent_name
      type: system
      score: 25
  threat_objects: []

tags:
  analytic_story:
    - AwfulShred
    - Linux Privilege Escalation
    - Linux Living Off The Land
    - Data Destruction
    - Linux Persistence Techniques
    - Scheduled Tasks
  asset_type: Linux
  mitre_attack_id:
    - T1053.006
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (full_log:/.*systemctl.*/ OR full_log:/.*service.*/) AND (full_log:/.*restart.*/ OR full_log:/.*reload.*/ OR full_log:/.*reenable.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: linux-service-file-created-in-systemd-directory-001
    name: Linux Service File Created In Systemd Directory
    reason: A new or modified unit file dropped before a restart/reload is how a malicious service gets activated.
  - id: linux-stop-services-001
    name: Linux Stop Services
    reason: Stop followed by restart can indicate swapping a service binary or config, or defence evasion.
  - id: linux-security-monitoring-service-stop-001
    name: Linux Security Monitoring Service Stop
    reason: Restarting services often accompanies tampering with security agents on the same host.
  - id: linux-service-started-or-enabled-001
    name: Linux Service Started Or Enabled
    reason: 'Sibling persistence activity: enabling/starting services on the same host.'
  - id: linux-sudo-or-su-execution-001
    name: Linux Sudo Or Su Execution
    reason: Service control needs root; the sudo/su use shows who elevated to do it.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Systemd unit file creation or modification
    query: full_log:/.*(\/etc\/systemd\/system|\/lib\/systemd\/system|\.service).*/ AND full_log:/.*(tee|cp |mv |echo|cat >|touch|daemon-reload).*/
    pivot_on: host
    window: 2h
  - name: Service config or binary overwrite
    query: full_log:/.*(sed -i|tee|cp |mv |chmod).*(\/etc\/|\/usr\/(local\/)?s?bin\/).*/ AND full_log:/.*(conf|\.service|\.sh).*/
    pivot_on: host
    window: 2h
  - name: Security agent tampering
    query: full_log:/.*(systemctl|service).*(stop|disable|mask).*(auditd|wazuh|osquery|falco|tetragon|rsyslog|ufw|apparmor|selinux).*/
    pivot_on: host
    window: 4h
  - name: Sudo or su elevation
    query: full_log:/.*(sudo|su -|su root|pkexec).*/ AND NOT _exists_:data_win_system_eventID
    pivot_on: user
    window: 1h
  - name: Download then execute staging
    query: full_log:/.*(curl|wget).*(\/tmp\/|\/dev\/shm\/|\| *(ba)?sh).*/
    pivot_on: host
    window: 2h
