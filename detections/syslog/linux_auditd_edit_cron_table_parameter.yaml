name: Linux Edit Cron Table Parameter
id: linux-edit-cron-table-parameter-001
version: 1
schema_version: "1.0"
date: "2026-02-03"
author: SOCFortress LLC
status: production
type: Anomaly
description: >
  Detects the suspicious editing of cron jobs in Linux using the crontab command. 
  This includes listing (-l), editing (-e), removing (-r), and stdin input (-) 
  operations. Cron job manipulations can indicate unauthorized persistence attempts 
  or scheduled malicious actions.
data_source:
  - Tetragon
  - Linux Auditd
  - syslog
search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - wildcard:
            full_log: "*crontab*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location
parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-03 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-03 23:59:59.999"
how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with Tetragon 
  or auditd process execution logging enabled. Syslog monitoring captures crontab 
  modification events. The index pattern should match your Wazuh index naming convention.
known_false_positives: >
  Administrators may legitimately edit cron jobs for automation purposes. System 
  maintenance tasks may involve crontab modifications. Filter based on known 
  administrative users and expected crontab operations.
references:
  - https://attack.mitre.org/techniques/T1053/003/
response:
  message: >
    Crontab modification detected on $agent_name$. 
    Editing cron tables can enable persistence through scheduled task execution. 
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 64
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 64
  threat_objects: []
tags:
  analytic_story:
    - Scheduled Tasks
    - Linux Privilege Escalation
    - Linux Persistence Techniques
    - Linux Living Off The Land
    - Compromised Linux Host
  asset_type: Linux
  mitre_attack_id:
    - T1053.003
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: full_log:/.*crontab.*/ AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: linux-auditd-crontab-listing-001
    name: Linux Auditd Crontab Listing
    reason: Listing existing jobs commonly precedes editing for persistence.
  - id: linux-auditd-crontab-directory-files-modification-001
    name: Linux Auditd Crontab Directory Files Modification
    reason: Direct writes to cron directories are the parallel persistence route.
  - id: linux-append-cronjob-entry-001
    name: Linux Append Cronjob Entry On Existing Cronjob File
    reason: Appending to cron files is the same persistence outcome.
  - id: 4e2a6c91-7f3d-4b6e-9a4f-1c8b0e5a92d4
    name: Crontab Interactive Edit Execution
    reason: Tetragon confirmation of the interactive edit.
  - id: 6b14bac8-3e3a-4324-8109-42f0546a347f
    name: Scheduled Cron Task/Job - Linux
    reason: Shows the scheduled task created.
  - id: c2e234de-03a3-41e1-b39a-1e56dc17ba67
    name: Remove Scheduled Cron Task/Job
    reason: Removal of jobs indicates cleanup or tampering.
  - id: 9f5d1b72-2e3f-4c6d-8a7e-1b2c3d4f5e6b
    name: Linux Cron File Deletion
    reason: Cron file deletion after use points to anti-forensics.
  - id: linux-sudo-or-su-execution-001
    name: Linux Sudo Or Su Execution
    reason: Editing another user's or root crontab requires elevation.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Crontab and cron file changes
    query: (full_log:/.*(crontab|\/etc\/cron|\/var\/spool\/cron).*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/
    pivot_on: host
    window: 6h
  - name: Download-and-execute payload staging
    query: (data_process_exec_process_binary:/.*(curl|wget).*/) AND (data_process_exec_process_arguments:/.*(sh|-O|-o|\/tmp\/).*/)
    pivot_on: host
    window: 4h
  - name: Binaries run from writable paths
    query: (data_process_exec_process_binary:/(\/tmp\/|\/dev\/shm\/|\/var\/tmp\/).*/) AND NOT _exists_:data_win_system_eventID
    pivot_on: host
    window: 6h
  - name: Other persistence mechanisms
    query: (full_log:/.*(systemd\/system|rc\.local|\.bashrc|authorized_keys|init\.d).*/) AND NOT rule_groups:/.*windows.*/
    pivot_on: host
    window: 6h
