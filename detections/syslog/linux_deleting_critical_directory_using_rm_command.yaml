name: Linux Critical Directory Deletion
id: a3b7c9d2-4f5e-4b6d-8c1a-2d3f4e5b6c7a
version: 1
schema_version: "1.0"
date: "2026-01-29"
author: SOCFORTRESS LLC
status: production
type: TTP

description: >
  Detects destructive deletion attempts using rm -rf targeting critical
  Linux directories such as /boot, /var/log, /etc, and /dev. This may
  indicate malicious activity aiming to disrupt system operations or erase logs.

data_source:
  - Wazuh Agent Logs
  - Linux Auditd
  - Syslog

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            location: "/var/log/tetragon/tetragon.log"
        - bool:
            should:
              - wildcard:
                  full_log: "*\"/usr/bin/rm\"*-rf*/boot/*"
              - wildcard:
                  full_log: "*\"/usr/bin/rm\"*-rf*/var/log/*"
              - wildcard:
                  full_log: "*\"/usr/bin/rm\"*-rf*/etc/*"
              - wildcard:
                  full_log: "*\"/usr/bin/rm\"*-rf*/dev/*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary
    - rule_mitre_id
    - rule_description
    - full_log

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-01-28 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-01-28 23:59:59.999"

how_to_implement: >
  Requires Linux endpoints with Wazuh agents capturing process execution
  and command-line arguments. Monitoring destructive rm -rf commands can
  reveal attempts to wipe critical system directories.

known_false_positives: >
  Legitimate system maintenance scripts are rare but may occasionally
  remove files in monitored directories; use allowlists where appropriate.

references:
  - https://attack.mitre.org/techniques/T1485/
  - https://tetragon.io/docs/

response:
  message: >
    Destructive deletion of critical directories detected on $agent_name$.
    Command: $data_process_exec_process_binary$ $data_process_exec_process_arguments$
    Parent: $data_process_exec_parent_binary$
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 95
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 95
  threat_objects:
    - field: data_process_exec_process_binary
      type: process

tags:
  analytic_story:
    - File Tampering
    - Destructive Commands
  asset_type: Linux
  mitre_attack_id:
    - T1485
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (full_log:/.*\/usr\/bin\/rm.*-rf.*\/boot\/.*/ OR full_log:/.*\/usr\/bin\/rm.*-rf.*\/var\/log\/.*/ OR full_log:/.*\/usr\/bin\/rm.*-rf.*\/etc\/.*/ OR full_log:/.*\/usr\/bin\/rm.*-rf.*\/dev\/.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: linux-auditd-data-destruction-command-001
    name: Linux Auditd Data Destruction Command
    reason: Broader destruction command detection on same host confirms wiper behavior
  - id: linux-dd-file-overwrite-001
    name: Linux DD File Overwrite
    reason: dd overwrite often pairs with rm -rf in wipers
  - id: 80915f59-9b56-4616-9de0-fd0dea6c12fe
    name: Linux Logs Clearing Attempts
    reason: /var/log deletion is log clearing; anti-forensics correlation
  - id: 3fcc9b35-39e4-44c0-a2ad-9e82b6902b31
    name: Syslog Clearing or Removal Via System Utilities
    reason: Syslog removal via utilities overlaps with /var/log deletion
  - id: 9f5d1b72-2e3f-4c6d-8a7e-1b2c3d4f5e6b
    name: Linux Cron File Deletion
    reason: Cron file deletion is a sibling destructive/tamper action
  - id: de25eeb8-3655-4643-ac3a-b662d3f26b6b
    name: Disable Or Stop Services
    reason: Services stopped before system files are removed
  - id: linux-sudo-or-su-execution-001
    name: Linux Sudo Or Su Execution
    reason: 'Deleting /etc,/boot needs root: shows how privilege was obtained'
  - id: linux-auditd-daemon-shutdown-001
    name: Linux Auditd Daemon Shutdown
    reason: auditd shutdown to blind monitoring ahead of deletion
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: rm -rf against system directories
    query: data_process_exec_process_binary:/.*\/[Rr][Mm]/ AND data_process_exec_process_arguments:/.*-[Rr][Ff].*/ AND data_process_exec_process_arguments:/.*(\/boot|\/etc|\/var\/log|\/dev|\/usr|\/bin).*/
    pivot_on: host
    window: 2h
  - name: rm with no-preserve-root
    query: data_process_exec_process_arguments:/.*--[Nn][Oo]-[Pp][Rr][Ee][Ss][Ee][Rr][Vv][Ee]-[Rr][Oo][Oo][Tt].*/
    pivot_on: host
    window: 4h
  - name: Disk wipe or filesystem destruction
    query: data_process_exec_process_binary:/.*(\/[Dd][Dd]|\/[Ss][Hh][Rr][Ee][Dd]|\/[Ww][Ii][Pp][Ee][Ff][Ss]|\/[Mm][Kk][Ff][Ss].*)/
    pivot_on: host
    window: 4h
  - name: Reboot or shutdown after deletion
    query: data_process_exec_process_binary:/.*(\/[Rr][Ee][Bb][Oo][Oo][Tt]|\/[Ss][Hh][Uu][Tt][Dd][Oo][Ww][Nn]|\/[Pp][Oo][Ww][Ee][Rr][Oo][Ff][Ff])/
    pivot_on: host
    window: 2h
  - name: Privilege use preceding deletion
    query: data_process_exec_process_binary:/.*(\/[Ss][Uu][Dd][Oo]|\/[Ss][Uu])/
    pivot_on: host
    window: 4h
