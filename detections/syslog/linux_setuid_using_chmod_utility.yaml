name: Linux Setuid Using Chmod Utility
id: linux-setuid-using-chmod-utility-001
version: 1
schema_version: "1.0"
date: "2026-02-03"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  Detects the execution of the chmod utility to set the SUID or SGID bit on files, 
  which can allow users to temporarily gain root or group-level access. This activity 
  can indicate an attempt to escalate privileges or maintain persistence on a system.

data_source:
  - Tetragon
  - Linux Auditd
  - auth.log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - wildcard:
            full_log: "*chmod*"
        - bool:
            should:
              - wildcard:
                  full_log: "*u+s*"
              - wildcard:
                  full_log: "*g+s*"
              - wildcard:
                  full_log: "*4777*"
              - wildcard:
                  full_log: "*4755*"
              - wildcard:
                  full_log: "*4577*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-03 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-03 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with Tetragon 
  or auditd process execution logging enabled. Auth.log monitoring provides sudo 
  command visibility. The index pattern should match your Wazuh index naming convention.

known_false_positives: >
  Administrators may legitimately use setuid/setgid permissions for specific applications. 
  Software installations may also set these permissions. Filter based on known binaries 
  and authorized administrators.

references:
  - https://attack.mitre.org/techniques/T1548/001/
  - https://www.hackingarticles.in/linux-privilege-escalation-using-capabilities/

response:
  message: >
    Setuid/Setgid permission modification detected on $agent_name$. 
    This may indicate privilege escalation attempt via SUID/SGID bits. 
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 49
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 49
  threat_objects: []

tags:
  analytic_story:
    - Linux Privilege Escalation
    - Linux Persistence Techniques
    - Linux Living Off The Land
  asset_type: Linux
  mitre_attack_id:
    - T1548.001
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: full_log:/.*chmod.*/ AND (full_log:/.*u\+s.*/ OR full_log:/.*g\+s.*/ OR full_log:/.*4777.*/ OR full_log:/.*4755.*/ OR full_log:/.*4577.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: linux-auditd-chown-to-root-001
    name: Linux Auditd Chown To Root
    reason: chown to root followed by chmod u+s is the standard recipe for a root SUID backdoor.
  - id: linux-sudo-or-su-execution-001
    name: Linux Sudo Or Su Execution
    reason: Setting SUID on root-owned files requires elevation; identifies the actor.
  - id: linux-unix-shell-configuration-modification-001
    name: Linux Unix Shell Configuration Modification
    reason: Shell profile tampering is a companion persistence step.
  - id: linux-setuid-using-setcap-utility-001
    name: Linux Setuid Using Setcap Utility
    reason: Alternative capability-based way to achieve the same privileged-binary persistence.
  - id: linux-sudoers-tmp-file-creation-001
    name: Linux Sudoers Tmp File Creation
    reason: Sudoers edits are the other common root-persistence move on the same host.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Copy of shell or interpreter to writable path
    query: full_log:/.*(cp|install|mv).*(\/bin\/(ba)?sh|\/bin\/dash|\/usr\/bin\/(python|perl|find|vim)).*(\/tmp\/|\/dev\/shm\/|\/var\/tmp\/|\/home\/).*/
    pivot_on: host
    window: 2h
  - name: Ownership change to root
    query: full_log:/.*chown.*root.*/ AND NOT _exists_:data_win_system_eventID
    pivot_on: host
    window: 2h
  - name: SUID shell executed with -p
    query: full_log:/.*(sh|bash|dash) +-p.*/
    pivot_on: host
    window: 6h
  - name: New privileged account or passwd change
    query: full_log:/.*(useradd|adduser|usermod|passwd|\/etc\/passwd|\/etc\/shadow).*/ AND NOT _exists_:data_win_system_eventID
    pivot_on: host
    window: 6h
  - name: Download of tooling
    query: full_log:/.*(curl|wget).*(\/tmp\/|\/dev\/shm\/| -O | -o ).*/
    pivot_on: host
    window: 2h
