name: Linux Auditd Data Destruction Command
id: linux-auditd-data-destruction-command-001
version: 1
schema_version: "1.0"
date: "2026-01-28"
author: SOCFortress LLC
status: production
type: TTP
description: >
  Detects the use of the rm command with --no-preserve-root flag, which bypasses 
  the safety mechanism preventing recursive deletion of the root filesystem. This 
  technique is associated with destructive malware like AwfulShred and indicates 
  an attempt to cause significant data destruction on the target system.
data_source:
  - Tetragon
  - Linux Auditd
search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - wildcard:
            full_log: "*rm*"
        - wildcard:
            full_log: "*-rf*"
        - wildcard:
            full_log: "*no-preserve-root*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - rule_mitre_id
    - rule_description
    - full_log
parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-01-28 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-01-28 23:59:59.999"
how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with Tetragon 
  or auditd process execution logging enabled. Ensure the agent is configured to 
  capture command-line arguments. The index pattern should match your Wazuh index 
  naming convention.
known_false_positives: >
  Very rare in legitimate use. The --no-preserve-root flag is explicitly designed 
  to bypass safety mechanisms and should almost never be used in normal operations. 
  Any detection should be treated as highly suspicious.
references:
  - https://attack.mitre.org/techniques/T1485/
response:
  message: >
    CRITICAL: Data destruction command detected on $agent_name$. 
    Command: rm -rf --no-preserve-root was executed. 
    This is associated with destructive malware patterns. MITRE ATT&CK: $rule_mitre_id$
  risk_score: 90
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_process_exec_process_binary
      type: process
tags:
  analytic_story:
    - Data Destruction
    - AwfulShred
    - Compromised Linux Host
  asset_type: Linux
  mitre_attack_id:
    - T1485
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: full_log:/.*rm.*/ AND full_log:/.*\-rf.*/ AND full_log:/.*no-preserve-root.*/ AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a6957eb2-86f2-4aeb-aa1b-8c9340f718d4
    name: Linux Data Destruction via rm --no-preserve-root
    reason: Sibling detection for the identical rm -rf --no-preserve-root wiper command; co-firing confirms a destruction attempt.
  - id: linux-dd-file-overwrite-001
    name: Linux DD File Overwrite
    reason: dd overwrite is the Industroyer2/AwfulShred alternative to rm for destroying file contents on the same host.
  - id: a3b7c9d2-4f5e-4b6d-8c1a-2d3f4e5b6c7a
    name: Linux Critical Directory Deletion
    reason: Recursive deletion of critical directories is the same data-destruction objective by a slightly different command.
  - id: linux-stop-services-001
    name: Linux Stop Services
    reason: AwfulShred stops services (to unlock files and disable recovery) immediately before or after the wipe.
  - id: linux-system-reboot-via-sysrq-001
    name: Linux System Reboot Via System Request Key
    reason: SysRq reboot is the final AwfulShred step that renders the wiped host unbootable.
  - id: linux-unix-shell-enable-all-sysrq-functions-001
    name: Linux Unix Shell Enable All SysRq Functions
    reason: Enabling all SysRq functions arms the forced reboot that completes the wiper chain.
  - id: 6e2f9a41-3b7c-4d5e-8c9f-1a2b3d4f5e6a
    name: Linux Init.d Script Deletion
    reason: Deletion of init.d scripts is destructive tampering that accompanies the filesystem wipe.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Destructive rm / recursive-force commands on this host
    query: (full_log:/.*rm .*-rf.*/ OR full_log:/.*no-preserve-root.*/ OR data_process_exec_process_arguments:/.*--no-preserve-root.*/ OR data_process_exec_process_arguments:/.* -rf.*/)
    pivot_on:
    - host
    window: 2h
  - name: Disk or file overwrite via dd / shred / wipe
    query: (data_process_exec_process_binary:/.*\/(dd|shred|wipe)/ OR full_log:/.*(dd if=|shred ).*/)
    pivot_on:
    - host
    window: 2h
  - name: Service and logging teardown in the AwfulShred chain
    query: full_log:/.*(systemctl (stop|disable)|service [a-z0-9_-]+ stop|journalctl --vacuum).*/
    pivot_on:
    - host
    window: 4h
  - name: Forced reboot / SysRq trigger completing the wipe
    query: (full_log:/.*(sysrq|reboot -f|\/proc\/sysrq-trigger).*/ OR data_process_exec_process_arguments:/.*sysrq.*/)
    pivot_on:
    - host
    window: 4h
