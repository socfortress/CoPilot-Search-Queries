name: Linux SSH Key Discovery
id: 3b4c5d6e-7f80-1234-5678-90abcdef1234
version: 1
schema_version: "1.0"
date: "2026-01-30"
author: SOCFORTRESS LLC
status: production
type: TTP
description: >
  Detects attempts to search for SSH private keys or authorized keys
  using common Linux commands such as find or grep, which may indicate
  reconnaissance or credential harvesting activity.
data_source:
  - Wazuh Agent Logs
  - Linux Auditd
  - Syslog
search:
  index_pattern: "${INDEX_PATTERN}"
  size: 20
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - wildcard:
                  full_log: "*find*"
              - wildcard:
                  full_log: "*grep*"
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  full_log: "*id_rsa*"
              - wildcard:
                  full_log: "*id_dsa*"
              - wildcard:
                  full_log: "*authorized_keys*"
              - wildcard:
                  full_log: "*ssh_key*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location
parameters:
  AGENT_NAME:
    description: "Agent name to filter"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time"
    type: datetime
    required: true
    example: "2026-01-28 14:40:00.000"
  END_TIME:
    description: "Query end time"
    type: datetime
    required: true
    example: "2026-01-28 14:43:00.000"
how_to_implement: >
  Requires Linux endpoints with Wazuh agents capturing process execution.
  Monitoring find/grep commands targeting SSH key files helps detect
  attempts to discover or exfiltrate sensitive credentials.
known_false_positives: >
  System administrators searching for SSH keys for legitimate maintenance.
references:
  - https://attack.mitre.org/techniques/T1081/
  - https://documentation.wazuh.com/current/user-manual/capabilities/index.html
response:
  message: >
    SSH key discovery activity detected on $agent_name$.
    Command: $full_log$
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: full_log
      type: process
tags:
  analytic_story:
    - Linux Reconnaissance
    - Credential Harvesting
  asset_type: Linux
  mitre_attack_id:
    - T1081
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (full_log:/.*find.*/ OR full_log:/.*grep.*/) AND (full_log:/.*id_rsa.*/ OR full_log:/.*id_dsa.*/ OR full_log:/.*authorized_keys.*/ OR full_log:/.*ssh_key.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 4d5e6f7a-8b90-2345-6789-01abcdef2345
    name: Linux Credential Discovery
    reason: Same actor usually sweeps other credential material (history, config, tokens) alongside SSH keys
  - id: linux-private-keys-certificate-enumeration-001
    name: Linux Private Keys and Certificate Enumeration
    reason: Broader private key and certificate enumeration is the same harvesting objective, often in the same shell session
  - id: linux-auditd-possible-access-credential-files-001
    name: Linux Auditd Possible Access To Credential Files
    reason: Reading /etc/shadow or credential files is the usual next step once key hunting has located targets
  - id: d4e5f6a7-8b9c-4d1e-a2b3-5f6e7a8b9c1d
    name: Linux SSH Configuration Access
    reason: Reads of ssh/sshd config follow key discovery as the attacker maps trust and lateral paths
  - id: linux-auditd-ssh-config-keys-deletion-001
    name: Linux Auditd SSH Config Keys Deletion
    reason: Deleting or replacing SSH keys/authorized_keys after discovery indicates tampering or backdoor key planting
  - id: f3g4h5i6-7890-1112-1314-151617181920
    name: Linux File Discovery Detection
    reason: Generic file discovery preceding the targeted key search shows hands-on-keyboard reconnaissance
  - id: f0025a69-e1b7-4dda-a53c-db21fa2d4071
    name: Script Interpreter Spawning Credential Scanner - Linux
    reason: Interpreter-spawned credential scanners are the automated variant of the same key hunt
  - id: 8737b7f6-8df3-4bb7-b1da-06019b99b687
    name: Shell Invocation Via Ssh - Linux
    reason: 'Harvested keys get used: ssh is launched to pivot to other hosts'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Reads or copies of SSH key material
    query: (data_process_exec_process_arguments:/.*(id_rsa|id_dsa|id_ecdsa|id_ed25519|authorized_keys|known_hosts).*/) AND (data_process_exec_process_binary:/.*\/([Cc][Aa][Tt]|[Ll][Ee][Ss][Ss]|[Mm][Oo][Rr][Ee]|[Hh][Ee][Aa][Dd]|[Tt][Aa][Ii][Ll]|[Cc][Pp]|[Ss][Cc][Pp]|[Rr][Ss][Yy][Nn][Cc]|[Tt][Aa][Rr]|[Bb][Aa][Ss][Ee]64|[Xx][Xx][Dd]).*/)
    pivot_on:
    - host
    window: 2h
  - name: Archiving or staging of key material
    query: (data_process_exec_process_binary:/.*\/([Tt][Aa][Rr]|[Zz][Ii][Pp]|[Gg][Zz][Ii][Pp]|[Bb][Zz][Ii][Pp]2|7[Zz]|[Rr][Ss][Yy][Nn][Cc]).*/) AND (data_process_exec_process_arguments:/.*(\.ssh|id_rsa|id_ed25519|authorized_keys).*/)
    pivot_on:
    - host
    window: 2h
  - name: Outbound transfer tools launched on the host
    query: data_process_exec_process_binary:/.*\/([Cc][Uu][Rr][Ll]|[Ww][Gg][Ee][Tt]|[Nn][Cc]|[Nn][Cc][Aa][Tt]|[Ss][Cc][Pp]|[Ss][Ff][Tt][Pp]|[Ff][Tt][Pp]|[Ss][Oo][Cc][Aa][Tt]).*/
    pivot_on:
    - host
    window: 4h
  - name: Outbound SSH sessions that may use harvested keys
    query: (data_process_exec_process_binary:/.*\/[Ss][Ss][Hh]/) AND (data_process_exec_process_arguments:/.*(-i |StrictHostKeyChecking|-o ).*/)
    pivot_on:
    - host
    window: 6h
  - name: Other credential files read
    query: data_process_exec_process_arguments:/.*(\/etc\/shadow|\/etc\/passwd|\.bash_history|\.aws\/credentials|\.git-credentials|\.netrc).*/
    pivot_on:
    - host
    window: 2h
