name: Linux Sudo Or Su Execution
id: linux-sudo-or-su-execution-001
version: 1
schema_version: "1.0"
date: "2026-02-03"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  Detects the execution of sudo or su commands on a Linux system. These commands 
  are commonly used by adversaries to elevate privileges, potentially leading to 
  unauthorized access or control over the system. If confirmed malicious, this 
  activity could allow attackers to execute commands with root privileges.

data_source:
  - Linux Auditd
  - auth.log
  - Tetragon

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - wildcard:
                  full_log: "*sudo *"
              - wildcard:
                  full_log: "* su *"
              - wildcard:
                  full_log: "*\"/usr/bin/sudo\"*"
              - wildcard:
                  full_log: "*\"/usr/bin/su\"*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-03 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-03 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with auditd 
  process execution logging enabled. Auth.log monitoring provides additional 
  sudo command visibility. The index pattern should match your Wazuh index naming 
  convention.

known_false_positives: >
  Administrators regularly use sudo and su for legitimate system administration. 
  Filter based on known administrative users and expected command patterns. 
  High frequency or unusual commands should be investigated.

references:
  - https://attack.mitre.org/techniques/T1548/003/

response:
  message: >
    Sudo or su execution detected on $agent_name$. 
    These commands are used for privilege escalation and may indicate 
    unauthorized access attempts. MITRE ATT&CK: $rule_mitre_id$
  risk_score: 25
  severity: low
  risk_objects:
    - field: agent_name
      type: system
      score: 25
  threat_objects: []

tags:
  analytic_story:
    - Linux Privilege Escalation
    - Linux Persistence Techniques
    - Compromised Linux Host
  asset_type: Linux
  mitre_attack_id:
    - T1548.003
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (full_log:/.*sudo .*/ OR full_log:/.* su .*/ OR full_log:/.*\/usr\/bin\/sudo.*/ OR full_log:/.*\/usr\/bin\/su.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: linux-common-process-elevation-control-001
    name: Linux Common Process For Elevation Control
    reason: Wider view of elevation utilities (sudo/su/pkexec/doas) used in the same session.
  - id: linux-pkexec-privilege-escalation-001
    name: Linux pkexec Privilege Escalation
    reason: Alternative escalation path when sudo/su is restricted.
  - id: a1b2c3d4-5e6f-7a8b-9c0d-e1f2a3b4c5d6
    name: Linux Sudoers File Access
    reason: Reading sudoers to learn what elevation is allowed precedes abusing sudo.
  - id: linux-visudo-utility-execution-001
    name: Linux Visudo Utility Execution
    reason: Edits to sudoers after sudo use signal privilege persistence.
  - id: linux-sudoers-tmp-file-creation-001
    name: Linux Sudoers Tmp File Creation
    reason: Sudoers edit artifact following root access.
  - id: linux-setuid-using-chmod-utility-001
    name: Linux Setuid Using Chmod Utility
    reason: Root commands commonly plant SUID backdoors.
  - id: linux-auditd-add-user-001
    name: Linux Auditd Add User
    reason: Rogue account creation is a typical post-elevation action.
  - id: linux-whoami-user-discovery-001
    name: Linux Whoami User Discovery
    reason: Identity checks commonly follow a successful su/sudo.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Privilege and account changes as root
    query: data_process_exec_process_binary:/.*(\/[Uu][Ss][Ee][Rr][Aa][Dd][Dd]|\/[Aa][Dd][Dd][Uu][Ss][Ee][Rr]|\/[Uu][Ss][Ee][Rr][Mm][Oo][Dd]|\/[Pp][Aa][Ss][Ss][Ww][Dd]|\/[Cc][Hh][Mm][Oo][Dd]|\/[Cc][Hh][Oo][Ww][Nn]|\/[Vv][Ii][Ss][Uu][Dd][Oo])/
    pivot_on: host
    window: 2h
  - name: Interactive root shell via sudo or su
    query: data_process_exec_process_arguments:/.*([Ss][Uu][Dd][Oo] +(-[Ii]|-[Ss]|[Ss][Uu]|[Bb][Aa][Ss][Hh]|[Ss][Hh])|[Ss][Uu] +-).*/
    pivot_on: user
    window: 2h
  - name: Credential and sensitive file access
    query: data_process_exec_process_arguments:/.*(\/[Ee][Tt][Cc]\/[Ss][Hh][Aa][Dd][Oo][Ww]|\/[Ee][Tt][Cc]\/[Ss][Uu][Dd][Oo][Ee][Rr][Ss]|[Ii][Dd]_[Rr][Ss][Aa]|\.[Ss][Ss][Hh]\/).*/
    pivot_on: host
    window: 2h
  - name: Persistence mechanisms after elevation
    query: (data_process_exec_process_binary:/.*(\/[Cc][Rr][Oo][Nn][Tt][Aa][Bb]|\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]|\/[Aa][Tt])/ OR data_process_exec_process_arguments:/.*(\/[Ee][Tt][Cc]\/[Cc][Rr][Oo][Nn]|\/[Ee][Tt][Cc]\/[Ss][Yy][Ss][Tt][Ee][Mm][Dd]|[Rr][Cc]\.[Ll][Oo][Cc][Aa][Ll]|[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Ee][Dd]_[Kk][Ee][Yy][Ss]).*/)
    pivot_on: host
    window: 4h
  - name: Download and execute as root
    query: data_process_exec_process_binary:/.*(\/[Cc][Uu][Rr][Ll]|\/[Ww][Gg][Ee][Tt]|\/[Nn][Cc]|\/[Pp][Yy][Tt][Hh][Oo][Nn]3?)/ AND data_process_exec_process_arguments:/.*([Hh][Tt][Tt][Pp]|\/[Tt][Mm][Pp]\/).*/
    pivot_on: host
    window: 2h
