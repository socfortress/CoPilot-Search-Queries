name: Linux Service Started Or Enabled
id: linux-service-started-or-enabled-001
version: 1
schema_version: "1.0"
date: "2026-02-03"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  Detects the creation or enabling of services on Linux platforms using the systemctl 
  or service tools. Adversaries may create or modify services to maintain persistence 
  or execute malicious payloads on system boot.

data_source:
  - Tetragon
  - Linux Auditd
  - auth.log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - wildcard:
                  full_log: "*systemctl*"
              - wildcard:
                  full_log: "*service*"
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  full_log: "* start *"
              - wildcard:
                  full_log: "* enable *"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-03 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-03 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with Tetragon 
  or auditd process execution logging enabled. Auth.log monitoring provides sudo 
  command visibility. The index pattern should match your Wazuh index naming convention.

known_false_positives: >
  Administrators or network operators may use these commands for legitimate automation 
  and system maintenance. Filter based on known service names, authorized users, and 
  scheduled maintenance windows.

references:
  - https://attack.mitre.org/techniques/T1543/003/

response:
  message: >
    Service start or enable activity detected on $agent_name$. 
    This may indicate persistence establishment via service manipulation. 
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 42
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 42
  threat_objects: []

tags:
  analytic_story:
    - Linux Privilege Escalation
    - Linux Persistence Techniques
    - Linux Living Off The Land
    - Scheduled Tasks
  asset_type: Linux
  mitre_attack_id:
    - T1053.006
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (full_log:/.*systemctl.*/ OR full_log:/.*service.*/) AND (full_log:/.* start .*/ OR full_log:/.* enable .*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored by the correlation engine for review. Related CoPilot Searches to run
  # around an alert from this rule, scoped to the same host/user/IP within the window.
  related_rules:
    - id: 26f86252-1549-45e1-a212-eb26840e86bc
      name: "File Download or Read to Pipe Execution"
      reason: "same analytic story: Linux Living Off The Land"
    - id: cb909b3e-512b-11ec-aa31-3e22fbd008af
      name: "Possible Lateral Movement PowerShell Spawn"
      reason: "same analytic story: Scheduled Tasks"
    - id: 12c80db8-ef62-4456-92df-b23e1b3219f6
      name: "Windows Enable Win32 ScheduledJob via Registry"
      reason: "same analytic story: Scheduled Tasks"
    - id: ddf82fcb-e9ee-40e3-8712-a50b5bf323fc
      name: "Windows PowerShell ScheduleTask"
      reason: "same analytic story: Scheduled Tasks"
    - id: windows-scheduled-task-created-public-path-001
      name: "Windows Scheduled Task Created Within Public Path"
      reason: "same analytic story: Scheduled Tasks"
    - id: windows-scheduled-task-created-spawn-shell-001
      name: "Windows Scheduled Task Created to Spawn Shell"
      reason: "same analytic story: Scheduled Tasks"
  window: 1h
  enrichment_searches:
  # NEW ad-hoc searches the engine runs around an alert from this rule, scoped to
  # the alert's host/user/IP within the window (not existing CoPilot Searches).
    - name: "Auditd activity on this host in the window"
      query: 'data_audit_type:*'
      pivot_on: [host]
      window: 1h
    - name: "Process execution (execve) on this host"
      query: 'data_audit_syscall:"execve"'
      pivot_on: [host]
      window: 1h
    - name: "High-severity alerts on this host"
      query: 'rule_level:>=10'
      pivot_on: [host]
      window: 1h
