name: Linux Service Started Or Enabled
id: linux-service-started-or-enabled-001
version: 1
schema_version: "1.0"
date: "2026-02-03"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  Detects the creation or enabling of services on Linux platforms using the systemctl 
  or service tools. Adversaries may create or modify services to maintain persistence 
  or execute malicious payloads on system boot.

data_source:
  - Tetragon
  - Linux Auditd
  - auth.log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - wildcard:
                  full_log: "*systemctl*"
              - wildcard:
                  full_log: "*service*"
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  full_log: "* start *"
              - wildcard:
                  full_log: "* enable *"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-03 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-03 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with Tetragon 
  or auditd process execution logging enabled. Auth.log monitoring provides sudo 
  command visibility. The index pattern should match your Wazuh index naming convention.

known_false_positives: >
  Administrators or network operators may use these commands for legitimate automation 
  and system maintenance. Filter based on known service names, authorized users, and 
  scheduled maintenance windows.

references:
  - https://attack.mitre.org/techniques/T1543/003/

response:
  message: >
    Service start or enable activity detected on $agent_name$. 
    This may indicate persistence establishment via service manipulation. 
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 42
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 42
  threat_objects: []

tags:
  analytic_story:
    - Linux Privilege Escalation
    - Linux Persistence Techniques
    - Linux Living Off The Land
    - Scheduled Tasks
  asset_type: Linux
  mitre_attack_id:
    - T1053.006
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (full_log:/.*systemctl.*/ OR full_log:/.*service.*/) AND (full_log:/.* start .*/ OR full_log:/.* enable .*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: linux-service-file-created-in-systemd-directory-001
    name: Linux Service File Created In Systemd Directory
    reason: Enabling a service right after its unit file was created is the classic systemd persistence install.
  - id: 31545105-3444-4584-bebf-c466353230d2
    name: Touch Suspicious Service File
    reason: Service files created with touch precede enabling them; same install chain.
  - id: b3c8e2d1-4f1a-4b7c-9a22-91a6f2c4e8de
    name: Linux Init Script Persistence Detection
    reason: Init scripts are the alternative persistence route to systemd; both indicate boot persistence.
  - id: linux-service-restarted-001
    name: Linux Service Restarted
    reason: Restart/reload of the same or related services typically follows enabling.
  - id: linux-sudo-or-su-execution-001
    name: Linux Sudo Or Su Execution
    reason: Creating/enabling services requires root; shows the elevation path.
  - id: linux-append-cronjob-entry-001
    name: Linux Append Cronjob Entry On Existing Cronjob File
    reason: Attackers commonly stack cron persistence alongside new services.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Unit file written to systemd paths
    query: full_log:/.*(\/etc\/systemd\/system|\/lib\/systemd\/system|\/usr\/lib\/systemd|\.config\/systemd\/user).*/
    pivot_on: host
    window: 2h
  - name: Init script or rc.local persistence
    query: full_log:/.*(\/etc\/init\.d\/|rc\.local|update-rc\.d|chkconfig).*/
    pivot_on: host
    window: 4h
  - name: Cron persistence alongside service
    query: full_log:/.*(crontab|\/etc\/cron|\/var\/spool\/cron).*/ AND NOT _exists_:data_win_system_eventID
    pivot_on: host
    window: 4h
  - name: Payload staged in writable dirs
    query: full_log:/.*(\/tmp\/|\/dev\/shm\/|\/var\/tmp\/).*(chmod|curl|wget|\.sh|\.elf).*/
    pivot_on: host
    window: 2h
  - name: Sudo or su elevation
    query: full_log:/.*(sudo|su -|su root|pkexec).*/ AND NOT _exists_:data_win_system_eventID
    pivot_on: user
    window: 1h
