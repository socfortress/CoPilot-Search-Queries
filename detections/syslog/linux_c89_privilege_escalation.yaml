name: Linux c89 Privilege Escalation
id: linux-c89-privilege-escalation-001
version: 1
schema_version: "1.0"
date: "2026-02-03"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  Detects the execution of the c89 utility with sudo privileges and the -wrapper 
  flag, which can lead to privilege escalation on Linux systems. The c89 compiler 
  front-end can be abused to spawn shells through the wrapper mechanism, allowing 
  attackers to execute commands as root.

data_source:
  - auth.log
  - Tetragon

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - wildcard:
            full_log: "*c89*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-03 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-03 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with auth.log 
  monitoring enabled. Tetragon provides additional process execution visibility 
  including the gcc compilation chain triggered by c89.

known_false_positives: >
  Developers may legitimately use c89 for compiling C programs. However, the 
  -wrapper flag with shell paths (/bin/sh, /bin/bash) is rarely used legitimately.
  Filter based on known development environments and expected usage patterns.

references:
  - https://gtfobins.github.io/gtfobins/c89/
  - https://www.ibm.com/docs/en/zos/2.1.0?topic=guide-c89-compiler-invocation-using-host-environment-variables
  - https://attack.mitre.org/techniques/T1548/003/

response:
  message: >
    c89 privilege escalation attempt detected on $agent_name$. 
    The c89 -wrapper pattern can spawn shells with elevated privileges. 
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 30
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 30
  threat_objects: []

tags:
  analytic_story:
    - Linux Privilege Escalation
    - Linux Living Off The Land
  asset_type: Linux
  mitre_attack_id:
    - T1548.003
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: full_log:/.*c89.*/ AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*syscheck.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: linux-sudo-or-su-execution-001
    name: Linux Sudo Or Su Execution
    reason: c89 -wrapper abuse requires sudo; sudo/su records show the invoking user and target
  - id: 9b5de532-a757-4d70-946c-1f3e44f48b4d
    name: Shell Execution GCC  - Linux
    reason: the compiler front-end spawns a shell through gcc; this Tetragon rule confirms the compile-chain shell
  - id: 26f86252-1549-45e1-a212-eb26840e86bc
    name: File Download or Read to Pipe Execution
    reason: attacker tooling is commonly fetched and executed immediately before the compiler abuse
  - id: linux-setuid-using-chmod-utility-001
    name: Linux Setuid Using Chmod Utility
    reason: a root shell from the compiler wrapper is often followed by setuid binary creation
  - id: linux-sudoers-tmp-file-creation-001
    name: Linux Sudoers Tmp File Creation
    reason: post-escalation sudoers changes make the compiler-obtained root access permanent
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: c89 compiler invoked with -wrapper
    query: data_process_exec_process_binary:/.*\/([Cc]89|[Gg][Cc][Cc]|[Cc][Cc])/ AND data_process_exec_process_arguments:/.*-wrapper.*/
    pivot_on:
    - host
    window: 1h
  - name: Shell spawned as root with sudo
    query: (data_process_exec_process_binary:/.*\/([Ss][Uu][Dd][Oo]|[Dd][Oo][Aa][Ss]|[Pp][Kk][Ee][Xx][Ee][Cc])/) OR (data_process_exec_process_binary:/.*\/([Bb][Aa][Ss][Hh]|[Ss][Hh]|[Dd][Aa][Ss][Hh]|[Zz][Ss][Hh]|[Aa][Ss][Hh])/ AND data_process_exec_process_arguments:/.*(-[Ii]|-[Pp]|-[Cc]).*/)
    pivot_on:
    - host
    window: 1h
  - name: Download tooling on host
    query: data_process_exec_process_binary:/.*\/([Cc][Uu][Rr][Ll]|[Ww][Gg][Ee][Tt]|[Ff][Tt][Pp]|[Tt][Ff][Tt][Pp]|[Nn][Cc]|[Nn][Cc][Aa][Tt]|[Ss][Oo][Cc][Aa][Tt])/
    pivot_on:
    - host
    window: 2h
  - name: SUID/capability changes after escalation
    query: (data_process_exec_process_binary:/.*\/([Cc][Hh][Mm][Oo][Dd]|[Ss][Ee][Tt][Cc][Aa][Pp])/ AND data_process_exec_process_arguments:/.*([+][Ss]|[24]7[0-9][0-9]|[Cc][Aa][Pp]_[Ss][Ee][Tt][Uu][Ii][Dd]).*/)
    pivot_on:
    - host
    window: 4h
