name: Linux Auditd Base64 Decode
id: linux-auditd-base64-decode-001
version: 1
schema_version: "1.0"
date: "2026-01-28"
author: SOCFortress LLC
status: production
type: Anomaly
description: >
  Detects the use of base64 command with decode flags (-d or --decode) which may 
  indicate an attacker decoding obfuscated payloads, scripts, or commands. Base64 
  decoding is commonly used by adversaries to evade detection by encoding malicious 
  content and decoding it at runtime on the target system.
data_source:
  - Tetragon
  - Linux Auditd
search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - wildcard:
            full_log: "*base64*"
        - bool:
            should:
              - wildcard:
                  full_log: "*\"-d\"*"
              - wildcard:
                  full_log: "*\"--decode\"*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - rule_mitre_id
    - rule_description
    - full_log
parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-01-28 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-01-28 23:59:59.999"
how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with Tetragon 
  or auditd process execution logging enabled. Ensure the agent is configured to 
  capture command-line arguments. The index pattern should match your Wazuh index 
  naming convention.
known_false_positives: >
  System administrators and developers may legitimately use base64 decoding for 
  configuration management, certificate handling, or data processing scripts. 
  Email clients and web applications may also decode base64 content. Filter based 
  on user context and parent process.
references:
  - https://attack.mitre.org/techniques/T1027/
  - https://attack.mitre.org/techniques/T1140/
response:
  message: >
    Base64 decode operation detected on $agent_name$. 
    Command: $data_process_exec_process_binary$ $data_process_exec_process_arguments$
    This may indicate payload deobfuscation. MITRE ATT&CK: $rule_mitre_id$
  risk_score: 45
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 45
  threat_objects:
    - field: data_process_exec_process_binary
      type: process
tags:
  analytic_story:
    - Linux Living Off The Land
    - Deobfuscate/Decode Files or Information
    - Compromised Linux Host
  asset_type: Linux
  mitre_attack_id:
    - T1027
    - T1140
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: full_log:/.*base64.*/ AND (full_log:/.*\"-d\".*/ OR full_log:/.*\"--decode\".*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b7c4d8e1-5f2a-4c9b-8d3e-4f5a6b7c8d9e
    name: Linux Suspicious Base64 Execution
    reason: Decoded payload being piped/executed is the direct follow-on
  - id: ba592c6d-6888-43c3-b8c6-689b8fe47337
    name: Linux Base64 Encoded Pipe to Shell
    reason: Same decode used as base64 -d | sh
  - id: 55e862a8-dd9c-4651-807a-f21fcad56716
    name: Python One-Liners with Base64 Decoding - Linux
    reason: Alternate decoding path for the same payload staging
  - id: a2d9e2f3-0f43-4c7a-bcd9-9acfc0d723aa
    name: Suspicious Download and Execute Pattern via Curl/Wget
    reason: Encoded payload is typically fetched just before decode
  - id: linux-ingress-tool-transfer-hunting-001
    name: Linux Ingress Tool Transfer Hunting
    reason: Tool download that supplies the encoded blob
  - id: linux-setuid-using-chmod-utility-001
    name: Linux Setuid Using Chmod Utility
    reason: Decoded binary is chmod-ed executable/setuid before running
  - id: linux-append-cronjob-entry-001
    name: Linux Append Cronjob Entry On Existing Cronjob File
    reason: Decoded payload often installed via cron persistence
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Download of payload before decode
    query: full_log:/.*(curl|wget|fetch|tftp|scp).*/ AND full_log:/.*(http|ftp|:\/\/).*/
    pivot_on:
    - host
    window: 2h
  - name: Pipe-to-shell or eval of decoded output
    query: full_log:/.*base64.*/ AND full_log:/.*(\|\s*(ba|z|da)?sh|eval|bash -c|python.* -c|perl -e).*/
    pivot_on:
    - host
    window: 2h
  - name: Executable permission set on staged file
    query: full_log:/.*chmod.*/ AND full_log:/.*(\+x|755|777|4755|u\+s).*/
    pivot_on:
    - host
    window: 2h
  - name: Execution from tmp/shm staging paths
    query: data_process_exec_process_binary:/.*(\/tmp\/|\/dev\/shm\/|\/var\/tmp\/).*/
    pivot_on:
    - host
    window: 2h
  - name: Persistence installed after decode
    query: full_log:/.*(authorized_keys|\/etc\/sudoers|crontab|\/etc\/cron|\.bashrc|\.profile|rc\.local|systemd\/system).*/
    pivot_on:
    - host
    window: 4h
