name: Linux Auditd Crontab Listing
id: linux-auditd-crontab-listing-001
version: 1
schema_version: "1.0"
date: "2026-01-28"
author: SOCFortress LLC
status: production
type: Anomaly
description: >
  Detects the use of crontab with the -l flag to list scheduled cron jobs. Adversaries 
  may enumerate cron jobs during reconnaissance to understand scheduled tasks on the 
  system, identify potential persistence mechanisms, or discover opportunities to 
  hijack existing scheduled tasks for privilege escalation or persistence.
data_source:
  - Tetragon
  - Linux Auditd
search:
  index_pattern: "${INDEX_PATTERN}"
  size: 20
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - wildcard:
            full_log: "*crontab*"
        - wildcard:
            full_log: "*-l*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-01-28 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-01-28 23:59:59.999"
how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with Tetragon 
  or auditd process execution logging enabled. Ensure the agent is configured to 
  capture command-line arguments. The index pattern should match your Wazuh index 
  naming convention.
known_false_positives: >
  System administrators and users may legitimately list their cron jobs for 
  maintenance or troubleshooting purposes. Monitoring and backup tools may also 
  enumerate cron jobs. Consider baselining normal crontab usage in your environment.
references:
  - https://attack.mitre.org/techniques/T1053/003/
  - https://attack.mitre.org/techniques/T1082/
response:
  message: >
    Crontab listing detected on $agent_name$. 
    Command: $data_process_exec_process_binary$ $data_process_exec_process_arguments$
    User enumerated scheduled cron jobs. MITRE ATT&CK: $rule_mitre_id$
  risk_score: 25
  severity: low
  risk_objects:
    - field: agent_name
      type: system
      score: 25
  threat_objects:
    - field: data_process_exec_process_binary
      type: process
tags:
  analytic_story:
    - Linux Persistence Techniques
    - Discovery Techniques
    - Compromised Linux Host
  asset_type: Linux
  mitre_attack_id:
    - T1053.003
    - T1082
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: full_log:/.*crontab.*/ AND full_log:/.*\-l.*/ AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: linux-edit-cron-table-parameter-001
    name: Linux Edit Cron Table Parameter
    reason: Listing with crontab -l is typically followed by crontab -e or table replacement to add the implant job.
  - id: linux-append-cronjob-entry-001
    name: Linux Append Cronjob Entry On Existing Cronjob File
    reason: After enumerating existing jobs, attackers append a malicious line to a cron file they just reviewed.
  - id: linux-auditd-crontab-directory-files-modification-001
    name: Linux Auditd Crontab Directory Files Modification
    reason: Writes into cron directories are the direct persistence follow-on to cron discovery.
  - id: 4e2a6c91-7f3d-4b6e-9a4f-1c8b0e5a92d4
    name: Crontab Interactive Edit Execution
    reason: Interactive crontab -e on the same host after listing confirms the table is being modified.
  - id: 6b14bac8-3e3a-4324-8109-42f0546a347f
    name: Scheduled Cron Task/Job - Linux
    reason: A newly scheduled cron job after the listing shows persistence was established.
  - id: linux-whoami-user-discovery-001
    name: Linux Whoami User Discovery
    reason: crontab -l is commonly one of several early host/user discovery commands right after initial access.
  - id: linux-sudo-or-su-execution-001
    name: Linux Sudo Or Su Execution
    reason: Listing another user's crontab needs sudo/su, indicating privilege use during discovery.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Crontab modification or replacement
    query: (data_process_exec_process_binary:/.*(\/[Cc][Rr][Oo][Nn][Tt][Aa][Bb])/ AND NOT data_process_exec_process_arguments:/.*(\-[Ll]).*/)
    pivot_on: host
    window: 4h
  - name: Writes to cron directories and spool
    query: data_process_exec_process_arguments:/.*(\/[Ee][Tt][Cc]\/[Cc][Rr][Oo][Nn]|\/[Vv][Aa][Rr]\/[Ss][Pp][Oo][Oo][Ll]\/[Cc][Rr][Oo][Nn]).*/ AND data_process_exec_process_binary:/.*(\/[Ee][Cc][Hh][Oo]|\/[Tt][Ee][Ee]|\/[Cc][Pp]|\/[Mm][Vv]|\/[Ss][Ee][Dd]|\/[Bb][Aa][Ss][Hh]|\/[Ss][Hh])/
    pivot_on: host
    window: 4h
  - name: Host and user discovery commands
    query: data_process_exec_process_binary:/.*(\/[Ww][Hh][Oo][Aa][Mm][Ii]|\/[Ii][Dd]|\/[Uu][Nn][Aa][Mm][Ee]|\/[Hh][Oo][Ss][Tt][Nn][Aa][Mm][Ee]|\/[Ll][Ss][Oo][Ff]|\/[Ss][Ss]|\/[Nn][Ee][Tt][Ss][Tt][Aa][Tt]|\/[Ii][Ff][Cc][Oo][Nn][Ff][Ii][Gg])/
    pivot_on: host
    window: 2h
  - name: Download and execute from temp paths
    query: (data_process_exec_process_binary:/.*(\/[Cc][Uu][Rr][Ll]|\/[Ww][Gg][Ee][Tt])/ AND data_process_exec_process_arguments:/.*([Hh][Tt][Tt][Pp]).*/) OR data_process_exec_process_binary:/.*\/(tmp|dev\/shm|var\/tmp)\/.*/
    pivot_on: host
    window: 4h
  - name: Other persistence mechanisms
    query: (data_process_exec_process_arguments:/.*(\/[Ee][Tt][Cc]\/[Ss][Yy][Ss][Tt][Ee][Mm][Dd]\/|\/[Ee][Tt][Cc]\/[Rr][Cc]\.[Ll][Oo][Cc][Aa][Ll]|\/[Ee][Tt][Cc]\/[Pp][Rr][Oo][Ff][Ii][Ll][Ee]|\.[Bb][Aa][Ss][Hh][Rr][Cc]|[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Ee][Dd]_[Kk][Ee][Yy][Ss]).*/)
    pivot_on: host
    window: 24h
