name: Linux Auditd Apt-Get Privilege Escalation
id: linux-auditd-apt-get-privilege-escalation-001
version: 1
schema_version: "1.0"
date: "2026-01-28"
author: SOCFortress LLC
status: production
type: TTP
description: >
  Detects the use of apt-get with Pre-Invoke options which can be abused for privilege 
  escalation. The apt-get package manager supports Pre-Invoke and Post-Invoke hooks that 
  execute commands before and after package operations. Adversaries with sudo access 
  to apt-get can leverage these hooks to execute arbitrary commands as root, bypassing 
  restricted shell environments.
data_source:
  - Tetragon
  - Linux Auditd
search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - wildcard:
            full_log: "*apt-get*"
        - wildcard:
            full_log: "*Pre-Invoke*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - rule_mitre_id
    - rule_description
    - full_log
parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-01-28 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-01-28 23:59:59.999"
how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with Tetragon 
  or auditd process execution logging enabled. Ensure the agent is configured to 
  capture command-line arguments. The index pattern should match your Wazuh index 
  naming convention.
known_false_positives: >
  Pre-Invoke hooks are rarely used in normal operations. Legitimate use cases may 
  include custom package management scripts or system hardening tools, but these 
  should be well-documented. Any detection should be investigated.
references:
  - https://gtfobins.github.io/gtfobins/apt-get/
  - https://attack.mitre.org/techniques/T1548/003/
response:
  message: >
    APT-GET privilege escalation attempt detected on $agent_name$. 
    Command: $data_process_exec_process_binary$ $data_process_exec_process_arguments$
    The Pre-Invoke option was used which can execute arbitrary commands as root. MITRE ATT&CK: $rule_mitre_id$
  risk_score: 72
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 72
  threat_objects:
    - field: data_process_exec_process_binary
      type: process
tags:
  analytic_story:
    - Linux Privilege Escalation
    - Linux Living Off The Land
    - Compromised Linux Host
  asset_type: Linux
  mitre_attack_id:
    - T1548.003
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: full_log:/.*apt-get.*/ AND full_log:/.*Pre-Invoke.*/ AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: bb382fd5-b454-47ea-a264-1828e4c766d6
    name: Shell Invocation via Apt - Linux
    reason: 'Same GTFOBins family: apt spawning a shell; Pre-Invoke is one variant, shell-via-apt another.'
  - id: linux-auditd-apt-privilege-escalation-001
    name: Linux Auditd Apt Privilege Escalation
    reason: Sibling rule for the apt Pre-Invoke vector; the actor may try both binaries.
  - id: linux-sudo-or-su-execution-001
    name: Linux Sudo Or Su Execution
    reason: The exploit only escalates when apt-get runs under sudo; sudo usage precedes it.
  - id: linux-auditd-possible-access-sudoers-file-001
    name: Linux Auditd Possible Access To Sudoers File
    reason: Attackers check sudoers or sudo -l to find the NOPASSWD apt-get permission they abuse.
  - id: linux-whoami-user-discovery-001
    name: Linux Whoami User Discovery
    reason: whoami/id follows escalation to confirm root, or precedes it as discovery.
  - id: linux-unix-shell-configuration-modification-001
    name: Linux Unix Shell Configuration Modification
    reason: Once root, shell profile edits are a common persistence step.
  - id: linux-setuid-using-chmod-utility-001
    name: Linux Setuid Using Chmod Utility
    reason: A root shell is often used to plant a SUID backdoor.
  - id: linux-auditd-add-user-001
    name: Linux Auditd Add User
    reason: Rogue account creation commonly follows a successful root escalation.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Sudo privilege discovery and use
    query: (data_process_exec_process_binary:/.*(\/[Ss][Uu][Dd][Oo]|\/[Ss][Uu]|\/[Pp][Kk][Ee][Xx][Ee][Cc]|\/[Dd][Oo][Aa][Ss])/ OR data_process_exec_process_arguments:/.*(sudo\s+\-[Ll]|\/[Ee][Tt][Cc]\/[Ss][Uu][Dd][Oo][Ee][Rr][Ss]).*/)
    pivot_on: user
    window: 2h
  - name: Apt/dpkg with injected config options
    query: data_process_exec_process_binary:/.*(\/[Aa][Pp][Tt]|\/[Aa][Pp][Tt]-[Gg][Ee][Tt]|\/[Dd][Pp][Kk][Gg])/ AND data_process_exec_process_arguments:/.*([Pp][Rr][Ee]-[Ii][Nn][Vv][Oo][Kk][Ee]|[Pp][Oo][Ss][Tt]-[Ii][Nn][Vv][Oo][Kk][Ee]|\-[Oo]).*/
    pivot_on: host
    window: 2h
  - name: Shell spawned with elevated flags
    query: data_process_exec_process_binary:/.*(\/[Bb][Aa][Ss][Hh]|\/[Ss][Hh]|\/[Dd][Aa][Ss][Hh]|\/[Zz][Ss][Hh])/ AND data_process_exec_process_arguments:/.*(\-[IiPpCc]).*/
    pivot_on: host
    window: 2h
  - name: Post-escalation account and SUID changes
    query: data_process_exec_process_binary:/.*(\/[Uu][Ss][Ee][Rr][Aa][Dd][Dd]|\/[Aa][Dd][Dd][Uu][Ss][Ee][Rr]|\/[Uu][Ss][Ee][Rr][Mm][Oo][Dd]|\/[Cc][Hh][Pp][Aa][Ss][Ss][Ww][Dd]|\/[Pp][Aa][Ss][Ss][Ww][Dd])/ OR (data_process_exec_process_binary:/.*(\/[Cc][Hh][Mm][Oo][Dd]|\/[Ss][Ee][Tt][Cc][Aa][Pp])/ AND data_process_exec_process_arguments:/.*([Uu]\+[Ss]|[4][0-7][0-7][0-7]|[Cc][Aa][Pp]_[Ss][Ee][Tt][Uu][Ii][Dd]).*/)
    pivot_on: host
    window: 6h
  - name: Shadow/passwd/sudoers file access
    query: data_process_exec_process_arguments:/.*(\/[Ee][Tt][Cc]\/[Ss][Uu][Dd][Oo][Ee][Rr][Ss]|\/[Ee][Tt][Cc]\/[Ss][Hh][Aa][Dd][Oo][Ww]|\/[Ee][Tt][Cc]\/[Pp][Aa][Ss][Ss][Ww][Dd]).*/
    pivot_on: host
    window: 6h
