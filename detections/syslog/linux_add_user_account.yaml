name: Linux User Account Creation Detection
id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
version: 1
schema_version: "1.0"
date: "2026-01-29"
author: SOCFORTRESS LLC
status: production
type: TTP
description: >
  Detects attempts to create new user accounts on Linux systems using useradd 
  or adduser commands. This activity may indicate legitimate system administration 
  or could represent an attacker establishing persistence by creating rogue accounts.
  
data_source:
  - Wazuh Agent Logs
  - Linux Auditd
  - Syslog
search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  
  sort:
    - timestamp: desc
  
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - wildcard:
                  full_log: "*useradd*"
              - wildcard:
                  full_log: "*adduser*"
            minimum_should_match: 1
        
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - rule_mitre_id
    - rule_description
    - full_log
parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-01-28 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-01-28 23:59:59.999"
how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with 
  process execution logging enabled. Ensure the agent is configured to 
  capture command-line arguments. The index pattern should match your 
  Wazuh index naming convention.
known_false_positives: >
  System administrators legitimately creating user accounts for new employees 
  or service accounts. Automated provisioning systems may also trigger this 
  detection. Consider creating allowlists for known admin users or automation 
  service accounts.
references:
  - https://attack.mitre.org/techniques/T1136/001/
  - https://documentation.wazuh.com/current/user-manual/capabilities/index.html
response:
  message: >
    User account creation detected on $agent_name$. 
    Command: $data_process_exec_process_binary$ $data_process_exec_process_arguments$
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 45
  severity: medium
  
  risk_objects:
    - field: agent_name
      type: system
      score: 45
  
  threat_objects:
    - field: data_process_exec_process_binary
      type: process
tags:
  analytic_story:
    - Linux Persistence Techniques
    - Account Manipulation
  asset_type: Linux
  mitre_attack_id:
    - T1136.001  
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (full_log:/.*useradd.*/ OR full_log:/.*adduser.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: linux-auditd-add-user-001
    name: Linux Auditd Add User
    reason: Auditd record of the same account creation; corroborates it.
  - id: 759d0d51-bc99-4b5e-9add-8f5b2c8e7512
    name: Creation Of An User Account
    reason: Creation of a user account via auditd on the same host.
  - id: 6a50f16c-3b7b-42d1-b081-0fdd3ba70a73
    name: User Added To Root/Sudoers Group Using Usermod
    reason: Adding the new account to sudo/root group grants privilege.
  - id: a1b2c3d4-5e6f-7a8b-9c0d-e1f2a3b4c5d6
    name: Linux Sudoers File Access
    reason: Sudoers file access often follows account creation to grant rights.
  - id: linux-visudo-utility-execution-001
    name: Linux Visudo Utility Execution
    reason: visudo edits grant the new account sudo.
  - id: linux-auditd-ssh-config-keys-deletion-001
    name: Linux Auditd SSH Config Keys Deletion
    reason: Key deletion alongside a new account indicates access takeover.
  - id: 08f26069-6f80-474b-8d1f-d971c6fedea0
    name: User Has Been Deleted Via Userdel
    reason: Account deletion often marks cleanup of a temporary account.
  - id: linux-sudo-or-su-execution-001
    name: Linux Sudo Or Su Execution
    reason: Use of sudo/su by the new account to escalate.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Password set or privilege group change
    query: full_log:/.*(passwd|chpasswd|usermod|gpasswd).*/ AND full_log:/.*(sudo|wheel|admin|root|-aG|-G).*/
    pivot_on: host
    window: 6h
  - name: Sudoers modification
    query: full_log:/.*(\/etc\/sudoers|visudo|sudoers\.d).*/
    pivot_on: host
    window: 6h
  - name: SSH key planting
    query: full_log:/.*(authorized_keys|\.ssh\/).*/ AND full_log:/.*(echo|tee|cp|mv|chmod|>>).*/
    pivot_on: host
    window: 6h
  - name: Logins following account creation
    query: full_log:/.*(Accepted (password|publickey)|session opened for user).*/
    pivot_on: host
    window: 24h
  - name: passwd/shadow/group file tampering
    query: full_log:/.*(\/etc\/passwd|\/etc\/shadow|\/etc\/group).*/ AND full_log:/.*(echo|sed|tee|cat|>>|cp).*/
    pivot_on: host
    window: 6h
