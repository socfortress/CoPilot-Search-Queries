name: Linux Sudoers Tmp File Creation
id: linux-sudoers-tmp-file-creation-001
version: 1
schema_version: "1.0"
date: "2026-02-03"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  Detects the creation or access of the "sudoers.tmp" file, which occurs when 
  editing the /etc/sudoers file using visudo or another editor on Linux. 
  Monitoring this activity is crucial as adversaries may exploit it to gain 
  elevated privileges by modifying sudoers configurations. Associated with 
  Salt Typhoon and other China-Nexus threat activity.

data_source:
  - Tetragon
  - auth.log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - wildcard:
            full_log: "*sudoers*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-03 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-03 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with Tetragon 
  process execution logging enabled. Auth.log monitoring provides sudo command 
  visibility for sudoers file modifications.

known_false_positives: >
  Administrators may legitimately edit sudoers using visudo during system 
  configuration. Filter based on known administrative users and expected 
  maintenance windows.

references:
  - https://forum.ubuntuusers.de/topic/sudo-visudo-gibt-etc-sudoers-tmp/
  - https://attack.mitre.org/techniques/T1548/003/

response:
  message: >
    Sudoers file activity detected on $agent_name$. 
    Modifying sudoers can grant unauthorized elevated privileges. 
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 72
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 72
  threat_objects: []

tags:
  analytic_story:
    - Linux Persistence Techniques
    - China-Nexus Threat Activity
    - Salt Typhoon
    - Linux Privilege Escalation
  asset_type: Linux
  mitre_attack_id:
    - T1548.003
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: full_log:/.*sudoers.*/ AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: linux-visudo-utility-execution-001
    name: Linux Visudo Utility Execution
    reason: visudo is what creates sudoers.tmp; confirms an interactive edit and the invoking user.
  - id: linux-auditd-possible-access-sudoers-file-001
    name: Linux Auditd Possible Access To Sudoers File
    reason: Auditd file-access view of the same /etc/sudoers edit, showing the writing process.
  - id: a1b2c3d4-5e6f-7a8b-9c0d-e1f2a3b4c5d6
    name: Linux Sudoers File Access
    reason: Reads/writes of sudoers around the temp file show what was inspected or changed.
  - id: 6a50f16c-3b7b-42d1-b081-0fdd3ba70a73
    name: User Added To Root/Sudoers Group Using Usermod
    reason: 'Companion route to the same privilege grant: adding a user to sudo/wheel.'
  - id: linux-auditd-add-user-001
    name: Linux Auditd Add User
    reason: A newly created account is commonly given sudo rights immediately afterwards.
  - id: linux-sudo-or-su-execution-001
    name: Linux Sudo Or Su Execution
    reason: Shows the elevation that preceded the edit and root activity that follows once rights are granted.
  - id: 1182f3b3-e716-4efa-99ab-d2685d04360f
    name: History File Deletion
    reason: Salt Typhoon-style tradecraft hides the sudoers change by clearing shell history.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Sudoers edit tooling executed
    query: data_process_exec_process_binary:/.*(\/[Vv][Ii][Ss][Uu][Dd][Oo]|\/[Vv][Ii]|\/[Vv][Ii][Mm]|\/[Nn][Aa][Nn][Oo]|\/[Ss][Uu][Dd][Oo][Ee][Dd][Ii][Tt])/ AND data_process_exec_process_arguments:/.*[Ss][Uu][Dd][Oo][Ee][Rr][Ss].*/
    pivot_on: host
    window: 4h
  - name: NOPASSWD or ALL grants written via shell
    query: data_process_exec_process_arguments:/.*([Nn][Oo][Pp][Aa][Ss][Ss][Ww][Dd]|[Aa][Ll][Ll]=\(?[Aa][Ll][Ll]).*/
    pivot_on: host
    window: 4h
  - name: Account creation or group changes
    query: (data_process_exec_process_binary:/.*(\/[Uu][Ss][Ee][Rr][Aa][Dd][Dd]|\/[Uu][Ss][Ee][Rr][Mm][Oo][Dd]|\/[Aa][Dd][Dd][Uu][Ss][Ee][Rr]|\/[Pp][Aa][Ss][Ss][Ww][Dd]|\/[Cc][Hh][Pp][Aa][Ss][Ss][Ww][Dd])/ OR data_process_exec_process_binary:/.*(\/[Gg][Rr][Oo][Uu][Pp][Aa][Dd][Dd]|\/[Gg][Pp][Aa][Ss][Ss][Ww][Dd])/)
    pivot_on: host
    window: 6h
  - name: Root commands via sudo/su after change
    query: data_process_exec_process_binary:/.*(\/[Ss][Uu][Dd][Oo]|\/[Ss][Uu]|\/[Pp][Kk][Ee][Xx][Ee][Cc])/
    pivot_on: user
    window: 2h
  - name: Shell history cleared or tampered
    query: data_process_exec_process_arguments:/.*([Hh][Ii][Ss][Tt][Ff][Ii][Ll][Ee]|\.[Bb][Aa][Ss][Hh]_[Hh][Ii][Ss][Tt][Oo][Rr][Yy]|[Hh][Ii][Ss][Tt][Oo][Rr][Yy] +-[Cc]).*/
    pivot_on: host
    window: 2h
