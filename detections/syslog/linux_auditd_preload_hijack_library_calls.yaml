name: Linux Auditd Preload Hijack Library Calls
id: linux-auditd-preload-hijack-library-calls-001
version: 1
schema_version: "1.0"
date: "2026-02-04"
author: SOCFortress LLC
status: production
type: TTP
description: >
  Detects the use of the LD_PRELOAD environment variable to hijack or hook library 
  functions on a Linux platform. This technique is commonly used by adversaries, 
  malware authors, and red teamers to gain elevated privileges and establish 
  persistence on a compromised machine. If confirmed malicious, this behavior could 
  allow attackers to execute arbitrary code, escalate privileges, and maintain 
  long-term access to the system.
data_source:
  - Linux Auditd
search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - wildcard:
                  full_log: "*LD_PRELOAD*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location
parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-04 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-04 23:59:59.999"
how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with auditd 
  EXECVE logging configured to capture environment variables. Standard configurations 
  may not capture LD_PRELOAD. Add auditd rule: 
  auditctl -a always,exit -F arch=b64 -S execve -k exec_with_env
  Hex pattern 4C445F5052454C4F4144 represents LD_PRELOAD in hex-encoded auditd logs.
known_false_positives: >
  Some legitimate applications may use LD_PRELOAD for debugging or performance 
  profiling. Filter based on known development tools and authorized usage patterns.
references:
  - https://compilepeace.medium.com/memory-malware-part-0x2-writing-userland-rootkits-via-ld-preload-30121c8343d5
  - https://attack.mitre.org/techniques/T1574/006/
response:
  message: >
    LD_PRELOAD hijack attempt detected on $agent_name$. 
    The LD_PRELOAD environment variable can be used to load malicious libraries 
    and hijack function calls. MITRE ATT&CK: T1574.006
  risk_score: 81
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 81
  threat_objects: []
tags:
  analytic_story:
    - Linux Persistence Techniques
    - Compromised Linux Host
    - China-Nexus Threat Activity
    - Salt Typhoon
    - Linux Privilege Escalation
  asset_type: Linux
  mitre_attack_id:
    - T1574.006
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: full_log:/.*LD_PRELOAD.*/ AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored by the correlation engine for review. Related CoPilot Searches to run
  # around an alert from this rule, scoped to the same host/user/IP within the window.
  related_rules:
    - id: 683e6196-b8e8-11eb-9a79-acde48001122
      name: "Detect Renamed PSExec"
      reason: "same analytic story: China-Nexus Threat Activity"
    - id: 1b7bfb2c-b8e6-11eb-99ac-acde48001122
      name: "Detect Renamed WinRAR"
      reason: "same analytic story: China-Nexus Threat Activity"
    - id: 9be56c82-b1cc-4318-87eb-d138afaaca39
      name: "Malicious PowerShell Process - Execution Policy Bypass"
      reason: "same analytic story: China-Nexus Threat Activity"
    - id: windows-archive-collected-data-via-rar-001
      name: "Windows Archive Collected Data via Rar"
      reason: "same analytic story: Salt Typhoon"
    - id: windows-curl-download-suspicious-path-001
      name: "Windows Curl Download to Suspicious Path"
      reason: "same analytic story: Salt Typhoon"
    - id: windows-malicious-powershell-process-execution-policy-bypass-001
      name: "Windows Malicious PowerShell Process - Execution Policy Bypass"
      reason: "same analytic story: Salt Typhoon"
    - id: windows-powershell-4104-hunting-001
      name: "Windows PowerShell 4104 Hunting"
      reason: "same analytic story: Salt Typhoon"
  window: 1h
  enrichment_searches:
  # NEW ad-hoc searches the engine runs around an alert from this rule, scoped to
  # the alert's host/user/IP within the window (not existing CoPilot Searches).
    - name: "Auditd activity on this host in the window"
      query: 'data_audit_type:*'
      pivot_on: [host]
      window: 1h
    - name: "Process execution (execve) on this host"
      query: 'data_audit_syscall:"execve"'
      pivot_on: [host]
      window: 1h
    - name: "High-severity alerts on this host"
      query: 'rule_level:>=10'
      pivot_on: [host]
      window: 1h
