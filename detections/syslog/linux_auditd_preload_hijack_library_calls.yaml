name: Linux Auditd Preload Hijack Library Calls
id: linux-auditd-preload-hijack-library-calls-001
version: 1
schema_version: "1.0"
date: "2026-02-04"
author: SOCFortress LLC
status: production
type: TTP
description: >
  Detects the use of the LD_PRELOAD environment variable to hijack or hook library 
  functions on a Linux platform. This technique is commonly used by adversaries, 
  malware authors, and red teamers to gain elevated privileges and establish 
  persistence on a compromised machine. If confirmed malicious, this behavior could 
  allow attackers to execute arbitrary code, escalate privileges, and maintain 
  long-term access to the system.
data_source:
  - Linux Auditd
search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - wildcard:
                  full_log: "*LD_PRELOAD*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location
parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-04 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-04 23:59:59.999"
how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with auditd 
  EXECVE logging configured to capture environment variables. Standard configurations 
  may not capture LD_PRELOAD. Add auditd rule: 
  auditctl -a always,exit -F arch=b64 -S execve -k exec_with_env
  Hex pattern 4C445F5052454C4F4144 represents LD_PRELOAD in hex-encoded auditd logs.
known_false_positives: >
  Some legitimate applications may use LD_PRELOAD for debugging or performance 
  profiling. Filter based on known development tools and authorized usage patterns.
references:
  - https://compilepeace.medium.com/memory-malware-part-0x2-writing-userland-rootkits-via-ld-preload-30121c8343d5
  - https://attack.mitre.org/techniques/T1574/006/
response:
  message: >
    LD_PRELOAD hijack attempt detected on $agent_name$. 
    The LD_PRELOAD environment variable can be used to load malicious libraries 
    and hijack function calls. MITRE ATT&CK: T1574.006
  risk_score: 81
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 81
  threat_objects: []
tags:
  analytic_story:
    - Linux Persistence Techniques
    - Compromised Linux Host
    - China-Nexus Threat Activity
    - Salt Typhoon
    - Linux Privilege Escalation
  asset_type: Linux
  mitre_attack_id:
    - T1574.006
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: full_log:/.*LD_PRELOAD.*/ AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: linux-preload-hijack-via-preload-file-001
    name: Linux Preload Hijack Via Preload File
    reason: LD_PRELOAD per-process injection is often paired with a persistent /etc/ld.so.preload entry to make the hook system-wide.
  - id: 4b3cb710-5e83-4715-8c45-8b2b5b3e5751
    name: Modification of ld.so.preload
    reason: Auditd view of writes to ld.so.preload on the same host confirms the hijack was made persistent.
  - id: linux-medusa-rootkit-001
    name: Linux Medusa Rootkit
    reason: Medusa is an LD_PRELOAD userland rootkit; its artifacts confirm the preload was a rootkit install.
  - id: linux-ingress-tool-transfer-hunting-001
    name: Linux Ingress Tool Transfer Hunting
    reason: The malicious shared object is usually downloaded just before being preloaded.
  - id: a94cdd87-6c54-4678-a6cc-2814ffe5a13d
    name: Unix Shell Configuration Modification
    reason: LD_PRELOAD exported in .bashrc/profile is a user-level persistence variant of the same hijack.
  - id: a39d7fa7-3fbd-4dc2-97e1-d87f546b1bbc
    name: Program Executions in Suspicious Folders
    reason: Hook libraries and loader binaries typically sit in /tmp, /dev/shm or similar writable paths.
  - id: f7158a64-6204-4d6d-868a-6e6378b467e0
    name: Suspicious C2 Activities
    reason: Preload-based implants typically beacon out once hooked processes run.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Shared object dropped in writable path
    query: data_process_exec_process_binary:/.*(\/[Gg][Cc][Cc]|\/[Cc][Cc]|\/[Ll][Dd]|\/[Mm][Vv]|\/[Cc][Pp]|\/[Ww][Gg][Ee][Tt]|\/[Cc][Uu][Rr][Ll])/ AND data_process_exec_process_arguments:/.*(\.so|\/tmp\/|\/dev\/shm\/|\/var\/tmp\/).*/
    pivot_on: host
    window: 2h
  - name: Preload file or loader config touched
    query: data_process_exec_process_arguments:/.*([Ll][Dd]\.[Ss][Oo]\.[Pp][Rr][Ee][Ll][Oo][Aa][Dd]|[Ll][Dd]\.[Ss][Oo]\.[Cc][Oo][Nn][Ff]|[Ll][Dd]_[Ll][Ii][Bb][Rr][Aa][Rr][Yy]_[Pp][Aa][Tt][Hh]).*/
    pivot_on: host
    window: 4h
  - name: Shell persistence file edits
    query: data_process_exec_process_arguments:/.*(\.[Bb][Aa][Ss][Hh][Rr][Cc]|\.[Bb][Aa][Ss][Hh]_[Pp][Rr][Oo][Ff][Ii][Ll][Ee]|\.[Pp][Rr][Oo][Ff][Ii][Ll][Ee]|\/[Ee][Tt][Cc]\/[Pp][Rr][Oo][Ff][Ii][Ll][Ee]).*/
    pivot_on: user
    window: 4h
  - name: Outbound tooling after hook
    query: data_process_exec_process_binary:/.*(\/[Cc][Uu][Rr][Ll]|\/[Ww][Gg][Ee][Tt]|\/[Nn][Cc]|\/[Nn][Cc][Aa][Tt]|\/[Ss][Ss][Hh])/
    pivot_on: host
    window: 2h
