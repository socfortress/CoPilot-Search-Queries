name: Linux Service File Created In Systemd Directory
id: linux-service-file-created-in-systemd-directory-001
version: 1
schema_version: "1.0"
date: "2026-02-03"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  Detects the creation of suspicious service files within the systemd directories 
  on Linux platforms. This activity may indicate an adversary attempting to establish 
  persistence on a compromised host by creating malicious systemd service units that 
  will execute on system boot or service start.

data_source:
  - Tetragon
  - Linux Auditd
  - auth.log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - wildcard:
            full_log: "*.service*"
        - bool:
            should:
              - wildcard:
                  full_log: "*/etc/systemd/*"
              - wildcard:
                  full_log: "*/lib/systemd/*"
              - wildcard:
                  full_log: "*/usr/lib/systemd/*"
              - wildcard:
                  full_log: "*/run/systemd/*"
              - wildcard:
                  full_log: "*/.config/systemd/*"
              - wildcard:
                  full_log: "*/.local/share/systemd/*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-03 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-03 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with Tetragon 
  or auditd process execution logging enabled. File integrity monitoring on systemd 
  directories is also recommended. The index pattern should match your Wazuh index 
  naming convention.

known_false_positives: >
  False positives may arise when administrators or network operators create service 
  files in systemd directories for legitimate automation tasks. Package installations 
  and updates may also create service files. Filter based on known service names and 
  authorized administrators.

references:
  - https://attack.mitre.org/techniques/T1053/006/
  - https://www.intezer.com/blog/research/kaiji-new-chinese-linux-malware-turning-to-golang/
  - https://redcanary.com/blog/attck-t1501-understanding-systemd-service-persistence/

response:
  message: >
    Service file activity detected in systemd directory on $agent_name$. 
    This may indicate persistence establishment via systemd service. 
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 64
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 64
  threat_objects: []

tags:
  analytic_story:
    - Linux Privilege Escalation
    - Linux Persistence Techniques
    - Linux Living Off The Land
    - Scheduled Tasks
  asset_type: Linux
  mitre_attack_id:
    - T1053.006
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: full_log:/.*\.service.*/ AND (full_log:/.*\/etc\/systemd\/.*/ OR full_log:/.*\/lib\/systemd\/.*/ OR full_log:/.*\/usr\/lib\/systemd\/.*/ OR full_log:/.*\/run\/systemd\/.*/ OR full_log:/.*\/.config\/systemd\/.*/ OR full_log:/.*\/.local\/share\/systemd\/.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: linux-service-started-or-enabled-001
    name: Linux Service Started Or Enabled
    reason: New unit files take effect when enabled/started; confirms activation.
  - id: linux-service-restarted-001
    name: Linux Service Restarted
    reason: Restart/daemon-reload activates the new unit.
  - id: b3c8e2d1-4f1a-4b7c-9a22-91a6f2c4e8de
    name: Linux Init Script Persistence Detection
    reason: Parallel persistence mechanism commonly planted together.
  - id: 8d4f7b23-1c9e-4a5f-9b6c-2f3e7d1a5b9c
    name: Suspicious Systemd Service Deletion
    reason: Cleanup of malicious units after use.
  - id: a39d7fa7-3fbd-4dc2-97e1-d87f546b1bbc
    name: Program Executions in Suspicious Folders
    reason: Unit ExecStart often points to binaries in tmp or hidden dirs.
  - id: 26f86252-1549-45e1-a212-eb26840e86bc
    name: File Download or Read to Pipe Execution
    reason: Payload the service runs is frequently downloaded just before.
  - id: linux-edit-cron-table-parameter-001
    name: Linux Edit Cron Table Parameter
    reason: Redundant persistence via cron.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Unit enable/start/reload
    query: full_log:/.*systemctl.*(enable|start|daemon-reload|link).*/
    pivot_on: host
    window: 4h
  - name: Payload download before unit
    query: full_log:/.*(curl|wget|scp|tftp).*(-o|-O|http).*/
    pivot_on: host
    window: 2h
  - name: Execution from suspicious paths
    query: full_log:/.*(\/tmp\/|\/dev\/shm\/|\/var\/tmp\/).*(chmod|\.sh).*/
    pivot_on: host
    window: 4h
  - name: Other persistence
    query: full_log:/.*(crontab|\/etc\/cron|rc\.local|\.bashrc|ld\.so\.preload|authorized_keys).*/
    pivot_on: host
    window: 6h
  - name: Unit with shell ExecStart
    query: full_log:/.*ExecStart=.*(bash|sh -c|\/tmp|\/dev\/shm).*/
    pivot_on: host
    window: 4h
