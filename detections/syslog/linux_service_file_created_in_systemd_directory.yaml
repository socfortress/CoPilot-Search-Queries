name: Linux Service File Created In Systemd Directory
id: linux-service-file-created-in-systemd-directory-001
version: 1
schema_version: "1.0"
date: "2026-02-03"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  Detects the creation of suspicious service files within the systemd directories 
  on Linux platforms. This activity may indicate an adversary attempting to establish 
  persistence on a compromised host by creating malicious systemd service units that 
  will execute on system boot or service start.

data_source:
  - Tetragon
  - Linux Auditd
  - auth.log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - wildcard:
            full_log: "*.service*"
        - bool:
            should:
              - wildcard:
                  full_log: "*/etc/systemd/*"
              - wildcard:
                  full_log: "*/lib/systemd/*"
              - wildcard:
                  full_log: "*/usr/lib/systemd/*"
              - wildcard:
                  full_log: "*/run/systemd/*"
              - wildcard:
                  full_log: "*/.config/systemd/*"
              - wildcard:
                  full_log: "*/.local/share/systemd/*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-03 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-03 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with Tetragon 
  or auditd process execution logging enabled. File integrity monitoring on systemd 
  directories is also recommended. The index pattern should match your Wazuh index 
  naming convention.

known_false_positives: >
  False positives may arise when administrators or network operators create service 
  files in systemd directories for legitimate automation tasks. Package installations 
  and updates may also create service files. Filter based on known service names and 
  authorized administrators.

references:
  - https://attack.mitre.org/techniques/T1053/006/
  - https://www.intezer.com/blog/research/kaiji-new-chinese-linux-malware-turning-to-golang/
  - https://redcanary.com/blog/attck-t1501-understanding-systemd-service-persistence/

response:
  message: >
    Service file activity detected in systemd directory on $agent_name$. 
    This may indicate persistence establishment via systemd service. 
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 64
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 64
  threat_objects: []

tags:
  analytic_story:
    - Linux Privilege Escalation
    - Linux Persistence Techniques
    - Linux Living Off The Land
    - Scheduled Tasks
  asset_type: Linux
  mitre_attack_id:
    - T1053.006
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: full_log:/.*\.service.*/ AND (full_log:/.*\/etc\/systemd\/.*/ OR full_log:/.*\/lib\/systemd\/.*/ OR full_log:/.*\/usr\/lib\/systemd\/.*/ OR full_log:/.*\/run\/systemd\/.*/ OR full_log:/.*\/.config\/systemd\/.*/ OR full_log:/.*\/.local\/share\/systemd\/.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored by the correlation engine for review. Related CoPilot Searches to run
  # around an alert from this rule, scoped to the same host/user/IP within the window.
  related_rules:
    - id: 26f86252-1549-45e1-a212-eb26840e86bc
      name: "File Download or Read to Pipe Execution"
      reason: "same analytic story: Linux Living Off The Land"
    - id: cb909b3e-512b-11ec-aa31-3e22fbd008af
      name: "Possible Lateral Movement PowerShell Spawn"
      reason: "same analytic story: Scheduled Tasks"
    - id: 12c80db8-ef62-4456-92df-b23e1b3219f6
      name: "Windows Enable Win32 ScheduledJob via Registry"
      reason: "same analytic story: Scheduled Tasks"
    - id: ddf82fcb-e9ee-40e3-8712-a50b5bf323fc
      name: "Windows PowerShell ScheduleTask"
      reason: "same analytic story: Scheduled Tasks"
    - id: windows-scheduled-task-created-public-path-001
      name: "Windows Scheduled Task Created Within Public Path"
      reason: "same analytic story: Scheduled Tasks"
    - id: windows-scheduled-task-created-spawn-shell-001
      name: "Windows Scheduled Task Created to Spawn Shell"
      reason: "same analytic story: Scheduled Tasks"
  window: 1h
  enrichment_searches:
  # Rule-specific telemetry pivots the engine runs around an alert from this rule,
  # scoped to the alert's host/user/IP within the window (behaviour-targeted, not a sweep).
    - name: "Cron / at / systemd-timer scheduling on this host"
      query: '(data_process_exec_process_binary:/.*(\/[Cc][Rr][Oo][Nn][Tt][Aa][Bb]|\/[Aa][Tt])/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Cc][Rr][Oo][Nn].*/ OR data_process_exec_process_arguments:/.*[Ss][Yy][Ss][Tt][Ee][Mm][Dd]\/[Ss][Yy][Ss][Tt][Ee][Mm].*/ OR data_process_exec_process_arguments:/.*\.[Tt][Ii][Mm][Ee][Rr].*/)'
      pivot_on: [host]
      window: 4h
    - name: "Shell / interpreter execution on this host"
      query: '(data_process_exec_process_binary:/.*(\/[Bb][Aa][Ss][Hh]|\/[Ss][Hh]|\/[Dd][Aa][Ss][Hh]|\/[Zz][Ss][Hh]|\/[Kk][Ss][Hh]|\/[Aa][Ss][Hh]|\/[Bb][Uu][Ss][Yy][Bb][Oo][Xx])/ OR data_process_exec_process_binary:/.*(\/[Pp][Yy][Tt][Hh][Oo][Nn]|\/[Pp][Yy][Tt][Hh][Oo][Nn]3|\/[Pp][Ee][Rr][Ll]|\/[Rr][Uu][Bb][Yy]|\/[Pp][Hh][Pp]|\/[Nn][Oo][Dd][Ee]|\/[Ll][Uu][Aa]|\/[Aa][Ww][Kk])/)'
      pivot_on: [host]
      window: 1h
    - name: "Reconnaissance commands on this host"
      query: 'data_process_exec_process_binary:/.*(\/[Ww][Hh][Oo][Aa][Mm][Ii]|\/[Ii][Dd]|\/[Uu][Nn][Aa][Mm][Ee]|\/[Hh][Oo][Ss][Tt][Nn][Aa][Mm][Ee]|\/[Hh][Oo][Ss][Tt][Nn][Aa][Mm][Ee][Cc][Tt][Ll]|\/[Ss][Ss]|\/[Nn][Ee][Tt][Ss][Tt][Aa][Tt]|\/[Ii][Ff][Cc][Oo][Nn][Ff][Ii][Gg]|\/[Aa][Rr][Pp]|\/[Ww]|\/[Ww][Hh][Oo]|\/[Ll][Aa][Ss][Tt]|\/[Ll][Ss][Oo][Ff]|\/[Nn][Mm][Aa][Pp]|\/[Dd][Ii][Gg]|\/[Ff][Ii][Nn][Dd])/'
      pivot_on: [host]
      window: 1h
    - name: "Persistence via cron / systemd / shell profiles on this host"
      query: '(data_process_exec_process_binary:/.*(\/[Cc][Rr][Oo][Nn][Tt][Aa][Bb]|\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]|\/[Aa][Tt]|\/[Uu][Pp][Dd][Aa][Tt][Ee]-[Rr][Cc]\.[Dd])/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Cc][Rr][Oo][Nn].*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Yy][Ss][Tt][Ee][Mm][Dd].*/ OR data_process_exec_process_arguments:/.*[Rr][Cc]\.[Ll][Oo][Cc][Aa][Ll].*/ OR data_process_exec_process_arguments:/.*\.[Bb][Aa][Ss][Hh][Rr][Cc].*/ OR data_process_exec_process_arguments:/.*\.[Bb][Aa][Ss][Hh]_[Pp][Rr][Oo][Ff][Ii][Ll][Ee].*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Pp][Rr][Oo][Ff][Ii][Ll][Ee].*/ OR data_process_exec_process_arguments:/.*[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Ee][Dd]_[Kk][Ee][Yy][Ss].*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ii][Nn][Ii][Tt]\.[Dd].*/)'
      pivot_on: [host]
      window: 4h
