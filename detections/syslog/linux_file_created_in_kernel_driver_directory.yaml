name: Linux Kernel Driver Activity Detection
id: d9f4b1a6-3c52-4a5c-9c8e-6b7f3e21a0dd
version: 1
schema_version: "1.0"
date: "2026-01-29"
author: SOCFORTRESS LLC
status: production
type: TTP

description: >
  Detects activity involving Linux kernel driver directories. Access to or
  modification of kernel drivers may indicate attempts to load malicious
  modules, tamper with kernel components, or establish stealthy persistence.

data_source:
  - Wazuh Agent Logs
  - Linux Auditd
  - Syslog

search:
  index_pattern: "${INDEX_PATTERN}"

  size: 100

  sort:
    - timestamp: desc

  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"

        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"

        - wildcard:
            full_log: "*/kernel/drivers/*"

        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"

      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"

  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - rule_mitre_id
    - rule_description
    - full_log

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"

  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"

  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-01-28 00:00:00.000"

  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-01-28 23:59:59.999"

how_to_implement: >
  This detection requires Linux endpoints with Wazuh agents configured to
  capture detailed process execution and file path activity. Monitoring
  kernel-related directories is critical for identifying advanced threats.

known_false_positives: >
  Legitimate kernel module installations, driver updates, or system upgrades
  may trigger this detection. Consider allowlisting trusted package managers
  or maintenance windows.

references:
  - https://attack.mitre.org/techniques/T1014/
  - https://attack.mitre.org/techniques/T1547/

response:
  message: >
    Kernel driver-related activity detected on $agent_name$.
    Review the process and command-line arguments for potential tampering.
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 65
  severity: high

  risk_objects:
    - field: agent_name
      type: system
      score: 65

  threat_objects:
    - field: data_process_exec_process_binary
      type: process

tags:
  analytic_story:
    - Kernel Manipulation
    - Linux Persistence
    - kernel
  asset_type: Linux
  mitre_attack_id:
    - T1014
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: full_log:/.*\/kernel\/drivers\/.*/ AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a1b2c3d4-5e6f-7a8b-9c0d-1e2f3a4b5c6d
    name: Linux Kernel Module Insertion
    reason: A .ko dropped into the driver tree is typically followed by loading it
  - id: f1e2d3c4-5b6a-7d8e-9f0a-1b2c3d4e5f6a
    name: Linux Kernel Module Load
    reason: Kernel module load events confirm a dropped driver was activated
  - id: 106d7cbd-80ff-4985-b682-a7043e5acb72
    name: Loading of Kernel Module via Insmod
    reason: insmod loading is the direct activation path for a planted module
  - id: linux-medusa-rootkit-001
    name: Linux Medusa Rootkit
    reason: Rootkits install through kernel module drops and modprobe/depmod
  - id: linux-kernel-module-rmmod-utility-001
    name: Linux Kernel Module Using Rmmod Utility
    reason: Module unloading indicates replacement or cleanup of a driver
  - id: linux-unload-module-via-modprobe-001
    name: Linux Unload Module Via Modprobe
    reason: modprobe -r shows removal or swapping of kernel modules
  - id: linux-preload-hijack-via-preload-file-001
    name: Linux Preload Hijack Via Preload File
    reason: Alternate userland rootkit mechanism often used alongside kernel modules
  - id: 80915f59-9b56-4616-9de0-fd0dea6c12fe
    name: Linux Logs Clearing Attempts
    reason: Rootkit installs are followed by log clearing
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Module load and depmod activity
    query: data_process_exec_process_binary:/.*(\\/[Ii][Nn][Ss][Mm][Oo][Dd]|\\/[Mm][Oo][Dd][Pp][Rr][Oo][Bb][Ee]|\\/[Dd][Ee][Pp][Mm][Oo][Dd]|\\/[Kk][Mm][Oo][Dd])/
    pivot_on: host
    window: 2h
  - name: Kernel module file drops and builds
    query: data_process_exec_process_binary:/.*(\\/[Cc][Pp]|\\/[Mm][Vv]|\\/[Ii][Nn][Ss][Tt][Aa][Ll][Ll]|\\/[Mm][Aa][Kk][Ee]|\\/[Gg][Cc][Cc]|\\/[Tt][Ee][Ee]|\\/[Dd][Dd])/ AND data_process_exec_process_arguments:/.*(\.[Kk][Oo]|\/[Ll][Ii][Bb]\/[Mm][Oo][Dd][Uu][Ll][Ee][Ss]|\/[Kk][Ee][Rr][Nn][Ee][Ll]\/[Dd][Rr][Ii][Vv][Ee][Rr][Ss]|[Kk][Bb][Uu][Ii][Ll][Dd]|[Ll][Ii][Nn][Uu][Xx]\-[Hh][Ee][Aa][Dd][Ee][Rr][Ss]).*/
    pivot_on: host
    window: 2h
  - name: Remote tool download before module drop
    query: data_process_exec_process_binary:/.*(\\/[Cc][Uu][Rr][Ll]|\\/[Ww][Gg][Ee][Tt]|\\/[Ss][Cc][Pp]|\\/[Tt][Ff][Tt][Pp])/ AND data_process_exec_process_arguments:/.*([Hh][Tt][Tt][Pp]|\.[Kk][Oo]|\.[Tt][Aa][Rr]|\.[Ss][Hh]).*/
    pivot_on: host
    window: 2h
  - name: Anti-forensics after kernel tampering
    query: (data_process_exec_process_binary:/.*(\\/[Rr][Mm]|\\/[Ss][Hh][Rr][Ee][Dd]|\\/[Tt][Rr][Uu][Nn][Cc][Aa][Tt][Ee]|\\/[Dd][Mm][Ee][Ss][Gg]|\\/[Jj][Oo][Uu][Rr][Nn][Aa][Ll][Cc][Tt][Ll])/ AND data_process_exec_process_arguments:/.*(\/[Vv][Aa][Rr]\/[Ll][Oo][Gg]|\-\-[Cc][Ll][Ee][Aa][Rr]|\-\-[Vv][Aa][Cc][Uu][Uu][Mm]|\.[Bb][Aa][Ss][Hh]_[Hh][Ii][Ss][Tt][Oo][Rr][Yy]).*/)
    pivot_on: host
    window: 2h
  - name: Privilege elevation preceding module install
    query: data_process_exec_process_binary:/.*(\\/[Ss][Uu][Dd][Oo]|\\/[Ss][Uu]|\\/[Pp][Kk][Ee][Xx][Ee][Cc]|\\/[Dd][Oo][Aa][Ss])/
    pivot_on: host
    window: 1h
