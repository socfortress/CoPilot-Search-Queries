name: Linux pkexec Privilege Escalation
id: linux-pkexec-privilege-escalation-001
version: 1
schema_version: "1.0"
date: "2026-02-04"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects the execution of pkexec on Linux systems. This detection monitors for 
  pkexec usage patterns that could indicate privilege escalation attempts, 
  including the CVE-2021-4034 (PwnKit) vulnerability where pkexec is executed 
  without command-line arguments to gain root privileges.

data_source:
  - auth.log
  - Tetragon
  - audit.log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - wildcard:
            full_log: "*pkexec*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-04 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-04 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with auth.log 
  and audit.log monitoring enabled. Tetragon provides additional process execution 
  visibility including parent-child relationships.

known_false_positives: >
  Legitimate use of pkexec for authorized privilege elevation. The CVE-2021-4034 
  exploit specifically involves pkexec with no arguments, which is highly anomalous. 
  Filter based on known administrative patterns.

references:
  - https://www.reddit.com/r/crowdstrike/comments/sdfeig/20220126_cool_query_friday_hunting_pwnkit_local/
  - https://linux.die.net/man/1/pkexec
  - https://www.bleepingcomputer.com/news/security/linux-system-service-bug-gives-root-on-all-major-distros-exploit-released/
  - https://attack.mitre.org/techniques/T1068/

response:
  message: >
    pkexec execution detected on $agent_name$. 
    Monitor for CVE-2021-4034 (PwnKit) exploitation where pkexec runs with no arguments. 
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 56
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 56
  threat_objects: []

tags:
  analytic_story:
    - Linux Privilege Escalation
    - Linux Living Off The Land
  asset_type: CVE
  cve:
    - CVE-2021-4034
  mitre_attack_id:
    - T1068
    - T1078
  product:
    - Wazuh
  security_domain: endpoint

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: linux-setuid-using-chmod-utility-001
    name: Linux Setuid Using Chmod Utility
    reason: PwnKit actors often set SUID on a shell after gaining root
  - id: dae47c5a-769f-42c8-b256-f45c6146c320
    name: Linux User Account Creation Detection
    reason: Root access is commonly followed by creating a backdoor account
  - id: linux-auditd-possible-access-sudoers-file-001
    name: Linux Auditd Possible Access To Sudoers File
    reason: Post-root persistence includes sudoers modification
  - id: linux-append-cronjob-entry-001
    name: Linux Append Cronjob Entry On Existing Cronjob File
    reason: Cron entries added as persistence after privilege escalation
  - id: linux-auditd-chown-to-root-001
    name: Linux Auditd Chown To Root
    reason: Exploit payloads chown dropped binaries to root
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: pkexec with GCONV_PATH or no arguments
    query: data_process_exec_process_binary:/.*pkexec/ AND (data_process_exec_process_arguments:/.*GCONV_PATH.*/ OR (NOT _exists_:data_process_exec_process_arguments))
    pivot_on: host
    window: 2h
  - name: Execution from tmp or shm
    query: data_process_exec_process_binary:(/\/tmp\/.*/ OR /\/dev\/shm\/.*/ OR /\/var\/tmp\/.*/)
    pivot_on: host
    window: 4h
  - name: Compiler or downloader use
    query: data_process_exec_process_binary:(/.*\/gcc/ OR /.*\/make/ OR /.*\/wget/ OR /.*\/curl/)
    pivot_on: host
    window: 4h
  - name: SUID creation and passwd/shadow changes
    query: data_process_exec_process_arguments:(/.*chmod.*[+]s.*/ OR /.*4755.*/ OR /.*\/etc\/passwd.*/ OR /.*\/etc\/shadow.*/ OR /.*useradd.*/)
    pivot_on: host
    window: 4h
