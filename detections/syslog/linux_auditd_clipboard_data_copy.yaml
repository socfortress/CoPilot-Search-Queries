name: Linux Auditd Clipboard Data Copy
id: linux-auditd-clipboard-data-copy-001
version: 1
schema_version: "1.0"
date: "2026-01-28"
author: SOCFortress LLC
status: production
type: Anomaly
description: >
  Detects the use of xclip command to access or copy data from the clipboard. 
  Adversaries may collect data stored in the clipboard from users copying 
  information within or between applications. This technique is commonly used 
  for credential theft or sensitive data exfiltration.
data_source:
  - Tetragon
  - Linux Auditd
search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - wildcard:
            full_log: "*xclip*"
        - bool:
            should:
              - wildcard:
                  full_log: "*-o*"
              - wildcard:
                  full_log: "*-selection*"
              - wildcard:
                  full_log: "*-sel*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - rule_mitre_id
    - rule_description
    - full_log
parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-01-28 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-01-28 23:59:59.999"
how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with Tetragon 
  or auditd process execution logging enabled. Ensure the agent is configured to 
  capture command-line arguments. The index pattern should match your Wazuh index 
  naming convention.
known_false_positives: >
  Users and scripts may legitimately use xclip for clipboard operations in 
  automation workflows, password managers, or productivity tools. Filter based 
  on user context and frequency of usage.
references:
  - https://attack.mitre.org/techniques/T1115/
response:
  message: >
    Clipboard data access detected on $agent_name$ using xclip. 
    Command: $data_process_exec_process_binary$ $data_process_exec_process_arguments$
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_process_exec_process_binary
      type: process
tags:
  analytic_story:
    - Linux Living Off The Land
    - Data Exfiltration
    - Compromised Linux Host
  asset_type: Linux
  mitre_attack_id:
    - T1115
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: full_log:/.*xclip.*/ AND (full_log:/.*\-o.*/ OR full_log:/.*\-selection.*/ OR full_log:/.*\-sel.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: linux-auditd-possible-access-credential-files-001
    name: Linux Auditd Possible Access To Credential Files
    reason: Clipboard reads after credential files were opened indicate secret harvesting.
  - id: 3b4c5d6e-7f80-1234-5678-90abcdef1234
    name: Linux SSH Key Discovery
    reason: Key hunting followed by clipboard capture of key material is a credential-theft chain.
  - id: d4e5f6a7-8b9c-4d1e-a2b3-5f6e7a8b9c1d
    name: Linux SSH Configuration Access
    reason: SSH config access alongside clipboard reads suggests collection of remote access details.
  - id: linux-auditd-base64-decode-001
    name: Linux Auditd Base64 Decode
    reason: Captured data is often encoded before staging.
  - id: linux-auditd-data-transfer-size-limits-via-split-001
    name: Linux Auditd Data Transfer Size Limits Via Split
    reason: Collected data may be chunked next to evade transfer limits.
  - id: linux-proxy-socks-curl-001
    name: Linux Proxy Socks Curl
    reason: Collected content leaving via curl over a proxy is a likely exfil step.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Repeated clipboard tool access (xclip/xsel/wl-paste)
    query: data_process_exec_process_binary:/.*(\/[Xx][Cc][Ll][Ii][Pp]|\/[Xx][Ss][Ee][Ll]|\/[Ww][Ll]-[Pp][Aa][Ss][Tt][Ee]|\/[Ww][Ll]-[Cc][Oo][Pp][Yy])/
    pivot_on: host
    window: 2h
  - name: Credential and key file reads
    query: full_log:/.*(/[Ee][Tt][Cc]/[Ss][Hh][Aa][Dd][Oo][Ww]|[Ii][Dd]_[Rr][Ss][Aa]|[Ii][Dd]_[Ee][Dd]25519|.[Ss][Ss][Hh]/|.[Aa][Ww][Ss]/[Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll][Ss]|.[Kk][Uu][Bb][Ee]/[Cc][Oo][Nn][Ff][Ii][Gg]|.[Nn][Ee][Tt][Rr][Cc]|.[Gg][Ii][Tt]-[Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll][Ss]).*/
    pivot_on: user
    window: 2h
  - name: Outbound transfer tools
    query: data_process_exec_process_binary:/.*(\/[Cc][Uu][Rr][Ll]|\/[Ww][Gg][Ee][Tt]|\/[Nn][Cc]|\/[Nn][Cc][Aa][Tt]|\/[Ss][Cc][Pp]|\/[Ss][Ff][Tt][Pp])/
    pivot_on: host
    window: 2h
  - name: Archive or encode staging
    query: data_process_exec_process_binary:/.*(\/[Tt][Aa][Rr]|\/[Zz][Ii][Pp]|\/[Gg][Zz][Ii][Pp]|\/[Bb][Aa][Ss][Ee]64|\/[Ss][Pp][Ll][Ii][Tt])/
    pivot_on: host
    window: 2h
