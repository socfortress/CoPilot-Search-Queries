name: Linux Auditd Possible Access To Sudoers File
id: linux-auditd-possible-access-sudoers-file-001
version: 1
schema_version: "1.0"
date: "2026-02-04"
author: SOCFortress LLC
status: production
type: Anomaly
description: >
  Detects potential access or modification of the /etc/sudoers file on a Linux system.
  The sudoers file controls user permissions for executing commands with elevated 
  privileges. This activity could indicate an attacker attempting to gain persistence 
  or escalate privileges, compromising the security of the targeted host. Associated 
  with Cobalt Strike and China-Nexus threat activity.
data_source:
  - Tetragon
  - auth.log
  - Linux Auditd
search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - wildcard:
                  full_log: "*/etc/sudoers*"
              - wildcard:
                  full_log: "*sudoers.d*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location
parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-04 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-04 23:59:59.999"
how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with Tetragon 
  process execution logging enabled. Auth.log monitoring provides sudo command 
  visibility. Correlate with EXECVE or PROCTITLE events to identify the process 
  or user responsible.
known_false_positives: >
  Administrators may access sudoers files for legitimate privilege management. 
  Filter based on known administrative users and expected maintenance windows.
references:
  - https://attack.mitre.org/techniques/T1548/003/
  - https://web.archive.org/web/20210708035426/https://www.cobaltstrike.com/downloads/csmanual43.pdf
response:
  message: >
    Sudoers file access detected on $agent_name$. 
    Access to /etc/sudoers may indicate privilege enumeration or escalation attempt. 
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 25
  severity: low
  risk_objects:
    - field: agent_name
      type: system
      score: 25
  threat_objects: []
tags:
  analytic_story:
    - Linux Persistence Techniques
    - Compromised Linux Host
    - China-Nexus Threat Activity
    - Salt Typhoon
    - Linux Privilege Escalation
  asset_type: Linux
  mitre_attack_id:
    - T1548.003
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (full_log:/.*\/etc\/sudoers.*/ OR full_log:/.*sudoers\.d.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a1b2c3d4-5e6f-7a8b-9c0d-e1f2a3b4c5d6
    name: Linux Sudoers File Access
    reason: Sibling detection of sudoers access/NOPASSWD entries; confirms same activity.
  - id: linux-sudoers-tmp-file-creation-001
    name: Linux Sudoers Tmp File Creation
    reason: visudo/editor temp file shows an actual sudoers edit in progress.
  - id: linux-visudo-utility-execution-001
    name: Linux Visudo Utility Execution
    reason: visudo is the standard way a privilege grant is written.
  - id: linux-sudo-or-su-execution-001
    name: Linux Sudo Or Su Execution
    reason: Shows whether the newly granted rights are then exercised.
  - id: linux-auditd-add-user-001
    name: Linux Auditd Add User
    reason: New user plus sudoers grant is a classic privileged persistence pair.
  - id: e2f3g4h5-6789-1011-1213-141516171819
    name: Linux File Permission Modification Detection
    reason: chmod on sudoers or sudoers.d files to loosen access.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: NOPASSWD / ALL grants written
    query: full_log:/.*(NOPASSWD|ALL=\(ALL.*\) *ALL).*/
    pivot_on: host
    window: 2h
  - name: Group membership changes to sudo/wheel
    query: full_log:/.*(usermod.*(sudo|wheel|admin)|gpasswd.*(sudo|wheel)|adduser .* (sudo|wheel)).*/
    pivot_on: host
    window: 4h
  - name: Sudo executions by same user
    query: full_log:/.*COMMAND=.*/ AND NOT _exists_:data_win_system_eventID
    pivot_on: user
    window: 4h
  - name: Editors or redirects touching sudoers
    query: full_log:/.*(visudo|tee|echo|sed -i|vim|nano).*sudoers.*/
    pivot_on: host
    window: 2h
