name: Linux Kernel Module Using Rmmod Utility
id: linux-kernel-module-rmmod-utility-001
version: 1
schema_version: "1.0"
date: "2026-02-03"
author: SOCFortress LLC
status: production
type: TTP
description: >
  Detects suspicious use of the rmmod utility for kernel module removal, which may 
  indicate an attacker attempt to unload critical or security-related kernel modules. 
  The rmmod command is used to remove modules from the Linux kernel, and unauthorized 
  use can be a tactic to disable security features, conceal malicious activities, or 
  disrupt system operations.
data_source:
  - Tetragon
  - Linux Auditd
  - auth.log
search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - wildcard:
            full_log: "*rmmod*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location
parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-03 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-03 23:59:59.999"
how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with Tetragon 
  or auditd process execution logging enabled. Auth.log monitoring provides sudo 
  command visibility. The index pattern should match your Wazuh index naming convention.
known_false_positives: >
  Administrators may legitimately use rmmod during kernel module management or 
  system maintenance. System tools like mkinitramfs may reference rmmod during 
  boot image creation. Filter based on known administrative operations.
references:
  - https://attack.mitre.org/techniques/T1547/006/
  - https://www.splunk.com/en_us/blog/security/deep-dive-on-persistence-privilege-escalation-technique-and-detection-in-linux-platform.html
response:
  message: >
    Kernel module removal via rmmod detected on $agent_name$. 
    Removing kernel modules can disable security features or conceal malicious 
    activities. MITRE ATT&CK: $rule_mitre_id$
  risk_score: 72
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 72
  threat_objects: []
tags:
  analytic_story:
    - Linux Living Off The Land
    - Linux Privilege Escalation
    - Linux Persistence Techniques
    - Compromised Linux Host
  asset_type: Linux
  mitre_attack_id:
    - T1547.006
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: full_log:/.*rmmod.*/ AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 106d7cbd-80ff-4985-b682-a7043e5acb72
    name: Loading of Kernel Module via Insmod
    reason: insmod loading a replacement or malicious module is the typical counterpart to removing an existing one
  - id: a1b2c3d4-5e6f-7a8b-9c0d-1e2f3a4b5c6d
    name: Linux Kernel Module Insertion
    reason: Module insertion on the same host indicates swap of legitimate for attacker module
  - id: linux-unload-module-via-modprobe-001
    name: Linux Unload Module Via Modprobe
    reason: modprobe -r is an alternate way to unload modules with the same evasion objective
  - id: d9f4b1a6-3c52-4a5c-9c8e-6b7f3e21a0dd
    name: Linux Kernel Driver Activity Detection
    reason: Kernel driver activity records the module churn the rmmod belongs to
  - id: 4b3cb710-5e83-4715-8c45-8b2b5b3e5751
    name: Modification of ld.so.preload
    reason: ld.so.preload modification is the userland counterpart of rootkit hiding
  - id: linux-medusa-rootkit-001
    name: Linux Medusa Rootkit
    reason: Medusa rootkit installation involves module/preload manipulation after defences are removed
  - id: 0326c3c8-7803-4a0f-8c5c-368f747f7c3e
    name: Triple Cross eBPF Rootkit Execve Hijack
    reason: eBPF rootkit execve hijack shows kernel-level hiding that can follow disabling modules
  - id: linux-sudo-or-su-execution-001
    name: Linux Sudo Or Su Execution
    reason: rmmod requires root; the privilege elevation identifies the actor
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Kernel module management tooling
    query: data_process_exec_process_binary:/.*\/([Ii][Nn][Ss][Mm][Oo][Dd]|[Mm][Oo][Dd][Pp][Rr][Oo][Bb][Ee]|[Dd][Ee][Pp][Mm][Oo][Dd]|[Ll][Ss][Mm][Oo][Dd]|[Mm][Oo][Dd][Ii][Nn][Ff][Oo]).*/
    pivot_on:
    - host
    window: 4h
  - name: Security or monitoring services stopped
    query: (data_process_exec_process_binary:/.*\/([Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]|[Ss][Ee][Rr][Vv][Ii][Cc][Ee]|[Pp][Kk][Ii][Ll][Ll]|[Kk][Ii][Ll][Ll][Aa][Ll][Ll]).*/) AND (data_process_exec_process_arguments:/.*([Ss][Tt][Oo][Pp]|[Dd][Ii][Ss][Aa][Bb][Ll][Ee]|[Kk][Ii][Ll][Ll]).*/)
    pivot_on:
    - host
    window: 2h
  - name: Kernel module files and module config edits
    query: data_process_exec_process_arguments:/.*(\.ko( |$)|\/lib\/modules|\/etc\/modules|\/etc\/modprobe\.d|blacklist ).*/
    pivot_on:
    - host
    window: 4h
  - name: Audit and logging configuration changes
    query: (data_process_exec_process_binary:/.*\/([Aa][Uu][Dd][Ii][Tt][Cc][Tt][Ll]|[Aa][Uu][Gg][Rr][Ee][Nn][Rr][Uu][Ll][Ee][Ss]).*/) OR (data_process_exec_process_arguments:/.*(\/etc\/audit|\/etc\/rsyslog|auditd).*/)
    pivot_on:
    - host
    window: 4h
  - name: Preload and library hijack changes
    query: data_process_exec_process_arguments:/.*(ld\.so\.preload|LD_PRELOAD|\/etc\/ld\.so\.conf).*/
    pivot_on:
    - host
    window: 4h
