name: Linux Private Keys and Certificate Enumeration
id: linux-private-keys-certificate-enumeration-001
version: 1
schema_version: "1.0"
date: "2026-02-03"
author: SOCFortress LLC
status: production
type: Anomaly
description: >
  Detects suspicious attempts to find private keys and certificates, which may 
  indicate an attacker's effort to access sensitive cryptographic information. 
  Private keys are crucial for securing encrypted communications and data, and 
  unauthorized access to them can lead to severe security breaches, including 
  data decryption and identity theft.
data_source:
  - Tetragon
  - Linux Auditd
search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - wildcard:
                  full_log: "*find*"
              - wildcard:
                  full_log: "*grep*"
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  full_log: "*.pem*"
              - wildcard:
                  full_log: "*.cer*"
              - wildcard:
                  full_log: "*.crt*"
              - wildcard:
                  full_log: "*.pgp*"
              - wildcard:
                  full_log: "*.key*"
              - wildcard:
                  full_log: "*.gpg*"
              - wildcard:
                  full_log: "*.ppk*"
              - wildcard:
                  full_log: "*.p12*"
              - wildcard:
                  full_log: "*.pfx*"
              - wildcard:
                  full_log: "*.p7b*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location
parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-03 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-03 23:59:59.999"
how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with Tetragon 
  or auditd process execution logging enabled. The index pattern should match your 
  Wazuh index naming convention.
known_false_positives: >
  System processes like apt-key may legitimately search for GPG keys during package 
  verification. Administrators may search for certificates during troubleshooting. 
  Filter based on known system processes and authorized users.
references:
  - https://attack.mitre.org/techniques/T1552/004/
  - https://github.com/peass-ng/PEASS-ng/tree/master/linPEAS
response:
  message: >
    Private key or certificate enumeration detected on $agent_name$. 
    Searching for .pem, .key, .crt, .ppk, .p12 files may indicate credential 
    harvesting attempts. MITRE ATT&CK: $rule_mitre_id$
  risk_score: 64
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 64
  threat_objects: []
tags:
  analytic_story:
    - Linux Living Off The Land
    - Linux Privilege Escalation
    - Linux Persistence Techniques
    - Compromised Linux Host
  asset_type: Linux
  mitre_attack_id:
    - T1552.004
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (full_log:/.*find.*/ OR full_log:/.*grep.*/) AND (full_log:/.*\.pem.*/ OR full_log:/.*\.cer.*/ OR full_log:/.*\.crt.*/ OR full_log:/.*\.pgp.*/ OR full_log:/.*\.key.*/ OR full_log:/.*\.gpg.*/ OR full_log:/.*\.ppk.*/ OR full_log:/.*\.p12.*/ OR full_log:/.*\.pfx.*/ OR full_log:/.*\.p7b.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 3b4c5d6e-7f80-1234-5678-90abcdef1234
    name: Linux SSH Key Discovery
    reason: Key hunting commonly targets ~/.ssh in the same search sweep.
  - id: 4d5e6f7a-8b90-2345-6789-01abcdef2345
    name: Linux Credential Discovery
    reason: Broader credential hunting that usually accompanies private key enumeration.
  - id: linux-auditd-possible-access-credential-files-001
    name: Linux Auditd Possible Access To Credential Files
    reason: Actual reads of shadow/credential files are the follow-on to finding them.
  - id: 5f6a7b8c-9d01-3456-7890-12abcdef3456
    name: Linux Password Vault Discovery
    reason: Same hunt for secret stores in one discovery phase.
  - id: f3g4h5i6-7890-1112-1314-151617181920
    name: Linux File Discovery Detection
    reason: Generic file discovery precedes the targeted key search.
  - id: linux-whoami-user-discovery-001
    name: Linux Whoami User Discovery
    reason: Context discovery typically opens the post-compromise sequence.
  - id: linux-auditd-ssh-config-keys-deletion-001
    name: Linux Auditd SSH Config Keys Deletion
    reason: Key tampering/cleanup on SSH material after harvesting.
  - id: cb39d16b-b3b6-4a7a-8222-1cf24b686ffc
    name: Data Exfiltration with Wget
    reason: Harvested keys are commonly exfiltrated via wget/curl.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Archive or copy of key material
    query: data_process_exec_process_binary:/.*(\/[Tt][Aa][Rr]|\/[Zz][Ii][Pp]|\/[Cc][Pp]|\/[Ss][Cc][Pp]|\/[Rr][Ss][Yy][Nn][Cc]|\/[Gg][Zz][Ii][Pp])/ AND data_process_exec_process_arguments:/.*(\.[Pp][Ee][Mm]|\.[Kk][Ee][Yy]|\.[Pp]12|\.[Pp][Ff][Xx]|[Ii][Dd]_[Rr][Ss][Aa]|\.[Ss][Ss][Hh]).*/
    pivot_on: host
    window: 4h
  - name: Direct reads of SSH and key files
    query: data_process_exec_process_binary:/.*(\/[Cc][Aa][Tt]|\/[Ll][Ee][Ss][Ss]|\/[Hh][Ee][Aa][Dd]|\/[Tt][Aa][Ii][Ll]|\/[Ss][Tt][Rr][Ii][Nn][Gg][Ss])/ AND data_process_exec_process_arguments:/.*([Ii][Dd]_[Rr][Ss][Aa]|[Ii][Dd]_[Ee][Dd]25519|\.[Ss][Ss][Hh]\/|\.[Pp][Ee][Mm]|\.[Kk][Ee][Yy]|[Ss][Hh][Aa][Dd][Oo][Ww]).*/
    pivot_on: user
    window: 4h
  - name: Egress tooling after harvest
    query: data_process_exec_process_binary:/.*(\/[Cc][Uu][Rr][Ll]|\/[Ww][Gg][Ee][Tt]|\/[Nn][Cc]|\/[Nn][Cc][Aa][Tt]|\/[Ss][Cc][Pp]|\/[Ss][Ff][Tt][Pp])/
    pivot_on: host
    window: 4h
  - name: New SSH key trust added
    query: data_process_exec_process_arguments:/.*(\.[Ss][Ss][Hh]\/[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Ee][Dd]_[Kk][Ee][Yy][Ss]|[Ss][Ss][Hh]-[Kk][Ee][Yy][Gg][Ee][Nn]).*/
    pivot_on: host
    window: 6h
