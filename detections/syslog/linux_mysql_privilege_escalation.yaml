name: Linux MySQL Privilege Escalation
id: linux-mysql-privilege-escalation-001
version: 1
schema_version: "1.0"
date: "2026-02-03"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  Detects the execution of MySQL commands with elevated privileges using sudo, 
  specifically when MySQL is used with the -e flag and shell escape (\!) to execute 
  system commands. This GTFOBins technique allows attackers to gain root shell access 
  through MySQL's shell escape functionality.

data_source:
  - auth.log
  - Tetragon

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - wildcard:
            full_log: "*mysql*"
        - bool:
            should:
              - wildcard:
                  full_log: "*-e*"
              - wildcard:
                  full_log: "*\\!*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-03 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-03 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with auth.log 
  monitoring enabled. Tetragon provides additional process execution visibility. 
  The index pattern should match your Wazuh index naming convention.

known_false_positives: >
  Database administrators may legitimately use MySQL with the -e flag for scripting. 
  The shell escape pattern (\!) is rarely used legitimately. Filter based on known 
  administrative users and expected database operations.

references:
  - https://gtfobins.github.io/gtfobins/mysql/
  - https://attack.mitre.org/techniques/T1548/003/

response:
  message: >
    MySQL privilege escalation attempt detected on $agent_name$. 
    The mysql -e '\!' pattern can execute system commands as root. 
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 30
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 30
  threat_objects: []

tags:
  analytic_story:
    - Linux Privilege Escalation
    - Linux Living Off The Land
  asset_type: Linux
  mitre_attack_id:
    - T1548.003
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: full_log:/.*mysql.*/ AND (full_log:/.*-e.*/ OR full_log:/.*\\!.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: linux-sudo-or-su-execution-001
    name: Linux Sudo Or Su Execution
    reason: The mysql shell escape only yields root when run through sudo; sudo/su execution shows who ran it and what else they elevated
  - id: linux-setuid-using-chmod-utility-001
    name: Linux Setuid Using Chmod Utility
    reason: A root shell gained via mysql is commonly followed by planting a setuid binary for persistent root
  - id: 6a50f16c-3b7b-42d1-b081-0fdd3ba70a73
    name: User Added To Root/Sudoers Group Using Usermod
    reason: Adding the user to root/sudoers via usermod is a typical follow-on once root is obtained
  - id: fa4aaed5-4fe0-498d-bbc0-08e3346387ba
    name: Copy Passwd Or Shadow From TMP Path
    reason: Root access is often used to copy passwd/shadow for offline cracking
  - id: 26f86252-1549-45e1-a212-eb26840e86bc
    name: File Download or Read to Pipe Execution
    reason: Download-and-pipe-to-shell payload delivery commonly runs from the elevated shell
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: mysql client invoked with -e or shell escape
    query: (data_process_exec_process_binary:/.*\/(mysql|mariadb)/ AND data_process_exec_process_arguments:/.*(-e|\\!|system).*/)
    pivot_on: host
    window: 1h
  - name: Setuid or capability planting after elevation
    query: (data_process_exec_process_binary:/.*\/(chmod|setcap)/ AND data_process_exec_process_arguments:/.*(\+s|[2467]755|[2467]777|cap_setuid).*/)
    pivot_on: host
    window: 2h
  - name: Account, sudoers or password manipulation
    query: data_process_exec_process_binary:/.*\/(useradd|usermod|adduser|chpasswd|passwd|visudo)/
    pivot_on: host
    window: 4h
  - name: Access to shadow or sudoers files
    query: full_log:/.*(\/etc\/shadow|\/etc\/sudoers|\/etc\/passwd).*/
    pivot_on: host
    window: 4h
  - name: Payload download or reverse-shell tooling after root
    query: data_process_exec_process_binary:/.*\/(curl|wget|nc|ncat|socat)/
    pivot_on: host
    window: 2h
