name: Linux Auditd Daemon Start
id: linux-auditd-daemon-start-001
version: 1
schema_version: "1.0"
date: "2026-01-28"
author: SOCFortress LLC
status: production
type: Anomaly
description: >
  Detects auditd daemon start events (type=DAEMON_START) which indicate the audit 
  daemon has been started or restarted. While this is often legitimate during system 
  boot or maintenance, unexpected daemon restarts could indicate an attacker attempting 
  to clear audit logs or manipulate the auditing system to evade detection.
data_source:
  - Linux Auditd
search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - wildcard:
            full_log: "*type=DAEMON_START*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - rule_mitre_id
    - rule_description
    - full_log
parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-01-28 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-01-28 23:59:59.999"
how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with auditd 
  logging enabled. The auditd service must be configured to log daemon events. 
  The index pattern should match your Wazuh index naming convention.
known_false_positives: >
  System reboots, scheduled maintenance, and legitimate administrative actions 
  will trigger auditd daemon start events. Correlate with system boot times and 
  change management windows to reduce false positives.
references:
  - https://attack.mitre.org/techniques/T1562/001/
response:
  message: >
    Auditd daemon start event detected on $agent_name$. 
    Verify if this was expected due to system reboot or maintenance. 
    Unexpected restarts may indicate tampering. MITRE ATT&CK: $rule_mitre_id$
  risk_score: 25
  severity: low
  risk_objects:
    - field: agent_name
      type: system
      score: 25
  threat_objects: []
tags:
  analytic_story:
    - Linux Defense Evasion
    - Audit Log Manipulation
    - Compromised Linux Host
  asset_type: Linux
  mitre_attack_id:
    - T1562.001
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: full_log:/.*type=DAEMON_START.*/ AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: linux-auditd-daemon-shutdown-001
    name: Linux Auditd Daemon Shutdown
    reason: Preceding stop bounds the blind window
  - id: linux-auditd-daemon-abort-001
    name: Linux Auditd Daemon Abort
    reason: Start after abort indicates crash/kill then recovery
  - id: bed26dea-4525-47f4-b24a-76e30e44ffb0
    name: Audit Rules Deleted Via Auditctl
    reason: Restarted with fewer rules is evasion
  - id: 977ef627-4539-4875-adf4-ed8f780c4922
    name: Auditing Configuration Changes on Linux Host
    reason: Config edited before restart so new rules take effect
  - id: 80915f59-9b56-4616-9de0-fd0dea6c12fe
    name: Linux Logs Clearing Attempts
    reason: Log cleanup around the restart
  - id: 1182f3b3-e716-4efa-99ab-d2685d04360f
    name: History File Deletion
    reason: Shell history cleanup is a common companion during evasion
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Audit config and rule changes
    query: full_log:/.*(auditctl|audit\.rules|auditd\.conf|augenrules|type=CONFIG_CHANGE).*/
    pivot_on:
    - host
    window: 2h
  - name: Boot vs manual restart indicators
    query: full_log:/.*(type=SYSTEM_BOOT|type=SYSTEM_RUNLEVEL|type=SYSTEM_SHUTDOWN|systemctl.*restart.*auditd|service auditd).*/
    pivot_on:
    - host
    window: 2h
  - name: Log and history cleanup
    query: data_process_exec_process_binary:/.*(\/[Rr][Mm]|\/[Ss][Hh][Rr][Ee][Dd]|\/[Tt][Rr][Uu][Nn][Cc][Aa][Tt][Ee])/ AND full_log:/.*(\/var\/log|bash_history).*/
    pivot_on:
    - host
    window: 4h
  - name: Auditd/log service stop or disable
    query: full_log:/.*(systemctl|service).*(stop|disable|mask).*/ AND full_log:/.*(auditd|rsyslog|wazuh).*/
    pivot_on:
    - host
    window: 2h
