name: Linux Visudo Utility Execution
id: linux-visudo-utility-execution-001
version: 1
schema_version: "1.0"
date: "2026-02-03"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  Detects the execution of the visudo utility to modify the /etc/sudoers file on 
  a Linux system. Unauthorized changes to the /etc/sudoers file can grant elevated 
  privileges to users, potentially allowing adversaries to execute commands as root.

data_source:
  - Tetragon
  - Linux Auditd
  - auth.log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - wildcard:
            full_log: "*visudo*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-03 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-03 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with Tetragon 
  or auditd process execution logging enabled. The index pattern should match your 
  Wazuh index naming convention.

known_false_positives: >
  System administrators may legitimately use visudo to configure sudo privileges. 
  Filter based on authorized users and expected maintenance windows.

references:
  - https://askubuntu.com/questions/334318/sudoers-file-enable-nopasswd-for-user-all-commands
  - https://attack.mitre.org/techniques/T1548/003/

response:
  message: >
    Visudo utility execution detected on $agent_name$. 
    This may indicate an attempt to modify sudo privileges via /etc/sudoers. 
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 16
  severity: low
  risk_objects:
    - field: agent_name
      type: system
      score: 16
  threat_objects: []

tags:
  analytic_story:
    - Linux Privilege Escalation
    - Linux Persistence Techniques
  asset_type: Linux
  mitre_attack_id:
    - T1548.003
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: full_log:/.*visudo.*/ AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: linux-sudoers-tmp-file-creation-001
    name: Linux Sudoers Tmp File Creation
    reason: visudo writes sudoers.tmp; corroborates that an edit session actually happened.
  - id: linux-auditd-possible-access-sudoers-file-001
    name: Linux Auditd Possible Access To Sudoers File
    reason: File-level evidence of what in /etc/sudoers was read or modified.
  - id: a1b2c3d4-5e6f-7a8b-9c0d-e1f2a3b4c5d6
    name: Linux Sudoers File Access
    reason: Access to sudoers just before visudo may be reconnaissance of existing rules.
  - id: 6a50f16c-3b7b-42d1-b081-0fdd3ba70a73
    name: User Added To Root/Sudoers Group Using Usermod
    reason: Parallel privilege grant via group membership by the same actor.
  - id: linux-auditd-add-user-001
    name: Linux Auditd Add User
    reason: Backdoor account created before being granted sudo.
  - id: linux-sudo-or-su-execution-001
    name: Linux Sudo Or Su Execution
    reason: visudo needs root, so look at the sudo/su that elevated it and later root use.
  - id: linux-setuid-using-chmod-utility-001
    name: Linux Setuid Using Chmod Utility
    reason: Another root-persistence step often paired with sudoers tampering.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Elevation preceding visudo
    query: data_process_exec_process_binary:/.*(\/[Ss][Uu][Dd][Oo]|\/[Ss][Uu]|\/[Pp][Kk][Ee][Xx][Ee][Cc])/
    pivot_on: user
    window: 1h
  - name: Sudoers file references
    query: data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Uu][Dd][Oo][Ee][Rr][Ss].*/
    pivot_on: host
    window: 4h
  - name: User and group management
    query: (data_process_exec_process_binary:/.*(\/[Uu][Ss][Ee][Rr][Aa][Dd][Dd]|\/[Uu][Ss][Ee][Rr][Mm][Oo][Dd]|\/[Aa][Dd][Dd][Uu][Ss][Ee][Rr]|\/[Pp][Aa][Ss][Ss][Ww][Dd]|\/[Cc][Hh][Pp][Aa][Ss][Ss][Ww][Dd])/ OR data_process_exec_process_binary:/.*(\/[Gg][Rr][Oo][Uu][Pp][Aa][Dd][Dd]|\/[Gg][Pp][Aa][Ss][Ss][Ww][Dd])/)
    pivot_on: host
    window: 6h
  - name: Persistence files touched after privilege change
    query: data_process_exec_process_arguments:/.*(\/[Ee][Tt][Cc]\/[Cc][Rr][Oo][Nn]|[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Ee][Dd]_[Kk][Ee][Yy][Ss]|[Rr][Cc]\.[Ll][Oo][Cc][Aa][Ll]|\/[Ee][Tt][Cc]\/[Ss][Yy][Ss][Tt][Ee][Mm][Dd]).*/
    pivot_on: host
    window: 6h
