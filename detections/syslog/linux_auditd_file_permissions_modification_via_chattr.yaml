name: Linux File Attribute Modification Detection
id: a1b2c3d4-5678-9101-1121-314151617181
version: 1
schema_version: "1.0"
date: "2026-01-30"
author: SOCFORTRESS LLC
status: production
type: TTP
description: >
  Detects attempts to modify immutable file attributes using the `chattr -i`
  command on Linux systems, which may indicate tampering or persistence activity.
data_source:
  - Wazuh Agent Logs
  - Linux Auditd
  - Syslog
search:
  index_pattern: "${INDEX_PATTERN}"
  size: 20
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - wildcard:
            full_log: "*chattr*"
        - wildcard:
            full_log: "*-i*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location
parameters:
  AGENT_NAME:
    description: "Agent name to filter"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time"
    type: datetime
    required: true
    example: "2026-01-28 14:34:00.000"
  END_TIME:
    description: "Query end time"
    type: datetime
    required: true
    example: "2026-01-28 14:36:00.000"
how_to_implement: >
  Requires Linux endpoints with Wazuh agents capturing process execution.
  Monitoring `chattr -i` commands helps detect attempts to remove immutable
  attributes from critical system or security files.
known_false_positives: >
  Administrative tasks legitimately modifying file attributes for maintenance.
references:
  - https://attack.mitre.org/techniques/T1090/
  - https://man7.org/linux/man-pages/man1/chattr.1.html
response:
  message: >
    File attribute modification detected on $agent_name$.
    Command: $full_log$
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 45
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 45
  threat_objects:
    - field: full_log
      type: process
tags:
  analytic_story:
    - Linux Persistence
    - File Tampering
  asset_type: Linux
  mitre_attack_id:
    - T1090
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: full_log:/.*chattr.*/ AND full_log:/.*\-i.*/ AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a5b977d6-8a81-4475-91b9-49dbfcd941f7
    name: Remove Immutable File Attribute - Auditd
    reason: Auditd rule for chattr -i, the same attribute clearing seen from another log angle.
  - id: 34979410-e4b5-4e5d-8cfb-389fdff05c12
    name: Remove Immutable File Attribute
    reason: Process-creation view of the same chattr -i activity.
  - id: 977ef627-4539-4875-adf4-ed8f780c4922
    name: Auditing Configuration Changes on Linux Host
    reason: Defense evasion on audit configs often requires chattr -i first.
  - id: c830f15d-6f6e-430f-8074-6f73d6807841
    name: Logging Configuration Changes on Linux Host
    reason: Logging config tampering following attribute removal.
  - id: 4b3cb710-5e83-4715-8c45-8b2b5b3e5751
    name: Modification of ld.so.preload
    reason: ld.so.preload is a classic immutable-protected persistence target.
  - id: linux-auditd-ssh-config-keys-deletion-001
    name: Linux Auditd SSH Config Keys Deletion
    reason: SSH key tampering; authorized_keys are often chattr-locked.
  - id: 1182f3b3-e716-4efa-99ab-d2685d04360f
    name: History File Deletion
    reason: Anti-forensics commonly paired with attribute tampering.
  - id: linux-unix-shell-configuration-modification-001
    name: Linux Unix Shell Configuration Modification
    reason: Shell rc files are common immutable-protected persistence targets.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Immutable attribute changes either direction
    query: data_process_exec_process_binary:/.*chattr.*/
    pivot_on: host
    window: 4h
  - name: Edits to audit, log or preload config
    query: data_process_exec_process_arguments:/.*(audit\.rules|auditd\.conf|rsyslog|ld\.so\.preload|\/var\/log).*/
    pivot_on: host
    window: 4h
  - name: SSH authorized_keys or shell rc changes
    query: data_process_exec_process_arguments:/.*(authorized_keys|\.bashrc|\.profile|\/etc\/profile).*/
    pivot_on: host
    window: 4h
  - name: Account or sudoers modification
    query: (data_process_exec_process_binary:/.*(useradd|usermod|passwd|visudo).*/ OR data_process_exec_process_arguments:/.*sudoers.*/)
    pivot_on: host
    window: 4h
  - name: Log or history deletion
    query: data_process_exec_process_binary:/.*(rm|shred|truncate).*/ AND data_process_exec_process_arguments:/.*(\/var\/log|history).*/
    pivot_on: host
    window: 4h
