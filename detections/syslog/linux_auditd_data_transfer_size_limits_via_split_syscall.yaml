name: Linux Auditd Data Transfer Size Limits Via Split Syscall
id: linux-auditd-data-transfer-size-limits-via-split-syscall-001
version: 1
schema_version: "1.0"
date: "2026-01-28"
author: SOCFortress LLC
status: production
type: Anomaly
description: >
  Detects the use of the split command to break files into smaller parts, which may 
  indicate an attacker attempting to evade data transfer size limits or detection 
  mechanisms during data exfiltration. The split utility is commonly used to divide 
  large files into smaller chunks for easier transfer.
data_source:
  - Tetragon
  - Linux Auditd
search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - wildcard:
                  full_log: "*comm=\"split\"*"
              - wildcard:
                  full_log: "*/usr/bin/split*"
              - wildcard:
                  full_log: "*\"binary\":\"/usr/bin/split\"*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - rule_mitre_id
    - rule_description
    - full_log
parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-01-28 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-01-28 23:59:59.999"
how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with Tetragon 
  or auditd process execution logging enabled. Ensure the agent is configured to 
  capture command-line arguments. The index pattern should match your Wazuh index 
  naming convention.
known_false_positives: >
  System administrators may legitimately use split for log rotation, backup operations, 
  or file management tasks. Automated scripts that process large files may also trigger 
  this detection. Filter based on user context and file paths.
references:
  - https://attack.mitre.org/techniques/T1030/
response:
  message: >
    Data transfer size limit evasion detected via split command on $agent_name$. 
    Command: $data_process_exec_process_binary$ $data_process_exec_process_arguments$
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 25
  severity: low
  risk_objects:
    - field: agent_name
      type: system
      score: 25
  threat_objects:
    - field: data_process_exec_process_binary
      type: process
tags:
  analytic_story:
    - Linux Living Off The Land
    - Data Exfiltration
    - Compromised Linux Host
  asset_type: Linux
  mitre_attack_id:
    - T1030
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (full_log:/.*comm="split".*/ OR full_log:/.*\/usr\/bin\/split.*/ OR full_log:/.*"binary":"\/usr\/bin\/split".*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: linux-auditd-data-transfer-size-limits-via-split-001
    name: Linux Auditd Data Transfer Size Limits Via Split
    reason: Same split behaviour seen through the exec log path; confirms the chunking and gives the arguments (size, prefix).
  - id: linux-auditd-database-file-and-directory-discovery-001
    name: Linux Auditd Database File And Directory Discovery
    reason: Locating database/SQL files precedes staging and chunking them for exfiltration.
  - id: c3d9e7f1-6a2b-4d8f-9c2b-5e6f7a8b9c0d
    name: Linux Suspicious Curl Data Exfiltration
    reason: Split chunks are typically then uploaded over HTTP with curl.
  - id: 00b90cc1-17ec-402c-96ad-3a8117d7a582
    name: Suspicious Curl File Upload - Linux
    reason: Upload of the split parts to an external server is the usual next step.
  - id: cb39d16b-b3b6-4a7a-8222-1cf24b686ffc
    name: Data Exfiltration with Wget
    reason: Alternative transfer channel for the chunked data.
  - id: e2326866-609f-4015-aea9-7ec634e8aa04
    name: Shell Execution via Rsync - Linux
    reason: Rsync-style transfer of staged chunks to a remote host.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Archive/compression of data before split
    query: (data_process_exec_process_binary:/.*(tar|zip|7z|gzip|bzip2|xz).*/) AND NOT _exists_:data_win_system_eventID
    pivot_on: host
    window: 4h
  - name: Outbound transfer tools on this host
    query: (data_process_exec_process_binary:/.*(curl|wget|scp|rsync|sftp|nc|ncat).*/) AND NOT _exists_:data_win_system_eventID
    pivot_on: host
    window: 4h
  - name: Database and dump file access
    query: (full_log:/.*(\.sql|\.db|\.sqlite|mysqldump|pg_dump).*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/
    pivot_on: host
    window: 6h
  - name: Staging in temp directories
    query: (data_process_exec_process_arguments:/.*(\/tmp\/|\/dev\/shm\/|\/var\/tmp\/).*/) AND NOT _exists_:data_win_system_eventID
    pivot_on: host
    window: 4h
