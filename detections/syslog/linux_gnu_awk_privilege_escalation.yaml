name: Linux GNU Awk Privilege Escalation
id: linux-gnu-awk-privilege-escalation-001
version: 1
schema_version: "1.0"
date: "2026-02-04"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  Detects the execution of the 'gawk' command with elevated privileges using the 
  'BEGIN{system()}' pattern, which can allow a user to execute system commands as 
  root. This GTFOBins technique abuses gawk's ability to run arbitrary system 
  commands, enabling privilege escalation.

data_source:
  - auth.log
  - Tetragon

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - wildcard:
            full_log: "*gawk*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-04 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-04 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with auth.log 
  monitoring enabled. Tetragon provides additional process execution visibility.

known_false_positives: >
  System administrators and developers may legitimately use gawk for text processing. 
  However, the 'BEGIN{system()}' pattern with sudo is rarely used legitimately. 
  Filter based on known scripting workflows.

references:
  - https://gtfobins.github.io/gtfobins/gawk/
  - https://www.geeksforgeeks.org/gawk-command-in-linux-with-examples/
  - https://attack.mitre.org/techniques/T1548/003/

response:
  message: >
    GNU Awk privilege escalation attempt detected on $agent_name$. 
    The gawk BEGIN{system()} pattern can execute arbitrary system commands as root. 
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 30
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 30
  threat_objects: []

tags:
  analytic_story:
    - Linux Privilege Escalation
    - Linux Living Off The Land
  asset_type: Linux
  mitre_attack_id:
    - T1548.003
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: full_log:/.*gawk.*/ AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 8c1a5675-cb85-452f-a298-b01b22a51856
    name: Suspicious Invocation of Shell via AWK - Linux
    reason: Same awk system() abuse from process telemetry; confirms a shell was actually spawned.
  - id: linux-sudo-or-su-execution-001
    name: Linux Sudo Or Su Execution
    reason: The escalation runs through sudo; shows the invoking account and surrounding sudo use.
  - id: linux-auditd-possible-access-sudoers-file-001
    name: Linux Auditd Possible Access To Sudoers File
    reason: 'Precursor: attackers read sudoers to learn which binary is allowed under sudo.'
  - id: linux-whoami-user-discovery-001
    name: Linux Whoami User Discovery
    reason: Identity check typically follows a successful root shell.
  - id: linux-find-privilege-escalation-001
    name: Linux Find Privilege Escalation
    reason: Sibling sudo GTFOBins attempt commonly tried on the same host.
  - id: linux-setuid-using-chmod-utility-001
    name: Linux Setuid Using Chmod Utility
    reason: 'Root follow-on: planting a SUID shell for persistence.'
  - id: 759d0d51-bc99-4b5e-9add-8f5b2c8e7512
    name: Creation Of An User Account
    reason: 'Root follow-on: backdoor account creation.'
  - id: linux-ingress-tool-transfer-hunting-001
    name: Linux Ingress Tool Transfer Hunting
    reason: Enumeration or attack tooling downloaded before the escalation attempt.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: awk/gawk system() invocations
    query: (full_log:/.*awk.*/ AND (full_log:/.*system\(.*/ OR full_log:/.*BEGIN.*/ OR full_log:/.*\/bin\/sh.*/ OR full_log:/.*\/bin\/bash.*/)) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/
    pivot_on: host
    window: 2h
  - name: sudo -l and sudoers discovery
    query: ((full_log:/.*sudo.*/ AND full_log:/.*-l.*/) OR full_log:/.*\/etc\/sudoers.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/
    pivot_on: host
    window: 4h
  - name: Privilege-escalation recon tooling
    query: (full_log:/.*linpeas.*/ OR full_log:/.*linenum.*/ OR full_log:/.*pspy.*/ OR full_log:/.*-perm.*4000.*/ OR full_log:/.*getcap.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/
    pivot_on: host
    window: 4h
  - name: Persistence after root
    query: (full_log:/.*useradd.*/ OR full_log:/.*authorized_keys.*/ OR full_log:/.*crontab.*/ OR full_log:/.*chmod.*[u+]s.*/ OR full_log:/.*systemctl.*enable.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/
    pivot_on: host
    window: 4h
