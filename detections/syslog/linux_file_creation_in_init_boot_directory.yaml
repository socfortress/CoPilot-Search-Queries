name: Linux Init Script Persistence Detection
id: b3c8e2d1-4f1a-4b7c-9a22-91a6f2c4e8de
version: 1
schema_version: "1.0"
date: "2026-01-29"
author: SOCFORTRESS LLC
status: production
type: TTP

description: >
  Detects activity involving Linux init and startup script directories such as
  /etc/init.d, /etc/rc.d, /sbin/init.d, and rc.local. Adversaries may abuse these
  locations to establish persistence by executing malicious scripts at system
  startup or service initialization.

data_source:
  - Wazuh Agent Logs
  - Linux Auditd
  - Syslog

search:
  index_pattern: "${INDEX_PATTERN}"

  size: 100

  sort:
    - timestamp: desc

  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"

        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"

        - bool:
            should:
              - wildcard:
                  full_log: "*/etc/init.d/*"
              - wildcard:
                  full_log: "*/etc/rc.d/*"
              - wildcard:
                  full_log: "*/sbin/init.d/*"
              - wildcard:
                  full_log: "*/etc/rc.local*"
            minimum_should_match: 1

        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"

      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"

  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - rule_mitre_id
    - rule_description
    - full_log

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"

  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"

  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "now-24h"

  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "now"

how_to_implement: >
  This detection requires Linux systems with Wazuh agents configured to capture
  process execution and command-line activity. Ensure monitoring includes
  service management and system startup scripts.

known_false_positives: >
  Legitimate system administration tasks such as service installation,
  configuration management tools (e.g., Ansible, Puppet), or package updates
  may interact with init scripts. Allowlist known maintenance activities where appropriate.

references:
  - https://attack.mitre.org/techniques/T1037/
  - https://attack.mitre.org/techniques/T1547/

response:
  message: >
    Possible persistence-related activity detected on $agent_name$ involving
    Linux init or startup scripts.
    Command: $data_process_exec_process_binary$ $data_process_exec_process_arguments$
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 55
  severity: medium

  risk_objects:
    - field: agent_name
      type: system
      score: 55

  threat_objects:
    - field: data_process_exec_process_binary
      type: process

tags:
  analytic_story:
    - Linux Persistence
    - Startup Scripts Abuse
  asset_type: Linux
  mitre_attack_id:
    - T1037
    - T1547
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (full_log:/.*\/etc\/init\.d\/.*/ OR full_log:/.*\/etc\/rc\.d\/.*/ OR full_log:/.*\/sbin\/init\.d\/.*/ OR full_log:/.*\/etc\/rc\.local.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 4e2a6c91-7f3d-4b6e-9a4f-1c8b0e5a92d4
    name: Crontab Interactive Edit Execution
    reason: Attackers who plant a boot script usually add a second redundant persistence via cron on the same host.
  - id: linux-service-file-created-in-systemd-directory-001
    name: Linux Service File Created In Systemd Directory
    reason: Init scripts and systemd units are interchangeable boot persistence; a unit written alongside confirms deliberate persistence.
  - id: linux-append-cronjob-entry-001
    name: Linux Append Cronjob Entry On Existing Cronjob File
    reason: Cron append is the common companion persistence written in the same intrusion step.
  - id: linux-preload-hijack-via-preload-file-001
    name: Linux Preload Hijack Via Preload File
    reason: ld.so.preload tampering is a stealthier persistence layered with startup scripts by rootkit-style malware.
  - id: a1b2c3d4-5e6f-7a8b-9c0d-1e2f3a4b5c6d
    name: Linux Kernel Module Insertion
    reason: A boot script that reloads a kernel module is how rootkits survive reboot.
  - id: 6e2f9a41-3b7c-4d5e-8c9f-1a2b3d4f5e6a
    name: Linux Init.d Script Deletion
    reason: Init.d deletion nearby suggests replacing a legitimate service script with a trojanised one, or cleanup.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Writes and permission changes on init/rc paths
    query: (data_process_exec_process_arguments:/.*(\/[Ee][Tt][Cc]\/[Ii][Nn][Ii][Tt]\.[Dd]\/|\/[Ee][Tt][Cc]\/[Rr][Cc]\.[Dd]\/|\/[Ee][Tt][Cc]\/[Rr][Cc]\.[Ll][Oo][Cc][Aa][Ll]|\/[Ss][Bb][Ii][Nn]\/[Ii][Nn][Ii][Tt]\.[Dd]\/).*/) AND (data_process_exec_process_binary:/.*\/([Tt][Ee][Ee]|[Cc][Pp]|[Mm][Vv]|[Cc][Hh][Mm][Oo][Dd]|[Cc][Hh][Oo][Ww][Nn]|[Ll][Nn]|[Ss][Ee][Dd]|[Ii][Nn][Ss][Tt][Aa][Ll][Ll]|[Tt][Oo][Uu][Cc][Hh]|[Bb][Aa][Ss][Hh]|[Ss][Hh])/)
    pivot_on:
    - host
    window: 2h
  - name: Boot service registration (update-rc.d / chkconfig / systemctl enable)
    query: (data_process_exec_process_binary:/.*\/([Uu][Pp][Dd][Aa][Tt][Ee]\-[Rr][Cc]\.[Dd]|[Cc][Hh][Kk][Cc][Oo][Nn][Ff][Ii][Gg]|[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]|[Ii][Nn][Ss][Ss][Ee][Rr][Vv])/) AND data_process_exec_process_arguments:/.*([Ee][Nn][Aa][Bb][Ll][Ee]|[Dd][Ee][Ff][Aa][Uu][Ll][Tt][Ss]|\-\-[Aa][Dd][Dd]| [Oo][Nn]).*/
    pivot_on:
    - host
    window: 2h
  - name: Payload downloaded or staged in writable directories
    query: (data_process_exec_process_binary:/.*\/([Cc][Uu][Rr][Ll]|[Ww][Gg][Ee][Tt]|[Tt][Ff][Tt][Pp])/ OR data_process_exec_process_arguments:/.*(\/[Tt][Mm][Pp]\/|\/[Dd][Ee][Vv]\/[Ss][Hh][Mm]\/|\/[Vv][Aa][Rr]\/[Tt][Mm][Pp]\/).*/) AND (data_process_exec_process_binary:/.*\/([Cc][Hh][Mm][Oo][Dd]|[Cc][Uu][Rr][Ll]|[Ww][Gg][Ee][Tt]|[Bb][Aa][Ss][Hh]|[Ss][Hh])/)
    pivot_on:
    - host
    window: 4h
  - name: Other persistence on host (cron, systemd, preload, SSH keys)
    query: (data_process_exec_process_arguments:/.*(\/[Ee][Tt][Cc]\/[Cc][Rr][Oo][Nn]|[Cc][Rr][Oo][Nn][Tt][Aa][Bb]|\/[Ee][Tt][Cc]\/[Ss][Yy][Ss][Tt][Ee][Mm][Dd]\/|[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll] [Ee][Nn][Aa][Bb][Ll][Ee]|[Ll][Dd]\.[Ss][Oo]\.[Pp][Rr][Ee][Ll][Oo][Aa][Dd]|[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Ee][Dd]_[Kk][Ee][Yy][Ss]|\/[Ee][Tt][Cc]\/[Rr][Cc]\.[Ll][Oo][Cc][Aa][Ll]|\/[Ee][Tt][Cc]\/[Ii][Nn][Ii][Tt]\.[Dd]\/|\/[Ee][Tt][Cc]\/[Pp][Rr][Oo][Ff][Ii][Ll][Ee]).*/ OR data_process_exec_process_binary:/.*\/([Cc][Rr][Oo][Nn][Tt][Aa][Bb]|[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]|[Uu][Pp][Dd][Aa][Tt][Ee]\-[Rr][Cc]\.[Dd]|[Cc][Hh][Kk][Cc][Oo][Nn][Ff][Ii][Gg]|[Aa][Tt])/) AND NOT data_process_exec_process_arguments:/.*(\/[Ee][Tt][Cc]\/[Ii][Nn][Ii][Tt]\.[Dd]\/|\/[Ee][Tt][Cc]\/[Rr][Cc]\.[Dd]\/).*/
    pivot_on:
    - host
    window: 24h
  - name: Log and history tampering after persistence
    query: (data_process_exec_process_arguments:/.*([Hh][Ii][Ss][Tt][Oo][Rr][Yy] \-[Cc]|[Uu][Nn][Ss][Ee][Tt] [Hh][Ii][Ss][Tt][Ff][Ii][Ll][Ee]|[Hh][Ii][Ss][Tt][Ss][Ii][Zz][Ee]=0|\.[Bb][Aa][Ss][Hh]_[Hh][Ii][Ss][Tt][Oo][Rr][Yy]|\/[Vv][Aa][Rr]\/[Ll][Oo][Gg]\/|[Ss][Hh][Rr][Ee][Dd]|[Tt][Rr][Uu][Nn][Cc][Aa][Tt][Ee] \-[Ss] 0).*/ OR data_process_exec_process_binary:/.*\/([Ss][Hh][Rr][Ee][Dd]|[Tt][Rr][Uu][Nn][Cc][Aa][Tt][Ee]|[Aa][Uu][Dd][Ii][Tt][Cc][Tt][Ll])/)
    pivot_on:
    - host
    window: 24h
