name: Linux System Reboot Via System Request Key
id: linux-system-reboot-via-sysrq-001
version: 1
schema_version: "1.0"
date: "2026-02-03"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects the execution of SysReq commands to reboot a Linux system host. The pattern 
  'echo b > /proc/sysrq-trigger' is used to force an immediate system reboot without 
  unmounting filesystems. This technique was observed in the AwfulShred malware wiper 
  and indicates potential destructive activity.

data_source:
  - Tetragon
  - Linux Auditd

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - wildcard:
            full_log: "*sysrq*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-03 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-03 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with Tetragon 
  or auditd process execution logging enabled. The index pattern should match your 
  Wazuh index naming convention.

known_false_positives: >
  SysRq usage is very rare in normal operations and is typically only used for 
  debugging kernel issues. Any detection should be thoroughly investigated.

references:
  - https://www.kernel.org/doc/html/latest/admin-guide/sysrq.html
  - https://cert.gov.ua/article/3718487
  - https://attack.mitre.org/techniques/T1529/

response:
  message: >
    SysRq activity detected on $agent_name$. 
    The sysrq-trigger can be used to force system reboots or other kernel actions. 
    This is commonly used in destructive malware like AwfulShred. MITRE ATT&CK: $rule_mitre_id$
  risk_score: 49
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 49
  threat_objects: []

tags:
  analytic_story:
    - AwfulShred
    - Data Destruction
  asset_type: Linux
  mitre_attack_id:
    - T1529
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: full_log:/.*sysrq.*/ AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: linux-unix-shell-enable-all-sysrq-functions-001
    name: Linux Unix Shell Enable All SysRq Functions
    reason: 'Precursor: all SysRq functions are enabled before the trigger is written.'
  - id: linux-auditd-data-destruction-command-001
    name: Linux Auditd Data Destruction Command
    reason: AwfulShred shreds data before forcing the reboot.
  - id: linux-dd-file-overwrite-001
    name: Linux DD File Overwrite
    reason: dd overwriting data prior to the reboot makes the host unrecoverable.
  - id: a3b7c9d2-4f5e-4b6d-8c1a-2d3f4e5b6c7a
    name: Linux Critical Directory Deletion
    reason: System directories removed shortly before the forced reboot.
  - id: 80915f59-9b56-4616-9de0-fd0dea6c12fe
    name: Linux Logs Clearing Attempts
    reason: Log clearing erases evidence of the wiper run.
  - id: linux-auditd-daemon-shutdown-001
    name: Linux Auditd Daemon Shutdown
    reason: Auditd stopping around the reboot supports a deliberate shutdown or evasion.
  - id: linux-auditd-ssh-config-keys-deletion-001
    name: Linux Auditd SSH Config Keys Deletion
    reason: SSH key and config removal accompanies AwfulShred.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Wiper destruction commands
    query: data_process_exec_process_binary:/.*(\/[Ss][Hh][Rr][Ee][Dd]|\/[Dd][Dd]|\/[Rr][Mm]|\/[Ww][Ii][Pp][Ee][Ff][Ss]|\/[Ss][Rr][Mm])/
    pivot_on: host
    window: 2h
  - name: Enabling sysrq via proc
    query: data_process_exec_process_arguments:/.*[Pp][Rr][Oo][Cc]\/[Ss][Yy][Ss]\/[Kk][Ee][Rr][Nn][Ee][Ll]\/[Ss][Yy][Ss][Rr][Qq].*/
    pivot_on: host
    window: 2h
  - name: Filesystem unmount or sync before reboot
    query: data_process_exec_process_binary:/.*(\/[Uu][Mm][Oo][Uu][Nn][Tt]|\/[Mm][Oo][Uu][Nn][Tt]|\/[Ss][Yy][Nn][Cc])/
    pivot_on: host
    window: 2h
  - name: Log and history removal
    query: data_process_exec_process_arguments:/.*(\/[Vv][Aa][Rr]\/[Ll][Oo][Gg]|[Hh][Ii][Ss][Tt][Ff][Ii][Ll][Ee]|\.[Bb][Aa][Ss][Hh]_[Hh][Ii][Ss][Tt][Oo][Rr][Yy]).*/
    pivot_on: host
    window: 2h
  - name: Standard reboot or shutdown commands
    query: data_process_exec_process_binary:/.*(\/[Rr][Ee][Bb][Oo][Oo][Tt]|\/[Ss][Hh][Uu][Tt][Dd][Oo][Ww][Nn]|\/[Pp][Oo][Ww][Ee][Rr][Oo][Ff][Ff]|\/[Hh][Aa][Ll][Tt])/
    pivot_on: host
    window: 2h
