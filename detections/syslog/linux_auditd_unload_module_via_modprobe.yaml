name: Linux Unload Module Via Modprobe
id: linux-unload-module-via-modprobe-001
version: 1
schema_version: "1.0"
date: "2026-02-03"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects suspicious use of the modprobe command to unload kernel modules, which 
  may indicate an attempt to disable critical system components or evade detection. 
  The modprobe utility manages kernel modules, and unauthorized unloading can disrupt 
  system security features, remove logging capabilities, or conceal malicious activities.

data_source:
  - Tetragon
  - Linux Auditd
  - auth.log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - wildcard:
            full_log: "*modprobe*"
        - wildcard:
            full_log: "*-r*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-03 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-03 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with Tetragon 
  or auditd process execution logging enabled. Auth.log monitoring provides sudo 
  command visibility. The index pattern should match your Wazuh index naming convention.

known_false_positives: >
  Administrators may legitimately unload kernel modules during maintenance or 
  troubleshooting. Filter based on known maintenance windows and authorized users.

references:
  - https://attack.mitre.org/techniques/T1547/006/

response:
  message: >
    Kernel module unload attempt detected on $agent_name$ via modprobe -r. 
    This may indicate defense evasion or tampering with kernel functionality. 
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 49
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 49
  threat_objects: []

tags:
  analytic_story:
    - Linux Living Off The Land
    - Linux Privilege Escalation
    - Linux Persistence Techniques
    - Compromised Linux Host
  asset_type: Linux
  mitre_attack_id:
    - T1547.006
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: full_log:/.*modprobe.*/ AND full_log:/.*-r.*/ AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: linux-kernel-module-rmmod-utility-001
    name: Linux Kernel Module Using Rmmod Utility
    reason: rmmod is the alternate way to unload modules; both together imply deliberate removal.
  - id: c830f15d-6f6e-430f-8074-6f73d6807841
    name: Logging Configuration Changes on Linux Host
    reason: Unloading a logging/security module often follows or precedes logging config changes.
  - id: linux-security-monitoring-service-stop-001
    name: Linux Security Monitoring Service Stop
    reason: Disabling the agent and unloading its kernel module are paired evasion steps.
  - id: e3a8a052-111f-4606-9aee-f28ebeb76776
    name: Disabling Security Tools
    reason: Security tools disabled around module unload point to defense evasion.
  - id: bed26dea-4525-47f4-b24a-76e30e44ffb0
    name: Audit Rules Deleted Via Auditctl
    reason: Audit rules deletion is the companion blinding step.
  - id: 106d7cbd-80ff-4985-b682-a7043e5acb72
    name: Loading of Kernel Module via Insmod
    reason: A malicious module loaded via insmod after the unload suggests a swap with a rootkit.
  - id: a1b2c3d4-5e6f-7a8b-9c0d-1e2f3a4b5c6d
    name: Linux Kernel Module Insertion
    reason: Module insertion after unload indicates replacement of a legitimate driver.
  - id: linux-auditd-daemon-shutdown-001
    name: Linux Auditd Daemon Shutdown
    reason: Auditd shutdown near an unload means a telemetry gap during the actor's work.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Kernel module load or removal tools
    query: full_log:/.*(insmod|rmmod|modprobe|depmod|finit_module|delete_module|init_module).*/
    pivot_on: host
    window: 6h
  - name: Security agent or auditd stopped
    query: full_log:/.*(systemctl (stop|disable|mask)|service .* stop|auditctl -(D|e 0)).*(audit|wazuh|falcon|osquery|tetragon|clamav).*/
    pivot_on: host
    window: 2h
  - name: Privilege escalation preceding unload
    query: full_log:/.*(sudo -i|sudo su|su -|pkexec).*/
    pivot_on: user
    window: 2h
  - name: Module files written in unusual paths
    query: full_log:/.*\.ko.*(\/tmp|\/dev\/shm|\/var\/tmp|\/home).*/
    pivot_on: host
    window: 6h
