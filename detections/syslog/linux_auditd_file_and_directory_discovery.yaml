name: Linux File Discovery Detection
id: f3g4h5i6-7890-1112-1314-151617181920
version: 1
schema_version: "1.0"
date: "2026-01-30"
author: SOCFORTRESS LLC
status: production
type: TTP
description: >
  Detects attempts to search for or enumerate files on Linux endpoints
  using commands like `find` or `grep` targeting sensitive file types
  such as PDFs, documents, spreadsheets, images, and media files.
  This may indicate data discovery or exfiltration attempts.
data_source:
  - Wazuh Agent Logs
  - Linux Auditd
  - Syslog
search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - wildcard: { full_log: "*find*" }
              - wildcard: { full_log: "*grep*" }
            minimum_should_match: 1
        - bool:
            should:
              - wildcard: { full_log: "*.pdf*" }
              - wildcard: { full_log: "*.doc*" }
              - wildcard: { full_log: "*.xlsx*" }
              - wildcard: { full_log: "*.jpg*" }
              - wildcard: { full_log: "*.png*" }
              - wildcard: { full_log: "*.mp4*" }
              - wildcard: { full_log: "*.mp3*" }
              - wildcard: { full_log: "*.avi*" }
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - rule_mitre_id
    - rule_description
    - full_log
parameters:
  AGENT_NAME:
    description: "Agent name to filter"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time"
    type: datetime
    required: true
    example: "2026-01-28 00:00:00.000"
  END_TIME:
    description: "Query end time"
    type: datetime
    required: true
    example: "2026-01-28 23:59:59.999"
how_to_implement: >
  Requires Linux endpoints with Wazuh agents capturing process execution.
  Monitoring file discovery activity on sensitive file types helps detect
  potential data exfiltration or reconnaissance activity.
known_false_positives: >
  Legitimate administrative or user searches for documents/media on the system.
references:
  - https://attack.mitre.org/techniques/T1083/
  - https://linux.die.net/man/1/find
  - https://linux.die.net/man/1/grep
response:
  message: >
    Suspicious file discovery activity detected on $agent_name$.
    Command: $full_log$
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 45
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 45
  threat_objects:
    - field: full_log
      type: process
tags:
  analytic_story:
    - Linux Reconnaissance
    - Data Discovery
  asset_type: Linux
  mitre_attack_id:
    - T1083
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (full_log:/.*find.*/ OR full_log:/.*grep.*/) AND (full_log:/.*\.pdf.*/ OR full_log:/.*\.doc.*/ OR full_log:/.*\.xlsx.*/ OR full_log:/.*\.jpg.*/ OR full_log:/.*\.png.*/ OR full_log:/.*\.mp4.*/ OR full_log:/.*\.mp3.*/ OR full_log:/.*\.avi.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 8344c0e5-5783-47cc-9cf9-a0f7fd03e6cf
    name: Potential Discovery Activity Using Find - Linux
    reason: Generic find-based enumeration by the same actor.
  - id: e34cfa0c-0a50-4210-9cb3-5632d08eb041
    name: Potential GobRAT File Discovery Via Grep
    reason: grep-driven file discovery typical of RAT recon.
  - id: linux-auditd-database-file-and-directory-discovery-001
    name: Linux Auditd Database File And Directory Discovery
    reason: Parallel discovery of database files on the same host.
  - id: 4d5e6f7a-8b90-2345-6789-01abcdef2345
    name: Linux Credential Discovery
    reason: Keyword find/grep for passwords on the same host; sibling of vault and key hunting in one credential-harvest pass.
  - id: 3b4c5d6e-7f80-1234-5678-90abcdef1234
    name: Linux SSH Key Discovery
    reason: Same discovery sweep aimed at SSH private keys; credential hunting commonly covers keys, passwords and vaults together.
  - id: linux-auditd-data-transfer-size-limits-via-split-001
    name: Linux Auditd Data Transfer Size Limits Via Split
    reason: Chunking collected files to fit exfil size limits after discovery.
  - id: c3d9e7f1-6a2b-4d8f-9c2b-5e6f7a8b9c0d
    name: Linux Suspicious Curl Data Exfiltration
    reason: Found documents or credentials leave the host via curl.
  - id: cb39d16b-b3b6-4a7a-8222-1cf24b686ffc
    name: Data Exfiltration with Wget
    reason: Wget-based POST/upload of located files.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Archiving or compressing files on host
    query: data_process_exec_process_binary:/.*(tar|zip|7z|7za|gzip|rar).*/
    pivot_on: host
    window: 4h
  - name: Outbound transfer tools
    query: data_process_exec_process_binary:/.*(curl|wget|scp|rsync|nc|ncat|sftp|ftp).*/
    pivot_on: host
    window: 4h
  - name: Find/grep with broad document or archive targets
    query: data_process_exec_process_binary:/.*(find|grep|locate).*/ AND data_process_exec_process_arguments:/.*(\.pdf|\.doc|\.xls|\.zip|\.sql|\.bak).*/
    pivot_on: host
    window: 2h
  - name: Copy or staging to tmp or shm
    query: data_process_exec_process_binary:/.*(cp|mv|rsync).*/ AND data_process_exec_process_arguments:/.*(\/tmp|\/dev\/shm|\/var\/tmp).*/
    pivot_on: host
    window: 4h
  - name: Remote login and privilege activity by user
    query: data_process_exec_process_binary:/.*(ssh|scp|sudo|su).*/
    pivot_on: user
    window: 6h
