name: Linux Stop Services
id: linux-stop-services-001
version: 1
schema_version: "1.0"
date: "2026-02-03"
author: SOCFortress LLC
status: production
type: Hunting
description: >
  Detects attempts to stop services on Linux systems. Adversaries often stop or 
  terminate security or critical services to disable defenses or disrupt operations, 
  as seen in malware like Industroyer2 and AwfulShred. This detection monitors for 
  SERVICE_STOP audit events and systemctl/service stop commands.
data_source:
  - Linux Auditd
  - auth.log
search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - wildcard:
                  full_log: "*SERVICE_STOP*"
              - wildcard:
                  full_log: "*systemctl*stop*"
              - wildcard:
                  full_log: "*service*stop*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location
parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-03 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-03 23:59:59.999"
how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with auditd 
  service monitoring enabled. Configure auditd to capture SERVICE_STOP events. 
  The index pattern should match your Wazuh index naming convention.
known_false_positives: >
  Administrators may legitimately stop services during maintenance or upgrades. 
  System services may be stopped as part of normal operations. Filter based on 
  known maintenance windows and critical service names.
references:
  - https://www.welivesecurity.com/2022/04/12/industroyer2-industroyer-reloaded/
  - https://cert.gov.ua/article/39518
  - https://attack.mitre.org/techniques/T1489/
response:
  message: >
    Service stop event detected on $agent_name$. 
    Stopping services may indicate defense evasion or destructive activity. 
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 25
  severity: low
  risk_objects:
    - field: agent_name
      type: system
      score: 25
  threat_objects: []
tags:
  analytic_story:
    - Industroyer2
    - Data Destruction
    - AwfulShred
    - Compromised Linux Host
  asset_type: Linux
  mitre_attack_id:
    - T1489
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (full_log:/.*SERVICE_STOP.*/ OR full_log:/.*systemctl.*stop.*/ OR full_log:/.*service.*stop.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: linux-security-monitoring-service-stop-001
    name: Linux Security Monitoring Service Stop
    reason: Distinguishes benign maintenance from stopping EDR/monitoring agents (defense evasion).
  - id: linux-auditd-osquery-service-stop-001
    name: Linux Auditd Osquery Service Stop
    reason: Osquery stop on the same host would show telemetry being blinded.
  - id: linux-disable-modify-system-firewall-001
    name: Linux Disable Or Modify System Firewall
    reason: Stopping services is often paired with disabling the firewall.
  - id: linux-auditd-daemon-shutdown-001
    name: Linux Auditd Daemon Shutdown
    reason: Stopping auditd silences the very logs these detections rely on.
  - id: linux-auditd-data-destruction-command-001
    name: Linux Auditd Data Destruction Command
    reason: Wiper malware (AwfulShred) stops services before destroying data.
  - id: linux-dd-file-overwrite-001
    name: Linux DD File Overwrite
    reason: Overwrite of disks/files commonly follows service stops in destructive ops.
  - id: linux-system-reboot-via-sysrq-001
    name: Linux System Reboot Via System Request Key
    reason: Forced reboot via sysrq is the final impact step in destructive sequences.
  - id: linux-sudo-or-su-execution-001
    name: Linux Sudo Or Su Execution
    reason: Stopping services requires root, so elevation precedes it.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Service disable, mask or kill
    query: data_process_exec_process_binary:/.*(\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]|\/[Ss][Ee][Rr][Vv][Ii][Cc][Ee]|\/[Kk][Ii][Ll][Ll]|\/[Pp][Kk][Ii][Ll][Ll]|\/[Kk][Ii][Ll][Ll][Aa][Ll][Ll]|\/[Cc][Hh][Kk][Cc][Oo][Nn][Ff][Ii][Gg])/ AND data_process_exec_process_arguments:/.*([Dd][Ii][Ss][Aa][Bb][Ll][Ee]|[Mm][Aa][Ss][Kk]|-9|[Ss][Tt][Oo][Pp]).*/
    pivot_on: host
    window: 2h
  - name: Security tool and log service targeting
    query: data_process_exec_process_arguments:/.*([Aa][Uu][Dd][Ii][Tt][Dd]|[Ww][Aa][Zz][Uu][Hh]|[Oo][Ss][Qq][Uu][Ee][Rr][Yy]|[Rr][Ss][Yy][Ss][Ll][Oo][Gg]|[Ff][Aa][Ll][Cc][Oo]|[Cc][Rr][Oo][Ww][Dd][Ss][Tt][Rr][Ii][Kk][Ee]|[Ss][Ee][Nn][Tt][Ii][Nn][Ee][Ll]|[Ff][Aa][Ii][Ll]2[Bb][Aa][Nn]).*/
    pivot_on: host
    window: 2h
  - name: Firewall changes
    query: data_process_exec_process_binary:/.*(\/[Ii][Pp][Tt][Aa][Bb][Ll][Ee][Ss]|\/[Uu][Ff][Ww]|\/[Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll]-[Cc][Mm][Dd]|\/[Nn][Ff][Tt])/
    pivot_on: host
    window: 2h
  - name: Destructive follow-on commands
    query: data_process_exec_process_binary:/.*(\/[Dd][Dd]|\/[Ss][Hh][Rr][Ee][Dd]|\/[Rr][Mm]|\/[Ww][Ii][Pp][Ee][Ff][Ss]|\/[Rr][Ee][Bb][Oo][Oo][Tt]|\/[Ss][Hh][Uu][Tt][Dd][Oo][Ww][Nn])/ AND data_process_exec_process_arguments:/.*(\/[Dd][Ee][Vv]\/|-[Rr][Ff]|\/[Vv][Aa][Rr]\/[Ll][Oo][Gg]|\/[Ee][Tt][Cc]).*/
    pivot_on: host
    window: 4h
