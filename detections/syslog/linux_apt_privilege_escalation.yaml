name: Linux Auditd Apt Privilege Escalation
id: linux-auditd-apt-privilege-escalation-001
version: 1
schema_version: "1.0"
date: "2026-01-28"
author: SOCFortress LLC
status: production
type: TTP
description: >
  Detects the use of apt with Pre-Invoke options which can be abused for privilege 
  escalation. The apt package manager supports Pre-Invoke and Post-Invoke hooks that 
  execute commands before and after package operations. Adversaries with sudo access 
  to apt can leverage these hooks to execute arbitrary commands as root, bypassing 
  restricted shell environments.
data_source:
  - Tetragon
  - Linux Auditd
search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - wildcard:
            full_log: "*apt*"
        - wildcard:
            full_log: "*Pre-Invoke*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - rule_mitre_id
    - rule_description
    - full_log
parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-01-28 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-01-28 23:59:59.999"
how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with Tetragon 
  or auditd process execution logging enabled. Ensure the agent is configured to 
  capture command-line arguments. The index pattern should match your Wazuh index 
  naming convention.
known_false_positives: >
  Pre-Invoke hooks are rarely used in normal operations. Legitimate use cases may 
  include custom package management scripts or system hardening tools, but these 
  should be well-documented. Any detection should be investigated.
references:
  - https://gtfobins.github.io/gtfobins/apt/
  - https://attack.mitre.org/techniques/T1548/003/
response:
  message: >
    APT privilege escalation attempt detected on $agent_name$. 
    Command: $data_process_exec_process_binary$ $data_process_exec_process_arguments$
    The Pre-Invoke option was used which can execute arbitrary commands as root. MITRE ATT&CK: $rule_mitre_id$
  risk_score: 72
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 72
  threat_objects:
    - field: data_process_exec_process_binary
      type: process
tags:
  analytic_story:
    - Linux Privilege Escalation
    - Linux Living Off The Land
    - Compromised Linux Host
  asset_type: Linux
  mitre_attack_id:
    - T1548.003
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: full_log:/.*apt.*/ AND full_log:/.*Pre-Invoke.*/ AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: bb382fd5-b454-47ea-a264-1828e4c766d6
    name: Shell Invocation via Apt - Linux
    reason: Direct same-binary sibling detecting apt spawning a shell.
  - id: linux-auditd-apt-get-privilege-escalation-001
    name: Linux Auditd Apt-Get Privilege Escalation
    reason: Sibling rule for apt-get Pre-Invoke; attackers try both package managers.
  - id: linux-sudo-or-su-execution-001
    name: Linux Sudo Or Su Execution
    reason: The abuse requires sudo rights on apt; sudo execution precedes it.
  - id: linux-auditd-possible-access-sudoers-file-001
    name: Linux Auditd Possible Access To Sudoers File
    reason: Sudoers inspection reveals the apt NOPASSWD entry being abused.
  - id: 700fb7e8-2981-401c-8430-be58e189e741
    name: Suspicious Package Installed - Linux
    reason: Package-manager abuse may accompany installation of attacker tooling.
  - id: linux-setuid-using-chmod-utility-001
    name: Linux Setuid Using Chmod Utility
    reason: Post-root SUID backdoor planting.
  - id: linux-auditd-add-user-001
    name: Linux Auditd Add User
    reason: Post-root rogue account creation.
  - id: linux-unix-shell-configuration-modification-001
    name: Linux Unix Shell Configuration Modification
    reason: Post-root persistence through shell profiles.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Sudo privilege discovery and use
    query: (data_process_exec_process_binary:/.*(\/[Ss][Uu][Dd][Oo]|\/[Ss][Uu]|\/[Pp][Kk][Ee][Xx][Ee][Cc]|\/[Dd][Oo][Aa][Ss])/ OR data_process_exec_process_arguments:/.*(sudo\s+\-[Ll]|\/[Ee][Tt][Cc]\/[Ss][Uu][Dd][Oo][Ee][Rr][Ss]).*/)
    pivot_on: user
    window: 2h
  - name: Apt with Pre-Invoke / option injection
    query: data_process_exec_process_binary:/.*(\/[Aa][Pp][Tt]|\/[Aa][Pp][Tt]-[Gg][Ee][Tt])/ AND data_process_exec_process_arguments:/.*([Pp][Rr][Ee]-[Ii][Nn][Vv][Oo][Kk][Ee]|[Pp][Oo][Ss][Tt]-[Ii][Nn][Vv][Oo][Kk][Ee]|[Aa][Pp][Tt]\:\:).*/
    pivot_on: host
    window: 2h
  - name: Shell spawned with elevated flags
    query: data_process_exec_process_binary:/.*(\/[Bb][Aa][Ss][Hh]|\/[Ss][Hh]|\/[Dd][Aa][Ss][Hh]|\/[Zz][Ss][Hh])/ AND data_process_exec_process_arguments:/.*(\-[IiPpCc]).*/
    pivot_on: host
    window: 2h
  - name: Post-escalation account and SUID changes
    query: data_process_exec_process_binary:/.*(\/[Uu][Ss][Ee][Rr][Aa][Dd][Dd]|\/[Aa][Dd][Dd][Uu][Ss][Ee][Rr]|\/[Uu][Ss][Ee][Rr][Mm][Oo][Dd]|\/[Cc][Hh][Pp][Aa][Ss][Ss][Ww][Dd]|\/[Pp][Aa][Ss][Ss][Ww][Dd])/ OR (data_process_exec_process_binary:/.*(\/[Cc][Hh][Mm][Oo][Dd]|\/[Ss][Ee][Tt][Cc][Aa][Pp])/ AND data_process_exec_process_arguments:/.*([Uu]\+[Ss]|[4][0-7][0-7][0-7]|[Cc][Aa][Pp]_[Ss][Ee][Tt][Uu][Ii][Dd]).*/)
    pivot_on: host
    window: 6h
  - name: Tooling staged in temp paths
    query: data_process_exec_process_binary:/.*\/(tmp|dev\/shm|var\/tmp)\/.*/
    pivot_on: host
    window: 6h
