name: Suspicious Systemd Service Deletion
id: 8d4f7b23-1c9e-4a5f-9b6c-2f3e7d1a5b9c
version: 1
schema_version: "1.0"
date: "2026-01-29"
author: SOCFORTRESS LLC
status: production
type: TTP

description: >
  Detects attempts to delete systemd service files (*.service) using commands
  like rm, rm -f, or rm -rf. This may indicate malicious activity aimed at
  disabling services or tampering with system configurations.

data_source:
  - Wazuh Agent Logs
  - Linux Auditd
  - Syslog

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            location: "/var/log/tetragon/tetragon.log"
        - wildcard:
            full_log: "*.service*"
        - bool:
            should:
              - wildcard:
                  full_log: "*\"/usr/bin/rm\"*systemd*"
              - wildcard:
                  full_log: "*rm -f*systemd*"
              - wildcard:
                  full_log: "*rm -rf*systemd*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary
    - rule_mitre_id
    - rule_description
    - full_log

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-01-28 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-01-28 23:59:59.999"

how_to_implement: >
  Requires Linux endpoints with Wazuh agents capturing process execution and
  command-line arguments. Monitoring deletion of systemd service files can
  reveal malicious tampering or service disruption attempts.

known_false_positives: >
  Legitimate service removal or system maintenance performed by trusted users.

references:
  - https://attack.mitre.org/techniques/T1485/
  - https://tetragon.io/docs/

response:
  message: >
    Suspicious deletion of systemd services detected on $agent_name$.
    Command: $data_process_exec_process_binary$ $data_process_exec_process_arguments$
    Parent: $data_process_exec_parent_binary$
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 85
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 85
  threat_objects:
    - field: data_process_exec_process_binary
      type: process

tags:
  analytic_story:
    - File Tampering
    - Systemd Security
  asset_type: Linux
  mitre_attack_id:
    - T1485
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: full_log:/.*\.service.*/ AND (full_log:/.*\/usr\/bin\/rm.*systemd.*/ OR full_log:/.*rm -f.*systemd.*/ OR full_log:/.*rm -rf.*systemd.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: linux-service-file-created-in-systemd-directory-001
    name: Linux Service File Created In Systemd Directory
    reason: A new unit file in the systemd dir on the same host suggests a malicious unit replacing the deleted one
  - id: linux-service-started-or-enabled-001
    name: Linux Service Started Or Enabled
    reason: Enabling or starting a service near the deletion points to a replacement or masquerading service
  - id: de25eeb8-3655-4643-ac3a-b662d3f26b6b
    name: Disable Or Stop Services
    reason: Services are usually stopped before their unit files are deleted
  - id: linux-stop-services-001
    name: Linux Stop Services
    reason: Stop commands against the same unit precede removal of its file
  - id: linux-security-monitoring-service-stop-001
    name: Linux Security Monitoring Service Stop
    reason: Deleted unit may be a security or monitoring agent; this confirms defense evasion
  - id: linux-auditd-osquery-service-stop-001
    name: Linux Auditd Osquery Service Stop
    reason: Osquery agent stop is a specific monitoring-disabling variant of the same intent
  - id: b3c8e2d1-4f1a-4b7c-9a22-91a6f2c4e8de
    name: Linux Init Script Persistence Detection
    reason: Init-script persistence changes complement systemd unit changes for survivability
  - id: linux-auditd-data-destruction-command-001
    name: Linux Auditd Data Destruction Command
    reason: Service removal may be part of destructive rm/shred behaviour
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: systemctl stop/disable/mask/daemon-reload
    query: data_process_exec_process_binary:/.*(\\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll])/ AND data_process_exec_process_arguments:/.*([Ss][Tt][Oo][Pp]|[Dd][Ii][Ss][Aa][Bb][Ll][Ee]|[Mm][Aa][Ss][Kk]|[Dd][Aa][Ee][Mm][Oo][Nn]\-[Rr][Ee][Ll][Oo][Aa][Dd]|[Kk][Ii][Ll][Ll]).*/
    pivot_on: host
    window: 1h
  - name: Unit files written under systemd paths
    query: data_process_exec_process_binary:/.*(\\/[Cc][Pp]|\\/[Mm][Vv]|\\/[Tt][Ee][Ee]|\\/[Ll][Nn]|\\/[Ii][Nn][Ss][Tt][Aa][Ll][Ll]|\\/[Cc][Aa][Tt]|\\/[Ss][Ee][Dd])/ AND data_process_exec_process_arguments:/.*(\/[Ee][Tt][Cc]\/[Ss][Yy][Ss][Tt][Ee][Mm][Dd]\/[Ss][Yy][Ss][Tt][Ee][Mm]|\/[Ll][Ii][Bb]\/[Ss][Yy][Ss][Tt][Ee][Mm][Dd]\/[Ss][Yy][Ss][Tt][Ee][Mm]|\/[Uu][Ss][Rr]\/[Ll][Ii][Bb]\/[Ss][Yy][Ss][Tt][Ee][Mm][Dd]\/[Ss][Yy][Ss][Tt][Ee][Mm]|\.[Ss][Ee][Rr][Vv][Ii][Cc][Ee]).*/
    pivot_on: host
    window: 2h
  - name: Process kill of services or security agents
    query: data_process_exec_process_binary:/.*(\\/[Kk][Ii][Ll][Ll]|\\/[Kk][Ii][Ll][Ll][Aa][Ll][Ll]|\\/[Pp][Kk][Ii][Ll][Ll])/ AND data_process_exec_process_arguments:/.*(\-9|[Ff][Aa][Ll][Cc][Oo]|[Tt][Ee][Tt][Rr][Aa][Gg][Oo][Nn]|[Ww][Aa][Zz][Uu][Hh]|[Aa][Uu][Dd][Ii][Tt][Dd]|[Oo][Ss][Qq][Uu][Ee][Rr][Yy]|[Ss][Ss][Hh][Dd]).*/
    pivot_on: host
    window: 1h
  - name: Recursive deletion or wipe tooling
    query: (data_process_exec_process_binary:/.*(\\/[Ss][Hh][Rr][Ee][Dd]|\\/[Ww][Ii][Pp][Ee][Ff][Ss])/ OR (data_process_exec_process_binary:/.*(\\/[Rr][Mm])/ AND data_process_exec_process_arguments:/.*(\-[Rr][Ff]|\-[Ff][Rr]|\-\-[Nn][Oo]\-[Pp][Rr][Ee][Ss][Ee][Rr][Vv][Ee]\-[Rr][Oo][Oo][Tt]).*/))
    pivot_on: host
    window: 2h
  - name: Newly enabled or started services
    query: data_process_exec_process_binary:/.*(\\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll])/ AND data_process_exec_process_arguments:/.*([Ee][Nn][Aa][Bb][Ll][Ee]|[Ss][Tt][Aa][Rr][Tt]|[Rr][Ee][Ss][Tt][Aa][Rr][Tt]|\-\-[Nn][Oo][Ww]).*/
    pivot_on: host
    window: 2h
