name: Linux File Creation In Profile Directory
id: linux-file-creation-profile-directory-001
version: 1
schema_version: "1.0"
date: "2026-02-03"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  Detects the creation or modification of files in the /etc/profile.d directory on 
  Linux systems. This directory is used for persistence by executing scripts upon 
  system boot or user login. Adversaries may place malicious scripts here to maintain 
  long-term access, associated with malware like Kaiji.

data_source:
  - Tetragon
  - auth.log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - wildcard:
            full_log: "*profile.d*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-03 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-03 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with Tetragon 
  process execution logging enabled. Auth.log monitoring provides sudo command 
  visibility. The index pattern should match your Wazuh index naming convention.

known_false_positives: >
  Administrators may create scripts in profile.d for automation purposes during 
  system configuration. Package installations may also add scripts to this directory. 
  Filter based on known administrative operations.

references:
  - https://attack.mitre.org/techniques/T1546/004/
  - https://www.intezer.com/blog/research/kaiji-new-chinese-linux-malware-turning-to-golang/

response:
  message: >
    File activity in /etc/profile.d detected on $agent_name$. 
    Files in this directory execute on user login, enabling persistence. 
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 56
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 56
  threat_objects: []

tags:
  analytic_story:
    - Linux Privilege Escalation
    - Linux Persistence Techniques
  asset_type: Linux
  mitre_attack_id:
    - T1546.004
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: full_log:/.*profile\.d.*/ AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: linux-append-cronjob-entry-001
    name: Linux Append Cronjob Entry On Existing Cronjob File
    reason: Kaiji-style malware pairs profile.d hooks with cron entries for redundant persistence.
  - id: linux-service-file-created-in-systemd-directory-001
    name: Linux Service File Created In Systemd Directory
    reason: Systemd units are the other boot persistence commonly dropped together with login hooks.
  - id: linux-preload-hijack-via-preload-file-001
    name: Linux Preload Hijack Via Preload File
    reason: Both run attacker code in every login or process; often combined in rootkit-grade persistence.
  - id: linux-sudo-or-su-execution-001
    name: Linux Sudo Or Su Execution
    reason: Writing to /etc/profile.d requires root, so the preceding sudo/su identifies the account used for elevation.
  - id: linux-auditd-ssh-config-keys-deletion-001
    name: Linux Auditd SSH Config Keys Deletion
    reason: Kaiji-like malware manipulates SSH keys and config around persistence installation.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Writes into profile.d and shell startup files
    query: (data_process_exec_process_arguments:/.*(\/[Ee][Tt][Cc]\/[Pp][Rr][Oo][Ff][Ii][Ll][Ee]\.[Dd]\/|\/[Ee][Tt][Cc]\/[Pp][Rr][Oo][Ff][Ii][Ll][Ee]|\.[Bb][Aa][Ss][Hh][Rr][Cc]|\.[Bb][Aa][Ss][Hh]_[Pp][Rr][Oo][Ff][Ii][Ll][Ee]|\.[Pp][Rr][Oo][Ff][Ii][Ll][Ee]|\/[Ee][Tt][Cc]\/[Bb][Aa][Ss][Hh]\.[Bb][Aa][Ss][Hh][Rr][Cc]|\/[Ee][Tt][Cc]\/[Ee][Nn][Vv][Ii][Rr][Oo][Nn][Mm][Ee][Nn][Tt]).*/) AND (data_process_exec_process_binary:/.*\/([Tt][Ee][Ee]|[Cc][Pp]|[Mm][Vv]|[Cc][Hh][Mm][Oo][Dd]|[Ss][Ee][Dd]|[Ii][Nn][Ss][Tt][Aa][Ll][Ll]|[Tt][Oo][Uu][Cc][Hh]|[Ee][Cc][Hh][Oo]|[Cc][Aa][Tt]|[Bb][Aa][Ss][Hh]|[Ss][Hh])/)
    pivot_on:
    - host
    window: 2h
  - name: Elevation preceding the write
    query: (data_process_exec_process_binary:/.*\/([Ss][Uu][Dd][Oo]|[Ss][Uu]|[Pp][Kk][Ee][Xx][Ee][Cc]|[Dd][Oo][Aa][Ss]|[Ss][Ee][Tt][Cc][Aa][Pp]|[Cc][Hh][Mm][Oo][Dd]|[Cc][Hh][Oo][Ww][Nn])/ OR data_process_exec_process_arguments:/.*([Cc][Hh][Mm][Oo][Dd] \+[Ss]|[Cc][Hh][Mm][Oo][Dd] [Uu]\+[Ss]|[Cc][Hh][Mm][Oo][Dd] 4755|[Cc][Hh][Mm][Oo][Dd] \+[Xx]).*/) AND data_process_exec_process_arguments:/.*([Pp][Rr][Oo][Ff][Ii][Ll][Ee]|\/[Ee][Tt][Cc]\/).*/
    pivot_on:
    - host
    window: 2h
  - name: Payload download or staging from writable paths
    query: ((data_process_exec_process_binary:/.*\/([Cc][Uu][Rr][Ll]|[Ww][Gg][Ee][Tt])/ AND data_process_exec_process_arguments:/.*([Hh][Tt][Tt][Pp]:\/\/|[Hh][Tt][Tt][Pp][Ss]:\/\/|[Ff][Tt][Pp]:\/\/).*/) OR (data_process_exec_process_arguments:/.*(\/[Tt][Mm][Pp]\/|\/[Dd][Ee][Vv]\/[Ss][Hh][Mm]\/|\/[Vv][Aa][Rr]\/[Tt][Mm][Pp]\/).*/ AND data_process_exec_process_binary:/.*\/([Cc][Hh][Mm][Oo][Dd]|[Bb][Aa][Ss][Hh]|[Ss][Hh])/))
    pivot_on:
    - host
    window: 4h
  - name: Redundant persistence on host
    query: (data_process_exec_process_arguments:/.*(\/[Ee][Tt][Cc]\/[Cc][Rr][Oo][Nn]|[Cc][Rr][Oo][Nn][Tt][Aa][Bb]|\/[Ee][Tt][Cc]\/[Ss][Yy][Ss][Tt][Ee][Mm][Dd]\/|[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll] [Ee][Nn][Aa][Bb][Ll][Ee]|[Ll][Dd]\.[Ss][Oo]\.[Pp][Rr][Ee][Ll][Oo][Aa][Dd]|[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Ee][Dd]_[Kk][Ee][Yy][Ss]|\/[Ee][Tt][Cc]\/[Rr][Cc]\.[Ll][Oo][Cc][Aa][Ll]|\/[Ee][Tt][Cc]\/[Ii][Nn][Ii][Tt]\.[Dd]\/|\/[Ee][Tt][Cc]\/[Pp][Rr][Oo][Ff][Ii][Ll][Ee]).*/ OR data_process_exec_process_binary:/.*\/([Cc][Rr][Oo][Nn][Tt][Aa][Bb]|[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]|[Uu][Pp][Dd][Aa][Tt][Ee]\-[Rr][Cc]\.[Dd]|[Cc][Hh][Kk][Cc][Oo][Nn][Ff][Ii][Gg]|[Aa][Tt])/) AND NOT data_process_exec_process_arguments:/.*(\/[Ee][Tt][Cc]\/[Pp][Rr][Oo][Ff][Ii][Ll][Ee]).*/
    pivot_on:
    - host
    window: 24h
  - name: Interactive logins that would trigger the hook
    query: full_log:/.*([Ss][Ee][Ss][Ss][Ii][Oo][Nn] [Oo][Pp][Ee][Nn][Ee][Dd] [Ff][Oo][Rr] [Uu][Ss][Ee][Rr]|[Aa][Cc][Cc][Ee][Pp][Tt][Ee][Dd] [Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd]|[Aa][Cc][Cc][Ee][Pp][Tt][Ee][Dd] [Pp][Uu][Bb][Ll][Ii][Cc][Kk][Ee][Yy]).*/
    pivot_on:
    - host
    window: 24h
