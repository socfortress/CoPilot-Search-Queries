name: Linux Unix Shell Configuration Modification
id: linux-unix-shell-configuration-modification-001
version: 1
schema_version: "1.0"
date: "2026-02-03"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects suspicious access or modifications to Unix shell configuration files, 
  which may indicate an attempt to alter system behavior or gain unauthorized access. 
  Shell configuration files like .bashrc, .profile, and /etc/profile control user 
  environment settings and can be used to execute malicious commands, escalate 
  privileges, or persist malicious activities.

data_source:
  - Tetragon
  - Linux Auditd

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - wildcard:
                  full_log: "*.bashrc*"
              - wildcard:
                  full_log: "*.bash_profile*"
              - wildcard:
                  full_log: "*profile.d*"
              - wildcard:
                  full_log: "*/etc/profile*"
              - wildcard:
                  full_log: "*.zshrc*"
              - wildcard:
                  full_log: "*.zprofile*"
              - wildcard:
                  full_log: "*/etc/shells*"
              - wildcard:
                  full_log: "*.bash_login*"
              - wildcard:
                  full_log: "*.bash_logout*"
              - wildcard:
                  full_log: "*/etc/bash.bashrc*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-03 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-03 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with Tetragon 
  or auditd process execution logging enabled. The index pattern should match your 
  Wazuh index naming convention.

known_false_positives: >
  Administrators may legitimately modify shell configuration files for system 
  customization. Software installations may also update these files. Filter based 
  on known automation scripts and authorized users.

references:
  - https://attack.mitre.org/techniques/T1546/004/
  - https://github.com/peass-ng/PEASS-ng/tree/master/linPEAS

response:
  message: >
    Unix shell configuration file access detected on $agent_name$. 
    Modification of shell config files can be used for persistence or privilege 
    escalation. MITRE ATT&CK: $rule_mitre_id$
  risk_score: 64
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 64
  threat_objects: []

tags:
  analytic_story:
    - Linux Living Off The Land
    - Linux Privilege Escalation
    - Linux Persistence Techniques
    - Compromised Linux Host
  asset_type: Linux
  mitre_attack_id:
    - T1546.004
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (full_log:/.*\.bashrc.*/ OR full_log:/.*\.bash_profile.*/ OR full_log:/.*profile\.d.*/ OR full_log:/.*\/etc\/profile.*/ OR full_log:/.*\.zshrc.*/ OR full_log:/.*\.zprofile.*/ OR full_log:/.*\/etc\/shells.*/ OR full_log:/.*\.bash_login.*/ OR full_log:/.*\.bash_logout.*/ OR full_log:/.*\/etc\/bash\.bashrc.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored by the correlation engine for review. Related CoPilot Searches to run
  # around an alert from this rule, scoped to the same host/user/IP within the window.
  related_rules:
    - id: 26f86252-1549-45e1-a212-eb26840e86bc
      name: "File Download or Read to Pipe Execution"
      reason: "same analytic story: Linux Living Off The Land"
  window: 1h
  enrichment_searches:
  # Rule-specific telemetry pivots the engine runs around an alert from this rule,
  # scoped to the alert's host/user/IP within the window (behaviour-targeted, not a sweep).
    - name: "Shell-profile / init persistence on this host"
      query: '((data_process_exec_process_arguments:/.*\.[Bb][Aa][Ss][Hh][Rr][Cc].*/) OR (data_process_exec_process_arguments:/.*\.[Bb][Aa][Ss][Hh]_[Pp][Rr][Oo][Ff][Ii][Ll][Ee].*/) OR (data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Pp][Rr][Oo][Ff][Ii][Ll][Ee].*/) OR (data_process_exec_process_arguments:/.*[Rr][Cc]\.[Ll][Oo][Cc][Aa][Ll].*/) OR (data_process_exec_process_arguments:/.*[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Ee][Dd]_[Kk][Ee][Yy][Ss].*/))'
      pivot_on: [host]
      window: 4h
    - name: "Shell / interpreter execution on this host"
      query: '((data_process_exec_process_binary:/.*(\/[Bb][Aa][Ss][Hh]|\/[Ss][Hh]|\/[Dd][Aa][Ss][Hh]|\/[Zz][Ss][Hh]|\/[Kk][Ss][Hh]|\/[Aa][Ss][Hh]|\/[Bb][Uu][Ss][Yy][Bb][Oo][Xx])/) OR (data_process_exec_process_binary:/.*(\/[Pp][Yy][Tt][Hh][Oo][Nn]|\/[Pp][Yy][Tt][Hh][Oo][Nn]3|\/[Pp][Ee][Rr][Ll]|\/[Rr][Uu][Bb][Yy]|\/[Pp][Hh][Pp]|\/[Nn][Oo][Dd][Ee]|\/[Ll][Uu][Aa]|\/[Aa][Ww][Kk])/))'
      pivot_on: [host]
      window: 1h
    - name: "Reconnaissance commands on this host"
      query: 'data_process_exec_process_binary:/.*(\/[Ww][Hh][Oo][Aa][Mm][Ii]|\/[Ii][Dd]|\/[Uu][Nn][Aa][Mm][Ee]|\/[Hh][Oo][Ss][Tt][Nn][Aa][Mm][Ee]|\/[Hh][Oo][Ss][Tt][Nn][Aa][Mm][Ee][Cc][Tt][Ll]|\/[Ss][Ss]|\/[Nn][Ee][Tt][Ss][Tt][Aa][Tt]|\/[Ii][Ff][Cc][Oo][Nn][Ff][Ii][Gg]|\/[Aa][Rr][Pp]|\/[Ww]|\/[Ww][Hh][Oo]|\/[Ll][Aa][Ss][Tt]|\/[Ll][Ss][Oo][Ff]|\/[Nn][Mm][Aa][Pp]|\/[Dd][Ii][Gg]|\/[Ff][Ii][Nn][Dd])/'
      pivot_on: [host]
      window: 1h
