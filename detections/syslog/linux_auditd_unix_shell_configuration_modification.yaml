name: Linux Unix Shell Configuration Modification
id: linux-unix-shell-configuration-modification-001
version: 1
schema_version: "1.0"
date: "2026-02-03"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects suspicious access or modifications to Unix shell configuration files, 
  which may indicate an attempt to alter system behavior or gain unauthorized access. 
  Shell configuration files like .bashrc, .profile, and /etc/profile control user 
  environment settings and can be used to execute malicious commands, escalate 
  privileges, or persist malicious activities.

data_source:
  - Tetragon
  - Linux Auditd

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - wildcard:
                  full_log: "*.bashrc*"
              - wildcard:
                  full_log: "*.bash_profile*"
              - wildcard:
                  full_log: "*profile.d*"
              - wildcard:
                  full_log: "*/etc/profile*"
              - wildcard:
                  full_log: "*.zshrc*"
              - wildcard:
                  full_log: "*.zprofile*"
              - wildcard:
                  full_log: "*/etc/shells*"
              - wildcard:
                  full_log: "*.bash_login*"
              - wildcard:
                  full_log: "*.bash_logout*"
              - wildcard:
                  full_log: "*/etc/bash.bashrc*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-03 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-03 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with Tetragon 
  or auditd process execution logging enabled. The index pattern should match your 
  Wazuh index naming convention.

known_false_positives: >
  Administrators may legitimately modify shell configuration files for system 
  customization. Software installations may also update these files. Filter based 
  on known automation scripts and authorized users.

references:
  - https://attack.mitre.org/techniques/T1546/004/
  - https://github.com/peass-ng/PEASS-ng/tree/master/linPEAS

response:
  message: >
    Unix shell configuration file access detected on $agent_name$. 
    Modification of shell config files can be used for persistence or privilege 
    escalation. MITRE ATT&CK: $rule_mitre_id$
  risk_score: 64
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 64
  threat_objects: []

tags:
  analytic_story:
    - Linux Living Off The Land
    - Linux Privilege Escalation
    - Linux Persistence Techniques
    - Compromised Linux Host
  asset_type: Linux
  mitre_attack_id:
    - T1546.004
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (full_log:/.*\.bashrc.*/ OR full_log:/.*\.bash_profile.*/ OR full_log:/.*profile\.d.*/ OR full_log:/.*\/etc\/profile.*/ OR full_log:/.*\.zshrc.*/ OR full_log:/.*\.zprofile.*/ OR full_log:/.*\/etc\/shells.*/ OR full_log:/.*\.bash_login.*/ OR full_log:/.*\.bash_logout.*/ OR full_log:/.*\/etc\/bash\.bashrc.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: linux-file-creation-profile-directory-001
    name: Linux File Creation In Profile Directory
    reason: Dropping scripts in profile.d is the system-wide variant of the same login-persistence trick.
  - id: a94cdd87-6c54-4678-a6cc-2814ffe5a13d
    name: Unix Shell Configuration Modification
    reason: Sibling detection for the same shell-config file edits from another telemetry shape.
  - id: linux-edit-cron-table-parameter-001
    name: Linux Edit Cron Table Parameter
    reason: Attackers pair rc-file persistence with cron for redundancy.
  - id: linux-service-file-created-in-systemd-directory-001
    name: Linux Service File Created In Systemd Directory
    reason: Systemd units are the other common persistence path added alongside rc edits.
  - id: linux-preload-hijack-via-preload-file-001
    name: Linux Preload Hijack Via Preload File
    reason: ld.so.preload hijack is a stealthier persistence that follows a shell-level foothold.
  - id: ba592c6d-6888-43c3-b8c6-689b8fe47337
    name: Linux Base64 Encoded Pipe to Shell
    reason: Payload planted in an rc file is often a base64 pipe-to-shell one-liner.
  - id: f1e2d3c4-5b6a-7d8e-9f0a-1b2c3d4e5f6a
    name: Linux Kernel Module Load
    reason: Hidden files/directories hold the staged payload the rc file launches.
  - id: 1182f3b3-e716-4efa-99ab-d2685d04360f
    name: History File Deletion
    reason: History deletion after editing rc files indicates cleanup of the persistence step.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Payload patterns in shell/profile writes
    query: full_log:/.*(bashrc|bash_profile|\.profile|zshrc|profile\.d).*(curl|wget|base64|nc |bash -i|\/dev\/tcp|python -c|eval).*/
    pivot_on: host
    window: 24h
  - name: Fetch-and-execute commands
    query: full_log:/.*(curl|wget).*(\| *(ba)?sh|-O \/tmp|-o \/tmp).*/
    pivot_on: host
    window: 6h
  - name: Persistence via cron or systemd
    query: full_log:/.*(crontab|\/etc\/cron|\/etc\/systemd\/system|systemctl enable).*/
    pivot_on: host
    window: 24h
  - name: Editors and redirects touching rc files
    query: full_log:/.*(vim|nano|vi |sed -i|tee -a|echo .*>>).*(rc|profile).*/
    pivot_on: user
    window: 6h
  - name: Alias or PATH tampering
    query: full_log:/.*(alias sudo|alias ssh|export PATH=|LD_PRELOAD).*/
    pivot_on: host
    window: 24h
