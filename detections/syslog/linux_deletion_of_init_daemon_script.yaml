name: Linux Init.d Script Deletion
id: 6e2f9a41-3b7c-4d5e-8c9f-1a2b3d4f5e6a
version: 1
schema_version: "1.0"
date: "2026-01-29"
author: SOCFORTRESS LLC
status: production
type: TTP

description: >
  Detects attempts to delete daemon scripts under /etc/init.d using
  commands like rm, rm -f, or rm -rf. This may indicate malicious
  attempts to disable system services or tamper with startup scripts.

data_source:
  - Wazuh Agent Logs
  - Linux Auditd
  - Syslog

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            location: "/var/log/tetragon/tetragon.log"
        - bool:
            should:
              - wildcard:
                  full_log: "*\"/usr/bin/rm\"*/etc/init.d/*"
              - wildcard:
                  full_log: "*rm -f*/etc/init.d/*"
              - wildcard:
                  full_log: "*rm -rf*/etc/init.d/*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary
    - rule_mitre_id
    - rule_description
    - full_log

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-01-28 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-01-28 23:59:59.999"

how_to_implement: >
  Requires Linux endpoints with Wazuh agents capturing process execution
  and command-line arguments. Monitoring deletion of /etc/init.d scripts
  can reveal tampering with system services.

known_false_positives: >
  Legitimate system maintenance or automated removal of service scripts
  by trusted users.

references:
  - https://attack.mitre.org/techniques/T1485/
  - https://tetragon.io/docs/

response:
  message: >
    Deletion of /etc/init.d scripts detected on $agent_name$.
    Command: $data_process_exec_process_binary$ $data_process_exec_process_arguments$
    Parent: $data_process_exec_parent_binary$
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 85
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 85
  threat_objects:
    - field: data_process_exec_process_binary
      type: process

tags:
  analytic_story:
    - File Tampering
    - Service Security
  asset_type: Linux
  mitre_attack_id:
    - T1485
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (full_log:/.*\/usr\/bin\/rm.*\/etc\/init\.d\/.*/ OR full_log:/.*rm -f.*\/etc\/init\.d\/.*/ OR full_log:/.*rm -rf.*\/etc\/init\.d\/.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b3c8e2d1-4f1a-4b7c-9a22-91a6f2c4e8de
    name: Linux Init Script Persistence Detection
    reason: Init scripts are created for persistence; deletion on the same host suggests a swap or cleanup of a malicious init entry
  - id: de25eeb8-3655-4643-ac3a-b662d3f26b6b
    name: Disable Or Stop Services
    reason: Removing init scripts is commonly paired with stopping or disabling the same services to blind defenses
  - id: linux-stop-services-001
    name: Linux Stop Services
    reason: Service stop commands just before or after the script is removed show the service was killed then its startup script erased
  - id: linux-security-monitoring-service-stop-001
    name: Linux Security Monitoring Service Stop
    reason: If the removed script belonged to a security agent, this shows the monitoring service was also stopped
  - id: linux-auditd-data-destruction-command-001
    name: Linux Auditd Data Destruction Command
    reason: Init.d deletion may be one step of broader destructive rm/shred activity
  - id: a3b7c9d2-4f5e-4b6d-8c1a-2d3f4e5b6c7a
    name: Linux Critical Directory Deletion
    reason: Deleting critical directories is the wider-scope version of the same destructive behaviour
  - id: 9f5d1b72-2e3f-4c6d-8a7e-1b2c3d4f5e6b
    name: Linux Cron File Deletion
    reason: Cron removal alongside init.d removal indicates systematic stripping of scheduled and startup mechanisms
  - id: 80915f59-9b56-4616-9de0-fd0dea6c12fe
    name: Linux Logs Clearing Attempts
    reason: Log clearing often accompanies service tampering to hide it
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Service stop/disable/mask commands
    query: data_process_exec_process_binary:/.*(\\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]|\\/[Ss][Ee][Rr][Vv][Ii][Cc][Ee]|\\/[Cc][Hh][Kk][Cc][Oo][Nn][Ff][Ii][Gg]|\\/[Uu][Pp][Dd][Aa][Tt][Ee]\-[Rr][Cc]\.[Dd]|\\/[Rr][Cc]\-[Uu][Pp][Dd][Aa][Tt][Ee]|\\/[Ii][Nn][Ss][Ss][Ee][Rr][Vv])/ AND data_process_exec_process_arguments:/.*([Ss][Tt][Oo][Pp]|[Dd][Ii][Ss][Aa][Bb][Ll][Ee]|[Mm][Aa][Ss][Kk]|[Rr][Ee][Mm][Oo][Vv][Ee]|[Dd][Ee][Ll][Ee][Tt][Ee]).*/
    pivot_on: host
    window: 1h
  - name: Startup persistence written to init.d, rc.local or systemd
    query: data_process_exec_process_binary:/.*(\\/[Cc][Pp]|\\/[Mm][Vv]|\\/[Tt][Ee][Ee]|\\/[Ll][Nn]|\\/[Ii][Nn][Ss][Tt][Aa][Ll][Ll]|\\/[Cc][Hh][Mm][Oo][Dd]|\\/[Ss][Ee][Dd]|\\/[Cc][Aa][Tt])/ AND data_process_exec_process_arguments:/.*(\/[Ee][Tt][Cc]\/[Ii][Nn][Ii][Tt]\.[Dd]|[Rr][Cc]\.[Ll][Oo][Cc][Aa][Ll]|\/[Ee][Tt][Cc]\/[Ss][Yy][Ss][Tt][Ee][Mm][Dd]\/[Ss][Yy][Ss][Tt][Ee][Mm]|\/[Ee][Tt][Cc]\/[Rr][Cc]).*/
    pivot_on: host
    window: 2h
  - name: Recursive deletion of system paths or secure wipe
    query: (data_process_exec_process_binary:/.*(\\/[Ss][Hh][Rr][Ee][Dd]|\\/[Ww][Ii][Pp][Ee][Ff][Ss])/ OR (data_process_exec_process_binary:/.*(\\/[Rr][Mm])/ AND data_process_exec_process_arguments:/.*(\-[Rr][Ff]|\-[Ff][Rr]|\-\-[Nn][Oo]\-[Pp][Rr][Ee][Ss][Ee][Rr][Vv][Ee]\-[Rr][Oo][Oo][Tt]).*/))
    pivot_on: host
    window: 2h
  - name: Log or shell history tampering
    query: (data_process_exec_process_binary:/.*(\\/[Rr][Mm]|\\/[Tt][Rr][Uu][Nn][Cc][Aa][Tt][Ee]|\\/[Ss][Hh][Rr][Ee][Dd]|\\/[Jj][Oo][Uu][Rr][Nn][Aa][Ll][Cc][Tt][Ll]|\\/[Hh][Ii][Ss][Tt][Oo][Rr][Yy])/ AND data_process_exec_process_arguments:/.*(\/[Vv][Aa][Rr]\/[Ll][Oo][Gg]|\.[Bb][Aa][Ss][Hh]_[Hh][Ii][Ss][Tt][Oo][Rr][Yy]|\-\-[Vv][Aa][Cc][Uu][Uu][Mm]|[Hh][Ii][Ss][Tt][Oo][Rr][Yy] \-[Cc]).*/)
    pivot_on: host
    window: 2h
  - name: Reboot or shutdown after tampering
    query: data_process_exec_process_binary:/.*(\\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]|\\/[Rr][Ee][Bb][Oo][Oo][Tt]|\\/[Ss][Hh][Uu][Tt][Dd][Oo][Ww][Nn]|\\/[Pp][Oo][Ww][Ee][Rr][Oo][Ff][Ff]|\\/[Hh][Aa][Ll][Tt])/ AND data_process_exec_process_arguments:/.*([Rr][Ee][Bb][Oo][Oo][Tt]|[Ss][Hh][Uu][Tt][Dd][Oo][Ww][Nn]|[Pp][Oo][Ww][Ee][Rr][Oo][Ff][Ff]|[Hh][Aa][Ll][Tt]|[Nn][Oo][Ww]).*/
    pivot_on: host
    window: 1h
