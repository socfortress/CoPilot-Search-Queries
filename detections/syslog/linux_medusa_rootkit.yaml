name: Linux Medusa Rootkit
id: linux-medusa-rootkit-001
version: 1
schema_version: "1.0"
date: "2026-02-03"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects file creation events associated with the installation of the Medusa 
  rootkit, a userland LD_PRELOAD-based rootkit known for deploying shared objects, 
  loader binaries, and configuration files into specific system directories. These 
  files facilitate process hiding, credential theft, and backdoor access. Associated 
  with UNC3886 China-Nexus threat activity, Hellcat Ransomware, and VoidLink malware.

data_source:
  - Tetragon
  - auth.log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - wildcard:
                  full_log: "*libseconf*"
              - wildcard:
                  full_log: "*sshpass*"
              - wildcard:
                  full_log: "*logpam*"
              - wildcard:
                  full_log: "*rkload*"
              - wildcard:
                  full_log: "*libdsx*"
              - wildcard:
                  full_log: "*backup_ld.so*"
              - wildcard:
                  full_log: "*.boot.sh*"
              - wildcard:
                  full_log: "*remote.txt*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-03 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-03 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with Tetragon 
  process execution logging enabled. Auth.log monitoring provides sudo command 
  visibility for file creation operations in sensitive directories.

known_false_positives: >
  Little to no false positives in most environments. The file paths and names are 
  highly specific to Medusa rootkit. Tune as needed for custom applications.

references:
  - https://cloud.google.com/blog/topics/threat-intelligence/uncovering-unc3886-espionage-operations
  - https://attack.mitre.org/techniques/T1014/

response:
  message: >
    Medusa rootkit files detected on $agent_name$. 
    This userland rootkit enables process hiding, credential theft, and backdoor access. 
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 62
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 62
  threat_objects: []

tags:
  analytic_story:
    - China-Nexus Threat Activity
    - Medusa Rootkit
    - Hellcat Ransomware
    - VoidLink Cloud-Native Linux Malware
  asset_type: Linux
  mitre_attack_id:
    - T1014
    - T1589.001
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (full_log:/.*libseconf.*/ OR full_log:/.*sshpass.*/ OR full_log:/.*logpam.*/ OR full_log:/.*rkload.*/ OR full_log:/.*libdsx.*/ OR full_log:/.*backup_ld\.so.*/ OR full_log:/.*\.boot\.sh.*/ OR full_log:/.*remote\.txt.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 4b3cb710-5e83-4715-8c45-8b2b5b3e5751
    name: Modification of ld.so.preload
    reason: Medusa activates by writing its loader library into /etc/ld.so.preload; a hit confirms the rootkit is live, not just dropped
  - id: linux-preload-hijack-via-preload-file-001
    name: Linux Preload Hijack Via Preload File
    reason: Preload-file hijack is the mechanism Medusa uses to inject libseconf/libdsx into every process
  - id: linux-auditd-preload-hijack-library-calls-001
    name: Linux Auditd Preload Hijack Library Calls
    reason: LD_PRELOAD library-call hijack is the runtime form of the same userland rootkit loading
  - id: b3c8e2d1-4f1a-4b7c-9a22-91a6f2c4e8de
    name: Linux Init Script Persistence Detection
    reason: Init script persistence is a typical way the rootkit loader (.boot.sh) survives reboot
  - id: 3b4c5d6e-7f80-1234-5678-90abcdef1234
    name: Linux SSH Key Discovery
    reason: Medusa harvests SSH credentials; SSH key discovery shows the credential theft stage
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Preload and loader tampering
    query: full_log:/.*(ld\.so\.preload|LD_PRELOAD|\/etc\/ld\.so).*/
    pivot_on: host
    window: 2h
  - name: Credential-reuse and SSH pivot tooling
    query: data_process_exec_process_binary:/.*\/(sshpass|ssh-keyscan|scp|ssh-keygen)/
    pivot_on: host
    window: 4h
  - name: Download or staging into temp locations
    query: (data_process_exec_process_binary:/.*\/(curl|wget|tftp)/ AND data_process_exec_process_arguments:/.*(\/tmp\/|\/dev\/shm\/|\/var\/tmp\/).*/)
    pivot_on: host
    window: 2h
  - name: Hiding and permission changes on shared objects or boot scripts
    query: (data_process_exec_process_binary:/.*\/(chattr|chmod|touch|shred)/ AND data_process_exec_process_arguments:/.*(\.so|\.boot\.sh|\/usr\/lib|\/lib64?\/).*/)
    pivot_on: host
    window: 2h
