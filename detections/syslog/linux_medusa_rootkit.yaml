name: Linux Medusa Rootkit
id: linux-medusa-rootkit-001
version: 1
schema_version: "1.0"
date: "2026-02-03"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects file creation events associated with the installation of the Medusa 
  rootkit, a userland LD_PRELOAD-based rootkit known for deploying shared objects, 
  loader binaries, and configuration files into specific system directories. These 
  files facilitate process hiding, credential theft, and backdoor access. Associated 
  with UNC3886 China-Nexus threat activity, Hellcat Ransomware, and VoidLink malware.

data_source:
  - Tetragon
  - auth.log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - wildcard:
                  full_log: "*libseconf*"
              - wildcard:
                  full_log: "*sshpass*"
              - wildcard:
                  full_log: "*logpam*"
              - wildcard:
                  full_log: "*rkload*"
              - wildcard:
                  full_log: "*libdsx*"
              - wildcard:
                  full_log: "*backup_ld.so*"
              - wildcard:
                  full_log: "*.boot.sh*"
              - wildcard:
                  full_log: "*remote.txt*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-03 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-03 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with Tetragon 
  process execution logging enabled. Auth.log monitoring provides sudo command 
  visibility for file creation operations in sensitive directories.

known_false_positives: >
  Little to no false positives in most environments. The file paths and names are 
  highly specific to Medusa rootkit. Tune as needed for custom applications.

references:
  - https://cloud.google.com/blog/topics/threat-intelligence/uncovering-unc3886-espionage-operations
  - https://attack.mitre.org/techniques/T1014/

response:
  message: >
    Medusa rootkit files detected on $agent_name$. 
    This userland rootkit enables process hiding, credential theft, and backdoor access. 
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 62
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 62
  threat_objects: []

tags:
  analytic_story:
    - China-Nexus Threat Activity
    - Medusa Rootkit
    - Hellcat Ransomware
    - VoidLink Cloud-Native Linux Malware
  asset_type: Linux
  mitre_attack_id:
    - T1014
    - T1589.001
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (full_log:/.*libseconf.*/ OR full_log:/.*sshpass.*/ OR full_log:/.*logpam.*/ OR full_log:/.*rkload.*/ OR full_log:/.*libdsx.*/ OR full_log:/.*backup_ld\.so.*/ OR full_log:/.*\.boot\.sh.*/ OR full_log:/.*remote\.txt.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored by the correlation engine for review. Related CoPilot Searches to run
  # around an alert from this rule, scoped to the same host/user/IP within the window.
  related_rules:
    - id: bc1dc6b8-c954-11eb-bade-acde48001122
      name: "Detect Empire with PowerShell Script Block Logging"
      reason: "same analytic story: Hellcat Ransomware"
    - id: 8148c29c-c952-11eb-9255-acde48001122
      name: "Detect Mimikatz With PowerShell Script Block Logging"
      reason: "same analytic story: Hellcat Ransomware"
    - id: 32e0baea-b3f1-11eb-a2ce-acde48001122
      name: "Detect RClone Command-Line Usage"
      reason: "same analytic story: Hellcat Ransomware"
    - id: 683e6196-b8e8-11eb-9a79-acde48001122
      name: "Detect Renamed PSExec"
      reason: "same analytic story: China-Nexus Threat Activity"
    - id: 6dca1124-b3ec-11eb-9328-acde48001122
      name: "Detect Renamed RClone"
      reason: "same analytic story: Hellcat Ransomware"
    - id: 1b7bfb2c-b8e6-11eb-99ac-acde48001122
      name: "Detect Renamed WinRAR"
      reason: "same analytic story: China-Nexus Threat Activity"
    - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
      name: "Dump LSASS via comsvcs DLL"
      reason: "same analytic story: Hellcat Ransomware"
    - id: 9be56c82-b1cc-4318-87eb-d138afaaca39
      name: "Malicious PowerShell Process - Execution Policy Bypass"
      reason: "same analytic story: China-Nexus Threat Activity"
    - id: d6b0d627-d0bf-46b1-936f-c48284767d21
      name: "Potential Telegram API Request Via CommandLine"
      reason: "same analytic story: Hellcat Ransomware"
    - id: windows-powershell-loading-dotnet-into-memory-via-reflection-001
      name: "PowerShell Loading DotNET into Memory via Reflection"
      reason: "same analytic story: Hellcat Ransomware"
    - id: windows-powershell-script-block-with-url-chain-001
      name: "PowerShell Script Block With URL Chain"
      reason: "same analytic story: Hellcat Ransomware"
    - id: windows-powershell-fileless-process-injection-via-getprocaddress-001
      name: "Powershell Fileless Process Injection via GetProcAddress"
      reason: "same analytic story: Hellcat Ransomware"
  window: 1h
  enrichment_searches:
  # Rule-specific telemetry pivots the engine runs around an alert from this rule,
  # scoped to the alert's host/user/IP within the window (behaviour-targeted, not a sweep).
    - name: "Linux process execution on this host (Tetragon / auditd)"
      query: '(data_process_exec_process_binary:/.*(\/[Bb][Aa][Ss][Hh]|\/[Ss][Hh]|\/[Dd][Aa][Ss][Hh]|\/[Zz][Ss][Hh]|\/[Kk][Ss][Hh]|\/[Pp][Yy][Tt][Hh][Oo][Nn]|\/[Pp][Yy][Tt][Hh][Oo][Nn]3|\/[Pp][Ee][Rr][Ll]|\/[Rr][Uu][Bb][Yy]|\/[Pp][Hh][Pp]|\/[Nn][Cc]|\/[Nn][Cc][Aa][Tt]|\/[Ss][Oo][Cc][Aa][Tt]|\/[Cc][Uu][Rr][Ll]|\/[Ww][Gg][Ee][Tt])/ OR data_audit_exe:/.*(\/[Bb][Aa][Ss][Hh]|\/[Ss][Hh]|\/[Dd][Aa][Ss][Hh]|\/[Zz][Ss][Hh]|\/[Kk][Ss][Hh]|\/[Pp][Yy][Tt][Hh][Oo][Nn]|\/[Pp][Yy][Tt][Hh][Oo][Nn]3|\/[Pp][Ee][Rr][Ll]|\/[Rr][Uu][Bb][Yy]|\/[Pp][Hh][Pp]|\/[Nn][Cc]|\/[Nn][Cc][Aa][Tt]|\/[Ss][Oo][Cc][Aa][Tt]|\/[Cc][Uu][Rr][Ll]|\/[Ww][Gg][Ee][Tt])/)'
      pivot_on: [host]
      window: 1h
    - name: "Privilege-escalation tooling on this host"
      query: '(data_process_exec_process_binary:/.*(\/[Ss][Uu][Dd][Oo]|\/[Ss][Uu]|\/[Pp][Kk][Ee][Xx][Ee][Cc]|\/[Dd][Oo][Aa][Ss]|\/[Ss][Ee][Tt][Cc][Aa][Pp])/ OR data_audit_exe:/.*(\/[Ss][Uu][Dd][Oo]|\/[Ss][Uu]|\/[Pp][Kk][Ee][Xx][Ee][Cc]|\/[Dd][Oo][Aa][Ss]|\/[Ss][Ee][Tt][Cc][Aa][Pp])/)'
      pivot_on: [host]
      window: 2h
    - name: "Other events from this source address"
      query: '_exists_:data_srcip'
      pivot_on: [ip]
      window: 6h
