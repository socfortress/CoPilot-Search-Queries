name: Linux File Permission Modification Detection
id: e2f3g4h5-6789-1011-1213-141516171819
version: 1
schema_version: "1.0"
date: "2026-01-30"
author: SOCFORTRESS LLC
status: production
type: TTP
description: >
  Detects attempts to change file permissions using `chmod` with potentially
  risky modes like 777, 755, 754, or adding execute permissions. This may
  indicate privilege escalation, persistence setup, or unauthorized access.
data_source:
  - Wazuh Agent Logs
  - Linux Auditd
  - Syslog
search:
  index_pattern: "${INDEX_PATTERN}"
  size: 20
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - wildcard:
            full_log: "*chmod*"
        - bool:
            should:
              - wildcard: { full_log: "*777*" }
              - wildcard: { full_log: "*755*" }
              - wildcard: { full_log: "*754*" }
              - wildcard: { full_log: "*+x*" }
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location
parameters:
  AGENT_NAME:
    description: "Agent name to filter"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time"
    type: datetime
    required: true
    example: "2026-01-28 14:30:00.000"
  END_TIME:
    description: "Query end time"
    type: datetime
    required: true
    example: "2026-01-28 14:33:00.000"
how_to_implement: >
  Requires Linux endpoints with Wazuh agents capturing process execution.
  Monitoring `chmod` commands with high-risk permission values helps detect
  suspicious privilege escalation or persistence activities.
known_false_positives: >
  Legitimate administrative tasks modifying file permissions for service
  operation or software installation.
references:
  - https://attack.mitre.org/techniques/T1098/
  - https://man7.org/linux/man-pages/man1/chmod.1.html
response:
  message: >
    Suspicious file permission modification detected on $agent_name$.
    Command: $full_log$
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: full_log
      type: process
tags:
  analytic_story:
    - Linux Persistence
    - Privilege Escalation
    - File Tampering
  asset_type: Linux
  mitre_attack_id:
    - T1098
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: full_log:/.*chmod.*/ AND (full_log:/.*777.*/ OR full_log:/.*755.*/ OR full_log:/.*754.*/ OR full_log:/.*\+x.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: linux-setuid-using-chmod-utility-001
    name: Linux Setuid Using Chmod Utility
    reason: chmod u+s is the high-impact form of permission change.
  - id: 6419afd1-3742-47a5-a7e6-b50386cd15f8
    name: Chmod Targeting Sensitive Directories
    reason: Permission changes on system directories escalate the same behaviour.
  - id: linux-auditd-chown-to-root-001
    name: Linux Auditd Chown To Root
    reason: Ownership change to root alongside permission change.
  - id: a39d7fa7-3fbd-4dc2-97e1-d87f546b1bbc
    name: Program Executions in Suspicious Folders
    reason: Dropped binaries in tmp or shm that were just made executable.
  - id: a2d9e2f3-0f43-4c7a-bcd9-9acfc0d723aa
    name: Suspicious Download and Execute Pattern via Curl/Wget
    reason: Downloaded payload is made executable with chmod then run.
  - id: cf610c15-ed71-46e1-bdf8-2bd1a99de6c4
    name: Download File To Potentially Suspicious Directory Via Wget
    reason: Payload landing in tmp precedes chmod +x.
  - id: linux-append-cronjob-entry-001
    name: Linux Append Cronjob Entry On Existing Cronjob File
    reason: Persistence follow-on once the payload is executable.
  - id: linux-service-file-created-in-systemd-directory-001
    name: Linux Service File Created In Systemd Directory
    reason: Persistence via systemd unit after permissions are set.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Downloads preceding chmod
    query: data_process_exec_process_binary:/.*(curl|wget|tftp|scp).*/
    pivot_on: host
    window: 2h
  - name: Execution from tmp or shm paths
    query: data_process_exec_process_binary:/(\/tmp|\/dev\/shm|\/var\/tmp).*/
    pivot_on: host
    window: 2h
  - name: Persistence via cron or systemd
    query: (data_process_exec_process_binary:/.*(crontab|systemctl).*/ OR data_process_exec_process_arguments:/.*(\/etc\/cron|\/etc\/systemd|rc\.local).*/)
    pivot_on: host
    window: 4h
  - name: Setuid or sensitive path permission change
    query: data_process_exec_process_binary:/.*chmod.*/ AND data_process_exec_process_arguments:/.*(u\+s|4755|2755|\/etc|\/root|\/usr\/bin).*/
    pivot_on: host
    window: 4h
  - name: Privilege escalation tooling
    query: data_process_exec_process_binary:/.*(sudo|su|pkexec|setcap).*/
    pivot_on: user
    window: 2h
