name: Linux File Permission Modification Detection
id: e2f3g4h5-6789-1011-1213-141516171819
version: 1
schema_version: "1.0"
date: "2026-01-30"
author: SOCFORTRESS LLC
status: production
type: TTP
description: >
  Detects attempts to change file permissions using `chmod` with potentially
  risky modes like 777, 755, 754, or adding execute permissions. This may
  indicate privilege escalation, persistence setup, or unauthorized access.
data_source:
  - Wazuh Agent Logs
  - Linux Auditd
  - Syslog
search:
  index_pattern: "${INDEX_PATTERN}"
  size: 20
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - wildcard:
            full_log: "*chmod*"
        - bool:
            should:
              - wildcard: { full_log: "*777*" }
              - wildcard: { full_log: "*755*" }
              - wildcard: { full_log: "*754*" }
              - wildcard: { full_log: "*+x*" }
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location
parameters:
  AGENT_NAME:
    description: "Agent name to filter"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time"
    type: datetime
    required: true
    example: "2026-01-28 14:30:00.000"
  END_TIME:
    description: "Query end time"
    type: datetime
    required: true
    example: "2026-01-28 14:33:00.000"
how_to_implement: >
  Requires Linux endpoints with Wazuh agents capturing process execution.
  Monitoring `chmod` commands with high-risk permission values helps detect
  suspicious privilege escalation or persistence activities.
known_false_positives: >
  Legitimate administrative tasks modifying file permissions for service
  operation or software installation.
references:
  - https://attack.mitre.org/techniques/T1098/
  - https://man7.org/linux/man-pages/man1/chmod.1.html
response:
  message: >
    Suspicious file permission modification detected on $agent_name$.
    Command: $full_log$
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: full_log
      type: process
tags:
  analytic_story:
    - Linux Persistence
    - Privilege Escalation
    - File Tampering
  asset_type: Linux
  mitre_attack_id:
    - T1098
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: full_log:/.*chmod.*/ AND (full_log:/.*777.*/ OR full_log:/.*755.*/ OR full_log:/.*754.*/ OR full_log:/.*\+x.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored by the correlation engine for review. Related CoPilot Searches to run
  # around an alert from this rule, scoped to the same host/user/IP within the window.
  related_rules:
    - id: 4e2a6c91-7f3d-4b6e-9a4f-1c8b0e5a92d4
      name: "Crontab Interactive Edit Execution"
      reason: "same analytic story: Linux Persistence"
    - id: cbef820c-e1ff-407f-887f-0a9240a2d477
      name: "Detect Path Interception By Creation Of program exe"
      reason: "same analytic story: Privilege Escalation"
    - id: 909f8fd8-7ac8-11eb-a1f3-acde48001122
      name: "FodHelper UAC Bypass"
      reason: "same analytic story: Privilege Escalation"
    - id: 09725404-a44f-4ed3-9efa-8ed5d69e4c53
      name: "Get-DomainGroup with PowerShell Script Block"
      reason: "same analytic story: Privilege Escalation"
    - id: 67740bd3-1506-469c-b91d-effc322cc6e5
      name: "Get-WmiObject Ds_Group with PowerShell Script Block"
      reason: "same analytic story: Privilege Escalation"
    - id: 59b51620-94c9-11ec-b3d5-acde48001122
      name: "Kerberos Pre-Authentication Flag Disabled with PowerShell"
      reason: "same analytic story: Privilege Escalation"
    - id: a1b2c3d4-5e6f-7a8b-9c0d-1e2f3a4b5c6d
      name: "Linux Kernel Module Insertion"
      reason: "same analytic story: Linux Persistence"
    - id: ea61e291-af05-4716-932a-67faddb6ae6f
      name: "PowerShell COM Hijacking InProcServer32 Modification"
      reason: "same analytic story: Privilege Escalation"
    - id: 8470d755-0c13-45b3-bd63-387a373c10cf
      name: "Reg exe Manipulating Windows Services Registry Keys"
      reason: "same analytic story: Privilege Escalation"
    - id: 7a1d4c9e-3b2f-4e6a-8f2d-1c9e7f3b5a8c
      name: "Suspicious Container Exec Detection"
      reason: "same analytic story: Privilege Escalation"
  window: 1h
  enrichment_searches:
  # Rule-specific telemetry pivots the engine runs around an alert from this rule,
  # scoped to the alert's host/user/IP within the window (behaviour-targeted, not a sweep).
    - name: "Linux process execution on this host (Tetragon / auditd)"
      query: '(data_process_exec_process_binary:/.*(\/[Bb][Aa][Ss][Hh]|\/[Ss][Hh]|\/[Dd][Aa][Ss][Hh]|\/[Zz][Ss][Hh]|\/[Kk][Ss][Hh]|\/[Pp][Yy][Tt][Hh][Oo][Nn]|\/[Pp][Yy][Tt][Hh][Oo][Nn]3|\/[Pp][Ee][Rr][Ll]|\/[Rr][Uu][Bb][Yy]|\/[Pp][Hh][Pp]|\/[Nn][Cc]|\/[Nn][Cc][Aa][Tt]|\/[Ss][Oo][Cc][Aa][Tt]|\/[Cc][Uu][Rr][Ll]|\/[Ww][Gg][Ee][Tt])/ OR data_audit_exe:/.*(\/[Bb][Aa][Ss][Hh]|\/[Ss][Hh]|\/[Dd][Aa][Ss][Hh]|\/[Zz][Ss][Hh]|\/[Kk][Ss][Hh]|\/[Pp][Yy][Tt][Hh][Oo][Nn]|\/[Pp][Yy][Tt][Hh][Oo][Nn]3|\/[Pp][Ee][Rr][Ll]|\/[Rr][Uu][Bb][Yy]|\/[Pp][Hh][Pp]|\/[Nn][Cc]|\/[Nn][Cc][Aa][Tt]|\/[Ss][Oo][Cc][Aa][Tt]|\/[Cc][Uu][Rr][Ll]|\/[Ww][Gg][Ee][Tt])/)'
      pivot_on: [host]
      window: 1h
    - name: "Privilege-escalation tooling on this host"
      query: '(data_process_exec_process_binary:/.*(\/[Ss][Uu][Dd][Oo]|\/[Ss][Uu]|\/[Pp][Kk][Ee][Xx][Ee][Cc]|\/[Dd][Oo][Aa][Ss]|\/[Ss][Ee][Tt][Cc][Aa][Pp])/ OR data_audit_exe:/.*(\/[Ss][Uu][Dd][Oo]|\/[Ss][Uu]|\/[Pp][Kk][Ee][Xx][Ee][Cc]|\/[Dd][Oo][Aa][Ss]|\/[Ss][Ee][Tt][Cc][Aa][Pp])/)'
      pivot_on: [host]
      window: 2h
    - name: "Other events from this source address"
      query: '_exists_:data_srcip'
      pivot_on: [ip]
      window: 6h
    - name: "Persistence via cron / systemd / shell profiles on this host"
      query: '((data_process_exec_process_binary:/.*(\/[Cc][Rr][Oo][Nn][Tt][Aa][Bb]|\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]|\/[Aa][Tt]|\/[Uu][Pp][Dd][Aa][Tt][Ee]-[Rr][Cc]\.[Dd])/ OR data_audit_exe:/.*(\/[Cc][Rr][Oo][Nn][Tt][Aa][Bb]|\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]|\/[Aa][Tt]|\/[Uu][Pp][Dd][Aa][Tt][Ee]-[Rr][Cc]\.[Dd])/) OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Cc][Rr][Oo][Nn].*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Yy][Ss][Tt][Ee][Mm][Dd].*/ OR data_process_exec_process_arguments:/.*[Rr][Cc]\.[Ll][Oo][Cc][Aa][Ll].*/ OR data_process_exec_process_arguments:/.*\.[Bb][Aa][Ss][Hh][Rr][Cc].*/ OR data_process_exec_process_arguments:/.*[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Ee][Dd]_[Kk][Ee][Yy][Ss].*/)'
      pivot_on: [host]
      window: 4h
