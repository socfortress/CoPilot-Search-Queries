name: Linux DD File Overwrite
id: linux-dd-file-overwrite-001
version: 1
schema_version: "1.0"
date: "2026-02-04"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects the use of the 'dd' command to overwrite files on a Linux system using 
  the 'of=' parameter. Adversaries often use the 'dd' command with /dev/zero or 
  /dev/urandom to destroy or irreversibly overwrite files, disrupting system 
  availability and services. Associated with Data Destruction and Industroyer2.

data_source:
  - Tetragon

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - wildcard:
            full_log: "*dd*of=*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-04 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-04 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with Tetragon 
  process execution logging enabled. Tetragon captures full command-line arguments 
  including the of= parameter.

known_false_positives: >
  System administrators may legitimately use dd for disk imaging, backup operations, 
  or creating bootable media. Filter based on known administrative activities and 
  expected file paths.

references:
  - https://gtfobins.github.io/gtfobins/dd/
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1485/T1485.md
  - https://attack.mitre.org/techniques/T1485/

response:
  message: >
    DD file overwrite detected on $agent_name$. 
    The dd command with of= parameter can destroy or irreversibly overwrite files. 
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 64
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 64
  threat_objects: []

tags:
  analytic_story:
    - Data Destruction
    - Industroyer2
  asset_type: Linux
  mitre_attack_id:
    - T1485
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: full_log:/.*dd.*of=.*/ AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: linux-auditd-data-destruction-command-001
    name: Linux Auditd Data Destruction Command
    reason: Same destruction toolset (dd/shred/rm -rf) in auditd view; confirms wider wiping
  - id: a3b7c9d2-4f5e-4b6d-8c1a-2d3f4e5b6c7a
    name: Linux Critical Directory Deletion
    reason: rm -rf on critical dirs commonly accompanies dd overwrites in wipers
  - id: 4cad6c64-d6df-42d6-8dae-eb78defdc415
    name: Potential Linux Process Code Injection Via DD Utility
    reason: dd also abused to write into process memory; distinguishes injection from wiping
  - id: 80915f59-9b56-4616-9de0-fd0dea6c12fe
    name: Linux Logs Clearing Attempts
    reason: Log clearing usually precedes or follows destruction to hide it
  - id: 1182f3b3-e716-4efa-99ab-d2685d04360f
    name: History File Deletion
    reason: Shell history deletion to cover wiper tracks
  - id: de25eeb8-3655-4643-ac3a-b662d3f26b6b
    name: Disable Or Stop Services
    reason: Services are stopped before their files are overwritten
  - id: linux-auditd-daemon-shutdown-001
    name: Linux Auditd Daemon Shutdown
    reason: auditd stopped to blind monitoring before destructive actions
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: dd writing to files or block devices
    query: data_process_exec_process_binary:/.*\/[Dd][Dd]/ AND data_process_exec_process_arguments:/.*[Oo][Ff]=.*/
    pivot_on: host
    window: 2h
  - name: Other wipe utilities
    query: data_process_exec_process_binary:/.*(\/[Ss][Hh][Rr][Ee][Dd]|\/[Ww][Ii][Pp][Ee][Ff][Ss]|\/[Mm][Kk][Ff][Ss].*|\/[Cc][Rr][Yy][Pp][Tt][Ss][Ee][Tt][Uu][Pp])/
    pivot_on: host
    window: 4h
  - name: Recursive deletion
    query: data_process_exec_process_binary:/.*\/[Rr][Mm]/ AND data_process_exec_process_arguments:/.*-[Rr][Ff].*/
    pivot_on: host
    window: 4h
  - name: Service stop before destruction
    query: data_process_exec_process_binary:/.*\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]/ AND data_process_exec_process_arguments:/.*([Ss][Tt][Oo][Pp]|[Dd][Ii][Ss][Aa][Bb][Ll][Ee]|[Mm][Aa][Ss][Kk]).*/
    pivot_on: host
    window: 2h
  - name: Log or history clearing
    query: data_process_exec_process_arguments:/.*(\/var\/log|\.bash_history).*/ AND data_process_exec_process_binary:/.*(\/[Rr][Mm]|\/[Ss][Hh][Rr][Ee][Dd]|\/[Tt][Rr][Uu][Nn][Cc][Aa][Tt][Ee])/
    pivot_on: host
    window: 4h
