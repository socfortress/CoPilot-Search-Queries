name: Linux Suspicious React or Next.js Child Process
id: linux-suspicious-react-nextjs-child-process-001
version: 1
schema_version: "1.0"
date: "2026-02-03"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects Linux processes such as sh, bash, curl, wget, python, and other LOLBINs 
  being spawned by Node.js application servers. In the context of CVE-2025-55182 
  (React2Shell) and CVE-2025-66478 (Next.js RCE), successful exploitation leads to 
  arbitrary JavaScript execution on the server, commonly used to invoke Node's 
  child_process APIs to run OS-level commands.

data_source:
  - Tetragon

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - wildcard:
            full_log: "*node*"
        - bool:
            should:
              - wildcard:
                  full_log: "*curl*"
              - wildcard:
                  full_log: "*wget*"
              - wildcard:
                  full_log: "*bash*-c*"
              - wildcard:
                  full_log: "*python*"
              - wildcard:
                  full_log: "*nc *"
              - wildcard:
                  full_log: "*netcat*"
              - wildcard:
                  full_log: "*socat*"
              - wildcard:
                  full_log: "*perl*"
              - wildcard:
                  full_log: "*ruby*"
              - wildcard:
                  full_log: "*php*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-03 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-03 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with Tetragon 
  process execution logging enabled. Focus on monitoring Node.js applications 
  (React Server Components, Next.js) for suspicious child process spawning.

known_false_positives: >
  Legitimate Node.js applications may spawn child processes for specific functionality. 
  Development environments may trigger false positives. Filter based on known 
  application behavior and working directories.

references:
  - https://react.dev/blog/2025/12/03/critical-security-vulnerability-in-react-server-components
  - https://nextjs.org/blog/CVE-2025-66478
  - https://nvd.nist.gov/vuln/detail/CVE-2025-55182
  - https://www.wiz.io/blog/critical-vulnerability-in-react-cve-2025-55182

response:
  message: >
    Node.js application spawned suspicious child process on $agent_name$. 
    This may indicate exploitation of CVE-2025-55182 (React2Shell) or 
    CVE-2025-66478 (Next.js RCE). MITRE ATT&CK: $rule_mitre_id$
  risk_score: 70
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 70
  threat_objects: []

tags:
  analytic_story:
    - React2Shell
  asset_type: CVE
  mitre_attack_id:
    - T1190
    - T1059.004
  product:
    - Wazuh
  security_domain: endpoint
  cve:
    - CVE-2025-55182
    - CVE-2025-66478

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c70834fa-fb9d-4aa0-9e7d-45ceed36f3f7
    name: Linux Suspicious Child Process from Node.js - React2Shell
    reason: Same React2Shell exploitation seen via process-creation telemetry; a hit corroborates the Tetragon alert and confirms the Node.js child spawn.
  - id: 880973f3-9708-491c-a77b-2a35a1921158
    name: Linux Shell Pipe to Shell
    reason: Post-RCE payloads are typically fetched and piped straight into sh/bash from the Node process.
  - id: a2d9e2f3-0f43-4c7a-bcd9-9acfc0d723aa
    name: Suspicious Download and Execute Pattern via Curl/Wget
    reason: The curl/wget child spawned by Node usually pulls the second-stage payload that is then executed.
  - id: linux-ingress-tool-transfer-hunting-001
    name: Linux Ingress Tool Transfer Hunting
    reason: Attacker tooling is transferred onto the host immediately after the web app is exploited.
  - id: 312b42b1-bded-4441-8b58-163a3af58775
    name: Potentially Suspicious Execution From Tmp Folder
    reason: Dropped payloads from the RCE are commonly staged and run from /tmp.
  - id: 7f734ed0-4f47-46c0-837f-6ee62505abd9
    name: Potential Netcat Reverse Shell Execution
    reason: nc/socat children of Node are the reverse-shell follow-on to the exploit.
  - id: 9069ea3c-b213-4c52-be13-86506a227ab1
    name: Linux Crypto Mining Indicators
    reason: React2Shell has been widely used to deploy cryptominers as the final objective.
  - id: 818f7b24-0fba-4c49-a073-8b755573b9c7
    name: Linux Webshell Indicators
    reason: Attackers may leave a persistent webshell in the app directory after initial RCE.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Download or reverse-shell tooling on this host
    query: data_process_exec_process_binary:/.*(\/[Cc][Uu][Rr][Ll]|\/[Ww][Gg][Ee][Tt]|\/[Nn][Cc]|\/[Nn][Cc][Aa][Tt]|\/[Nn][Ee][Tt][Cc][Aa][Tt]|\/[Ss][Oo][Cc][Aa][Tt])/
    pivot_on:
    - host
    window: 2h
  - name: Execution from world-writable staging directories
    query: data_process_exec_process_binary:/(\/tmp\/|\/var\/tmp\/|\/dev\/shm\/).*/
    pivot_on:
    - host
    window: 2h
  - name: Shell one-liners with encoded or piped payloads
    query: data_process_exec_process_arguments:/.*([Bb][Aa][Ss][Ee]64.*\|.*[Ss][Hh]|[Cc][Uu][Rr][Ll].*\|.*[Ss][Hh]|[Ww][Gg][Ee][Tt].*\|.*[Ss][Hh]|\/dev\/tcp\/).*/
    pivot_on:
    - host
    window: 2h
  - name: Cron or systemd persistence set up after exploitation
    query: (data_process_exec_process_binary:/.*(\/[Cc][Rr][Oo][Nn][Tt][Aa][Bb]|\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll])/) OR (data_process_exec_process_arguments:/.*(\/etc\/cron|\/etc\/systemd\/system|authorized_keys).*/)
    pivot_on:
    - host
    window: 4h
  - name: Credential and environment secret harvesting
    query: data_process_exec_process_arguments:/.*(\.env|\/etc\/shadow|\/etc\/passwd|\.aws\/credentials|id_rsa|\.ssh\/).*/
    pivot_on:
    - host
    window: 4h
