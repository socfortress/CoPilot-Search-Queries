name: Linux Suspicious React or Next.js Child Process
id: linux-suspicious-react-nextjs-child-process-001
version: 1
schema_version: "1.0"
date: "2026-02-03"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects Linux processes such as sh, bash, curl, wget, python, and other LOLBINs 
  being spawned by Node.js application servers. In the context of CVE-2025-55182 
  (React2Shell) and CVE-2025-66478 (Next.js RCE), successful exploitation leads to 
  arbitrary JavaScript execution on the server, commonly used to invoke Node's 
  child_process APIs to run OS-level commands.

data_source:
  - Tetragon

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - wildcard:
            full_log: "*node*"
        - bool:
            should:
              - wildcard:
                  full_log: "*curl*"
              - wildcard:
                  full_log: "*wget*"
              - wildcard:
                  full_log: "*bash*-c*"
              - wildcard:
                  full_log: "*python*"
              - wildcard:
                  full_log: "*nc *"
              - wildcard:
                  full_log: "*netcat*"
              - wildcard:
                  full_log: "*socat*"
              - wildcard:
                  full_log: "*perl*"
              - wildcard:
                  full_log: "*ruby*"
              - wildcard:
                  full_log: "*php*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-03 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-03 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with Tetragon 
  process execution logging enabled. Focus on monitoring Node.js applications 
  (React Server Components, Next.js) for suspicious child process spawning.

known_false_positives: >
  Legitimate Node.js applications may spawn child processes for specific functionality. 
  Development environments may trigger false positives. Filter based on known 
  application behavior and working directories.

references:
  - https://react.dev/blog/2025/12/03/critical-security-vulnerability-in-react-server-components
  - https://nextjs.org/blog/CVE-2025-66478
  - https://nvd.nist.gov/vuln/detail/CVE-2025-55182
  - https://www.wiz.io/blog/critical-vulnerability-in-react-cve-2025-55182

response:
  message: >
    Node.js application spawned suspicious child process on $agent_name$. 
    This may indicate exploitation of CVE-2025-55182 (React2Shell) or 
    CVE-2025-66478 (Next.js RCE). MITRE ATT&CK: $rule_mitre_id$
  risk_score: 70
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 70
  threat_objects: []

tags:
  analytic_story:
    - React2Shell
  asset_type: CVE
  mitre_attack_id:
    - T1190
    - T1059.004
  product:
    - Wazuh
  security_domain: endpoint
  cve:
    - CVE-2025-55182
    - CVE-2025-66478

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c70834fa-fb9d-4aa0-9e7d-45ceed36f3f7
    name: Linux Suspicious Child Process from Node.js - React2Shell
    reason: Companion detection of the same CVE-2025-55182 node-to-child pattern; corroborates with stricter parent matching.
  - id: 880973f3-9708-491c-a77b-2a35a1921158
    name: Linux Shell Pipe to Shell
    reason: React2Shell payloads commonly run curl|sh to fetch a second stage.
  - id: a2d9e2f3-0f43-4c7a-bcd9-9acfc0d723aa
    name: Suspicious Download and Execute Pattern via Curl/Wget
    reason: Follow-on staging of miner or backdoor after RCE through the Node.js server.
  - id: 7f734ed0-4f47-46c0-837f-6ee62505abd9
    name: Potential Netcat Reverse Shell Execution
    reason: Reverse shell is a common post-exploit action from child_process.
  - id: 32e62bc7-3de0-4bb1-90af-532978fe42c0
    name: Python Reverse Shell Execution Via PTY And Socket Modules
    reason: Python pty reverse shell is a frequent React2Shell payload shape.
  - id: 2fade0b6-7423-4835-9d4f-335b39b83867
    name: Shell Execution Of Process Located In Tmp Directory
    reason: Dropped payload executed from /tmp after the initial RCE.
  - id: 9069ea3c-b213-4c52-be13-86506a227ab1
    name: Linux Crypto Mining Indicators
    reason: Mass exploitation of React2Shell was widely used to deploy cryptominers.
  - id: 818f7b24-0fba-4c49-a073-8b755573b9c7
    name: Linux Webshell Indicators
    reason: Attackers leave webshells in the web root for persistent access after RCE.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Download and staging tools run on host
    query: (data_process_exec_process_binary:/.*(\/[Cc][Uu][Rr][Ll]|\/[Ww][Gg][Ee][Tt]|\/[Tt][Ff][Tt][Pp]|\/[Ff][Tt][Pp]|\/[Ss][Cc][Pp])/ AND _exists_:data_process_exec_process_arguments)
    pivot_on:
    - host
    window: 1h
  - name: Reverse shell and tunnelling primitives
    query: (data_process_exec_process_binary:/.*(\/[Nn][Cc]|\/[Nn][Cc][Aa][Tt]|\/[Nn][Ee][Tt][Cc][Aa][Tt]|\/[Ss][Oo][Cc][Aa][Tt]|\/[Mm][Kk][Ff][Ii][Ff][Oo])/ OR (data_process_exec_process_arguments:/.*/[Dd][Ee][Vv]/[Tt][Cc][Pp]/.*/ OR data_process_exec_process_arguments:/.*[Bb][Aa][Ss][Hh] -[Ii].*/ OR data_process_exec_process_arguments:/.*[Pp][Tt][Yy].[Ss][Pp][Aa][Ww][Nn].*/ OR data_process_exec_process_arguments:/.*[Ee][Xx][Ee][Cc] [Ss][Hh].*/))
    pivot_on:
    - host
    window: 1h
  - name: Execution from world-writable staging directories
    query: (data_process_exec_process_binary:/(\/tmp|\/var\/tmp|\/dev\/shm)\/.*/ OR (data_process_exec_process_arguments:/.*/[Tt][Mm][Pp]/.*/ OR data_process_exec_process_arguments:/.*/[Dd][Ee][Vv]/[Ss][Hh][Mm]/.*/ OR data_process_exec_process_arguments:/.*/[Vv][Aa][Rr]/[Tt][Mm][Pp]/.*/))
    pivot_on:
    - host
    window: 2h
  - name: Persistence and secret theft after RCE
    query: (data_process_exec_process_binary:/.*(\/[Cc][Rr][Oo][Nn][Tt][Aa][Bb]|\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll])/ OR (data_process_exec_process_arguments:/.*/[Ee][Tt][Cc]/[Cc][Rr][Oo][Nn].*/ OR data_process_exec_process_arguments:/.*[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Ee][Dd]_[Kk][Ee][Yy][Ss].*/ OR data_process_exec_process_arguments:/.*/[Ee][Tt][Cc]/[Ss][Hh][Aa][Dd][Oo][Ww].*/ OR data_process_exec_process_arguments:/.*.[Ee][Nn][Vv].*/ OR data_process_exec_process_arguments:/.*.[Aa][Ww][Ss]/[Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll][Ss].*/ OR data_process_exec_process_arguments:/.*[Ii][Dd]_[Rr][Ss][Aa].*/))
    pivot_on:
    - host
    window: 4h
  - name: Cryptominer deployment and competitor cleanup
    query: (data_process_exec_process_arguments:/.*[Xx][Mm][Rr][Ii][Gg].*/ OR data_process_exec_process_arguments:/.*[Ss][Tt][Rr][Aa][Tt][Uu][Mm]+[Tt][Cc][Pp].*/ OR data_process_exec_process_arguments:/.*[Mm][Ii][Nn][Ee][Rr][Dd].*/ OR data_process_exec_process_arguments:/.*[Pp][Kk][Ii][Ll][Ll].*/ OR data_process_exec_process_arguments:/.*[Kk][Ii][Ll][Ll] -9.*/ OR data_process_exec_process_arguments:/.*--[Dd][Oo][Nn][Aa][Tt][Ee]-[Ll][Ee][Vv][Ee][Ll].*/)
    pivot_on:
    - host
    window: 4h
