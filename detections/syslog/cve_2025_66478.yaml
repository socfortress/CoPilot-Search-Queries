name: Linux Suspicious React or Next.js Child Process
id: linux-suspicious-react-nextjs-child-process-001
version: 1
schema_version: "1.0"
date: "2026-02-03"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects Linux processes such as sh, bash, curl, wget, python, and other LOLBINs 
  being spawned by Node.js application servers. In the context of CVE-2025-55182 
  (React2Shell) and CVE-2025-66478 (Next.js RCE), successful exploitation leads to 
  arbitrary JavaScript execution on the server, commonly used to invoke Node's 
  child_process APIs to run OS-level commands.

data_source:
  - Tetragon

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - wildcard:
            full_log: "*node*"
        - bool:
            should:
              - wildcard:
                  full_log: "*curl*"
              - wildcard:
                  full_log: "*wget*"
              - wildcard:
                  full_log: "*bash*-c*"
              - wildcard:
                  full_log: "*python*"
              - wildcard:
                  full_log: "*nc *"
              - wildcard:
                  full_log: "*netcat*"
              - wildcard:
                  full_log: "*socat*"
              - wildcard:
                  full_log: "*perl*"
              - wildcard:
                  full_log: "*ruby*"
              - wildcard:
                  full_log: "*php*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-03 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-03 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with Tetragon 
  process execution logging enabled. Focus on monitoring Node.js applications 
  (React Server Components, Next.js) for suspicious child process spawning.

known_false_positives: >
  Legitimate Node.js applications may spawn child processes for specific functionality. 
  Development environments may trigger false positives. Filter based on known 
  application behavior and working directories.

references:
  - https://react.dev/blog/2025/12/03/critical-security-vulnerability-in-react-server-components
  - https://nextjs.org/blog/CVE-2025-66478
  - https://nvd.nist.gov/vuln/detail/CVE-2025-55182
  - https://www.wiz.io/blog/critical-vulnerability-in-react-cve-2025-55182

response:
  message: >
    Node.js application spawned suspicious child process on $agent_name$. 
    This may indicate exploitation of CVE-2025-55182 (React2Shell) or 
    CVE-2025-66478 (Next.js RCE). MITRE ATT&CK: $rule_mitre_id$
  risk_score: 70
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 70
  threat_objects: []

tags:
  analytic_story:
    - React2Shell
  asset_type: CVE
  mitre_attack_id:
    - T1190
    - T1059.004
  product:
    - Wazuh
  security_domain: endpoint
  cve:
    - CVE-2025-55182
    - CVE-2025-66478

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c70834fa-fb9d-4aa0-9e7d-45ceed36f3f7
    name: Linux Suspicious Child Process from Node.js - React2Shell
    reason: Same React2Shell Node.js child-process behaviour seen from the Tetragon side; corroborates exploitation on the same host.
  - id: a2d9e2f3-0f43-4c7a-bcd9-9acfc0d723aa
    name: Suspicious Download and Execute Pattern via Curl/Wget
    reason: 'Typical first post-exploit step: the Node-spawned shell curls/wgets a payload and executes it.'
  - id: 7f734ed0-4f47-46c0-837f-6ee62505abd9
    name: Potential Netcat Reverse Shell Execution
    reason: Node child process commonly pivots to a netcat reverse shell for interactive access.
  - id: 32e62bc7-3de0-4bb1-90af-532978fe42c0
    name: Python Reverse Shell Execution Via PTY And Socket Modules
    reason: Python pty/socket reverse shell is a common follow-on once RCE lands in the web app.
  - id: 2fade0b6-7423-4835-9d4f-335b39b83867
    name: Shell Execution Of Process Located In Tmp Directory
    reason: Dropped payloads are run from /tmp after exploitation.
  - id: 9069ea3c-b213-4c52-be13-86506a227ab1
    name: Linux Crypto Mining Indicators
    reason: React2Shell campaigns are widely used to deploy cryptominers.
  - id: 818f7b24-0fba-4c49-a073-8b755573b9c7
    name: Linux Webshell Indicators
    reason: RCE in a web server is often followed by webshell placement for persistence.
  - id: linux-ingress-tool-transfer-hunting-001
    name: Linux Ingress Tool Transfer Hunting
    reason: Tool download onto the host after the app server was compromised.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Download or fetch of payload via curl/wget
    query: (data_process_exec_process_binary:/.*(curl|wget)$/ OR full_log:/.*(curl|wget) .*https?:.*/)
    pivot_on: host
    window: 2h
  - name: Reverse shell / network tool launch
    query: full_log:/.*(nc |ncat|netcat|socat|\/dev\/tcp\/|mkfifo|bash -i).*/
    pivot_on: host
    window: 2h
  - name: Execution from tmp or shm directories
    query: full_log:/.*(\/tmp\/|\/dev\/shm\/|\/var\/tmp\/).*(chmod|\.sh|\.elf|\.bin|exec).*/
    pivot_on: host
    window: 4h
  - name: Persistence and account changes after compromise
    query: full_log:/.*(crontab|\/etc\/cron|useradd|adduser|authorized_keys|systemd\/system).*/
    pivot_on: host
    window: 6h
  - name: Credential and environment file reads
    query: full_log:/.*(\/etc\/passwd|\/etc\/shadow|\.env|id_rsa|\.aws\/credentials|\/proc\/self\/environ).*/
    pivot_on: host
    window: 4h
