name: Linux Ruby Privilege Escalation
id: linux-ruby-privilege-escalation-001
version: 1
schema_version: "1.0"
date: "2026-02-03"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  Detects the execution of Ruby commands with elevated privileges on a Linux system. 
  This identifies processes where Ruby is used with the -e flag to execute commands 
  via sudo. This activity indicates a potential privilege escalation attempt using 
  GTFOBins techniques, allowing a user to execute commands as root.

data_source:
  - Tetragon
  - Linux Auditd

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - wildcard:
                  full_log: "*ruby*"
              - wildcard:
                  full_log: "*72756279*"
            minimum_should_match: 1
        - bool:
            should:
              - term:
                  location: "/var/log/tetragon/tetragon.log"
              - term:
                  location: "/var/log/audit/audit.log"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-03 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-03 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with Tetragon 
  or auditd process execution logging enabled. Note that auditd hex-encodes commands 
  with special characters, so the query includes the hex pattern for "ruby" (72756279).

known_false_positives: >
  False positives may occur from automated tooling or legitimate system administrative 
  usage of Ruby scripts. Filter as needed based on authorized Ruby usage patterns.

references:
  - https://gtfobins.github.io/gtfobins/ruby/
  - https://attack.mitre.org/techniques/T1548/003/

response:
  message: >
    Ruby privilege escalation attempt detected on $agent_name$. 
    Ruby was executed with elevated privileges which may indicate 
    a GTFOBins-style privilege escalation. MITRE ATT&CK: $rule_mitre_id$
  risk_score: 30
  severity: low
  risk_objects:
    - field: agent_name
      type: system
      score: 30
  threat_objects: []

tags:
  analytic_story:
    - Linux Privilege Escalation
    - Linux Living Off The Land
  asset_type: Linux
  mitre_attack_id:
    - T1548.003
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (full_log:/.*ruby.*/ OR full_log:/.*72756279.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: linux-sudo-or-su-execution-001
    name: Linux Sudo Or Su Execution
    reason: ruby -e escalation runs through sudo; shows sudo context and prior attempts.
  - id: b8bdac18-c06e-4016-ac30-221553e74f59
    name: Potential Ruby Reverse Shell
    reason: Ruby -e with sudo may be a reverse shell payload rather than a local shell.
  - id: linux-gem-privilege-escalation-001
    name: Linux Gem Privilege Escalation
    reason: Same Ruby ecosystem GTFOBins vector tried back-to-back.
  - id: linux-puppet-privilege-escalation-001
    name: Linux Puppet Privilege Escalation
    reason: Puppet is Ruby-based; sibling sudo-to-root vector.
  - id: linux-sudoers-tmp-file-creation-001
    name: Linux Sudoers Tmp File Creation
    reason: Root obtained then sudoers modified for persistence.
  - id: linux-auditd-add-user-001
    name: Linux Auditd Add User
    reason: Backdoor user creation commonly follows a root shell.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Ruby inline execution
    query: full_log:/.*ruby.*(-e|exec|system|spawn|TCPSocket|\/bin\/sh).*/
    pivot_on: host
    window: 2h
  - name: Sudo launching interpreters
    query: full_log:/.*sudo.*(ruby|irb|gem|puppet|python|perl|bash|sh).*/
    pivot_on: host
    window: 2h
  - name: Account and sudoers changes
    query: full_log:/.*(useradd|adduser|usermod|visudo|\/etc\/sudoers|\/etc\/shadow|authorized_keys).*/
    pivot_on: host
    window: 4h
  - name: Reverse shell indicators
    query: full_log:/.*(\/dev\/tcp\/|nc -e|bash -i|TCPSocket).*/
    pivot_on: host
    window: 2h
  - name: SUID staging
    query: full_log:/.*(chmod [0-9]*[4267][0-7]{3}|chmod .*\+s|chown root).*/
    pivot_on: host
    window: 2h
