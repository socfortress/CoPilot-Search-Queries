name: Linux Find Privilege Escalation
id: linux-find-privilege-escalation-001
version: 1
schema_version: "1.0"
date: "2026-02-04"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  Detects the use of the 'find' command with 'sudo' and '-exec' options, which can 
  indicate an attempt to escalate privileges on a Linux system. This GTFOBins 
  technique allows execution of arbitrary commands as root through find's -exec 
  parameter, potentially leading to a root shell.

data_source:
  - auth.log
  - Tetragon

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - wildcard:
            full_log: "*find*-exec*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-04 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-04 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with auth.log 
  monitoring enabled. Tetragon provides additional process execution visibility 
  including the commands executed via find's -exec parameter.

known_false_positives: >
  System administrators and automated tooling may legitimately use find with -exec 
  for batch file operations. Filter based on known administrative activities and 
  expected command patterns.

references:
  - https://gtfobins.github.io/gtfobins/find/
  - https://en.wikipedia.org/wiki/Find_(Unix)
  - https://attack.mitre.org/techniques/T1548/003/

response:
  message: >
    Find privilege escalation attempt detected on $agent_name$. 
    The find -exec pattern can execute arbitrary commands as root. 
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 5
  severity: low
  risk_objects:
    - field: agent_name
      type: system
      score: 5
  threat_objects: []

tags:
  analytic_story:
    - Linux Privilege Escalation
    - Linux Living Off The Land
  asset_type: Linux
  mitre_attack_id:
    - T1548.003
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: full_log:/.*find.*-exec.*/ AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: linux-sudo-or-su-execution-001
    name: Linux Sudo Or Su Execution
    reason: The find -exec abuse depends on a sudo rule; the sudo invocation shows which user and rule were used.
  - id: linux-sudoers-tmp-file-creation-001
    name: Linux Sudoers Tmp File Creation
    reason: Attackers lacking a GTFOBin may edit sudoers; sudoers edits nearby reveal the privilege setup.
  - id: linux-auditd-possible-access-sudoers-file-001
    name: Linux Auditd Possible Access To Sudoers File
    reason: Sudoers reading is the recon step that finds the NOPASSWD find entry.
  - id: linux-pkexec-privilege-escalation-001
    name: Linux pkexec Privilege Escalation
    reason: Alternative local root path tried when find via sudo is unavailable.
  - id: linux-gdb-privilege-escalation-001
    name: Linux GDB Privilege Escalation
    reason: Another GTFOBins sudo abuse often tried in sequence on the same host.
  - id: ba592c6d-6888-43c3-b8c6-689b8fe47337
    name: Linux Base64 Encoded Pipe to Shell
    reason: Post-root payload delivery commonly runs via encoded pipe to shell.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: find -exec spawning shells or sensitive commands
    query: data_process_exec_process_binary:/.*\/([Ff][Ii][Nn][Dd])/ AND data_process_exec_process_arguments:/.*(\-[Ee][Xx][Ee][Cc]|\-[Ee][Xx][Ee][Cc][Dd][Ii][Rr]).*/ AND data_process_exec_process_arguments:/.*(\/[Bb][Ii][Nn]\/[Ss][Hh]|\/[Bb][Ii][Nn]\/[Bb][Aa][Ss][Hh]|[Ss][Hh] \-[Pp]|[Cc][Hh][Mm][Oo][Dd]|[Cc][Hh][Oo][Ww][Nn]|[Cc][Pp] |\/[Ee][Tt][Cc]\/[Ss][Hh][Aa][Dd][Oo][Ww]|\/[Ee][Tt][Cc]\/[Pp][Aa][Ss][Ss][Ww][Dd]|[Nn][Cc] |[Pp][Yy][Tt][Hh][Oo][Nn]).*/
    pivot_on:
    - host
    window: 2h
  - name: Sudo listing and sudoers recon
    query: (data_process_exec_process_binary:/.*\/([Ss][Uu][Dd][Oo])/ AND data_process_exec_process_arguments:/.*( \-[Ll]|\-[Ll][Ll]|\-\-[Ll][Ii][Ss][Tt]).*/) OR full_log:/.*(\/[Ee][Tt][Cc]\/[Ss][Uu][Dd][Oo][Ee][Rr][Ss]|[Ss][Uu][Dd][Oo][Ee][Rr][Ss]\.[Dd]).*/
    pivot_on:
    - host
    window: 4h
  - name: SUID creation and credential file access after elevation
    query: data_process_exec_process_arguments:/.*([Cc][Hh][Mm][Oo][Dd] \+[Ss]|[Cc][Hh][Mm][Oo][Dd] [Uu]\+[Ss]|[Cc][Hh][Mm][Oo][Dd] 4755|\/[Ee][Tt][Cc]\/[Ss][Hh][Aa][Dd][Oo][Ww]|\/[Ee][Tt][Cc]\/[Pp][Aa][Ss][Ss][Ww][Dd]|[Uu][Ss][Ee][Rr][Aa][Dd][Dd]|[Uu][Ss][Ee][Rr][Mm][Oo][Dd] \-[Aa][Gg]|[Aa][Dd][Dd][Uu][Ss][Ee][Rr]|[Vv][Ii][Ss][Uu][Dd][Oo]).*/
    pivot_on:
    - host
    window: 4h
  - name: Root shell artifacts and new privileged accounts
    query: data_process_exec_process_arguments:/.*([Ss][Hh] \-[Pp]|[Bb][Aa][Ss][Hh] \-[Pp]|[Uu][Ss][Ee][Rr][Mm][Oo][Dd]|[Uu][Ss][Ee][Rr][Aa][Dd][Dd]|[Pp][Aa][Ss][Ss][Ww][Dd] ).*/
    pivot_on:
    - host
    window: 2h
  - name: Payload download after elevation
    query: (data_process_exec_process_binary:/.*\/([Cc][Uu][Rr][Ll]|[Ww][Gg][Ee][Tt])/ AND data_process_exec_process_arguments:/.*([Hh][Tt][Tt][Pp]:\/\/|[Hh][Tt][Tt][Pp][Ss]:\/\/|[Ff][Tt][Pp]:\/\/).*/)
    pivot_on:
    - host
    window: 4h
