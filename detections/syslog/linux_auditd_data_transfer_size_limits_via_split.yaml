name: Linux Auditd Data Transfer Size Limits Via Split
id: linux-auditd-data-transfer-size-limits-via-split-001
version: 1
schema_version: "1.0"
date: "2026-01-28"
author: SOCFortress LLC
status: production
type: Anomaly
description: >
  Detects the use of the split command with the -b (bytes) flag to break files into 
  smaller parts of specific sizes. This may indicate an attacker attempting to evade 
  data transfer size limits or network detection mechanisms during data exfiltration 
  by splitting sensitive files into smaller, less conspicuous chunks.
data_source:
  - Tetragon
  - Linux Auditd
search:
  index_pattern: "${INDEX_PATTERN}"
  size: 20
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - wildcard:
            full_log: "*split*"
        - wildcard:
            full_log: "*-b*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location
parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-01-28 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-01-28 23:59:59.999"
how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with Tetragon 
  or auditd process execution logging enabled. Ensure the agent is configured to 
  capture command-line arguments. The index pattern should match your Wazuh index 
  naming convention.
known_false_positives: >
  System administrators may legitimately use split with -b flag for log rotation, 
  backup operations, or file management tasks. Automated scripts that process large 
  files may also trigger this detection. Filter based on user context and file paths.
references:
  - https://attack.mitre.org/techniques/T1030/
response:
  message: >
    Data transfer size limit evasion detected via split -b command on $agent_name$. 
    Command arguments detected in log. MITRE ATT&CK: $rule_mitre_id$
  risk_score: 49
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 49
  threat_objects: []
tags:
  analytic_story:
    - Linux Living Off The Land
    - Data Exfiltration
    - Compromised Linux Host
  asset_type: Linux
  mitre_attack_id:
    - T1030
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: full_log:/.*split.*/ AND full_log:/.*\-b.*/ AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: linux-auditd-data-transfer-size-limits-via-split-syscall-001
    name: Linux Auditd Data Transfer Size Limits Via Split Syscall
    reason: Same split activity at syscall level; corroborates the process-level hit.
  - id: cb39d16b-b3b6-4a7a-8222-1cf24b686ffc
    name: Data Exfiltration with Wget
    reason: Chunks produced by split are commonly sent out with wget POST.
  - id: c3d9e7f1-6a2b-4d8f-9c2b-5e6f7a8b9c0d
    name: Linux Suspicious Curl Data Exfiltration
    reason: curl uploads of the split chunks are the likely transfer stage.
  - id: linux-proxy-socks-curl-001
    name: Linux Proxy Socks Curl
    reason: Exfil over a SOCKS proxy hides the destination.
  - id: linux-auditd-base64-decode-001
    name: Linux Auditd Base64 Decode
    reason: Encoding of staged data pairs with chunking.
  - id: linux-auditd-possible-access-credential-files-001
    name: Linux Auditd Possible Access To Credential Files
    reason: Split sensitive files often began as credential harvesting.
  - id: linux-auditd-clipboard-data-copy-001
    name: Linux Auditd Clipboard Data Copy
    reason: Another collection method feeding the same staged data.
  - id: 1182f3b3-e716-4efa-99ab-d2685d04360f
    name: History File Deletion
    reason: Cleanup of shell history after staging and exfil.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Archive/compress staging before split
    query: data_process_exec_process_binary:/.*(\/[Tt][Aa][Rr]|\/[Zz][Ii][Pp]|\/[Gg][Zz][Ii][Pp]|\/[Bb][Zz][Ii][Pp]2|\/[Xx][Zz]|\/7[Zz]|\/[Rr][Aa][Rr])/
    pivot_on: host
    window: 2h
  - name: Outbound transfer utilities
    query: data_process_exec_process_binary:/.*(\/[Cc][Uu][Rr][Ll]|\/[Ww][Gg][Ee][Tt]|\/[Ss][Cc][Pp]|\/[Ss][Ff][Tt][Pp]|\/[Rr][Ss][Yy][Nn][Cc]|\/[Nn][Cc]|\/[Nn][Cc][Aa][Tt]|\/[Ff][Tt][Pp])/
    pivot_on: host
    window: 2h
  - name: Reads of sensitive or bulk data
    query: full_log:/.*(/[Ee][Tt][Cc]/[Ss][Hh][Aa][Dd][Oo][Ww]|.[Ss][Ss][Hh]/|.[Aa][Ww][Ss]/|.[Kk][Uu][Bb][Ee]/|.[Ss][Qq][Ll]|.[Bb][Aa][Kk]|.[Pp][Ee][Mm]|.[Kk][Dd][Bb][Xx]).*/
    pivot_on: user
    window: 4h
  - name: Encoding and cleanup after staging
    query: data_process_exec_process_binary:/.*(\/[Bb][Aa][Ss][Ee]64|\/[Xx][Xx][Dd]|\/[Oo][Pp][Ee][Nn][Ss][Ss][Ll]|\/[Ss][Hh][Rr][Ee][Dd])/
    pivot_on: host
    window: 2h
