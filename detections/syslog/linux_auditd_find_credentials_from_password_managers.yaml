name: Linux Password Vault Discovery
id: 5f6a7b8c-9d01-3456-7890-12abcdef3456
version: 1
schema_version: "1.0"
date: "2026-01-30"
author: SOCFORTRESS LLC
status: production
type: TTP
description: >
  Detects attempts to search for password vault files (e.g., KeePass databases)
  on Linux systems using commands such as find or grep, which may indicate
  credential discovery or reconnaissance activity.
data_source:
  - Wazuh Agent Logs
  - Linux Auditd
  - Syslog
search:
  index_pattern: "${INDEX_PATTERN}"
  size: 20
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - wildcard:
                  full_log: "*find*"
              - wildcard:
                  full_log: "*grep*"
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  full_log: "*.kdbx*"
              - wildcard:
                  full_log: "*.kdb*"
              - wildcard:
                  full_log: "*KeePass*"
              - wildcard:
                  full_log: "*vault*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location
parameters:
  AGENT_NAME:
    description: "Agent name to filter"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time"
    type: datetime
    required: true
    example: "2026-01-28 14:36:00.000"
  END_TIME:
    description: "Query end time"
    type: datetime
    required: true
    example: "2026-01-28 14:38:00.000"
how_to_implement: >
  Requires Linux endpoints with Wazuh agents capturing process execution.
  Monitoring find/grep commands targeting KeePass or other password vault
  files helps detect attempts to locate sensitive credentials.
known_false_positives: >
  System administrators searching for password vault files for legitimate purposes.
references:
  - https://attack.mitre.org/techniques/T1081/
  - https://documentation.wazuh.com/current/user-manual/capabilities/index.html
response:
  message: >
    Password vault discovery activity detected on $agent_name$.
    Command: $full_log$
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: full_log
      type: process
tags:
  analytic_story:
    - Linux Reconnaissance
    - Credential Vault Discovery
  asset_type: Linux
  mitre_attack_id:
    - T1081
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (full_log:/.*find.*/ OR full_log:/.*grep.*/) AND (full_log:/.*\.kdbx.*/ OR full_log:/.*\.kdb.*/ OR full_log:/.*KeePass.*/ OR full_log:/.*vault.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 4d5e6f7a-8b90-2345-6789-01abcdef2345
    name: Linux Credential Discovery
    reason: Keyword find/grep for passwords on the same host; sibling of vault and key hunting in one credential-harvest pass.
  - id: 3b4c5d6e-7f80-1234-5678-90abcdef1234
    name: Linux SSH Key Discovery
    reason: Same discovery sweep aimed at SSH private keys; credential hunting commonly covers keys, passwords and vaults together.
  - id: linux-auditd-possible-access-credential-files-001
    name: Linux Auditd Possible Access To Credential Files
    reason: Actually reading credential files (shadow, passwd) after the search finds targets.
  - id: fa4aaed5-4fe0-498d-bbc0-08e3346387ba
    name: Copy Passwd Or Shadow From TMP Path
    reason: Staging passwd/shadow copies to tmp for offline cracking or exfiltration after credential discovery.
  - id: d7821ff1-4527-4e33-9f84-d0d57fa2fb66
    name: Print History File Contents
    reason: Shell history is mined for typed passwords and hosts alongside file searches.
  - id: c3d9e7f1-6a2b-4d8f-9c2b-5e6f7a8b9c0d
    name: Linux Suspicious Curl Data Exfiltration
    reason: Found documents or credentials leave the host via curl.
  - id: 00b90cc1-17ec-402c-96ad-3a8117d7a582
    name: Suspicious Curl File Upload - Linux
    reason: Upload of discovered files to an external endpoint.
  - id: linux-auditd-data-transfer-size-limits-via-split-001
    name: Linux Auditd Data Transfer Size Limits Via Split
    reason: Chunking collected files to fit exfil size limits after discovery.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Archiving of vault or key files
    query: data_process_exec_process_binary:/.*(tar|zip|7z|gzip).*/ AND data_process_exec_process_arguments:/.*(kdbx|kdb|vault|keepass).*/
    pivot_on: host
    window: 6h
  - name: Reads or copies of KeePass databases
    query: data_process_exec_process_binary:/.*(cat|cp|scp|base64|xxd|rsync).*/ AND data_process_exec_process_arguments:/.*(kdbx|kdb|keepass).*/
    pivot_on: host
    window: 6h
  - name: Egress tools
    query: data_process_exec_process_binary:/.*(curl|wget|scp|nc|ncat|sftp).*/
    pivot_on: host
    window: 6h
  - name: Credential keyword hunting
    query: data_process_exec_process_binary:/.*(grep|find).*/ AND data_process_exec_process_arguments:/.*(passw|secret|token|id_rsa).*/
    pivot_on: host
    window: 6h
  - name: Interactive sessions and privilege use
    query: data_process_exec_process_binary:/.*(sudo|su|ssh).*/
    pivot_on: user
    window: 6h
