name: Linux Security Monitoring Service Stop
id: linux-security-monitoring-service-stop-001
version: 1
schema_version: "1.0"
date: "2026-02-03"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  Detects suspicious security monitoring service stop events. This includes Sysmon, 
  Tetragon, Wazuh agent, auditd, and other security services. Stopping these services 
  may indicate attempts to evade detection or disable security monitoring capabilities.

data_source:
  - Linux Auditd
  - auth.log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - wildcard:
                  full_log: "*SERVICE_STOP*"
              - wildcard:
                  full_log: "*sysmon*"
              - wildcard:
                  full_log: "*tetragon*"
              - wildcard:
                  full_log: "*wazuh*"
              - wildcard:
                  full_log: "*auditd*"
              - wildcard:
                  full_log: "*osquery*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-03 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-03 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with auditd 
  service monitoring enabled. Configure auditd to capture SERVICE_STOP events. 
  The index pattern should match your Wazuh index naming convention.

known_false_positives: >
  Administrators may legitimately stop security services during maintenance or 
  upgrades. Filter based on known maintenance windows and authorized users.

references:
  - https://attack.mitre.org/techniques/T1489/
  - https://www.splunk.com/en_us/blog/security/deep-dive-on-persistence-privilege-escalation-technique-and-detection-in-linux-platform.html

response:
  message: >
    Security monitoring service activity detected on $agent_name$. 
    Stopping services like Sysmon, Tetragon, or Wazuh may indicate defense evasion. 
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 40
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 40
  threat_objects: []

tags:
  analytic_story:
    - Linux Living Off The Land
    - Linux Privilege Escalation
    - Linux Persistence Techniques
    - Compromised Linux Host
  asset_type: Linux
  mitre_attack_id:
    - T1489
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (full_log:/.*SERVICE_STOP.*/ OR full_log:/.*sysmon.*/ OR full_log:/.*tetragon.*/ OR full_log:/.*wazuh.*/ OR full_log:/.*auditd.*/ OR full_log:/.*osquery.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: linux-stop-services-001
    name: Linux Stop Services
    reason: Direct service-stop commands usually cause the SERVICE_STOP event.
  - id: de25eeb8-3655-4643-ac3a-b662d3f26b6b
    name: Disable Or Stop Services
    reason: systemctl disable/stop of security agents is the command-line view of this tamper.
  - id: linux-auditd-osquery-service-stop-001
    name: Linux Auditd Osquery Service Stop
    reason: Osquery stop is one specific agent tamper in the same family.
  - id: linux-auditd-daemon-shutdown-001
    name: Linux Auditd Daemon Shutdown
    reason: Auditd itself going down blinds host telemetry.
  - id: linux-auditd-daemon-abort-001
    name: Linux Auditd Daemon Abort
    reason: Abnormal auditd abort may be a forced kill rather than clean stop.
  - id: bed26dea-4525-47f4-b24a-76e30e44ffb0
    name: Audit Rules Deleted Via Auditctl
    reason: Audit rules wiped as an alternative or addition to stopping the daemon.
  - id: 977ef627-4539-4875-adf4-ed8f780c4922
    name: Auditing Configuration Changes on Linux Host
    reason: Auditing config edits accompany defense evasion.
  - id: c830f15d-6f6e-430f-8074-6f73d6807841
    name: Logging Configuration Changes on Linux Host
    reason: Logging config tampering precedes silent activity.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Security agent stop/kill/disable
    query: full_log:/.*(systemctl|service|kill|pkill|killall).*(stop|disable|mask|-9).*(wazuh|auditd|tetragon|osquery|sysmon|falco|ossec).*/
    pivot_on: host
    window: 4h
  - name: Audit and logging tamper
    query: full_log:/.*(auditctl -D|\/etc\/audit|rsyslog|journald).*(rm |truncate|sed -i|-D).*/
    pivot_on: host
    window: 4h
  - name: Agent files or config altered
    query: full_log:/.*(\/var\/ossec|\/etc\/wazuh|\/opt\/tetragon|\/etc\/osquery).*(rm |mv |chattr|sed -i).*/
    pivot_on: host
    window: 4h
  - name: Activity after monitoring gap
    query: full_log:/.*(wget|curl|chmod \+x|useradd|crontab|base64 -d).*/
    pivot_on: host
    window: 2h
  - name: Firewall changes blocking manager
    query: full_log:/.*(iptables|ufw|nft|firewall-cmd).*(DROP|REJECT|1514|1515).*/
    pivot_on: host
    window: 4h
