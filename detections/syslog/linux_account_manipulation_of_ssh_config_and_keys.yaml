name: Linux Auditd SSH Config Keys Deletion
id: linux-auditd-ssh-config-keys-deletion-001
version: 1
schema_version: "1.0"
date: "2026-01-28"
author: SOCFortress LLC
status: production
type: TTP
description: >
  Detects deletion of SSH configuration files and keys from /etc/ssh/ or user .ssh/ 
  directories using rm, shred, or unlink commands. Adversaries may delete SSH keys 
  and configurations to disrupt remote access, cover their tracks after establishing 
  alternate persistence mechanisms, or as part of a destructive attack aimed at 
  denying legitimate administrators access to systems.
data_source:
  - Tetragon
  - Linux Auditd
search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - wildcard:
                  full_log: "*/etc/ssh/*"
              - wildcard:
                  full_log: "*/.ssh/*"
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  full_log: "*rm *"
              - wildcard:
                  full_log: "*shred*"
              - wildcard:
                  full_log: "*unlink*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - rule_mitre_id
    - rule_description
    - full_log
parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-01-28 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-01-28 23:59:59.999"
how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with Tetragon 
  or auditd process execution logging enabled. Ensure the agent is configured to 
  capture command-line arguments. The index pattern should match your Wazuh index 
  naming convention.
known_false_positives: >
  System administrators may legitimately rotate or remove old SSH keys as part of 
  key management practices. Automated key rotation scripts may also trigger this 
  detection. User account deprovisioning processes may delete user SSH directories.
references:
  - https://attack.mitre.org/techniques/T1070/004/
  - https://attack.mitre.org/techniques/T1485/
response:
  message: >
    SSH configuration or key deletion detected on $agent_name$. 
    Command: $data_process_exec_process_binary$ $data_process_exec_process_arguments$
    Files in /etc/ssh/ or .ssh/ directories were deleted. MITRE ATT&CK: $rule_mitre_id$
  risk_score: 72
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 72
  threat_objects:
    - field: data_process_exec_process_binary
      type: process
tags:
  analytic_story:
    - Linux Defense Evasion
    - Data Destruction
    - Compromised Linux Host
  asset_type: Linux
  mitre_attack_id:
    - T1070.004
    - T1485
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (full_log:/.*\/etc\/ssh\/.*/ OR full_log:/.*\/.ssh\/.*/) AND (full_log:/.*rm .*/ OR full_log:/.*shred.*/ OR full_log:/.*unlink.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: linux-auditd-add-user-001
    name: Linux Auditd Add User
    reason: Rogue account creation often precedes deleting legitimate SSH keys to lock admins out.
  - id: dae47c5a-769f-42c8-b256-f45c6146c320
    name: Linux User Account Creation Detection
    reason: User creation via useradd/adduser alongside key deletion suggests replaced access.
  - id: 3b4c5d6e-7f80-1234-5678-90abcdef1234
    name: Linux SSH Key Discovery
    reason: SSH key discovery is a precursor to stealing or removing keys.
  - id: d4e5f6a7-8b9c-4d1e-a2b3-5f6e7a8b9c1d
    name: Linux SSH Configuration Access
    reason: SSH configuration access precedes tampering with sshd/ssh config.
  - id: a3b7c9d2-4f5e-4b6d-8c1a-2d3f4e5b6c7a
    name: Linux Critical Directory Deletion
    reason: Destructive deletion of critical directories fits the same wiper-style attack.
  - id: linux-auditd-data-destruction-command-001
    name: Linux Auditd Data Destruction Command
    reason: Key deletion is frequently part of broader data destruction.
  - id: 80915f59-9b56-4616-9de0-fd0dea6c12fe
    name: Linux Logs Clearing Attempts
    reason: Log clearing accompanies track covering after key deletion.
  - id: 1182f3b3-e716-4efa-99ab-d2685d04360f
    name: History File Deletion
    reason: History deletion is the sibling anti-forensics step.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: SSH authorized_keys or config writes
    query: full_log:/.*(authorized_keys|sshd_config|ssh_config).*/ AND full_log:/.*(echo|tee|sed|cat|cp|mv|>>).*/
    pivot_on: host
    window: 4h
  - name: Account creation or password changes
    query: full_log:/.*(useradd|adduser|usermod|passwd|chpasswd).*/
    pivot_on: host
    window: 4h
  - name: Destructive file commands
    query: full_log:/.*(shred|wipefs|dd if=\/dev\/(zero|urandom)|rm -rf).*/
    pivot_on: host
    window: 4h
  - name: SSH service stop or restart
    query: full_log:/.*(systemctl|service).*sshd?.*(stop|restart|disable|mask).*/
    pivot_on: host
    window: 2h
  - name: Log and history tampering
    query: full_log:/.*(history -c|\.bash_history|\/var\/log\/(auth|secure|wtmp|btmp)).*(rm|truncate|shred|unlink).*/
    pivot_on: host
    window: 4h
