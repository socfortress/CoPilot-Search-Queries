      query: '(data_process_exec_process_binary:/.*(\/[Cc][Hh][Aa][Tt][Tt][Rr]|\/[Ss][Hh][Rr][Ee][Dd]|\/[Aa][Uu][Dd][Ii][Tt][Cc][Tt][Ll]|\/[Ss][Ee][Tt][Ee][Nn][Ff][Oo][Rr][Cc][Ee])/ OR data_process_exec_process_arguments:/.*[Hh][Ii][Ss][Tt][Oo][Rr][Yy] -[Cc].*/ OR data_process_exec_process_arguments:/.*\/[Vv][Aa][Rr]\/[Ll][Oo][Gg].*/ OR data_process_exec_process_arguments:/.*[Ii][Pp][Tt][Aa][Bb][Ll][Ee][Ss] -[Ff].*/)'
