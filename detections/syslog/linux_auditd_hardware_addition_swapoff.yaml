name: Linux Swapoff Detection
id: 2a3b4c5d-6e7f-8901-2345-6789abcdef01
version: 1
schema_version: "1.0"
date: "2026-01-30"
author: SOCFORTRESS LLC
status: production
type: TTP
description: >
  Detects execution of the swapoff command with the -a flag
  on Linux systems, which can indicate attempts to remove
  swap space for stealthy operations or memory hiding.
data_source:
  - Linux Auditd
search:
  index_pattern: "${INDEX_PATTERN}"
  size: 20
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - wildcard:
            full_log: "*swapoff*"
        - wildcard:
            full_log: "*-a*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location
parameters:
  AGENT_NAME:
    description: "Agent name to filter"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time"
    type: datetime
    required: true
    example: "2026-01-28 14:46:00.000"
  END_TIME:
    description: "Query end time"
    type: datetime
    required: true
    example: "2026-01-28 14:48:00.000"
how_to_implement: >
  Requires Linux endpoints with Wazuh agents capturing process execution.
  Monitoring swapoff operations helps detect attempts to disable
  swap space for hiding malicious activity.
known_false_positives: >
  System administrators intentionally turning off swap for maintenance or tuning.
references:
  - https://attack.mitre.org/techniques/T1217/
  - https://documentation.wazuh.com/current/user-manual/capabilities/index.html
response:
  message: >
    Swapoff command executed on $agent_name$.
    Command: $full_log$
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 60
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 60
  threat_objects:
    - field: full_log
      type: process
tags:
  analytic_story:
    - Linux Evasion
    - Memory Hiding
  asset_type: Linux
  mitre_attack_id:
    - T1217
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: full_log:/.*swapoff.*/ AND full_log:/.*\-a.*/ AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: de25eeb8-3655-4643-ac3a-b662d3f26b6b
    name: Disable Or Stop Services
    reason: Stopping or disabling services commonly accompanies swapoff in impact or anti-forensic preparation
  - id: linux-unload-module-via-modprobe-001
    name: Linux Unload Module Via Modprobe
    reason: Kernel module unload alongside swap removal suggests system-level tampering rather than routine tuning
  - id: linux-kernel-module-rmmod-utility-001
    name: Linux Kernel Module Using Rmmod Utility
    reason: Module removal on the same host strengthens a system-manipulation story
  - id: 80915f59-9b56-4616-9de0-fd0dea6c12fe
    name: Linux Logs Clearing Attempts
    reason: Log clearing after memory-hiding steps indicates anti-forensics
  - id: 1182f3b3-e716-4efa-99ab-d2685d04360f
    name: History File Deletion
    reason: Shell history deletion follows when the operator is cleaning traces
  - id: linux-sudo-or-su-execution-001
    name: Linux Sudo Or Su Execution
    reason: swapoff needs root, so the sudo/su that granted it identifies the actor
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Swap and memory configuration commands
    query: (data_process_exec_process_binary:/.*\/([Ss][Ww][Aa][Pp][Oo][Nn]|[Ss][Ww][Aa][Pp][Oo][Ff][Ff]|[Mm][Kk][Ss][Ww][Aa][Pp]|[Ss][Yy][Ss][Cc][Tt][Ll]).*/) OR (data_process_exec_process_arguments:/.*(vm\.swappiness|\/proc\/sys\/vm|\/etc\/fstab|drop_caches).*/)
    pivot_on:
    - host
    window: 2h
  - name: Services stopped or disabled
    query: (data_process_exec_process_binary:/.*\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]/) AND (data_process_exec_process_arguments:/.*([Ss][Tt][Oo][Pp]|[Dd][Ii][Ss][Aa][Bb][Ll][Ee]|[Mm][Aa][Ss][Kk]).*/)
    pivot_on:
    - host
    window: 2h
  - name: Kernel module load or unload activity
    query: data_process_exec_process_binary:/.*\/([Ii][Nn][Ss][Mm][Oo][Dd]|[Rr][Mm][Mm][Oo][Dd]|[Mm][Oo][Dd][Pp][Rr][Oo][Bb][Ee]|[Dd][Ee][Pp][Mm][Oo][Dd]).*/
    pivot_on:
    - host
    window: 2h
  - name: Log and history tampering
    query: (data_process_exec_process_arguments:/.*(\/var\/log|\.bash_history|history -c|unset HISTFILE|journalctl --vacuum).*/) AND (data_process_exec_process_binary:/.*\/([Rr][Mm]|[Tt][Rr][Uu][Nn][Cc][Aa][Tt][Ee]|[Ss][Hh][Rr][Ee][Dd]|[Jj][Oo][Uu][Rr][Nn][Aa][Ll][Cc][Tt][Ll]|[Bb][Aa][Ss][Hh]|[Ss][Hh]).*/)
    pivot_on:
    - host
    window: 4h
