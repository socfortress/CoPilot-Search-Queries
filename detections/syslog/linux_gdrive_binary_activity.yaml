name: Linux Gdrive Binary Activity
id: linux-gdrive-binary-activity-001
version: 1
schema_version: "1.0"
date: "2026-02-03"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects the execution of the 'gdrive' tool on Linux hosts. This tool allows 
  standard users to perform tasks associated with Google Drive via the command line. 
  Threat actors use gdrive to stage tools as well as exfiltrate data. Associated 
  with UNC3886 China-Nexus threat activity.

data_source:
  - Tetragon
  - auth.log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - wildcard:
            full_log: "*gdrive*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-03 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-03 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with Tetragon 
  process execution logging enabled. Auth.log monitoring provides sudo command 
  visibility for gdrive binary deployment.

known_false_positives: >
  Administrators may legitimately use gdrive for backup or automation purposes. 
  Filter based on known administrative users and expected usage patterns.

references:
  - https://cloud.google.com/blog/topics/threat-intelligence/uncovering-unc3886-espionage-operations
  - https://attack.mitre.org/techniques/T1567/

response:
  message: >
    Gdrive binary activity detected on $agent_name$. 
    This tool can be used for data exfiltration to Google Drive. 
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 49
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 49
  threat_objects: []

tags:
  analytic_story:
    - China-Nexus Threat Activity
  asset_type: Linux
  mitre_attack_id:
    - T1567
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: full_log:/.*gdrive.*/ AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored by the correlation engine for review. Related CoPilot Searches to run
  # around an alert from this rule, scoped to the same host/user/IP within the window.
  related_rules:
    - id: 683e6196-b8e8-11eb-9a79-acde48001122
      name: "Detect Renamed PSExec"
      reason: "same analytic story: China-Nexus Threat Activity"
    - id: 1b7bfb2c-b8e6-11eb-99ac-acde48001122
      name: "Detect Renamed WinRAR"
      reason: "same analytic story: China-Nexus Threat Activity"
    - id: 9be56c82-b1cc-4318-87eb-d138afaaca39
      name: "Malicious PowerShell Process - Execution Policy Bypass"
      reason: "same analytic story: China-Nexus Threat Activity"
  window: 1h
  enrichment_searches:
  # NEW ad-hoc searches the engine runs around an alert from this rule, scoped to
  # the alert's host/user/IP within the window (not existing CoPilot Searches).
    - name: "Auditd activity on this host in the window"
      query: 'data_audit_type:*'
      pivot_on: [host]
      window: 1h
    - name: "Process execution (execve) on this host"
      query: 'data_audit_syscall:"execve"'
      pivot_on: [host]
      window: 1h
    - name: "High-severity alerts on this host"
      query: 'rule_level:>=10'
      pivot_on: [host]
      window: 1h
