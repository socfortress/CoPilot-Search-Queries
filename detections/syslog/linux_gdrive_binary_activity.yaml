name: Linux Gdrive Binary Activity
id: linux-gdrive-binary-activity-001
version: 1
schema_version: "1.0"
date: "2026-02-03"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects the execution of the 'gdrive' tool on Linux hosts. This tool allows 
  standard users to perform tasks associated with Google Drive via the command line. 
  Threat actors use gdrive to stage tools as well as exfiltrate data. Associated 
  with UNC3886 China-Nexus threat activity.

data_source:
  - Tetragon
  - auth.log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - wildcard:
            full_log: "*gdrive*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-03 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-03 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with Tetragon 
  process execution logging enabled. Auth.log monitoring provides sudo command 
  visibility for gdrive binary deployment.

known_false_positives: >
  Administrators may legitimately use gdrive for backup or automation purposes. 
  Filter based on known administrative users and expected usage patterns.

references:
  - https://cloud.google.com/blog/topics/threat-intelligence/uncovering-unc3886-espionage-operations
  - https://attack.mitre.org/techniques/T1567/

response:
  message: >
    Gdrive binary activity detected on $agent_name$. 
    This tool can be used for data exfiltration to Google Drive. 
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 49
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 49
  threat_objects: []

tags:
  analytic_story:
    - China-Nexus Threat Activity
  asset_type: Linux
  mitre_attack_id:
    - T1567
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: full_log:/.*gdrive.*/ AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c3d9e7f1-6a2b-4d8f-9c2b-5e6f7a8b9c0d
    name: Linux Suspicious Curl Data Exfiltration
    reason: Curl upload to other endpoints is the alternate exfil channel used alongside gdrive.
  - id: cb39d16b-b3b6-4a7a-8222-1cf24b686ffc
    name: Data Exfiltration with Wget
    reason: Wget --post-file is another exfiltration path used for the same collected data.
  - id: linux-sudo-or-su-execution-001
    name: Linux Sudo Or Su Execution
    reason: gdrive deployment is often done with sudo; this shows who installed it.
  - id: cf610c15-ed71-46e1-bdf8-2bd1a99de6c4
    name: Download File To Potentially Suspicious Directory Via Wget
    reason: gdrive is usually downloaded into a temp directory via wget before use.
  - id: 30bcce26-51c5-49f2-99c8-7b59e3af36c7
    name: Execution Of Script Located In Potentially Suspicious Directory
    reason: A gdrive binary run from /tmp or /dev/shm indicates attacker staging.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: gdrive command usage (upload/download/auth)
    query: (data_process_exec_process_binary:/.*\/([Gg][Dd][Rr][Ii][Vv][Ee])/ OR data_process_exec_process_arguments:/.*([Gg][Dd][Rr][Ii][Vv][Ee] [Uu][Pp][Ll][Oo][Aa][Dd]|[Gg][Dd][Rr][Ii][Vv][Ee] [Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd]|[Gg][Dd][Rr][Ii][Vv][Ee] [Aa][Bb][Oo][Uu][Tt]|[Gg][Dd][Rr][Ii][Vv][Ee] [Ll][Ii][Ss][Tt]|[Gg][Dd][Rr][Ii][Vv][Ee] [Ss][Yy][Nn][Cc]|[Gg][Dd][Rr][Ii][Vv][Ee] [Ss][Hh][Aa][Rr][Ee]).*/)
    pivot_on:
    - host
    window: 4h
  - name: 'Binary staging: download and chmod of gdrive'
    query: (((data_process_exec_process_binary:/.*\/([Cc][Uu][Rr][Ll]|[Ww][Gg][Ee][Tt])/ AND data_process_exec_process_arguments:/.*([Hh][Tt][Tt][Pp]:\/\/|[Hh][Tt][Tt][Pp][Ss]:\/\/|[Ff][Tt][Pp]:\/\/).*/) AND data_process_exec_process_arguments:/.*([Gg][Dd][Rr][Ii][Vv][Ee]).*/) OR (data_process_exec_process_binary:/.*\/([Cc][Hh][Mm][Oo][Dd])/ AND data_process_exec_process_arguments:/.*([Gg][Dd][Rr][Ii][Vv][Ee]).*/))
    pivot_on:
    - host
    window: 4h
  - name: Data collection and archiving before upload
    query: data_process_exec_process_binary:/.*\/([Tt][Aa][Rr]|[Zz][Ii][Pp]|7[Zz]|7[Zz][Aa]|[Gg][Zz][Ii][Pp]|[Rr][Aa][Rr])/ AND data_process_exec_process_arguments:/.*(\/[Ee][Tt][Cc]\/|\/[Hh][Oo][Mm][Ee]\/|\/[Vv][Aa][Rr]\/|\/[Rr][Oo][Oo][Tt]\/|\.[Ss][Ss][Hh]|\.[Tt][Aa][Rr]|\.[Zz][Ii][Pp]|\/[Tt][Mm][Pp]\/).*/
    pivot_on:
    - host
    window: 4h
  - name: Other exfiltration utilities (curl upload, rclone, wget post)
    query: data_process_exec_process_binary:/.*\/([Rr][Cc][Ll][Oo][Nn][Ee]|[Mm][Ee][Gg][Aa][Cc][Mm][Dd]|[Ss][Cc][Pp]|[Ss][Ff][Tt][Pp]|[Nn][Cc]|[Cc][Uu][Rr][Ll]|[Ww][Gg][Ee][Tt])/ AND data_process_exec_process_arguments:/.*(\-\-[Uu][Pp][Ll][Oo][Aa][Dd]\-[Ff][Ii][Ll][Ee]|\-[Tt] |\-\-[Pp][Oo][Ss][Tt]\-[Ff][Ii][Ll][Ee]|\-[Ff] |[Rr][Cc][Ll][Oo][Nn][Ee]|[Mm][Ee][Gg][Aa]).*/
    pivot_on:
    - host
    window: 4h
  - name: Credential and token files accessed
    query: data_process_exec_process_arguments:/.*(\.[Gg][Dd][Rr][Ii][Vv][Ee]|[Tt][Oo][Kk][Ee][Nn]_[Vv]2\.[Jj][Ss][Oo][Nn]|\.[Cc][Oo][Nn][Ff][Ii][Gg]\/[Gg][Dd][Rr][Ii][Vv][Ee]|\.[Ss][Ss][Hh]\/|[Ii][Dd]_[Rr][Ss][Aa]|\/[Ee][Tt][Cc]\/[Ss][Hh][Aa][Dd][Oo][Ww]|\.[Aa][Ww][Ss]\/[Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll][Ss]).*/
    pivot_on:
    - host
    window: 24h
