name: Linux Credential Discovery
id: 4d5e6f7a-8b90-2345-6789-01abcdef2345
version: 1
schema_version: "1.0"
date: "2026-01-30"
author: SOCFORTRESS LLC
status: production
type: TTP
description: >
  Detects attempts to search for passwords or credentials on Linux systems
  using common commands such as find or grep, which may indicate reconnaissance
  or credential harvesting activity.
data_source:
  - Wazuh Agent Logs
  - Linux Auditd
  - Syslog
search:
  index_pattern: "${INDEX_PATTERN}"
  size: 20
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - wildcard:
                  full_log: "*find*"
              - wildcard:
                  full_log: "*grep*"
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  full_log: "*password*"
              - wildcard:
                  full_log: "*credential*"
              - wildcard:
                  full_log: "*creds*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location
parameters:
  AGENT_NAME:
    description: "Agent name to filter"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time"
    type: datetime
    required: true
    example: "2026-01-28 14:38:00.000"
  END_TIME:
    description: "Query end time"
    type: datetime
    required: true
    example: "2026-01-28 14:40:00.000"
how_to_implement: >
  Requires Linux endpoints with Wazuh agents capturing process execution.
  Monitoring find/grep commands targeting files containing passwords
  or credentials helps detect attempts to discover sensitive information.
known_false_positives: >
  System administrators searching for credentials for legitimate maintenance.
references:
  - https://attack.mitre.org/techniques/T1081/
  - https://documentation.wazuh.com/current/user-manual/capabilities/index.html
response:
  message: >
    Credential discovery activity detected on $agent_name$.
    Command: $full_log$
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: full_log
      type: process
tags:
  analytic_story:
    - Linux Reconnaissance
    - Credential Harvesting
  asset_type: Linux
  mitre_attack_id:
    - T1081
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (full_log:/.*find.*/ OR full_log:/.*grep.*/) AND (full_log:/.*password.*/ OR full_log:/.*credential.*/ OR full_log:/.*creds.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 5f6a7b8c-9d01-3456-7890-12abcdef3456
    name: Linux Password Vault Discovery
    reason: Hunt for KeePass/vault files on the same host; same collection objective.
  - id: 3b4c5d6e-7f80-1234-5678-90abcdef1234
    name: Linux SSH Key Discovery
    reason: Same discovery sweep aimed at SSH private keys; credential hunting commonly covers keys, passwords and vaults together.
  - id: linux-auditd-possible-access-credential-files-001
    name: Linux Auditd Possible Access To Credential Files
    reason: Actually reading credential files (shadow, passwd) after the search finds targets.
  - id: fa4aaed5-4fe0-498d-bbc0-08e3346387ba
    name: Copy Passwd Or Shadow From TMP Path
    reason: Staging passwd/shadow copies to tmp for offline cracking or exfiltration after credential discovery.
  - id: d7821ff1-4527-4e33-9f84-d0d57fa2fb66
    name: Print History File Contents
    reason: Shell history is mined for typed passwords and hosts alongside file searches.
  - id: linux-auditd-possible-access-sudoers-file-001
    name: Linux Auditd Possible Access To Sudoers File
    reason: Privilege reconnaissance following credential discovery.
  - id: c3d9e7f1-6a2b-4d8f-9c2b-5e6f7a8b9c0d
    name: Linux Suspicious Curl Data Exfiltration
    reason: Found documents or credentials leave the host via curl.
  - id: linux-auditd-data-transfer-size-limits-via-split-001
    name: Linux Auditd Data Transfer Size Limits Via Split
    reason: Chunking collected files to fit exfil size limits after discovery.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Reads of passwd, shadow and credential files
    query: data_process_exec_process_arguments:/.*(\/etc\/shadow|\/etc\/passwd|\.aws\/credentials|\.git\-credentials|\.netrc|\.pgpass).*/
    pivot_on: host
    window: 6h
  - name: Credential keyword grep over configs
    query: data_process_exec_process_binary:/.*(grep|find|awk).*/ AND data_process_exec_process_arguments:/.*(passw|secret|api[_\-]?key|token).*/
    pivot_on: host
    window: 6h
  - name: Archive then egress
    query: data_process_exec_process_binary:/.*(tar|zip|curl|wget|scp|nc).*/
    pivot_on: host
    window: 6h
  - name: New SSH sessions or sudo after discovery
    query: data_process_exec_process_binary:/.*(ssh|sudo|su).*/
    pivot_on: user
    window: 6h
  - name: Password cracking or dump tooling
    query: data_process_exec_process_binary:/.*(john|hashcat|unshadow|mimipenguin|lazagne).*/
    pivot_on: host
    window: 24h
