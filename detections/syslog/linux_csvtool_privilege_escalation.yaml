name: Linux Csvtool Privilege Escalation
id: linux-csvtool-privilege-escalation-001
version: 1
schema_version: "1.0"
date: "2026-02-04"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  Detects the execution of the 'csvtool' command with 'sudo' privileges using the 
  'call' subcommand, which can allow a user to run system commands as root. This 
  GTFOBins technique abuses csvtool's ability to execute arbitrary commands, 
  enabling privilege escalation.

data_source:
  - auth.log
  - Tetragon

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - wildcard:
            full_log: "*csvtool*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-04 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-04 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with auth.log 
  monitoring enabled. Tetragon provides additional process execution visibility.

known_false_positives: >
  Legitimate use of csvtool for CSV file processing. However, the 'call' 
  subcommand with shell commands is rarely used legitimately. Filter based 
  on known data processing workflows.

references:
  - https://gtfobins.github.io/gtfobins/csvtool/
  - https://attack.mitre.org/techniques/T1548/003/

response:
  message: >
    Csvtool privilege escalation attempt detected on $agent_name$. 
    The csvtool call command can execute arbitrary system commands as root. 
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 10
  severity: low
  risk_objects:
    - field: agent_name
      type: system
      score: 10
  threat_objects: []

tags:
  analytic_story:
    - Linux Privilege Escalation
    - Linux Living Off The Land
  asset_type: Linux
  mitre_attack_id:
    - T1548.003
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: full_log:/.*csvtool.*/ AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: linux-sudo-or-su-execution-001
    name: Linux Sudo Or Su Execution
    reason: csvtool call is run via sudo; shows the sudo context and sibling commands
  - id: linux-auditd-possible-access-sudoers-file-001
    name: Linux Auditd Possible Access To Sudoers File
    reason: Sudoers enumeration identifies NOPASSWD csvtool
  - id: linux-whoami-user-discovery-001
    name: Linux Whoami User Discovery
    reason: Verifies root after the escape
  - id: linux-cpulimit-privilege-escalation-001
    name: Linux Cpulimit Privilege Escalation
    reason: Same GTFOBins sudo-escape family; attackers try several binaries in a row
  - id: linux-find-privilege-escalation-001
    name: Linux Find Privilege Escalation
    reason: Sibling GTFOBins escape tried when one binary is not allowed
  - id: linux-auditd-add-user-001
    name: Linux Auditd Add User
    reason: Backdoor account creation after root
  - id: linux-setuid-using-chmod-utility-001
    name: Linux Setuid Using Chmod Utility
    reason: Setuid shell persistence after root
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: sudo -l enumeration
    query: data_process_exec_process_binary:/.*\/[Ss][Uu][Dd][Oo]/ AND data_process_exec_process_arguments:/.*-[Ll].*/
    pivot_on: host
    window: 4h
  - name: csvtool call executing commands
    query: data_process_exec_process_binary:/.*\/[Cc][Ss][Vv][Tt][Oo][Oo][Ll]/ AND data_process_exec_process_arguments:/.*[Cc][Aa][Ll][Ll].*/
    pivot_on: host
    window: 2h
  - name: Other GTFOBins sudo escapes
    query: data_process_exec_process_binary:/.*\/[Ss][Uu][Dd][Oo]/ AND data_process_exec_process_arguments:/.*(\/bin\/[a-z]*sh|[Ff][Ii][Nn][Dd].*-exec|[Aa][Ww][Kk].*system).*/
    pivot_on: host
    window: 4h
  - name: Credential file access
    query: data_process_exec_process_arguments:/.*(\/etc\/shadow|\/etc\/sudoers|\/etc\/passwd|id_rsa).*/
    pivot_on: host
    window: 4h
  - name: New account or setuid persistence
    query: (data_process_exec_process_binary:/.*(\/[Uu][Ss][Ee][Rr][Aa][Dd][Dd]|\/[Aa][Dd][Dd][Uu][Ss][Ee][Rr])/ OR (data_process_exec_process_binary:/.*\/[Cc][Hh][Mm][Oo][Dd]/ AND data_process_exec_process_arguments:/.*[+]s.*/))
    pivot_on: host
    window: 6h
