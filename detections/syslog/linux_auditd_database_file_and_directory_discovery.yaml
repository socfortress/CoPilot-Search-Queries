name: Linux Auditd Database File And Directory Discovery
id: linux-auditd-database-file-and-directory-discovery-001
version: 1
schema_version: "1.0"
date: "2026-01-28"
author: SOCFortress LLC
status: production
type: Anomaly
description: >
  Detects find or grep commands searching for database files (.db, .sql, .sqlite, .mdb, .accdb) 
  which may indicate reconnaissance or data discovery activity by an attacker attempting to 
  locate sensitive database files for exfiltration.
data_source:
  - Tetragon
  - Linux Auditd
search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - wildcard:
                  full_log: "*find*"
              - wildcard:
                  full_log: "*grep*"
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  full_log: "*.db*"
              - wildcard:
                  full_log: "*.sql*"
              - wildcard:
                  full_log: "*.sqlite*"
              - wildcard:
                  full_log: "*.mdb*"
              - wildcard:
                  full_log: "*.accdb*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - rule_mitre_id
    - rule_description
    - full_log
parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-01-28 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-01-28 23:59:59.999"
how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with Tetragon 
  or auditd process execution logging enabled. Ensure the agent is configured to 
  capture command-line arguments. The index pattern should match your Wazuh index 
  naming convention.
known_false_positives: >
  Database administrators and developers may legitimately search for database files. 
  Backup scripts or monitoring tools may also search for database files. Filter based 
  on user context and frequency.
references:
  - https://attack.mitre.org/techniques/T1083/
response:
  message: >
    Database file discovery activity detected on $agent_name$. 
    Command: $data_process_exec_process_binary$ $data_process_exec_process_arguments$
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 25
  severity: low
  risk_objects:
    - field: agent_name
      type: system
      score: 25
  threat_objects:
    - field: data_process_exec_process_binary
      type: process
tags:
  analytic_story:
    - Linux Living Off The Land
    - Data Exfiltration
    - Compromised Linux Host
  asset_type: Linux
  mitre_attack_id:
    - T1083
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (full_log:/.*find.*/ OR full_log:/.*grep.*/) AND (full_log:/.*\.db.*/ OR full_log:/.*\.sql.*/ OR full_log:/.*\.sqlite.*/ OR full_log:/.*\.mdb.*/ OR full_log:/.*\.accdb.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: f3g4h5i6-7890-1112-1314-151617181920
    name: Linux File Discovery Detection
    reason: Broader file discovery from the same actor usually surrounds targeted database hunting.
  - id: 4d5e6f7a-8b90-2345-6789-01abcdef2345
    name: Linux Credential Discovery
    reason: Attackers hunting databases often also look for credentials to open them.
  - id: linux-sqlite3-privilege-escalation-001
    name: Linux Sqlite3 Privilege Escalation
    reason: Found SQLite files may then be opened or abused with sqlite3.
  - id: linux-mysql-privilege-escalation-001
    name: Linux MySQL Privilege Escalation
    reason: Follow-on abuse of the mysql client once databases are located.
  - id: linux-auditd-data-transfer-size-limits-via-split-001
    name: Linux Auditd Data Transfer Size Limits Via Split
    reason: Located databases are commonly chunked before exfiltration.
  - id: c3d9e7f1-6a2b-4d8f-9c2b-5e6f7a8b9c0d
    name: Linux Suspicious Curl Data Exfiltration
    reason: Data found by discovery is exfiltrated with curl.
  - id: linux-whoami-user-discovery-001
    name: Linux Whoami User Discovery
    reason: Early-stage context discovery by the same actor precedes file hunting.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Database dump and client tools
    query: (data_process_exec_process_binary:/.*(mysqldump|mysql|pg_dump|psql|sqlite3|mongodump).*/) AND NOT _exists_:data_win_system_eventID
    pivot_on: host
    window: 6h
  - name: Archive or copy of found files
    query: (data_process_exec_process_binary:/.*(tar|zip|7z|cp|split).*/) AND NOT _exists_:data_win_system_eventID
    pivot_on: host
    window: 4h
  - name: Other file hunting via find/grep
    query: (data_process_exec_process_binary:/.*(find|grep|locate).*/) AND (data_process_exec_process_arguments:/.*(passw|secret|\.key|\.conf|\.env).*/)
    pivot_on: host
    window: 4h
  - name: Outbound transfer after discovery
    query: (data_process_exec_process_binary:/.*(curl|wget|scp|rsync|nc).*/) AND NOT _exists_:data_win_system_eventID
    pivot_on: host
    window: 6h
