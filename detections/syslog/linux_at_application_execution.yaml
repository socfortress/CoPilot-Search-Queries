name: Linux Auditd At Application Execution
id: linux-auditd-at-application-execution-001
version: 1
schema_version: "1.0"
date: "2026-01-28"
author: SOCFortress LLC
status: production
type: Anomaly
description: >
  Detects the execution of the at daemon (atd) or at command which is used to schedule 
  tasks for one-time execution at a specified time. Adversaries may abuse the at utility 
  to schedule malicious tasks for persistence or delayed execution of payloads to evade 
  detection during active monitoring periods.
data_source:
  - Tetragon
  - Linux Auditd
search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - wildcard:
            full_log: "*atd*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - rule_mitre_id
    - rule_description
    - full_log
parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-01-28 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-01-28 23:59:59.999"
how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with Tetragon 
  or auditd process execution logging enabled. Ensure the agent is configured to 
  capture command-line arguments. The index pattern should match your Wazuh index 
  naming convention.
known_false_positives: >
  System administrators and automation scripts may legitimately use the at command 
  for scheduling one-time tasks. Backup scripts and maintenance jobs may also use 
  at for delayed execution. Correlate with authorized task scheduling activities.
references:
  - https://attack.mitre.org/techniques/T1053/002/
response:
  message: >
    At daemon (atd) execution detected on $agent_name$. 
    Command: $data_process_exec_process_binary$ $data_process_exec_process_arguments$
    The at utility can be used for task scheduling and persistence. MITRE ATT&CK: $rule_mitre_id$
  risk_score: 36
  severity: low
  risk_objects:
    - field: agent_name
      type: system
      score: 36
  threat_objects:
    - field: data_process_exec_process_binary
      type: process
tags:
  analytic_story:
    - Linux Persistence Techniques
    - Scheduled Tasks
    - Compromised Linux Host
  asset_type: Linux
  mitre_attack_id:
    - T1053.002
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: full_log:/.*atd.*/ AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: linux-auditd-at-allow-deny-config-001
    name: Linux Auditd At Allow Deny Config File Modification
    reason: Prior at.allow/deny edits explain how the actor gained at access.
  - id: 6b14bac8-3e3a-4324-8109-42f0546a347f
    name: Scheduled Cron Task/Job - Linux
    reason: Cron scheduling is the sibling mechanism, frequently used together with at.
  - id: linux-edit-cron-table-parameter-001
    name: Linux Edit Cron Table Parameter
    reason: Parallel scheduled-task persistence on the same host.
  - id: linux-service-file-created-in-systemd-directory-001
    name: Linux Service File Created In Systemd Directory
    reason: Additional persistence layered with at jobs.
  - id: 2fade0b6-7423-4835-9d4f-335b39b83867
    name: Shell Execution Of Process Located In Tmp Directory
    reason: at jobs commonly run a payload staged in /tmp.
  - id: ba592c6d-6888-43c3-b8c6-689b8fe47337
    name: Linux Base64 Encoded Pipe to Shell
    reason: at job payloads are often fed base64-encoded commands via a pipe.
  - id: linux-sudo-or-su-execution-001
    name: Linux Sudo Or Su Execution
    reason: Scheduling as root or other users needs sudo/su.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: at / batch scheduling commands
    query: (data_process_exec_process_binary:/.*(\/[Aa][Tt]|\/[Aa][Tt][Dd]|\/[Bb][Aa][Tt][Cc][Hh])/ OR data_process_exec_process_arguments:/.*(\/[Vv][Aa][Rr]\/[Ss][Pp][Oo][Oo][Ll]\/[Cc][Rr][Oo][Nn]\/[Aa][Tt][Jj][Oo][Bb][Ss]|\/[Ee][Tt][Cc]\/[Aa][Tt]\.(allow|deny)).*/)
    pivot_on: host
    window: 4h
  - name: Payload staged and executed from temp
    query: data_process_exec_process_binary:/.*\/(tmp|dev\/shm|var\/tmp)\/.*/
    pivot_on: host
    window: 4h
  - name: Download then execute
    query: (data_process_exec_process_binary:/.*(\/[Cc][Uu][Rr][Ll]|\/[Ww][Gg][Ee][Tt])/ AND data_process_exec_process_arguments:/.*([Hh][Tt][Tt][Pp]).*/)
    pivot_on: host
    window: 4h
  - name: Reverse shell / network tooling
    query: (data_process_exec_process_binary:/.*(\/[Nn][Cc]|\/[Nn][Cc][Aa][Tt]|\/[Nn][Ee][Tt][Cc][Aa][Tt]|\/[Ss][Oo][Cc][Aa][Tt])/ OR data_process_exec_process_arguments:/.*(\/dev\/tcp\/|[Ss][Oo][Cc][Kk][Ee][Tt]|[Pp][Tt][Yy]\.[Ss][Pp][Aa][Ww][Nn]).*/)
    pivot_on: host
    window: 4h
  - name: Other scheduled persistence
    query: (data_process_exec_process_binary:/.*(\/[Cc][Rr][Oo][Nn][Tt][Aa][Bb])/ OR data_process_exec_process_arguments:/.*(\/[Ee][Tt][Cc]\/[Cc][Rr][Oo][Nn]|\/[Vv][Aa][Rr]\/[Ss][Pp][Oo][Oo][Ll]\/[Cc][Rr][Oo][Nn]).*/) OR (data_process_exec_process_arguments:/.*(\/[Ee][Tt][Cc]\/[Ss][Yy][Ss][Tt][Ee][Mm][Dd]\/|\/[Ee][Tt][Cc]\/[Rr][Cc]\.[Ll][Oo][Cc][Aa][Ll]|\/[Ee][Tt][Cc]\/[Pp][Rr][Oo][Ff][Ii][Ll][Ee]|\.[Bb][Aa][Ss][Hh][Rr][Cc]|[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Ee][Dd]_[Kk][Ee][Yy][Ss]).*/)
    pivot_on: host
    window: 24h
