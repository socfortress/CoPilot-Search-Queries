name: Linux Unix Shell Enable All SysRq Functions
id: linux-unix-shell-enable-all-sysrq-functions-001
version: 1
schema_version: "1.0"
date: "2026-02-03"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  Detects interaction with the SysRq kernel interface, including attempts to enable 
  all SysRq functions by writing to /proc/sys/kernel/sysrq. This technique was 
  observed in the AwfulShred malware to enable kernel manipulation capabilities 
  before forcing system reboots or other destructive actions.

data_source:
  - Tetragon
  - Linux Auditd

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - wildcard:
                  full_log: "*/proc/sys/kernel/sysrq*"
              - wildcard:
                  full_log: "*kernel/sysrq*"
              - wildcard:
                  full_log: "*sysrq*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-03 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-03 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with Tetragon 
  or auditd process execution logging enabled. The index pattern should match your 
  Wazuh index naming convention.

known_false_positives: >
  SysRq interface access is uncommon in normal operations. Kernel debugging or 
  system recovery scenarios may legitimately access this interface, but such 
  activity should be verified.

references:
  - https://www.kernel.org/doc/html/latest/admin-guide/sysrq.html
  - https://cert.gov.ua/article/3718487
  - https://attack.mitre.org/techniques/T1059/004/

response:
  message: >
    SysRq kernel interface access detected on $agent_name$. 
    Enabling all SysRq functions can allow kernel manipulation and forced reboots. 
    This is associated with the AwfulShred malware. MITRE ATT&CK: $rule_mitre_id$
  risk_score: 36
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 36
  threat_objects: []

tags:
  analytic_story:
    - AwfulShred
    - Data Destruction
  asset_type: Linux
  mitre_attack_id:
    - T1059.004
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (full_log:/.*\/proc\/sys\/kernel\/sysrq.*/ OR full_log:/.*kernel\/sysrq.*/ OR full_log:/.*sysrq.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: linux-system-reboot-via-sysrq-001
    name: Linux System Reboot Via System Request Key
    reason: 'Direct follow-on: with SysRq enabled the AwfulShred wiper writes to /proc/sysrq-trigger to reboot.'
  - id: linux-auditd-data-destruction-command-001
    name: Linux Auditd Data Destruction Command
    reason: AwfulShred shreds files and logs before the forced reboot.
  - id: linux-dd-file-overwrite-001
    name: Linux DD File Overwrite
    reason: dd overwrite of files or devices is a wiper destruction primitive.
  - id: a3b7c9d2-4f5e-4b6d-8c1a-2d3f4e5b6c7a
    name: Linux Critical Directory Deletion
    reason: Wipers delete system directories before triggering a reboot.
  - id: linux-auditd-ssh-config-keys-deletion-001
    name: Linux Auditd SSH Config Keys Deletion
    reason: AwfulShred removes SSH configuration and keys as part of its destruction.
  - id: 80915f59-9b56-4616-9de0-fd0dea6c12fe
    name: Linux Logs Clearing Attempts
    reason: Log wiping to erase evidence is part of the same destructive sequence.
  - id: 1182f3b3-e716-4efa-99ab-d2685d04360f
    name: History File Deletion
    reason: Shell history deleted alongside wiper activity.
  - id: linux-sudo-or-su-execution-001
    name: Linux Sudo Or Su Execution
    reason: Writing to /proc/sys/kernel/sysrq needs root; shows how privileges were obtained.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Wiper destruction commands
    query: data_process_exec_process_binary:/.*(\/[Ss][Hh][Rr][Ee][Dd]|\/[Dd][Dd]|\/[Rr][Mm]|\/[Ww][Ii][Pp][Ee][Ff][Ss]|\/[Ss][Rr][Mm])/
    pivot_on: host
    window: 2h
  - name: SysRq interface references
    query: data_process_exec_process_arguments:/.*[Ss][Yy][Ss][Rr][Qq].*/
    pivot_on: host
    window: 2h
  - name: Log and history clearing
    query: data_process_exec_process_arguments:/.*(\/[Vv][Aa][Rr]\/[Ll][Oo][Gg]|[Hh][Ii][Ss][Tt][Ff][Ii][Ll][Ee]|\.[Bb][Aa][Ss][Hh]_[Hh][Ii][Ss][Tt][Oo][Rr][Yy]).*/
    pivot_on: host
    window: 2h
  - name: Unmount or remount of filesystems
    query: data_process_exec_process_binary:/.*(\/[Uu][Mm][Oo][Uu][Nn][Tt]|\/[Mm][Oo][Uu][Nn][Tt])/
    pivot_on: host
    window: 2h
  - name: Elevation preceding kernel interface write
    query: data_process_exec_process_binary:/.*(\/[Ss][Uu][Dd][Oo]|\/[Ss][Uu]|\/[Pp][Kk][Ee][Xx][Ee][Cc])/
    pivot_on: user
    window: 1h
