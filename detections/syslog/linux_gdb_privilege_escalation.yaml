name: Linux GDB Privilege Escalation
id: linux-gdb-privilege-escalation-001
version: 1
schema_version: "1.0"
date: "2026-02-04"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  Detects the execution of the GNU Debugger (GDB) with specific flags (-nx, -ex) 
  that indicate an attempt to escalate privileges on a Linux system. The -ex flag 
  with shell escape (!) allows execution of system commands as root, potentially 
  leading to a root shell.

data_source:
  - auth.log
  - Tetragon

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - wildcard:
            full_log: "*gdb*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-04 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-04 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with auth.log 
  monitoring enabled. Tetragon provides additional process execution visibility.

known_false_positives: >
  Developers and security researchers may legitimately use GDB for debugging. 
  However, the combination of -nx and -ex with shell escapes (!) is rarely used 
  legitimately. Filter based on known development environments.

references:
  - https://gtfobins.github.io/gtfobins/gdb/
  - https://attack.mitre.org/techniques/T1548/003/

response:
  message: >
    GDB privilege escalation attempt detected on $agent_name$. 
    The gdb -nx -ex pattern can execute system commands as root. 
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 10
  severity: low
  risk_objects:
    - field: agent_name
      type: system
      score: 10
  threat_objects: []

tags:
  analytic_story:
    - Linux Privilege Escalation
    - Linux Living Off The Land
  asset_type: Linux
  mitre_attack_id:
    - T1548.003
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: full_log:/.*gdb.*/ AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: linux-sudo-or-su-execution-001
    name: Linux Sudo Or Su Execution
    reason: gdb escape needs sudo rights; sudo execution identifies the user and permitted command.
  - id: linux-find-privilege-escalation-001
    name: Linux Find Privilege Escalation
    reason: Sibling GTFOBins sudo abuse, usually tried in the same session when one binary is permitted.
  - id: linux-auditd-possible-access-sudoers-file-001
    name: Linux Auditd Possible Access To Sudoers File
    reason: Sudoers inspection reveals the gdb entry the actor then abused.
  - id: linux-pkexec-privilege-escalation-001
    name: Linux pkexec Privilege Escalation
    reason: Alternate local privilege escalation attempted in the same hands-on session.
  - id: linux-busybox-privilege-escalation-001
    name: Linux BusyBox Privilege Escalation
    reason: Another sudo-allowed GTFOBin tried when probing for any permitted escape.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: gdb launched with batch/escape flags
    query: data_process_exec_process_binary:/.*\/([Gg][Dd][Bb])/ AND data_process_exec_process_arguments:/.*(\-[Nn][Xx]|\-[Ee][Xx]|\-[Bb][Aa][Tt][Cc][Hh]|[Oo][Ss]\.[Ss][Yy][Ss][Tt][Ee][Mm]|[Pp][Yy][Tt][Hh][Oo][Nn]).*/
    pivot_on:
    - host
    window: 2h
  - name: Sudo listing and sudoers recon
    query: (data_process_exec_process_binary:/.*\/([Ss][Uu][Dd][Oo])/ AND data_process_exec_process_arguments:/.*( \-[Ll]|\-[Ll][Ll]|\-\-[Ll][Ii][Ss][Tt]).*/) OR full_log:/.*(\/[Ee][Tt][Cc]\/[Ss][Uu][Dd][Oo][Ee][Rr][Ss]|[Ss][Uu][Dd][Oo][Ee][Rr][Ss]\.[Dd]).*/
    pivot_on:
    - host
    window: 4h
  - name: Debugger attach to running processes (credential theft)
    query: data_process_exec_process_binary:/.*\/([Gg][Dd][Bb]|[Gg][Cc][Oo][Rr][Ee]|[Ss][Tt][Rr][Aa][Cc][Ee]|[Ll][Tt][Rr][Aa][Cc][Ee])/ AND data_process_exec_process_arguments:/.*([Aa][Tt][Tt][Aa][Cc][Hh]|\-[Pp] |\-\-[Pp][Ii][Dd]|[Gg][Cc][Oo][Rr][Ee]|\/[Pp][Rr][Oo][Cc]\/).*/
    pivot_on:
    - host
    window: 4h
  - name: Root actions after escape (accounts, SUID, shadow)
    query: data_process_exec_process_arguments:/.*([Cc][Hh][Mm][Oo][Dd] \+[Ss]|[Cc][Hh][Mm][Oo][Dd] [Uu]\+[Ss]|[Cc][Hh][Mm][Oo][Dd] 4755|\/[Ee][Tt][Cc]\/[Ss][Hh][Aa][Dd][Oo][Ww]|[Uu][Ss][Ee][Rr][Aa][Dd][Dd]|[Uu][Ss][Ee][Rr][Mm][Oo][Dd]|[Aa][Dd][Dd][Uu][Ss][Ee][Rr]|[Vv][Ii][Ss][Uu][Dd][Oo]|[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Ee][Dd]_[Kk][Ee][Yy][Ss]).*/
    pivot_on:
    - host
    window: 4h
  - name: Payload download after elevation
    query: (data_process_exec_process_binary:/.*\/([Cc][Uu][Rr][Ll]|[Ww][Gg][Ee][Tt])/ AND data_process_exec_process_arguments:/.*([Hh][Tt][Tt][Pp]:\/\/|[Hh][Tt][Tt][Pp][Ss]:\/\/|[Ff][Tt][Pp]:\/\/).*/)
    pivot_on:
    - host
    window: 4h
