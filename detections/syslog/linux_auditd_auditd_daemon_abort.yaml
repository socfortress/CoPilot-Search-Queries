name: Linux Auditd Daemon Abort
id: linux-auditd-daemon-abort-001
version: 1
schema_version: "1.0"
date: "2026-01-28"
author: SOCFortress LLC
status: production
type: TTP
description: >
  Detects auditd daemon abort events (type=DAEMON_ABORT) which indicate the audit 
  daemon has been forcefully terminated or crashed. This is a high-severity event 
  as it may indicate an attacker has successfully killed the audit daemon to evade 
  detection, or a critical system failure affecting security monitoring capabilities.
data_source:
  - Linux Auditd
search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - wildcard:
            full_log: "*type=DAEMON_ABORT*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - rule_mitre_id
    - rule_description
    - full_log
parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-01-28 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-01-28 23:59:59.999"
how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with auditd 
  logging enabled. The auditd service must be configured to log daemon events. 
  The index pattern should match your Wazuh index naming convention.
known_false_positives: >
  DAEMON_ABORT events are rare and typically indicate a serious issue. Possible 
  legitimate causes include severe resource exhaustion, kernel panics, or critical 
  system errors. Any occurrence should be investigated thoroughly.
references:
  - https://attack.mitre.org/techniques/T1562/001/
  - https://attack.mitre.org/techniques/T1489/
response:
  message: >
    CRITICAL: Auditd daemon abort event detected on $agent_name$. 
    The audit daemon was forcefully terminated. This may indicate an attacker 
    killing the audit service or a critical system failure. Immediate investigation required. 
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 81
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 81
  threat_objects: []
tags:
  analytic_story:
    - Linux Defense Evasion
    - Audit Log Manipulation
    - Compromised Linux Host
  asset_type: Linux
  mitre_attack_id:
    - T1562.001
    - T1489
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: full_log:/.*type=DAEMON_ABORT.*/ AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: linux-security-monitoring-service-stop-001
    name: Linux Security Monitoring Service Stop
    reason: Attacker stops monitoring services alongside killing auditd
  - id: linux-stop-services-001
    name: Linux Stop Services
    reason: Service stop commands (auditd/rsyslog) preceding the abort
  - id: bed26dea-4525-47f4-b24a-76e30e44ffb0
    name: Audit Rules Deleted Via Auditctl
    reason: Rule deletion is the quieter alternative or companion to killing auditd
  - id: 977ef627-4539-4875-adf4-ed8f780c4922
    name: Auditing Configuration Changes on Linux Host
    reason: Edits to audit.rules/auditd.conf before the abort
  - id: 80915f59-9b56-4616-9de0-fd0dea6c12fe
    name: Linux Logs Clearing Attempts
    reason: Log wiping typically follows once auditing is blind
  - id: linux-auditd-daemon-start-001
    name: Linux Auditd Daemon Start
    reason: Restart after abort shows whether auditing was restored and the gap length
  - id: linux-sudo-or-su-execution-001
    name: Linux Sudo Or Su Execution
    reason: Killing auditd requires root; shows who escalated
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Kill/stop of audit or logging daemons
    query: full_log:/.*(kill|pkill|killall|systemctl|service).*/ AND full_log:/.*(auditd|rsyslog|syslog-ng|journald|wazuh|osqueryd).*/
    pivot_on:
    - host
    window: 2h
  - name: Audit config and rule tampering
    query: full_log:/.*(auditctl|audit\.rules|auditd\.conf|augenrules).*/
    pivot_on:
    - host
    window: 2h
  - name: Log file deletion or truncation
    query: data_process_exec_process_binary:/.*(\/[Rr][Mm]|\/[Ss][Hh][Rr][Ee][Dd]|\/[Tt][Rr][Uu][Nn][Cc][Aa][Tt][Ee]|\/[Uu][Nn][Ll][Ii][Nn][Kk])/ AND full_log:/.*(\/var\/log|bash_history).*/
    pivot_on:
    - host
    window: 4h
  - name: Auditd service and config-change records
    query: full_log:/.*type=(CONFIG_CHANGE|SERVICE_STOP|SERVICE_START|DAEMON_END|DAEMON_START).*/
    pivot_on:
    - host
    window: 2h
  - name: Privileged shell activity during audit gap
    query: data_process_exec_process_binary:/.*(\/[Bb][Aa][Ss][Hh]|\/[Ss][Hh]|\/[Dd][Aa][Ss][Hh]|\/[Zz][Ss][Hh])/ OR data_process_exec_process_binary:/.*(\/[Ss][Uu][Dd][Oo]|\/[Ss][Uu])/
    pivot_on:
    - host
    window: 2h
