name: Linux Auditd Possible Access To Credential Files
id: linux-auditd-possible-access-credential-files-001
version: 1
schema_version: "1.0"
date: "2026-02-04"
author: SOCFortress LLC
status: production
type: Anomaly
description: >
  Detects attempts to access or dump the contents of /etc/passwd and /etc/shadow 
  files on Linux systems. Focuses on processes like 'cat', 'nano', 'vim', and 'vi' 
  accessing these files. This activity may indicate credential dumping, a technique 
  used by adversaries to gain persistence or escalate privileges. Attackers could 
  obtain hashed passwords for offline cracking, leading to unauthorized access.
data_source:
  - Tetragon
  - Linux Auditd
search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - wildcard:
                  full_log: "*shadow*"
              - wildcard:
                  full_log: "*/etc/passwd*"
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  full_log: "*\"/usr/bin/cat\"*"
              - wildcard:
                  full_log: "*\"/usr/bin/nano\"*"
              - wildcard:
                  full_log: "*\"/usr/bin/vim\"*"
              - wildcard:
                  full_log: "*\"/usr/bin/vi\"*"
              - wildcard:
                  full_log: "*\"/usr/bin/less\"*"
              - wildcard:
                  full_log: "*\"/usr/bin/more\"*"
              - wildcard:
                  full_log: "*\"/usr/bin/head\"*"
              - wildcard:
                  full_log: "*\"/usr/bin/tail\"*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location
parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-04 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-04 23:59:59.999"
how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with Tetragon 
  process execution logging enabled. Auditd can provide additional coverage via 
  proctitle events.
known_false_positives: >
  Administrators may access these files for legitimate user management or 
  troubleshooting. Filter based on known administrative users and expected access 
  patterns.
references:
  - https://askubuntu.com/questions/445361/what-is-difference-between-etc-shadow-and-etc-passwd
  - https://attack.mitre.org/techniques/T1003/008/
response:
  message: >
    Credential file access detected on $agent_name$. 
    Access to /etc/passwd or /etc/shadow may indicate credential harvesting. 
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 25
  severity: low
  risk_objects:
    - field: agent_name
      type: system
      score: 25
  threat_objects: []
tags:
  analytic_story:
    - Linux Persistence Techniques
    - Compromised Linux Host
    - China-Nexus Threat Activity
    - Salt Typhoon
    - Linux Privilege Escalation
  asset_type: Linux
  mitre_attack_id:
    - T1003.008
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (full_log:/.*shadow.*/ OR full_log:/.*\/etc\/passwd.*/) AND (full_log:/.*\/usr\/bin\/cat.*/ OR full_log:/.*\/usr\/bin\/nano.*/ OR full_log:/.*\/usr\/bin\/vim.*/ OR full_log:/.*\/usr\/bin\/vi.*/ OR full_log:/.*\/usr\/bin\/less.*/ OR full_log:/.*\/usr\/bin\/more.*/ OR full_log:/.*\/usr\/bin\/head.*/ OR full_log:/.*\/usr\/bin\/tail.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored by the correlation engine for review. Related CoPilot Searches to run
  # around an alert from this rule, scoped to the same host/user/IP within the window.
  related_rules:
    - id: 683e6196-b8e8-11eb-9a79-acde48001122
      name: "Detect Renamed PSExec"
      reason: "same analytic story: China-Nexus Threat Activity"
    - id: 1b7bfb2c-b8e6-11eb-99ac-acde48001122
      name: "Detect Renamed WinRAR"
      reason: "same analytic story: China-Nexus Threat Activity"
    - id: 9be56c82-b1cc-4318-87eb-d138afaaca39
      name: "Malicious PowerShell Process - Execution Policy Bypass"
      reason: "same analytic story: China-Nexus Threat Activity"
    - id: windows-archive-collected-data-via-rar-001
      name: "Windows Archive Collected Data via Rar"
      reason: "same analytic story: Salt Typhoon"
    - id: windows-curl-download-suspicious-path-001
      name: "Windows Curl Download to Suspicious Path"
      reason: "same analytic story: Salt Typhoon"
    - id: windows-malicious-powershell-process-execution-policy-bypass-001
      name: "Windows Malicious PowerShell Process - Execution Policy Bypass"
      reason: "same analytic story: Salt Typhoon"
    - id: windows-powershell-4104-hunting-001
      name: "Windows PowerShell 4104 Hunting"
      reason: "same analytic story: Salt Typhoon"
  window: 1h
  enrichment_searches:
  # Rule-specific telemetry pivots the engine runs around an alert from this rule,
  # scoped to the alert's host/user/IP within the window (behaviour-targeted, not a sweep).
    - name: "Linux process execution on this host (Tetragon / auditd)"
      query: '(data_process_exec_process_binary:/.*(\/[Bb][Aa][Ss][Hh]|\/[Ss][Hh]|\/[Dd][Aa][Ss][Hh]|\/[Zz][Ss][Hh]|\/[Kk][Ss][Hh]|\/[Pp][Yy][Tt][Hh][Oo][Nn]|\/[Pp][Yy][Tt][Hh][Oo][Nn]3|\/[Pp][Ee][Rr][Ll]|\/[Rr][Uu][Bb][Yy]|\/[Pp][Hh][Pp]|\/[Nn][Cc]|\/[Nn][Cc][Aa][Tt]|\/[Ss][Oo][Cc][Aa][Tt]|\/[Cc][Uu][Rr][Ll]|\/[Ww][Gg][Ee][Tt])/ OR data_audit_exe:/.*(\/[Bb][Aa][Ss][Hh]|\/[Ss][Hh]|\/[Dd][Aa][Ss][Hh]|\/[Zz][Ss][Hh]|\/[Kk][Ss][Hh]|\/[Pp][Yy][Tt][Hh][Oo][Nn]|\/[Pp][Yy][Tt][Hh][Oo][Nn]3|\/[Pp][Ee][Rr][Ll]|\/[Rr][Uu][Bb][Yy]|\/[Pp][Hh][Pp]|\/[Nn][Cc]|\/[Nn][Cc][Aa][Tt]|\/[Ss][Oo][Cc][Aa][Tt]|\/[Cc][Uu][Rr][Ll]|\/[Ww][Gg][Ee][Tt])/)'
      pivot_on: [host]
      window: 1h
    - name: "Privilege-escalation tooling on this host"
      query: '(data_process_exec_process_binary:/.*(\/[Ss][Uu][Dd][Oo]|\/[Ss][Uu]|\/[Pp][Kk][Ee][Xx][Ee][Cc]|\/[Dd][Oo][Aa][Ss]|\/[Ss][Ee][Tt][Cc][Aa][Pp])/ OR data_audit_exe:/.*(\/[Ss][Uu][Dd][Oo]|\/[Ss][Uu]|\/[Pp][Kk][Ee][Xx][Ee][Cc]|\/[Dd][Oo][Aa][Ss]|\/[Ss][Ee][Tt][Cc][Aa][Pp])/)'
      pivot_on: [host]
      window: 2h
    - name: "Other events from this source address"
      query: '_exists_:data_srcip'
      pivot_on: [ip]
      window: 6h
    - name: "Credential / secret file access on this host"
      query: '(data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Hh][Aa][Dd][Oo][Ww].*/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Ss][Uu][Dd][Oo][Ee][Rr][Ss].*/ OR data_process_exec_process_arguments:/.*[Ii][Dd]_[Rr][Ss][Aa].*/ OR data_audit_execve_a1:/.*\/[Ee][Tt][Cc]\/[Ss][Hh][Aa][Dd][Oo][Ww].*/)'
      pivot_on: [host]
      window: 2h
