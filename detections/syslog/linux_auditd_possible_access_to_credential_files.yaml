name: Linux Auditd Possible Access To Credential Files
id: linux-auditd-possible-access-credential-files-001
version: 1
schema_version: "1.0"
date: "2026-02-04"
author: SOCFortress LLC
status: production
type: Anomaly
description: >
  Detects attempts to access or dump the contents of /etc/passwd and /etc/shadow 
  files on Linux systems. Focuses on processes like 'cat', 'nano', 'vim', and 'vi' 
  accessing these files. This activity may indicate credential dumping, a technique 
  used by adversaries to gain persistence or escalate privileges. Attackers could 
  obtain hashed passwords for offline cracking, leading to unauthorized access.
data_source:
  - Tetragon
  - Linux Auditd
search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - wildcard:
                  full_log: "*shadow*"
              - wildcard:
                  full_log: "*/etc/passwd*"
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  full_log: "*\"/usr/bin/cat\"*"
              - wildcard:
                  full_log: "*\"/usr/bin/nano\"*"
              - wildcard:
                  full_log: "*\"/usr/bin/vim\"*"
              - wildcard:
                  full_log: "*\"/usr/bin/vi\"*"
              - wildcard:
                  full_log: "*\"/usr/bin/less\"*"
              - wildcard:
                  full_log: "*\"/usr/bin/more\"*"
              - wildcard:
                  full_log: "*\"/usr/bin/head\"*"
              - wildcard:
                  full_log: "*\"/usr/bin/tail\"*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location
parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-04 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-04 23:59:59.999"
how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with Tetragon 
  process execution logging enabled. Auditd can provide additional coverage via 
  proctitle events.
known_false_positives: >
  Administrators may access these files for legitimate user management or 
  troubleshooting. Filter based on known administrative users and expected access 
  patterns.
references:
  - https://askubuntu.com/questions/445361/what-is-difference-between-etc-shadow-and-etc-passwd
  - https://attack.mitre.org/techniques/T1003/008/
response:
  message: >
    Credential file access detected on $agent_name$. 
    Access to /etc/passwd or /etc/shadow may indicate credential harvesting. 
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 25
  severity: low
  risk_objects:
    - field: agent_name
      type: system
      score: 25
  threat_objects: []
tags:
  analytic_story:
    - Linux Persistence Techniques
    - Compromised Linux Host
    - China-Nexus Threat Activity
    - Salt Typhoon
    - Linux Privilege Escalation
  asset_type: Linux
  mitre_attack_id:
    - T1003.008
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (full_log:/.*shadow.*/ OR full_log:/.*\/etc\/passwd.*/) AND (full_log:/.*\/usr\/bin\/cat.*/ OR full_log:/.*\/usr\/bin\/nano.*/ OR full_log:/.*\/usr\/bin\/vim.*/ OR full_log:/.*\/usr\/bin\/vi.*/ OR full_log:/.*\/usr\/bin\/less.*/ OR full_log:/.*\/usr\/bin\/more.*/ OR full_log:/.*\/usr\/bin\/head.*/ OR full_log:/.*\/usr\/bin\/tail.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 4d5e6f7a-8b90-2345-6789-01abcdef2345
    name: Linux Credential Discovery
    reason: Broader credential hunting by the same actor around passwd/shadow.
  - id: 3b4c5d6e-7f80-1234-5678-90abcdef1234
    name: Linux SSH Key Discovery
    reason: Passwd/shadow dumping is commonly paired with SSH key theft.
  - id: linux-sudo-or-su-execution-001
    name: Linux Sudo Or Su Execution
    reason: Reading /etc/shadow requires root; shows how access was gained.
  - id: linux-auditd-add-user-001
    name: Linux Auditd Add User
    reason: Follow-on persistence by adding an account after credential recon.
  - id: linux-whoami-user-discovery-001
    name: Linux Whoami User Discovery
    reason: Precursor user/host discovery before credential dumping.
  - id: linux-ingress-tool-transfer-hunting-001
    name: Linux Ingress Tool Transfer Hunting
    reason: Cracking or exfil tooling may be pulled down after hashes are obtained.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Shadow/passwd copy or archive
    query: full_log:/.*(cp|scp|tar|zip|base64|nc|curl|unshadow).*(\/etc\/shadow|\/etc\/passwd).*/
    pivot_on: host
    window: 2h
  - name: Password cracking tool use
    query: full_log:/.*(john|hashcat|unshadow|hydra).*/
    pivot_on: host
    window: 6h
  - name: Outbound transfer tools
    query: full_log:/.*(curl|wget|scp|ncat|sftp).*/ AND NOT _exists_:data_win_system_eventID
    pivot_on: host
    window: 2h
  - name: Account creation or password change
    query: full_log:/.*(useradd|adduser|usermod|passwd |chpasswd).*/
    pivot_on: host
    window: 4h
