name: Linux Auditd Crontab Directory Files Modification
id: linux-auditd-crontab-directory-files-modification-001
version: 1
schema_version: "1.0"
date: "2026-01-28"
author: SOCFortress LLC
status: production
type: TTP
description: >
  Detects access or modification to cron directories (/etc/cron* and /var/spool/cron/). 
  Adversaries may create or modify files in these directories to establish persistence 
  by scheduling malicious tasks. Cron jobs run with the privileges of the user who 
  owns them, making system-level cron directories particularly valuable targets for 
  establishing persistent root-level access.
data_source:
  - Tetragon
  - Linux Auditd
search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - wildcard:
                  full_log: "*/etc/cron*"
              - wildcard:
                  full_log: "*/var/spool/cron/*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - rule_mitre_id
    - rule_description
    - full_log
parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-01-28 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-01-28 23:59:59.999"
how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with Tetragon 
  or auditd process execution logging enabled. File integrity monitoring (FIM) on 
  cron directories is also recommended. The index pattern should match your Wazuh 
  index naming convention.
known_false_positives: >
  System administrators may legitimately modify cron jobs for maintenance or 
  automation purposes. Package installations and updates may also modify system 
  cron directories. Configuration management tools may trigger this detection 
  during scheduled runs.
references:
  - https://attack.mitre.org/techniques/T1053/003/
response:
  message: >
    Cron directory access or modification detected on $agent_name$. 
    Command: $data_process_exec_process_binary$ $data_process_exec_process_arguments$
    Files in /etc/cron* or /var/spool/cron/ were accessed. MITRE ATT&CK: $rule_mitre_id$
  risk_score: 49
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 49
  threat_objects:
    - field: data_process_exec_process_binary
      type: process
tags:
  analytic_story:
    - Linux Persistence Techniques
    - Scheduled Tasks
    - Compromised Linux Host
  asset_type: Linux
  mitre_attack_id:
    - T1053.003
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (full_log:/.*\/etc\/cron.*/ OR full_log:/.*\/var\/spool\/cron\/.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored by the correlation engine for review. Related CoPilot Searches to run
  # around an alert from this rule, scoped to the same host/user/IP within the window.
  related_rules:
    - id: cb909b3e-512b-11ec-aa31-3e22fbd008af
      name: "Possible Lateral Movement PowerShell Spawn"
      reason: "same analytic story: Scheduled Tasks"
    - id: 12c80db8-ef62-4456-92df-b23e1b3219f6
      name: "Windows Enable Win32 ScheduledJob via Registry"
      reason: "same analytic story: Scheduled Tasks"
    - id: ddf82fcb-e9ee-40e3-8712-a50b5bf323fc
      name: "Windows PowerShell ScheduleTask"
      reason: "same analytic story: Scheduled Tasks"
    - id: windows-scheduled-task-created-public-path-001
      name: "Windows Scheduled Task Created Within Public Path"
      reason: "same analytic story: Scheduled Tasks"
    - id: windows-scheduled-task-created-spawn-shell-001
      name: "Windows Scheduled Task Created to Spawn Shell"
      reason: "same analytic story: Scheduled Tasks"
  window: 1h
  enrichment_searches:
  # Rule-specific telemetry pivots the engine runs around an alert from this rule,
  # scoped to the alert's host/user/IP within the window (behaviour-targeted, not a sweep).
    - name: "Cron scheduling on this host"
      query: '(data_process_exec_process_binary:/.*(\/[Cc][Rr][Oo][Nn][Tt][Aa][Bb])/ OR data_process_exec_process_arguments:/.*\/[Ee][Tt][Cc]\/[Cc][Rr][Oo][Nn].*/)'
      pivot_on: [host]
      window: 4h
    - name: "Shell / interpreter execution on this host"
      query: '(data_process_exec_process_binary:/.*(\/[Bb][Aa][Ss][Hh]|\/[Ss][Hh]|\/[Dd][Aa][Ss][Hh]|\/[Zz][Ss][Hh]|\/[Kk][Ss][Hh]|\/[Aa][Ss][Hh]|\/[Bb][Uu][Ss][Yy][Bb][Oo][Xx])/ OR data_process_exec_process_binary:/.*(\/[Pp][Yy][Tt][Hh][Oo][Nn]|\/[Pp][Yy][Tt][Hh][Oo][Nn]3|\/[Pp][Ee][Rr][Ll]|\/[Rr][Uu][Bb][Yy]|\/[Pp][Hh][Pp]|\/[Nn][Oo][Dd][Ee]|\/[Ll][Uu][Aa]|\/[Aa][Ww][Kk])/)'
      pivot_on: [host]
      window: 1h
    - name: "Reconnaissance commands on this host"
      query: 'data_process_exec_process_binary:/.*(\/[Ww][Hh][Oo][Aa][Mm][Ii]|\/[Ii][Dd]|\/[Uu][Nn][Aa][Mm][Ee]|\/[Hh][Oo][Ss][Tt][Nn][Aa][Mm][Ee]|\/[Hh][Oo][Ss][Tt][Nn][Aa][Mm][Ee][Cc][Tt][Ll]|\/[Ss][Ss]|\/[Nn][Ee][Tt][Ss][Tt][Aa][Tt]|\/[Ii][Ff][Cc][Oo][Nn][Ff][Ii][Gg]|\/[Aa][Rr][Pp]|\/[Ww]|\/[Ww][Hh][Oo]|\/[Ll][Aa][Ss][Tt]|\/[Ll][Ss][Oo][Ff]|\/[Nn][Mm][Aa][Pp]|\/[Dd][Ii][Gg]|\/[Ff][Ii][Nn][Dd])/'
      pivot_on: [host]
      window: 1h
