name: Linux Auditd Crontab Directory Files Modification
id: linux-auditd-crontab-directory-files-modification-001
version: 1
schema_version: "1.0"
date: "2026-01-28"
author: SOCFortress LLC
status: production
type: TTP
description: >
  Detects access or modification to cron directories (/etc/cron* and /var/spool/cron/). 
  Adversaries may create or modify files in these directories to establish persistence 
  by scheduling malicious tasks. Cron jobs run with the privileges of the user who 
  owns them, making system-level cron directories particularly valuable targets for 
  establishing persistent root-level access.
data_source:
  - Tetragon
  - Linux Auditd
search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - wildcard:
                  full_log: "*/etc/cron*"
              - wildcard:
                  full_log: "*/var/spool/cron/*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - rule_mitre_id
    - rule_description
    - full_log
parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-01-28 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-01-28 23:59:59.999"
how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with Tetragon 
  or auditd process execution logging enabled. File integrity monitoring (FIM) on 
  cron directories is also recommended. The index pattern should match your Wazuh 
  index naming convention.
known_false_positives: >
  System administrators may legitimately modify cron jobs for maintenance or 
  automation purposes. Package installations and updates may also modify system 
  cron directories. Configuration management tools may trigger this detection 
  during scheduled runs.
references:
  - https://attack.mitre.org/techniques/T1053/003/
response:
  message: >
    Cron directory access or modification detected on $agent_name$. 
    Command: $data_process_exec_process_binary$ $data_process_exec_process_arguments$
    Files in /etc/cron* or /var/spool/cron/ were accessed. MITRE ATT&CK: $rule_mitre_id$
  risk_score: 49
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 49
  threat_objects:
    - field: data_process_exec_process_binary
      type: process
tags:
  analytic_story:
    - Linux Persistence Techniques
    - Scheduled Tasks
    - Compromised Linux Host
  asset_type: Linux
  mitre_attack_id:
    - T1053.003
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (full_log:/.*\/etc\/cron.*/ OR full_log:/.*\/var\/spool\/cron\/.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: linux-append-cronjob-entry-001
    name: Linux Append Cronjob Entry On Existing Cronjob File
    reason: Appending to an existing cron file is the sibling persistence method.
  - id: linux-edit-cron-table-parameter-001
    name: Linux Edit Cron Table Parameter
    reason: crontab -e/-l edits are the user-level counterpart.
  - id: linux-auditd-crontab-listing-001
    name: Linux Auditd Crontab Listing
    reason: Crontab listing is typical recon before adding jobs.
  - id: 4e2a6c91-7f3d-4b6e-9a4f-1c8b0e5a92d4
    name: Crontab Interactive Edit Execution
    reason: Interactive crontab edit execution indicates job creation.
  - id: 6b14bac8-3e3a-4324-8109-42f0546a347f
    name: Scheduled Cron Task/Job - Linux
    reason: Scheduled cron task creation seen by Tetragon sensors.
  - id: 9f5d1b72-2e3f-4c6d-8a7e-1b2c3d4f5e6b
    name: Linux Cron File Deletion
    reason: Cron file deletion is the cleanup after the job ran.
  - id: cf610c15-ed71-46e1-bdf8-2bd1a99de6c4
    name: Download File To Potentially Suspicious Directory Via Wget
    reason: Cron payloads are usually fetched by wget into suspicious directories.
  - id: a2d9e2f3-0f43-4c7a-bcd9-9acfc0d723aa
    name: Suspicious Download and Execute Pattern via Curl/Wget
    reason: Cron entries commonly download and execute via curl/wget.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Cron entry content with download or shell
    query: full_log:/.*(\/etc\/cron|\/var\/spool\/cron).*/ AND full_log:/.*(curl|wget|bash -c|\/dev\/tcp|base64|nc ).*/
    pivot_on: host
    window: 6h
  - name: Crontab binary execution
    query: (data_process_exec_process_binary:/.*crontab$/ OR full_log:/.*crontab -[elri].*/)
    pivot_on: host
    window: 6h
  - name: Payload staging in tmp directories
    query: full_log:/.*(\/tmp\/|\/dev\/shm\/|\/var\/tmp\/).*(chmod \+x|wget|curl|\.sh).*/
    pivot_on: host
    window: 6h
  - name: Other persistence mechanisms
    query: full_log:/.*(systemd\/system|rc\.local|\/etc\/init\.d|authorized_keys|\.bashrc|ld\.so\.preload).*/
    pivot_on: host
    window: 6h
  - name: Privilege escalation around cron change
    query: full_log:/.*(sudo |su -|chmod [0-7]*[4267][0-7][0-7]).*/
    pivot_on: host
    window: 4h
