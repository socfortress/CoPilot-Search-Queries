name: Linux Cron File Deletion
id: 9f5d1b72-2e3f-4c6d-8a7e-1b2c3d4f5e6b
version: 1
schema_version: "1.0"
date: "2026-01-29"
author: SOCFORTRESS LLC
status: production
type: TTP

description: >
  Detects attempts to delete cron-related files under /etc/cron.* using
  commands like rm, rm -f, or rm -rf. This may indicate malicious
  attempts to remove scheduled tasks or tamper with automated jobs.

data_source:
  - Wazuh Agent Logs
  - Linux Auditd
  - Syslog

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            location: "/var/log/tetragon/tetragon.log"
        - bool:
            should:
              - wildcard:
                  full_log: "*\"/usr/bin/rm\"*/etc/cron.*"
              - wildcard:
                  full_log: "*rm -f*/etc/cron.*"
              - wildcard:
                  full_log: "*rm -rf*/etc/cron.*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - data_process_exec_parent_binary
    - rule_mitre_id
    - rule_description
    - full_log

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-01-28 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-01-28 23:59:59.999"

how_to_implement: >
  Requires Linux endpoints with Wazuh agents capturing process execution
  and command-line arguments. Monitoring deletion of cron files can reveal
  tampering with automated scheduled tasks.

known_false_positives: >
  Legitimate cron file removal or system maintenance by trusted users.

references:
  - https://attack.mitre.org/techniques/T1485/
  - https://tetragon.io/docs/

response:
  message: >
    Deletion of cron files detected on $agent_name$.
    Command: $data_process_exec_process_binary$ $data_process_exec_process_arguments$
    Parent: $data_process_exec_parent_binary$
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 85
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 85
  threat_objects:
    - field: data_process_exec_process_binary
      type: process

tags:
  analytic_story:
    - File Tampering
    - Scheduled Tasks Security
  asset_type: Linux
  mitre_attack_id:
    - T1485
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (full_log:/.*\/usr\/bin\/rm.*\/etc\/cron\..*/ OR full_log:/.*rm -f.*\/etc\/cron\..*/ OR full_log:/.*rm -rf.*\/etc\/cron\..*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c2e234de-03a3-41e1-b39a-1e56dc17ba67
    name: Remove Scheduled Cron Task/Job
    reason: Tetragon view of cron task removal such as crontab -r; same tampering
  - id: linux-auditd-crontab-directory-files-modification-001
    name: Linux Auditd Crontab Directory Files Modification
    reason: 'Cron dir file changes: attacker replaces jobs after deleting originals'
  - id: linux-append-cronjob-entry-001
    name: Linux Append Cronjob Entry On Existing Cronjob File
    reason: Appending a malicious job often follows deleting legitimate ones
  - id: linux-edit-cron-table-parameter-001
    name: Linux Edit Cron Table Parameter
    reason: crontab edit as alternative persistence/tamper
  - id: 4e2a6c91-7f3d-4b6e-9a4f-1c8b0e5a92d4
    name: Crontab Interactive Edit Execution
    reason: Interactive crontab edit near the deletion
  - id: linux-security-monitoring-service-stop-001
    name: Linux Security Monitoring Service Stop
    reason: Removing cron jobs can disable scheduled security/backup tasks, paired with stopping agents
  - id: a3b7c9d2-4f5e-4b6d-8c1a-2d3f4e5b6c7a
    name: Linux Critical Directory Deletion
    reason: Wider destructive rm -rf campaign on same host
  - id: linux-sudo-or-su-execution-001
    name: Linux Sudo Or Su Execution
    reason: Root needed to touch /etc/cron.*; shows the privilege path
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Cron file removal or crontab -r
    query: (data_process_exec_process_binary:/.*\/[Rr][Mm]/ AND data_process_exec_process_arguments:/.*\/etc\/cron.*/) OR (data_process_exec_process_binary:/.*\/[Cc][Rr][Oo][Nn][Tt][Aa][Bb]/ AND data_process_exec_process_arguments:/.*-[Rr].*/)
    pivot_on: host
    window: 6h
  - name: Cron entries written or edited
    query: data_process_exec_process_arguments:/.*(\/etc\/cron\.|\/var\/spool\/cron|\/etc\/crontab).*/ AND NOT data_process_exec_process_binary:/.*\/[Rr][Mm]/
    pivot_on: host
    window: 6h
  - name: Alternative schedulers at/systemd timers
    query: data_process_exec_process_binary:/.*(\/[Aa][Tt]|\/[Bb][Aa][Tt][Cc][Hh])/ OR data_process_exec_process_arguments:/.*(\.timer|\/etc\/systemd\/system).*/
    pivot_on: host
    window: 6h
  - name: Service stop or disable
    query: data_process_exec_process_binary:/.*\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]/ AND data_process_exec_process_arguments:/.*([Ss][Tt][Oo][Pp]|[Dd][Ii][Ss][Aa][Bb][Ll][Ee]|[Mm][Aa][Ss][Kk]).*/
    pivot_on: host
    window: 4h
  - name: Downloads following tamper
    query: data_process_exec_process_binary:/.*(\/[Cc][Uu][Rr][Ll]|\/[Ww][Gg][Ee][Tt])/
    pivot_on: host
    window: 4h
