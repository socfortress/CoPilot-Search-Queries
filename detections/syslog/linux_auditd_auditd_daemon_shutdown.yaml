name: Linux Auditd Daemon Shutdown
id: linux-auditd-daemon-shutdown-001
version: 1
schema_version: "1.0"
date: "2026-01-28"
author: SOCFortress LLC
status: production
type: Anomaly
description: >
  Detects auditd daemon shutdown events (type=DAEMON_END) which indicate the audit 
  daemon has been stopped. While this may occur during legitimate system shutdown 
  or maintenance, unexpected daemon stops could indicate an attacker attempting to 
  disable auditing to evade detection before performing malicious activities.
data_source:
  - Linux Auditd
search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - wildcard:
            full_log: "*type=DAEMON_END*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - rule_mitre_id
    - rule_description
    - full_log
parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-01-28 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-01-28 23:59:59.999"
how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with auditd 
  logging enabled. The auditd service must be configured to log daemon events. 
  The index pattern should match your Wazuh index naming convention.
known_false_positives: >
  System shutdowns, scheduled reboots, and legitimate administrative actions 
  will trigger auditd daemon end events. Correlate with system shutdown times 
  and change management windows to reduce false positives.
references:
  - https://attack.mitre.org/techniques/T1562/001/
response:
  message: >
    Auditd daemon shutdown event detected on $agent_name$. 
    Verify if this was expected due to system shutdown or maintenance. 
    Unexpected stops may indicate an attacker disabling audit logging. MITRE ATT&CK: $rule_mitre_id$
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects: []
tags:
  analytic_story:
    - Linux Defense Evasion
    - Audit Log Manipulation
    - Compromised Linux Host
  asset_type: Linux
  mitre_attack_id:
    - T1562.001
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: full_log:/.*type=DAEMON_END.*/ AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: linux-auditd-daemon-abort-001
    name: Linux Auditd Daemon Abort
    reason: Abnormal termination vs clean DAEMON_END distinguishes kill from stop
  - id: linux-auditd-daemon-start-001
    name: Linux Auditd Daemon Start
    reason: A matching start shows reboot/maintenance; absence means auditing stayed off
  - id: linux-stop-services-001
    name: Linux Stop Services
    reason: systemctl/service stop auditd is the direct cause
  - id: linux-security-monitoring-service-stop-001
    name: Linux Security Monitoring Service Stop
    reason: Other security agents stopped at the same moment
  - id: bed26dea-4525-47f4-b24a-76e30e44ffb0
    name: Audit Rules Deleted Via Auditctl
    reason: Rule removal alongside daemon stop
  - id: linux-system-reboot-via-sysrq-001
    name: Linux System Reboot Via System Request Key
    reason: Distinguishes forced reboot from a targeted stop
  - id: 80915f59-9b56-4616-9de0-fd0dea6c12fe
    name: Linux Logs Clearing Attempts
    reason: Log clearing during the audit gap
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Service stop of auditing/logging
    query: full_log:/.*(systemctl|service|kill|pkill|killall).*/ AND full_log:/.*(auditd|rsyslog|syslog-ng|wazuh-agent|osquery).*/
    pivot_on:
    - host
    window: 2h
  - name: System shutdown/reboot context
    query: full_log:/.*(shutdown|reboot|poweroff|halt|type=SYSTEM_SHUTDOWN|type=SYSTEM_RUNLEVEL|type=SYSTEM_BOOT).*/
    pivot_on:
    - host
    window: 2h
  - name: Audit rule deletion or config change
    query: full_log:/.*(auditctl|audit\.rules|auditd\.conf|type=CONFIG_CHANGE).*/
    pivot_on:
    - host
    window: 2h
  - name: Log deletion in audit gap
    query: data_process_exec_process_binary:/.*(\/[Rr][Mm]|\/[Ss][Hh][Rr][Ee][Dd]|\/[Tt][Rr][Uu][Nn][Cc][Aa][Tt][Ee])/ AND full_log:/.*\/var\/log.*/
    pivot_on:
    - host
    window: 4h
