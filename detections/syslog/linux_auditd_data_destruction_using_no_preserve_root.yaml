name: Linux Auditd Data Destruction Command
id: linux-auditd-data-destruction-command-001
version: 1
schema_version: "1.0"
date: "2026-02-04"
author: SOCFortress LLC
status: production
type: TTP
description: >
  Detects the execution of a Unix shell command designed to wipe root directories 
  on a Linux host. Focuses on the 'rm' command with force recursive deletion and 
  the '--no-preserve-root' option. This activity indicates potential data destruction 
  attempts, often associated with malware like AwfulShred. If confirmed malicious, 
  this behavior could lead to severe data loss, system instability, and compromised 
  integrity of the affected Linux host.
data_source:
  - auth.log
  - Tetragon
  - Linux Auditd
search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - wildcard:
            full_log: "*rm*"
        - wildcard:
            full_log: "*-rf*"
        - wildcard:
            full_log: "*--no-preserve-root*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location
parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-04 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-04 23:59:59.999"
how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with auth.log 
  monitoring and Tetragon process execution logging enabled. The --no-preserve-root 
  flag is the key indicator of malicious intent to bypass rm's safety check for root 
  directory deletion.
known_false_positives: >
  Very rare in legitimate use. The --no-preserve-root flag is almost never used in 
  normal operations and should be treated as highly suspicious. System administrators 
  performing controlled data destruction should be documented.
references:
  - https://cert.gov.ua/article/3718487
  - https://www.trustwave.com/en-us/resources/blogs/spiderlabs-blog/overview-of-the-cyber-weapons-used-in-the-ukraine-russia-war/
  - https://attack.mitre.org/techniques/T1485/
response:
  message: >
    Data destruction command detected on $agent_name$. 
    The rm -rf --no-preserve-root pattern indicates potential system wipe attempt. 
    Associated with AwfulShred malware. MITRE ATT&CK: T1485
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects: []
tags:
  analytic_story:
    - Data Destruction
    - AwfulShred
    - Compromised Linux Host
  asset_type: Linux
  mitre_attack_id:
    - T1485
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: full_log:/.*rm.*/ AND full_log:/.*\-rf.*/ AND full_log:/.*\-\-no-preserve-root.*/ AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a3b7c9d2-4f5e-4b6d-8c1a-2d3f4e5b6c7a
    name: Linux Critical Directory Deletion
    reason: Same wiper behaviour hitting /etc, /boot, /var; confirms scope of destruction.
  - id: linux-dd-file-overwrite-001
    name: Linux DD File Overwrite
    reason: dd overwrite of files or devices is a companion wipe method (AwfulShred uses overwrite routines).
  - id: 80915f59-9b56-4616-9de0-fd0dea6c12fe
    name: Linux Logs Clearing Attempts
    reason: Wipers like AwfulShred clear logs to hide activity before or during destruction.
  - id: 1182f3b3-e716-4efa-99ab-d2685d04360f
    name: History File Deletion
    reason: Shell history wiping accompanies destructive actions to remove operator traces.
  - id: 3fcc9b35-39e4-44c0-a2ad-9e82b6902b31
    name: Syslog Clearing or Removal Via System Utilities
    reason: Removal of syslog files before the wipe blinds investigators.
  - id: de25eeb8-3655-4643-ac3a-b662d3f26b6b
    name: Disable Or Stop Services
    reason: Wipers stop services and databases first to unlock files before destroying them.
  - id: e3a8a052-111f-4606-9aee-f28ebeb76776
    name: Disabling Security Tools
    reason: Security agents are disabled ahead of destruction to avoid interruption.
  - id: linux-auditd-possible-access-credential-files-001
    name: Linux Auditd Possible Access To Credential Files
    reason: Destruction is often preceded by credential harvesting, so the intrusion likely began earlier.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Wipe and overwrite utilities
    query: (data_process_exec_process_binary:/.*(\/[Ss][Hh][Rr][Ee][Dd]|\/[Ww][Ii][Pp][Ee]|\/[Ss][Rr][Mm]|\/[Dd][Dd]|\/[Bb][Ll][Kk][Dd][Ii][Ss][Cc][Aa][Rr][Dd]|\/[Mm][Kk][Ff][Ss]|\/[Ww][Ii][Pp][Ee][Ff][Ss]|\/[Cc][Rr][Yy][Pp][Tt][Ss][Ee][Tt][Uu][Pp])/ OR (data_process_exec_process_arguments:/.*[Oo][Ff]=/[Dd][Ee][Vv]/.*/ OR data_process_exec_process_arguments:/.*/[Dd][Ee][Vv]/[Zz][Ee][Rr][Oo].*/ OR data_process_exec_process_arguments:/.*/[Dd][Ee][Vv]/[Uu][Rr][Aa][Nn][Dd][Oo][Mm].*/))
    pivot_on:
    - host
    window: 2h
  - name: Recursive deletion of system and data paths
    query: (data_process_exec_process_binary:/.*(\/[Rr][Mm]|\/[Ff][Ii][Nn][Dd]|\/[Uu][Nn][Ll][Ii][Nn][Kk])/ AND (data_process_exec_process_arguments:/.*-[Rr][Ff].*/ OR data_process_exec_process_arguments:/.*-[Ff][Rr].*/ OR data_process_exec_process_arguments:/.*--[Nn][Oo]-[Pp][Rr][Ee][Ss][Ee][Rr][Vv][Ee]-[Rr][Oo][Oo][Tt].*/ OR data_process_exec_process_arguments:/.*/[Bb][Oo][Oo][Tt].*/ OR data_process_exec_process_arguments:/.*/[Ee][Tt][Cc].*/ OR data_process_exec_process_arguments:/.*/[Vv][Aa][Rr].*/ OR data_process_exec_process_arguments:/.*/[Hh][Oo][Mm][Ee].*/ OR data_process_exec_process_arguments:/.*-[Dd][Ee][Ll][Ee][Tt][Ee].*/))
    pivot_on:
    - host
    window: 2h
  - name: Log, history and audit trail tampering
    query: (data_process_exec_process_arguments:/.*/[Vv][Aa][Rr]/[Ll][Oo][Gg].*/ OR data_process_exec_process_arguments:/.*.[Bb][Aa][Ss][Hh]_[Hh][Ii][Ss][Tt][Oo][Rr][Yy].*/ OR data_process_exec_process_arguments:/.*[Hh][Ii][Ss][Tt][Oo][Rr][Yy] -[Cc].*/ OR data_process_exec_process_arguments:/.*[Aa][Uu][Dd][Ii][Tt][Cc][Tt][Ll] -[Dd].*/ OR data_process_exec_process_arguments:/.*[Jj][Oo][Uu][Rr][Nn][Aa][Ll][Cc][Tt][Ll] --[Vv][Aa][Cc][Uu][Uu][Mm].*/ OR data_process_exec_process_arguments:/.*[Tt][Rr][Uu][Nn][Cc][Aa][Tt][Ee] -[Ss] 0.*/)
    pivot_on:
    - host
    window: 2h
  - name: Service stop and kill before destruction
    query: (data_process_exec_process_binary:/.*(\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]|\/[Ss][Ee][Rr][Vv][Ii][Cc][Ee]|\/[Kk][Ii][Ll][Ll]|\/[Pp][Kk][Ii][Ll][Ll]|\/[Kk][Ii][Ll][Ll][Aa][Ll][Ll])/ AND (data_process_exec_process_arguments:/.*[Ss][Tt][Oo][Pp].*/ OR data_process_exec_process_arguments:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee].*/ OR data_process_exec_process_arguments:/.*[Mm][Aa][Ss][Kk].*/ OR data_process_exec_process_arguments:/.*-9.*/ OR data_process_exec_process_arguments:/.*[Mm][Yy][Ss][Qq][Ll].*/ OR data_process_exec_process_arguments:/.*[Pp][Oo][Ss][Tt][Gg][Rr][Ee][Ss].*/ OR data_process_exec_process_arguments:/.*[Dd][Oo][Cc][Kk][Ee][Rr].*/ OR data_process_exec_process_arguments:/.*[Aa][Uu][Dd][Ii][Tt][Dd].*/ OR data_process_exec_process_arguments:/.*[Ww][Aa][Zz][Uu][Hh].*/))
    pivot_on:
    - host
    window: 1h
  - name: 'Preceding access: escalation and remote shells'
    query: (data_process_exec_process_binary:/.*(\/[Ss][Uu][Dd][Oo]|\/[Ss][Uu]|\/[Dd][Oo][Aa][Ss]|\/[Pp][Kk][Ee][Xx][Ee][Cc]|\/[Ss][Ss][Hh]|\/[Nn][Cc]|\/[Nn][Cc][Aa][Tt]|\/[Ss][Oo][Cc][Aa][Tt])/ AND _exists_:data_process_exec_process_arguments)
    pivot_on:
    - host
    window: 6h
