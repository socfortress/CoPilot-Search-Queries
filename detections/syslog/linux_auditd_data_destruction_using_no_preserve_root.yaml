name: Linux Auditd Data Destruction Command
id: linux-auditd-data-destruction-command-001
version: 1
schema_version: "1.0"
date: "2026-02-04"
author: SOCFortress LLC
status: production
type: TTP
description: >
  Detects the execution of a Unix shell command designed to wipe root directories 
  on a Linux host. Focuses on the 'rm' command with force recursive deletion and 
  the '--no-preserve-root' option. This activity indicates potential data destruction 
  attempts, often associated with malware like AwfulShred. If confirmed malicious, 
  this behavior could lead to severe data loss, system instability, and compromised 
  integrity of the affected Linux host.
data_source:
  - auth.log
  - Tetragon
  - Linux Auditd
search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - wildcard:
            full_log: "*rm*"
        - wildcard:
            full_log: "*-rf*"
        - wildcard:
            full_log: "*--no-preserve-root*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location
parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-04 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-04 23:59:59.999"
how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with auth.log 
  monitoring and Tetragon process execution logging enabled. The --no-preserve-root 
  flag is the key indicator of malicious intent to bypass rm's safety check for root 
  directory deletion.
known_false_positives: >
  Very rare in legitimate use. The --no-preserve-root flag is almost never used in 
  normal operations and should be treated as highly suspicious. System administrators 
  performing controlled data destruction should be documented.
references:
  - https://cert.gov.ua/article/3718487
  - https://www.trustwave.com/en-us/resources/blogs/spiderlabs-blog/overview-of-the-cyber-weapons-used-in-the-ukraine-russia-war/
  - https://attack.mitre.org/techniques/T1485/
response:
  message: >
    Data destruction command detected on $agent_name$. 
    The rm -rf --no-preserve-root pattern indicates potential system wipe attempt. 
    Associated with AwfulShred malware. MITRE ATT&CK: T1485
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects: []
tags:
  analytic_story:
    - Data Destruction
    - AwfulShred
    - Compromised Linux Host
  asset_type: Linux
  mitre_attack_id:
    - T1485
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: full_log:/.*rm.*/ AND full_log:/.*\-rf.*/ AND full_log:/.*\-\-no-preserve-root.*/ AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a3b7c9d2-4f5e-4b6d-8c1a-2d3f4e5b6c7a
    name: Linux Critical Directory Deletion
    reason: Deletion of critical directories is the broader destructive footprint around rm --no-preserve-root.
  - id: linux-dd-file-overwrite-001
    name: Linux DD File Overwrite
    reason: dd overwrite of files or devices is a companion wiping technique used by AwfulShred-style malware.
  - id: linux-stop-services-001
    name: Linux Stop Services
    reason: Wipers stop services first so data files are not locked.
  - id: linux-security-monitoring-service-stop-001
    name: Linux Security Monitoring Service Stop
    reason: Attackers disable security agents before destruction.
  - id: linux-auditd-osquery-service-stop-001
    name: Linux Auditd Osquery Service Stop
    reason: Telemetry tampering preceding destruction.
  - id: linux-auditd-ssh-config-keys-deletion-001
    name: Linux Auditd SSH Config Keys Deletion
    reason: Deleting SSH keys and config is a lockout step in the same wiper chain.
  - id: 9f5d1b72-2e3f-4c6d-8a7e-1b2c3d4f5e6b
    name: Linux Cron File Deletion
    reason: Removal of cron files is part of broad system destruction.
  - id: 1182f3b3-e716-4efa-99ab-d2685d04360f
    name: History File Deletion
    reason: Anti-forensic history wiping alongside destruction.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: rm recursive/force executions
    query: data_process_exec_process_binary:/.*(\/[Rr][Mm])/ AND data_process_exec_process_arguments:/.*(-[Rr][Ff]|-[Ff][Rr]|--[Rr][Ee][Cc][Uu][Rr][Ss][Ii][Vv][Ee]|--[Ff][Oo][Rr][Cc][Ee]|--[Nn][Oo]-[Pp][Rr][Ee][Ss][Ee][Rr][Vv][Ee]-[Rr][Oo][Oo][Tt]).*/
    pivot_on: host
    window: 1h
  - name: Disk and file overwrite or wipe tools
    query: data_process_exec_process_binary:/.*(\/[Dd][Dd]|\/[Ss][Hh][Rr][Ee][Dd]|\/[Ww][Ii][Pp][Ee]|\/[Ww][Ii][Pp][Ee][Ff][Ss]|\/[Tt][Rr][Uu][Nn][Cc][Aa][Tt][Ee]|\/[Mm][Kk][Ff][Ss])/
    pivot_on: host
    window: 1h
  - name: Service stop or process kill
    query: data_process_exec_process_binary:/.*(\/[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll]|\/[Ss][Ee][Rr][Vv][Ii][Cc][Ee]|\/[Pp][Kk][Ii][Ll][Ll]|\/[Kk][Ii][Ll][Ll][Aa][Ll][Ll])/ AND data_process_exec_process_arguments:/.*([Ss][Tt][Oo][Pp]|[Dd][Ii][Ss][Aa][Bb][Ll][Ee]|-9).*/
    pivot_on: host
    window: 1h
  - name: Reboot or shutdown after destruction
    query: data_process_exec_process_binary:/.*(\/[Rr][Ee][Bb][Oo][Oo][Tt]|\/[Ss][Hh][Uu][Tt][Dd][Oo][Ww][Nn]|\/[Pp][Oo][Ww][Ee][Rr][Oo][Ff][Ff]|\/[Hh][Aa][Ll][Tt])/
    pivot_on: host
    window: 1h
