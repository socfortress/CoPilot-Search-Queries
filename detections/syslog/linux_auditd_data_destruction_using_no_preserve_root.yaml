name: Linux Data Destruction via rm --no-preserve-root
id: a6957eb2-86f2-4aeb-aa1b-8c9340f718d4
version: 1
schema_version: "1.0"
date: "2026-02-04"
author: SOCFortress LLC
status: production
type: TTP
description: >
  Detects the execution of a Unix shell command designed to wipe root directories 
  on a Linux host. Focuses on the 'rm' command with force recursive deletion and 
  the '--no-preserve-root' option. This activity indicates potential data destruction 
  attempts, often associated with malware like AwfulShred. If confirmed malicious, 
  this behavior could lead to severe data loss, system instability, and compromised 
  integrity of the affected Linux host.
data_source:
  - auth.log
  - Tetragon
  - Linux Auditd
search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - wildcard:
            full_log: "*rm*"
        - wildcard:
            full_log: "*-rf*"
        - wildcard:
            full_log: "*--no-preserve-root*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location
parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-04 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-04 23:59:59.999"
how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with auth.log 
  monitoring and Tetragon process execution logging enabled. The --no-preserve-root 
  flag is the key indicator of malicious intent to bypass rm's safety check for root 
  directory deletion.
known_false_positives: >
  Very rare in legitimate use. The --no-preserve-root flag is almost never used in 
  normal operations and should be treated as highly suspicious. System administrators 
  performing controlled data destruction should be documented.
references:
  - https://cert.gov.ua/article/3718487
  - https://www.trustwave.com/en-us/resources/blogs/spiderlabs-blog/overview-of-the-cyber-weapons-used-in-the-ukraine-russia-war/
  - https://attack.mitre.org/techniques/T1485/
response:
  message: >
    Data destruction command detected on $agent_name$. 
    The rm -rf --no-preserve-root pattern indicates potential system wipe attempt. 
    Associated with AwfulShred malware. MITRE ATT&CK: T1485
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects: []
tags:
  analytic_story:
    - Data Destruction
    - AwfulShred
    - Compromised Linux Host
  asset_type: Linux
  mitre_attack_id:
    - T1485
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: full_log:/.*rm.*/ AND full_log:/.*\-rf.*/ AND full_log:/.*\-\-no-preserve-root.*/ AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: linux-auditd-data-destruction-command-001
    name: Linux Auditd Data Destruction Command
    reason: Sibling detection for the same rm -rf --no-preserve-root pattern; the keeper carries the canonical destruction id this one duplicates in behaviour.
  - id: linux-dd-file-overwrite-001
    name: Linux DD File Overwrite
    reason: dd-based overwrite is the alternative wiper primitive on the same host.
  - id: a3b7c9d2-4f5e-4b6d-8c1a-2d3f4e5b6c7a
    name: Linux Critical Directory Deletion
    reason: Recursive deletion of a critical directory is the same objective by a different command form.
  - id: linux-stop-services-001
    name: Linux Stop Services
    reason: Services are stopped to release file locks and disable recovery around the wipe (AwfulShred/Industroyer2).
  - id: 3c7e5d91-8f2b-4e6a-9d4c-5b1f2e7c8a9d
    name: Suspicious SSL Certificate Deletion
    reason: SSL certificate deletion is destructive tampering that accompanies filesystem wiping.
  - id: linux-system-reboot-via-sysrq-001
    name: Linux System Reboot Via System Request Key
    reason: A forced SysRq reboot finalises the destruction by making the host unbootable.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: rm with --no-preserve-root or force-recursive on this host
    query: (full_log:/.*no-preserve-root.*/ OR data_process_exec_process_arguments:/.*--no-preserve-root.*/ OR full_log:/.*rm .*-rf.*\/.*/)
    pivot_on:
    - host
    window: 2h
  - name: Other wiper primitives (dd / shred) on the host
    query: (data_process_exec_process_binary:/.*\/(dd|shred|wipe)/ OR full_log:/.*(dd if=\/dev\/(zero|urandom)|shred ).*/)
    pivot_on:
    - host
    window: 2h
  - name: Service stop and reboot bracketing the wipe
    query: full_log:/.*(systemctl (stop|disable)|service [a-z0-9_-]+ stop|reboot -f|sysrq).*/
    pivot_on:
    - host
    window: 4h
