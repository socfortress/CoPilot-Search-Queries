name: Linux Auditd Data Destruction Command
id: linux-auditd-data-destruction-command-001
version: 1
schema_version: "1.0"
date: "2026-02-04"
author: SOCFortress LLC
status: production
type: TTP
description: >
  Detects the execution of a Unix shell command designed to wipe root directories 
  on a Linux host. Focuses on the 'rm' command with force recursive deletion and 
  the '--no-preserve-root' option. This activity indicates potential data destruction 
  attempts, often associated with malware like AwfulShred. If confirmed malicious, 
  this behavior could lead to severe data loss, system instability, and compromised 
  integrity of the affected Linux host.
data_source:
  - auth.log
  - Tetragon
  - Linux Auditd
search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - wildcard:
            full_log: "*rm*"
        - wildcard:
            full_log: "*-rf*"
        - wildcard:
            full_log: "*--no-preserve-root*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location
parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-04 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-04 23:59:59.999"
how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with auth.log 
  monitoring and Tetragon process execution logging enabled. The --no-preserve-root 
  flag is the key indicator of malicious intent to bypass rm's safety check for root 
  directory deletion.
known_false_positives: >
  Very rare in legitimate use. The --no-preserve-root flag is almost never used in 
  normal operations and should be treated as highly suspicious. System administrators 
  performing controlled data destruction should be documented.
references:
  - https://cert.gov.ua/article/3718487
  - https://www.trustwave.com/en-us/resources/blogs/spiderlabs-blog/overview-of-the-cyber-weapons-used-in-the-ukraine-russia-war/
  - https://attack.mitre.org/techniques/T1485/
response:
  message: >
    Data destruction command detected on $agent_name$. 
    The rm -rf --no-preserve-root pattern indicates potential system wipe attempt. 
    Associated with AwfulShred malware. MITRE ATT&CK: T1485
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects: []
tags:
  analytic_story:
    - Data Destruction
    - AwfulShred
    - Compromised Linux Host
  asset_type: Linux
  mitre_attack_id:
    - T1485
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: full_log:/.*rm.*/ AND full_log:/.*\-rf.*/ AND full_log:/.*\-\-no-preserve-root.*/ AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: linux-dd-file-overwrite-001
    name: Linux DD File Overwrite
    reason: dd overwriting devices/files is the other common wiper primitive used alongside or instead of rm -rf.
  - id: a3b7c9d2-4f5e-4b6d-8c1a-2d3f4e5b6c7a
    name: Linux Critical Directory Deletion
    reason: Destructive actors often delete /boot, /etc or /var piecemeal before or after the root wipe.
  - id: 80915f59-9b56-4616-9de0-fd0dea6c12fe
    name: Linux Logs Clearing Attempts
    reason: Wiper operators clear logs to hinder forensics around the destruction.
  - id: 1182f3b3-e716-4efa-99ab-d2685d04360f
    name: History File Deletion
    reason: Shell history removal is a typical anti-forensic step in AwfulShred-style wipers.
  - id: e3a8a052-111f-4606-9aee-f28ebeb76776
    name: Disabling Security Tools
    reason: Security agents are stopped before destructive actions to avoid interruption.
  - id: a5b977d6-8a81-4475-91b9-49dbfcd941f7
    name: Remove Immutable File Attribute - Auditd
    reason: chattr -i is needed to delete protected files and precedes forced wipes.
  - id: linux-stop-services-001
    name: Linux Stop Services
    reason: Stopping services (databases, backups) precedes destruction so files can be removed.
  - id: linux-sudo-or-su-execution-001
    name: Linux Sudo Or Su Execution
    reason: A root-level wipe requires privilege; shows how the actor obtained it.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other destructive commands (shred, dd, mkfs, wipefs)
    query: (data_process_exec_process_binary:/.*(\/[Ss][Hh][Rr][Ee][Dd]|\/[Dd][Dd]|\/[Mm][Kk][Ff][Ss].*|\/[Ww][Ii][Pp][Ee][Ff][Ss])/) OR (data_process_exec_process_arguments:/.*(\/dev\/zero|\/dev\/urandom).*/)
    pivot_on:
    - host
    window: 4h
  - name: Log and history tampering
    query: data_process_exec_process_arguments:/.*([Rr][Mm] .*(\/var\/log|\.bash_history)|[Hh][Ii][Ss][Tt][Oo][Rr][Yy] -[Cc]|[Tt][Rr][Uu][Nn][Cc][Aa][Tt][Ee].*\/var\/log).*/
    pivot_on:
    - host
    window: 4h
  - name: Service and security agent stop
    query: data_process_exec_process_arguments:/.*([Ss][Yy][Ss][Tt][Ee][Mm][Cc][Tt][Ll] (stop|disable|mask)|[Ss][Ee][Rr][Vv][Ii][Cc][Ee] .* stop|[Pp][Kk][Ii][Ll][Ll]|[Kk][Ii][Ll][Ll][Aa][Ll][Ll]).*/
    pivot_on:
    - host
    window: 4h
  - name: Privilege use and chattr before wipe
    query: data_process_exec_process_binary:/.*(\/[Ss][Uu][Dd][Oo]|\/[Ss][Uu]|\/[Cc][Hh][Aa][Tt][Tt][Rr])/
    pivot_on:
    - host
    - user
    window: 4h
  - name: Interactive remote access preceding the wipe
    query: data_process_exec_process_binary:/.*(\/[Ss][Ss][Hh][Dd]|\/[Ss][Ss][Hh]|\/[Ss][Cc][Pp]|\/[Ss][Ff][Tt][Pp]-[Ss][Ee][Rr][Vv][Ee][Rr])/
    pivot_on:
    - host
    window: 6h
