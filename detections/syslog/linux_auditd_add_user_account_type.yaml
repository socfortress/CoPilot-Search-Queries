name: Linux Auditd Add User
id: linux-auditd-add-user-001
version: 1
schema_version: "1.0"
date: "2026-01-28"
author: SOCFortress LLC
status: production
type: TTP
description: >
  Detects auditd ADD_USER events which indicate a new user account has been created 
  on the system. Adversaries may create local accounts to maintain persistence on 
  compromised systems. This detection captures user creation events directly from 
  the auditd subsystem for comprehensive account monitoring.
data_source:
  - Linux Auditd
search:
  index_pattern: "${INDEX_PATTERN}"
  size: 20
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - wildcard:
            full_log: "*type=ADD_USER*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location
parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-01-28 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-01-28 23:59:59.999"
how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with auditd 
  logging enabled. The auditd service must be configured to log user account 
  events. The index pattern should match your Wazuh index naming convention.
known_false_positives: >
  System administrators creating legitimate user accounts, automated provisioning 
  systems, and configuration management tools (Ansible, Puppet, Chef) may trigger 
  this detection. Correlate with change management records and authorized personnel.
references:
  - https://attack.mitre.org/techniques/T1136/001/
response:
  message: >
    User account creation detected on $agent_name$ via auditd ADD_USER event. 
    Verify if this account creation was authorized and expected. 
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 64
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 64
  threat_objects: []
tags:
  analytic_story:
    - Linux Persistence Techniques
    - Account Manipulation
    - Compromised Linux Host
  asset_type: Linux
  mitre_attack_id:
    - T1136.001
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: full_log:/.*type=ADD_USER.*/ AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: linux-sudo-or-su-execution-001
    name: Linux Sudo Or Su Execution
    reason: useradd needs root; the sudo/su before it identifies who escalated to create the user
  - id: 6a50f16c-3b7b-42d1-b081-0fdd3ba70a73
    name: User Added To Root/Sudoers Group Using Usermod
    reason: 'Classic follow-on: new account promoted into sudo/root group'
  - id: linux-auditd-possible-access-sudoers-file-001
    name: Linux Auditd Possible Access To Sudoers File
    reason: Backdoor accounts often get NOPASSWD sudo via sudoers edit right after creation
  - id: linux-sudoers-tmp-file-creation-001
    name: Linux Sudoers Tmp File Creation
    reason: visudo temp file indicates sudo rights being granted to the new user
  - id: 3b4c5d6e-7f80-1234-5678-90abcdef1234
    name: Linux SSH Key Discovery
    reason: Attacker pairing a new account with SSH keys for remote re-entry
  - id: linux-append-cronjob-entry-001
    name: Linux Append Cronjob Entry On Existing Cronjob File
    reason: Account creation commonly accompanies cron persistence as a redundant foothold
  - id: 08f26069-6f80-474b-8d1f-d971c6fedea0
    name: User Has Been Deleted Via Userdel
    reason: Throwaway accounts are created then deleted to cover tracks
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Account/group management commands
    query: data_process_exec_process_binary:/.*(\/[Uu][Ss][Ee][Rr][Aa][Dd][Dd]|\/[Aa][Dd][Dd][Uu][Ss][Ee][Rr]|\/[Uu][Ss][Ee][Rr][Mm][Oo][Dd]|\/[Gg][Rr][Oo][Uu][Pp][Aa][Dd][Dd]|\/[Gg][Pp][Aa][Ss][Ss][Ww][Dd]|\/[Cc][Hh][Pp][Aa][Ss][Ss][Ww][Dd]|\/[Pp][Aa][Ss][Ss][Ww][Dd]|\/[Nn][Ee][Ww][Uu][Ss][Ee][Rr][Ss]|\/[Uu][Ss][Ee][Rr][Dd][Ee][Ll])/
    pivot_on:
    - host
    window: 2h
  - name: Auditd account lifecycle records
    query: full_log:/.*type=(ADD_USER|ADD_GROUP|USER_MGMT|CHGRP_ID|USER_CHAUTHTOK|DEL_USER|GRP_MGMT).*/
    pivot_on:
    - host
    window: 2h
  - name: Sudoers and passwd/shadow modification
    query: full_log:/.*(\/etc\/sudoers|\/etc\/passwd|\/etc\/shadow|\/etc\/group).*/ AND full_log:/.*(type=PATH|type=SYSCALL|nametype=CREATE|nametype=NORMAL).*/
    pivot_on:
    - host
    window: 2h
  - name: SSH key and remote-access persistence
    query: full_log:/.*(authorized_keys|sshd_config|\.ssh\/).*/
    pivot_on:
    - host
    window: 4h
  - name: Successful login by an account
    query: full_log:/.*type=(USER_LOGIN|USER_START|USER_AUTH|CRED_ACQ).*/ AND full_log:/.*res=success.*/
    pivot_on:
    - host
    window: 24h
