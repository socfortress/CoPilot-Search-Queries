name: Linux Auditd At Allow Deny Config File Modification
id: linux-auditd-at-allow-deny-config-001
version: 1
schema_version: "1.0"
date: "2026-01-28"
author: SOCFortress LLC
status: production
type: TTP
description: >
  Detects access or modification to /etc/at.allow and /etc/at.deny configuration files. 
  These files control which users are permitted to use the at command for task scheduling. 
  Adversaries may modify these files to grant themselves permission to schedule malicious 
  tasks or to restrict legitimate users from using the at utility.
data_source:
  - Tetragon
  - Linux Auditd
search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - wildcard:
                  full_log: "*/etc/at.allow*"
              - wildcard:
                  full_log: "*/etc/at.deny*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - rule_mitre_id
    - rule_description
    - full_log
parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-01-28 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-01-28 23:59:59.999"
how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with Tetragon 
  or auditd process execution logging enabled. File integrity monitoring (FIM) on 
  /etc/at.allow and /etc/at.deny is also recommended. The index pattern should 
  match your Wazuh index naming convention.
known_false_positives: >
  System administrators may legitimately modify these files to manage user access 
  to the at command. Configuration management tools like Ansible, Puppet, or Chef 
  may also modify these files during system provisioning.
references:
  - https://attack.mitre.org/techniques/T1053/002/
response:
  message: >
    Access to at configuration file detected on $agent_name$. 
    Files: /etc/at.allow or /etc/at.deny were accessed or modified.
    This may indicate an attempt to manipulate scheduled task permissions. MITRE ATT&CK: $rule_mitre_id$
  risk_score: 49
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 49
  threat_objects:
    - field: data_process_exec_process_binary
      type: process
tags:
  analytic_story:
    - Linux Persistence Techniques
    - Scheduled Tasks
    - Compromised Linux Host
  asset_type: Linux
  mitre_attack_id:
    - T1053.002
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (full_log:/.*\/etc\/at\.allow.*/ OR full_log:/.*\/etc\/at\.deny.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: linux-auditd-at-application-execution-001
    name: Linux Auditd At Application Execution
    reason: Editing at.allow/at.deny permits or unblocks at; actual at use follows.
  - id: linux-auditd-crontab-directory-files-modification-001
    name: Linux Auditd Crontab Directory Files Modification
    reason: Alternative scheduled-task persistence from the same actor.
  - id: linux-append-cronjob-entry-001
    name: Linux Append Cronjob Entry On Existing Cronjob File
    reason: Parallel cron persistence used when at is restricted.
  - id: linux-service-file-created-in-systemd-directory-001
    name: Linux Service File Created In Systemd Directory
    reason: Another persistent execution mechanism often combined with at.
  - id: linux-sudo-or-su-execution-001
    name: Linux Sudo Or Su Execution
    reason: Writing /etc/at.* needs root; sudo/su precedes the change.
  - id: linux-auditd-add-user-001
    name: Linux Auditd Add User
    reason: at.allow lists users; adding an account then allowing it to use at is a persistence pairing.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Edits to at allow/deny lists
    query: data_process_exec_process_arguments:/.*(\/[Ee][Tt][Cc]\/[Aa][Tt]\.(allow|deny)).*/
    pivot_on: host
    window: 6h
  - name: at / batch scheduling commands
    query: (data_process_exec_process_binary:/.*(\/[Aa][Tt]|\/[Aa][Tt][Dd]|\/[Bb][Aa][Tt][Cc][Hh])/ OR data_process_exec_process_arguments:/.*(\/[Vv][Aa][Rr]\/[Ss][Pp][Oo][Oo][Ll]\/[Cc][Rr][Oo][Nn]\/[Aa][Tt][Jj][Oo][Bb][Ss]|\/[Ee][Tt][Cc]\/[Aa][Tt]\.(allow|deny)).*/)
    pivot_on: host
    window: 6h
  - name: Cron and systemd timer scheduling
    query: (data_process_exec_process_binary:/.*(\/[Cc][Rr][Oo][Nn][Tt][Aa][Bb])/ OR data_process_exec_process_arguments:/.*(\/[Ee][Tt][Cc]\/[Cc][Rr][Oo][Nn]|\/[Vv][Aa][Rr]\/[Ss][Pp][Oo][Oo][Ll]\/[Cc][Rr][Oo][Nn]).*/) OR data_process_exec_process_arguments:/.*(\.[Tt][Ii][Mm][Ee][Rr]).*/
    pivot_on: host
    window: 6h
  - name: Privilege use around the change
    query: data_process_exec_process_binary:/.*(\/[Ss][Uu][Dd][Oo]|\/[Ss][Uu]|\/[Pp][Kk][Ee][Xx][Ee][Cc]|\/[Dd][Oo][Aa][Ss])/
    pivot_on: user
    window: 2h
  - name: Account creation or modification
    query: data_process_exec_process_binary:/.*(\/[Uu][Ss][Ee][Rr][Aa][Dd][Dd]|\/[Aa][Dd][Dd][Uu][Ss][Ee][Rr]|\/[Uu][Ss][Ee][Rr][Mm][Oo][Dd]|\/[Cc][Hh][Pp][Aa][Ss][Ss][Ww][Dd]|\/[Pp][Aa][Ss][Ss][Ww][Dd])/
    pivot_on: host
    window: 6h
