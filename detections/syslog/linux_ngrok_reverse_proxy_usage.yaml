name: Ngrok Usage Detection
id: 6f9a1b42-9c3e-4c6d-bb62-7b8e8e91d2f1
version: 1
schema_version: "1.0"
date: "2026-01-29"
author: SOCFORTRESS LLC
status: production
type: TTP

description: >
  Detects potential usage of ngrok on Linux systems by searching for
  ngrok-related strings in log fields. Ngrok is commonly abused by attackers
  to expose internal services to the internet and establish command-and-control
  tunnels.

data_source:
  - Wazuh Agent Logs
  - Syslog

search:
  index_pattern: "${INDEX_PATTERN}"

  size: 20

  sort:
    - timestamp: desc

  query:
    bool:
      must:
        - bool:
            should:
              - wildcard:
                  full_log: "*ngrok*"
              - wildcard:
                  message: "*ngrok*"
            minimum_should_match: 1

        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"

        - term:
            agent_name: "${AGENT_NAME}"

        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"

      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"

  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"

  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-01-27 00:00:00.000"

  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-01-27 23:59:59.999"

how_to_implement: >
  This detection relies on Wazuh agents collecting application and command
  execution logs on Linux systems. Ensure logging is configured to capture
  process output and application messages.

known_false_positives: >
  Legitimate developer usage of ngrok for testing or debugging purposes.
  Consider allowlisting known developer hosts or users if necessary.

references:
  - https://attack.mitre.org/techniques/T1572/
  - https://ngrok.com/docs

response:
  message: >
    Possible ngrok usage detected on $agent_name$.
    Review logs for unauthorized tunneling activity.
  risk_score: 60
  severity: medium

  risk_objects:
    - field: agent_name
      type: system
      score: 60

  threat_objects:
    - field: full_log
      type: log

tags:
  analytic_story:
    - Command and Control
    - Tunneling Tools
    - ngrok
    - Tunneling
  asset_type: Linux
  mitre_attack_id:
    - T1572
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (full_log:/.*ngrok.*/ OR message:/.*ngrok.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: linux-proxy-socks-curl-001
    name: Linux Proxy Socks Curl
    reason: Curl through a SOCKS proxy is another tunneling/C2 channel often paired with ngrok exposure
  - id: a2d9e2f3-0f43-4c7a-bcd9-9acfc0d723aa
    name: Suspicious Download and Execute Pattern via Curl/Wget
    reason: The ngrok binary is usually fetched with curl/wget and executed; this catches the download-and-execute stage
  - id: cf610c15-ed71-46e1-bdf8-2bd1a99de6c4
    name: Download File To Potentially Suspicious Directory Via Wget
    reason: Wget download of tooling into suspicious directories is how the ngrok binary lands on the host
  - id: 7f734ed0-4f47-46c0-837f-6ee62505abd9
    name: Potential Netcat Reverse Shell Execution
    reason: A netcat reverse shell exposed through a tunnel is a common ngrok use case
  - id: 32e62bc7-3de0-4bb1-90af-532978fe42c0
    name: Python Reverse Shell Execution Via PTY And Socket Modules
    reason: A Python PTY reverse shell is often relayed through a tunnel
  - id: 6b14bac8-3e3a-4324-8109-42f0546a347f
    name: Scheduled Cron Task/Job - Linux
    reason: Cron jobs keep the tunnel running across reboots
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: ngrok execution or token configuration
    query: (data_process_exec_process_binary:/.*\/(ngrok)/ OR data_process_exec_process_arguments:/.*(ngrok|authtoken).*/)
    pivot_on: host
    window: 4h
  - name: ngrok download
    query: (data_process_exec_process_binary:/.*\/(curl|wget)/ AND data_process_exec_process_arguments:/.*(ngrok|equinox\.io).*/)
    pivot_on: host
    window: 4h
  - name: Other tunneling tools
    query: data_process_exec_process_binary:/.*\/(chisel|frpc|frps|socat|cloudflared|ssh|bore|inlets)/
    pivot_on: host
    window: 4h
  - name: Tunnel persistence via cron, systemd or background runners
    query: data_process_exec_process_binary:/.*\/(crontab|systemctl|nohup|screen|tmux)/
    pivot_on: host
    window: 4h
  - name: Local service started for exposure
    query: (data_process_exec_process_binary:/.*\/(python|python3|php|nc|ncat)/ AND data_process_exec_process_arguments:/.*(http\.server|SimpleHTTPServer|-S |-l |-lvp|-lkp).*/)
    pivot_on: host
    window: 2h
