name: Ngrok Usage Detection
id: 6f9a1b42-9c3e-4c6d-bb62-7b8e8e91d2f1
version: 1
schema_version: "1.0"
date: "2026-01-29"
author: SOCFORTRESS LLC
status: production
type: TTP

description: >
  Detects potential usage of ngrok on Linux systems by searching for
  ngrok-related strings in log fields. Ngrok is commonly abused by attackers
  to expose internal services to the internet and establish command-and-control
  tunnels.

data_source:
  - Wazuh Agent Logs
  - Syslog

search:
  index_pattern: "${INDEX_PATTERN}"

  size: 20

  sort:
    - timestamp: desc

  query:
    bool:
      must:
        - bool:
            should:
              - wildcard:
                  full_log: "*ngrok*"
              - wildcard:
                  message: "*ngrok*"
            minimum_should_match: 1

        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"

        - term:
            agent_name: "${AGENT_NAME}"

        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"

      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"

  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"

  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-01-27 00:00:00.000"

  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-01-27 23:59:59.999"

how_to_implement: >
  This detection relies on Wazuh agents collecting application and command
  execution logs on Linux systems. Ensure logging is configured to capture
  process output and application messages.

known_false_positives: >
  Legitimate developer usage of ngrok for testing or debugging purposes.
  Consider allowlisting known developer hosts or users if necessary.

references:
  - https://attack.mitre.org/techniques/T1572/
  - https://ngrok.com/docs

response:
  message: >
    Possible ngrok usage detected on $agent_name$.
    Review logs for unauthorized tunneling activity.
  risk_score: 60
  severity: medium

  risk_objects:
    - field: agent_name
      type: system
      score: 60

  threat_objects:
    - field: full_log
      type: log

tags:
  analytic_story:
    - Command and Control
    - Tunneling Tools
    - ngrok
    - Tunneling
  asset_type: Linux
  mitre_attack_id:
    - T1572
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (full_log:/.*ngrok.*/ OR message:/.*ngrok.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored by the correlation engine for review. Related CoPilot Searches to run
  # around an alert from this rule, scoped to the same host/user/IP within the window.
  related_rules:
    - id: 0a23a62d-c5b3-468b-a072-25064a9a8c87
      name: "Axios NPM Compromise Indicators - Linux"
      reason: "next kill-chain tactic: Command and Control"
  window: 1h
  enrichment_searches:
  # Rule-specific telemetry pivots the engine runs around an alert from this rule,
  # scoped to the alert's host/user/IP within the window (behaviour-targeted, not a sweep).
    - name: "Protocol-tunnelling tooling on this host"
      query: '((data_process_exec_process_binary:/.*(\/[Ss][Ss][Hh]|\/[Ss][Oo][Cc][Aa][Tt]|\/[Nn][Gg][Rr][Oo][Kk]|\/[Cc][Hh][Ii][Ss][Ee][Ll])/) OR (data_process_exec_process_arguments:/.*-[Rr] .*/))'
      pivot_on: [host]
      window: 1h
    - name: "Shell / interpreter execution on this host"
      query: '((data_process_exec_process_binary:/.*(\/[Bb][Aa][Ss][Hh]|\/[Ss][Hh]|\/[Dd][Aa][Ss][Hh]|\/[Zz][Ss][Hh]|\/[Kk][Ss][Hh]|\/[Aa][Ss][Hh]|\/[Bb][Uu][Ss][Yy][Bb][Oo][Xx])/) OR (data_process_exec_process_binary:/.*(\/[Pp][Yy][Tt][Hh][Oo][Nn]|\/[Pp][Yy][Tt][Hh][Oo][Nn]3|\/[Pp][Ee][Rr][Ll]|\/[Rr][Uu][Bb][Yy]|\/[Pp][Hh][Pp]|\/[Nn][Oo][Dd][Ee]|\/[Ll][Uu][Aa]|\/[Aa][Ww][Kk])/))'
      pivot_on: [host]
      window: 1h
    - name: "Reconnaissance commands on this host"
      query: 'data_process_exec_process_binary:/.*(\/[Ww][Hh][Oo][Aa][Mm][Ii]|\/[Ii][Dd]|\/[Uu][Nn][Aa][Mm][Ee]|\/[Hh][Oo][Ss][Tt][Nn][Aa][Mm][Ee]|\/[Hh][Oo][Ss][Tt][Nn][Aa][Mm][Ee][Cc][Tt][Ll]|\/[Ss][Ss]|\/[Nn][Ee][Tt][Ss][Tt][Aa][Tt]|\/[Ii][Ff][Cc][Oo][Nn][Ff][Ii][Gg]|\/[Aa][Rr][Pp]|\/[Ww]|\/[Ww][Hh][Oo]|\/[Ll][Aa][Ss][Tt]|\/[Ll][Ss][Oo][Ff]|\/[Nn][Mm][Aa][Pp]|\/[Dd][Ii][Gg]|\/[Ff][Ii][Nn][Dd])/'
      pivot_on: [host]
      window: 1h
