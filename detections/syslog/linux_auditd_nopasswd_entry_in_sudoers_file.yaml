name: Linux Sudoers File Access
id: a1b2c3d4-5e6f-7a8b-9c0d-e1f2a3b4c5d6
version: 1
schema_version: "1.0"
date: "2026-01-30"
author: SOCFORTRESS LLC
status: production
type: TTP
description: >
  Detects access or modification attempts on sudoers files or lines
  containing NOPASSWD, which may indicate privilege escalation
  or unauthorized sudo configuration changes.
data_source:
  - Linux Auditd
  - Syslog
search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - query_string:
                  default_field: full_log
                  query: "*NOPASSWD*"
              - query_string:
                  default_field: full_log
                  query: "*sudoers*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - data_process_exec_process_binary
    - data_process_exec_process_arguments
    - rule_mitre_id
    - rule_description
    - full_log
parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "socfortress-lab-agent"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-01-29 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-01-29 23:59:59.999"
how_to_implement: >
  Requires Linux endpoints with Wazuh agents capturing process execution
  and command-line arguments. Monitoring sudoers files and NOPASSWD
  entries helps detect unauthorized privilege escalation attempts.
known_false_positives: >
  Legitimate administrative changes to sudoers files by system
  administrators or automated configuration management tools.
references:
  - https://attack.mitre.org/techniques/T1548/
  - https://documentation.wazuh.com/current/user-manual/capabilities/index.html
response:
  message: >
    Sudoers/NOPASSWD file access detected on $agent_name$.
    Command: $data_process_exec_process_binary$ $data_process_exec_process_arguments$
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 60
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 60
  threat_objects:
    - field: data_process_exec_process_binary
      type: process
tags:
  analytic_story:
    - Linux Privilege Escalation
    - Sudoers Monitoring
  asset_type: Linux
  mitre_attack_id:
    - T1548
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (full_log:/.*NOPASSWD.*/ OR full_log:/.*sudoers.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: linux-visudo-utility-execution-001
    name: Linux Visudo Utility Execution
    reason: visudo is the sanctioned sudoers editor; its use shows who edited the policy
  - id: linux-sudoers-tmp-file-creation-001
    name: Linux Sudoers Tmp File Creation
    reason: sudoers.tmp appears during edits, confirming a modification rather than a read
  - id: 0f79c4d2-4e1f-4683-9c36-b5469a665e06
    name: Access of Sudoers File Content
    reason: Reading sudoers content is the recon step before writing a NOPASSWD entry
  - id: linux-auditd-possible-access-sudoers-file-001
    name: Linux Auditd Possible Access To Sudoers File
    reason: Auditd-level file access to sudoers corroborates the same event from the file side
  - id: 6a50f16c-3b7b-42d1-b081-0fdd3ba70a73
    name: User Added To Root/Sudoers Group Using Usermod
    reason: Adding a user to the sudo group via usermod is an alternate path to the same privilege gain
  - id: 759d0d51-bc99-4b5e-9add-8f5b2c8e7512
    name: Creation Of An User Account
    reason: A newly created account granted NOPASSWD sudo is a classic backdoor-user pattern
  - id: linux-sudo-or-su-execution-001
    name: Linux Sudo Or Su Execution
    reason: Subsequent passwordless sudo/su use shows the new entry being exploited
  - id: f74107df-b6c6-4e80-bf00-4170b658162b
    name: Sudo Privilege Escalation CVE-2019-14287
    reason: Sudo exploit attempts are an alternative route if the entry is restricted
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Sudoers edits and sudoers.d writes
    query: (data_process_exec_process_arguments:/.*(\/etc\/sudoers|sudoers\.d|NOPASSWD).*/) AND (data_process_exec_process_binary:/.*\/([Vv][Ii][Ss][Uu][Dd][Oo]|[Tt][Ee][Ee]|[Ss][Ee][Dd]|[Ee][Cc][Hh][Oo]|[Vv][Ii][Mm]?|[Nn][Aa][Nn][Oo]|[Cc][Pp]|[Mm][Vv]|[Pp][Rr][Ii][Nn][Tt][Ff]|[Bb][Aa][Ss][Hh]|[Ss][Hh]).*/)
    pivot_on:
    - host
    window: 2h
  - name: User and group account changes
    query: data_process_exec_process_binary:/.*\/([Uu][Ss][Ee][Rr][Aa][Dd][Dd]|[Aa][Dd][Dd][Uu][Ss][Ee][Rr]|[Uu][Ss][Ee][Rr][Mm][Oo][Dd]|[Gg][Pp][Aa][Ss][Ss][Ww][Dd]|[Cc][Hh][Pp][Aa][Ss][Ss][Ww][Dd]|[Pp][Aa][Ss][Ss][Ww][Dd]).*/
    pivot_on:
    - host
    window: 4h
  - name: Root shells and privileged sudo use
    query: (data_process_exec_process_binary:/.*\/[Ss][Uu][Dd][Oo]/) AND (data_process_exec_process_arguments:/.*(-i|-s|su |\/bin\/(ba)?sh|-u root).*/)
    pivot_on:
    - host
    window: 4h
  - name: SUID or capability changes
    query: (data_process_exec_process_binary:/.*\/([Cc][Hh][Mm][Oo][Dd]|[Ss][Ee][Tt][Cc][Aa][Pp]).*/) AND (data_process_exec_process_arguments:/.*(u\+s|4755|cap_setuid|\+s ).*/)
    pivot_on:
    - host
    window: 4h
  - name: Shadow and root SSH key access after privilege gain
    query: data_process_exec_process_arguments:/.*(\/etc\/shadow|authorized_keys|\/root\/\.ssh).*/
    pivot_on:
    - host
    window: 4h
