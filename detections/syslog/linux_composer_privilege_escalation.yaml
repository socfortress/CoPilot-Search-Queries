name: Linux Composer Privilege Escalation
id: linux-composer-privilege-escalation-001
version: 1
schema_version: "1.0"
date: "2026-02-04"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  Detects the execution of the Composer tool with elevated privileges on a Linux 
  system. Identifies instances where Composer is run with sudo and run-script, 
  allowing the user to execute system commands as root. This GTFOBins technique 
  can indicate an attempt to escalate privileges, potentially leading to unauthorized 
  root access and full system compromise.

data_source:
  - auth.log
  - Tetragon
  - Linux Auditd

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - wildcard:
            full_log: "*composer*"
        - bool:
            should:
              - wildcard:
                  full_log: "*run-script*"
              - wildcard:
                  full_log: "*sudo*"
              - wildcard:
                  full_log: "*72756E2D736372697074*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-04 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-04 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with auth.log 
  monitoring and Tetragon process execution logging enabled. Auditd provides 
  additional USER_CMD visibility with hex-encoded command arguments.

known_false_positives: >
  Developers may use composer with sudo for legitimate package management. However, 
  the run-script command combined with sudo is rarely used legitimately. Filter 
  based on known development environments and expected usage patterns.

references:
  - https://gtfobins.github.io/gtfobins/composer/
  - https://getcomposer.org/doc/00-intro.md
  - https://attack.mitre.org/techniques/T1548/003/

response:
  message: >
    Composer privilege escalation detected on $agent_name$. 
    The sudo composer run-script pattern can execute arbitrary commands as root. 
    MITRE ATT&CK: T1548.003
  risk_score: 10
  severity: low
  risk_objects:
    - field: agent_name
      type: system
      score: 10
  threat_objects: []

tags:
  analytic_story:
    - Linux Privilege Escalation
    - Linux Living Off The Land
  asset_type: Linux
  mitre_attack_id:
    - T1548.003
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: full_log:/.*composer.*/ AND (full_log:/.*run\-script.*/ OR full_log:/.*sudo.*/ OR full_log:/.*72756E2D736372697074.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: linux-sudo-or-su-execution-001
    name: Linux Sudo Or Su Execution
    reason: composer run-script is abused via sudo; sudo records show invoking user and target
  - id: 26f86252-1549-45e1-a212-eb26840e86bc
    name: File Download or Read to Pipe Execution
    reason: composer scripts or payloads are often fetched from the network and run just before
  - id: 2d2f44ff-4611-4778-a8fc-323a0e9850cc
    name: Inline Python Execution - Spawn Shell Via OS System Library
    reason: a script spawning a shell via an OS call is the composer run-script payload path
  - id: linux-setuid-using-chmod-utility-001
    name: Linux Setuid Using Chmod Utility
    reason: root obtained through composer is often followed by setuid persistence
  - id: linux-sudoers-tmp-file-creation-001
    name: Linux Sudoers Tmp File Creation
    reason: root access via composer is commonly locked in by sudoers edits
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Composer run-script execution
    query: data_process_exec_process_binary:/.*\/([Cc][Oo][Mm][Pp][Oo][Ss][Ee][Rr]|[Pp][Hh][Pp])/ AND data_process_exec_process_arguments:/.*([Rr][Uu][Nn]-[Ss][Cc][Rr][Ii][Pp][Tt]|[Ss][Cc][Rr][Ii][Pp][Tt][Ss]).*/
    pivot_on:
    - host
    window: 1h
  - name: Shell spawned under sudo
    query: (data_process_exec_process_binary:/.*\/([Ss][Uu][Dd][Oo]|[Dd][Oo][Aa][Ss]|[Pp][Kk][Ee][Xx][Ee][Cc])/) OR (data_process_exec_process_binary:/.*\/([Bb][Aa][Ss][Hh]|[Ss][Hh]|[Dd][Aa][Ss][Hh]|[Zz][Ss][Hh]|[Aa][Ss][Hh])/ AND data_process_exec_process_arguments:/.*(-[Ii]|-[Pp]|-[Cc]).*/)
    pivot_on:
    - host
    window: 1h
  - name: Tooling downloaded to stage composer.json
    query: data_process_exec_process_binary:/.*\/([Cc][Uu][Rr][Ll]|[Ww][Gg][Ee][Tt]|[Ff][Tt][Pp]|[Tt][Ff][Tt][Pp]|[Nn][Cc]|[Nn][Cc][Aa][Tt]|[Ss][Oo][Cc][Aa][Tt])/
    pivot_on:
    - host
    window: 2h
  - name: SUID/capability changes after escalation
    query: (data_process_exec_process_binary:/.*\/([Cc][Hh][Mm][Oo][Dd]|[Ss][Ee][Tt][Cc][Aa][Pp])/ AND data_process_exec_process_arguments:/.*([+][Ss]|[24]7[0-9][0-9]|[Cc][Aa][Pp]_[Ss][Ee][Tt][Uu][Ii][Dd]).*/)
    pivot_on:
    - host
    window: 4h
