name: Linux Composer Privilege Escalation
id: linux-composer-privilege-escalation-001
version: 1
schema_version: "1.0"
date: "2026-02-04"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  Detects the execution of the Composer tool with elevated privileges on a Linux 
  system. Identifies instances where Composer is run with sudo and run-script, 
  allowing the user to execute system commands as root. This GTFOBins technique 
  can indicate an attempt to escalate privileges, potentially leading to unauthorized 
  root access and full system compromise.

data_source:
  - auth.log
  - Tetragon
  - Linux Auditd

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - wildcard:
            full_log: "*composer*"
        - bool:
            should:
              - wildcard:
                  full_log: "*run-script*"
              - wildcard:
                  full_log: "*sudo*"
              - wildcard:
                  full_log: "*72756E2D736372697074*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-04 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-04 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with auth.log 
  monitoring and Tetragon process execution logging enabled. Auditd provides 
  additional USER_CMD visibility with hex-encoded command arguments.

known_false_positives: >
  Developers may use composer with sudo for legitimate package management. However, 
  the run-script command combined with sudo is rarely used legitimately. Filter 
  based on known development environments and expected usage patterns.

references:
  - https://gtfobins.github.io/gtfobins/composer/
  - https://getcomposer.org/doc/00-intro.md
  - https://attack.mitre.org/techniques/T1548/003/

response:
  message: >
    Composer privilege escalation detected on $agent_name$. 
    The sudo composer run-script pattern can execute arbitrary commands as root. 
    MITRE ATT&CK: T1548.003
  risk_score: 10
  severity: low
  risk_objects:
    - field: agent_name
      type: system
      score: 10
  threat_objects: []

tags:
  analytic_story:
    - Linux Privilege Escalation
    - Linux Living Off The Land
  asset_type: Linux
  mitre_attack_id:
    - T1548.003
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: full_log:/.*composer.*/ AND (full_log:/.*run\-script.*/ OR full_log:/.*sudo.*/ OR full_log:/.*72756E2D736372697074.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored by the correlation engine for review. Related CoPilot Searches to run
  # around an alert from this rule, scoped to the same host/user/IP within the window.
  related_rules:
    - id: 26f86252-1549-45e1-a212-eb26840e86bc
      name: "File Download or Read to Pipe Execution"
      reason: "same analytic story: Linux Living Off The Land"
  window: 1h
  enrichment_searches:
  # Rule-specific telemetry pivots the engine runs around an alert from this rule,
  # scoped to the alert's host/user/IP within the window (behaviour-targeted, not a sweep).
    - name: "Linux process execution on this host (Tetragon / auditd)"
      query: '(data_process_exec_process_binary:/.*(\/[Bb][Aa][Ss][Hh]|\/[Ss][Hh]|\/[Dd][Aa][Ss][Hh]|\/[Zz][Ss][Hh]|\/[Kk][Ss][Hh]|\/[Pp][Yy][Tt][Hh][Oo][Nn]|\/[Pp][Yy][Tt][Hh][Oo][Nn]3|\/[Pp][Ee][Rr][Ll]|\/[Rr][Uu][Bb][Yy]|\/[Pp][Hh][Pp]|\/[Nn][Cc]|\/[Nn][Cc][Aa][Tt]|\/[Ss][Oo][Cc][Aa][Tt]|\/[Cc][Uu][Rr][Ll]|\/[Ww][Gg][Ee][Tt])/ OR data_audit_exe:/.*(\/[Bb][Aa][Ss][Hh]|\/[Ss][Hh]|\/[Dd][Aa][Ss][Hh]|\/[Zz][Ss][Hh]|\/[Kk][Ss][Hh]|\/[Pp][Yy][Tt][Hh][Oo][Nn]|\/[Pp][Yy][Tt][Hh][Oo][Nn]3|\/[Pp][Ee][Rr][Ll]|\/[Rr][Uu][Bb][Yy]|\/[Pp][Hh][Pp]|\/[Nn][Cc]|\/[Nn][Cc][Aa][Tt]|\/[Ss][Oo][Cc][Aa][Tt]|\/[Cc][Uu][Rr][Ll]|\/[Ww][Gg][Ee][Tt])/)'
      pivot_on: [host]
      window: 1h
    - name: "Privilege-escalation tooling on this host"
      query: '(data_process_exec_process_binary:/.*(\/[Ss][Uu][Dd][Oo]|\/[Ss][Uu]|\/[Pp][Kk][Ee][Xx][Ee][Cc]|\/[Dd][Oo][Aa][Ss]|\/[Ss][Ee][Tt][Cc][Aa][Pp])/ OR data_audit_exe:/.*(\/[Ss][Uu][Dd][Oo]|\/[Ss][Uu]|\/[Pp][Kk][Ee][Xx][Ee][Cc]|\/[Dd][Oo][Aa][Ss]|\/[Ss][Ee][Tt][Cc][Aa][Pp])/)'
      pivot_on: [host]
      window: 2h
    - name: "Other events from this source address"
      query: '_exists_:data_srcip'
      pivot_on: [ip]
      window: 6h
