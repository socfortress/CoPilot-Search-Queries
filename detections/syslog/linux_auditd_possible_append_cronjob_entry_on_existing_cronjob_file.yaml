name: Linux Append Cronjob Entry On Existing Cronjob File
id: linux-append-cronjob-entry-001
version: 1
schema_version: "1.0"
date: "2026-02-03"
author: SOCFortress LLC
status: production
type: Hunting
description: >
  Detects potential tampering with cronjob files on a Linux system. Adversaries 
  often modify cron files for persistence or privilege escalation. This detection 
  monitors access to /etc/cron.*, /etc/anacrontab, and cron directories for 
  suspicious activity associated with malware like XorDDos and Kaiji.
data_source:
  - Tetragon
  - Linux Auditd
  - auth.log
search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - wildcard:
                  full_log: "*/etc/cron*"
              - wildcard:
                  full_log: "*/etc/anacrontab*"
              - wildcard:
                  full_log: "*cron.d*"
              - wildcard:
                  full_log: "*cron.daily*"
              - wildcard:
                  full_log: "*cron.hourly*"
              - wildcard:
                  full_log: "*cron.weekly*"
              - wildcard:
                  full_log: "*cron.monthly*"
              - wildcard:
                  full_log: "*crontab*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location
parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-03 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-03 23:59:59.999"
how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with Tetragon 
  or auditd process execution logging enabled. Auth.log monitoring provides sudo 
  command visibility. The index pattern should match your Wazuh index naming convention.
known_false_positives: >
  Legitimate cron job execution is normal system activity. System administration 
  tasks may involve cron file modification. Filter based on known system processes 
  like anacron, cron daemon, and package management tools.
references:
  - https://attack.mitre.org/techniques/T1053/003/
  - https://blog.aquasec.com/threat-alert-kinsing-malware-container-vulnerability
  - https://www.intezer.com/blog/research/kaiji-new-chinese-linux-malware-turning-to-golang/
response:
  message: >
    Cronjob file access detected on $agent_name$. 
    Modification of cron files can enable persistence or scheduled malicious 
    task execution. MITRE ATT&CK: $rule_mitre_id$
  risk_score: 49
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 49
  threat_objects: []
tags:
  analytic_story:
    - XorDDos
    - Linux Living Off The Land
    - Compromised Linux Host
    - Linux Privilege Escalation
    - Scheduled Tasks
    - Linux Persistence Techniques
  asset_type: Linux
  mitre_attack_id:
    - T1053.003
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (full_log:/.*\/etc\/cron.*/ OR full_log:/.*\/etc\/anacrontab.*/ OR full_log:/.*cron\.d.*/ OR full_log:/.*cron\.daily.*/ OR full_log:/.*cron\.hourly.*/ OR full_log:/.*cron\.weekly.*/ OR full_log:/.*cron\.monthly.*/ OR full_log:/.*crontab.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: linux-auditd-crontab-directory-files-modification-001
    name: Linux Auditd Crontab Directory Files Modification
    reason: Same persistence via new files dropped into cron directories.
  - id: linux-edit-cron-table-parameter-001
    name: Linux Edit Cron Table Parameter
    reason: crontab -e style edits are another route to the same modification.
  - id: linux-auditd-crontab-listing-001
    name: Linux Auditd Crontab Listing
    reason: Cron listing is reconnaissance before appending an entry.
  - id: linux-sudo-or-su-execution-001
    name: Linux Sudo Or Su Execution
    reason: System cron files require root; shows privilege used.
  - id: linux-ingress-tool-transfer-hunting-001
    name: Linux Ingress Tool Transfer Hunting
    reason: Cron entry typically runs a payload downloaded to the host.
  - id: linux-service-file-created-in-systemd-directory-001
    name: Linux Service File Created In Systemd Directory
    reason: Alternate persistence often installed alongside cron.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Download-and-run payloads
    query: full_log:/.*(curl|wget).*(\| *(sh|bash)|chmod \+x).*/
    pivot_on: host
    window: 4h
  - name: Cron entries with reverse shell or encoded content
    query: full_log:/.*(cron|crontab).*(bash -i|\/dev\/tcp|nc -e|base64|python -c|perl -e|\/tmp\/|\/dev\/shm).*/
    pivot_on: host
    window: 4h
  - name: Execution from tmp directories
    query: full_log:/.*(\/tmp\/|\/dev\/shm\/|\/var\/tmp\/).*(execve|EXECVE|chmod).*/
    pivot_on: host
    window: 4h
  - name: Other persistence mechanisms
    query: full_log:/.*(\/etc\/systemd\/system|rc\.local|\.bashrc|\/etc\/init\.d|systemctl enable).*/
    pivot_on: host
    window: 6h
