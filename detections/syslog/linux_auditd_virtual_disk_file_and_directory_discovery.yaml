name: Linux Virtual Disk File And Directory Discovery
id: linux-virtual-disk-file-directory-discovery-001
version: 1
schema_version: "1.0"
date: "2026-02-03"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  Detects suspicious discovery of virtual disk files and directories, which may 
  indicate an attacker's attempt to locate and access virtualized storage environments. 
  Virtual disks can contain sensitive data or critical system configurations, and 
  unauthorized discovery attempts could signify preparatory actions for data exfiltration.

data_source:
  - Tetragon
  - Linux Auditd

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - wildcard:
                  full_log: "*find*"
              - wildcard:
                  full_log: "*grep*"
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  full_log: "*.vhd*"
              - wildcard:
                  full_log: "*.vhdx*"
              - wildcard:
                  full_log: "*.vmdk*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-03 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-03 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with Tetragon 
  or auditd process execution logging enabled. The index pattern should match your 
  Wazuh index naming convention.

known_false_positives: >
  Administrators may legitimately search for virtual disk files during backup or 
  migration operations. Filter based on known backup scripts and authorized users.

references:
  - https://attack.mitre.org/techniques/T1083/
  - https://github.com/peass-ng/PEASS-ng/tree/master/linPEAS

response:
  message: >
    Virtual disk file discovery detected on $agent_name$. 
    Searching for .vhd, .vhdx, or .vmdk files may indicate reconnaissance 
    for data exfiltration. MITRE ATT&CK: $rule_mitre_id$
  risk_score: 25
  severity: low
  risk_objects:
    - field: agent_name
      type: system
      score: 25
  threat_objects: []

tags:
  analytic_story:
    - Linux Living Off The Land
    - Linux Privilege Escalation
    - Linux Persistence Techniques
    - Compromised Linux Host
  asset_type: Linux
  mitre_attack_id:
    - T1083
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (full_log:/.*find.*/ OR full_log:/.*grep.*/) AND (full_log:/.*\.vhd.*/ OR full_log:/.*\.vhdx.*/ OR full_log:/.*\.vmdk.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: f3g4h5i6-7890-1112-1314-151617181920
    name: Linux File Discovery Detection
    reason: Generic file discovery from the same actor frames the search for VM disks.
  - id: 8344c0e5-5783-47cc-9cf9-a0f7fd03e6cf
    name: Potential Discovery Activity Using Find - Linux
    reason: Find-based discovery is the mechanism this rule matches; broader hits show the scope.
  - id: linux-auditd-database-file-and-directory-discovery-001
    name: Linux Auditd Database File And Directory Discovery
    reason: Actors hunting VM disks commonly hunt database files in the same pass for high-value data.
  - id: e34cfa0c-0a50-4210-9cb3-5632d08eb041
    name: Potential GobRAT File Discovery Via Grep
    reason: Grep-based file hunting is the same technique targeting other data.
  - id: 5f1573a7-363b-4114-9208-ad7a61de46eb
    name: ESXi VM List Discovery Via ESXCLI
    reason: On hypervisors VM listing precedes locating vmdk files for encryption or theft.
  - id: f41dada5-3f56-4232-8503-3fb7f9cf2d60
    name: ESXi Storage Information Discovery Via ESXCLI
    reason: Datastore enumeration pairs with vmdk discovery in ransomware prep.
  - id: linux-auditd-data-transfer-size-limits-via-split-001
    name: Linux Auditd Data Transfer Size Limits Via Split
    reason: Splitting large disk images is a follow-on to stage them for exfiltration.
  - id: c3d9e7f1-6a2b-4d8f-9c2b-5e6f7a8b9c0d
    name: Linux Suspicious Curl Data Exfiltration
    reason: Curl uploads are a common exfiltration route for located data.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Virtual disk file handling
    query: full_log:/.*(\.vmdk|\.vhdx?|\.qcow2|\.vdi|\.ova|\.ovf).*/
    pivot_on: host
    window: 6h
  - name: Large file archiving or splitting
    query: full_log:/.*(tar -c|zip |7z a|split -b|gzip|pigz|dd if=).*/
    pivot_on: host
    window: 6h
  - name: Hypervisor VM control
    query: full_log:/.*(vim-cmd|esxcli vm|virsh (list|dumpxml|destroy|shutdown)|qemu-img|vboxmanage).*/
    pivot_on: host
    window: 6h
  - name: Outbound transfer of data
    query: full_log:/.*(scp |rsync |curl .*(-T|--upload-file|-F)|wget --post|sftp|rclone).*/
    pivot_on: host
    window: 6h
  - name: Datastore and mount enumeration
    query: full_log:/.*(lsblk|df -h|mount|\/vmfs\/volumes|fdisk -l).*/
    pivot_on: host
    window: 2h
