name: Linux Proxy Socks Curl
id: linux-proxy-socks-curl-001
version: 1
schema_version: "1.0"
date: "2026-02-03"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects the use of curl command with proxy-related arguments such as -x, socks, 
  --preproxy, and --proxy. This activity may indicate an adversary attempting to 
  use a proxy to evade network monitoring and obscure their actions, potentially 
  leading to unauthorized data access or exfiltration.

data_source:
  - Tetragon

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - wildcard:
            full_log: "*curl*"
        - bool:
            should:
              - wildcard:
                  full_log: "*-x *"
              - wildcard:
                  full_log: "*socks*"
              - wildcard:
                  full_log: "*--proxy*"
              - wildcard:
                  full_log: "*--preproxy*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - exists:
            field: data_win_system_eventID
        - wildcard:
            rule_groups: "*windows*"
  _source:
    - timestamp
    - agent_name
    - full_log
    - rule_mitre_id
    - rule_description
    - location

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "Amine"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-03 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-03 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Linux endpoints with Tetragon 
  process execution logging enabled. Ensure the agent is configured to capture 
  command-line arguments. The index pattern should match your Wazuh index naming 
  convention.

known_false_positives: >
  False positives may be present based on legitimate proxy usage internally for 
  development, testing, or corporate proxy requirements. Filter as needed based 
  on authorized proxy configurations.

references:
  - https://attack.mitre.org/techniques/T1090/
  - https://attack.mitre.org/techniques/T1095/
  - https://gtfobins.github.io/gtfobins/curl/
  - https://curl.se/docs/manpage.html

response:
  message: >
    Proxy usage with curl detected on $agent_name$. 
    This may indicate an attempt to evade network monitoring. 
    MITRE ATT&CK: $rule_mitre_id$
  risk_score: 56
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 56
  threat_objects: []

tags:
  analytic_story:
    - Linux Living Off The Land
    - Ingress Tool Transfer
    - Command and Control
  asset_type: Linux
  mitre_attack_id:
    - T1090
    - T1095
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: full_log:/.*curl.*/ AND (full_log:/.*-x .*/ OR full_log:/.*socks.*/ OR full_log:/.*--proxy.*/ OR full_log:/.*--preproxy.*/) AND NOT _exists_:data_win_system_eventID AND NOT rule_groups:/.*windows.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 26f86252-1549-45e1-a212-eb26840e86bc
    name: File Download or Read to Pipe Execution
    reason: Proxied curl is often the fetch stage of a download-and-pipe-to-shell payload delivery.
  - id: ba592c6d-6888-43c3-b8c6-689b8fe47337
    name: Linux Base64 Encoded Pipe to Shell
    reason: Staged payload fetched via proxy is commonly decoded and piped into a shell.
  - id: f7158a64-6204-4d6d-868a-6e6378b467e0
    name: Suspicious C2 Activities
    reason: Proxy-routed curl may be C2 beaconing; this shows other C2 indicators on the host.
  - id: c3d9e7f1-6a2b-4d8f-9c2b-5e6f7a8b9c0d
    name: Linux Suspicious Curl Data Exfiltration
    reason: Proxy use to obscure traffic is typical for curl-based exfiltration that follows.
  - id: cb39d16b-b3b6-4a7a-8222-1cf24b686ffc
    name: Data Exfiltration with Wget
    reason: Same exfil intent through the sibling tool if curl is blocked or swapped.
  - id: a39d7fa7-3fbd-4dc2-97e1-d87f546b1bbc
    name: Program Executions in Suspicious Folders
    reason: Downloaded tooling is then run from tmp/dev/shm style directories.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Curl/wget downloads and uploads
    query: full_log:/.*(curl|wget).*(-o |-O |--output|-T |--upload-file|--data|-F ).*/
    pivot_on: host
    window: 2h
  - name: Tunnelling and proxy tools
    query: full_log:/.*(proxychains|chisel|ssh -D|socat|ncat|frpc|gost).*/
    pivot_on: host
    window: 4h
  - name: Execution from writable dirs
    query: full_log:/.*(\/tmp\/|\/dev\/shm\/|\/var\/tmp\/).*(chmod|\.sh).*/
    pivot_on: host
    window: 2h
  - name: Proxy environment or config set
    query: full_log:/.*(http_proxy|https_proxy|all_proxy|socks5|socks4).*/
    pivot_on: host
    window: 4h
  - name: Pipe to shell after fetch
    query: full_log:/.*(curl|wget).*\|.*(sh|bash).*/
    pivot_on: host
    window: 1h
