name: Remote Thread Creation In Uncommon Target Image
id: a1a144b7-5c9b-4853-a559-2172be8d4a03
version: 1
schema_version: "1.0"
date: "2025-07-04"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: a1a144b7-5c9b-4853-a559-2172be8d4a03
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects uncommon target processes for remote thread creation. MITRE ATT&CK:
  T1055.003.

data_source:
  - Sysmon EventID 8 - CreateRemoteThread

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "8"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetImage:
                    value: "*\\\\calc.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetImage:
                    value: "*\\\\calculator.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetImage:
                    value: "*\\\\mspaint.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetImage:
                    value: "*\\\\notepad.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetImage:
                    value: "*\\\\ping.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetImage:
                    value: "*\\\\sethc.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetImage:
                    value: "*\\\\spoolsv.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetImage:
                    value: "*\\\\wordpad.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetImage:
                    value: "*\\\\write.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_sourceImage"
        - exists:
            field: "data_win_eventdata_targetImage"
        - bool:
            must_not:
              - bool:
                  should:
                    - term:
                        data_win_eventdata_sourceImage:
                          value: "C:\\Windows\\System32\\csrss.exe"
                          case_insensitive: true
                    - bool:
                        must:
                          - bool:
                              should:
                                - term:
                                    data_win_eventdata_sourceImage:
                                      value: "C:\\Windows\\System32\\explorer.exe"
                                      case_insensitive: true
                                - term:
                                    data_win_eventdata_sourceImage:
                                      value: "C:\\Windows\\System32\\OpenWith.exe"
                                      case_insensitive: true
                              minimum_should_match: 1
                          - term:
                              data_win_eventdata_targetImage:
                                value: "C:\\Windows\\System32\\notepad.exe"
                                case_insensitive: true
                    - bool:
                        must:
                          - term:
                              data_win_eventdata_sourceImage:
                                value: "C:\\Windows\\System32\\AtBroker.exe"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_targetImage:
                                value: "C:\\Windows\\System32\\Sethc.exe"
                                case_insensitive: true
                  minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_startFunction"
        - exists:
            field: "data_win_eventdata_sourceImage"
        - exists:
            field: "data_win_eventdata_targetImage"
        - bool:
            must_not:
              - bool:
                  should:
                    - term:
                        data_win_eventdata_startFunction:
                          value: "EtwpNotificationThread"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_sourceImage:
                          value: "*unknown process*"
                          case_insensitive: true
                    - bool:
                        must:
                          - term:
                              data_win_eventdata_sourceImage:
                                value: "C:\\Program Files\\VMware\\VMware Tools\\vmtoolsd.exe"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_startFunction:
                                value: "GetCommandLineW"
                                case_insensitive: true
                          - bool:
                              should:
                                - term:
                                    data_win_eventdata_targetImage:
                                      value: "C:\\Windows\\System32\\notepad.exe"
                                      case_insensitive: true
                                - term:
                                    data_win_eventdata_targetImage:
                                      value: "C:\\Windows\\System32\\spoolsv.exe"
                                      case_insensitive: true
                              minimum_should_match: 1
                    - bool:
                        must:
                          - term:
                              data_win_eventdata_sourceImage:
                                value: "C:\\Program Files\\Xerox\\XeroxPrintExperience\\CommonFiles\\XeroxPrintJobEventManagerService.exe"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_startFunction:
                                value: "LoadLibraryW"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_targetImage:
                                value: "C:\\Windows\\System32\\spoolsv.exe"
                                case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetImage
    - data_win_eventdata_sourceImage
    - data_win_eventdata_startFunction

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 8 (CreateRemoteThread) enabled in the Sysmon
  configuration and the Microsoft-Windows-Sysmon/Operational channel collected
  by the Wazuh agent. The detection looks for events where
  data_win_eventdata_targetImage matches '*\calc.exe';
  data_win_eventdata_targetImage matches '*\calculator.exe';
  data_win_eventdata_targetImage matches '*\mspaint.exe', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://web.archive.org/web/20220319032520/https://blog.redbluepurple.io/offensive-research/bypassing-injection-detection
  - https://attack.mitre.org/techniques/T1055/003/

response:
  message: >
    Remote Thread Creation In Uncommon Target Image detected on host
    $agent_name$. Matched data_win_eventdata_targetImage:
    $data_win_eventdata_targetImage$. Matched data_win_eventdata_sourceImage:
    $data_win_eventdata_sourceImage$. MITRE ATT&CK: T1055.003
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetImage
      type: process
    - field: data_win_eventdata_sourceImage
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1055.003
  custom_tags:
    - thread
    - uncommon
    - target
    - create_remote_thread
    - sysmon
    - privilege_escalation
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"8" AND (data_win_eventdata_targetImage:/.*\\[Cc][Aa][Ll][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetImage:/.*\\[Cc][Aa][Ll][Cc][Uu][Ll][Aa][Tt][Oo][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetImage:/.*\\[Mm][Ss][Pp][Aa][Ii][Nn][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetImage:/.*\\[Nn][Oo][Tt][Ee][Pp][Aa][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetImage:/.*\\[Pp][Ii][Nn][Gg]\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetImage:/.*\\[Ss][Ee][Tt][Hh][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetImage:/.*\\[Ss][Pp][Oo][Oo][Ll][Ss][Vv]\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetImage:/.*\\[Ww][Oo][Rr][Dd][Pp][Aa][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetImage:/.*\\[Ww][Rr][Ii][Tt][Ee]\.[Ee][Xx][Ee]/) AND _exists_:data_win_eventdata_sourceImage AND _exists_:data_win_eventdata_targetImage AND NOT (data_win_eventdata_sourceImage:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Cc][Ss][Rr][Ss][Ss]\.[Ee][Xx][Ee]/ OR ((data_win_eventdata_sourceImage:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_sourceImage:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Oo][Pp][Ee][Nn][Ww][Ii][Tt][Hh]\.[Ee][Xx][Ee]/) AND data_win_eventdata_targetImage:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Nn][Oo][Tt][Ee][Pp][Aa][Dd]\.[Ee][Xx][Ee]/) OR (data_win_eventdata_sourceImage:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Aa][Tt][Bb][Rr][Oo][Kk][Ee][Rr]\.[Ee][Xx][Ee]/ AND data_win_eventdata_targetImage:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ss][Ee][Tt][Hh][Cc]\.[Ee][Xx][Ee]/)) AND _exists_:data_win_eventdata_startFunction AND _exists_:data_win_eventdata_sourceImage AND _exists_:data_win_eventdata_targetImage AND NOT (data_win_eventdata_startFunction:/[Ee][Tt][Ww][Pp][Nn][Oo][Tt][Ii][Ff][Ii][Cc][Aa][Tt][Ii][Oo][Nn][Tt][Hh][Rr][Ee][Aa][Dd]/ OR data_win_eventdata_sourceImage:/.*[Uu][Nn][Kk][Nn][Oo][Ww][Nn] [Pp][Rr][Oo][Cc][Ee][Ss][Ss].*/ OR (data_win_eventdata_sourceImage:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Vv][Mm][Ww][Aa][Rr][Ee]\\[Vv][Mm][Ww][Aa][Rr][Ee] [Tt][Oo][Oo][Ll][Ss]\\[Vv][Mm][Tt][Oo][Oo][Ll][Ss][Dd]\.[Ee][Xx][Ee]/ AND data_win_eventdata_startFunction:/[Gg][Ee][Tt][Cc][Oo][Mm][Mm][Aa][Nn][Dd][Ll][Ii][Nn][Ee][Ww]/ AND (data_win_eventdata_targetImage:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Nn][Oo][Tt][Ee][Pp][Aa][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetImage:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ss][Pp][Oo][Oo][Ll][Ss][Vv]\.[Ee][Xx][Ee]/)) OR (data_win_eventdata_sourceImage:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Xx][Ee][Rr][Oo][Xx]\\[Xx][Ee][Rr][Oo][Xx][Pp][Rr][Ii][Nn][Tt][Ee][Xx][Pp][Ee][Rr][Ii][Ee][Nn][Cc][Ee]\\[Cc][Oo][Mm][Mm][Oo][Nn][Ff][Ii][Ll][Ee][Ss]\\[Xx][Ee][Rr][Oo][Xx][Pp][Rr][Ii][Nn][Tt][Jj][Oo][Bb][Ee][Vv][Ee][Nn][Tt][Mm][Aa][Nn][Aa][Gg][Ee][Rr][Ss][Ee][Rr][Vv][Ii][Cc][Ee]\.[Ee][Xx][Ee]/ AND data_win_eventdata_startFunction:/[Ll][Oo][Aa][Dd][Ll][Ii][Bb][Rr][Aa][Rr][Yy][Ww]/ AND data_win_eventdata_targetImage:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ss][Pp][Oo][Oo][Ll][Ss][Vv]\.[Ee][Xx][Ee]/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 6309645e-122d-4c5b-bb2b-22e4f9c2fa42
    name: HackTool - Potential CobaltStrike Process Injection
    reason: 'Co-occurring, same CreateRemoteThread event: Cobalt Strike''s spawnto/post-exploitation injects beacons into exactly these benign GUI binaries (notepad/calc/mspaint), so the Event 8 that trips this rule frequently also matches CS beacon-injection characteristics and names the C2 framework behind the injection.'
  - id: 85d23b42-9a9d-4f8f-b3d7-d2733c1d58f5
    name: HackTool - HollowReaper Execution
    reason: 'Precursor: HollowReaper is a process-hollowing shellcode launcher that overwrites a legitimate binary''s memory to run payloads under its guise, i.e. it creates the sacrificial benign target that this rule then catches the remote thread being injected into.'
  - id: 02d1d718-dd13-41af-989d-ea85c7fab93f
    name: Rare Remote Thread Creation By Uncommon Source Image
    reason: 'Complementary lens on the same injection: this rule flags it by the benign TARGET image, that rule by the anomalous SOURCE image, so pairing them pins both ends of the CreateRemoteThread (who injected and what was injected into).'
  - id: 99b97608-3e21-4bfe-8217-2a127c396a0e
    name: Remote Thread Creation Via PowerShell In Uncommon Target
    reason: Variant of the identical behaviour fired when the injecting source is PowerShell, so it identifies a fileless PowerShell loader as the source when this rule's sourceImage is powershell.exe.
  - id: 2e4e488a-6164-4811-9ea1-f960c7359c40
    name: HackTool - CACTUSTORCH Remote Thread Creation
    reason: 'Same technique via a known toolkit: CACTUSTORCH (JS/VBScript to .NET shellcode) injects via CreateRemoteThread and produces this exact Event 8 telemetry, so a hit names the delivery/injection framework behind the alert.'
  - id: 994cac2b-92c2-44bf-8853-14f6ca39fbda
    name: Potential Bumblebee Remote Thread Creation
    reason: 'Precursor loader: Bumblebee (a frequent Cobalt Strike deliverer) performs remote-thread injection as its post-exploitation step, so it tends to be the loader that produced this injection into a sacrificial process.'
  - id: f239b326-2f41-4d6b-9dfa-c846a60ef505
    name: Password Dumper Remote Thread in LSASS
    reason: 'Follow-on objective: once code is concealed inside a trusted process, operators commonly redirect the same remote-thread primitive at lsass.exe to steal credentials, the same Event 8 injection aimed at the next kill-chain goal (T1003.001).'
  - id: d5601f8c-b26f-4ab0-9035-69e11a8d4ad2
    name: CobaltStrike Named Pipe
    reason: 'Co-occurring C2 artifact: a beacon injected into the sacrificial process opens Cobalt Strike-style named pipes (postex_/msagent_/status_) for its command channel, confirming on the same host that the injected code is a live CS beacon.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Injected benign/GUI process beaconing out (network connection from a non-networking image)
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Nn][Oo][Tt][Ee][Pp][Aa][Dd]|[Cc][Aa][Ll][Cc]|[Cc][Aa][Ll][Cc][Uu][Ll][Aa][Tt][Oo][Rr]|[Mm][Ss][Pp][Aa][Ii][Nn][Tt]|[Ww][Oo][Rr][Dd][Pp][Aa][Dd]|[Ww][Rr][Ii][Tt][Ee]|[Ss][Ee][Tt][Hh][Cc])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 4h
  - name: Remote-thread or handle access into LSASS on this host (credential-theft pivot)
    query: (data_win_system_eventID:"8" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: Sacrificial GUI process spawned by a script host or LOLBin loader
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Nn][Oo][Tt][Ee][Pp][Aa][Dd]|[Cc][Aa][Ll][Cc]|[Cc][Aa][Ll][Cc][Uu][Ll][Aa][Tt][Oo][Rr]|[Mm][Ss][Pp][Aa][Ii][Nn][Tt]|[Ww][Oo][Rr][Dd][Pp][Aa][Dd]|[Ww][Rr][Ii][Tt][Ee]|[Ss][Ee][Tt][Hh][Cc])\.[Ee][Xx][Ee]/ AND data_win_eventdata_parentImage:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Mm][Ss][Hh][Tt][Aa]|[Rr][Uu][Nn][Dd][Ll][Ll]32|[Rr][Ee][Gg][Ss][Vv][Rr]32|[Cc][Mm][Dd])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: Cobalt Strike malleable named-pipe C2 on this host
    query: (data_win_system_eventID:"17" OR data_win_system_eventID:"18") AND (data_win_eventdata_pipeName:/\\[Pp][Oo][Ss][Tt][Ee][Xx]_.*/ OR data_win_eventdata_pipeName:/\\[Mm][Ss][Aa][Gg][Ee][Nn][Tt]_.*/ OR data_win_eventdata_pipeName:/\\[Ss][Tt][Aa][Tt][Uu][Ss]_.*/ OR data_win_eventdata_pipeName:/\\[Mm][Ss][Ss][Ee]-.*/ OR data_win_eventdata_pipeName:/\\[Ii][Nn][Tt][Ee][Rr][Pp][Rr][Oo][Cc][Ee][Ss][Ss]_.*/)
    pivot_on:
    - host
    window: 2h
  - name: Injection-API tradecraft in command lines or script blocks on this host
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Vv][Ii][Rr][Tt][Uu][Aa][Ll][Aa][Ll][Ll][Oo][Cc][Ee][Xx].*/ OR data_win_eventdata_commandLine:/.*[Ww][Rr][Ii][Tt][Ee][Pp][Rr][Oo][Cc][Ee][Ss][Ss][Mm][Ee][Mm][Oo][Rr][Yy].*/ OR data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee][Rr][Ee][Mm][Oo][Tt][Ee][Tt][Hh][Rr][Ee][Aa][Dd].*/ OR data_win_eventdata_commandLine:/.*[Qq][Uu][Ee][Uu][Ee][Uu][Ss][Ee][Rr][Aa][Pp][Cc].*/)) OR (data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Vv][Ii][Rr][Tt][Uu][Aa][Ll][Aa][Ll][Ll][Oo][Cc].*/ OR data_win_eventdata_scriptBlockText:/.*[Ww][Rr][Ii][Tt][Ee][Pp][Rr][Oo][Cc][Ee][Ss][Ss][Mm][Ee][Mm][Oo][Rr][Yy].*/ OR data_win_eventdata_scriptBlockText:/.*[Cc][Rr][Ee][Aa][Tt][Ee][Rr][Ee][Mm][Oo][Tt][Ee][Tt][Hh][Rr][Ee][Aa][Dd].*/))
    pivot_on:
    - host
    window: 1h
