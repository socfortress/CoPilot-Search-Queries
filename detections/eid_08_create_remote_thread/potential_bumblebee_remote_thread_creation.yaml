name: Potential Bumblebee Remote Thread Creation
id: 994cac2b-92c2-44bf-8853-14f6ca39fbda
version: 1
schema_version: "1.0"
date: "2022-09-27"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 994cac2b-92c2-44bf-8853-14f6ca39fbda
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects remote thread injection events based on action seen used by bumblebee.
  MITRE ATT&CK: T1218.011, T1059.001.

data_source:
  - Sysmon EventID 8 - CreateRemoteThread

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "8"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_sourceImage:
                    value: "*\\\\wabmig.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_sourceImage:
                    value: "*\\\\wab.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_sourceImage:
                    value: "*\\\\ImagingDevices.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_targetImage:
              value: "*\\\\rundll32.exe"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_sourceImage
    - data_win_eventdata_targetImage

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 8 (CreateRemoteThread) enabled in the Sysmon
  configuration and the Microsoft-Windows-Sysmon/Operational channel collected
  by the Wazuh agent. The detection looks for events where
  data_win_eventdata_sourceImage matches '*\wabmig.exe';
  data_win_eventdata_sourceImage matches '*\wab.exe';
  data_win_eventdata_sourceImage matches '*\ImagingDevices.exe', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://thedfirreport.com/2022/09/26/bumblebee-round-two/
  - https://attack.mitre.org/techniques/T1218/011/
  - https://attack.mitre.org/techniques/T1059/001/

response:
  message: >
    Potential Bumblebee Remote Thread Creation detected on host $agent_name$.
    Matched data_win_eventdata_sourceImage: $data_win_eventdata_sourceImage$.
    Matched data_win_eventdata_targetImage: $data_win_eventdata_targetImage$.
    MITRE ATT&CK: T1218.011, T1059.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_sourceImage
      type: process
    - field: data_win_eventdata_targetImage
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218.011
    - T1059.001
  custom_tags:
    - bumblebee
    - thread
    - create_remote_thread
    - sysmon
    - execution
    - stealth
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"8" AND (data_win_eventdata_sourceImage:/.*\\[Ww][Aa][Bb][Mm][Ii][Gg]\.[Ee][Xx][Ee]/ OR data_win_eventdata_sourceImage:/.*\\[Ww][Aa][Bb]\.[Ee][Xx][Ee]/ OR data_win_eventdata_sourceImage:/.*\\[Ii][Mm][Aa][Gg][Ii][Nn][Gg][Dd][Ee][Vv][Ii][Cc][Ee][Ss]\.[Ee][Xx][Ee]/) AND data_win_eventdata_targetImage:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: fc014922-5def-4da9-a0fc-28c973f41bfb
    name: Execution DLL of Choice Using WAB.EXE
    reason: 'Precursor: a non-default DLL written to HKCU Software\Microsoft\WAB\DLLPath makes wab.exe side-load Bumblebee''s payload - the exact mechanism that plants the attacker code inside the wab.exe/wabmig.exe that then issues this CreateRemoteThread into rundll32.'
  - id: 395907ee-96e5-4666-af2e-2ca91688e151
    name: Wab Execution From Non Default Location
    reason: 'Precursor/co-occurring: the hijacked wab.exe/wabmig.exe (this rule''s injecting source image) running from an unusual path - the same Bumblebee loader stage that launches the remote-thread injection.'
  - id: 63d1ccc0-2a43-4f4b-9289-361b308991ff
    name: Wab/Wabmig Unusual Parent Or Child Processes
    reason: 'Co-occurring: wab.exe/wabmig.exe spawned by svchost/WmiPrvSE/dllhost (the Bumblebee loader) - the same compromised source process that performs this CreateRemoteThread.'
  - id: f11f2808-adb4-46c0-802a-8660db50fa99
    name: ImagingDevices Unusual Parent/Child Processes
    reason: 'Co-occurring: abnormal parent/child of ImagingDevices.exe, the third Bumblebee host binary this rule watches as an injection source image.'
  - id: 6309645e-122d-4c5b-bb2b-22e4f9c2fa42
    name: HackTool - Potential CobaltStrike Process Injection
    reason: 'Same EID 8 technique, next beat: the Cobalt Strike beacon''s own CreateRemoteThread (recognisable 0B80/0C7C/0C88 start addresses) - the payload Bumblebee delivers through exactly this injection.'
  - id: ae9c6a7c-9521-42a6-915e-5aaa8689d529
    name: CobaltStrike Load by Rundll32
    reason: 'Co-occurring: rundll32.exe (this rule''s injection target) loading a Cobalt Strike DLL via the StartW export - the beacon now executing inside the injected process.'
  - id: 85adeb13-4fc9-4e68-8a4a-c7cb2c336eb7
    name: CobaltStrike Named Pipe Patterns
    reason: 'Confirmation: a malleable-C2 named pipe created by the injected beacon - evidence this remote thread produced a live Cobalt Strike implant rather than a benign thread.'
  - id: 514e7e3e-b3b4-4a67-af60-be20f139198b
    name: PUA - AdFind.EXE Execution
    reason: 'Follow-on: hands-on-keyboard Active Directory reconnaissance run from the beacon - the documented next step in these Bumblebee-to-domain-admin intrusions (same DFIR Report chain this rule cites).'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: 'Beacon call-home: outbound connections by the injected rundll32 and the hijacked WAB-family binaries'
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Aa][Bb]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Aa][Bb][Mm][Ii][Gg]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ii][Mm][Aa][Gg][Ii][Nn][Gg][Dd][Ee][Vv][Ii][Cc][Ee][Ss]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
  - name: 'Bumblebee loader footprint on this host: WAB-family execution and the WAB\DLLPath registry hijack'
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ww][Aa][Bb]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Aa][Bb][Mm][Ii][Gg]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ii][Mm][Aa][Gg][Ii][Nn][Gg][Dd][Ee][Vv][Ii][Cc][Ee][Ss]\.[Ee][Xx][Ee]/)) OR (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Aa][Bb]\\[Dd][Ll][Ll][Pp][Aa][Tt][Hh]/)
    pivot_on:
    - host
    window: 2h
  - name: 'Cobalt Strike payload fingerprints: CS-signature remote threads and malleable-C2 named pipes'
    query: (data_win_system_eventID:"8" AND (data_win_eventdata_startAddress:/.*0[Bb]80/ OR data_win_eventdata_startAddress:/.*0[Cc]7[Cc]/ OR data_win_eventdata_startAddress:/.*0[Cc]88/)) OR ((data_win_system_eventID:"17" OR data_win_system_eventID:"18") AND (data_win_eventdata_pipeName:/.*[Mm][Ss][Ss][Ee]-.*/ OR data_win_eventdata_pipeName:/.*[Pp][Oo][Ss][Tt][Ee][Xx]_.*/ OR data_win_eventdata_pipeName:/.*[Mm][Ss][Aa][Gg][Ee][Nn][Tt]_.*/ OR data_win_eventdata_pipeName:/.*[Ff][Uu][Ll][Ll][Dd][Uu][Pp][Ll][Ee][Xx]_.*/ OR data_win_eventdata_pipeName:/.*[Mm][Ss][Rr][Pp][Cc]_.*/ OR data_win_eventdata_pipeName:/.*[Dd][Ss][Ee][Rr][Nn][Aa][Mm][Ee][Pp][Ii][Pp][Ee].*/ OR data_win_eventdata_pipeName:/.*[Mm][Yy][Pp][Ii][Pp][Ee]-.*/))
    pivot_on:
    - host
    window: 2h
  - name: Operator hands-on Active Directory / domain discovery from the beacon
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Aa][Dd][Ff][Ii][Nn][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Nn][Ll][Tt][Ee][Ss][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Dd][Ss][Qq][Uu][Ee][Rr][Yy]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Aa][Dd][Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr].*\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Mm][Aa][Ii][Nn]_[Tt][Rr][Uu][Ss][Tt][Ss].*/ OR data_win_eventdata_commandLine:/.*[Gg][Rr][Oo][Uu][Pp].*[Dd][Oo][Mm][Aa][Ii][Nn] [Aa][Dd][Mm][Ii][Nn][Ss].*/)
    pivot_on:
    - host
    window: 4h
  - name: LSASS credential access and memory dumping on this host
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll].*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*[Ll][Ss][Aa][Ss][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp].*\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Dd][Rr][Ll][Ee][Aa][Kk][Dd][Ii][Aa][Gg]\.[Ee][Xx][Ee]/))
    pivot_on:
    - host
    window: 4h
