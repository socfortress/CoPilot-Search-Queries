name: Remote Thread Creation Ttdinject.exe Proxy
id: c15e99a3-c474-48ab-b9a7-84549a7a9d16
version: 1
schema_version: "1.0"
date: "2022-06-02"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: c15e99a3-c474-48ab-b9a7-84549a7a9d16
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a remote thread creation of Ttdinject.exe used as proxy. MITRE ATT&CK:
  T1127.

data_source:
  - Sysmon EventID 8 - CreateRemoteThread

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "8"
        
        - wildcard:
            data_win_eventdata_sourceImage:
              value: "*\\\\ttdinject.exe"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_sourceImage
    - data_win_eventdata_targetImage

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 8 (CreateRemoteThread) enabled in the Sysmon
  configuration and the Microsoft-Windows-Sysmon/Operational channel collected
  by the Wazuh agent. The detection looks for events where
  data_win_eventdata_sourceImage matches '*\ttdinject.exe'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://lolbas-project.github.io/lolbas/Binaries/Ttdinject/
  - https://attack.mitre.org/techniques/T1127/

response:
  message: >
    Remote Thread Creation Ttdinject.exe Proxy detected on host $agent_name$.
    Matched data_win_eventdata_sourceImage: $data_win_eventdata_sourceImage$.
    Matched data_win_eventdata_targetImage: $data_win_eventdata_targetImage$.
    MITRE ATT&CK: T1127
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_sourceImage
      type: process
    - field: data_win_eventdata_targetImage
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1127
  custom_tags:
    - thread
    - ttdinject
    - proxy
    - create_remote_thread
    - sysmon
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"8" AND data_win_eventdata_sourceImage:/.*\\[Tt][Tt][Dd][Ii][Nn][Jj][Ee][Cc][Tt]\.[Ee][Xx][Ee]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b27077d6-23e6-45d2-81a0-e2b356eea5fd
    name: Use of TTDInject.exe
    reason: 'Direct precursor, same binary: the EID 1 process-creation of the very ttdinject.exe that then spawned this remote thread. Its command line (/Launch, /ClientParams, -recordMode TTDRecorder), parent and user reveal whether this is a developer or an attacker proxy-executing a payload under the signed TTD recorder.'
  - id: 0b4ae027-2a2d-4b93-8c7e-962caaba5b2a
    name: Time Travel Debugging Utility Usage
    reason: 'Reveals the proxy-execution payload: catches child processes spawned by tttracer.exe (ttdinject''s launcher). The process launched under the TTD recorder is the actual payload this injection is proxying (T1218 / T1003.001).'
  - id: e76c8240-d68f-4773-8880-5c6f63595aaf
    name: Time Travel Debugging Utility Usage - Image
    reason: 'Confirms the injection landed, victim side: EID 7 image-load of the TTD recording DLLs (ttdrecord/ttdwriter/ttdloader) into the target process ttdinject''s remote thread injected, identifying the injected process.'
  - id: a1a144b7-5c9b-4853-a559-2172be8d4a03
    name: Remote Thread Creation In Uncommon Target Image
    reason: 'Same EID 8 injection technique, target side: flags a remote thread landing in a commonly-abused proxy/hollowing target (calc.exe, notepad.exe, spoolsv.exe) - exactly the innocuous processes a ttdinject /Launch proxy injects into.'
  - id: f239b326-2f41-4d6b-9dfa-c846a60ef505
    name: Password Dumper Remote Thread in LSASS
    reason: 'Credential-theft follow-on via the identical primitive: an EID 8 remote thread into lsass.exe with an empty start module. If the injected payload pivots to LSASS, this is the same remote-thread injection aimed at password dumping (T1003.001).'
  - id: 6309645e-122d-4c5b-bb2b-22e4f9c2fa42
    name: HackTool - Potential CobaltStrike Process Injection
    reason: 'Co-occurring staged payload: Cobalt Strike beacon remote-thread start-address signatures on the same host. A signed-binary proxy injection commonly stages a CS beacon that then performs its own process injection.'
  - id: 4f73421b-5a0b-4bbf-a892-5a7fb99bea66
    name: Mavinject Inject DLL Into Running Process
    reason: 'Sibling signed-binary injection tradecraft: mavinject.exe is the archetypal Microsoft-signed LOLBIN DLL injector. An operator abusing ttdinject for signed-proxy injection frequently reaches for mavinject on the same host.'
  - id: b5c7395f-e501-4a08-94d4-57fe7a9da9d2
    name: Potential Binary Proxy Execution Via Cdb.EXE
    reason: 'Same tooling family: cdb.exe is the console debugger shipped in the same Debugging Tools for Windows package as ttdinject.exe, abused for identical T1127 signed-binary proxy execution - a strong sign the attacker is living off the debugging suite.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: TTD injector / recorder launch and its proxy target on this host (ttdinject, tttracer, TTDRecorder, -recordMode)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Tt][Tt][Dd][Ii][Nn][Jj][Ee][Cc][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Tt][Tt][Tt][Rr][Aa][Cc][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Tt][Tt][Dd][Ii][Nn][Jj][Ee][Cc][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Tt][Tt][Dd][Rr][Ee][Cc][Oo][Rr][Dd][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*-[Rr][Ee][Cc][Oo][Rr][Dd][Mm][Oo][Dd][Ee].*/)
    pivot_on:
    - host
    window: 1h
  - name: TTD recording DLLs loaded into the injected target on this host (ttdrecord/ttdwriter/ttdloader)
    query: data_win_system_eventID:"7" AND (data_win_eventdata_imageLoaded:/.*\\[Tt][Tt][Dd][Rr][Ee][Cc][Oo][Rr][Dd]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Tt][Tt][Dd][Ww][Rr][Ii][Tt][Ee][Rr]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Tt][Tt][Dd][Ll][Oo][Aa][Dd][Ee][Rr]\.[Dd][Ll][Ll]/)
    pivot_on:
    - host
    window: 1h
  - name: LSASS credential access or dumping on this host (process access, remote thread into LSASS, minidump/sekurlsa/comsvcs)
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"8" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll].*/))
    pivot_on:
    - host
    window: 2h
  - name: Other signed-binary / debugging-utility injectors on this host (mavinject, cdb, ntsd, tracker, AccCheckConsole, msra)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Mm][Aa][Vv][Ii][Nn][Jj][Ee][Cc][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Dd][Bb]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Nn][Tt][Ss][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Tt][Rr][Aa][Cc][Kk][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Aa][Cc][Cc][Cc][Hh][Ee][Cc][Kk][Cc][Oo][Nn][Ss][Oo][Ll][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Rr][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Mm][Aa][Vv][Ii][Nn][Jj][Ee][Cc][Tt]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: C2 egress from debugging utilities or proxy carriers on this host (ttdinject/tttracer/rundll32/regsvr32/mshta network connections)
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*\\[Tt][Tt][Dd][Ii][Nn][Jj][Ee][Cc][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Tt][Tt][Tt][Rr][Aa][Cc][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
