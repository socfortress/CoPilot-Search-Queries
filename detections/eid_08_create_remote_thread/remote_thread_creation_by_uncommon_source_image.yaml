name: Remote Thread Creation By Uncommon Source Image
id: 66d31e5f-52d6-40a4-9615-002d3789a119
version: 1
schema_version: "1.0"
date: "2025-07-08"
author: Perez Diego (@darkquassar), oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 66d31e5f-52d6-40a4-9615-002d3789a119
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects uncommon processes creating remote threads. MITRE ATT&CK: T1055.

data_source:
  - Sysmon EventID 8 - CreateRemoteThread

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "8"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_sourceImage:
                    value: "*\\\\explorer.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_sourceImage:
                    value: "*\\\\iexplore.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_sourceImage:
                    value: "*\\\\msiexec.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_sourceImage:
                    value: "*\\\\powerpnt.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_sourceImage:
                    value: "*\\\\schtasks.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_sourceImage:
                    value: "*\\\\winlogon.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_sourceImage"
        - exists:
            field: "data_win_eventdata_targetParentProcessId"
        - bool:
            must_not:
              - bool:
                  should:
                    - bool:
                        must:
                          - term:
                              data_win_eventdata_sourceImage:
                                value: "C:\\Windows\\System32\\winlogon.exe"
                                case_insensitive: true
                          - bool:
                              should:
                                - term:
                                    data_win_eventdata_targetImage:
                                      value: "C:\\Windows\\System32\\services.exe"
                                      case_insensitive: true
                                - term:
                                    data_win_eventdata_targetImage:
                                      value: "C:\\Windows\\System32\\wininit.exe"
                                      case_insensitive: true
                                - term:
                                    data_win_eventdata_targetImage:
                                      value: "C:\\Windows\\System32\\csrss.exe"
                                      case_insensitive: true
                                - term:
                                    data_win_eventdata_targetImage:
                                      value: "C:\\Windows\\System32\\LogonUI.exe"
                                      case_insensitive: true
                                - term:
                                    data_win_eventdata_targetImage:
                                      value: "C:\\Windows\\System32\\wlrmdr.exe"
                                      case_insensitive: true
                                - term:
                                    data_win_eventdata_targetImage:
                                      value: "C:\\Windows\\System32\\AtBroker.exe"
                                      case_insensitive: true
                                - term:
                                    data_win_eventdata_targetImage:
                                      value: "C:\\Windows\\System32\\dwm.exe"
                                      case_insensitive: true
                                - term:
                                    data_win_eventdata_targetImage:
                                      value: "C:\\Windows\\System32\\fontdrvhost.exe"
                                      case_insensitive: true
                                - term:
                                    data_win_eventdata_targetImage:
                                      value: "C:\\Windows\\System32\\userinit.exe"
                                      case_insensitive: true
                              minimum_should_match: 1
                    - bool:
                        must:
                          - term:
                              data_win_eventdata_sourceImage:
                                value: "C:\\Windows\\System32\\winlogon.exe"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_targetParentProcessId: "4"
                    - bool:
                        must:
                          - bool:
                              should:
                                - term:
                                    data_win_eventdata_sourceImage:
                                      value: "C:\\Windows\\System32\\schtasks.exe"
                                      case_insensitive: true
                                - term:
                                    data_win_eventdata_sourceImage:
                                      value: "C:\\Windows\\SysWOW64\\schtasks.exe"
                                      case_insensitive: true
                              minimum_should_match: 1
                          - term:
                              data_win_eventdata_targetImage:
                                value: "C:\\Windows\\System32\\conhost.exe"
                                case_insensitive: true
                    - bool:
                        must:
                          - term:
                              data_win_eventdata_sourceImage:
                                value: "C:\\Windows\\explorer.exe"
                                case_insensitive: true
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_targetImage:
                                      value: "C:\\\\Program Files (x86)\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_targetImage:
                                      value: "C:\\\\Program Files\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_targetImage:
                                      value: "C:\\\\Windows\\\\System32\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_targetImage:
                                      value: "C:\\\\Windows\\\\SysWOW64\\\\*"
                                      case_insensitive: true
                              minimum_should_match: 1
                    - term:
                        data_win_eventdata_targetImage:
                          value: "System"
                          case_insensitive: true
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_sourceImage:
                                value: "*\\\\msiexec.exe"
                                case_insensitive: true
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_targetImage:
                                      value: "*\\\\AppData\\\\Local\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_targetImage:
                                      value: "*C:\\\\Program Files (x86)\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_targetImage:
                                      value: "*C:\\\\Program Files\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_targetImage:
                                      value: "*C:\\\\Windows\\\\Microsoft.NET\\\\Framework64\\\\*"
                                      case_insensitive: true
                              minimum_should_match: 1
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_sourceImage:
                                value: "*\\\\msiexec.exe"
                                case_insensitive: true
                          - bool:
                              should:
                                - term:
                                    data_win_eventdata_targetImage:
                                      value: "C:\\Windows\\System32\\msiexec.exe"
                                      case_insensitive: true
                                - term:
                                    data_win_eventdata_targetImage:
                                      value: "C:\\Windows\\SysWOW64\\msiexec.exe"
                                      case_insensitive: true
                              minimum_should_match: 1
                    - bool:
                        must:
                          - term:
                              data_win_eventdata_sourceImage:
                                value: "C:\\Program Files\\Internet Explorer\\iexplore.exe"
                                case_insensitive: true
                          - bool:
                              should:
                                - term:
                                    data_win_eventdata_targetImage:
                                      value: "C:\\Program Files (x86)\\Internet Explorer\\iexplore.exe"
                                      case_insensitive: true
                                - term:
                                    data_win_eventdata_targetImage:
                                      value: "C:\\Windows\\System32\\rundll32.exe"
                                      case_insensitive: true
                              minimum_should_match: 1
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_sourceImage:
                                value: "*\\\\POWERPNT.EXE"
                                case_insensitive: true
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_targetImage:
                                      value: "*C:\\\\Program Files\\\\Microsoft Office\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_targetImage:
                                      value: "*C:\\\\Program Files (x86)\\\\Microsoft Office\\\\*"
                                      case_insensitive: true
                              minimum_should_match: 1
                    - bool:
                        must_not:
                          - exists:
                              field: "data_win_eventdata_targetImage"
                    - term:
                        data_win_eventdata_targetImage: ""
                  minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_sourceImage"
        - exists:
            field: "data_win_eventdata_sourceCommandLine"
        - exists:
            field: "data_win_eventdata_sourceParentImage"
        - exists:
            field: "data_win_eventdata_targetImage"
        - bool:
            must_not:
              - bool:
                  should:
                    - bool:
                        must:
                          - term:
                              data_win_eventdata_sourceImage:
                                value: "C:\\Program Files\\internet explorer\\iexplore.exe"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_sourceCommandLine:
                                value: "*https://*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_sourceCommandLine:
                                value: "*.checkpoint.com/documents/*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_sourceCommandLine:
                                value: "*SmartConsole_OLH/*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_sourceCommandLine:
                                value: "*default.htm#cshid=*"
                                case_insensitive: true
                    - bool:
                        must:
                          - term:
                              data_win_eventdata_sourceImage:
                                value: "C:\\Program Files\\internet explorer\\iexplore.exe"
                                case_insensitive: true
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_sourceParentImage:
                                      value: "C:\\\\Program Files\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_sourceParentImage:
                                      value: "C:\\\\Program Files (x86)\\\\*"
                                      case_insensitive: true
                              minimum_should_match: 1
                          - wildcard:
                              data_win_eventdata_sourceParentImage:
                                value: "*\\\\CheckPoint\\\\SmartConsole\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_sourceParentImage:
                                value: "*\\\\SmartConsole.exe*"
                                case_insensitive: true
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_sourceImage:
                                value: "*\\\\Microsoft Office\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_sourceImage:
                                value: "*\\\\POWERPNT.EXE"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_targetImage:
                                value: "C:\\Windows\\System32\\csrss.exe"
                                case_insensitive: true
                    - bool:
                        must:
                          - term:
                              data_win_eventdata_sourceImage:
                                value: "C:\\Windows\\explorer.exe"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_targetImage:
                                value: "*\\\\AppData\\\\Local\\\\Microsoft\\\\OneDrive\\\\OneDrive.exe"
                                case_insensitive: true
                    - bool:
                        must:
                          - term:
                              data_win_eventdata_sourceImage:
                                value: "C:\\Windows\\explorer.exe"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_targetImage:
                                value: "*\\\\aurora-dashboard.exe"
                                case_insensitive: true
                    - bool:
                        must:
                          - term:
                              data_win_eventdata_sourceImage:
                                value: "C:\\Windows\\explorer.exe"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_targetImage:
                                value: "*\\\\OfficeSetup.exe"
                                case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_sourceImage
    - data_win_eventdata_targetParentProcessId
    - data_win_eventdata_targetImage
    - data_win_eventdata_sourceCommandLine
    - data_win_eventdata_sourceParentImage

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 8 (CreateRemoteThread) enabled in the Sysmon
  configuration and the Microsoft-Windows-Sysmon/Operational channel collected
  by the Wazuh agent. The detection looks for events where
  data_win_eventdata_sourceImage matches '*\explorer.exe';
  data_win_eventdata_sourceImage matches '*\iexplore.exe';
  data_win_eventdata_sourceImage matches '*\msiexec.exe', among other
  conditions.

known_false_positives: >
  This rule is best put in testing first in order to create a baseline that
  reflects the data in your environment. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - Personal research, statistical analysis
  - https://lolbas-project.github.io
  - https://attack.mitre.org/techniques/T1055/

response:
  message: >
    Remote Thread Creation By Uncommon Source Image detected on host
    $agent_name$. Matched data_win_eventdata_sourceImage:
    $data_win_eventdata_sourceImage$. Matched
    data_win_eventdata_targetParentProcessId:
    $data_win_eventdata_targetParentProcessId$. MITRE ATT&CK: T1055
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_sourceImage
      type: process
    - field: data_win_eventdata_targetParentProcessId
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1055
  custom_tags:
    - thread
    - uncommon
    - source
    - create_remote_thread
    - sysmon
    - privilege_escalation
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
