name: Remote Thread Creation In Mstsc.Exe From Suspicious Location
id: c0aac16a-b1e7-4330-bab0-3c27bb4987c7
version: 1
schema_version: "1.0"
date: "2024-01-22"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: c0aac16a-b1e7-4330-bab0-3c27bb4987c7
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects remote thread creation in the "mstsc.exe" process by a process located
  in a potentially suspicious location. This technique is often used by
  attackers in order to hook some APIs used by DLLs loaded by "mstsc.exe" during
  RDP authentications in order to steal credentials.

data_source:
  - Sysmon EventID 8 - CreateRemoteThread

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "8"
        
        - wildcard:
            data_win_eventdata_targetImage:
              value: "*\\\\mstsc.exe"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_sourceImage:
                    value: "*:\\\\Temp\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_sourceImage:
                    value: "*:\\\\Users\\\\Public\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_sourceImage:
                    value: "*:\\\\Windows\\\\PerfLogs\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_sourceImage:
                    value: "*:\\\\Windows\\\\Tasks\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_sourceImage:
                    value: "*:\\\\Windows\\\\Temp\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_sourceImage:
                    value: "*\\\\AppData\\\\Local\\\\Temp\\\\*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetImage
    - data_win_eventdata_sourceImage

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 8 (CreateRemoteThread) enabled in the Sysmon
  configuration and the Microsoft-Windows-Sysmon/Operational channel collected
  by the Wazuh agent. The detection looks for events where
  data_win_eventdata_targetImage matches '*\mstsc.exe';
  data_win_eventdata_sourceImage matches '*:\Temp\*';
  data_win_eventdata_sourceImage matches '*:\Users\Public\*', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/S12cybersecurity/RDPCredentialStealer/blob/1b8947cdd065a06c1b62e80967d3c7af895fcfed/APIHookInjectorBin/APIHookInjectorBin/Inject.h#L25

response:
  message: >
    Remote Thread Creation In Mstsc.Exe From Suspicious Location detected on
    host $agent_name$. Matched data_win_eventdata_targetImage:
    $data_win_eventdata_targetImage$. Matched data_win_eventdata_sourceImage:
    $data_win_eventdata_sourceImage$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetImage
      type: process
    - field: data_win_eventdata_sourceImage
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - thread
    - mstsc
    - location
    - create_remote_thread
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"8" AND data_win_eventdata_targetImage:/.*\\[Mm][Ss][Tt][Ss][Cc]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_sourceImage:/.*:\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_sourceImage:/.*:\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_sourceImage:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss]\\.*/ OR data_win_eventdata_sourceImage:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Aa][Ss][Kk][Ss]\\.*/ OR data_win_eventdata_sourceImage:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_sourceImage:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b447f7de-1e53-4cbf-bfb4-f1f6d0b04e4e
    name: Suspicious Binaries and Scripts in Public Folder
    reason: 'Precursor/staging: the injector binary is written into C:\Users\Public — one of the exact suspicious source locations this rule keys on — just before it creates the remote thread in mstsc.exe.'
  - id: 69bd9b97-2be2-41b6-9816-fb08757a4d1a
    name: Potentially Suspicious Execution From Parent Process In Public Folder
    reason: 'Precursor/launch: a process executing out of \Users\Public is the untrusted-location binary that then performs this CreateRemoteThread injection into the RDP client.'
  - id: 02d1d718-dd13-41af-989d-ea85c7fab93f
    name: Rare Remote Thread Creation By Uncommon Source Image
    reason: Same CreateRemoteThread (EID 8) injection primitive — the same temp/public-staged injector trips this when it injects into processes other than mstsc.exe on the same host.
  - id: a1a144b7-5c9b-4853-a559-2172be8d4a03
    name: Remote Thread Creation In Uncommon Target Image
    reason: The same injector fanning its remote-thread injection out to other unusual target processes (calc/notepad/spoolsv) beyond the RDP client — widens a single alert into a campaign.
  - id: 6309645e-122d-4c5b-bb2b-22e4f9c2fa42
    name: HackTool - Potential CobaltStrike Process Injection
    reason: Identifies the injection toolkit (a Cobalt Strike beacon) likely driving the mstsc.exe remote thread on this host, corroborating a hands-on-keyboard intrusion.
  - id: f239b326-2f41-4d6b-9dfa-c846a60ef505
    name: Password Dumper Remote Thread in LSASS
    reason: Same CreateRemoteThread credential-access primitive pointed at LSASS — the actor broadening the harvest from RDP-client credentials to local secrets.
  - id: 954f0af7-62dd-418f-b3df-a84bc2c7a774
    name: New Remote Desktop Connection Initiated Via Mstsc.EXE
    reason: The outbound RDP session this API hook is positioned to steal credentials from, and/or the attacker reconnecting outbound with the harvested RDP creds.
  - id: ed74fe75-7594-4b4b-ae38-e38e3fd2eb23
    name: Outbound RDP Connections Over Non-Standard Tools
    reason: 'Follow-on lateral movement: RDP credentials captured from mstsc.exe reused to connect outbound over port 3389.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Injector staged or launched from this rule's suspicious source locations
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*:\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_image:/.*:\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_image:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss]\\.*/ OR data_win_eventdata_image:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Aa][Ss][Kk][Ss]\\.*/ OR data_win_eventdata_image:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\.*/)) OR (data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*:\\[Tt][Ee][Mm][Pp]\\.*\.([Ee][Xx][Ee]|[Dd][Ll][Ll])/ OR data_win_eventdata_targetFilename:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*\.([Ee][Xx][Ee]|[Dd][Ll][Ll])/ OR data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\.*\.([Ee][Xx][Ee]|[Dd][Ll][Ll])/))
    pivot_on:
    - host
    window: 2h
  - name: Outbound RDP from the hooked mstsc client (credentials the hook harvests)
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Mm][Ss][Tt][Ss][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.* \/[Vv]:.*/) OR (data_win_system_eventID:"3" AND data_win_eventdata_destinationPort:"3389")
    pivot_on:
    - host
    window: 2h
  - name: 'Broader credential theft: remote-thread or process-access into LSASS'
    query: (data_win_system_eventID:"8" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
  - name: This account's RDP (RemoteInteractive) logons — harvested-credential reuse
    query: (data_win_system_eventID:"4624" OR data_win_system_eventID:"4625") AND data_win_eventdata_logonType:"10"
    pivot_on:
    - user
    window: 6h
  - name: Remote-execution / lateral-movement tooling launched on this host
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Pp][Ss][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]|\\[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]\.[Ee][Xx][Ee]|\\[Pp][Aa][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]|\\[Ww][Ii][Nn][Rr][Ss]\.[Ee][Xx][Ee]|\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee])/) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Cc][Oo][Mm][Mm][Aa][Nn][Dd].*/ OR data_win_eventdata_commandLine:/.*[Ee][Nn][Tt][Ee][Rr]-[Pp][Ss][Ss][Ee][Ss][Ss][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Ww]-[Pp][Ss][Ss][Ee][Ss][Ss][Ii][Oo][Nn].*/))
    pivot_on:
    - host
    window: 2h
