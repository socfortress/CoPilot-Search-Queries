name: Remote Thread Created In KeePass.EXE
id: 77564cc2-7382-438b-a7f6-395c2ae53b9a
version: 1
schema_version: "1.0"
date: "2023-05-05"
author: Timon Hackenjos
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 77564cc2-7382-438b-a7f6-395c2ae53b9a
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects remote thread creation in "KeePass.exe" which could indicates
  potential password dumping activity. MITRE ATT&CK: T1555.005.

data_source:
  - Sysmon EventID 8 - CreateRemoteThread

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "8"
        
        - wildcard:
            data_win_eventdata_targetImage:
              value: "*\\\\KeePass.exe"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetImage
    - data_win_eventdata_sourceImage

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 8 (CreateRemoteThread) enabled in the Sysmon
  configuration and the Microsoft-Windows-Sysmon/Operational channel collected
  by the Wazuh agent. The detection looks for events where
  data_win_eventdata_targetImage matches '*\KeePass.exe'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.cisa.gov/uscert/ncas/alerts/aa20-259a
  - https://github.com/denandz/KeeFarce
  - https://github.com/GhostPack/KeeThief
  - https://attack.mitre.org/techniques/T1555/005/

response:
  message: >
    Remote Thread Created In KeePass.EXE detected on host $agent_name$. Matched
    data_win_eventdata_targetImage: $data_win_eventdata_targetImage$. Matched
    data_win_eventdata_sourceImage: $data_win_eventdata_sourceImage$. MITRE
    ATT&CK: T1555.005
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetImage
      type: process
    - field: data_win_eventdata_sourceImage
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1555.005
  custom_tags:
    - thread
    - keepass
    - create_remote_thread
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"8" AND data_win_eventdata_targetImage:/.*\\[Kk][Ee][Ee][Pp][Aa][Ss][Ss]\.[Ee][Xx][Ee]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: fb656378-f909-47c1-8747-278bf09f4f4f
    name: Potential Credential Dumping Attempt Via PowerShell Remote Thread
    reason: Same Sysmon EID 8 remote-thread-into-a-credential-store primitive; KeeThief injects KeePass from powershell.exe, so the same operator very often also injects lsass.exe from PowerShell on this host in the same session.
  - id: f239b326-2f41-4d6b-9dfa-c846a60ef505
    name: Password Dumper Remote Thread in LSASS
    reason: Identical CreateRemoteThread (EID 8) credential-access primitive aimed at lsass.exe; an actor ripping the decrypted KeePass vault from memory routinely dumps LSASS on the same host in the same hands-on-keyboard burst.
  - id: 6309645e-122d-4c5b-bb2b-22e4f9c2fa42
    name: HackTool - Potential CobaltStrike Process Injection
    reason: The KeePass injection is typically fired from a C2 beacon; Cobalt Strike's own EID 8 remote-thread injection on this host identifies the implant that ran the KeeThief/KeeFarce module.
  - id: 02d1d718-dd13-41af-989d-ea85c7fab93f
    name: Rare Remote Thread Creation By Uncommon Source Image
    reason: The in-memory KeePass injector is an anomalous source image; this flags that same uncommon process creating remote threads into other targets, exposing the wider injection spree around the KeePass hit.
  - id: c7d33b50-f690-4b51-8cfb-0fb912a31e57
    name: HackTool - SharpDPAPI Execution
    reason: GhostPack sibling of KeeThief whose own detection matches a 'keepass' subcommand - it decrypts KeePass master keys via DPAPI, a parallel/alternative route to the same vault on the same host.
  - id: fc028194-969d-4122-8abe-0470d5b8f12f
    name: Access to Browser Login Data
    reason: An operator looting the KeePass vault harvests every stored-credential source; copying browser Login Data on the same host/user is the classic parallel credential grab.
  - id: 58f50261-c53b-4c88-bd12-1d71f12eda4c
    name: Windows Credential Manager Access via VaultCmd
    reason: Another local secret store (T1555.004) enumerated in the same credential sweep; vaultcmd /listcreds on this host corroborates broad password harvesting beyond KeePass.
  - id: d78b5d61-187d-44b6-bf02-93486a80de5a
    name: HackTool - DInjector PowerShell Cradle Execution
    reason: A PowerShell shellcode-injection cradle is a plausible precursor that delivered the in-memory injector used against KeePass; seeing it on this host just before shows how the injection capability arrived.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: 'KeePass process targeted on this host: handle-open, injector cmdline, vault/config file touch'
    query: ((data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Kk][Ee][Ee][Pp][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Kk][Ee][Ee][Pp][Aa][Ss][Ss].*/ OR data_win_eventdata_commandLine:/.*\.[Kk][Dd][Bb][Xx].*/)) OR (data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\.[Kk][Dd][Bb][Xx]/ OR data_win_eventdata_targetFilename:/.*[Kk][Ee][Ee][Pp][Aa][Ss][Ss]\.[Cc][Oo][Nn][Ff][Ii][Gg]\.[Xx][Mm][Ll]/)))
    pivot_on:
    - host
    window: 2h
  - name: Other remote-thread injection & LSASS credential-dumping on this host
    query: ((data_win_system_eventID:"8") OR (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee][Rr][Ee][Mm][Oo][Tt][Ee][Tt][Hh][Rr][Ee][Aa][Dd].*/ OR data_win_eventdata_commandLine:/.*[Vv][Ii][Rr][Tt][Uu][Aa][Ll][Aa][Ll][Ll][Oo][Cc][Ee][Xx].*/ OR data_win_eventdata_commandLine:/.*[Ww][Rr][Ii][Tt][Ee][Pp][Rr][Oo][Cc][Ee][Ss][Ss][Mm][Ee][Mm][Oo][Rr][Yy].*/ OR data_win_eventdata_commandLine:/.*[Nn][Tt][Cc][Rr][Ee][Aa][Tt][Ee][Tt][Hh][Rr][Ee][Aa][Dd].*/)))
    pivot_on:
    - host
    window: 1h
  - name: Credential-store / password-manager theft tooling across vaults on this host
    query: ((data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*(\\[Kk][Ee][Ee][Tt][Hh][Ii][Ee][Ff]\.[Ee][Xx][Ee]|\\[Kk][Ee][Ee][Ff][Aa][Rr][Cc][Ee]\.[Ee][Xx][Ee]|\\[Ss][Hh][Aa][Rr][Pp][Dd][Pp][Aa][Pp][Ii]\.[Ee][Xx][Ee]|\\[Ss][Hh][Aa][Rr][Pp][Cc][Hh][Rr][Oo][Mm][Ee]\.[Ee][Xx][Ee]|\\[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz]\.[Ee][Xx][Ee]|\\[Ll][Aa][Zz][Aa][Gg][Nn][Ee]\.[Ee][Xx][Ee]|\\[Vv][Aa][Uu][Ll][Tt][Cc][Mm][Dd]\.[Ee][Xx][Ee])/ OR data_win_eventdata_commandLine:/.*[Kk][Ee][Ee][Pp][Aa][Ss][Ss].*/ OR data_win_eventdata_commandLine:/.*\.[Kk][Dd][Bb][Xx].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Mm][Aa][Ss][Tt][Ee][Rr][Kk][Ee][Yy][Ss].*/ OR data_win_eventdata_commandLine:/.*\/[Ll][Ii][Ss][Tt][Cc][Rr][Ee][Dd][Ss].*/)) OR (data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Kk][Ee][Ee][Tt][Hh][Ii][Ee][Ff].*/ OR data_win_eventdata_scriptBlockText:/.*[Kk][Ee][Ee][Pp][Aa][Ss][Ss].*/ OR data_win_eventdata_scriptBlockText:/.*[Ll][Oo][Gg][Ii][Nn] [Dd][Aa][Tt][Aa].*/)))
    pivot_on:
    - host
    window: 2h
  - name: 'Harvested-credential reuse: this account''s logon activity across hosts'
    query: (data_win_system_eventID:"4624" OR data_win_system_eventID:"4625")
    pivot_on:
    - user
    window: 6h
  - name: Follow-on lateral-movement / remote-execution tooling on this host
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Pp][Ss][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]|\\[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]\.[Ee][Xx][Ee]|\\[Pp][Aa][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]|\\[Ww][Ii][Nn][Rr][Ss]\.[Ee][Xx][Ee]|\\[Mm][Ss][Tt][Ss][Cc]\.[Ee][Xx][Ee]|\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee])/) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Cc][Oo][Mm][Mm][Aa][Nn][Dd].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Ww]-[Pp][Ss][Ss][Ee][Ss][Ss][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ee][Nn][Tt][Ee][Rr]-[Pp][Ss][Ss][Ee][Ss][Ss][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*-[Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr][Nn][Aa][Mm][Ee].*/))
    pivot_on:
    - host
    window: 2h
