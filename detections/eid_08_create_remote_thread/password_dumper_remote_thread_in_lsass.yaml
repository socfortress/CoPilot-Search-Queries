name: Password Dumper Remote Thread in LSASS
id: f239b326-2f41-4d6b-9dfa-c846a60ef505
version: 1
schema_version: "1.0"
date: "2021-06-21"
author: Thomas Patzke
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: f239b326-2f41-4d6b-9dfa-c846a60ef505
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: production
type: TTP

description: >
  Detects password dumper activity by monitoring remote thread creation EventID
  8 in combination with the lsass.exe process as TargetImage. The process in
  field Process is the malicious program. A single execution can lead to
  hundreds of events. MITRE ATT&CK: T1003.001.

data_source:
  - Sysmon EventID 8 - CreateRemoteThread

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "8"
        
        - wildcard:
            data_win_eventdata_targetImage:
              value: "*\\\\lsass.exe"
              case_insensitive: true
        - term:
            data_win_eventdata_startModule: ""
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetImage
    - data_win_eventdata_startModule
    - data_win_eventdata_sourceImage

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 8 (CreateRemoteThread) enabled in the Sysmon
  configuration and the Microsoft-Windows-Sysmon/Operational channel collected
  by the Wazuh agent. The detection looks for events where
  data_win_eventdata_targetImage matches '*\lsass.exe';
  data_win_eventdata_startModule equals ''.

known_false_positives: >
  Antivirus products. Baseline expected activity in your environment and tune
  this detection before relying on it for automated response.

references:
  - https://jpcertcc.github.io/ToolAnalysisResultSheet/details/WCE.htm
  - https://attack.mitre.org/techniques/T1003/001/

response:
  message: >
    Password Dumper Remote Thread in LSASS detected on host $agent_name$.
    Matched data_win_eventdata_targetImage: $data_win_eventdata_targetImage$.
    Matched data_win_eventdata_startModule: $data_win_eventdata_startModule$.
    MITRE ATT&CK: T1003.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetImage
      type: process
    - field: data_win_eventdata_startModule
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.001
  custom_tags:
    - password
    - dumper
    - thread
    - create_remote_thread
    - sysmon
    - credential_access
    - s0005
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"8" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_startModule:""

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a18dd26b-6450-46de-8c91-9659150cf088
    name: Potentially Suspicious GrantedAccess Flags On LSASS
    reason: 'Mechanistic precursor on the same host: a process cannot CreateRemoteThread in lsass.exe without first opening a handle to it with injection-grade access (PROCESS_CREATE_THREAD|VM_WRITE|VM_OPERATION). This EID 10 rule catches that exact handle and, unlike this rule, names the injecting sourceImage.'
  - id: 5ef9853e-4d0e-4a70-846f-a9ca37d876da
    name: Potential Credential Dumping Activity Via LSASS
    reason: The same LSASS credential theft seen through EID 10 access-mask + call-trace (Mimikatz/NanoDump/Procdump style). Corroborates the compromise from a second Sysmon event and identifies the dumping tool on the same host.
  - id: 857c8db3-c89b-42fb-882b-f681c7cf4da2
    name: Unsigned Image Loaded Into LSASS Process
    reason: 'Co-occurring injection artifact: WCE/Mimikatz-style remote-thread dumping maps an unsigned module into lsass.exe to run its credential-harvesting code, so an EID 7 unsigned-image-into-LSASS often fires within seconds on the same host.'
  - id: aa1697b7-d611-4f9a-9cb2-5125b4ccfd5c
    name: Password Dumper Activity on LSASS
    reason: 'Independent second-source confirmation: the Security log (4656, handle to LSASS with SAM_DOMAIN object + 0x705 mask) records the same password-dumper access the remote-thread injection depends on, from a different telemetry channel than Sysmon.'
  - id: fb656378-f909-47c1-8747-278bf09f4f4f
    name: Potential Credential Dumping Attempt Via PowerShell Remote Thread
    reason: 'Sibling detection of the identical technique: EID 8 CreateRemoteThread into lsass.exe, scoped to a powershell.exe/pwsh.exe source. If the injector here is PowerShell, both rules describe one and the same event.'
  - id: 8fbf3271-1ef6-4e94-8210-03c2317947f6
    name: Cred Dump Tools Dropped Files
    reason: 'Likely precursor/co-artifact: the password dumper is usually staged on disk before it injects. This EID 11 rule matches WCE''s own dropped files (wceaux.dll, wce_ccache, wce_krbtkts) plus pwdump/fgdump artifacts on the same host.'
  - id: 192a0330-c20b-4356-90b6-7b7049ae0b87
    name: Successful Overpass the Hash Attempt
    reason: 'Direct follow-on that consumes this tool''s output: the NTLM hashes / Kerberos keys harvested from LSASS are reused via a seclogo logonType-9 overpass-the-hash. Hunt the same host/account for forged-ticket logons right after the dump.'
  - id: a5a2d357-1ab8-4675-a967-ef9990a59391
    name: LSASS Process Memory Dump Files
    reason: 'Parallel outcome on the same host: if the actor also persists LSASS memory to disk (lsass.dmp, nanodump, procdump output) instead of only reading it live, this EID 11 rule catches the dump file written for offline cracking or exfiltration.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: LSASS handle-open and unsigned-module injection on this host
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"7" AND data_win_eventdata_image:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_signed:/[Ff][Aa][Ll][Ss][Ee]/)
    pivot_on:
    - host
    window: 1h
  - name: Credential-dumper tool execution and LSASS-dump command lines on this host
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ww][Cc][Ee].*\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz].*/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp].*\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Nn][Aa][Nn][Oo][Dd][Uu][Mm][Pp].*\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Yy][Pp][Yy][Kk][Aa][Tt][Zz].*/ OR data_win_eventdata_image:/.*\\[Dd][Uu][Mm][Pp][Ee][Rr][Tt].*\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Hh][Aa][Nn][Dd][Ll][Ee][Kk][Aa][Tt][Zz].*/ OR data_win_eventdata_image:/.*\\[Ss][Aa][Ff][Ee][Tt][Yy][Kk][Aa][Tt][Zz].*/ OR data_win_eventdata_image:/.*\\[Cc][Rr][Ee][Aa][Tt][Ee][Dd][Uu][Mm][Pp].*\.[Ee][Xx][Ee]/)) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Ll][Oo][Gg][Oo][Nn][Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd][Ss].*/ OR (data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss].*/ AND data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/) OR (data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Ss][Ss].*/ AND data_win_eventdata_commandLine:/.*[Dd][Uu][Mm][Pp].*/)))
    pivot_on:
    - host
    window: 2h
  - name: LSASS memory dump and credential-dumper file artifacts written on this host
    query: (data_win_system_eventID:"11" AND ((data_win_eventdata_targetFilename:/.*\\[Ll][Ss][Aa][Ss][Ss].*/ AND data_win_eventdata_targetFilename:/.*\.[Dd][Mm][Pp].*/) OR data_win_eventdata_targetFilename:/.*[Ll][Ss][Aa][Ss][Ss][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_targetFilename:/.*\\[Nn][Aa][Nn][Oo][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_targetFilename:/.*\\[Ww][Cc][Ee]_[Cc][Cc][Aa][Cc][Hh][Ee].*/ OR data_win_eventdata_targetFilename:/.*\\[Ww][Cc][Ee]_[Kk][Rr][Bb][Tt][Kk][Tt][Ss].*/ OR data_win_eventdata_targetFilename:/.*\\[Ww][Cc][Ee][Aa][Uu][Xx]\.[Dd][Ll][Ll]/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Ww][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Ww][Hh][Aa][Ss][Hh][Ee][Ss].*/ OR data_win_eventdata_targetFilename:/.*\.[Kk][Ii][Rr][Bb][Ii]/))
    pivot_on:
    - host
    window: 2h
  - name: 'Reuse of harvested credentials: overpass / pass-the-hash and NTLM logons'
    query: (data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"9" AND data_win_eventdata_logonProcessName:/[Ss][Ee][Cc][Ll][Oo][Gg][Oo]/) OR (data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3" AND data_win_eventdata_authenticationPackageName:/[Nn][Tt][Ll][Mm].*/) OR (data_win_system_eventID:"4625" AND data_win_eventdata_logonType:"3" AND data_win_eventdata_authenticationPackageName:/[Nn][Tt][Ll][Mm].*/)
    pivot_on:
    - host
    - user
    window: 6h
  - name: Lateral-movement execution from this host after the credential theft
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Pp][Ss][Ee][Xx][Ee][Cc].*\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Aa][Ee][Xx][Ee][Cc].*\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Rr][Ss]\.[Ee][Xx][Ee]/)) OR (data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/)) OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Aa][Dd][Mm][Ii][Nn]\$.*/)
    pivot_on:
    - host
    window: 2h
