name: HackTool - Potential CobaltStrike Process Injection
id: 6309645e-122d-4c5b-bb2b-22e4f9c2fa42
version: 1
schema_version: "1.0"
date: "2023-05-05"
author: Olaf Hartong, Florian Roth (Nextron Systems), Aleksey Potapov, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 6309645e-122d-4c5b-bb2b-22e4f9c2fa42
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a potential remote threat creation with certain characteristics which
  are typical for Cobalt Strike beacons. MITRE ATT&CK: T1055.001.

data_source:
  - Sysmon EventID 8 - CreateRemoteThread

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "8"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_startAddress:
                    value: "*0B80"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_startAddress:
                    value: "*0C7C"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_startAddress:
                    value: "*0C88"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_startAddress
    - data_win_eventdata_sourceImage
    - data_win_eventdata_targetImage

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 8 (CreateRemoteThread) enabled in the Sysmon
  configuration and the Microsoft-Windows-Sysmon/Operational channel collected
  by the Wazuh agent. The detection looks for events where
  data_win_eventdata_startAddress matches '*0B80';
  data_win_eventdata_startAddress matches '*0C7C';
  data_win_eventdata_startAddress matches '*0C88'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://medium.com/@olafhartong/cobalt-strike-remote-threads-detection-206372d11d0f
  - https://blog.cobaltstrike.com/2018/04/09/cobalt-strike-3-11-the-snake-that-eats-its-tail/
  - https://attack.mitre.org/techniques/T1055/001/

response:
  message: >
    HackTool - Potential CobaltStrike Process Injection detected on host
    $agent_name$. Matched data_win_eventdata_startAddress:
    $data_win_eventdata_startAddress$. Matched data_win_eventdata_sourceImage:
    $data_win_eventdata_sourceImage$. MITRE ATT&CK: T1055.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_startAddress
      type: other
    - field: data_win_eventdata_sourceImage
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1055.001
  custom_tags:
    - hacktool
    - cobaltstrike
    - injection
    - create_remote_thread
    - sysmon
    - privilege_escalation
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"8" AND (data_win_eventdata_startAddress:/.*0[Bb]80/ OR data_win_eventdata_startAddress:/.*0[Cc]7[Cc]/ OR data_win_eventdata_startAddress:/.*0[Cc]88/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d5601f8c-b26f-4ab0-9035-69e11a8d4ad2
    name: CobaltStrike Named Pipe
    reason: 'Co-occurring same-beacon artifact and highest-confidence confirmation: the CS fork&run post-exploitation that drives this injection opens SMB-beacon / post-ex named pipes (postex_*, msagent_*, status_*, MSSE-*-server) on the same host, so these pipes appearing alongside the injected thread proves it belongs to a live Cobalt Strike beacon.'
  - id: 85adeb13-4fc9-4e68-8a4a-c7cb2c336eb7
    name: CobaltStrike Named Pipe Patterns
    reason: Co-occurring confirmation from the same beacon using malleable-C2-profile pipe names; firing beside the injection both confirms Cobalt Strike and reveals the operator's custom C2 profile when the default post-ex pipe names have been changed.
  - id: f35c5d71-b489-4e22-a115-f003df287317
    name: Potential CobaltStrike Process Patterns
    reason: 'Co-occurring: the sacrificial spawnto child that CS fork&run creates and injects this remote thread into surfaces as an anomalous Cobalt Strike beacon process tree on the same host, identifying which process now hosts the beacon.'
  - id: ae9c6a7c-9521-42a6-915e-5aaa8689d529
    name: CobaltStrike Load by Rundll32
    reason: 'Likely precursor on the same host: rundll32 using the StartW export to reflectively load the beacon DLL is a common way the Cobalt Strike beacon was already executing before it performed this process injection.'
  - id: f239b326-2f41-4d6b-9dfa-c846a60ef505
    name: Password Dumper Remote Thread in LSASS
    reason: 'Immediate follow-on via the same EID-8 technique: the most common CS fork&run payload (logonpasswords/mimikatz) creates a remote thread into lsass.exe to steal credentials right after the operator gains beacon execution.'
  - id: 843544a7-56e0-4dcc-a44f-5cc266dd97d6
    name: Meterpreter or Cobalt Strike Getsystem Service Installation - System
    reason: 'Follow-on privilege escalation: CS getsystem installs a transient service to steal a SYSTEM token via named-pipe impersonation, routinely run in the same hands-on-keyboard session that performs beacon injection.'
  - id: f376c8a7-a2d0-4ddc-aa0c-16c17236d962
    name: HackTool - Bloodhound/Sharphound Execution
    reason: 'Follow-on discovery: after a beacon is established, CS operators run SharpHound/BloodHound (often in-memory via execute-assembly, which itself uses this fork&run injection) to map Active Directory and plan lateral movement.'
  - id: 02d1d718-dd13-41af-989d-ea85c7fab93f
    name: Rare Remote Thread Creation By Uncommon Source Image
    reason: 'Co-occurring corroboration from an anomaly angle: catches the same beacon''s other fork&run injections on this host whose start address does not end in the three hard-coded CS suffixes, widening coverage of the ongoing injection activity.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Cobalt Strike beacon post-ex / SMB named pipes on this host
    query: (data_win_system_eventID:"17" OR data_win_system_eventID:"18") AND (data_win_eventdata_pipeName:/\\[Pp][Oo][Ss][Tt][Ee][Xx]_.*/ OR data_win_eventdata_pipeName:/\\[Mm][Ss][Aa][Gg][Ee][Nn][Tt]_.*/ OR data_win_eventdata_pipeName:/\\[Ss][Tt][Aa][Tt][Uu][Ss]_.*/ OR data_win_eventdata_pipeName:/\\[Ii][Nn][Tt][Ee][Rr][Pp][Rr][Oo][Cc][Ee][Ss][Ss]_.*/ OR data_win_eventdata_pipeName:/.*[Mm][Ss][Ss][Ee]-.*-[Ss][Ee][Rr][Vv][Ee][Rr].*/)
    pivot_on:
    - host
    window: 1h
  - name: LSASS credential access on this host (process access or remote thread into lsass)
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"8" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: Additional remote-thread injection & shellcode-exec command lines on this host
    query: (data_win_system_eventID:"8") OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee][Rr][Ee][Mm][Oo][Tt][Ee][Tt][Hh][Rr][Ee][Aa][Dd].*/ OR data_win_eventdata_commandLine:/.*[Vv][Ii][Rr][Tt][Uu][Aa][Ll][Aa][Ll][Ll][Oo][Cc].*/ OR data_win_eventdata_commandLine:/.*[Ww][Rr][Ii][Tt][Ee][Pp][Rr][Oo][Cc][Ee][Ss][Ss][Mm][Ee][Mm][Oo][Rr][Yy].*/ OR data_win_eventdata_commandLine:/.*[Qq][Uu][Ee][Uu][Ee][Uu][Ss][Ee][Rr][Aa][Pp][Cc].*/))
    pivot_on:
    - host
    window: 1h
  - name: Spawnto / sacrificial process making network connections on this host (beacon C2)
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*(\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|\\[Dd][Ll][Ll][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]|\\[Ww][Ee][Rr][Ff][Aa][Uu][Ll][Tt]\.[Ee][Xx][Ee]|\\[Gg][Pp][Uu][Pp][Dd][Aa][Tt][Ee]\.[Ee][Xx][Ee]|\\[Ss][Ee][Aa][Rr][Cc][Hh][Pp][Rr][Oo][Tt][Oo][Cc][Oo][Ll][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 2h
  - name: Post-exploitation AD discovery / recon tooling on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*(\\[Nn][Ll][Tt][Ee][Ss][Tt]\.[Ee][Xx][Ee]|\\[Ss][Hh][Aa][Rr][Pp][Hh][Oo][Uu][Nn][Dd]\.[Ee][Xx][Ee]|\\[Aa][Dd][Ff][Ii][Nn][Dd]\.[Ee][Xx][Ee]|\\[Dd][Ss][Qq][Uu][Ee][Rr][Yy]\.[Ee][Xx][Ee])/ OR (data_win_eventdata_image:/.*(\\[Nn][Ee][Tt]\.[Ee][Xx][Ee]|\\[Nn][Ee][Tt]1\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*[Gg][Rr][Oo][Uu][Pp].*/ OR data_win_eventdata_commandLine:/.*[Vv][Ii][Ee][Ww].*/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Mm][Aa][Ii][Nn] [Aa][Dd][Mm][Ii][Nn][Ss].*/)))
    pivot_on:
    - host
    window: 2h
