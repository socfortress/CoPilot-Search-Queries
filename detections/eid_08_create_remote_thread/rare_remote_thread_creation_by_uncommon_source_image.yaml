              - wildcard:
                  data_win_eventdata_sourceImage:
                    value: "*\\\\installutil.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_sourceImage:
                    value: "*\\\\lync.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_sourceImage:
