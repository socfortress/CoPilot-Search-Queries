              - wildcard:
                  data_win_eventdata_sourceImage:
                    value: "*\\\\ping.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_sourceImage:
                    value: "*\\\\provtool.exe"
                    case_insensitive: true
              - wildcard:
