correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a1a144b7-5c9b-4853-a559-2172be8d4a03
    name: Remote Thread Creation In Uncommon Target Image
    reason: 'Target-side view of the exact same CreateRemoteThread (Sysmon EID 8): this rule flags the odd injecting process, that one flags when the thread lands in an unusual target. Firing together on one host shows you both ends of a single injection.'
  - id: 66d31e5f-52d6-40a4-9615-002d3789a119
    name: Remote Thread Creation By Uncommon Source Image
    reason: Sibling EID 8 detection on the same injecting-process angle with a broader source-image baseline; both firing on the host is independent confirmation the remote thread is malicious rather than a baselining gap.
  - id: 6309645e-122d-4c5b-bb2b-22e4f9c2fa42
    name: HackTool - Potential CobaltStrike Process Injection
    reason: Flags the same CreateRemoteThread by the beacon's characteristic thread start address (0x..0b80/0c7c/0c88). If this injection is a Cobalt Strike beacon, both fire on the host and name the C2 framework behind the odd source image.
  - id: 2e4e488a-6164-4811-9ea1-f960c7359c40
    name: HackTool - CACTUSTORCH Remote Thread Creation
    reason: CACTUSTORCH injects from cscript/wscript/mshta/winword/excel into SysWOW64 - the very script and Office source images this rule flags. A CACTUSTORCH payload trips both, pinning the delivery technique.
  - id: f239b326-2f41-4d6b-9dfa-c846a60ef505
    name: Password Dumper Remote Thread in LSASS
    reason: 'The dangerous specialization of this behaviour: a remote thread created directly in lsass.exe to dump credentials (T1003.001). If the uncommon source injects LSASS this fires too, escalating the incident to credential theft.'
  - id: 5ef9853e-4d0e-4a70-846f-a9ca37d876da
    name: Potential Credential Dumping Activity Via LSASS
