              - wildcard:
                  data_win_eventdata_sourceImage:
                    value: "*\\\\winscp.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_sourceImage:
                    value: "*\\\\winword.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_sourceImage:
                    value: "*\\\\wmic.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_sourceImage:
                    value: "*\\\\wscript.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_sourceImage"
        - exists:
            field: "data_win_eventdata_targetImage"
        - bool:
            must_not:
              - bool:
                  should:
                    - bool:
                        must:
                          - bool:
                              should:
                                - term:
                                    data_win_eventdata_sourceImage:
                                      value: "C:\\Windows\\System32\\Defrag.exe"
                                      case_insensitive: true
                                - term:
                                    data_win_eventdata_sourceImage:
                                      value: "C:\\Windows\\System32\\makecab.exe"
                                      case_insensitive: true
                              minimum_should_match: 1
                          - term:
                              data_win_eventdata_targetImage:
                                value: "C:\\Windows\\System32\\conhost.exe"
                                case_insensitive: true
                    - bool:
                        must:
                          - term:
                              data_win_eventdata_sourceImage:
                                value: "C:\\Windows\\System32\\provtool.exe"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_targetImage:
                                value: "C:\\Windows\\System32\\svchost.exe"
                                case_insensitive: true
                    - bool:
                        must:
                          - term:
                              data_win_eventdata_sourceImage:
                                value: "C:\\Windows\\System32\\provtool.exe"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_targetImage:
                                value: "System"
                                case_insensitive: true
                    - bool:
                        must:
                          - term:
                              data_win_eventdata_sourceImage:
                                value: "C:\\Windows\\System32\\userinit.exe"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_targetImage:
                                value: "C:\\Windows\\explorer.exe"
                                case_insensitive: true
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_sourceImage:
                                value: "*\\\\WINWORD.EXE"
                                case_insensitive: true
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_targetImage:
                                      value: "C:\\\\Program Files (x86)\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_targetImage:
                                      value: "C:\\\\Program Files\\\\*"
                                      case_insensitive: true
                              minimum_should_match: 1
                    - bool:
                        must:
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_sourceImage:
                                      value: "C:\\\\Program Files\\\\Microsoft Office\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_sourceImage:
                                      value: "C:\\\\Program Files (x86)\\\\Microsoft Office\\\\*"
                                      case_insensitive: true
                              minimum_should_match: 1
                          - term:
                              data_win_eventdata_targetImage:
                                value: "System"
                                case_insensitive: true
                  minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_sourceImage"
        - exists:
            field: "data_win_eventdata_targetImage"
        - bool:
            must_not:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_sourceImage:
                          value: "*\\\\SysWOW64\\\\explorer.exe"
                          case_insensitive: true
                    - bool:
                        should:
                          - term:
                              data_win_eventdata_targetImage:
                                value: "C:\\Program Files (x86)\\VMware\\VMware Tools\\vmtoolsd.exe"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_targetImage:
                                value: "C:\\Program Files\\VMware\\VMware Tools\\vmtoolsd.exe"
                                case_insensitive: true
                        minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_sourceImage
    - data_win_eventdata_targetImage

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 8 (CreateRemoteThread) enabled in the Sysmon
  configuration and the Microsoft-Windows-Sysmon/Operational channel collected
  by the Wazuh agent. The detection looks for events where
  data_win_eventdata_sourceImage matches '*\bash.exe';
  data_win_eventdata_sourceImage matches '*\cscript.exe';
  data_win_eventdata_sourceImage matches '*\cvtres.exe', among other conditions.

known_false_positives: >
  This rule is best put in testing first in order to create a baseline that
  reflects the data in your environment. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - Personal research, statistical analysis
  - https://lolbas-project.github.io
  - https://attack.mitre.org/techniques/T1055/

response:
  message: >
    Rare Remote Thread Creation By Uncommon Source Image detected on host
    $agent_name$. Matched data_win_eventdata_sourceImage:
    $data_win_eventdata_sourceImage$. Matched data_win_eventdata_targetImage:
    $data_win_eventdata_targetImage$. MITRE ATT&CK: T1055
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_sourceImage
      type: process
    - field: data_win_eventdata_targetImage
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1055
  custom_tags:
    - thread
    - uncommon
