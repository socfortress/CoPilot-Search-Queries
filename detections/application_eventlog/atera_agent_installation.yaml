name: Atera Agent Installation
id: 87261fb2-69d0-42fe-b9de-88c6b5f65a43
version: 1
schema_version: "1.0"
date: "2022-12-25"
author: Bhabesh Raj
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 87261fb2-69d0-42fe-b9de-88c6b5f65a43
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects successful installation of Atera Remote Monitoring & Management (RMM)
  agent as recently found to be used by Conti operators. MITRE ATT&CK:
  T1219.002.

data_source:
  - Windows Application Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "1033"
        - term:
            data_win_system_providerName:
              value: "MsiInstaller"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_message:
              value: "*AteraAgent*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName
    - data_win_eventdata_message

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_eventID equals '1033';
  data_win_system_providerName equals 'MsiInstaller'; data_win_eventdata_message
  matches '*AteraAgent*'.

known_false_positives: >
  Legitimate Atera agent installation. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://www.advintel.io/post/secret-backdoor-behind-conti-ransomware-operation-introducing-atera-agent
  - https://attack.mitre.org/techniques/T1219/002/

response:
  message: >
    Atera Agent Installation detected on host $agent_name$. Matched
    data_win_system_providerName: $data_win_system_providerName$. Matched
    data_win_eventdata_message: $data_win_eventdata_message$. MITRE ATT&CK:
    T1219.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_system_providerName
      type: other
    - field: data_win_eventdata_message
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1219.002
  custom_tags:
    - atera
    - agent
    - installation
    - windows_application
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1033" AND data_win_system_providerName:/[Mm][Ss][Ii][Ii][Nn][Ss][Tt][Aa][Ll][Ll][Ee][Rr]/ AND data_win_eventdata_message:/.*[Aa][Tt][Ee][Rr][Aa][Aa][Gg][Ee][Nn][Tt].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 79a87aa6-e4bd-42fc-a5bb-5e6fbdcd62f5
    name: Msiexec Quiet Installation
    reason: Atera is deployed as a silent MSI; the msiexec /qn process creation is the direct precursor of the MsiInstaller 1033 event
  - id: 8150732a-0c9d-4a99-82b9-9efb9b90c40c
    name: Suspicious Msiexec Quiet Install From Remote Location
    reason: Attackers often pull the Atera MSI straight from the vendor/attacker URL via msiexec, the precursor that produces this install event
  - id: f7b5f842-a6af-4da5-9e95-e32478f3cd2f
    name: MsiExec Web Install
    reason: MSI fetched over HTTP(S) at install time is the typical delivery of the Atera agent package
  - id: b0fd38c7-f71a-43a2-870e-f3ca06bcdd99
    name: Windows HTTP Network Communication From MSIExec
    reason: msiexec reaching out to download the Atera installer is causally linked to the install completing
  - id: 1a31b18a-f00c-4061-9900-f735b96c99fc
    name: Remote Access Tool Services Have Been Installed - System
    reason: Atera registers AteraAgent as a Windows service (7045); this is the service-level confirmation of the same RMM persistence
  - id: 4d07b1f4-cb00-4470-b9f8-b0191d48ff52
    name: DNS Query To Remote Access Software Domain From Non-Browser App
    reason: Newly installed RMM agent beacons to its cloud domains right after install, co-occurring DNS from a non-browser process
  - id: ccad96d7-a48c-4f13-8b9c-9f6a31cba454
    name: Detect Remote Access Software Usage FileInfo
    reason: Atera agent binaries (AteraAgent.exe) match remote-access-software file metadata, confirming the tool is executing on the host
  - id: 42c575ea-e41e-41f1-b248-8093c3e82a28
    name: PsExec Service Installation
    reason: Conti operators using Atera for persistence also spread via PsExec; co-occurring lateral movement expands the host into an incident
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Atera agent process and service activity
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Aa][Tt][Ee][Rr][Aa].*/ OR data_win_eventdata_parentImage:/.*[Aa][Tt][Ee][Rr][Aa][Aa][Gg][Ee][Nn][Tt].*/ OR data_win_eventdata_commandLine:/.*[Aa][Tt][Ee][Rr][Aa][Aa][Gg][Ee][Nn][Tt].*/ OR data_win_eventdata_image:/.*[Aa][Gg][Ee][Nn][Tt][Pp][Aa][Cc][Kk][Aa][Gg][Ee].*/)
    pivot_on:
    - host
    window: 2h
  - name: Atera cloud / PubNub DNS lookups
    query: data_win_system_eventID:"22" AND data_win_eventdata_queryName:/.*([Aa][Tt][Ee][Rr][Aa]\.[Cc][Oo][Mm]|[Pp][Nn][Dd][Ss][Nn]\.[Cc][Oo][Mm]|[Pp][Uu][Bb][Nn][Uu][Bb]\.[Cc][Oo][Mm]).*/
    pivot_on:
    - host
    window: 2h
  - name: MSI installer launch with remote URL or quiet flags
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Mm][Ss][Ii][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp][Ss]?:.*/ OR data_win_eventdata_commandLine:/.*\/[Qq][Nn].*/ OR data_win_eventdata_commandLine:/.*\/[Qq][Uu][Ii][Ee][Tt].*/ OR data_win_eventdata_commandLine:/.*[Aa][Tt][Ee][Rr][Aa].*/)
    pivot_on:
    - host
    window: 1h
  - name: Additional RMM / remote-access tool services or processes
    query: (data_win_system_eventID:"7045" AND (data_win_eventdata_serviceName:/.*([Aa][Nn][Yy][Dd][Ee][Ss][Kk]|[Ss][Pp][Ll][Aa][Ss][Hh][Tt][Oo][Pp]|[Ss][Cc][Rr][Ee][Ee][Nn][Cc][Oo][Nn][Nn][Ee][Cc][Tt]|[Tt][Ee][Aa][Mm][Vv][Ii][Ee][Ww][Ee][Rr]|[Mm][Ee][Ss][Hh][Aa][Gg][Ee][Nn][Tt]|[Nn][Ee][Tt][Ss][Uu][Pp][Pp][Oo][Rr][Tt]|[Tt][Aa][Cc][Tt][Ii][Cc][Aa][Ll][Rr][Mm][Mm]).*/ OR data_win_eventdata_imagePath:/.*([Aa][Nn][Yy][Dd][Ee][Ss][Kk]|[Ss][Pp][Ll][Aa][Ss][Hh][Tt][Oo][Pp]|[Ss][Cc][Rr][Ee][Ee][Nn][Cc][Oo][Nn][Nn][Ee][Cc][Tt]|[Tt][Ee][Aa][Mm][Vv][Ii][Ee][Ww][Ee][Rr]|[Mm][Ee][Ss][Hh][Aa][Gg][Ee][Nn][Tt]).*/)) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Aa][Nn][Yy][Dd][Ee][Ss][Kk]|\\[Ss][Cc][Rr][Ee][Ee][Nn][Cc][Oo][Nn][Nn][Ee][Cc][Tt]|\\[Ss][Rr][Ss][Tt][Rr][Ee][Aa][Mm][Ee][Rr]|\\[Tt][Ee][Aa][Mm][Vv][Ii][Ee][Ww][Ee][Rr]|\\[Mm][Ee][Ss][Hh][Aa][Gg][Ee][Nn][Tt]).*/)
    pivot_on:
    - host
    window: 4h
  - name: Conti-style discovery and lateral tooling after RMM install
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*([Nn][Ll][Tt][Ee][Ss][Tt] \/([Dd][Cc][Ll][Ii][Ss][Tt]|[Dd][Oo][Mm][Aa][Ii][Nn]_[Tt][Rr][Uu][Ss][Tt][Ss])).*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt]1? [Gg][Rr][Oo][Uu][Pp].*[Dd][Oo][Mm][Aa][Ii][Nn] [Aa][Dd][Mm][Ii][Nn][Ss].*/ OR data_win_eventdata_image:/.*(\\[Aa][Dd][Ff][Ii][Nn][Dd]|\\[Pp][Ss][Ee][Xx][Ee][Cc]|\\[Rr][Cc][Ll][Oo][Nn][Ee])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa]|[Ll][Ss][Aa][Ss][Ss]).*[Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*[Dd][Ee][Ll][Ee][Tt][Ee].*/)
    pivot_on:
    - host
    window: 6h
