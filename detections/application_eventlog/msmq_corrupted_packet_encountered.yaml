name: MSMQ Corrupted Packet Encountered
id: ae94b10d-fee9-4767-82bb-439b309d5a27
version: 1
schema_version: "1.0"
date: "2023-04-21"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: ae94b10d-fee9-4767-82bb-439b309d5a27
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects corrupted packets sent to the MSMQ service. Could potentially be a
  sign of CVE-2023-21554 exploitation.

data_source:
  - Windows Application Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_providerName:
              value: "MSMQ"
              case_insensitive: true
        - term:
            data_win_system_eventID: "2027"
        - term:
            data_win_system_level: "2"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName
    - data_win_system_level

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_providerName equals 'MSMQ';
  data_win_system_eventID equals '2027'; data_win_system_level equals '2'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.randori.com/blog/vulnerability-analysis-queuejumper-cve-2023-21554/

response:
  message: >
    MSMQ Corrupted Packet Encountered detected on host $agent_name$. Matched
    data_win_system_providerName: $data_win_system_providerName$. Matched
    data_win_system_level: $data_win_system_level$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_system_providerName
      type: other
    - field: data_win_system_level
      type: other

tags:
  asset_type: Endpoint
  custom_tags:
    - corrupted
    - packet
    - encountered
    - windows_application
    - execution
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_providerName:/[Mm][Ss][Mm][Qq]/ AND data_win_system_eventID:"2027" AND data_win_system_level:"2"

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 53207cc2-0745-4c19-bc72-80be1cc16b3f
    name: Potential CVE-2023-21554 QueueJumper Exploitation
    reason: 'Same CVE-2023-21554 (QueueJumper): the MSMQ corrupted-packet event is the network-side malformed-packet signal; this rule catches the follow-on where mqsvc.exe spawns a child process after successful exploitation.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Child processes spawned by the MSMQ service (mqsvc.exe)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Mm][Qq][Ss][Vv][Cc]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Inbound connections to MSMQ port 1801 and mqsvc network activity
    query: data_win_system_eventID:"3" AND (data_win_eventdata_destinationPort:"1801" OR data_win_eventdata_image:/.*[Mm][Qq][Ss][Vv][Cc]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
  - name: MSMQ service crash or unexpected termination (failed exploit attempt)
    query: data_win_system_eventID:("7031" OR "7034" OR "7023") AND data_win_system_providerName:/[Ss]ervice [Cc]ontrol [Mm]anager/ AND data_win_eventdata_param1:*[Mm]essage*[Qq]ueuing*
    pivot_on:
    - host
    window: 2h
  - name: Files written or loaded by mqsvc.exe (dropped payloads)
    query: (data_win_system_eventID:"11" OR data_win_system_eventID:"7") AND data_win_eventdata_image:/.*[Mm][Qq][Ss][Vv][Cc]\.[Ee][Xx][Ee]/ AND NOT data_win_eventdata_imageLoaded:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\.*/
    pivot_on:
    - host
    window: 2h
