name: Ntdsutil Abuse
id: e6e88853-5f20-4c4a-8d26-cd469fd8d31f
version: 1
schema_version: "1.0"
date: "2022-08-14"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: e6e88853-5f20-4c4a-8d26-cd469fd8d31f
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential abuse of ntdsutil to dump ntds.dit database. MITRE ATT&CK:
  T1003.003.

data_source:
  - Windows Application Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_providerName:
              value: "ESENT"
              case_insensitive: true
        - bool:
            should:
              - term:
                  data_win_system_eventID: "216"
              - term:
                  data_win_system_eventID: "325"
              - term:
                  data_win_system_eventID: "326"
              - term:
                  data_win_system_eventID: "327"
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_data:
              value: "*ntds.dit*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName
    - data_win_eventdata_data

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_providerName equals 'ESENT';
  data_win_system_eventID equals '216'; data_win_system_eventID equals '325',
  among other conditions.

known_false_positives: >
  Legitimate backup operation/creating shadow copies. Baseline expected activity
  in your environment and tune this detection before relying on it for automated
  response.

references:
  - https://twitter.com/mgreen27/status/1558223256704122882
  - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2012-r2-and-2012/jj574207(v=ws.11)
  - https://attack.mitre.org/techniques/T1003/003/

response:
  message: >
    Ntdsutil Abuse detected on host $agent_name$. Matched
    data_win_system_providerName: $data_win_system_providerName$. Matched
    data_win_eventdata_data: $data_win_eventdata_data$. MITRE ATT&CK: T1003.003
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_system_providerName
      type: other
    - field: data_win_eventdata_data
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.003
  custom_tags:
    - ntdsutil
    - abuse
    - windows_application
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_providerName:/[Ee][Ss][Ee][Nn][Tt]/ AND (data_win_system_eventID:"216" OR data_win_system_eventID:"325" OR data_win_system_eventID:"326" OR data_win_system_eventID:"327") AND data_win_eventdata_data:/.*[Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 2afafd61-6aae-4df4-baed-139fa1f4c345
    name: Invocation of Active Directory Diagnostic Tool (ntdsutil.exe)
    reason: Process-creation view of the same ntdsutil.exe execution whose ESENT database-access events fired this alert; confirms the operator and command line.
  - id: da63bc76-61ae-11eb-ae93-0242ac130002
    name: Ntdsutil Export NTDS
    reason: The 'ac i ntds' + 'ifm' + 'create full' command line is exactly what makes ESENT log ntds.dit snapshot events; direct cause of this alert.
  - id: a58353df-af43-4753-bad0-cd83ef35eef5
    name: Suspicious Usage Of Active Directory Diagnostic Tool (ntdsutil.exe)
    reason: Flags ntdsutil with IFM/snapshot arguments; co-occurs with the ESENT ntds.dit events as the same dump operation.
  - id: 94dc4390-6b7c-4784-8ffc-335334404650
    name: Dump Ntds.dit To Suspicious Location
    reason: Same ESENT application-log source; fires when the ntds.dit dump (IFM/snapshot) is written to a staging path such as Temp or ProgramData.
  - id: 11b1ed55-154d-4e82-8ad7-83739298f720
    name: NTDS.DIT Creation By Uncommon Process
    reason: The exported ntds.dit copy lands on disk; file-creation telemetry corroborates the dump and names the writing process.
  - id: c73124a7-3e89-44a3-bdc1-25fe4df754b1
    name: Copy From VolumeShadowCopy Via Cmd.EXE
    reason: Alternative ntds.dit theft path (vssadmin/shadow copy then copy) attackers use alongside or instead of ntdsutil on a DC.
  - id: 3a8da4e0-36c1-40d2-8b29-b3e890d5172a
    name: NTDS Exfiltration Filename Patterns
    reason: After the dump, the ntds.dit/SYSTEM hive is staged under characteristic filenames for exfiltration; direct follow-on.
  - id: fd877b94-9bb5-4191-bb25-d79cbd93c167
    name: Dumping of Sensitive Hives Via Reg.EXE
    reason: ntds.dit is useless offline without the SYSTEM hive boot key; attackers run reg save SYSTEM/SAM in the same operation.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: ntdsutil / IFM / shadow-copy commands on this DC
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll]|[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*[Cc][Rr][Ee][Aa][Tt][Ee] [Ss][Hh][Aa][Dd][Oo][Ww]|[Dd][Ii][Ss][Kk][Ss][Hh][Aa][Dd][Oo][Ww]|[Ww][Bb][Aa][Dd][Mm][Ii][Nn].*[Nn][Tt][Dd][Ss]|[Aa][Cc][Tt][Ii][Vv][Aa][Tt][Ee] [Ii][Nn][Ss][Tt][Aa][Nn][Cc][Ee]|[Ii][Ff][Mm]).*/)
    pivot_on:
    - host
    window: 1h
  - name: ntds.dit / SYSTEM hive files created or copied (staging)
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt].*/ OR data_win_eventdata_targetFilename:/.*[Ee][Ss][Ee][Nn][Tt]\.[Dd][Ii][Tt].*/ OR data_win_eventdata_targetFilename:/.*\\[Rr]egistry\\[Ss][Yy][Ss][Tt][Ee][Mm].*/ OR data_win_eventdata_targetFilename:/.*[Ss][Yy][Ss][Tt][Ee][Mm]\.[Hh][Ii][Vv][Ee].*/)
    pivot_on:
    - host
    window: 2h
  - name: Archiving or exfil tooling after dump (compress/transfer)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Rr][Aa][Rr]|7[Zz]|7[Zz][Aa]|[Ww][Ii][Nn][Rr][Aa][Rr]|[Cc][Uu][Rr][Ll]|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]|[Ss][Cc][Pp]|[Rr][Cc][Ll][Oo][Nn][Ee])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Cc]ompress-[Aa]rchive|[Ii]nvoke-[Ww]eb[Rr]equest|[Nn]et [Uu]se|[Tt]ar -).*/)
    pivot_on:
    - host
    window: 4h
  - name: Credential tooling / DCSync-style activity after ntds access
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ss]ecretsdump|[Mm]imikatz|[Ll]sadump|[Dd][Cc][Ss]ync|[Dd][Ss][Ii][Nn][Tt][Ee][Rr][Nn][Aa][Ll][Ss]|[Dd][Ss][Ii][Nn][Tt][Ee][Rr][Nn][Aa][Ll][Ss]|[Ll][Ss][Aa][Dd][Uu][Mm][Pp]|[Rr][Ee][Gg](\.[Ee][Xx][Ee])? [Ss][Aa][Vv][Ee]).*/
    pivot_on:
    - host
    window: 4h
  - name: Domain admin / privileged logons from this account (credential reuse)
    query: data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"10" OR data_win_eventdata_logonType:"9")
    pivot_on:
    - user
    window: 6h
