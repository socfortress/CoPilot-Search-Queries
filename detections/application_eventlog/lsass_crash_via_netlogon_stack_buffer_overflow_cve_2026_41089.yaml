name: LSASS Crash Via Netlogon Stack Buffer Overflow - CVE-2026-41089
id: f8a66a02-4a16-46e5-b7fd-a42c8a93d137
version: 1
schema_version: "1.0"
date: "2026-06-02"
author: Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: f8a66a02-4a16-46e5-b7fd-a42c8a93d137
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a crash of the LSASS process where netlogon.dll is the faulting module
  and the exception code is STATUS_STACK_BUFFER_OVERRUN (0xc0000409). This
  crash, especially on Domain Controllers, might indicate the exploitation of
  CVE-2026-41089, a denial of service (DoS) vulnerability, which exists in the
  Netlogon component of Windows and can be triggered by sending specially
  crafted requests to the Netlogon service, leading to a stack-based buffer
  overflow and subsequent crash of the LSASS process. MITRE ATT&CK: T1499.

data_source:
  - Windows Application Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_providerName:
              value: "Application Error"
              case_insensitive: true
        - term:
            data_win_system_eventID: "1000"
        - term:
            data_win_eventdata_appName:
              value: "lsass.exe"
              case_insensitive: true
        - term:
            data_win_eventdata_moduleName:
              value: "netlogon.dll"
              case_insensitive: true
        - term:
            data_win_eventdata_exceptionCode:
              value: "c0000409"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName
    - data_win_eventdata_appName
    - data_win_eventdata_moduleName
    - data_win_eventdata_exceptionCode

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_providerName equals 'Application Error';
  data_win_system_eventID equals '1000'; data_win_eventdata_appName equals
  'lsass.exe', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://aretiq.ai/research/vul260513-cve-2026-41089-microsoft-windows-netlogon-buildsamlogonresponse-stack-based-buffer-overflow-rce/
  - https://learn.microsoft.com/en-us/shows/inside/c0000409
  - https://github.com/p3Nt3st3r-sTAr/CVE-2026-41089
  - https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-41089
  - https://attack.mitre.org/techniques/T1499/

response:
  message: >
    LSASS Crash Via Netlogon Stack Buffer Overflow - CVE-2026-41089 detected on
    host $agent_name$. Matched data_win_system_providerName:
    $data_win_system_providerName$. Matched data_win_eventdata_appName:
    $data_win_eventdata_appName$. MITRE ATT&CK: T1499
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_system_providerName
      type: other
    - field: data_win_eventdata_appName
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1499
  custom_tags:
    - lsass
    - crash
    - netlogon
    - windows_application
    - impact
    - cve_2026_41089
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_providerName:/[Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn] [Ee][Rr][Rr][Oo][Rr]/ AND data_win_system_eventID:"1000" AND data_win_eventdata_appName:/[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_moduleName:/[Nn][Ee][Tt][Ll][Oo][Gg][Oo][Nn]\.[Dd][Ll][Ll]/ AND data_win_eventdata_exceptionCode:/[Cc]0000409/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a0cb7110-edf0-47a4-9177-541a4083128a
    name: Vulnerable Netlogon Secure Channel Connection Allowed
    reason: Netlogon event 5829 on the same DC shows a client abusing the Netlogon secure channel just before the overflow; the attacker is already speaking crafted Netlogon RPC to this DC.
  - id: dcc6a01e-9471-44a0-a699-71ea96f8ed8b
    name: Exploitation Attempt Of CVE-2020-1472 - Execution of ZeroLogon PoC
    reason: Same Netlogon attack surface; attackers probing the DC with Netlogon exploit tooling (ZeroLogon) often try the newer overflow in the same session, from the same attacker host.
  - id: a18e0862-127b-43ca-be12-1a542c75c7c5
    name: LSASS Process Crashed - Application
    reason: Generic LSASS Application Error crash; co-fires with this rule and distinguishes a Netlogon-specific overflow from other LSASS faults (a repeated crash suggests exploit retries).
  - id: 882fbe50-d8d7-4e29-ae80-0648a8556866
    name: Crash Dump Created By Operating System
    reason: An LSASS crash produces a memory dump; the dump can hold shellcode/exploit payload and credentials and indicates the crash was a real fault, not a log artifact.
  - id: 41243735-89a7-4c83-bcdd-570aa78f00a1
    name: Domain Controller Discovery with Nltest
    reason: Attackers locate and fingerprint domain controllers with nltest before targeting Netlogon on them; a precursor on a neighbouring host.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Netlogon secure channel anomalies and DC state events
    query: data_win_system_providerName:/[Nn][Ee][Tt][Ll][Oo][Gg][Oo][Nn]/ AND (data_win_system_eventID:"5827" OR data_win_system_eventID:"5828" OR data_win_system_eventID:"5829" OR data_win_system_eventID:"5830" OR data_win_system_eventID:"5831" OR data_win_system_eventID:"3210")
    pivot_on:
    - host
    window: 2h
  - name: Forced restart or critical-process failure after LSASS crash
    query: (data_win_system_eventID:"1074" OR data_win_system_eventID:"6008" OR data_win_system_eventID:"1015" OR data_win_system_eventID:"1001") AND (data_win_system_providerName:/[Uu]ser32/ OR data_win_system_providerName:/[Ww]ininit/ OR data_win_system_providerName:/[Ee]vent[Ll]og/ OR data_win_system_providerName:/[Ww]indows [Ee]rror [Rr]eporting/ OR data_win_system_providerName:/[Bb]ug[Cc]heck/)
    pivot_on:
    - host
    window: 1h
  - name: Processes spawned by LSASS (possible exploit success)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Remote shell or tooling execution on the DC
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Cc][Mm][Dd]|\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|\\[Pp][Ww][Ss][Hh]|\\[Nn][Ee][Tt][Ss][Hh]|\\[Ww][Mm][Ii][Cc])\.[Ee][Xx][Ee]/ AND (data_win_eventdata_parentImage:/.*(\\[Ww][Ee][Rr][Ff][Aa][Uu][Ll][Tt]|\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]|\\[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee]|\\[Ww][Ii][Nn][Ii][Nn][Ii][Tt])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Nn][Tt][Dd][Ss]|[Nn][Ee][Tt] [Uu][Ss][Ee][Rr]|[Nn][Ee][Tt] [Gg][Rr][Oo][Uu][Pp]|[Nn][Ll][Tt][Ee][Ss][Tt]).*/)
    pivot_on:
    - host
    window: 2h
  - name: Outbound connections from LSASS or WerFault on the DC
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*(\\[Ll][Ss][Aa][Ss][Ss]|\\[Ww][Ee][Rr][Ff][Aa][Uu][Ll][Tt])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
