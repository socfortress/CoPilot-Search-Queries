name: Dump Ntds.dit To Suspicious Location
id: 94dc4390-6b7c-4784-8ffc-335334404650
version: 1
schema_version: "1.0"
date: "2023-10-23"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 94dc4390-6b7c-4784-8ffc-335334404650
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential abuse of ntdsutil to dump ntds.dit database to a suspicious
  location.

data_source:
  - Windows Application Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_providerName:
              value: "ESENT"
              case_insensitive: true
        - term:
            data_win_system_eventID: "325"
        - wildcard:
            data_win_eventdata_data:
              value: "*ntds.dit*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_data:
                    value: "*:\\\\ntds.dit*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_data:
                    value: "*\\\\Appdata\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_data:
                    value: "*\\\\Desktop\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_data:
                    value: "*\\\\Downloads\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_data:
                    value: "*\\\\Perflogs\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_data:
                    value: "*\\\\Temp\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_data:
                    value: "*\\\\Users\\\\Public\\\\*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName
    - data_win_eventdata_data

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_providerName equals 'ESENT';
  data_win_system_eventID equals '325'; data_win_eventdata_data matches
  '*ntds.dit*', among other conditions.

known_false_positives: >
  Legitimate backup operation/creating shadow copies. Baseline expected activity
  in your environment and tune this detection before relying on it for automated
  response.

references:
  - https://twitter.com/mgreen27/status/1558223256704122882
  - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2012-r2-and-2012/jj574207(v=ws.11)

response:
  message: >
    Dump Ntds.dit To Suspicious Location detected on host $agent_name$. Matched
    data_win_system_providerName: $data_win_system_providerName$. Matched
    data_win_eventdata_data: $data_win_eventdata_data$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_system_providerName
      type: other
    - field: data_win_eventdata_data
      type: other

tags:
  asset_type: Endpoint
  custom_tags:
    - location
    - windows_application
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_providerName:/[Ee][Ss][Ee][Nn][Tt]/ AND data_win_system_eventID:"325" AND data_win_eventdata_data:/.*[Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt].*/ AND (data_win_eventdata_data:/.*:\\[Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt].*/ OR data_win_eventdata_data:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_data:/.*\\[Dd][Ee][Ss][Kk][Tt][Oo][Pp]\\.*/ OR data_win_eventdata_data:/.*\\[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]\\.*/ OR data_win_eventdata_data:/.*\\[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss]\\.*/ OR data_win_eventdata_data:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_data:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/)

correlation:
  # Authored by the correlation engine for review.
  enrichment_searches:
  # NEW ad-hoc searches the engine runs around an alert from this rule, scoped to
  # the alert's host/user/IP within the window (not existing CoPilot Searches).
    - name: "Sysmon activity on this host in the window"
      query: 'data_win_system_channel:"Microsoft-Windows-Sysmon/Operational"'
      pivot_on: [host]
      window: 1h
    - name: "Process creation on this host"
      query: 'data_win_system_eventID:"1"'
      pivot_on: [host]
      window: 1h
    - name: "Network connections from this host"
      query: 'data_win_system_eventID:"3"'
      pivot_on: [host]
      window: 1h
    - name: "High-severity alerts on this host"
      query: 'rule_level:>=10'
      pivot_on: [host]
      window: 1h
