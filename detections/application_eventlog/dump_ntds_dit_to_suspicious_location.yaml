name: Dump Ntds.dit To Suspicious Location
id: 94dc4390-6b7c-4784-8ffc-335334404650
version: 1
schema_version: "1.0"
date: "2023-10-23"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 94dc4390-6b7c-4784-8ffc-335334404650
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential abuse of ntdsutil to dump ntds.dit database to a suspicious
  location.

data_source:
  - Windows Application Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_providerName:
              value: "ESENT"
              case_insensitive: true
        - term:
            data_win_system_eventID: "325"
        - wildcard:
            data_win_eventdata_data:
              value: "*ntds.dit*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_data:
                    value: "*:\\\\ntds.dit*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_data:
                    value: "*\\\\Appdata\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_data:
                    value: "*\\\\Desktop\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_data:
                    value: "*\\\\Downloads\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_data:
                    value: "*\\\\Perflogs\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_data:
                    value: "*\\\\Temp\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_data:
                    value: "*\\\\Users\\\\Public\\\\*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName
    - data_win_eventdata_data

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_providerName equals 'ESENT';
  data_win_system_eventID equals '325'; data_win_eventdata_data matches
  '*ntds.dit*', among other conditions.

known_false_positives: >
  Legitimate backup operation/creating shadow copies. Baseline expected activity
  in your environment and tune this detection before relying on it for automated
  response.

references:
  - https://twitter.com/mgreen27/status/1558223256704122882
  - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2012-r2-and-2012/jj574207(v=ws.11)

response:
  message: >
    Dump Ntds.dit To Suspicious Location detected on host $agent_name$. Matched
    data_win_system_providerName: $data_win_system_providerName$. Matched
    data_win_eventdata_data: $data_win_eventdata_data$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_system_providerName
      type: other
    - field: data_win_eventdata_data
      type: other

tags:
  asset_type: Endpoint
  custom_tags:
    - location
    - windows_application
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_providerName:/[Ee][Ss][Ee][Nn][Tt]/ AND data_win_system_eventID:"325" AND data_win_eventdata_data:/.*[Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt].*/ AND (data_win_eventdata_data:/.*:\\[Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt].*/ OR data_win_eventdata_data:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_data:/.*\\[Dd][Ee][Ss][Kk][Tt][Oo][Pp]\\.*/ OR data_win_eventdata_data:/.*\\[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]\\.*/ OR data_win_eventdata_data:/.*\\[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss]\\.*/ OR data_win_eventdata_data:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_data:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e6e88853-5f20-4c4a-8d26-cd469fd8d31f
    name: Ntdsutil Abuse
    reason: 'Same ESENT application-log source: ntdsutil IFM/snapshot activity also logs ESENT database events, so both fire for one ntds.dit dump and confirm the tool path.'
  - id: da63bc76-61ae-11eb-ae93-0242ac130002
    name: Ntdsutil Export NTDS
    reason: Process-creation view of the ntdsutil 'ac i ntds' + 'ifm' + 'create full' command line that produces the ESENT 325 event; gives the operator and parent process.
  - id: a58353df-af43-4753-bad0-cd83ef35eef5
    name: Suspicious Usage Of Active Directory Diagnostic Tool (ntdsutil.exe)
    reason: Same ntdsutil invocation seen from the command line; ntdsutil spawned from an unusual parent or with IFM arguments precedes the ntds.dit being written to the staging path.
  - id: 2afafd61-6aae-4df4-baed-139fa1f4c345
    name: Invocation of Active Directory Diagnostic Tool (ntdsutil.exe)
    reason: Broad ntdsutil execution on a DC is the direct precursor that triggers the ESENT snapshot/copy event.
  - id: b17ea6f7-6e90-447e-a799-e6c0a493d6ce
    name: Shadow Copies Creation Using Operating Systems Utilities
    reason: Attackers often create a VSS shadow copy (vssadmin/wmic/diskshadow) as the alternative or preceding step to copy a locked ntds.dit; co-occurs on the same DC.
  - id: 11b1ed55-154d-4e82-8ad7-83739298f720
    name: NTDS.DIT Creation By Uncommon Process
    reason: 'Follow-on file-creation evidence: the dumped ntds.dit (and SYSTEM hive) landing on disk written by a non-standard process in the same suspicious folder.'
  - id: 3a8da4e0-36c1-40d2-8b29-b3e890d5172a
    name: NTDS Exfiltration Filename Patterns
    reason: After the dump, the ntds.dit/SYSTEM/SECURITY files are renamed or archived with typical staging names before leaving the DC.
  - id: 17d619c1-e020-4347-957e-1d1207455c93
    name: Active Directory Replication from Non Machine Account
    reason: Alternative/parallel domain credential theft (DCSync) by the same actor; offline ntds.dit dump and DCSync often appear together in domain-compromise operations.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: ntdsutil / IFM or shadow-copy tooling executed on this DC
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Dd][Ii][Ss][Kk][Ss][Hh][Aa][Dd][Oo][Ww]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ee][Ss][Ee][Nn][Tt][Uu][Tt][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Ii][Ff][Mm]|[Cc][Rr][Ee][Aa][Tt][Ee] [Ff][Uu][Ll][Ll]|[Aa][Cc][Tt][Ii][Vv][Aa][Tt][Ee] [Ii][Nn][Ss][Tt][Aa][Nn][Cc][Ee]|[Ss][Hh][Aa][Dd][Oo][Ww][Cc][Oo][Pp][Yy]).*/)
    pivot_on:
    - host
    window: 1h
  - name: ntds.dit, SYSTEM or SAM hive files written to disk
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt].*/ OR data_win_eventdata_targetFilename:/.*\\[Ss][Yy][Ss][Tt][Ee][Mm]\.([Hh][Ii][Vv][Ee]|[Bb][Aa][Kk]|[Ss][Aa][Vv][Ee]).*/ OR data_win_eventdata_targetFilename:/.*\\[Ss][Aa][Mm]\.([Hh][Ii][Vv][Ee]|[Bb][Aa][Kk]|[Ss][Aa][Vv][Ee]).*/ OR data_win_eventdata_targetFilename:/.*\\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]\.([Hh][Ii][Vv][Ee]|[Bb][Aa][Kk]|[Ss][Aa][Vv][Ee]).*/)
    pivot_on:
    - host
    window: 1h
  - name: Registry hive export (reg save SYSTEM/SAM/SECURITY) alongside the dump
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Rr][Ee][Gg](\.[Ee][Xx][Ee])? +[Ss][Aa][Vv][Ee].*[Hh][Kk][Ll][Mm]\\([Ss][Yy][Ss][Tt][Ee][Mm]|[Ss][Aa][Mm]|[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]).*/
    pivot_on:
    - host
    window: 2h
  - name: Archiving or staging of ntds.dit / hive dumps for exfiltration
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt]|[Hh][Kk][Ll][Mm]\\[Ss][Yy][Ss][Tt][Ee][Mm]|[Ss][Yy][Ss][Tt][Ee][Mm]\.[Hh][Ii][Vv][Ee]).*/ AND (data_win_eventdata_commandLine:/.*([Mm][Aa][Kk][Ee][Cc][Aa][Bb]|[Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]-[Aa][Rr][Cc][Hh][Ii][Vv][Ee]|7[Zz]|[Rr][Aa][Rr]|[Zz][Ii][Pp]|[Cc][Uu][Rr][Ll]|[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]|[Cc][Oo][Pp][Yy]|[Xx][Cc][Oo][Pp][Yy]).*/)
    pivot_on:
    - host
    window: 4h
  - name: Outbound transfer by exfil or archive tools from this DC
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*(\\[Rr][Cc][Ll][Oo][Nn][Ee]\.[Ee][Xx][Ee]|\\[Ww][Ii][Nn][Ss][Cc][Pp]\.[Ee][Xx][Ee]|\\[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]|\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]|\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\7[Zz]\.[Ee][Xx][Ee]).*/
    pivot_on:
    - host
    window: 4h
