name: MSSQL Destructive Query
id: 00321fee-ca72-4cce-b011-5415af3b9960
version: 1
schema_version: "1.0"
date: "2025-06-04"
author: Daniel Degasperi '@d4ns4n_'
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 00321fee-ca72-4cce-b011-5415af3b9960
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the invocation of MS SQL transactions that are destructive towards
  table or database data, such as "DROP TABLE" or "DROP DATABASE". MITRE ATT&CK:
  T1485.

data_source:
  - Windows Application Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_providerName:
              value: "MSSQLSERVER$AUDIT"
              case_insensitive: true
        - term:
            data_win_system_eventID: "33205"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_data:
                    value: "*statement:TRUNCATE TABLE*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_data:
                    value: "*statement:DROP TABLE*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_data:
                    value: "*statement:DROP DATABASE*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName
    - data_win_eventdata_data

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_providerName equals 'MSSQLSERVER$AUDIT';
  data_win_system_eventID equals '33205'; data_win_eventdata_data matches
  '*statement:TRUNCATE TABLE*', among other conditions.

known_false_positives: >
  Legitimate transaction from a sysadmin. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://learn.microsoft.com/en-us/sql/t-sql/statements/drop-table-transact-sql?view=sql-server-ver16
  - https://learn.microsoft.com/en-us/sql/t-sql/statements/drop-database-transact-sql?view=sql-server-ver16
  - https://learn.microsoft.com/en-us/sql/t-sql/statements/truncate-table-transact-sql?view=sql-server-ver16
  - https://attack.mitre.org/techniques/T1485/

response:
  message: >
    MSSQL Destructive Query detected on host $agent_name$. Matched
    data_win_system_providerName: $data_win_system_providerName$. Matched
    data_win_eventdata_data: $data_win_eventdata_data$. MITRE ATT&CK: T1485
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_system_providerName
      type: other
    - field: data_win_eventdata_data
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1485
  custom_tags:
    - mssql
    - destructive
    - query
    - windows_application
    - exfiltration
    - impact
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_providerName:/[Mm][Ss][Ss][Qq][Ll][Ss][Ee][Rr][Vv][Ee][Rr]\$[Aa][Uu][Dd][Ii][Tt]/ AND data_win_system_eventID:"33205" AND (data_win_eventdata_data:/.*[Ss][Tt][Aa][Tt][Ee][Mm][Ee][Nn][Tt]:[Tt][Rr][Uu][Nn][Cc][Aa][Tt][Ee] [Tt][Aa][Bb][Ll][Ee].*/ OR data_win_eventdata_data:/.*[Ss][Tt][Aa][Tt][Ee][Mm][Ee][Nn][Tt]:[Dd][Rr][Oo][Pp] [Tt][Aa][Bb][Ll][Ee].*/ OR data_win_eventdata_data:/.*[Ss][Tt][Aa][Tt][Ee][Mm][Ee][Nn][Tt]:[Dd][Rr][Oo][Pp] [Dd][Aa][Tt][Aa][Bb][Aa][Ss][Ee].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: ebfe73c2-5bc9-4ed9-aaa8-8b54b2b4777d
    name: MSSQL Server Failed Logon From External Network
    reason: 'Precursor: brute-forced or sprayed SQL logins from outside are a common way the attacker gained the session that later issues DROP/TRUNCATE.'
  - id: 08200f85-2678-463e-9c32-88dce2f073d1
    name: MSSQL Add Account To Sysadmin Role
    reason: 'Precursor: privilege escalation to sysadmin gives the attacker the rights needed to drop databases and tables.'
  - id: d08dd86f-681e-4a00-a92c-1db218754417
    name: MSSQL XPCmdshell Option Change
    reason: 'Precursor: enabling xp_cmdshell turns SQL access into OS command execution, commonly staged before data destruction.'
  - id: 7f103213-a04e-4d59-8261-213dddf22314
    name: MSSQL XPCmdshell Suspicious Execution
    reason: 'Co-occurring: xp_cmdshell running suspicious commands on the same SQL instance suggests a hands-on attacker, not a DBA mistake.'
  - id: 350dfb37-3706-4cdc-9e2e-5e24bc3a46df
    name: MSSQL Disable Audit Settings
    reason: 'Defense evasion: attacker disables SQL audit before or after destructive statements to hide the 33205 trail.'
  - id: 869b9ca7-9ea2-4a5a-8325-e80e62f75445
    name: Suspicious Child Process Of SQL Server
    reason: 'Follow-on: sqlservr.exe spawning shells or tools shows the SQL compromise pivoting to the OS.'
  - id: c615d676-f655-46b9-b913-78729021e5d7
    name: Data Export From MSSQL Table Via BCP.EXE
    reason: 'Precursor: bulk export of tables before dropping them indicates data theft plus destruction (extortion pattern).'
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: 'Follow-on: destroying DB data is often paired with deleting shadow copies to block recovery in ransomware/wiper impact.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other SQL Server audit statements by the same instance (backup/offline/delete/permission changes)
    query: data_win_system_providerName:/[Mm][Ss][Ss][Qq][Ll][Ss][Ee][Rr][Vv][Ee][Rr]\$[Aa][Uu][Dd][Ii][Tt]/ AND data_win_system_eventID:"33205" AND (data_win_eventdata_data:/.*[Ss][Tt][Aa][Tt][Ee][Mm][Ee][Nn][Tt]:(([Aa][Ll][Tt][Ee][Rr] [Dd][Aa][Tt][Aa][Bb][Aa][Ss][Ee])|([Dd][Ee][Ll][Ee][Tt][Ee] [Ff][Rr][Oo][Mm])|([Bb][Aa][Cc][Kk][Uu][Pp])|([Ee][Xx][Ee][Cc]).*([Ss][Pp]_[Aa][Dd][Dd][Ss][Rr][Vv][Rr][Oo][Ll][Ee][Mm][Ee][Mm][Bb][Ee][Rr]|[Xx][Pp]_[Cc][Mm][Dd][Ss][Hh][Ee][Ll][Ll])|([Cc][Rr][Ee][Aa][Tt][Ee] [Ll][Oo][Gg][Ii][Nn])|([Aa][Ll][Tt][Ee][Rr] [Ll][Oo][Gg][Ii][Nn])).*/)
    pivot_on:
    - host
    window: 2h
  - name: Processes spawned by sqlservr.exe (OS pivot from SQL)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ss][Qq][Ll][Ss][Ee][Rr][Vv][Rr]\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Cc][Mm][Dd]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]|[Ww][Hh][Oo][Aa][Mm][Ii]|[Nn][Ee][Tt]1?|[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]|[Cc][Uu][Rr][Ll]|[Mm][Ss][Hh][Tt][Aa]|[Rr][Uu][Nn][Dd][Ll][Ll]32)\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: 'Recovery inhibition: backup, shadow copy and boot-recovery destruction'
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*[Dd][Ee][Ll][Ee][Tt][Ee].*[Ss][Hh][Aa][Dd][Oo][Ww][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ww][Bb][Aa][Dd][Mm][Ii][Nn].*[Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Bb][Cc][Dd][Ee][Dd][Ii][Tt].*([Rr][Ee][Cc][Oo][Vv][Ee][Rr][Yy][Ee][Nn][Aa][Bb][Ll][Ee][Dd]|[Ii][Gg][Nn][Oo][Rr][Ee][Aa][Ll][Ll][Ff][Aa][Ii][Ll][Uu][Rr][Ee][Ss]).*/ OR data_win_eventdata_commandLine:/.*[Ww][Mm][Ii][Cc].*[Ss][Hh][Aa][Dd][Oo][Ww][Cc][Oo][Pp][Yy].*[Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Aa][Gg][Ee][Nn][Tt][Cc].*\/[Dd][Ii][Ss][Aa][Bb][Ll][Ee].*/)
    pivot_on:
    - host
    window: 2h
  - name: SQL data export or dump tooling (bcp, sqlcmd, osql) before destruction
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Bb][Cc][Pp]|[Ss][Qq][Ll][Cc][Mm][Dd]|[Oo][Ss][Qq][Ll]|[Ss][Qq][Ll][Dd][Uu][Mm][Pp][Ee][Rr])\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.* (out|queryout) .*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Ll][Ee][Cc][Tt] .* [Ff][Rr][Oo][Mm] .*/ OR data_win_eventdata_commandLine:/.*[Bb][Aa][Cc][Kk][Uu][Pp] [Dd][Aa][Tt][Aa][Bb][Aa][Ss][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Qq][Ll][Dd][Uu][Mm][Pp][Ee][Rr].*/)
    pivot_on:
    - host
    window: 4h
  - name: Failed or remote logons against the SQL host (credential attack precursor)
    query: (data_win_system_eventID:"4625" OR (data_win_system_eventID:"4624" AND data_win_eventdata_logonType:("3" OR "10")) OR (data_win_system_providerName:/[Mm][Ss][Ss][Qq][Ll][Ss][Ee][Rr][Vv][Ee][Rr]/ AND data_win_system_eventID:"18456"))
    pivot_on:
    - host
    window: 6h
