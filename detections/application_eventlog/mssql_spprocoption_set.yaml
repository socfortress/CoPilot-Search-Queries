name: MSSQL SPProcoption Set
id: b3d57a5c-c92e-4b48-9a79-5f124b7cf964
version: 1
schema_version: "1.0"
date: "2024-06-26"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: b3d57a5c-c92e-4b48-9a79-5f124b7cf964
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects when the a stored procedure is set or cleared for automatic execution
  in MSSQL. A stored procedure that is set to automatic execution runs every
  time an instance of SQL Server is started.

data_source:
  - Windows Application Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - wildcard:
            data_win_system_providerName:
              value: "*MSSQL*"
              case_insensitive: true
        - term:
            data_win_system_eventID: "33205"
        - wildcard:
            data_win_eventdata_data:
              value: "*object_name:sp_procoption*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_data:
              value: "*statement:EXEC*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName
    - data_win_eventdata_data

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_providerName matches '*MSSQL*';
  data_win_system_eventID equals '33205'; data_win_eventdata_data matches
  '*object_name:sp_procoption*', among other conditions.

known_false_positives: >
  Legitimate use of the feature by administrators (rare). Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://www.netspi.com/blog/technical/network-penetration-testing/sql-server-persistence-part-1-startup-stored-procedures/
  - https://learn.microsoft.com/en-us/sql/relational-databases/system-stored-procedures/sp-procoption-transact-sql?view=sql-server-ver16

response:
  message: >
    MSSQL SPProcoption Set detected on host $agent_name$. Matched
    data_win_system_providerName: $data_win_system_providerName$. Matched
    data_win_eventdata_data: $data_win_eventdata_data$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_system_providerName
      type: other
    - field: data_win_eventdata_data
      type: other

tags:
  asset_type: Endpoint
  custom_tags:
    - mssql
    - spprocoption
    - windows_application
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_providerName:/.*[Mm][Ss][Ss][Qq][Ll].*/ AND data_win_system_eventID:"33205" AND data_win_eventdata_data:/.*[Oo][Bb][Jj][Ee][Cc][Tt]_[Nn][Aa][Mm][Ee]:[Ss][Pp]_[Pp][Rr][Oo][Cc][Oo][Pp][Tt][Ii][Oo][Nn].*/ AND data_win_eventdata_data:/.*[Ss][Tt][Aa][Tt][Ee][Mm][Ee][Nn][Tt]:[Ee][Xx][Ee][Cc].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 08200f85-2678-463e-9c32-88dce2f073d1
    name: MSSQL Add Account To Sysadmin Role
    reason: sp_procoption needs sysadmin; a just-added sysadmin login is the usual precursor to planting a startup procedure
  - id: d08dd86f-681e-4a00-a92c-1db218754417
    name: MSSQL XPCmdshell Option Change
    reason: Attackers enable xp_cmdshell so the startup procedure can run OS commands; same SQL session, same host
  - id: 7f103213-a04e-4d59-8261-213dddf22314
    name: MSSQL XPCmdshell Suspicious Execution
    reason: A startup proc is typically a wrapper around xp_cmdshell; this shows the payload actually executing
  - id: 711ab2fe-c9ba-4746-8840-5228a58c3cb8
    name: MSSQL Extended Stored Procedure Backdoor Maggie
    reason: Alternate SQL Server persistence implant; co-occurs when the attacker stacks persistence mechanisms
  - id: 350dfb37-3706-4cdc-9e2e-5e24bc3a46df
    name: MSSQL Disable Audit Settings
    reason: Attackers disable auditing to hide the proc registration or its follow-on activity
  - id: 869b9ca7-9ea2-4a5a-8325-e80e62f75445
    name: Suspicious Child Process Of SQL Server
    reason: Startup procedure or xp_cmdshell payload surfaces as cmd/powershell spawned by sqlservr.exe
  - id: ebfe73c2-5bc9-4ed9-aaa8-8b54b2b4777d
    name: MSSQL Server Failed Logon From External Network
    reason: Brute force or spraying of SA/SQL logins is a common initial access path preceding this persistence
  - id: 00321fee-ca72-4cce-b011-5415af3b9960
    name: MSSQL Destructive Query
    reason: Post-persistence or ransomware-style destructive SQL activity on the same instance
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Processes spawned by sqlservr.exe (startup proc / xp_cmdshell payload)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Ss][Qq][Ll][Ss][Ee][Rr][Vv][Rr]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 4h
  - name: SQL Server audit events for xp_cmdshell, sysadmin grants and sp_configure
    query: data_win_system_providerName:/.*[Mm][Ss][Ss][Qq][Ll].*/ AND data_win_eventdata_data:(*xp_cmdshell* OR *sp_addsrvrolemember* OR *sp_configure* OR *sp_procoption* OR *sp_OACreate* OR *ALTER\ SERVER\ ROLE*)
    pivot_on:
    - host
    window: 4h
  - name: Network connections initiated by sqlservr.exe
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Ss][Qq][Ll][Ss][Ee][Rr][Vv][Rr]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 4h
  - name: Files dropped by sqlservr.exe (webshell, payload, dumps)
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*[Ss][Qq][Ll][Ss][Ee][Rr][Vv][Rr]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 4h
