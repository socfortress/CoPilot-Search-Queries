name: MSSQL Add Account To Sysadmin Role
id: 08200f85-2678-463e-9c32-88dce2f073d1
version: 1
schema_version: "1.0"
date: "2024-06-26"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 08200f85-2678-463e-9c32-88dce2f073d1
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects when an attacker tries to backdoor the MSSQL server by adding a
  backdoor account to the sysadmin fixed server role.

data_source:
  - Windows Application Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - wildcard:
            data_win_system_providerName:
              value: "*MSSQL*"
              case_insensitive: true
        - term:
            data_win_system_eventID: "33205"
        - wildcard:
            data_win_eventdata_data:
              value: "*object_name:sysadmin*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_data:
              value: "*statement:alter server role [sysadmin] add member *"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName
    - data_win_eventdata_data

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_providerName matches '*MSSQL*';
  data_win_system_eventID equals '33205'; data_win_eventdata_data matches
  '*object_name:sysadmin*', among other conditions.

known_false_positives: >
  Rare legitimate administrative activity. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://www.netspi.com/blog/technical/network-penetration-testing/sql-server-persistence-part-1-startup-stored-procedures/

response:
  message: >
    MSSQL Add Account To Sysadmin Role detected on host $agent_name$. Matched
    data_win_system_providerName: $data_win_system_providerName$. Matched
    data_win_eventdata_data: $data_win_eventdata_data$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_system_providerName
      type: other
    - field: data_win_eventdata_data
      type: other

tags:
  asset_type: Endpoint
  custom_tags:
    - mssql
    - account
    - sysadmin
    - windows_application
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_providerName:/.*[Mm][Ss][Ss][Qq][Ll].*/ AND data_win_system_eventID:"33205" AND data_win_eventdata_data:/.*[Oo][Bb][Jj][Ee][Cc][Tt]_[Nn][Aa][Mm][Ee]:[Ss][Yy][Ss][Aa][Dd][Mm][Ii][Nn].*/ AND data_win_eventdata_data:/.*[Ss][Tt][Aa][Tt][Ee][Mm][Ee][Nn][Tt]:[Aa][Ll][Tt][Ee][Rr] [Ss][Ee][Rr][Vv][Ee][Rr] [Rr][Oo][Ll][Ee] \[[Ss][Yy][Ss][Aa][Dd][Mm][Ii][Nn]\] [Aa][Dd][Dd] [Mm][Ee][Mm][Bb][Ee][Rr] .*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: ebfe73c2-5bc9-4ed9-aaa8-8b54b2b4777d
    name: MSSQL Server Failed Logon From External Network
    reason: 'Precursor: external brute force or password spraying against SQL logins (often sa) that ends with a compromised login being used to add a sysadmin.'
  - id: d08dd86f-681e-4a00-a92c-1db218754417
    name: MSSQL XPCmdshell Option Change
    reason: 'Typical next or adjacent step: once sysadmin is held, the attacker enables xp_cmdshell via sp_configure to get OS command execution.'
  - id: 7f103213-a04e-4d59-8261-213dddf22314
    name: MSSQL XPCmdshell Suspicious Execution
    reason: 'Follow-on: the new sysadmin account is used to run OS commands through xp_cmdshell.'
  - id: b3d57a5c-c92e-4b48-9a79-5f124b7cf964
    name: MSSQL SPProcoption Set
    reason: 'Persistence companion: the referenced NetSPI technique pairs a backdoor sysadmin with a startup stored procedure (sp_procoption) so access survives restarts.'
  - id: 711ab2fe-c9ba-4746-8840-5228a58c3cb8
    name: MSSQL Extended Stored Procedure Backdoor Maggie
    reason: Alternate SQL Server persistence/backdoor installed by a sysadmin after privilege escalation.
  - id: 350dfb37-3706-4cdc-9e2e-5e24bc3a46df
    name: MSSQL Disable Audit Settings
    reason: 'Defense evasion: attacker holding sysadmin disables SQL auditing to hide the backdoor account and later activity.'
  - id: 869b9ca7-9ea2-4a5a-8325-e80e62f75445
    name: Suspicious Child Process Of SQL Server
    reason: Host-level confirmation that the sysadmin access is being used to spawn shells or tools from sqlservr.exe.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Shell or tool spawned by sqlservr.exe on this host
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Ss][Qq][Ll][Ss][Ee][Rr][Vv][Rr]\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Cc][Mm][Dd]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]|[Ww][Hh][Oo][Aa][Mm][Ii]|[Nn][Ee][Tt]1?)\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 4h
  - name: MSSQL audit events for xp_cmdshell, sp_configure, sp_procoption or new logins
    query: data_win_system_providerName:/.*[Mm][Ss][Ss][Qq][Ll].*/ AND data_win_system_eventID:"33205" AND (data_win_eventdata_data:/.*[Xx][Pp]_[Cc][Mm][Dd][Ss][Hh][Ee][Ll][Ll].*/ OR data_win_eventdata_data:/.*[Ss][Pp]_[Cc][Oo][Nn][Ff][Ii][Gg][Uu][Rr][Ee].*/ OR data_win_eventdata_data:/.*[Ss][Pp]_[Pp][Rr][Oo][Cc][Oo][Pp][Tt][Ii][Oo][Nn].*/ OR data_win_eventdata_data:/.*[Cc][Rr][Ee][Aa][Tt][Ee] [Ll][Oo][Gg][Ii][Nn].*/ OR data_win_eventdata_data:/.*[Aa][Ll][Tt][Ee][Rr] [Ll][Oo][Gg][Ii][Nn].*/)
    pivot_on:
    - host
    window: 4h
  - name: Failed SQL Server logons (login failed) preceding the privilege change
    query: data_win_system_providerName:/.*[Mm][Ss][Ss][Qq][Ll].*/ AND data_win_system_eventID:"18456"
    pivot_on:
    - host
    window: 24h
  - name: Network connections from sqlservr.exe on this host
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Ss][Qq][Ll][Ss][Ee][Rr][Vv][Rr]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 4h
  - name: Files written by sqlservr.exe (webshell, payload, bcp export drops)
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*[Ss][Qq][Ll][Ss][Ee][Rr][Vv][Rr]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 4h
