name: MSI Installation From Suspicious Locations
id: c7c8aa1c-5aff-408e-828b-998e3620b341
version: 1
schema_version: "1.0"
date: "2023-10-23"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: c7c8aa1c-5aff-408e-828b-998e3620b341
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects MSI package installation from suspicious locations.

data_source:
  - Windows Application Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_providerName:
              value: "MsiInstaller"
              case_insensitive: true
        - bool:
            should:
              - term:
                  data_win_system_eventID: "1040"
              - term:
                  data_win_system_eventID: "1042"
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_data:
                    value: "*:\\\\Windows\\\\TEMP\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_data: "*\\\\\\\\*"
              - wildcard:
                  data_win_eventdata_data:
                    value: "*\\\\Desktop\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_data:
                    value: "*\\\\PerfLogs\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_data:
                    value: "*\\\\Users\\\\Public\\\\*"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_data"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_data:
                          value: "*\\\\AppData\\\\Local\\\\Temp\\\\WinGet\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_data:
                          value: "*C:\\\\Windows\\\\TEMP\\\\UpdHealthTools.msi*"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName
    - data_win_eventdata_data

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_providerName equals 'MsiInstaller';
  data_win_system_eventID equals '1040'; data_win_system_eventID equals '1042',
  among other conditions.

known_false_positives: >
  False positives may occur if you allow installation from folders such as the
  desktop, the public folder or remote shares. A baseline is required before
  production use. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.trendmicro.com/en_us/research/22/h/ransomware-actor-abuses-genshin-impact-anti-cheat-driver-to-kill-antivirus.html

response:
  message: >
    MSI Installation From Suspicious Locations detected on host $agent_name$.
    Matched data_win_system_providerName: $data_win_system_providerName$.
    Matched data_win_eventdata_data: $data_win_eventdata_data$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_system_providerName
      type: other
    - field: data_win_eventdata_data
      type: other

tags:
  asset_type: Endpoint
  custom_tags:
    - installation
    - locations
    - windows_application
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_providerName:/[Mm][Ss][Ii][Ii][Nn][Ss][Tt][Aa][Ll][Ll][Ee][Rr]/ AND (data_win_system_eventID:"1040" OR data_win_system_eventID:"1042") AND (data_win_eventdata_data:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_data:/.*\\\\.*/ OR data_win_eventdata_data:/.*\\[Dd][Ee][Ss][Kk][Tt][Oo][Pp]\\.*/ OR data_win_eventdata_data:/.*\\[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss]\\.*/ OR data_win_eventdata_data:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/) AND _exists_:data_win_eventdata_data AND NOT (data_win_eventdata_data:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\[Ww][Ii][Nn][Gg][Ee][Tt]\\.*/ OR data_win_eventdata_data:/.*[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\[Uu][Pp][Dd][Hh][Ee][Aa][Ll][Tt][Hh][Tt][Oo][Oo][Ll][Ss]\.[Mm][Ss][Ii].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 5594e67a-7f92-4a04-b65d-1a42fd824a60
    name: MSI Installation From Web
    reason: 'Sibling MsiInstaller event: the same package may have been pulled from a URL before being staged in Temp/Public/Desktop, confirming remote delivery.'
  - id: 8150732a-0c9d-4a99-82b9-9efb9b90c40c
    name: Suspicious Msiexec Quiet Install From Remote Location
    reason: 'Process-creation view of the same install: msiexec /q against a UNC or URL path is the launch command behind the 1040/1042 event on a share.'
  - id: 79a87aa6-e4bd-42fc-a5bb-5e6fbdcd62f5
    name: Msiexec Quiet Installation
    reason: Silent msiexec invocation is how a dropped MSI is installed without user interaction, the exact action that produced this event.
  - id: f7b5f842-a6af-4da5-9e95-e32478f3cd2f
    name: MsiExec Web Install
    reason: msiexec fetching a remote MSI directly is the delivery precursor to an install logged from a staged path.
  - id: b0fd38c7-f71a-43a2-870e-f3ca06bcdd99
    name: Windows HTTP Network Communication From MSIExec
    reason: Malicious MSI custom actions commonly call out over HTTP from msiexec.exe to download a second stage or beacon, the immediate follow-on to installation.
  - id: 6f4191bb-912b-48a8-9ce7-682769541e6d
    name: Suspicious Msiexec Execute Arbitrary DLL
    reason: msiexec /y or /z loading a DLL is an alternate proxy-execution use of the same binary and indicates an attacker abusing the installer for code execution.
  - id: 1e53dd56-8d83-4eb4-a43e-b790a05510aa
    name: Always Install Elevated MSI Spawned Cmd And Powershell
    reason: 'An installed MSI spawning cmd or PowerShell as SYSTEM is the payload stage: the staged package ran a shell to execute attacker commands.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: msiexec process launch and its child processes
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*[Mm][Ss][Ii][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Mm][Ss][Ii][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*(\/[Qq]|\/[Pp][Aa][Ss][Ss][Ii][Vv][Ee]|[Hh][Tt][Tt][Pp]|\\\\|[Tt][Ee][Mm][Pp]|[Pp][Uu][Bb][Ll][Ii][Cc]|[Dd][Ee][Ss][Kk][Tt][Oo][Pp]).*/ OR data_win_eventdata_image:/.*(\\[Cc][Mm][Dd]|\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|\\[Rr][Uu][Nn][Dd][Ll][Ll]32|\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|\\[Mm][Ss][Hh][Tt][Aa])\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
  - name: MSI or executable dropped into staging folders
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\.[Mm][Ss][Ii]/ OR data_win_eventdata_targetFilename:/.*\.[Mm][Ss][Tt]/) AND (data_win_eventdata_targetFilename:/.*([Tt][Ee][Mm][Pp]|[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]|[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss]|[Dd][Ee][Ss][Kk][Tt][Oo][Pp]|[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]).*/)
    pivot_on:
    - host
    window: 2h
  - name: Network connections initiated by msiexec or installer-dropped binaries
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*[Mm][Ss][Ii][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*([Tt][Ee][Mm][Pp]|[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]|[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss]).*/) AND data_win_eventdata_initiated:"true"
    pivot_on:
    - host
    window: 2h
  - name: New service or autostart installed after MSI install
    query: (data_win_system_eventID:"7045" OR data_win_system_eventID:"4697") OR ((data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND data_win_eventdata_targetObject:/.*([Cc][Uu][Rr][Rr][Ee][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt]\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]|[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn]).*/)
    pivot_on:
    - host
    window: 4h
  - name: Remote-access tool or C2 domain lookups from installer-related processes
    query: data_win_system_eventID:"22" AND (data_win_eventdata_image:/.*[Mm][Ss][Ii][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*([Tt][Ee][Mm][Pp]|[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]|[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss]).*/ OR data_win_eventdata_queryName:/.*([Aa][Nn][Yy][Dd][Ee][Ss][Kk]|[Ss][Cc][Rr][Ee][Ee][Nn][Cc][Oo][Nn][Nn][Ee][Cc][Tt]|[Tt][Ee][Aa][Mm][Vv][Ii][Ee][Ww][Ee][Rr]|[Nn][Gg][Rr][Oo][Kk]|[Mm][Ee][Ss][Hh][Cc][Ee][Nn][Tt][Rr][Aa][Ll]).*/)
    pivot_on:
    - host
    window: 2h
