name: MSI Installation From Web
id: 5594e67a-7f92-4a04-b65d-1a42fd824a60
version: 1
schema_version: "1.0"
date: "2022-10-23"
author: Stamatis Chatzimangou
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 5594e67a-7f92-4a04-b65d-1a42fd824a60
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects installation of a remote msi file from web. MITRE ATT&CK: T1218,
  T1218.007.

data_source:
  - Windows Application Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_providerName:
              value: "MsiInstaller"
              case_insensitive: true
        - bool:
            should:
              - term:
                  data_win_system_eventID: "1040"
              - term:
                  data_win_system_eventID: "1042"
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_data: "*://*"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName
    - data_win_eventdata_data

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_providerName equals 'MsiInstaller';
  data_win_system_eventID equals '1040'; data_win_system_eventID equals '1042',
  among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/_st0pp3r_/status/1583922009842802689
  - https://attack.mitre.org/techniques/T1218/
  - https://attack.mitre.org/techniques/T1218/007/

response:
  message: >
    MSI Installation From Web detected on host $agent_name$. Matched
    data_win_system_providerName: $data_win_system_providerName$. Matched
    data_win_eventdata_data: $data_win_eventdata_data$. MITRE ATT&CK: T1218,
    T1218.007
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_system_providerName
      type: other
    - field: data_win_eventdata_data
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218
    - T1218.007
  custom_tags:
    - installation
    - windows_application
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_providerName:/[Mm][Ss][Ii][Ii][Nn][Ss][Tt][Aa][Ll][Ll][Ee][Rr]/ AND (data_win_system_eventID:"1040" OR data_win_system_eventID:"1042") AND data_win_eventdata_data:/.*:\/\/.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: f7b5f842-a6af-4da5-9e95-e32478f3cd2f
    name: MsiExec Web Install
    reason: 'Process-creation view of the same act: msiexec /i http(s)://... produces the MsiInstaller URL event and exposes the launching parent and command line.'
  - id: 79a87aa6-e4bd-42fc-a5bb-5e6fbdcd62f5
    name: Msiexec Quiet Installation
    reason: Remote MSI fetch is paired with /q silent switches so no UI appears; co-occurring quiet msiexec indicates unattended payload deployment.
  - id: 222720a7-047f-4054-baa5-bab9be757db0
    name: PowerShell MSI Install via WindowsInstaller COM From Remote Location
    reason: Scripted alternative delivery of a remote MSI via the WindowsInstaller COM object, producing the same MsiInstaller URL event.
  - id: c7c8aa1c-5aff-408e-828b-998e3620b341
    name: MSI Installation From Suspicious Locations
    reason: 'Sibling MsiInstaller event: a downloaded MSI cached under Temp/Downloads/AppData then installed from that staging path.'
  - id: 90d50722-0483-4065-8e35-57efaadd354d
    name: Arbitrary MSI Download Via Devinit.EXE
    reason: LOLBin that fetches and installs a remote MSI; an alternative precursor yielding the same web-sourced install.
  - id: 87261fb2-69d0-42fe-b9de-88c6b5f65a43
    name: Atera Agent Installation
    reason: Remote MSIs commonly deliver RMM agents such as Atera, giving the attacker persistent interactive access right after install.
  - id: 114e7f1c-f137-48c8-8f54-3088c24ce4b9
    name: Remote Access Tool - AnyDesk Silent Installation
    reason: Another remote-access payload pushed as a silent installer after a web download, establishing hands-on-keyboard access.
  - id: 57b649ef-ff42-4fb0-8bf6-62da243a1708
    name: Windows Defender Threat Detected
    reason: Defender flagging the dropped installer or its payload around install time confirms the MSI was malicious, not a legitimate rollout.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: msiexec launched with remote URL or silent switch
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Mm][Ss][Ii][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp][Ss]?:\/\/.*/ OR data_win_eventdata_commandLine:/.*[Qq][Uu][Ii][Ee][Tt].*/ OR data_win_eventdata_commandLine:/.* \/[Qq][Nn]?[Bb]?( .*)?/)
    pivot_on:
    - host
    window: 2h
  - name: Script/Office/downloader parent invoking an MSI install
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*(\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|\\[Pp][Ww][Ss][Hh]|\\[Cc][Mm][Dd]|\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|\\[Mm][Ss][Hh][Tt][Aa]|\\[Ww][Ii][Nn][Ww][Oo][Rr][Dd]|\\[Ee][Xx][Cc][Ee][Ll]|\\[Cc][Uu][Rr][Ll]|\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]|\\[Rr][Uu][Nn][Dd][Ll][Ll]32).*/ AND data_win_eventdata_commandLine:/.*([Mm][Ss][Ii][Ee][Xx][Ee][Cc]|\.[Mm][Ss][Ii]).*/
    pivot_on:
    - host
    window: 2h
  - name: Suspicious children of msiexec (MSI custom action payload)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Mm][Ss][Ii][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_image:/.*(\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]|\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]|\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]|\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|\\[Ss][Cc]\.[Ee][Xx][Ee]|\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]|\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee])/ OR data_win_eventdata_image:/.*\\([Tt][Ee][Mm][Pp]|[Aa][Pp][Pp][Dd][Aa][Tt][Aa]|[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa])\\.*/)
    pivot_on:
    - host
    window: 2h
  - name: Outbound network or DNS activity from msiexec
    query: (data_win_system_eventID:"3" OR data_win_system_eventID:"22") AND data_win_eventdata_image:/.*(\\[Mm][Ss][Ii][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 2h
  - name: Persistence or RMM agent set up after MSI install
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss].*\/[Cc][Rr][Ee][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc]( |\.[Ee][Xx][Ee] )+[Cc][Rr][Ee][Aa][Tt][Ee].*/ OR data_win_eventdata_image:/.*(\\[Aa][Nn][Yy][Dd][Ee][Ss][Kk]\.[Ee][Xx][Ee]|\\[Ss][Cc][Rr][Ee][Ee][Nn][Cc][Oo][Nn][Nn][Ee][Cc][Tt]\.[Cc][Ll][Ii][Ee][Nn][Tt][Ss][Ee][Rr][Vv][Ii][Cc][Ee]\.[Ee][Xx][Ee]|\\[Aa][Tt][Ee][Rr][Aa][Aa][Gg][Ee][Nn][Tt]\.[Ee][Xx][Ee]|\\[Mm][Ee][Ss][Hh][Aa][Gg][Ee][Nn][Tt]\.[Ee][Xx][Ee]|\\[Tt][Ee][Aa][Mm][Vv][Ii][Ee][Ww][Ee][Rr]_[Ss][Ee][Rr][Vv][Ii][Cc][Ee]\.[Ee][Xx][Ee])/)) OR (data_win_system_eventID:"13" AND data_win_eventdata_image:/.*(\\[Mm][Ss][Ii][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee])/ AND data_win_eventdata_targetObject:/.*\\([Rr][Uu][Nn]|[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss])\\.*/)
    pivot_on:
    - host
    window: 4h
