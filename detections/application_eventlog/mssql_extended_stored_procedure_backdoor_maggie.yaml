name: MSSQL Extended Stored Procedure Backdoor Maggie
id: 711ab2fe-c9ba-4746-8840-5228a58c3cb8
version: 1
schema_version: "1.0"
date: "2022-10-09"
author: Denis Szadkowski, DIRT / DCSO CyTec
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 711ab2fe-c9ba-4746-8840-5228a58c3cb8
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  This rule detects the execution of the extended storage procedure backdoor
  named Maggie in the context of Microsoft SQL server. MITRE ATT&CK: T1546.

data_source:
  - Windows Application Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_providerName:
              value: "MSSQLSERVER"
              case_insensitive: true
        - term:
            data_win_system_eventID: "8128"
        - wildcard:
            data_win_eventdata_message:
              value: "*maggie*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName
    - data_win_eventdata_message

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_providerName equals 'MSSQLSERVER';
  data_win_system_eventID equals '8128'; data_win_eventdata_message matches
  '*maggie*'.

known_false_positives: >
  Legitimate extended stored procedures named maggie. Baseline expected activity
  in your environment and tune this detection before relying on it for automated
  response.

references:
  - https://medium.com/@DCSO_CyTec/mssql-meet-maggie-898773df3b01
  - https://attack.mitre.org/techniques/T1546/

response:
  message: >
    MSSQL Extended Stored Procedure Backdoor Maggie detected on host
    $agent_name$. Matched data_win_system_providerName:
    $data_win_system_providerName$. Matched data_win_eventdata_message:
    $data_win_eventdata_message$. MITRE ATT&CK: T1546
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_system_providerName
      type: other
    - field: data_win_eventdata_message
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1546
  custom_tags:
    - mssql
    - extended
    - stored
    - windows_application
    - privilege_escalation
    - persistence
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_providerName:/[Mm][Ss][Ss][Qq][Ll][Ss][Ee][Rr][Vv][Ee][Rr]/ AND data_win_system_eventID:"8128" AND data_win_eventdata_message:/.*[Mm][Aa][Gg][Gg][Ii][Ee].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 08200f85-2678-463e-9c32-88dce2f073d1
    name: MSSQL Add Account To Sysadmin Role
    reason: Registering an extended stored procedure DLL requires sysadmin; a freshly added sysadmin login is the likely precursor to installing Maggie.
  - id: d08dd86f-681e-4a00-a92c-1db218754417
    name: MSSQL XPCmdshell Option Change
    reason: Attacker with sysadmin often enables xp_cmdshell alongside or before loading Maggie as a second OS-command channel on the same SQL server.
  - id: 7f103213-a04e-4d59-8261-213dddf22314
    name: MSSQL XPCmdshell Suspicious Execution
    reason: Co-occurring OS command execution through SQL Server; Maggie and xp_cmdshell are alternative ways to run commands from sqlservr.exe.
  - id: b3d57a5c-c92e-4b48-9a79-5f124b7cf964
    name: MSSQL SPProcoption Set
    reason: sp_procoption makes a stored procedure auto-run at SQL Server start, a persistence step that pairs with a backdoor procedure like Maggie.
  - id: 350dfb37-3706-4cdc-9e2e-5e24bc3a46df
    name: MSSQL Disable Audit Settings
    reason: Attackers disable SQL auditing to hide installation and use of the backdoor; indicates deliberate defense evasion around the same event.
  - id: ebfe73c2-5bc9-4ed9-aaa8-8b54b2b4777d
    name: MSSQL Server Failed Logon From External Network
    reason: Brute-force or probing of the SQL login from outside is the typical initial access that leads to sysadmin and Maggie installation.
  - id: 869b9ca7-9ea2-4a5a-8325-e80e62f75445
    name: Suspicious Child Process Of SQL Server
    reason: Maggie executes commands via sqlservr.exe, so shells or LOLBins spawned by sqlservr.exe are the direct operational follow-on.
  - id: 00321fee-ca72-4cce-b011-5415af3b9960
    name: MSSQL Destructive Query
    reason: Post-compromise destructive SQL (drop/truncate) on the same server can follow backdoor access, indicating sabotage or ransomware staging.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Child processes spawned by sqlservr.exe (Maggie command execution)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ss][Qq][Ll][Ss][Ee][Rr][Vv][Rr]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: DLL files created in SQL Server Binn directory
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Mm][Ss][Ss][Qq][Ll].*\\[Bb][Ii][Nn][Nn]\\.*\.[Dd][Ll][Ll]/
    pivot_on:
    - host
    window: 24h
  - name: Non-standard DLL image loads into sqlservr.exe
    query: data_win_system_eventID:"7" AND data_win_eventdata_image:/.*\\[Ss][Qq][Ll][Ss][Ee][Rr][Vv][Rr]\.[Ee][Xx][Ee]/ AND data_win_eventdata_imageLoaded:/.*\\[Bb][Ii][Nn][Nn]\\.*\.[Dd][Ll][Ll]/ AND NOT data_win_eventdata_imageLoaded:/.*[Mm][Aa][Gg][Gg][Ii][Ee]/
    pivot_on:
    - host
    window: 6h
  - name: Outbound network connections from sqlservr.exe
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\[Ss][Qq][Ll][Ss][Ee][Rr][Vv][Rr]\.[Ee][Xx][Ee]/ AND data_win_eventdata_initiated:"true"
    pivot_on:
    - host
    window: 2h
  - name: SQL Server errors and extended proc registration in Application log
    query: 'data_win_system_providerName:/[Mm][Ss][Ss][Qq][Ll][Ss][Ee][Rr][Vv][Ee][Rr]/ AND (data_win_system_eventID:"8128" OR data_win_system_eventID:"15457" OR data_win_system_eventID:"17135") '
    pivot_on:
    - host
    window: 24h
