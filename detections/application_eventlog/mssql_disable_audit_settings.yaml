name: MSSQL Disable Audit Settings
id: 350dfb37-3706-4cdc-9e2e-5e24bc3a46df
version: 1
schema_version: "1.0"
date: "2024-06-26"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 350dfb37-3706-4cdc-9e2e-5e24bc3a46df
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects when an attacker calls the "ALTER SERVER AUDIT" or "DROP SERVER AUDIT"
  transaction in order to delete or disable audit logs on the server.

data_source:
  - Windows Application Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - wildcard:
            data_win_system_providerName:
              value: "*MSSQL*"
              case_insensitive: true
        - term:
            data_win_system_eventID: "33205"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_data:
                    value: "*statement:ALTER SERVER AUDIT*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_data:
                    value: "*statement:DROP SERVER AUDIT*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName
    - data_win_eventdata_data

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_providerName matches '*MSSQL*';
  data_win_system_eventID equals '33205'; data_win_eventdata_data matches
  '*statement:ALTER SERVER AUDIT*', among other conditions.

known_false_positives: >
  This event should only fire when an administrator is modifying the audit
  policy. Which should be a rare occurrence once it's set up. Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://www.netspi.com/blog/technical/network-penetration-testing/sql-server-persistence-part-1-startup-stored-procedures/
  - https://learn.microsoft.com/en-us/sql/t-sql/statements/drop-server-audit-transact-sql?view=sql-server-ver16
  - https://learn.microsoft.com/en-us/sql/t-sql/statements/alter-server-audit-transact-sql?view=sql-server-ver16

response:
  message: >
    MSSQL Disable Audit Settings detected on host $agent_name$. Matched
    data_win_system_providerName: $data_win_system_providerName$. Matched
    data_win_eventdata_data: $data_win_eventdata_data$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_system_providerName
      type: other
    - field: data_win_eventdata_data
      type: other

tags:
  asset_type: Endpoint
  custom_tags:
    - mssql
    - disable
    - audit
    - windows_application
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_providerName:/.*[Mm][Ss][Ss][Qq][Ll].*/ AND data_win_system_eventID:"33205" AND (data_win_eventdata_data:/.*[Ss][Tt][Aa][Tt][Ee][Mm][Ee][Nn][Tt]:[Aa][Ll][Tt][Ee][Rr] [Ss][Ee][Rr][Vv][Ee][Rr] [Aa][Uu][Dd][Ii][Tt].*/ OR data_win_eventdata_data:/.*[Ss][Tt][Aa][Tt][Ee][Mm][Ee][Nn][Tt]:[Dd][Rr][Oo][Pp] [Ss][Ee][Rr][Vv][Ee][Rr] [Aa][Uu][Dd][Ii][Tt].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 08200f85-2678-463e-9c32-88dce2f073d1
    name: MSSQL Add Account To Sysadmin Role
    reason: Attacker typically gains or grants sysadmin (required for ALTER/DROP SERVER AUDIT) before blinding auditing; both are same-instance privilege-then-cover-tracks steps.
  - id: d08dd86f-681e-4a00-a92c-1db218754417
    name: MSSQL XPCmdshell Option Change
    reason: Enabling xp_cmdshell is the classic action that audit is disabled to hide; the two together indicate OS-command preparation on the SQL instance.
  - id: 7f103213-a04e-4d59-8261-213dddf22314
    name: MSSQL XPCmdshell Suspicious Execution
    reason: Actual OS command execution through xp_cmdshell is the likely follow-on once auditing is turned off.
  - id: b3d57a5c-c92e-4b48-9a79-5f124b7cf964
    name: MSSQL SPProcoption Set
    reason: sp_procoption startup stored procedures are the persistence mechanism referenced by this rule's NetSPI source; set alongside audit disabling to persist unseen.
  - id: 711ab2fe-c9ba-4746-8840-5228a58c3cb8
    name: MSSQL Extended Stored Procedure Backdoor Maggie
    reason: Malicious extended stored procedure DLL (Maggie) installed on the same instance; audit tampering hides its registration.
  - id: ebfe73c2-5bc9-4ed9-aaa8-8b54b2b4777d
    name: MSSQL Server Failed Logon From External Network
    reason: Brute force or probing of the SQL login that precedes initial access and later audit tampering.
  - id: 00321fee-ca72-4cce-b011-5415af3b9960
    name: MSSQL Destructive Query
    reason: Destructive statements (DROP/TRUNCATE) are the objective audit logging is disabled to conceal.
  - id: 869b9ca7-9ea2-4a5a-8325-e80e62f75445
    name: Suspicious Child Process Of SQL Server
    reason: sqlservr.exe spawning shells/LOLBins is the OS-level evidence of command execution from the compromised SQL instance.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: MSSQL privilege, xp_cmdshell and login changes on this instance
    query: data_win_system_providerName:/.*[Mm][Ss][Ss][Qq][Ll].*/ AND (data_win_system_eventID:"15457" OR data_win_system_eventID:"33205") AND (data_win_eventdata_data:/.*([Xx][Pp]_[Cc][Mm][Dd][Ss][Hh][Ee][Ll][Ll]|[Ss][Pp]_[Aa][Dd][Dd][Ss][Rr][Vv][Rr][Oo][Ll][Ee][Mm][Ee][Mm][Bb][Ee][Rr]|[Aa][Ll][Tt][Ee][Rr] [Ss][Ee][Rr][Vv][Ee][Rr] [Rr][Oo][Ll][Ee]|[Cc][Rr][Ee][Aa][Tt][Ee] [Ll][Oo][Gg][Ii][Nn]|[Aa][Ll][Tt][Ee][Rr] [Ll][Oo][Gg][Ii][Nn]|[Ss][Pp]_[Pp][Rr][Oo][Cc][Oo][Pp][Tt][Ii][Oo][Nn]|[Oo][Pp][Ee][Nn][Rr][Oo][Ww][Ss][Ee][Tt]).*/)
    pivot_on:
    - host
    window: 4h
  - name: Processes spawned by sqlservr.exe on this host
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ss][Qq][Ll][Ss][Ee][Rr][Vv][Rr]\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\(cmd|powershell|pwsh|wscript|cscript|certutil|bitsadmin|whoami|net|net1|rundll32|regsvr32|mshta)\.exe/
    pivot_on:
    - host
    window: 2h
  - name: Log clearing or audit-policy tampering at OS level on this host
    query: (data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.* (cl|clear-log|sl|set-log) .*/) OR (data_win_eventdata_image:/.*\\[Aa][Uu][Dd][Ii][Tt][Pp][Oo][Ll]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*(clear|remove|disable|\/success:disable|\/failure:disable).*/))) OR data_win_system_eventID:"1102" OR data_win_system_eventID:"104"
    pivot_on:
    - host
    window: 2h
  - name: MSSQL logon failures and successes (18456 / 18454) on this instance
    query: data_win_system_providerName:/.*[Mm][Ss][Ss][Qq][Ll].*/ AND (data_win_system_eventID:"18456" OR data_win_system_eventID:"18454")
    pivot_on:
    - host
    window: 24h
  - name: DLL or executable files written by sqlservr.exe (extended procedure / payload drop)
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*\\[Ss][Qq][Ll][Ss][Ee][Rr][Vv][Rr]\.[Ee][Xx][Ee]/ AND data_win_eventdata_targetFilename:/.*\.(dll|exe|ps1|bat|vbs)/
    pivot_on:
    - host
    window: 4h
