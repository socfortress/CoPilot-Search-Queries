name: Audit CVE Event
id: 48d91a3a-2363-43ba-a456-ca71ac3da5c2
version: 1
schema_version: "1.0"
date: "2022-10-22"
author: Florian Roth (Nextron Systems), Zach Mathis
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 48d91a3a-2363-43ba-a456-ca71ac3da5c2
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects events generated by user-mode applications when they call the
  CveEventWrite API when a known vulnerability is trying to be exploited. MS
  started using this log in Jan. 2020 with CVE-2020-0601 (a Windows CryptoAPI
  vulnerability. Unfortunately, that is about the only instance of CVEs being
  written to this log. MITRE ATT&CK: T1203, T1068, T1211, T1212, T1210,
  T1499.004.

data_source:
  - Windows Application Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - term:
                  data_win_system_providerName:
                    value: "Microsoft-Windows-Audit-CVE"
                    case_insensitive: true
              - term:
                  data_win_system_providerName:
                    value: "Audit-CVE"
                    case_insensitive: true
            minimum_should_match: 1
        - term:
            data_win_system_eventID: "1"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_providerName equals
  'Microsoft-Windows-Audit-CVE'; data_win_system_providerName equals
  'Audit-CVE'; data_win_system_eventID equals '1'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/VM_vivisector/status/1217190929330655232
  - https://twitter.com/DidierStevens/status/1217533958096924676
  - https://twitter.com/FlemmingRiis/status/1217147415482060800
  - https://www.youtube.com/watch?v=ebmW42YYveI
  - https://nullsec.us/windows-event-log-audit-cve/
  - https://attack.mitre.org/techniques/T1203/
  - https://attack.mitre.org/techniques/T1068/
  - https://attack.mitre.org/techniques/T1211/
  - https://attack.mitre.org/techniques/T1212/
  - https://attack.mitre.org/techniques/T1210/
  - https://attack.mitre.org/techniques/T1499/004/

response:
  message: >
    Audit CVE Event detected on host $agent_name$. Matched
    data_win_system_providerName: $data_win_system_providerName$. MITRE ATT&CK:
    T1203, T1068, T1211, T1212, T1210, T1499.004
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_system_providerName
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1203
    - T1068
    - T1211
    - T1212
    - T1210
    - T1499.004
  custom_tags:
    - audit
    - windows_application
    - execution
    - stealth
    - privilege_escalation
    - credential_access
    - lateral_movement
    - impact
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_providerName:/[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]-[Ww][Ii][Nn][Dd][Oo][Ww][Ss]-[Aa][Uu][Dd][Ii][Tt]-[Cc][Vv][Ee]/ OR data_win_system_providerName:/[Aa][Uu][Dd][Ii][Tt]-[Cc][Vv][Ee]/) AND data_win_system_eventID:"1"

correlation:
  # Authored by the correlation engine for review. Related CoPilot Searches to run
  # around an alert from this rule, scoped to the same host/user/IP within the window.
  related_rules:
    - id: 0255a820-e564-4e40-af2b-6ac61160335c
      name: "A New Trust Was Created To A Domain"
      reason: "next kill-chain tactic: Persistence"
    - id: 35ba1d85-724d-42a3-889f-2e2362bcaf23
      name: "AD Privileged Users or Groups Reconnaissance"
      reason: "next kill-chain tactic: Discovery"
    - id: 9eb99343-d336-4020-a3cd-67f3819e68ee
      name: "Account Tampering - Suspicious Failed Logon Reasons"
      reason: "next kill-chain tactic: Persistence"
    - id: 17d619c1-e020-4347-957e-1d1207455c93
      name: "Active Directory Replication from Non Machine Account"
      reason: "next kill-chain tactic: Credential Access"
    - id: 300bac00-e041-4ee2-9c36-e262656a6ecc
      name: "Active Directory User Backdoors"
      reason: "next kill-chain tactic: Persistence"
  window: 1h
  enrichment_searches:
  # NEW ad-hoc searches the engine runs around an alert from this rule, scoped to
  # the alert's host/user/IP within the window (not existing CoPilot Searches).
    - name: "Sysmon activity on this host in the window"
      query: 'data_win_system_channel:"Microsoft-Windows-Sysmon/Operational"'
      pivot_on: [host]
      window: 1h
    - name: "Process creation on this host"
      query: 'data_win_system_eventID:"1"'
      pivot_on: [host]
      window: 1h
    - name: "Network connections from this host"
      query: 'data_win_system_eventID:"3"'
      pivot_on: [host]
      window: 1h
    - name: "High-severity alerts on this host"
      query: 'rule_level:>=10'
      pivot_on: [host]
      window: 1h
