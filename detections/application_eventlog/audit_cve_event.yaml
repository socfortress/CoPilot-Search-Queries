name: Audit CVE Event
id: 48d91a3a-2363-43ba-a456-ca71ac3da5c2
version: 1
schema_version: "1.0"
date: "2022-10-22"
author: Florian Roth (Nextron Systems), Zach Mathis
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 48d91a3a-2363-43ba-a456-ca71ac3da5c2
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects events generated by user-mode applications when they call the
  CveEventWrite API when a known vulnerability is trying to be exploited. MS
  started using this log in Jan. 2020 with CVE-2020-0601 (a Windows CryptoAPI
  vulnerability. Unfortunately, that is about the only instance of CVEs being
  written to this log. MITRE ATT&CK: T1203, T1068, T1211, T1212, T1210,
  T1499.004.

data_source:
  - Windows Application Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - bool:
            should:
              - term:
                  data_win_system_providerName:
                    value: "Microsoft-Windows-Audit-CVE"
                    case_insensitive: true
              - term:
                  data_win_system_providerName:
                    value: "Audit-CVE"
                    case_insensitive: true
            minimum_should_match: 1
        - term:
            data_win_system_eventID: "1"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_providerName equals
  'Microsoft-Windows-Audit-CVE'; data_win_system_providerName equals
  'Audit-CVE'; data_win_system_eventID equals '1'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/VM_vivisector/status/1217190929330655232
  - https://twitter.com/DidierStevens/status/1217533958096924676
  - https://twitter.com/FlemmingRiis/status/1217147415482060800
  - https://www.youtube.com/watch?v=ebmW42YYveI
  - https://nullsec.us/windows-event-log-audit-cve/
  - https://attack.mitre.org/techniques/T1203/
  - https://attack.mitre.org/techniques/T1068/
  - https://attack.mitre.org/techniques/T1211/
  - https://attack.mitre.org/techniques/T1212/
  - https://attack.mitre.org/techniques/T1210/
  - https://attack.mitre.org/techniques/T1499/004/

response:
  message: >
    Audit CVE Event detected on host $agent_name$. Matched
    data_win_system_providerName: $data_win_system_providerName$. MITRE ATT&CK:
    T1203, T1068, T1211, T1212, T1210, T1499.004
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_system_providerName
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1203
    - T1068
    - T1211
    - T1212
    - T1210
    - T1499.004
  custom_tags:
    - audit
    - windows_application
    - execution
    - stealth
    - privilege_escalation
    - credential_access
    - lateral_movement
    - impact
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_providerName:/[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]-[Ww][Ii][Nn][Dd][Oo][Ww][Ss]-[Aa][Uu][Dd][Ii][Tt]-[Cc][Vv][Ee]/ OR data_win_system_providerName:/[Aa][Uu][Dd][Ii][Tt]-[Cc][Vv][Ee]/) AND data_win_system_eventID:"1"

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a18e0862-127b-43ca-be12-1a542c75c7c5
    name: LSASS Process Crashed - Application
    reason: A failed memory-corruption exploit against a user-mode component (CryptoAPI/LSASS) often crashes the process, so an LSASS crash logged beside a CveEventWrite hit confirms an exploit attempt on the same host.
  - id: 545a5da6-f103-4919-a519-e9aec1026ee4
    name: Microsoft Malware Protection Engine Crash
    reason: Exploit attempts against Defender's parsing engine or other security components crash them alongside the CVE audit event; a crash of the security stack on the same host raises exploit confidence.
  - id: e5a29b54-6fe7-4258-8a23-82960e31231a
    name: CVE-2023-40477 Potential Exploitation - WinRAR Application Crash
    reason: Application-level exploit crash logged in the same Application event log; a user-mode app crashing around the CVE audit event points to a malformed-file exploit attempt.
  - id: 178e615d-e666-498b-9630-9ed363038101
    name: Elevated System Shell Spawned From Uncommon Parent Location
    reason: Successful local privilege escalation (T1068) typically yields a SYSTEM shell spawned from an unusual parent, which is the post-exploit step after the CVE audit event.
  - id: d522eca2-2973-4391-a3e0-ef0374321dae
    name: Abused Debug Privilege by Arbitrary Parent Processes
    reason: Exploits for privilege escalation frequently abuse SeDebugPrivilege afterwards to reach SYSTEM or protected processes.
  - id: dcfd6b40-42f9-469d-a433-2e53f7486664
    name: Detect Prohibited Applications Spawning cmd exe
    reason: An exploited Office/browser/server application launching cmd.exe is the usual first post-exploitation process after code execution.
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: Once privileges are elevated through the exploit, attackers dump LSASS for credential access, then move laterally.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Child process spawned by exploited Office/browser/server application
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*(\\[Ww][Ii][Nn][Ww][Oo][Rr][Dd]|\\[Ee][Xx][Cc][Ee][Ll]|\\[Oo][Uu][Tt][Ll][Oo][Oo][Kk]|\\[Cc][Hh][Rr][Oo][Mm][Ee]|\\[Mm][Ss][Ee][Dd][Gg][Ee]|\\[Ww]3[Ww][Pp]|\\[Ll][Ss][Aa][Ss][Ss])\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Cc][Mm][Dd]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Mm][Ss][Hh][Tt][Aa]|[Rr][Uu][Nn][Dd][Ll][Ll]32)\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: Application crash or WER fault events on host
    query: (data_win_system_providerName:"Application Error" OR data_win_system_providerName:"Windows Error Reporting" OR data_win_system_providerName:".NET Runtime") AND (data_win_system_eventID:"1000" OR data_win_system_eventID:"1001" OR data_win_system_eventID:"1026")
    pivot_on:
    - host
    window: 1h
  - name: Process access to LSASS after exploitation
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Privilege escalation to SYSTEM via token or service abuse
    query: data_win_system_eventID:"1" AND data_win_eventdata_user:/.*[Ss][Yy][Ss][Tt][Ee][Mm]/ AND data_win_eventdata_image:/.*\\([Cc][Mm][Dd]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh])\.[Ee][Xx][Ee]/ AND NOT data_win_eventdata_parentImage:/.*\\([Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]|[Ww][Ii][Nn][Ii][Nn][Ii][Tt])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: Outbound network connection by script interpreters after exploit
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]|[Cc][Mm][Dd]|[Mm][Ss][Hh][Tt][Aa]|[Rr][Uu][Nn][Dd][Ll][Ll]32|[Rr][Ee][Gg][Ss][Vv][Rr]32)\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
