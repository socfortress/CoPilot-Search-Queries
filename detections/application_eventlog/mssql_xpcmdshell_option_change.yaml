name: MSSQL XPCmdshell Option Change
id: d08dd86f-681e-4a00-a92c-1db218754417
version: 1
schema_version: "1.0"
date: "2024-06-26"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: d08dd86f-681e-4a00-a92c-1db218754417
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects when the MSSQL "xp_cmdshell" stored procedure setting is changed.

data_source:
  - Windows Application Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - wildcard:
            data_win_system_providerName:
              value: "*MSSQL*"
              case_insensitive: true
        - term:
            data_win_system_eventID: "15457"
        - wildcard:
            data_win_eventdata_data:
              value: "*xp_cmdshell*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName
    - data_win_eventdata_data

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_providerName matches '*MSSQL*';
  data_win_system_eventID equals '15457'; data_win_eventdata_data matches
  '*xp_cmdshell*'.

known_false_positives: >
  Legitimate enable/disable of the setting. Note that since the event contain
  the change for both values. This means that this will trigger on both enable
  and disable. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.netspi.com/blog/technical/network-penetration-testing/sql-server-persistence-part-1-startup-stored-procedures/
  - https://thedfirreport.com/2022/07/11/select-xmrig-from-sqlserver/

response:
  message: >
    MSSQL XPCmdshell Option Change detected on host $agent_name$. Matched
    data_win_system_providerName: $data_win_system_providerName$. Matched
    data_win_eventdata_data: $data_win_eventdata_data$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_system_providerName
      type: other
    - field: data_win_eventdata_data
      type: other

tags:
  asset_type: Endpoint
  custom_tags:
    - mssql
    - xpcmdshell
    - option
    - windows_application
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_providerName:/.*[Mm][Ss][Ss][Qq][Ll].*/ AND data_win_system_eventID:"15457" AND data_win_eventdata_data:/.*[Xx][Pp]_[Cc][Mm][Dd][Ss][Hh][Ee][Ll][Ll].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7f103213-a04e-4d59-8261-213dddf22314
    name: MSSQL XPCmdshell Suspicious Execution
    reason: 'Direct follow-on: once xp_cmdshell is enabled, the attacker invokes it, and this rule catches the actual xp_cmdshell call with suspicious commands.'
  - id: 869b9ca7-9ea2-4a5a-8325-e80e62f75445
    name: Suspicious Child Process Of SQL Server
    reason: 'Process-level confirmation that xp_cmdshell was used: sqlservr.exe spawning cmd/powershell/whoami etc. is the execution produced by the enabled option.'
  - id: b3d57a5c-c92e-4b48-9a79-5f124b7cf964
    name: MSSQL SPProcoption Set
    reason: Alternative SQL Server persistence/execution (startup stored procedures per the NetSPI reference) frequently configured in the same session as enabling xp_cmdshell.
  - id: 08200f85-2678-463e-9c32-88dce2f073d1
    name: MSSQL Add Account To Sysadmin Role
    reason: 'Precursor/co-occurring: enabling xp_cmdshell requires sysadmin, so attackers often grant themselves the sysadmin role just before or after reconfiguring.'
  - id: ebfe73c2-5bc9-4ed9-aaa8-8b54b2b4777d
    name: MSSQL Server Failed Logon From External Network
    reason: 'Precursor: brute-force or password-spray against an exposed SQL login (e.g. sa) is the typical way the attacker obtained the rights to change this option.'
  - id: 350dfb37-3706-4cdc-9e2e-5e24bc3a46df
    name: MSSQL Disable Audit Settings
    reason: 'Defence evasion paired with the option change: attackers disable SQL Server auditing so the xp_cmdshell activity that follows is not recorded.'
  - id: 711ab2fe-c9ba-4746-8840-5228a58c3cb8
    name: MSSQL Extended Stored Procedure Backdoor Maggie
    reason: 'Alternative persistence on the same SQL Server: registering a malicious extended stored procedure DLL is an adjacent post-compromise step to xp_cmdshell abuse.'
  - id: 00321fee-ca72-4cce-b011-5415af3b9960
    name: MSSQL Destructive Query
    reason: 'Possible impact stage: a SQL instance with xp_cmdshell newly enabled and destructive queries (DROP/DELETE) points to ransomware-style or sabotage activity through the database.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: SQL Server service spawning shells or recon tools (xp_cmdshell execution)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ss][Qq][Ll][Ss][Ee][Rr][Vv][Rr]\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Cc][Mm][Dd]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]|[Ww][Hh][Oo][Aa][Mm][Ii]|[Nn][Ee][Tt]1?|[Nn][Ss][Ll][Oo][Oo][Kk][Uu][Pp]|[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]|[Cc][Uu][Rr][Ll]|[Mm][Ss][Hh][Tt][Aa]|[Ww][Mm][Ii][Cc]|[Ss][Cc]|[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: Other sp_configure changes enabling alternate SQL execution paths
    query: data_win_system_providerName:/.*[Mm][Ss][Ss][Qq][Ll].*/ AND data_win_system_eventID:"15457" AND data_win_eventdata_data:/.*([Ss]how advanced options|[Oo]le [Aa]utomation|clr enabled|clr strict security|[Aa]d [Hh]oc [Dd]istributed [Qq]ueries|[Dd]atabase [Mm]ail XPs|[Cc]ross db ownership|[Pp]olybase).*/
    pivot_on:
    - host
    window: 2h
  - name: Payload staged to disk by SQL Server or its spawned shells
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*\\([Ss][Qq][Ll][Ss][Ee][Rr][Vv][Rr]|[Cc][Mm][Dd]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn])\.[Ee][Xx][Ee]/ AND data_win_eventdata_targetFilename:/.*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Pp][Ss]1|[Bb][Aa][Tt]|[Vv][Bb][Ss]|[Jj][Ss]|[Hh][Tt][Aa]|[Ss][Cc][Rr])/
    pivot_on:
    - host
    window: 2h
  - name: Download cradles and tool ingress from command lines (post-xp_cmdshell staging)
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Dd]ownload[Ss]tring|[Dd]ownload[Ff]ile|[Ii][Ee][Xx]|[Ii]nvoke-[Ww]eb[Rr]equest|[Ii]wr |-[Uu]rl[Cc]ache|bitsadmin.*\/transfer|curl .*http|[Ee]ncodedcommand|-[Ee]nc ).*/
    pivot_on:
    - host
    window: 2h
  - name: Account creation, service or scheduled-task persistence following SQL command execution
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*(net1? +user .*\/add|net1? +localgroup +administrators|[Ss][Cc]\.[Ee][Xx][Ee] +create|[Ss][Cc] +create|[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss].*\/create|[Rr][Ee][Gg] +add .*[Cc]urrent[Vv]ersion\\[Rr]un).*/
    pivot_on:
    - host
    window: 4h
