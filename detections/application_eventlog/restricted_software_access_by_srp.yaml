name: Restricted Software Access By SRP
id: b4c8da4a-1c12-46b0-8a2b-0a8521d03442
version: 1
schema_version: "1.0"
date: "2023-01-12"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: b4c8da4a-1c12-46b0-8a2b-0a8521d03442
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects restricted access to applications by the Software Restriction Policies
  (SRP) policy. MITRE ATT&CK: T1072.

data_source:
  - Windows Application Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_providerName:
              value: "Microsoft-Windows-SoftwareRestrictionPolicies"
              case_insensitive: true
        - bool:
            should:
              - term:
                  data_win_system_eventID: "865"
              - term:
                  data_win_system_eventID: "866"
              - term:
                  data_win_system_eventID: "867"
              - term:
                  data_win_system_eventID: "868"
              - term:
                  data_win_system_eventID: "882"
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_providerName equals
  'Microsoft-Windows-SoftwareRestrictionPolicies'; data_win_system_eventID
  equals '865'; data_win_system_eventID equals '866', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://learn.microsoft.com/en-us/windows-server/identity/software-restriction-policies/software-restriction-policies
  - https://github.com/nasbench/EVTX-ETW-Resources/blob/7a806a148b3d9d381193d4a80356016e6e8b1ee8/ETWEventsList/CSV/Windows11/22H2/W11_22H2_Pro_20220920_22621.382/Providers/Microsoft-Windows-AppXDeployment-Server.csv
  - https://attack.mitre.org/techniques/T1072/

response:
  message: >
    Restricted Software Access By SRP detected on host $agent_name$. Matched
    data_win_system_providerName: $data_win_system_providerName$. MITRE ATT&CK:
    T1072
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_system_providerName
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1072
  custom_tags:
    - restricted
    - software
    - windows_application
    - lateral_movement
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_providerName:/[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]-[Ww][Ii][Nn][Dd][Oo][Ww][Ss]-[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee][Rr][Ee][Ss][Tt][Rr][Ii][Cc][Tt][Ii][Oo][Nn][Pp][Oo][Ll][Ii][Cc][Ii][Ee][Ss]/ AND (data_win_system_eventID:"865" OR data_win_system_eventID:"866" OR data_win_system_eventID:"867" OR data_win_system_eventID:"868" OR data_win_system_eventID:"882")

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 3dfd06d2-eaf4-4532-9555-68aca59f57c4
    name: Process Execution From A Potentially Suspicious Folder
    reason: SRP blocks usually fire on binaries launched from user-writable paths (Temp, AppData, Downloads); this shows the same or sibling payloads that were NOT blocked and ran.
  - id: 1228c958-e64e-4e71-92ad-7d429f4138ba
    name: Script Interpreter Execution From Suspicious Folder
    reason: Blocked executable is often followed by attacker retry via wscript/cscript/powershell from the same staging folder, which SRP path rules may not cover.
  - id: d4ca7c59-e9e4-42d8-bf57-91a776efcb87
    name: LOLBIN Execution From Abnormal Drive
    reason: After an SRP denial the operator pivots to renamed or relocated living-off-the-land binaries (USB/mounted drive) to evade the path rule.
  - id: 467ed9d9-8035-470e-ad5e-ae5189283033
    name: Windows Impair Defense Add Xml Applocker Rules
    reason: Attacker hitting an application-control block may rewrite AppLocker/SRP policy to allow their payload, removing the control that just fired.
  - id: 102af98d-0ca3-4aa4-98d6-7ab2b98b955a
    name: Windows Powershell Import Applocker Policy
    reason: Policy import via PowerShell is the scripted way to weaken the same application-control enforcement after being blocked.
  - id: 1d2de8a6-4803-4fde-b85b-f58f3aa7a705
    name: Potentially Suspicious WDAC Policy File Creation
    reason: Dropping a WDAC policy file is the alternate way to override or replace restriction policy following an SRP block.
  - id: b28e58e4-2a72-4fae-bdee-0fbe904db642
    name: Windows Defender Real-time Protection Disabled
    reason: Blocked intruders commonly combine control-bypass with disabling AV so the payload can run; co-occurrence on the host signals defense impairment.
  - id: 23b71bc5-953e-4971-be4c-c896cda73fc2
    name: Sysmon Blocked Executable
    reason: Another preventive control blocking an executable on the same host; paired with SRP denial indicates repeated attempts to run the same payload.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Process launches from user-writable staging paths (the likely blocked payload)
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Aa][Pp][Pp][Dd][Aa][Tt][Aa]|[Tt][Ee][Mm][Pp]|[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]|[Pp][Uu][Bb][Ll][Ii][Cc]|[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa])\\.*\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: Script interpreters executing from user-writable paths after block (retry via scripts)
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Mm][Ss][Hh][Tt][Aa])\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*([Aa][Pp][Pp][Dd][Aa][Tt][Aa]|[Tt][Ee][Mm][Pp]|[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]|[Pp][Uu][Bb][Ll][Ii][Cc]).*/
    pivot_on:
    - host
    window: 1h
  - name: Application-control policy tampering (SRP/AppLocker registry and policy changes)
    query: (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*([Ss][Rr][Pp][Vv]2|[Ss]afer\\[Cc]ode[Ii]dentifiers|[Ss]rp[Vv]2).*/) OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ss]et-[Aa]pp[Ll]ocker[Pp]olicy|[Cc]odeIdentifiers|[Ss]rp[Vv]2|[Aa]pp[Ll]ocker).*/) OR (data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*([Ss]et-[Aa]pp[Ll]ocker[Pp]olicy|[Aa]pp[Ll]ocker).*/)
    pivot_on:
    - host
    window: 2h
  - name: Persistence set up near the block (Run keys, scheduled tasks, startup folder)
    query: (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Cc]urrent[Vv]ersion\\[Rr]un.*/) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss]chtasks\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*\/[Cc][Rr][Ee][Aa][Tt][Ee].*/) OR (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Ss]tart [Mm]enu\\[Pp]rograms\\[Ss]tartup.*/)
    pivot_on:
    - host
    window: 2h
  - name: Outbound connections from user-writable-path processes (payload download or C2)
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Aa][Pp][Pp][Dd][Aa][Tt][Aa]|[Tt][Ee][Mm][Pp]|[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]|[Pp][Uu][Bb][Ll][Ii][Cc]).*/
    pivot_on:
    - host
    window: 2h
