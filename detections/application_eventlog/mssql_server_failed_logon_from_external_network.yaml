name: MSSQL Server Failed Logon From External Network
id: ebfe73c2-5bc9-4ed9-aaa8-8b54b2b4777d
version: 1
schema_version: "1.0"
date: "2025-05-28"
author: j4son
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: ebfe73c2-5bc9-4ed9-aaa8-8b54b2b4777d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects failed logon attempts from clients with external network IP to an
  MSSQL server. This can be a sign of a bruteforce attack. MITRE ATT&CK: T1110.

data_source:
  - Windows Application Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - wildcard:
            data_win_system_providerName:
              value: "*MSSQL*"
              case_insensitive: true
        - term:
            data_win_system_eventID: "18456"
        - exists:
            field: "data_win_eventdata_data"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_data:
                          value: "*CLIENT: 10.*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_data:
                          value: "*CLIENT: 172.16.*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_data:
                          value: "*CLIENT: 172.17.*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_data:
                          value: "*CLIENT: 172.18.*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_data:
                          value: "*CLIENT: 172.19.*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_data:
                          value: "*CLIENT: 172.20.*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_data:
                          value: "*CLIENT: 172.21.*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_data:
                          value: "*CLIENT: 172.22.*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_data:
                          value: "*CLIENT: 172.23.*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_data:
                          value: "*CLIENT: 172.24.*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_data:
                          value: "*CLIENT: 172.25.*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_data:
                          value: "*CLIENT: 172.26.*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_data:
                          value: "*CLIENT: 172.27.*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_data:
                          value: "*CLIENT: 172.28.*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_data:
                          value: "*CLIENT: 172.29.*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_data:
                          value: "*CLIENT: 172.30.*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_data:
                          value: "*CLIENT: 172.31.*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_data:
                          value: "*CLIENT: 192.168.*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_data:
                          value: "*CLIENT: 127.*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_data:
                          value: "*CLIENT: 169.254.*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_data:
                          value: "*CLIENT: <local machine>*"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName
    - data_win_eventdata_data

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_providerName matches '*MSSQL*';
  data_win_system_eventID equals '18456'; data_win_eventdata_data matches
  '*CLIENT: 10.*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://cybersecthreat.com/2020/07/08/enable-mssql-authentication-log-to-eventlog/
  - https://www.experts-exchange.com/questions/27800944/EventID-18456-Failed-to-open-the-explicitly-specified-database.html
  - https://attack.mitre.org/techniques/T1110/

response:
  message: >
    MSSQL Server Failed Logon From External Network detected on host
    $agent_name$. Matched data_win_system_providerName:
    $data_win_system_providerName$. Matched data_win_eventdata_data:
    $data_win_eventdata_data$. MITRE ATT&CK: T1110
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_system_providerName
      type: other
    - field: data_win_eventdata_data
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1110
  custom_tags:
    - mssql
    - server
    - failed
    - windows_application
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: "data_win_system_providerName:/.*[Mm][Ss][Ss][Qq][Ll].*/ AND data_win_system_eventID:\"18456\" AND _exists_:data_win_eventdata_data AND NOT (data_win_eventdata_data:/.*[Cc][Ll][Ii][Ee][Nn][Tt]: 10\\..*/ OR data_win_eventdata_data:/.*[Cc][Ll][Ii][Ee][Nn][Tt]: 172\\.16\\..*/ OR data_win_eventdata_data:/.*[Cc][Ll][Ii][Ee][Nn][Tt]: 172\\.17\\..*/ OR data_win_eventdata_data:/.*[Cc][Ll][Ii][Ee][Nn][Tt]: 172\\.18\\..*/ OR data_win_eventdata_data:/.*[Cc][Ll][Ii][Ee][Nn][Tt]: 172\\.19\\..*/ OR data_win_eventdata_data:/.*[Cc][Ll][Ii][Ee][Nn][Tt]: 172\\.20\\..*/ OR data_win_eventdata_data:/.*[Cc][Ll][Ii][Ee][Nn][Tt]: 172\\.21\\..*/ OR data_win_eventdata_data:/.*[Cc][Ll][Ii][Ee][Nn][Tt]: 172\\.22\\..*/ OR data_win_eventdata_data:/.*[Cc][Ll][Ii][Ee][Nn][Tt]: 172\\.23\\..*/ OR data_win_eventdata_data:/.*[Cc][Ll][Ii][Ee][Nn][Tt]: 172\\.24\\..*/ OR data_win_eventdata_data:/.*[Cc][Ll][Ii][Ee][Nn][Tt]: 172\\.25\\..*/ OR data_win_eventdata_data:/.*[Cc][Ll][Ii][Ee][Nn][Tt]: 172\\.26\\..*/ OR data_win_eventdata_data:/.*[Cc][Ll][Ii][Ee][Nn][Tt]: 172\\.27\\..*/ OR data_win_eventdata_data:/.*[Cc][Ll][Ii][Ee][Nn][Tt]: 172\\.28\\..*/ OR data_win_eventdata_data:/.*[Cc][Ll][Ii][Ee][Nn][Tt]: 172\\.29\\..*/ OR data_win_eventdata_data:/.*[Cc][Ll][Ii][Ee][Nn][Tt]: 172\\.30\\..*/ OR data_win_eventdata_data:/.*[Cc][Ll][Ii][Ee][Nn][Tt]: 172\\.31\\..*/ OR data_win_eventdata_data:/.*[Cc][Ll][Ii][Ee][Nn][Tt]: 192\\.168\\..*/ OR data_win_eventdata_data:/.*[Cc][Ll][Ii][Ee][Nn][Tt]: 127\\..*/ OR data_win_eventdata_data:/.*[Cc][Ll][Ii][Ee][Nn][Tt]: 169\\.254\\..*/ OR data_win_eventdata_data:/.*[Cc][Ll][Ii][Ee][Nn][Tt]: \\<[Ll][Oo][Cc][Aa][Ll] [Mm][Aa][Cc][Hh][Ii][Nn][Ee]\\>.*/)"

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d08dd86f-681e-4a00-a92c-1db218754417
    name: MSSQL XPCmdshell Option Change
    reason: If the external brute force succeeds (often as sa), the attacker's first step is enabling xp_cmdshell via sp_configure to get OS command execution
  - id: 7f103213-a04e-4d59-8261-213dddf22314
    name: MSSQL XPCmdshell Suspicious Execution
    reason: 'Direct follow-on to a successful SQL login guess: xp_cmdshell used to run recon or payload commands on the SQL host'
  - id: 869b9ca7-9ea2-4a5a-8325-e80e62f75445
    name: Suspicious Child Process Of SQL Server
    reason: sqlservr.exe spawning cmd/powershell/certutil is the process-level evidence that a compromised SQL login reached the OS
  - id: 08200f85-2678-463e-9c32-88dce2f073d1
    name: MSSQL Add Account To Sysadmin Role
    reason: After gaining a low-privilege login via brute force, attackers escalate or plant persistence by adding a login to sysadmin
  - id: 350dfb37-3706-4cdc-9e2e-5e24bc3a46df
    name: MSSQL Disable Audit Settings
    reason: Attackers with a valid SQL login disable auditing to hide subsequent activity on the same instance
  - id: 711ab2fe-c9ba-4746-8840-5228a58c3cb8
    name: MSSQL Extended Stored Procedure Backdoor Maggie
    reason: Post-compromise persistence on SQL Server via a malicious extended stored procedure after authentication succeeds
  - id: c615d676-f655-46b9-b913-78729021e5d7
    name: Data Export From MSSQL Table Via BCP.EXE
    reason: 'Data theft step: once logged in, attackers dump tables with bcp.exe on the same server'
  - id: 00321fee-ca72-4cce-b011-5415af3b9960
    name: MSSQL Destructive Query
    reason: Impact stage on the same instance (DROP/TRUNCATE/DELETE) following unauthorized database access, e.g. ransomware-style wiping
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: MSSQL successful logins on same instance (brute force success)
    query: data_win_system_providerName:/.*[Mm][Ss][Ss][Qq][Ll].*/ AND data_win_system_eventID:"18454"
    pivot_on:
    - host
    window: 2h
  - name: MSSQL configuration, audit and privilege changes
    query: data_win_system_providerName:/.*[Mm][Ss][Ss][Qq][Ll].*/ AND (data_win_system_eventID:"15457" OR data_win_system_eventID:"33205" OR data_win_eventdata_data:/.*[Xx][Pp]_[Cc][Mm][Dd][Ss][Hh][Ee][Ll][Ll].*/ OR data_win_eventdata_data:/.*[Ss][Yy][Ss][Aa][Dd][Mm][Ii][Nn].*/ OR data_win_eventdata_data:/.*[Ss][Pp]_[Cc][Oo][Nn][Ff][Ii][Gg][Uu][Rr][Ee].*/)
    pivot_on:
    - host
    window: 4h
  - name: Processes spawned by sqlservr.exe
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Ss][Qq][Ll][Ss][Ee][Rr][Vv][Rr]\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*(\\[Cc][Mm][Dd]|\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|\\[Pp][Ww][Ss][Hh]|\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]|\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]|\\[Ww][Hh][Oo][Aa][Mm][Ii]|\\[Nn][Ee][Tt]1?|\\[Cc][Uu][Rr][Ll])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 4h
  - name: Inbound SQL Server connections on port 1433
    query: data_win_system_eventID:"3" AND data_win_eventdata_destinationPort:"1433" AND data_win_eventdata_image:/.*[Ss][Qq][Ll][Ss][Ee][Rr][Vv][Rr]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    - ip
    window: 2h
  - name: Failed Windows logons on host from same source (spray across services)
    query: data_win_system_eventID:"4625"
    pivot_on:
    - host
    - ip
    window: 2h
