name: MSSQL Server Failed Logon From External Network
id: ebfe73c2-5bc9-4ed9-aaa8-8b54b2b4777d
version: 1
schema_version: "1.0"
date: "2025-05-28"
author: j4son
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: ebfe73c2-5bc9-4ed9-aaa8-8b54b2b4777d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects failed logon attempts from clients with external network IP to an
  MSSQL server. This can be a sign of a bruteforce attack. MITRE ATT&CK: T1110.

data_source:
  - Windows Application Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - wildcard:
            data_win_system_providerName:
              value: "*MSSQL*"
              case_insensitive: true
        - term:
            data_win_system_eventID: "18456"
        - exists:
            field: "data_win_eventdata_data"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_data:
                          value: "*CLIENT: 10.*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_data:
                          value: "*CLIENT: 172.16.*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_data:
                          value: "*CLIENT: 172.17.*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_data:
                          value: "*CLIENT: 172.18.*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_data:
                          value: "*CLIENT: 172.19.*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_data:
                          value: "*CLIENT: 172.20.*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_data:
                          value: "*CLIENT: 172.21.*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_data:
                          value: "*CLIENT: 172.22.*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_data:
                          value: "*CLIENT: 172.23.*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_data:
                          value: "*CLIENT: 172.24.*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_data:
                          value: "*CLIENT: 172.25.*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_data:
                          value: "*CLIENT: 172.26.*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_data:
                          value: "*CLIENT: 172.27.*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_data:
                          value: "*CLIENT: 172.28.*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_data:
                          value: "*CLIENT: 172.29.*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_data:
                          value: "*CLIENT: 172.30.*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_data:
                          value: "*CLIENT: 172.31.*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_data:
                          value: "*CLIENT: 192.168.*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_data:
                          value: "*CLIENT: 127.*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_data:
                          value: "*CLIENT: 169.254.*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_data:
                          value: "*CLIENT: <local machine>*"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName
    - data_win_eventdata_data

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_providerName matches '*MSSQL*';
  data_win_system_eventID equals '18456'; data_win_eventdata_data matches
  '*CLIENT: 10.*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://cybersecthreat.com/2020/07/08/enable-mssql-authentication-log-to-eventlog/
  - https://www.experts-exchange.com/questions/27800944/EventID-18456-Failed-to-open-the-explicitly-specified-database.html
  - https://attack.mitre.org/techniques/T1110/

response:
  message: >
    MSSQL Server Failed Logon From External Network detected on host
    $agent_name$. Matched data_win_system_providerName:
    $data_win_system_providerName$. Matched data_win_eventdata_data:
    $data_win_eventdata_data$. MITRE ATT&CK: T1110
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_system_providerName
      type: other
    - field: data_win_eventdata_data
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1110
  custom_tags:
    - mssql
    - server
    - failed
    - windows_application
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: "data_win_system_providerName:/.*[Mm][Ss][Ss][Qq][Ll].*/ AND data_win_system_eventID:\"18456\" AND _exists_:data_win_eventdata_data AND NOT (data_win_eventdata_data:/.*[Cc][Ll][Ii][Ee][Nn][Tt]: 10\\..*/ OR data_win_eventdata_data:/.*[Cc][Ll][Ii][Ee][Nn][Tt]: 172\\.16\\..*/ OR data_win_eventdata_data:/.*[Cc][Ll][Ii][Ee][Nn][Tt]: 172\\.17\\..*/ OR data_win_eventdata_data:/.*[Cc][Ll][Ii][Ee][Nn][Tt]: 172\\.18\\..*/ OR data_win_eventdata_data:/.*[Cc][Ll][Ii][Ee][Nn][Tt]: 172\\.19\\..*/ OR data_win_eventdata_data:/.*[Cc][Ll][Ii][Ee][Nn][Tt]: 172\\.20\\..*/ OR data_win_eventdata_data:/.*[Cc][Ll][Ii][Ee][Nn][Tt]: 172\\.21\\..*/ OR data_win_eventdata_data:/.*[Cc][Ll][Ii][Ee][Nn][Tt]: 172\\.22\\..*/ OR data_win_eventdata_data:/.*[Cc][Ll][Ii][Ee][Nn][Tt]: 172\\.23\\..*/ OR data_win_eventdata_data:/.*[Cc][Ll][Ii][Ee][Nn][Tt]: 172\\.24\\..*/ OR data_win_eventdata_data:/.*[Cc][Ll][Ii][Ee][Nn][Tt]: 172\\.25\\..*/ OR data_win_eventdata_data:/.*[Cc][Ll][Ii][Ee][Nn][Tt]: 172\\.26\\..*/ OR data_win_eventdata_data:/.*[Cc][Ll][Ii][Ee][Nn][Tt]: 172\\.27\\..*/ OR data_win_eventdata_data:/.*[Cc][Ll][Ii][Ee][Nn][Tt]: 172\\.28\\..*/ OR data_win_eventdata_data:/.*[Cc][Ll][Ii][Ee][Nn][Tt]: 172\\.29\\..*/ OR data_win_eventdata_data:/.*[Cc][Ll][Ii][Ee][Nn][Tt]: 172\\.30\\..*/ OR data_win_eventdata_data:/.*[Cc][Ll][Ii][Ee][Nn][Tt]: 172\\.31\\..*/ OR data_win_eventdata_data:/.*[Cc][Ll][Ii][Ee][Nn][Tt]: 192\\.168\\..*/ OR data_win_eventdata_data:/.*[Cc][Ll][Ii][Ee][Nn][Tt]: 127\\..*/ OR data_win_eventdata_data:/.*[Cc][Ll][Ii][Ee][Nn][Tt]: 169\\.254\\..*/ OR data_win_eventdata_data:/.*[Cc][Ll][Ii][Ee][Nn][Tt]: \\<[Ll][Oo][Cc][Aa][Ll] [Mm][Aa][Cc][Hh][Ii][Nn][Ee]\\>.*/)"

correlation:
  # Authored by the correlation engine for review. Related CoPilot Searches to run
  # around an alert from this rule, scoped to the same host/user/IP within the window.
  related_rules:
    - id: 35ba1d85-724d-42a3-889f-2e2362bcaf23
      name: "AD Privileged Users or Groups Reconnaissance"
      reason: "next kill-chain tactic: Discovery"
    - id: 17d619c1-e020-4347-957e-1d1207455c93
      name: "Active Directory Replication from Non Machine Account"
      reason: "next kill-chain tactic: Credential Access"
    - id: 87261fb2-69d0-42fe-b9de-88c6b5f65a43
      name: "Atera Agent Installation"
      reason: "next kill-chain tactic: Command and Control"
  window: 1h
  enrichment_searches:
  # Rule-specific telemetry pivots the engine runs around an alert from this rule,
  # scoped to the alert's host/user/IP within the window (behaviour-targeted, not a sweep).
    - name: "Follow-on LOLBin / signed-binary-proxy execution on this host"
      query: 'data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|\\[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Aa][Ss][Mm]\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Cc][Ss]\.[Ee][Xx][Ee]|\\[Mm][Ss][Bb][Uu][Ii][Ll][Dd]\.[Ee][Xx][Ee]|\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]|\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]|\\[Cc][Mm][Ss][Tt][Pp]\.[Ee][Xx][Ee]|\\[Oo][Dd][Bb][Cc][Cc][Oo][Nn][Ff]\.[Ee][Xx][Ee]|\\[Ff][Oo][Rr][Ff][Ii][Ll][Ee][Ss]\.[Ee][Xx][Ee]|\\[Pp][Cc][Aa][Ll][Uu][Aa]\.[Ee][Xx][Ee]|\\[Mm][Aa][Vv][Ii][Nn][Jj][Ee][Cc][Tt]\.[Ee][Xx][Ee]|\\[Ss][Cc][Rr][Ii][Pp][Tt][Rr][Uu][Nn][Nn][Ee][Rr]\.[Ee][Xx][Ee])/'
      pivot_on: [host]
      window: 1h
    - name: "Outbound connections by script interpreters on this host"
      query: 'data_win_system_eventID:"3" AND data_win_eventdata_image:/.*(\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]|\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]_[Ii][Ss][Ee]\.[Ee][Xx][Ee]|\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]|\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee])/'
      pivot_on: [host]
      window: 1h
    - name: "Memory/credential-dump creation & LSASS access on this host"
      query: '(data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]|\\[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]64\.[Ee][Xx][Ee]|\\[Ss][Qq][Ll][Dd][Uu][Mm][Pp][Ee][Rr]\.[Ee][Xx][Ee]|\\[Cc][Rr][Ee][Aa][Tt][Ee][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]|\\[Rr][Dd][Rr][Ll][Ee][Aa][Kk][Dd][Ii][Aa][Gg]\.[Ee][Xx][Ee]|\\[Dd][Uu][Mm][Pp][Ee][Rr][Tt]\.[Ee][Xx][Ee]|\\[Nn][Aa][Nn][Oo][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]|\\[Aa][Vv][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee])/ OR data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Dd][Uu][Mm][Pp][Ee][Rr][Tt].*/ OR data_win_eventdata_commandLine:/.*[Nn][Aa][Nn][Oo][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Ss][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt].*/ OR data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll].*/) OR data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*(\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee])/)'
