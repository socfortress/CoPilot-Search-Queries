name: LPE InstallerFileTakeOver PoC CVE-2021-41379
id: 7dbb86de-a0cc-494c-8aa8-b2996c9ef3c8
version: 1
schema_version: "1.0"
date: "2022-07-12"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 7dbb86de-a0cc-494c-8aa8-b2996c9ef3c8
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects PoC tool used to exploit LPE vulnerability CVE-2021-41379. MITRE
  ATT&CK: T1190.

data_source:
  - Windows Application Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_eventID: "1033"
        - term:
            data_win_system_providerName:
              value: "MsiInstaller"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_data:
              value: "*test pkg*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName
    - data_win_eventdata_data

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_eventID equals '1033';
  data_win_system_providerName equals 'MsiInstaller'; data_win_eventdata_data
  matches '*test pkg*'.

known_false_positives: >
  Other MSI packages for which your admins have used that name. Baseline
  expected activity in your environment and tune this detection before relying
  on it for automated response.

references:
  - https://web.archive.org/web/20220421061949/https://github.com/klinix5/InstallerFileTakeOver
  - https://attack.mitre.org/techniques/T1190/

response:
  message: >
    LPE InstallerFileTakeOver PoC CVE-2021-41379 detected on host $agent_name$.
    Matched data_win_system_providerName: $data_win_system_providerName$.
    Matched data_win_eventdata_data: $data_win_eventdata_data$. MITRE ATT&CK:
    T1190
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_system_providerName
      type: other
    - field: data_win_eventdata_data
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1190
  custom_tags:
    - installerfiletakeover
    - windows_application
    - initial_access
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1033" AND data_win_system_providerName:/[Mm][Ss][Ii][Ii][Nn][Ss][Tt][Aa][Ll][Ll][Ee][Rr]/ AND data_win_eventdata_data:/.*[Tt][Ee][Ss][Tt] [Pp][Kk][Gg].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c7c8aa1c-5aff-408e-828b-998e3620b341
    name: MSI Installation From Suspicious Locations
    reason: The PoC drives a crafted MSI (product 'test pkg'); the same attacker-staged package often runs from a user-writable path such as Temp or Downloads, so this confirms the dropper stage.
  - id: 5594e67a-7f92-4a04-b65d-1a42fd824a60
    name: MSI Installation From Web
    reason: 'Precursor: the exploit MSI/binary is frequently downloaded to the host just before the Windows Installer rollback abuse is triggered.'
  - id: 79a87aa6-e4bd-42fc-a5bb-5e6fbdcd62f5
    name: Msiexec Quiet Installation
    reason: The same msiexec /i /q invocation that produces the MsiInstaller 1033 event; process-creation view of the exploit trigger with its command line.
  - id: cd951fdc-4b2f-47f5-ba99-a33bf61e3770
    name: Always Install Elevated Windows Installer
    reason: Alternative Windows Installer privilege-escalation route; seeing both means the actor is trying multiple installer-based paths to SYSTEM.
  - id: 1e53dd56-8d83-4eb4-a43e-b790a05510aa
    name: Always Install Elevated MSI Spawned Cmd And Powershell
    reason: 'Outcome of installer-based LPE: msiexec running as SYSTEM spawns cmd/powershell, the same elevated-shell result the CVE-2021-41379 exploit produces.'
  - id: 178e615d-e666-498b-9630-9ed363038101
    name: Elevated System Shell Spawned From Uncommon Parent Location
    reason: The exploit overwrites an elevation service binary so a SYSTEM cmd shell is spawned from an unusual parent; this detects that resulting shell.
  - id: 97a80ec7-0e2f-4d05-9ef4-65760e634f6b
    name: Security Privileges Enumeration Via Whoami.EXE
    reason: Immediately after a successful LPE the operator runs whoami /priv or /all in the new SYSTEM shell to confirm elevation.
  - id: 89ca78fd-b37c-4310-b3d3-81a023f83936
    name: Schtasks Creation Or Modification With SYSTEM Privileges
    reason: 'Likely next step with SYSTEM rights: persistence through a SYSTEM scheduled task.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Windows Installer (msiexec) launched from user-writable path or with quiet switch
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Mm][Ss][Ii][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*(\\[Tt][Ee][Mm][Pp]\\|\\[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]\\|\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\|\\[Pp][Uu][Bb][Ll][Ii][Cc]\\|[ ]\/[Qq]|[ ]\/[Pp][Aa][Ss][Ss][Ii][Vv][Ee]).*/
    pivot_on:
    - host
    window: 1h
  - name: Edge elevation service binary replaced or spawning child processes (exploit target)
    query: (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Ee][Ll][Ee][Vv][Aa][Tt][Ii][Oo][Nn]_[Ss][Ee][Rr][Vv][Ii][Cc][Ee]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Ee][Ll][Ee][Vv][Aa][Tt][Ii][Oo][Nn]_[Ss][Ee][Rr][Vv][Ii][Cc][Ee]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
  - name: SYSTEM shell and privilege confirmation commands after exploitation
    query: data_win_system_eventID:"1" AND data_win_eventdata_user:/.*[Ss][Yy][Ss][Tt][Ee][Mm]/ AND data_win_eventdata_image:/.*\\([Cc][Mm][Dd]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Ww][Hh][Oo][Aa][Mm][Ii])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Local account creation or admin group changes after privilege escalation
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Nn][Ee][Tt]1? +([Uu][Ss][Ee][Rr]|[Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp]).*(\/[Aa][Dd][Dd]|[Aa][Dd][Mm][Ii][Nn][Ii][Ss][Tt][Rr][Aa][Tt][Oo][Rr][Ss])).*/
    pivot_on:
    - host
    window: 4h
  - name: SYSTEM-level persistence via scheduled task or new service
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss].*\/[Cc][Rr][Ee][Aa][Tt][Ee].*\/[Rr][Uu] +["']?[Ss][Yy][Ss][Tt][Ee][Mm]|[Ss][Cc]\.[Ee][Xx][Ee].* [Cc][Rr][Ee][Aa][Tt][Ee] ).*/
    pivot_on:
    - host
    window: 4h
