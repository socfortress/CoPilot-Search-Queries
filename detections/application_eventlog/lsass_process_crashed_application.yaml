name: LSASS Process Crashed - Application
id: a18e0862-127b-43ca-be12-1a542c75c7c5
version: 1
schema_version: "1.0"
date: "2025-12-03"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: a18e0862-127b-43ca-be12-1a542c75c7c5
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects Windows error reporting events where the process that crashed is LSASS
  (Local Security Authority Subsystem Service). This could be the cause of a
  provoked crash by techniques such as Lsass-Shtinkering to dump credentials.
  MITRE ATT&CK: T1003.001.

data_source:
  - Windows Application Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_providerName:
              value: "Application Error"
              case_insensitive: true
        - term:
            data_win_system_eventID: "1000"
        - term:
            data_win_eventdata_appName:
              value: "lsass.exe"
              case_insensitive: true
        - term:
            data_win_eventdata_exceptionCode:
              value: "c0000001"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName
    - data_win_eventdata_appName
    - data_win_eventdata_exceptionCode

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_providerName equals 'Application Error';
  data_win_system_eventID equals '1000'; data_win_eventdata_appName equals
  'lsass.exe', among other conditions.

known_false_positives: >
  Rare legitimate crashing of the lsass process. Baseline expected activity in
  your environment and tune this detection before relying on it for automated
  response.

references:
  - https://github.com/deepinstinct/Lsass-Shtinkering
  - https://media.defcon.org/DEF%20CON%2030/DEF%20CON%2030%20presentations/Asaf%20Gilboa%20-%20LSASS%20Shtinkering%20Abusing%20Windows%20Error%20Reporting%20to%20Dump%20LSASS.pdf
  - https://learn.microsoft.com/en-us/openspecs/windows_protocols/ms-erref/596a1078-e883-4972-9bbc-49e60bebca55
  - https://attack.mitre.org/techniques/T1003/001/

response:
  message: >
    LSASS Process Crashed - Application detected on host $agent_name$. Matched
    data_win_system_providerName: $data_win_system_providerName$. Matched
    data_win_eventdata_appName: $data_win_eventdata_appName$. MITRE ATT&CK:
    T1003.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_system_providerName
      type: other
    - field: data_win_eventdata_appName
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.001
  custom_tags:
    - lsass
    - crashed
    - application
    - windows_application
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_providerName:/[Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn] [Ee][Rr][Rr][Oo][Rr]/ AND data_win_system_eventID:"1000" AND data_win_eventdata_appName:/[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_exceptionCode:/[Cc]0000001/

correlation:
  # Authored by the correlation engine for review. Related CoPilot Searches to run
  # around an alert from this rule, scoped to the same host/user/IP within the window.
  related_rules:
    - id: 35ba1d85-724d-42a3-889f-2e2362bcaf23
      name: "AD Privileged Users or Groups Reconnaissance"
      reason: "next kill-chain tactic: Discovery"
    - id: 17d619c1-e020-4347-957e-1d1207455c93
      name: "Active Directory Replication from Non Machine Account"
      reason: "next kill-chain tactic: Credential Access"
    - id: 87261fb2-69d0-42fe-b9de-88c6b5f65a43
      name: "Atera Agent Installation"
      reason: "next kill-chain tactic: Command and Control"
  window: 1h
