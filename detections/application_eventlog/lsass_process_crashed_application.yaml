name: LSASS Process Crashed - Application
id: a18e0862-127b-43ca-be12-1a542c75c7c5
version: 1
schema_version: "1.0"
date: "2025-12-03"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: a18e0862-127b-43ca-be12-1a542c75c7c5
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects Windows error reporting events where the process that crashed is LSASS
  (Local Security Authority Subsystem Service). This could be the cause of a
  provoked crash by techniques such as Lsass-Shtinkering to dump credentials.
  MITRE ATT&CK: T1003.001.

data_source:
  - Windows Application Event Log

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        
        - term:
            data_win_system_providerName:
              value: "Application Error"
              case_insensitive: true
        - term:
            data_win_system_eventID: "1000"
        - term:
            data_win_eventdata_appName:
              value: "lsass.exe"
              case_insensitive: true
        - term:
            data_win_eventdata_exceptionCode:
              value: "c0000001"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_system_providerName
    - data_win_eventdata_appName
    - data_win_eventdata_exceptionCode

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires the relevant built-in Windows event channel collected by the Wazuh
  agent (eventchannel localfile entry in ossec.conf). The detection looks for
  events where data_win_system_providerName equals 'Application Error';
  data_win_system_eventID equals '1000'; data_win_eventdata_appName equals
  'lsass.exe', among other conditions.

known_false_positives: >
  Rare legitimate crashing of the lsass process. Baseline expected activity in
  your environment and tune this detection before relying on it for automated
  response.

references:
  - https://github.com/deepinstinct/Lsass-Shtinkering
  - https://media.defcon.org/DEF%20CON%2030/DEF%20CON%2030%20presentations/Asaf%20Gilboa%20-%20LSASS%20Shtinkering%20Abusing%20Windows%20Error%20Reporting%20to%20Dump%20LSASS.pdf
  - https://learn.microsoft.com/en-us/openspecs/windows_protocols/ms-erref/596a1078-e883-4972-9bbc-49e60bebca55
  - https://attack.mitre.org/techniques/T1003/001/

response:
  message: >
    LSASS Process Crashed - Application detected on host $agent_name$. Matched
    data_win_system_providerName: $data_win_system_providerName$. Matched
    data_win_eventdata_appName: $data_win_eventdata_appName$. MITRE ATT&CK:
    T1003.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_system_providerName
      type: other
    - field: data_win_eventdata_appName
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.001
  custom_tags:
    - lsass
    - crashed
    - application
    - windows_application
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_providerName:/[Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn] [Ee][Rr][Rr][Oo][Rr]/ AND data_win_system_eventID:"1000" AND data_win_eventdata_appName:/[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_exceptionCode:/[Cc]0000001/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 9a4ccd1a-3526-4d99-b980-9f9c5d3a6ff3
    name: Potential Credential Dumping Via WER
    reason: 'Process-creation view of the same Lsass-Shtinkering technique: WerFault spawned against the LSASS pid is what produces the Application Error 1000 crash event and the dump.'
  - id: e5b33f7d-eb93-48b6-9851-09e1e610b6d7
    name: Credential Dumping Attempt Via WerFault
    reason: WerFault opening a handle to LSASS is the access step that precedes the forced crash and the memory dump written by Windows Error Reporting.
  - id: 6902955a-01b7-432c-b32a-6f5f81d8f625
    name: LSASS Process Dump Artefact In CrashDumps Folder
    reason: A provoked LSASS crash leaves an lsass .dmp in CrashDumps; this confirms a credential-bearing dump file actually exists on disk.
  - id: c8da0dfd-4ed0-4b68-962d-13c9c884384e
    name: Potential Credential Dumping Via LSASS Process Clone
    reason: Sibling WER/fork-based LSASS dumping technique without a classic handle read; same operator goal, often tried alongside shtinkering.
  - id: 5ef9853e-4d0e-4a70-846f-a9ca37d876da
    name: Potential Credential Dumping Activity Via LSASS
    reason: Direct LSASS memory-access detection; tooling touching LSASS first would make the crash a fallback or companion event.
  - id: a18dd26b-6450-46de-8c91-9659150cf088
    name: Potentially Suspicious GrantedAccess Flags On LSASS
    reason: Dump-capable access masks on LSASS shortly before the crash indicate deliberate dumping preparation rather than a genuine fault.
  - id: 28a452f3-786c-4fd8-b8f2-bddbe9d616d1
    name: Creation of WerFault.exe/Wer.dll in Unusual Folder
    reason: Attackers abusing WerFault may stage a copy or hijack Wer.dll; links WER-abuse tooling to the crash.
  - id: f8a66a02-4a16-46e5-b7fd-a42c8a93d137
    name: LSASS Crash Via Netlogon Stack Buffer Overflow - CVE-2026-41089
    reason: Alternative cause of an LSASS crash on a DC (remote exploitation); lets the analyst separate exploit-driven crash from a provoked dump.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: WerFault launched against another process (silent exit / -u -p -s dumping)
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ww][Ee][Rr][Ff][Aa][Uu][Ll][Tt]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*-[Pp] [0-9]+.*/ OR data_win_eventdata_commandLine:/.*-[Ss] [0-9]+.*/ OR data_win_eventdata_commandLine:/.*-[Uu] .*/)
    pivot_on:
    - host
    window: 1h
  - name: SilentProcessExit / WER LocalDumps registry configuration
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13" OR data_win_system_eventID:"14") AND (data_win_eventdata_targetObject:*SilentProcessExit* OR data_win_eventdata_targetObject:*LocalDumps*)
    pivot_on:
    - host
    window: 2h
  - name: Dump file written to disk on this host
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:*.dmp OR data_win_eventdata_targetFilename:*.dump OR data_win_eventdata_targetFilename:*CrashDumps*)
    pivot_on:
    - host
    window: 1h
  - name: Process access to LSASS preceding the crash
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: Dump staging, compression or exfil after LSASS dump
    query: (data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\(7z|7za|rar|WinRAR|tar)\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:*.dmp*) OR (data_win_eventdata_commandLine:/.*([Cc]opy|[Xx]copy|[Cc]url|[Ss]cp).*/ AND data_win_eventdata_commandLine:*.dmp*) OR data_win_eventdata_commandLine:*Compress-Archive*)) OR (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.(zip|7z|rar)/)
    pivot_on:
    - host
    window: 4h
