name: Backup Files Deleted
id: 06125661-3814-4e03-bfa2-1e4411c60ac3
version: 1
schema_version: "1.0"
date: "2023-02-15"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 06125661-3814-4e03-bfa2-1e4411c60ac3
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects deletion of files with extensions often used for backup files.
  Adversaries may delete or remove built-in operating system data and turn off
  services designed to aid in the recovery of a corrupted system to prevent
  recovery. MITRE ATT&CK: T1490.

data_source:
  - Sysmon EventID 23/26 - File Deleted

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_win_system_eventID: "23"
              - term:
                  data_win_system_eventID: "26"
            minimum_should_match: 1
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\cmd.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\powershell.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\pwsh.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\wt.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\rundll32.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\regsvr32.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.VHD"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.bac"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.bak"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.wbcat"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.bkf"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.set"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.win"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*.dsk"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_targetFilename
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_image matches '*\cmd.exe';
  data_win_eventdata_image matches '*\powershell.exe'; data_win_eventdata_image
  matches '*\pwsh.exe', among other conditions.

known_false_positives: >
  Legitimate usage. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1490/T1490.md#atomic-test-6---windows---delete-backup-files
  - https://attack.mitre.org/techniques/T1490/

response:
  message: >
    Backup Files Deleted detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_targetFilename: $data_win_eventdata_targetFilename$.
    MITRE ATT&CK: T1490
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_targetFilename
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1490
  custom_tags:
    - backup
    - deleted
    - file_delete
    - sysmon
    - impact
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"23" OR data_win_system_eventID:"26") AND (data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]/) AND (data_win_eventdata_targetFilename:/.*\.[Vv][Hh][Dd]/ OR data_win_eventdata_targetFilename:/.*\.[Bb][Aa][Cc]/ OR data_win_eventdata_targetFilename:/.*\.[Bb][Aa][Kk]/ OR data_win_eventdata_targetFilename:/.*\.[Ww][Bb][Cc][Aa][Tt]/ OR data_win_eventdata_targetFilename:/.*\.[Bb][Kk][Ff]/ OR data_win_eventdata_targetFilename:/.*\.[Ss][Ee][Tt]/ OR data_win_eventdata_targetFilename:/.*\.[Ww][Ii][Nn]/ OR data_win_eventdata_targetFilename:/.*\.[Dd][Ss][Kk]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: 'The near-simultaneous VSS twin of this behaviour: ransomware runs ''vssadmin delete shadows'' / ''wmic shadowcopy delete'' in the same pre-encryption burst that deletes these .bak/.bkf/.vhd files, closing the other local restore path. If both fire on the host within minutes, inhibit-system-recovery is confirmed.'
  - id: 5ee2bcd0-b2ff-11eb-bb34-acde48001122
    name: Delete ShadowCopy With PowerShell
    reason: The PowerShell/WMI route to the same shadow-copy destruction. This rule's deleting image is often powershell.exe/pwsh.exe, and that same session typically enumerates and removes Win32_ShadowCopy objects moments before or after wiping the backup files.
  - id: 639c9081-f482-47d3-a0bd-ddee3d4ecd76
    name: All Backups Deleted Via Wbadmin.EXE
    reason: 'Same destroy-the-backups goal reached with a different tool: ''wbadmin delete catalog/systemstatebackup -keepVersions:0''. On servers it is frequently scripted in the very same batch that file-deletes these backup extensions.'
  - id: 9703792d-fd9a-456d-a672-ff92efe4806a
    name: Backup Catalog Deleted
    reason: 'An independent witness to the same event: Windows-Backup Application-log ID 524 fires when the backup catalog is destroyed, corroborating this Sysmon file-delete from a second telemetry source rather than overlapping tags.'
  - id: 1444443e-6757-43e4-9ea4-c8fc705f79a2
    name: Boot Configuration Tampering Via Bcdedit.EXE
    reason: 'The boot-recovery half of T1490: ''bcdedit /set recoveryenabled no'' and ''bootstatuspolicy ignoreallfailures'' kill automatic repair in the same inhibit-recovery sequence, usually from the same shell seconds apart.'
  - id: db1c21e4-cd66-4b4e-85ca-590f0780529c
    name: Windows Recovery Environment Disabled Via Reagentc
    reason: '''reagentc /disable'' tears down the Windows Recovery Environment (WinRE) - yet another restore path the operator closes right beside deleting backups, completing the recovery-inhibition set.'
  - id: 4b046706-5789-4673-b111-66f25fe99534
    name: Deleted Data Overwritten Via Cipher.EXE
    reason: 'The destructive follow-through: ''cipher /w'' overwrites free space so the backup files this rule just caught being deleted cannot be forensically carved back, ensuring the destruction is irreversible.'
  - id: 8f3a614f-6b98-4f7d-82dd-d0df38452a8b
    name: Windows Excessive Service Stop Attempt
    reason: Ransomware stops backup-agent, database and AV services (net/sc stop|delete) so their open backup files unlock and become deletable and defenses drop - this service-takedown typically brackets the backup-file deletion.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Sibling recovery-inhibition commands on this host (shadow copies, wbadmin, bcdedit, reagentc, cipher wipe)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*[Dd][Ee][Ll][Ee][Tt][Ee].*[Ss][Hh][Aa][Dd][Oo][Ww].*/ OR data_win_eventdata_commandLine:/.*[Ss][Hh][Aa][Dd][Oo][Ww][Cc][Oo][Pp][Yy].*[Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ww][Bb][Aa][Dd][Mm][Ii][Nn].*[Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Bb][Cc][Dd][Ee][Dd][Ii][Tt].*[Rr][Ee][Cc][Oo][Vv][Ee][Rr][Yy][Ee][Nn][Aa][Bb][Ll][Ee][Dd].*/ OR data_win_eventdata_commandLine:/.*[Bb][Cc][Dd][Ee][Dd][Ii][Tt].*[Bb][Oo][Oo][Tt][Ss][Tt][Aa][Tt][Uu][Ss][Pp][Oo][Ll][Ii][Cc][Yy].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Aa][Gg][Ee][Nn][Tt][Cc].*[Dd][Ii][Ss][Aa][Bb][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Cc][Ii][Pp][Hh][Ee][Rr].* \/[Ww].*/)
    pivot_on:
    - host
    window: 2h
  - name: Full scope of backup-file deletion on this host - any deleting process (EID 23/26)
    query: (data_win_system_eventID:"23" OR data_win_system_eventID:"26") AND (data_win_eventdata_targetFilename:/.*\.[Bb][Aa][Kk]/ OR data_win_eventdata_targetFilename:/.*\.[Bb][Kk][Ff]/ OR data_win_eventdata_targetFilename:/.*\.[Vv][Hh][Dd]/ OR data_win_eventdata_targetFilename:/.*\.[Vv][Hh][Dd][Xx]/ OR data_win_eventdata_targetFilename:/.*\.[Ww][Bb][Cc][Aa][Tt]/ OR data_win_eventdata_targetFilename:/.*\.[Bb][Aa][Cc]/ OR data_win_eventdata_targetFilename:/.*\.[Dd][Ss][Kk]/ OR data_win_eventdata_targetFilename:/.*\.[Vv][Bb][Kk]/ OR data_win_eventdata_targetFilename:/.*\.[Vv][Ii][Bb]/ OR data_win_eventdata_targetFilename:/.*\.[Tt][Ii][Bb]/ OR data_win_eventdata_targetFilename:/.*\.[Bb][Kk][Pp]/ OR data_win_eventdata_targetFilename:/.*\.[Gg][Hh][Oo]/)
    pivot_on:
    - host
    window: 2h
  - name: Backup / database / security service stop or delete on this host
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\[Ss][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Ss][Tt][Oo][Pp].*/) OR (data_win_eventdata_image:/.*\\[Ss][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Dd][Ee][Ll][Ee][Tt][Ee].*/) OR (data_win_eventdata_image:/.*\\[Nn][Ee][Tt]1?\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Ss][Tt][Oo][Pp].*/) OR data_win_eventdata_commandLine:/.*[Ss][Tt][Oo][Pp]-[Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/)
    pivot_on:
    - host
    window: 2h
  - name: Event-log clearing / USN-journal deletion on this host (anti-forensics)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll] ([Cc][Ll]|[Cc][Ll][Ee][Aa][Rr]-[Ll][Oo][Gg]).*/ OR data_win_eventdata_commandLine:/.*[Cc][Ll][Ee][Aa][Rr]-[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg].*/ OR data_win_eventdata_commandLine:/.*[Ff][Ss][Uu][Tt][Ii][Ll] [Uu][Ss][Nn] [Dd][Ee][Ll][Ee][Tt][Ee][Jj][Oo][Uu][Rr][Nn][Aa][Ll].*/)
    pivot_on:
    - host
    window: 2h
  - name: Ransom note written on this host (encryption follow-through)
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Rr][Ee][Aa][Dd].?[Mm][Ee].*\.[Tt][Xx][Tt]/ OR data_win_eventdata_targetFilename:/.*[Hh][Oo][Ww].?[Tt][Oo].*[Dd][Ee][Cc][Rr][Yy][Pp][Tt].*/ OR data_win_eventdata_targetFilename:/.*[Dd][Ee][Cc][Rr][Yy][Pp][Tt].*[Ii][Nn][Ss][Tt][Rr][Uu][Cc][Tt][Ii][Oo][Nn].*/ OR data_win_eventdata_targetFilename:/.*[Rr][Ee][Ss][Tt][Oo][Rr][Ee].?[Ff][Ii][Ll][Ee][Ss].*/ OR data_win_eventdata_targetFilename:/.*[Rr][Ee][Cc][Oo][Vv][Ee][Rr].?[Ff][Ii][Ll][Ee][Ss].*/ OR data_win_eventdata_targetFilename:/.*[Uu][Nn][Ll][Oo][Cc][Kk].*\.[Tt][Xx][Tt]/)
    pivot_on:
    - host
    window: 1h
