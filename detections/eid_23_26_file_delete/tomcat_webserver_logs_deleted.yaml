name: Tomcat WebServer Logs Deleted
id: 270185ff-5f50-4d6d-a27f-24c3b8c9fef8
version: 1
schema_version: "1.0"
date: "2023-02-16"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 270185ff-5f50-4d6d-a27f-24c3b8c9fef8
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the deletion of tomcat WebServer logs which may indicate an attempt to
  destroy forensic evidence. MITRE ATT&CK: T1070.

data_source:
  - Sysmon EventID 23/26 - File Deleted

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_win_system_eventID: "23"
              - term:
                  data_win_system_eventID: "26"
            minimum_should_match: 1
        
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*\\\\Tomcat*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*\\\\logs\\\\*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*catalina.*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*_access_log.*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*localhost.*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  '*\Tomcat*'; data_win_eventdata_targetFilename matches '*\logs\*';
  data_win_eventdata_targetFilename matches '*catalina.*', among other
  conditions.

known_false_positives: >
  During uninstallation of the tomcat server. During log rotation. Baseline
  expected activity in your environment and tune this detection before relying
  on it for automated response.

references:
  - Internal Research
  - https://linuxhint.com/view-tomcat-logs-windows/
  - https://attack.mitre.org/techniques/T1070/

response:
  message: >
    Tomcat WebServer Logs Deleted detected on host $agent_name$. Matched
    data_win_eventdata_targetFilename: $data_win_eventdata_targetFilename$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1070
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1070
  custom_tags:
    - tomcat
    - webserver
    - deleted
    - file_delete
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"23" OR data_win_system_eventID:"26") AND data_win_eventdata_targetFilename:/.*\\[Tt][Oo][Mm][Cc][Aa][Tt].*/ AND data_win_eventdata_targetFilename:/.*\\[Ll][Oo][Gg][Ss]\\.*/ AND (data_win_eventdata_targetFilename:/.*[Cc][Aa][Tt][Aa][Ll][Ii][Nn][Aa]\..*/ OR data_win_eventdata_targetFilename:/.*_[Aa][Cc][Cc][Ee][Ss][Ss]_[Ll][Oo][Gg]\..*/ OR data_win_eventdata_targetFilename:/.*[Ll][Oo][Cc][Aa][Ll][Hh][Oo][Ss][Tt]\..*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: bed2a484-9348-4143-8a8a-b801c979301c
    name: Webshell Detection With Command Line Keywords
    reason: Fires when a Tomcat/Java web-server process (ws_tomcatservice.exe, or java.exe with catalina.jar/CATALINA_HOME) spawns recon/command-exec processes - the hands-on-keyboard web-shell activity whose HTTP request records live in the very catalina/access logs this alert is deleting.
  - id: f64e5c19-879c-4bae-b471-6d84c8339677
    name: Webshell Tool Reconnaissance Activity
    reason: Detects web-server-spawned processes (explicitly including Tomcat) probing for perl/python/wget - early web-shell reconnaissance on the same Tomcat host; its traces in the access log are exactly what the deletion is erasing.
  - id: 7c97c625-0350-4f0a-8943-f6cadc88125e
    name: Mint Sandstorm - Log4J Wstomcat Process Execution
    reason: Log4Shell RCE spawning child processes from the Tomcat service (ws_tomcatservice.exe) - a concrete Tomcat initial-access vector that precedes an attacker wiping the Tomcat logs to hide the exploit requests.
  - id: 39f1f9f2-9636-45de-98f6-a4046aa8e4b9
    name: Potential Webshell Creation On Static Website
    reason: Creation of a web-shell-extension file in a web root - the foothold drop; deleting the catalina/access logs afterwards removes the HTTP record of the upload and of the subsequent web-shell calls.
  - id: 4ebc877f-4612-45cb-b3a5-8e3834db36c9
    name: Webshell Hacking Activity Patterns
    reason: Web-server parent/child patterns used for credential dumping and exfiltration through a web shell - post-exploitation on the compromised web host that the log deletion is intended to conceal.
  - id: 3eb8c339-a765-48cc-a150-4364c04652bf
    name: IIS WebServer Access Logs Deleted
    reason: The sibling anti-forensic action on the other common Windows web server; both firing on one host signals deliberate, systematic destruction of web access-log evidence rather than routine log rotation.
  - id: 0649be4a-aeb0-45b0-b89e-7f1668f6d9c0
    name: IIS WebServer Log Deletion via CommandLine Utilities
    reason: The identical playbook - compromise a web app, then delete the web-server logs to cover tracks - executed via del/command-line on IIS; co-occurrence points to the same actor clearing every web log on the host.
  - id: 63c779ba-f638-40a0-a593-ddd45e8b1ddc
    name: EventLog EVTX File Deleted
    reason: Deletion of Windows .evtx files, the broader evidence-destruction step that routinely accompanies clearing web-server logs during intrusion cleanup on the same host.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Tomcat/Java web-server process spawning shells or recon tools on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Jj][Aa][Vv][Aa][Ww]?\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Tt][Oo][Mm][Cc][Aa][Tt][0-9]*\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ww][Ss]_[Tt][Oo][Mm][Cc][Aa][Tt][Ss][Ee][Rr][Vv][Ii][Cc][Ee]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Hh][Oo][Aa][Mm][Ii]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Nn][Ee][Tt]1?\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ii][Pp][Cc][Oo][Nn][Ff][Ii][Gg]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ss][Yy][Ss][Tt][Ee][Mm][Ii][Nn][Ff][Oo]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Tt][Aa][Ss][Kk][Ll][Ii][Ss][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Nn][Ee][Tt][Ss][Tt][Aa][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 4h
  - name: Web shell or malicious WAR written under Tomcat webapps on this host
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\[Ww][Ee][Bb][Aa][Pp][Pp][Ss]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Tt][Oo][Mm][Cc][Aa][Tt].*/) AND (data_win_eventdata_targetFilename:/.*\.[Jj][Ss][Pp]/ OR data_win_eventdata_targetFilename:/.*\.[Jj][Ss][Pp][Xx]/ OR data_win_eventdata_targetFilename:/.*\.[Ww][Aa][Rr]/)
    pivot_on:
    - host
    window: 24h
  - name: Companion log-clearing / anti-forensic cleanup on this host
    query: (data_win_eventdata_commandLine:/.*[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll] [Cc][Ll].*/ OR data_win_eventdata_commandLine:/.*[Cc][Ll][Ee][Aa][Rr]-[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg].*/ OR data_win_eventdata_commandLine:/.*[Ff][Ss][Uu][Tt][Ii][Ll] [Uu][Ss][Nn] [Dd][Ee][Ll][Ee][Tt][Ee][Jj][Oo][Uu][Rr][Nn][Aa][Ll].*/ OR data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn] [Dd][Ee][Ll][Ee][Tt][Ee] [Ss][Hh][Aa][Dd][Oo][Ww][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ss][Dd][Ee][Ll][Ee][Tt][Ee].*/) OR (data_win_system_eventID:"1102" OR data_win_system_eventID:"104")
    pivot_on:
    - host
    window: 2h
  - name: Outbound network connections initiated by the Tomcat/Java process on this host
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:/[Tt][Rr][Uu][Ee]/ AND (data_win_eventdata_image:/.*\\[Jj][Aa][Vv][Aa][Ww]?\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Tt][Oo][Mm][Cc][Aa][Tt][0-9]*\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ss]_[Tt][Oo][Mm][Cc][Aa][Tt][Ss][Ee][Rr][Vv][Ii][Cc][Ee]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 4h
