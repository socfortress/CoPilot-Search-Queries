name: Prefetch File Deleted
id: 0a1f9d29-6465-4776-b091-7f43b26e4c89
version: 1
schema_version: "1.0"
date: "2024-01-25"
author: Cedric MAURUGEON
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 0a1f9d29-6465-4776-b091-7f43b26e4c89
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the deletion of a prefetch file which may indicate an attempt to
  destroy forensic evidence. MITRE ATT&CK: T1070.004.

data_source:
  - Sysmon EventID 23/26 - File Deleted

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_win_system_eventID: "23"
              - term:
                  data_win_system_eventID: "26"
            minimum_should_match: 1
        
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*:\\\\Windows\\\\Prefetch\\\\*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetFilename:
              value: "*.pf"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_image"
        - exists:
            field: "data_win_eventdata_user"
        - bool:
            must_not:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*:\\\\windows\\\\system32\\\\svchost.exe"
                          case_insensitive: true
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_user:
                                value: "*AUTHORI*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_user:
                                value: "*AUTORI*"
                                case_insensitive: true
                        minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetFilename
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetFilename matches
  '*:\Windows\Prefetch\*'; data_win_eventdata_targetFilename matches '*.pf';
  data_win_eventdata_image matches '*:\windows\system32\svchost.exe', among
  other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - Internal Research
  - https://www.group-ib.com/blog/hunting-for-ttps-with-prefetch-files/
  - https://attack.mitre.org/techniques/T1070/004/

response:
  message: >
    Prefetch File Deleted detected on host $agent_name$. Matched
    data_win_eventdata_targetFilename: $data_win_eventdata_targetFilename$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1070.004
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetFilename
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1070.004
  custom_tags:
    - prefetch
    - deleted
    - file_delete
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"23" OR data_win_system_eventID:"26") AND data_win_eventdata_targetFilename:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Pp][Rr][Ee][Ff][Ee][Tt][Cc][Hh]\\.*/ AND data_win_eventdata_targetFilename:/.*\.[Pp][Ff]/ AND _exists_:data_win_eventdata_image AND _exists_:data_win_eventdata_user AND NOT (data_win_eventdata_image:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_user:/.*[Aa][Uu][Tt][Hh][Oo][Rr][Ii].*/ OR data_win_eventdata_user:/.*[Aa][Uu][Tt][Oo][Rr][Ii].*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 63c779ba-f638-40a0-a593-ddd45e8b1ddc
    name: EventLog EVTX File Deleted
    reason: 'Co-occurring in the same EID 23/26 cleanup sweep: .evtx event-log files wiped alongside the prefetch, erasing both the on-disk execution record and the event trail of the same activity.'
  - id: ff301988-c231-4bd0-834c-ac9d73b86586
    name: PowerShell Console History Logs Deleted
    reason: 'Co-occurring: ConsoleHost_history.txt deleted in the same sweep to hide the commands that launched the tool whose prefetch the attacker is now removing.'
  - id: 6ddab845-b1b8-49c2-bbf7-1a11967f64bc
    name: File Deleted Via Sysinternals SDelete
    reason: 'Co-occurring mechanism: SDelete''s .AAA/.ZZZ rename-then-delete securely overwrites the very binary whose prefetch is being erased, the destruction counterpart of the prefetch wipe.'
  - id: 3109530e-ab47-4cc6-a953-cac5ebcc93ae
    name: ADS Zone.Identifier Deleted By Uncommon Application
    reason: 'Co-occurring same subtechnique (T1070.004 indicator removal): an uncommon process stripping mark-of-the-web points to the same hands-on evidence cleanup on the host.'
  - id: cc36992a-4671-4f21-a91d-6c2b72a2edf5
    name: Suspicious Eventlog Clearing or Configuration Change Activity
    reason: 'Follow-on: after deleting the .pf on disk the attacker clears or tampers the event logs via wevtutil/powershell/wmic to destroy the Sysmon trail that recorded the same activity.'
  - id: 236e7c8e-c9d9-11eb-a824-acde48001122
    name: Disable Logs Using WevtUtil
    reason: 'Follow-on: disabling event-log channels (wevtutil sl /e:false) stops new evidence being recorded while the cleanup continues, a companion defense-evasion step to the prefetch deletion.'
  - id: c1d867fe-8d95-4487-aab4-e53f2d339f90
    name: Renamed Sysinternals Sdelete Execution
    reason: 'Precursor/co-occurring: a renamed secure-delete utility running on the host is the likely process destroying the tooling whose execution the prefetch deletion is meant to conceal.'
  - id: a55349d8-9588-4c5a-8e3b-1925fe2a4ffe
    name: Exchange PowerShell Cmdlet History Deleted
    reason: 'Co-occurring on Exchange hosts: same EID 23/26 forensic-history deletion in the cleanup sweep, erasing the cmdlet trail that would show the operator''s hands-on activity.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other forensic-artifact deletions on this host (logs/history/MOTW/secure-wipe)
    query: (data_win_system_eventID:"23" OR data_win_system_eventID:"26") AND (data_win_eventdata_targetFilename:/.*\.[Ee][Vv][Tt][Xx]/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Ss][Rr][Ee][Aa][Dd][Ll][Ii][Nn][Ee]\\[Cc][Oo][Nn][Ss][Oo][Ll][Ee][Hh][Oo][Ss][Tt]_[Hh][Ii][Ss][Tt][Oo][Rr][Yy]\.[Tt][Xx][Tt]/ OR data_win_eventdata_targetFilename:/.*:[Zz][Oo][Nn][Ee]\.[Ii][Dd][Ee][Nn][Tt][Ii][Ff][Ii][Ee][Rr]/ OR data_win_eventdata_targetFilename:/.*\.[Pp][Ff]/ OR data_win_eventdata_targetFilename:/.*\.[Aa][Aa][Aa]/ OR data_win_eventdata_targetFilename:/.*\.[Zz][Zz][Zz]/)
    pivot_on:
    - host
    window: 2h
  - name: Windows event-log clearing, disabling or USN-journal deletion on this host
    query: (data_win_eventdata_commandLine:/.*[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll] [Cc][Ll].*/ OR data_win_eventdata_commandLine:/.*[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll] [Ss][Ll].*/ OR data_win_eventdata_commandLine:/.*[Cc][Ll][Ee][Aa][Rr]-[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg].*/ OR data_win_eventdata_commandLine:/.*[Ff][Ss][Uu][Tt][Ii][Ll] [Uu][Ss][Nn] [Dd][Ee][Ll][Ee][Tt][Ee][Jj][Oo][Uu][Rr][Nn][Aa][Ll].*/) OR (data_win_system_eventID:"1102" OR data_win_system_eventID:"104")
    pivot_on:
    - host
    window: 2h
  - name: Recent execution from user-writable or temp paths on this host (candidate wiped tool)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_image:/.*\\\$[Rr][Ee][Cc][Yy][Cc][Ll][Ee].*/)
    pivot_on:
    - host
    window: 4h
  - name: Shadow-copy, backup or boot-recovery destruction on this host (next impact step)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Dd][Ee][Ll][Ee][Tt][Ee].*[Ss][Hh][Aa][Dd][Oo][Ww].*/ OR data_win_eventdata_commandLine:/.*[Ss][Hh][Aa][Dd][Oo][Ww][Cc][Oo][Pp][Yy].*[Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Bb][Cc][Dd][Ee][Dd][Ii][Tt].*[Rr][Ee][Cc][Oo][Vv][Ee][Rr][Yy][Ee][Nn][Aa][Bb][Ll][Ee][Dd].*[Nn][Oo].*/ OR data_win_eventdata_commandLine:/.*[Ww][Bb][Aa][Dd][Mm][Ii][Nn] [Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_image:/.*\\[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Bb][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 4h
  - name: Secure-deletion tool execution on this host (SDelete, renamed SDelete, cipher /w)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ss][Dd][Ee][Ll][Ee][Tt][Ee].*\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ss][Dd][Ee][Ll][Ee][Tt][Ee].*\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Cc][Ii][Pp][Hh][Ee][Rr] \/[Ww].*/ OR data_win_eventdata_commandLine:/.*[Ss][Dd][Ee][Ll][Ee][Tt][Ee] .*/)
    pivot_on:
    - host
    window: 4h
