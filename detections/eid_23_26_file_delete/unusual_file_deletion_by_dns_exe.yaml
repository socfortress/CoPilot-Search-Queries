name: Unusual File Deletion by Dns.exe
id: 8f0b1fb1-9bd4-4e74-8cdf-a8de4d2adfd0
version: 1
schema_version: "1.0"
date: "2023-02-15"
author: Tim Rauch (Nextron Systems), Elastic (idea)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 8f0b1fb1-9bd4-4e74-8cdf-a8de4d2adfd0
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects an unexpected file being deleted by dns.exe which my indicate activity
  related to remote code execution or other forms of exploitation as seen in
  CVE-2020-1350 (SigRed). MITRE ATT&CK: T1133.

data_source:
  - Sysmon EventID 23/26 - File Deleted

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - bool:
            should:
              - term:
                  data_win_system_eventID: "23"
              - term:
                  data_win_system_eventID: "26"
            minimum_should_match: 1
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\dns.exe"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_targetFilename"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_targetFilename:
                    value: "*\\\\dns.log"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_targetFilename
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon file creation logging (EventID 11) enabled in the Sysmon
  configuration for the monitored paths and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_image matches '*\dns.exe';
  data_win_eventdata_targetFilename matches '*\dns.log'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.elastic.co/guide/en/security/current/unusual-file-modification-by-dns-exe.html
  - https://attack.mitre.org/techniques/T1133/

response:
  message: >
    Unusual File Deletion by Dns.exe detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_targetFilename: $data_win_eventdata_targetFilename$.
    MITRE ATT&CK: T1133
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_targetFilename
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1133
  custom_tags:
    - unusual
    - deletion
    - file_delete
    - sysmon
    - persistence
    - initial_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: (data_win_system_eventID:"23" OR data_win_system_eventID:"26") AND data_win_eventdata_image:/.*\\[Dd][Nn][Ss]\.[Ee][Xx][Ee]/ AND _exists_:data_win_eventdata_targetFilename AND NOT (data_win_eventdata_targetFilename:/.*\\[Dd][Nn][Ss]\.[Ll][Oo][Gg]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b5281f31-f9cc-4d0d-95d0-45b91c45b487
    name: DNS RCE CVE-2020-1350
    reason: 'Same SIGRed (CVE-2020-1350) exploitation seen from process creation: it fires when System32\dns.exe spawns a non-benign child, the clearest proof the DNS service was hijacked for RCE. A rogue dns.exe child and this non-log file deletion are two faces of the same in-process compromise and routinely co-occur on the host.'
  - id: a4e3d776-f12e-42c2-8510-9e6ed1f43ec3
    name: Unusual Child Process of dns.exe
    reason: 'Direct confirmation of the same hijack, broader than the CVE-specific rule: the DNS service process spawning any unexpected child. Firing in-window on this host means the dns.exe file deletion is attacker code running inside the service, not a benign file operation.'
  - id: da63bc76-61ae-11eb-ae93-0242ac130002
    name: Ntdsutil Export NTDS
    reason: 'The payoff on a DC: with SYSTEM code inside dns.exe, the operator exports the AD database (NTDS.dit + SYSTEM hive) via ntdsutil IFM, yielding every domain hash including krbtgt for Golden Ticket. The natural post-RCE objective on the same host.'
  - id: 11b1ed55-154d-4e82-8ad7-83739298f720
    name: NTDS.DIT Creation By Uncommon Process
    reason: 'Method-agnostic on-disk artifact of that AD-database theft: a copy of ntds.dit written by a process or location it should not be. Corroborates the DC credential harvest this RCE enables, whatever tool produced the copy.'
  - id: b17ea6f7-6e90-447e-a799-e6c0a493d6ce
    name: Shadow Copies Creation Using Operating Systems Utilities
    reason: Standard way to copy the locked ntds.dit / SYSTEM hive off a live DC via vssadmin or wmic 'shadow create'. A precursor to NTDS extraction expected on the same controller shortly after SYSTEM access is gained.
  - id: 5ef9853e-4d0e-4a70-846f-a9ca37d876da
    name: Potential Credential Dumping Activity Via LSASS
    reason: 'The other half of DC credential theft: SYSTEM running in dns.exe reads LSASS memory (dump-style access masks and dbghelp/dbgcore call traces) to harvest the domain and service credentials cached on the controller.'
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: 'The living-off-the-land LSASS dump (rundll32 comsvcs.dll MiniDump #24) a SYSTEM foothold reaches for first; an execution-level instance of the LSASS credential theft, firing on the same host.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: dns.exe spawning a child process on this host (DNS service hijack / SIGRed RCE confirmation)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Dd][Nn][Ss]\.[Ee][Xx][Ee]/ AND NOT data_win_eventdata_image:/.*\\[Cc][Oo][Nn][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: Non-log file written by dns.exe on this host (dropped exploit payload)
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*\\[Dd][Nn][Ss]\.[Ee][Xx][Ee]/ AND NOT data_win_eventdata_targetFilename:/.*\\[Dd][Nn][Ss]\.[Ll][Oo][Gg]/
    pivot_on:
    - host
    window: 2h
  - name: 'AD database theft on this DC: NTDS.dit export, shadow-copy snapshot, or ntds.dit written'
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt].*/ OR (data_win_eventdata_commandLine:/.*[Ss][Hh][Aa][Dd][Oo][Ww].*/ AND data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee].*/))) OR (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\[Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt]/)
    pivot_on:
    - host
    window: 6h
  - name: LSASS credential dumping on this DC (process access or MiniDump)
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR (data_win_eventdata_commandLine:/.*[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp].*/ AND data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Ss][Ss].*/)))
    pivot_on:
    - host
    window: 4h
  - name: Lateral movement / remote execution launched from this DC
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Pp][Ss][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Aa][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Rr][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ss][Mm][Pp][Rr][Oo][Vv][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ OR (data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Cc][Oo][Mm][Mm][Aa][Nn][Dd].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Ww]-[Pp][Ss][Ss][Ee][Ss][Ss][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ee][Nn][Tt][Ee][Rr]-[Pp][Ss][Ss][Ee][Ss][Ss][Ii][Oo][Nn].*/)))
    pivot_on:
    - host
    window: 6h
