name: Suspicious XOR Encoded PowerShell Command
id: bb780e0c-16cf-4383-8383-1e5471db6cf9
version: 1
schema_version: "1.0"
date: "2023-01-30"
author: Sami Ruohonen, Harish Segar, Tim Shelton, Teymur Kheirkhabarov, Vasiliy Burov, oscd.community, Nasreddine Bencherchali
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: bb780e0c-16cf-4383-8383-1e5471db6cf9
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects presence of a potentially xor encoded powershell command. MITRE
  ATT&CK: T1059.001, T1140, T1027.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\powershell.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\pwsh.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "PowerShell.EXE"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "pwsh.dll"
                    case_insensitive: true
              - term:
                  data_win_eventdata_description:
                    value: "Windows PowerShell"
                    case_insensitive: true
              - term:
                  data_win_eventdata_product:
                    value: "PowerShell Core 6"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*bxor*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*ForEach*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*for(*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*for *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-join *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-join'*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-join\"*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-join`*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*::Join*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*[char]*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_description
    - data_win_eventdata_product
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\powershell.exe'; data_win_eventdata_image matches '*\pwsh.exe';
  data_win_eventdata_originalFileName equals 'PowerShell.EXE', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://speakerdeck.com/heirhabarov/hunting-for-powershell-abuse?slide=65
  - https://redcanary.com/blog/yellow-cockatoo/
  - https://zero2auto.com/2020/05/19/netwalker-re/
  - https://mez0.cc/posts/cobaltstrike-powershell-exec/
  - https://attack.mitre.org/techniques/T1059/001/
  - https://attack.mitre.org/techniques/T1140/
  - https://attack.mitre.org/techniques/T1027/

response:
  message: >
    Suspicious XOR Encoded PowerShell Command detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1059.001, T1140, T1027
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
    - T1140
    - T1027
  custom_tags:
    - encoded
    - powershell
    - process_creation
    - sysmon
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Pp][Ww][Ss][Hh]\.[Dd][Ll][Ll]/ OR data_win_eventdata_description:/[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]/ OR data_win_eventdata_product:/[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll] [Cc][Oo][Rr][Ee] 6/) AND data_win_eventdata_commandLine:/.*[Bb][Xx][Oo][Rr].*/ AND (data_win_eventdata_commandLine:/.*[Ff][Oo][Rr][Ee][Aa][Cc][Hh].*/ OR data_win_eventdata_commandLine:/.*[Ff][Oo][Rr]\(.*/ OR data_win_eventdata_commandLine:/.*[Ff][Oo][Rr] .*/ OR data_win_eventdata_commandLine:/.*-[Jj][Oo][Ii][Nn] .*/ OR data_win_eventdata_commandLine:/.*-[Jj][Oo][Ii][Nn]'.*/ OR data_win_eventdata_commandLine:/.*-[Jj][Oo][Ii][Nn]\".*/ OR data_win_eventdata_commandLine:/.*-[Jj][Oo][Ii][Nn]`.*/ OR data_win_eventdata_commandLine:/.*::[Jj][Oo][Ii][Nn].*/ OR data_win_eventdata_commandLine:/.*\[[Cc][Hh][Aa][Rr]\].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e32d4572-9826-4738-b651-95fa63747e8a
    name: Base64 Encoded PowerShell Command Detected
    reason: XOR decoding is commonly layered with base64; a sibling encoded command on the same host.
  - id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
    name: PowerShell Download and Execution Cradles
    reason: The decoded XOR payload usually feeds IEX or a download cradle as the next step.
  - id: 44e24481-6202-4c62-9127-5a0ae8e3fe3d
    name: Obfuscated PowerShell OneLiner Execution
    reason: Same obfuscated one-liner style; shows the loader launched through other forms.
  - id: d7bcd677-645d-4691-a8d4-7a5602b780d1
    name: Potential PowerShell Command Line Obfuscation
    reason: Companion obfuscation heuristics fire on the same command line.
  - id: ee18ed37-0802-4268-9435-b3b91aaa18db
    name: PowerShell - Connect To Internet With Hidden Window
    reason: Hidden-window PowerShell reaching out is the typical stage after the XOR stub.
  - id: ea9bf0fa-edec-4fb8-8b78-b119f2528186
    name: Windows Defender AMSI Trigger Detected
    reason: Decoded content is scanned by AMSI and may be flagged right after execution.
  - id: 62b7ccc9-23b4-471e-aa15-6da3663c4d59
    name: PowerShell Base64 Encoded Reflective Assembly Load
    reason: XOR-decoded bytes are often loaded reflectively as a .NET assembly.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Children spawned by PowerShell
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/)
    pivot_on: host
    window: 2h
  - name: Encoded or download PowerShell commands
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*-[Ee][Nn][Cc].*/ OR data_win_eventdata_commandLine:/.*[Ff][Rr][Oo][Mm][Bb][Aa][Ss][Ee]64.*/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Ii][Ee][Xx].*/)
    pivot_on: host
    window: 2h
  - name: Outbound network from PowerShell
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Files dropped by PowerShell
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Persistence after PowerShell loader
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/)
    pivot_on: host
    window: 4h
