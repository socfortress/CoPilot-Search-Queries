name: Potential Process Execution Proxy Via CL_Invocation.ps1
id: a0459f02-ac51-4c09-b511-b8c9203fc429
version: 1
schema_version: "1.0"
date: "2023-08-17"
author: Nasreddine Bencherchali (Nextron Systems), oscd.community, Natalia Shornikova
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: a0459f02-ac51-4c09-b511-b8c9203fc429
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects calls to "SyncInvoke" that is part of the "CL_Invocation.ps1" script
  to proxy execution using "System.Diagnostics.Process". MITRE ATT&CK: T1216.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*SyncInvoke *"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*SyncInvoke *'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://lolbas-project.github.io/lolbas/Scripts/Cl_invocation/
  - https://twitter.com/bohops/status/948061991012327424
  - https://attack.mitre.org/techniques/T1216/

response:
  message: >
    Potential Process Execution Proxy Via CL_Invocation.ps1 detected on host
    $agent_name$. Matched data_win_eventdata_commandLine:
    $data_win_eventdata_commandLine$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1216
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1216
  custom_tags:
    - proxy
    - invocation
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Ss][Yy][Nn][Cc][Ii][Nn][Vv][Oo][Kk][Ee] .*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 1e0e1a81-e79b-44bc-935b-ddb9c8006b3d
    name: Potential Script Proxy Execution Via CL_Mutexverifiers.ps1
    reason: Sibling diagnostic-script LOLScript (CL_Mutexverifiers) proxying execution
  - id: c57872c7-614f-4d7f-a40d-b78c8df2d30d
    name: Assembly Loading Via CL_LoadAssembly.ps1
    reason: CL_LoadAssembly.ps1 is a sibling script of the same signed-script proxy family
  - id: 45d3a03d-f441-458c-8883-df101a3bb146
    name: Launch-VsDevShell.PS1 Proxy Execution
    reason: Another signed PowerShell script abused as an execution proxy
  - id: 59e938ff-0d6d-4dc3-b13f-36cc28734d4e
    name: Execute Code with Pester.bat
    reason: Pester.bat code execution is the same LOLScript proxy pattern
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Follow-on LOLBin execution
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]|[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]|[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 2h
  - name: Diagnostic proxy scripts invoked
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Ll]_[Ii][Nn][Vv][Oo][Cc][Aa][Tt][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*[Cc][Ll]_[Mm][Uu][Tt][Ee][Xx][Vv][Ee][Rr][Ii][Ff][Ii][Ee][Rr][Ss].*/ OR data_win_eventdata_commandLine:/.*[Cc][Ll]_[Ll][Oo][Aa][Dd][Aa][Ss][Ss][Ee][Mm][Bb][Ll][Yy].*/ OR data_win_eventdata_commandLine:/.*[Ss][Yy][Nn][Cc][Ii][Nn][Vv][Oo][Kk][Ee].*/ OR data_win_eventdata_commandLine:/.*[Mm][Aa][Nn][Aa][Gg][Ee]-[Bb][Dd][Ee]\.[Ww][Ss][Ff].*/)
    pivot_on: host
    window: 2h
  - name: Outbound connections from script interpreters
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]|[Cc][Mm][Dd]\.[Ee][Xx][Ee]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 2h
  - name: Script block calling Process.Start
    query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*[Ss][Yy][Ss][Tt][Ee][Mm]\.[Dd][Ii][Aa][Gg][Nn][Oo][Ss][Tt][Ii][Cc][Ss]\.[Pp][Rr][Oo][Cc][Ee][Ss][Ss].*/
    pivot_on: host
    window: 2h
