name: Windows File and Directory Enable ReadOnly Permissions
id: Windows-File-and-Directory-Enable-ReadOnly-Permissions
version: 4
schema_version: 1
date: '2025-11-20'
author: SOCFortress LLC
status: production
type: TTP
description: >
  Detects instances where icacls.exe, cacls.exe, or xcacls.exe are used to
  grant read-only permissions (R, REA, RA, RD) to SYSTEM, admin, S-1-1-0, or
  EVERYONE without write or execute rights. Attackers use this technique to
  lock files or directories read-only to prevent remediation or cleanup tools
  from modifying or deleting malicious artifacts. Associated with Crypto Stealer
  and NetSupport RMM Tool Abuse tradecraft.
  MITRE ATT&CK: T1222.001 (File and Directory Permissions Modification: Windows).

data_source:
  - Sysmon EventID 1 (ProcessCreate)

search:
  query:
    bool:
      must:
        - term:
            agent_name: "AGENT_NAME"
        - term:
            agent_labels_customer: "CUSTOMER_CODE"
        - term:
            data_win_system_eventID: "1"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image: "*\\icacls.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\cacls.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\xcacls.exe"
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine: "*/grant*"
              - wildcard:
                  data_win_eventdata_commandLine: "*/G *"
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine: "*SYSTEM*"
              - wildcard:
                  data_win_eventdata_commandLine: "*admin*"
              - wildcard:
                  data_win_eventdata_commandLine: "*S-1-1-0*"
              - wildcard:
                  data_win_eventdata_commandLine: "*EVERYONE*"
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine: "*:R)*"
              - wildcard:
                  data_win_eventdata_commandLine: "*:REA)*"
              - wildcard:
                  data_win_eventdata_commandLine: "*:RA)*"
              - wildcard:
                  data_win_eventdata_commandLine: "*:RD)*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "START_TIME"
              lte: "END_TIME"

parameters:
  - name: AGENT_NAME
    default: "DESKTOP-AM0HLGE"
  - name: CUSTOMER_CODE
    default: "lab"
  - name: START_TIME
    default: "now-24h"
  - name: END_TIME
    default: "now"

how_to_implement: >
  Requires Sysmon EventID 1 (ProcessCreate) flowing to the Wazuh Indexer.
  Fields data_win_eventdata_image and data_win_eventdata_commandLine are
  confirmed working across all EventID 1 detections in this environment.
  The read-only permission filter is applied via commandLine matching on
  permission strings (:R), (:REA), (:RA), (:RD) while excluding write/execute
  variants. Field-validated based on established EventID 1 detection patterns.

known_false_positives: >
  Administrators or administrative scripts may legitimately use icacls with
  read-only grants for access control hardening. Filter by parent process or
  user context as needed.

references:
  - https://www.splunk.com/en_us/blog/security/-applocker-rules-as-defense-evasion-complete-analysis.html
  - https://attack.mitre.org/techniques/T1222/001/

response:
  message: >
    File or directory permissions modified to read-only on $agent_name$ by $data_win_eventdata_user$.
    Process: $data_win_eventdata_image$.
    Command: $data_win_eventdata_commandLine$.
    MITRE ATT&CK: T1222.001
  risk_score: 49
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 49
    - field: data_win_eventdata_user
      type: user
      score: 49
  threat_objects:
    - field: data_win_eventdata_image
      type: process_name
    - field: data_win_eventdata_commandLine
      type: process

tags:
  analytic_story:
    - Crypto Stealer
    - NetSupport RMM Tool Abuse
  asset_type: Endpoint
  mitre_attack_id:
    - T1222.001
  custom_tags:
    - icacls
    - cacls
    - file_permissions
    - readonly
    - defense_evasion
  product:
    - Wazuh
  security_domain: endpoint

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: windows-files-dirs-access-rights-icacls-001
    name: Windows Files and Dirs Access Rights Modification Via Icacls
    reason: General icacls ACL tampering; same tool, broader grants/denies on the same host.
  - id: cf8d753e-a8fe-11eb-8f58-acde48001122
    name: Icacls Deny Command
    reason: Deny ACEs lock out cleanup tools the same way read-only grants do.
  - id: fa7ca5c6-c9d8-11eb-bce9-acde48001122
    name: Permission Modification using Takeown App
    reason: Takeown often precedes icacls to seize ownership before locking the files.
  - id: 6e5a3ae4-90a3-462d-9aa6-0119f638c0f1
    name: Hiding Files And Directories With Attrib exe
    reason: Attackers hide and lock malware artifacts together via attrib and icacls.
  - id: 1321dc4e-a1fe-481d-a016-52c45f0c8b4f
    name: Windows Defender Exclusions Added
    reason: Locked artifacts are paired with Defender exclusions to evade scanning.
  - id: windows-modify-acl-permission-to-files-or-folder-001
    name: Windows Modify ACL Permission To Files Or Folder
    reason: Parallel ACL modification detection via other commands.
  - id: fb9d3ff7-7348-46ab-af8c-b55f5fbf39b4
    name: Execution of Powershell Script in Public Folder
    reason: Malware staged in public/writable folders is the typical target of the lock-down.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: ACL, ownership and attribute tooling
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Ii][Cc][Aa][Cc][Ll][Ss]|[Cc][Aa][Cc][Ll][Ss]|[Xx][Cc][Aa][Cc][Ll][Ss]|[Tt][Aa][Kk][Ee][Oo][Ww][Nn]|[Aa][Tt][Tt][Rr][Ii][Bb])\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 4h
  - name: Defender exclusions or disabling
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Aa][Dd][Dd]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ee][Xx][Cc][Ll][Uu][Ss][Ii][Oo][Nn][Pp][Aa][Tt][Hh].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee][Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg].*/)
    pivot_on: host
    window: 4h
  - name: Persistence creation
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss])\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*\/[Cc][Rr][Ee][Aa][Tt][Ee].*/)) OR (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/)
    pivot_on: host
    window: 6h
  - name: Executables written to user-writable paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\([Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]|[Pp][Uu][Bb][Ll][Ii][Cc]|[Tt][Ee][Mm][Pp]|[Aa][Pp][Pp][Dd][Aa][Tt][Aa])\\.*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Pp][Ss]1|[Bb][Aa][Tt]|[Vv][Bb][Ss])/
    pivot_on: host
    window: 6h
  - name: Crypto miner or stealer indicators
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Xx][Mm][Rr][Ii][Gg].*/ OR data_win_eventdata_commandLine:/.*[Ss][Tt][Rr][Aa][Tt][Uu][Mm].*/ OR data_win_eventdata_commandLine:/.*--[Dd][Oo][Nn][Aa][Tt][Ee]-[Ll][Ee][Vv][Ee][Ll].*/ OR data_win_eventdata_commandLine:/.*[Ww][Aa][Ll][Ll][Ee][Tt].*/)
    pivot_on: host
    window: 24h
