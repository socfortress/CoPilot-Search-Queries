name: Console CodePage Lookup Via CHCP
id: 7090adee-82e2-4269-bd59-80691e7c6338
version: 1
schema_version: "1.0"
date: "2024-03-05"
author: _pete_0, TheDFIRReport
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 7090adee-82e2-4269-bd59-80691e7c6338
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects use of chcp to look up the system locale value as part of host
  discovery. MITRE ATT&CK: T1614.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_parentImage:
              value: "*\\\\cmd.exe"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_parentCommandLine:
                    value: "* -c *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentCommandLine:
                    value: "* /c *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentCommandLine:
                    value: "* –c *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentCommandLine:
                    value: "* —c *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentCommandLine:
                    value: "* ―c *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentCommandLine:
                    value: "* -r *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentCommandLine:
                    value: "* /r *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentCommandLine:
                    value: "* –r *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentCommandLine:
                    value: "* —r *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentCommandLine:
                    value: "* ―r *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentCommandLine:
                    value: "* -k *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentCommandLine:
                    value: "* /k *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentCommandLine:
                    value: "* –k *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentCommandLine:
                    value: "* —k *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentCommandLine:
                    value: "* ―k *"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\chcp.com"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*chcp"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*chcp "
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*chcp  "
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_parentCommandLine
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\cmd.exe'; data_win_eventdata_parentCommandLine matches '* -c *';
  data_win_eventdata_parentCommandLine matches '* /c *', among other conditions.

known_false_positives: >
  During Anaconda update the 'conda.exe' process will eventually execution the
  'chcp' command.. Discord was seen using chcp to look up code pages. Baseline
  expected activity in your environment and tune this detection before relying
  on it for automated response.

references:
  - https://thedfirreport.com/2022/04/04/stolen-images-campaign-ends-in-conti-ransomware/
  - https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/chcp
  - https://attack.mitre.org/techniques/T1614/001/

response:
  message: >
    Console CodePage Lookup Via CHCP detected on host $agent_name$. Matched
    data_win_eventdata_parentImage: $data_win_eventdata_parentImage$. Matched
    data_win_eventdata_parentCommandLine:
    $data_win_eventdata_parentCommandLine$. MITRE ATT&CK: T1614.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_parentCommandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1614.001
  custom_tags:
    - console
    - codepage
    - lookup
    - process_creation
    - sysmon
    - discovery
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_parentCommandLine:/.* -[Cc] .*/ OR data_win_eventdata_parentCommandLine:/.* \/[Cc] .*/ OR data_win_eventdata_parentCommandLine:/.* –[Cc] .*/ OR data_win_eventdata_parentCommandLine:/.* —[Cc] .*/ OR data_win_eventdata_parentCommandLine:/.* ―[Cc] .*/ OR data_win_eventdata_parentCommandLine:/.* -[Rr] .*/ OR data_win_eventdata_parentCommandLine:/.* \/[Rr] .*/ OR data_win_eventdata_parentCommandLine:/.* –[Rr] .*/ OR data_win_eventdata_parentCommandLine:/.* —[Rr] .*/ OR data_win_eventdata_parentCommandLine:/.* ―[Rr] .*/ OR data_win_eventdata_parentCommandLine:/.* -[Kk] .*/ OR data_win_eventdata_parentCommandLine:/.* \/[Kk] .*/ OR data_win_eventdata_parentCommandLine:/.* –[Kk] .*/ OR data_win_eventdata_parentCommandLine:/.* —[Kk] .*/ OR data_win_eventdata_parentCommandLine:/.* ―[Kk] .*/) AND data_win_eventdata_image:/.*\\[Cc][Hh][Cc][Pp]\.[Cc][Oo][Mm]/ AND (data_win_eventdata_commandLine:/.*[Cc][Hh][Cc][Pp]/ OR data_win_eventdata_commandLine:/.*[Cc][Hh][Cc][Pp] / OR data_win_eventdata_commandLine:/.*[Cc][Hh][Cc][Pp]  /)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c7942406-33dd-4377-a564-0f62db0593a3
    name: Suspicious CodePage Switch Via CHCP
    reason: Sibling chcp abuse seen with the same malware locale checks.
  - id: 689308fc-cfba-4f72-9897-796c1dc61487
    name: Potential Conti Ransomware Activity
    reason: chcp locale checks precede ransomware deployment in documented DFIR Report intrusions.
  - id: 8bc64091-6875-4881-aaf9-7bd25b5dda08
    name: Suspicious Process Patterns NTDS.DIT Exfil
    reason: Hands-on-keyboard discovery via cmd /c is followed by credential theft in the same intrusions.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Discovery commands run by cmd
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Cc][Mm][Dd]\.[Ee][Xx][Ee].*/ AND data_win_eventdata_image:(/.*[Ww][Hh][Oo][Aa][Mm][Ii]\.[Ee][Xx][Ee].*/ OR /.*[Ii][Pp][Cc][Oo][Nn][Ff][Ii][Gg]\.[Ee][Xx][Ee].*/ OR /.*[Nn][Ee][Tt]\.[Ee][Xx][Ee].*/ OR /.*[Nn][Ee][Tt]1\.[Ee][Xx][Ee].*/ OR /.*[Nn][Ll][Tt][Ee][Ss][Tt]\.[Ee][Xx][Ee].*/ OR /.*[Ss][Yy][Ss][Tt][Ee][Mm][Ii][Nn][Ff][Oo]\.[Ee][Xx][Ee].*/)
    pivot_on: host
    window: 2h
  - name: Locale discovery
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:(/.*[Cc][Hh][Cc][Pp].*/ OR /.*[Gg][Ee][Tt]-[Cc][Uu][Ll][Tt][Uu][Rr][Ee].*/ OR /.*[Gg][Ee][Tt][Uu][Ss][Ee][Rr][Dd][Ee][Ff][Aa][Uu][Ll][Tt][Uu][Ii][Ll][Aa][Nn][Gg][Uu][Aa][Gg][Ee].*/)
    pivot_on: host
    window: 4h
  - name: Cmd parents invoking chcp
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentCommandLine:/.*[Cc][Hh][Cc][Pp].*/
    pivot_on: host
    window: 4h
  - name: Archive and exfil tooling after discovery
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:(/.*7[Zz][Aa]\.[Ee][Xx][Ee].*/ OR /.*[Rr][Cc][Ll][Oo][Nn][Ee].*/ OR /.*[Rr][Aa][Rr]\.[Ee][Xx][Ee].*/)
    pivot_on: host
    window: 4h
