name: Suspicious Greedy Compression Using Rar.EXE
id: afe52666-401e-4a02-b4ff-5d128990b8cb
version: 1
schema_version: "1.0"
date: "2024-01-02"
author: X__Junior (Nextron Systems), Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: afe52666-401e-4a02-b4ff-5d128990b8cb
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects RAR usage that creates an archive from a suspicious folder, either a
  system folder or one of the folders often used by attackers for staging
  purposes. MITRE ATT&CK: T1059.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\rar.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_description:
                    value: "Command line RAR"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.exe a *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* a -m*"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* -hp*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* -r *"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine: "* ?:\\\\\\*.*"
              - wildcard:
                  data_win_eventdata_commandLine: "* ?:\\\\\\\\\\*.*"
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* ?:\\\\$Recycle.bin\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* ?:\\\\PerfLogs\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* ?:\\\\Temp*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* ?:\\\\Users\\\\Public\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* ?:\\\\Windows\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* %public%*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_description
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches '*\rar.exe';
  data_win_eventdata_description equals 'Command line RAR';
  data_win_eventdata_commandLine matches '*.exe a *', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://decoded.avast.io/martinchlumecky/png-steganography
  - https://attack.mitre.org/techniques/T1059/

response:
  message: >
    Suspicious Greedy Compression Using Rar.EXE detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_description: $data_win_eventdata_description$. MITRE
    ATT&CK: T1059
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_description
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059
  custom_tags:
    - greedy
    - compression
    - process_creation
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Rr][Aa][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_description:/[Cc][Oo][Mm][Mm][Aa][Nn][Dd] [Ll][Ii][Nn][Ee] [Rr][Aa][Rr]/ OR data_win_eventdata_commandLine:/.*\.[Ee][Xx][Ee] [Aa] .*/ OR data_win_eventdata_commandLine:/.* [Aa] -[Mm].*/) AND data_win_eventdata_commandLine:/.* -[Hh][Pp].*/ AND data_win_eventdata_commandLine:/.* -[Rr] .*/ AND (data_win_eventdata_commandLine:/.* .:\\\*\..*/ OR data_win_eventdata_commandLine:/.* .:\\\\\*\..*/ OR data_win_eventdata_commandLine:/.* .:\\\$[Rr][Ee][Cc][Yy][Cc][Ll][Ee]\.[Bb][Ii][Nn]\\.*/ OR data_win_eventdata_commandLine:/.* .:\\[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss]\\.*/ OR data_win_eventdata_commandLine:/.* .:\\[Tt][Ee][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.* .:\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_commandLine:/.* .:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\.*/ OR data_win_eventdata_commandLine:/.* %[Pp][Uu][Bb][Ll][Ii][Cc]%.*/)

