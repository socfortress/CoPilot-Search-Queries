  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Cc][Vv][Ee]-202.*/ OR data_win_eventdata_image:/.*\\[Cc][Vv][Ee]202.*/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Aa][Rr][Tt][Ii][Ff][Aa][Cc][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Aa][Rr][Tt][Ii][Ff][Aa][Cc][Tt]64\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Aa][Rr][Tt][Ii][Ff][Aa][Cc][Tt]_[Pp][Rr][Oo][Tt][Ee][Cc][Tt][Ee][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Aa][Rr][Tt][Ii][Ff][Aa][Cc][Tt]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Aa][Rr][Tt][Ii][Ff][Aa][Cc][Tt]32[Bb][Ii][Gg]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Oo][Bb][Ff][Uu][Ss][Cc][Aa][Tt][Ee][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Oo][Bb][Ff][Uu][Ss][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ee][Tt][Ee][Rr][Pp][Rr][Ee][Tt][Ee][Rr]/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Jj][Ee][Cc][Tt]\.[Pp][Ss]1.*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Cc][Vv][Ee].*/ OR data_win_eventdata_commandLine:/.*[Pp][Uu][Pp][Yy]\.[Pp][Ss]1.*/ OR data_win_eventdata_commandLine:/.*[Pp][Aa][Yy][Ll][Oo][Aa][Dd]\.[Pp][Ss]1.*/ OR data_win_eventdata_commandLine:/.*[Bb][Ee][Aa][Cc][Oo][Nn]\.[Pp][Ss]1.*/ OR data_win_eventdata_commandLine:/.*[Pp][Oo][Ww][Ee][Rr][Vv][Ii][Ee][Ww]\.[Pp][Ss]1.*/ OR data_win_eventdata_commandLine:/.*[Bb][Yy][Pp][Aa][Ss][Ss]\.[Pp][Ss]1.*/ OR data_win_eventdata_commandLine:/.*[Oo][Bb][Ff][Uu][Ss][Cc][Aa][Tt][Ee][Dd]\.[Pp][Ss]1.*/ OR data_win_eventdata_commandLine:/.*[Oo][Bb][Ff][Uu][Ss][Cc]\.[Pp][Ss]1.*/ OR data_win_eventdata_commandLine:/.*[Oo][Bb][Ff][Uu][Ss]\.[Pp][Ss]1.*/ OR data_win_eventdata_commandLine:/.*[Oo][Bb][Ff][Ss]\.[Pp][Ss]1.*/ OR data_win_eventdata_commandLine:/.*[Ee][Vv][Ii][Ll]\.[Pp][Ss]1.*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Oo][Gg][Zz]\.[Pp][Ss]1.*/ OR data_win_eventdata_commandLine:/.*_[Ee][Nn][Cc]\.[Pp][Ss]1.*/ OR data_win_eventdata_commandLine:/.*\\[Ss][Hh][Ee][Ll][Ll]\.[Pp][Ss]1.*/ OR data_win_eventdata_commandLine:/.*\\[Rr][Ss][Hh][Ee][Ll][Ll]\.[Pp][Ss]1.*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Vv][Ss][Hh][Ee][Ll][Ll]\.[Pp][Ss]1.*/ OR data_win_eventdata_commandLine:/.*\\[Aa][Vv]\.[Pp][Ss]1.*/ OR data_win_eventdata_commandLine:/.*\\[Aa][Vv]_[Tt][Ee][Ss][Tt]\.[Pp][Ss]1.*/ OR data_win_eventdata_commandLine:/.*[Aa][Dd][Rr][Ee][Cc][Oo][Nn]\.[Pp][Ss]1.*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz]\.[Pp][Ss]1.*/ OR data_win_eventdata_commandLine:/.*\\[Pp][Oo][Ww][Ee][Rr][Uu][Pp]_.*/ OR data_win_eventdata_commandLine:/.*[Pp][Oo][Ww][Ee][Rr][Uu][Pp]\.[Pp][Ss]1.*/ OR data_win_eventdata_commandLine:/.*\\[Tt][Ee][Mm][Pp]\\[Aa]\.[Pp][Ss]1.*/ OR data_win_eventdata_commandLine:/.*\\[Tt][Ee][Mm][Pp]\\[Pp]\.[Pp][Ss]1.*/ OR data_win_eventdata_commandLine:/.*\\[Tt][Ee][Mm][Pp]\\1\.[Pp][Ss]1.*/ OR data_win_eventdata_commandLine:/.*[Hh][Oo][Uu][Nn][Dd]\.[Pp][Ss]1.*/ OR data_win_eventdata_commandLine:/.*[Ee][Nn][Cc][Oo][Dd][Ee]\.[Pp][Ss]1.*/ OR data_win_eventdata_commandLine:/.*[Pp][Oo][Ww][Ee][Rr][Cc][Aa][Tt]\.[Pp][Ss]1.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: f35c5d71-b489-4e22-a115-f003df287317
    name: Potential CobaltStrike Process Patterns
    reason: artifact.exe naming is Cobalt Strike output; process patterns confirm beacon behaviour.
  - id: 15619216-e993-4721-b590-4c520615a67d
    name: Potential Meterpreter/CobaltStrike Activity
    reason: Process patterns that validate a suspected payload binary.
  - id: c4db14d9-7909-48b4-a054-aa14d89dbb19
    name: Malicious PowerShell Process - Encoded Command
    reason: Hacktool .ps1 names (payload, beacon, mimikatz) are often run via encoded PowerShell.
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: mimikatz.ps1 and similar names lead to credential theft.
  - id: c248c896-e412-4279-8c15-1c558067b6fa
    name: Enumerate All Information With Whoami.EXE
    reason: Initial recon after a PoC or payload runs.
  - id: 15b75071-74cc-47e0-b4c6-b43744a62a2b
    name: Suspicious Process Start Locations
    reason: Test and PoC binaries are often run from odd locations.
  - id: a6a39bdb-935c-4f0a-ab77-35f4bbf44d33
    name: Potentially Suspicious Powershell Script Execution From Temp Folder
    reason: Same hacktool script names executed from temp.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Network activity by flagged binary names
    query: data_win_system_eventID:3 AND data_win_eventdata_image:(/.*\\[Pp]oc\.exe/ OR /.*\\artifact.*\.exe/ OR /.*\\CVE-?202.*/ OR /.*obfus.*\.exe/)
    pivot_on: host
    window: 2h
  - name: Hacktool PowerShell script names in command lines
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*([Mm]imikatz|[Pp]ower[Vv]iew|[Pp]ower[Uu]p|[Pp]owercat|[Ii]nvoke-CVE|revshell|[Aa]d[Rr]econ|beacon\.ps1|payload\.ps1).*/
    pivot_on: host
    window: 2h
  - name: LSASS access follow-on
    query: data_win_system_eventID:10 AND data_win_eventdata_targetImage:/.*\\lsass\.exe/
    pivot_on: host
    window: 2h
  - name: Recon and discovery commands
    query: data_win_system_eventID:1 AND data_win_eventdata_image:(/.*\\whoami\.exe/ OR /.*\\net1?\.exe/ OR /.*\\nltest\.exe/ OR /.*\\systeminfo\.exe/)
    pivot_on: host
    window: 2h
  - name: Executables dropped by browsers or Office
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\.(exe|ps1|dll)/ AND data_win_eventdata_image:/.*\\(chrome|msedge|firefox|outlook|winword|excel)\.exe/
    pivot_on: host
    window: 2h
