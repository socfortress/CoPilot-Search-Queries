name: Application Removed Via Wmic.EXE
id: b53317a0-8acf-4fd1-8de8-a5401e776b96
version: 1
schema_version: "1.0"
date: "2024-07-02"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: b53317a0-8acf-4fd1-8de8-a5401e776b96
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the removal or uninstallation of an application via "Wmic.EXE". MITRE
  ATT&CK: T1047.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\WMIC.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "wmic.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*call*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*uninstall*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\WMIC.exe'; data_win_eventdata_originalFileName equals 'wmic.exe';
  data_win_eventdata_commandLine matches '*call*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1047/T1047.md#atomic-test-10---application-uninstall-using-wmic
  - https://attack.mitre.org/techniques/T1047/

response:
  message: >
    Application Removed Via Wmic.EXE detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1047
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1047
  custom_tags:
    - application
    - removed
    - process_creation
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Cc][Aa][Ll][Ll].*/ AND data_win_eventdata_commandLine:/.*[Uu][Nn][Ii][Nn][Ss][Tt][Aa][Ll][Ll].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 15434e33-5027-4914-88d5-3d4145ec25a9
    name: Potential Product Reconnaissance Via Wmic.EXE
    reason: Product enumeration (wmic product get) usually precedes choosing which application to uninstall.
  - id: e568650b-5dcd-4658-8f34-ded0b1e13992
    name: Potential Product Class Reconnaissance Via Wmic.EXE
    reason: Same enumeration via the Win32_Product class, a precursor to uninstall.
  - id: 847d5ff3-8a31-4737-a970-aeae8fe21765
    name: Potential Tampering With Security Products Via WMIC
    reason: Uninstalling AV/EDR through wmic is the main malicious use; this covers the security-product variant.
  - id: 51cbac1e-eee3-4a90-b1b7-358efb81fa0a
    name: Potential Windows Defender Tampering Via Wmic.EXE
    reason: Co-occurring Defender evasion through wmic.
  - id: 49d9671b-0a0a-4c09-8280-d215bfd30662
    name: Application Termination Attempt via Wmic.EXE
    reason: Processes are often terminated before the application is uninstalled.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Wmic product enumeration
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*[Ww]mic.*[Pp]roduct.*/
    pivot_on: host
    window: 4h
  - name: Security product stop or disable
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ss]top-[Ss]ervice.*/ OR /.*sc.*stop.*/ OR /.*net.*stop.*/ OR /.*[Tt]askkill.*/) AND data_win_eventdata_commandLine:(/.*[Dd]efender.*/ OR /.*[Ss]ense.*/ OR /.*[Ss]ophos.*/ OR /.*[Cc]rowd[Ss]trike.*/ OR /.*[Aa]ntivirus.*/)
    pivot_on: host
    window: 2h
  - name: Wmic launched by script or shell parent
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Ww]mic\.exe/ AND data_win_eventdata_parentImage:(/.*[Pp]ower[Ss]hell.*/ OR /.*[Cc]md\.exe/ OR /.*[Ww]script\.exe/ OR /.*[Cc]script\.exe/)
    pivot_on: host
    window: 2h
  - name: Defender configuration tampering
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ss]et-[Mm]p[Pp]reference.*/ OR /.*[Dd]isable[Rr]ealtime.*/)
    pivot_on: host
    window: 2h
