name: HackTool - Covenant PowerShell Launcher
id: c260b6db-48ba-4b4a-a76f-2f67644e99d2
version: 1
schema_version: "1.0"
date: "2023-02-21"
author: Florian Roth (Nextron Systems), Jonhnathan Ribeiro, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: c260b6db-48ba-4b4a-a76f-2f67644e99d2
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious command lines used in Covenant luanchers. MITRE ATT&CK:
  T1059.001, T1564.003.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*-Sta*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*-Nop*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*-Window*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*Hidden*"
                          case_insensitive: true
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*-Command*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*-EncodedCommand*"
                                case_insensitive: true
                        minimum_should_match: 1
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*sv o (New-Object IO.MemorySteam);sv d *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*mshta file.hta*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*GruntHTTP*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-EncodedCommand cwB2ACAAbwAgA*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*-Sta*'; data_win_eventdata_commandLine matches '*-Nop*';
  data_win_eventdata_commandLine matches '*-Window*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://posts.specterops.io/covenant-v0-5-eee0507b85ba
  - https://attack.mitre.org/techniques/T1059/001/
  - https://attack.mitre.org/techniques/T1564/003/

response:
  message: >
    HackTool - Covenant PowerShell Launcher detected on host $agent_name$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1059.001, T1564.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
    - T1564.003
  custom_tags:
    - hacktool
    - covenant
    - powershell
    - process_creation
    - sysmon
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND ((data_win_eventdata_commandLine:/.*-[Ss][Tt][Aa].*/ AND data_win_eventdata_commandLine:/.*-[Nn][Oo][Pp].*/ AND data_win_eventdata_commandLine:/.*-[Ww][Ii][Nn][Dd][Oo][Ww].*/ AND data_win_eventdata_commandLine:/.*[Hh][Ii][Dd][Dd][Ee][Nn].*/ AND (data_win_eventdata_commandLine:/.*-[Cc][Oo][Mm][Mm][Aa][Nn][Dd].*/ OR data_win_eventdata_commandLine:/.*-[Ee][Nn][Cc][Oo][Dd][Ee][Dd][Cc][Oo][Mm][Mm][Aa][Nn][Dd].*/)) OR data_win_eventdata_commandLine:/.*[Ss][Vv] [Oo] \([Nn][Ee][Ww]-[Oo][Bb][Jj][Ee][Cc][Tt] [Ii][Oo]\.[Mm][Ee][Mm][Oo][Rr][Yy][Ss][Tt][Ee][Aa][Mm]\);[Ss][Vv] [Dd] .*/ OR data_win_eventdata_commandLine:/.*[Mm][Ss][Hh][Tt][Aa] [Ff][Ii][Ll][Ee]\.[Hh][Tt][Aa].*/ OR data_win_eventdata_commandLine:/.*[Gg][Rr][Uu][Nn][Tt][Hh][Tt][Tt][Pp].*/ OR data_win_eventdata_commandLine:/.*-[Ee][Nn][Cc][Oo][Dd][Ee][Dd][Cc][Oo][Mm][Mm][Aa][Nn][Dd] [Cc][Ww][Bb]2[Aa][Cc][Aa][Aa][Bb][Ww][Aa][Gg][Aa].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e32d4572-9826-4738-b651-95fa63747e8a
    name: Base64 Encoded PowerShell Command Detected
    reason: Covenant Grunt launchers deliver stage via encoded PowerShell; same host likely shows other encoded invocations.
  - id: 30edb182-aa75-42c0-b0a9-e998bb29067c
    name: Potential AMSI Bypass Via .NET Reflection
    reason: Covenant stagers patch AMSI via reflection before loading the Grunt assembly.
  - id: 62b7ccc9-23b4-471e-aa15-6da3663c4d59
    name: PowerShell Base64 Encoded Reflective Assembly Load
    reason: Grunt is a .NET assembly loaded reflectively from the launcher.
  - id: 9be56c82-b1cc-4318-87eb-d138afaaca39
    name: Malicious PowerShell Process - Execution Policy Bypass
    reason: Launcher runs hidden with policy bypass; overlapping launcher command-line traits.
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: Covenant operators routinely run Mimikatz tasks after establishing a Grunt.
  - id: 56c217c3-2de2-479b-990f-5c109ba8458f
    name: HackTool - Default PowerSploit/Empire Scheduled Task Creation
    reason: Persistence frequently chosen by the same PowerShell C2 tradecraft.
  - id: 4627c6ae-6899-46e2-aa0c-6ebcb1becd19
    name: HackTool - Impacket Tools Execution
    reason: Lateral movement tooling used from the compromised host after C2 is up.
  - id: f35c5d71-b489-4e22-a115-f003df287317
    name: Potential CobaltStrike Process Patterns
    reason: Other C2 post-exploitation process patterns on same host if operator switches frameworks.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Encoded or hidden PowerShell launches
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ee]nc.*/ OR /.*-[Ww]indow.*[Hh]idden.*/ OR /.*-[Ww] +[Hh]idden.*/) AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/
    pivot_on: host
    window: 2h
  - name: PowerShell outbound network connections
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND data_win_eventdata_initiated:true
    pivot_on: host
    window: 2h
  - name: Reflective .NET assembly load into PowerShell
    query: data_win_system_eventID:7 AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND data_win_eventdata_imageLoaded:(/.*clr\.dll/ OR /.*mscoree\.dll/ OR /.*clrjit\.dll/)
    pivot_on: host
    window: 2h
  - name: Child processes spawned by PowerShell (post-exploitation)
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Pp]ower[Ss]hell.*/ AND data_win_eventdata_image:(/.*whoami\.exe/ OR /.*net1?\.exe/ OR /.*nltest\.exe/ OR /.*schtasks\.exe/ OR /.*reg\.exe/)
    pivot_on: host
    window: 4h
  - name: Persistence via scheduled task or Run key
    query: data_win_system_eventID:(1 OR 13) AND (data_win_eventdata_commandLine:/.*schtasks.*\/[Cc]reate.*/ OR data_win_eventdata_targetObject:/.*CurrentVersion\\Run.*/)
    pivot_on: host
    window: 6h
