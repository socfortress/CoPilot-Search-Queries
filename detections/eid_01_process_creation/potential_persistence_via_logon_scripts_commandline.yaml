name: Potential Persistence Via Logon Scripts - CommandLine
id: 21d856f9-9281-4ded-9377-51a1a6e2a432
version: 1
schema_version: "1.0"
date: "2023-06-09"
author: Tom Ueltschi (@c_APT_ure)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 21d856f9-9281-4ded-9377-51a1a6e2a432
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the addition of a new LogonScript to the registry value
  "UserInitMprLogonScript" for potential persistence. MITRE ATT&CK: T1037.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*UserInitMprLogonScript*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*UserInitMprLogonScript*'.

known_false_positives: >
  Legitimate addition of Logon Scripts via the command line by administrators or
  third party tools. Baseline expected activity in your environment and tune
  this detection before relying on it for automated response.

references:
  - https://cocomelonc.github.io/persistence/2022/12/09/malware-pers-20.html
  - https://attack.mitre.org/techniques/T1037/001/

response:
  message: >
    Potential Persistence Via Logon Scripts - CommandLine detected on host
    $agent_name$. Matched data_win_eventdata_commandLine:
    $data_win_eventdata_commandLine$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1037.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1037.001
  custom_tags:
    - persistence
    - logon
    - process_creation
    - sysmon
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Uu][Ss][Ee][Rr][Ii][Nn][Ii][Tt][Mm][Pp][Rr][Ll][Oo][Gg][Oo][Nn][Ss][Cc][Rr][Ii][Pp][Tt].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 24357373-078f-44ed-9ac4-6d334a668a11
    name: Direct Autorun Keys Modification
    reason: Autorun key modification is a parallel logon-time persistence.
  - id: de587dce-915e-4218-aac4-835ca6af6f70
    name: Potential Persistence Attempt Via Run Keys Using Reg.EXE
    reason: Run key persistence via reg.exe commonly appears together with logon scripts.
  - id: 921aa10f-2e74-4cca-9498-98f9ca4d6fdf
    name: Registry Modification Attempt Via VBScript
    reason: Registry writes through VBScript can set UserInitMprLogonScript.
  - id: 73bba97f-a82d-42ce-b315-9182e76c57b1
    name: Imports Registry Key From a File
    reason: A .reg import can set the logon script value.
  - id: 26488ad0-f9fd-4536-876f-52fea846a2e4
    name: HackTool - SharPersist Execution
    reason: SharPersist supports logon script persistence.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: UserInitMprLogonScript registry writes
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*UserInitMprLogonScript.*/
    pivot_on: host
    window: 6h
  - name: Writes to HKCU Environment key
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(HKCU|HKEY_CURRENT_USER)\\[Ee]nvironment.*/
    pivot_on: user
    window: 6h
  - name: Script or binary created in user-writable dirs
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*([Tt]emp|[Pp]ublic|[Pp]rogram[Dd]ata|[Aa]pp[Dd]ata).*\.(bat|cmd|ps1|vbs|js|exe)/
    pivot_on: host
    window: 2h
  - name: Shells spawned by userinit/explorer at logon
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*(userinit|explorer)\.exe/ AND data_win_eventdata_image:/.*(cmd|powershell|wscript|cscript|mshta)\.exe/
    pivot_on: user
    window: 24h
  - name: Interactive logons for the user
    query: data_win_system_eventID:4624 AND (data_win_eventdata_logonType:2 OR data_win_eventdata_logonType:10)
    pivot_on: user
    window: 24h
