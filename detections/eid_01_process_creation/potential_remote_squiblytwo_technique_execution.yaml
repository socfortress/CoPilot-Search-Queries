    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1047, T1220,
    T1059.005, T1059.007
  risk_score: 75
  severity: high
  risk_objects:
