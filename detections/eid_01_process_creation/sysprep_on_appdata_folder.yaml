name: Sysprep on AppData Folder
id: d5b9ae7a-e6fc-405e-80ff-2ff9dcc64e7e
version: 1
schema_version: "1.0"
date: "2021-11-27"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: d5b9ae7a-e6fc-405e-80ff-2ff9dcc64e7e
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious sysprep process start with AppData folder as target (as
  used by Trojan Syndicasec in Thrip report by Symantec). MITRE ATT&CK: T1059.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\sysprep.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*\\\\AppData\\\\*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\sysprep.exe'; data_win_eventdata_commandLine matches '*\AppData\*'.

known_false_positives: >
  False positives depend on scripts and administrative tools used in the
  monitored environment. Baseline expected activity in your environment and tune
  this detection before relying on it for automated response.

references:
  - https://www.symantec.com/blogs/threat-intelligence/thrip-hits-satellite-telecoms-defense-targets
  - https://app.any.run/tasks/61a296bb-81ad-4fee-955f-3b399f4aaf4b
  - https://attack.mitre.org/techniques/T1059/

response:
  message: >
    Sysprep on AppData Folder detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1059
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059
  custom_tags:
    - sysprep
    - appdata
    - folder
    - process_creation
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss][Yy][Ss][Pp][Rr][Ee][Pp]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: ac175779-025a-4f12-98b0-acdaeb77ea85
    name: PowerShell Script Run in AppData
    reason: Syndicasec-style droppers stage in AppData and run scripts from there around the sysprep launch.
  - id: c5c00f49-b3f9-45a6-997e-cfdecc6e1967
    name: Suspicious Schtasks Execution AppData Folder
    reason: Persistence via scheduled task from the same AppData staging folder.
  - id: 1ac8666b-046f-4201-8aba-1951aaec03a3
    name: Command Line Execution with Suspicious URL and AppData Strings
    reason: Downloader command lines staging payloads into AppData.
  - id: cbec226f-63d9-4eca-9f52-dfb6652f24df
    name: Suspicious Process Parents
    reason: Sysprep spawned by an unusual parent shows the dropper chain.
  - id: 17769c90-230e-488b-a463-e05c08e9d48f
    name: Powershell Defender Exclusion
    reason: Operators often exclude their AppData staging path from Defender.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Files dropped into AppData
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Aa]pp[Dd]ata.*\.(exe|dll|bat|ps1|vbs|js|tmp)/
    pivot_on:
    - host
    window: 6h
  - name: Execution out of AppData
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Aa]pp[Dd]ata.*\.exe/
    pivot_on:
    - host
    window: 6h
  - name: Persistence Run keys pointing to AppData
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*(CurrentVersion.[Rr]un|[Ss]tartup).*/ AND data_win_eventdata_details:/.*[Aa]pp[Dd]ata.*/
    pivot_on:
    - host
    window: 6h
  - name: Outbound connections from AppData processes
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Aa]pp[Dd]ata.*/
    pivot_on:
    - host
    window: 6h
  - name: Sysprep launches
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Ss]ysprep\.exe/
    pivot_on:
    - host
    window: 24h
