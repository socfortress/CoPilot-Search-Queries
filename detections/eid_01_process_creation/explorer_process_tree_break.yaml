name: Explorer Process Tree Break
id: 949f1ffb-6e85-4f00-ae1e-c3c5b190d605
version: 1
schema_version: "1.0"
date: "2025-10-31"
author: Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron Systems), @gott_cyber
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 949f1ffb-6e85-4f00-ae1e-c3c5b190d605
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a command line process that uses explorer.exe to launch arbitrary
  commands or binaries, which is similar to cmd.exe /c, only it breaks the
  process tree and makes its parent a new instance of explorer spawning from
  "svchost". MITRE ATT&CK: T1036.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*/factory,{75dff2b7-6936-4c06-a8bb-676a7b00b24b}*"
                    case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*explorer.exe*"
                          case_insensitive: true
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* -root,*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* /root,*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* –root,*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* —root,*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* ―root,*"
                                case_insensitive: true
                        minimum_should_match: 1
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*/factory,{75dff2b7-6936-4c06-a8bb-676a7b00b24b}*';
  data_win_eventdata_commandLine matches '*explorer.exe*';
  data_win_eventdata_commandLine matches '* -root,*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/CyberRaiju/status/1273597319322058752
  - https://twitter.com/bohops/status/1276357235954909188?s=12
  - https://twitter.com/nas_bench/status/1535322450858233858
  - https://securityboulevard.com/2019/09/deobfuscating-ostap-trickbots-34000-line-javascript-downloader/
  - https://attack.mitre.org/techniques/T1036/

response:
  message: >
    Explorer Process Tree Break detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1036
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1036
  custom_tags:
    - explorer
    - break
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*\/[Ff][Aa][Cc][Tt][Oo][Rr][Yy],\{75[Dd][Ff][Ff]2[Bb]7-6936-4[Cc]06-[Aa]8[Bb][Bb]-676[Aa]7[Bb]00[Bb]24[Bb]\}.*/ OR (data_win_eventdata_commandLine:/.*[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\.[Ee][Xx][Ee].*/ AND (data_win_eventdata_commandLine:/.* -[Rr][Oo][Oo][Tt],.*/ OR data_win_eventdata_commandLine:/.* \/[Rr][Oo][Oo][Tt],.*/ OR data_win_eventdata_commandLine:/.* –[Rr][Oo][Oo][Tt],.*/ OR data_win_eventdata_commandLine:/.* —[Rr][Oo][Oo][Tt],.*/ OR data_win_eventdata_commandLine:/.* ―[Rr][Oo][Oo][Tt],.*/)))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 534f2ef7-e8a2-4433-816d-c91bccde289b
    name: Explorer NOUACCHECK Flag
    reason: Both abuse explorer.exe relaunch to hide the true parent; seen together in the same tradecraft.
  - id: 3ae9974a-eb09-4044-8e70-8980a50c12c8
    name: Suspicious Explorer Process with Whitespace Padding - ClickFix/FileFix
    reason: ClickFix lures often launch payloads through explorer so the parent chain looks benign.
  - id: 1723e720-616d-4ddc-ab02-f7e3685a4713
    name: Rundll32 Spawned Via Explorer.EXE
    reason: Common payload executed under the broken-tree explorer parent.
  - id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
    name: PowerShell Download and Execution Cradles
    reason: 'Typical payload launched via the explorer trick: a download cradle.'
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Real parent that invoked explorer
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ee]xplorer.*[-\/]root,.*/ OR *75dff2b7-6936-4c06-a8bb-676a7b00b24b*)
    pivot_on: host
    window: 2h
  - name: Script hosts spawned by explorer
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Ee]xplorer\.exe/ AND data_win_eventdata_image:(/.*[Pp]ower[Ss]hell.*/ OR /.*[Cc]md\.exe/ OR /.*[Mm]shta.*/ OR /.*[Ww]script.*/ OR /.*[Cc]script.*/)
    pivot_on: host
    window: 2h
  - name: Outbound connections from script hosts
    query: data_win_system_eventID:3 AND data_win_eventdata_image:(/.*[Pp]ower[Ss]hell.*/ OR /.*[Mm]shta.*/ OR /.*[Rr]undll32.*/) AND data_win_eventdata_initiated:true
    pivot_on: host
    window: 4h
  - name: Executables dropped in user-writable paths
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(/.*[Aa]pp[Dd]ata.*\.(exe|dll|ps1|bat)/ OR /.*[Tt]emp.*\.(exe|dll|ps1|bat)/)
    pivot_on: host
    window: 4h
