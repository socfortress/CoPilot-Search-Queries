name: RDP Port Forwarding Rule Added Via Netsh.EXE
id: 782d6f3e-4c5d-4b8c-92a3-1d05fed72e63
version: 1
schema_version: "1.0"
date: "2023-02-13"
author: Florian Roth (Nextron Systems), oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 782d6f3e-4c5d-4b8c-92a3-1d05fed72e63
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of netsh to configure a port forwarding of port 3389
  (RDP) rule. MITRE ATT&CK: T1090.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\netsh.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "netsh.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* i*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* p*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine: "*=3389*"
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* c*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\netsh.exe'; data_win_eventdata_originalFileName equals 'netsh.exe';
  data_win_eventdata_commandLine matches '* i*', among other conditions.

known_false_positives: >
  Legitimate administration activity. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://www.fireeye.com/blog/threat-research/2019/01/bypassing-network-restrictions-through-rdp-tunneling.html
  - https://attack.mitre.org/techniques/T1090/

response:
  message: >
    RDP Port Forwarding Rule Added Via Netsh.EXE detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1090
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1090
  custom_tags:
    - forwarding
    - added
    - netsh
    - process_creation
    - sysmon
    - lateral_movement
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Nn][Ee][Tt][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Nn][Ee][Tt][Ss][Hh]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.* [Ii].*/ AND data_win_eventdata_commandLine:/.* [Pp].*/ AND data_win_eventdata_commandLine:/.*=3389.*/ AND data_win_eventdata_commandLine:/.* [Cc].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 322ed9ec-fcab-4f67-9a34-e7c6aef43614
    name: New Port Forwarding Rule Added Via Netsh.EXE
    reason: Generic netsh portproxy rule on the same host; confirms the 3389 forward is part of a wider tunnel setup.
  - id: cd5cfd80-aa5f-44c0-9c20-108c4ae12e3c
    name: New Firewall Rule Added Via Netsh.EXE
    reason: Attacker typically opens an inbound firewall rule so the forwarded RDP port is reachable.
  - id: 6860a62c-9203-11eb-9e05-acde48001122
    name: Disabling Firewall with Netsh
    reason: Firewall disabling is an alternative way to make the forwarded RDP listener reachable.
  - id: 8a3038e8-9c9d-46f8-b184-66234a160f6f
    name: Potential Remote Desktop Tunneling
    reason: Other RDP tunneling on the host indicates the same pivot objective.
  - id: f38ce0b9-5e97-4b47-a211-7dc8d8b871da
    name: Potential RDP Tunneling Via Plink
    reason: Plink/SSH tunnels are the usual alternate or companion RDP pivot channel.
  - id: 954f0af7-62dd-418f-b3df-a84bc2c7a774
    name: New Remote Desktop Connection Initiated Via Mstsc.EXE
    reason: 'Follow-on: operator RDPs through the pivot, often via mstsc on another host.'
  - id: cf93e05e-d798-4d9e-b522-b0248dc61eaf
    name: HackTool - SharpChisel Execution
    reason: Chisel is a common tunneling tool deployed alongside or instead of portproxy for pivoting.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Netsh portproxy and firewall changes
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Nn]etsh\.exe/ AND (data_win_eventdata_commandLine:*[Pp]ortproxy* OR data_win_eventdata_commandLine:*[Ff]irewall*)
    pivot_on: host
    window: 4h
  - name: RDP enablement via registry or services
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:*fDenyTSConnections* OR data_win_eventdata_commandLine:*TermService* OR data_win_eventdata_commandLine:*UserAuthentication*)
    pivot_on: host
    window: 4h
  - name: Tunneling tools executed
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*\\(plink|chisel|ngrok|frpc|socat|ssh)\.exe/ OR data_win_eventdata_commandLine:*3389*)
    pivot_on: host
    window: 6h
  - name: Inbound RDP logons
    query: data_win_system_eventID:4624 AND data_win_eventdata_logonType:10
    pivot_on: host
    window: 24h
  - name: Remote RDP connections from host
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Mm]stsc\.exe/
    pivot_on: host
    window: 6h
