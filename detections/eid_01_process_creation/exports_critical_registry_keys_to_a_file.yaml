name: Exports Critical Registry Keys To a File
id: 82880171-b475-4201-b811-e9c826cd5eaa
version: 1
schema_version: "1.0"
date: "2024-03-13"
author: Oddvar Moe, Sander Wiebing, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 82880171-b475-4201-b811-e9c826cd5eaa
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the export of a crital Registry key to a file. MITRE ATT&CK: T1012.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\regedit.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "REGEDIT.EXE"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -E *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /E *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* –E *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* —E *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* ―E *"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*hklm*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*hkey_local_machine*"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\system"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\sam"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\security"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\regedit.exe'; data_win_eventdata_originalFileName equals 'REGEDIT.EXE';
  data_win_eventdata_commandLine matches '* -E *', among other conditions.

known_false_positives: >
  Dumping hives for legitimate purpouse i.e. backup or forensic investigation.
  Baseline expected activity in your environment and tune this detection before
  relying on it for automated response.

references:
  - https://lolbas-project.github.io/lolbas/Binaries/Regedit/
  - https://gist.github.com/api0cradle/cdd2d0d0ec9abb686f0e89306e277b8f
  - https://attack.mitre.org/techniques/T1012/

response:
  message: >
    Exports Critical Registry Keys To a File detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1012
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1012
  custom_tags:
    - exports
    - critical
    - registry
    - process_creation
    - sysmon
    - exfiltration
    - discovery
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Rr][Ee][Gg][Ee][Dd][Ii][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Rr][Ee][Gg][Ee][Dd][Ii][Tt]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.* -[Ee] .*/ OR data_win_eventdata_commandLine:/.* \/[Ee] .*/ OR data_win_eventdata_commandLine:/.* –[Ee] .*/ OR data_win_eventdata_commandLine:/.* —[Ee] .*/ OR data_win_eventdata_commandLine:/.* ―[Ee] .*/) AND (data_win_eventdata_commandLine:/.*[Hh][Kk][Ll][Mm].*/ OR data_win_eventdata_commandLine:/.*[Hh][Kk][Ee][Yy]_[Ll][Oo][Cc][Aa][Ll]_[Mm][Aa][Cc][Hh][Ii][Nn][Ee].*/) AND (data_win_eventdata_commandLine:/.*\\[Ss][Yy][Ss][Tt][Ee][Mm]/ OR data_win_eventdata_commandLine:/.*\\[Ss][Aa][Mm]/ OR data_win_eventdata_commandLine:/.*\\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: fd877b94-9bb5-4191-bb25-d79cbd93c167
    name: Dumping of Sensitive Hives Via Reg.EXE
    reason: Same goal via reg save; both export SAM/SYSTEM/SECURITY for offline credential extraction.
  - id: d372f928-ce4f-11eb-a762-acde48001122
    name: Esentutl SAM Copy
    reason: Alternative technique to copy the SAM hive; co-occurrence indicates credential theft attempts.
  - id: 1af57a4b-460a-4738-9034-db68b880c665
    name: PowerShell SAM Copy
    reason: Another SAM acquisition route tried when regedit export is blocked.
  - id: e7be6119-fc37-43f0-ad4f-1f3f99be2f9f
    name: Copying Sensitive Files with Credential Data
    reason: Credential-file copying often accompanies hive export.
  - id: 9fbf5927-5261-4284-a71d-f681029ea574
    name: Compress Data and Lock With Password for Exfiltration With 7-ZIP
    reason: Exported hives are typically archived before exfiltration.
  - id: a29808fd-ef50-49ff-9c7a-59a9b040b404
    name: HackTool - Pypykatz Credentials Dumping Activity
    reason: Exported hives are parsed offline with tools like pypykatz.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other hive exports and saves
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*reg(\.exe)? +(save|export).*/ AND data_win_eventdata_commandLine:(*hklm* OR *hkey_local_machine*)
    pivot_on: host
    window: 6h
  - name: Hive-named files written to disk
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\\(sam|system|security)(\.(save|hiv|bak))?/
    pivot_on: host
    window: 6h
  - name: Archiving or staging after export
    query: data_win_system_eventID:1 AND data_win_eventdata_image:(/.*(7z|rar|winrar|tar)\.exe/ OR /.*[Pp]ower[Ss]hell.*/) AND data_win_eventdata_commandLine:(*Compress-Archive* OR * a -* OR *-hp*)
    pivot_on: host
    window: 6h
  - name: LSASS and credential dumping tools
    query: (data_win_system_eventID:1 AND data_win_eventdata_commandLine:(*lsass* OR *sekurlsa* OR *procdump*)) OR (data_win_system_eventID:10 AND data_win_eventdata_targetImage:/.*lsass\.exe/)
    pivot_on: host
    window: 6h
  - name: Network logons with harvested credentials
    query: data_win_system_eventID:(4624 OR 4648) AND data_win_eventdata_logonType:(3 OR 9 OR 10)
    pivot_on: user
    window: 24h
