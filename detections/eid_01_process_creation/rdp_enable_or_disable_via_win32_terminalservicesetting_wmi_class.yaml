name: RDP Enable or Disable via Win32_TerminalServiceSetting WMI Class
id: 4b8f6d3a-9c5e-4f2a-a7d8-6b9c3e5f2a8d
version: 1
schema_version: "1.0"
date: "2025-11-15"
author: Daniel Koifman (KoifSec), Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 4b8f6d3a-9c5e-4f2a-a7d8-6b9c3e5f2a8d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects enabling or disabling of Remote Desktop Protocol (RDP) using alternate
  methods such as WMIC or PowerShell. In PowerShell one-liner commands, the
  "SetAllowTSConnections" method of the "Win32_TerminalServiceSetting" class may
  be used to enable or disable RDP. In WMIC, the "rdtoggle" alias or
  "Win32_TerminalServiceSetting" class may be used for the same purpose. MITRE
  ATT&CK: T1021.001, T1047.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\wmic.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\powershell.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\pwsh.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "wmic.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "PowerShell.EXE"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "pwsh.dll"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*rdtoggle*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Win32_TerminalServiceSetting*"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*SetAllowTSConnections*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\wmic.exe'; data_win_eventdata_image matches '*\powershell.exe';
  data_win_eventdata_image matches '*\pwsh.exe', among other conditions.

known_false_positives: >
  Legitimate system administrators enabling RDP for remote support. System
  configuration scripts during deployment. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://www.trendmicro.com/en_gb/research/22/e/uncovering-a-kingminer-botnet-attack-using-trend-micro-managed-x.html
  - https://github.com/HackTricks-wiki/hacktricks/blob/72f20a3fa26775b932bd819f1824c6377802a768/src/windows-hardening/basic-cmd-for-pentesters.md#firewall
  - https://github.com/Lifailon/RSA/blob/rsa/Sources/RSA-1.4.1.ps1#L1468
  - https://attack.mitre.org/techniques/T1021/001/
  - https://attack.mitre.org/techniques/T1047/

response:
  message: >
    RDP Enable or Disable via Win32_TerminalServiceSetting WMI Class detected on
    host $agent_name$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1021.001, T1047
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1021.001
    - T1047
  custom_tags:
    - enable
    - disable
    - win32
    - process_creation
    - sysmon
    - lateral_movement
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Pp][Ww][Ss][Hh]\.[Dd][Ll][Ll]/) AND (data_win_eventdata_commandLine:/.*[Rr][Dd][Tt][Oo][Gg][Gg][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ww][Ii][Nn]32_[Tt][Ee][Rr][Mm][Ii][Nn][Aa][Ll][Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss][Ee][Tt][Tt][Ii][Nn][Gg].*/) AND data_win_eventdata_commandLine:/.*[Ss][Ee][Tt][Aa][Ll][Ll][Oo][Ww][Tt][Ss][Cc][Oo][Nn][Nn][Ee][Cc][Tt][Ii][Oo][Nn][Ss].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 01aeb693-138d-49d2-9403-c4f52d7d3d62
    name: RDP Connection Allowed Via Netsh.EXE
    reason: After enabling RDP the firewall is opened for port 3389.
  - id: 0d5675be-bc88-4172-86d3-1e96a4476536
    name: Potential Tampering With RDP Related Registry Keys Via Reg.EXE
    reason: Alternative or redundant RDP enablement via fDenyTSConnections.
  - id: cd5cfd80-aa5f-44c0-9c20-108c4ae12e3c
    name: New Firewall Rule Added Via Netsh.EXE
    reason: Firewall rule additions typically accompany RDP enabling.
  - id: 782d6f3e-4c5d-4b8c-92a3-1d05fed72e63
    name: RDP Port Forwarding Rule Added Via Netsh.EXE
    reason: Portproxy exposing RDP is a parallel exposure technique.
  - id: 526be59f-a573-4eea-b5f7-f0973207634d
    name: Process Creation Attempt via Wmic.EXE
    reason: Same WMIC tooling, often used remotely for lateral execution alongside the RDP change.
  - id: 8a3038e8-9c9d-46f8-b184-66234a160f6f
    name: Potential Remote Desktop Tunneling
    reason: Tunneled RDP is the likely access path once enabled.
  - id: 954f0af7-62dd-418f-b3df-a84bc2c7a774
    name: New Remote Desktop Connection Initiated Via Mstsc.EXE
    reason: RDP use from the host as lateral movement follow-on.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: RDP registry toggle and NLA downgrade
    query: data_win_system_eventID:13 AND (data_win_eventdata_targetObject:/.*[Ff][Dd]eny[Tt][Ss][Cc]onnections.*/ OR data_win_eventdata_targetObject:/.*[Uu]ser[Aa]uthentication.*/)
    pivot_on: host
    window: 4h
  - name: Firewall changes opening RDP
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*\\[Nn]etsh\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*3389.*/ OR data_win_eventdata_commandLine:/.*[Rr]emote [Dd]esktop.*/)
    pivot_on: host
    window: 4h
  - name: Inbound RDP connections
    query: data_win_system_eventID:3 AND data_win_eventdata_destinationPort:3389
    pivot_on: host
    window: 6h
  - name: RDP logons and local account/group changes
    query: (data_win_system_eventID:4624 AND data_win_eventdata_logonType:10) OR data_win_system_eventID:4720 OR data_win_system_eventID:4732
    pivot_on: host
    window: 6h
  - name: WMI-spawned or remote-node WMIC execution
    query: data_win_system_eventID:1 AND (data_win_eventdata_parentImage:/.*\\[Ww]mi[Pp]rv[Ss][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*\/[Nn]ode:.*/)
    pivot_on: host
    window: 4h
