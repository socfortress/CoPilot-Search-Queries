name: Windows Scheduled Task Created Within Public Path
id: windows-scheduled-task-created-public-path-001
version: 1
schema_version: "1.0"
date: "2026-02-23"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects creation of scheduled tasks targeting user-writable paths such as 
  Users\Public, ProgramData, Temp, AppData, Windows\Tasks, and PerfLogs via 
  Sysmon EventID 1. Adversaries use these writable locations to stage payloads 
  and create persistence via scheduled tasks. Used by IcedID, Ryuk, Medusa, 
  XWorm, AsyncRAT, Remcos, PlugX, and many other threat actors.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - wildcard:
            data_win_eventdata_commandLine: "*schtasks*/create*"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine: "*\\\\Users\\\\Public\\\\*"
              - wildcard:
                  data_win_eventdata_commandLine: "*\\\\ProgramData\\\\*"
              - wildcard:
                  data_win_eventdata_commandLine: "*\\\\Temp\\\\*"
              - wildcard:
                  data_win_eventdata_commandLine: "*\\\\AppData\\\\*"
              - wildcard:
                  data_win_eventdata_commandLine: "*\\\\Windows\\\\Tasks\\\\*"
              - wildcard:
                  data_win_eventdata_commandLine: "*\\\\PerfLogs\\\\*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-23 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-23 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Windows endpoints with Sysmon 
  installed and configured to log process creation events (EventID 1) with full 
  command-line arguments. Uses Sysmon EventID 1 instead of Windows Security 
  EventCode 4698 for broader compatibility across Windows editions.

known_false_positives: >
  Some legitimate software installers and update mechanisms may create scheduled 
  tasks in ProgramData or AppData paths. Filter based on task name, parent 
  process, and user context.

references:
  - https://attack.mitre.org/techniques/T1053/005/
  - https://redcanary.com/threat-detection-report/techniques/scheduled-task-job/

response:
  message: >
    Scheduled task created targeting public/writable path on $agent_name$. 
    Command: $data_win_eventdata_commandLine$. 
    Parent: $data_win_eventdata_parentImage$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1053.005
  risk_score: 63
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 63
  threat_objects: []

tags:
  analytic_story:
    - Ransomware
    - IcedID
    - AsyncRAT
    - XWorm
    - Remcos
    - Scheduled Tasks
    - Windows Persistence Techniques
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1053.005
  custom_tags:
    - scheduled_task
    - persistence
    - public_path
    - writable_directory
    - schtasks
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*schtasks.*\/create.*/ AND (data_win_eventdata_commandLine:/.*Users.*Public.*/ OR data_win_eventdata_commandLine:/.*ProgramData.*/ OR data_win_eventdata_commandLine:/.*Temp.*/ OR data_win_eventdata_commandLine:/.*AppData.*/ OR data_win_eventdata_commandLine:/.*Windows.*Tasks.*/ OR data_win_eventdata_commandLine:/.*PerfLogs.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 81325ce1-be01-4250-944f-b4789644556f
    name: Schedule Task Creation From Env Variable Or Potentially Suspicious Path Via Schtasks.EXE
    reason: Same behaviour via env-variable/path variants; confirms the task points at a writable location.
  - id: c5c00f49-b3f9-45a6-997e-cfdecc6e1967
    name: Suspicious Schtasks Execution AppData Folder
    reason: AppData-based task variant of the same writable-path persistence.
  - id: 39019a4e-317f-4ce3-ae63-309a8c6b53c5
    name: Suspicious Scheduled Task Creation Involving Temp Folder
    reason: Temp-folder task variant; payload was staged in a transient directory.
  - id: 8a8379b8-780b-4dbf-b1e9-31c8d112fefb
    name: Schtasks From Suspicious Folders
    reason: schtasks.exe launched from a writable folder suggests a dropped component creating its own persistence.
  - id: 69bd9b97-2be2-41b6-9816-fb08757a4d1a
    name: Potentially Suspicious Execution From Parent Process In Public Folder
    reason: A Public-folder parent spawning processes is the dropper that preceded or follows the task.
  - id: b447f7de-1e53-4cbf-bfb4-f1f6d0b04e4e
    name: Suspicious Binaries and Scripts in Public Folder
    reason: File-drop evidence of the payload the task will execute from Public.
  - id: fb9d3ff7-7348-46ab-af8c-b55f5fbf39b4
    name: Execution of Powershell Script in Public Folder
    reason: Task payload is commonly a PowerShell script in Public; shows it has run.
  - id: 02ee49e2-e294-4d0f-9278-f5b3212fc588
    name: New RUN Key Pointing to Suspicious Folder
    reason: Malware commonly adds a second persistence via Run key to the same folder.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Executable and script drops in writable paths
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc].*/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Tt][Ee][Mm][Pp]\\.*/) AND (data_win_eventdata_targetFilename:/.*\.[Ee][Xx][Ee].*/ OR data_win_eventdata_targetFilename:/.*\.[Dd][Ll][Ll].*/ OR data_win_eventdata_targetFilename:/.*\.[Pp][Ss]1.*/ OR data_win_eventdata_targetFilename:/.*\.[Vv][Bb][Ss].*/ OR data_win_eventdata_targetFilename:/.*\.[Jj][Ss].*/ OR data_win_eventdata_targetFilename:/.*\.[Bb][Aa][Tt].*/ OR data_win_eventdata_targetFilename:/.*\.[Hh][Tt][Aa].*/)
    pivot_on: host
    window: 6h
  - name: Executions from Public/ProgramData/AppData/Temp
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc].*/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Tt][Ee][Mm][Pp]\\.*/)
    pivot_on: host
    window: 6h
  - name: Run key and service autostart pointing at writable paths
    query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/ OR data_win_eventdata_targetObject:/.*\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\.*/) AND (data_win_eventdata_details:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc].*/ OR data_win_eventdata_details:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_details:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_details:/.*\\[Tt][Ee][Mm][Pp]\\.*/)
    pivot_on: host
    window: 6h
  - name: Task Scheduler registration events
    query: (data_win_system_eventID:"4698" OR data_win_system_eventID:"4702")
    pivot_on: host
    window: 6h
  - name: Network connections from binaries in writable paths
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc].*/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Tt][Ee][Mm][Pp]\\.*/)
    pivot_on: host
    window: 6h
