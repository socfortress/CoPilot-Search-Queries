name: Add New Download Source To Winget
id: 05ebafc8-7aa2-4bcd-a269-2aec93f9e842
version: 1
schema_version: "1.0"
date: "2023-04-17"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 05ebafc8-7aa2-4bcd-a269-2aec93f9e842
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects usage of winget to add new additional download sources. MITRE ATT&CK:
  T1059.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\winget.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "winget.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*source *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*add *"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\winget.exe'; data_win_eventdata_originalFileName equals 'winget.exe';
  data_win_eventdata_commandLine matches '*source *', among other conditions.

known_false_positives: >
  False positive are expected with legitimate sources. Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://learn.microsoft.com/en-us/windows/package-manager/winget/source
  - https://github.com/nasbench/Misc-Research/tree/b9596e8109dcdb16ec353f316678927e507a5b8d/LOLBINs/Winget
  - https://attack.mitre.org/techniques/T1059/

response:
  message: >
    Add New Download Source To Winget detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1059
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059
  custom_tags:
    - download
    - source
    - winget
    - process_creation
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Gg][Ee][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ww][Ii][Nn][Gg][Ee][Tt]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Ss][Oo][Uu][Rr][Cc][Ee] .*/ AND data_win_eventdata_commandLine:/.*[Aa][Dd][Dd] .*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 81a0ecb5-0a41-4ba1-b2ba-c944eb92bfa2
    name: Add Insecure Download Source To Winget
    reason: Same winget 'source add' pointing at an http/insecure repository; the higher-risk variant of planting a rogue package feed.
  - id: c15a46a0-07d4-4c87-b4b6-89207835a83b
    name: Add Potential Suspicious New Download Source To Winget
    reason: Same source-add where the URL is a raw IP address, strongly indicating an attacker-hosted feed.
  - id: fa277e82-9b78-42dd-b05c-05555c7b6015
    name: Enable Local Manifest Installation With Winget
    reason: Attackers enable local manifests before or after adding sources so unsigned packages can be installed.
  - id: 313d6012-51a0-4d93-8dfc-de8553239e25
    name: Install New Package Via Winget Local Manifest
    reason: 'Follow-on: a package is installed from the attacker-controlled manifest or source.'
  - id: a3f5c081-e75b-43a0-9f5b-51f26fe5dba2
    name: Potential Suspicious Winget Package Installation
    reason: 'Follow-on: files downloaded by winget from the new source land on disk (Zone.Identifier stream creation).'
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Winget install/source/settings invocations
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*[Ww]inget\.exe/ OR data_win_eventdata_originalFileName:/[Ww]inget\.exe/) AND data_win_eventdata_commandLine:(/.*[Ii]nstall.*/ OR /.*[Ss]ource.*/ OR /.*[Ss]ettings.*/ OR /.*[Ii]mport.*/)
    pivot_on: host
    window: 4h
  - name: AppInstaller registry/policy changes
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*[Aa]pp[Ii]nstaller.*/
    pivot_on: host
    window: 24h
  - name: Processes spawned by winget or AppInstaller
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:(/.*[Ww]inget\.exe/ OR /.*[Aa]pp[Ii]nstallerCLI\.exe/)
    pivot_on: host
    window: 2h
  - name: Script hosts launching winget
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Ww]inget\.exe/ AND data_win_eventdata_parentImage:(/.*[Pp]ower[Ss]hell.*/ OR /.*[Pp]wsh\.exe/ OR /.*cmd\.exe/ OR /.*wscript\.exe/ OR /.*mshta\.exe/)
    pivot_on: host
    window: 2h
