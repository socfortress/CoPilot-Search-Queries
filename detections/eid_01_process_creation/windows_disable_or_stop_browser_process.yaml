name: Windows Disable or Stop Browser Process
id: windows-disable-stop-browser-process-001
version: 1
schema_version: "1.0"
date: "2026-02-23"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects taskkill commands targeting browser processes (Chrome, Firefox, Edge, 
  Brave, Opera, Chromium). Stealers like Braodo forcefully close browsers to 
  unlock credential files (Login Data, cookies, Local State) for extraction. 
  Also used by Hellcat ransomware and Castle RAT.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - wildcard:
            data_win_eventdata_commandLine: "*taskkill*"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine: "*chrome.exe*"
              - wildcard:
                  data_win_eventdata_commandLine: "*firefox.exe*"
              - wildcard:
                  data_win_eventdata_commandLine: "*brave.exe*"
              - wildcard:
                  data_win_eventdata_commandLine: "*opera.exe*"
              - wildcard:
                  data_win_eventdata_commandLine: "*msedge.exe*"
              - wildcard:
                  data_win_eventdata_commandLine: "*chromium.exe*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-23 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-23 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Windows endpoints with Sysmon 
  installed and configured to log process creation events (EventID 1) with full 
  command-line arguments.

known_false_positives: >
  Administrators or users may terminate browsers via taskkill. Investigate 
  parent process and whether credential files were subsequently accessed.

references:
  - https://attack.mitre.org/techniques/T1562/001/
  - https://g0njxa.medium.com/from-vietnam-to-united-states-malware-fraud-and-dropshipping-98b7a7b2c36d

response:
  message: >
    Browser process killed via taskkill on $agent_name$. 
    Command: $data_win_eventdata_commandLine$. 
    Parent: $data_win_eventdata_parentImage$. 
    User: $data_win_eventdata_user$. 
    Possible credential theft preparation. MITRE ATT&CK: T1562.001
  risk_score: 64
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 64
  threat_objects: []

tags:
  analytic_story:
    - Braodo Stealer
    - Hellcat Ransomware
    - Castle RAT
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1562.001
  custom_tags:
    - taskkill
    - browser_kill
    - credential_theft
    - stealer_preparation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*taskkill.*/ AND (data_win_eventdata_commandLine:/.*chrome\.exe.*/ OR data_win_eventdata_commandLine:/.*firefox\.exe.*/ OR data_win_eventdata_commandLine:/.*brave\.exe.*/ OR data_win_eventdata_commandLine:/.*opera\.exe.*/ OR data_win_eventdata_commandLine:/.*msedge\.exe.*/ OR data_win_eventdata_commandLine:/.*chromium\.exe.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 47147b5b-9e17-4d76-b8d2-7bac24c5ce1b
    name: Potential Browser Data Stealing
    reason: Browsers are killed to unlock Login Data and cookies; the copy of those files follows.
  - id: 6a69f62d-ce75-4b57-8dce-6351eb55b362
    name: Esentutl Steals Browser Information
    reason: Alternate way to copy locked browser DB files after closing the browser.
  - id: 8ba484e8-4b97-11ec-b19a-acde48001122
    name: Possible Browser Pass View Parameter
    reason: Credential-dump tooling run against the now-unlocked browser stores.
  - id: d0dae994-26c6-4d2d-83b5-b3c8b79ae513
    name: PUA - WebBrowserPassView Execution
    reason: Commonly executed right after browsers are closed to read saved passwords.
  - id: 5a6e1e16-07de-48d8-8aae-faa766c05e88
    name: Potential Cookies Session Hijacking
    reason: Cookie theft is the other goal of unlocking browser profile files.
  - id: 4a6713f6-3331-11ed-a261-0242ac120002
    name: Taskkill Symantec Endpoint Protection
    reason: Same taskkill tooling; stealers and ransomware kill browsers and AV in one script.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Access to browser credential and cookie stores
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*(Login Data|Local State|[Cc]ookies|Web Data|logins\.json|key[34]\.db).*/
    pivot_on: host
    window: 2h
  - name: Copy or archive of browser profile paths
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*(User Data|Mozilla\\Firefox\\Profiles).*/ AND data_win_eventdata_image:/.*(cmd|powershell|robocopy|xcopy|esentutl|7z|rar|tar)\.exe/
    pivot_on: host
    window: 2h
  - name: Taskkill launched by script interpreter
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Tt]askkill.*/ AND data_win_eventdata_parentImage:/.*(powershell|wscript|cscript|mshta|cmd)\.exe/
    pivot_on: host
    window: 2h
  - name: Upload and exfil tooling after theft
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*(curl|bitsadmin|Invoke-WebRequest|Invoke-RestMethod|api\.telegram\.org|discord).*/
    pivot_on: host
    window: 2h
