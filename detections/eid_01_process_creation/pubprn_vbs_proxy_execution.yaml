name: Pubprn.vbs Proxy Execution
id: 1fb76ab8-fa60-4b01-bddd-71e89bf555da
version: 1
schema_version: "1.0"
date: "2022-05-28"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 1fb76ab8-fa60-4b01-bddd-71e89bf555da
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the use of the 'Pubprn.vbs' Microsoft signed script to execute
  commands. MITRE ATT&CK: T1216.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*\\\\pubprn.vbs*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*script:*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*\pubprn.vbs*'; data_win_eventdata_commandLine matches '*script:*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://lolbas-project.github.io/lolbas/Scripts/Pubprn/
  - https://attack.mitre.org/techniques/T1216/001/

response:
  message: >
    Pubprn.vbs Proxy Execution detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1216.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1216.001
  custom_tags:
    - pubprn
    - proxy
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*\\[Pp][Uu][Bb][Pp][Rr][Nn]\.[Vv][Bb][Ss].*/ AND data_win_eventdata_commandLine:/.*[Ss][Cc][Rr][Ii][Pp][Tt]:.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b6676963-0353-4f88-90f5-36c20d443c6a
    name: Cscript/Wscript Potentially Suspicious Child Process
    reason: 'Wscript/Cscript spawning suspicious children: pubprn.vbs runs under cscript with a script: moniker payload.'
  - id: cea72823-df4d-4567-950c-0b579eaf0846
    name: Potential Dropper Script Execution Via WScript/CScript/MSHTA
    reason: Dropper script execution via script hosts often precedes signed-script proxy abuse.
  - id: c363385c-f75d-4753-a108-c1a8e28bdbda
    name: Potential Manage-bde.wsf Abuse To Proxy Execution
    reason: Manage-bde.wsf is a sibling signed-script LOLBin proxy technique.
  - id: 9df0dd3a-1a5c-47e3-a2bc-30ed177646a0
    name: Remote Code Execute via Winrm.vbs
    reason: Winrm.vbs is another signed Microsoft VBS used for proxy execution.
  - id: 36475a7d-0f6d-4dce-9b01-6aeb473bbaf1
    name: SyncAppvPublishingServer VBS Execute Arbitrary PowerShell Code
    reason: SyncAppvPublishingServer.vbs belongs to the same family of signed VBS proxies.
  - id: 99b7460d-c9f1-40d7-a316-1f36f61d52ee
    name: Cscript/Wscript Uncommon Script Extension Execution
    reason: Script hosts running uncommon extensions are part of the same loader chain.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Children of cscript/wscript
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\([Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt])\\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Script moniker pointing to remote or UNC payload
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Ss][Cc][Rr][Ii][Pp][Tt]:([Hh][Tt][Tt][Pp]|\\\\|[Ff][Ii][Ll][Ee]).*/
    pivot_on: host
    window: 2h
  - name: Other signed-script proxy execution
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*(\\[Ww][Ii][Nn][Rr][Mm]\\.[Vv][Bb][Ss]|[Mm][Aa][Nn][Aa][Gg][Ee]-[Bb][Dd][Ee]\\.[Ww][Ss][Ff]|[Ss][Yy][Nn][Cc][Aa][Pp][Pp][Vv][Pp][Uu][Bb][Ll][Ii][Ss][Hh][Ii][Nn][Gg][Ss][Ee][Rr][Vv][Ee][Rr]|[Cc][Ll]_[Mm][Uu][Tt][Ee][Xx][Vv][Ee][Rr][Ii][Ff][Ii][Ee][Rr][Ss]).*/
    pivot_on: host
    window: 4h
  - name: LOLBin follow-on execution
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Rr][Uu][Nn][Dd][Ll][Ll]32|[Rr][Ee][Gg][Ss][Vv][Rr]32|[Mm][Ss][Hh][Tt][Aa]|[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn])\\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Network connections by script hosts
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll])\\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
