name: Devtoolslauncher.exe Executes Specified Binary
id: cc268ac1-42d9-40fd-9ed3-8c4e1a5b87e6
version: 1
schema_version: "1.0"
date: "2021-11-27"
author: Beyu Denis, oscd.community (rule), @_felamos (idea)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: cc268ac1-42d9-40fd-9ed3-8c4e1a5b87e6
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  The Devtoolslauncher.exe executes other binary. MITRE ATT&CK: T1218.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\devtoolslauncher.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*LaunchForDeploy*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\devtoolslauncher.exe'; data_win_eventdata_commandLine matches
  '*LaunchForDeploy*'.

known_false_positives: >
  Legitimate use of devtoolslauncher.exe by legitimate user. Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://lolbas-project.github.io/lolbas/OtherMSBinaries/Devtoolslauncher/
  - https://twitter.com/_felamos/status/1179811992841797632
  - https://attack.mitre.org/techniques/T1218/

response:
  message: >
    Devtoolslauncher.exe Executes Specified Binary detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
    MITRE ATT&CK: T1218
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218
  custom_tags:
    - devtoolslauncher
    - executes
    - specified
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Dd][Ee][Vv][Tt][Oo][Oo][Ll][Ss][Ll][Aa][Uu][Nn][Cc][Hh][Ee][Rr]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Ll][Aa][Uu][Nn][Cc][Hh][Ff][Oo][Rr][Dd][Ee][Pp][Ll][Oo][Yy].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a20391f8-76fb-437b-abc0-dba2df1952c6
    name: Visual Studio NodejsTools PressAnyKey Arbitrary Binary Execution
    reason: Another Visual Studio component abused to proxy-execute arbitrary binaries.
  - id: 15c7904e-6ad1-4a45-9b46-5fb25df37fd2
    name: Malicious PE Execution by Microsoft Visual Studio Debugger
    reason: Same Visual Studio developer-tool abuse family for launching attacker PEs.
  - id: b8b1b304-a60f-4999-9a6e-c547bde03ffd
    name: DeviceCredentialDeployment Execution
    reason: Sibling LOLBin proxy-execution technique often tried alongside devtoolslauncher.
  - id: 33be4333-2c6b-44f4-ae28-102cdbde0a31
    name: Suspicious Msbuild Execution By Uncommon Parent Process
    reason: Msbuild is a common companion when abusing Visual Studio tooling for execution.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: devtoolslauncher invocations
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Dd]ev[Tt]ools[Ll]auncher\.exe/
    pivot_on: host
    window: 4h
  - name: Binaries spawned by devtoolslauncher
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Dd]ev[Tt]ools[Ll]auncher\.exe/
    pivot_on: host
    window: 4h
  - name: devtoolslauncher copied or dropped
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*[Dd]ev[Tt]ools[Ll]auncher.*/
    pivot_on: host
    window: 6h
  - name: Payloads staged in user-writable paths
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\.(exe|dll|bat|ps1)/ AND data_win_eventdata_targetFilename:/.*(Temp|ProgramData|Users.Public|AppData).*/
    pivot_on: host
    window: 2h
  - name: Visual Studio tool abuse by commandline
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(LaunchForDeploy|PressAnyKey|vsjitdebugger|MSBuild).*/
    pivot_on: host
    window: 4h
