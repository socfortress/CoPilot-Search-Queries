name: Computer System Reconnaissance Via Wmic.EXE
id: 9d7ca793-f6bd-471c-8d0f-11e68b2f0d2f
version: 1
schema_version: "1.0"
date: "2023-02-14"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 9d7ca793-f6bd-471c-8d0f-11e68b2f0d2f
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of wmic utility with the "computersystem" flag in order to
  obtain information about the machine such as the domain, username, model, etc.
  MITRE ATT&CK: T1047.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\wmic.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "wmic.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*computersystem*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\wmic.exe'; data_win_eventdata_originalFileName equals 'wmic.exe';
  data_win_eventdata_commandLine matches '*computersystem*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.microsoft.com/security/blog/2022/09/07/profiling-dev-0270-phosphorus-ransomware-operations/
  - https://attack.mitre.org/techniques/T1047/

response:
  message: >
    Computer System Reconnaissance Via Wmic.EXE detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1047
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1047
  custom_tags:
    - computer
    - system
    - reconnaissance
    - process_creation
    - sysmon
    - discovery
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr][Ss][Yy][Ss][Tt][Ee][Mm].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 3e3ceccd-6c06-48b8-b5ff-ab1d25db8c1d
    name: Hardware Model Reconnaissance Via Wmic.EXE
    reason: Same wmic host profiling, usually in the same burst.
  - id: 221b251a-357a-49a9-920a-271802777cc0
    name: Potential Process Reconnaissance via Wmic.EXE
    reason: Process listing is the next typical discovery step.
  - id: 76f55eaa-d27f-4213-9d45-7b0e4b60bbae
    name: Service Reconnaissance Via Wmic.EXE
    reason: Service enumeration in same discovery chain.
  - id: 4902d7aa-0134-11ec-9d65-acde48001122
    name: Local Account Discovery With Wmic
    reason: Account discovery alongside system profile.
  - id: 64c7adaa-48ee-483c-b0d6-7175bc65e6cc
    name: Domain Controller Discovery with Wmic
    reason: Escalates recon from host to domain.
  - id: 15434e33-5027-4914-88d5-3d4145ec25a9
    name: Potential Product Reconnaissance Via Wmic.EXE
    reason: Installed security product discovery follows host profiling.
  - id: c248c896-e412-4279-8c15-1c558067b6fa
    name: Enumerate All Information With Whoami.EXE
    reason: Privilege and identity discovery in the same sweep.
  - id: 847d5ff3-8a31-4737-a970-aeae8fe21765
    name: Potential Tampering With Security Products Via WMIC
    reason: Recon of defenses followed by tampering.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other wmic discovery
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Ww]mic\.exe/ AND data_win_eventdata_commandLine:/.*(process|service|product|useraccount|group|qfe|logicaldisk|bios).*/
    pivot_on: host
    window: 2h
  - name: Native discovery commands
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*([Ss]ysteminfo|[Ww]hoami|[Ii]pconfig|[Nn]et1?|[Nn]ltest|[Tt]asklist)\.exe/
    pivot_on: host
    window: 2h
  - name: Discovery spawned by suspicious parent
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*(winword|excel|outlook|wscript|mshta|rundll32|regsvr32)\.exe/
    pivot_on: host
    window: 2h
  - name: Defense tampering after recon
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*Set-MpPreference.*/ OR data_win_eventdata_commandLine:/.*(antivirusproduct|netsh.*firewall).*/)
    pivot_on: host
    window: 4h
  - name: Payload download or staging
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*([Cc]ertutil.*urlcache|[Bb]itsadmin.*transfer|[Ii]nvoke-WebRequest|[Cc]url.*http).*/
    pivot_on: host
    window: 2h
