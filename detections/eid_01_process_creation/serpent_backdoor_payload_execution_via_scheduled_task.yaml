name: Serpent Backdoor Payload Execution Via Scheduled Task
id: d5eb7432-fda4-4bba-a37f-ffa74d9ed639
version: 1
schema_version: "1.0"
date: "2022-03-21"
author: "@kostastsale"
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: d5eb7432-fda4-4bba-a37f-ffa74d9ed639
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects post exploitation execution technique of the Serpent backdoor.
  According to Proofpoint, one of the commands that the backdoor ran was via
  creating a temporary scheduled task using an unusual method. It creates a
  fictitious windows event and a trigger in which once the event is created, it
  executes the payload. MITRE ATT&CK: T1053.005, T1059.006.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\cmd.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\powershell.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*[System/EventID=*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*/create*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*/delete*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*/ec*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*/so*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*/tn run*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches '*\cmd.exe';
  data_win_eventdata_image matches '*\powershell.exe';
  data_win_eventdata_commandLine matches '*[System/EventID=*', among other
  conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.proofpoint.com/us/blog/threat-insight/serpent-no-swiping-new-backdoor-targets-french-entities-unique-attack-chain
  - https://attack.mitre.org/techniques/T1053/005/
  - https://attack.mitre.org/techniques/T1059/006/

response:
  message: >
    Serpent Backdoor Payload Execution Via Scheduled Task detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
    MITRE ATT&CK: T1053.005, T1059.006
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1053.005
    - T1059.006
  custom_tags:
    - serpent
    - backdoor
    - payload
    - process_creation
    - sysmon
    - privilege_escalation
    - execution
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*\[[Ss][Yy][Ss][Tt][Ee][Mm]\/[Ee][Vv][Ee][Nn][Tt][Ii][Dd]=.*/ AND data_win_eventdata_commandLine:/.*\/[Cc][Rr][Ee][Aa][Tt][Ee].*/ AND data_win_eventdata_commandLine:/.*\/[Dd][Ee][Ll][Ee][Tt][Ee].*/ AND data_win_eventdata_commandLine:/.*\/[Ee][Cc].*/ AND data_win_eventdata_commandLine:/.*\/[Ss][Oo].*/ AND data_win_eventdata_commandLine:/.*\/[Tt][Nn] [Rr][Uu][Nn].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: f2c64357-b1d2-41b7-849f-34d2682c0fad
    name: Suspicious Command Patterns In Scheduled Task Creation
    reason: Same schtasks /create with a payload-bearing /tr; plain task creation often accompanies the event-trigger variant
  - id: 89ca78fd-b37c-4310-b3d3-81a023f83936
    name: Schtasks Creation Or Modification With SYSTEM Privileges
    reason: Serpent task runs payload as SYSTEM; elevated task creation confirms privileged persistence
  - id: 81325ce1-be01-4250-944f-b4789644556f
    name: Schedule Task Creation From Env Variable Or Potentially Suspicious Path Via Schtasks.EXE
    reason: Payload staged in a user-writable path referenced by the task action
  - id: 39019a4e-317f-4ce3-ae63-309a8c6b53c5
    name: Suspicious Scheduled Task Creation Involving Temp Folder
    reason: Backdoor payloads are commonly dropped to Temp and launched by the task
  - id: ff2fff64-4cd6-4a2b-ba7d-e28a30bbe66b
    name: Suspicious Scheduled Task Name As GUID
    reason: Temporary tasks get random/GUID names to blend in
  - id: 5b16df71-8615-4f7f-ac9b-6c43c0509e61
    name: Hide Schedule Task Via Index Value Tamper
    reason: 'Follow-on: adversary hides the created task from schtasks /query'
  - id: acd74772-5f88-45c7-956b-6a7b36c294d2
    name: Removal Of SD Value to Hide Schedule Task - Registry
    reason: Follow-on anti-forensics making the task invisible
  - id: dbc1f800-0fe0-4bc0-9c66-292c2abe3f78
    name: Delete Important Scheduled Task
    reason: Temporary-task tradecraft is often followed by task cleanup or deletion
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Scheduled task create/run/delete via schtasks
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Ss]chtasks\.exe/ AND data_win_eventdata_commandLine:(/.*\/[Cc]reate.*/ OR /.*\/[Rr]un.*/ OR /.*\/[Dd]elete.*/)
    pivot_on: host
    window: 4h
  - name: Fake event written with eventcreate (trigger source)
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Ee]ventcreate\.exe/
    pivot_on: host
    window: 1h
  - name: Shell children launched by Task Scheduler
    query: data_win_system_eventID:1 AND data_win_eventdata_parentCommandLine:/.*[Ss]chedule.*/ AND data_win_eventdata_image:(/.*[Cc]md\.exe/ OR /.*[Pp]ower[Ss]hell\.exe/ OR /.*[Pp]ython.*/)
    pivot_on: host
    window: 4h
  - name: Payload download or staging
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Cc]ertutil.*urlcache.*/ OR /.*[Bb]itsadmin.*transfer.*/ OR /.*[Ii]nvoke-[Ww]eb[Rr]equest.*/ OR /.*[Cc]url.*http.*/)
    pivot_on: host
    window: 4h
  - name: Scheduled task registry cache changes
    query: data_win_system_eventID:(12 OR 13) AND data_win_eventdata_targetObject:/.*Schedule.*TaskCache.*/
    pivot_on: host
    window: 4h
