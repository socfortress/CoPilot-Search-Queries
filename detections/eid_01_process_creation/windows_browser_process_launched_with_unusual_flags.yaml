name: Windows Browser Process Launched with Unusual Flags
id: 841e2abc-0442-4e7f-b445-b22680632a08
version: 1
schema_version: 1
date: '2025-10-31'
author: SOCFortress LLC
status: production
type: Anomaly
description: >
  Detects Chromium-based browsers (Chrome, Edge, Brave, Firefox) launched with
  unusual flags such as --mute-audio, --no-de-elevate, or --do-not-de-elevate.
  These flags are associated with Castle RAT, which silently launches a browser
  for session hijacking and credential theft while suppressing audio and preventing
  privilege de-elevation. Parent process exclusions filter out standard browser
  self-spawning and system-level launches. Any browser launched with these flags
  from a non-browser, non-system parent should be investigated.
  MITRE ATT&CK: T1185 (Browser Session Hijacking).

data_source:
  - Sysmon EventID 1 (ProcessCreate)

search:
  query:
    bool:
      must:
        - term:
            agent_name: "AGENT_NAME"
        - term:
            agent_labels_customer: "CUSTOMER_CODE"
        - term:
            data_win_system_eventID: "1"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image: "*\\chrome.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\msedge.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\brave.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\firefox.exe"
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine: "*--mute-audio*"
              - wildcard:
                  data_win_eventdata_commandLine: "*--no-de-elevate*"
              - wildcard:
                  data_win_eventdata_commandLine: "*--do-not-de-elevate*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "START_TIME"
              lte: "END_TIME"

parameters:
  - name: AGENT_NAME
    default: "DESKTOP-AM0HLGE"
  - name: CUSTOMER_CODE
    default: "lab"
  - name: START_TIME
    default: "now-24h"
  - name: END_TIME
    default: "now"

how_to_implement: >
  Requires Sysmon EventID 1 (ProcessCreate) flowing to the Wazuh Indexer.
  Validated on DESKTOP-AM0HLGE with both Chrome and msedge launched via
  PowerShell with --mute-audio --do-not-de-elevate. Confirmed field names:
  data_win_eventdata_image, data_win_eventdata_commandLine,
  data_win_eventdata_parentImage, data_win_eventdata_user.
  Note: use cmd /c or & operator in PowerShell to pass flags directly to
  the binary — Start-Process intercepts double-dash arguments.

known_false_positives: >
  Automated testing frameworks, CI/CD pipelines, and some legitimate admin
  scripts may launch browsers with these flags. Filter on
  data_win_eventdata_parentImage for known automation tooling paths.
  In production environments without testing infrastructure, any hit
  from a non-standard parent process should be treated as high priority.

references:
  - https://www.recordedfuture.com/research/from-castleloader-to-castlerat-tag-150-advances-operations
  - https://peter.sh/experiments/chromium-command-line-switches/
  - https://attack.mitre.org/techniques/T1185/

response:
  message: >
    Browser launched with unusual flags on $agent_name$.
    Process: $data_win_eventdata_image$.
    Command line: $data_win_eventdata_commandLine$.
    Parent process: $data_win_eventdata_parentImage$.
    User: $data_win_eventdata_user$.
    Possible Castle RAT browser session hijacking attempt.
    MITRE ATT&CK: T1185
  risk_score: 15
  severity: low
  risk_objects:
    - field: agent_name
      type: system
      score: 15
  threat_objects:
    - field: data_win_eventdata_image
      type: process_name
    - field: data_win_eventdata_parentImage
      type: parent_process_name

tags:
  analytic_story:
    - Castle RAT
    - Browser Session Hijacking
  asset_type: Endpoint
  mitre_attack_id:
    - T1185
  custom_tags:
    - browser
    - chrome
    - msedge
    - castle_rat
    - session_hijacking
    - unusual_flags
  product:
    - Wazuh
  security_domain: endpoint

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b3d34dc5-2efd-4ae3-845f-8ec14921f449
    name: Browser Started with Remote Debugging
    reason: 'Same hijack goal: browser started with remote debugging lets the implant drive sessions and read cookies.'
  - id: da355155-1d23-48f9-bf95-e534ae273ab0
    name: Windows Chrome Enable Extension Loading via Command-Line
    reason: Chrome launched to load an attacker extension is a sibling way to take over a hidden browser.
  - id: 88d6e60c-759d-4ac1-a447-c0f1466c2d21
    name: Chromium Browser Instance Executed With Custom Extension
    reason: 'Browser started with a custom extension: the extension is the usual payload of a covert browser launch.'
  - id: 869ba261-c272-47d7-affe-5c0aa85c93d6
    name: Headless Browser Usage
    reason: Headless browser use is the other common way to run a browser invisibly for session theft.
  - id: 5a6e1e16-07de-48d8-8aae-faa766c05e88
    name: Potential Cookies Session Hijacking
    reason: Cookie/session hijacking is the follow-on once the hidden browser holds authenticated sessions.
  - id: 47147b5b-9e17-4d76-b8d2-7bac24c5ce1b
    name: Potential Browser Data Stealing
    reason: Browser data stealing is the credential-theft outcome browser-abusing RATs aim at.
  - id: 6a69f62d-ce75-4b57-8dce-6351eb55b362
    name: Esentutl Steals Browser Information
    reason: Esentutl copying browser stores is a direct file-theft alternative on the same host.
  - id: 8ba484e8-4b97-11ec-b19a-acde48001122
    name: Possible Browser Pass View Parameter
    reason: BrowserPassView-style parameters show offline harvesting of saved browser credentials.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Browser started headless, with remote debugging or an extension
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Cc][Hh][Rr][Oo][Mm][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Ee][Dd][Gg][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Bb][Rr][Aa][Vv][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ff][Ii][Rr][Ee][Ff][Oo][Xx]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*--[Rr][Ee][Mm][Oo][Tt][Ee]-[Dd][Ee][Bb][Uu][Gg][Gg][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*--[Hh][Ee][Aa][Dd][Ll][Ee][Ss][Ss].*/ OR data_win_eventdata_commandLine:/.*--[Ll][Oo][Aa][Dd]-[Ee][Xx][Tt][Ee][Nn][Ss][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*--[Dd][Ii][Ss][Aa][Bb][Ll][Ee]-[Ee][Xx][Tt][Ee][Nn][Ss][Ii][Oo][Nn][Ss]-[Ee][Xx][Cc][Ee][Pp][Tt].*/)
    pivot_on: host
    window: 4h
  - name: Browser spawned by script or LOLBin parent
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Cc][Hh][Rr][Oo][Mm][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Ee][Dd][Gg][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Bb][Rr][Aa][Vv][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ff][Ii][Rr][Ee][Ff][Oo][Xx]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_parentImage:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_parentImage:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_parentImage:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_parentImage:/.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_parentImage:/.*\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_parentImage:/.*\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_parentImage:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee].*/ OR data_win_eventdata_parentImage:/.*\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_parentImage:/.*\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee].*/)
    pivot_on: host
    window: 2h
  - name: Browser credential and cookie stores touched on the command line
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ll][Oo][Gg][Ii][Nn] [Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_commandLine:/.*\\[Cc][Oo][Oo][Kk][Ii][Ee][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ww][Ee][Bb] [Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_commandLine:/.*[Kk][Ee][Yy]4\.[Dd][Bb].*/ OR data_win_eventdata_commandLine:/.*[Ll][Oo][Gg][Ii][Nn][Ss]\.[Jj][Ss][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ll][Oo][Cc][Aa][Ll] [Ss][Tt][Aa][Tt][Ee].*/)
    pivot_on: host
    window: 4h
  - name: Browser credential or cookie files created by a non-browser process
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\[Ll][Oo][Gg][Ii][Nn] [Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_targetFilename:/.*\\[Cc][Oo][Oo][Kk][Ii][Ee][Ss].*/ OR data_win_eventdata_targetFilename:/.*\\[Kk][Ee][Yy]4\.[Dd][Bb].*/ OR data_win_eventdata_targetFilename:/.*\\[Ll][Oo][Gg][Ii][Nn][Ss]\.[Jj][Ss][Oo][Nn].*/) AND NOT (data_win_eventdata_image:/.*\\[Cc][Hh][Rr][Oo][Mm][Ee]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Ee][Dd][Gg][Ee]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Bb][Rr][Aa][Vv][Ee]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Ff][Ii][Rr][Ee][Ff][Oo][Xx]\.[Ee][Xx][Ee].*/)
    pivot_on: host
    window: 4h
  - name: Persistence set by the implant
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss] /[Cc][Rr][Ee][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee] /[Cc][Rr][Ee][Aa][Tt][Ee].*/)
    pivot_on: host
    window: 6h
