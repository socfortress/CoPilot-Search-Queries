name: Potential APT10 Cloud Hopper Activity
id: 966e4016-627f-44f7-8341-f394905c361f
version: 1
schema_version: "1.0"
date: "2023-03-08"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 966e4016-627f-44f7-8341-f394905c361f
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential process and execution activity related to APT10 Cloud Hopper
  operation. MITRE ATT&CK: T1059.005.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\cscript.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*.vbs /shell *"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*csvde -f C:\\\\windows\\\\web\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*.log*"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\cscript.exe'; data_win_eventdata_commandLine matches '*.vbs /shell *';
  data_win_eventdata_commandLine matches '*csvde -f C:\windows\web\*', among
  other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://web.archive.org/web/20180725233601/https://www.pwc.co.uk/cyber-security/pdf/cloud-hopper-annex-b-final.pdf
  - https://attack.mitre.org/techniques/T1059/005/

response:
  message: >
    Potential APT10 Cloud Hopper Activity detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1059.005
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.005
  custom_tags:
    - apt10
    - cloud
    - hopper
    - process_creation
    - sysmon
    - execution
    - g0045
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*\.[Vv][Bb][Ss] \/[Ss][Hh][Ee][Ll][Ll] .*/) OR (data_win_eventdata_commandLine:/.*[Cc][Ss][Vv][Dd][Ee] -[Ff] [Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ww][Ee][Bb]\\.*/ AND data_win_eventdata_commandLine:/.*\.[Ll][Oo][Gg].*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e5d36acd-acb4-4c6f-a13f-9eb203d50099
    name: Active Directory Structure Export Via Csvde.EXE
    reason: Csvde AD export is the same recon tooling the Cloud Hopper csvde branch uses.
  - id: 99b7460d-c9f1-40d7-a316-1f36f61d52ee
    name: Cscript/Wscript Uncommon Script Extension Execution
    reason: Script-host abuse like the cscript .vbs /shell launcher.
  - id: b6676963-0353-4f88-90f5-36c20d443c6a
    name: Cscript/Wscript Potentially Suspicious Child Process
    reason: Cmd/PowerShell spawned by the VBS shell after launch.
  - id: 002bdb95-0cf1-46a6-9e08-d38c128a6127
    name: WScript or CScript Dropper - File
    reason: Script file dropped to disk prior to cscript execution.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Cscript running VBS scripts
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*\.[Vv][Bb][Ss].*/
    pivot_on: host
    window: 24h
  - name: Staging in windows web, tasks and temp dirs
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ww]indows\\+[Ww]eb\\.*/ OR /.*[Ww]indows\\+[Tt]asks\\.*/ OR /.*[Ww]indows\\+[Tt]emp\\.*/)
    pivot_on: host
    window: 24h
  - name: AD and domain recon commands
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Cc][Ss][Vv][Dd][Ee].*/ OR /.*[Nn]et1? +(group|user|view|localgroup).*/ OR /.*[Dd][Ss][Qq][Uu][Ee][Rr][Yy].*/ OR /.*[Nn][Ll][Tt][Ee][Ss][Tt].*/)
    pivot_on: host
    window: 24h
  - name: Archiving of collected data
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Rr]ar(\.exe)? +a .*/ OR /.*7z(\.exe)? +a .*/ OR /.*[Mm]ake[Cc]ab.*/ OR /.*[Cc]ompress-[Aa]rchive.*/)
    pivot_on: host
    window: 24h
