name: Windows Audit Policy Cleared via Auditpol
id: windows-audit-policy-cleared-via-auditpol-001
version: 1
schema_version: "1.0"
date: "2026-03-03"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects auditpol.exe execution with /clear or /remove to wipe the 
  audit policy. Used by Solorigate, Prometei botnet, and red teams to 
  eliminate audit trails and evade detection. Clearing audit policy 
  removes all configured auditing settings.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - wildcard:
            data_win_eventdata_image: "*\\auditpol.exe"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine: "*/clear*"
              - wildcard:
                  data_win_eventdata_commandLine: "*/remove*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine: "*/resourceSACL*"
              - wildcard:
                  data_win_eventdata_commandLine: "*/?*"
            minimum_should_match: 1
  _source:
    - timestamp
    - agent_name
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    type: string
    required: true
    example: "lab"
  START_TIME:
    type: datetime
    default: "now-24h"
  END_TIME:
    type: datetime
    default: "now"

how_to_implement: >
  Requires Sysmon EventID 1 with full command-line logging.

known_false_positives: >
  None identified. Clearing audit policy should always be investigated.

references:
  - https://www.microsoft.com/en-us/security/blog/2021/01/20/deep-dive-into-the-solorigate-second-stage-activation-from-sunburst-to-teardrop-and-raindrop/
  - https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/auditpol-clear
  - https://attack.mitre.org/techniques/T1562/002/

response:
  message: >
    Audit policy cleared on $agent_name$. 
    Command: $data_win_eventdata_commandLine$. 
    Parent: $data_win_eventdata_parentImage$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1562.002
  risk_score: 16
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 16
  threat_objects: []

tags:
  analytic_story:
    - Windows Audit Policy Tampering
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1562.002
  custom_tags:
    - auditpol_clear
    - audit_policy_tampering
    - defense_evasion
    - log_clearing
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\\\auditpol\.exe/ AND (data_win_eventdata_commandLine:/.*\/clear.*/ OR data_win_eventdata_commandLine:/.*\/remove.*/) AND NOT (data_win_eventdata_commandLine:/.*\/resourceSACL.*/ OR data_win_eventdata_commandLine:/.*\/\?.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 0a13e132-651d-11eb-ae93-0242ac130002
    name: Audit Policy Tampering Via Auditpol
    reason: Generic auditpol tampering detection covering the same binary and adjacent switches.
  - id: windows-audit-policy-restored-via-auditpol-001
    name: Windows Audit Policy Restored via Auditpol
    reason: Attackers often clear then restore the policy after the operation, bracketing the blind window.
  - id: 236e7c8e-c9d9-11eb-a824-acde48001122
    name: Disable Logs Using WevtUtil
    reason: Audit policy changes are paired with disabling event log channels to blind the SIEM.
  - id: windows-eventlog-cleared-wevtutil-001
    name: Windows Eventlog Cleared Via Wevtutil
    reason: Clearing existing logs follows removing the ability to generate new audit events.
  - id: cc36992a-4671-4f21-a91d-6c2b72a2edf5
    name: Suspicious Eventlog Clearing or Configuration Change Activity
    reason: Broader log clearing in the same defense-evasion phase on the host.
  - id: windows-attempt-stop-security-service-001
    name: Windows Attempt To Stop Security Service
    reason: Audit tampering accompanies stopping security services before the real objective.
  - id: 1a4bd6af-99ac-4466-b5b2-7b72b4a05462
    name: Security Event Logging Disabled via MiniNt Registry Key - Process
    reason: Alternate method to stop Security event logging used by the same actors.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: All auditpol activity
    query: data_win_system_eventID:1 AND data_win_eventdata_image:*\\auditpol.exe
    pivot_on: host
    window: 4h
  - name: Event log clearing or disabling
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*wevtutil.*(cl|clear-log|sl).*/ OR data_win_eventdata_commandLine:/.*[Cc]lear-[Ee]vent[Ll]og.*/ OR data_win_eventdata_commandLine:/.*Limit-EventLog.*/)
    pivot_on: host
    window: 4h
  - name: Log cleared and audit policy change events
    query: data_win_system_eventID:(1102 OR 4719 OR 104)
    pivot_on: host
    window: 4h
  - name: Security tooling tampering
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*([Ss]top-[Ss]ervice|sc\s+(stop|config)|net1?\s+stop).*/ OR data_win_eventdata_commandLine:/.*[Ss]et-[Mm]p[Pp]reference.*/ OR data_win_eventdata_commandLine:/.*DisableAntiSpyware.*/)
    pivot_on: host
    window: 4h
  - name: Credential access and discovery in the blind window
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*([Mm]imikatz|sekurlsa|comsvcs.*MiniDump|ntdsutil|reg\s+save\s+hklm).*/ OR data_win_eventdata_commandLine:/.*(nltest|[Aa]d[Ff]ind).*/)
    pivot_on: host
    window: 4h
