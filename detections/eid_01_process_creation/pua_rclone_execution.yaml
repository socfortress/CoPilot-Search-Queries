name: PUA - Rclone Execution
id: e37db05d-d1f9-49c8-b464-cee1a4b11638
version: 1
schema_version: "1.0"
date: "2023-03-05"
author: Bhabesh Raj, Sittikorn S, Aaron Greetham (@beardofbinary) - NCC Group
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: e37db05d-d1f9-49c8-b464-cee1a4b11638
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of RClone utility for exfiltration as used by various
  ransomwares strains like REvil, Conti, FiveHands, etc. MITRE ATT&CK:
  T1567.002.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*--config *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*--no-check-certificate *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* copy *"
                          case_insensitive: true
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\rclone.exe"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_description:
                                value: "Rsync for cloud storage"
                                case_insensitive: true
                        minimum_should_match: 1
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*pass*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*user*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*copy*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*sync*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*config*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*lsd*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*remote*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*ls*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*mega*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*pcloud*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*ftp*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*ignore-existing*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*auto-confirm*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*transfers*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*multi-thread-streams*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*no-check-certificate *"
                                case_insensitive: true
                        minimum_should_match: 1
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_description
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*--config *'; data_win_eventdata_commandLine matches '*--no-check-certificate
  *'; data_win_eventdata_commandLine matches '* copy *', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://research.nccgroup.com/2021/05/27/detecting-rclone-an-effective-tool-for-exfiltration/
  - https://thedfirreport.com/2021/03/29/sodinokibi-aka-revil-ransomware
  - https://us-cert.cisa.gov/ncas/analysis-reports/ar21-126a
  - https://labs.sentinelone.com/egregor-raas-continues-the-chaos-with-cobalt-strike-and-rclone
  - https://www.splunk.com/en_us/blog/security/darkside-ransomware-splunk-threat-update-and-detections.html
  - https://attack.mitre.org/techniques/T1567/002/

response:
  message: >
    PUA - Rclone Execution detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1567.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1567.002
  custom_tags:
    - rclone
    - process_creation
    - sysmon
    - exfiltration
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND ((data_win_eventdata_commandLine:/.*--[Cc][Oo][Nn][Ff][Ii][Gg] .*/ AND data_win_eventdata_commandLine:/.*--[Nn][Oo]-[Cc][Hh][Ee][Cc][Kk]-[Cc][Ee][Rr][Tt][Ii][Ff][Ii][Cc][Aa][Tt][Ee] .*/ AND data_win_eventdata_commandLine:/.* [Cc][Oo][Pp][Yy] .*/) OR ((data_win_eventdata_image:/.*\\[Rr][Cc][Ll][Oo][Nn][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_description:/[Rr][Ss][Yy][Nn][Cc] [Ff][Oo][Rr] [Cc][Ll][Oo][Uu][Dd] [Ss][Tt][Oo][Rr][Aa][Gg][Ee]/) AND (data_win_eventdata_commandLine:/.*[Pp][Aa][Ss][Ss].*/ OR data_win_eventdata_commandLine:/.*[Uu][Ss][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Pp][Yy].*/ OR data_win_eventdata_commandLine:/.*[Ss][Yy][Nn][Cc].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Nn][Ff][Ii][Gg].*/ OR data_win_eventdata_commandLine:/.*[Ll][Ss][Dd].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Mm][Oo][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ll][Ss].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ee][Gg][Aa].*/ OR data_win_eventdata_commandLine:/.*[Pp][Cc][Ll][Oo][Uu][Dd].*/ OR data_win_eventdata_commandLine:/.*[Ff][Tt][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ii][Gg][Nn][Oo][Rr][Ee]-[Ee][Xx][Ii][Ss][Tt][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Aa][Uu][Tt][Oo]-[Cc][Oo][Nn][Ff][Ii][Rr][Mm].*/ OR data_win_eventdata_commandLine:/.*[Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr][Ss].*/ OR data_win_eventdata_commandLine:/.*[Mm][Uu][Ll][Tt][Ii]-[Tt][Hh][Rr][Ee][Aa][Dd]-[Ss][Tt][Rr][Ee][Aa][Mm][Ss].*/ OR data_win_eventdata_commandLine:/.*[Nn][Oo]-[Cc][Hh][Ee][Cc][Kk]-[Cc][Ee][Rr][Tt][Ii][Ff][Ii][Cc][Aa][Tt][Ee] .*/)))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 32e0baea-b3f1-11eb-a2ce-acde48001122
    name: Detect RClone Command-Line Usage
    reason: Companion detection of the same exfiltration command-line patterns.
  - id: 6dca1124-b3ec-11eb-9328-acde48001122
    name: Detect Renamed RClone
    reason: Attackers rename rclone; a renamed copy may also have run.
  - id: 9fbf5927-5261-4284-a71d-f681029ea574
    name: Compress Data and Lock With Password for Exfiltration With 7-ZIP
    reason: Data is typically archived before rclone uploads it.
  - id: 85a8e5ba-bd03-4bfb-bbfa-a4409a8f8b98
    name: Folder Compress To Potentially Suspicious Output Via Compress-Archive Cmdlet
    reason: Staging step prior to cloud upload.
  - id: 7d1aaf3d-4304-425c-b7c3-162055e0b3ab
    name: Potential Data Exfiltration Activity Via CommandLine Tools
    reason: Other exfil commands used on the same host in the same intrusion.
  - id: e328cc73-f92a-42fb-b3fa-7c2cffda981a
    name: Curl File Upload To File Sharing Websites
    reason: Alternative upload channel used alongside or instead of rclone.
  - id: e0f8ab85-0ac9-423b-a73a-81b3c7b1aa97
    name: Network Communication Initiated To File Sharing Domains From Process Located In Suspicious Folder
    reason: Network side of the upload when rclone runs from a suspicious folder.
  - id: 643bdcac-8b82-49f4-9fd9-25a90b929f3b
    name: Renamed MegaSync Execution
    reason: Mega is rclone's most common destination and an alternate exfil client.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Archive creation staging data
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*([Rr]ar|7z|7za|[Ww]inrar)(\.[Ee][Xx][Ee])? +a .*/ OR data_win_eventdata_commandLine:/.*Compress-Archive.*/)
    pivot_on: host
    window: 24h
  - name: Network connections by rclone
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\[Rr]clone.*/
    pivot_on: host
    window: 24h
  - name: Rclone config files created
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Rr]clone\.conf.*/
    pivot_on: host
    window: 24h
  - name: Share enumeration and bulk copy before exfil
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*([Nn]et +view|[Nn]et +use|[Rr]obocopy|[Xx]copy).*\\\\.*/)
    pivot_on: host
    window: 24h
  - name: Shadow copy deletion or ransomware prep
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Vv]ssadmin.*[Dd]elete.*[Ss]hadows.*/ OR data_win_eventdata_commandLine:/.*[Ww]mic.*[Ss]hadowcopy.*[Dd]elete.*/ OR data_win_eventdata_commandLine:/.*[Bb]cdedit.*[Rr]ecoveryenabled.*/)
    pivot_on: host
    window: 24h
