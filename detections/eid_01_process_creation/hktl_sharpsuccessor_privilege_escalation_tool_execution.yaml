name: HKTL - SharpSuccessor Privilege Escalation Tool Execution
id: 38a1ac5f-9c74-47d2-a345-dd6f5eb4e7c8
version: 1
schema_version: "1.0"
date: "2025-06-06"
author: Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 38a1ac5f-9c74-47d2-a345-dd6f5eb4e7c8
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of SharpSuccessor, a tool used to exploit the
  BadSuccessor attack for privilege escalation in WinServer 2025 Active
  Directory environments. Successful usage of this tool can let the attackers
  gain the domain admin privileges by exploiting the BadSuccessor vulnerability.
  MITRE ATT&CK: T1068.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\SharpSuccessor.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "SharpSuccessor.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*SharpSuccessor*"
                    case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* add *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* /impersonate*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* /path*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* /account*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* /name*"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\SharpSuccessor.exe'; data_win_eventdata_originalFileName equals
  'SharpSuccessor.exe'; data_win_eventdata_commandLine matches
  '*SharpSuccessor*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/logangoins/SharpSuccessor
  - https://attack.mitre.org/techniques/T1068/

response:
  message: >
    HKTL - SharpSuccessor Privilege Escalation Tool Execution detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1068
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1068
  custom_tags:
    - sharpsuccessor
    - privilege
    - escalation
    - process_creation
    - sysmon
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ss][Hh][Aa][Rr][Pp][Ss][Uu][Cc][Cc][Ee][Ss][Ss][Oo][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ss][Hh][Aa][Rr][Pp][Ss][Uu][Cc][Cc][Ee][Ss][Ss][Oo][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Ss][Hh][Aa][Rr][Pp][Ss][Uu][Cc][Cc][Ee][Ss][Ss][Oo][Rr].*/ OR (data_win_eventdata_commandLine:/.* [Aa][Dd][Dd] .*/ AND data_win_eventdata_commandLine:/.* \/[Ii][Mm][Pp][Ee][Rr][Ss][Oo][Nn][Aa][Tt][Ee].*/ AND data_win_eventdata_commandLine:/.* \/[Pp][Aa][Tt][Hh].*/ AND data_win_eventdata_commandLine:/.* \/[Aa][Cc][Cc][Oo][Uu][Nn][Tt].*/ AND data_win_eventdata_commandLine:/.* \/[Nn][Aa][Mm][Ee].*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 0ea8db81-2ff6-4525-9448-33bbe7effc13
    name: New DMSA Service Account Created in Specific OUs
    reason: SharpSuccessor abuses dMSA (BadSuccessor); creation of a dMSA in an OU is the direct setup step.
  - id: 01c42d3c-242d-4655-85b2-34f1739632f7
    name: Potentially Over Permissive Permissions Granted Using Dsacls.EXE
    reason: BadSuccessor needs delegated rights on an OU; permission grants via dsacls are a precursor.
  - id: f376c8a7-a2d0-4ddc-aa0c-16c17236d962
    name: HackTool - Bloodhound/Sharphound Execution
    reason: AD attack-path collection typically identifies the OU permissions this tool then abuses.
  - id: 9f8fc146-1d1a-4dbf-b8fd-dfae15e08541
    name: HackTool - SharpLDAPmonitor Execution
    reason: 'Same operator toolset: .NET LDAP tooling used during AD privilege-escalation phase.'
  - id: c484e533-ee16-4a93-b6ac-f0ea4868b2f1
    name: HackTool - SharpUp PrivEsc Tool Execution
    reason: Co-occurring .NET privesc tooling run by the same operator on the host.
  - id: 4f7a6757-ff79-46db-9687-66501a02d9ec
    name: Active Directory Structure Export Via Ldifde.EXE
    reason: AD reconnaissance preceding targeting of the victim account/OU.
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: Success of the escalation (impersonating a privileged account) is typically followed by credential dumping.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other Sharp* offensive tooling
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss][Hh][Aa][Rr][Pp].*\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 24h
  - name: AD object changes (dMSA, ACL, attributes)
    query: data_win_system_eventID:("5136" OR "5137" OR "4662") AND data_win_eventdata_objectClass:*msDS*
    pivot_on: host
    window: 24h
  - name: Kerberos ticket requests after impersonation
    query: data_win_system_eventID:("4768" OR "4769")
    pivot_on: user
    window: 4h
  - name: Credential dumping and AD database access
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ll][Ss][Aa][Ss][Ss]|[Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt]|[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp]|[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa]).*/
    pivot_on: host
    window: 4h
  - name: Network logons after escalation
    query: data_win_system_eventID:"4624" AND data_win_eventdata_logonType:("3" OR "9")
    pivot_on: user
    window: 4h
