name: LockerGoga Ransomware Activity
id: 74db3488-fd28-480a-95aa-b7af626de068
version: 1
schema_version: "1.0"
date: "2023-02-03"
author: Vasiliy Burov, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 74db3488-fd28-480a-95aa-b7af626de068
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: production
type: TTP

description: >
  Detects LockerGoga ransomware activity via specific command line. MITRE
  ATT&CK: T1486.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*-i SM-tgytutrc -s*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches '*-i
  SM-tgytutrc -s*'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://medium.com/@malwaredancer/lockergoga-input-arguments-ipc-communication-and-others-bd4e5a7ba80a
  - https://blog.f-secure.com/analysis-of-lockergoga-ransomware/
  - https://www.carbonblack.com/blog/tau-threat-intelligence-notification-lockergoga-ransomware/
  - https://attack.mitre.org/techniques/T1486/

response:
  message: >
    LockerGoga Ransomware Activity detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1486
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1486
  custom_tags:
    - lockergoga
    - ransomware
    - process_creation
    - sysmon
    - impact
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*-[Ii] [Ss][Mm]-[Tt][Gg][Yy][Tt][Uu][Tt][Rr][Cc] -[Ss].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 21ff4ca9-f13a-41ad-b828-0077b2af2e40
    name: Deletion of Volume Shadow Copies via WMI with PowerShell
    reason: Ransomware typically destroys shadow copies before encrypting, preceding the LockerGoga launch.
  - id: 639c9081-f482-47d3-a0bd-ddee3d4ecd76
    name: All Backups Deleted Via Wbadmin.EXE
    reason: Backup destruction precursor to encryption in ransomware chains.
  - id: c9fbe8e9-119d-40a6-9b59-dd58a5d84429
    name: Potential Ransomware or Unauthorized MBR Tampering Via Bcdedit.EXE
    reason: Recovery disabling via bcdedit commonly accompanies the encryption stage.
  - id: 236e7c8e-c9d9-11eb-a824-acde48001122
    name: Disable Logs Using WevtUtil
    reason: LockerGoga operators clear/disable event logs to hinder recovery and forensics.
  - id: ea011323-7045-460b-b2d7-0f7442ea6b38
    name: Potential PsExec Remote Execution
    reason: LockerGoga was deployed domain-wide via remote execution such as PsExec, so other hosts follow.
  - id: cd219ff3-fa99-45d4-8380-a7d15116c6dc
    name: New User Created Via Net.EXE
    reason: Ransomware operators create/reset accounts and change passwords to lock victims out.
  - id: b28e58e4-2a72-4fae-bdee-0fbe904db642
    name: Windows Defender Real-time Protection Disabled
    reason: Defenses are disabled before dropping the encryptor.
  - id: 689308fc-cfba-4f72-9897-796c1dc61487
    name: Potential Conti Ransomware Activity
    reason: Other ransomware-family detections on the same host indicate the same intrusion's pre-impact tooling.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Shadow copy and backup destruction
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(vssadmin.*[Dd]elete|wbadmin.*[Dd]elete|[Ss]hadowcopy.*[Dd]elete|bcdedit.*(recoveryenabled|ignoreallfailures)|resize shadowstorage).*/
    pivot_on: host
    window: 6h
  - name: Mass service and process stopping
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(net +stop|sc +(stop|config).*disabled|taskkill.*\/f).*/
    pivot_on: host
    window: 2h
  - name: Remote execution and lateral spread tools
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(psexec|PSEXESVC|wmic.*\/node|Invoke-Command|winrs).*/
    pivot_on: host
    window: 6h
  - name: Executable run from user-writable path
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*(\\Temp\\|\\AppData\\|\\ProgramData\\|\\Users\\Public).*\.exe/
    pivot_on: host
    window: 6h
  - name: Account manipulation or forced logoff
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(net +user|net1 +user|logoff|shutdown).*/
    pivot_on: user
    window: 4h
