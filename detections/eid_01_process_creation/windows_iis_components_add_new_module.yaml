name: Windows IIS Components Add New Module
id: windows-iis-components-add-new-module-001
version: 1
schema_version: "1.0"
date: "2026-02-23"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  Detects appcmd.exe used to install a new IIS module with image parameter. 
  Adversaries install malicious IIS modules for webshells, backdoors, and credit 
  card scraping. Used by OilRig, IceApple framework, and Bronze Union.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - wildcard:
            data_win_eventdata_image: "*\\\\appcmd.exe"
        - wildcard:
            data_win_eventdata_commandLine: "*install*"
        - wildcard:
            data_win_eventdata_commandLine: "*module*"
        - wildcard:
            data_win_eventdata_commandLine: "*image*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - wildcard:
            data_win_eventdata_parentImage: "*\\\\msiexec.exe"
        - wildcard:
            data_win_eventdata_parentImage: "*\\\\iissetup.exe"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-23 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-23 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Windows endpoints with Sysmon 
  installed and configured to log process creation events (EventID 1) with full 
  command-line arguments. IIS-specific detection for web servers.

known_false_positives: >
  Legitimate IIS module installations via msiexec or iissetup are excluded. 
  Filter additional known deployment tools as needed.

references:
  - https://attack.mitre.org/techniques/T1505/004/
  - https://www.microsoft.com/en-us/security/blog/2022/12/12/iis-modules-the-evolution-of-web-shells-and-how-to-detect-them/

response:
  message: >
    IIS module installation on $agent_name$. 
    Command: $data_win_eventdata_commandLine$. 
    User: $data_win_eventdata_user$. 
    Possible webshell/backdoor. MITRE ATT&CK: T1505.004
  risk_score: 64
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 64
  threat_objects: []

tags:
  analytic_story:
    - IIS Components
    - GhostRedirector IIS Module and Rungan Backdoor
  asset_type: Endpoint
  mitre_attack_id:
    - T1505.004
  custom_tags:
    - appcmd
    - iis_module
    - webshell
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*appcmd\.exe/ AND data_win_eventdata_commandLine:/.*install.*/ AND data_win_eventdata_commandLine:/.*module.*/ AND data_win_eventdata_commandLine:/.*image.*/ AND NOT data_win_eventdata_parentImage:/.*msiexec\.exe/ AND NOT data_win_eventdata_parentImage:/.*iissetup\.exe/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 9465ddf4-f9e4-4ebd-8d98-702df3a93239
    name: IIS Native-Code Module Command Line Installation
    reason: Same module-install technique through the command line; overlapping coverage that corroborates it.
  - id: 043c4b8b-3a54-4780-9682-081cb6b8185c
    name: Suspicious IIS Module Registration
    reason: Module registration evidence of the same malicious IIS module being loaded.
  - id: 7c8af9b2-dcae-41a2-a9db-b28c288b5f08
    name: Suspicious IIS URL GlobalRules Rewrite Via AppCmd
    reason: Another appcmd IIS tampering step used by the same adversaries to hijack traffic.
  - id: e4ed6030-ffe5-4e6a-8a8a-ab3c1ab9d94e
    name: Disable Windows IIS HTTP Logging
    reason: Attackers disable HTTP logging to hide a newly installed module's traffic.
  - id: 0649be4a-aeb0-45b0-b89e-7f1668f6d9c0
    name: IIS WebServer Log Deletion via CommandLine Utilities
    reason: Post-install log cleanup to hide backdoor activity.
  - id: fa3c117a-bc0d-416e-a31b-0c0e80653efb
    name: Chopper Webshell Process Pattern
    reason: A webshell is the usual way the attacker gets appcmd access on the IIS server.
  - id: bed2a484-9348-4143-8a8a-b801c979301c
    name: Webshell Detection With Command Line Keywords
    reason: Webshell command execution commonly precedes module installation.
  - id: 97dbf6e2-e436-44d8-abee-4261b24d3e41
    name: Microsoft IIS Connection Strings Decryption
    reason: IIS credential theft often accompanies backdoor modules on the same server.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Processes spawned by IIS worker
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Ww]3wp\.exe/ AND data_win_eventdata_image:(/.*[Cc]md\.exe/ OR /.*[Pp]ower[Ss]hell\.exe/ OR /.*[Ww]hoami\.exe/ OR /.*[Nn]et1?\.exe/ OR /.*[Cc]url\.exe/)
    pivot_on: host
    window: 24h
  - name: appcmd activity
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Aa]ppcmd\.exe/
    pivot_on: host
    window: 24h
  - name: Module files created in IIS paths
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(*inetsrv* OR *inetpub*) AND data_win_eventdata_targetFilename:(/.*\.[Dd][Ll][Ll]/ OR /.*\.[Aa][Ss][Pp][Xx]/ OR /.*\.[Aa][Ss][Pp]/)
    pivot_on: host
    window: 24h
  - name: w3wp loading non-Windows modules
    query: data_win_system_eventID:7 AND data_win_eventdata_image:/.*[Ww]3wp\.exe/ AND NOT data_win_eventdata_imageLoaded:/.*[Ww]indows.*/
    pivot_on: host
    window: 24h
  - name: IIS log tampering
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(*inetpub*logs* OR *LogFiles*) AND data_win_eventdata_commandLine:(*del* OR *rmdir* OR *Remove\-Item*)
    pivot_on: host
    window: 24h
