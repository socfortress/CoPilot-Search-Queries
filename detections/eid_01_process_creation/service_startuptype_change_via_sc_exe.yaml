name: Service StartupType Change Via Sc.EXE
id: 85c312b7-f44d-4a51-a024-d671c40b49fc
version: 1
schema_version: "1.0"
date: "2023-03-04"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 85c312b7-f44d-4a51-a024-d671c40b49fc
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detect the use of "sc.exe" to change the startup type of a service to
  "disabled" or "demand". MITRE ATT&CK: T1685.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\sc.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "sc.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* config *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*start*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*disabled*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*demand*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches '*\sc.exe';
  data_win_eventdata_originalFileName equals 'sc.exe';
  data_win_eventdata_commandLine matches '* config *', among other conditions.

known_false_positives: >
  False positives may occur with troubleshooting scripts. Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://www.virustotal.com/gui/file/38283b775552da8981452941ea74191aa0d203edd3f61fb2dee7b0aea3514955
  - https://attack.mitre.org/techniques/T1685/

response:
  message: >
    Service StartupType Change Via Sc.EXE detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1685
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685
  custom_tags:
    - service
    - startuptype
    - change
    - process_creation
    - sysmon
    - execution
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ss][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ss][Cc]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.* [Cc][Oo][Nn][Ff][Ii][Gg] .*/ AND data_win_eventdata_commandLine:/.*[Ss][Tt][Aa][Rr][Tt].*/ AND (data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Dd].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ee][Mm][Aa][Nn][Dd].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c0514f28-fdae-42df-b886-06e2b2bc5b37
    name: Service Startup Type Change Via Wmic.EXE
    reason: WMIC equivalent of disabling startup.
  - id: 62b20d44-1546-4e61-afce-8e175eb9473c
    name: Service StartupType Change Via PowerShell Set-Service
    reason: PowerShell equivalent of disabling startup.
  - id: 0b7163dc-7eee-4960-af17-c0cd517f92da
    name: Service Started/Stopped Via Wmic.EXE
    reason: Service start/stop via WMIC completes the disable-and-stop sequence.
  - id: windows-attempt-stop-security-service-001
    name: Windows Attempt To Stop Security Service
    reason: Security service stop is the usual companion to disabling startup.
  - id: 8f3a614f-6b98-4f7d-82dd-d0df38452a8b
    name: Windows Excessive Service Stop Attempt
    reason: Mass service stops signal ransomware or evasion.
  - id: e1aa95de-610a-427d-b9e7-9b46cfafbe6a
    name: Windows Defender Service Disabled - Registry
    reason: Registry-level Defender service disable corroborates.
  - id: a537cfc3-4297-4789-92b5-345bfd845ad0
    name: Service DACL Abuse To Hide Services Via Sc.EXE
    reason: sc.exe sdset hiding is a sibling service-tampering technique.
  - id: 38879043-7e1e-47a9-8d46-6bec88e201df
    name: Potential Persistence Attempt Via Existing Service Tampering
    reason: Existing-service tampering for persistence is another reason for config changes.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: sc.exe stop/config/delete of services
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*[Ss][Cc](\.exe)? +(stop|config|delete).*/
    pivot_on: host
    window: 2h
  - name: Security or backup services targeted
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(WinDefend|Sense|MpsSvc|EventLog|Sysmon|wazuh|VSS|Veeam|SQL).*(stop|disabled|delete).*/
    pivot_on: host
    window: 2h
  - name: Defender preference tampering
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(Set-MpPreference|Add-MpPreference|DisableRealtimeMonitoring).*/
    pivot_on: host
    window: 4h
  - name: Services Start value set to disabled
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*CurrentControlSet.Services.*Start/ AND data_win_eventdata_details:"DWORD (0x00000004)"
    pivot_on: host
    window: 2h
  - name: Shadow copy and boot recovery tampering
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(vssadmin.*delete|wbadmin.*delete|bcdedit.*recoveryenabled).*/
    pivot_on: host
    window: 6h
