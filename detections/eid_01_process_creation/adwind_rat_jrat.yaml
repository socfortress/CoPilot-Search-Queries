name: Adwind RAT / JRAT
id: 1fac1481-2dbc-48b2-9096-753c49b4ec71
version: 1
schema_version: "1.0"
date: "2022-10-09"
author: Florian Roth (Nextron Systems), Tom Ueltschi, Jonhnathan Ribeiro, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 1fac1481-2dbc-48b2-9096-753c49b4ec71
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects javaw.exe in AppData folder as used by Adwind / JRAT. MITRE ATT&CK:
  T1059.005, T1059.007.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*\\\\AppData\\\\Roaming\\\\Oracle*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*\\\\java*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*.exe *"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*cscript.exe*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*Retrive*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*.vbs *"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*\AppData\Roaming\Oracle*'; data_win_eventdata_commandLine matches '*\java*';
  data_win_eventdata_commandLine matches '*.exe *', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.hybrid-analysis.com/sample/ba86fa0d4b6af2db0656a88b1dd29f36fe362473ae8ad04255c4e52f214a541c?environmentId=100
  - https://www.first.org/resources/papers/conf2017/Advanced-Incident-Detection-and-Threat-Hunting-using-Sysmon-and-Splunk.pdf
  - https://attack.mitre.org/techniques/T1059/005/
  - https://attack.mitre.org/techniques/T1059/007/

response:
  message: >
    Adwind RAT / JRAT detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1059.005, T1059.007
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.005
    - T1059.007
  custom_tags:
    - adwind
    - process_creation
    - sysmon
    - execution
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND ((data_win_eventdata_commandLine:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Rr][Oo][Aa][Mm][Ii][Nn][Gg]\\[Oo][Rr][Aa][Cc][Ll][Ee].*/ AND data_win_eventdata_commandLine:/.*\\[Jj][Aa][Vv][Aa].*/ AND data_win_eventdata_commandLine:/.*\.[Ee][Xx][Ee] .*/) OR (data_win_eventdata_commandLine:/.*[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee].*/ AND data_win_eventdata_commandLine:/.*[Rr][Ee][Tt][Rr][Ii][Vv][Ee].*/ AND data_win_eventdata_commandLine:/.*\.[Vv][Bb][Ss] .*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: cea72823-df4d-4567-950c-0b579eaf0846
    name: Potential Dropper Script Execution Via WScript/CScript/MSHTA
    reason: Adwind droppers run via cscript/wscript VBS; this is the scripting stage that stages the Java payload.
  - id: b6676963-0353-4f88-90f5-36c20d443c6a
    name: Cscript/Wscript Potentially Suspicious Child Process
    reason: The Adwind VBS launcher spawns javaw/cmd children from cscript; this catches that parent-child link.
  - id: 99b7460d-c9f1-40d7-a316-1f36f61d52ee
    name: Cscript/Wscript Uncommon Script Extension Execution
    reason: Adwind loaders often run renamed/uncommon script extensions through cscript.
  - id: de587dce-915e-4218-aac4-835ca6af6f70
    name: Potential Persistence Attempt Via Run Keys Using Reg.EXE
    reason: Adwind/JRAT persists via Run keys pointing at javaw in AppData after first launch.
  - id: 24357373-078f-44ed-9ac4-6d334a668a11
    name: Direct Autorun Keys Modification
    reason: Run/autorun key write commonly follows JRAT install to survive reboot.
  - id: 8f88e3f6-2a49-48f5-a5c4-2f7eedf78710
    name: Java Running with Remote Debugging
    reason: Another abnormal java launch on the same host; suggests Java abused for execution.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: javaw/java launched from user-writable paths or with -jar
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Jj]ava[Ww]?\.exe/ AND data_win_eventdata_commandLine:(/.*[Aa]pp[Dd]ata.*/ OR /.*\\[Tt]emp\\.*/ OR /.*-jar.*/)
    pivot_on: host
    window: 6h
  - name: wscript/cscript running VBS/JS scripts
    query: data_win_system_eventID:1 AND data_win_eventdata_image:(/.*\\[Cc]script\.exe/ OR /.*\\[Ww]script\.exe/) AND data_win_eventdata_commandLine:(/.*\.vbs.*/ OR /.*\.js.*/ OR /.*\.jse.*/)
    pivot_on: host
    window: 6h
  - name: Run-key or Startup-folder persistence commands
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv]ersion\\[Rr]un.*/ OR /.*[Ss]tart [Mm]enu\\[Pp]rograms\\[Ss]tartup.*/)
    pivot_on: host
    window: 24h
  - name: Java processes making network connections (RAT C2)
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*[Jj]ava[Ww]?\.exe/
    pivot_on: host
    window: 24h
  - name: jar or Oracle-folder files created in AppData
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(/.*[Aa]pp[Dd]ata.*\.jar/ OR /.*[Aa]pp[Dd]ata.*[Oo]racle.*/)
    pivot_on: host
    window: 6h
