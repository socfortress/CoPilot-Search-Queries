name: Renamed AutoIt Execution
id: f4264e47-f522-4c38-a420-04525d5b880f
version: 1
schema_version: "1.0"
date: "2024-11-23"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: f4264e47-f522-4c38-a420-04525d5b880f
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of a renamed AutoIt2.exe or AutoIt3.exe. AutoIt is a
  scripting language and automation tool for Windows systems. While primarily
  used for legitimate automation tasks, it can be misused in cyber attacks.
  Attackers can leverage AutoIt to create and distribute malware, including
  keyloggers, spyware, and botnets. A renamed AutoIt executable is particularly
  suspicious. MITRE ATT&CK: T1027.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /AutoIt3ExecuteScript*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /ErrorStdOut*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=FDC554B3A8683918D731685855683DDF*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=CD30A61B60B3D60CECDB034C8C83C290*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=F8A00C72F2D667D2EDBB234D0C0AE000*"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "AutoIt3.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "AutoIt2.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "AutoIt.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\AutoIt.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\AutoIt2.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\AutoIt3_x64.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\AutoIt3.exe"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_hashes
    - data_win_eventdata_originalFileName
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches '*
  /AutoIt3ExecuteScript*'; data_win_eventdata_commandLine matches '*
  /ErrorStdOut*'; data_win_eventdata_hashes matches
  '*IMPHASH=FDC554B3A8683918D731685855683DDF*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/malmoeb/status/1665463817130725378?s=12&t=C0_T_re0wRP_NfKa27Xw9w
  - https://www.autoitscript.com/site/
  - https://attack.mitre.org/techniques/T1027/

response:
  message: >
    Renamed AutoIt Execution detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_hashes: $data_win_eventdata_hashes$. MITRE ATT&CK: T1027
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_hashes
      type: file_hash

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1027
  custom_tags:
    - renamed
    - autoit
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.* \/[Aa][Uu][Tt][Oo][Ii][Tt]3[Ee][Xx][Ee][Cc][Uu][Tt][Ee][Ss][Cc][Rr][Ii][Pp][Tt].*/ OR data_win_eventdata_commandLine:/.* \/[Ee][Rr][Rr][Oo][Rr][Ss][Tt][Dd][Oo][Uu][Tt].*/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=[Ff][Dd][Cc]554[Bb]3[Aa]8683918[Dd]731685855683[Dd][Dd][Ff].*/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=[Cc][Dd]30[Aa]61[Bb]60[Bb]3[Dd]60[Cc][Ee][Cc][Dd][Bb]034[Cc]8[Cc]83[Cc]290.*/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=[Ff]8[Aa]00[Cc]72[Ff]2[Dd]667[Dd]2[Ee][Dd][Bb][Bb]234[Dd]0[Cc]0[Aa][Ee]000.*/ OR data_win_eventdata_originalFileName:/[Aa][Uu][Tt][Oo][Ii][Tt]3\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Aa][Uu][Tt][Oo][Ii][Tt]2\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Aa][Uu][Tt][Oo][Ii][Tt]\.[Ee][Xx][Ee]/) AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/.*\\[Aa][Uu][Tt][Oo][Ii][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Aa][Uu][Tt][Oo][Ii][Tt]2\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Aa][Uu][Tt][Oo][Ii][Tt]3_[Xx]64\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Aa][Uu][Tt][Oo][Ii][Tt]3\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: f8e9aa1c-14f2-4dbd-aa59-b98968ed650d
    name: DarkGate - Autoit3.EXE Execution Parameters
    reason: DarkGate runs AutoIt3 with script args; same loader family when renamed.
  - id: windows-autoit3-execution-001
    name: Windows AutoIt3 Execution
    reason: Non-renamed AutoIt execution on the same host shows the full loader chain.
  - id: 0f16d9cf-0616-45c8-8fad-becc11b5a41c
    name: Renamed AutoHotkey.EXE Execution
    reason: Alternative scripting-runtime masquerade used by the same crimeware.
  - id: 36480ae1-a1cb-4eaa-a0d6-29801d7e9142
    name: Potential Defense Evasion Via Binary Rename
    reason: Generic binary-rename evasion co-occurring on host.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: AutoIt compiled scripts and au3 files
    query: data_win_system_eventID:(1 OR 11) AND (data_win_eventdata_commandLine:/.*\.([Aa]3[Xx]|[Aa][Uu]3).*/ OR data_win_eventdata_targetFilename:/.*\.([Aa]3[Xx]|[Aa][Uu]3)/)
    pivot_on: host
    window: 2h
  - name: Network connections from user-writable paths
    query: data_win_system_eventID:3 AND data_win_eventdata_image:(/.*\\[Aa]pp[Dd]ata\\.*/ OR /.*\\[Tt]emp\\.*/ OR /.*\\[Pp]rogram[Dd]ata\\.*/ OR /.*\\[Pp]ublic\\.*/)
    pivot_on: host
    window: 2h
  - name: Injection or hollowing into system processes
    query: data_win_system_eventID:(8 OR 10) AND data_win_eventdata_targetImage:(/.*\\(explorer|svchost|regsvr32|msbuild|RegAsm)\.exe/)
    pivot_on: host
    window: 2h
  - name: Script host or archiver parents launching executables
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:(/.*\\(wscript|cscript|mshta|7z|7zG|WinRAR)\.exe/)
    pivot_on: host
    window: 2h
  - name: Startup persistence
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*\\CurrentVersion\\Run.*/
    pivot_on: host
    window: 2h
