name: Uncommon System Information Discovery Via Wmic.EXE
id: 9d5a1274-922a-49d0-87f3-8c653483b909
version: 1
schema_version: "1.0"
date: "2023-12-19"
author: TropChaud
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 9d5a1274-922a-49d0-87f3-8c653483b909
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the use of the WMI command-line (WMIC) utility to identify and display
  various system information, including OS, CPU, GPU, and disk drive names;
  memory capacity; display resolution; and baseboard, BIOS, and GPU driver
  products/versions. Some of these commands were used by Aurora Stealer in late
  2022/early 2023. MITRE ATT&CK: T1082.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - term:
                  data_win_eventdata_description:
                    value: "WMI Commandline Utility"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "wmic.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\WMIC.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*LOGICALDISK get Name,Size,FreeSpace*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*os get Caption,OSArchitecture,Version*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_description
    - data_win_eventdata_originalFileName
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_description equals 'WMI
  Commandline Utility'; data_win_eventdata_originalFileName equals 'wmic.exe';
  data_win_eventdata_image matches '*\WMIC.exe', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/a2ccd19c37d0278b4ffa8583add3cf52060a5418/atomics/T1082/T1082.md#atomic-test-25---system-information-discovery-with-wmic
  - https://nwgat.ninja/getting-system-information-with-wmic-on-windows/
  - https://blog.sekoia.io/aurora-a-rising-stealer-flying-under-the-radar
  - https://blog.cyble.com/2023/01/18/aurora-a-stealer-using-shapeshifting-tactics/
  - https://app.any.run/tasks/a6aa0057-82ec-451f-8f99-55650ca537da/
  - https://www.virustotal.com/gui/file/d6f6bc10ae0e634ed4301d584f61418cee18e5d58ad9af72f8aa552dc4aaeca3/behavior
  - https://attack.mitre.org/techniques/T1082/

response:
  message: >
    Uncommon System Information Discovery Via Wmic.EXE detected on host
    $agent_name$. Matched data_win_eventdata_description:
    $data_win_eventdata_description$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1082
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_description
      type: other
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1082
  custom_tags:
    - uncommon
    - system
    - information
    - process_creation
    - sysmon
    - discovery
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_description:/[Ww][Mm][Ii] [Cc][Oo][Mm][Mm][Aa][Nn][Dd][Ll][Ii][Nn][Ee] [Uu][Tt][Ii][Ll][Ii][Tt][Yy]/ OR data_win_eventdata_originalFileName:/[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*[Ll][Oo][Gg][Ii][Cc][Aa][Ll][Dd][Ii][Ss][Kk] [Gg][Ee][Tt] [Nn][Aa][Mm][Ee],[Ss][Ii][Zz][Ee],[Ff][Rr][Ee][Ee][Ss][Pp][Aa][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Oo][Ss] [Gg][Ee][Tt] [Cc][Aa][Pp][Tt][Ii][Oo][Nn],[Oo][Ss][Aa][Rr][Cc][Hh][Ii][Tt][Ee][Cc][Tt][Uu][Rr][Ee],[Vv][Ee][Rr][Ss][Ii][Oo][Nn].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 9d7ca793-f6bd-471c-8d0f-11e68b2f0d2f
    name: Computer System Reconnaissance Via Wmic.EXE
    reason: Same operator typically chains several wmic queries in one burst (computersystem, OS) to fingerprint the host.
  - id: 3e3ceccd-6c06-48b8-b5ff-ab1d25db8c1d
    name: Hardware Model Reconnaissance Via Wmic.EXE
    reason: Hardware/model queries are the VM and sandbox check that stealers like Aurora run alongside OS/disk discovery.
  - id: 15434e33-5027-4914-88d5-3d4145ec25a9
    name: Potential Product Reconnaissance Via Wmic.EXE
    reason: Installed-product enumeration follows system profiling when a stealer or hands-on actor looks for AV or target software.
  - id: 221b251a-357a-49a9-920a-271802777cc0
    name: Potential Process Reconnaissance via Wmic.EXE
    reason: Process listing via wmic is the next recon step to find security tools and running targets.
  - id: 847d5ff3-8a31-4737-a970-aeae8fe21765
    name: Potential Tampering With Security Products Via WMIC
    reason: Escalation from profiling to disabling or removing the security product just discovered.
  - id: c248c896-e412-4279-8c15-1c558067b6fa
    name: Enumerate All Information With Whoami.EXE
    reason: User and privilege discovery commonly accompanies system profiling in the first minutes of an intrusion.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other native recon binaries
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Ww][Hh][Oo][Aa][Mm][Ii]\.[Ee][Xx][Ee]|[Ss][Yy][Ss][Tt][Ee][Mm][Ii][Nn][Ff][Oo]\.[Ee][Xx][Ee]|[Ii][Pp][Cc][Oo][Nn][Ff][Ii][Gg]\.[Ee][Xx][Ee]|[Nn][Ee][Tt]\.[Ee][Xx][Ee]|[Nn][Ee][Tt]1\.[Ee][Xx][Ee]|[Nn][Ll][Tt][Ee][Ss][Tt]\.[Ee][Xx][Ee]|[Tt][Aa][Ss][Kk][Ll][Ii][Ss][Tt]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 2h
  - name: All wmic activity
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 4h
  - name: Wmic CPU/BIOS/GPU/memory fingerprinting
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Pp][Uu] [Gg][Ee][Tt].*/ OR data_win_eventdata_commandLine:/.*[Bb][Ii][Oo][Ss] [Gg][Ee][Tt].*/ OR data_win_eventdata_commandLine:/.*[Pp][Aa][Tt][Hh] [Ww][Ii][Nn]32_[Vv][Ii][Dd][Ee][Oo][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ll][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ee][Mm][Oo][Rr][Yy][Cc][Hh][Ii][Pp].*/ OR data_win_eventdata_commandLine:/.*[Bb][Aa][Ss][Ee][Bb][Oo][Aa][Rr][Dd].*/)
    pivot_on: host
    window: 2h
  - name: Script and LOLBin execution (stealer staging)
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|[Cc][Mm][Dd]\.[Ee][Xx][Ee]|[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 2h
  - name: Outbound connections from script hosts
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|[Cc][Mm][Dd]\.[Ee][Xx][Ee]|[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 2h
