name: Commvault QOperation Path Traversal Webshell Drop (CVE-2025-57790)
id: bd3b3fff-a018-4994-9876-68af5809160f
version: 1
schema_version: "1.0"
date: "2025-10-20"
author: Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: bd3b3fff-a018-4994-9876-68af5809160f
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the use of qoperation.exe with the -file argument to write a JSP file
  to the webroot, indicating a webshell drop. This is a post-authentication step
  corresponding to CVE-2025-57790. MITRE ATT&CK: T1505.003.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*qoperation*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*exec*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* -af *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*.xml *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*\\\\Apache\\\\webapps\\\\ROOT\\\\*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*.jsp*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*qoperation*'; data_win_eventdata_commandLine matches '*exec*';
  data_win_eventdata_commandLine matches '* -af *', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://labs.watchtowr.com/guess-who-would-be-stupid-enough-to-rob-the-same-vault-twice-pre-auth-rce-chains-in-commvault/
  - https://attack.mitre.org/techniques/T1505/003/

response:
  message: >
    Commvault QOperation Path Traversal Webshell Drop (CVE-2025-57790) detected
    on host $agent_name$. Matched data_win_eventdata_commandLine:
    $data_win_eventdata_commandLine$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1505.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1505.003
  custom_tags:
    - commvault
    - qoperation
    - traversal
    - process_creation
    - sysmon
    - persistence
    - emerging_threats
    - cve_2025_57790
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Qq][Oo][Pp][Ee][Rr][Aa][Tt][Ii][Oo][Nn].*/ AND data_win_eventdata_commandLine:/.*[Ee][Xx][Ee][Cc].*/ AND data_win_eventdata_commandLine:/.* -[Aa][Ff] .*/ AND data_win_eventdata_commandLine:/.*\.[Xx][Mm][Ll] .*/ AND data_win_eventdata_commandLine:/.*\\[Aa][Pp][Aa][Cc][Hh][Ee]\\[Ww][Ee][Bb][Aa][Pp][Pp][Ss]\\[Rr][Oo][Oo][Tt]\\.*/ AND data_win_eventdata_commandLine:/.*\.[Jj][Ss][Pp].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 917789e1-2c1f-4bf5-8c91-6f71a017f469
    name: Commvault QLogin with PublicSharingUser and GUID Password (CVE-2025-57788)
    reason: Alternate qlogin initial-access path in the same Commvault exploit chain.
  - id: ff0225a0-1d9a-4bae-ab26-6038b18bb6d4
    name: Commvault QLogin Argument Injection Authentication Bypass (CVE-2025-57791)
    reason: Alternate authentication route in the same CVE chain; yields a privileged token like the PublicSharingUser path.
  - id: fa3c117a-bc0d-416e-a31b-0c0e80653efb
    name: Chopper Webshell Process Pattern
    reason: Webshell-driven command execution pattern that follows once a JSP shell is in place or in use.
  - id: c248c896-e412-4279-8c15-1c558067b6fa
    name: Enumerate All Information With Whoami.EXE
    reason: Typical first hands-on-keyboard recon after gaining Commvault/web shell code execution.
  - id: cd219ff3-fa99-45d4-8380-a7d15116c6dc
    name: New User Created Via Net.EXE
    reason: Backup-server compromise is commonly followed by creating a backdoor local account.
  - id: d95de845-b83c-4a9a-8a6a-4fc802ebf6c0
    name: Suspicious Group And Account Reconnaissance Activity Using Net.EXE
    reason: Account/group enumeration commonly follows initial access on the Commvault host.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: JSP webshell file creation in web roots
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\.(jsp|jspx|war).*/ AND data_win_eventdata_targetFilename:/.*([Aa]pache|[Tt]omcat|[Ww]ebapps|ROOT).*/
    pivot_on: host
    window: 6h
  - name: Shells and recon spawned by Java/Tomcat
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*([Jj]ava|[Tt]omcat[0-9]*)\.exe/ AND data_win_eventdata_image:/.*(cmd|powershell|whoami|net1?|ipconfig|systeminfo|certutil|bitsadmin)\.exe/
    pivot_on: host
    window: 6h
  - name: Any qlogin invocation
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*[Qq]login.*/
    pivot_on: host
    window: 6h
  - name: Download or tool transfer by LOLBins
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*([Cc]ertutil.*-urlcache|[Bb]itsadmin.*.transfer|[Ii]nvoke-[Ww]eb[Rr]equest|[Dd]ownload[Ss]tring|curl.*http).*/
    pivot_on: host
    window: 6h
  - name: New accounts or persistence after drop
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(net1? +user.*.add|net1? +localgroup.*administrators|schtasks.*.create|sc(\.exe)? +create).*/
    pivot_on: host
    window: 6h
