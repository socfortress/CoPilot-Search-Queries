name: Windows Change File Association Command To Notepad
id: windows-change-file-association-notepad-001
version: 1
schema_version: "1.0"
date: "2026-02-23"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects attempts to change file association commands to open with Notepad.exe 
  via registry modification of HKCR shell\open\command keys. Prestige ransomware 
  uses this technique after encrypting files — changing the association of the 
  new extension to display a ransom note via Notepad.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine: "*HKCR*"
              - wildcard:
                  data_win_eventdata_commandLine: "*HKEY_CLASSES_ROOT*"
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine: "*open*command*"
        - wildcard:
            data_win_eventdata_commandLine: "*Notepad*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - wildcard:
            data_win_eventdata_commandLine: "*Applications\\\\notepad.exe*"
        - wildcard:
            data_win_eventdata_commandLine: "*WindowsApps\\\\Microsoft.WindowsNotepad*"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-23 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-23 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Windows endpoints with Sysmon 
  installed and configured to log process creation events (EventID 1) with full 
  command-line arguments.

known_false_positives: >
  Very unlikely. Default Notepad associations and Microsoft Store Notepad 
  packages are excluded. Any other modification of file associations to 
  Notepad.exe is highly suspicious.

references:
  - https://attack.mitre.org/techniques/T1546/001/
  - https://www.microsoft.com/en-us/security/blog/2022/10/14/new-prestige-ransomware-impacts-organizations-in-ukraine-and-poland/

response:
  message: >
    File association changed to Notepad.exe on $agent_name$. 
    Command: $data_win_eventdata_commandLine$. 
    User: $data_win_eventdata_user$. 
    Possible ransomware ransom note display technique. MITRE ATT&CK: T1546.001
  risk_score: 72
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 72
  threat_objects: []

tags:
  analytic_story:
    - Prestige Ransomware
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1546.001
  custom_tags:
    - ransomware
    - file_association
    - registry_modification
    - ransom_note
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*HKCR.*/ OR data_win_eventdata_commandLine:/.*HKEY_CLASSES_ROOT.*/) AND data_win_eventdata_commandLine:/.*open.*command.*/ AND data_win_eventdata_commandLine:/.*Notepad.*/ AND NOT data_win_eventdata_commandLine:/.*Applications.*notepad\.exe.*/ AND NOT data_win_eventdata_commandLine:/.*WindowsApps.*Microsoft\.WindowsNotepad.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: Prestige-style ransomware wipes shadow copies around encryption; deletion on the same host confirms the impact phase.
  - id: 89f75308-5b1b-4390-b2d8-d6b2340efaf8
    name: Windows Backup Deleted Via Wbadmin.EXE
    reason: Backup deletion with wbadmin accompanies ransomware recovery inhibition.
  - id: 639c9081-f482-47d3-a0bd-ddee3d4ecd76
    name: All Backups Deleted Via Wbadmin.EXE
    reason: Deleting all backups on the same host precedes the ransom-note association change.
  - id: c9fbe8e9-119d-40a6-9b59-dd58a5d84429
    name: Potential Ransomware or Unauthorized MBR Tampering Via Bcdedit.EXE
    reason: bcdedit recovery tampering is a standard ransomware precursor.
  - id: ae6f14e6-14de-45b0-9f44-c0986f50dc89
    name: Change Default File Association To Executable Via Assoc
    reason: Another file-association change (assoc) used for the same hijack or ransom-extension handling.
  - id: 152f3630-77c1-4284-bcc0-4cc68ab2f6e7
    name: Shell Open Registry Keys Manipulation
    reason: Registry-level modification of shell open keys is the same change seen from registry telemetry.
  - id: 9e8894c0-0ae0-11ef-9d85-1f2942bec57c
    name: Suspicious Shell Open Command Registry Modification
    reason: Shell open command registry modification corroborates the command-line hit.
  - id: 06125661-3814-4e03-bfa2-1e4411c60ac3
    name: Backup Files Deleted
    reason: Mass deletion of backup files is a co-occurring ransomware impact step.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Shadow copy, backup and recovery destruction
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*[Dd][Ee][Ll][Ee][Tt][Ee].*[Ss][Hh][Aa][Dd][Oo][Ww][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ww][Bb][Aa][Dd][Mm][Ii][Nn].*[Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Bb][Cc][Dd][Ee][Dd][Ii][Tt].*([Rr][Ee][Cc][Oo][Vv][Ee][Rr][Yy][Ee][Nn][Aa][Bb][Ll][Ee][Dd]|[Ii][Gg][Nn][Oo][Rr][Ee][Aa][Ll][Ll][Ff][Aa][Ii][Ll][Uu][Rr][Ee][Ss]).*/ OR data_win_eventdata_commandLine:/.*[Ww][Mm][Ii][Cc].*[Ss][Hh][Aa][Dd][Oo][Ww][Cc][Oo][Pp][Yy].*[Dd][Ee][Ll][Ee][Tt][Ee].*/)
    pivot_on: host
    window: 24h
  - name: File association and shell open registry changes
    query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*[Cc][Ll][Aa][Ss][Ss][Ee][Ss]\\.*[Ss][Hh][Ee][Ll][Ll]\\[Oo][Pp][Ee][Nn]\\[Cc][Oo][Mm][Mm][Aa][Nn][Dd].*/ OR data_win_eventdata_targetObject:/.*\\[Ff][Ii][Ll][Ee][Ee][Xx][Tt][Ss]\\.*/)
    pivot_on: host
    window: 24h
  - name: Notepad opening ransom-note style text files
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Nn][Oo][Tt][Ee][Pp][Aa][Dd]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*([Rr][Ee][Aa][Dd][Mm][Ee]|[Rr][Aa][Nn][Ss][Oo][Mm]|[Dd][Ee][Cc][Rr][Yy][Pp][Tt]|[Rr][Ee][Ss][Tt][Oo][Rr][Ee]|[Hh][Oo][Ww]).*\.[Tt][Xx][Tt].*/ OR (data_win_eventdata_parentImage:/.*\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\.[Ee][Xx][Ee]/))
    pivot_on: host
    window: 24h
  - name: Ransom note file creation
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*([Rr][Ee][Aa][Dd][Mm][Ee]|[Rr][Aa][Nn][Ss][Oo][Mm]|[Dd][Ee][Cc][Rr][Yy][Pp][Tt]|[Hh][Oo][Ww]_[Tt][Oo]|[Hh][Oo][Ww]-[Tt][Oo]).*\.[Tt][Xx][Tt]/
    pivot_on: host
    window: 24h
  - name: Service stop and defence evasion before encryption
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*([Nn][Ee][Tt]1? [Ss][Tt][Oo][Pp]|[Ss][Cc] [Ss][Tt][Oo][Pp]|[Tt][Aa][Ss][Kk][Kk][Ii][Ll][Ll]).*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*[Dd][Ii][Ss][Aa][Bb][Ll][Ee].*/)
    pivot_on: host
    window: 6h
