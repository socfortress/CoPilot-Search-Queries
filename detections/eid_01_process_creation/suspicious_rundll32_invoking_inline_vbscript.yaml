name: Suspicious Rundll32 Invoking Inline VBScript
id: 1cc50f3f-1fc8-4acf-b2e9-6f172e1fdebd
version: 1
schema_version: "1.0"
date: "2022-10-09"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 1cc50f3f-1fc8-4acf-b2e9-6f172e1fdebd
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious process related to rundll32 based on command line that
  invokes inline VBScript as seen being used by UNC2452. MITRE ATT&CK: T1055.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*rundll32.exe*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*Execute*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*RegRead*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*window.close*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*rundll32.exe*'; data_win_eventdata_commandLine matches '*Execute*';
  data_win_eventdata_commandLine matches '*RegRead*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.microsoft.com/security/blog/2021/03/04/goldmax-goldfinder-sibot-analyzing-nobelium-malware/
  - https://attack.mitre.org/techniques/T1055/

response:
  message: >
    Suspicious Rundll32 Invoking Inline VBScript detected on host $agent_name$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1055
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1055
  custom_tags:
    - rundll32
    - invoking
    - inline
    - process_creation
    - sysmon
    - privilege_escalation
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee].*/ AND data_win_eventdata_commandLine:/.*[Ee][Xx][Ee][Cc][Uu][Tt][Ee].*/ AND data_win_eventdata_commandLine:/.*[Rr][Ee][Gg][Rr][Ee][Aa][Dd].*/ AND data_win_eventdata_commandLine:/.*[Ww][Ii][Nn][Dd][Oo][Ww]\.[Cc][Ll][Oo][Ss][Ee].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 20c3f09d-c53d-4e85-8b74-6aa50e2f1b61
    name: Suspicious VBScript UN2452 Pattern
    reason: Same UNC2452/Nobelium inline VBScript pattern; sibling detection of the same tradecraft.
  - id: 91c79f14-5b41-11eb-ae93-0242ac130002
    name: Detect Rundll32 Inline HTA Execution
    reason: 'Rundll32 inline HTA/script execution via mshtml is the same javascript:/vbscript: proxy technique.'
  - id: e593cf51-88db-4ee1-b920-37e89012a3c9
    name: Potentially Suspicious Rundll32 Activity
    reason: Generic suspicious rundll32 activity that co-fires on this launch.
  - id: 921aa10f-2e74-4cca-9498-98f9ca4d6fdf
    name: Registry Modification Attempt Via VBScript
    reason: Inline VBScript with RegRead often proceeds to registry writes via VBScript.
  - id: 2569ed8c-1147-498a-9b8c-2ad3656b10ed
    name: Potential Renamed Rundll32 Execution
    reason: Actors rename rundll32 to evade this exact command-line pattern.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Rundll32 loading mshtml/script engines with inline script
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Mm][Ss][Hh][Tt][Mm][Ll].*/ OR data_win_eventdata_commandLine:/.*[Rr][Uu][Nn][Hh][Tt][Mm][Ll][Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*[Vv][Bb][Ss][Cc][Rr][Ii][Pp][Tt]:.*/ OR data_win_eventdata_commandLine:/.*[Jj][Aa][Vv][Aa][Ss][Cc][Rr][Ii][Pp][Tt]:.*/) AND data_win_eventdata_image:/.*\\([Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 2h
  - name: Child processes spawned by rundll32
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Registry persistence writes in the window
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND data_win_eventdata_targetObject:/.*(\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn]|[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]\\[Ss][Hh][Ee][Ll][Ll]).*/
    pivot_on: host
    window: 2h
  - name: Outbound connections from rundll32 or script hosts
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 2h
  - name: Encoded or download-cradle PowerShell follow-on
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*-[Ee][Nn][Cc].*/ OR data_win_eventdata_commandLine:/.*-[Ee][Nn][Cc][Oo][Dd][Ee][Dd][Cc][Oo][Mm][Mm][Aa][Nn][Dd].*/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Ii][Ee][Xx].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/)
    pivot_on: host
    window: 2h
