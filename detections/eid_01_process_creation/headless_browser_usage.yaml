name: Headless Browser Usage
id: 869ba261-c272-47d7-affe-5c0aa85c93d6
version: 1
schema_version: "1.0"
date: "2026-04-28"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  This analytic detects the usage of headless Chromium-based browsers
  on a Windows endpoint. Sysmon EventID 1 is used to match process
  creation events where the image path ends with one of the known
  Chromium-family browser executables (chrome.exe, brave.exe,
  opera.exe, vivaldi.exe, msedge.exe) AND the command line contains
  both --headless and --disable-gpu flags. These two flags together
  are the canonical invocation for running a Chromium browser without
  a visible window or GPU acceleration - the browser still executes
  fully (JavaScript, network requests, DOM rendering) but is
  invisible to the user. Monitoring headless browser usage is
  significant because while these tools have legitimate developer
  uses (automated testing, web scraping, PDF generation), they are
  increasingly exploited by adversaries for malicious activities
  including credential phishing automation, OAuth token theft,
  in-the-browser data exfiltration that bypasses traditional file
  monitoring, and covert C2 channels through legitimate websites.
  This is a known T1497 (Virtualization/Sandbox Evasion) and
  T1564.003 (Hide Artifacts: Hidden Window) technique observed in
  named threat activity including the Evelyn Stealer campaign and
  Forest Blizzard intrusions. If confirmed malicious, this activity
  could lead to unauthorized data extraction, automated credential
  harvesting, browser-based persistence, or other covert operations
  on web applications - investigate the parent process, the URLs
  targeted, and any concurrent browser-data access.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image: "*chrome.exe"
              - wildcard:
                  data_win_eventdata_image: "*brave.exe"
              - wildcard:
                  data_win_eventdata_image: "*opera.exe"
              - wildcard:
                  data_win_eventdata_image: "*vivaldi.exe"
              - wildcard:
                  data_win_eventdata_image: "*msedge.exe"
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine: "*--headless*"
        - wildcard:
            data_win_eventdata_commandLine: "*--disable-gpu*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_parentCommandLine
    - data_win_eventdata_user
    - data_win_eventdata_processId
    - data_win_eventdata_processGuid
    - data_win_eventdata_parentProcessId
    - data_win_eventdata_parentProcessGuid
    - data_win_eventdata_hashes
    - data_win_eventdata_integrityLevel
    - data_win_eventdata_currentDirectory

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-28 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-28 23:59:59.999"

how_to_implement: >
  This detection requires Sysmon EventID 1 (Process Creation) logs to be forwarded
  from Windows endpoints to Wazuh Indexer. Ensure Sysmon is deployed with a
  configuration that captures Image, OriginalFileName, and CommandLine fields
  (SwiftOnSecurity or Olaf Hartong Sysmon modular config recommended). The
  detection matches Chromium-family browsers (chrome.exe, brave.exe,
  opera.exe, vivaldi.exe, msedge.exe) by Image path, combined with both
  --headless and --disable-gpu flags in the command line. Case-insensitive
  matching is used in Graylog via character classes. Note that some
  organizations may have legitimate developer use cases for headless
  browsers - in such environments, allow-list specific approved parent
  processes (CI/CD agents, test runners, documented automation
  frameworks) rather than removing the detection.

known_false_positives: >
  Administrators, developers, QA engineers, and CI/CD pipelines may
  legitimately use headless browser features for automated testing,
  web scraping, page rendering, or PDF generation. Documented
  legitimate uses should be allow-listed by parent process or user
  context. Pair this detection with risk-based scoring against the
  destination (URL, domain, or downstream network destination) to
  prioritize investigations of headless browsers reaching unusual
  targets.

references:
  - https://attack.mitre.org/techniques/T1497/
  - https://attack.mitre.org/techniques/T1564/003/
  - https://www.trendmicro.com/en_us/research/26/a/analysis-of-the-evelyn-stealer-campaign.html
  - https://cert.gov.ua/article/5702579

response:
  message: >
    A Chromium-based browser process $data_win_eventdata_image$ was
    launched in headless mode by parent process
    $data_win_eventdata_parentImage$ on endpoint $agent_name$ by user
    $data_win_eventdata_user$. Command line:
    $data_win_eventdata_commandLine$. Headless browsers can be used
    for legitimate automation but are also abused by adversaries for
    credential harvesting, in-browser data exfiltration, and covert
    C2 channels - investigate parent process lineage, target URLs,
    and concurrent browser-profile or cookie access activity.
  risk_score: 40
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 30
    - field: data_win_eventdata_user
      type: user
      score: 30
  threat_objects:
    - field: data_win_eventdata_image
      type: process_name
    - field: data_win_eventdata_parentImage
      type: parent_process_name
    - field: data_win_eventdata_commandLine
      type: command_line

tags:
  analytic_story:
    - Browser Hijacking
    - Forest Blizzard
    - Evelyn Stealer
    - Hide Artifacts
    - Headless Browser Abuse
  asset_type: Endpoint
  mitre_attack_id:
    - T1497
    - T1564.003
  custom_tags:
    - headless_browser
    - chrome_headless
    - edge_headless
    - brave_headless
    - opera_headless
    - vivaldi_headless
    - chromium_automation
    - hide_artifacts
    - sandbox_evasion
    - browser_automation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Cc][Hh][Rr][Oo][Mm][Ee]\.exe.*/ OR data_win_eventdata_image:/.*[Bb][Rr][Aa][Vv][Ee]\.exe.*/ OR data_win_eventdata_image:/.*[Oo][Pp][Ee][Rr][Aa]\.exe.*/ OR data_win_eventdata_image:/.*[Vv][Ii][Vv][Aa][Ll][Dd][Ii]\.exe.*/ OR data_win_eventdata_image:/.*[Mm][Ss][Ee][Dd][Gg][Ee]\.exe.*/) AND data_win_eventdata_commandLine:/.*\-\-[Hh][Ee][Aa][Dd][Ll][Ee][Ss][Ss].*/ AND data_win_eventdata_commandLine:/.*\-\-[Dd][Ii][Ss][Aa][Bb][Ll][Ee]\-[Gg][Pp][Uu].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 94fc85a1-e55b-4265-95e1-4b66730e05c0
    name: Headless Browser Mockbin or Mocky Request
    reason: Same headless Chromium launch fetching an attacker-controlled mock-API page; shows the headless run is staging or C2 rather than developer testing.
  - id: 0e8cfe08-02c9-4815-a2f8-0d157b7ed33e
    name: File Download with Headless Browser
    reason: Headless browser run with dump or download flags to pull a payload to disk, the usual goal of a hidden browser.
  - id: 3e8207c5-fcd2-4ea6-9418-15d45b4890e4
    name: Potential Data Stealing Via Chromium Headless Debugging
    reason: Headless Chromium with a remote-debugging port is how cookies and tokens are lifted from the user profile.
  - id: 1c526788-0abe-4713-862f-b520da5e5316
    name: Chromium Browser Headless Execution To Mockbin Like Site
    reason: Headless launch whose URL is a mockbin-like host used for payload hosting or exfiltration.
  - id: da355155-1d23-48f9-bf95-e534ae273ab0
    name: Windows Chrome Enable Extension Loading via Command-Line
    reason: Loading an unpacked extension on the command line often accompanies unattended Chrome sessions used for credential theft.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Chromium launched with remote debugging or dump flags
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*\-\-remote\-debugging.*/ OR data_win_eventdata_commandLine:/.*\-\-dump\-dom.*/ OR data_win_eventdata_commandLine:/.*\-\-load\-extension.*/)
    pivot_on: host
    window: 2h
  - name: Chromium started by script interpreters or Office
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Cc][Hh][Rr][Oo][Mm][Ee]\.[Ee][Xx][Ee]|\\[Mm][Ss][Ee][Dd][Gg][Ee]\.[Ee][Xx][Ee]|\\[Bb][Rr][Aa][Vv][Ee]\.[Ee][Xx][Ee]|\\[Oo][Pp][Ee][Rr][Aa]\.[Ee][Xx][Ee]|\\[Vv][Ii][Vv][Aa][Ll][Dd][Ii]\.[Ee][Xx][Ee])/ AND data_win_eventdata_parentImage:/.*(\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]|\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]|\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|\\[Ww][Ii][Nn][Ww][Oo][Rr][Dd]\.[Ee][Xx][Ee]|\\[Ee][Xx][Cc][Ee][Ll]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 2h
  - name: Browser credential and cookie store access outside the browser
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ll][Oo][Gg][Ii][Nn] [Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Oo][Kk][Ii][Ee][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ll][Oo][Cc][Aa][Ll] [Ss][Tt][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ll][Oo][Gg][Ii][Nn][Ss]\.[Jj][Ss][Oo][Nn].*/) AND NOT data_win_eventdata_image:/.*(\\[Cc][Hh][Rr][Oo][Mm][Ee]\.[Ee][Xx][Ee]|\\[Mm][Ss][Ee][Dd][Gg][Ee]\.[Ee][Xx][Ee]|\\[Bb][Rr][Aa][Vv][Ee]\.[Ee][Xx][Ee]|\\[Oo][Pp][Ee][Rr][Aa]\.[Ee][Xx][Ee]|\\[Vv][Ii][Vv][Aa][Ll][Dd][Ii]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 4h
  - name: Network connections by browsers launched without a window
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*(\\[Cc][Hh][Rr][Oo][Mm][Ee]\.[Ee][Xx][Ee]|\\[Mm][Ss][Ee][Dd][Gg][Ee]\.[Ee][Xx][Ee]|\\[Bb][Rr][Aa][Vv][Ee]\.[Ee][Xx][Ee]|\\[Oo][Pp][Ee][Rr][Aa]\.[Ee][Xx][Ee]|\\[Vv][Ii][Vv][Aa][Ll][Dd][Ii]\.[Ee][Xx][Ee])/ AND data_win_eventdata_initiated:"true"
    pivot_on: host
    window: 2h
  - name: Download cradles and transfer LOLBins
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]\-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn] /[Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll] \-[Uu][Rr][Ll][Cc][Aa][Cc][Hh][Ee].*/)
    pivot_on: host
    window: 2h
