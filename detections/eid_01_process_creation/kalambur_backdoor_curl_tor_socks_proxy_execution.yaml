name: Kalambur Backdoor Curl TOR SOCKS Proxy Execution
id: e99375eb-3ee0-407a-9f90-79569cc6a01c
version: 1
schema_version: "1.0"
date: "2025-02-11"
author: Arda Buyukkaya (EclecticIQ)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: e99375eb-3ee0-407a-9f90-79569cc6a01c
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of the "curl.exe" command, referencing "SOCKS" and
  ".onion" domains, which could be indicative of Kalambur backdoor activity.
  MITRE ATT&CK: T1090, T1573, T1071.001, T1059.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\curl.exe"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*socks5h://*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*socks5://*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*socks4a://*"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*.onion*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\curl.exe'; data_win_eventdata_commandLine matches '*socks5h://*';
  data_win_eventdata_commandLine matches '*socks5://*', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://blog.eclecticiq.com/sandworm-apt-targets-ukrainian-users-with-trojanized-microsoft-kms-activation-tools-in-cyber-espionage-campaigns
  - https://attack.mitre.org/techniques/T1090/
  - https://attack.mitre.org/techniques/T1573/
  - https://attack.mitre.org/techniques/T1071/001/
  - https://attack.mitre.org/techniques/T1059/001/

response:
  message: >
    Kalambur Backdoor Curl TOR SOCKS Proxy Execution detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
    MITRE ATT&CK: T1090, T1573, T1071.001, T1059.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1090
    - T1573
    - T1071.001
    - T1059.001
  custom_tags:
    - kalambur
    - backdoor
    - socks
    - process_creation
    - sysmon
    - execution
    - command_and_control
    - s0183
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*[Ss][Oo][Cc][Kk][Ss]5[Hh]:\/\/.*/ OR data_win_eventdata_commandLine:/.*[Ss][Oo][Cc][Kk][Ss]5:\/\/.*/ OR data_win_eventdata_commandLine:/.*[Ss][Oo][Cc][Kk][Ss]4[Aa]:\/\/.*/) AND data_win_eventdata_commandLine:/.*\.[Oo][Nn][Ii][Oo][Nn].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7530cd3d-7671-43e3-b209-976966f6ea48
    name: Renamed CURL.EXE Execution
    reason: Renamed curl evades name-based rules and may hide more proxy use
  - id: 2c1486f5-02e8-4f86-9099-b97f2da4ed77
    name: Insecure Proxy/DOH Transfer Via Curl.EXE
    reason: Curl via proxy/DoH is the same covert-channel behaviour
  - id: cb9cc1d1-e84e-4bdc-b7ad-c31b1b7908ec
    name: Insecure Transfer Via Curl.EXE
    reason: Insecure curl transfers are a sibling used by the same stagers
  - id: e218595b-bbe7-4ee5-8a96-f32a24ad3468
    name: Suspicious Curl.EXE Download
    reason: Suspicious curl downloads mark payload staging around the Tor channel
  - id: 1d174d38-8fda-4081-a9b6-56d9763c0cd8
    name: Scheduled Task Creation with Curl and PowerShell Execution Combo
    reason: Scheduled task using curl and PowerShell is a persistence route for such backdoors
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Curl executions with onion or socks references
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Cc][Uu][Rr][Ll])\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*\.[Oo][Nn][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ss][Oo][Cc][Kk][Ss].*/ OR data_win_eventdata_commandLine:/.*--[Pp][Rr][Oo][Xx][Yy].*/)
    pivot_on: host
    window: 24h
  - name: Tor client or config on host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Tt][Oo][Rr]|[Oo][Bb][Ff][Ss]4[Pp][Rr][Oo][Xx][Yy])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Tt][Oo][Rr][Rr][Cc].*/ OR data_win_eventdata_commandLine:/.*9050.*/ OR data_win_eventdata_commandLine:/.*9150.*/)
    pivot_on: host
    window: 24h
  - name: DNS lookups for onion or Tor infrastructure
    query: data_win_system_eventID:"22" AND (data_win_eventdata_queryName:/.*\.[Oo][Nn][Ii][Oo][Nn].*/ OR data_win_eventdata_queryName:/.*[Tt][Oo][Rr][Pp][Rr][Oo][Jj][Ee][Cc][Tt].*/)
    pivot_on: host
    window: 4h
  - name: Connections to local SOCKS ports
    query: data_win_system_eventID:"3" AND data_win_eventdata_destinationPort:(9050 OR 9150 OR 1080)
    pivot_on: host
    window: 4h
  - name: Persistence via scheduled tasks or Run keys
    query: ((data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss])\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*\/[Cc][Rr][Ee][Aa][Tt][Ee].*/) OR (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/))
    pivot_on: host
    window: 4h
