name: Windows Odbcconf Hunting
id: Windows-Odbcconf-Hunting
version: 7
schema_version: 1
date: '2025-05-02'
author: SOCFortress LLC
status: production
type: Hunting
description: >
  Detects any execution of odbcconf.exe on Windows endpoints. Odbcconf.exe is
  a legitimate ODBC configuration utility that can be abused by attackers to
  execute arbitrary commands or load malicious DLLs via its /A and /F flags,
  bypassing application whitelisting. Any execution in non-administrative or
  unexpected contexts should be investigated. Associated with Living Off The Land
  tradecraft.
  MITRE ATT&CK: T1218.008 (System Binary Proxy Execution: Odbcconf).

data_source:
  - Sysmon EventID 1 (ProcessCreate)

search:
  query:
    bool:
      must:
        - term:
            agent_name: "AGENT_NAME"
        - term:
            agent_labels_customer: "CUSTOMER_CODE"
        - term:
            data_win_system_eventID: "1"
        - wildcard:
            data_win_eventdata_image: "*\\odbcconf.exe"
        - range:
            timestamp:
              gte: "START_TIME"
              lte: "END_TIME"

parameters:
  - name: AGENT_NAME
    default: "DESKTOP-AM0HLGE"
  - name: CUSTOMER_CODE
    default: "lab"
  - name: START_TIME
    default: "now-24h"
  - name: END_TIME
    default: "now"

how_to_implement: >
  Requires Sysmon EventID 1 (ProcessCreate) flowing to the Wazuh Indexer.
  Field data_win_eventdata_image is confirmed working across all EventID 1
  detections in this environment. Field-validated based on established EventID 1
  detection patterns. This is a broad hunting detection — review commandLine
  for /A REGSVR or /F flags loading DLLs to confirm malicious intent.

known_false_positives: >
  False positives will be present as odbcconf.exe may be invoked by legitimate
  ODBC driver installations or database software. This detection is intended
  for hunting and tuning purposes.

references:
  - https://strontic.github.io/xcyclopedia/library/odbcconf.exe-07FBA12552331355C103999806627314.html
  - https://twitter.com/redcanary/status/1541838407894171650
  - https://attack.mitre.org/techniques/T1218/008/

response:
  message: >
    odbcconf.exe execution detected on $agent_name$ by $data_win_eventdata_user$.
    Parent: $data_win_eventdata_parentImage$.
    Command: $data_win_eventdata_commandLine$.
    MITRE ATT&CK: T1218.008
  risk_score: 20
  severity: low
  risk_objects:
    - field: agent_name
      type: system
      score: 20
    - field: data_win_eventdata_user
      type: user
      score: 20
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: parent_process_name
    - field: data_win_eventdata_image
      type: process_name

tags:
  analytic_story:
    - Living Off The Land
  asset_type: Endpoint
  mitre_attack_id:
    - T1218.008
  custom_tags:
    - odbcconf
    - lolbas
    - proxy_execution
    - defense_evasion
  product:
    - Wazuh
  security_domain: endpoint

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: Windows-Odbcconf-Load-DLL
    name: Windows Odbcconf Load DLL
    reason: Targeted /A REGSVR variant; the usual malicious follow-up to a generic odbcconf execution.
  - id: Windows-Odbcconf-Load-Response-File
    name: Windows Odbcconf Load Response File
    reason: Response-file (/F .rsp) variant that hides the REGSVR payload in an external file.
  - id: 5f03babb-12db-4eec-8c82-7b4cb5580868
    name: Response File Execution Via Odbcconf.EXE
    reason: Sigma coverage of the same response-file abuse; corroborates the hunting hit.
  - id: ba4cfc11-d0fa-4d94-bf20-7c332c412e76
    name: Potentially Suspicious DLL Registered Via Odbcconf.EXE
    reason: Turns the broad hunt into a concrete DLL registration.
  - id: 6b65c28e-11f3-46cb-902a-68f2cafaf474
    name: Odbcconf.EXE Suspicious DLL Location
    reason: DLL in a user-writable path is the strongest sign the run was malicious.
  - id: 8e3c7994-131e-4ba5-b6ea-804d49113a26
    name: Uncommon Child Process Spawned By Odbcconf.EXE
    reason: odbcconf spawning a shell or other child means the proxied payload has executed.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: odbcconf command lines using REGSVR or response files
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Oo][Dd][Bb][Cc][Cc][Oo][Nn][Ff]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*[Rr][Ee][Gg][Ss][Vv][Rr].*/ OR data_win_eventdata_commandLine:/.*\.[Rr][Ss][Pp].*/ OR data_win_eventdata_commandLine:/.*\/[Aa] .*/ OR data_win_eventdata_commandLine:/.*\-[Aa] .*/ OR data_win_eventdata_commandLine:/.*\/[Ff] .*/ OR data_win_eventdata_commandLine:/.*\-[Ff] .*/)
    pivot_on: host
    window: 1h
  - name: Proxy execution through other signed binaries (regsvr32/rundll32/mshta)
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]|\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Cc][Ss]\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Aa][Ss][Mm]\.[Ee][Xx][Ee]|\\[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|\\[Mm][Ss][Bb][Uu][Ii][Ll][Dd]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 1h
  - name: Child processes spawned by odbcconf
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*(\\[Oo][Dd][Bb][Cc][Cc][Oo][Nn][Ff]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 1h
  - name: Outbound connections by odbcconf or DLL proxy binaries
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*(\\[Oo][Dd][Bb][Cc][Cc][Oo][Nn][Ff]\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]|\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 1h
