name: Potential Regsvr32 Commandline Flag Anomaly
id: b236190c-1c61-41e9-84b3-3fe03f6d76b0
version: 1
schema_version: "1.0"
date: "2024-03-13"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: b236190c-1c61-41e9-84b3-3fe03f6d76b0
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a potential command line flag anomaly related to "regsvr32" in which
  the "/i" flag is used without the "/n" which should be uncommon. MITRE ATT&CK:
  T1218.010.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\regsvr32.exe"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -i:*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /i:*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* –i:*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* —i:*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* ―i:*"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_commandLine"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* -n *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* /n *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* –n *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* —n *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* ―n *"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\regsvr32.exe'; data_win_eventdata_commandLine matches '* -i:*';
  data_win_eventdata_commandLine matches '* /i:*', among other conditions.

known_false_positives: >
  Administrator typo might cause some false positives. Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://twitter.com/sbousseaden/status/1282441816986484737?s=12
  - https://attack.mitre.org/techniques/T1218/010/

response:
  message: >
    Potential Regsvr32 Commandline Flag Anomaly detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1218.010
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218.010
  custom_tags:
    - regsvr32
    - anomaly
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.* -[Ii]:.*/ OR data_win_eventdata_commandLine:/.* \/[Ii]:.*/ OR data_win_eventdata_commandLine:/.* –[Ii]:.*/ OR data_win_eventdata_commandLine:/.* —[Ii]:.*/ OR data_win_eventdata_commandLine:/.* ―[Ii]:.*/) AND _exists_:data_win_eventdata_commandLine AND NOT (data_win_eventdata_commandLine:/.* -[Nn] .*/ OR data_win_eventdata_commandLine:/.* \/[Nn] .*/ OR data_win_eventdata_commandLine:/.* –[Nn] .*/ OR data_win_eventdata_commandLine:/.* —[Nn] .*/ OR data_win_eventdata_commandLine:/.* ―[Nn] .*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: f421c250-24e7-11ec-bc43-acde48001122
    name: Regsvr32 Silent and Install Param Dll Loading
    reason: Same /i with /s install-mode pattern; confirms scriptlet/DLL install abuse rather than a stray flag.
  - id: c9ef7dc4-eeaf-11eb-b2b6-acde48001122
    name: Regsvr32 with Known Silent Switch Cmdline
    reason: Silent /s switch typically accompanies the /i-without-/n loader to hide prompts.
  - id: 867356ee-9352-41c9-a8f2-1be690d78216
    name: Potentially Suspicious Regsvr32 HTTP/FTP Pattern
    reason: /i:http://... pulls a remote scriptlet; shows payload retrieval behind the anomalous flag.
  - id: 2dd2c217-bf68-437a-b57c-fe9fd01d5de8
    name: Potentially Suspicious Regsvr32 HTTP IP Pattern
    reason: Remote scriptlet fetched from a raw IP is a strong escalation of the same execution.
  - id: 6f0947a4-1c5e-4e0d-8ac7-53159b8f23ca
    name: Potentially Suspicious Child Process Of Regsvr32
    reason: 'Follow-on: regsvr32 spawning shells or script hosts is the payload running.'
  - id: 327ff235-94eb-4f06-b9de-aaee571324be
    name: Regsvr32 Execution From Highly Suspicious Location
    reason: Regsvr32 loading from Temp/Public paths shows the staged payload location.
  - id: 089fc3d2-71e8-4763-a8a5-c97fbb0a403e
    name: Regsvr32 DLL Execution With Suspicious File Extension
    reason: Fake-extension DLLs are a common companion of this loader.
  - id: 070e9b80-6252-11eb-ae93-0242ac130002
    name: Detect Regsvr32 Application Control Bypass
    reason: Generic Squiblydoo-style regsvr32 AWL bypass on the same host.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Children of regsvr32
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 1h
  - name: Regsvr32 network connections
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 1h
  - name: Regsvr32 DNS lookups
    query: data_win_system_eventID:"22" AND data_win_eventdata_image:/.*\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 1h
  - name: Script or DLL files dropped in user-writable paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\([Tt]emp|[Aa]pp[Dd]ata|[Pp]ublic|[Dd]ownloads|[Pp]rogram[Dd]ata)\\.*\.([Ss][Cc][Tt]|[Dd][Ll][Ll]|[Jj][Ss]|[Vv][Bb][Ss]|[Hh][Tt][Aa])/
    pivot_on: host
    window: 2h
  - name: Scriptlet engine loaded (scrobj.dll)
    query: data_win_system_eventID:"7" AND data_win_eventdata_imageLoaded:/.*\\[Ss][Cc][Rr][Oo][Bb][Jj]\.[Dd][Ll][Ll]/
    pivot_on: host
    window: 1h
