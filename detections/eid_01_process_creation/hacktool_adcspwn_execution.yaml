name: HackTool - ADCSPwn Execution
id: cd8c163e-a19b-402e-bdd5-419ff5859f12
version: 1
schema_version: "1.0"
date: "2023-02-04"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: cd8c163e-a19b-402e-bdd5-419ff5859f12
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects command line parameters used by ADCSPwn, a tool to escalate privileges
  in an active directory network by coercing authenticate from machine accounts
  and relaying to the certificate service. MITRE ATT&CK: T1557.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* --adcs *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* --port *"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches '*
  --adcs *'; data_win_eventdata_commandLine matches '* --port *'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/bats3c/ADCSPwn
  - https://attack.mitre.org/techniques/T1557/001/

response:
  message: >
    HackTool - ADCSPwn Execution detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1557.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1557.001
  custom_tags:
    - hacktool
    - adcspwn
    - process_creation
    - sysmon
    - collection
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.* --[Aa][Dd][Cc][Ss] .*/ AND data_win_eventdata_commandLine:/.* --[Pp][Oo][Rr][Tt] .*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 12827a56-61a4-476a-a9cb-f3068f191073
    name: HackTool - KrbRelayUp Execution
    reason: Same relay-to-privilege-escalation family; an operator relaying machine-account auth may try KrbRelayUp on the same host.
  - id: 5589ab4f-a767-433c-961d-c91f3f704db1
    name: Potential SMB Relay Attack Tool Execution
    reason: ADCSPwn relays coerced machine-account NTLM auth; SMB relay tooling on the host is the sibling technique.
  - id: bb76d96b-821c-47cf-944b-7ce377864492
    name: Suspicious NTLM Authentication on the Printer Spooler Service
    reason: Spooler-based coercion is the usual way to force the machine account to authenticate to the relay.
  - id: 6938366d-8954-4ddc-baff-c830b3ba8fcd
    name: HackTool - Certipy Execution
    reason: 'Follow-on: the certificate obtained via relay is typically used with Certipy for PKINIT auth.'
  - id: 762f2482-ff21-4970-8939-0aa317a886bb
    name: HackTool - Certify Execution
    reason: 'Precursor: Certify enumerates vulnerable CAs and templates before relaying to the ADCS web enrollment endpoint.'
  - id: 7ec2c172-dceb-4c10-92c9-87c1881b7e18
    name: HackTool - Rubeus Execution
    reason: 'Follow-on: the issued machine certificate is converted to a TGT/NT hash with Rubeus asktgt.'
  - id: f376c8a7-a2d0-4ddc-aa0c-16c17236d962
    name: HackTool - Bloodhound/Sharphound Execution
    reason: 'Precursor: AD graph collection identifies the target machine and CA before the coercion and relay.'
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: 'Follow-on: with a DC machine certificate the attacker can DCSync or dump credentials.'
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other ADCS abuse tooling on host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc]ertify.*/ OR data_win_eventdata_commandLine:/.*[Cc]ertipy.*/ OR data_win_eventdata_commandLine:/.*\/[Tt]emplate:.*/ OR data_win_eventdata_commandLine:/.*[Pp][Kk][Ii][Nn][Ii][Tt].*/)
    pivot_on: host
    window: 24h
  - name: Rubeus or certificate-to-TGT requests
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Aa][Ss][Kk][Tt][Gg][Tt].*/ OR data_win_eventdata_commandLine:/.*\/[Cc][Ee][Rr][Tt][Ii][Ff][Ii][Cc][Aa][Tt][Ee]:.*/ OR data_win_eventdata_commandLine:/.*\/[Pp][Tt][Tt].*/)
    pivot_on: host
    window: 24h
  - name: Coercion tooling (spooler, EFS, DFS) on host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Pp][Rr][Ii][Nn][Tt][Ee][Rr][Bb][Uu][Gg].*/ OR data_win_eventdata_commandLine:/.*[Pp][Ee][Tt][Ii][Tt][Pp][Oo][Tt][Aa][Mm].*/ OR data_win_eventdata_commandLine:/.*[Ss][Pp][Oo][Oo][Ll][Ss][Aa][Mm][Pp][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Ee][Rr][Cc][Ee].*/)
    pivot_on: host
    window: 4h
  - name: Recon for DC and CA discovery
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Nn][Ll][Tt][Ee][Ss][Tt].*\/[Dd][Cc][Ll][Ii][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll].*-[Cc][Aa].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ss][Qq][Uu][Ee][Rr][Yy].*/)
    pivot_on: host
    window: 24h
  - name: AD CS certificate issuance events
    query: data_win_system_eventID:(4886 OR 4887)
    pivot_on: host
    window: 4h
