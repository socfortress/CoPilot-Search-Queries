name: Windows Internet Hosted WebDav Share Mount Via Net.EXE
id: 7e6237fe-3ddb-438f-9381-9bf9de5af8d0
version: 1
schema_version: "1.0"
date: "2023-07-25"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 7e6237fe-3ddb-438f-9381-9bf9de5af8d0
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects when an internet hosted webdav share is mounted using the "net.exe"
  utility. MITRE ATT&CK: T1021.002.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\net.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\net1.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "net.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "net1.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* use *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* http*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches '*\net.exe';
  data_win_eventdata_image matches '*\net1.exe';
  data_win_eventdata_originalFileName equals 'net.exe', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://drive.google.com/file/d/1lKya3_mLnR3UQuCoiYruO3qgu052_iS_/view
  - https://attack.mitre.org/techniques/T1021/002/

response:
  message: >
    Windows Internet Hosted WebDav Share Mount Via Net.EXE detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1021.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1021.002
  custom_tags:
    - internet
    - hosted
    - webdav
    - process_creation
    - sysmon
    - lateral_movement
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Nn][Ee][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Nn][Ee][Tt]1\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Nn][Ee][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Nn][Ee][Tt]1\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.* [Uu][Ss][Ee] .*/ AND data_win_eventdata_commandLine:/.* [Hh][Tt][Tt][Pp].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: f0507c0f-a3a2-40f5-acc6-7f543c334993
    name: Suspicious File Execution From Internet Hosted WebDav Share
    reason: 'Direct follow-on: files run from the mounted share.'
  - id: 982e9f2d-1a85-4d5b-aea4-31f5e97c6555
    name: Suspicious WebDav Client Execution Via Rundll32.EXE
    reason: Rundll32 davclnt.dll is the alternate WebDAV client path used with the same infrastructure.
  - id: 2dbd9d3d-9e27-42a8-b8df-f13825c6c3d5
    name: WebDav Client Execution Via Rundll32.EXE
    reason: WebDAV client activity co-occurring shows active WebDAV retrieval.
  - id: 1412aa78-a24c-4abd-83df-767dfb2c5bbe
    name: Potentially Suspicious WebDAV LNK Execution
    reason: 'Common precursor: a shortcut that triggers the WebDAV connection.'
  - id: 5cdb711b-5740-4fb2-ba88-f7945027afac
    name: Rundll32 UNC Path Execution
    reason: Loading a DLL from the mounted share or UNC path is a typical next step.
  - id: 3abd6094-7027-475f-9630-8ab9be7b9725
    name: Windows Admin Share Mount Via Net.EXE
    reason: Same net use tradecraft toward internal shares; shows whether the actor also maps internal resources.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other net use / mount commands
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*[Nn]et1?(\.exe)? +[Uu]se.*/
    pivot_on: host
    window: 2h
  - name: Processes referencing WebDAV paths
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*[Dd][Aa][Vv][Ww][Ww][Ww][Rr]oot.*/ OR data_win_eventdata_commandLine:/.*@[Ss][Ss][Ll].*/ OR data_win_eventdata_commandLine:/.*[Dd]avclnt.*/)
    pivot_on: host
    window: 2h
  - name: WebClient/net.exe outbound HTTP connections
    query: data_win_system_eventID:3 AND (data_win_eventdata_image:/.*[Ss]vchost.*/ OR data_win_eventdata_image:/.*[Nn]et1?\.exe/) AND data_win_eventdata_destinationPort:(80 OR 443 OR 8080)
    pivot_on: host
    window: 1h
  - name: DNS lookups by net.exe or svchost for the share host
    query: data_win_system_eventID:22 AND (data_win_eventdata_image:/.*[Nn]et1?\.exe/ OR data_win_eventdata_image:/.*[Ss]vchost.*/)
    pivot_on: host
    window: 1h
  - name: Processes launched from a WebDAV working directory
    query: data_win_system_eventID:1 AND (data_win_eventdata_currentDirectory:/.*[Dd][Aa][Vv][Ww][Ww][Ww][Rr]oot.*/ OR data_win_eventdata_commandLine:/.*[Dd][Aa][Vv][Ww][Ww][Ww][Rr]oot.*/)
    pivot_on: host
    window: 2h
