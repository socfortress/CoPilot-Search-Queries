name: Process Access via TrolleyExpress Exclusion
id: 4c0aaedc-154c-4427-ada0-d80ef9c9deb6
version: 1
schema_version: "1.0"
date: "2022-05-13"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 4c0aaedc-154c-4427-ada0-d80ef9c9deb6
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a possible process memory dump that uses the white-listed Citrix
  TrolleyExpress.exe filename as a way to dump the lsass process memory. MITRE
  ATT&CK: T1218.011, T1003.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\TrolleyExpress 7*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\TrolleyExpress 8*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\TrolleyExpress 9*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\TrolleyExpress.exe 7*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\TrolleyExpress.exe 8*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\TrolleyExpress.exe 9*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\TrolleyExpress.exe -ma *"
                    case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\TrolleyExpress.exe"
                          case_insensitive: true
                    - bool:
                        must_not:
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_originalFileName:
                                      value: "*CtxInstall*"
                                      case_insensitive: true
                                - bool:
                                    must_not:
                                      - exists:
                                          field: "data_win_eventdata_originalFileName"
                              minimum_should_match: 1
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*\TrolleyExpress 7*'; data_win_eventdata_commandLine matches
  '*\TrolleyExpress 8*'; data_win_eventdata_commandLine matches
  '*\TrolleyExpress 9*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/_xpn_/status/1491557187168178176
  - https://www.youtube.com/watch?v=Ie831jF0bb0
  - https://attack.mitre.org/techniques/T1218/011/
  - https://attack.mitre.org/techniques/T1003/001/

response:
  message: >
    Process Access via TrolleyExpress Exclusion detected on host $agent_name$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1218.011, T1003.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218.011
    - T1003.001
  custom_tags:
    - trolleyexpress
    - exclusion
    - process_creation
    - sysmon
    - stealth
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*\\[Tt][Rr][Oo][Ll][Ll][Ee][Yy][Ee][Xx][Pp][Rr][Ee][Ss][Ss] 7.*/ OR data_win_eventdata_commandLine:/.*\\[Tt][Rr][Oo][Ll][Ll][Ee][Yy][Ee][Xx][Pp][Rr][Ee][Ss][Ss] 8.*/ OR data_win_eventdata_commandLine:/.*\\[Tt][Rr][Oo][Ll][Ll][Ee][Yy][Ee][Xx][Pp][Rr][Ee][Ss][Ss] 9.*/ OR data_win_eventdata_commandLine:/.*\\[Tt][Rr][Oo][Ll][Ll][Ee][Yy][Ee][Xx][Pp][Rr][Ee][Ss][Ss]\.[Ee][Xx][Ee] 7.*/ OR data_win_eventdata_commandLine:/.*\\[Tt][Rr][Oo][Ll][Ll][Ee][Yy][Ee][Xx][Pp][Rr][Ee][Ss][Ss]\.[Ee][Xx][Ee] 8.*/ OR data_win_eventdata_commandLine:/.*\\[Tt][Rr][Oo][Ll][Ll][Ee][Yy][Ee][Xx][Pp][Rr][Ee][Ss][Ss]\.[Ee][Xx][Ee] 9.*/ OR data_win_eventdata_commandLine:/.*\\[Tt][Rr][Oo][Ll][Ll][Ee][Yy][Ee][Xx][Pp][Rr][Ee][Ss][Ss]\.[Ee][Xx][Ee] -[Mm][Aa] .*/ OR (data_win_eventdata_image:/.*\\[Tt][Rr][Oo][Ll][Ll][Ee][Yy][Ee][Xx][Pp][Rr][Ee][Ss][Ss]\.[Ee][Xx][Ee]/ AND NOT (data_win_eventdata_originalFileName:/.*[Cc][Tt][Xx][Ii][Nn][Ss][Tt][Aa][Ll][Ll].*/ OR NOT _exists_:data_win_eventdata_originalFileName)))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 5afee48e-67dd-4e03-a783-f74259dcf998
    name: Potential LSASS Process Dump Via Procdump
    reason: TrolleyExpress is a renamed Citrix procdump; same dump technique under a whitelisted name.
  - id: 2e65275c-8288-4ab4-aeb7-6274f58b6b20
    name: Procdump Execution
    reason: Same underlying tool family, may also appear under the original name.
  - id: 4be8b654-0c01-4c9d-a10c-6b28467fc651
    name: LSASS Access From Potentially White-Listed Processes
    reason: Sysmon 10 view of the same whitelisted-process lsass access.
  - id: 5ef9853e-4d0e-4a70-846f-a9ca37d876da
    name: Potential Credential Dumping Activity Via LSASS
    reason: Confirms LSASS memory was actually opened.
  - id: a18dd26b-6450-46de-8c91-9659150cf088
    name: Potentially Suspicious GrantedAccess Flags On LSASS
    reason: Access masks corroborate dump-level access.
  - id: 9bd012ee-0dff-44d7-84a0-aa698cfd87a3
    name: LSASS Memory Access by Tool With Dump Keyword In Name
    reason: Dump-named tools touching lsass on the same host.
  - id: ec570e53-4c76-45a9-804d-dc3f355ff7a7
    name: 7Zip Compressing Dump Files
    reason: Dump staged for exfiltration.
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: Offline parsing of the extracted dump.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: TrolleyExpress execution anywhere
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:(/.*[Tt]rolley[Ee]xpress.*/) OR data_win_eventdata_originalFileName:/.*[Pp]rocdump.*/)
    pivot_on: host
    window: 4h
  - name: LSASS access by non-system image
    query: data_win_system_eventID:10 AND data_win_eventdata_targetImage:(/.*\\lsass\.exe/)
    pivot_on: host
    window: 4h
  - name: Dump files written
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(/.*\.(dmp|dump)/)
    pivot_on: host
    window: 4h
  - name: TrolleyExpress file drops
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(/.*[Tt]rolley[Ee]xpress.*/)
    pivot_on: host
    window: 24h
  - name: Dump exfiltration or parsing
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*(\.dmp).*(7z|rar|zip|copy|curl|scp|sekurlsa|pypykatz).*/)
    pivot_on: host
    window: 6h
