/.*[Pp][Aa][Ss][Tt][Ee][Bb][Ii][Nn]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_commandLine:/.*[Pp][Aa][Ss][Tt][Ee][Bb][Ii][Nn]\.[Pp][Ll].*/ OR data_win_eventdata_commandLine:/.*[Pp][Aa][Ss][Tt][Ee][Tt][Ee][Xx][Tt]\.[Nn][Ee][Tt].*/ OR data_win_eventdata_commandLine:/.*[Pp][Rr][Ii][Vv][Aa][Tt][Ll][Aa][Bb]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_commandLine:/.*[Pp][Rr][Ii][Vv][Aa][Tt][Ll][Aa][Bb]\.[Nn][Ee][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Nn][Dd]\.[Ee][Xx][Pp][Ll][Oo][Ii][Tt]\.[Ii][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Nn][Dd][Ss][Pp][Aa][Cc][Ee]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_commandLine:/.*[Ss][Tt][Oo][Rr][Aa][Gg][Ee]\.[Gg][Oo][Oo][Gg][Ll][Ee][Aa][Pp][Ii][Ss]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_commandLine:/.*[Ss][Tt][Oo][Rr][Jj][Ss][Hh][Aa][Rr][Ee]\.[Ii][Oo].*/ OR data_win_eventdata_commandLine:/.*[Ss][Uu][Pp][Aa][Bb][Aa][Ss][Ee]\.[Cc][Oo].*/ OR data_win_eventdata_commandLine:/.*[Tt][Ee][Mm][Pp]\.[Ss][Hh].*/ OR data_win_eventdata_commandLine:/.*[Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr]\.[Ss][Hh].*/ OR data_win_eventdata_commandLine:/.*[Tt][Rr][Yy][Cc][Ll][Oo][Uu][Dd][Ff][Ll][Aa][Rr][Ee]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_commandLine:/.*[Uu][Ff][Ii][Ll][Ee]\.[Ii][Oo].*/ OR data_win_eventdata_commandLine:/.*[Ww]3[Ss][Pp][Aa][Cc][Ee][Ss]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_commandLine:/.*[Ww][Oo][Rr][Kk][Ee][Rr][Ss]\.[Dd][Ee][Vv].*/ OR data_win_eventdata_commandLine:/.*[Xx]0\.[Aa][Tt].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 19b08b1c-861d-4e75-a1ef-ea0c1baf202b
    name: Suspicious Download Via Certutil.EXE
    reason: Overlapping certutil download detection; corroborates the technique.
  - id: windows-file-download-certutil-001
    name: Windows File Download Via Certutil
    reason: Generic certutil download alert on the same command line.
  - id: 0dba975d-a193-4ed1-a067-424df57570d1
    name: Uncommon Network Connection Initiated By Certutil.EXE
    reason: Network proof certutil connected out to the file-sharing service.
  - id: cc9cbe82-7bc0-4ef5-bc23-bbfb83947be7
    name: File Decoded From Base64/Hex Via Certutil.EXE
    reason: Payloads on paste/file-sharing sites are often base64 and decoded next with certutil.
  - id: ae02ed70-11aa-4a22-b397-c0d0e8f6ea99
    name: Unusual File Download From File Sharing Websites - File Stream
    reason: Stream event for a file from a file-sharing site confirms it was written.
  - id: b6e04788-29e1-4557-bb14-77f761848ab8
    name: Potentially Suspicious File Download From File Sharing Domain Via PowerShell.EXE
    reason: Same hosting abuse via PowerShell; shows other stages or a fallback downloader.
  - id: a0d7e4d2-bede-4141-8896-bc6e237e977c
    name: Suspicious File Download From File Sharing Domain Via Wget.EXE
    reason: Same file-sharing hosting abuse via wget.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: DNS lookups for file-sharing and paste hosts
    query: data_win_system_eventID:"22" AND (data_win_eventdata_queryName:/.*[Gg][Ii][Tt][Hh][Uu][Bb][Uu][Ss][Ee][Rr][Cc][Oo][Nn][Tt][Ee][Nn][Tt]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_queryName:/.*[Pp][Aa][Ss][Tt][Ee][Bb][Ii][Nn]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_queryName:/.*[Aa][Nn][Oo][Nn][Ff][Ii][Ll][Ee][Ss].*/ OR data_win_eventdata_queryName:/.*[Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr]\.[Ss][Hh].*/ OR data_win_eventdata_queryName:/.*[Mm][Ee][Dd][Ii][Aa][Ff][Ii][Rr][Ee]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_queryName:/.*[Mm][Ee][Gg][Aa]\.[Nn][Zz].*/ OR data_win_eventdata_queryName:/.*[Dd][Ii][Ss][Cc][Oo][Rr][Dd][Aa][Pp][Pp]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_queryName:/.*[Nn][Gg][Rr][Oo][Kk].*/ OR data_win_eventdata_queryName:/.*0[Xx]0\.[Ss][Tt].*/ OR data_win_eventdata_queryName:/.*[Tt][Ee][Mm][Pp]\.[Ss][Hh].*/)
    pivot_on: host
    window: 2h
  - name: Certutil decode or encode of fetched content
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*-[Dd][Ee][Cc][Oo][Dd][Ee].*/ OR data_win_eventdata_commandLine:/.*\/[Dd][Ee][Cc][Oo][Dd][Ee].*/ OR data_win_eventdata_commandLine:/.*-[Dd][Ee][Cc][Oo][Dd][Ee][Hh][Ee][Xx].*/ OR data_win_eventdata_commandLine:/.*-[Ee][Nn][Cc][Oo][Dd][Ee].*/)
    pivot_on: host
    window: 2h
  - name: Executables or scripts written to staging folders
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Bb][Aa][Tt]|[Pp][Ss]1|[Vv][Bb][Ss]|[Jj][Ss]|[Hh][Tt][Aa]|[Ss][Cc][Rr])/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss]\\.*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Bb][Aa][Tt]|[Pp][Ss]1|[Vv][Bb][Ss]|[Jj][Ss]|[Hh][Tt][Aa]|[Ss][Cc][Rr])/ OR data_win_eventdata_targetFilename:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Bb][Aa][Tt]|[Pp][Ss]1|[Vv][Bb][Ss]|[Jj][Ss]|[Hh][Tt][Aa]|[Ss][Cc][Rr])/ OR data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Bb][Aa][Tt]|[Pp][Ss]1|[Vv][Bb][Ss]|[Jj][Ss]|[Hh][Tt][Aa]|[Ss][Cc][Rr])/)
    pivot_on: host
    window: 2h
  - name: Execution from user-writable staging folders
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss]\\.*/ OR data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/)
    pivot_on: host
    window: 2h
  - name: Persistence created via schtasks or Run key
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*(\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*\/[Cc][Rr][Ee][Aa][Tt][Ee].*/)) OR (data_win_eventdata_image:/.*(\\[Rr][Ee][Gg]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/)))
    pivot_on: host
    window: 4h
