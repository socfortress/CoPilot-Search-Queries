name: Kapeka Backdoor Execution Via RunDLL32.EXE
id: e98f741c-6a5b-4c83-bc2a-1f4e58d07b12
version: 1
schema_version: "1.0"
date: "2024-07-03"
author: Swachchhanda Shrawan Poudel, Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: e98f741c-6a5b-4c83-bc2a-1f4e58d07b12
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects Kapeka backdoor process execution pattern, where the dropper launch
  the backdoor binary by calling rundll32 and passing the backdoor's first
  export ordinal (#1) with a "-d" argument. MITRE ATT&CK: T1218.011.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\rundll32.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "RUNDLL32.EXE"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*:\\\\ProgramData*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\AppData\\\\Local*"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*.wll*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine: "*#1*"
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* -d*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*.wll*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine: "*#1"
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\rundll32.exe'; data_win_eventdata_originalFileName equals 'RUNDLL32.EXE';
  data_win_eventdata_commandLine matches '*:\ProgramData*', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://labs.withsecure.com/publications/kapeka
  - https://app.any.run/tasks/1efb3ed4-cc0f-4690-a0ed-24516809bc72/
  - https://attack.mitre.org/techniques/T1218/011/

response:
  message: >
    Kapeka Backdoor Execution Via RunDLL32.EXE detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1218.011
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218.011
  custom_tags:
    - kapeka
    - backdoor
    - rundll32
    - process_creation
    - sysmon
    - stealth
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_commandLine:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll].*/) AND ((data_win_eventdata_commandLine:/.*\.[Ww][Ll][Ll].*/ AND data_win_eventdata_commandLine:/.*\#1.*/ AND data_win_eventdata_commandLine:/.* -[Dd].*/) OR (data_win_eventdata_commandLine:/.*\.[Ww][Ll][Ll].*/ AND data_win_eventdata_commandLine:/.*\#1/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 43fa5350-db63-4b8f-9a01-789a427074e1
    name: Potential Obfuscated Ordinal Call Via Rundll32
    reason: Ordinal-based rundll32 calls (#1) are exactly this launch style
  - id: c3a99af4-35a9-4668-879e-c09aeb4f2bdf
    name: Rundll32 Execution With Uncommon DLL Extension
    reason: Rundll32 loading a DLL with non-.dll extension (.wll) overlaps this masquerade
  - id: e593cf51-88db-4ee1-b920-37e89012a3c9
    name: Potentially Suspicious Rundll32 Activity
    reason: Generic suspicious rundll32 use often co-fires with the dropper launch
  - id: 1723e720-616d-4ddc-ab02-f7e3685a4713
    name: Rundll32 Spawned Via Explorer.EXE
    reason: Rundll32 spawned from explorer indicates user-driven dropper execution
  - id: 1d174d38-8fda-4081-a9b6-56d9763c0cd8
    name: Scheduled Task Creation with Curl and PowerShell Execution Combo
    reason: Kapeka persists via scheduled task; a task invoking the dropped backdoor follows
  - id: 8a8379b8-780b-4dbf-b1e9-31c8d112fefb
    name: Schtasks From Suspicious Folders
    reason: Schtasks from ProgramData/AppData folders is the persistence step for the dropped .wll
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Rundll32 ordinal export calls from user-writable paths
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Rr][Uu][Nn][Dd][Ll][Ll]32)\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\.*/) AND data_win_eventdata_commandLine:/.*#1.*/
    pivot_on: host
    window: 24h
  - name: Creation of .wll or DLL files in ProgramData/AppData
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\.[Ww][Ll][Ll].*/ OR data_win_eventdata_targetFilename:/.*\.[Dd][Ll][Ll].*/) AND (data_win_eventdata_targetFilename:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\.*/)
    pivot_on: host
    window: 4h
  - name: Scheduled task creation pointing to user-writable paths
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss])\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*\/[Cc][Rr][Ee][Aa][Tt][Ee].*/ AND (data_win_eventdata_commandLine:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/)
    pivot_on: host
    window: 4h
  - name: Rundll32 outbound network connections
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Rr][Uu][Nn][Dd][Ll][Ll]32)\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 4h
  - name: Office spawning rundll32 or script hosts
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\([Ww][Ii][Nn][Ww][Oo][Rr][Dd]|[Ee][Xx][Cc][Ee][Ll])\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Rr][Uu][Nn][Dd][Ll][Ll]32|[Cc][Mm][Dd]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll])\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 4h
