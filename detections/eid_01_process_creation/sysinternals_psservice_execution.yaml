name: Sysinternals PsService Execution
id: 3371f518-5fe3-4cf6-a14b-2a0ae3fd8a4f
version: 1
schema_version: "1.0"
date: "2026-06-29"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 3371f518-5fe3-4cf6-a14b-2a0ae3fd8a4f
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects usage of Sysinternals PsService which can be abused for service
  reconnaissance and tampering. MITRE ATT&CK: T1543.003.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - term:
                  data_win_eventdata_originalFileName:
                    value: "psservice.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\PsService.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\PsService64.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\PsService64a.exe"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_originalFileName
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_originalFileName equals
  'psservice.exe'; data_win_eventdata_image matches '*\PsService.exe';
  data_win_eventdata_image matches '*\PsService64.exe', among other conditions.

known_false_positives: >
  Legitimate use of PsService by an administrator. Baseline expected activity in
  your environment and tune this detection before relying on it for automated
  response.

references:
  - https://learn.microsoft.com/en-us/sysinternals/downloads/psservice
  - https://attack.mitre.org/techniques/T1543/003/

response:
  message: >
    Sysinternals PsService Execution detected on host $agent_name$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1543.003
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_originalFileName
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1543.003
  custom_tags:
    - sysinternals
    - psservice
    - process_creation
    - sysmon
    - privilege_escalation
    - discovery
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_originalFileName:/[Pp][Ss][Ss][Ee][Rr][Vv][Ii][Cc][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ss][Ss][Ee][Rr][Vv][Ii][Cc][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ss][Ss][Ee][Rr][Vv][Ii][Cc][Ee]64\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ss][Ss][Ee][Rr][Vv][Ii][Cc][Ee]64[Aa]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: ea011323-7045-460b-b2d7-0f7442ea6b38
    name: Potential PsExec Remote Execution
    reason: PsExec-style remote execution often accompanies PsService for lateral movement.
  - id: fdfcbd78-48f1-4a4b-90ac-d82241e368c5
    name: PsExec Service Execution
    reason: PsExec service execution is the sibling Sysinternals remote-service technique used with PsService.
  - id: 4beb6ae0-f85b-41e2-8f18-8668abc8af78
    name: Sysinternals PsSuspend Suspicious Execution
    reason: PsSuspend is often paired with PsService to freeze or stop security processes.
  - id: 17a1be64-8d88-40bf-b5ff-a4f7a50ebcc8
    name: Suspicious New Service Creation
    reason: PsService can start newly created services; suspicious service creation is the persistence/execution follow-on.
  - id: 85c312b7-f44d-4a51-a024-d671c40b49fc
    name: Service StartupType Change Via Sc.EXE
    reason: Changing service startup type via sc.exe is the native-tool equivalent of PsService tampering.
  - id: 98c5aeef-32d5-492f-b174-64a691896d25
    name: Service Security Descriptor Tampering Via Sc.EXE
    reason: Service security descriptor tampering can hide services started with PsService.
  - id: 18da1007-3f26-470f-875d-f77faf1cab31
    name: Ps.exe Renamed SysInternals Tool
    reason: Renamed Sysinternals tools evade name-based rules; the same operator may rename PsService.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Service creation events
    query: (data_win_system_eventID:"7045" OR data_win_system_eventID:"4697")
    pivot_on: host
    window: 6h
  - name: sc.exe service create/config/stop
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Ss][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*([Cc][Rr][Ee][Aa][Tt][Ee]|[Cc][Oo][Nn][Ff][Ii][Gg]|[Ss][Tt][Oo][Pp]|[Bb][Ii][Nn][Pp][Aa][Tt][Hh]).*/
    pivot_on: host
    window: 4h
  - name: Other Sysinternals remote admin tools
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*([Pp][Ss][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]|[Pp][Ss][Ee][Xx][Ee][Cc]64\.[Ee][Xx][Ee]|[Pp][Aa][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]|[Pp][Ss][Kk][Ii][Ll][Ll]\.[Ee][Xx][Ee]|[Pp][Ss][Kk][Ii][Ll][Ll]64\.[Ee][Xx][Ee]|[Pp][Ss][Ll][Ii][Ss][Tt]\.[Ee][Xx][Ee]|[Pp][Ss][Ll][Oo][Gg][Ll][Ii][Ss][Tt]\.[Ee][Xx][Ee]|[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 6h
  - name: Security services stopped or disabled
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ss][Tt][Oo][Pp]|[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Dd]).*([Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr]|[Ww][Ii][Nn][Dd][Ee][Ff][Ee][Nn][Dd]|[Ss][Ee][Nn][Ss][Ee]|[Ss][Ee][Nn][Tt][Ii][Nn][Ee][Ll]|[Cc][Rr][Oo][Ww][Dd][Ss][Tt][Rr][Ii][Kk][Ee]).*/
    pivot_on: host
    window: 4h
  - name: Explicit-credential logons (remote service control)
    query: data_win_system_eventID:"4648"
    pivot_on: user
    window: 2h
