name: Suspicious GUP Usage
id: 0a4f6091-223b-41f6-8743-f322ec84930b
version: 1
schema_version: "1.0"
date: "2022-08-13"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 0a4f6091-223b-41f6-8743-f322ec84930b
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of the Notepad++ updater in a suspicious directory, which is
  often used in DLL side-loading attacks. MITRE ATT&CK: T1574.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\GUP.exe"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\Program Files\\\\Notepad++\\\\updater\\\\GUP.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\Program Files (x86)\\\\Notepad++\\\\updater\\\\GUP.exe"
                          case_insensitive: true
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\Users\\\\*"
                                case_insensitive: true
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*\\\\AppData\\\\Local\\\\Notepad++\\\\updater\\\\GUP.exe"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*\\\\AppData\\\\Roaming\\\\Notepad++\\\\updater\\\\GUP.exe"
                                      case_insensitive: true
                              minimum_should_match: 1
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches '*\GUP.exe';
  data_win_eventdata_image matches '*\Program Files\Notepad++\updater\GUP.exe';
  data_win_eventdata_image matches '*\Program Files
  (x86)\Notepad++\updater\GUP.exe', among other conditions.

known_false_positives: >
  Execution of tools named GUP.exe and located in folders different than
  Notepad++\updater. Baseline expected activity in your environment and tune
  this detection before relying on it for automated response.

references:
  - https://www.fireeye.com/blog/threat-research/2018/09/apt10-targeting-japanese-corporations-using-updated-ttps.html
  - https://attack.mitre.org/techniques/T1574/001/

response:
  message: >
    Suspicious GUP Usage detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1574.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.001
  custom_tags:
    - process_creation
    - sysmon
    - privilege_escalation
    - persistence
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Gg][Uu][Pp]\.[Ee][Xx][Ee]/ AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Nn][Oo][Tt][Ee][Pp][Aa][Dd]\+\+\\[Uu][Pp][Dd][Aa][Tt][Ee][Rr]\\[Gg][Uu][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Nn][Oo][Tt][Ee][Pp][Aa][Dd]\+\+\\[Uu][Pp][Dd][Aa][Tt][Ee][Rr]\\[Gg][Uu][Pp]\.[Ee][Xx][Ee]/ OR (data_win_eventdata_image:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*/ AND (data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Nn][Oo][Tt][Ee][Pp][Aa][Dd]\+\+\\[Uu][Pp][Dd][Aa][Tt][Ee][Rr]\\[Gg][Uu][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Rr][Oo][Aa][Mm][Ii][Nn][Gg]\\[Nn][Oo][Tt][Ee][Pp][Aa][Dd]\+\+\\[Uu][Pp][Dd][Aa][Tt][Ee][Rr]\\[Gg][Uu][Pp]\.[Ee][Xx][Ee]/)))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e49b5745-1064-4ac1-9a2e-f687bc2dd37e
    name: Potential DLL Sideloading Of Libcurl.DLL Via GUP.EXE
    reason: 'Direct confirmation: a relocated GUP.exe loading an attacker libcurl.dll is the sideload this rule anticipates.'
  - id: d65aee4d-2292-4cea-b832-83accd6cfa43
    name: Arbitrary Binary Execution Using GUP Utility
    reason: GUP can be driven by arguments to launch arbitrary binaries; same abuse of the updater.
  - id: 44143844-0631-49ab-97a0-96387d6b2d7c
    name: File Download Using Notepad++ GUP Utility
    reason: A copied GUP.exe used as a download tool is a payload-staging follow-on.
  - id: bb0e87ce-c89f-4857-84fa-095e4483e9cb
    name: Suspicious Child Process of Notepad++ Updater - GUP.Exe
    reason: A sideloaded or abused GUP spawning shells/LOLBins shows what the payload did.
  - id: 933f0bb5-0681-4fe7-8a17-4e6cccbaac44
    name: Potential Notepad++ CVE-2025-49144 Exploitation
    reason: Notepad++ installer/updater abuse for privilege escalation; same product attack surface.
  - id: 799a5f48-0ac1-4e0f-9152-71d137d48c2a
    name: Abusable DLL Potential Sideloading From Suspicious Location
    reason: Generic sideload detection that may catch the malicious DLL placed beside the relocated GUP.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: DLL load by GUP from non-standard location
    query: data_win_system_eventID:"7" AND data_win_eventdata_image:/.*(\\[Gg][Uu][Pp]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_imageLoaded:/.*[Ll][Ii][Bb][Cc][Uu][Rr][Ll]\.[Dd][Ll][Ll].*/ OR data_win_eventdata_imageLoaded:/.*\[Uu][Ss][Ee][Rr][Ss]\.*/ OR data_win_eventdata_imageLoaded:/.*\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\.*/ OR data_win_eventdata_imageLoaded:/.*\[Tt][Ee][Mm][Pp]\.*/ OR data_win_eventdata_imageLoaded:/.*\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\.*/)
    pivot_on: host
    window: 1h
  - name: Child processes of GUP
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*(\\[Gg][Uu][Pp]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 2h
  - name: Network connections by GUP
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*(\\[Gg][Uu][Pp]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 2h
  - name: Executable or DLL drops into user-writable paths
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\.[Dd][Ll][Ll].*/ OR data_win_eventdata_targetFilename:/.*\.[Ee][Xx][Ee].*/) AND (data_win_eventdata_targetFilename:/.*\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\.*/ OR data_win_eventdata_targetFilename:/.*\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\.*/ OR data_win_eventdata_targetFilename:/.*\[Uu][Ss][Ee][Rr][Ss]\[Pp][Uu][Bb][Ll][Ii][Cc]\.*/ OR data_win_eventdata_targetFilename:/.*\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\[Tt][Ee][Mm][Pp]\.*/)
    pivot_on: host
    window: 2h
  - name: Run key persistence
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:/.*\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\[Rr][Uu][Nn].*/ OR data_win_eventdata_targetObject:/.*\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\[Rr][Uu][Nn][Oo][Nn][Cc][Ee].*/)
    pivot_on: host
    window: 4h
