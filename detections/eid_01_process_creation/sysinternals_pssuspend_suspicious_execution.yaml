name: Sysinternals PsSuspend Suspicious Execution
id: 4beb6ae0-f85b-41e2-8f18-8668abc8af78
version: 1
schema_version: "1.0"
date: "2026-06-29"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 4beb6ae0-f85b-41e2-8f18-8668abc8af78
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious execution of Sysinternals PsSuspend, where the utility is
  used to suspend critical processes such as AV or EDR to bypass defenses. MITRE
  ATT&CK: T1685.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - term:
                  data_win_eventdata_originalFileName:
                    value: "pssuspend.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\pssuspend.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\pssuspend64.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\pssuspend64a.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*msmpeng.exe*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_originalFileName
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_originalFileName equals
  'pssuspend.exe'; data_win_eventdata_image matches '*\pssuspend.exe';
  data_win_eventdata_image matches '*\pssuspend64.exe', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://learn.microsoft.com/en-us/sysinternals/downloads/pssuspend
  - https://twitter.com/0gtweet/status/1638069413717975046
  - https://attack.mitre.org/techniques/T1685/

response:
  message: >
    Sysinternals PsSuspend Suspicious Execution detected on host $agent_name$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1685
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_originalFileName
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685
  custom_tags:
    - sysinternals
    - pssuspend
    - process_creation
    - sysmon
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_originalFileName:/[Pp][Ss][Ss][Uu][Ss][Pp][Ee][Nn][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ss][Ss][Uu][Ss][Pp][Ee][Nn][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ss][Ss][Uu][Ss][Pp][Ee][Nn][Dd]64\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ss][Ss][Uu][Ss][Pp][Ee][Nn][Dd]64[Aa]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Mm][Ss][Mm][Pp][Ee][Nn][Gg]\.[Ee][Xx][Ee].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a7ee1722-c3c5-aeff-3212-c777e4733217
    name: Disable Windows Defender AV Security Monitoring
    reason: Suspending MsMpEng is a quieter alternative to disabling Defender; operators often try both on the same host.
  - id: windows-attempt-stop-security-service-001
    name: Windows Attempt To Stop Security Service
    reason: Service stop attempts on security products are the loud fallback when suspending the process is not enough.
  - id: windows-disable-modify-tools-taskkill-001
    name: Windows Disable or Modify Tools Via Taskkill
    reason: Taskkill against AV/EDR processes is the sibling technique to pssuspend for neutralising defenders.
  - id: 730fc21b-eaff-474b-ad23-90fd265d4988
    name: Psexec Execution
    reason: PsSuspend is often staged with PsExec; SYSTEM context is usually needed to suspend protected AV processes.
  - id: 18da1007-3f26-470f-875d-f77faf1cab31
    name: Ps.exe Renamed SysInternals Tool
    reason: Renamed Sysinternals tools indicate the same operator hiding tool use.
  - id: 2e65275c-8288-4ab4-aeb7-6274f58b6b20
    name: Procdump Execution
    reason: Defender is typically suspended just before LSASS dumping with Sysinternals procdump.
  - id: 5afee48e-67dd-4e03-a783-f74259dcf998
    name: Potential LSASS Process Dump Via Procdump
    reason: Credential theft is the common payoff once AV is frozen.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other tools touching security product processes
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Tt]askkill|[Pp]skill|[Ss]top-[Pp]rocess|[Mm]sMpEng|[Ss]ense[Ii][Rr]|[Cc]s[Ff]alcon|[Ss]ophos|[Ss]entinel).*/
    pivot_on:
    - host
    window: 2h
  - name: Defender disable or exclusion commands
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ss]et-[Mm]p[Pp]reference|[Aa]dd-[Mm]p[Pp]reference|[Dd]isable[Rr]ealtime|[Dd]isable[Aa]nti[Ss]pyware).*/
    pivot_on:
    - host
    window: 2h
  - name: Credential dump tooling after AV frozen
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ll]sass|[Pp]rocdump|[Cc]omsvcs|[Mm]ini[Dd]ump|[Ss]ekurlsa).*/
    pivot_on:
    - host
    window: 4h
  - name: Sysinternals tool execution
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*([Pp]s[Ee]xec|[Pp]s[Ss]uspend|[Pp]rocdump|[Pp]s[Kk]ill).*/
    pivot_on:
    - host
    window: 6h
  - name: Process access to LSASS
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*[Ll]sass\.exe/
    pivot_on:
    - host
    window: 2h
