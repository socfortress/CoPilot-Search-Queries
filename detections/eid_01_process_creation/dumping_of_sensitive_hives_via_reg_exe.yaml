name: Dumping of Sensitive Hives Via Reg.EXE
id: fd877b94-9bb5-4191-bb25-d79cbd93c167
version: 1
schema_version: "1.0"
date: "2023-12-13"
author: Teymur Kheirkhabarov, Endgame, JHasenbusch, Daniil Yugoslavskiy, oscd.community, frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: fd877b94-9bb5-4191-bb25-d79cbd93c167
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the usage of "reg.exe" in order to dump sensitive registry hives. This
  includes SAM, SYSTEM and SECURITY hives. MITRE ATT&CK: T1003.002, T1003.004,
  T1003.005.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\reg.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "reg.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* save *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* export *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* ˢave *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* eˣport *"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*hklm*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*hk˪m*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*hkey_local_machine*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*hkey_˪ocal_machine*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*hkey_loca˪_machine*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*hkey_˪oca˪_machine*"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\system*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\sam*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\security*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\ˢystem*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\syˢtem*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\ˢyˢtem*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\ˢam*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\ˢecurity*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches '*\reg.exe';
  data_win_eventdata_originalFileName equals 'reg.exe';
  data_win_eventdata_commandLine matches '* save *', among other conditions.

known_false_positives: >
  Dumping hives for legitimate purpouse i.e. backup or forensic investigation.
  Baseline expected activity in your environment and tune this detection before
  relying on it for automated response.

references:
  - https://www.slideshare.net/heirhabarov/hunting-for-credentials-dumping-in-windows-environment
  - https://eqllib.readthedocs.io/en/latest/analytics/aed95fc6-5e3f-49dc-8b35-06508613f979.html
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1003/T1003.md
  - https://www.wietzebeukema.nl/blog/windows-command-line-obfuscation
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1003.002/T1003.002.md#atomic-test-1---registry-dump-of-sam-creds-and-secrets
  - https://attack.mitre.org/techniques/T1003/002/
  - https://attack.mitre.org/techniques/T1003/004/
  - https://attack.mitre.org/techniques/T1003/005/

response:
  message: >
    Dumping of Sensitive Hives Via Reg.EXE detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1003.002, T1003.004, T1003.005
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.002
    - T1003.004
    - T1003.005
  custom_tags:
    - dumping
    - sensitive
    - hives
    - process_creation
    - sysmon
    - credential_access
    - car_2013_07_001
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Rr][Ee][Gg]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Rr][Ee][Gg]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.* [Ss][Aa][Vv][Ee] .*/ OR data_win_eventdata_commandLine:/.* [Ee][Xx][Pp][Oo][Rr][Tt] .*/ OR data_win_eventdata_commandLine:/.* ˢ[Aa][Vv][Ee] .*/ OR data_win_eventdata_commandLine:/.* [Ee]ˣ[Pp][Oo][Rr][Tt] .*/) AND (data_win_eventdata_commandLine:/.*[Hh][Kk][Ll][Mm].*/ OR data_win_eventdata_commandLine:/.*[Hh][Kk]˪[Mm].*/ OR data_win_eventdata_commandLine:/.*[Hh][Kk][Ee][Yy]_[Ll][Oo][Cc][Aa][Ll]_[Mm][Aa][Cc][Hh][Ii][Nn][Ee].*/ OR data_win_eventdata_commandLine:/.*[Hh][Kk][Ee][Yy]_˪[Oo][Cc][Aa][Ll]_[Mm][Aa][Cc][Hh][Ii][Nn][Ee].*/ OR data_win_eventdata_commandLine:/.*[Hh][Kk][Ee][Yy]_[Ll][Oo][Cc][Aa]˪_[Mm][Aa][Cc][Hh][Ii][Nn][Ee].*/ OR data_win_eventdata_commandLine:/.*[Hh][Kk][Ee][Yy]_˪[Oo][Cc][Aa]˪_[Mm][Aa][Cc][Hh][Ii][Nn][Ee].*/) AND (data_win_eventdata_commandLine:/.*\\[Ss][Yy][Ss][Tt][Ee][Mm].*/ OR data_win_eventdata_commandLine:/.*\\[Ss][Aa][Mm].*/ OR data_win_eventdata_commandLine:/.*\\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy].*/ OR data_win_eventdata_commandLine:/.*\\ˢ[Yy][Ss][Tt][Ee][Mm].*/ OR data_win_eventdata_commandLine:/.*\\[Ss][Yy]ˢ[Tt][Ee][Mm].*/ OR data_win_eventdata_commandLine:/.*\\ˢ[Yy]ˢ[Tt][Ee][Mm].*/ OR data_win_eventdata_commandLine:/.*\\ˢ[Aa][Mm].*/ OR data_win_eventdata_commandLine:/.*\\ˢ[Ee][Cc][Uu][Rr][Ii][Tt][Yy].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 4e87b8e2-2ee9-4b2a-a715-4727d297ece0
    name: Potential SAM Database Dump
    reason: The saved SAM/SYSTEM/SECURITY hive lands on disk as a file; this is the file-creation side of the same dump.
  - id: 6ea858a8-ba71-4a12-b2cc-5d83312404c7
    name: HackTool - Typical HiveNightmare SAM File Export
    reason: Alternative route to the same SAM/SYSTEM hive export (HiveNightmare/VSS read); shows the actor trying more than one method if reg save is blocked.
  - id: d372f928-ce4f-11eb-a762-acde48001122
    name: Esentutl SAM Copy
    reason: esentutl /y copy of the SAM is a common fallback when reg save is flagged.
  - id: 1af57a4b-460a-4738-9034-db68b880c665
    name: PowerShell SAM Copy
    reason: PowerShell-based SAM copy; a scripted alternative to reg save on the same host.
  - id: f57f8d16-1f39-4dcb-a604-6c73d9b54b3d
    name: Sensitive File Access Via Volume Shadow Copy Backup
    reason: Reading locked hives through a volume shadow copy is another way to obtain the same registry hives.
  - id: 6e2a900a-ced9-4e4a-a9c2-13e706f9518a
    name: HackTool - Potential Remote Credential Dumping Activity Via CrackMapExec Or Impacket-Secretsdump
    reason: Remote secretsdump/CrackMapExec writes the same hive files; indicates remote rather than local dumping.
  - id: ec570e53-4c76-45a9-804d-dc3f355ff7a7
    name: 7Zip Compressing Dump Files
    reason: Dumped hives and dumps are typically archived with 7-Zip before exfiltration.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Hive/SAM dump files created on this host
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Ss][Aa][Mm]\.([Ss][Aa][Vv][Ee]|[Ss][Aa][Vv]|[Hh][Ii][Vv]|[Bb][Aa][Kk]).*/ OR data_win_eventdata_targetFilename:/.*[Ss][Yy][Ss][Tt][Ee][Mm]\.([Ss][Aa][Vv][Ee]|[Ss][Aa][Vv]|[Hh][Ii][Vv]|[Bb][Aa][Kk]).*/ OR data_win_eventdata_targetFilename:/.*[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]\.([Ss][Aa][Vv][Ee]|[Ss][Aa][Vv]|[Hh][Ii][Vv]|[Bb][Aa][Kk]).*/)
    pivot_on:
    - host
    window: 2h
  - name: Hive copies via shadow copy, esentutl or ntdsutil on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ee][Ss][Ee][Nn][Tt][Uu][Tt][Ll].*/[Yy].*/ OR data_win_eventdata_commandLine:/.*[Hh][Aa][Rr][Dd][Dd][Ii][Ss][Kk][Vv][Oo][Ll][Uu][Mm][Ee][Ss][Hh][Aa][Dd][Oo][Ww][Cc][Oo][Pp][Yy].*/ OR data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].* [Cc][Rr][Ee][Aa][Tt][Ee] [Ss][Hh][Aa][Dd][Oo][Ww].*/ OR data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Kk][Ss][Hh][Aa][Dd][Oo][Ww].*/ OR data_win_eventdata_commandLine:/.*[Ss][Hh][Aa][Dd][Oo][Ww][Cc][Oo][Pp][Yy].*/)
    pivot_on:
    - host
    window: 2h
  - name: Archiving or staging of saved hives/dumps on this host
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\(7[Zz]\.[Ee][Xx][Ee]|7[Zz][Aa]\.[Ee][Xx][Ee]|[Rr][Aa][Rr]\.[Ee][Xx][Ee]|[Ww][Ii][Nn][Rr][Aa][Rr]\.[Ee][Xx][Ee]|[Tt][Aa][Rr]\.[Ee][Xx][Ee]|[Mm][Aa][Kk][Ee][Cc][Aa][Bb]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*\.([Ss][Aa][Vv][Ee]|[Hh][Ii][Vv]|[Ss][Aa][Vv]).*/ OR data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss].*/ OR data_win_eventdata_commandLine:/.*(\.[Mm][Dd][Mm][Pp]|\.[Dd][Mm][Pp]).*/)
    pivot_on:
    - host
    window: 4h
  - name: Transfer tooling touching hive/dump files on this host
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Rr][Oo][Bb][Oo][Cc][Oo][Pp][Yy]\.[Ee][Xx][Ee]|[Xx][Cc][Oo][Pp][Yy]\.[Ee][Xx][Ee]|[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]|[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]|[Ff][Tt][Pp]\.[Ee][Xx][Ee]|[Ss][Cc][Pp]\.[Ee][Xx][Ee]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]|[Cc][Mm][Dd]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*\.([Ss][Aa][Vv][Ee]|[Hh][Ii][Vv]|[Ss][Aa][Vv]).*/ OR data_win_eventdata_commandLine:/.*(\.[Mm][Dd][Mm][Pp]|\.[Dd][Mm][Pp]).*/)
    pivot_on:
    - host
    window: 4h
  - name: Network and RDP logons by this account after hive theft
    query: data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"9" OR data_win_eventdata_logonType:"10")
    pivot_on:
    - user
    window: 6h
