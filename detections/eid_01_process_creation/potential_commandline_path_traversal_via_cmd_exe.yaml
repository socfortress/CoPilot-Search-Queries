name: Potential CommandLine Path Traversal Via Cmd.EXE
id: 087790e3-3287-436c-bccf-cbd0184a7db1
version: 1
schema_version: "1.0"
date: "2023-03-06"
author: xknow @xknow_infosec, Tim Shelton
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 087790e3-3287-436c-bccf-cbd0184a7db1
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential path traversal attempt via cmd.exe. Could indicate possible
  command/argument confusion/hijacking. MITRE ATT&CK: T1059.003.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\cmd.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\cmd.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "cmd.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_parentCommandLine:
                    value: "*/c*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentCommandLine:
                    value: "*/k*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentCommandLine:
                    value: "*/r*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*/c*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*/k*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*/r*"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - term:
                  data_win_eventdata_parentCommandLine: "/../../"
              - wildcard:
                  data_win_eventdata_commandLine: "*/../../*"
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_commandLine"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Tasktop\\\\keycloak\\\\bin\\\\/../../jre\\\\bin\\\\java*"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_parentCommandLine
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\cmd.exe'; data_win_eventdata_image matches '*\cmd.exe';
  data_win_eventdata_originalFileName equals 'cmd.exe', among other conditions.

known_false_positives: >
  Java tools are known to produce false-positive when loading libraries.
  Baseline expected activity in your environment and tune this detection before
  relying on it for automated response.

references:
  - https://hackingiscool.pl/cmdhijack-command-argument-confusion-with-path-traversal-in-cmd-exe/
  - https://twitter.com/Oddvarmoe/status/1270633613449723905
  - https://attack.mitre.org/techniques/T1059/003/

response:
  message: >
    Potential CommandLine Path Traversal Via Cmd.EXE detected on host
    $agent_name$. Matched data_win_eventdata_parentImage:
    $data_win_eventdata_parentImage$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1059.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.003
  custom_tags:
    - traversal
    - process_creation
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Cc][Mm][Dd]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_parentCommandLine:/.*\/[Cc].*/ OR data_win_eventdata_parentCommandLine:/.*\/[Kk].*/ OR data_win_eventdata_parentCommandLine:/.*\/[Rr].*/ OR data_win_eventdata_commandLine:/.*\/[Cc].*/ OR data_win_eventdata_commandLine:/.*\/[Kk].*/ OR data_win_eventdata_commandLine:/.*\/[Rr].*/) AND (data_win_eventdata_parentCommandLine:"/../../" OR data_win_eventdata_commandLine:/.*\/\.\.\/\.\.\/.*/) AND _exists_:data_win_eventdata_commandLine AND NOT (data_win_eventdata_commandLine:/.*\\[Tt][Aa][Ss][Kk][Tt][Oo][Pp]\\[Kk][Ee][Yy][Cc][Ll][Oo][Aa][Kk]\\[Bb][Ii][Nn]\\\/\.\.\/\.\.\/[Jj][Rr][Ee]\\[Bb][Ii][Nn]\\[Jj][Aa][Vv][Aa].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 1327381e-6ab0-4f38-b583-4c1b8346a56b
    name: Potential Command Line Path Traversal Evasion Attempt
    reason: Same ../../ trick against other binaries; shows whether the traversal is a wider process-filter evasion pattern.
  - id: ee5e119b-1f75-4b34-add8-3be976961e39
    name: Conhost.exe CommandLine Path Traversal
    reason: Conhost-based traversal is the sibling technique to cmd traversal, used to hide the real executable from path-based detections.
  - id: a16980c2-0c56-4de0-9a79-17971979efdd
    name: Cmd.EXE Missing Space Characters Execution Anomaly
    reason: Another cmd.exe command-line confusion/obfuscation trick; co-occurrence indicates deliberate evasion.
  - id: f0cdd048-82dc-4f7a-8a7a-b87a52b6d0fd
    name: Potential Commandline Obfuscation Using Escape Characters
    reason: Obfuscated command lines often accompany traversal hijacking of cmd arguments.
  - id: 4b991083-3d0e-44ce-8fc4-b254025d8d4b
    name: Unusual Parent Process For Cmd.EXE
    reason: Shows whether the cmd.exe running the traversal was spawned by an unexpected parent (Office, script host, service).
  - id: e5144106-8198-4f6e-bfc2-0a551cc8dd94
    name: Potential Pikabot Infection - Suspicious Command Combinations Via Cmd.EXE
    reason: Malware loaders chain cmd /c commands; follow-on payload staging after the traversal.
  - id: cea72823-df4d-4567-950c-0b579eaf0846
    name: Potential Dropper Script Execution Via WScript/CScript/MSHTA
    reason: A script dropper commonly launches the cmd /c command carrying the traversal.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Command lines with traversal-style paths
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:*..\\..\\*
    pivot_on: host
    window: 1h
  - name: Cmd spawning download or LOLBin tools
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Cc][Mm][Dd]\.exe/ AND data_win_eventdata_image:(/.*[Pp]ower[Ss]hell.*/ OR /.*[Cc]url\.exe/ OR /.*[Cc]ertutil\.exe/ OR /.*[Bb]itsadmin\.exe/ OR /.*[Mm]shta\.exe/ OR /.*[Rr]egsvr32\.exe/ OR /.*[Rr]undll32\.exe/)
    pivot_on: host
    window: 2h
  - name: Executables dropped to user-writable paths
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(/.*\\[Tt]emp\\.*\.(exe|dll|bat|ps1|vbs|js)/ OR /.*\\[Pp]rogram[Dd]ata\\.*\.(exe|dll)/ OR /.*\\[Pp]ublic\\.*\.(exe|dll)/)
    pivot_on: host
    window: 2h
  - name: Script hosts and Office launching processes for the user
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:(/.*[Ww][Ii][Nn][Ww][Oo][Rr][Dd]\.exe/ OR /.*[Ee][Xx][Cc][Ee][Ll]\.exe/ OR /.*[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.exe/ OR /.*[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.exe/)
    pivot_on: user
    window: 4h
