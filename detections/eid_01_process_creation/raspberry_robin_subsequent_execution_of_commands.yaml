name: Raspberry Robin Subsequent Execution of Commands
id: d52d2e87-eb03-4fac-961d-eb616da79788
version: 1
schema_version: "1.0"
date: "2022-05-06"
author: "@kostastsale"
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: d52d2e87-eb03-4fac-961d-eb616da79788
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects raspberry robin subsequent execution of commands. MITRE ATT&CK:
  T1059.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_parentImage:
              value: "*\\\\fodhelper.exe"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\rundll32.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\regsvr32.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*odbcconf.exe*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*regsvr*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*shellexec_rundll*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*installdriver*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*setfiledsndir*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*vkipdse*"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-a"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*/a"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*–a"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*—a"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*―a"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-f"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*/f"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*–f"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*—f"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*―f"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-s"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*/s"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*–s"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*—s"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*―s"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\fodhelper.exe'; data_win_eventdata_image matches '*\rundll32.exe';
  data_win_eventdata_image matches '*\regsvr32.exe', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://redcanary.com/blog/raspberry-robin/
  - https://attack.mitre.org/techniques/T1059/001/

response:
  message: >
    Raspberry Robin Subsequent Execution of Commands detected on host
    $agent_name$. Matched data_win_eventdata_parentImage:
    $data_win_eventdata_parentImage$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1059.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
  custom_tags:
    - raspberry
    - robin
    - subsequent
    - process_creation
    - sysmon
    - execution
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ff][Oo][Dd][Hh][Ee][Ll][Pp][Ee][Rr]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Oo][Dd][Bb][Cc][Cc][Oo][Nn][Ff]\.[Ee][Xx][Ee].*/ AND data_win_eventdata_commandLine:/.*[Rr][Ee][Gg][Ss][Vv][Rr].*/ AND data_win_eventdata_commandLine:/.*[Ss][Hh][Ee][Ll][Ll][Ee][Xx][Ee][Cc]_[Rr][Uu][Nn][Dd][Ll][Ll].*/ AND (data_win_eventdata_commandLine:/.*[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Dd][Rr][Ii][Vv][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Tt][Ff][Ii][Ll][Ee][Dd][Ss][Nn][Dd][Ii][Rr].*/ OR data_win_eventdata_commandLine:/.*[Vv][Kk][Ii][Pp][Dd][Ss][Ee].*/) AND (data_win_eventdata_commandLine:/.*-[Aa]/ OR data_win_eventdata_commandLine:/.*\/[Aa]/ OR data_win_eventdata_commandLine:/.*–[Aa]/ OR data_win_eventdata_commandLine:/.*—[Aa]/ OR data_win_eventdata_commandLine:/.*―[Aa]/ OR data_win_eventdata_commandLine:/.*-[Ff]/ OR data_win_eventdata_commandLine:/.*\/[Ff]/ OR data_win_eventdata_commandLine:/.*–[Ff]/ OR data_win_eventdata_commandLine:/.*—[Ff]/ OR data_win_eventdata_commandLine:/.*―[Ff]/ OR data_win_eventdata_commandLine:/.*-[Ss]/ OR data_win_eventdata_commandLine:/.*\/[Ss]/ OR data_win_eventdata_commandLine:/.*–[Ss]/ OR data_win_eventdata_commandLine:/.*—[Ss]/ OR data_win_eventdata_commandLine:/.*―[Ss]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 2c6bea3a-ef58-4f2e-a775-4928f6b7c58a
    name: Raspberry Robin Initial Execution From External Drive
    reason: The USB-launched cmd /r execution that precedes this fodhelper stage.
  - id: 7f741dcf-fc22-4759-87b4-9ae8376676a2
    name: Bypass UAC via Fodhelper.exe
    reason: Fodhelper is the elevation vehicle whose child fired this rule.
  - id: 909f8fd8-7ac8-11eb-a1f3-acde48001122
    name: FodHelper UAC Bypass
    reason: Registry hijack that makes fodhelper spawn the payload.
  - id: 9f0a8bf3-a65b-440a-8c1e-5cb1547c8e70
    name: New DLL Registered Via Odbcconf.EXE
    reason: odbcconf registers the Raspberry Robin DLL named in this command.
  - id: ba4cfc11-d0fa-4d94-bf20-7c332c412e76
    name: Potentially Suspicious DLL Registered Via Odbcconf.EXE
    reason: Same odbcconf payload loading from a suspicious location.
  - id: 6b65c28e-11f3-46cb-902a-68f2cafaf474
    name: Odbcconf.EXE Suspicious DLL Location
    reason: odbcconf loading a DLL from user-writable paths corroborates staging.
  - id: a35c97c8-d9c4-4c89-a3e7-533dc0bcb73a
    name: Potential Raspberry Robin Dot Ending File
    reason: Other Raspberry Robin artefact confirming the family on the host.
  - id: 92020b88-9caf-464f-bad8-cd0fb0aa2a81
    name: Potential Raspberry Robin CPL Execution Activity
    reason: Related Raspberry Robin execution technique via CPL files.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: ms-settings shell open command registry hijack
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*[Mm]s-[Ss]ettings.*[Cc]ommand.*/
    pivot_on: host
    window: 2h
  - name: All children of fodhelper
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*\\[Ff]odhelper\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: odbcconf / regsvr32 DLL registration
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*\\[Oo]dbcconf\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr]egsvr32\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*\.[Dd][Ll][Ll].*/
    pivot_on: host
    window: 2h
  - name: Outbound connections from rundll32 / regsvr32 / odbcconf (C2)
    query: data_win_system_eventID:3 AND (data_win_eventdata_image:/.*\\[Rr]undll32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr]egsvr32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Oo]dbcconf\.[Ee][Xx][Ee]/)
    pivot_on: host
    window: 2h
  - name: Run-key persistence or Defender exclusions after elevation
    query: data_win_system_eventID:13 AND (data_win_eventdata_targetObject:/.*[Cc]urrent[Vv]ersion\\[Rr]un.*/ OR data_win_eventdata_targetObject:/.*[Dd]efender\\[Ee]xclusions.*/)
    pivot_on: host
    window: 4h
