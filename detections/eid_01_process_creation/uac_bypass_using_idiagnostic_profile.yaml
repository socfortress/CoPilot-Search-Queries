name: UAC Bypass Using IDiagnostic Profile
id: 4cbef972-f347-4170-b62a-8253f6168e6d
version: 1
schema_version: "1.0"
date: "2024-12-01"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 4cbef972-f347-4170-b62a-8253f6168e6d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the "IDiagnosticProfileUAC" UAC bypass technique. MITRE ATT&CK:
  T1548.002.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_parentImage:
              value: "*\\\\DllHost.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_parentCommandLine:
              value: "* /Processid:{12C21EA7-2EB8-4B55-9249-AC243DA8C666}*"
              case_insensitive: true
        - bool:
            should:
              - term:
                  data_win_eventdata_integrityLevel:
                    value: "High"
                    case_insensitive: true
              - term:
                  data_win_eventdata_integrityLevel:
                    value: "System"
                    case_insensitive: true
              - term:
                  data_win_eventdata_integrityLevel:
                    value: "S-1-16-16384"
                    case_insensitive: true
              - term:
                  data_win_eventdata_integrityLevel:
                    value: "S-1-16-12288"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_parentCommandLine
    - data_win_eventdata_integrityLevel
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\DllHost.exe'; data_win_eventdata_parentCommandLine matches '*
  /Processid:{12C21EA7-2EB8-4B55-9249-AC243DA8C666}*';
  data_win_eventdata_integrityLevel equals 'High', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/Wh04m1001/IDiagnosticProfileUAC
  - https://attack.mitre.org/techniques/T1548/002/

response:
  message: >
    UAC Bypass Using IDiagnostic Profile detected on host $agent_name$. Matched
    data_win_eventdata_parentImage: $data_win_eventdata_parentImage$. Matched
    data_win_eventdata_parentCommandLine:
    $data_win_eventdata_parentCommandLine$. MITRE ATT&CK: T1548.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_parentCommandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1548.002
  custom_tags:
    - bypass
    - idiagnostic
    - profile
    - process_creation
    - sysmon
    - execution
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Dd][Ll][Ll][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ AND data_win_eventdata_parentCommandLine:/.* \/[Pp][Rr][Oo][Cc][Ee][Ss][Ss][Ii][Dd]:\{12[Cc]21[Ee][Aa]7-2[Ee][Bb]8-4[Bb]55-9249-[Aa][Cc]243[Dd][Aa]8[Cc]666\}.*/ AND (data_win_eventdata_integrityLevel:/[Hh][Ii][Gg][Hh]/ OR data_win_eventdata_integrityLevel:/[Ss][Yy][Ss][Tt][Ee][Mm]/ OR data_win_eventdata_integrityLevel:/[Ss]-1-16-16384/ OR data_win_eventdata_integrityLevel:/[Ss]-1-16-12288/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 48ea844d-19b1-4642-944e-fe39c2cc1fec
    name: UAC Bypass Using IDiagnostic Profile - File
    reason: File-drop half of the same IDiagnosticProfileUAC technique (DLL planted before DllHost loads it).
  - id: d38d2fa4-98e6-4a24-aff1-410b0c9ad177
    name: HackTool - UACMe Akagi Execution
    reason: UACMe/Akagi implements this method.
  - id: 49f2f17b-b4c8-4172-a68b-d5bf95d05130
    name: UAC Bypass via ICMLuaUtil
    reason: Another auto-elevated COM bypass often tried alongside.
  - id: 4b60e6f2-bf39-47b4-b4ea-398e33cfe253
    name: CMSTP UAC Bypass via COM Object Access
    reason: CMSTP COM-object bypass is a sibling elevation tried by the same tooling.
  - id: 178e615d-e666-498b-9630-9ed363038101
    name: Elevated System Shell Spawned From Uncommon Parent Location
    reason: Elevated shell after bypass.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: DllHost with the diagnostic CLSID
    query: data_win_system_eventID:1 AND data_win_eventdata_parentCommandLine:/.*12C21EA7-2EB8-4B55-9249-AC243DA8C666.*/
    pivot_on: host
    window: 2h
  - name: DLL written to System32 by user process
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(/.*\\(system32|syswow64)\\.*\.dll/) AND NOT data_win_eventdata_image:(/.*\\(TrustedInstaller|svchost|msiexec)\.exe/)
    pivot_on: host
    window: 2h
  - name: High-integrity children of DllHost
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Dd]ll[Hh]ost\.exe/ AND data_win_eventdata_integrityLevel:(High OR System)
    pivot_on: host
    window: 2h
  - name: Post-elevation discovery
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*whoami.*\/(priv|groups).*/ OR /.*net\s+(user|localgroup).*/)
    pivot_on: host
    window: 4h
