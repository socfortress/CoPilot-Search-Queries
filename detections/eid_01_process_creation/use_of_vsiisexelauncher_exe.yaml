name: Use of VSIISExeLauncher.exe
id: 18749301-f1c5-4efc-a4c3-276ff1f5b6f8
version: 1
schema_version: "1.0"
date: "2022-06-09"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 18749301-f1c5-4efc-a4c3-276ff1f5b6f8
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  The "VSIISExeLauncher.exe" binary part of the Visual Studio/VS Code can be
  used to execute arbitrary binaries. MITRE ATT&CK: T1127.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\VSIISExeLauncher.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "VSIISExeLauncher.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -p *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -a *"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\VSIISExeLauncher.exe'; data_win_eventdata_originalFileName equals
  'VSIISExeLauncher.exe'; data_win_eventdata_commandLine matches '* -p *', among
  other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://lolbas-project.github.io/lolbas/OtherMSBinaries/VSIISExeLauncher/
  - https://attack.mitre.org/techniques/T1127/

response:
  message: >
    Use of VSIISExeLauncher.exe detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1127
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1127
  custom_tags:
    - vsiisexelauncher
    - process_creation
    - sysmon
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Vv][Ss][Ii][Ii][Ss][Ee][Xx][Ee][Ll][Aa][Uu][Nn][Cc][Hh][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Vv][Ss][Ii][Ii][Ss][Ee][Xx][Ee][Ll][Aa][Uu][Nn][Cc][Hh][Ee][Rr]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.* -[Pp] .*/ OR data_win_eventdata_commandLine:/.* -[Aa] .*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: cc268ac1-42d9-40fd-9ed3-8c4e1a5b87e6
    name: Devtoolslauncher.exe Executes Specified Binary
    reason: Visual Studio-shipped launcher with the same arbitrary-binary proxy execution; interchangeable for operators.
  - id: 15c7904e-6ad1-4a45-9b46-5fb25df37fd2
    name: Malicious PE Execution by Microsoft Visual Studio Debugger
    reason: Visual Studio component proxy-executing a PE; same trust abuse.
  - id: 45d3a03d-f441-458c-8883-df101a3bb146
    name: Launch-VsDevShell.PS1 Proxy Execution
    reason: VS script launcher that runs arbitrary commands from a signed script.
  - id: b5c7395f-e501-4a08-94d4-57fe7a9da9d2
    name: Potential Binary Proxy Execution Via Cdb.EXE
    reason: Debugger-based proxy execution alternative on the same host.
  - id: 646bc99f-6682-4b47-a73a-17b1b64c9d34
    name: Execute Files with Msdeploy.exe
    reason: IIS web-deploy tool offering another signed execution path next to the VSIIS launcher.
  - id: 40b95d31-1afc-469e-8d34-9a3a667d058e
    name: Suspicious Csi.exe Usage
    reason: Dev-tool C# script runner abused after the launcher is blocked.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Children of VSIISExeLauncher
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*VSIISExeLauncher\.exe/
    pivot_on: host
    window: 2h
  - name: VSIISExeLauncher pointed at binaries in user-writable paths
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*VSIISExeLauncher\.exe/ AND data_win_eventdata_commandLine:/.*\\(AppData|Temp|ProgramData|Users\\Public)\\.*/
    pivot_on: host
    window: 2h
  - name: Shells and LOLBins spawned under VSIIS launcher
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*\\(cmd|powershell|pwsh|rundll32|regsvr32|mshta|wscript|cscript)\.exe/ AND data_win_eventdata_parentCommandLine:/.*[Vv][Ss][Ii][Ii][Ss].*/
    pivot_on: host
    window: 2h
  - name: Executables written to user-writable paths
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\\(AppData|Temp|ProgramData|Users\\Public)\\.*\.(exe|dll|bat|ps1)/
    pivot_on: host
    window: 4h
  - name: Outbound connections from processes in user-writable paths
    query: data_win_system_eventID:3 AND data_win_eventdata_initiated:true AND data_win_eventdata_image:/.*\\(AppData|Temp|ProgramData|Users\\Public)\\.*/
    pivot_on: host
    window: 2h
