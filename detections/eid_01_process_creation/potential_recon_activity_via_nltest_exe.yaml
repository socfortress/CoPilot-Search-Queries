name: Potential Recon Activity Via Nltest.EXE
id: 5cc90652-4cbd-4241-aa3b-4b462fa5a248
version: 1
schema_version: "1.0"
date: "2023-12-15"
author: Craig Young, oscd.community, Georg Lauenstein
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 5cc90652-4cbd-4241-aa3b-4b462fa5a248
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects nltest commands that can be used for information discovery. MITRE
  ATT&CK: T1016, T1482.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\nltest.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "nltestrk.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*server*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*query*"
                          case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*/user*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*all_trusts*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*dclist:*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*dnsgetdc:*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*domain_trusts*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*dsgetdc:*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*parentdomain*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*trusted_domains*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\nltest.exe'; data_win_eventdata_originalFileName equals 'nltestrk.exe';
  data_win_eventdata_commandLine matches '*server*', among other conditions.

known_false_positives: >
  Legitimate administration use but user and host must be investigated. Baseline
  expected activity in your environment and tune this detection before relying
  on it for automated response.

references:
  - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2012-r2-and-2012/cc731935(v=ws.11)
  - https://thedfirreport.com/2021/08/16/trickbot-leads-up-to-fake-1password-installation/
  - https://thedfirreport.com/2020/10/18/ryuk-in-5-hours/
  - https://book.hacktricks.xyz/windows/basic-cmd-for-pentesters
  - https://research.nccgroup.com/2022/08/19/back-in-black-unlocking-a-lockbit-3-0-ransomware-attack/
  - https://eqllib.readthedocs.io/en/latest/analytics/03e231a6-74bc-467a-acb1-e5676b0fb55e.html
  - https://redcanary.com/blog/how-one-hospital-thwarted-a-ryuk-ransomware-outbreak/
  - https://github.com/redcanaryco/atomic-red-team/blob/5360c9d9ffa3b25f6495f7a16e267b719eba2c37/atomics/T1482/T1482.md#atomic-test-2---windows---discover-domain-trusts-with-nltest
  - https://attack.mitre.org/techniques/T1016/
  - https://attack.mitre.org/techniques/T1482/

response:
  message: >
    Potential Recon Activity Via Nltest.EXE detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1016, T1482
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1016
    - T1482
  custom_tags:
    - recon
    - nltest
    - process_creation
    - sysmon
    - discovery
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Nn][Ll][Tt][Ee][Ss][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Nn][Ll][Tt][Ee][Ss][Tt][Rr][Kk]\.[Ee][Xx][Ee]/) AND ((data_win_eventdata_commandLine:/.*[Ss][Ee][Rr][Vv][Ee][Rr].*/ AND data_win_eventdata_commandLine:/.*[Qq][Uu][Ee][Rr][Yy].*/) OR data_win_eventdata_commandLine:/.*\/[Uu][Ss][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Aa][Ll][Ll]_[Tt][Rr][Uu][Ss][Tt][Ss].*/ OR data_win_eventdata_commandLine:/.*[Dd][Cc][Ll][Ii][Ss][Tt]:.*/ OR data_win_eventdata_commandLine:/.*[Dd][Nn][Ss][Gg][Ee][Tt][Dd][Cc]:.*/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Mm][Aa][Ii][Nn]_[Tt][Rr][Uu][Ss][Tt][Ss].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ss][Gg][Ee][Tt][Dd][Cc]:.*/ OR data_win_eventdata_commandLine:/.*[Pp][Aa][Rr][Ee][Nn][Tt][Dd][Oo][Mm][Aa][Ii][Nn].*/ OR data_win_eventdata_commandLine:/.*[Tt][Rr][Uu][Ss][Tt][Ee][Dd]_[Dd][Oo][Mm][Aa][Ii][Nn][Ss].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 41243735-89a7-4c83-bcdd-570aa78f00a1
    name: Domain Controller Discovery with Nltest
    reason: Sibling nltest dsgetdc/dclist domain-controller discovery; confirms the DC enumeration phase of the same recon burst
  - id: c3e05466-5f22-11eb-ae93-0242ac130002
    name: NLTest Domain Trust Discovery
    reason: nltest domain_trusts/all_trusts is the trust-mapping step operators (Ryuk, TrickBot, LockBit) run right after DC discovery
  - id: b1a8ce04-04c2-11ec-bea7-acde48001122
    name: Domain Account Discovery with Dsquery
    reason: Dsquery user enumeration is the usual companion to nltest when mapping domain accounts
  - id: 3bad990e-4848-4a78-9530-b427d854aac0
    name: Domain Trust Discovery Via Dsquery
    reason: Dsquery trust discovery repeats nltest trust mapping through an alternate tool
  - id: 514e7e3e-b3b4-4a67-af60-be20f139198b
    name: PUA - AdFind.EXE Execution
    reason: AdFind is the next-step AD dump tool seen alongside nltest in Ryuk/TrickBot intrusions
  - id: 455b9d50-15a1-4b99-853f-8d37655a4c1b
    name: PUA - Suspicious ActiveDirectory Enumeration Via AdFind.EXE
    reason: AdFind with enumeration switches shows recon escalating from trust discovery to full AD harvesting
  - id: bd8b828d-0dca-48e1-8a63-8a58ecf2644f
    name: Group Membership Reconnaissance Via Whoami.EXE
    reason: whoami /groups on the same host shows the operator checking privileges before domain recon
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: AD enumeration tools (dsquery, AdFind) on this host
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\[Dd][Ss][Qq][Uu][Ee][Rr][Yy]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Aa][Dd][Ff][Ii][Nn][Dd]\.[Ee][Xx][Ee]/) OR data_win_eventdata_originalFileName:/[Aa][Dd][Ff][Ii][Nn][Dd]\.[Ee][Xx][Ee]/)
    pivot_on: host
    window: 2h
  - name: net.exe domain group/user/computer enumeration
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Nn][Ee][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Nn][Ee][Tt]1\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*/[Dd][Oo][Mm][Aa][Ii][Nn].*/) AND (data_win_eventdata_commandLine:/.*[Gg][Rr][Oo][Uu][Pp].*/ OR data_win_eventdata_commandLine:/.*[Uu][Ss][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Aa][Cc][Cc][Oo][Uu][Nn][Tt][Ss].*/ OR data_win_eventdata_commandLine:/.*[Vv][Ii][Ee][Ww].*/)
    pivot_on: host
    window: 2h
  - name: Privilege and group discovery via whoami
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ww][Hh][Oo][Aa][Mm][Ii]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*/[Gg][Rr][Oo][Uu][Pp][Ss].*/ OR data_win_eventdata_commandLine:/.*/[Pp][Rr][Ii][Vv].*/ OR data_win_eventdata_commandLine:/.*/[Aa][Ll][Ll].*/)
    pivot_on: host
    window: 2h
  - name: Lateral movement tooling after domain recon
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\[Pp][Ss][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Aa][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Rr][Ss]\.[Ee][Xx][Ee]/) OR ((data_win_eventdata_image:/.*\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*/[Nn][Oo][Dd][Ee].*/)))
    pivot_on: host
    window: 4h
  - name: LSASS access following domain reconnaissance
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 4h
