name: Windows Default RDP File Unhidden
id: windows-default-rdp-file-unhidden-001
version: 1
schema_version: "1.0"
date: "2026-02-23"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  Detects attrib.exe removing hidden (-h) or system (-s) attributes from 
  Default.rdp file. This file stores RDP session configuration and is hidden 
  by default. Unhiding it may indicate reconnaissance of RDP connection history, 
  credential reuse preparation, or anti-forensic manipulation by an attacker.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - wildcard:
            data_win_eventdata_image: "*\\\\attrib.exe"
        - wildcard:
            data_win_eventdata_commandLine: "*default.rdp*"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine: "*-s*"
              - wildcard:
                  data_win_eventdata_commandLine: "*-h*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-23 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-23 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Windows endpoints with Sysmon 
  installed and configured to log process creation events (EventID 1) with full 
  command-line arguments.

known_false_positives: >
  Unknown. Unhiding Default.rdp is uncommon in normal user behavior.

references:
  - https://attack.mitre.org/techniques/T1021/001/
  - https://medium.com/@bonguides25/how-to-clear-rdp-connections-history-in-windows-cf0ffb67f344

response:
  message: >
    Default.rdp file unhidden on $agent_name$. 
    Command: $data_win_eventdata_commandLine$. 
    Parent: $data_win_eventdata_parentImage$. 
    User: $data_win_eventdata_user$. 
    Possible RDP reconnaissance or anti-forensics. MITRE ATT&CK: T1021.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects: []

tags:
  analytic_story:
    - Windows RDP Artifacts and Defense Evasion
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1021.001
  custom_tags:
    - rdp
    - attrib
    - anti_forensics
    - reconnaissance
    - default_rdp
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*attrib\.exe/ AND data_win_eventdata_commandLine:/.*default\.rdp.*/ AND (data_win_eventdata_commandLine:/.*-s.*/ OR data_win_eventdata_commandLine:/.*-h.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 6e22722b-dfb1-4508-a911-49ac840b40f8
    name: Suspicious Mstsc.EXE Execution With Local RDP File
    reason: 'Follow-on: mstsc launched with a local .rdp file after reading its history.'
  - id: 954f0af7-62dd-418f-b3df-a84bc2c7a774
    name: New Remote Desktop Connection Initiated Via Mstsc.EXE
    reason: New RDP connection initiated through mstsc, probably lateral movement to a recorded host.
  - id: ff3b6b39-e765-42f9-bb2c-ea6761e0e0f6
    name: Mstsc.EXE Execution From Uncommon Parent
    reason: mstsc spawned by an unusual parent indicates attacker-driven RDP.
  - id: ed74fe75-7594-4b4b-ae38-e38e3fd2eb23
    name: Outbound RDP Connections Over Non-Standard Tools
    reason: Outbound RDP from non-standard tools often follows RDP history reconnaissance.
  - id: 0d5675be-bc88-4172-86d3-1e96a4476536
    name: Potential Tampering With RDP Related Registry Keys Via Reg.EXE
    reason: RDP registry changes accompany RDP-centric lateral movement preparation.
  - id: 4281cb20-2994-4580-aa63-c8b86d019934
    name: Hiding Files with Attrib.exe
    reason: Same attrib.exe attribute manipulation used to hide or unhide files.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: mstsc executions
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Mm][Ss][Tt][Ss][Cc].exe/
    pivot_on: host
    window: 6h
  - name: Outbound RDP connections
    query: data_win_system_eventID:3 AND data_win_eventdata_destinationPort:3389
    pivot_on: host
    window: 6h
  - name: RDP credential and history access
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*Terminal Server Client.*/ OR /.*[Cc]mdkey.*/)
    pivot_on: host
    window: 6h
  - name: Credential theft attempts
    query: data_win_system_eventID:10 AND data_win_eventdata_targetImage:/.*[Ll]sass.exe/
    pivot_on: host
    window: 4h
  - name: Other attrib file hiding or unhiding
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*attrib.exe/
    pivot_on: host
    window: 4h
