name: Disable Windows Defender AV Security Monitoring
id: a7ee1722-c3c5-aeff-3212-c777e4733217
version: 1
schema_version: "1.0"
date: "2022-11-18"
author: ok @securonix invrep-de, oscd.community, frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: a7ee1722-c3c5-aeff-3212-c777e4733217
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects attackers attempting to disable Windows Defender using Powershell.
  MITRE ATT&CK: T1685.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\powershell.exe"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\pwsh.exe"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_originalFileName:
                                value: "PowerShell.EXE"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_originalFileName:
                                value: "pwsh.dll"
                                case_insensitive: true
                        minimum_should_match: 1
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*-DisableBehaviorMonitoring $true*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*-DisableRuntimeMonitoring $true*"
                                case_insensitive: true
                        minimum_should_match: 1
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\sc.exe"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_originalFileName:
                                value: "sc.exe"
                                case_insensitive: true
                        minimum_should_match: 1
                    - bool:
                        should:
                          - bool:
                              must:
                                - wildcard:
                                    data_win_eventdata_commandLine:
                                      value: "*stop*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_commandLine:
                                      value: "*WinDefend*"
                                      case_insensitive: true
                          - bool:
                              must:
                                - wildcard:
                                    data_win_eventdata_commandLine:
                                      value: "*delete*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_commandLine:
                                      value: "*WinDefend*"
                                      case_insensitive: true
                          - bool:
                              must:
                                - wildcard:
                                    data_win_eventdata_commandLine:
                                      value: "*config*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_commandLine:
                                      value: "*WinDefend*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_commandLine:
                                      value: "*start=disabled*"
                                      case_insensitive: true
                        minimum_should_match: 1
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\powershell.exe'; data_win_eventdata_image matches '*\pwsh.exe';
  data_win_eventdata_originalFileName equals 'PowerShell.EXE', among other
  conditions.

known_false_positives: >
  Minimal, for some older versions of dev tools, such as pycharm, developers
  were known to sometimes disable Windows Defender to improve performance, but
  this generally is not considered a good security practice. Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://research.nccgroup.com/2020/06/23/wastedlocker-a-new-ransomware-variant-developed-by-the-evil-corp-group/
  - https://rvsec0n.wordpress.com/2020/01/24/malwares-that-bypass-windows-defender/
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1562.001/T1562.001.md
  - https://attack.mitre.org/techniques/T1685/

response:
  message: >
    Disable Windows Defender AV Security Monitoring detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1685
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685
  custom_tags:
    - disable
    - defender
    - security
    - process_creation
    - sysmon
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (((data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Pp][Ww][Ss][Hh]\.[Dd][Ll][Ll]/) AND (data_win_eventdata_commandLine:/.*-[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Bb][Ee][Hh][Aa][Vv][Ii][Oo][Rr][Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg] \$[Tt][Rr][Uu][Ee].*/ OR data_win_eventdata_commandLine:/.*-[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Uu][Nn][Tt][Ii][Mm][Ee][Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg] \$[Tt][Rr][Uu][Ee].*/)) OR ((data_win_eventdata_image:/.*\\[Ss][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ss][Cc]\.[Ee][Xx][Ee]/) AND ((data_win_eventdata_commandLine:/.*[Ss][Tt][Oo][Pp].*/ AND data_win_eventdata_commandLine:/.*[Ww][Ii][Nn][Dd][Ee][Ff][Ee][Nn][Dd].*/) OR (data_win_eventdata_commandLine:/.*[Dd][Ee][Ll][Ee][Tt][Ee].*/ AND data_win_eventdata_commandLine:/.*[Ww][Ii][Nn][Dd][Ee][Ff][Ee][Nn][Dd].*/) OR (data_win_eventdata_commandLine:/.*[Cc][Oo][Nn][Ff][Ii][Gg].*/ AND data_win_eventdata_commandLine:/.*[Ww][Ii][Nn][Dd][Ee][Ff][Ee][Nn][Dd].*/ AND data_win_eventdata_commandLine:/.*[Ss][Tt][Aa][Rr][Tt]=[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Dd].*/))))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 17769c90-230e-488b-a463-e05c08e9d48f
    name: Powershell Defender Exclusion
    reason: Defender exclusions are the quieter alternative the same operator may add.
  - id: 07e3cb2c-0608-410d-be4b-1511cb1a0448
    name: Tamper Windows Defender Remove-MpPreference
    reason: Remove-MpPreference tampering is a sibling Defender impairment command.
  - id: 452bce90-6fb0-43cc-97a5-affc283139b3
    name: Suspicious Windows Defender Registry Key Tampering Via Reg.EXE
    reason: Registry-based Defender tampering via reg.exe is another route to the same goal.
  - id: 93d298a1-d28f-47f1-a468-d971e7796679
    name: Disable Tamper Protection on Windows Defender
    reason: Tamper Protection disabled enables later Defender changes to stick.
  - id: b28e58e4-2a72-4fae-bdee-0fbe904db642
    name: Windows Defender Real-time Protection Disabled
    reason: Defender operational log confirms real-time protection actually went off.
  - id: 801bd44f-ceed-4eb6-887c-11544633c0aa
    name: Windows Defender Configuration Changes
    reason: Defender operational config-change events corroborate the command took effect.
  - id: 57c4bf16-227f-4394-8ec7-1b745ee061c3
    name: Firewall Disabled via Netsh.EXE
    reason: Firewall disabling frequently accompanies Defender disabling.
  - id: 9ac94dc8-9042-493c-ba45-3b5e7c86b980
    name: Disable Important Scheduled Task
    reason: Defender maintenance tasks are often disabled alongside.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Defender preference changes
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss]et-[Mm]p[Pp]reference.*/ OR data_win_eventdata_commandLine:/.*[Aa]dd-[Mm]p[Pp]reference.*/ OR data_win_eventdata_commandLine:/.*[Rr]emove-[Mm]p[Pp]reference.*/)
    pivot_on: host
    window: 6h
  - name: Defender registry value writes
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Ww]indows [Dd]efender.*/
    pivot_on: host
    window: 6h
  - name: Defender operational disable events
    query: data_win_system_eventID:(5001 OR 5004 OR 5007 OR 5010 OR 5012)
    pivot_on: host
    window: 6h
  - name: Service stop/disable of security products
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss]c.* (stop|config|delete) .*([Ww]in[Dd]efend|[Ss]ense|[Ss]ysmon).*/ OR data_win_eventdata_commandLine:/.*[Nn]et.* stop .*([Ww]in[Dd]efend|[Ss]ense).*/)
    pivot_on: host
    window: 6h
  - name: Download/encoded execution after protection off
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Pp]ower[Ss]hell|[Cc]md|[Mm]shta|[Rr]egsvr32|[Rr]undll32)\.exe/ AND data_win_eventdata_commandLine:/.*([Hh]ttp|[Ee]ncodedcommand|-[Ee]nc |[Dd]ownload).*/
    pivot_on: host
    window: 2h
