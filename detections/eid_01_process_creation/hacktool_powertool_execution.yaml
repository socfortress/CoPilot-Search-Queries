name: HackTool - PowerTool Execution
id: a34f79a3-8e5f-4cc3-b765-de00695452c2
version: 1
schema_version: "1.0"
date: "2023-02-04"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: a34f79a3-8e5f-4cc3-b765-de00695452c2
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of the tool PowerTool which has the ability to kill a
  process, delete its process file, unload drivers, and delete the driver files.
  MITRE ATT&CK: T1685.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\PowerTool.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\PowerTool64.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "PowerTool.exe"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\PowerTool.exe'; data_win_eventdata_image matches '*\PowerTool64.exe';
  data_win_eventdata_originalFileName equals 'PowerTool.exe'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://thedfirreport.com/2022/11/28/emotet-strikes-again-lnk-file-leads-to-domain-wide-ransomware/
  - https://www.trendmicro.com/en_us/research/22/i/play-ransomware-s-attack-playbook-unmasks-it-as-another-hive-aff.html
  - https://twitter.com/gbti_sa/status/1249653895900602375?lang=en
  - https://www.softpedia.com/get/Antivirus/Removal-Tools/ithurricane-PowerTool.shtml
  - https://attack.mitre.org/techniques/T1685/

response:
  message: >
    HackTool - PowerTool Execution detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1685
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685
  custom_tags:
    - hacktool
    - powertool
    - process_creation
    - sysmon
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Tt][Oo][Oo][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Tt][Oo][Oo][Ll]64\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Pp][Oo][Ww][Ee][Rr][Tt][Oo][Oo][Ll]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: fca949cc-79ca-446e-8064-01aa7e52ece5
    name: HackTool - PCHunter Execution
    reason: Same class of kernel-level process killer/driver unloader; often used interchangeably.
  - id: 9082ff1f-88ab-4678-a3cc-5bcff99fc74d
    name: HackTool - GMER Rootkit Detector and Remover Execution
    reason: Peer anti-rootkit tool used to kill protected processes.
  - id: e76ca062-4de0-4d79-8d90-160a0d335eca
    name: PUA - Kernel Driver Utility (KDU) Execution
    reason: Driver-based defense evasion tooling used alongside or as an alternative.
  - id: 431a1fdb-4799-4f3b-91c3-a683b003fc49
    name: New Kernel Driver Via SC.EXE
    reason: PowerTool loads its own driver; manual driver services show the same behaviour.
  - id: 4931188c-178e-4ee7-a348-39e8a7a56821
    name: Filter Driver Unloaded Via Fltmc.EXE
    reason: 'Driver unload capability: Sysmon/EDR minifilters being removed.'
  - id: a7ee1722-c3c5-aeff-3212-c777e4733217
    name: Disable Windows Defender AV Security Monitoring
    reason: Security product disabling is the typical purpose of PowerTool.
  - id: c598cc0c-9e70-4852-b9eb-8921af79f598
    name: Hacktool - EDR-Freeze Execution
    reason: Related EDR suppression tooling.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Driver loads on host
    query: data_win_system_eventID:6
    pivot_on: host
    window: 4h
  - name: Security services stopped or deleted
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*sc(\.exe)?\s+(stop|delete).*/ OR /.*[Nn]et\s+stop.*/ OR /.*[Tt]askkill.*/)
    pivot_on: host
    window: 2h
  - name: Driver or security binaries deleted
    query: data_win_system_eventID:23 AND data_win_eventdata_targetFilename:(/.*MsMpEng.*/ OR /.*\.sys/)
    pivot_on: host
    window: 4h
  - name: Process terminated events
    query: data_win_system_eventID:5
    pivot_on: host
    window: 2h
  - name: Ransomware precursors after defense evasion
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*vssadmin.*delete.*/ OR /.*bcdedit.*/ OR /.*wbadmin.*delete.*/)
    pivot_on: host
    window: 4h
