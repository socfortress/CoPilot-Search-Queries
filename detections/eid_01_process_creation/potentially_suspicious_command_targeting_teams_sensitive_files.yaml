name: Potentially Suspicious Command Targeting Teams Sensitive Files
id: d2eb17db-1d39-41dc-b57f-301f6512fa75
version: 1
schema_version: "1.0"
date: "2023-12-18"
author: "@SerkinValery"
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: d2eb17db-1d39-41dc-b57f-301f6512fa75
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a commandline containing references to the Microsoft Teams database or
  cookies files from a process other than Teams. The database might contain
  authentication tokens and other sensitive information about the logged in
  accounts. MITRE ATT&CK: T1528.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Microsoft\\\\Teams\\\\Cookies*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Microsoft\\\\Teams\\\\Local Storage\\\\leveldb*"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\Microsoft\\\\Teams\\\\current\\\\Teams.exe"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*\Microsoft\Teams\Cookies*'; data_win_eventdata_commandLine matches
  '*\Microsoft\Teams\Local Storage\leveldb*'; data_win_eventdata_image matches
  '*\Microsoft\Teams\current\Teams.exe'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.bleepingcomputer.com/news/security/microsoft-teams-stores-auth-tokens-as-cleartext-in-windows-linux-macs/
  - https://www.vectra.ai/blogpost/undermining-microsoft-teams-security-by-mining-tokens
  - https://attack.mitre.org/techniques/T1528/

response:
  message: >
    Potentially Suspicious Command Targeting Teams Sensitive Files detected on
    host $agent_name$. Matched data_win_eventdata_commandLine:
    $data_win_eventdata_commandLine$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1528
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1528
  custom_tags:
    - targeting
    - teams
    - sensitive
    - process_creation
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Tt][Ee][Aa][Mm][Ss]\\[Cc][Oo][Oo][Kk][Ii][Ee][Ss].*/ OR data_win_eventdata_commandLine:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Tt][Ee][Aa][Mm][Ss]\\[Ll][Oo][Cc][Aa][Ll] [Ss][Tt][Oo][Rr][Aa][Gg][Ee]\\[Ll][Ee][Vv][Ee][Ll][Dd][Bb].*/) AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Tt][Ee][Aa][Mm][Ss]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt]\\[Tt][Ee][Aa][Mm][Ss]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 5a6e1e16-07de-48d8-8aae-faa766c05e88
    name: Potential Cookies Session Hijacking
    reason: Teams Cookies theft is session hijacking; the same cookie-store targeting for browsers is the sibling behaviour.
  - id: 47147b5b-9e17-4d76-b8d2-7bac24c5ce1b
    name: Potential Browser Data Stealing
    reason: The same actor tooling usually harvests browser credential and cookie stores alongside Teams tokens.
  - id: 6a69f62d-ce75-4b57-8dce-6351eb55b362
    name: Esentutl Steals Browser Information
    reason: Copying locked app databases with esentutl is a common way to grab Chromium-based stores such as Teams.
  - id: 6d3a3952-6530-44a3-8554-cf17c116c615
    name: Potentially Suspicious JWT Token Search Via CLI
    reason: Token hunting on the command line follows leveldb token extraction.
  - id: e7be6119-fc37-43f0-ad4f-1f3f99be2f9f
    name: Copying Sensitive Files with Credential Data
    reason: Generic credential-file copying often runs in the same collection phase.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other app token/cookie store access
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ll][Oo][Gg][Ii][Nn] [Dd][Aa][Tt][Aa]|[Cc][Oo][Oo][Kk][Ii][Ee][Ss]|[Ll][Oo][Cc][Aa][Ll] [Ss][Tt][Oo][Rr][Aa][Gg][Ee]\\[Ll][Ee][Vv][Ee][Ll][Dd][Bb]|[Ww][Ee][Bb] [Dd][Aa][Tt][Aa]|[Ll][Oo][Cc][Aa][Ll] [Ss][Tt][Aa][Tt][Ee]).*/
    pivot_on: host
    window: 4h
  - name: Copy or archive of AppData stores
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Cc][Oo][Pp][Yy]|[Xx][Cc][Oo][Pp][Yy]|[Rr][Oo][Bb][Oo][Cc][Oo][Pp][Yy]|[Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]-[Aa][Rr][Cc][Hh][Ii][Vv][Ee]|[Ee][Ss][Ee][Nn][Tt][Uu][Tt][Ll]|7[Zz]).*[Aa][Pp][Pp][Dd][Aa][Tt][Aa].*/
    pivot_on: user
    window: 4h
  - name: Token strings searched in files
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ee][Yy][Jj]0|[Ss][Ee][Ll][Ee][Cc][Tt]-[Ss][Tt][Rr][Ii][Nn][Gg]|[Ff][Ii][Nn][Dd][Ss][Tt][Rr]|[Aa][Cc][Cc][Ee][Ss][Ss]_[Tt][Oo][Kk][Ee][Nn]|[Ss][Kk][Yy][Pp][Ee][Tt][Oo][Kk][Ee][Nn]).*/
    pivot_on: host
    window: 4h
  - name: Outbound connections from shells and transfer tools
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]|[Cc][Uu][Rr][Ll]|[Cc][Mm][Dd]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Mm][Ss][Hh][Tt][Aa]|[Rr][Cc][Ll][Oo][Nn][Ee])\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 4h
