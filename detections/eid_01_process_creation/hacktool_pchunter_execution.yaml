name: HackTool - PCHunter Execution
id: fca949cc-79ca-446e-8064-01aa7e52ece5
version: 1
schema_version: "1.0"
date: "2024-11-23"
author: Florian Roth (Nextron Systems), Nasreddine Bencherchali
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: fca949cc-79ca-446e-8064-01aa7e52ece5
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious use of PCHunter, a tool like Process Hacker to view and
  manipulate processes, kernel options and other low level stuff. MITRE ATT&CK:
  T1082, T1057, T1012, T1083, T1007.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\PCHunter64.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\PCHunter32.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "PCHunter.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_description:
                    value: "Epoolsoft Windows Information View Tools"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*SHA1=5F1CBC3D99558307BC1250D084FA968521482025*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*MD5=987B65CD9B9F4E9A1AFD8F8B48CF64A7*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*SHA256=2B214BDDAAB130C274DE6204AF6DBA5AEEC7433DA99AA950022FA306421A6D32*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=444D210CEA1FF8112F256A4997EED7FF*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*SHA1=3FB89787CB97D902780DA080545584D97FB1C2EB*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*MD5=228DD0C2E6287547E26FFBD973A40F14*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*SHA256=55F041BF4E78E9BFA6D4EE68BE40E496CE3A1353E1CA4306598589E19802522C*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=0479F44DF47CFA2EF1CCC4416A538663*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_description
    - data_win_eventdata_hashes
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\PCHunter64.exe'; data_win_eventdata_image matches '*\PCHunter32.exe';
  data_win_eventdata_originalFileName equals 'PCHunter.exe', among other
  conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://web.archive.org/web/20231210115125/http://www.xuetr.com/
  - https://www.crowdstrike.com/blog/falcon-overwatch-report-finds-increase-in-ecrime/
  - https://www.hexacorn.com/blog/2018/04/20/kernel-hacking-tool-you-might-have-never-heard-of-xuetr-pchunter/
  - https://attack.mitre.org/techniques/T1082/
  - https://attack.mitre.org/techniques/T1057/
  - https://attack.mitre.org/techniques/T1012/
  - https://attack.mitre.org/techniques/T1083/
  - https://attack.mitre.org/techniques/T1007/

response:
  message: >
    HackTool - PCHunter Execution detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1082, T1057, T1012, T1083, T1007
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1082
    - T1057
    - T1012
    - T1083
    - T1007
  custom_tags:
    - hacktool
    - pchunter
    - process_creation
    - sysmon
    - execution
    - discovery
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Pp][Cc][Hh][Uu][Nn][Tt][Ee][Rr]64\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Cc][Hh][Uu][Nn][Tt][Ee][Rr]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Pp][Cc][Hh][Uu][Nn][Tt][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_description:/[Ee][Pp][Oo][Oo][Ll][Ss][Oo][Ff][Tt] [Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Ii][Nn][Ff][Oo][Rr][Mm][Aa][Tt][Ii][Oo][Nn] [Vv][Ii][Ee][Ww] [Tt][Oo][Oo][Ll][Ss]/ OR data_win_eventdata_hashes:/.*[Ss][Hh][Aa]1=5[Ff]1[Cc][Bb][Cc]3[Dd]99558307[Bb][Cc]1250[Dd]084[Ff][Aa]968521482025.*/ OR data_win_eventdata_hashes:/.*[Mm][Dd]5=987[Bb]65[Cc][Dd]9[Bb]9[Ff]4[Ee]9[Aa]1[Aa][Ff][Dd]8[Ff]8[Bb]48[Cc][Ff]64[Aa]7.*/ OR data_win_eventdata_hashes:/.*[Ss][Hh][Aa]256=2[Bb]214[Bb][Dd][Dd][Aa][Aa][Bb]130[Cc]274[Dd][Ee]6204[Aa][Ff]6[Dd][Bb][Aa]5[Aa][Ee][Ee][Cc]7433[Dd][Aa]99[Aa][Aa]950022[Ff][Aa]306421[Aa]6[Dd]32.*/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=444[Dd]210[Cc][Ee][Aa]1[Ff][Ff]8112[Ff]256[Aa]4997[Ee][Ee][Dd]7[Ff][Ff].*/ OR data_win_eventdata_hashes:/.*[Ss][Hh][Aa]1=3[Ff][Bb]89787[Cc][Bb]97[Dd]902780[Dd][Aa]080545584[Dd]97[Ff][Bb]1[Cc]2[Ee][Bb].*/ OR data_win_eventdata_hashes:/.*[Mm][Dd]5=228[Dd][Dd]0[Cc]2[Ee]6287547[Ee]26[Ff][Ff][Bb][Dd]973[Aa]40[Ff]14.*/ OR data_win_eventdata_hashes:/.*[Ss][Hh][Aa]256=55[Ff]041[Bb][Ff]4[Ee]78[Ee]9[Bb][Ff][Aa]6[Dd]4[Ee][Ee]68[Bb][Ee]40[Ee]496[Cc][Ee]3[Aa]1353[Ee]1[Cc][Aa]4306598589[Ee]19802522[Cc].*/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=0479[Ff]44[Dd][Ff]47[Cc][Ff][Aa]2[Ee][Ff]1[Cc][Cc][Cc]4416[Aa]538663.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e76ca062-4de0-4d79-8d90-160a0d335eca
    name: PUA - Kernel Driver Utility (KDU) Execution
    reason: PCHunter ships a signed kernel driver; attackers pair kernel tooling to load vulnerable drivers and kill security products.
  - id: 431a1fdb-4799-4f3b-91c3-a683b003fc49
    name: New Kernel Driver Via SC.EXE
    reason: PCHunter and similar tools often follow or accompany manual kernel driver service registration.
  - id: a34f79a3-8e5f-4cc3-b765-de00695452c2
    name: HackTool - PowerTool Execution
    reason: Sibling anti-rootkit/kernel tool used for the same process-kill and driver-unload purpose; operators often try several.
  - id: 9082ff1f-88ab-4678-a3cc-5bcff99fc74d
    name: HackTool - GMER Rootkit Detector and Remover Execution
    reason: Same class of kernel-level process/driver manipulation tool, commonly used to defeat EDR.
  - id: a2ea3ae7-d3d0-40a0-a55c-25a45c87cac1
    name: Suspicious Driver Install by pnputil.exe
    reason: Driver staging on the host before kernel tool use.
  - id: 4931188c-178e-4ee7-a348-39e8a7a56821
    name: Filter Driver Unloaded Via Fltmc.EXE
    reason: Unloading minifilter drivers (EDR/Sysmon) is a typical next step once kernel access exists.
  - id: c598cc0c-9e70-4852-b9eb-8921af79f598
    name: Hacktool - EDR-Freeze Execution
    reason: Follow-on EDR neutralisation after process/kernel inspection.
  - id: a7ee1722-c3c5-aeff-3212-c777e4733217
    name: Disable Windows Defender AV Security Monitoring
    reason: Defender is often disabled once PCHunter has terminated or unhooked protection processes.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Kernel driver loads on host
    query: data_win_system_eventID:6
    pivot_on: host
    window: 4h
  - name: Security product processes terminated or tampered
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Tt]askkill.*/ OR /.*[Ss]top-[Ss]ervice.*/ OR /.*sc(\.exe)?\s+(stop|delete|config).*/)
    pivot_on: host
    window: 2h
  - name: Driver service creation
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*type=\s*kernel.*/
    pivot_on: host
    window: 4h
  - name: Process access against protected processes
    query: data_win_system_eventID:10 AND data_win_eventdata_targetImage:(/.*[Ll]sass\.exe/ OR /.*MsMpEng\.exe/)
    pivot_on: host
    window: 2h
  - name: Driver files written to disk
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\.sys/
    pivot_on: host
    window: 4h
