name: Suspicious AddinUtil.EXE CommandLine Execution
id: 631b22a4-70f4-4e2f-9ea8-42f84d9df6d8
version: 1
schema_version: "1.0"
date: "2023-09-18"
author: Nasreddine Bencherchali (Nextron Systems), Michael McKinley (@McKinleyMike), Tony Latteri (@TheLatteri)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 631b22a4-70f4-4e2f-9ea8-42f84d9df6d8
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of the Add-In deployment cache updating utility
  (AddInutil.exe) with suspicious Addinroot or Pipelineroot paths. An adversary
  may execute AddinUtil.exe with uncommon Addinroot/Pipelineroot paths that
  point to the adversaries Addins.Store payload. MITRE ATT&CK: T1218.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\addinutil.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "AddInUtil.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*-AddInRoot:*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*-PipelineRoot:*"
                                case_insensitive: true
                        minimum_should_match: 1
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*\\\\AppData\\\\Local\\\\Temp\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*\\\\Desktop\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*\\\\Downloads\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*\\\\Users\\\\Public\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*\\\\Windows\\\\Temp\\\\*"
                                case_insensitive: true
                        minimum_should_match: 1
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*-AddInRoot:.*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*-AddInRoot:\".\"*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*-PipelineRoot:.*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*-PipelineRoot:\".\"*"
                                case_insensitive: true
                        minimum_should_match: 1
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_currentDirectory:
                                value: "*\\\\AppData\\\\Local\\\\Temp\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_currentDirectory:
                                value: "*\\\\Desktop\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_currentDirectory:
                                value: "*\\\\Downloads\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_currentDirectory:
                                value: "*\\\\Users\\\\Public\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_currentDirectory:
                                value: "*\\\\Windows\\\\Temp\\\\*"
                                case_insensitive: true
                        minimum_should_match: 1
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_currentDirectory
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\addinutil.exe'; data_win_eventdata_originalFileName equals 'AddInUtil.exe';
  data_win_eventdata_commandLine matches '*-AddInRoot:*', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.blue-prints.blog/content/blog/posts/lolbin/addinutil-lolbas.html
  - https://attack.mitre.org/techniques/T1218/

response:
  message: >
    Suspicious AddinUtil.EXE CommandLine Execution detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1218
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218
  custom_tags:
    - addinutil
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Aa][Dd][Dd][Ii][Nn][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Aa][Dd][Dd][Ii][Nn][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/) AND (((data_win_eventdata_commandLine:/.*-[Aa][Dd][Dd][Ii][Nn][Rr][Oo][Oo][Tt]:.*/ OR data_win_eventdata_commandLine:/.*-[Pp][Ii][Pp][Ee][Ll][Ii][Nn][Ee][Rr][Oo][Oo][Tt]:.*/) AND (data_win_eventdata_commandLine:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Dd][Ee][Ss][Kk][Tt][Oo][Pp]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/)) OR ((data_win_eventdata_commandLine:/.*-[Aa][Dd][Dd][Ii][Nn][Rr][Oo][Oo][Tt]:\..*/ OR data_win_eventdata_commandLine:/.*-[Aa][Dd][Dd][Ii][Nn][Rr][Oo][Oo][Tt]:\"\.\".*/ OR data_win_eventdata_commandLine:/.*-[Pp][Ii][Pp][Ee][Ll][Ii][Nn][Ee][Rr][Oo][Oo][Tt]:\..*/ OR data_win_eventdata_commandLine:/.*-[Pp][Ii][Pp][Ee][Ll][Ii][Nn][Ee][Rr][Oo][Oo][Tt]:\"\.\".*/) AND (data_win_eventdata_currentDirectory:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_currentDirectory:/.*\\[Dd][Ee][Ss][Kk][Tt][Oo][Pp]\\.*/ OR data_win_eventdata_currentDirectory:/.*\\[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]\\.*/ OR data_win_eventdata_currentDirectory:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_currentDirectory:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/)))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 6120ac2a-a34b-42c0-a9bd-1fb9f459f348
    name: AddinUtil.EXE Execution From Uncommon Directory
    reason: Sibling detection of the same abuse; if both fire the AddinUtil run came from an attacker-staged directory, confirming the payload is not the legitimate add-in cache.
  - id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
    name: PowerShell Download and Execution Cradles
    reason: 'Common precursor: a download cradle stages Addins.Store and the .NET payload in Temp/Downloads/Public before AddinUtil is pointed at them.'
  - id: 7047d730-036f-4f40-b9d8-1c63e36d5e62
    name: Potential Binary Or Script Dropper Via PowerShell
    reason: 'Precursor: PowerShell writing the payload files into the user-writable folder later passed to -AddInRoot/-PipelineRoot.'
  - id: b447f7de-1e53-4cbf-bfb4-f1f6d0b04e4e
    name: Suspicious Binaries and Scripts in Public Folder
    reason: 'Precursor/co-occurring: payloads staged in C:\Users\Public, one of the paths this rule flags in the AddinUtil command line.'
  - id: d4ca7c59-e9e4-42d8-bf57-91a776efcb87
    name: LOLBIN Execution From Abnormal Drive
    reason: Related LOLBin proxy-execution signal from the same host, indicating a staged binary-proxy chain rather than a one-off.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Add-in store / pipeline payload files written
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\([Aa][Dd][Dd][Ii][Nn][Ss]\.[Ss][Tt][Oo][Rr][Ee]|[Hh][Oo][Ss][Tt][Ss][Ii][Dd][Ee][Aa][Dd][Aa][Pp][Tt][Ee][Rr][Ss]|[Aa][Dd][Dd][Ii][Nn][Pp][Rr][Oo][Cc][Ee][Ss][Ss]|[Pp][Ii][Pp][Ee][Ll][Ii][Nn][Ee]).*/
    pivot_on: host
    window: 2h
  - name: DLLs loaded by AddinUtil from user-writable paths
    query: data_win_system_eventID:"7" AND data_win_eventdata_image:/.*\\([Aa][Dd][Dd][Ii][Nn][Uu][Tt][Ii][Ll])\.[Ee][Xx][Ee]/ AND data_win_eventdata_imageLoaded:/.*(\\[Tt][Ee][Mm][Pp]\\|\\[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]\\|\\[Dd][Ee][Ss][Kk][Tt][Oo][Pp]\\|\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\|\\[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss]\\).*\.[Dd][Ll][Ll]/
    pivot_on: host
    window: 2h
  - name: Child processes spawned by AddinUtil
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\([Aa][Dd][Dd][Ii][Nn][Uu][Tt][Ii][Ll])\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Network connections made by AddinUtil
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Aa][Dd][Dd][Ii][Nn][Uu][Tt][Ii][Ll])\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 4h
  - name: Download tooling staging payloads
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]|[Cc][Uu][Rr][Ll])\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*([Hh][Tt][Tt][Pp]|-[Uu][Rr][Ll][Cc][Aa][Cc][Hh][Ee]|\/[Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr]).*/
    pivot_on: host
    window: 2h
