name: Detection of PowerShell Execution via Sqlps.exe
id: 0152550d-3a26-4efd-9f0e-54a0b28ae2f3
version: 1
schema_version: "1.0"
date: "2022-12-09"
author: Agro (@agro_sev) oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 0152550d-3a26-4efd-9f0e-54a0b28ae2f3
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  This rule detects execution of a PowerShell code through the sqlps.exe
  utility, which is included in the standard set of utilities supplied with the
  MSSQL Server. Script blocks are not logged in this case, so this utility helps
  to bypass protection mechanisms based on the analysis of these logs. MITRE
  ATT&CK: T1059.001, T1127.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\sqlps.exe"
                    case_insensitive: true
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\sqlps.exe"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_originalFileName:
                                value: "sqlps.exe"
                                case_insensitive: true
                        minimum_should_match: 1
                    - exists:
                        field: "data_win_eventdata_parentImage"
                    - bool:
                        must_not:
                          - wildcard:
                              data_win_eventdata_parentImage:
                                value: "*\\\\sqlagent.exe"
                                case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\sqlps.exe'; data_win_eventdata_image matches '*\sqlps.exe';
  data_win_eventdata_originalFileName equals 'sqlps.exe', among other
  conditions.

known_false_positives: >
  Direct PS command execution through SQLPS.exe is uncommon, childprocess
  sqlps.exe spawned by sqlagent.exe is a legitimate action. Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://learn.microsoft.com/en-us/sql/tools/sqlps-utility?view=sql-server-ver15
  - https://lolbas-project.github.io/lolbas/OtherMSBinaries/Sqlps/
  - https://twitter.com/bryon_/status/975835709587075072
  - https://attack.mitre.org/techniques/T1059/001/
  - https://attack.mitre.org/techniques/T1127/

response:
  message: >
    Detection of PowerShell Execution via Sqlps.exe detected on host
    $agent_name$. Matched data_win_eventdata_parentImage:
    $data_win_eventdata_parentImage$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1059.001, T1127
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
    - T1127
  custom_tags:
    - powershell
    - sqlps
    - process_creation
    - sysmon
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Ss][Qq][Ll][Pp][Ss]\.[Ee][Xx][Ee]/ OR ((data_win_eventdata_image:/.*\\[Ss][Qq][Ll][Pp][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ss][Qq][Ll][Pp][Ss]\.[Ee][Xx][Ee]/) AND _exists_:data_win_eventdata_parentImage AND NOT (data_win_eventdata_parentImage:/.*\\[Ss][Qq][Ll][Aa][Gg][Ee][Nn][Tt]\.[Ee][Xx][Ee]/)))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7f103213-a04e-4d59-8261-213dddf22314
    name: MSSQL XPCmdshell Suspicious Execution
    reason: xp_cmdshell execution is the most common way SQL Server reaches OS command execution alongside sqlps.
  - id: d08dd86f-681e-4a00-a92c-1db218754417
    name: MSSQL XPCmdshell Option Change
    reason: xp_cmdshell option enabled is a typical precursor on the SQL host.
  - id: 08200f85-2678-463e-9c32-88dce2f073d1
    name: MSSQL Add Account To Sysadmin Role
    reason: Adding an account to sysadmin shows privilege escalation within SQL Server.
  - id: 2f47f1fd-0901-466e-a770-3b7092834a1b
    name: Potential Conti Ransomware Database Dumping Activity Via SQLCmd
    reason: sqlcmd database dumping is a common follow-on once SQL tooling is abused (Conti).
  - id: c615d676-f655-46b9-b913-78729021e5d7
    name: Data Export From MSSQL Table Via BCP.EXE
    reason: bcp table export indicates data theft from the database.
  - id: 23ceaf5c-b6f1-4a32-8559-f2ff734be516
    name: Dumping Process via Sqldumper.exe
    reason: sqldumper process dumping is a known SQL-directory LOLBin memory/credential dump path.
  - id: c4db14d9-7909-48b4-a054-aa14d89dbb19
    name: Malicious PowerShell Process - Encoded Command
    reason: Encoded PowerShell is how sqlps payloads are typically delivered.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: SQL Server process spawning shells or PowerShell
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*(\\[Ss][Qq][Ll][Ss][Ee][Rr][Vv][Rr]\.[Ee][Xx][Ee]|\\[Ss][Qq][Ll][Pp][Ss]\.[Ee][Xx][Ee]|\\[Ss][Qq][Ll][Cc][Mm][Dd]\.[Ee][Xx][Ee])/ AND data_win_eventdata_image:/.*(\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]|\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]|\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|\\[Ww][Hh][Oo][Aa][Mm][Ii]\.[Ee][Xx][Ee]|\\[Nn][Ee][Tt]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 4h
  - name: Database dump and export tools
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Ss][Qq][Ll][Cc][Mm][Dd]\.[Ee][Xx][Ee]|\\[Bb][Cc][Pp]\.[Ee][Xx][Ee]|\\[Ss][Qq][Ll][Dd][Uu][Mm][Pp][Ee][Rr]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 4h
  - name: SQL xp_cmdshell / sp_configure activity in command lines
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Xx][Pp]_[Cc][Mm][Dd][Ss][Hh][Ee][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Ss][Pp]_[Cc][Oo][Nn][Ff][Ii][Gg][Uu][Rr][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Pp]_[Oo][Aa][Cc][Rr][Ee][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Pp]_[Aa][Dd][Dd][Ss][Rr][Vv][Rr][Oo][Ll][Ee][Mm][Ee][Mm][Bb][Ee][Rr].*/)
    pivot_on: host
    window: 4h
  - name: Payload staging in PowerShell started on the SQL host
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*-[Ee][Nn][Cc].*/ OR data_win_eventdata_commandLine:/.*[Ii][Ee][Xx].*/ OR data_win_eventdata_commandLine:/.*[Ff][Rr][Oo][Mm][Bb][Aa][Ss][Ee]64[Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt].[Ww][Ee][Bb][Cc][Ll][Ii][Ee][Nn][Tt].*/)
    pivot_on: host
    window: 4h
  - name: Outbound connections from SQL Server processes
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*(\\[Ss][Qq][Ll][Ss][Ee][Rr][Vv][Rr]\.[Ee][Xx][Ee]|\\[Ss][Qq][Ll][Pp][Ss]\.[Ee][Xx][Ee]|\\[Ss][Qq][Ll][Cc][Mm][Dd]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 4h
