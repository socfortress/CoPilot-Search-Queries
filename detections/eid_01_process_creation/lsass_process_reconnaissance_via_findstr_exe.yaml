name: LSASS Process Reconnaissance Via Findstr.EXE
id: fe63010f-8823-4864-a96b-a7b4a0f7b929
version: 1
schema_version: "1.0"
date: "2024-06-04"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: fe63010f-8823-4864-a96b-a7b4a0f7b929
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects findstring commands that include the keyword lsass, which indicates
  recon actviity for the LSASS process PID. MITRE ATT&CK: T1552.006.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\find.exe"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\findstr.exe"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_originalFileName:
                                value: "FIND.EXE"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_originalFileName:
                                value: "FINDSTR.EXE"
                                case_insensitive: true
                        minimum_should_match: 1
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*lsass*"
                          case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -i \"lsass*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /i \"lsass*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* –i \"lsass*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* —i \"lsass*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* ―i \"lsass*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -i lsass.exe*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /i lsass.exe*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* –i lsass.exe*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* —i lsass.exe*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* ―i lsass.exe*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*findstr \"lsass*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*findstr lsass*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*findstr.exe \"lsass*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*findstr.exe lsass*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\find.exe'; data_win_eventdata_image matches '*\findstr.exe';
  data_win_eventdata_originalFileName equals 'FIND.EXE', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://blog.talosintelligence.com/2022/08/recent-cyber-attack.html?m=1
  - https://attack.mitre.org/techniques/T1552/006/

response:
  message: >
    LSASS Process Reconnaissance Via Findstr.EXE detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1552.006
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1552.006
  custom_tags:
    - lsass
    - reconnaissance
    - findstr
    - process_creation
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (((data_win_eventdata_image:/.*\\[Ff][Ii][Nn][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ff][Ii][Nn][Dd][Ss][Tt][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ff][Ii][Nn][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ff][Ii][Nn][Dd][Ss][Tt][Rr]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Ss][Ss].*/) OR data_win_eventdata_commandLine:/.* -[Ii] \"[Ll][Ss][Aa][Ss][Ss].*/ OR data_win_eventdata_commandLine:/.* \/[Ii] \"[Ll][Ss][Aa][Ss][Ss].*/ OR data_win_eventdata_commandLine:/.* –[Ii] \"[Ll][Ss][Aa][Ss][Ss].*/ OR data_win_eventdata_commandLine:/.* —[Ii] \"[Ll][Ss][Aa][Ss][Ss].*/ OR data_win_eventdata_commandLine:/.* ―[Ii] \"[Ll][Ss][Aa][Ss][Ss].*/ OR data_win_eventdata_commandLine:/.* -[Ii] [Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_commandLine:/.* \/[Ii] [Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_commandLine:/.* –[Ii] [Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_commandLine:/.* —[Ii] [Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_commandLine:/.* ―[Ii] [Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ff][Ii][Nn][Dd][Ss][Tt][Rr] \"[Ll][Ss][Aa][Ss][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ff][Ii][Nn][Dd][Ss][Tt][Rr] [Ll][Ss][Aa][Ss][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ff][Ii][Nn][Dd][Ss][Tt][Rr]\.[Ee][Xx][Ee] \"[Ll][Ss][Aa][Ss][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ff][Ii][Nn][Dd][Ss][Tt][Rr]\.[Ee][Xx][Ee] [Ll][Ss][Aa][Ss][Ss].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: ffa6861c-4461-4f59-8a41-578c39f3f23e
    name: LSASS Dump Keyword In CommandLine
    reason: LSASS-keyword dump command lines are the direct next step once the attacker has located the LSASS PID.
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: rundll32 comsvcs.dll MiniDump needs the LSASS PID that findstr recon obtains.
  - id: 5afee48e-67dd-4e03-a783-f74259dcf998
    name: Potential LSASS Process Dump Via Procdump
    reason: Procdump against lsass is a common follow-on after PID discovery.
  - id: 2e65275c-8288-4ab4-aeb7-6274f58b6b20
    name: Procdump Execution
    reason: Procdump execution on the same host indicates the dump stage following recon.
  - id: b2815d0d-7481-4bf0-9b6c-a4c48a94b349
    name: PowerShell Get-Process LSASS
    reason: PowerShell Get-Process LSASS is an alternate PID lookup by the same operator, often paired in one chain.
  - id: c8da0dfd-4ed0-4b68-962d-13c9c884384e
    name: Potential Credential Dumping Via LSASS Process Clone
    reason: LSASS clone dumping is a stealthier dump method used after locating LSASS.
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: Mimikatz execution is the classic credential tool run after LSASS recon.
  - id: d474c8fe-bb69-4ea0-b7d9-f682b56d52d3
    name: HackTool - Doppelanger LSASS Dumper Execution
    reason: Dedicated LSASS dumper tooling follows PID discovery.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: LSASS dump tooling and commands
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*[Mm]ini[Dd]ump.*/ OR data_win_eventdata_commandLine:/.*comsvcs.*/ OR data_win_eventdata_image:/.*[Pp]rocdump.*/ OR data_win_eventdata_commandLine:/.*[Pp]rocdump.*/ OR data_win_eventdata_commandLine:/.*lsass.*[Dd]mp.*/)
    pivot_on: host
    window: 2h
  - name: Process access to lsass.exe
    query: data_win_system_eventID:10 AND data_win_eventdata_targetImage:/.*lsass\.exe/
    pivot_on: host
    window: 4h
  - name: Dump file written to disk
    query: data_win_system_eventID:11 AND (data_win_eventdata_targetFilename:/.*lsass.*\.(dmp|dump)/ OR data_win_eventdata_targetFilename:/.*\.dmp/)
    pivot_on: host
    window: 4h
  - name: Account and system discovery by user
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*\\cmd\.exe/ OR data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ OR data_win_eventdata_image:/.*[Pp]wsh.*/) AND (data_win_eventdata_commandLine:/.*[Ww]ho[Aa]mi.*/ OR data_win_eventdata_commandLine:/.*[Tt]asklist.*/ OR data_win_eventdata_commandLine:/.*[Nn]et .*/)
    pivot_on: user
    window: 4h
  - name: Outbound transfer after dump
    query: data_win_system_eventID:3 AND data_win_eventdata_initiated:true AND (data_win_eventdata_image:/.*[Cc]url.*/ OR data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ OR data_win_eventdata_image:/.*[Rr]clone.*/)
    pivot_on: host
    window: 4h
