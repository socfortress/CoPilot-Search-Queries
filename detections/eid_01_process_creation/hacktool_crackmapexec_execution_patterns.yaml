name: HackTool - CrackMapExec Execution Patterns
id: 058f4380-962d-40a5-afce-50207d36d7e2
version: 1
schema_version: "1.0"
date: "2023-11-06"
author: Thomas Patzke
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 058f4380-962d-40a5-afce-50207d36d7e2
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: production
type: TTP

description: >
  Detects various execution patterns of the CrackMapExec pentesting framework.
  MITRE ATT&CK: T1047, T1053, T1059.003, T1059.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*cmd.exe /Q /c * 1> \\\\\\\\*\\\\*\\\\* 2>&1*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*cmd.exe /C * > \\\\\\\\*\\\\*\\\\* 2>&1*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*cmd.exe /C * > *\\\\Temp\\\\* 2>&1*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*powershell.exe -exec bypass -noni -nop -w 1 -C \"*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*powershell.exe -noni -nop -w 1 -enc *"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*cmd.exe /Q /c * 1> \\*\*\* 2>&1*'; data_win_eventdata_commandLine matches
  '*cmd.exe /C * > \\*\*\* 2>&1*'; data_win_eventdata_commandLine matches
  '*cmd.exe /C * > *\Temp\* 2>&1*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/byt3bl33d3r/CrackMapExec
  - https://attack.mitre.org/techniques/T1047/
  - https://attack.mitre.org/techniques/T1053/
  - https://attack.mitre.org/techniques/T1059/003/
  - https://attack.mitre.org/techniques/T1059/001/

response:
  message: >
    HackTool - CrackMapExec Execution Patterns detected on host $agent_name$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1047, T1053, T1059.003, T1059.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1047
    - T1053
    - T1059.003
    - T1059.001
  custom_tags:
    - hacktool
    - crackmapexec
    - patterns
    - process_creation
    - sysmon
    - privilege_escalation
    - persistence
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Mm][Dd]\.[Ee][Xx][Ee] \/[Qq] \/[Cc] .* 1\> \\\\.*\\.*\\.* 2\>\&1.*/ OR data_win_eventdata_commandLine:/.*[Cc][Mm][Dd]\.[Ee][Xx][Ee] \/[Cc] .* \> \\\\.*\\.*\\.* 2\>\&1.*/ OR data_win_eventdata_commandLine:/.*[Cc][Mm][Dd]\.[Ee][Xx][Ee] \/[Cc] .* \> .*\\[Tt][Ee][Mm][Pp]\\.* 2\>\&1.*/ OR data_win_eventdata_commandLine:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee] -[Ee][Xx][Ee][Cc] [Bb][Yy][Pp][Aa][Ss][Ss] -[Nn][Oo][Nn][Ii] -[Nn][Oo][Pp] -[Ww] 1 -[Cc] \".*/ OR data_win_eventdata_commandLine:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee] -[Nn][Oo][Nn][Ii] -[Nn][Oo][Pp] -[Ww] 1 -[Ee][Nn][Cc] .*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 42a993dd-bb3e-48c8-b372-4d6684c4106c
    name: HackTool - CrackMapExec Execution
    reason: Operator-side CME flag usage when the tool runs on a Windows host.
  - id: f26307d8-14cd-47e3-a26b-4b4769f24af6
    name: HackTool - CrackMapExec Process Patterns
    reason: Parent/child process chains CME creates on the target alongside these command patterns.
  - id: 6f8b3439-a203-45dc-a88b-abf57ea15ccf
    name: HackTool - CrackMapExec PowerShell Obfuscation
    reason: Obfuscated PowerShell payload CME uses alongside these exec patterns.
  - id: d6e464e4-5c6a-474e-82d2-aed616a3a492
    name: Impacket Lateral Movement WMIExec Commandline Parameters
    reason: CME wmiexec uses Impacket's cmd /Q /c ... ADMIN$ output pattern.
  - id: bb3c1bac-6bdf-4aa0-8dc9-068b8b712a76
    name: Impacket Lateral Movement smbexec CommandLine Parameters
    reason: smbexec service-based execution of the same output-redirect pattern.
  - id: 022eaba8-f0bf-4dd9-9217-4604b0bb3bb0
    name: HackTool - Wmiexec Default Powershell Command
    reason: Wmiexec default PowerShell stager overlaps CME's noni/nop/enc form.
  - id: 855bc8b5-2ae8-402e-a9ed-b889e6df1900
    name: Copy From Or To Admin Share Or Sysvol Folder
    reason: Admin share file movement paired with remote command output retrieval.
  - id: e32d4572-9826-4738-b651-95fa63747e8a
    name: Base64 Encoded PowerShell Command Detected
    reason: The -enc stager variant matches CME's PowerShell execution.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Command output redirected to share/temp
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*cmd.*\/[QqCc].*>.*2>&1.*/)
    pivot_on: host
    window: 6h
  - name: Hidden non-interactive encoded PowerShell
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*-[Nn]o[Nn][Ii].*-[Nn]op.*(-[Ee]nc|-[Ee]xec).*/)
    pivot_on: host
    window: 6h
  - name: Service installation for remote exec (smbexec/psexec style)
    query: data_win_system_eventID:7045
    pivot_on: host
    window: 6h
  - name: Network logons (type 3) from remote sources
    query: data_win_system_eventID:4624 AND data_win_eventdata_logonType:3
    pivot_on: ip
    window: 6h
  - name: Processes launched by WMI provider host
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*wmiprvse\.exe/
    pivot_on: host
    window: 6h
