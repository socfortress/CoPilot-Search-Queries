name: Conti NTDS Exfiltration Command
id: aa92fd02-09f2-48b0-8a93-864813fb8f41
version: 1
schema_version: "1.0"
date: "2022-10-09"
author: Max Altgelt (Nextron Systems), Tobias Michalski (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: aa92fd02-09f2-48b0-8a93-864813fb8f41
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a command used by conti to exfiltrate NTDS. MITRE ATT&CK: T1560.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*7za.exe*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*\\\\C$\\\\temp\\\\log.zip*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*7za.exe*'; data_win_eventdata_commandLine matches '*\C$\temp\log.zip*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/vxunderground/status/1423336151860002816?s=20
  - https://www.virustotal.com/gui/file/03e9b8c2e86d6db450e5eceec057d7e369ee2389b9daecaf06331a95410aa5f8/detection
  - https://attack.mitre.org/techniques/T1560/

response:
  message: >
    Conti NTDS Exfiltration Command detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1560
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1560
  custom_tags:
    - conti
    - exfiltration
    - process_creation
    - sysmon
    - collection
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*7[Zz][Aa]\.[Ee][Xx][Ee].*/ AND data_win_eventdata_commandLine:/.*\\[Cc]\$\\[Tt][Ee][Mm][Pp]\\[Ll][Oo][Gg]\.[Zz][Ii][Pp].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: da63bc76-61ae-11eb-ae93-0242ac130002
    name: Ntdsutil Export NTDS
    reason: 'Precursor: NTDS.dit must be exported before it is zipped for exfil.'
  - id: 2afafd61-6aae-4df4-baed-139fa1f4c345
    name: Invocation of Active Directory Diagnostic Tool (ntdsutil.exe)
    reason: Ntdsutil use on the DC is the usual way the archived files were produced.
  - id: a58353df-af43-4753-bad0-cd83ef35eef5
    name: Suspicious Usage Of Active Directory Diagnostic Tool (ntdsutil.exe)
    reason: Suspicious ntdsutil IFM/snapshot arguments directly precede archiving.
  - id: 11b1ed55-154d-4e82-8ad7-83739298f720
    name: NTDS.DIT Creation By Uncommon Process
    reason: File-level evidence the ntds.dit copy was created before compression.
  - id: 3a8da4e0-36c1-40d2-8b29-b3e890d5172a
    name: NTDS Exfiltration Filename Patterns
    reason: Staging file names matching NTDS exfil confirm what was packed.
  - id: 8bc64091-6875-4881-aaf9-7bd25b5dda08
    name: Suspicious Process Patterns NTDS.DIT Exfil
    reason: Same exfil chain from process view (copy, compress, move).
  - id: 1ac14d38-3dfc-4635-92c7-e3fd1c5f5bfc
    name: Winrar Compressing Dump Files
    reason: Alternate compressor for the same dump-staging step.
  - id: ec570e53-4c76-45a9-804d-dc3f355ff7a7
    name: 7Zip Compressing Dump Files
    reason: 7-Zip compressing dumps is the same staging via the generic rule.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Ntdsutil and NTDS access
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:(/.*[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll].*/ OR /.*[Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt].*/)
    pivot_on: host
    window: 24h
  - name: Shadow copy and hive staging
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:(/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*/ OR /.*[Dd][Ii][Ss][Kk][Ss][Hh][Aa][Dd][Oo][Ww].*/ OR /.*[Rr][Ee][Gg] [Ss][Aa][Vv][Ee].*/)
    pivot_on: host
    window: 24h
  - name: Archiver execution
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:(/.*7[Zz][Aa]\.[Ee][Xx][Ee].*/ OR /.*7[Zz]\.[Ee][Xx][Ee].*/ OR /.*[Ww][Ii][Nn][Rr][Aa][Rr].*/ OR /.*[Rr][Aa][Rr]\.[Ee][Xx][Ee].*/)
    pivot_on: host
    window: 24h
  - name: Zip files created in temp
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(zip|7z|rar)/
    pivot_on: host
    window: 24h
  - name: Outbound transfer tooling
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:(/.*[Rr][Cc][Ll][Oo][Nn][Ee].*/ OR /.*[Cc][Uu][Rr][Ll].*/ OR /.*[Ss][Cc][Pp] .*/)
    pivot_on: host
    window: 24h
