Oo][Gg][Aa]6[Aa][Cc][Gg][Aa][Ii][Gg][Bb][Mm][Aa][Gg]8[Aa][Yy][Qq][Bb][Kk][Aa][Cc][Ii][Aa][Kk].*/ OR data_win_eventdata_commandLine:/.*[Ww][Ww][Bb][Ss][Aa][Gg][Uu][Aa][Zz][Gg][Bb][Ss][Aa][Gg][Uu][Aa][Yy][Ww][Bb]0[Aa][Gg][Kk][Aa][Bb][Ww][Bb][Uu][Aa][Cc]4[Aa][Qq][Qq][Bb][Zz][Aa][Hh][Mm][Aa][Zz][Qq][Bb][Tt][Aa][Gg][Ii][Aa][Bb][Aa][Bb]5[Aa][Ff]0[Aa][Oo][Gg][Aa]6[Aa][Cc][Gg][Aa][Ii][Gg][Bb][Mm][Aa][Gg]8[Aa][Yy][Qq][Bb][Kk][Aa][Cc][Ii][Aa][Kk][Qq].*/ OR data_win_eventdata_commandLine:/.*[Ss][Aa][Uu][Gg][Bb][Ll][Aa][Gg][Yy][Aa][Bb][Aa][Bb][Ll][Aa][Gg][Mm][Aa][Dd][Aa][Bb][Pp][Aa][Gg]8[Aa][Bb][Gg][Aa][Uu][Aa][Ee][Ee][Aa][Cc][Ww][Bb][Zz][Aa][Gg][Uu][Aa][Bb][Qq][Bb][Ii][Aa][Gg][Ww][Aa][Ee][Qq][Bb][Dd][Aa][Dd][Oo][Aa][Oo][Gg][Aa][Oo][Aa][Cc][Ii][Aa][Tt][Aa][Bb][Vv][Aa][Gg][Ee][Aa][Zz][Aa][Aa][Ii][Aa][Cc][Kk][Aa].*/ OR data_win_eventdata_commandLine:/.*[Bb][Aa][Ff][Ii][Aa][Zz][Qq][Bb][Mm][Aa][Gg][Ww][Aa][Zz][Qq][Bb][Jj][Aa][Hh][Qq][Aa][Aa][Qq][Bb][Vv][Aa][Gg]4[Aa][Ll][Gg][Bb][Bb][Aa][Hh][Mm][Aa][Cc][Ww][Bb][Ll][Aa][Gg]0[Aa][Yy][Gg][Bb][Ss][Aa][Hh][Kk][Aa][Xx][Qq][Aa]6[Aa][Dd][Oo][Aa][Kk][Aa][Aa][Ii][Aa][Ee][Ww][Aa][Bb][Ww][Bb][Hh][Aa][Gg][Qq][Aa][Ii][Gg][Aa][Pp][Aa].*/ OR data_win_eventdata_commandLine:/.*[Ww][Ww][Bb][Yy][Aa][Gg][Uu][Aa][Zz][Gg][Bb][Ss][Aa][Gg][Uu][Aa][Yy][Ww][Bb]0[Aa][Gg][Kk][Aa][Bb][Ww][Bb][Uu][Aa][Cc]4[Aa][Yy][Qq][Bb][Zz][Aa][Hh][Mm][Aa][Zz][Qq][Bb][Tt][Aa][Gg][Ii][Aa][Bb][Aa][Bb]5[Aa][Ff]0[Aa][Oo][Gg][Aa]6[Aa][Ee][Ww][Aa][Bb][Ww][Bb][Hh][Aa][Gg][Qq][Aa][Kk][Aa].*/ OR data_win_eventdata_commandLine:/.*[Ss][Aa][Cc][Gg][Bb][Ll][Aa][Gg][Yy][Aa][Bb][Aa][Bb][Ll][Aa][Gg][Mm][Aa][Dd][Aa][Bb][Pp][Aa][Gg]8[Aa][Bb][Gg][Aa][Uu][Aa][Gg][Ee][Aa][Cc][Ww][Bb][Zz][Aa][Gg][Uu][Aa][Bb][Qq][Bb][Ii][Aa][Gg][Ww][Aa][Ee][Qq][Bb][Dd][Aa][Dd][Oo][Aa][Oo][Gg][Bb][Mm][Aa][Gg]8[Aa][Yy][Qq][Bb][Kk][Aa][Cc][Gg][Aa].*/ OR data_win_eventdata_commandLine:/.*[Bb][Aa][Hh][Ii][Aa][Zz][Qq][Bb][Mm][Aa][Gg][Ww][Aa][Zz][Qq][Bb][Jj][Aa][Hh][Qq][Aa][Aa][Qq][Bb][Vv][Aa][Gg]4[Aa][Ll][Gg][Bb][Hh][Aa][Hh][Mm][Aa][Cc][Ww][Bb][Ll][Aa][Gg]0[Aa][Yy][Gg][Bb][Ss][Aa][Hh][Kk][Aa][Xx][Qq][Aa]6[Aa][Dd][Oo][Aa][Tt][Aa][Bb][Vv][Aa][Gg][Ee][Aa][Zz][Aa][Aa][Oo][Aa].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e32d4572-9826-4738-b651-95fa63747e8a
    name: Base64 Encoded PowerShell Command Detected
    reason: Encoded PowerShell wrapper carrying the in-memory .NET loader.
  - id: c4db14d9-7909-48b4-a054-aa14d89dbb19
    name: Malicious PowerShell Process - Encoded Command
    reason: Encoded-command execution is how the reflective loader is delivered.
  - id: fdb62a13-9a81-4e5c-a38f-ea93a16f6d7c
    name: PowerShell Base64 Encoded FromBase64String Cmdlet
    reason: FromBase64String supplies the assembly bytes passed to Assembly.Load.
  - id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
    name: PowerShell Download and Execution Cradles
    reason: Download cradle commonly fetches the assembly or its loader script.
  - id: 30edb182-aa75-42c0-b0a9-e998bb29067c
    name: Potential AMSI Bypass Via .NET Reflection
    reason: Reflection use for AMSI bypass typically runs right before loading the assembly.
  - id: 22e58743-4ac8-4a9f-bf19-00a0428d8c5f
    name: Base64 MZ Header In CommandLine
    reason: Base64 MZ header in a command line is the raw PE being loaded.
  - id: 4508a70e-97ef-4300-b62b-ff27992990ea
    name: DotNet CLR DLL Loaded By Scripting Applications
    reason: CLR loaded by a scripting host is the module-level trace of managed code running in-process.
  - id: 6ec86d9e-912e-4726-91a2-209359b999b9
    name: Amsi.DLL Loaded Via LOLBIN Process
    reason: AMSI.dll loading by a LOLBin shows an AMSI scan or bypass attempt around the load.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: AMSI bypass or reflection tampering before the load
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Aa][Mm][Ss][Ii][Uu][Tt][Ii][Ll][Ss].*/ OR data_win_eventdata_commandLine:/.*[Aa][Mm][Ss][Ii][Ii][Nn][Ii][Tt][Ff][Aa][Ii][Ll][Ee][Dd].*/ OR data_win_eventdata_commandLine:/.*[Aa][Mm][Ss][Ii][Cc][Oo][Nn][Tt][Ee][Xx][Tt].*/)
    pivot_on:
    - host
    window: 2h
  - name: Script block logging of Assembly.Load and entry-point invocation
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Rr][Ee][Ff][Ll][Ee][Cc][Tt][Ii][Oo][Nn].[Aa][Ss][Ss][Ee][Mm][Bb][Ll][Yy].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt][Ee][Nn][Tt][Rr][Yy][Pp][Oo][Ii][Nn][Tt].*/ OR data_win_eventdata_scriptBlockText:/.*::[Ll][Oo][Aa][Dd].*/)
    pivot_on:
    - host
    window: 2h
  - name: Download cradles fetching the assembly bytes
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ii][Ww][Rr] .*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt].[Ww][Ee][Bb][Cc][Ll][Ii][Ee][Nn][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Rr][Ee][Ss][Tt][Mm][Ee][Tt][Hh][Oo][Dd].*/ OR data_win_eventdata_commandLine:/.*[Ss][Tt][Aa][Rr][Tt]-[Bb][Ii][Tt][Ss][Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn].*/)
    pivot_on:
    - host
    window: 2h
  - name: Remote thread creation (injection) following the managed load
    query: data_win_system_eventID:"8"
    pivot_on:
    - host
    window: 2h
  - name: Credential access and recon tools following in-memory load
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz].*/ OR data_win_eventdata_commandLine:/.*[Rr][Uu][Bb][Ee][Uu][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Aa][Tt][Bb][Ee][Ll][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ss][Hh][Aa][Rr][Pp][Hh][Oo][Uu][Nn][Dd].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss].[Dd][Ll][Ll].*/)
    pivot_on:
    - host
    window: 6h
