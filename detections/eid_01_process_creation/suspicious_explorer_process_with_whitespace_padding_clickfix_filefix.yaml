name: Suspicious Explorer Process with Whitespace Padding - ClickFix/FileFix
id: 3ae9974a-eb09-4044-8e70-8980a50c12c8
version: 1
schema_version: "1.0"
date: "2025-11-26"
author: Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 3ae9974a-eb09-4044-8e70-8980a50c12c8
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects process creation with suspicious whitespace padding followed by a '#'
  character, which may indicate ClickFix or FileFix techniques used to conceal
  malicious commands from visual inspection. ClickFix and FileFix are social
  engineering attack techniques where adversaries distribute phishing documents
  or malicious links that deceive users into opening the Windows Run dialog box
  or File Explorer search bar. The victims are then instructed to paste commands
  from their clipboard, which contain extensive whitespace padding using various
  Unicode space characters to push the actual malicious command far to the
  right, effectively hiding it from immediate view. MITRE ATT&CK: T1204.004,
  T1027.010.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_parentImage:
              value: "*\\\\explorer.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine: "*#*"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine: "*            *"
              - wildcard:
                  data_win_eventdata_commandLine: "*            *"
              - wildcard:
                  data_win_eventdata_commandLine: "*            *"
              - wildcard:
                  data_win_eventdata_commandLine: "*            *"
              - wildcard:
                  data_win_eventdata_commandLine: "*            *"
              - wildcard:
                  data_win_eventdata_commandLine: "*            *"
              - wildcard:
                  data_win_eventdata_commandLine: "*            *"
              - wildcard:
                  data_win_eventdata_commandLine: "*            *"
              - wildcard:
                  data_win_eventdata_commandLine: "*            *"
              - wildcard:
                  data_win_eventdata_commandLine: "*            *"
              - wildcard:
                  data_win_eventdata_commandLine: "*            *"
              - wildcard:
                  data_win_eventdata_commandLine: "*            *"
              - wildcard:
                  data_win_eventdata_commandLine: "*            *"
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\explorer.exe'; data_win_eventdata_commandLine matches '*#*';
  data_win_eventdata_commandLine matches '* *', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://expel.com/blog/cache-smuggling-when-a-picture-isnt-a-thousand-words/
  - https://mrd0x.com/filefix-clickfix-alternative/
  - https://attack.mitre.org/techniques/T1204/004/
  - https://attack.mitre.org/techniques/T1027/010/

response:
  message: >
    Suspicious Explorer Process with Whitespace Padding - ClickFix/FileFix
    detected on host $agent_name$. Matched data_win_eventdata_parentImage:
    $data_win_eventdata_parentImage$. Matched data_win_eventdata_commandLine:
    $data_win_eventdata_commandLine$. MITRE ATT&CK: T1204.004, T1027.010
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1204.004
    - T1027.010
  custom_tags:
    - explorer
    - whitespace
    - padding
    - process_creation
    - sysmon
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*\#.*/ AND (data_win_eventdata_commandLine:/.*            .*/ OR data_win_eventdata_commandLine:/.*            .*/ OR data_win_eventdata_commandLine:/.*            .*/ OR data_win_eventdata_commandLine:/.*            .*/ OR data_win_eventdata_commandLine:/.*            .*/ OR data_win_eventdata_commandLine:/.*            .*/ OR data_win_eventdata_commandLine:/.*            .*/ OR data_win_eventdata_commandLine:/.*            .*/ OR data_win_eventdata_commandLine:/.*            .*/ OR data_win_eventdata_commandLine:/.*            .*/ OR data_win_eventdata_commandLine:/.*            .*/ OR data_win_eventdata_commandLine:/.*            .*/ OR data_win_eventdata_commandLine:/.*            .*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d487ed4a-fd24-436d-a0b2-f4e95f7b2635
    name: Suspicious ClickFix/FileFix Execution Pattern
    reason: Same lure family, detects the command content pasted via Run dialog
  - id: b5b29e4e-31fa-4fdf-b058-296e7a1aa0c2
    name: Suspicious FileFix Execution Pattern
    reason: FileFix variant pasting into the Explorer address bar
  - id: f5fe36cf-f1ec-4c23-903d-09a3110f6bbb
    name: Potential ClickFix Execution Pattern - Registry
    reason: RunMRU registry value records the pasted command just before execution
  - id: 7a1b4c5e-8f3d-4b9a-7c2e-1f4a5b8c6d9e
    name: Suspicious Space Characters in RunMRU Registry Path - ClickFix
    reason: Registry evidence of the same whitespace padding
  - id: 8f2a5c3d-9e4b-4a7c-8d1f-2e5a6b9c3d7e
    name: Suspicious Space Characters in TypedPaths Registry Path - FileFix
    reason: Registry evidence of padding in File Explorer address bar
  - id: 4fee3d51-8069-4a4c-a0f7-924fcaff2c70
    name: FileFix - Command Evidence in TypedPaths
    reason: TypedPaths holds the pasted command
  - id: a7df0e9e-91a5-459a-a003-4cde67c2ff5d
    name: Potentially Suspicious Command Executed Via Run Dialog Box - Registry
    reason: Run dialog usage preceding the padded command
  - id: c11aecef-9c37-45a6-9c07-bc0782f963fd
    name: RunMRU Registry Key Deletion
    reason: Attackers clean RunMRU after the paste to remove evidence
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Script interpreters launched by explorer
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Pp]ower[Ss]hell|[Pp]wsh|[Cc]md|[Mm]shta|[Ww]script|[Cc]script)\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Download cradles and encoded commands
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*([Ii]nvoke-[Ww]eb[Rr]equest|[Ii][Ee][Xx]|[Dd]ownload[Ss]tring|[Cc]url|[Bb]its[Aa]dmin|[Cc]ertutil).*/ OR data_win_eventdata_commandLine:/.* -[Ee]nc.*/)
    pivot_on: host
    window: 2h
  - name: Payload files created in user-writable paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(\\[Tt]emp\\|\\[Dd]ownloads\\|\\[Aa]pp[Dd]ata\\|\\[Pp]rogram[Dd]ata\\).*\.(exe|dll|ps1|js|hta|msi|zip)/
    pivot_on: host
    window: 2h
  - name: Network connections by interpreters and LOLBins
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Pp]ower[Ss]hell|[Pp]wsh|[Mm]shta|[Rr]undll32|[Cc]url|[Ww]script|[Cc]script)\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Persistence via run keys
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*(CurrentVersion\\Run|CurrentVersion\\RunOnce).*/
    pivot_on: host
    window: 4h
