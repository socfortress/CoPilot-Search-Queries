name: Process Memory Dump Via Dotnet-Dump
id: 53d8d3e1-ca33-4012-adf3-e05a4d652e34
version: 1
schema_version: "1.0"
date: "2023-03-14"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 53d8d3e1-ca33-4012-adf3-e05a4d652e34
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of "dotnet-dump" with the "collect" flag. The execution
  could indicate potential process dumping of critical processes such as LSASS.
  MITRE ATT&CK: T1218.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\dotnet-dump.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "dotnet-dump.dll"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*collect*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\dotnet-dump.exe'; data_win_eventdata_originalFileName equals
  'dotnet-dump.dll'; data_win_eventdata_commandLine matches '*collect*'.

known_false_positives: >
  Process dumping is the expected behavior of the tool. So false positives are
  expected in legitimate usage. The PID/Process Name of the process being dumped
  needs to be investigated. Baseline expected activity in your environment and
  tune this detection before relying on it for automated response.

references:
  - https://learn.microsoft.com/en-us/dotnet/core/diagnostics/dotnet-dump#dotnet-dump-collect
  - https://twitter.com/bohops/status/1635288066909966338
  - https://attack.mitre.org/techniques/T1218/

response:
  message: >
    Process Memory Dump Via Dotnet-Dump detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1218
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218
  custom_tags:
    - memory
    - dotnet
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Dd][Oo][Tt][Nn][Ee][Tt]-[Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Dd][Oo][Tt][Nn][Ee][Tt]-[Dd][Uu][Mm][Pp]\.[Dd][Ll][Ll]/) AND data_win_eventdata_commandLine:/.*[Cc][Oo][Ll][Ll][Ee][Cc][Tt].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 5afee48e-67dd-4e03-a783-f74259dcf998
    name: Potential LSASS Process Dump Via Procdump
    reason: Alternative signed dumper tool used for the same LSASS goal.
  - id: 515c8be5-e5df-4c5e-8f6d-a4a2f05e4b48
    name: CreateDump Process Dump
    reason: Another .NET-runtime dumper abused for the same purpose.
  - id: 9257c05b-4a4a-48e5-a670-b7b073cf401b
    name: Binary Proxy Execution Via Dotnet-Trace.EXE
    reason: Sibling dotnet diagnostic tool abused by the same operators.
  - id: a5a2d357-1ab8-4675-a967-ef9990a59391
    name: LSASS Process Memory Dump Files
    reason: Dump output expected after collect.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Dump files written
    query: data_win_system_eventID:11 AND (data_win_eventdata_targetFilename:*.dmp OR data_win_eventdata_targetFilename:*.dump OR data_win_eventdata_targetFilename:*.bin)
    pivot_on: host
    window: 2h
  - name: Process access to LSASS
    query: data_win_system_eventID:10 AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 4h
  - name: Dotnet diagnostic tool install or use
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*[Dd]otnet.*tool.*install.*/ OR data_win_eventdata_commandLine:/.*dotnet-(dump|trace|gcdump).*/)
    pivot_on: host
    window: 6h
  - name: Dump archived or exfiltrated
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*[Rr]ar.*\.dmp.*/ OR data_win_eventdata_commandLine:/.*7z.*\.dmp.*/ OR data_win_eventdata_commandLine:/.*[Cc]ompress-[Aa]rchive.*/ OR data_win_eventdata_commandLine:/.*[Cc]url.* -[Tt] .*/)
    pivot_on: host
    window: 4h
