 .*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/ OR data_win_eventdata_commandLine:/.*\.[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg]\(.*/ OR data_win_eventdata_commandLine:/.*\.[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee]\(.*/ OR data_win_eventdata_commandLine:/.* \/[Tt][Ii][Cc][Kk][Ee][Tt]:.*/ OR data_win_eventdata_commandLine:/.*[Dd][Pp][Aa][Pp][Ii]::.*/ OR data_win_eventdata_commandLine:/.*[Ee][Vv][Ee][Nn][Tt]::[Cc][Ll][Ee][Aa][Rr].*/ OR data_win_eventdata_commandLine:/.*[Ee][Vv][Ee][Nn][Tt]::[Dd][Rr][Oo][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ii][Dd]::[Mm][Oo][Dd][Ii][Ff][Yy].*/ OR data_win_eventdata_commandLine:/.*[Kk][Ee][Rr][Bb][Ee][Rr][Oo][Ss]::.*/ OR data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Dd][Uu][Mm][Pp]::.*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Ss][Cc]::.*/ OR data_win_eventdata_commandLine:/.*[Pp][Rr][Ii][Vv][Ii][Ll][Ee][Gg][Ee]::.*/ OR data_win_eventdata_commandLine:/.*[Rr][Pp][Cc]::.*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa]::.*/ OR data_win_eventdata_commandLine:/.*[Ss][Ii][Dd]::.*/ OR data_win_eventdata_commandLine:/.*[Tt][Oo][Kk][Ee][Nn]::.*/ OR data_win_eventdata_commandLine:/.*[Vv][Aa][Uu][Ll][Tt]::[Cc][Rr][Ee][Dd].*/ OR data_win_eventdata_commandLine:/.*[Vv][Aa][Uu][Ll][Tt]::[Ll][Ii][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.* [Pp]::[Dd] .*/ OR data_win_eventdata_commandLine:/.*;[Ii][Ee][Xx]\(.*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/) AND _exists_:data_win_eventdata_commandLine AND _exists_:data_win_eventdata_image AND _exists_:data_win_eventdata_parentCommandLine AND _exists_:data_win_eventdata_parentImage AND NOT ((data_win_eventdata_commandLine:/.*[Pp][Ii][Nn][Gg].*/ AND data_win_eventdata_commandLine:/.*127\.0\.0\.1.*/ AND data_win_eventdata_commandLine:/.* -[Nn] .*/) OR (data_win_eventdata_image:/.*\\[P