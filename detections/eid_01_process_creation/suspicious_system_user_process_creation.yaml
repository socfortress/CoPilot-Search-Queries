correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 590a5f4c-6c8c-4f10-8307-89afe9453a9d
    name: Suspicious Child Process Created as System
    reason: Service-account parents producing SYSTEM children is the token-theft/impersonation mechanism behind this alert.
  - id: 178e615d-e666-498b-9630-9ed363038101
    name: Elevated System Shell Spawned From Uncommon Parent Location
    reason: Same SYSTEM shell viewed from the parent-location angle.
  - id: 7c0dcd3d-acf8-4f71-9570-f448b0034f94
    name: PsExec Service Child Process Execution as LOCAL SYSTEM
    reason: psexec -s is a common route to SYSTEM-context suspicious commands.
  - id: 15619216-e993-4721-b590-4c520615a67d
    name: Potential Meterpreter/CobaltStrike Activity
    reason: getsystem named-pipe service launches produce exactly these SYSTEM processes.
  - id: 9bd04a79-dabe-4f1f-a5ff-92430265c96b
    name: Privilege Escalation via Named Pipe Impersonation
    reason: Pipe impersonation is the mechanism that hands the attacker a SYSTEM token.
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: The rule's own keywords (sekurlsa, lsadump, token) are Mimikatz modules run as SYSTEM.
  - id: 5afee48e-67dd-4e03-a783-f74259dcf998
    name: Potential LSASS Process Dump Via Procdump
    reason: The -ma flag flagged here is procdump LSASS dumping, the common SYSTEM-context credential step.
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: vssadmin delete shadows as SYSTEM signals ransomware preparation following privilege escalation.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: LSASS access with dump-capable rights
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*(\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_grantedAccess:/0[Xx]1[01]10/ OR data_win_eventdata_grantedAccess:/0[Xx]1[Ff][Ff][Ff][Ff][Ff]/ OR data_win_eventdata_grantedAccess:/0[Xx]14[13][0Aa]/)
    pivot_on: host
    window: 2h
  - name: Registry hive and NTDS export for offline credential cracking
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Rr][Ee][Gg] [Ss][Aa][Vv][Ee].*/ OR data_win_eventdata_commandLine:/.*[Hh][Kk][Ll][Mm]\\[Ss][Aa][Mm].*/ OR data_win_eventdata_commandLine:/.*[Hh][Kk][Ll][Mm]\\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy].*/ OR data_win_eventdata_commandLine:/.*[Ee][Ss][Ee][Nn][Tt][Uu][Tt][Ll].*/ OR data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll].*/ OR data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt].*/)
    pivot_on: host
