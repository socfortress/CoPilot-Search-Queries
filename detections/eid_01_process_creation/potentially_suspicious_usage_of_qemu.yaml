name: Potentially Suspicious Usage Of Qemu
id: 5fc297ae-25b6-488a-8f25-cc12ac29b744
version: 1
schema_version: "1.0"
date: "2024-06-03"
author: Muhammad Faisal (@faisalusuf), Hunter Juhan (@threatHNTR)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 5fc297ae-25b6-488a-8f25-cc12ac29b744
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potentially suspicious execution of the Qemu utility in a Windows
  environment. Threat actors have leveraged this utility and this technique for
  achieving network access as reported by Kaspersky. MITRE ATT&CK: T1090, T1572.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-m 1M*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-m 2M*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-m 3M*"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*restrict=off*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*-netdev *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*connect=*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*-nographic*"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_commandLine"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* -cdrom *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* type=virt *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* -blockdev *"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches '*-m
  1M*'; data_win_eventdata_commandLine matches '*-m 2M*';
  data_win_eventdata_commandLine matches '*-m 3M*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://securelist.com/network-tunneling-with-qemu/111803/
  - https://www.qemu.org/docs/master/system/invocation.html#hxtool-5
  - https://attack.mitre.org/techniques/T1090/
  - https://attack.mitre.org/techniques/T1572/

response:
  message: >
    Potentially Suspicious Usage Of Qemu detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1090,
    T1572
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1090
    - T1572
  custom_tags:
    - process_creation
    - sysmon
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*-[Mm] 1[Mm].*/ OR data_win_eventdata_commandLine:/.*-[Mm] 2[Mm].*/ OR data_win_eventdata_commandLine:/.*-[Mm] 3[Mm].*/) AND data_win_eventdata_commandLine:/.*[Rr][Ee][Ss][Tt][Rr][Ii][Cc][Tt]=[Oo][Ff][Ff].*/ AND data_win_eventdata_commandLine:/.*-[Nn][Ee][Tt][Dd][Ee][Vv] .*/ AND data_win_eventdata_commandLine:/.*[Cc][Oo][Nn][Nn][Ee][Cc][Tt]=.*/ AND data_win_eventdata_commandLine:/.*-[Nn][Oo][Gg][Rr][Aa][Pp][Hh][Ii][Cc].*/ AND _exists_:data_win_eventdata_commandLine AND NOT (data_win_eventdata_commandLine:/.* -[Cc][Dd][Rr][Oo][Mm] .*/ OR data_win_eventdata_commandLine:/.* [Tt][Yy][Pp][Ee]=[Vv][Ii][Rr][Tt] .*/ OR data_win_eventdata_commandLine:/.* -[Bb][Ll][Oo][Cc][Kk][Dd][Ee][Vv] .*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b7b19cb6-9b32-4fc4-a108-73f19acfe262
    name: Suspicious VBoxDrvInst.exe Parameters
    reason: 'Same virtualization-tooling abuse: staging a hypervisor/driver on the host to run attacker workloads hidden from EDR'
  - id: 9a019ffc-3580-4c9d-8d87-079f7e8d3fd4
    name: Cloudflared Tunnel Execution
    reason: Alternative reverse tunnel used by the same actors for C2/network access; co-occurs as redundancy for the Qemu tunnel
  - id: 327f48c1-a6db-4eb8-875a-f6981f1b0183
    name: Port Forwarding Activity Via SSH.EXE
    reason: Qemu -netdev socket connect= is a tunnel to an external endpoint; SSH port forwarding is the sibling tunneling technique
  - id: 8b0e12da-d3c3-49db-bb4f-256703f380e5
    name: PUA - Chisel Tunneling Tool Execution
    reason: Dedicated tunneling tool commonly dropped alongside or instead of Qemu to proxy traffic into the network
  - id: 8a3038e8-9c9d-46f8-b184-66234a160f6f
    name: Potential Remote Desktop Tunneling
    reason: Tunnel to RDP/internal services is the usual purpose of the Qemu network bridge; follow-on lateral access
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Tunneling and proxy tool launches
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Pp]link.*/ OR data_win_eventdata_commandLine:/.*[Cc]hisel.*/ OR data_win_eventdata_commandLine:/.*[Cc]loudflared.*/ OR data_win_eventdata_commandLine:/.*[Nn]etsh.*[Pp]ort[Pp]roxy.*/ OR data_win_eventdata_commandLine:/.*[Nn]grok.*/ OR data_win_eventdata_commandLine:/.*[Ss]sh .* -[RrLlDd] .*/)
    pivot_on: host
    window: 4h
  - name: Qemu or virtual disk image dropped/launched
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Qq][Ee][Mm][Uu].*/ OR data_win_eventdata_commandLine:/.*[Qq][Ee][Mm][Uu]-system.*/ OR data_win_eventdata_commandLine:/.*\.(qcow2|vmdk|vdi|vhdx?).*/)
    pivot_on: host
    window: 24h
  - name: Virtualization or Hyper-V feature enabling
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Mm].*[Ee]nable-[Ff]eature.*[Hh]yper-?[Vv].*/ OR data_win_eventdata_commandLine:/.*[Bb][Cc][Dd][Ee][Dd][Ii][Tt].*[Hh]ypervisor.*/ OR data_win_eventdata_commandLine:/.*[Vv][Bb]ox[Mm]anage.*/ OR data_win_eventdata_commandLine:/.*[Vv][Bb]ox[Dd]rv[Ii]nst.*/)
    pivot_on: host
    window: 24h
  - name: Firewall rule or scheduled task added for persistence
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Nn]etsh.*[Aa]dvfirewall.*[Aa]dd.*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss].*\/[Cc][Rr][Ee][Aa][Tt][Ee].*/)
    pivot_on: host
    window: 6h
  - name: Discovery after tunnel established
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Nn]et1? (view|group|user|localgroup).*/ OR data_win_eventdata_commandLine:/.*[Nn][Ll][Tt][Ee][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Aa]rp -a.*/ OR data_win_eventdata_commandLine:/.*[Ii]pconfig \/all.*/)
    pivot_on: host
    window: 4h
