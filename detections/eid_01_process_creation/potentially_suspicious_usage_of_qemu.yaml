name: Potentially Suspicious Usage Of Qemu
id: 5fc297ae-25b6-488a-8f25-cc12ac29b744
version: 1
schema_version: "1.0"
date: "2024-06-03"
author: Muhammad Faisal (@faisalusuf), Hunter Juhan (@threatHNTR)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 5fc297ae-25b6-488a-8f25-cc12ac29b744
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potentially suspicious execution of the Qemu utility in a Windows
  environment. Threat actors have leveraged this utility and this technique for
  achieving network access as reported by Kaspersky. MITRE ATT&CK: T1090, T1572.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-m 1M*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-m 2M*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-m 3M*"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*restrict=off*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*-netdev *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*connect=*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*-nographic*"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_commandLine"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* -cdrom *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* type=virt *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* -blockdev *"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches '*-m
  1M*'; data_win_eventdata_commandLine matches '*-m 2M*';
  data_win_eventdata_commandLine matches '*-m 3M*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://securelist.com/network-tunneling-with-qemu/111803/
  - https://www.qemu.org/docs/master/system/invocation.html#hxtool-5
  - https://attack.mitre.org/techniques/T1090/
  - https://attack.mitre.org/techniques/T1572/

response:
  message: >
    Potentially Suspicious Usage Of Qemu detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1090,
    T1572
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1090
    - T1572
  custom_tags:
    - process_creation
    - sysmon
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*-[Mm] 1[Mm].*/ OR data_win_eventdata_commandLine:/.*-[Mm] 2[Mm].*/ OR data_win_eventdata_commandLine:/.*-[Mm] 3[Mm].*/) AND data_win_eventdata_commandLine:/.*[Rr][Ee][Ss][Tt][Rr][Ii][Cc][Tt]=[Oo][Ff][Ff].*/ AND data_win_eventdata_commandLine:/.*-[Nn][Ee][Tt][Dd][Ee][Vv] .*/ AND data_win_eventdata_commandLine:/.*[Cc][Oo][Nn][Nn][Ee][Cc][Tt]=.*/ AND data_win_eventdata_commandLine:/.*-[Nn][Oo][Gg][Rr][Aa][Pp][Hh][Ii][Cc].*/ AND _exists_:data_win_eventdata_commandLine AND NOT (data_win_eventdata_commandLine:/.* -[Cc][Dd][Rr][Oo][Mm] .*/ OR data_win_eventdata_commandLine:/.* [Tt][Yy][Pp][Ee]=[Vv][Ii][Rr][Tt] .*/ OR data_win_eventdata_commandLine:/.* -[Bb][Ll][Oo][Cc][Kk][Dd][Ee][Vv] .*/)

correlation:
  # Authored by the correlation engine for review. Related CoPilot Searches to run
  # around an alert from this rule, scoped to the same host/user/IP within the window.
  related_rules:
    - id: 75bf09fa-1dd7-4d18-9af9-dd9e492562eb
      name: "ADSI-Cache File Creation By Uncommon Tool"
      reason: "next kill-chain tactic: Command and Control"
    - id: 639c9081-f482-47d3-a0bd-ddee3d4ecd76
      name: "All Backups Deleted Via Wbadmin.EXE"
      reason: "next kill-chain tactic: Impact"
    - id: 0b9ad457-2554-44c1-82c2-d56a99c42377
      name: "Anydesk Temporary Artefact"
      reason: "next kill-chain tactic: Command and Control"
    - id: 7cff77e1-9663-46a3-8260-17f2e1aa9d0a
      name: "AppX Package Installation Attempts Via AppInstaller.EXE"
      reason: "next kill-chain tactic: Command and Control"
    - id: 1f0f6176-6482-4027-b151-00071af39d7e
      name: "Arbitrary File Download Via ConfigSecurityPolicy.EXE"
      reason: "next kill-chain tactic: Exfiltration"
    - id: eee00933-a761-4cd0-be70-c42fe91731e7
      name: "Arbitrary File Download Via GfxDownloadWrapper.EXE"
      reason: "next kill-chain tactic: Command and Control"
  window: 1h
  enrichment_searches:
  # NEW ad-hoc searches the engine runs around an alert from this rule, scoped to
  # the alert's host/user/IP within the window (not existing CoPilot Searches).
    - name: "Sysmon activity on this host in the window"
      query: 'data_win_system_channel:"Microsoft-Windows-Sysmon/Operational"'
      pivot_on: [host]
      window: 1h
    - name: "Process creation on this host"
      query: 'data_win_system_eventID:"1"'
      pivot_on: [host]
      window: 1h
    - name: "Network connections from this host"
      query: 'data_win_system_eventID:"3"'
      pivot_on: [host]
      window: 1h
    - name: "High-severity alerts on this host"
      query: 'rule_level:>=10'
      pivot_on: [host]
      window: 1h
