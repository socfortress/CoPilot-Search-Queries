name: Windows ConHost with Headless Argument
id: windows-conhost-headless-argument-001
version: 1
schema_version: "1.0"
date: "2026-02-23"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects conhost.exe invoked with the undocumented --headless parameter, 
  enabling stealthy command execution without a visible console window. This 
  technique is used in spearphishing attacks and post-exploitation to execute 
  commands invisibly.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - wildcard:
            data_win_eventdata_commandLine: "*--headless*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-23 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-23 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Windows endpoints with Sysmon 
  installed and configured to log process creation events (EventID 1) including 
  conhost.exe. Verify conhost.exe is not excluded in Sysmon config and that 
  Wazuh forwards these events.

known_false_positives: >
  Some legitimate applications may use the --headless parameter. Filter by user 
  or endpoint as needed.

references:
  - https://attack.mitre.org/techniques/T1564/003/
  - https://x.com/embee_research/status/1559410767564181504

response:
  message: >
    ConHost with --headless argument on $agent_name$. 
    Command: $data_win_eventdata_commandLine$. 
    Parent: $data_win_eventdata_parentImage$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1564.003
  risk_score: 72
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 72
  threat_objects: []

tags:
  analytic_story:
    - Spearphishing Attachments
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1564.003
    - T1564.006
  custom_tags:
    - conhost
    - headless
    - stealth_execution
    - defense_evasion
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*--headless.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 056c7317-9a09-4bd4-9067-d051312752ea
    name: Powershell Executed From Headless ConHost Process
    reason: 'Direct follow-on: the hidden payload is typically PowerShell launched under headless conhost.'
  - id: dfa03a09-8b92-4d83-8e74-f72839b1c407
    name: Potentially Suspicious Child Processes Spawned by ConHost
    reason: Children launched by conhost are the real payload hidden by --headless.
  - id: 7dc2dedd-7603-461a-bc13-15803d132355
    name: Uncommon Child Process Of Conhost.EXE
    reason: Uncommon conhost children reveal what ran invisibly.
  - id: cbb9e3d1-2386-4e59-912e-62f1484f7a89
    name: Conhost Spawned By Uncommon Parent Process
    reason: Identifies the spearphish/script parent that launched conhost.
  - id: ee5e119b-1f75-4b34-add8-3be976961e39
    name: Conhost.exe CommandLine Path Traversal
    reason: Conhost command-line evasion variant used in similar chains.
  - id: 5a6b7c8d-9e0f-1a2b-3c4d-5e6f7a8b9c0d
    name: Cmd Launched with Hidden Start Flags to Suspicious Targets
    reason: Another invisible-execution wrapper often paired in the same chain.
  - id: 30e92f50-bb5a-4884-98b5-d20aa80f3d7a
    name: Hidden Powershell in Link File Pattern
    reason: Spearphishing LNK delivery that commonly starts the headless conhost chain.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Children of conhost
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Cc]onhost\.exe/
    pivot_on: host
    window: 2h
  - name: Parent launching conhost
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Cc]onhost\.exe/ AND data_win_eventdata_parentImage:/.*(WINWORD|EXCEL|OUTLOOK|wscript|cscript|mshta|explorer|powershell|cmd)\.exe/
    pivot_on: host
    window: 2h
  - name: Download cradles and encoded PowerShell
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(IEX|Invoke-Expression|DownloadString|DownloadFile|Invoke-WebRequest|FromBase64String| -[Ee]nc).*/
    pivot_on: host
    window: 2h
  - name: Outbound connections from script hosts
    query: data_win_system_eventID:3 AND data_win_eventdata_initiated:true AND data_win_eventdata_image:/.*(powershell|pwsh|cmd|mshta|wscript|cscript|curl)\.exe/
    pivot_on: host
    window: 2h
  - name: Scheduled task persistence
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*[Ss]chtasks.*\/[Cc]reate.*/
    pivot_on: host
    window: 4h
