name: Potential CobaltStrike Process Patterns
id: f35c5d71-b489-4e22-a115-f003df287317
version: 1
schema_version: "1.0"
date: "2023-03-29"
author: Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: f35c5d71-b489-4e22-a115-f003df287317
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential process patterns related to Cobalt Strike beacon activity.
  MITRE ATT&CK: T1059.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*cmd.exe /C whoami"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_parentImage:
                          value: "C:\\\\Temp\\\\*"
                          case_insensitive: true
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_parentImage:
                                value: "*\\\\runonce.exe"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_parentImage:
                                value: "*\\\\dllhost.exe"
                                case_insensitive: true
                        minimum_should_match: 1
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*cmd.exe /c echo*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*> \\\\\\\\.\\\\pipe*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_parentCommandLine:
                          value: "*cmd.exe /C echo*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_parentCommandLine:
                          value: "* > \\\\\\\\.\\\\pipe*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*conhost.exe 0xffffffff -ForceV1"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_parentCommandLine:
                          value: "*/C whoami"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*conhost.exe 0xffffffff -ForceV1"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_parentCommandLine
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*cmd.exe /C whoami'; data_win_eventdata_parentImage matches 'C:\Temp\*';
  data_win_eventdata_parentImage matches '*\runonce.exe', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://hausec.com/2021/07/26/cobalt-strike-and-tradecraft/
  - https://thedfirreport.com/2021/08/29/cobalt-strike-a-defenders-guide/
  - https://attack.mitre.org/techniques/T1059/

response:
  message: >
    Potential CobaltStrike Process Patterns detected on host $agent_name$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
    Matched data_win_eventdata_parentImage: $data_win_eventdata_parentImage$.
    MITRE ATT&CK: T1059
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_parentImage
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059
  custom_tags:
    - cobaltstrike
    - patterns
    - process_creation
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND ((data_win_eventdata_commandLine:/.*[Cc][Mm][Dd]\.[Ee][Xx][Ee] \/[Cc] [Ww][Hh][Oo][Aa][Mm][Ii]/ AND data_win_eventdata_parentImage:/[Cc]:\\[Tt][Ee][Mm][Pp]\\.*/) OR ((data_win_eventdata_parentImage:/.*\\[Rr][Uu][Nn][Oo][Nn][Cc][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Dd][Ll][Ll][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Cc][Mm][Dd]\.[Ee][Xx][Ee] \/[Cc] [Ee][Cc][Hh][Oo].*/ AND data_win_eventdata_commandLine:/.*\> \\\\\.\\[Pp][Ii][Pp][Ee].*/) OR (data_win_eventdata_parentCommandLine:/.*[Cc][Mm][Dd]\.[Ee][Xx][Ee] \/[Cc] [Ee][Cc][Hh][Oo].*/ AND data_win_eventdata_parentCommandLine:/.* \> \\\\\.\\[Pp][Ii][Pp][Ee].*/ AND data_win_eventdata_commandLine:/.*[Cc][Oo][Nn][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee] 0[Xx][Ff][Ff][Ff][Ff][Ff][Ff][Ff][Ff] -[Ff][Oo][Rr][Cc][Ee][Vv]1/) OR (data_win_eventdata_parentCommandLine:/.*\/[Cc] [Ww][Hh][Oo][Aa][Mm][Ii]/ AND data_win_eventdata_commandLine:/.*[Cc][Oo][Nn][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee] 0[Xx][Ff][Ff][Ff][Ff][Ff][Ff][Ff][Ff] -[Ff][Oo][Rr][Cc][Ee][Vv]1/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 85adeb13-4fc9-4e68-8a4a-c7cb2c336eb7
    name: CobaltStrike Named Pipe Patterns
    reason: The beacon's SMB/post-ex named pipes (echo > pipe, getsystem) are what this process pattern sets up; pipe creation on the same host confirms Cobalt Strike.
  - id: d5601f8c-b26f-4ab0-9035-69e11a8d4ad2
    name: CobaltStrike Named Pipe
    reason: Default Cobalt Strike pipe names created by the same implant that spawned these cmd/conhost patterns.
  - id: 9bd04a79-dabe-4f1f-a5ff-92430265c96b
    name: Privilege Escalation via Named Pipe Impersonation
    reason: '''cmd /c echo ... > pipe'' is the getsystem named-pipe impersonation technique; this rule is its privilege-escalation twin.'
  - id: 6309645e-122d-4c5b-bb2b-22e4f9c2fa42
    name: HackTool - Potential CobaltStrike Process Injection
    reason: Beacon post-exploitation injects into other processes; remote thread creation follows the whoami/getsystem checks.
  - id: 15619216-e993-4721-b590-4c520615a67d
    name: Potential Meterpreter/CobaltStrike Activity
    reason: Generic Meterpreter/Cobalt Strike process activity co-occurring on the same host.
  - id: 647c7b9e-d784-4fda-b9a0-45c565a7b729
    name: Operator Bloopers Cobalt Strike Commands
    reason: Operator typos/commands from the same Cobalt Strike session show up as extra process-creation hits.
  - id: f356a9c4-effd-4608-bbf8-408afd5cd006
    name: Suspicious Cobalt Strike DNS Beaconing - Sysmon
    reason: If the beacon uses a DNS channel, Cobalt Strike DNS beaconing queries are the C2 transport of this implant.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Named pipe creation/connection around the beacon
    query: data_win_system_eventID:(17 OR 18) AND data_win_eventdata_pipeName:(/.*[Mm][Ss][Ss][Ee]-.*/ OR /.*[Pp]ostex.*/ OR /.*[Mm]sagent_.*/ OR /.*[Ss]tatus_.*/ OR /.*[Ww]insock.*/)
    pivot_on: host
    window: 2h
  - name: Process injection via remote thread in the window
    query: data_win_system_eventID:8
    pivot_on: host
    window: 2h
  - name: Discovery commands from cmd/conhost after beacon check-in
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ww]hoami.*/ OR /.*[Nn]et[ .]+(user|group|localgroup|view).*/ OR /.*[Nn]ltest.*/ OR /.*[Ii]pconfig.*/)
    pivot_on: host
    window: 2h
  - name: LSASS access for credential theft after foothold
    query: data_win_system_eventID:10 AND data_win_eventdata_targetImage:/.*[Ll]sass\.exe/
    pivot_on: host
    window: 4h
  - name: Outbound connections by rundll32/dllhost/wermgr
    query: data_win_system_eventID:3 AND data_win_eventdata_image:(/.*[Rr]undll32\.exe/ OR /.*[Dd]llhost\.exe/ OR /.*[Ww]ermgr\.exe/) AND data_win_eventdata_initiated:true
    pivot_on: host
    window: 4h
