name: Suspicious Download Via Certutil.EXE
id: 19b08b1c-861d-4e75-a1ef-ea0c1baf202b
version: 1
schema_version: "1.0"
date: "2025-12-01"
author: Florian Roth (Nextron Systems), Jonhnathan Ribeiro, oscd.community, Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 19b08b1c-861d-4e75-a1ef-ea0c1baf202b
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of certutil with certain flags that allow the utility to
  download files. MITRE ATT&CK: T1027, T1105.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\certutil.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "CertUtil.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*urlcache *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*verifyctl *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*URL *"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*http*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\certutil.exe'; data_win_eventdata_originalFileName equals 'CertUtil.exe';
  data_win_eventdata_commandLine matches '*urlcache *', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/certutil
  - https://forensicitguy.github.io/agenttesla-vba-certutil-download/
  - https://news.sophos.com/en-us/2021/04/13/compromised-exchange-server-hosting-cryptojacker-targeting-other-exchange-servers/
  - https://twitter.com/egre55/status/1087685529016193025
  - https://lolbas-project.github.io/lolbas/Binaries/Certutil/
  - https://www.hexacorn.com/blog/2020/08/23/certutil-one-more-gui-lolbin
  - https://attack.mitre.org/techniques/T1027/
  - https://attack.mitre.org/techniques/T1105/

response:
  message: >
    Suspicious Download Via Certutil.EXE detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1027, T1105
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1027
    - T1105
  custom_tags:
    - download
    - certutil
    - process_creation
    - sysmon
    - stealth
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*[Uu][Rr][Ll][Cc][Aa][Cc][Hh][Ee] .*/ OR data_win_eventdata_commandLine:/.*[Vv][Ee][Rr][Ii][Ff][Yy][Cc][Tt][Ll] .*/ OR data_win_eventdata_commandLine:/.*[Uu][Rr][Ll] .*/) AND data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 0dba975d-a193-4ed1-a067-424df57570d1
    name: Uncommon Network Connection Initiated By Certutil.EXE
    reason: Sysmon network event confirming certutil connected out (destination IP/port)
  - id: cc9cbe82-7bc0-4ef5-bc23-bbfb83947be7
    name: File Decoded From Base64/Hex Via Certutil.EXE
    reason: Downloaded base64 blob is typically decoded with certutil -decode next
  - id: 82a6714f-4899-4f16-9c1e-9a333544d4c3
    name: File In Suspicious Location Encoded To Base64 Via Certutil.EXE
    reason: Certutil encoding of staged files, seen with obfuscation/exfil around the download
  - id: d2125259-ddea-4c1c-9c22-977eb5b29cf0
    name: New Root Certificate Installed Via Certutil.EXE
    reason: Same tool abused for trust manipulation by the same operator
  - id: 74babdd6-a758-4549-9632-26535279e654
    name: Suspicious Executable File Creation
    reason: Downloaded payload landing as an executable in an abnormal path
  - id: 025bd229-fd1f-4fdb-97ab-20006e1a5368
    name: Unusual File Download from Direct IP Address
    reason: Zone.Identifier showing file origin when certutil pulled from a raw IP
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Certutil decode/encode and URL-cache activity
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll].*(-[Dd][Ee][Cc][Oo][Dd][Ee]|-[Dd][Ee][Cc][Oo][Dd][Ee][Hh][Ee][Xx]|-[Ee][Nn][Cc][Oo][Dd][Ee]|-[Uu][Rr][Ll][Cc][Aa][Cc][Hh][Ee]|-[Vv][Ee][Rr][Ii][Ff][Yy][Cc][Tt][Ll]).*/
    pivot_on:
    - host
    window: 2h
  - name: Executable or script dropped to a staging path
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\([Tt]emp|[Pp]ublic|[Pp]rogram[Dd]ata|[Aa]pp[Dd]ata)\\.*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Pp][Ss]1|[Bb][Aa][Tt]|[Vv][Bb][Ss]|[Jj][Ss]|[Ss][Cc][Rr])/
    pivot_on:
    - host
    window: 1h
  - name: Execution from staging paths launched by a shell or script host
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\([Pp]ower[Ss]hell|[Cc]md|[Ww]script|[Cc]script|[Mm]shta)\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Tt]emp|[Pp]ublic|[Pp]rogram[Dd]ata|[Aa]pp[Dd]ata)\\.*\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Outbound connections by certutil and other download tools
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:/[Tt][Rr][Uu][Ee]/ AND data_win_eventdata_image:/.*\\([Bb]itsadmin|[Cc]ertutil|[Cc]url|[Pp]ower[Ss]hell)\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: Persistence via Run key or scheduled task
    query: (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Cc]urrent[Vv]ersion\\[Rr]un.*/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Gg] [Aa][Dd][Dd].*\\[Rr][Uu][Nn].*/))
    pivot_on:
    - host
    window: 4h
