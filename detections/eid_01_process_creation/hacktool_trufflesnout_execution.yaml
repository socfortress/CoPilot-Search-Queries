name: HackTool - TruffleSnout Execution
id: 69ca006d-b9a9-47f5-80ff-ecd4d25d481a
version: 1
schema_version: "1.0"
date: "2023-02-13"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 69ca006d-b9a9-47f5-80ff-ecd4d25d481a
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the use of TruffleSnout.exe an iterative AD discovery toolkit for
  offensive operators, situational awareness and targeted low noise enumeration.
  MITRE ATT&CK: T1482.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - term:
                  data_win_eventdata_originalFileName:
                    value: "TruffleSnout.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\TruffleSnout.exe"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_originalFileName
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_originalFileName equals
  'TruffleSnout.exe'; data_win_eventdata_image matches '*\TruffleSnout.exe'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/40b77d63808dd4f4eafb83949805636735a1fd15/atomics/T1482/T1482.md
  - https://github.com/dsnezhkov/TruffleSnout
  - https://github.com/dsnezhkov/TruffleSnout/blob/7c2f22e246ef704bc96c396f66fa854e9ca742b9/TruffleSnout/Docs/USAGE.md
  - https://attack.mitre.org/techniques/T1482/

response:
  message: >
    HackTool - TruffleSnout Execution detected on host $agent_name$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1482
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_originalFileName
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1482
  custom_tags:
    - hacktool
    - trufflesnout
    - process_creation
    - sysmon
    - discovery
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_originalFileName:/[Tt][Rr][Uu][Ff][Ff][Ll][Ee][Ss][Nn][Oo][Uu][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Tt][Rr][Uu][Ff][Ff][Ll][Ee][Ss][Nn][Oo][Uu][Tt]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e92a4287-e072-4a40-9739-370c106bb750
    name: HackTool - SOAPHound Execution
    reason: SOAPHound is another .NET AD collector commonly run in the same recon phase.
  - id: a0bdd2f6-c2ff-11eb-b918-acde48001122
    name: Detect SharpHound Command-Line Arguments
    reason: SharpHound arguments indicate graph-based AD collection alongside TruffleSnout.
  - id: f376c8a7-a2d0-4ddc-aa0c-16c17236d962
    name: HackTool - Bloodhound/Sharphound Execution
    reason: Bloodhound/Sharphound is the usual higher-noise companion to low-noise enumeration.
  - id: 514e7e3e-b3b4-4a67-af60-be20f139198b
    name: PUA - AdFind.EXE Execution
    reason: AdFind execution is overlapping LDAP enumeration of the same domain.
  - id: 41243735-89a7-4c83-bcdd-570aa78f00a1
    name: Domain Controller Discovery with Nltest
    reason: Nltest DC discovery is typical for locating targets before enumeration.
  - id: c3e05466-5f22-11eb-ae93-0242ac130002
    name: NLTest Domain Trust Discovery
    reason: Trust discovery is the other objective of AD discovery (T1482).
  - id: 9f8fc146-1d1a-4dbf-b8fd-dfae15e08541
    name: HackTool - SharpLDAPmonitor Execution
    reason: SharpLDAPmonitor is another LDAP-oriented offensive tool in the same toolset.
  - id: d9367cbb-c2e0-47ce-bdc0-128cb6da898d
    name: HackTool - SharpLdapWhoami Execution
    reason: SharpLdapWhoami is a sibling LDAP situational-awareness tool.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: LDAP/GC/ADWS connections to domain controllers
    query: data_win_system_eventID:"3" AND (data_win_eventdata_destinationPort:"389" OR data_win_eventdata_destinationPort:"636" OR data_win_eventdata_destinationPort:"3268" OR data_win_eventdata_destinationPort:"9389")
    pivot_on: host
    window: 2h
  - name: Built-in domain discovery commands
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Nn][Ll][Tt][Ee][Ss][Tt] /[Dd][Cc][Ll][Ii][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ll][Tt][Ee][Ss][Tt] /[Dd][Oo][Mm][Aa][Ii][Nn]_[Tt][Rr][Uu][Ss][Tt][Ss].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ss][Qq][Uu][Ee][Rr][Yy] .*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt] [Gg][Rr][Oo][Uu][Pp] /[Dd][Oo][Mm][Aa][Ii][Nn].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt] [Uu][Ss][Ee][Rr] /[Dd][Oo][Mm][Aa][Ii][Nn].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt] [Vv][Ii][Ee][Ww] /[Dd][Oo][Mm][Aa][Ii][Nn].*/ OR data_win_eventdata_commandLine:/.*[Gg][Ee][Tt]\-[Aa][Dd][Dd][Oo][Mm][Aa][Ii][Nn].*/ OR data_win_eventdata_commandLine:/.*[Gg][Ee][Tt]\-[Aa][Dd][Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr].*/)
    pivot_on: host
    window: 6h
  - name: Other AD recon tool binaries
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Aa][Dd][Ff][Ii][Nn][Dd]\.[Ee][Xx][Ee]|[Ss][Hh][Aa][Rr][Pp][Hh][Oo][Uu][Nn][Dd]\.[Ee][Xx][Ee]|[Bb][Ll][Oo][Oo][Dd][Hh][Oo][Uu][Nn][Dd]\.[Ee][Xx][Ee]|[Ss][Oo][Aa][Pp][Hh][Oo][Uu][Nn][Dd]\.[Ee][Xx][Ee]|[Aa][Dd][Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\.[Ee][Xx][Ee]|[Aa][Dd][Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]64\.[Ee][Xx][Ee]|[Cc][Ss][Vv][Dd][Ee]\.[Ee][Xx][Ee]|[Ll][Dd][Ii][Ff][Dd][Ee]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 6h
  - name: Lateral movement following enumeration
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Pp][Ss][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]|[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]\.[Ee][Xx][Ee]|[Ww][Ii][Nn][Rr][Ss]\.[Ee][Xx][Ee])/ OR (data_win_eventdata_commandLine:/.*[Ee][Nn][Tt][Ee][Rr]\-[Pp][Ss][Ss][Ee][Ss][Ss][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]\-[Cc][Oo][Mm][Mm][Aa][Nn][Dd].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Ww]\-[Pp][Ss][Ss][Ee][Ss][Ss][Ii][Oo][Nn].*/))
    pivot_on: host
    window: 6h
  - name: Tool binary written to disk
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Tt][Rr][Uu][Ff][Ff][Ll][Ee][Ss][Nn][Oo][Uu][Tt].*/)
    pivot_on: host
    window: 2h
