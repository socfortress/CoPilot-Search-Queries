  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.* \/[Ii]:[Hh][Tt][Tt][Pp]:\/\/1.*/ OR data_win_eventdata_commandLine:/.* \/[Ii]:[Hh][Tt][Tt][Pp]:\/\/2.*/ OR data_win_eventdata_commandLine:/.* \/[Ii]:[Hh][Tt][Tt][Pp]:\/\/3.*/ OR data_win_eventdata_commandLine:/.* \/[Ii]:[Hh][Tt][Tt][Pp]:\/\/4.*/ OR data_win_eventdata_commandLine:/.* \/[Ii]:[Hh][Tt][Tt][Pp]:\/\/5.*/ OR data_win_eventdata_commandLine:/.* \/[Ii]:[Hh][Tt][Tt][Pp]:\/\/6.*/ OR data_win_eventdata_commandLine:/.* \/[Ii]:[Hh][Tt][Tt][Pp]:\/\/7.*/ OR data_win_eventdata_commandLine:/.* \/[Ii]:[Hh][Tt][Tt][Pp]:\/\/8.*/ OR data_win_eventdata_commandLine:/.* \/[Ii]:[Hh][Tt][Tt][Pp]:\/\/9.*/ OR data_win_eventdata_commandLine:/.* \/[Ii]:[Hh][Tt][Tt][Pp][Ss]:\/\/1.*/ OR data_win_eventdata_commandLine:/.* \/[Ii]:[Hh][Tt][Tt][Pp][Ss]:\/\/2.*/ OR data_win_eventdata_commandLine:/.* \/[Ii]:[Hh][Tt][Tt][Pp][Ss]:\/\/3.*/ OR data_win_eventdata_commandLine:/.* \/[Ii]:[Hh][Tt][Tt][Pp][Ss]:\/\/4.*/ OR data_win_eventdata_commandLine:/.* \/[Ii]:[Hh][Tt][Tt][Pp][Ss]:\/\/5.*/ OR data_win_eventdata_commandLine:/.* \/[Ii]:[Hh][Tt][Tt][Pp][Ss]:\/\/6.*/ OR data_win_eventdata_commandLine:/.* \/[Ii]:[Hh][Tt][Tt][Pp][Ss]:\/\/7.*/ OR data_win_eventdata_commandLine:/.* \/[Ii]:[Hh][Tt][Tt][Pp][Ss]:\/\/8.*/ OR data_win_eventdata_commandLine:/.* \/[Ii]:[Hh][Tt][Tt][Pp][Ss]:\/\/9.*/ OR data_win_eventdata_commandLine:/.* -[Ii]:[Hh][Tt][Tt][Pp]:\/\/1.*/ OR data_win_eventdata_commandLine:/.* -[Ii]:[Hh][Tt][Tt][Pp]:\/\/2.*/ OR data_win_eventdata_commandLine:/.* -[Ii]:[Hh][Tt][Tt][Pp]:\/\/3.*/ OR data_win_eventdata_commandLine:/.* -[Ii]:[Hh][Tt][Tt][Pp]:\/\/4.*/ OR data_win_eventdata_commandLine:/.* -[Ii]:[Hh][Tt][Tt][Pp]:\/\/5.*/ OR data_win_eventdata_commandLine:/.* -[Ii]:[Hh][Tt][Tt][Pp]:\/\/6.*/ OR data_win_eventdata_commandLine:/.* -[Ii]:[Hh][Tt][Tt][Pp]:\/\/7.*/ OR data_win_eventdata_commandLine:/.* -[Ii]:[Hh][Tt][Tt][Pp]:\/\/8.*/ OR data_win_eventdata_commandLine:/.* -[Ii]:[Hh][Tt][Tt][Pp]:\/\/9.*/ OR data_win_eventdata_commandLine:/.* -[Ii]:[Hh][Tt][Tt][Pp][Ss]:\/\/1.*/ OR data_win_eventdata_commandLine:/.* -[Ii]:[Hh][Tt][Tt][Pp][Ss]:\/\/2.*/ OR data_win_eventdata_commandLine:/.* -[Ii]:[Hh][Tt][Tt][Pp][Ss]:\/\/3.*/ OR data_win_eventdata_commandLine:/.* -[Ii]:[Hh][Tt][Tt][Pp][Ss]:\/\/4.*/ OR data_win_eventdata_commandLine:/.* -[Ii]:[Hh][Tt][Tt][Pp][Ss]:\/\/5.*/ OR data_win_eventdata_commandLine:/.* -[Ii]:[Hh][Tt][Tt][Pp][Ss]:\/\/6.*/ OR data_win_eventdata_commandLine:/.* -[Ii]:[Hh][Tt][Tt][Pp][Ss]:\/\/7.*/ OR data_win_eventdata_commandLine:/.* -[Ii]:[Hh][Tt][Tt][Pp][Ss]:\/\/8.*/ OR data_win_eventdata_commandLine:/.* -[Ii]:[Hh][Tt][Tt][Pp][Ss]:\/\/9.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 867356ee-9352-41c9-a8f2-1be690d78216
    name: Potentially Suspicious Regsvr32 HTTP/FTP Pattern
    reason: Broader http/ftp regsvr32 /i pattern; same technique with a hostname instead of an IP.
  - id: 070e9b80-6252-11eb-ae93-0242ac130002
    name: Detect Regsvr32 Application Control Bypass
    reason: Squiblydoo scrobj.dll application-control bypass, same technique family.
  - id: c7e91a02-d771-4a6d-a700-42587e0b1095
    name: Network Connection Initiated By Regsvr32.EXE
    reason: regsvr32 outbound connection to the raw IP serving the payload.
  - id: 6f0947a4-1c5e-4e0d-8ac7-53159b8f23ca
    name: Potentially Suspicious Child Process Of Regsvr32
    reason: Post-exploitation child processes spawned by regsvr32.
  - id: ab37a6ec-6068-432b-a64e-2c7bf95b1d22
    name: Scripting/CommandLine Process Spawned Regsvr32
    reason: Script or shell interpreter that launched regsvr32.
  - id: 327ff235-94eb-4f06-b9de-aaee571324be
    name: Regsvr32 Execution From Highly Suspicious Location
    reason: 'Local-staging variant: regsvr32 executing DLLs from highly suspicious locations after download.'
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: regsvr32 connections
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*regsvr32\.exe/
    pivot_on: host
    window: 2h
  - name: regsvr32 child processes
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*regsvr32\.exe/
    pivot_on: host
    window: 2h
  - name: Direct-IP download tooling
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*https?:\/\/[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}.*/ AND data_win_eventdata_image:/.*(powershell|certutil|bitsadmin|curl|mshta|rundll32)\.exe/
    pivot_on: host
    window: 4h
  - name: Executables or DLLs dropped in user-writable paths
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\\(Users|ProgramData|Temp)\\.*\.(dll|exe|sct)/
    pivot_on: host
    window: 4h
