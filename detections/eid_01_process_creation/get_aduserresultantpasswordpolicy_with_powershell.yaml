name: Get ADUserResultantPasswordPolicy with Powershell
id: 8b5ef342-065a-11ec-b0fc-acde48001122
version: 1
schema_version: "1.0"
date: "2026-04-27"
author: SOCFortress LLC
status: production
type: TTP

description: >
  This analytic detects the execution of powershell.exe, pwsh.exe, or
  cmd.exe with the Get-ADUserResultantPasswordPolicy cmdlet referenced
  in the command line. Sysmon EventID 1 is used to match process
  creation events where the image or OriginalFileName is one of the
  PowerShell or Command Prompt binaries AND the command line contains
  Get-ADUserResultantPasswordPolicy. This cmdlet is part of the
  ActiveDirectory PowerShell module and returns the effective (resultant)
  password policy applied to a specific user account, taking into
  account both the default domain policy and any Fine-Grained Password
  Policies (FGPP) that may apply. This activity is significant because
  it indicates targeted enumeration of per-user password policy
  settings - useful for adversaries during the discovery phase to
  identify accounts with weak password requirements (long expiration,
  no lockout, no complexity) that are best suited for password
  spraying or brute-force attacks. This is a known T1201 (Password
  Policy Discovery) technique documented in CISA AA23-347A. If
  confirmed malicious, this could allow attackers to understand
  per-account password policies, identify the most attackable accounts,
  and tune their credential attacks to evade lockout protections.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image: "*cmd.exe"
              - wildcard:
                  data_win_eventdata_image: "*powershell*.exe"
              - wildcard:
                  data_win_eventdata_image: "*pwsh.exe"
              - term:
                  data_win_eventdata_originalFileName: "Cmd.Exe"
              - term:
                  data_win_eventdata_originalFileName: "PowerShell.EXE"
              - term:
                  data_win_eventdata_originalFileName: "pwsh.dll"
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*Get-ADUserResultantPasswordPolicy*"
              case_insensitive: true
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_parentCommandLine
    - data_win_eventdata_user
    - data_win_eventdata_processId
    - data_win_eventdata_processGuid
    - data_win_eventdata_parentProcessId
    - data_win_eventdata_parentProcessGuid
    - data_win_eventdata_hashes
    - data_win_eventdata_integrityLevel
    - data_win_eventdata_currentDirectory

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-27 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-27 23:59:59.999"

how_to_implement: >
  This detection requires Sysmon EventID 1 (Process Creation) logs to be forwarded
  from Windows endpoints to Wazuh Indexer. Ensure Sysmon is deployed with a
  configuration that captures Image, OriginalFileName, and CommandLine fields
  (SwiftOnSecurity or Olaf Hartong Sysmon modular config recommended). The
  detection matches Windows shells (PowerShell or Command Prompt) by Image
  path or PE OriginalFileName, combined with the
  Get-ADUserResultantPasswordPolicy cmdlet name in the command line.
  Case-insensitive matching is used on the cmdlet name to handle
  PowerShell's flexible casing. The ES DSL uses case_insensitive
  wildcard option (OpenSearch 2.x / Elasticsearch 7.10+); Graylog
  equivalent uses character classes. For deeper coverage, also enable
  PowerShell Script Block Logging (EventID 4104) and correlate against
  the same cmdlet name in script blocks.

known_false_positives: >
  System administrators, helpdesk staff, or domain admins may
  legitimately use Get-ADUserResultantPasswordPolicy for AD audit,
  Fine-Grained Password Policy troubleshooting, or compliance
  reporting. Review the parent process lineage (legitimate admin
  session vs. unexpected parent), user context (admin account vs.
  standard user vs. service account), and timing to distinguish
  authorized administrative activity from reconnaissance. Concurrent
  use of multiple AD discovery cmdlets and password policy queries on
  a single host within a short window should be treated as
  high-priority regardless of user context.

references:
  - https://attack.mitre.org/techniques/T1201/
  - https://github.com/S1ckB0y1337/Active-Directory-Exploitation-Cheat-Sheet
  - https://docs.microsoft.com/en-us/powershell/module/activedirectory/get-aduserresultantpasswordpolicy
  - https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-347a

response:
  message: >
    PowerShell Get-ADUserResultantPasswordPolicy reconnaissance was
    identified on endpoint $agent_name$ by user
    $data_win_eventdata_user$. Process image: $data_win_eventdata_image$.
    Parent process: $data_win_eventdata_parentImage$. Command line:
    $data_win_eventdata_commandLine$. This is consistent with targeted
    per-user password policy discovery commonly preceding tuned
    password spraying or brute-force attacks; investigate parent
    process lineage and concurrent AD discovery activity.
  risk_score: 56
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
    - field: data_win_eventdata_user
      type: user
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process_name
    - field: data_win_eventdata_parentImage
      type: parent_process_name
    - field: data_win_eventdata_commandLine
      type: command_line

tags:
  analytic_story:
    - Active Directory Discovery
    - CISA AA23-347A
    - Active Directory Reconnaissance
    - Password Policy Discovery
  asset_type: Endpoint
  mitre_attack_id:
    - T1201
  custom_tags:
    - powershell
    - active_directory
    - password_policy_discovery
    - ad_enumeration
    - reconnaissance
    - password_spraying_precursor
    - fgpp
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Cc][Mm][Dd]\.exe.*/ OR data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*\.exe.*/ OR data_win_eventdata_image:/.*[Pp][Ww][Ss][Hh]\.exe.*/ OR data_win_eventdata_originalFileName:"Cmd.Exe" OR data_win_eventdata_originalFileName:"PowerShell.EXE" OR data_win_eventdata_originalFileName:"pwsh.dll") AND data_win_eventdata_commandLine:/.*[Gg][Ee][Tt]\-[Aa][Dd][Uu][Ss][Ee][Rr][Rr][Ee][Ss][Uu][Ll][Tt][Aa][Nn][Tt][Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd][Pp][Oo][Ll][Ii][Cc][Yy].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 737e1eb0-065a-11ec-921a-acde48001122
    name: Get ADUserResultantPasswordPolicy with Powershell Script Block
    reason: Same cmdlet captured in script block logging, confirming the full invocation
  - id: 36e46ebe-065a-11ec-b4c7-acde48001122
    name: Get ADDefaultDomainPasswordPolicy with Powershell
    reason: Attackers read the default policy first, then the per-user resultant policy for specific targets
  - id: b8f9947e-065a-11ec-aafb-acde48001122
    name: Get DomainPolicy with Powershell
    reason: PowerView variant of the same policy lookup
  - id: 1114e048-b69c-4f41-bc20-657245ae6e3f
    name: User Discovery And Export Via Get-ADUser Cmdlet
    reason: A resultant-policy query names a target user, typically picked from a Get-ADUser listing
  - id: 96c982fe-3d08-4df4-bed2-eb14e02f21c8
    name: Get-ADUser Enumeration Using UserAccountControl Flags
    reason: Hunting accounts with weak flags to choose which users to query or attack
  - id: 70bc5215-526f-4477-963c-a47a5c9ebd12
    name: Potential Active Directory Enumeration Using AD Module - ProcCreation
    reason: Same module-based reconnaissance session
  - id: bac9fb54-2da7-44e9-988f-11e9a5edbc0c
    name: Potential Password Spraying Attempt Using Dsacls.EXE
    reason: Spraying follows once per-user lockout rules are known
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Password-spraying / credential-guessing tooling
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Dd][Oo][Mm][Aa][Ii][Nn][Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd][Ss][Pp][Rr][Aa][Yy]|[Ii][Nn][Vv][Oo][Kk][Ee]\-[Ss][Pp][Rr][Aa][Yy][Ee][Mm][Pp][Tt][Yy][Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd]|[Kk][Ee][Rr][Bb][Rr][Uu][Tt][Ee]|[Cc][Rr][Aa][Cc][Kk][Mm][Aa][Pp][Ee][Xx][Ee][Cc]|[Ss][Pp][Rr][Aa][Yy][Hh][Oo][Uu][Nn][Dd]|[Ii][Nn][Vv][Oo][Kk][Ee]\-[Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll][Ss][Pp][Rr][Aa][Yy]).*/
    pivot_on: host
    window: 4h
  - name: Failed logons and Kerberos pre-auth failures
    query: data_win_system_eventID:(4625 OR 4771 OR 4776)
    pivot_on: ip
    window: 4h
  - name: AD user, group and computer enumeration cmdlets
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Gg][Ee][Tt]\-[Aa][Dd][Uu][Ss][Ee][Rr]|[Gg][Ee][Tt]\-[Aa][Dd][Gg][Rr][Oo][Uu][Pp][Mm][Ee][Mm][Bb][Ee][Rr]|[Gg][Ee][Tt]\-[Aa][Dd][Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr]|[Gg][Ee][Tt]\-[Aa][Dd][Tt][Rr][Uu][Ss][Tt]|[Gg][Ee][Tt]\-[Aa][Dd][Ff][Oo][Rr][Ee][Ss][Tt]|[Gg][Ee][Tt]\-[Aa][Dd][Dd][Oo][Mm][Aa][Ii][Nn]|[Gg][Ee][Tt]\-[Aa][Dd][Oo][Bb][Jj][Ee][Cc][Tt]|[Gg][Ee][Tt]\-[Aa][Dd][Gg][Rr][Oo][Uu][Pp]).*/
    pivot_on: host
    window: 2h
  - name: PowerView and domain recon tooling
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Gg][Ee][Tt]\-[Dd][Oo][Mm][Aa][Ii][Nn][Uu][Ss][Ee][Rr]|[Gg][Ee][Tt]\-[Dd][Oo][Mm][Aa][Ii][Nn][Gg][Rr][Oo][Uu][Pp]|[Gg][Ee][Tt]\-[Dd][Oo][Mm][Aa][Ii][Nn][Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr]|[Gg][Ee][Tt]\-[Dd][Oo][Mm][Aa][Ii][Nn][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ll][Ee][Rr]|[Gg][Ee][Tt]\-[Dd][Oo][Mm][Aa][Ii][Nn][Tt][Rr][Uu][Ss][Tt]|[Gg][Ee][Tt]\-[Nn][Ee][Tt][Uu][Ss][Ee][Rr]|[Gg][Ee][Tt]\-[Nn][Ee][Tt][Dd][Oo][Mm][Aa][Ii][Nn]|[Gg][Ee][Tt]\-[Nn][Ee][Tt][Gg][Rr][Oo][Uu][Pp]|[Ff][Ii][Nn][Dd]\-[Ll][Oo][Cc][Aa][Ll][Aa][Dd][Mm][Ii][Nn][Aa][Cc][Cc][Ee][Ss][Ss]|[Ii][Nn][Vv][Oo][Kk][Ee]\-[Uu][Ss][Ee][Rr][Hh][Uu][Nn][Tt][Ee][Rr]|[Ii][Nn][Vv][Oo][Kk][Ee]\-[Ss][Hh][Aa][Rr][Ee][Ff][Ii][Nn][Dd][Ee][Rr]|[Ii][Nn][Vv][Oo][Kk][Ee]\-[Kk][Ee][Rr][Bb][Ee][Rr][Oo][Aa][Ss][Tt]|[Gg][Ee][Tt]\-[Dd][Oo][Mm][Aa][Ii][Nn][Ss][Pp][Nn][Tt][Ii][Cc][Kk][Ee][Tt]).*/
    pivot_on: host
    window: 2h
  - name: Credential-theft commands
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz]|[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa]|[Ll][Ss][Aa][Dd][Uu][Mm][Pp]|[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll]|[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp]|[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll]|[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn] [Cc][Rr][Ee][Aa][Tt][Ee] [Ss][Hh][Aa][Dd][Oo][Ww]|[Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt]|[Rr][Uu][Bb][Ee][Uu][Ss]).*/
    pivot_on: host
    window: 4h
