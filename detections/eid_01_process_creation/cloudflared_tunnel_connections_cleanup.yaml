name: Cloudflared Tunnel Connections Cleanup
id: 7050bba1-1aed-454e-8f73-3f46f09ce56a
version: 1
schema_version: "1.0"
date: "2023-12-21"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 7050bba1-1aed-454e-8f73-3f46f09ce56a
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of the "cloudflared" tool with the tunnel "cleanup" flag in
  order to cleanup tunnel connections. MITRE ATT&CK: T1102, T1090, T1572.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* tunnel *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*cleanup *"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-config *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-connector-id *"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches '*
  tunnel *'; data_win_eventdata_commandLine matches '*cleanup *';
  data_win_eventdata_commandLine matches '*-config *', among other conditions.

known_false_positives: >
  Legitimate usage of Cloudflared. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://github.com/cloudflare/cloudflared
  - https://developers.cloudflare.com/cloudflare-one/connections/connect-apps
  - https://attack.mitre.org/techniques/T1102/
  - https://attack.mitre.org/techniques/T1090/
  - https://attack.mitre.org/techniques/T1572/

response:
  message: >
    Cloudflared Tunnel Connections Cleanup detected on host $agent_name$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1102, T1090, T1572
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1102
    - T1090
    - T1572
  custom_tags:
    - cloudflared
    - tunnel
    - connections
    - process_creation
    - sysmon
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.* [Tt][Uu][Nn][Nn][Ee][Ll] .*/ AND data_win_eventdata_commandLine:/.*[Cc][Ll][Ee][Aa][Nn][Uu][Pp] .*/ AND (data_win_eventdata_commandLine:/.*-[Cc][Oo][Nn][Ff][Ii][Gg] .*/ OR data_win_eventdata_commandLine:/.*-[Cc][Oo][Nn][Nn][Ee][Cc][Tt][Oo][Rr]-[Ii][Dd] .*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 9a019ffc-3580-4c9d-8d87-079f7e8d3fd4
    name: Cloudflared Tunnel Execution
    reason: Cleanup targets connections of a tunnel previously run with the same config or connector id.
  - id: fadb84f0-4e84-4f6d-a1ce-9ef2bffb6ccd
    name: Cloudflared Portable Execution
    reason: The cloudflared binary used for cleanup is often a portable copy outside Program Files.
  - id: 222129f7-f4dc-4568-b0d2-22440a9639ba
    name: Cloudflared Quick Tunnel Execution
    reason: Possible earlier ad-hoc tunnel by the same operator.
  - id: ccad96d7-a48c-4f13-8b9c-9f6a31cba454
    name: Detect Remote Access Software Usage FileInfo
    reason: Actors who stage cloudflared usually layer other remote-access tooling on the same host as redundant access.
  - id: 32e0baea-b3f1-11eb-a2ce-acde48001122
    name: Detect RClone Command-Line Usage
    reason: Akira-style intrusions pair a tunnel with rclone to exfiltrate data over the established channel.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Prior cloudflared tunnel run or service install
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Cc][Ll][Oo][Uu][Dd][Ff][Ll][Aa][Rr][Ee]d?.*([Tt][Uu][Nn][Nn][Ee][Ll] [Rr][Uu][Nn]|[Ss][Ee][Rr][Vv][Ii][Cc][Ee] [Ii][Nn][Ss][Tt][Aa][Ll][Ll]|--[Tt][Oo][Kk][Ee][Nn]).*/
    pivot_on: host
    window: 24h
  - name: Cloudflared config or credentials files created
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*([Cc][Ll][Oo][Uu][Dd][Ff][Ll][Aa][Rr][Ee]d?\.[Yy][Mm][Ll]|[Cc][Ll][Oo][Uu][Dd][Ff][Ll][Aa][Rr][Ee].*\.[Jj][Ss][Oo][Nn]|[Cc][Ee][Rr][Tt]\.[Pp][Ee][Mm]).*/
    pivot_on: host
    window: 24h
  - name: Cloudflared service registry entries
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss].*[Cc][Ll][Oo][Uu][Dd][Ff][Ll][Aa][Rr][Ee].*/
    pivot_on: host
    window: 24h
  - name: Cloudflared network connections to Cloudflare edge
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*[Cc][Ll][Oo][Uu][Dd][Ff][Ll][Aa][Rr][Ee].*/ OR data_win_eventdata_destinationHostname:/.*([Tt][Rr][Yy])?[Cc][Ll][Oo][Uu][Dd][Ff][Ll][Aa][Rr][Ee].*/ OR data_win_eventdata_destinationPort:"7844")
    pivot_on: host
    window: 6h
