name: Shell Process Spawned by Java.EXE
id: dff1e1cc-d3fd-47c8-bfc2-aeb878a754c0
version: 1
schema_version: "1.0"
date: "2024-01-18"
author: Andreas Hunkeler (@Karneades), Nasreddine Bencherchali
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: dff1e1cc-d3fd-47c8-bfc2-aeb878a754c0
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects shell spawned from Java host process, which could be a sign of
  exploitation (e.g. log4j exploitation).

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_parentImage:
              value: "*\\\\java.exe"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\bash.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\cmd.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\powershell.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\pwsh.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_parentImage"
        - exists:
            field: "data_win_eventdata_commandLine"
        - bool:
            must_not:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_parentImage:
                          value: "*build*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*build*"
                          case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\java.exe'; data_win_eventdata_image matches '*\bash.exe';
  data_win_eventdata_image matches '*\cmd.exe', among other conditions.

known_false_positives: >
  Legitimate calls to system binaries. Company specific internal usage. Baseline
  expected activity in your environment and tune this detection before relying
  on it for automated response.

references:
  - https://web.archive.org/web/20231230220738/https://www.lunasec.io/docs/blog/log4j-zero-day/

response:
  message: >
    Shell Process Spawned by Java.EXE detected on host $agent_name$. Matched
    data_win_eventdata_parentImage: $data_win_eventdata_parentImage$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - shell
    - spawned
    - process_creation
    - sysmon
    - initial_access
    - persistence
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Jj][Aa][Vv][Aa]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_image:/.*\\[Bb][Aa][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/) AND _exists_:data_win_eventdata_parentImage AND _exists_:data_win_eventdata_commandLine AND NOT (data_win_eventdata_parentImage:/.*[Bb][Uu][Ii][Ll][Dd].*/ AND data_win_eventdata_commandLine:/.*[Bb][Uu][Ii][Ll][Dd].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7c97c625-0350-4f0a-8943-f6cadc88125e
    name: Mint Sandstorm - Log4J Wstomcat Process Execution
    reason: Log4Shell exploitation on Java apps yields exactly this shell-from-java pattern.
  - id: 1ddaa9a4-eb0b-4398-a9fe-7b018f9e23db
    name: CVE-2023-22518 Exploitation Attempt - Suspicious Confluence Child Process (Windows)
    reason: Java server RCE (Confluence) spawning child shells; same exploitation shape.
  - id: 245f92e3-c4da-45f1-9070-bc552e06db11
    name: Potential Atlassian Confluence CVE-2021-26084 Exploitation Attempt
    reason: Java web app RCE leading to shell child processes.
  - id: c248c896-e412-4279-8c15-1c558067b6fa
    name: Enumerate All Information With Whoami.EXE
    reason: First post-exploitation recon command typically run from the new shell.
  - id: d059842b-6b9d-4ed1-b5c3-5b89143c6ede
    name: File Download Via Bitsadmin
    reason: 'Common next step: pulling a second-stage payload from the java-spawned shell.'
  - id: 21dd6d38-2b18-4453-9404-a0fe4a0cc288
    name: Curl Download And Execute Combination
    reason: Download-and-execute follow-on after RCE.
  - id: c4db14d9-7909-48b4-a054-aa14d89dbb19
    name: Malicious PowerShell Process - Encoded Command
    reason: Encoded PowerShell stagers are the usual payload of Java RCE.
  - id: 8f88e3f6-2a49-48f5-a5c4-2f7eedf78710
    name: Java Running with Remote Debugging
    reason: Java exposed with JDWP is an alternate RCE path to the same shell spawn.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Recon commands run from shells
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ww][Hh][Oo][Aa][Mm][Ii]|[Ii][Pp][Cc][Oo][Nn][Ff][Ii][Gg]|[Nn][Ee][Tt]1? [Uu][Ss][Ee][Rr]|[Ss][Yy][Ss][Tt][Ee][Mm][Ii][Nn][Ff][Oo]|[Nn][Ss][Ll][Oo][Oo][Kk][Uu][Pp]).*/ AND data_win_eventdata_parentImage:/.*\\([Cc][Mm][Dd]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh])\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Any java.exe child processes
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Jj][Aa][Vv][Aa][Ww]?\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Payload download cradles
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ii][Ee][Xx]|[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg]|[Uu][Rr][Ll][Cc][Aa][Cc][Hh][Ee]|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn].*\/[Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr]|[Cc][Uu][Rr][Ll].*[Hh][Tt][Tt][Pp]).*/
    pivot_on: host
    window: 4h
  - name: Account creation or admin group changes
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Nn][Ee][Tt]1? ([Uu][Ss][Ee][Rr].*\/[Aa][Dd][Dd]|[Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp].*[Aa][Dd][Mm][Ii][Nn]).*/
    pivot_on: host
    window: 6h
  - name: Persistence via scheduled tasks or services
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss].*\/[Cc][Rr][Ee][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc]\.[Ee][Xx][Ee] [Cc][Rr][Ee][Aa][Tt][Ee].*/)
    pivot_on: host
    window: 6h
