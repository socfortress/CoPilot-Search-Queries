name: Time Travel Debugging Utility Usage
id: 0b4ae027-2a2d-4b93-8c7e-962caaba5b2a
version: 1
schema_version: "1.0"
date: "2022-10-09"
author: Ensar Şamil, @sblmsrsn, @oscd_initiative
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 0b4ae027-2a2d-4b93-8c7e-962caaba5b2a
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects usage of Time Travel Debugging Utility. Adversaries can execute
  malicious processes and dump processes, such as lsass.exe, via tttracer.exe.
  MITRE ATT&CK: T1218, T1003.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_parentImage:
              value: "*\\\\tttracer.exe"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\tttracer.exe'.

known_false_positives: >
  Legitimate usage by software developers/testers. Baseline expected activity in
  your environment and tune this detection before relying on it for automated
  response.

references:
  - https://lolbas-project.github.io/lolbas/Binaries/Tttracer/
  - https://twitter.com/mattifestation/status/1196390321783025666
  - https://twitter.com/oulusoyum/status/1191329746069655553
  - https://attack.mitre.org/techniques/T1218/
  - https://attack.mitre.org/techniques/T1003/001/

response:
  message: >
    Time Travel Debugging Utility Usage detected on host $agent_name$. Matched
    data_win_eventdata_parentImage: $data_win_eventdata_parentImage$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1218,
    T1003.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218
    - T1003.001
  custom_tags:
    - travel
    - debugging
    - utility
    - process_creation
    - sysmon
    - credential_access
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Tt][Tt][Tt][Rr][Aa][Cc][Ee][Rr]\.[Ee][Xx][Ee]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 5ef9853e-4d0e-4a70-846f-a9ca37d876da
    name: Potential Credential Dumping Activity Via LSASS
    reason: tttracer attaching to lsass produces LSASS memory access.
  - id: a18dd26b-6450-46de-8c91-9659150cf088
    name: Potentially Suspicious GrantedAccess Flags On LSASS
    reason: Suspicious access mask on LSASS from the debugger chain.
  - id: 9f5c1d59-33be-4e60-bcab-85d2f566effd
    name: Suspicious Process Access to LSASS with Dbgcore/Dbghelp DLLs
    reason: Debug-DLL based dumping paired with tttracer.
  - id: ffa6861c-4461-4f59-8a41-578c39f3f23e
    name: LSASS Dump Keyword In CommandLine
    reason: Command-line variant of the same intent.
  - id: a5a2d357-1ab8-4675-a967-ef9990a59391
    name: LSASS Process Memory Dump Files
    reason: Trace/dump file output written by tttracer.
  - id: 5afee48e-67dd-4e03-a783-f74259dcf998
    name: Potential LSASS Process Dump Via Procdump
    reason: Alternate dumping tool in the same adversary playbook.
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: Another LOLBin LSASS dump often tried if one method is blocked.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: tttracer executions with target process
    query: data_win_system_eventID:1 AND data_win_eventdata_image:*\\tttracer.exe
    pivot_on: host
    window: 2h
  - name: LSASS process access
    query: data_win_system_eventID:10 AND data_win_eventdata_targetImage:*\\lsass.exe
    pivot_on: host
    window: 2h
  - name: Trace and dump files created
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(*.run OR *.dmp OR *.idx)
    pivot_on: host
    window: 2h
  - name: Other dump tooling
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(*procdump* OR *comsvcs* OR *MiniDump* OR *sekurlsa*)
    pivot_on: host
    window: 2h
  - name: Archiving or copying of dumps
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(*.dmp* OR *.run*) AND data_win_eventdata_image:(*\\7z.exe OR *\\rar.exe OR *\\cmd.exe OR *\\powershell.exe OR *\\tar.exe)
    pivot_on: host
    window: 4h
