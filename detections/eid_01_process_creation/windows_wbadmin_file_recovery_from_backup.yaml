name: Windows WBAdmin File Recovery From Backup
id: windows-wbadmin-file-recovery-from-backup-001
version: 1
schema_version: "1.0"
date: "2026-02-16"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  Detects the execution of wbadmin.exe with arguments indicating file recovery 
  from backup. Adversaries may abuse this to restore sensitive files such as SAM, 
  SYSTEM hives, or previously dropped payloads from prior backups to regain access 
  or re-establish persistence after cleanup.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - wildcard:
            data_win_eventdata_commandLine: "*wbadmin*"
        - wildcard:
            data_win_eventdata_commandLine: "*recovery*"
        - wildcard:
            data_win_eventdata_commandLine: "*itemtype:file*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-16 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-16 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Windows endpoints with Sysmon 
  installed and configured to log process creation events (EventID 1) with full 
  command-line arguments.

known_false_positives: >
  Administrators may use WBAdmin to restore files during approved recovery or 
  testing activities. Validate the user context and whether the recovery was part 
  of an authorized workflow.

references:
  - https://attack.mitre.org/techniques/T1490/
  - https://attack.mitre.org/techniques/T1565/001/
  - https://lolbas-project.github.io/lolbas/Binaries/Wbadmin/

response:
  message: >
    WBAdmin file recovery from backup detected on $agent_name$. 
    Command: $data_win_eventdata_commandLine$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1490, T1565.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects: []

tags:
  analytic_story:
    - Credential Dumping
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1490
    - T1565.001
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*wbadmin.*/ AND data_win_eventdata_commandLine:/.*recovery.*/ AND data_win_eventdata_commandLine:/.*itemtype:file.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 639c9081-f482-47d3-a0bd-ddee3d4ecd76
    name: All Backups Deleted Via Wbadmin.EXE
    reason: Same tool abused in ransomware prep; compare recovery of files with backup deletion on the host.
  - id: 9703792d-fd9a-456d-a672-ff92efe4806a
    name: Backup Catalog Deleted
    reason: Backup tampering by the same actor around the recovery.
  - id: fd877b94-9bb5-4191-bb25-d79cbd93c167
    name: Dumping of Sensitive Hives Via Reg.EXE
    reason: Alternative route to SAM/SYSTEM; the wbadmin restore is used when direct access is blocked.
  - id: d372f928-ce4f-11eb-a762-acde48001122
    name: Esentutl SAM Copy
    reason: Another SAM extraction method that may follow restoring hives.
  - id: c73124a7-3e89-44a3-bdc1-25fe4df754b1
    name: Copy From VolumeShadowCopy Via Cmd.EXE
    reason: Related path to extract locked files from backups or shadow copies.
  - id: da63bc76-61ae-11eb-ae93-0242ac130002
    name: Ntdsutil Export NTDS
    reason: On domain controllers, restored NTDS/SYSTEM files feed credential dumping.
  - id: 1444443e-6757-43e4-9ea4-c8fc705f79a2
    name: Boot Configuration Tampering Via Bcdedit.EXE
    reason: Recovery-inhibition pairing seen in destructive operations.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Registry hive and NTDS extraction
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*reg\.exe/ AND data_win_eventdata_commandLine:/.*(save|export).*(sam|system|security).*/) OR (data_win_eventdata_commandLine:/.*([Nn]tdsutil|[Ee]sentutl|ntds\.dit).*/))
    pivot_on: host
    window: 24h
  - name: Other wbadmin or shadow copy operations
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*(wbadmin|vssadmin|diskshadow|shadowcopy).*/
    pivot_on: host
    window: 24h
  - name: Credential tools after hive restore
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*(secretsdump|mimikatz|samdump|pwdump|hashdump).*/ OR data_win_eventdata_image:/.*(mimikatz|procdump).*/)
    pivot_on: host
    window: 24h
  - name: Archiving or staging of restored files
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*(7z|rar|tar|robocopy|xcopy)\.exe/ OR data_win_eventdata_commandLine:/.*[Cc]ompress-[Aa]rchive.*/)
    pivot_on: host
    window: 24h
