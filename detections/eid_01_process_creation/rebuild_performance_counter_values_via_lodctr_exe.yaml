name: Rebuild Performance Counter Values Via Lodctr.EXE
id: cc9d3712-6310-4320-b2df-7cb408274d53
version: 1
schema_version: "1.0"
date: "2024-03-05"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: cc9d3712-6310-4320-b2df-7cb408274d53
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of "lodctr.exe" to rebuild the performance counter
  registry values. This can be abused by attackers by providing a malicious
  config file to overwrite performance counter configuration to confuse and
  evade monitoring and security solutions.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\lodctr.exe"
              case_insensitive: true
        - term:
            data_win_eventdata_originalFileName:
              value: "LODCTR.EXE"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -r*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /r*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* –r*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* —r*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* ―r*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\lodctr.exe'; data_win_eventdata_originalFileName equals 'LODCTR.EXE';
  data_win_eventdata_commandLine matches '* -r*', among other conditions.

known_false_positives: >
  Legitimate usage by an administrator. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://learn.microsoft.com/en-us/windows/security/identity-protection/virtual-smart-cards/virtual-smart-card-tpmvscmgr

response:
  message: >
    Rebuild Performance Counter Values Via Lodctr.EXE detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  custom_tags:
    - rebuild
    - performance
    - counter
    - process_creation
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ll][Oo][Dd][Cc][Tt][Rr]\.[Ee][Xx][Ee]/ AND data_win_eventdata_originalFileName:/[Ll][Oo][Dd][Cc][Tt][Rr]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.* -[Rr].*/ OR data_win_eventdata_commandLine:/.* \/[Rr].*/ OR data_win_eventdata_commandLine:/.* –[Rr].*/ OR data_win_eventdata_commandLine:/.* —[Rr].*/ OR data_win_eventdata_commandLine:/.* ―[Rr].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 4931188c-178e-4ee7-a348-39e8a7a56821
    name: Filter Driver Unloaded Via Fltmc.EXE
    reason: Both blind monitoring tooling; fltmc unload of Sysmon/EDR drivers often pairs with counter tampering.
  - id: a238b5d0-ce2d-4414-a676-7a531b3d13d6
    name: ETW Trace Evasion Activity
    reason: 'Same defense-evasion goal: degrade telemetry/monitoring on the host.'
  - id: 236e7c8e-c9d9-11eb-a824-acde48001122
    name: Disable Logs Using WevtUtil
    reason: Log disabling is a companion step when an attacker blinds monitoring.
  - id: b28e58e4-2a72-4fae-bdee-0fbe904db642
    name: Windows Defender Real-time Protection Disabled
    reason: AV disabling commonly accompanies monitoring evasion before payload execution.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Performance counter and logging tooling
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*\\(lodctr|unlodctr|wevtutil|logman|typeperf)\.exe/
    pivot_on: host
    window: 4h
  - name: Perflib registry modification
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:*Perflib*
    pivot_on: host
    window: 4h
  - name: Security tooling tampering commands
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:*[Ss]ysmon* OR data_win_eventdata_commandLine:*fltmc* OR data_win_eventdata_commandLine:*[Ss]et-[Mm]p[Pp]reference*)
    pivot_on: host
    window: 4h
  - name: Ini config files written to temp
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\.ini/ AND (data_win_eventdata_targetFilename:*\\Temp\\* OR data_win_eventdata_targetFilename:*\\ProgramData\\*)
    pivot_on: host
    window: 4h
