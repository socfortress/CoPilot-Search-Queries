name: Renamed AutoHotkey.EXE Execution
id: 0f16d9cf-0616-45c8-8fad-becc11b5a41c
version: 1
schema_version: "1.0"
date: "2023-02-07"
author: Nasreddine Bencherchali
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 0f16d9cf-0616-45c8-8fad-becc11b5a41c
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of a renamed autohotkey.exe binary based on PE metadata
  fields.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_product:
                    value: "*AutoHotkey*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_description:
                    value: "*AutoHotkey*"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "AutoHotkey.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "AutoHotkey.rc"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\AutoHotkey.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\AutoHotkey32.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\AutoHotkey32_UIA.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\AutoHotkey64.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\AutoHotkey64_UIA.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\AutoHotkeyA32.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\AutoHotkeyA32_UIA.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\AutoHotkeyU32.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\AutoHotkeyU32_UIA.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\AutoHotkeyU64.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\AutoHotkeyU64_UIA.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\AutoHotkey*"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_product
    - data_win_eventdata_description
    - data_win_eventdata_originalFileName
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_product matches
  '*AutoHotkey*'; data_win_eventdata_description matches '*AutoHotkey*';
  data_win_eventdata_originalFileName equals 'AutoHotkey.exe', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.autohotkey.com/download/
  - https://thedfirreport.com/2023/02/06/collect-exfiltrate-sleep-repeat/

response:
  message: >
    Renamed AutoHotkey.EXE Execution detected on host $agent_name$. Matched
    data_win_eventdata_product: $data_win_eventdata_product$. Matched
    data_win_eventdata_description: $data_win_eventdata_description$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_product
      type: other
    - field: data_win_eventdata_description
      type: other

tags:
  asset_type: Endpoint
  custom_tags:
    - renamed
    - autohotkey
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_product:/.*[Aa][Uu][Tt][Oo][Hh][Oo][Tt][Kk][Ee][Yy].*/ OR data_win_eventdata_description:/.*[Aa][Uu][Tt][Oo][Hh][Oo][Tt][Kk][Ee][Yy].*/ OR data_win_eventdata_originalFileName:/[Aa][Uu][Tt][Oo][Hh][Oo][Tt][Kk][Ee][Yy]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Aa][Uu][Tt][Oo][Hh][Oo][Tt][Kk][Ee][Yy]\.[Rr][Cc]/) AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/.*\\[Aa][Uu][Tt][Oo][Hh][Oo][Tt][Kk][Ee][Yy]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Aa][Uu][Tt][Oo][Hh][Oo][Tt][Kk][Ee][Yy]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Aa][Uu][Tt][Oo][Hh][Oo][Tt][Kk][Ee][Yy]32_[Uu][Ii][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Aa][Uu][Tt][Oo][Hh][Oo][Tt][Kk][Ee][Yy]64\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Aa][Uu][Tt][Oo][Hh][Oo][Tt][Kk][Ee][Yy]64_[Uu][Ii][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Aa][Uu][Tt][Oo][Hh][Oo][Tt][Kk][Ee][Yy][Aa]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Aa][Uu][Tt][Oo][Hh][Oo][Tt][Kk][Ee][Yy][Aa]32_[Uu][Ii][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Aa][Uu][Tt][Oo][Hh][Oo][Tt][Kk][Ee][Yy][Uu]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Aa][Uu][Tt][Oo][Hh][Oo][Tt][Kk][Ee][Yy][Uu]32_[Uu][Ii][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Aa][Uu][Tt][Oo][Hh][Oo][Tt][Kk][Ee][Yy][Uu]64\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Aa][Uu][Tt][Oo][Hh][Oo][Tt][Kk][Ee][Yy][Uu]64_[Uu][Ii][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Aa][Uu][Tt][Oo][Hh][Oo][Tt][Kk][Ee][Yy].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: f4264e47-f522-4c38-a420-04525d5b880f
    name: Renamed AutoIt Execution
    reason: Sibling scripting-runtime masquerade; actors rotate AutoIt and AutoHotkey loaders.
  - id: f8e9aa1c-14f2-4dbd-aa59-b98968ed650d
    name: DarkGate - Autoit3.EXE Execution Parameters
    reason: Commodity loaders ship script interpreters renamed; same delivery pattern.
  - id: 36480ae1-a1cb-4eaa-a0d6-29801d7e9142
    name: Potential Defense Evasion Via Binary Rename
    reason: Generic rename evasion on the same host indicates broader masquerading.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: AHK script files run or dropped
    query: data_win_system_eventID:(1 OR 11) AND (data_win_eventdata_commandLine:/.*\.[Aa][Hh][Kk].*/ OR data_win_eventdata_targetFilename:/.*\.[Aa][Hh][Kk]/)
    pivot_on: host
    window: 2h
  - name: Network connections from user-writable paths
    query: data_win_system_eventID:3 AND data_win_eventdata_image:(/.*\\[Aa]pp[Dd]ata\\.*/ OR /.*\\[Tt]emp\\.*/ OR /.*\\[Pp]rogram[Dd]ata\\.*/ OR /.*\\[Pp]ublic\\.*/)
    pivot_on: host
    window: 2h
  - name: Script host or Office parent launching executables
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:(/.*\\(wscript|cscript|mshta|winword|excel|outlook)\.exe/)
    pivot_on: host
    window: 2h
  - name: Persistence via Run key or startup
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:(/.*\\CurrentVersion\\Run.*/ OR /.*\\Startup.*/)
    pivot_on: host
    window: 2h
