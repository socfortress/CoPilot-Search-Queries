name: New DMSA Service Account Created in Specific OUs
id: 0ea8db81-2ff6-4525-9448-33bbe7effc13
version: 1
schema_version: "1.0"
date: "2025-05-24"
author: Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 0ea8db81-2ff6-4525-9448-33bbe7effc13
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the creation of a dMSASvc account using the New-ADServiceAccount
  cmdlet in certain OUs. The fact that the Cmdlet is used to create a dMSASvc
  account in a specific OU is highly suspicious. It is a pattern trying to
  exploit the BadSuccessor privilege escalation vulnerability in Windows Server
  2025. On top of that, if the user that is creating the dMSASvc account is not
  a legitimate administrator or does not have the necessary permissions, it is a
  strong signal of an attempted or successful abuse of the BaDSuccessor
  vulnerability for privilege escalation within the Windows Server 2025 Active
  Directory environment. MITRE ATT&CK: T1078.002, T1098.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\powershell.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\pwsh.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\powershell_ise.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "powershell.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "pwsh.dll"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "powershell_ise.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*New-ADServiceAccount*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*-CreateDelegatedServiceAccount*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*-path*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\powershell.exe'; data_win_eventdata_image matches '*\pwsh.exe';
  data_win_eventdata_image matches '*\powershell_ise.exe', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.akamai.com/blog/security-research/abusing-bad-successor-for-privilege-escalation-in-active-directory
  - https://attack.mitre.org/techniques/T1078/002/
  - https://attack.mitre.org/techniques/T1098/

response:
  message: >
    New DMSA Service Account Created in Specific OUs detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1078.002, T1098
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1078.002
    - T1098
  custom_tags:
    - service
    - account
    - specific
    - process_creation
    - sysmon
    - privilege_escalation
    - initial_access
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]_[Ii][Ss][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Pp][Ww][Ss][Hh]\.[Dd][Ll][Ll]/ OR data_win_eventdata_originalFileName:/[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]_[Ii][Ss][Ee]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Nn][Ee][Ww]-[Aa][Dd][Ss][Ee][Rr][Vv][Ii][Cc][Ee][Aa][Cc][Cc][Oo][Uu][Nn][Tt].*/ AND data_win_eventdata_commandLine:/.*-[Cc][Rr][Ee][Aa][Tt][Ee][Dd][Ee][Ll][Ee][Gg][Aa][Tt][Ee][Dd][Ss][Ee][Rr][Vv][Ii][Cc][Ee][Aa][Cc][Cc][Oo][Uu][Nn][Tt].*/ AND data_win_eventdata_commandLine:/.*-[Pp][Aa][Tt][Hh].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 70bc5215-526f-4477-963c-a47a5c9ebd12
    name: Potential Active Directory Enumeration Using AD Module - ProcCreation
    reason: AD-module enumeration usually precedes BadSuccessor to find writable OUs and targets to impersonate.
  - id: 435e10e4-992a-4281-96f3-38b11106adde
    name: Computer Discovery And Export Via Get-ADComputer Cmdlet
    reason: Get-ADComputer discovery/export is common reconnaissance before choosing a target to inherit privileges from.
  - id: 455b9d50-15a1-4b99-853f-8d37655a4c1b
    name: PUA - Suspicious ActiveDirectory Enumeration Via AdFind.EXE
    reason: AdFind enumeration of OUs/ACLs finds the delegated OU permissions BadSuccessor needs.
  - id: cd219ff3-fa99-45d4-8380-a7d15116c6dc
    name: New User Created Via Net.EXE
    reason: Alternative persistence/escalation by creating a new account; attacker may combine both.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: AD service-account cmdlet usage
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:*[Nn]ew-[Aa][Dd][Ss]ervice[Aa]ccount* OR data_win_eventdata_commandLine:*[Ss]et-[Aa][Dd][Ss]ervice[Aa]ccount* OR data_win_eventdata_commandLine:*[Mm]igrate*[Ss]ervice[Aa]ccount* OR data_win_eventdata_commandLine:*[Ss]uperseded[Aa]ccount*)
    pivot_on: user
    window: 24h
  - name: Shell with AD module/ADSI manipulation
    query: data_win_system_eventID:1 AND data_win_eventdata_image:*[Pp]ower[Ss]hell* AND (data_win_eventdata_commandLine:*[Ss]et-[Aa][Dd][Oo]bject* OR data_win_eventdata_commandLine:*[Mm]sDS-[Ee]ncrypted* OR data_win_eventdata_commandLine:*[Mm]sDS-[Dd]elegated[Mm][Ss][Aa]*)
    pivot_on: host
    window: 24h
  - name: AD enumeration of OUs and ACLs
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:*[Gg]et-[Aa][Dd][Oo]rganizationalUnit* OR data_win_eventdata_commandLine:*[Gg]et-[Aa]cl* OR data_win_eventdata_commandLine:*[Aa]d[Ff]ind*)
    pivot_on: user
    window: 6h
  - name: Ticket and credential tooling after escalation
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:*[Rr]ubeus* OR data_win_eventdata_commandLine:*[Kk]erberos* OR data_win_eventdata_commandLine:*[Ss]ekurlsa* OR data_win_eventdata_commandLine:*[Dd][Cc][Ss]ync*)
    pivot_on: host
    window: 24h
