name: LOLBIN Execution From Abnormal Drive
id: d4ca7c59-e9e4-42d8-bf57-91a776efcb87
version: 1
schema_version: "1.0"
date: "2023-08-29"
author: Christopher Peacock '@securepeacock', SCYTHE '@scythe_io', Angelo Violetti - SEC Consult '@angelo_violetti', Aaron Herman
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: d4ca7c59-e9e4-42d8-bf57-91a776efcb87
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects LOLBINs executing from an abnormal or uncommon drive such as a mounted
  ISO.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\calc.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\certutil.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\cmstp.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\cscript.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\installutil.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\mshta.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\regsvr32.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\rundll32.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\wscript.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "CALC.EXE"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "CertUtil.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "CMSTP.EXE"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "cscript.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "installutil.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "MSHTA.EXE"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "REGSVR32.EXE"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "RUNDLL32.EXE"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "wscript.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_currentDirectory:
                          value: "*C:\\\\*"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_currentDirectory: ""
                    - bool:
                        must_not:
                          - exists:
                              field: "data_win_eventdata_currentDirectory"
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_currentDirectory
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\calc.exe'; data_win_eventdata_image matches '*\certutil.exe';
  data_win_eventdata_image matches '*\cmstp.exe', among other conditions.

known_false_positives: >
  Rare false positives could occur on servers with multiple drives. Baseline
  expected activity in your environment and tune this detection before relying
  on it for automated response.

references:
  - https://thedfirreport.com/2021/12/13/diavol-ransomware/
  - https://www.scythe.io/library/threat-emulation-qakbot
  - https://sec-consult.com/blog/detail/bumblebee-hunting-with-a-velociraptor/

response:
  message: >
    LOLBIN Execution From Abnormal Drive detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  custom_tags:
    - lolbin
    - abnormal
    - drive
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Cc][Aa][Ll][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Mm][Ss][Tt][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Cc][Aa][Ll][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Cc][Mm][Ss][Tt][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/) AND NOT (data_win_eventdata_currentDirectory:/.*[Cc]:\\.*/ OR data_win_eventdata_currentDirectory:"" OR NOT _exists_:data_win_eventdata_currentDirectory)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 4358e5a5-7542-4dcb-b9f3-87667371839b
    name: ISO or Image Mount Indicator in Recent Files
    reason: Mounting an ISO/image is what creates the abnormal drive letter; a recent-file artefact for the image confirms the container the LOLBIN ran from.
  - id: 2f9356ae-bf43-41b8-b858-4496d83b2acb
    name: ISO File Created Within Temp Folders
    reason: 'Precursor: the ISO delivered by phishing/download is staged in a temp folder before being mounted.'
  - id: 0248a7bc-8a9a-4cd8-a57e-3ae8e073a073
    name: ISO Image Mounted
    reason: 'Security-log record of the mount event that produced the non-C: volume the LOLBIN launched from.'
  - id: fcdf69e5-a3d3-452a-9724-26f2308bf2b1
    name: Phishing Pattern ISO in Archive
    reason: 'Delivery stage: ISO nested in an archive is the classic Qakbot/Bumblebee chain that ends in a LOLBIN off a mounted drive.'
  - id: 8468111a-ef07-4654-903b-b863a80bbc95
    name: VHD Image Download Via Browser
    reason: Alternate container (VHD) downloaded by a browser that mounts as a new drive and hosts the LOLBIN payload.
  - id: e593cf51-88db-4ee1-b920-37e89012a3c9
    name: Potentially Suspicious Rundll32 Activity
    reason: 'Follow-on: rundll32 is the usual proxy that loads the DLL payload shipped on the mounted image.'
  - id: 070e9b80-6252-11eb-ae93-0242ac130002
    name: Detect Regsvr32 Application Control Bypass
    reason: 'Follow-on: regsvr32 loading the payload DLL/scriptlet from the image is a common second step.'
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Image/container files written before mount
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.([Ii][Ss][Oo]|[Ii][Mm][Gg]|[Vv][Hh][Dd][Xx]?|[Ll][Nn][Kk])/
    pivot_on: host
    window: 6h
  - name: 'Process starts from a non-C: drive'
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/[D-Zd-z]:\\.*/
    pivot_on: host
    window: 2h
  - name: Script/shell children of proxy LOLBINs
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\([Rr][Uu][Nn][Dd][Ll][Ll]32.[Ee][Xx][Ee]|[Rr][Ee][Gg][Ss][Vv][Rr]32.[Ee][Xx][Ee]|[Mm][Ss][Hh][Tt][Aa].[Ee][Xx][Ee]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt].[Ee][Xx][Ee]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt].[Ee][Xx][Ee])/ AND data_win_eventdata_image:/.*\\([Cc][Mm][Dd].[Ee][Xx][Ee]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].[Ee][Xx][Ee]|[Pp][Ww][Ss][Hh].[Ee][Xx][Ee]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt].[Ee][Xx][Ee]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt].[Ee][Xx][Ee]|[Mm][Ss][Hh][Tt][Aa].[Ee][Xx][Ee])/
    pivot_on: host
    window: 2h
  - name: Network connections from proxy LOLBINs
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Rr][Uu][Nn][Dd][Ll][Ll]32.[Ee][Xx][Ee]|[Rr][Ee][Gg][Ss][Vv][Rr]32.[Ee][Xx][Ee]|[Mm][Ss][Hh][Tt][Aa].[Ee][Xx][Ee]|[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll].[Ee][Xx][Ee]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt].[Ee][Xx][Ee]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt].[Ee][Xx][Ee])/
    pivot_on: host
    window: 2h
  - name: Persistence or discovery right after
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss].*/ OR data_win_eventdata_commandLine:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ww][Hh][Oo][Aa][Mm][Ii].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ll][Tt][Ee][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt] [Gg][Rr][Oo][Uu][Pp].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt] [Vv][Ii][Ee][Ww].*/ OR data_win_eventdata_commandLine:/.*[Ii][Pp][Cc][Oo][Nn][Ff][Ii][Gg].*/)
    pivot_on: host
    window: 4h
