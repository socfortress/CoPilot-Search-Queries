name: Uncommon Child Process Spawned By Odbcconf.EXE
id: 8e3c7994-131e-4ba5-b6ea-804d49113a26
version: 1
schema_version: "1.0"
date: "2023-05-22"
author: Harjot Singh @cyb3rjy0t
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 8e3c7994-131e-4ba5-b6ea-804d49113a26
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects an uncommon child process of "odbcconf.exe" binary which normally
  shouldn't have any child processes. MITRE ATT&CK: T1218.008.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_parentImage:
              value: "*\\\\odbcconf.exe"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\odbcconf.exe'.

known_false_positives: >
  In rare occurrences where "odbcconf" crashes. It might spawn a "werfault"
  process. Other child processes will depend on the DLL being registered by
  actions like "regsvr". In case where the DLLs have external calls (which
  should be rare). Other child processes might spawn and additional filters need
  to be applied. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://learn.microsoft.com/en-us/sql/odbc/odbcconf-exe?view=sql-server-ver16
  - https://lolbas-project.github.io/lolbas/Binaries/Odbcconf/
  - https://medium.com/@cyberjyot/t1218-008-dll-execution-using-odbcconf-exe-803fa9e08dac
  - https://attack.mitre.org/techniques/T1218/008/

response:
  message: >
    Uncommon Child Process Spawned By Odbcconf.EXE detected on host
    $agent_name$. Matched data_win_eventdata_parentImage:
    $data_win_eventdata_parentImage$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1218.008
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218.008
  custom_tags:
    - uncommon
    - child
    - spawned
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Oo][Dd][Bb][Cc][Cc][Oo][Nn][Ff]\.[Ee][Xx][Ee]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 2d32dd6f-3196-4093-b9eb-1ad8ab088ca5
    name: Suspicious Response File Execution Via Odbcconf.EXE
    reason: Odbcconf response files (-f) carry REGSVR actions that load attacker DLLs before child processes appear.
  - id: 5f03babb-12db-4eec-8c82-7b4cb5580868
    name: Response File Execution Via Odbcconf.EXE
    reason: Generic form of the same response-file precursor to a spawned child.
  - id: ba4cfc11-d0fa-4d94-bf20-7c332c412e76
    name: Potentially Suspicious DLL Registered Via Odbcconf.EXE
    reason: REGSVR of an unusual DLL via odbcconf is the loader step that produces the child process.
  - id: 6b65c28e-11f3-46cb-902a-68f2cafaf474
    name: Odbcconf.EXE Suspicious DLL Location
    reason: A DLL staged in a user-writable path and loaded by odbcconf directly precedes child activity.
  - id: cb0fe7c5-f3a3-484d-aa25-d350a7912729
    name: Suspicious Driver/DLL Installation Via Odbcconf.EXE
    reason: Driver/DLL installation is the alternate loading vector for the same proxy-execution technique.
  - id: e4d22291-f3d5-4b78-9a0c-a1fbaf32a6a4
    name: Potentially Suspicious ODBC Driver Registered
    reason: Registry-side confirmation that a rogue ODBC driver/DLL was registered for persistence.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Odbcconf invocations with REGSVR, response file or DSN actions
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Oo][Dd][Bb][Cc][Cc][Oo][Nn][Ff]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:(/.*[Rr][Ee][Gg][Ss][Vv][Rr].*/ OR /.*[Cc][Oo][Nn][Ff][Ii][Gg][Dd][Ss][Nn].*/ OR /.*\.[Rr][Ss][Pp].*/ OR /.* -[Ff].*/)
    pivot_on: host
    window: 4h
  - name: DLL or response file written to user-writable paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:(/.*\.[Dd][Ll][Ll]/ OR /.*\.[Rr][Ss][Pp]/) AND data_win_eventdata_targetFilename:(/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR /.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR /.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR /.*\\[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]\\.*/)
    pivot_on: host
    window: 4h
  - name: Odbcconf loading a DLL from outside the Windows directory
    query: data_win_system_eventID:"7" AND data_win_eventdata_image:/.*\\[Oo][Dd][Bb][Cc][Cc][Oo][Nn][Ff]\.[Ee][Xx][Ee]/ AND NOT data_win_eventdata_imageLoaded:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\.*/
    pivot_on: host
    window: 2h
  - name: Registry writes to ODBC driver keys
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Oo][Dd][Bb][Cc][Ii][Nn][Ss][Tt].*/
    pivot_on: host
    window: 4h
  - name: Network connections made by odbcconf
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\[Oo][Dd][Bb][Cc][Cc][Oo][Nn][Ff]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
