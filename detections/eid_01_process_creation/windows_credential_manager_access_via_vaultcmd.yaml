name: Windows Credential Manager Access via VaultCmd
id: 58f50261-c53b-4c88-bd12-1d71f12eda4c
version: 1
schema_version: "1.0"
date: "2022-05-13"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 58f50261-c53b-4c88-bd12-1d71f12eda4c
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  List credentials currently stored in Windows Credential Manager via the native
  Windows utility vaultcmd.exe. MITRE ATT&CK: T1555.004.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\VaultCmd.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "VAULTCMD.EXE"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*/listcreds:*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\VaultCmd.exe'; data_win_eventdata_originalFileName equals 'VAULTCMD.EXE';
  data_win_eventdata_commandLine matches '*/listcreds:*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1555.004/T1555.004.md#atomic-test-1---access-saved-credentials-via-vaultcmd
  - https://attack.mitre.org/techniques/T1555/004/

response:
  message: >
    Windows Credential Manager Access via VaultCmd detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1555.004
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1555.004
  custom_tags:
    - credential
    - manager
    - vaultcmd
    - process_creation
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Vv][Aa][Uu][Ll][Tt][Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Vv][Aa][Uu][Ll][Tt][Cc][Mm][Dd]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*\/[Ll][Ii][Ss][Tt][Cc][Rr][Ee][Dd][Ss]:.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 603c6630-5225-49c1-8047-26c964553e0e
    name: Enumerate Credentials from Windows Credential Manager With PowerShell
    reason: Alternative way to list Credential Manager contents; attackers try several methods.
  - id: 99c49d9c-34ea-45f7-84a7-4751ae6b2cbc
    name: Dump Credentials from Windows Credential Manager With PowerShell
    reason: 'Follow-on: moving from listing vault entries to extracting the secrets themselves.'
  - id: windows-credentials-access-vaultcli-module-001
    name: Windows Credentials Access Via Vaultcli Module
    reason: vaultcli.dll loaded by a non-standard process is the in-memory equivalent of vaultcmd listing.
  - id: 07f8bdc2-c9b3-472a-9817-5a670b872f53
    name: Potential Reconnaissance For Cached Credentials Via Cmdkey.EXE
    reason: cmdkey /list is the sibling stored-credential discovery command, often run in the same burst.
  - id: b1ec66c6-f4d1-4b5c-96dd-af28ccae7727
    name: New Generic Credentials Added Via Cmdkey.EXE
    reason: After finding stored creds, attackers may add their own entries.
  - id: e0b0c2ab-3d52-46d9-8cb7-049dc775fbd1
    name: Enumeration for Credentials in Registry
    reason: Credential hunting across other stores (registry) in the same discovery phase.
  - id: cc1abf27-78a3-4ac5-a51c-f3070b1d8e40
    name: Registry Export of Third-Party Credentials
    reason: Parallel harvesting of application credentials from the registry.
  - id: 0f60b28c-64dd-4e2c-9a63-5334d3e3a6e6
    name: Script Interpreter Spawning Credential Scanner - Windows
    reason: Scripted credential hunting that may launch vaultcmd as a child.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Stored credential tools and queries
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Cc][Mm][Dd][Kk][Ee][Yy]|[Vv][Aa][Uu][Ll][Tt][Cc][Mm][Dd])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Gg][Ee][Tt]-[Vv][Aa][Uu][Ll][Tt][Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll].*/ OR data_win_eventdata_commandLine:/.*[Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd][Vv][Aa][Uu][Ll][Tt].*/)
    pivot_on: host
    window: 4h
  - name: vaultcli.dll loaded by unusual processes
    query: data_win_system_eventID:"7" AND data_win_eventdata_imageLoaded:/.*[Vv][Aa][Uu][Ll][Tt][Cc][Ll][Ii].[Dd][Ll][Ll].*/
    pivot_on: host
    window: 4h
  - name: Credential store file access tooling
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ll][Oo][Gg][Ii][Nn] [Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_commandLine:/.*\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\[Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll][Ss].*/ OR data_win_eventdata_commandLine:/.*\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\[Vv][Aa][Uu][Ll][Tt].*/ OR data_win_eventdata_commandLine:/.*[Dd][Pp][Aa][Pp][Ii].*/)
    pivot_on: host
    window: 6h
  - name: Account and credential discovery commands
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Nn][Ee][Tt] [Uu][Ss][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Ww][Hh][Oo][Aa][Mm][Ii] /[Aa][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Kk][Ll][Ii][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Gg] [Qq][Uu][Ee][Rr][Yy].*/)
    pivot_on: user
    window: 4h
