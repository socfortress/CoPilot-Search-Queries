name: PUA - WebBrowserPassView Execution
id: d0dae994-26c6-4d2d-83b5-b3c8b79ae513
version: 1
schema_version: "1.0"
date: "2023-02-14"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: d0dae994-26c6-4d2d-83b5-b3c8b79ae513
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of WebBrowserPassView.exe. A password recovery tool that
  reveals the passwords stored by the following Web browsers, Internet Explorer
  (Version 4.0 - 11.0), Mozilla Firefox (All Versions), Google Chrome, Safari,
  and Opera. MITRE ATT&CK: T1555.003.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - term:
                  data_win_eventdata_description:
                    value: "Web Browser Password Viewer"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\WebBrowserPassView.exe"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_description
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_description equals 'Web
  Browser Password Viewer'; data_win_eventdata_image matches
  '*\WebBrowserPassView.exe'.

known_false_positives: >
  Legitimate use. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/40b77d63808dd4f4eafb83949805636735a1fd15/atomics/T1555.003/T1555.003.md
  - https://attack.mitre.org/techniques/T1555/003/

response:
  message: >
    PUA - WebBrowserPassView Execution detected on host $agent_name$. Matched
    data_win_eventdata_description: $data_win_eventdata_description$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1555.003
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_description
      type: other
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1555.003
  custom_tags:
    - webbrowserpassview
    - process_creation
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_description:/[Ww][Ee][Bb] [Bb][Rr][Oo][Ww][Ss][Ee][Rr] [Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd] [Vv][Ii][Ee][Ww][Ee][Rr]/ OR data_win_eventdata_image:/.*\\[Ww][Ee][Bb][Bb][Rr][Oo][Ww][Ss][Ee][Rr][Pp][Aa][Ss][Ss][Vv][Ii][Ee][Ww]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 8ba484e8-4b97-11ec-b19a-acde48001122
    name: Possible Browser Pass View Parameter
    reason: 'Browser pass view parameters in the command line: same tool family or variant.'
  - id: c2b86e67-b880-4eec-b045-50bc98ef4844
    name: HackTool - LaZagne Execution
    reason: LaZagne also harvests browser passwords; actors chain multiple credential tools.
  - id: 47147b5b-9e17-4d76-b8d2-7bac24c5ce1b
    name: Potential Browser Data Stealing
    reason: Browser data stealing pursues the same objective via other tooling.
  - id: 6a69f62d-ce75-4b57-8dce-6351eb55b362
    name: Esentutl Steals Browser Information
    reason: Esentutl copying browser databases is an alternative browser credential theft path.
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: LSASS dumping commonly follows browser credential theft.
  - id: e328cc73-f92a-42fb-b3fa-7c2cffda981a
    name: Curl File Upload To File Sharing Websites
    reason: Recovered credentials are often exfiltrated via curl upload.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other credential recovery tools
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Ll][Aa][Zz][Aa][Gg][Nn][Ee]|[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz]|[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]|[Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd][Ff][Oo][Xx]|[Cc][Hh][Rr][Oo][Mm][Ee][Pp][Aa][Ss][Ss]|[Ss][Aa][Ff][Aa][Rr][Ii][Pp][Aa][Ss][Ss][Vv][Ii][Ee][Ww])\\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 4h
  - name: Browser credential store access via CLI
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ll][Oo][Gg][Ii][Nn] [Dd][Aa][Tt][Aa]|[Ll][Oo][Gg][Ii][Nn][Ss].[Jj][Ss][Oo][Nn]|[Ww][Ee][Bb] [Dd][Aa][Tt][Aa]|[Kk][Ee][Yy]4.[Dd][Bb]).*/
    pivot_on: host
    window: 4h
  - name: Files written by the credential viewer
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*\\[Ww][Ee][Bb][Bb][Rr][Oo][Ww][Ss][Ee][Rr][Pp][Aa][Ss][Ss][Vv][Ii][Ee][Ww]\\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 4h
  - name: Archiving and exfiltration after harvest
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Cc][Uu][Rr][Ll].*(--[Uu][Pp][Ll][Oo][Aa][Dd]-[Ff][Ii][Ll][Ee]|--[Dd][Aa][Tt][Aa])|[Rr][Aa][Rr].[Ee][Xx][Ee] a|7[Zz].[Ee][Xx][Ee] a).*/
    pivot_on: host
    window: 6h
  - name: Shells launched by script hosts
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\([Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Mm][Ss][Hh][Tt][Aa])\\.[Ee][Xx][Ee]/
    pivot_on: user
    window: 2h
