name: Execution via stordiag.exe
id: 961e0abb-1b1e-4c84-a453-aafe56ad0d34
version: 1
schema_version: "1.0"
date: "2022-12-25"
author: Austin Songer (@austinsonger)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 961e0abb-1b1e-4c84-a453-aafe56ad0d34
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the use of stordiag.exe to execute schtasks.exe systeminfo.exe and
  fltmc.exe. MITRE ATT&CK: T1218.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_parentImage:
              value: "*\\\\stordiag.exe"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\schtasks.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\systeminfo.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\fltmc.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_parentImage"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_parentImage:
                          value: "c:\\\\windows\\\\system32\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_parentImage:
                          value: "c:\\\\windows\\\\syswow64\\\\*"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\stordiag.exe'; data_win_eventdata_image matches '*\schtasks.exe';
  data_win_eventdata_image matches '*\systeminfo.exe', among other conditions.

known_false_positives: >
  Legitimate usage of stordiag.exe. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://strontic.github.io/xcyclopedia/library/stordiag.exe-1F08FC87C373673944F6A7E8B18CD845.html
  - https://twitter.com/eral4m/status/1451112385041911809
  - https://attack.mitre.org/techniques/T1218/

response:
  message: >
    Execution via stordiag.exe detected on host $agent_name$. Matched
    data_win_eventdata_parentImage: $data_win_eventdata_parentImage$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1218
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218
  custom_tags:
    - stordiag
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ss][Tt][Oo][Rr][Dd][Ii][Aa][Gg]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ss][Yy][Ss][Tt][Ee][Mm][Ii][Nn][Ff][Oo]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ff][Ll][Tt][Mm][Cc]\.[Ee][Xx][Ee]/) AND _exists_:data_win_eventdata_parentImage AND NOT (data_win_eventdata_parentImage:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\.*/ OR data_win_eventdata_parentImage:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Ww][Oo][Ww]64\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 4931188c-178e-4ee7-a348-39e8a7a56821
    name: Filter Driver Unloaded Via Fltmc.EXE
    reason: fltmc.exe is one of the three binaries stordiag is abused to launch; filter-driver unloading is the defense-evasion goal.
  - id: 3dfd06d2-eaf4-4532-9555-68aca59f57c4
    name: Process Execution From A Potentially Suspicious Folder
    reason: stordiag copied outside System32 is typically staged from a suspicious folder.
  - id: f53714ec-5077-420e-ad20-907ff9bb2958
    name: Forfiles.EXE Child Process Masquerading
    reason: Same LOLBin child-process masquerading pattern (trusted binary launching a chosen child).
  - id: 8a8379b8-780b-4dbf-b1e9-31c8d112fefb
    name: Schtasks From Suspicious Folders
    reason: schtasks is a stordiag child; task creation from suspicious folders is the persistence follow-on.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: stordiag copied or run outside System32
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*\\[Ss][Tt][Oo][Rr][Dd][Ii][Aa][Gg]\.[Ee][Xx][Ee]/ AND NOT data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\.*/
    pivot_on: host
    window: 4h
  - name: stordiag.exe file dropped
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*[Ss][Tt][Oo][Rr][Dd][Ii][Aa][Gg]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 4h
  - name: Scheduled task creation
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*\/[Cc][Rr][Ee][Aa][Tt][Ee].*/
    pivot_on: host
    window: 6h
  - name: Filter driver unload or Sysmon tampering
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*\\[Ff][Ll][Tt][Mm][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Uu][Nn][Ll][Oo][Aa][Dd].*/
    pivot_on: host
    window: 4h
