name: Suspicious File Encoded To Base64 Via Certutil.EXE
id: ea0cdc3e-2239-4f26-a947-4e8f8224e464
version: 1
schema_version: "1.0"
date: "2024-03-05"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: ea0cdc3e-2239-4f26-a947-4e8f8224e464
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of certutil with the "encode" flag to encode a file to
  base64 where the extensions of the file is suspicious. MITRE ATT&CK: T1027.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\certutil.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "CertUtil.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-encode*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*/encode*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*–encode*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*—encode*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*―encode*"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.acl*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.bat*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.doc*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.gif*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.jpeg*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.jpg*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.mp3*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.pdf*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.png*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.ppt*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.tmp*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.xls*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.xml*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\certutil.exe'; data_win_eventdata_originalFileName equals 'CertUtil.exe';
  data_win_eventdata_commandLine matches '*-encode*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.virustotal.com/gui/file/35c22725a92d5cb1016b09421c0a6cdbfd860fd4778b3313669b057d4a131cb7/behavior
  - https://www.virustotal.com/gui/file/427616528b7dbc4a6057ac89eb174a3a90f7abcf3f34e5a359b7a910d82f7a72/behavior
  - https://www.virustotal.com/gui/file/34de4c8beded481a4084a1fd77855c3e977e8ac643e5c5842d0f15f7f9b9086f/behavior
  - https://www.virustotal.com/gui/file/4abe1395a09fda06d897a9c4eb247278c1b6cddda5d126ce5b3f4f499e3b8fa2/behavior
  - https://attack.mitre.org/techniques/T1027/

response:
  message: >
    Suspicious File Encoded To Base64 Via Certutil.EXE detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1027
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1027
  custom_tags:
    - encoded
    - base64
    - certutil
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*-[Ee][Nn][Cc][Oo][Dd][Ee].*/ OR data_win_eventdata_commandLine:/.*\/[Ee][Nn][Cc][Oo][Dd][Ee].*/ OR data_win_eventdata_commandLine:/.*–[Ee][Nn][Cc][Oo][Dd][Ee].*/ OR data_win_eventdata_commandLine:/.*—[Ee][Nn][Cc][Oo][Dd][Ee].*/ OR data_win_eventdata_commandLine:/.*―[Ee][Nn][Cc][Oo][Dd][Ee].*/) AND (data_win_eventdata_commandLine:/.*\.[Aa][Cc][Ll].*/ OR data_win_eventdata_commandLine:/.*\.[Bb][Aa][Tt].*/ OR data_win_eventdata_commandLine:/.*\.[Dd][Oo][Cc].*/ OR data_win_eventdata_commandLine:/.*\.[Gg][Ii][Ff].*/ OR data_win_eventdata_commandLine:/.*\.[Jj][Pp][Ee][Gg].*/ OR data_win_eventdata_commandLine:/.*\.[Jj][Pp][Gg].*/ OR data_win_eventdata_commandLine:/.*\.[Mm][Pp]3.*/ OR data_win_eventdata_commandLine:/.*\.[Pp][Dd][Ff].*/ OR data_win_eventdata_commandLine:/.*\.[Pp][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*\.[Pp][Pp][Tt].*/ OR data_win_eventdata_commandLine:/.*\.[Tt][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*\.[Xx][Ll][Ss].*/ OR data_win_eventdata_commandLine:/.*\.[Xx][Mm][Ll].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e62a9f0c-ca1e-46b2-85d5-a6da77f86d1a
    name: File Encoded To Base64 Via Certutil.EXE
    reason: Generic variant of the same encode action; overlapping evidence of staging for exfiltration.
  - id: 82a6714f-4899-4f16-9c1e-9a333544d4c3
    name: File In Suspicious Location Encoded To Base64 Via Certutil.EXE
    reason: Same encode technique keyed on source location; shows what data was targeted.
  - id: cc9cbe82-7bc0-4ef5-bc23-bbfb83947be7
    name: File Decoded From Base64/Hex Via Certutil.EXE
    reason: Counterpart decode step when the encoded file is rebuilt elsewhere.
  - id: e328cc73-f92a-42fb-b3fa-7c2cffda981a
    name: Curl File Upload To File Sharing Websites
    reason: Encoded file is typically then uploaded; curl upload is a likely exfil channel.
  - id: windows-archive-collected-data-via-rar-001
    name: Windows Archive Collected Data via Rar
    reason: Collection and compression usually precede encoding for exfiltration.
  - id: 85a8e5ba-bd03-4bfb-bbfa-a4409a8f8b98
    name: Folder Compress To Potentially Suspicious Output Via Compress-Archive Cmdlet
    reason: Staging archive created before encoding and exfiltration.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Archive or compression of collected data
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*(\\[Rr][Aa][Rr]\.[Ee][Xx][Ee]|\\7[Zz]\.[Ee][Xx][Ee]|\\7[Zz][Aa]\.[Ee][Xx][Ee]|\\[Ww][Ii][Nn][Rr][Aa][Rr]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.* [Aa] .*/)) OR (data_win_eventdata_image:/.*(\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]-[Aa][Rr][Cc][Hh][Ii][Vv][Ee].*/)))
    pivot_on: host
    window: 4h
  - name: Upload-capable tools sending files out
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*(\\[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]|\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]|\\[Ff][Tt][Pp]\.[Ee][Xx][Ee]|\\[Ss][Cc][Pp]\.[Ee][Xx][Ee])/) AND (data_win_eventdata_commandLine:/.*-[Tt] .*/ OR data_win_eventdata_commandLine:/.*--[Uu][Pp][Ll][Oo][Aa][Dd]-[Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*-[Ff] .*/ OR data_win_eventdata_commandLine:/.*--[Dd][Aa][Tt][Aa]-[Bb][Ii][Nn][Aa][Rr][Yy].*/ OR data_win_eventdata_commandLine:/.*\/[Uu][Pp][Ll][Oo][Aa][Dd].*/)
    pivot_on: host
    window: 4h
  - name: Certutil activity in any mode
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 4h
  - name: Encoded output written with decoy extensions
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*(\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 2h
  - name: DNS to file-sharing and paste services
    query: data_win_system_eventID:"22" AND (data_win_eventdata_queryName:/.*[Pp][Aa][Ss][Tt][Ee][Bb][Ii][Nn]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_queryName:/.*[Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr]\.[Ss][Hh].*/ OR data_win_eventdata_queryName:/.*[Aa][Nn][Oo][Nn][Ff][Ii][Ll][Ee][Ss].*/ OR data_win_eventdata_queryName:/.*[Mm][Ee][Gg][Aa]\.[Nn][Zz].*/ OR data_win_eventdata_queryName:/.*[Ff][Ii][Ll][Ee]\.[Ii][Oo].*/ OR data_win_eventdata_queryName:/.*[Dd][Ii][Ss][Cc][Oo][Rr][Dd][Aa][Pp][Pp]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_queryName:/.*[Mm][Ee][Dd][Ii][Aa][Ff][Ii][Rr][Ee]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_queryName:/.*[Nn][Gg][Rr][Oo][Kk].*/)
    pivot_on: host
    window: 4h
