name: Remote Access Tool - LogMeIn Execution
id: d85873ef-a0f8-4c48-a53a-6b621f11729d
version: 1
schema_version: "1.0"
date: "2023-03-05"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: d85873ef-a0f8-4c48-a53a-6b621f11729d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  An adversary may use legitimate desktop support and remote access software,
  such as Team Viewer, Go2Assist, LogMein, AmmyyAdmin, etc, to establish an
  interactive command and control channel to target systems within networks.
  These services are commonly used as legitimate technical support software, and
  may be allowed by application control within a target environment. Remote
  access tools like VNC, Ammyy, and Teamviewer are used frequently when compared
  with other legitimate software commonly used by adversaries. (Citation:
  Symantec Living off the Land). MITRE ATT&CK: T1219.002.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - term:
                  data_win_eventdata_description:
                    value: "LMIGuardianSvc"
                    case_insensitive: true
              - term:
                  data_win_eventdata_product:
                    value: "LMIGuardianSvc"
                    case_insensitive: true
              - term:
                  data_win_eventdata_company:
                    value: "LogMeIn, Inc."
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_description
    - data_win_eventdata_product
    - data_win_eventdata_company
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_description equals
  'LMIGuardianSvc'; data_win_eventdata_product equals 'LMIGuardianSvc';
  data_win_eventdata_company equals 'LogMeIn, Inc.'.

known_false_positives: >
  Legitimate use. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1219/T1219.md#atomic-test-3---logmein-files-detected-test-on-windows
  - https://attack.mitre.org/techniques/T1219/002/

response:
  message: >
    Remote Access Tool - LogMeIn Execution detected on host $agent_name$.
    Matched data_win_eventdata_description: $data_win_eventdata_description$.
    Matched data_win_eventdata_product: $data_win_eventdata_product$. MITRE
    ATT&CK: T1219.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_description
      type: other
    - field: data_win_eventdata_product
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1219.002
  custom_tags:
    - logmein
    - process_creation
    - sysmon
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_description:/[Ll][Mm][Ii][Gg][Uu][Aa][Rr][Dd][Ii][Aa][Nn][Ss][Vv][Cc]/ OR data_win_eventdata_product:/[Ll][Mm][Ii][Gg][Uu][Aa][Rr][Dd][Ii][Aa][Nn][Ss][Vv][Cc]/ OR data_win_eventdata_company:/[Ll][Oo][Gg][Mm][Ee][Ii][Nn], [Ii][Nn][Cc]\./)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b6d98a4f-cef0-4abf-bbf6-24132854a83d
    name: Remote Access Tool - GoToAssist Execution
    reason: Same LogMeIn vendor stack; GoTo tools often appear together.
  - id: 1a31b18a-f00c-4061-9900-f735b96c99fc
    name: Remote Access Tool Services Have Been Installed - System
    reason: LMIGuardianSvc/LogMeIn service installation.
  - id: c8b00925-926c-47e3-beea-298fd563728e
    name: Remote Access Tool Services Have Been Installed - Security
    reason: Security-log service install for the same agent.
  - id: 4d07b1f4-cb00-4470-b9f8-b0191d48ff52
    name: DNS Query To Remote Access Software Domain From Non-Browser App
    reason: LogMeIn agent calling home to relay domains.
  - id: 5d756aee-ad3e-4306-ad95-cb1abec48de2
    name: GoToAssist Temporary Installation Artefact
    reason: Sibling product install artefacts.
  - id: 79a87aa6-e4bd-42fc-a5bb-5e6fbdcd62f5
    name: Msiexec Quiet Installation
    reason: LogMeIn is often deployed as a quiet MSI.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: LogMeIn processes
    query: data_win_system_eventID:"1" AND (data_win_eventdata_company:/.*[Ll][Oo][Gg][Mm][Ee][Ii][Nn].*/ OR data_win_eventdata_description:/.*[Ll][Mm][Ii].*/ OR data_win_eventdata_image:/.*[Ll][Oo][Gg][Mm][Ee][Ii][Nn].*/)
    pivot_on: host
    window: 6h
  - name: LogMeIn service installation
    query: data_win_system_eventID:"7045" AND (data_win_eventdata_serviceName:/.*[Ll][Oo][Gg][Mm][Ee][Ii][Nn].*/ OR data_win_eventdata_serviceName:/.*[Ll][Mm][Ii].*/)
    pivot_on: host
    window: 24h
  - name: LogMeIn relay DNS
    query: data_win_system_eventID:"22" AND (data_win_eventdata_queryName:/.*[Ll][Oo][Gg][Mm][Ee][Ii][Nn]\.[Cc][Oo][Mm]/ OR data_win_eventdata_queryName:/.*[Ll][Oo][Gg][Mm][Ee][Ii][Nn]-[Gg][Aa][Tt][Ee][Ww][Aa][Yy]\.[Cc][Oo][Mm]/ OR data_win_eventdata_queryName:/.*[Ll][Oo][Gg][Mm][Ee][Ii][Nn][Ii][Nn][Cc]\.[Cc][Oo][Mm]/)
    pivot_on: host
    window: 6h
  - name: Quiet MSI installs preceding the agent
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Mm][Ss][Ii][Ee][Xx][Ee][Cc].*(\/[Qq]|\/[Pp][Aa][Ss][Ss][Ii][Vv][Ee]|\/[Ss][Ii][Ll][Ee][Nn][Tt]).*/
    pivot_on: host
    window: 6h
  - name: Shells spawned by LogMeIn components
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*([Ll][Oo][Gg][Mm][Ee][Ii][Nn]|[Ll][Mm][Ii]).*/ AND data_win_eventdata_image:/.*\\([Cc][Mm][Dd]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll])\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 6h
