name: Potential RDP Session Hijacking Activity
id: 224f140f-3553-4cd1-af78-13d81bf9f7cc
version: 1
schema_version: "1.0"
date: "2024-12-01"
author: "@juju4"
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 224f140f-3553-4cd1-af78-13d81bf9f7cc
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential RDP Session Hijacking activity on Windows systems.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\tscon.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "tscon.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - term:
                  data_win_eventdata_integrityLevel:
                    value: "System"
                    case_insensitive: true
              - term:
                  data_win_eventdata_integrityLevel:
                    value: "S-1-16-16384"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_integrityLevel
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\tscon.exe'; data_win_eventdata_originalFileName equals 'tscon.exe';
  data_win_eventdata_integrityLevel equals 'System', among other conditions.

known_false_positives: >
  Administrative activity. Baseline expected activity in your environment and
  tune this detection before relying on it for automated response.

references:
  - https://twitter.com/Moti_B/status/909449115477659651

response:
  message: >
    Potential RDP Session Hijacking Activity detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  custom_tags:
    - session
    - hijacking
    - process_creation
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Tt][Ss][Cc][Oo][Nn]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Tt][Ss][Cc][Oo][Nn]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_integrityLevel:/[Ss][Yy][Ss][Tt][Ee][Mm]/ OR data_win_eventdata_integrityLevel:/[Ss]-1-16-16384/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 9847f263-4a81-424f-970c-875dab15b79b
    name: Suspicious TSCON Start as SYSTEM
    reason: 'Same technique from a different angle: tscon launched as SYSTEM to take over another user''s session.'
  - id: f72aa3e8-49f9-4c7d-bd74-f8ab84ff9bbb
    name: Suspicious RDP Redirect Using TSCON
    reason: Tscon session redirect to RDP-Tcp is the hijack itself; confirms the taken-over session.
  - id: ffa28e60-bdb1-46e0-9f82-05f7a61cc06e
    name: User Added to Remote Desktop Users Group
    reason: Attacker often grants RDP access before hijacking sessions.
  - id: 0d5675be-bc88-4172-86d3-1e96a4476536
    name: Potential Tampering With RDP Related Registry Keys Via Reg.EXE
    reason: RDP enabling/tampering commonly precedes session hijack setup.
  - id: cd219ff3-fa99-45d4-8380-a7d15116c6dc
    name: New User Created Via Net.EXE
    reason: Local account created to obtain a foothold before the hijack.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Service creation used to reach SYSTEM (sc create)
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*[Ss][Cc]\.exe.*create.*/
    pivot_on: host
    window: 4h
  - name: Query user / qwinsta session enumeration
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:*query.exe OR data_win_eventdata_image:*qwinsta.exe)
    pivot_on: host
    window: 4h
  - name: Any tscon invocation
    query: data_win_system_eventID:1 AND data_win_eventdata_image:*tscon.exe
    pivot_on: host
    window: 24h
  - name: Remote interactive logons (type 10)
    query: data_win_system_eventID:4624 AND data_win_eventdata_logonType:10
    pivot_on: host
    window: 24h
  - name: Net user/localgroup changes
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*[Nn]et1?(\.exe)?\s+(user|localgroup).*/
    pivot_on: host
    window: 4h
