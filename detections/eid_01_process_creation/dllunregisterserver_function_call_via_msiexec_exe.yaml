name: DllUnregisterServer Function Call Via Msiexec.EXE
id: 84f52741-8834-4a8c-a413-2eb2269aa6c8
version: 1
schema_version: "1.0"
date: "2024-03-13"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 84f52741-8834-4a8c-a413-2eb2269aa6c8
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects MsiExec loading a DLL and calling its DllUnregisterServer function.
  MITRE ATT&CK: T1218.007.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\msiexec.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "\\msiexec.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -z *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /z *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* –z *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* —z *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* ―z *"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*.dll*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\msiexec.exe'; data_win_eventdata_originalFileName equals '\msiexec.exe';
  data_win_eventdata_commandLine matches '* -z *', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1218.007/T1218.007.md
  - https://lolbas-project.github.io/lolbas/Binaries/Msiexec/
  - https://twitter.com/_st0pp3r_/status/1583914515996897281
  - https://attack.mitre.org/techniques/T1218/007/

response:
  message: >
    DllUnregisterServer Function Call Via Msiexec.EXE detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1218.007
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218.007
  custom_tags:
    - dllunregisterserver
    - function
    - msiexec
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Mm][Ss][Ii][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/\\[Mm][Ss][Ii][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.* -[Zz] .*/ OR data_win_eventdata_commandLine:/.* \/[Zz] .*/ OR data_win_eventdata_commandLine:/.* –[Zz] .*/ OR data_win_eventdata_commandLine:/.* —[Zz] .*/ OR data_win_eventdata_commandLine:/.* ―[Zz] .*/) AND data_win_eventdata_commandLine:/.*\.[Dd][Ll][Ll].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 6f4191bb-912b-48a8-9ce7-682769541e6d
    name: Suspicious Msiexec Execute Arbitrary DLL
    reason: Another msiexec arbitrary-DLL execution variant; same proxy-exec abuse.
  - id: 8150732a-0c9d-4a99-82b9-9efb9b90c40c
    name: Suspicious Msiexec Quiet Install From Remote Location
    reason: Msiexec quiet install from a remote location often fetches the DLL/MSI before the /z call.
  - id: f7b5f842-a6af-4da5-9e95-e32478f3cd2f
    name: MsiExec Web Install
    reason: Msiexec web install; staging precursor of a remote payload.
  - id: e22a6eb2-f8a5-44b5-8b44-a2dbd47b1144
    name: Potential MsiExec Masquerading
    reason: Masqueraded msiexec; same binary abused via renamed/relocated copy.
  - id: 4a2a2c3e-209f-4d01-b513-4155a540b469
    name: Suspicious MsiExec Embedding Parent
    reason: Msiexec -Embedding with odd parent/children suggests payload execution via msiexec.
  - id: e593cf51-88db-4ee1-b920-37e89012a3c9
    name: Potentially Suspicious Rundll32 Activity
    reason: Rundll32 as equivalent DLL proxy-exec channel often used alongside.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: DLL files created in user-writable paths before the msiexec call
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\.dll/ AND data_win_eventdata_targetFilename:/.*([Tt]emp|[Pp]rogramData|[Uu]sers|[Pp]ublic).*/
    pivot_on: host
    window: 2h
  - name: Other msiexec executions with remote or DLL arguments
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*msiexec\.exe/ AND data_win_eventdata_commandLine:/.*(http|\.dll).*/
    pivot_on: host
    window: 4h
  - name: Network connections from msiexec
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*msiexec\.exe/
    pivot_on: host
    window: 2h
  - name: Scripting or LOLBin children of msiexec
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*msiexec\.exe/ AND data_win_eventdata_image:/.*(cmd|powershell|wscript|cscript|rundll32|regsvr32)\.exe/
    pivot_on: host
    window: 2h
  - name: msiexec loading DLLs from user-writable paths
    query: data_win_system_eventID:7 AND data_win_eventdata_image:/.*msiexec\.exe/ AND data_win_eventdata_imageLoaded:/.*([Tt]emp|[Pp]rogramData|[Uu]sers|[Pp]ublic).*\.dll/
    pivot_on: host
    window: 2h
