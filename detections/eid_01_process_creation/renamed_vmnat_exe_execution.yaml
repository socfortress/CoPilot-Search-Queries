name: Renamed Vmnat.exe Execution
id: 7b4f794b-590a-4ad4-ba18-7964a2832205
version: 1
schema_version: "1.0"
date: "2023-02-03"
author: elhoim
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 7b4f794b-590a-4ad4-ba18-7964a2832205
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects renamed vmnat.exe or portable version that can be used for DLL
  side-loading. MITRE ATT&CK: T1574.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - term:
            data_win_eventdata_originalFileName:
              value: "vmnat.exe"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*vmnat.exe"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_originalFileName
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_originalFileName equals
  'vmnat.exe'; data_win_eventdata_image matches '*vmnat.exe'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/malmoeb/status/1525901219247845376
  - https://attack.mitre.org/techniques/T1574/001/

response:
  message: >
    Renamed Vmnat.exe Execution detected on host $agent_name$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1574.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_originalFileName
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.001
  custom_tags:
    - renamed
    - vmnat
    - process_creation
    - sysmon
    - privilege_escalation
    - persistence
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_originalFileName:/[Vv][Mm][Nn][Aa][Tt]\.[Ee][Xx][Ee]/ AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/.*[Vv][Mm][Nn][Aa][Tt]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: ebea773c-a8f1-42ad-a856-00cb221966e8
    name: DLL Sideloading by VMware Xfer Utility
    reason: Same VMware-binary sideloading family; a renamed vmnat is typically dropped beside a malicious DLL.
  - id: 36480ae1-a1cb-4eaa-a0d6-29801d7e9142
    name: Potential Defense Evasion Via Binary Rename
    reason: Rename/copy step producing the disguised vmnat.
  - id: 0ba1da6d-b6ce-4366-828c-18826c9de23e
    name: Potential Defense Evasion Via Rename Of Highly Relevant Binaries
    reason: Related masquerading technique likely from the same operator.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: DLL loads from user-writable paths
    query: data_win_system_eventID:"7" AND data_win_eventdata_imageLoaded:/.*\\([Uu]sers|[Pp]rogram[Dd]ata|[Tt]emp|[Pp]ublic)\\.*\.[Dd][Ll][Ll]/
    pivot_on: host
    window: 2h
  - name: New DLL/EXE dropped to disk
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\([Uu]sers|[Pp]rogram[Dd]ata|[Tt]emp|[Pp]ublic)\\.*\.([Dd][Ll][Ll]|[Ee][Xx][Ee])/
    pivot_on: host
    window: 2h
  - name: Outbound connections from user-path process
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:"true" AND data_win_eventdata_image:/.*\\([Uu]sers|[Pp]rogram[Dd]ata|[Tt]emp|[Pp]ublic)\\.*/
    pivot_on: host
    window: 4h
  - name: Persistence set after execution
    query: data_win_system_eventID:("12" OR "13") AND data_win_eventdata_targetObject:/.*(\\[Rr]un|\\[Ss]ervices\\).*/
    pivot_on: host
    window: 4h
