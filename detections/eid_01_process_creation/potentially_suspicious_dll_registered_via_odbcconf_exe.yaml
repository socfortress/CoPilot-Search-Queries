name: Potentially Suspicious DLL Registered Via Odbcconf.EXE
id: ba4cfc11-d0fa-4d94-bf20-7c332c412e76
version: 1
schema_version: "1.0"
date: "2023-05-22"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: ba4cfc11-d0fa-4d94-bf20-7c332c412e76
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of "odbcconf" with the "REGSVR" action where the DLL in
  question doesn't contain a ".dll" extension. Which is often used as a method
  to evade defenses. MITRE ATT&CK: T1218.008.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\odbcconf.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "odbcconf.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*REGSVR *"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_commandLine"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.dll*"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\odbcconf.exe'; data_win_eventdata_originalFileName equals 'odbcconf.exe';
  data_win_eventdata_commandLine matches '*REGSVR *', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://learn.microsoft.com/en-us/sql/odbc/odbcconf-exe?view=sql-server-ver16
  - https://lolbas-project.github.io/lolbas/Binaries/Odbcconf/
  - https://www.trendmicro.com/en_us/research/17/h/backdoor-carrying-emails-set-sights-on-russian-speaking-businesses.html
  - https://attack.mitre.org/techniques/T1218/008/

response:
  message: >
    Potentially Suspicious DLL Registered Via Odbcconf.EXE detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1218.008
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218.008
  custom_tags:
    - registered
    - odbcconf
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Oo][Dd][Bb][Cc][Cc][Oo][Nn][Ff]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Oo][Dd][Bb][Cc][Cc][Oo][Nn][Ff]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Rr][Ee][Gg][Ss][Vv][Rr] .*/ AND _exists_:data_win_eventdata_commandLine AND NOT (data_win_eventdata_commandLine:/.*\.[Dd][Ll][Ll].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 9f0a8bf3-a65b-440a-8c1e-5cb1547c8e70
    name: New DLL Registered Via Odbcconf.EXE
    reason: Same odbcconf REGSVR/INSTALL abuse seen with a .dll extension; the extensionless variant often sits beside an ordinary-named attempt.
  - id: 6b65c28e-11f3-46cb-902a-68f2cafaf474
    name: Odbcconf.EXE Suspicious DLL Location
    reason: Odbcconf loading the payload from a user-writable path confirms where the staged DLL was dropped.
  - id: 3f5491e2-8db8-496b-9e95-1029fce852d4
    name: Driver/DLL Installation Via Odbcconf.EXE
    reason: Alternate odbcconf action (INSTALLDRIVER) used for the same proxy-execution purpose.
  - id: 070e9b80-6252-11eb-ae93-0242ac130002
    name: Detect Regsvr32 Application Control Bypass
    reason: Regsvr32 is the sibling LOLBin for DLL proxy execution; attackers fall back to it if odbcconf is blocked.
  - id: e593cf51-88db-4ee1-b920-37e89012a3c9
    name: Potentially Suspicious Rundll32 Activity
    reason: Rundll32 is another DLL proxy-execution fallback used in the same intrusion.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Odbcconf executions on host (any action)
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Oo][Dd][Bb][Cc][Cc][Oo][Nn][Ff]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 4h
  - name: Payload files dropped by script/office parents
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/) AND data_win_eventdata_image:/.*\\(cmd|powershell|wscript|cscript|mshta|winword|excel)\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Image loads by odbcconf (the registered payload)
    query: data_win_system_eventID:"7" AND data_win_eventdata_image:/.*[Oo][Dd][Bb][Cc][Cc][Oo][Nn][Ff]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 1h
  - name: Odbcconf making network connections
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Oo][Dd][Bb][Cc][Cc][Oo][Nn][Ff]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: LOLBin proxy-execution siblings from user paths or URLs
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\(regsvr32|rundll32|mshta|msiexec)\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*([Hh][Tt][Tt][Pp]|\\[Uu][Ss][Ee][Rr][Ss]\\|\\[Tt][Ee][Mm][Pp]\\).*/
    pivot_on: host
    window: 4h
