name: Windows Chrome Enable Extension Loading via Command-Line
id: da355155-1d23-48f9-bf95-e534ae273ab0
version: 1
schema_version: 1
date: '2026-01-12'
author: SOCFortress LLC
status: production
type: Anomaly
description: >
  Detects Google Chrome launched with --disable-features=DisableLoadExtensionCommandLineSwitch,
  which bypasses enterprise policies that block loading extensions via the command line.
  Attackers and malware abuse this flag combined with --load-extension to silently
  inject malicious browser extensions for credential theft, session hijacking, or
  persistent browser manipulation. Associated with browser hijacking campaigns.
  MITRE ATT&CK: T1185 (Browser Session Hijacking).

data_source:
  - Sysmon EventID 1 (ProcessCreate)

search:
  query:
    bool:
      must:
        - term:
            agent_name: "AGENT_NAME"
        - term:
            agent_labels_customer: "CUSTOMER_CODE"
        - term:
            data_win_system_eventID: "1"
        - wildcard:
            data_win_eventdata_image: "*\\chrome.exe"
        - wildcard:
            data_win_eventdata_commandLine: "*--disable-features*"
        - wildcard:
            data_win_eventdata_commandLine: "*DisableLoadExtensionCommandLineSwitch*"
        - range:
            timestamp:
              gte: "START_TIME"
              lte: "END_TIME"

parameters:
  - name: AGENT_NAME
    default: "DESKTOP-AM0HLGE"
  - name: CUSTOMER_CODE
    default: "lab"
  - name: START_TIME
    default: "now-24h"
  - name: END_TIME
    default: "now"

how_to_implement: >
  Requires Sysmon EventID 1 (ProcessCreate) flowing to the Wazuh Indexer.
  Validated on DESKTOP-AM0HLGE with Chrome launched via PowerShell using
  --disable-features=DisableLoadExtensionCommandLineSwitch --load-extension.
  Confirmed field names: data_win_eventdata_image, data_win_eventdata_commandLine,
  data_win_eventdata_parentImage, data_win_eventdata_user.
  Note: use & operator in PowerShell to pass flags directly to Chrome binary.

known_false_positives: >
  Developers and IT admins may legitimately use this flag to load unpacked
  extensions during testing or deployment. Filter on data_win_eventdata_user
  for known developer accounts or data_win_eventdata_parentImage for known
  automation tooling. In production endpoints, any use of this flag should
  be investigated.

references:
  - https://www.gdatasoftware.com/blog/2025/11/38298-learning-about-browser-hijacking
  - https://attack.mitre.org/techniques/T1185/

response:
  message: >
    Chrome launched with extension loading bypass flag on $agent_name$.
    Command line: $data_win_eventdata_commandLine$.
    Parent process: $data_win_eventdata_parentImage$.
    User: $data_win_eventdata_user$.
    Possible malicious browser extension injection bypassing enterprise policy.
    MITRE ATT&CK: T1185
  risk_score: 30
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 30
    - field: data_win_eventdata_user
      type: user
      score: 30
  threat_objects:
    - field: data_win_eventdata_image
      type: process_name
    - field: data_win_eventdata_parentImage
      type: parent_process_name

tags:
  analytic_story:
    - Browser Hijacking
  asset_type: Endpoint
  mitre_attack_id:
    - T1185
  custom_tags:
    - chrome
    - browser_hijacking
    - extension_loading
    - disable_features
    - credential_theft
  product:
    - Wazuh
  security_domain: endpoint

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 88d6e60c-759d-4ac1-a447-c0f1466c2d21
    name: Chromium Browser Instance Executed With Custom Extension
    reason: The same launch typically carries --load-extension pointing at the unpacked malicious extension; the disable-feature flag only unlocks it, this shows the payload being loaded.
  - id: 0a74c5a9-1b71-4475-9af2-7829d320d5c2
    name: ChromeLoader Malware Execution
    reason: ChromeLoader and similar browser hijackers use this flag pair to force-install a rogue extension, so a hit helps confirm the family.
  - id: b3d34dc5-2efd-4ae3-845f-8ec14921f449
    name: Browser Started with Remote Debugging
    reason: Browser hijackers often add remote debugging to the same launch to drive the session or pull cookies.
  - id: 869ba261-c272-47d7-affe-5c0aa85c93d6
    name: Headless Browser Usage
    reason: Loader scripts commonly start Chrome headless or hidden with the extension so the victim sees nothing.
  - id: 47147b5b-9e17-4d76-b8d2-7bac24c5ce1b
    name: Potential Browser Data Stealing
    reason: A rogue extension and its launcher are followed by direct access to browser profile credential stores.
  - id: 5a6e1e16-07de-48d8-8aae-faa766c05e88
    name: Potential Cookies Session Hijacking
    reason: Session hijacking (T1185) is the goal, cookie theft is the expected follow-on once the extension is active.
  - id: 4f546cf4-15aa-4368-80f7-940e92bc551e
    name: Windows Chromium Browser with Custom User Data Directory
    reason: Infostealer loaders also start Chromium with an isolated --user-data-dir plus GPU-disable flags, a companion launch pattern.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Chromium launches carrying extension or stealth flags
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Cc][Hh][Rr][Oo][Mm][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Ee][Dd][Gg][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Bb][Rr][Aa][Vv][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Oo][Pp][Ee][Rr][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Vv][Ii][Vv][Aa][Ll][Dd][Ii]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*--user-data-dir.*/ OR data_win_eventdata_commandLine:/.*--no-sandbox.*/ OR data_win_eventdata_commandLine:/.*--window-size.*/ OR data_win_eventdata_commandLine:/.*--load-extension.*/ OR data_win_eventdata_commandLine:/.*--headless.*/ OR data_win_eventdata_commandLine:/.*--disable-gpu.*/)
    pivot_on: host
    window: 4h
  - name: Extension files written to disk
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\[Ee][Xx][Tt][Ee][Nn][Ss][Ii][Oo][Nn][Ss]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Mm][Aa][Nn][Ii][Ff][Ee][Ss][Tt]\.[Jj][Ss][Oo][Nn]/ OR data_win_eventdata_targetFilename:/.*\.[Cc][Rr][Xx]/)
    pivot_on: host
    window: 4h
  - name: Script or LOLBin that launched the browser
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Cc][Hh][Rr][Oo][Mm][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Ee][Dd][Gg][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Bb][Rr][Aa][Vv][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Oo][Pp][Ee][Rr][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Vv][Ii][Vv][Aa][Ll][Dd][Ii]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_parentImage:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/)
    pivot_on: host
    window: 2h
  - name: Shell downloading payloads from URLs
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp][Ss]?:\\/\\/.*/)
    pivot_on: host
    window: 2h
  - name: Browser credential and cookie stores touched
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Ll][Oo][Gg][Ii][Nn] [Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_targetFilename:/.*[Ww][Ee][Bb] [Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_targetFilename:/.*\\[Cc][Oo][Oo][Kk][Ii][Ee][Ss].*/ OR data_win_eventdata_targetFilename:/.*[Ll][Oo][Cc][Aa][Ll] [Ss][Tt][Aa][Tt][Ee].*/)
    pivot_on: host
    window: 4h
