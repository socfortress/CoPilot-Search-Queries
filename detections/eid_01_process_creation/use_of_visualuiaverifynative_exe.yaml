name: Use of VisualUiaVerifyNative.exe
id: b30a8bc5-e21b-4ca2-9420-0a94019ac56a
version: 1
schema_version: "1.0"
date: "2022-06-01"
author: Christopher Peacock @SecurePeacock, SCYTHE @scythe_io
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: b30a8bc5-e21b-4ca2-9420-0a94019ac56a
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  VisualUiaVerifyNative.exe is a Windows SDK that can be used for AWL bypass and
  is listed in Microsoft's recommended block rules. MITRE ATT&CK: T1218.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\VisualUiaVerifyNative.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "VisualUiaVerifyNative.exe"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\VisualUiaVerifyNative.exe'; data_win_eventdata_originalFileName equals
  'VisualUiaVerifyNative.exe'.

known_false_positives: >
  Legitimate testing of Microsoft UI parts. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://lolbas-project.github.io/lolbas/OtherMSBinaries/VisualUiaVerifyNative/
  - https://learn.microsoft.com/en-us/windows/security/application-security/application-control/windows-defender-application-control/design/applications-that-can-bypass-wdac
  - https://bohops.com/2020/10/15/exploring-the-wdac-microsoft-recommended-block-rules-visualuiaverifynative/
  - https://github.com/MicrosoftDocs/windows-itpro-docs/commit/937db704b9148e9cee7c7010cad4d00ce9c4fdad
  - https://attack.mitre.org/techniques/T1218/

response:
  message: >
    Use of VisualUiaVerifyNative.exe detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1218
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218
  custom_tags:
    - visualuiaverifynative
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Vv][Ii][Ss][Uu][Aa][Ll][Uu][Ii][Aa][Vv][Ee][Rr][Ii][Ff][Yy][Nn][Aa][Tt][Ii][Vv][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Vv][Ii][Ss][Uu][Aa][Ll][Uu][Ii][Aa][Vv][Ee][Rr][Ii][Ff][Yy][Nn][Aa][Tt][Ii][Vv][Ee]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: cc268ac1-42d9-40fd-9ed3-8c4e1a5b87e6
    name: Devtoolslauncher.exe Executes Specified Binary
    reason: Another Windows dev-tool on the Microsoft block list used for the same application-whitelisting bypass; operators try several in sequence.
  - id: 40b95d31-1afc-469e-8d34-9a3a667d058e
    name: Suspicious Csi.exe Usage
    reason: Csi.exe is a sibling dev-tool AWL bypass that runs attacker C# through a signed Microsoft binary.
  - id: 81ebd28b-9607-4478-bf06-974ed9d53ed7
    name: Potential Application Whitelisting Bypass via Dnx.EXE
    reason: Same AWL-bypass family; hits on both show deliberate hunting for allowed signed executors.
  - id: 15c7904e-6ad1-4a45-9b46-5fb25df37fd2
    name: Malicious PE Execution by Microsoft Visual Studio Debugger
    reason: Visual Studio debugger proxy-executing a payload is the same dev-tooling trust abuse.
  - id: b6676963-0353-4f88-90f5-36c20d443c6a
    name: Cscript/Wscript Potentially Suspicious Child Process
    reason: Common delivery stage that drops and launches the SDK binary.
  - id: d80d5c81-04ba-45b4-84e4-92eba40e0ad3
    name: Arbitrary DLL or Csproj Code Execution Via Dotnet.EXE
    reason: Alternative signed dev-tool code-exec route used when one proxy path is blocked.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Children of VisualUiaVerifyNative
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Vv]isual[Uu]ia[Vv]erify[Nn]ative\.exe/
    pivot_on: host
    window: 2h
  - name: Shells and LOLBins spawned from Windows Kits path
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*\\(cmd|powershell|rundll32|regsvr32|mshta)\.exe/ AND data_win_eventdata_parentImage:/.*[Ww]indows [Kk]its.*/
    pivot_on: host
    window: 2h
  - name: DLLs loaded from user-writable paths by the tool
    query: data_win_system_eventID:7 AND data_win_eventdata_image:/.*[Vv]isual[Uu]ia[Vv]erify[Nn]ative.*/ AND data_win_eventdata_imageLoaded:/.*\\(AppData|Temp|ProgramData|Users\\Public)\\.*/
    pivot_on: host
    window: 1h
  - name: Script hosts and downloaders preceding execution
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*\\(wscript|cscript|mshta|certutil|bitsadmin|curl)\.exe/
    pivot_on: host
    window: 4h
  - name: Executables dropped to user-writable paths
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\\(AppData|Temp|ProgramData|Users\\Public)\\.*\.(exe|dll)/
    pivot_on: host
    window: 4h
