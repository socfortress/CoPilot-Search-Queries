name: Peach Sandstorm APT Process Activity Indicators
id: 2e7bbd54-2f26-476e-b4a1-ba5f1a012614
version: 1
schema_version: "1.0"
date: "2024-01-15"
author: X__Junior (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 2e7bbd54-2f26-476e-b4a1-ba5f1a012614
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects process creation activity related to Peach Sandstorm APT.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*QP's\\*(58vaP!tF4*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*QP's*(58vaP!tF4*'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/MsftSecIntel/status/1737895710169628824
  - https://www.virustotal.com/gui/file/364275326bbfc4a3b89233dabdaf3230a3d149ab774678342a40644ad9f8d614/details

response:
  message: >
    Peach Sandstorm APT Process Activity Indicators detected on host
    $agent_name$. Matched data_win_eventdata_commandLine:
    $data_win_eventdata_commandLine$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - peach
    - sandstorm
    - indicators
    - process_creation
    - sysmon
    - execution
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Qq][Pp]'[Ss]\*\(58[Vv][Aa][Pp]![Tt][Ff]4.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e6313acd-208c-44fc-a0ff-db85d572e90e
    name: Network Reconnaissance Activity
    reason: Peach Sandstorm operators run network recon shortly after the implant executes
  - id: c248c896-e412-4279-8c15-1c558067b6fa
    name: Enumerate All Information With Whoami.EXE
    reason: Whoami /all is a typical first host-triage command after an APT foothold
  - id: bd8b828d-0dca-48e1-8a63-8a58ecf2644f
    name: Group Membership Reconnaissance Via Whoami.EXE
    reason: Group membership checks gauge privilege after foothold
  - id: 41243735-89a7-4c83-bcdd-570aa78f00a1
    name: Domain Controller Discovery with Nltest
    reason: DC discovery via nltest precedes domain-wide enumeration and lateral movement
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: LSASS dumping is the actor's main post-compromise credential objective
  - id: f376c8a7-a2d0-4ddc-aa0c-16c17236d962
    name: HackTool - Bloodhound/Sharphound Execution
    reason: AD mapping tooling commonly used by this actor class after credential access
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Host and domain discovery commands
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ww]hoami.*/ OR /.*[Nn]ltest.*/ OR /.*net1?\.exe.*(group|user|view|accounts).*/ OR /.*[Qq]user.*/)
    pivot_on: host
    window: 6h
  - name: Payload staging and download
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Cc]ertutil.*(urlcache|decode).*/ OR /.*[Bb]itsadmin.*transfer.*/ OR /.*[Ii]nvoke-[Ww]eb[Rr]equest.*/ OR /.*[Cc]url.*http.*/)
    pivot_on: host
    window: 4h
  - name: Archive creation for exfil staging
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*(7z|rar|winrar)(\.exe)? +a .*/ OR /.*(7z|rar).* -hp.*/ OR /.*(7z|rar).* -p.*/)
    pivot_on: host
    window: 6h
  - name: Credential access tooling
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Cc]omsvcs.*[Mm]ini[Dd]ump.*/ OR /.*[Pp]rocdump.*lsass.*/ OR /.*[Ss]ekurlsa.*/ OR /.*reg.* save .*(sam|system|security).*/)
    pivot_on: host
    window: 6h
  - name: Persistence via schtasks or Run key
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ss]chtasks.*\/create.*/ OR /.*[Cc]urrent[Vv]ersion\\[Rr]un.*/)
    pivot_on: host
    window: 6h
