name: Windows Eventlog Cleared Via Wevtutil
id: fdb829a8-db84-4832-b64b-3e964cd44f01
version: 1
schema_version: "1.0"
date: "2026-03-30"
author: SOCFortress LLC
status: production
type: Anomaly
description: >
  Detects the usage of wevtutil.exe with the "cl" or "clear-log" parameter
  to clear the contents of Windows event logs. Clearing event logs is a common
  anti-forensic technique used by threat actors to cover their tracks after
  malicious actions, hindering incident response and forensic investigations.
  This technique is used by ransomware families including Rhysida, Clop,
  and ShrinkLocker.

data_source:
  - Sysmon EventID 1 (ProcessCreate)

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - wildcard:
            data_win_eventdata_image: "*\\wevtutil.exe"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine: "* cl *"
              - wildcard:
                  data_win_eventdata_commandLine: "*clear-log*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-03-30 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-03-30 23:59:59.999"

how_to_implement: >
  Requires Wazuh agents with Sysmon installed and configured to log process
  creation events (EventID 1) with full command-line arguments.

known_false_positives: >
  The wevtutil.exe application is a legitimate Windows event log utility.
  Administrators may use it to manage Windows event logs. Review the user
  context and frequency of log clearing to determine if the activity is
  authorized.

references:
  - https://attack.mitre.org/techniques/T1070/001/
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1070.001/T1070.001.md

response:
  message: >
    Event log cleared via wevtutil.exe on $agent_name$ by $data_win_eventdata_user$.
    Command: $data_win_eventdata_commandLine$.
    MITRE ATT&CK: T1070.001
  risk_score: 28
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 28
    - field: data_win_eventdata_user
      type: user
      score: 28
  threat_objects:
    - field: data_win_eventdata_image
      type: process_name
    - field: data_win_eventdata_commandLine
      type: command_line

tags:
  analytic_story:
    - Windows Log Manipulation
    - Ransomware
    - Rhysida Ransomware
    - Clop Ransomware
    - CISA AA23-347A
    - ShrinkLocker
  asset_type: Endpoint
  mitre_attack_id:
    - T1070.001
  custom_tags:
    - wevtutil
    - log_clearing
    - anti_forensics
    - defense_evasion
    - ransomware
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\wevtutil\.exe/ AND (data_win_eventdata_commandLine:/.*\ cl\ .*/ OR data_win_eventdata_commandLine:/.*clear-log.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: cc36992a-4671-4f21-a91d-6c2b72a2edf5
    name: Suspicious Eventlog Clearing or Configuration Change Activity
    reason: Same anti-forensic intent via other tooling (PowerShell Clear-EventLog, wevtutil sl/cl variants); co-occurs when an operator tries several ways to blind the logs.
  - id: 236e7c8e-c9d9-11eb-a824-acde48001122
    name: Disable Logs Using WevtUtil
    reason: Operators often disable a log channel (wevtutil sl /e:false) before or right after clearing it, so future activity is never recorded.
  - id: 63c779ba-f638-40a0-a593-ddd45e8b1ddc
    name: EventLog EVTX File Deleted
    reason: 'Fallback to clearing: deleting .evtx files directly when wevtutil is monitored or blocked.'
  - id: 0a13e132-651d-11eb-ae93-0242ac130002
    name: Audit Policy Tampering Via Auditpol
    reason: Audit policy is disabled just before the logs are wiped so the cleanup itself and later actions leave no trail.
  - id: caf201a9-c2ce-4a26-9c3a-2b9525413711
    name: Potentially Suspicious Call To Win32_NTEventlogFile Class
    reason: WMI ClearEventLog/BackupEventLog is the alternate route to clear logs on the same host.
  - id: cd1f961e-0b96-436b-b7c6-38da4583ec00
    name: Suspicious Windows Trace ETW Session Tamper Via Logman.EXE
    reason: ETW session stop/delete is paired with log clearing to remove telemetry sources.
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: Ransomware playbooks (Rhysida, Clop, ShrinkLocker) clear logs next to shadow-copy deletion before encryption.
  - id: c9fbe8e9-119d-40a6-9b59-dd58a5d84429
    name: Potential Ransomware or Unauthorized MBR Tampering Via Bcdedit.EXE
    reason: Recovery inhibition via bcdedit is a typical impact-stage companion of log clearing.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other log clearing / disabling methods on this host
    query: (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Cc][Ll][Ee][Aa][Rr]-[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg]|[Rr][Ee][Mm][Oo][Vv][Ee]-[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg]|[Ll][Ii][Mm][Ii][Tt]-[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg]|[Cc][Ll][Ee][Aa][Rr][Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg]).*/) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee])/ AND data_win_eventdata_commandLine:/.*(\ [Ss][Ll]\ |[Ss][Ee][Tt]-[Ll][Oo][Gg]|\/[Ee]:[Ff][Aa][Ll][Ss][Ee]).*/) OR data_win_system_eventID:"1102"
    pivot_on: host
    window: 2h
  - name: Audit policy / ETW tampering around the clear
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\([Aa][Uu][Dd][Ii][Tt][Pp][Oo][Ll]\.[Ee][Xx][Ee])/ AND data_win_eventdata_commandLine:/.*(\/[Cc][Ll][Ee][Aa][Rr]|\/[Rr][Ee][Mm][Oo][Vv][Ee]|\/[Ss][Ee][Tt]).*/) OR (data_win_eventdata_image:/.*\\([Ll][Oo][Gg][Mm][Aa][Nn]\.[Ee][Xx][Ee])/ AND data_win_eventdata_commandLine:/.*(\ [Ss][Tt][Oo][Pp]\ |\ [Dd][Ee][Ll][Ee][Tt][Ee]\ |[Uu][Pp][Dd][Aa][Tt][Ee]\ [Tt][Rr][Aa][Cc][Ee]).*/) OR data_win_eventdata_commandLine:/.*([Mm][Ii][Nn][Ii][Nn][Tt]).*/)
    pivot_on: host
    window: 2h
  - name: Impact-stage inhibit-recovery commands
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\([Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]|[Ww][Bb][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee])/ AND data_win_eventdata_commandLine:/.*([Dd][Ee][Ll][Ee][Tt][Ee]).*/) OR (data_win_eventdata_image:/.*\\([Bb][Cc][Dd][Ee][Dd][Ii][Tt]\.[Ee][Xx][Ee])/ AND data_win_eventdata_commandLine:/.*([Rr][Ee][Cc][Oo][Vv][Ee][Rr][Yy][Ee][Nn][Aa][Bb][Ll][Ee][Dd]|[Bb][Oo][Oo][Tt][Ss][Tt][Aa][Tt][Uu][Ss][Pp][Oo][Ll][Ii][Cc][Yy]).*/) OR (data_win_eventdata_image:/.*\\([Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee])/ AND data_win_eventdata_commandLine:/.*([Ss][Hh][Aa][Dd][Oo][Ww][Cc][Oo][Pp][Yy]).*/))
    pivot_on: host
    window: 4h
  - name: Suspicious parents that launched the clear (remote exec, script hosts)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\([Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]\.[Ee][Xx][Ee]|[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee]\.[Ee][Xx][Ee]|[Ww][Ii][Nn][Rr][Ss][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]|[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 1h
  - name: Evtx file deletion on this host
    query: data_win_system_eventID:/(23|26)/ AND data_win_eventdata_targetFilename:/.*\.[Ee][Vv][Tt][Xx]/
    pivot_on: host
    window: 2h
