name: Potential Dtrack RAT Activity
id: f1531fa4-5b84-4342-8f68-9cf3fdbd83d4
version: 1
schema_version: "1.0"
date: "2025-11-03"
author: Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: f1531fa4-5b84-4342-8f68-9cf3fdbd83d4
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: production
type: TTP

description: >
  Detects potential Dtrack RAT activity via specific process patterns. MITRE
  ATT&CK: T1490.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - regexp:
                  data_win_eventdata_commandLine: ".*(ping[ ]+-n.*echo EEEE[ ]?>[ ]?).*"
              - bool:
                  must:
                    - regexp:
                        data_win_eventdata_commandLine: ".*(ipconfig[ ]+/all).*"
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*\\\\temp\\\\res.ip*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*interface ip show config*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*\\\\temp\\\\netsh.res*"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches the
  regex /.*(ping[ ]+-n.*echo EEEE[ ]?>[ ]?).*/; data_win_eventdata_commandLine
  matches the regex /.*(ipconfig[ ]+/all).*/; data_win_eventdata_commandLine
  matches '*\temp\res.ip*', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://securelist.com/my-name-is-dtrack/93338/
  - https://securelist.com/andariel-deploys-dtrack-and-maui-ransomware/107063/
  - https://www.cyberbit.com/endpoint-security/dtrack-apt-malware-found-in-nuclear-power-plant/
  - https://app.any.run/tasks/4bc9860d-ab51-4077-9e09-59ad346b92fd/
  - https://app.any.run/tasks/ce4deab5-3263-494f-93e3-afb2b9d79f14/
  - https://attack.mitre.org/techniques/T1490/

response:
  message: >
    Potential Dtrack RAT Activity detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1490
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1490
  custom_tags:
    - dtrack
    - process_creation
    - sysmon
    - impact
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*(ping[ ]+-n.*echo EEEE[ ]?\>[ ]?).*/ OR (data_win_eventdata_commandLine:/.*(ipconfig[ ]+\/all).*/ AND data_win_eventdata_commandLine:/.*\\[Tt][Ee][Mm][Pp]\\[Rr][Ee][Ss]\.[Ii][Pp].*/) OR (data_win_eventdata_commandLine:/.*[Ii][Nn][Tt][Ee][Rr][Ff][Aa][Cc][Ee] [Ii][Pp] [Ss][Hh][Oo][Ww] [Cc][Oo][Nn][Ff][Ii][Gg].*/ AND data_win_eventdata_commandLine:/.*\\[Tt][Ee][Mm][Pp]\\[Nn][Ee][Tt][Ss][Hh]\.[Rr][Ee][Ss].*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: ded2b07a-d12f-4284-9b76-653e37b6c8b0
    name: Potentially Suspicious Ping/Copy Command Combination
    reason: 'Same technique family: ping used as delay/obfuscation wrapper around copy/delete in dropper cmd chains'
  - id: ce058d6c-79f2-11ec-b476-acde48001122
    name: Ping Sleep Batch Command
    reason: 'Co-occurring: ping-based sleep batch lines are used by loaders around the Dtrack reconnaissance step'
  - id: 2cf5cc25-f39a-436d-a790-4857e5995ede
    name: Network Connection Discovery With Netstat
    reason: 'Same recon phase: Dtrack harvests network state; netstat enumeration accompanies it'
  - id: 5cc90652-4cbd-4241-aa3b-4b462fa5a248
    name: Potential Recon Activity Via Nltest.EXE
    reason: 'Follow-on: after local network profiling, domain recon via nltest precedes lateral movement'
  - id: c248c896-e412-4279-8c15-1c558067b6fa
    name: Enumerate All Information With Whoami.EXE
    reason: 'Co-occurring: whoami /all style host/user profiling alongside ipconfig dumps'
  - id: 24357373-078f-44ed-9ac4-6d334a668a11
    name: Direct Autorun Keys Modification
    reason: 'Follow-on: Dtrack establishes persistence through autorun key modification'
  - id: de587dce-915e-4218-aac4-835ca6af6f70
    name: Potential Persistence Attempt Via Run Keys Using Reg.EXE
    reason: 'Follow-on: Run key persistence via reg.exe after the RAT is staged'
  - id: e593cf51-88db-4ee1-b920-37e89012a3c9
    name: Potentially Suspicious Rundll32 Activity
    reason: 'Precursor: the Dtrack payload is commonly launched as a DLL through rundll32'
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Recon command output redirected to temp files
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ii][Pp][Cc][Oo][Nn][Ff][Ii][Gg]|[Nn][Ee][Tt][Ss][Tt][Aa][Tt]|[Ss][Yy][Ss][Tt][Ee][Mm][Ii][Nn][Ff][Oo]|[Tt][Aa][Ss][Kk][Ll][Ii][Ss][Tt]|[Aa][Rr][Pp]|[Rr][Oo][Uu][Tt][Ee]|[Nn][Ee][Tt][Ss][Hh]).*\>.*\\[Tt][Ee][Mm][Pp]\\.*/
    pivot_on: host
    window: 2h
  - name: Enumeration utilities spawned from cmd
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\([Cc][Mm][Dd])\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Ii][Pp][Cc][Oo][Nn][Ff][Ii][Gg]|[Nn][Ee][Tt][Ss][Tt][Aa][Tt]|[Ss][Yy][Ss][Tt][Ee][Mm][Ii][Nn][Ff][Oo]|[Tt][Aa][Ss][Kk][Ll][Ii][Ss][Tt]|[Nn][Ee][Tt][Ss][Hh]|[Ww][Hh][Oo][Aa][Mm][Ii]|[Aa][Rr][Pp]|[Nn][Ll][Tt][Ee][Ss][Tt])\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Result files written to temp
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\[Tt][Ee][Mm][Pp]\\.*\.([Rr][Ee][Ss]|[Ii][Pp]|[Tt][Xx][Tt]|[Dd][Aa][Tt])/
    pivot_on: host
    window: 4h
  - name: Outbound connections from rundll32
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:"true" AND data_win_eventdata_image:/.*\\([Rr][Uu][Nn][Dd][Ll][Ll]32)\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 6h
  - name: Autorun or service registry writes
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*(\\[Rr][Uu][Nn]\\|\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\.*[Ii][Mm][Aa][Gg][Ee][Pp][Aa][Tt][Hh]).*/
    pivot_on: host
    window: 6h
