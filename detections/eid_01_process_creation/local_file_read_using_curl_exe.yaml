name: Local File Read Using Curl.EXE
id: aa6f6ea6-0676-40dd-b510-6e46f02d8867
version: 1
schema_version: "1.0"
date: "2023-07-27"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: aa6f6ea6-0676-40dd-b510-6e46f02d8867
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of "curl.exe" with the "file://" protocol handler in order
  to read local files.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\curl.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "curl.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*file:///*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\curl.exe'; data_win_eventdata_originalFileName equals 'curl.exe';
  data_win_eventdata_commandLine matches '*file:///*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://curl.se/docs/manpage.html

response:
  message: >
    Local File Read Using Curl.EXE detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  custom_tags:
    - local
    - process_creation
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Ff][Ii][Ll][Ee]:\/\/\/.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: cb9cc1d1-e84e-4bdc-b7ad-c31b1b7908ec
    name: Insecure Transfer Via Curl.EXE
    reason: Curl reading a local file via file:/// is often paired with a curl upload of that data over plain HTTP/FTP to staging.
  - id: e328cc73-f92a-42fb-b3fa-7c2cffda981a
    name: Curl File Upload To File Sharing Websites
    reason: 'Follow-on exfiltration: the file read locally by curl is posted to a file-sharing site.'
  - id: 85de1f22-d189-44e4-8239-dc276b45379b
    name: Curl Web Request With Potential Custom User-Agent
    reason: Same curl tooling with spoofed UA suggests scripted C2/exfil by the same actor.
  - id: 9cc85849-3b02-4cb5-b371-3a1ff54f2218
    name: File Download From IP URL Via Curl.EXE
    reason: Curl may have been used earlier to pull the payload/script that now reads local files.
  - id: 7530cd3d-7671-43e3-b209-976966f6ea48
    name: Renamed CURL.EXE Execution
    reason: A renamed curl copy indicates evasion around the same file:// abuse.
  - id: 7d1aaf3d-4304-425c-b7c3-162055e0b3ab
    name: Potential Data Exfiltration Activity Via CommandLine Tools
    reason: Generic CLI exfil tooling co-occurring on the host confirms the read was data collection.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Curl executions with URL or upload/output options
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Cc]url\.exe/ AND data_win_eventdata_commandLine:/.*(http|ftp|-T|--upload-file|-F|--data|-o ).*/
    pivot_on: host
    window: 2h
  - name: Script interpreters launching curl
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*(cmd|powershell|pwsh|wscript|cscript|mshta)\.exe/ AND data_win_eventdata_commandLine:/.*[Cc]url.*/
    pivot_on: host
    window: 1h
  - name: Sensitive file references in command lines
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*([Pp]asswd|[Cc]redential|\.kdbx|\.pem|id_rsa|\\Desktop\\|\\Documents\\).*/
    pivot_on: host
    window: 2h
  - name: Network connections initiated by curl
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*[Cc]url\.exe/
    pivot_on: host
    window: 2h
  - name: Archive or staging activity by same user
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(7z|rar|zip|Compress-Archive|tar ).*/
    pivot_on: user
    window: 4h
