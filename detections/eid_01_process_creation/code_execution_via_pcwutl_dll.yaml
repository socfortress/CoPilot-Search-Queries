name: Code Execution via Pcwutl.dll
id: 9386d78a-7207-4048-9c9f-a93a7c2d1c05
version: 1
schema_version: "1.0"
date: "2023-02-09"
author: Julia Fomina, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 9386d78a-7207-4048-9c9f-a93a7c2d1c05
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects launch of executable by calling the LaunchApplication function from
  pcwutl.dll library. MITRE ATT&CK: T1218.011.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\rundll32.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "RUNDLL32.EXE"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*pcwutl*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*LaunchApplication*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\rundll32.exe'; data_win_eventdata_originalFileName equals 'RUNDLL32.EXE';
  data_win_eventdata_commandLine matches '*pcwutl*', among other conditions.

known_false_positives: >
  Use of Program Compatibility Troubleshooter Helper. Baseline expected activity
  in your environment and tune this detection before relying on it for automated
  response.

references:
  - https://lolbas-project.github.io/lolbas/Libraries/Pcwutl/
  - https://twitter.com/harr0ey/status/989617817849876488
  - https://attack.mitre.org/techniques/T1218/011/

response:
  message: >
    Code Execution via Pcwutl.dll detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1218.011
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218.011
  custom_tags:
    - pcwutl
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Pp][Cc][Ww][Uu][Tt][Ll].*/ AND data_win_eventdata_commandLine:/.*[Ll][Aa][Uu][Nn][Cc][Hh][Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e593cf51-88db-4ee1-b920-37e89012a3c9
    name: Potentially Suspicious Rundll32 Activity
    reason: Same rundll32 proxy-execution family; other abused exports on the host suggest a LOLBin chain rather than a one-off.
  - id: 2569ed8c-1147-498a-9b8c-2ad3656b10ed
    name: Potential Renamed Rundll32 Execution
    reason: Attacker may rename rundll32 to dodge image-name filters; co-occurrence shows evasion.
  - id: 1228c958-e64e-4e71-92ad-7d429f4138ba
    name: Script Interpreter Execution From Suspicious Folder
    reason: A script from a user-writable folder is a common launcher that then calls pcwutl LaunchApplication to proxy a payload.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Rundll32 proxy exports (pcwutl and similar)
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*[Rr]undll32.*(pcwutl|url\.dll|advpack|ieframe|zipfldr).*/
    pivot_on: host
    window: 2h
  - name: Children of rundll32 (payload launched via proxy)
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Rr]undll32\.exe/
    pivot_on: host
    window: 1h
  - name: Executables started from user-writable paths
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*\\(Users|ProgramData|Temp)\\.*\.exe/
    pivot_on: host
    window: 4h
  - name: Office or script parents spawning rundll32
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Rr]undll32\.exe/ AND data_win_eventdata_parentImage:/.*(winword|excel|wscript|cscript|mshta|powershell)\.exe/
    pivot_on: host
    window: 4h
