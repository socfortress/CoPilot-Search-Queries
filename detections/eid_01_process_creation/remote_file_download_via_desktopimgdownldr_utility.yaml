name: Remote File Download Via Desktopimgdownldr Utility
id: 214641c2-c579-4ecb-8427-0cf19df6842e
version: 1
schema_version: "1.0"
date: "2022-09-27"
author: Tim Rauch, Elastic (idea)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 214641c2-c579-4ecb-8427-0cf19df6842e
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the desktopimgdownldr utility being used to download a remote file. An
  adversary may use desktopimgdownldr to download arbitrary files as an
  alternative to certutil. MITRE ATT&CK: T1105.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\desktopimgdownldr.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_parentImage:
              value: "*\\\\desktopimgdownldr.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*/lockscreenurl:http*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\desktopimgdownldr.exe'; data_win_eventdata_parentImage matches
  '*\desktopimgdownldr.exe'; data_win_eventdata_commandLine matches
  '*/lockscreenurl:http*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.elastic.co/guide/en/security/current/remote-file-download-via-desktopimgdownldr-utility.html
  - https://attack.mitre.org/techniques/T1105/

response:
  message: >
    Remote File Download Via Desktopimgdownldr Utility detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_parentImage: $data_win_eventdata_parentImage$.
    MITRE ATT&CK: T1105
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_parentImage
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1105
  custom_tags:
    - download
    - desktopimgdownldr
    - utility
    - process_creation
    - sysmon
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Dd][Ee][Ss][Kk][Tt][Oo][Pp][Ii][Mm][Gg][Dd][Oo][Ww][Nn][Ll][Dd][Rr]\.[Ee][Xx][Ee]/ AND data_win_eventdata_parentImage:/.*\\[Dd][Ee][Ss][Kk][Tt][Oo][Pp][Ii][Mm][Gg][Dd][Oo][Ww][Nn][Ll][Dd][Rr]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*\/[Ll][Oo][Cc][Kk][Ss][Cc][Rr][Ee][Ee][Nn][Uu][Rr][Ll]:[Hh][Tt][Tt][Pp].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d059842b-6b9d-4ed1-b5c3-5b89143c6ede
    name: File Download Via Bitsadmin
    reason: Alternative LOLBin downloader often tried when desktopimgdownldr is blocked.
  - id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
    name: PowerShell Download and Execution Cradles
    reason: Common parallel or next-stage download path for the same payload.
  - id: 70ad0861-d1fe-491c-a45f-fa48148a300d
    name: File Download via CertOC.EXE
    reason: Sibling LOLBin ingress-tool-transfer technique, often tried in sequence.
  - id: b6676963-0353-4f88-90f5-36c20d443c6a
    name: Cscript/Wscript Potentially Suspicious Child Process
    reason: Downloaded content is often a script launched via wscript/cscript afterward.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: desktopimgdownldr runs and lockscreen URL usage
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Dd]esktopimgdownldr\.exe/ OR data_win_eventdata_commandLine:/.*lockscreenurl.*/)
    pivot_on: host
    window: 2h
  - name: Files written to lock screen / personalization cache
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:(/.*[Pp]ersonalization.*/ OR /.*[Ll]ock[Ss]creen[Ii]mg.*/)
    pivot_on: host
    window: 2h
  - name: PersonalizationCSP registry changes
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Pp]ersonalization[Cc][Ss][Pp].*/
    pivot_on: host
    window: 2h
  - name: Network or DNS from desktopimgdownldr
    query: data_win_system_eventID:("3" OR "22") AND data_win_eventdata_image:/.*[Dd]esktopimgdownldr\.exe/
    pivot_on: host
    window: 2h
  - name: Execution of payloads from user paths
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:(/.*\\[Tt]emp\\.*\.exe/ OR /.*\\[Dd]ownloads\\.*\.exe/ OR /.*\\[Pp]rogram[Dd]ata\\.*\.exe/)
    pivot_on: host
    window: 2h
