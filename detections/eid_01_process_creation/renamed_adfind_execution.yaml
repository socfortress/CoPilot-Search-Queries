graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Dd][Oo][Mm][Aa][Ii][Nn][Ll][Ii][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Tt][Rr][Uu][Ss][Tt][Dd][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Dd][Cc][Mm][Oo][Dd][Ee][Ss].*/ OR data_win_eventdata_commandLine:/.*[Aa][Dd][Ii][Nn][Ff][Oo].*/ OR data_win_eventdata_commandLine:/.* [Dd][Cc][Ll][Ii][Ss][Tt] .*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr]_[Pp][Ww][Dd][Nn][Oo][Tt][Rr][Ee][Qq][Dd].*/ OR data_win_eventdata_commandLine:/.*[Oo][Bb][Jj][Ee][Cc][Tt][Cc][Aa][Tt][Ee][Gg][Oo][Rr][Yy]=.*/ OR data_win_eventdata_commandLine:/.*-[Ss][Uu][Bb][Nn][Ee][Tt][Ss] -[Ff].*/ OR data_win_eventdata_commandLine:/.*[Nn][Aa][Mm][Ee]=\"[Dd][Oo][Mm][Aa][Ii][Nn] [Aa][Dd][Mm][Ii][Nn][Ss]\".*/ OR data_win_eventdata_commandLine:/.*-[Ss][Cc] [Uu]:.*/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Mm][Aa][Ii][Nn][Nn][Cc][Ss].*/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Mm][Pp][Oo][Ll].*/ OR data_win_eventdata_commandLine:/.* [Oo][Uu][Dd][Mm][Pp] .*/ OR data_win_eventdata_commandLine:/.*[Ss][Uu][Bb][Nn][Ee][Tt][Dd][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Gg][Pp][Oo][Dd][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ff][Ss][Pp][Dd][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Uu][Ss][Ee][Rr][Ss]_[Nn][Oo][Ee][Xx][Pp][Ii][Rr][Ee].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr][Ss]_[Aa][Cc][Tt][Ii][Vv][Ee].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr][Ss]_[Pp][Ww][Dd][Nn][Oo][Tt][Rr][Ee][Qq][Dd].*/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=[Bb][Cc][Aa]5675746[Dd]13[Aa]1[Ff]246[Ee]2[Dd][Aa]3[Cc]2217492.*/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=53[Ee]117[Aa]96057[Ee][Aa][Ff]19[Cc]41380[Dd]0[Ee]87[Ff]1[Cc]2.*/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=[Dd]144[Dd][Ee]8117[Dd][Ff]2[Bb][Ee][Cc][Ee][Aa][Bb][Aa]2201[Aa][Dd]304764.*/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=12[Cc][Ee]1[Cc]0[Ff]3[Ff]5837[Ee][Cc][Cc]18[Aa]3782408[Ff][Aa]975.*/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=4[Ff][Bb][Ff]3[Ff]084[Ff][Bb][Bb][Bb]2470[Bb]80[Bb]2013134[Dd][Ff]35.*/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=49[Bb]639[Bb]4[Aa][Cc][Bb][Ee][Cc][Cc]49[Dd]72[Aa]01[Ff]357[Aa][Aa]4930.*/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=680[Dd][Aa][Dd]9[Ee]300346[Ee]05[Aa]85023965867201.*/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=21[Aa][Aa]085[Dd]54992511[Bb]9[Ff]115355[Ee]468782.*/ OR data_win_eventdata_originalFileName:/[Aa][Dd][Ff][Ii][Nn][Dd]\.[Ee][Xx][Ee]/) AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/.*\\[Aa][Dd][Ff][Ii][Nn][Dd]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 514e7e3e-b3b4-4a67-af60-be20f139198b
    name: PUA - AdFind.EXE Execution
    reason: Same tool under its real name on this host or a neighbour; shows the operator alternates named and renamed copies.
  - id: 455b9d50-15a1-4b99-853f-8d37655a4c1b
    name: PUA - Suspicious ActiveDirectory Enumeration Via AdFind.EXE
    reason: Catches the AD enumeration switches (objectcategory, domainlist) a renamed copy is typically run with.
  - id: 9a132afa-654e-11eb-ae93-0242ac130002
    name: PUA - AdFind Suspicious Execution
    reason: Command-line variant of the same AdFind discovery batch, usually scripted in sequence.
  - id: 41243735-89a7-4c83-bcdd-570aa78f00a1
    name: Domain Controller Discovery with Nltest
    reason: Operators run nltest dclist next to AdFind to locate DCs before querying them.
  - id: c3e05466-5f22-11eb-ae93-0242ac130002
    name: NLTest Domain Trust Discovery
    reason: Trust enumeration paired with AdFind trustdmp in ransomware pre-staging.
  - id: f376c8a7-a2d0-4ddc-aa0c-16c17236d962
    name: HackTool - Bloodhound/Sharphound Execution
    reason: Deeper AD mapping that follows or accompanies AdFind output review.
  - id: 3bad990e-4848-4a78-9530-b427d854aac0
    name: Domain Trust Discovery Via Dsquery
    reason: Alternative trust discovery tool used in the same recon burst.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: AD discovery commands on host
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Nn][Ll][Tt][Ee][Ss][Tt].*/ OR /.*[Dd][Ss][Qq][Uu][Ee][Rr][Yy].*/ OR /.*[Nn]et1? [Gg]roup.*/ OR /.*[Nn]et1? [Uu]ser.*\/[Dd]omain.*/)
    pivot_on: host
    window: 4h
  - name: Recon output files written
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(/.*[Aa]d_(users|computers|groups|trustdmp|ous).*/ OR /.*[Aa]dfind.*\.(txt|csv)/)
    pivot_on: host
    window: 4h
  - name: Archive or exfil tooling after recon
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Rr]clone.*/ OR /.*7z.* a .*/ OR /.*[Ww]in[Rr][Aa][Rr].* a .*/ OR /.*[Cc]url.* -[Tt] .*/)
    pivot_on: host
    window: 6h
  - name: Lateral movement tooling by user
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Pp][Ss][Ee]xec.*/ OR /.*[Ww]mic.*\/node.*/ OR /.*[Ss]chtasks.*\/[Ss] .*/)
    pivot_on: user
    window: 6h
  - name: Network and remote-interactive logons by user
    query: data_win_system_eventID:4624 AND data_win_eventdata_logonType:(3 OR 10)
    pivot_on: user
    window: 6h
