response:
  message: >
    Renamed AdFind Execution detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_hashes: $data_win_eventdata_hashes$. MITRE ATT&CK: T1018,
    T1087.002, T1482, T1069.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_hashes
      type: file_hash

