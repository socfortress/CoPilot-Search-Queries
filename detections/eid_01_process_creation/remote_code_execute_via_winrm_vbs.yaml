name: Remote Code Execute via Winrm.vbs
id: 9df0dd3a-1a5c-47e3-a2bc-30ed177646a0
version: 1
schema_version: "1.0"
date: "2023-03-03"
author: Julia Fomina, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 9df0dd3a-1a5c-47e3-a2bc-30ed177646a0
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects an attempt to execute code or create service on remote host via
  winrm.vbs. MITRE ATT&CK: T1216.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\cscript.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "cscript.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*winrm*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*invoke Create wmicimv2/Win32_*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*-r:http*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\cscript.exe'; data_win_eventdata_originalFileName equals 'cscript.exe';
  data_win_eventdata_commandLine matches '*winrm*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/bohops/status/994405551751815170
  - https://redcanary.com/blog/lateral-movement-winrm-wmi/
  - https://lolbas-project.github.io/lolbas/Scripts/Winrm/
  - https://attack.mitre.org/techniques/T1216/

response:
  message: >
    Remote Code Execute via Winrm.vbs detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1216
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1216
  custom_tags:
    - execute
    - winrm
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Ww][Ii][Nn][Rr][Mm].*/ AND data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee] [Cc][Rr][Ee][Aa][Tt][Ee] [Ww][Mm][Ii][Cc][Ii][Mm][Vv]2\/[Ww][Ii][Nn]32_.*/ AND data_win_eventdata_commandLine:/.*-[Rr]:[Hh][Tt][Tt][Pp].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 074e0ded-6ced-4ebd-8b4d-53f55908119d
    name: AWL Bypass with Winrm.vbs and Malicious WsmPty.xsl/WsmTxt.xsl
    reason: Same winrm.vbs abuse via XSL hijack; shows operator familiarity with winrm.vbs tradecraft.
  - id: 79df3f68-dccb-48e9-9171-b75cbc37c51d
    name: Potential Lateral Movement via Windows Remote Shell
    reason: Parallel WinRM-based lateral movement via winrs from the same source.
  - id: 5cc2cda8-f261-4d88-a2de-e9e193c86716
    name: Suspicious Processes Spawned by WinRM
    reason: 'Destination-side effect: suspicious children of the WinRM host process on the target.'
  - id: 734f8d9b-42b8-41b2-bcf5-abaf49d5a3c8
    name: Remote PowerShell Session Host Process (WinRM)
    reason: Destination-side evidence of wsmprovhost running the remote command.
  - id: 692f0bec-83ba-4d04-af7e-e884a96059b6
    name: Potential WMI Lateral Movement WmiPrvSE Spawned PowerShell
    reason: winrm.vbs 'invoke Create Win32_Process' lands as WmiPrvSE children on the target.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other remote execution commands from this host
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:(/.*[Ww]inrs.*-r.*/ OR /.*[Ii]nvoke-[Cc]ommand.*-[Cc]omputer[Nn]ame.*/ OR /.*[Ee]nter-[Pp][Ss][Ss]ession.*/ OR /.*[Ww]mic.*\/node.*/ OR /.*[Pp][Ss][Ee]xec.*/)
    pivot_on: host
    window: 4h
  - name: WinRM/WMI-spawned processes on the target
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:(/.*[Ww]sm[Pp]rov[Hh]ost\.exe/ OR /.*[Ww]mi[Pp]rv[Ss][Ee]\.exe/)
    pivot_on: host
    window: 4h
  - name: Remote service creation
    query: data_win_system_eventID:"7045" OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Ss][Cc]\.exe.*[Cc]reate.*/)
    pivot_on: host
    window: 4h
  - name: Network logons and explicit credential use
    query: data_win_system_eventID:("4624" OR "4648") AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_targetServerName:*)
    pivot_on: user
    window: 4h
  - name: WinRM connections on 5985/5986
    query: data_win_system_eventID:"3" AND data_win_eventdata_destinationPort:("5985" OR "5986")
    pivot_on: host
    window: 4h
