name: Group Membership Reconnaissance Via Whoami.EXE
id: bd8b828d-0dca-48e1-8a63-8a58ecf2644f
version: 1
schema_version: "1.0"
date: "2023-02-28"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: bd8b828d-0dca-48e1-8a63-8a58ecf2644f
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of whoami.exe with the /group command line flag to show
  group membership for the current user, account type, security identifiers
  (SID), and attributes. MITRE ATT&CK: T1033.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\whoami.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "whoami.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /groups*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -groups*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\whoami.exe'; data_win_eventdata_originalFileName equals 'whoami.exe';
  data_win_eventdata_commandLine matches '* /groups*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/whoami
  - https://attack.mitre.org/techniques/T1033/

response:
  message: >
    Group Membership Reconnaissance Via Whoami.EXE detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1033
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1033
  custom_tags:
    - group
    - membership
    - reconnaissance
    - process_creation
    - sysmon
    - discovery
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ww][Hh][Oo][Aa][Mm][Ii]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ww][Hh][Oo][Aa][Mm][Ii]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.* \/[Gg][Rr][Oo][Uu][Pp][Ss].*/ OR data_win_eventdata_commandLine:/.* -[Gg][Rr][Oo][Uu][Pp][Ss].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c248c896-e412-4279-8c15-1c558067b6fa
    name: Enumerate All Information With Whoami.EXE
    reason: Same tool with /all; attackers run several whoami variants back to back.
  - id: 97a80ec7-0e2f-4d05-9ef4-65760e634f6b
    name: Security Privileges Enumeration Via Whoami.EXE
    reason: whoami /priv is the usual companion to /groups when judging escalation options.
  - id: f1086bf7-a0c4-4a37-9102-01e573caf4a0
    name: Renamed Whoami Execution
    reason: Evasion variant of the same recon via a renamed binary.
  - id: d95de845-b83c-4a9a-8a6a-4fc802ebf6c0
    name: Suspicious Group And Account Reconnaissance Activity Using Net.EXE
    reason: Group/account discovery with net.exe follows to expand from self to domain.
  - id: 41243735-89a7-4c83-bcdd-570aa78f00a1
    name: Domain Controller Discovery with Nltest
    reason: 'Next step: locating domain controllers after learning group membership.'
  - id: aa2efee7-34dd-446e-8a37-40790a66efd7
    name: Recon Information for Export with Command Prompt
    reason: Batched recon output redirected to files for exfil.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other whoami/identity recon
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Ww][Hh][Oo][Aa][Mm][Ii]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 2h
  - name: Net/nltest group and domain discovery
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Nn][Ee][Tt]\.[Ee][Xx][Ee]|\\[Nn][Ee][Tt]1\.[Ee][Xx][Ee])/ AND data_win_eventdata_commandLine:/.*([Gg][Rr][Oo][Uu][Pp]|[Uu][Ss][Ee][Rr]|[Aa][Dd][Mm][Ii][Nn][Ii][Ss][Tt][Rr][Aa][Tt][Oo][Rr][Ss]).*/ OR data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Aa][Dd][Ff][Ii][Nn][Dd]\.[Ee][Xx][Ee]|\\[Dd][Ss][Qq][Uu][Ee][Rr][Yy]\.[Ee][Xx][Ee]|\\[Nn][Ll][Tt][Ee][Ss][Tt]\.[Ee][Xx][Ee]|\\[Cc][Ss][Vv][Dd][Ee]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 2h
  - name: Recon command burst
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Ww][Hh][Oo][Aa][Mm][Ii]\.[Ee][Xx][Ee]|\\[Nn][Ee][Tt]\.[Ee][Xx][Ee]|\\[Nn][Ee][Tt]1\.[Ee][Xx][Ee]|\\[Ii][Pp][Cc][Oo][Nn][Ff][Ii][Gg]\.[Ee][Xx][Ee]|\\[Ss][Yy][Ss][Tt][Ee][Mm][Ii][Nn][Ff][Oo]\.[Ee][Xx][Ee]|\\[Nn][Ll][Tt][Ee][Ss][Tt]\.[Ee][Xx][Ee]|\\[Nn][Ee][Tt][Ss][Tt][Aa][Tt]\.[Ee][Xx][Ee]|\\[Tt][Aa][Ss][Kk][Ll][Ii][Ss][Tt]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 1h
  - name: Script hosts and shells parenting recon
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*(\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 2h
  - name: Staging/archiving after recon
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]\-[Aa][Rr][Cc][Hh][Ii][Vv][Ee]|\.7[Zz]|\.[Rr][Aa][Rr]|[Gg][Zz][Ii][Pp][Ss][Tt][Rr][Ee][Aa][Mm]|[Dd][Ee][Ff][Ll][Aa][Tt][Ee][Ss][Tt][Rr][Ee][Aa][Mm]).*/
    pivot_on: host
    window: 4h
