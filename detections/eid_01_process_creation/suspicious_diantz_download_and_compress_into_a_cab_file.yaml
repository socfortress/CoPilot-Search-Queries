name: Suspicious Diantz Download and Compress Into a CAB File
id: 185d7418-f250-42d0-b72e-0c8b70661e93
version: 1
schema_version: "1.0"
date: "2022-08-13"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 185d7418-f250-42d0-b72e-0c8b70661e93
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Download and compress a remote file and store it in a cab file on local
  machine. MITRE ATT&CK: T1105.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*diantz.exe*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine: "* \\\\\\\\*"
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*.cab*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*diantz.exe*'; data_win_eventdata_commandLine matches '* \\*';
  data_win_eventdata_commandLine matches '*.cab*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://lolbas-project.github.io/lolbas/Binaries/Diantz/
  - https://attack.mitre.org/techniques/T1105/

response:
  message: >
    Suspicious Diantz Download and Compress Into a CAB File detected on host
    $agent_name$. Matched data_win_eventdata_commandLine:
    $data_win_eventdata_commandLine$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1105
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1105
  custom_tags:
    - diantz
    - download
    - compress
    - process_creation
    - sysmon
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Dd][Ii][Aa][Nn][Tt][Zz]\.[Ee][Xx][Ee].*/ AND data_win_eventdata_commandLine:/.* \\\\.*/ AND data_win_eventdata_commandLine:/.*\.[Cc][Aa][Bb].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 6b369ced-4b1d-48f1-b427-fdc0de0790bd
    name: Suspicious Diantz Alternate Data Stream Execution
    reason: Same binary abused for hiding; the pulled cab may be stored in an ADS.
  - id: 9f107a84-532c-41af-b005-8d12a607639f
    name: Potentially Suspicious Cabinet File Expansion
    reason: The pulled cab is expanded next to recover the payload.
  - id: c74c0390-3e20-41fd-a69a-128f0275a5ea
    name: Cab File Extraction Via Wusa.EXE From Potentially Suspicious Paths
    reason: Alternative extraction method for the staged cab.
  - id: windows-cab-file-on-disk-001
    name: Windows CAB File on Disk
    reason: File-create evidence that the remote content was written locally as a cab.
  - id: d4ca7c59-e9e4-42d8-bf57-91a776efcb87
    name: LOLBIN Execution From Abnormal Drive
    reason: Other LOLBins run from odd or mounted drives are common in the same staged chain.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: CAB files created on disk
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\.[Cc][Aa][Bb].*/)
    pivot_on: host
    window: 2h
  - name: Cab expansion by expand/extrac32/wusa
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Ee][Xx][Pp][Aa][Nn][Dd]\.[Ee][Xx][Ee]|[Ee][Xx][Tt][Rr][Aa][Cc]32\.[Ee][Xx][Ee]|[Ww][Uu][Ss][Aa]\.[Ee][Xx][Ee])/)
    pivot_on: host
    window: 4h
  - name: UNC/WebDAV remote paths in command lines
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*\\\\.*/ OR data_win_eventdata_commandLine:/.*@[Ss][Ss][Ll].*/ OR data_win_eventdata_commandLine:/.*[Dd][Aa][Vv][Ww][Ww][Ww][Rr][Oo][Oo][Tt].*/)
    pivot_on: host
    window: 4h
  - name: SMB/WebDAV outbound connections from packing/system processes
    query: data_win_system_eventID:"3" AND (data_win_eventdata_destinationPort:445 OR data_win_eventdata_destinationPort:80 OR data_win_eventdata_destinationPort:443) AND data_win_eventdata_image:/.*\\([Dd][Ii][Aa][Nn][Tt][Zz]\.[Ee][Xx][Ee]|[Mm][Aa][Kk][Ee][Cc][Aa][Bb]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 2h
  - name: Execution from user-writable staging paths
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_image:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/) AND (data_win_eventdata_image:/.*\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\.[Dd][Ll][Ll].*/)
    pivot_on: host
    window: 2h
