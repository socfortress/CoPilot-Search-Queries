  - https://www.slideshare.net/heirhabarov/hunting-for-credentials-dumping-in-windows-environment
  - https://blog.talosintelligence.com/2017/05/wannacry.html
  - https://securingtomorrow.mcafee.com/other-blogs/mcafee-labs/new-teslacrypt-ransomware-arrives-via-spam/
  - https://www.bleepingcomputer.com/news/security/why-everyone-should-disable-vssadmin-exe-now/
  - https://www.hybrid-analysis.com/sample/ed01ebfbc9eb5bbea545af4d01bf5f1071661840480439c6e5babe8e080e41aa?environmentId=100
  - https://github.com/Neo23x0/Raccine#the-process
  - https://github.com/Neo23x0/Raccine/blob/20a569fa21625086433dcce8bb2765d0ea08dcb6/yara/gen_ransomware_command_lines.yar
  - https://redcanary.com/blog/intelligence-insights-october-2021/
  - https://symantec-enterprise-blogs.security.com/blogs/threat-intelligence/blackbyte-exbyte-ransomware
  - https://attack.mitre.org/techniques/T1070/
  - https://attack.mitre.org/techniques/T1490/

response:
  message: >
    Shadow Copies Deletion Using Operating Systems Utilities detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1070, T1490
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1070
    - T1490
  custom_tags:
    - shadow
    - copies
    - deletion
    - process_creation
    - sysmon
    - impact
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (((data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Dd][Ii][Ss][Kk][Ss][Hh][Aa][Dd][Oo][Ww]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Pp][Ww][Ss][Hh]\.[Dd][Ll][Ll]/ OR data_win_eventdata_originalFileName:/[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Dd][Ii][Ss][Kk][Ss][Hh][Aa][Dd][Oo][Ww]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Ss][Hh][Aa][Dd][Oo][Ww].*/ AND data_win_eventdata_commandLine:/.*[Dd][Ee][Ll][Ee][Tt][Ee].*/) OR ((data_win_eventdata_image:/.*\\[Ww][Bb][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ww][Bb][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Dd][Ee][Ll][Ee][Tt][Ee].*/ AND data_win_eventdata_commandLine:/.*[Cc][Aa][Tt][Aa][Ll][Oo][Gg].*/ AND data_win_eventdata_commandLine:/.*[Qq][Uu][Ii][Ee][Tt].*/) OR ((data_win_eventdata_image:/.*\\[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Rr][Ee][Ss][Ii][Zz][Ee].*/ AND data_win_eventdata_commandLine:/.*[Ss][Hh][Aa][Dd][Oo][Ww][Ss][Tt][Oo][Rr][Aa][Gg][Ee].*/ AND (data_win_eventdata_commandLine:/.*[Uu][Nn][Bb][Oo][Uu][Nn][Dd][Ee][Dd].*/ OR data_win_eventdata_commandLine:/.*\/[Mm][Aa][Xx][Ss][Ii][Zz][Ee]=.*/)))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 89f75308-5b1b-4390-b2d8-d6b2340efaf8
    name: Windows Backup Deleted Via Wbadmin.EXE
    reason: Ransomware deletes wbadmin backups together with shadows to block recovery.
  - id: 639c9081-f482-47d3-a0bd-ddee3d4ecd76
    name: All Backups Deleted Via Wbadmin.EXE
    reason: Same inhibit-recovery step, wiping all backups.
  - id: 1444443e-6757-43e4-9ea4-c8fc705f79a2
    name: Boot Configuration Tampering Via Bcdedit.EXE
    reason: 'Standard companion: disabling recovery/ignoring failures right after shadow deletion.'
  - id: c9fbe8e9-119d-40a6-9b59-dd58a5d84429
    name: Potential Ransomware or Unauthorized MBR Tampering Via Bcdedit.EXE
    reason: Bcdedit recovery tampering in the same ransomware pre-encryption batch.
  - id: 21ff4ca9-f13a-41ad-b828-0077b2af2e40
    name: Deletion of Volume Shadow Copies via WMI with PowerShell
    reason: Alternate deletion method used by the same operator.
  - id: 5ee2bcd0-b2ff-11eb-bb34-acde48001122
    name: Delete ShadowCopy With PowerShell
    reason: Script-block view of PowerShell-based shadow deletion.
  - id: 236e7c8e-c9d9-11eb-a824-acde48001122
    name: Disable Logs Using WevtUtil
    reason: Ransomware operators clear/disable logs alongside inhibiting recovery.
  - id: 34ebb878-1b15-4895-b352-ca2eeb99b274
    name: Suspicious Execution of Shutdown
    reason: Forced reboot/shutdown often follows to trigger encryption or finalize impact.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Backup and recovery inhibition commands
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ww]badmin.*delete.*/ OR /.*[Bb]cdedit.*(recoveryenabled|bootstatuspolicy).*/ OR /.*[Vv]ssadmin.*delete.*/)
    pivot_on: host
    window: 4h
  - name: Security service and backup process termination
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Tt]askkill.*\/[Ff].*/ OR /.*net.*stop.*/ OR /.*sc.*stop.*/) AND data_win_eventdata_commandLine:/.*([Ss]ql|[Vv]eeam|[Bb]ackup|[Dd]efender|[Ss]ophos|[Ss]ymantec).*/
    pivot_on: host
    window: 4h
  - name: Event log clearing
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ww]evtutil.*(cl|clear-log).*/ OR /.*Clear-EventLog.*/)
    pivot_on: host
    window: 4h
  - name: Ransom note and encrypted file creation
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(/.*([Rr]eadme|[Dd]ecrypt|[Rr]estore|[Rr]ecover).*\.(txt|html|hta)/ OR /.*\.(locked|encrypted|crypt|enc)/)
    pivot_on: host
    window: 4h
  - name: Remote execution tooling
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*\\([Pp][Ss][Ee][Xx][Ee][Cc]|PSEXESVC).*/
    pivot_on: host
    window: 4h
