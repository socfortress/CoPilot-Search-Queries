name: Disabled IE Security Features
id: fb50eb7a-5ab1-43ae-bcc9-091818cb8424
version: 1
schema_version: "1.0"
date: "2021-11-27"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: fb50eb7a-5ab1-43ae-bcc9-091818cb8424
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects command lines that indicate unwanted modifications to registry keys
  that disable important Internet Explorer security features. MITRE ATT&CK:
  T1685.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* -name IEHarden *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* -value 0 *"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* -name DEPOff *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* -value 1 *"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* -name DisableFirstRunCustomize *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* -value 2 *"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches '*
  -name IEHarden *'; data_win_eventdata_commandLine matches '* -value 0 *';
  data_win_eventdata_commandLine matches '* -name DEPOff *', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://unit42.paloaltonetworks.com/operation-ke3chang-resurfaces-with-new-tidepool-malware/
  - https://attack.mitre.org/techniques/T1685/

response:
  message: >
    Disabled IE Security Features detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1685
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685
  custom_tags:
    - security
    - features
    - process_creation
    - sysmon
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND ((data_win_eventdata_commandLine:/.* -[Nn][Aa][Mm][Ee] [Ii][Ee][Hh][Aa][Rr][Dd][Ee][Nn] .*/ AND data_win_eventdata_commandLine:/.* -[Vv][Aa][Ll][Uu][Ee] 0 .*/) OR (data_win_eventdata_commandLine:/.* -[Nn][Aa][Mm][Ee] [Dd][Ee][Pp][Oo][Ff][Ff] .*/ AND data_win_eventdata_commandLine:/.* -[Vv][Aa][Ll][Uu][Ee] 1 .*/) OR (data_win_eventdata_commandLine:/.* -[Nn][Aa][Mm][Ee] [Dd][Ii][Ss][Aa][Bb][Ll][Ee][Ff][Ii][Rr][Ss][Tt][Rr][Uu][Nn][Cc][Uu][Ss][Tt][Oo][Mm][Ii][Zz][Ee] .*/ AND data_win_eventdata_commandLine:/.* -[Vv][Aa][Ll][Uu][Ee] 2 .*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 10344bb3-7f65-46c2-b915-2d00d47be5b0
    name: IE ZoneMap Setting Downgraded To MyComputer Zone For HTTP Protocols Via CLI
    reason: Zone downgrade via CLI is another IE/Internet Settings weakening often done in the same script.
  - id: 5e95028c-5229-4214-afae-d653d573d0ec
    name: Security Service Disabled Via Reg.EXE
    reason: 'Same scripted defense-evasion pattern: registry edits disabling security components.'
  - id: 452bce90-6fb0-43cc-97a5-affc283139b3
    name: Suspicious Windows Defender Registry Key Tampering Via Reg.EXE
    reason: Registry-based Defender tampering commonly co-occurs with IE hardening being turned off.
  - id: c148a894-dd93-11eb-bf2a-acde48001122
    name: Powershell Disable Security Monitoring
    reason: PowerShell disabling security monitoring is the same host-weakening phase.
  - id: cf2e938e-9a3e-4fe8-a347-411642b28a9f
    name: Potential PowerShell Execution Policy Tampering - ProcCreation
    reason: Execution policy tampering usually precedes the PowerShell script that sets these IE values.
  - id: 17769c90-230e-488b-a463-e05c08e9d48f
    name: Powershell Defender Exclusion
    reason: Defender exclusions are added alongside to let the payload run after IE protections are removed.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: PowerShell/reg edits on IE and Internet Settings keys
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*Internet Explorer.*/ OR /.*InternetSettings.*/ OR /.*Internet Settings.*/) AND data_win_eventdata_commandLine:/.*(Set-ItemProperty|New-ItemProperty|reg add).*/
    pivot_on: host
    window: 4h
  - name: Encoded or download-cradle PowerShell
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND data_win_eventdata_commandLine:(/.* -[Ee]nc.*/ OR /.*[Ii]nvoke-[Ww]eb[Rr]equest.*/ OR /.*[Dd]ownload(String|File).*/ OR /.*IEX.*/)
    pivot_on: host
    window: 4h
  - name: Registry writes to IE security values
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:(/.*IEHarden.*/ OR /.*DEPOff.*/ OR /.*DisableFirstRunCustomize.*/ OR /.*Internet Settings.*Zones.*/)
    pivot_on: host
    window: 4h
  - name: Browser or Office spawning script interpreters
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:(/.*iexplore\.exe/ OR /.*winword\.exe/ OR /.*excel\.exe/) AND data_win_eventdata_image:(/.*[Pp]ower[Ss]hell.*/ OR /.*cmd\.exe/ OR /.*mshta\.exe/ OR /.*wscript\.exe/)
    pivot_on: host
    window: 6h
