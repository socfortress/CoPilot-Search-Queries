name: Arbitrary File Download Via MSEDGE_PROXY.EXE
id: e84d89c4-f544-41ca-a6af-4b92fd38b023
version: 1
schema_version: "1.0"
date: "2023-11-09"
author: Swachchhanda Shrawan Poudel
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: e84d89c4-f544-41ca-a6af-4b92fd38b023
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects usage of "msedge_proxy.exe" to download arbitrary files. MITRE ATT&CK:
  T1218.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\msedge_proxy.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "msedge_proxy.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*http://*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*https://*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\msedge_proxy.exe'; data_win_eventdata_originalFileName equals
  'msedge_proxy.exe'; data_win_eventdata_commandLine matches '*http://*', among
  other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://lolbas-project.github.io/lolbas/Binaries/msedge_proxy/
  - https://attack.mitre.org/techniques/T1218/

response:
  message: >
    Arbitrary File Download Via MSEDGE_PROXY.EXE detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1218
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218
  custom_tags:
    - arbitrary
    - download
    - msedge
    - process_creation
    - sysmon
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Mm][Ss][Ee][Dd][Gg][Ee]_[Pp][Rr][Oo][Xx][Yy]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Mm][Ss][Ee][Dd][Gg][Ee]_[Pp][Rr][Oo][Xx][Yy]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp]:\/\/.*/ OR data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp][Ss]:\/\/.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: eee00933-a761-4cd0-be70-c42fe91731e7
    name: Arbitrary File Download Via GfxDownloadWrapper.EXE
    reason: Same LOLBin download family; attackers rotate binaries, so a second URL-fetching LOLBin on the host shows the same staging effort.
  - id: 1f0f6176-6482-4027-b151-00071af39d7e
    name: Arbitrary File Download Via ConfigSecurityPolicy.EXE
    reason: Sibling signed-binary downloader; co-occurrence suggests retry with an alternate LOLBin after the first was blocked.
  - id: d059842b-6b9d-4ed1-b5c3-5b89143c6ede
    name: File Download Via Bitsadmin
    reason: Common fallback downloader for the same payload staging.
  - id: 2ddef153-167b-4e89-86b6-757a9e65dcac
    name: File Download Via Bitsadmin To A Suspicious Target Folder
    reason: Download landing in Temp/Public/AppData is the staging step that accompanies a LOLBin URL fetch.
  - id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
    name: PowerShell Download and Execution Cradles
    reason: Typical parallel or next-stage fetch cradle when the LOLBin download is part of a scripted chain.
  - id: 7b434893-c57d-4f41-908d-6a17bf1ae98f
    name: Network Connection Initiated From Process Located In Potentially Suspicious Or Uncommon Location
    reason: The downloaded payload executing from a user-writable path and beaconing is the follow-on.
  - id: 81325ce1-be01-4250-944f-b4789644556f
    name: Schedule Task Creation From Env Variable Or Potentially Suspicious Path Via Schtasks.EXE
    reason: Persistence for the downloaded payload commonly takes the form of a scheduled task from a suspicious path.
  - id: 24357373-078f-44ed-9ac4-6d334a668a11
    name: Direct Autorun Keys Modification
    reason: Run-key persistence is a common follow-on once the payload is on disk.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: All invocations and children of the LOLBin
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*[Mm][Ss][Ee][Dd][Gg][Ee]_[Pp][Rr][Oo][Xx][Yy]\.exe/ OR data_win_eventdata_parentImage:/.*[Mm][Ss][Ee][Dd][Gg][Ee]_[Pp][Rr][Oo][Xx][Yy]\.exe/)
    pivot_on: host
    window: 4h
  - name: msedge_proxy file writes and network activity
    query: (data_win_system_eventID:11 OR data_win_system_eventID:3) AND data_win_eventdata_image:/.*[Mm][Ss][Ee][Dd][Gg][Ee]_[Pp][Rr][Oo][Xx][Yy]\.exe/
    pivot_on: host
    window: 2h
  - name: Executables and scripts created in user-writable paths
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(/.*[Aa]pp[Dd]ata.*\.(exe|dll|ps1|vbs|js|hta|bat|msi)/ OR /.*[Tt]emp.*\.(exe|dll|ps1|vbs|js|hta|bat|msi)/ OR /.*[Pp]ublic.*\.(exe|dll|ps1|vbs|js|hta|bat|msi)/)
    pivot_on: host
    window: 2h
  - name: Other URL-fetching downloaders
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(*http\://* OR *https\://* OR *ftp\://*) AND data_win_eventdata_image:(/.*[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn].*/ OR /.*[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll].*/ OR /.*[Cc][Uu][Rr][Ll]\.exe/ OR /.*[Pp]ower[Ss]hell.*/ OR /.*[Mm][Ss][Hh][Tt][Aa].*/)
    pivot_on: host
    window: 4h
  - name: Persistence created after download (schtasks / Run key)
    query: data_win_system_eventID:1 AND ((data_win_eventdata_image:/.*[Ss]chtasks\.exe/ AND data_win_eventdata_commandLine:*[Cc][Rr][Ee][Aa][Tt][Ee]*) OR (data_win_eventdata_image:/.*[Rr]eg\.exe/ AND data_win_eventdata_commandLine:*[Cc]urrent[Vv]ersion*[Rr]un*))
    pivot_on: host
    window: 6h
