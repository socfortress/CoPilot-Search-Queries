name: Windows Hotfix Updates Reconnaissance Via Wmic.EXE
id: dfd2fcb7-8bd5-4daa-b132-5adb61d6ad45
version: 1
schema_version: "1.0"
date: "2023-02-14"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: dfd2fcb7-8bd5-4daa-b132-5adb61d6ad45
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of wmic with the "qfe" flag in order to obtain
  information about installed hotfix updates on the system. This is often used
  by pentester and attacker enumeration scripts. MITRE ATT&CK: T1047.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - term:
                  data_win_eventdata_originalFileName:
                    value: "wmic.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\WMIC.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* qfe*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_originalFileName
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_originalFileName equals
  'wmic.exe'; data_win_eventdata_image matches '*\WMIC.exe';
  data_win_eventdata_commandLine matches '* qfe*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/carlospolop/PEASS-ng/blob/fa0f2e17fbc1d86f1fd66338a40e665e7182501d/winPEAS/winPEASbat/winPEAS.bat
  - https://sushant747.gitbooks.io/total-oscp-guide/content/privilege_escalation_windows.html
  - https://attack.mitre.org/techniques/T1047/

response:
  message: >
    Windows Hotfix Updates Reconnaissance Via Wmic.EXE detected on host
    $agent_name$. Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1047
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_originalFileName
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1047
  custom_tags:
    - hotfix
    - updates
    - reconnaissance
    - process_creation
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_originalFileName:/[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.* [Qq][Ff][Ee].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 9d5a1274-922a-49d0-87f3-8c653483b909
    name: Uncommon System Information Discovery Via Wmic.EXE
    reason: Other wmic system queries typically run in the same enumeration script to profile the host.
  - id: 9d7ca793-f6bd-471c-8d0f-11e68b2f0d2f
    name: Computer System Reconnaissance Via Wmic.EXE
    reason: Computer system profiling is the sibling step in privilege-escalation enumeration scripts.
  - id: 15434e33-5027-4914-88d5-3d4145ec25a9
    name: Potential Product Reconnaissance Via Wmic.EXE
    reason: Installed software listing complements missing-patch discovery to pick an exploit.
  - id: 76f55eaa-d27f-4213-9d45-7b0e4b60bbae
    name: Service Reconnaissance Via Wmic.EXE
    reason: Service enumeration is a standard companion in local privesc recon like WinPEAS.
  - id: 68bcd73b-37ef-49cb-95fc-edc809730be6
    name: Potential Unquoted Service Path Reconnaissance Via Wmic.EXE
    reason: Unquoted service path hunting is another privesc vector probed after patch-level checks.
  - id: 221b251a-357a-49a9-920a-271802777cc0
    name: Potential Process Reconnaissance via Wmic.EXE
    reason: Process listing to find security tools or targets follows host profiling.
  - id: 847d5ff3-8a31-4737-a970-aeae8fe21765
    name: Potential Tampering With Security Products Via WMIC
    reason: After profiling, attackers may disable AV through WMIC.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Wmic reconnaissance queries
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*\\[Ww][Mm][Ii][Cc]\.exe/ AND data_win_eventdata_commandLine:/.*([Oo][Ss] get|[Cc]omputersystem|[Pp]roduct|[Ss]ervice get|[Pp]rocess get|[Ll]ogicaldisk|[Uu]seraccount|[Bb]ios).*/
    pivot_on: host
    window: 2h
  - name: Systeminfo and patch enumeration alternatives
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*\\[Ss]ysteminfo\.exe/ OR data_win_eventdata_commandLine:/.*[Gg]et-[Hh]ot[Ff]ix.*/ OR data_win_eventdata_commandLine:/.*[Ww]in32_[Qq]uick[Ff]ix[Ee]ngineering.*/)
    pivot_on: host
    window: 2h
  - name: Known enumeration scripts and tools
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*([Ww]in[Pp][Ee][Aa][Ss]|[Pp]ower[Uu]p|[Ss]herlock|[Ww]atson|[Ss]eatbelt|[Jj]aws).*/
    pivot_on: host
    window: 4h
  - name: Whoami and privilege checks
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*\\[Ww]hoami\.exe/ AND data_win_eventdata_commandLine:/.*(\/priv|\/groups|\/all).*/
    pivot_on: user
    window: 2h
  - name: Shell activity running as SYSTEM after recon
    query: data_win_system_eventID:1 AND data_win_eventdata_user:/.*SYSTEM.*/ AND data_win_eventdata_parentImage:(/.*\\[Pp]ower[Ss]hell\.exe/ OR /.*\\[Cc]md\.exe/) AND data_win_eventdata_image:(/.*\\[Cc]md\.exe/ OR /.*\\[Pp]ower[Ss]hell\.exe/)
    pivot_on: host
    window: 4h
