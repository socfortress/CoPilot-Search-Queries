name: Visual Studio NodejsTools PressAnyKey Renamed Execution
id: 65c3ca2c-525f-4ced-968e-246a713d164f
version: 1
schema_version: "1.0"
date: "2023-04-11"
author: Nasreddine Bencherchali (Nextron Systems), Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 65c3ca2c-525f-4ced-968e-246a713d164f
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects renamed execution of "Microsoft.NodejsTools.PressAnyKey.exe", which
  can be abused as a LOLBIN to execute arbitrary binaries. MITRE ATT&CK: T1218.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - term:
            data_win_eventdata_originalFileName:
              value: "Microsoft.NodejsTools.PressAnyKey.exe"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\Microsoft.NodejsTools.PressAnyKey.exe"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_originalFileName
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_originalFileName equals
  'Microsoft.NodejsTools.PressAnyKey.exe'; data_win_eventdata_image matches
  '*\Microsoft.NodejsTools.PressAnyKey.exe'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/mrd0x/status/1463526834918854661
  - https://gist.github.com/nasbench/a989ce64cefa8081bd50cf6ad8c491b5
  - https://attack.mitre.org/techniques/T1218/

response:
  message: >
    Visual Studio NodejsTools PressAnyKey Renamed Execution detected on host
    $agent_name$. Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1218
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_originalFileName
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218
  custom_tags:
    - visual
    - studio
    - nodejstools
    - process_creation
    - sysmon
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_originalFileName:/[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\.[Nn][Oo][Dd][Ee][Jj][Ss][Tt][Oo][Oo][Ll][Ss]\.[Pp][Rr][Ee][Ss][Ss][Aa][Nn][Yy][Kk][Ee][Yy]\.[Ee][Xx][Ee]/ AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\.[Nn][Oo][Dd][Ee][Jj][Ss][Tt][Oo][Oo][Ll][Ss]\.[Pp][Rr][Ee][Ss][Ss][Aa][Nn][Yy][Kk][Ee][Yy]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d4ca7c59-e9e4-42d8-bf57-91a776efcb87
    name: LOLBIN Execution From Abnormal Drive
    reason: A renamed signed LOLBin copied to removable or odd drives is a common staging pattern; same proxy-execution tradecraft.
  - id: 2569ed8c-1147-498a-9b8c-2ad3656b10ed
    name: Potential Renamed Rundll32 Execution
    reason: Same rename-to-evade technique; attackers often rename several signed binaries in one intrusion.
  - id: 0b0cd537-fc77-4e6e-a973-e53495c1083d
    name: Renamed Office Binary Execution
    reason: Co-occurring OriginalFileName-mismatch evasion on the same host indicates a deliberate masquerading toolkit.
  - id: e6474a1b-5390-49cd-ab41-8d88655f7394
    name: Renamed Mavinject.EXE Execution
    reason: Another renamed signed LOLBin used for proxy execution/injection, often chained after the first renamed proxy.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Children spawned by the renamed PressAnyKey proxy
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentCommandLine:/.*[Pp][Rr][Ee][Ss][Ss][Aa][Nn][Yy][Kk][Ee][Yy].*/
    pivot_on: host
    window: 2h
  - name: Any process whose original name is PressAnyKey but image differs
    query: data_win_system_eventID:"1" AND data_win_eventdata_originalFileName:/.*[Pp][Rr][Ee][Ss][Ss][Aa][Nn][Yy][Kk][Ee][Yy].*/
    pivot_on: host
    window: 24h
  - name: Executables dropped in user-writable paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\(Users|ProgramData|Temp)\\.*\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Shells/script hosts launched from user-writable parents
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\(cmd|powershell|pwsh|wscript|cscript|mshta)\.exe/ AND data_win_eventdata_parentImage:/.*\\(Users|ProgramData|Temp)\\.*/
    pivot_on: host
    window: 2h
