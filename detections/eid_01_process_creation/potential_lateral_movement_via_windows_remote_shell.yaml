name: Potential Lateral Movement via Windows Remote Shell
id: 79df3f68-dccb-48e9-9171-b75cbc37c51d
version: 1
schema_version: "1.0"
date: "2025-10-22"
author: Liran Ravich
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 79df3f68-dccb-48e9-9171-b75cbc37c51d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a child process spawned by 'winrshost.exe', which suggests remote
  command execution through Windows Remote Shell (WinRs) and may indicate
  potential lateral movement activity. MITRE ATT&CK: T1021.006.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_parentImage:
              value: "*\\\\winrshost.exe"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - term:
                  data_win_eventdata_image:
                    value: "C:\\Windows\\System32\\conhost.exe"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\winrshost.exe'; data_win_eventdata_image equals
  'C:\Windows\System32\conhost.exe'.

known_false_positives: >
  Legitimate use of WinRM within the organization. Baseline expected activity in
  your environment and tune this detection before relying on it for automated
  response.

references:
  - https://cardinalops.com/blog/living-off-winrm-abusing-complexity-in-remote-management/
  - https://www.ired.team/offensive-security/lateral-movement/winrs-for-lateral-movement
  - https://attack.mitre.org/techniques/T1021/006/

response:
  message: >
    Potential Lateral Movement via Windows Remote Shell detected on host
    $agent_name$. Matched data_win_eventdata_parentImage:
    $data_win_eventdata_parentImage$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1021.006
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1021.006
  custom_tags:
    - lateral
    - movement
    - shell
    - process_creation
    - sysmon
    - lateral_movement
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ww][Ii][Nn][Rr][Ss][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Cc][Oo][Nn][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 734f8d9b-42b8-41b2-bcf5-abaf49d5a3c8
    name: Remote PowerShell Session Host Process (WinRM)
    reason: Sibling WinRM-originated execution (wsmprovhost); same remote management channel.
  - id: 5cc2cda8-f261-4d88-a2de-e9e193c86716
    name: Suspicious Processes Spawned by WinRM
    reason: Suspicious children of WinRM provider processes on the same target after remote access.
  - id: 9df0dd3a-1a5c-47e3-a2bc-30ed177646a0
    name: Remote Code Execute via Winrm.vbs
    reason: Source-side winrm.vbs invocation is a common client for remote shell execution.
  - id: a197e378-d31b-41c0-9635-cfdf1c1bb423
    name: HackTool - WinRM Access Via Evil-WinRM
    reason: Attacker tooling producing the same remote shell activity.
  - id: cbb9e3d1-2386-4e59-912e-62f1484f7a89
    name: Conhost Spawned By Uncommon Parent Process
    reason: winrshost spawns conhost; uncommon-parent conhost corroborates the remote shell session.
  - id: ea011323-7045-460b-b2d7-0f7442ea6b38
    name: Potential PsExec Remote Execution
    reason: Operators often mix WinRS and PsExec across targets when moving laterally.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Processes spawned by winrshost
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Ww]inrs[Hh]ost\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Network logons preceding remote shell
    query: data_win_system_eventID:4624 AND data_win_eventdata_logonType:3
    pivot_on: user
    window: 1h
  - name: Discovery and credential tools
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(whoami|net\ user|net\ group|nltest|ipconfig|systeminfo|mimikatz|procdump|comsvcs).*/
    pivot_on: host
    window: 2h
  - name: WinRM inbound connections
    query: data_win_system_eventID:3 AND (data_win_eventdata_destinationPort:5985 OR data_win_eventdata_destinationPort:5986)
    pivot_on: host
    window: 2h
  - name: Payloads dropped after remote shell
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*(Temp|ProgramData|Users\\Public).*\.(exe|dll|ps1|bat)/
    pivot_on: host
    window: 2h
