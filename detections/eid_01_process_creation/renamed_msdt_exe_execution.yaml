name: Renamed Msdt.EXE Execution
id: bd1c6866-65fc-44b2-be51-5588fcff82b9
version: 1
schema_version: "1.0"
date: "2023-02-03"
author: pH-T (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: bd1c6866-65fc-44b2-be51-5588fcff82b9
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of a renamed "Msdt.exe" binary. MITRE ATT&CK: T1036.003.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - term:
            data_win_eventdata_originalFileName:
              value: "msdt.exe"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\msdt.exe"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_originalFileName
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_originalFileName equals
  'msdt.exe'; data_win_eventdata_image matches '*\msdt.exe'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://lolbas-project.github.io/lolbas/Binaries/Msdt/
  - https://attack.mitre.org/techniques/T1036/003/

response:
  message: >
    Renamed Msdt.EXE Execution detected on host $agent_name$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1036.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_originalFileName
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1036.003
  custom_tags:
    - renamed
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_originalFileName:/[Mm][Ss][Dd][Tt]\.[Ee][Xx][Ee]/ AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/.*\\[Mm][Ss][Dd][Tt]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 258fc8ce-8352-443a-9120-8a11e4857fa5
    name: Potential Arbitrary Command Execution Using Msdt.EXE
    reason: Renaming msdt.exe is done to run the same PCWDiagnostic/IT_BrowseForFile command-injection payloads while dodging name-based msdt rules.
  - id: 9c8c7000-3065-44a8-a555-79bcba5d9955
    name: MSDT Execution Via Answer File
    reason: The -af answer-file variant is the Follina-style path a renamed msdt would be used for.
  - id: dc4576d4-7467-424f-9eee-fd2b02855fe0
    name: Suspicious Cabinet File Execution Via Msdt.EXE
    reason: Cabinet-file msdt abuse is the other known payload route; a renamed copy hides it.
  - id: 6004abd0-afa4-4557-ba90-49d172e0a299
    name: Execute Pcwrun.EXE To Leverage Follina
    reason: Pcwrun is a launcher that hands off to msdt in Follina chains and co-occurs with the renamed binary.
  - id: 868955d9-697e-45d4-a3da-360cefd7c216
    name: Potential Exploitation Attempt From Office Application
    reason: Follina is triggered from an Office document, so Office-spawned oddities precede the renamed msdt run.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Office or browser spawning processes
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*\\(WINWORD|EXCEL|POWERPNT|OUTLOOK|msedge|chrome|firefox)\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Msdt diagnostic injection arguments
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Pp][Cc][Ww][Dd]iagnostic.*/ OR /.*IT_BrowseForFile.*/ OR /.*ms-msdt:.*/ OR /.*IT_RebrowseForFile.*/)
    pivot_on: host
    window: 2h
  - name: Shells and LOLBins spawned by renamed msdt
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*\\(cmd|powershell|pwsh|mshta|rundll32|regsvr32|wscript|cscript|certutil|bitsadmin)\.[Ee][Xx][Ee]/ AND data_win_eventdata_parentCommandLine:/.*[Ss][Dd][Dd]iag.*/
    pivot_on: host
    window: 1h
  - name: Executables dropped in user-writable paths
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(/.*\\[Tt]emp\\.*\.(exe|dll|ps1|bat)/ OR /.*\\[Dd]ownloads\\.*\.(exe|dll|cab|msi)/)
    pivot_on: host
    window: 2h
  - name: Outbound connections from Office or script hosts
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*\\(WINWORD|EXCEL|msdt|mshta|powershell|wscript)\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
