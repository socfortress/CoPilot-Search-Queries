name: Use Of The SFTP.EXE Binary As A LOLBIN
id: a85ffc3a-e8fd-4040-93bf-78aff284d801
version: 1
schema_version: "1.0"
date: "2022-11-10"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: a85ffc3a-e8fd-4040-93bf-78aff284d801
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the usage of the "sftp.exe" binary as a LOLBIN by abusing the "-D"
  flag. MITRE ATT&CK: T1218.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\sftp.exe"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -D ..*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -D C:\\\\*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\sftp.exe'; data_win_eventdata_commandLine matches '* -D ..*';
  data_win_eventdata_commandLine matches '* -D C:\*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/LOLBAS-Project/LOLBAS/pull/264
  - https://attack.mitre.org/techniques/T1218/

response:
  message: >
    Use Of The SFTP.EXE Binary As A LOLBIN detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1218
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218
  custom_tags:
    - binary
    - lolbin
    - process_creation
    - sysmon
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss][Ff][Tt][Pp]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.* -[Dd] \.\..*/ OR data_win_eventdata_commandLine:/.* -[Dd] [Cc]:\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 762bb580-79b4-40f4-8b9e-9349ce1710f4
    name: Indirect Command Execution via SFTP ProxyCommand
    reason: SFTP ProxyCommand lets sftp run arbitrary commands, the sibling sftp/ssh LOLBin abuse.
  - id: 7d6d30b8-5b91-4b90-a891-46cccaf29598
    name: Program Executed Using Proxy/Local Command Via SSH.EXE
    reason: ssh.exe local-command/ProxyCommand program execution is the same OpenSSH-client proxy-exec trick.
  - id: 327f48c1-a6db-4eb8-875a-f6981f1b0183
    name: Port Forwarding Activity Via SSH.EXE
    reason: SSH port forwarding is a typical follow-on once OpenSSH client binaries are in use.
  - id: f7d7ebd5-a016-46e2-9c54-f9932f2d386d
    name: Potential RDP Tunneling Via SSH
    reason: RDP tunneling via ssh shows the OpenSSH client used for lateral movement.
  - id: 7d1aaf3d-4304-425c-b7c3-162055e0b3ab
    name: Potential Data Exfiltration Activity Via CommandLine Tools
    reason: Command-line data exfiltration tools are the likely next step if sftp moves data.
  - id: e37db05d-d1f9-49c8-b464-cee1a4b11638
    name: PUA - Rclone Execution
    reason: Rclone execution is an alternate exfiltration channel often paired with sftp transfers.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: OpenSSH client binaries and arguments
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*([Ss][Ff][Tt][Pp]\.[Ee][Xx][Ee]|[Ss][Ss][Hh]\.[Ee][Xx][Ee]|[Ss][Cc][Pp]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 4h
  - name: Children of sftp/ssh (command run via -D or ProxyCommand)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*([Ss][Ff][Tt][Pp]\.[Ee][Xx][Ee]|[Ss][Ss][Hh]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 2h
  - name: Outbound SSH connections
    query: data_win_system_eventID:"3" AND data_win_eventdata_destinationPort:"22"
    pivot_on: host
    window: 4h
  - name: Archives staged before transfer
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.([Zz][Ii][Pp]|7[Zz]|[Rr][Aa][Rr]|[Tt][Aa][Rr]|[Gg][Zz])/
    pivot_on: host
    window: 4h
