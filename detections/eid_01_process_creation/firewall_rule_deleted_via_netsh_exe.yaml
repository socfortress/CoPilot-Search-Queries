name: Firewall Rule Deleted Via Netsh.EXE
id: 1a5fefe6-734f-452e-a07d-fc1c35bce4b2
version: 1
schema_version: "1.0"
date: "2025-10-07"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 1a5fefe6-734f-452e-a07d-fc1c35bce4b2
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the removal of a port or application rule in the Windows Firewall
  configuration using netsh. MITRE ATT&CK: T1686.003.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\netsh.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "netsh.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*firewall*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*delete *"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_parentImage"
        - exists:
            field: "data_win_eventdata_commandLine"
        - bool:
            must_not:
              - bool:
                  should:
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_parentImage:
                                value: "*\\\\Dropbox.exe"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*name=Dropbox*"
                                case_insensitive: true
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_parentImage:
                                value: "*\\\\instup.exe"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*advfirewall firewall delete rule name=\"Avast Antivirus Admin Client\"*"
                                case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\netsh.exe'; data_win_eventdata_originalFileName equals 'netsh.exe';
  data_win_eventdata_commandLine matches '*firewall*', among other conditions.

known_false_positives: >
  Legitimate administration activity. Software installations and removal.
  Baseline expected activity in your environment and tune this detection before
  relying on it for automated response.

references:
  - https://app.any.run/tasks/8bbd5b4c-b82d-4e6d-a3ea-d454594a37cc/
  - https://attack.mitre.org/techniques/T1686/003/

response:
  message: >
    Firewall Rule Deleted Via Netsh.EXE detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1686.003
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1686.003
  custom_tags:
    - firewall
    - deleted
    - netsh
    - process_creation
    - sysmon
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Nn][Ee][Tt][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Nn][Ee][Tt][Ss][Hh]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll].*/ AND data_win_eventdata_commandLine:/.*[Dd][Ee][Ll][Ee][Tt][Ee] .*/ AND _exists_:data_win_eventdata_parentImage AND _exists_:data_win_eventdata_commandLine AND NOT ((data_win_eventdata_parentImage:/.*\\[Dd][Rr][Oo][Pp][Bb][Oo][Xx]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Nn][Aa][Mm][Ee]=[Dd][Rr][Oo][Pp][Bb][Oo][Xx].*/) OR (data_win_eventdata_parentImage:/.*\\[Ii][Nn][Ss][Tt][Uu][Pp]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Aa][Dd][Vv][Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll] [Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll] [Dd][Ee][Ll][Ee][Tt][Ee] [Rr][Uu][Ll][Ee] [Nn][Aa][Mm][Ee]=\"[Aa][Vv][Aa][Ss][Tt] [Aa][Nn][Tt][Ii][Vv][Ii][Rr][Uu][Ss] [Aa][Dd][Mm][Ii][Nn] [Cc][Ll][Ii][Ee][Nn][Tt]\".*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 57c4bf16-227f-4394-8ec7-1b745ee061c3
    name: Firewall Disabled via Netsh.EXE
    reason: Deleting rules and disabling the firewall are interchangeable ways to drop host filtering; both on one host indicate deliberate defense impairment.
  - id: 6860a62c-9203-11eb-9e05-acde48001122
    name: Disabling Firewall with Netsh
    reason: Same netsh actor turning the firewall profile off, often right after or before rule deletion.
  - id: cd5cfd80-aa5f-44c0-9c20-108c4ae12e3c
    name: New Firewall Rule Added Via Netsh.EXE
    reason: Rule delete followed by an attacker allow rule is rule replacement to open a listener or C2 path.
  - id: a70dcb37-3bee-453a-99df-d0c683151be6
    name: Firewall Rule Update Via Netsh.EXE
    reason: Modifying an existing rule is the stealthier sibling of deletion in the same tampering sequence.
  - id: a35f5a72-f347-4e36-8895-9869b0d5fc6d
    name: Suspicious Program Location Whitelisted In Firewall Via Netsh.EXE
    reason: Deleting a blocking rule then whitelisting a malware path in Temp/AppData is the classic unblock-and-allow pair.
  - id: 01aeb693-138d-49d2-9403-c4f52d7d3d62
    name: RDP Connection Allowed Via Netsh.EXE
    reason: Firewall cleanup is a common prelude to opening RDP for lateral movement.
  - id: a7ee1722-c3c5-aeff-3212-c777e4733217
    name: Disable Windows Defender AV Security Monitoring
    reason: Firewall rule removal is usually paired with disabling endpoint AV in a broader defense-impairment burst.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other netsh firewall changes on host
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Nn]etsh\.exe/ AND data_win_eventdata_commandLine:/.*([Ff]irewall|[Aa]dvfirewall).*/
    pivot_on: host
    window: 2h
  - name: Firewall rule change events in Security log
    query: data_win_system_eventID:(4947 OR 4948 OR 4950 OR 4946 OR 4954)
    pivot_on: host
    window: 2h
  - name: Defender tampering via PowerShell or sc
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ss]et-[Mm]p[Pp]reference.*/ OR /.*[Dd]isable[Rr]ealtime.*/ OR /.*sc.* (stop|config) .*(WinDefend|MpsSvc|Sense).*/)
    pivot_on: host
    window: 4h
  - name: Parent shell or script launching netsh
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:(/.*[Pp]ower[Ss]hell.*/ OR /.*cmd\.exe/ OR /.*wscript.*/ OR /.*mshta.*/) AND data_win_eventdata_commandLine:/.*[Nn]etsh.*/
    pivot_on: host
    window: 1h
  - name: Outbound connections from the host after firewall change
    query: data_win_system_eventID:3 AND data_win_eventdata_initiated:true
    pivot_on: host
    window: 2h
