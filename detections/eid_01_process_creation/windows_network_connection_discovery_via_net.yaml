name: Windows Network Connection Discovery Via Net
id: Windows-Network-Connection-Discovery-Via-Net
version: 3
schema_version: 1
date: '2025-05-02'
author: SOCFortress LLC
status: production
type: Hunting
description: >
  Detects execution of net.exe with command-line arguments used to list or display
  information about network connections (net use, net view, etc.). Adversaries use
  this built-in utility during network reconnaissance to gather situational awareness,
  map Active Directory, and identify critical assets for lateral movement or data
  exfiltration. Associated with Active Directory Discovery, Azorult, Prestige
  Ransomware, and Windows Post-Exploitation tradecraft.
  MITRE ATT&CK: T1049 (System Network Connections Discovery).

data_source:
  - Sysmon EventID 1 (ProcessCreate)

search:
  query:
    bool:
      must:
        - term:
            agent_name: "AGENT_NAME"
        - term:
            agent_labels_customer: "CUSTOMER_CODE"
        - term:
            data_win_system_eventID: "1"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image: "*\\net.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\net1.exe"
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine: "*use*"
        - range:
            timestamp:
              gte: "START_TIME"
              lte: "END_TIME"

parameters:
  - name: AGENT_NAME
    default: "DESKTOP-AM0HLGE"
  - name: CUSTOMER_CODE
    default: "lab"
  - name: START_TIME
    default: "now-24h"
  - name: END_TIME
    default: "now"

how_to_implement: >
  Requires Sysmon EventID 1 (ProcessCreate) flowing to the Wazuh Indexer.
  Fields data_win_eventdata_image and data_win_eventdata_commandLine are
  confirmed working across all EventID 1 detections in this environment.
  Field-validated based on established EventID 1 detection patterns.

known_false_positives: >
  Administrators or power users may use net use for legitimate network drive
  mapping or connection management. Filter by parent process or user context
  as needed.

references:
  - https://attack.mitre.org/techniques/T1049/

response:
  message: >
    Network connection discovery via net.exe detected on $agent_name$ by $data_win_eventdata_user$.
    Parent: $data_win_eventdata_parentImage$.
    Command: $data_win_eventdata_commandLine$.
    MITRE ATT&CK: T1049
  risk_score: 15
  severity: low
  risk_objects:
    - field: agent_name
      type: system
      score: 15
    - field: data_win_eventdata_user
      type: user
      score: 15
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: parent_process_name
    - field: data_win_eventdata_image
      type: process_name

tags:
  analytic_story:
    - Active Directory Discovery
    - Azorult
    - Windows Post-Exploitation
    - Prestige Ransomware
  asset_type: Endpoint
  mitre_attack_id:
    - T1049
  custom_tags:
    - net_use
    - network_discovery
    - reconnaissance
    - active_directory
    - living_off_the_land
  product:
    - Wazuh
  security_domain: endpoint

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: Windows-Network-Share-Interaction-Via-Net
    name: Windows Network Share Interaction Via Net
    reason: net use/view share enumeration is the same recon pattern and often co-fires.
  - id: 2cf5cc25-f39a-436d-a790-4857e5995ede
    name: Network Connection Discovery With Netstat
    reason: Local connection discovery from the same recon sequence.
  - id: windows-network-connection-discovery-with-arp-001
    name: Windows Network Connection Discovery With Arp
    reason: Neighbour discovery alongside net use maps reachable hosts.
  - id: 3abd6094-7027-475f-9630-8ab9be7b9725
    name: Windows Admin Share Mount Via Net.EXE
    reason: net use mapping of C$/ADMIN$ is the lateral-movement step following discovery.
  - id: d4498716-1d52-438f-8084-4a603157d131
    name: Password Provided In Command Line Of Net.EXE
    reason: net use with credentials indicates active authentication to remote resources.
  - id: 5cc90652-4cbd-4241-aa3b-4b462fa5a248
    name: Potential Recon Activity Via Nltest.EXE
    reason: Domain recon commonly paired with net discovery.
  - id: windows-group-discovery-net-001
    name: Windows Group Discovery Via Net
    reason: AD discovery by net in the same session.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: net.exe use/view/session commands
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:*\\net.exe OR data_win_eventdata_image:*\\net1.exe) AND (data_win_eventdata_commandLine:*[Uu]se* OR data_win_eventdata_commandLine:*[Vv]iew* OR data_win_eventdata_commandLine:*[Ss]ession* OR data_win_eventdata_commandLine:*[Ss]hare*)
    pivot_on: host
    window: 2h
  - name: Admin share mapping
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:*\\net.exe OR data_win_eventdata_image:*\\net1.exe) AND (data_win_eventdata_commandLine:*ADMIN* OR data_win_eventdata_commandLine:*IPC* OR data_win_eventdata_commandLine:*C$*)
    pivot_on: host
    window: 4h
  - name: SMB outbound connections
    query: data_win_system_eventID:3 AND (data_win_eventdata_destinationPort:445 OR data_win_eventdata_destinationPort:139)
    pivot_on: host
    window: 4h
  - name: Other network discovery tools
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:*\\netstat.exe OR data_win_eventdata_image:*\\arp.exe OR data_win_eventdata_image:*\\nltest.exe OR data_win_eventdata_image:*\\nslookup.exe)
    pivot_on: host
    window: 2h
