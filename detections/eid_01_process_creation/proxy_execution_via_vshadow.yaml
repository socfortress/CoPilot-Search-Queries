name: Proxy Execution via Vshadow
id: d7c75059-2901-4578-b209-8837fd31c6a8
version: 1
schema_version: "1.0"
date: "2025-05-26"
author: David Faiss
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: d7c75059-2901-4578-b209-8837fd31c6a8
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the invocation of vshadow.exe with the -exec parameter that executes a
  specified script or command after the shadow copies are created but before the
  VShadow tool exits. VShadow is a command-line tool that you can use to create
  and manage volume shadow copies. While legitimate backup or administrative
  scripts may use this flag, attackers can leverage this parameter to proxy the
  execution of malware. MITRE ATT&CK: T1202.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\vshadow.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "vshadow.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*-exec*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\vshadow.exe'; data_win_eventdata_originalFileName equals 'vshadow.exe';
  data_win_eventdata_commandLine matches '*-exec*'.

known_false_positives: >
  System backup or administrator tools. Legitimate administrative scripts.
  Baseline expected activity in your environment and tune this detection before
  relying on it for automated response.

references:
  - https://lolbas-project.github.io/lolbas/OtherMSBinaries/Vshadow/
  - https://learn.microsoft.com/en-us/windows/win32/vss/vshadow-tool-and-sample
  - https://attack.mitre.org/techniques/T1202/

response:
  message: >
    Proxy Execution via Vshadow detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1202
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1202
  custom_tags:
    - proxy
    - vshadow
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Vv][Ss][Hh][Aa][Dd][Oo][Ww]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Vv][Ss][Hh][Aa][Dd][Oo][Ww]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*-[Ee][Xx][Ee][Cc].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b17ea6f7-6e90-447e-a799-e6c0a493d6ce
    name: Shadow Copies Creation Using Operating Systems Utilities
    reason: vshadow creates a snapshot before running the -exec payload; same VSS creation chain.
  - id: fa1a7e52-3d02-435b-81b8-00da14dd66c1
    name: Diskshadow Script Mode - Execution From Potential Suspicious Location
    reason: Sibling VSS tool used for script-mode proxy execution.
  - id: 9f546b25-5f12-4c8d-8532-5893dcb1e4b8
    name: Potentially Suspicious Child Process Of DiskShadow.EXE
    reason: Same proxy-execution idea via diskshadow when vshadow is blocked.
  - id: f57f8d16-1f39-4dcb-a604-6c73d9b54b3d
    name: Sensitive File Access Via Volume Shadow Copy Backup
    reason: Snapshot content is read to take SAM/NTDS/SYSTEM files.
  - id: c73124a7-3e89-44a3-bdc1-25fe4df754b1
    name: Copy From VolumeShadowCopy Via Cmd.EXE
    reason: Copying locked files out of the new snapshot is the usual next step.
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: Ransomware operators delete shadow copies in the same window.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Shadow copy tool activity on host
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]|[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]|[Dd][Ii][Ss][Kk][Ss][Hh][Aa][Dd][Oo][Ww]\.[Ee][Xx][Ee]|[Vv][Ss][Hh][Aa][Dd][Oo][Ww]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*[Ss][Hh][Aa][Dd][Oo][Ww].*/)
    pivot_on:
    - host
    window: 2h
  - name: Access to HarddiskVolumeShadowCopy paths
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Hh][Aa][Rr][Dd][Dd][Ii][Ss][Kk][Vv][Oo][Ll][Uu][Mm][Ee][Ss][Hh][Aa][Dd][Oo][Ww][Cc][Oo][Pp][Yy].*/)
    pivot_on:
    - host
    window: 2h
  - name: Credential database extraction
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt].*/ OR data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Gg] [Ss][Aa][Vv][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Cc][Rr][Ee][Tt][Ss][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/)
    pivot_on:
    - host
    window: 4h
  - name: Children spawned by vshadow
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Vv][Ss][Hh][Aa][Dd][Oo][Ww]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
