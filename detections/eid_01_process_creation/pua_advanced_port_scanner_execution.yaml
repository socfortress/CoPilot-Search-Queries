name: PUA - Advanced Port Scanner Execution
id: 54773c5f-f1cc-4703-9126-2f797d96a69d
version: 1
schema_version: "1.0"
date: "2023-02-07"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 54773c5f-f1cc-4703-9126-2f797d96a69d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the use of Advanced Port Scanner. MITRE ATT&CK: T1046, T1135.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\advanced_port_scanner*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_originalFileName:
                    value: "*advanced_port_scanner*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_description:
                    value: "*Advanced Port Scanner*"
                    case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*/portable*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*/lng*"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_description
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\advanced_port_scanner*'; data_win_eventdata_originalFileName matches
  '*advanced_port_scanner*'; data_win_eventdata_description matches '*Advanced
  Port Scanner*', among other conditions.

known_false_positives: >
  Legitimate administrative use. Tools with similar commandline (very rare).
  Baseline expected activity in your environment and tune this detection before
  relying on it for automated response.

references:
  - https://github.com/3CORESec/MAL-CL/tree/master/Descriptors/Other/Advanced%20Port%20Scanner
  - https://attack.mitre.org/techniques/T1046/
  - https://attack.mitre.org/techniques/T1135/

response:
  message: >
    PUA - Advanced Port Scanner Execution detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1046, T1135
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1046
    - T1135
  custom_tags:
    - advanced
    - scanner
    - process_creation
    - sysmon
    - discovery
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Aa][Dd][Vv][Aa][Nn][Cc][Ee][Dd]_[Pp][Oo][Rr][Tt]_[Ss][Cc][Aa][Nn][Nn][Ee][Rr].*/ OR data_win_eventdata_originalFileName:/.*[Aa][Dd][Vv][Aa][Nn][Cc][Ee][Dd]_[Pp][Oo][Rr][Tt]_[Ss][Cc][Aa][Nn][Nn][Ee][Rr].*/ OR data_win_eventdata_description:/.*[Aa][Dd][Vv][Aa][Nn][Cc][Ee][Dd] [Pp][Oo][Rr][Tt] [Ss][Cc][Aa][Nn][Nn][Ee][Rr].*/ OR (data_win_eventdata_commandLine:/.*\/[Pp][Oo][Rr][Tt][Aa][Bb][Ll][Ee].*/ AND data_win_eventdata_commandLine:/.*\/[Ll][Nn][Gg].*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: bef37fa2-f205-4a7b-b484-0759bfd5f86f
    name: PUA - Advanced IP Scanner Execution
    reason: Sister tool; host discovery then port scan is the usual sequence.
  - id: ca387a8e-1c84-4da3-9993-028b45342d30
    name: PUA - SoftPerfect Netscan Execution
    reason: Another scanner used for the same service-mapping step.
  - id: 4fd6b1c7-19b8-4488-97f6-00f0924991a3
    name: PUA - NimScan Execution
    reason: Alternative port scanner; several scanners indicate active recon.
  - id: f376c8a7-a2d0-4ddc-aa0c-16c17236d962
    name: HackTool - Bloodhound/Sharphound Execution
    reason: AD relationship mapping runs alongside service discovery.
  - id: 730fc21b-eaff-474b-ad23-90fd265d4988
    name: Psexec Execution
    reason: Open SMB ports found by the scan are used for PsExec lateral movement.
  - id: 8a3038e8-9c9d-46f8-b184-66234a160f6f
    name: Potential Remote Desktop Tunneling
    reason: Discovered RDP hosts are reached through tunnels from this host.
  - id: 322ed9ec-fcab-4f67-9a34-e7c6aef43614
    name: New Port Forwarding Rule Added Via Netsh.EXE
    reason: Pivoting to reach scanned internal services follows the scan.
  - id: 8b0e12da-d3c3-49db-bb4f-256703f380e5
    name: PUA - Chisel Tunneling Tool Execution
    reason: Tunnel tooling to reach internal ports discovered by the scanner.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other scanners and recon utilities
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*[Nn]map.*/ OR data_win_eventdata_image:/.*[Aa]dvanced_ip_scanner.*/ OR data_win_eventdata_image:/.*[Ss]oft[Pp]erfect.*/ OR data_win_eventdata_image:/.*[Nn]etscan.*/ OR data_win_eventdata_image:/.*[Nn]im[Ss]can.*/)
    pivot_on: host
    window: 6h
  - name: Lateral movement toward scanned ports
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*[Pp]s[Ee]xec.*/ OR data_win_eventdata_commandLine:/.*mstsc.*\/v.*/ OR data_win_eventdata_commandLine:/.*net +use +\\\\.*/ OR data_win_eventdata_commandLine:/.*wmic.*\/node.*/)
    pivot_on: host
    window: 6h
  - name: Tunnel and proxy tooling
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*[Cc]hisel.*/ OR data_win_eventdata_commandLine:/.*[Pp]link.* -[LRD] .*/ OR data_win_eventdata_commandLine:/.*netsh.*portproxy.*/ OR data_win_eventdata_commandLine:/.*[Nn]grok.*/)
    pivot_on: host
    window: 6h
  - name: Active Directory enumeration
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*nltest.*/ OR data_win_eventdata_commandLine:/.*dsquery.*/ OR data_win_eventdata_commandLine:/.*[Aa]d[Ff]ind.*/ OR data_win_eventdata_commandLine:/.*net +group.*domain.*/)
    pivot_on: host
    window: 4h
  - name: Executables started from user-writable paths
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*\\(Users|ProgramData|Temp)\\.*\.exe/ AND data_win_eventdata_parentImage:/.*(cmd|powershell|explorer)\.exe/
    pivot_on: user
    window: 4h
