name: Suspicious RDP Redirect Using TSCON
id: f72aa3e8-49f9-4c7d-bd74-f8ab84ff9bbb
version: 1
schema_version: "1.0"
date: "2023-05-16"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: f72aa3e8-49f9-4c7d-bd74-f8ab84ff9bbb
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a suspicious RDP session redirect using tscon.exe. MITRE ATT&CK:
  T1563.002, T1021.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* /dest:rdp-tcp#*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches '*
  /dest:rdp-tcp#*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - http://www.korznikov.com/2017/03/0-day-or-feature-privilege-escalation.html
  - https://medium.com/@networksecurity/rdp-hijacking-how-to-hijack-rds-and-remoteapp-sessions-transparently-to-move-through-an-da2a1e73a5f6
  - https://www.hackingarticles.in/rdp-session-hijacking-with-tscon/
  - https://attack.mitre.org/techniques/T1563/002/
  - https://attack.mitre.org/techniques/T1021/001/

response:
  message: >
    Suspicious RDP Redirect Using TSCON detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1563.002, T1021.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1563.002
    - T1021.001
  custom_tags:
    - redirect
    - tscon
    - process_creation
    - sysmon
    - lateral_movement
    - car_2013_07_002
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.* \/[Dd][Ee][Ss][Tt]:[Rr][Dd][Pp]-[Tt][Cc][Pp]\#.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 224f140f-3553-4cd1-af78-13d81bf9f7cc
    name: Potential RDP Session Hijacking Activity
    reason: Same session-hijack technique via tscon service creation; confirms how the hijack was staged.
  - id: 9847f263-4a81-424f-970c-875dab15b79b
    name: Suspicious TSCON Start as SYSTEM
    reason: tscon run as SYSTEM lets the attacker take another user's session without credentials.
  - id: 52753ea4-b3a0-4365-910d-36cff487b789
    name: Hijack Legit RDP Session to Move Laterally
    reason: Evidence of legitimate RDP session hijack used for lateral movement.
  - id: 1012f107-b8f1-4271-af30-5aed2de89b39
    name: Terminal Service Process Spawn
    reason: Processes spawned from the terminal service host show what ran in the hijacked session.
  - id: 0d5675be-bc88-4172-86d3-1e96a4476536
    name: Potential Tampering With RDP Related Registry Keys Via Reg.EXE
    reason: RDP registry tampering often precedes enabling RDP for session abuse.
  - id: ad720b90-25ad-43ff-9b5e-5c841facc8e5
    name: User Added to Local Administrators Group
    reason: Admin rights are required for tscon hijack and often just precede it.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: tscon invocations of any kind
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Tt][Ss][Cc][Oo][Nn])\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 6h
  - name: Service installed to run tscon
    query: data_win_system_eventID:"7045" AND data_win_eventdata_imagePath:/.*([Tt][Ss][Cc][Oo][Nn]|[Cc][Mm][Dd]\.[Ee][Xx][Ee]).*/
    pivot_on: host
    window: 6h
  - name: sc.exe creating services that call tscon
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Ss][Cc])\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*([Tt][Ss][Cc][Oo][Nn]).*/
    pivot_on: host
    window: 6h
  - name: RDP session reconnect and remote logon events
    query: (data_win_system_eventID:"4778" OR data_win_system_eventID:"4779" OR (data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"10"))
    pivot_on: host
    window: 6h
  - name: Session enumeration before hijack
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Qq][Uu][Ee][Rr][Yy]|[Qq][Uu][Ss][Ee][Rr]|[Qq][Ww][Ii][Nn][Ss][Tt][Aa])\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 6h
