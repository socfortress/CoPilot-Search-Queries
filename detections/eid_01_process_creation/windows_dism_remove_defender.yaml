name: Windows DISM Remove Defender
id: windows-dism-remove-defender-001
version: 1
schema_version: "1.0"
date: "2026-02-23"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects DISM being used to disable and remove Windows Defender feature. 
  Adversaries use this to completely remove Defender from the system, preventing 
  detection of subsequent malicious activity. Used by PYSA/Mespinoza ransomware 
  and referenced in CISA AA23-347A advisory.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - wildcard:
            data_win_eventdata_commandLine: "*Windows-Defender*"
        - wildcard:
            data_win_eventdata_commandLine: "*disable-feature*"
        - wildcard:
            data_win_eventdata_commandLine: "*remove*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-23 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-23 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Windows endpoints with Sysmon 
  installed and configured to log process creation events (EventID 1) with full 
  command-line arguments.

known_false_positives: >
  Rare legitimate use by administrators on specific server configurations. 
  Investigate immediately as Defender removal is almost always malicious.

references:
  - https://attack.mitre.org/techniques/T1562/001/
  - https://thedfirreport.com/2020/11/23/pysa-mespinoza-ransomware/

response:
  message: >
    Windows Defender removal via DISM on $agent_name$. 
    Command: $data_win_eventdata_commandLine$. 
    User: $data_win_eventdata_user$. 
    Critical defense evasion. MITRE ATT&CK: T1562.001
  risk_score: 80
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 80
  threat_objects: []

tags:
  analytic_story:
    - CISA AA23-347A
    - Windows Defense Evasion Tactics
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1562.001
  custom_tags:
    - dism
    - defender_removal
    - defense_evasion
    - critical
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*Windows-Defender.*/ AND data_win_eventdata_commandLine:/.*disable-feature.*/ AND data_win_eventdata_commandLine:/.*remove.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 43e32da2-fdd0-4156-90de-50dfd62636f9
    name: Dism Remove Online Package
    reason: Dism Remove Online Package is the sibling DISM removal technique.
  - id: c443012c-7928-43bf-ac20-7eda5efe61ad
    name: Suspicious Uninstall of Windows Defender Feature via PowerShell
    reason: PowerShell feature-uninstall variant of removing Defender, tried when DISM is blocked.
  - id: a7ee1722-c3c5-aeff-3212-c777e4733217
    name: Disable Windows Defender AV Security Monitoring
    reason: Defender monitoring disable commonly precedes removal.
  - id: 17769c90-230e-488b-a463-e05c08e9d48f
    name: Powershell Defender Exclusion
    reason: Defender exclusions are the quieter precursor before outright removal.
  - id: 452bce90-6fb0-43cc-97a5-affc283139b3
    name: Suspicious Windows Defender Registry Key Tampering Via Reg.EXE
    reason: Registry tampering of Defender keys to neutralise it before or after removal.
  - id: b28e58e4-2a72-4fae-bdee-0fbe904db642
    name: Windows Defender Real-time Protection Disabled
    reason: Defender operational log shows real-time protection disabled as the effect.
  - id: 639c9081-f482-47d3-a0bd-ddee3d4ecd76
    name: All Backups Deleted Via Wbadmin.EXE
    reason: 'PYSA/ransomware follow-on: backup deletion once defences are down.'
  - id: 1444443e-6757-43e4-9ea4-c8fc705f79a2
    name: Boot Configuration Tampering Via Bcdedit.EXE
    reason: Boot config tampering to hinder recovery follows defense impairment in ransomware chains.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other Defender disabling methods
    query: data_win_eventdata_commandLine:/.*[Ss]et-[Mm]p[Pp]reference.*/ OR data_win_eventdata_commandLine:/.*[Dd]isable[Rr]ealtime[Mm]onitoring.*/ OR data_win_eventdata_commandLine:/.*[Uu]ninstall-[Ww]indows[Ff]eature.*[Dd]efender.*/ OR data_win_eventdata_commandLine:/.*[Ss]c(\.exe)? +(stop|config) +(WinDefend|Sense).*/
    pivot_on: host
    window: 6h
  - name: Defender registry policy changes
    query: data_win_eventdata_image:/.*\\reg\.exe/ AND data_win_eventdata_commandLine:/.*[Dd]efender.*/ AND (data_win_eventdata_commandLine:/.*[Dd]isable.*/ OR data_win_eventdata_commandLine:/.*[Ee]xclusions.*/)
    pivot_on: host
    window: 6h
  - name: 'Ransomware preparation: shadows and backups'
    query: data_win_eventdata_commandLine:/.*(vssadmin|wbadmin|wmic).*(delete|shadow).*/ OR data_win_eventdata_commandLine:/.*bcdedit.*(recoveryenabled|bootstatuspolicy).*/
    pivot_on: host
    window: 6h
  - name: Payload staging or lateral tooling after Defender removal
    query: data_win_eventdata_image:/.*\\(psexec|psexesvc|rclone|mimikatz)[^\\]*\.exe/ OR data_win_eventdata_commandLine:/.*[Pp]s[Ee]xec.*/
    pivot_on: host
    window: 6h
