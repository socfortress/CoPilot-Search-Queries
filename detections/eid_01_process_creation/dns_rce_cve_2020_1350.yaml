name: DNS RCE CVE-2020-1350
id: b5281f31-f9cc-4d0d-95d0-45b91c45b487
version: 1
schema_version: "1.0"
date: "2022-07-12"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: b5281f31-f9cc-4d0d-95d0-45b91c45b487
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects exploitation of DNS RCE bug reported in CVE-2020-1350 by the detection
  of suspicious sub process. MITRE ATT&CK: T1190, T1569.002.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_parentImage:
              value: "*\\\\System32\\\\dns.exe"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\System32\\\\werfault.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\System32\\\\conhost.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\System32\\\\dnscmd.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\System32\\\\dns.exe"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\System32\dns.exe'; data_win_eventdata_image matches
  '*\System32\werfault.exe'; data_win_eventdata_image matches
  '*\System32\conhost.exe', among other conditions.

known_false_positives: >
  Unknown but benign sub processes of the Windows DNS service dns.exe. Baseline
  expected activity in your environment and tune this detection before relying
  on it for automated response.

references:
  - https://research.checkpoint.com/2020/resolving-your-way-into-domain-admin-exploiting-a-17-year-old-bug-in-windows-dns-servers/
  - https://web.archive.org/web/20230329172447/https://blog.menasec.net/2019/02/threat-hunting-24-microsoft-windows-dns.html
  - https://attack.mitre.org/techniques/T1190/
  - https://attack.mitre.org/techniques/T1569/002/

response:
  message: >
    DNS RCE CVE-2020-1350 detected on host $agent_name$. Matched
    data_win_eventdata_parentImage: $data_win_eventdata_parentImage$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1190,
    T1569.002
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1190
    - T1569.002
  custom_tags:
    - process_creation
    - sysmon
    - initial_access
    - execution
    - cve_2020_1350
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Dd][Nn][Ss]\.[Ee][Xx][Ee]/ AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/.*\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ww][Ee][Rr][Ff][Aa][Uu][Ll][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Cc][Oo][Nn][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Dd][Nn][Ss][Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Dd][Nn][Ss]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a4e3d776-f12e-42c2-8510-9e6ed1f43ec3
    name: Unusual Child Process of dns.exe
    reason: Same dns.exe-spawns-child condition from the Sigma view; corroborates SigRed-style exploitation of the DNS server service.
  - id: f63b56ee-3f79-4b8a-97fb-5c48007e8573
    name: New DNS ServerLevelPluginDll Installed Via Dnscmd.EXE
    reason: The other known route to code execution inside dns.exe on a DC; shows an alternative DNS-server compromise.
  - id: b6457d63-d2a2-4e29-859d-4e7affc153d1
    name: Potential Discovery Activity Via Dnscmd.EXE
    reason: Dnscmd enumeration of zones/records precedes plugin-DLL abuse and indicates hands-on activity on the DNS server.
  - id: da63bc76-61ae-11eb-ae93-0242ac130002
    name: Ntdsutil Export NTDS
    reason: SigRed yields SYSTEM on a domain controller; NTDS export is the standard next step to take the domain.
  - id: 8bc64091-6875-4881-aaf9-7bd25b5dda08
    name: Suspicious Process Patterns NTDS.DIT Exfil
    reason: Follow-on credential theft from the DC after dns.exe code execution.
  - id: fdfcbd78-48f1-4a4b-90ac-d82241e368c5
    name: PsExec Service Execution
    reason: Lateral movement from the compromised DC to other servers is a likely next move.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Any process spawned by dns.exe
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*(\\[Dd][Nn][Ss].[Ee][Xx][Ee])/
    pivot_on: host
    window: 24h
  - name: New services after DNS service compromise
    query: (data_win_system_eventID:"7045" OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Ss][Cc].[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Bb][Ii][Nn][Pp][Aa][Tt][Hh].*/)))
    pivot_on: host
    window: 24h
  - name: Credential and AD database theft tooling on the DC
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*(\\[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll].[Ee][Xx][Ee]|\\[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].[Ee][Xx][Ee]|\\[Rr][Ee][Gg].[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss].*/ OR data_win_eventdata_commandLine:/.*[Vv][Ss][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ss][Aa][Vv][Ee] [Hh][Kk][Ll][Mm].*/ OR data_win_eventdata_commandLine:/.*[Ss][Aa][Mm].*/ OR data_win_eventdata_commandLine:/.*[Ss][Yy][Ss][Tt][Ee][Mm].*/))
    pivot_on: host
    window: 24h
  - name: dns.exe making outbound connections on non-DNS ports
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*(\\[Dd][Nn][Ss].[Ee][Xx][Ee])/ AND NOT data_win_eventdata_destinationPort:"53"
    pivot_on: host
    window: 24h
  - name: Executables or scripts written by dns.exe
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*(\\[Dd][Nn][Ss].[Ee][Xx][Ee])/ AND data_win_eventdata_targetFilename:/.*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Pp][Ss]1|[Bb][Aa][Tt]|[Vv][Bb][Ss])/
    pivot_on: host
    window: 24h
