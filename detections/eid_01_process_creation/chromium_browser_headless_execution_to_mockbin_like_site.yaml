name: Chromium Browser Headless Execution To Mockbin Like Site
id: 1c526788-0abe-4713-862f-b520da5e5316
version: 1
schema_version: "1.0"
date: "2023-09-11"
author: X__Junior (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 1c526788-0abe-4713-862f-b520da5e5316
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of a Chromium based browser process with the "headless"
  flag and a URL pointing to the mockbin.org service (which can be used to
  exfiltrate data).

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\brave.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\chrome.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\msedge.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\opera.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\vivaldi.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*--headless*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*://run.mocky*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*://mockbin*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\brave.exe'; data_win_eventdata_image matches '*\chrome.exe';
  data_win_eventdata_image matches '*\msedge.exe', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.zscaler.com/blogs/security-research/steal-it-campaign

response:
  message: >
    Chromium Browser Headless Execution To Mockbin Like Site detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - chromium
    - browser
    - headless
    - process_creation
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Bb][Rr][Aa][Vv][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Hh][Rr][Oo][Mm][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Ee][Dd][Gg][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Oo][Pp][Ee][Rr][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Vv][Ii][Vv][Aa][Ll][Dd][Ii]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*--[Hh][Ee][Aa][Dd][Ll][Ee][Ss][Ss].*/ AND (data_win_eventdata_commandLine:/.*:\/\/[Rr][Uu][Nn]\.[Mm][Oo][Cc][Kk][Yy].*/ OR data_win_eventdata_commandLine:/.*:\/\/[Mm][Oo][Cc][Kk][Bb][Ii][Nn].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 94fc85a1-e55b-4265-95e1-4b66730e05c0
    name: Headless Browser Mockbin or Mocky Request
    reason: Same behaviour via a different pattern; confirms webhook-style exfil endpoint.
  - id: 869ba261-c272-47d7-affe-5c0aa85c93d6
    name: Headless Browser Usage
    reason: Headless browser use is the enabling technique.
  - id: 0e8cfe08-02c9-4815-a2f8-0d157b7ed33e
    name: File Download with Headless Browser
    reason: Headless browser may also be used to pull payloads.
  - id: 3e8207c5-fcd2-4ea6-9418-15d45b4890e4
    name: Potential Data Stealing Via Chromium Headless Debugging
    reason: Headless debugging used to steal browser data before exfil.
  - id: 1193d960-2369-499f-a158-7b50a31df682
    name: Potential Suspicious Browser Launch From Document Reader Process
    reason: 'Possible initial vector: document reader launching the browser.'
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Headless browser launches
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*--headless.*/
    pivot_on: host
    window: 6h
  - name: DNS to mock request services
    query: data_win_system_eventID:22 AND data_win_eventdata_queryName:/.*(mockbin|mocky|webhook\.site|requestbin|pipedream).*/
    pivot_on: host
    window: 6h
  - name: Parent shells launching browsers
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*(cmd|powershell|wscript|cscript|mshta)\.exe/ AND data_win_eventdata_image:/.*(chrome|msedge|brave|opera|vivaldi)\.exe/
    pivot_on: host
    window: 6h
  - name: Access to browser profile data
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(Login Data|Cookies|Local State|Web Data).*/
    pivot_on: host
    window: 6h
