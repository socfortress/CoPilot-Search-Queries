name: Windows Chromium Browser No Security Sandbox Process
id: 314cb263-7eeb-4d45-b693-bb21699c73d2
version: 1
schema_version: 1
date: '2025-05-26'
author: SOCFortress LLC
status: production
type: TTP
description: >
  Detects Chromium-based browsers (Chrome, Edge, Brave, Opera, Vivaldi) launched
  with the --no-sandbox flag, which disables the browser's built-in security
  sandbox. While occasionally used in development, this flag is abused by malware
  droppers and loaders that embed Chromium components for command and control,
  credential theft, or UI spoofing. Associated with Malicious Inno Setup Loader
  campaigns. Any use from non-browser parent processes or in conjunction with
  other suspicious flags should be treated as high priority.
  MITRE ATT&CK: T1497 (Virtualization/Sandbox Evasion).

data_source:
  - Sysmon EventID 1 (ProcessCreate)

search:
  query:
    bool:
      must:
        - term:
            agent_name: "AGENT_NAME"
        - term:
            agent_labels_customer: "CUSTOMER_CODE"
        - term:
            data_win_system_eventID: "1"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image: "*\\chrome.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\msedge.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\brave.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\opera.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\vivaldi.exe"
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine: "*--no-sandbox*"
        - range:
            timestamp:
              gte: "START_TIME"
              lte: "END_TIME"

parameters:
  - name: AGENT_NAME
    default: "DESKTOP-AM0HLGE"
  - name: CUSTOMER_CODE
    default: "lab"
  - name: START_TIME
    default: "now-24h"
  - name: END_TIME
    default: "now"

how_to_implement: >
  Requires Sysmon EventID 1 (ProcessCreate) flowing to the Wazuh Indexer.
  Validated on DESKTOP-AM0HLGE with Chrome launched via PowerShell with
  --no-sandbox. Note that Chrome may spawn child processes with the same
  flag (parentImage = chrome.exe) — consider filtering on parentImage
  to focus on non-browser parent launches for higher fidelity.
  Confirmed field names: data_win_eventdata_image, data_win_eventdata_commandLine,
  data_win_eventdata_parentImage, data_win_eventdata_user.

known_false_positives: >
  Chrome self-spawns child processes inheriting the --no-sandbox flag when
  launched with it, which will generate multiple hits per launch. Developers
  and automated testing pipelines may also use this flag legitimately.
  Filter on data_win_eventdata_parentImage — launches from powershell.exe,
  cmd.exe, or unknown binaries are higher priority than chrome.exe self-spawns.

references:
  - https://unix.stackexchange.com/questions/68832/what-does-the-chromium-option-no-sandbox-mean
  - https://attack.mitre.org/techniques/T1497/

response:
  message: >
    Chromium browser launched with --no-sandbox flag on $agent_name$.
    Process: $data_win_eventdata_image$.
    Command line: $data_win_eventdata_commandLine$.
    Parent process: $data_win_eventdata_parentImage$.
    User: $data_win_eventdata_user$.
    Sandbox bypass may indicate malware loader or malicious Chromium embedding.
    MITRE ATT&CK: T1497
  risk_score: 60
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 60
    - field: data_win_eventdata_user
      type: user
      score: 60
  threat_objects:
    - field: data_win_eventdata_image
      type: process_name
    - field: data_win_eventdata_parentImage
      type: parent_process_name

tags:
  analytic_story:
    - Malicious Inno Setup Loader
    - Browser Hijacking
  asset_type: Endpoint
  mitre_attack_id:
    - T1497
  custom_tags:
    - chrome
    - msedge
    - no_sandbox
    - sandbox_evasion
    - browser_abuse
    - inno_setup
  product:
    - Wazuh
  security_domain: endpoint

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b3d34dc5-2efd-4ae3-845f-8ec14921f449
    name: Browser Started with Remote Debugging
    reason: --no-sandbox is routinely paired with remote debugging to run attacker-driven or exploit-hosting browsers.
  - id: 3e8207c5-fcd2-4ea6-9418-15d45b4890e4
    name: Potential Data Stealing Via Chromium Headless Debugging
    reason: Sandbox-less headless debugging is the data-theft pattern this flag enables.
  - id: 869ba261-c272-47d7-affe-5c0aa85c93d6
    name: Headless Browser Usage
    reason: Headless Chromium with no sandbox is the common stealth runtime for malware.
  - id: 1c526788-0abe-4713-862f-b520da5e5316
    name: Chromium Browser Headless Execution To Mockbin Like Site
    reason: Headless fetches from mock hosts follow a sandbox-disabled launch in loader chains.
  - id: 88d6e60c-759d-4ac1-a447-c0f1466c2d21
    name: Chromium Browser Instance Executed With Custom Extension
    reason: Stripped protections accompany rogue extension loading.
  - id: 1193d960-2369-499f-a158-7b50a31df682
    name: Potential Suspicious Browser Launch From Document Reader Process
    reason: A browser spawned by a document reader without a sandbox suggests exploitation of the lure.
  - id: 4f546cf4-15aa-4368-80f7-940e92bc551e
    name: Windows Chromium Browser with Custom User Data Directory
    reason: Isolated profile plus GPU-disable is the sibling stealth launch pattern.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Chromium launches with stealth or debug switches
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Cc][Hh][Rr][Oo][Mm][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Ee][Dd][Gg][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Bb][Rr][Aa][Vv][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Oo][Pp][Ee][Rr][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Vv][Ii][Vv][Aa][Ll][Dd][Ii]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*--no-sandbox.*/ OR data_win_eventdata_commandLine:/.*--remote-debugging.*/ OR data_win_eventdata_commandLine:/.*--headless.*/ OR data_win_eventdata_commandLine:/.*--user-data-dir.*/ OR data_win_eventdata_commandLine:/.*--load-extension.*/)
    pivot_on: host
    window: 4h
  - name: Who launched the browser (script engines and LOLBins)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Cc][Hh][Rr][Oo][Mm][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Ee][Dd][Gg][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Bb][Rr][Aa][Vv][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Oo][Pp][Ee][Rr][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Vv][Ii][Vv][Aa][Ll][Dd][Ii]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_parentImage:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/)
    pivot_on: host
    window: 2h
  - name: Browser outbound connections
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*\\[Cc][Hh][Rr][Oo][Mm][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Ee][Dd][Gg][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Bb][Rr][Aa][Vv][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Oo][Pp][Ee][Rr][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Vv][Ii][Vv][Aa][Ll][Dd][Ii]\.[Ee][Xx][Ee]/) AND data_win_eventdata_initiated:/[Tt][Rr][Uu][Ee]/
    pivot_on: host
    window: 4h
  - name: Browser DNS lookups
    query: data_win_system_eventID:"22" AND (data_win_eventdata_image:/.*\\[Cc][Hh][Rr][Oo][Mm][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Ee][Dd][Gg][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Bb][Rr][Aa][Vv][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Oo][Pp][Ee][Rr][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Vv][Ii][Vv][Aa][Ll][Dd][Ii]\.[Ee][Xx][Ee]/)
    pivot_on: host
    window: 4h
  - name: Browser profile credential and cookie file writes
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Ll][Oo][Gg][Ii][Nn] [Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_targetFilename:/.*[Ww][Ee][Bb] [Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_targetFilename:/.*\\[Cc][Oo][Oo][Kk][Ii][Ee][Ss].*/ OR data_win_eventdata_targetFilename:/.*[Ll][Oo][Cc][Aa][Ll] [Ss][Tt][Aa][Tt][Ee].*/)
    pivot_on: host
    window: 4h
