name: Windows Malicious PowerShell Process With Obfuscation Techniques
id: windows-malicious-powershell-process-with-obfuscation-techniques-001
version: 1
schema_version: "1.0"
date: "2026-02-12"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects PowerShell processes launched with command-line arguments indicative of 
  obfuscation techniques. This includes the use of Invoke-Expression (iex), character 
  casting ([char]), string joining (-join), string replacement (-replace), and format 
  string abuse (-f). Obfuscated PowerShell commands are commonly used by attackers to 
  evade detection and execute malicious scripts. Used by Hermetic Wiper, Hellcat 
  Ransomware, and other malware families.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image: "*powershell*"
              - wildcard:
                  data_win_eventdata_image: "*pwsh*"
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine: "*iex*"
              - wildcard:
                  data_win_eventdata_commandLine: "*Invoke-Expression*"
              - wildcard:
                  data_win_eventdata_commandLine: "*[char]*"
              - wildcard:
                  data_win_eventdata_commandLine: "*-join*"
              - wildcard:
                  data_win_eventdata_commandLine: "*-replace*"
              - wildcard:
                  data_win_eventdata_commandLine: "*-f *"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-12 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-12 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Windows endpoints with Sysmon 
  installed and configured to log process creation events (EventID 1) with full 
  command-line arguments. The index pattern should match your Wazuh index naming 
  convention. Note: The original Splunk detection counts obfuscation characters 
  (backticks, carets, empty quotes) and flags when >10 are found. Since Elasticsearch 
  DSL cannot count character occurrences at query time, this detection focuses on 
  common obfuscation techniques (iex, Invoke-Expression, [char] casting, -join, 
  -replace, -f format strings) which are more reliable indicators.

known_false_positives: >
  Some legitimate administrative scripts may use iex, -join, -replace, or -f for 
  string manipulation. Review the full command line and parent process context to 
  determine legitimacy. Tune based on known automation tools and authorized scripts.

references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://www.fireeye.com/content/dam/fireeye-www/blog/pdfs/dosfuscation-report.pdf
  - https://www.danielbohannon.com/blog-1/2017/3/12/powershell-execution-argument-obfuscation-how-it-can-make-detection-easier

response:
  message: >
    PowerShell obfuscation techniques detected on $agent_name$. 
    Command line: $data_win_eventdata_commandLine$. 
    Parent process: $data_win_eventdata_parentImage$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1059.001
  risk_score: 42
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 42
  threat_objects: []

tags:
  analytic_story:
    - Malicious PowerShell
    - Hermetic Wiper
    - Data Destruction
    - Hellcat Ransomware
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*powershell.*/ OR data_win_eventdata_image:/.*pwsh.*/) AND (data_win_eventdata_commandLine:/.*iex.*/ OR data_win_eventdata_commandLine:/.*Invoke-Expression.*/ OR data_win_eventdata_commandLine:/.*\[char\].*/ OR data_win_eventdata_commandLine:/.*\-join.*/ OR data_win_eventdata_commandLine:/.*\-replace.*/ OR data_win_eventdata_commandLine:/.*\-f\s.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d7bcd677-645d-4691-a8d4-7a5602b780d1
    name: Potential PowerShell Command Line Obfuscation
    reason: Detects Invoke-Obfuscation style tokenization; co-fire shows deliberate evasion not a stray -f or iex.
  - id: 8d01b53f-456f-48ee-90f6-bc28e67d4e35
    name: Suspicious Obfuscated PowerShell Code
    reason: Heavier obfuscation markers confirm the command line is machine-generated.
  - id: e312efd0-35a1-407f-8439-b8d434b438a6
    name: Potential PowerShell Obfuscation Via WCHAR/CHAR
    reason: The [char] casting branch of this rule; confirms character-assembly obfuscation.
  - id: b6b49cd1-34d6-4ead-b1bf-176e9edba9a4
    name: Potential PowerShell Obfuscation Via Reversed Commands
    reason: Another obfuscation technique commonly chained with iex/-join.
  - id: 09576804-7a05-458e-a817-eb718ca91f54
    name: Suspicious PowerShell IEX Execution Patterns
    reason: IEX is the sink where deobfuscated code executes; shows the detonation step.
  - id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
    name: PowerShell Download and Execution Cradles
    reason: Obfuscation typically hides a download cradle that fetches the next stage.
  - id: 754ed792-634f-40ae-b3bc-e0448d33f695
    name: Suspicious PowerShell Parent Process
    reason: Parent reveals the delivery vector for the obfuscated command.
  - id: c4db14d9-7909-48b4-a054-aa14d89dbb19
    name: Malicious PowerShell Process - Encoded Command
    reason: Obfuscation and -enc are often layered together by commodity loaders.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: PowerShell AMSI / script-logging evasion strings
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*([Pp]ower[Ss]hell|[Pp]wsh).*/ AND data_win_eventdata_commandLine:/.*(AmsiUtils|amsiInitFailed|[Ss]cript[Bb]lock[Ll]ogging|\[[Rr]ef\]\.[Aa]ssembly).*/
    pivot_on: host
    window: 2h
  - name: PowerShell network download behaviour
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*([Pp]ower[Ss]hell|[Pp]wsh).*/ AND data_win_eventdata_commandLine:/.*([Nn]et\.[Ww]eb[Cc]lient|[Dd]ownload[Ss]tring|[Dd]ownload[Ff]ile|[Ii]nvoke-[Ww]eb[Rr]equest|[Ii]nvoke-[Rr]est[Mm]ethod|[Ss]ystem\.[Nn]et\.[Ss]ockets).*/
    pivot_on: host
    window: 2h
  - name: Outbound connections from PowerShell
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*([Pp]ower[Ss]hell|[Pp]wsh).*/ AND data_win_eventdata_initiated:true
    pivot_on: host
    window: 2h
  - name: Processes spawned by PowerShell
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*([Pp]ower[Ss]hell|[Pp]wsh).*/ AND NOT data_win_eventdata_image:/.*conhost\.exe/
    pivot_on: host
    window: 2h
  - name: Memory injection by PowerShell
    query: (data_win_system_eventID:8 OR data_win_system_eventID:10) AND data_win_eventdata_sourceImage:/.*([Pp]ower[Ss]hell|[Pp]wsh).*/
    pivot_on: host
    window: 4h
