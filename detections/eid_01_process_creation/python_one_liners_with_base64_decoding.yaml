name: Python One-Liners with Base64 Decoding
id: 50a0aa3d-ab16-4594-a8aa-5145a6e6792b
version: 1
schema_version: "1.0"
date: "2026-03-09"
author: Hugh Ryan (HueCodes), Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 50a0aa3d-ab16-4594-a8aa-5145a6e6792b
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects Python one-liners that use base64 decoding functions in command line
  executions. Malicious scripts or attackers often use python one-liners to
  decode and execute base64-encoded payloads, which is a common technique for
  obfuscation and evasion. MITRE ATT&CK: T1059.006, T1027.010.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\python*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_originalFileName:
                    value: "*python*"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*import*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*base64*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* -c*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.decode*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*b16decode*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*b32decode*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*b32hexdecode*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*b64decode*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*b85decode*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*z85decode*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches '*\python*';
  data_win_eventdata_originalFileName matches '*python*';
  data_win_eventdata_commandLine matches '*import*', among other conditions.

known_false_positives: >
  Legitimate use of Python for decoding data, which is uncommon in typical
  enterprise environments but possible in development or data analysis contexts.
  Baseline expected activity in your environment and tune this detection before
  relying on it for automated response.

references:
  - https://docs.python.org/3/library/base64.html
  - https://www.virustotal.com/gui/file/bc43e925d7b4b74319f6e74e836a96f1997ba404e14ac566cf12a21e9da463db/behavior
  - https://cloud.google.com/blog/topics/threat-intelligence/cybercriminals-weaponize-fake-ai-websites
  - https://attack.mitre.org/techniques/T1059/006/
  - https://attack.mitre.org/techniques/T1027/010/

response:
  message: >
    Python One-Liners with Base64 Decoding detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1059.006, T1027.010
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.006
    - T1027.010
  custom_tags:
    - python
    - liners
    - base64
    - process_creation
    - sysmon
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Pp][Yy][Tt][Hh][Oo][Nn].*/ OR data_win_eventdata_originalFileName:/.*[Pp][Yy][Tt][Hh][Oo][Nn].*/) AND data_win_eventdata_commandLine:/.*[Ii][Mm][Pp][Oo][Rr][Tt].*/ AND data_win_eventdata_commandLine:/.*[Bb][Aa][Ss][Ee]64.*/ AND data_win_eventdata_commandLine:/.* -[Cc].*/ AND (data_win_eventdata_commandLine:/.*\.[Dd][Ee][Cc][Oo][Dd][Ee].*/ OR data_win_eventdata_commandLine:/.*[Bb]16[Dd][Ee][Cc][Oo][Dd][Ee].*/ OR data_win_eventdata_commandLine:/.*[Bb]32[Dd][Ee][Cc][Oo][Dd][Ee].*/ OR data_win_eventdata_commandLine:/.*[Bb]32[Hh][Ee][Xx][Dd][Ee][Cc][Oo][Dd][Ee].*/ OR data_win_eventdata_commandLine:/.*[Bb]64[Dd][Ee][Cc][Oo][Dd][Ee].*/ OR data_win_eventdata_commandLine:/.*[Bb]85[Dd][Ee][Cc][Oo][Dd][Ee].*/ OR data_win_eventdata_commandLine:/.*[Zz]85[Dd][Ee][Cc][Oo][Dd][Ee].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 899133d5-4d7c-4a7f-94ee-27355c879d90
    name: Python Inline Command Execution
    reason: Base64 python one-liners are almost always launched via -c, so both fire together.
  - id: 480e7e51-e797-47e3-8d72-ebfce65b6d8d
    name: Python Spawning Pretty TTY on Windows
    reason: Decoded payload may be a reverse shell that upgrades to a pty.
  - id: 22e58743-4ac8-4a9f-bf19-00a0428d8c5f
    name: Base64 MZ Header In CommandLine
    reason: A base64 payload may embed a PE (MZ) to be dropped or injected.
  - id: e32d4572-9826-4738-b651-95fa63747e8a
    name: Base64 Encoded PowerShell Command Detected
    reason: The same obfuscation habit via PowerShell on the same host indicates a broader staged intrusion.
  - id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
    name: PowerShell Download and Execution Cradles
    reason: Decoded stage frequently downloads and runs a further payload.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Python outbound connections
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*[Pp][Yy][Tt][Hh][Oo][Nn].*/
    pivot_on: host
    window: 4h
  - name: Executables and scripts created by python
    query: data_win_system_eventID:11 AND data_win_eventdata_image:/.*[Pp][Yy][Tt][Hh][Oo][Nn].*/ AND data_win_eventdata_targetFilename:/.*\.(exe|dll|ps1|bat|vbs|js)/
    pivot_on: host
    window: 4h
  - name: Children of python
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Pp][Yy][Tt][Hh][Oo][Nn].*/
    pivot_on: host
    window: 4h
  - name: Other base64 or exec-style command lines
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*([Bb]ase64|[Ff]rom[Bb]ase64[Ss]tring|[Ee]xec\().*/
    pivot_on: user
    window: 4h
