name: Potential Arbitrary File Download Via Cmdl32.EXE
id: f37aba28-a9e6-4045-882c-d5004043b337
version: 1
schema_version: "1.0"
date: "2024-04-22"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: f37aba28-a9e6-4045-882c-d5004043b337
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of Cmdl32 with the "/vpn" and "/lan" flags. Attackers can
  abuse this utility in order to download arbitrary files via a configuration
  file. Inspect the location and the content of the file passed as an argument
  in order to determine if it is suspicious. MITRE ATT&CK: T1218, T1202.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\cmdl32.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "CMDL32.EXE"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*/vpn*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*/lan*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\cmdl32.exe'; data_win_eventdata_originalFileName equals 'CMDL32.EXE';
  data_win_eventdata_commandLine matches '*/vpn*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://lolbas-project.github.io/lolbas/Binaries/Cmdl32/
  - https://twitter.com/SwiftOnSecurity/status/1455897435063074824
  - https://github.com/LOLBAS-Project/LOLBAS/pull/151
  - https://attack.mitre.org/techniques/T1218/
  - https://attack.mitre.org/techniques/T1202/

response:
  message: >
    Potential Arbitrary File Download Via Cmdl32.EXE detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1218, T1202
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218
    - T1202
  custom_tags:
    - arbitrary
    - download
    - cmdl32
    - process_creation
    - sysmon
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Cc][Mm][Dd][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Cc][Mm][Dd][Ll]32\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*\/[Vv][Pp][Nn].*/ AND data_win_eventdata_commandLine:/.*\/[Ll][Aa][Nn].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d059842b-6b9d-4ed1-b5c3-5b89143c6ede
    name: File Download Via Bitsadmin
    reason: Peer LOLBin downloader; attackers rotate between cmdl32 and bitsadmin when one is blocked.
  - id: 70ad0861-d1fe-491c-a45f-fa48148a300d
    name: File Download via CertOC.EXE
    reason: Peer signed-binary download technique often tried in the same intrusion.
  - id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
    name: PowerShell Download and Execution Cradles
    reason: Common alternate or follow-on download stage on the same host.
  - id: e593cf51-88db-4ee1-b920-37e89012a3c9
    name: Potentially Suspicious Rundll32 Activity
    reason: 'Follow-on: a downloaded DLL is usually executed through rundll32.'
  - id: cea72823-df4d-4567-950c-0b579eaf0846
    name: Potential Dropper Script Execution Via WScript/CScript/MSHTA
    reason: Follow-on execution of a downloaded script payload.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Cmdl32 process activity
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Cc][Mm][Dd][Ll]32\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 4h
  - name: Cmdl32 network connections
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*(\\[Cc][Mm][Dd][Ll]32\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 2h
  - name: VPN profile files created
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(\.[Cc][Mm][Ss]|\.[Cc][Mm][Pp]|[Vv][Pp][Nn].*\.[Ii][Nn][Ii]).*/
    pivot_on: host
    window: 4h
  - name: Executable payloads dropped to user-writable paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(\\[Tt][Ee][Mm][Pp]\\|\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\|\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\|\\[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]\\).*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Pp][Ss]1|[Vv][Bb][Ss]|[Bb][Aa][Tt])/
    pivot_on: host
    window: 4h
  - name: Other LOLBin downloaders
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll].*-[Uu][Rr][Ll][Cc][Aa][Cc][Hh][Ee]|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn].*\/[Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr]|[Cc][Uu][Rr][Ll].*[Hh][Tt][Tt][Pp]).*/
    pivot_on: host
    window: 4h
