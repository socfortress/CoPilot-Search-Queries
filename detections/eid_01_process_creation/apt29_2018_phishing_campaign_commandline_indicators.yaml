name: APT29 2018 Phishing Campaign CommandLine Indicators
id: 7453575c-a747-40b9-839b-125a0aae324b
version: 1
schema_version: "1.0"
date: "2023-03-08"
author: Florian Roth (Nextron Systems), @41thexplorer
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 7453575c-a747-40b9-839b-125a0aae324b
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: production
type: TTP

description: >
  Detects indicators of APT 29 (Cozy Bear) phishing-campaign as reported by
  mandiant. MITRE ATT&CK: T1218.011.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-noni -ep bypass $*"
                    case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*cyzfc.dat,*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*PointFunctionCall*"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*-noni -ep bypass $*'; data_win_eventdata_commandLine matches '*cyzfc.dat,*';
  data_win_eventdata_commandLine matches '*PointFunctionCall*'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/DrunkBinary/status/1063075530180886529
  - https://www.microsoft.com/security/blog/2018/12/03/analysis-of-cyberattack-on-u-s-think-tanks-non-profits-public-sector-by-unidentified-attackers/
  - https://www.mandiant.com/resources/blog/not-so-cozy-an-uncomfortable-examination-of-a-suspected-apt29-phishing-campaign
  - https://attack.mitre.org/techniques/T1218/011/

response:
  message: >
    APT29 2018 Phishing Campaign CommandLine Indicators detected on host
    $agent_name$. Matched data_win_eventdata_commandLine:
    $data_win_eventdata_commandLine$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1218.011
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218.011
  custom_tags:
    - apt29
    - phishing
    - campaign
    - process_creation
    - sysmon
    - execution
    - stealth
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*-[Nn][Oo][Nn][Ii] -[Ee][Pp] [Bb][Yy][Pp][Aa][Ss][Ss] \$.*/ OR (data_win_eventdata_commandLine:/.*[Cc][Yy][Zz][Ff][Cc]\.[Dd][Aa][Tt],.*/ AND data_win_eventdata_commandLine:/.*[Pp][Oo][Ii][Nn][Tt][Ff][Uu][Nn][Cc][Tt][Ii][Oo][Nn][Cc][Aa][Ll][Ll].*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
    name: PowerShell Download and Execution Cradles
    reason: The -noni -ep bypass branch is a PowerShell stager; cradle activity confirms payload retrieval.
  - id: ac175779-025a-4f12-98b0-acdaeb77ea85
    name: PowerShell Script Run in AppData
    reason: Phishing-dropped PowerShell scripts frequently run from AppData.
  - id: cea72823-df4d-4567-950c-0b579eaf0846
    name: Potential Dropper Script Execution Via WScript/CScript/MSHTA
    reason: Lure documents commonly launch script droppers before the rundll32/PowerShell stage.
  - id: e593cf51-88db-4ee1-b920-37e89012a3c9
    name: Potentially Suspicious Rundll32 Activity
    reason: The cyzfc.dat PointFunctionCall branch is a rundll32 DLL export launch.
  - id: c148a894-dd93-11eb-bf2a-acde48001122
    name: Powershell Disable Security Monitoring
    reason: Stagers typically weaken defenses right after execution.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Office or mail client spawning script hosts
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:(/.*[Ww][Ii][Nn][Ww][Oo][Rr][Dd]\.exe/ OR /.*[Ee][Xx][Cc][Ee][Ll]\.exe/ OR /.*[Oo][Uu][Tt][Ll][Oo][Oo][Kk]\.exe/) AND data_win_eventdata_image:(/.*[Pp]ower[Ss]hell.*/ OR /.*[Cc]md\.exe/ OR /.*[Ww]script\.exe/ OR /.*[Rr]undll32\.exe/)
    pivot_on: host
    window: 6h
  - name: PowerShell bypass and encoded launches
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND data_win_eventdata_commandLine:(/.*-[Ee]p +[Bb]ypass.*/ OR /.*-[Nn]o[Nn][Ii].*/ OR /.*-[Ee]nc.*/)
    pivot_on: host
    window: 6h
  - name: Rundll32 loading dat or user-path DLLs
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Rr]undll32\.exe/ AND data_win_eventdata_commandLine:(/.*\.[Dd][Aa][Tt].*/ OR /.*[Aa]pp[Dd]ata.*/ OR /.*[Tt]emp.*/)
    pivot_on: host
    window: 6h
  - name: Lure payload files dropped in user paths
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(/.*\.[Dd][Aa][Tt]/ OR /.*\.[Ll][Nn][Kk]/ OR /.*\.[Ii][Ss][Oo]/ OR /.*\.[Dd][Ll][Ll]/) AND data_win_eventdata_targetFilename:(/.*[Tt]emp.*/ OR /.*[Dd]ownloads.*/ OR /.*[Aa]pp[Dd]ata.*/)
    pivot_on: host
    window: 24h
  - name: DNS lookups after execution
    query: data_win_system_eventID:22
    pivot_on: host
    window: 2h
