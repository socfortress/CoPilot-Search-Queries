name: Suspicious PowerShell IEX Execution Patterns
id: 09576804-7a05-458e-a817-eb718ca91f54
version: 1
schema_version: "1.0"
date: "2022-11-28"
author: Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 09576804-7a05-458e-a817-eb718ca91f54
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious ways to run Invoke-Execution using IEX alias. MITRE ATT&CK:
  T1059.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\powershell.exe"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\pwsh.exe"
                                case_insensitive: true
                        minimum_should_match: 1
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* | iex;*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* | iex *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* | iex}*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* | IEX ;*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* | IEX -Error*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* | IEX (new*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*);IEX *"
                                case_insensitive: true
                        minimum_should_match: 1
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*::FromBase64String*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*.GetString([System.Convert]::*"
                                case_insensitive: true
                        minimum_should_match: 1
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*)|iex;$*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*);iex($*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*);iex $*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* | IEX | *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* | iex\\\\\"*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\powershell.exe'; data_win_eventdata_image matches '*\pwsh.exe';
  data_win_eventdata_commandLine matches '* | iex;*', among other conditions.

known_false_positives: >
  Legitimate scripts that use IEX. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.utility/invoke-expression?view=powershell-7.2
  - https://www.huntress.com/blog/slashandgrab-screen-connect-post-exploitation-in-the-wild-cve-2024-1709-cve-2024-1708
  - https://attack.mitre.org/techniques/T1059/001/

response:
  message: >
    Suspicious PowerShell IEX Execution Patterns detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1059.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
  custom_tags:
    - powershell
    - patterns
    - process_creation
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (((data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.* \| [Ii][Ee][Xx];.*/ OR data_win_eventdata_commandLine:/.* \| [Ii][Ee][Xx] .*/ OR data_win_eventdata_commandLine:/.* \| [Ii][Ee][Xx]\}.*/ OR data_win_eventdata_commandLine:/.* \| [Ii][Ee][Xx] ;.*/ OR data_win_eventdata_commandLine:/.* \| [Ii][Ee][Xx] -[Ee][Rr][Rr][Oo][Rr].*/ OR data_win_eventdata_commandLine:/.* \| [Ii][Ee][Xx] \([Nn][Ee][Ww].*/ OR data_win_eventdata_commandLine:/.*\);[Ii][Ee][Xx] .*/) AND (data_win_eventdata_commandLine:/.*::[Ff][Rr][Oo][Mm][Bb][Aa][Ss][Ee]64[Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*\.[Gg][Ee][Tt][Ss][Tt][Rr][Ii][Nn][Gg]\(\[[Ss][Yy][Ss][Tt][Ee][Mm]\.[Cc][Oo][Nn][Vv][Ee][Rr][Tt]\]::.*/)) OR data_win_eventdata_commandLine:/.*\)\|[Ii][Ee][Xx];\$.*/ OR data_win_eventdata_commandLine:/.*\);[Ii][Ee][Xx]\(\$.*/ OR data_win_eventdata_commandLine:/.*\);[Ii][Ee][Xx] \$.*/ OR data_win_eventdata_commandLine:/.* \| [Ii][Ee][Xx] \| .*/ OR data_win_eventdata_commandLine:/.* \| [Ii][Ee][Xx]\\\".*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
    name: PowerShell Download and Execution Cradles
    reason: Piping a download into IEX is the classic cradle; this rule shows the fetch half.
  - id: e6c54d94-498c-4562-a37c-b469d8e9a275
    name: Suspicious PowerShell Download and Execute Pattern
    reason: Download-and-execute pattern on the same command line; confirms remote code is being run.
  - id: 1b9dc62e-6e9e-42a3-8990-94d7a10007f7
    name: Invoke-Obfuscation Obfuscated IEX Invocation - PowerShell
    reason: 'Obfuscated IEX in script blocks: the same execution primitive hidden from command-line matching.'
  - id: 88f680b8-070e-402c-ae11-d2914f2257f1
    name: PowerShell Base64 Encoded IEX Cmdlet
    reason: 'Base64-encoded IEX: the evasive variant of this behaviour.'
  - id: 02b64f1b-3f33-4e67-aede-ef3b0a5a8fcf
    name: Potential COM Objects Download Cradles Usage - Process Creation
    reason: COM-object download cradles feeding IEX are an alternative fetch method.
  - id: 403c2cc0-7f6b-4925-9423-bfa573bed7eb
    name: Suspicious PowerShell Download - Powershell Script
    reason: Script block record of the download feeding Invoke-Expression.
  - id: ee18ed37-0802-4268-9435-b3b91aaa18db
    name: PowerShell - Connect To Internet With Hidden Window
    reason: Hidden-window PowerShell making internet connections usually accompanies IEX stagers.
  - id: 30edb182-aa75-42c0-b0a9-e998bb29067c
    name: Potential AMSI Bypass Via .NET Reflection
    reason: AMSI bypass is commonly run just before IEX of the downloaded script.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Download cradle in script blocks
    query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*([Nn]et\.[Ww]eb[Cc]lient|[Dd]ownload[Ss]tring|[Ii]nvoke-[Ww]eb[Rr]equest|[Ii]nvoke-[Rr]est[Mm]ethod|[Ss]tart-[Bb]its[Tt]ransfer).*/
    pivot_on: host
    window: 2h
  - name: PowerShell DNS lookups (payload hosting domains)
    query: data_win_system_eventID:"22" AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh])\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 1h
  - name: PowerShell network connections
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh])\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 1h
  - name: In-memory assembly loading or shellcode primitives
    query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*([Rr]eflection\.[Aa]ssembly|[Vv]irtual[Aa]lloc|[Cc]reate[Tt]hread|[Gg]et[Dd]elegate[Ff]or[Ff]unction[Pp]ointer).*/
    pivot_on: host
    window: 2h
  - name: Executables and scripts dropped by PowerShell in writable paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh])\.[Ee][Xx][Ee]/ AND data_win_eventdata_targetFilename:/.*\\([Tt]emp|[Pp]rogram[Dd]ata|[Pp]ublic|[Aa]pp[Dd]ata)\\.*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Pp][Ss]1|[Bb][Aa][Tt]|[Vv][Bb][Ss]|[Jj][Ss])/
    pivot_on: host
    window: 4h
