name: HackTool - Mimikatz Execution
id: a642964e-bead-4bed-8910-1bb4d63e3b4d
version: 1
schema_version: "1.0"
date: "2023-02-21"
author: Teymur Kheirkhabarov, oscd.community, David ANDRE (additional keywords), Tim Shelton
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: a642964e-bead-4bed-8910-1bb4d63e3b4d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detection well-known mimikatz command line arguments. MITRE ATT&CK: T1003.001,
  T1003.002, T1003.004, T1003.005, T1003.006.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*DumpCreds*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*mimikatz*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*::aadcookie*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*::detours*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*::memssp*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*::mflt*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*::ncroutemon*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*::ngcsign*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*::printnightmare*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*::skeleton*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*::preshutdown*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*::mstsc*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*::multirdp*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*rpc::*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*token::*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*crypto::*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*dpapi::*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*sekurlsa::*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*kerberos::*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*lsadump::*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*privilege::*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*process::*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*vault::*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*DumpCreds*'; data_win_eventdata_commandLine matches '*mimikatz*';
  data_win_eventdata_commandLine matches '*::aadcookie*', among other
  conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.slideshare.net/heirhabarov/hunting-for-credentials-dumping-in-windows-environment
  - https://tools.thehacker.recipes/mimikatz/modules
  - https://attack.mitre.org/techniques/T1003/001/
  - https://attack.mitre.org/techniques/T1003/002/
  - https://attack.mitre.org/techniques/T1003/004/
  - https://attack.mitre.org/techniques/T1003/005/
  - https://attack.mitre.org/techniques/T1003/006/

response:
  message: >
    HackTool - Mimikatz Execution detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1003.001, T1003.002, T1003.004, T1003.005, T1003.006
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.001
    - T1003.002
    - T1003.004
    - T1003.005
    - T1003.006
  custom_tags:
    - hacktool
    - mimikatz
    - process_creation
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Dd][Uu][Mm][Pp][Cc][Rr][Ee][Dd][Ss].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz].*/ OR data_win_eventdata_commandLine:/.*::[Aa][Aa][Dd][Cc][Oo][Oo][Kk][Ii][Ee].*/ OR data_win_eventdata_commandLine:/.*::[Dd][Ee][Tt][Oo][Uu][Rr][Ss].*/ OR data_win_eventdata_commandLine:/.*::[Mm][Ee][Mm][Ss][Ss][Pp].*/ OR data_win_eventdata_commandLine:/.*::[Mm][Ff][Ll][Tt].*/ OR data_win_eventdata_commandLine:/.*::[Nn][Cc][Rr][Oo][Uu][Tt][Ee][Mm][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*::[Nn][Gg][Cc][Ss][Ii][Gg][Nn].*/ OR data_win_eventdata_commandLine:/.*::[Pp][Rr][Ii][Nn][Tt][Nn][Ii][Gg][Hh][Tt][Mm][Aa][Rr][Ee].*/ OR data_win_eventdata_commandLine:/.*::[Ss][Kk][Ee][Ll][Ee][Tt][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*::[Pp][Rr][Ee][Ss][Hh][Uu][Tt][Dd][Oo][Ww][Nn].*/ OR data_win_eventdata_commandLine:/.*::[Mm][Ss][Tt][Ss][Cc].*/ OR data_win_eventdata_commandLine:/.*::[Mm][Uu][Ll][Tt][Ii][Rr][Dd][Pp].*/ OR data_win_eventdata_commandLine:/.*[Rr][Pp][Cc]::.*/ OR data_win_eventdata_commandLine:/.*[Tt][Oo][Kk][Ee][Nn]::.*/ OR data_win_eventdata_commandLine:/.*[Cc][Rr][Yy][Pp][Tt][Oo]::.*/ OR data_win_eventdata_commandLine:/.*[Dd][Pp][Aa][Pp][Ii]::.*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa]::.*/ OR data_win_eventdata_commandLine:/.*[Kk][Ee][Rr][Bb][Ee][Rr][Oo][Ss]::.*/ OR data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Dd][Uu][Mm][Pp]::.*/ OR data_win_eventdata_commandLine:/.*[Pp][Rr][Ii][Vv][Ii][Ll][Ee][Gg][Ee]::.*/ OR data_win_eventdata_commandLine:/.*[Pp][Rr][Oo][Cc][Ee][Ss][Ss]::.*/ OR data_win_eventdata_commandLine:/.*[Vv][Aa][Uu][Ll][Tt]::.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: Alternate LSASS dump path; operators switch method when mimikatz is detected.
  - id: 5afee48e-67dd-4e03-a783-f74259dcf998
    name: Potential LSASS Process Dump Via Procdump
    reason: Offline LSASS dump later parsed by mimikatz/pypykatz.
  - id: ffa6861c-4461-4f59-8a41-578c39f3f23e
    name: LSASS Dump Keyword In CommandLine
    reason: Generic lsass dump commandlines co-occurring with sekurlsa usage.
  - id: fd877b94-9bb5-4191-bb25-d79cbd93c167
    name: Dumping of Sensitive Hives Via Reg.EXE
    reason: lsadump::sam equivalent done with native tools.
  - id: d372f928-ce4f-11eb-a762-acde48001122
    name: Esentutl SAM Copy
    reason: SAM theft via VSS copy feeding lsadump.
  - id: da63bc76-61ae-11eb-ae93-0242ac130002
    name: Ntdsutil Export NTDS
    reason: Domain-wide credential theft that follows once DC access is gained.
  - id: 13bbd574-83ac-11ec-99d4-acde48001122
    name: Mimikatz PassTheTicket CommandLine Parameters
    reason: kerberos::ptt use of stolen tickets, the lateral-movement follow-on.
  - id: a29808fd-ef50-49ff-9c7a-59a9b040b404
    name: HackTool - Pypykatz Credentials Dumping Activity
    reason: Python equivalent used to parse dumps offline on the same or another host.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Process access to LSASS with high privileges
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_grantedAccess:"0x1010" OR data_win_eventdata_grantedAccess:"0x1410" OR data_win_eventdata_grantedAccess:"0x1fffff" OR data_win_eventdata_grantedAccess:"0x1438")
    pivot_on: host
    window: 2h
  - name: Shadow copy, SAM, SYSTEM or NTDS file access
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Vv]ss[Aa]dmin.*(create|list)|[Nn][Tt][Dd][Ss]\.dit|[Ss]hadow[Cc]opy|[Rr]eg.* save .*([Ss][Aa][Mm]|[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy])).*/
    pivot_on: host
    window: 4h
  - name: Logons with explicit credentials (logon type 9, pass-the-hash)
    query: data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"9"
    pivot_on: user
    window: 24h
  - name: Kerberos TGT and TGS requests with RC4 encryption
    query: (data_win_system_eventID:"4768" OR data_win_system_eventID:"4769") AND data_win_eventdata_ticketEncryptionType:"0x17"
    pivot_on: user
    window: 6h
  - name: Remote service install and lateral execution
    query: (data_win_system_eventID:"7045" OR data_win_system_eventID:"4697") AND (data_win_eventdata_imagePath:/.*([Cc]md\.exe|[Pp]ower[Ss]hell|[Aa][Dd][Mm][Ii][Nn]\$).*/ OR data_win_eventdata_serviceFileName:/.*([Cc]md\.exe|[Pp]ower[Ss]hell|[Aa][Dd][Mm][Ii][Nn]\$).*/)
    pivot_on: host
    window: 6h
