name: Use of FSharp Interpreters
id: b96b2031-7c17-4473-afe7-a30ce714db29
version: 1
schema_version: "1.0"
date: "2024-04-23"
author: Christopher Peacock @SecurePeacock, SCYTHE @scythe_io
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: b96b2031-7c17-4473-afe7-a30ce714db29
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of FSharp Interpreters "FsiAnyCpu.exe" and "FSi.exe"
  Both can be used for AWL bypass and to execute F# code via scripts or inline.
  MITRE ATT&CK: T1059.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\fsi.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\fsianycpu.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "fsi.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "fsianycpu.exe"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches '*\fsi.exe';
  data_win_eventdata_image matches '*\fsianycpu.exe';
  data_win_eventdata_originalFileName equals 'fsi.exe', among other conditions.

known_false_positives: >
  Legitimate use by a software developer. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://learn.microsoft.com/en-us/windows/security/application-security/application-control/windows-defender-application-control/design/applications-that-can-bypass-wdac
  - https://bohops.com/2020/11/02/exploring-the-wdac-microsoft-recommended-block-rules-part-ii-wfc-fsi/
  - https://lolbas-project.github.io/lolbas/OtherMSBinaries/FsiAnyCpu/
  - https://lolbas-project.github.io/lolbas/OtherMSBinaries/Fsi/
  - https://attack.mitre.org/techniques/T1059/

response:
  message: >
    Use of FSharp Interpreters detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1059
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059
  custom_tags:
    - fsharp
    - interpreters
    - process_creation
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ff][Ss][Ii]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ff][Ss][Ii][Aa][Nn][Yy][Cc][Pp][Uu]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ff][Ss][Ii]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ff][Ss][Ii][Aa][Nn][Yy][Cc][Pp][Uu]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d4ca7c59-e9e4-42d8-bf57-91a776efcb87
    name: LOLBIN Execution From Abnormal Drive
    reason: fsi is a signed Microsoft binary used for AWL bypass; execution from an abnormal location suggests dropped tooling.
  - id: 3428ac18-a410-4823-816c-ce697d26f7a8
    name: Windows Indirect Command Execution Via pcalua
    reason: Alternate signed-binary proxy tried by the same operator for application-control bypass.
  - id: 64760eef-87f7-4ed3-93fd-655668ea9420
    name: Use of Scriptrunner.exe
    reason: Another LOLBin execution proxy used to run code past allowlisting.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Children spawned by fsi/fsiAnyCpu
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*([Ff][Ss][Ii][.][Ee][Xx][Ee]|[Ff][Ss][Ii][Aa][Nn][Yy][Cc][Pp][Uu][.][Ee][Xx][Ee])/
    pivot_on: host
    window: 2h
  - name: F# script files created
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*([.][Ff][Ss][Xx]|[.][Ff][Ss][Ii])/
    pivot_on: host
    window: 4h
  - name: Outbound connections from script hosts
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll][.][Ee][Xx][Ee]|[Pp][Ww][Ss][Hh][.][Ee][Xx][Ee]|[Cc][Mm][Dd][.][Ee][Xx][Ee]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt][.][Ee][Xx][Ee]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt][.][Ee][Xx][Ee]|[Mm][Ss][Hh][Tt][Aa][.][Ee][Xx][Ee]|[Rr][Uu][Nn][Dd][Ll][Ll]32[.][Ee][Xx][Ee]|[Rr][Ee][Gg][Ss][Vv][Rr]32[.][Ee][Xx][Ee])/
    pivot_on: host
    window: 2h
  - name: Download tooling in command lines
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll].*/ OR data_win_eventdata_commandLine:/.*[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp]://.*/ OR data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp][Ss]://.*/)
    pivot_on: host
    window: 4h
  - name: Persistence registry writes
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND data_win_eventdata_targetObject:/.*([Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn][\\][Rr][Uu][Nn]|[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn][\\][Rr][Uu][Nn][Oo][Nn][Cc][Ee]|[Ii][Mm][Aa][Gg][Ee] [Ff][Ii][Ll][Ee] [Ee][Xx][Ee][Cc][Uu][Tt][Ii][Oo][Nn] [Oo][Pp][Tt][Ii][Oo][Nn][Ss]|[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn][\\][Ss][Hh][Ee][Ll][Ll]).*/
    pivot_on: host
    window: 6h
