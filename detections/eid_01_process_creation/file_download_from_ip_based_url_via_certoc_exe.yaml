name: File Download From IP Based URL Via CertOC.EXE
id: b86f6dea-0b2f-41f5-bdcc-a057bd19cd6a
version: 1
schema_version: "1.0"
date: "2023-10-18"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: b86f6dea-0b2f-41f5-bdcc-a057bd19cd6a
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects when a user downloads a file from an IP based URL using CertOC.exe.
  MITRE ATT&CK: T1105.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\certoc.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "CertOC.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - regexp:
            data_win_eventdata_commandLine: ".*(://[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}).*"
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*-GetCACAPS*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\certoc.exe'; data_win_eventdata_originalFileName equals 'CertOC.exe';
  data_win_eventdata_commandLine matches the regex
  /.*(://[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}).*/, among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://lolbas-project.github.io/lolbas/Binaries/Certoc/
  - https://attack.mitre.org/techniques/T1105/

response:
  message: >
    File Download From IP Based URL Via CertOC.EXE detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1105
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1105
  custom_tags:
    - download
    - certoc
    - process_creation
    - sysmon
    - command_and_control
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Cc][Ee][Rr][Tt][Oo][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Cc][Ee][Rr][Tt][Oo][Cc]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*(:\/\/[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}).*/ AND data_win_eventdata_commandLine:/.*-[Gg][Ee][Tt][Cc][Aa][Cc][Aa][Pp][Ss].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 70ad0861-d1fe-491c-a45f-fa48148a300d
    name: File Download via CertOC.EXE
    reason: Same CertOC -GetCACAPS download primitive; the hostname variant shows the same actor staging payloads without an IP literal.
  - id: 242301bc-f92f-4476-8718-78004a6efd9f
    name: DLL Loaded via CertOC.EXE
    reason: CertOC -LoadDLL is the usual follow-on that executes the payload CertOC just fetched.
  - id: 84232095-ecca-4015-b0d7-7726507ee793
    name: Suspicious DLL Loaded via CertOC.EXE
    reason: Download then load of a DLL from user-writable paths completes the fetch-and-execute chain.
  - id: 0dba975d-a193-4ed1-a067-424df57570d1
    name: Uncommon Network Connection Initiated By Certutil.EXE
    reason: Alternate cert-utility LOLBin download path used when CertOC is blocked.
  - id: windows-file-download-certutil-001
    name: Windows File Download Via Certutil
    reason: Attackers rotate between certutil and certoc for ingress tool transfer on the same host.
  - id: d059842b-6b9d-4ed1-b5c3-5b89143c6ede
    name: File Download Via Bitsadmin
    reason: Common companion LOLBin downloader in the same staging phase.
  - id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
    name: PowerShell Download and Execution Cradles
    reason: Often the launcher that invoked CertOC or the next stage executing the payload.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: CertOC executions with download or load switch
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*[Cc]ert[Oo][Cc]\.exe/ OR data_win_eventdata_originalFileName:/[Cc]ert[Oo][Cc]\.exe/) AND data_win_eventdata_commandLine:(*GetCACAPS* OR *LoadDLL* OR *http*)
    pivot_on: host
    window: 2h
  - name: Network connections by CertOC
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*[Cc]ert[Oo][Cc]\.exe/ AND data_win_eventdata_initiated:true
    pivot_on: host
    window: 2h
  - name: Executables or scripts created in user-writable paths
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\\(Temp|Users\\Public|ProgramData|AppData)\\.*\.(exe|dll|bat|ps1|vbs)/
    pivot_on: host
    window: 2h
  - name: Other LOLBin downloaders on the host
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(certutil|bitsadmin|curl|mshta|regsvr32).*(http|ftp):\/\/.*/
    pivot_on: host
    window: 4h
  - name: Persistence after download (Run keys, schtasks)
    query: (data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*\\CurrentVersion\\Run.*/) OR (data_win_system_eventID:1 AND data_win_eventdata_image:/.*schtasks\.exe/ AND data_win_eventdata_commandLine:*\/create*)
    pivot_on: host
    window: 4h
