graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Mm][Dd]\.[Ee][Xx][Ee]\/[Cc].*/ OR data_win_eventdata_commandLine:/.*\\[Cc][Mm][Dd]\/[Cc].*/ OR data_win_eventdata_commandLine:/.*\"[Cc][Mm][Dd]\/[Cc].*/ OR data_win_eventdata_commandLine:/.*[Cc][Mm][Dd]\.[Ee][Xx][Ee]\/[Kk].*/ OR data_win_eventdata_commandLine:/.*\\[Cc][Mm][Dd]\/[Kk].*/ OR data_win_eventdata_commandLine:/.*\"[Cc][Mm][Dd]\/[Kk].*/ OR data_win_eventdata_commandLine:/.*[Cc][Mm][Dd]\.[Ee][Xx][Ee]\/[Rr].*/ OR data_win_eventdata_commandLine:/.*\\[Cc][Mm][Dd]\/[Rr].*/ OR data_win_eventdata_commandLine:/.*\"[Cc][Mm][Dd]\/[Rr].*/ OR data_win_eventdata_commandLine:/.*\/[Cc][Ww][Hh][Oo][Aa][Mm][Ii].*/ OR data_win_eventdata_commandLine:/.*\/[Cc][Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*\/[Cc][Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss].*/ OR data_win_eventdata_commandLine:/.*\/[Cc][Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn].*/ OR data_win_eventdata_commandLine:/.*\/[Cc][Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll].*/ OR data_win_eventdata_commandLine:/.*\/[Kk][Ww][Hh][Oo][Aa][Mm][Ii].*/ OR data_win_eventdata_commandLine:/.*\/[Kk][Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*\/[Kk][Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss].*/ OR data_win_eventdata_commandLine:/.*\/[Kk][Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn].*/ OR data_win_eventdata_commandLine:/.*\/[Kk][Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll].*/ OR data_win_eventdata_commandLine:/.*[Cc][Mm][Dd]\.[Ee][Xx][Ee] \/[Cc].*/ OR data_win_eventdata_commandLine:/.*[Cc][Mm][Dd] \/[Cc].*/ OR data_win_eventdata_commandLine:/.*[Cc][Mm][Dd]\.[Ee][Xx][Ee] \/[Kk].*/ OR data_win_eventdata_commandLine:/.*[Cc][Mm][Dd] \/[Kk].*/ OR data_win_eventdata_commandLine:/.*[Cc][Mm][Dd]\.[Ee][Xx][Ee] \/[Rr].*/ OR data_win_eventdata_commandLine:/.*[Cc][Mm][Dd] \/[Rr].*/) AND _exists_:data_win_eventdata_commandLine AND NOT (data_win_eventdata_commandLine:/.*[Cc][Mm][Dd]\.[Ee][Xx][Ee] \/[Cc] .*/ OR data_win_eventdata_commandLine:/.*[Cc][Mm][Dd] \/[Cc] .*/ OR data_win_eventdata_commandLine:/.*[Cc][Mm][Dd]\.[Ee][Xx][Ee] \/[Kk] .*/ OR data_win_eventdata_commandLine:/.*[Cc][Mm][Dd] \/[Kk] .*/ OR data_win_eventdata_commandLine:/.*[Cc][Mm][Dd]\.[Ee][Xx][Ee] \/[Rr] .*/ OR data_win_eventdata_commandLine:/.*[Cc][Mm][Dd] \/[Rr] .*/ OR data_win_eventdata_commandLine:/.*[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt] [Vv][Ss] [Cc][Oo][Dd][Ee]\\[Rr][Ee][Ss][Oo][Uu][Rr][Cc][Ee][Ss]\\[Aa][Pp][Pp]\\[Nn][Oo][Dd][Ee]_[Mm][Oo][Dd][Uu][Ll][Ee][Ss].*/ OR data_win_eventdata_commandLine:/.*[Cc][Mm][Dd]\.[Ee][Xx][Ee]\/[Cc] \./ OR data_win_eventdata_commandLine:/[Cc][Mm][Dd]\.[Ee][Xx][Ee] \/[Cc]/ OR data_win_eventdata_commandLine:/[Cc][Mm][Dd] \/[Cc]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b89919ed-fe5f-492c-b139-95dbb162039e
    name: Detect Use of cmd exe to Launch Script Interpreters
    reason: Same cmd.exe /c wrapper; if the malformed cmd/c line goes on to launch PowerShell/wscript/mshta, this confirms the obfuscated wrapper was a script launcher.
  - id: dcfd6b40-42f9-469d-a433-2e53f7486664
    name: Detect Prohibited Applications Spawning cmd exe
    reason: A malformed cmd/c is often spawned by Office, browsers or script hosts; this identifies the unexpected parent that delivered the command.
  - id: f0cdd048-82dc-4f7a-8a7a-b87a52b6d0fd
    name: Potential Commandline Obfuscation Using Escape Characters
    reason: 'Same operator habit: command-line obfuscation (carets, escapes) frequently appears alongside missing-space cmd syntax in the same generated command.'
  - id: e32d4572-9826-4738-b651-95fa63747e8a
    name: Base64 Encoded PowerShell Command Detected
    reason: The cmd /c payload is frequently an encoded PowerShell stage; a hit on the same host shows the payload behind the oddly formed wrapper.
  - id: 8e0bb260-d4b2-4fff-bb8d-3f82118e6892
    name: Potentially Suspicious CMD Shell Output Redirect
    reason: 'Follow-on: malformed cmd one-liners from droppers commonly redirect output or write payloads to disk.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Children spawned by cmd.exe on this host (what the odd cmd line ran)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]/)
    pivot_on: host
    window: 1h
  - name: cmd /c, /k invocations from non-interactive parents
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_parentImage:/.*\\[Ww][Ii][Nn][Ww][Oo][Rr][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ee][Xx][Cc][Ee][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Oo][Uu][Tt][Ll][Oo][Oo][Kk]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Jj][Aa][Vv][Aa]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*/[Cc].*/ OR data_win_eventdata_commandLine:/.*/[Kk].*/)
    pivot_on: host
    window: 2h
  - name: Downloads or encoded payloads launched near the cmd line
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*-[Ee][Nn][Cc].*/ OR data_win_eventdata_commandLine:/.*[Ff][Rr][Oo][Mm][Bb][Aa][Ss][Ee]64[Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Uu][Rr][Ll][Cc][Aa][Cc][Hh][Ee].*/ OR data_win_eventdata_commandLine:/.*[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp]://.*/ OR data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp][Ss]://.*/)
    pivot_on: host
    window: 1h
  - name: Same user's cmd.exe command lines with obfuscation markers
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*\^.*/ OR data_win_eventdata_commandLine:/.*%[Cc][Oo][Mm][Ss][Pp][Ee][Cc]%.*/ OR data_win_eventdata_commandLine:/.*[Ff][Oo][Rr] /[Ll].*/ OR data_win_eventdata_commandLine:/.*&&.*/)
    pivot_on: user
    window: 6h
