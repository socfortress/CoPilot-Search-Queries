name: Remote Access Tool - AnyDesk Execution With Known Revoked Signing Certificate
id: 41f407b5-3096-44ea-a74f-96d04fbc41be
version: 1
schema_version: "1.0"
date: "2024-02-08"
author: Sai Prashanth Pulisetti, Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 41f407b5-3096-44ea-a74f-96d04fbc41be
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of an AnyDesk binary with a version prior to 8.0.8.
  Prior to version 8.0.8, the Anydesk application used a signing certificate
  that got compromised by threat actors. Use this rule to detect instances of
  older versions of Anydesk using the compromised certificate This is
  recommended in order to avoid attackers leveraging the certificate and signing
  their binaries to bypass detections.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\AnyDesk.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_description:
                    value: "AnyDesk"
                    case_insensitive: true
              - term:
                  data_win_eventdata_product:
                    value: "AnyDesk"
                    case_insensitive: true
              - term:
                  data_win_eventdata_company:
                    value: "AnyDesk Software GmbH"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_fileVersion: "7.0.*"
              - wildcard:
                  data_win_eventdata_fileVersion: "7.1.*"
              - wildcard:
                  data_win_eventdata_fileVersion: "8.0.1*"
              - wildcard:
                  data_win_eventdata_fileVersion: "8.0.2*"
              - wildcard:
                  data_win_eventdata_fileVersion: "8.0.3*"
              - wildcard:
                  data_win_eventdata_fileVersion: "8.0.4*"
              - wildcard:
                  data_win_eventdata_fileVersion: "8.0.5*"
              - wildcard:
                  data_win_eventdata_fileVersion: "8.0.6*"
              - wildcard:
                  data_win_eventdata_fileVersion: "8.0.7*"
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_commandLine"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* --remove*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* --uninstall*"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_description
    - data_win_eventdata_product
    - data_win_eventdata_company
    - data_win_eventdata_fileVersion
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\AnyDesk.exe'; data_win_eventdata_description equals 'AnyDesk';
  data_win_eventdata_product equals 'AnyDesk', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.bleepingcomputer.com/news/security/anydesk-says-hackers-breached-its-production-servers-reset-passwords/
  - https://anydesk.com/en/changelog/windows

response:
  message: >
    Remote Access Tool - AnyDesk Execution With Known Revoked Signing
    Certificate detected on host $agent_name$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. Matched data_win_eventdata_description:
    $data_win_eventdata_description$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_description
      type: other

tags:
  asset_type: Endpoint
  custom_tags:
    - anydesk
    - known
    - revoked
    - process_creation
    - sysmon
    - execution
    - initial_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Aa][Nn][Yy][Dd][Ee][Ss][Kk]\.[Ee][Xx][Ee]/ OR data_win_eventdata_description:/[Aa][Nn][Yy][Dd][Ee][Ss][Kk]/ OR data_win_eventdata_product:/[Aa][Nn][Yy][Dd][Ee][Ss][Kk]/ OR data_win_eventdata_company:/[Aa][Nn][Yy][Dd][Ee][Ss][Kk] [Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee] [Gg][Mm][Bb][Hh]/) AND (data_win_eventdata_fileVersion:/7\.0\..*/ OR data_win_eventdata_fileVersion:/7\.1\..*/ OR data_win_eventdata_fileVersion:/8\.0\.1.*/ OR data_win_eventdata_fileVersion:/8\.0\.2.*/ OR data_win_eventdata_fileVersion:/8\.0\.3.*/ OR data_win_eventdata_fileVersion:/8\.0\.4.*/ OR data_win_eventdata_fileVersion:/8\.0\.5.*/ OR data_win_eventdata_fileVersion:/8\.0\.6.*/ OR data_win_eventdata_fileVersion:/8\.0\.7.*/) AND _exists_:data_win_eventdata_commandLine AND NOT (data_win_eventdata_commandLine:/.* --[Rr][Ee][Mm][Oo][Vv][Ee].*/ OR data_win_eventdata_commandLine:/.* --[Uu][Nn][Ii][Nn][Ss][Tt][Aa][Ll][Ll].*/)

correlation:
  # Authored by the correlation engine for review.
  enrichment_searches:
  # NEW ad-hoc searches the engine runs around an alert from this rule, scoped to
  # the alert's host/user/IP within the window (not existing CoPilot Searches).
    - name: "Sysmon activity on this host in the window"
      query: 'data_win_system_channel:"Microsoft-Windows-Sysmon/Operational"'
      pivot_on: [host]
      window: 1h
    - name: "Process creation on this host"
      query: 'data_win_system_eventID:"1"'
      pivot_on: [host]
      window: 1h
    - name: "Network connections from this host"
      query: 'data_win_system_eventID:"3"'
      pivot_on: [host]
      window: 1h
    - name: "High-severity alerts on this host"
      query: 'rule_level:>=10'
      pivot_on: [host]
      window: 1h
