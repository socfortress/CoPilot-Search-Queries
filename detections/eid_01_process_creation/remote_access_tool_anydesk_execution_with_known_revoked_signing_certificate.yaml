name: Remote Access Tool - AnyDesk Execution With Known Revoked Signing Certificate
id: 41f407b5-3096-44ea-a74f-96d04fbc41be
version: 1
schema_version: "1.0"
date: "2024-02-08"
author: Sai Prashanth Pulisetti, Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 41f407b5-3096-44ea-a74f-96d04fbc41be
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of an AnyDesk binary with a version prior to 8.0.8.
  Prior to version 8.0.8, the Anydesk application used a signing certificate
  that got compromised by threat actors. Use this rule to detect instances of
  older versions of Anydesk using the compromised certificate This is
  recommended in order to avoid attackers leveraging the certificate and signing
  their binaries to bypass detections.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\AnyDesk.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_description:
                    value: "AnyDesk"
                    case_insensitive: true
              - term:
                  data_win_eventdata_product:
                    value: "AnyDesk"
                    case_insensitive: true
              - term:
                  data_win_eventdata_company:
                    value: "AnyDesk Software GmbH"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_fileVersion: "7.0.*"
              - wildcard:
                  data_win_eventdata_fileVersion: "7.1.*"
              - wildcard:
                  data_win_eventdata_fileVersion: "8.0.1*"
              - wildcard:
                  data_win_eventdata_fileVersion: "8.0.2*"
              - wildcard:
                  data_win_eventdata_fileVersion: "8.0.3*"
              - wildcard:
                  data_win_eventdata_fileVersion: "8.0.4*"
              - wildcard:
                  data_win_eventdata_fileVersion: "8.0.5*"
              - wildcard:
                  data_win_eventdata_fileVersion: "8.0.6*"
              - wildcard:
                  data_win_eventdata_fileVersion: "8.0.7*"
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_commandLine"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* --remove*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* --uninstall*"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_description
    - data_win_eventdata_product
    - data_win_eventdata_company
    - data_win_eventdata_fileVersion
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\AnyDesk.exe'; data_win_eventdata_description equals 'AnyDesk';
  data_win_eventdata_product equals 'AnyDesk', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.bleepingcomputer.com/news/security/anydesk-says-hackers-breached-its-production-servers-reset-passwords/
  - https://anydesk.com/en/changelog/windows

response:
  message: >
    Remote Access Tool - AnyDesk Execution With Known Revoked Signing
    Certificate detected on host $agent_name$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. Matched data_win_eventdata_description:
    $data_win_eventdata_description$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_description
      type: other

tags:
  asset_type: Endpoint
  custom_tags:
    - anydesk
    - known
    - revoked
    - process_creation
    - sysmon
    - execution
    - initial_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Aa][Nn][Yy][Dd][Ee][Ss][Kk]\.[Ee][Xx][Ee]/ OR data_win_eventdata_description:/[Aa][Nn][Yy][Dd][Ee][Ss][Kk]/ OR data_win_eventdata_product:/[Aa][Nn][Yy][Dd][Ee][Ss][Kk]/ OR data_win_eventdata_company:/[Aa][Nn][Yy][Dd][Ee][Ss][Kk] [Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee] [Gg][Mm][Bb][Hh]/) AND (data_win_eventdata_fileVersion:/7\.0\..*/ OR data_win_eventdata_fileVersion:/7\.1\..*/ OR data_win_eventdata_fileVersion:/8\.0\.1.*/ OR data_win_eventdata_fileVersion:/8\.0\.2.*/ OR data_win_eventdata_fileVersion:/8\.0\.3.*/ OR data_win_eventdata_fileVersion:/8\.0\.4.*/ OR data_win_eventdata_fileVersion:/8\.0\.5.*/ OR data_win_eventdata_fileVersion:/8\.0\.6.*/ OR data_win_eventdata_fileVersion:/8\.0\.7.*/) AND _exists_:data_win_eventdata_commandLine AND NOT (data_win_eventdata_commandLine:/.* --[Rr][Ee][Mm][Oo][Vv][Ee].*/ OR data_win_eventdata_commandLine:/.* --[Uu][Nn][Ii][Nn][Ss][Tt][Aa][Ll][Ll].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b52e84a3-029e-4529-b09b-71d19dd27e94
    name: Remote Access Tool - AnyDesk Execution
    reason: Base AnyDesk execution rule; co-fires for the same process.
  - id: 065b00ca-5d5c-4557-ac95-64a6d0b64d86
    name: Remote Access Tool - Anydesk Execution From Suspicious Folder
    reason: Old compromised-cert build from a suspicious folder is a strong malicious indicator.
  - id: 114e7f1c-f137-48c8-8f54-3088c24ce4b9
    name: Remote Access Tool - AnyDesk Silent Installation
    reason: Silent install with --install/--silent is how operators deploy AnyDesk before first execution.
  - id: b1377339-fda6-477a-b455-ac0923f9ec2c
    name: Remote Access Tool - AnyDesk Piped Password Via CLI
    reason: Piping a password to set unattended access gives the actor persistent control.
  - id: ccad96d7-a48c-4f13-8b9c-9f6a31cba454
    name: Detect Remote Access Software Usage FileInfo
    reason: Other remote access tools on the same host indicate redundant C2 channels.
  - id: 57bff678-25d1-4d6c-8211-8ca106d12053
    name: Remote Access Tool - ScreenConnect Execution
    reason: Actors commonly deploy several RMM tools together for redundancy.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: AnyDesk install and unattended-access setup
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*[Aa]ny[Dd]esk.*--install.*/ OR data_win_eventdata_commandLine:/.*[Aa]ny[Dd]esk.*--silent.*/ OR data_win_eventdata_commandLine:/.*[Aa]ny[Dd]esk.*--set-password.*/ OR data_win_eventdata_commandLine:/.*[Aa]ny[Dd]esk.*--with-password.*/)
    pivot_on: host
    window: 4h
  - name: AnyDesk persistence (service, task, run key)
    query: (data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*[Aa]ny[Dd]esk.*/) OR (data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*sc.* create.*[Aa]ny[Dd]esk.*/) OR (data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*schtasks.*[Aa]ny[Dd]esk.*/)
    pivot_on: host
    window: 6h
  - name: AnyDesk network connections and DNS
    query: (data_win_system_eventID:3 AND data_win_eventdata_image:/.*[Aa]ny[Dd]esk.*/) OR (data_win_system_eventID:22 AND data_win_eventdata_queryName:/.*[Aa]ny[Dd]esk.*/)
    pivot_on: host
    window: 6h
  - name: AnyDesk binary and config file drops
    query: data_win_system_eventID:11 AND (data_win_eventdata_targetFilename:/.*[Aa]ny[Dd]esk.*/ OR data_win_eventdata_targetFilename:/.*system\.conf/ OR data_win_eventdata_targetFilename:/.*ad\.trace/)
    pivot_on: host
    window: 6h
  - name: Other remote access or RMM tools
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*[Ss]creen[Cc]onnect.*/ OR data_win_eventdata_image:/.*[Tt]eam[Vv]iewer.*/ OR data_win_eventdata_image:/.*[Aa]tera.*/ OR data_win_eventdata_image:/.*[Nn]et[Ss]upport.*/ OR data_win_eventdata_image:/.*[Mm]esh[Aa]gent.*/)
    pivot_on: host
    window: 24h
