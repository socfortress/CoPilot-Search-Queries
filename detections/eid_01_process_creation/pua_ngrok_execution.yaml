name: PUA - Ngrok Execution
id: ee37eb7c-a4e7-4cd5-8fa4-efa27f1c3f31
version: 1
schema_version: "1.0"
date: "2023-02-21"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: ee37eb7c-a4e7-4cd5-8fa4-efa27f1c3f31
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the use of Ngrok, a utility used for port forwarding and tunneling,
  often used by threat actors to make local protected services publicly
  available. Involved domains are bin.equinox.io for download and *.ngrok.io for
  connections. MITRE ATT&CK: T1572.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* tcp 139*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* tcp 445*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* tcp 3389*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* tcp 5985*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* tcp 5986*"
                    case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* start *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*--all*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*--config*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*.yml*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*ngrok.exe"
                          case_insensitive: true
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* tcp *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* http *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* authtoken *"
                                case_insensitive: true
                        minimum_should_match: 1
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.exe authtoken *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.exe start --all*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches '* tcp
  139*'; data_win_eventdata_commandLine matches '* tcp 445*';
  data_win_eventdata_commandLine matches '* tcp 3389*', among other conditions.

known_false_positives: >
  Another tool that uses the command line switches of Ngrok. Ngrok http 3978
  (https://learn.microsoft.com/en-us/azure/bot-service/bot-service-debug-channel-ngrok?view=azure-bot-service-4.0).
  Baseline expected activity in your environment and tune this detection before
  relying on it for automated response.

references:
  - https://ngrok.com/docs
  - https://www.fireeye.com/blog/threat-research/2021/05/shining-a-light-on-darkside-ransomware-operations.html
  - https://stackoverflow.com/questions/42442320/ssh-tunnel-to-ngrok-and-initiate-rdp
  - https://www.virustotal.com/gui/file/58d21840d915aaf4040ceb89522396124c82f325282f805d1085527e1e2ccfa1/detection
  - https://cybleinc.com/2021/02/15/ngrok-platform-abused-by-hackers-to-deliver-a-new-wave-of-phishing-attacks/
  - https://twitter.com/xorJosh/status/1598646907802451969
  - https://www.softwaretestinghelp.com/how-to-use-ngrok/
  - https://attack.mitre.org/techniques/T1572/

response:
  message: >
    PUA - Ngrok Execution detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1572
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1572
  custom_tags:
    - ngrok
    - process_creation
    - sysmon
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.* [Tt][Cc][Pp] 139.*/ OR data_win_eventdata_commandLine:/.* [Tt][Cc][Pp] 445.*/ OR data_win_eventdata_commandLine:/.* [Tt][Cc][Pp] 3389.*/ OR data_win_eventdata_commandLine:/.* [Tt][Cc][Pp] 5985.*/ OR data_win_eventdata_commandLine:/.* [Tt][Cc][Pp] 5986.*/ OR (data_win_eventdata_commandLine:/.* [Ss][Tt][Aa][Rr][Tt] .*/ AND data_win_eventdata_commandLine:/.*--[Aa][Ll][Ll].*/ AND data_win_eventdata_commandLine:/.*--[Cc][Oo][Nn][Ff][Ii][Gg].*/ AND data_win_eventdata_commandLine:/.*\.[Yy][Mm][Ll].*/) OR (data_win_eventdata_image:/.*[Nn][Gg][Rr][Oo][Kk]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.* [Tt][Cc][Pp] .*/ OR data_win_eventdata_commandLine:/.* [Hh][Tt][Tt][Pp] .*/ OR data_win_eventdata_commandLine:/.* [Aa][Uu][Tt][Hh][Tt][Oo][Kk][Ee][Nn] .*/)) OR data_win_eventdata_commandLine:/.*\.[Ee][Xx][Ee] [Aa][Uu][Tt][Hh][Tt][Oo][Kk][Ee][Nn] .*/ OR data_win_eventdata_commandLine:/.*\.[Ee][Xx][Ee] [Ss][Tt][Aa][Rr][Tt] --[Aa][Ll][Ll].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: fadb84f0-4e84-4f6d-a1ce-9ef2bffb6ccd
    name: Cloudflared Portable Execution
    reason: Alternative reverse-tunnel service; actors commonly drop several tunnelers on one host for redundancy.
  - id: 8b0e12da-d3c3-49db-bb4f-256703f380e5
    name: PUA - Chisel Tunneling Tool Execution
    reason: Same objective (expose internal service externally); co-occurs in tunneling toolkits.
  - id: 32410e29-5f94-4568-b6a3-d91a8adad863
    name: PUA - Fast Reverse Proxy (FRP) Execution
    reason: Sibling reverse-proxy tunneler used interchangeably with ngrok.
  - id: 8a3038e8-9c9d-46f8-b184-66234a160f6f
    name: Potential Remote Desktop Tunneling
    reason: ngrok tcp 3389 is the classic RDP exposure; this rule catches other RDP tunneling forms.
  - id: 322ed9ec-fcab-4f67-9a34-e7c6aef43614
    name: New Port Forwarding Rule Added Via Netsh.EXE
    reason: Port forwarding to the tunneled service is configured locally alongside ngrok.
  - id: d059842b-6b9d-4ed1-b5c3-5b89143c6ede
    name: File Download Via Bitsadmin
    reason: ngrok.exe is downloaded to the host (bin.equinox.io) by a LOLBin before it is run.
  - id: 2daa93a0-a5fb-41c5-8cd8-3c11294bfd1f
    name: Potential SSH Tunnel Persistence Install Using A Scheduled Task
    reason: Persistence for a tunnel to maintain external access after the tunneler is placed.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: ngrok binary execution and authtoken/start usage
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Nn][Gg][Rr][Oo][Kk]\.[Ee][Xx][Ee])/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.* [Aa][Uu][Tt][Hh][Tt][Oo][Kk][Ee][Nn] .*/ OR data_win_eventdata_commandLine:/.* [Ss][Tt][Aa][Rr][Tt] \-\-[Aa][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.* [Tt][Cc][Pp] 3389.*/ OR data_win_eventdata_commandLine:/.* [Tt][Cc][Pp] 445.*/))
    pivot_on:
    - host
    window: 4h
  - name: Download of tunneling binary via LOLBin
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]|\\[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]|\\[Ww][Gg][Ee][Tt]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*[Nn][Gg][Rr][Oo][Kk].*/ OR data_win_eventdata_commandLine:/.*[Ee][Qq][Uu][Ii][Nn][Oo][Xx]\.[Ii][Oo].*/)
    pivot_on:
    - host
    window: 2h
  - name: Outbound connections to ngrok infrastructure
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:"true" AND data_win_eventdata_destinationHostname:/.*[Nn][Gg][Rr][Oo][Kk].*/
    pivot_on:
    - host
    window: 4h
  - name: DNS lookups for ngrok domains
    query: data_win_system_eventID:"22" AND data_win_eventdata_queryName:/.*[Nn][Gg][Rr][Oo][Kk].*/
    pivot_on:
    - host
    window: 4h
  - name: 'Exposed services: portproxy / firewall rules'
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Nn][Ee][Tt][Ss][Hh]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*[Pp][Oo][Rr][Tt][Pp][Rr][Oo][Xx][Yy].*/ OR data_win_eventdata_commandLine:/.*[Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll].*/)
    pivot_on:
    - host
    window: 4h
