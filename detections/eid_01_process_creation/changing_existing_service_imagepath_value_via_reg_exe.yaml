name: Changing Existing Service ImagePath Value Via Reg.EXE
id: 9b0b7ac3-6223-47aa-a3fd-e8f211e637db
version: 1
schema_version: "1.0"
date: "2024-03-13"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 9b0b7ac3-6223-47aa-a3fd-e8f211e637db
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Adversaries may execute their own malicious payloads by hijacking the Registry
  entries used by services. Adversaries may use flaws in the permissions for
  registry to redirect from the originally specified executable to one that they
  control, in order to launch their own code at Service start. Windows stores
  local service configuration information in the Registry under
  HKLM\SYSTEM\CurrentControlSet\Services. MITRE ATT&CK: T1574.011.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\reg.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*add *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*SYSTEM\\\\CurrentControlSet\\\\Services\\\\*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* ImagePath *"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -d *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /d *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* –d *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* —d *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* ―d *"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches '*\reg.exe';
  data_win_eventdata_commandLine matches '*add *';
  data_win_eventdata_commandLine matches '*SYSTEM\CurrentControlSet\Services\*',
  among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1574.011/T1574.011.md#atomic-test-2---service-imagepath-change-with-regexe
  - https://attack.mitre.org/techniques/T1574/011/

response:
  message: >
    Changing Existing Service ImagePath Value Via Reg.EXE detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
    MITRE ATT&CK: T1574.011
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.011
  custom_tags:
    - changing
    - existing
    - service
    - process_creation
    - sysmon
    - privilege_escalation
    - persistence
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Rr][Ee][Gg]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Aa][Dd][Dd] .*/ AND data_win_eventdata_commandLine:/.*[Ss][Yy][Ss][Tt][Ee][Mm]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt]\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\.*/ AND data_win_eventdata_commandLine:/.* [Ii][Mm][Aa][Gg][Ee][Pp][Aa][Tt][Hh] .*/ AND (data_win_eventdata_commandLine:/.* -[Dd] .*/ OR data_win_eventdata_commandLine:/.* \/[Dd] .*/ OR data_win_eventdata_commandLine:/.* –[Dd] .*/ OR data_win_eventdata_commandLine:/.* —[Dd] .*/ OR data_win_eventdata_commandLine:/.* ―[Dd] .*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 8470d755-0c13-45b3-bd63-387a373c10cf
    name: Reg exe Manipulating Windows Services Registry Keys
    reason: Same reg.exe service-key tampering via a broader pattern; confirms the ImagePath edit is part of a service hijack.
  - id: 138d3531-8793-4f50-a2cd-f291b2863d78
    name: Suspicious Service Path Modification
    reason: Alternate way (sc/PowerShell) of redirecting a service binary path; adversaries often try several methods.
  - id: 38879043-7e1e-47a9-8d46-6bec88e201df
    name: Potential Persistence Attempt Via Existing Service Tampering
    reason: Hijacked service is the persistence mechanism; covers companion modifications of the same service.
  - id: 883faa95-175a-4e22-8181-e5761aeb373c
    name: Suspicious Service Binary Directory
    reason: The new ImagePath typically points to a user-writable or temp directory flagged by this rule.
  - id: 17a1be64-8d88-40bf-b5ff-a4f7a50ebcc8
    name: Suspicious New Service Creation
    reason: Attacker may create a new service instead of or alongside hijacking an existing one.
  - id: 85c312b7-f44d-4a51-a024-d671c40b49fc
    name: Service StartupType Change Via Sc.EXE
    reason: Hijacked service is usually set to auto-start so the payload survives reboot.
  - id: 0b7163dc-7eee-4960-af17-c0cd517f92da
    name: Service Started/Stopped Via Wmic.EXE
    reason: Service must be restarted to run the planted binary; wmic is one way to trigger it.
  - id: d937b75f-a665-4480-88a5-2f20e9f9b22a
    name: Possible Privilege Escalation via Weak Service Permissions
    reason: Weak service ACLs are the usual enabler for a non-admin to change ImagePath.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Service binpath changes via sc.exe
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Ss][Cc]\.exe/ AND data_win_eventdata_commandLine:/.*(config|create).*[Bb]in[Pp]ath.*/
    pivot_on: host
    window: 4h
  - name: Registry writes to service ImagePath
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*CurrentControlSet.Services.*[Ii]mage[Pp]ath.*/
    pivot_on: host
    window: 4h
  - name: New service installed (7045)
    query: data_win_system_eventID:7045
    pivot_on: host
    window: 4h
  - name: Service start or restart commands
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(net1?\.exe|[Ss][Cc]\.exe).* (start|stop) .*/
    pivot_on: host
    window: 2h
  - name: Executables dropped to writable paths
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*(Temp|ProgramData|Users.Public|AppData).*\.(exe|dll)/
    pivot_on: host
    window: 4h
