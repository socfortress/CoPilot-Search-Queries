name: ETW Trace Evasion Activity
id: a238b5d0-ce2d-4414-a676-7a531b3d13d6
version: 1
schema_version: "1.0"
date: "2022-06-28"
author: "@neu5ron, Florian Roth (Nextron Systems), Jonhnathan Ribeiro, oscd.community"
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: a238b5d0-ce2d-4414-a676-7a531b3d13d6
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects command line activity that tries to clear or disable any ETW trace log
  which could be a sign of logging evasion. MITRE ATT&CK: T1070, T1685.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*cl*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*/Trace*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*clear-log*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*/Trace*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*sl*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*/e:false*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*set-log*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*/e:false*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*logman*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*update*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*trace*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*--p*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*-ets*"
                          case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Remove-EtwTraceProvider*"
                    case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*Set-EtwTraceProvider*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*0x11*"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*cl*'; data_win_eventdata_commandLine matches '*/Trace*';
  data_win_eventdata_commandLine matches '*clear-log*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/wevtutil
  - https://abuse.io/lockergoga.txt
  - https://medium.com/palantir/tampering-with-windows-event-tracing-background-offense-and-defense-4be7ac62ac63
  - https://attack.mitre.org/techniques/T1070/
  - https://attack.mitre.org/techniques/T1685/

response:
  message: >
    ETW Trace Evasion Activity detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1070,
    T1685
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1070
    - T1685
  custom_tags:
    - trace
    - evasion
    - process_creation
    - sysmon
    - stealth
    - defense_impairment
    - car_2016_04_002
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND ((data_win_eventdata_commandLine:/.*[Cc][Ll].*/ AND data_win_eventdata_commandLine:/.*\/[Tt][Rr][Aa][Cc][Ee].*/) OR (data_win_eventdata_commandLine:/.*[Cc][Ll][Ee][Aa][Rr]-[Ll][Oo][Gg].*/ AND data_win_eventdata_commandLine:/.*\/[Tt][Rr][Aa][Cc][Ee].*/) OR (data_win_eventdata_commandLine:/.*[Ss][Ll].*/ AND data_win_eventdata_commandLine:/.*\/[Ee]:[Ff][Aa][Ll][Ss][Ee].*/) OR (data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Ll][Oo][Gg].*/ AND data_win_eventdata_commandLine:/.*\/[Ee]:[Ff][Aa][Ll][Ss][Ee].*/) OR (data_win_eventdata_commandLine:/.*[Ll][Oo][Gg][Mm][Aa][Nn].*/ AND data_win_eventdata_commandLine:/.*[Uu][Pp][Dd][Aa][Tt][Ee].*/ AND data_win_eventdata_commandLine:/.*[Tt][Rr][Aa][Cc][Ee].*/ AND data_win_eventdata_commandLine:/.*--[Pp].*/ AND data_win_eventdata_commandLine:/.*-[Ee][Tt][Ss].*/) OR data_win_eventdata_commandLine:/.*[Rr][Ee][Mm][Oo][Vv][Ee]-[Ee][Tt][Ww][Tt][Rr][Aa][Cc][Ee][Pp][Rr][Oo][Vv][Ii][Dd][Ee][Rr].*/ OR (data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Ee][Tt][Ww][Tt][Rr][Aa][Cc][Ee][Pp][Rr][Oo][Vv][Ii][Dd][Ee][Rr].*/ AND data_win_eventdata_commandLine:/.*0[Xx]11.*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: cd1f961e-0b96-436b-b7c6-38da4583ec00
    name: Suspicious Windows Trace ETW Session Tamper Via Logman.EXE
    reason: 'Direct sibling: logman used to stop or delete ETW sessions.'
  - id: 41421f44-58f9-455d-838a-c398859841d4
    name: ETW Logging Tamper In .NET Processes Via CommandLine
    reason: Per-process ETW disablement used alongside system-level trace evasion.
  - id: 0a13e132-651d-11eb-ae93-0242ac130002
    name: Audit Policy Tampering Via Auditpol
    reason: Audit policy disabling is typical adjacent log-blinding before the main action.
  - id: 7dbbcac2-57a0-45ac-b306-ff30a8bd2981
    name: Windows AMSI Related Registry Tampering Via CommandLine
    reason: Parallel defense-impairing step in the same pre-attack phase.
  - id: windows-defender-asr-threat-tamper-001
    name: Windows Defender ASR or Threat Configuration Tamper
    reason: Defender is commonly weakened together with ETW so payloads go undetected.
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: Ransomware crews blind logging then delete shadow copies.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Log clearing and disabling
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ww]evtutil.*/ OR data_win_eventdata_commandLine:/.*[Cc]lear-[Ee]vent[Ll]og.*/ OR data_win_eventdata_commandLine:/.*[Rr]emove-[Ee]tw[Tt]race[Pp]rovider.*/)) OR data_win_system_eventID:(1102 OR 104)
    pivot_on: host
    window: 4h
  - name: Audit and Defender tampering
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Aa]uditpol.*(clear|remove|disable|set).*/ OR data_win_eventdata_commandLine:/.*([Ss]et|[Aa]dd)-[Mm]p[Pp]reference.*([Dd]isable|[Ee]xclusion).*/)
    pivot_on: host
    window: 4h
  - name: Registry-level ETW or logging tamper
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*(\\[Ww][Mm][Ii]\\[Aa]utologger|\\[Ee]vent[Ll]og\\|\\[Ee][Tt][Ww]).*/
    pivot_on: host
    window: 4h
  - name: Sabotage commands after evasion
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*[Dd]elete.*/ OR data_win_eventdata_commandLine:/.*[Bb][Cc][Dd][Ee][Dd][Ii][Tt].*[Rr]ecovery.*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc].*[Cc]onfig.*[Dd]isabled.*/)
    pivot_on: host
    window: 4h
