name: Windows Odbcconf Load DLL
id: Windows-Odbcconf-Load-DLL
version: 8
schema_version: 1
date: '2025-05-02'
author: SOCFortress LLC
status: production
type: TTP
description: >
  Detects odbcconf.exe executing with the /A or -A flag combined with the REGSVR
  action to load a DLL. Attackers abuse this LOLBAS technique to proxy DLL
  execution through a trusted Windows binary, bypassing application whitelisting
  and evading defenses. This is the targeted TTP companion to the broad odbcconf
  hunting detection. Associated with Living Off The Land tradecraft.
  MITRE ATT&CK: T1218.008 (System Binary Proxy Execution: Odbcconf).

data_source:
  - Sysmon EventID 1 (ProcessCreate)

search:
  query:
    bool:
      must:
        - term:
            agent_name: "AGENT_NAME"
        - term:
            agent_labels_customer: "CUSTOMER_CODE"
        - term:
            data_win_system_eventID: "1"
        - wildcard:
            data_win_eventdata_image: "*\\odbcconf.exe"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine: "*/a *"
              - wildcard:
                  data_win_eventdata_commandLine: "*-a *"
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine: "*regsvr*"
        - range:
            timestamp:
              gte: "START_TIME"
              lte: "END_TIME"

parameters:
  - name: AGENT_NAME
    default: "DESKTOP-AM0HLGE"
  - name: CUSTOMER_CODE
    default: "lab"
  - name: START_TIME
    default: "now-24h"
  - name: END_TIME
    default: "now"

how_to_implement: >
  Requires Sysmon EventID 1 (ProcessCreate) flowing to the Wazuh Indexer.
  Fields data_win_eventdata_image and data_win_eventdata_commandLine are
  confirmed working across all EventID 1 detections in this environment.
  Field-validated based on established EventID 1 detection patterns.

known_false_positives: >
  False positives may be present based on legitimate ODBC driver registration.
  Filter based on known approved software or paths as needed.

references:
  - https://strontic.github.io/xcyclopedia/library/odbcconf.exe-07FBA12552331355C103999806627314.html
  - https://twitter.com/redcanary/status/1541838407894171650
  - https://attack.mitre.org/techniques/T1218/008/

response:
  message: >
    odbcconf.exe loading DLL via REGSVR action detected on $agent_name$ by $data_win_eventdata_user$.
    Parent: $data_win_eventdata_parentImage$.
    Command: $data_win_eventdata_commandLine$.
    MITRE ATT&CK: T1218.008
  risk_score: 42
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 42
    - field: data_win_eventdata_user
      type: user
      score: 42
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: parent_process_name
    - field: data_win_eventdata_image
      type: process_name

tags:
  analytic_story:
    - Living Off The Land
  asset_type: Endpoint
  mitre_attack_id:
    - T1218.008
  custom_tags:
    - odbcconf
    - regsvr
    - dll_load
    - lolbas
    - proxy_execution
    - defense_evasion
  product:
    - Wazuh
  security_domain: endpoint

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: Windows-Odbcconf-Hunting
    name: Windows Odbcconf Hunting
    reason: Broad odbcconf execution bracketing the targeted REGSVR hit on the same host.
  - id: ba4cfc11-d0fa-4d94-bf20-7c332c412e76
    name: Potentially Suspicious DLL Registered Via Odbcconf.EXE
    reason: Same REGSVR DLL registration seen through a different pattern, confirming the load.
  - id: 9f0a8bf3-a65b-440a-8c1e-5cb1547c8e70
    name: New DLL Registered Via Odbcconf.EXE
    reason: Generic DLL registration via odbcconf; same primitive.
  - id: 6b65c28e-11f3-46cb-902a-68f2cafaf474
    name: Odbcconf.EXE Suspicious DLL Location
    reason: Shows the DLL sitting in an attacker-writable location.
  - id: cb0fe7c5-f3a3-484d-aa25-d350a7912729
    name: Suspicious Driver/DLL Installation Via Odbcconf.EXE
    reason: Driver/DLL install via odbcconf with suspicious arguments.
  - id: 8e3c7994-131e-4ba5-b6ea-804d49113a26
    name: Uncommon Child Process Spawned By Odbcconf.EXE
    reason: Post-load child processes show the DLL payload executing.
  - id: 070e9b80-6252-11eb-ae93-0242ac130002
    name: Detect Regsvr32 Application Control Bypass
    reason: Sibling signed-binary DLL proxy technique; operators alternate between them.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: DLL/response files created in user-writable paths (dropped payload)
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(\\[Uu][Ss][Ee][Rr][Ss]\\|\\[Tt][Ee][Mm][Pp]\\|\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\|\\[Pp][Uu][Bb][Ll][Ii][Cc]\\).*\.([Dd][Ll][Ll]|[Oo][Cc][Xx]|[Rr][Ss][Pp])/
    pivot_on: host
    window: 1h
  - name: Proxy execution through other signed binaries (regsvr32/rundll32/mshta)
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]|\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Cc][Ss]\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Aa][Ss][Mm]\.[Ee][Xx][Ee]|\\[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|\\[Mm][Ss][Bb][Uu][Ii][Ll][Dd]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 1h
  - name: Child processes spawned by odbcconf
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*(\\[Oo][Dd][Bb][Cc][Cc][Oo][Nn][Ff]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 1h
  - name: Outbound connections by odbcconf or DLL proxy binaries
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*(\\[Oo][Dd][Bb][Cc][Cc][Oo][Nn][Ff]\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]|\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 1h
  - name: DLLs loaded by odbcconf from user-writable paths
    query: data_win_system_eventID:"7" AND data_win_eventdata_image:/.*(\\[Oo][Dd][Bb][Cc][Cc][Oo][Nn][Ff]\.[Ee][Xx][Ee])/ AND data_win_eventdata_imageLoaded:/.*(\\[Uu][Ss][Ee][Rr][Ss]\\|\\[Tt][Ee][Mm][Pp]\\|\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\|\\[Pp][Uu][Bb][Ll][Ii][Cc]\\).*\.[Dd][Ll][Ll]/
    pivot_on: host
    window: 1h
