name: HackTool - GMER Rootkit Detector and Remover Execution
id: 9082ff1f-88ab-4678-a3cc-5bcff99fc74d
version: 1
schema_version: "1.0"
date: "2024-11-23"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 9082ff1f-88ab-4678-a3cc-5bcff99fc74d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution GMER tool based on image and hash fields.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\gmer.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*MD5=E9DC058440D321AA17D0600B3CA0AB04*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*SHA1=539C228B6B332F5AA523E5CE358C16647D8BBE57*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*SHA256=E8A3E804A96C716A3E9B69195DB6FFB0D33E2433AF871E4D4E1EAB3097237173*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_hashes
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\gmer.exe'; data_win_eventdata_hashes matches
  '*MD5=E9DC058440D321AA17D0600B3CA0AB04*'; data_win_eventdata_hashes matches
  '*SHA1=539C228B6B332F5AA523E5CE358C16647D8BBE57*', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - http://www.gmer.net/

response:
  message: >
    HackTool - GMER Rootkit Detector and Remover Execution detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_hashes: $data_win_eventdata_hashes$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_hashes
      type: file_hash

tags:
  asset_type: Endpoint
  custom_tags:
    - hacktool
    - rootkit
    - detector
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Gg][Mm][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_hashes:/.*[Mm][Dd]5=[Ee]9[Dd][Cc]058440[Dd]321[Aa][Aa]17[Dd]0600[Bb]3[Cc][Aa]0[Aa][Bb]04.*/ OR data_win_eventdata_hashes:/.*[Ss][Hh][Aa]1=539[Cc]228[Bb]6[Bb]332[Ff]5[Aa][Aa]523[Ee]5[Cc][Ee]358[Cc]16647[Dd]8[Bb][Bb][Ee]57.*/ OR data_win_eventdata_hashes:/.*[Ss][Hh][Aa]256=[Ee]8[Aa]3[Ee]804[Aa]96[Cc]716[Aa]3[Ee]9[Bb]69195[Dd][Bb]6[Ff][Ff][Bb]0[Dd]33[Ee]2433[Aa][Ff]871[Ee]4[Dd]4[Ee]1[Ee][Aa][Bb]3097237173.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: fca949cc-79ca-446e-8064-01aa7e52ece5
    name: HackTool - PCHunter Execution
    reason: Same class of kernel-level anti-rootkit utility used by attackers to enumerate and kill protected AV/EDR processes.
  - id: a34f79a3-8e5f-4cc3-b765-de00695452c2
    name: HackTool - PowerTool Execution
    reason: Kernel tool used to terminate security processes; often used alongside GMER/PCHunter in the same intrusion.
  - id: c598cc0c-9e70-4852-b9eb-8921af79f598
    name: Hacktool - EDR-Freeze Execution
    reason: Another EDR-neutralising tool; GMER can be one step in defense evasion before credential theft.
  - id: 39b64854-5497-4b57-a448-40977b8c9679
    name: Malicious Driver Load By Name
    reason: GMER loads a kernel driver at runtime; malicious-driver loading is the direct kernel-side effect.
  - id: 2c4523d5-d481-4ed0-8ec3-7fbf0cb41a75
    name: Driver Load From A Temporary Directory
    reason: GMER drops a randomly named driver in temp locations when run.
  - id: a7ee1722-c3c5-aeff-3212-c777e4733217
    name: Disable Windows Defender AV Security Monitoring
    reason: Defense-evasion follow-on once kernel tooling has removed protection.
  - id: eb2d07d4-49cb-4523-801a-da002df36602
    name: HackTool - EDRSilencer Execution
    reason: Co-occurring EDR blinding technique.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Kernel driver loads from temp or user paths
    query: data_win_system_eventID:"6" AND (data_win_eventdata_imageLoaded:/.*[Gg][Mm][Ee][Rr].*/ OR data_win_eventdata_imageLoaded:/.*\\[Tt][Ee][Mm][Pp]\\.*\.[Ss][Yy][Ss]/ OR data_win_eventdata_imageLoaded:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*\.[Ss][Yy][Ss]/)
    pivot_on: host
    window: 2h
  - name: Security product processes killed or stopped
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Tt]askkill.*/ OR data_win_eventdata_commandLine:/.*[Ss]top-[Pp]rocess.*/ OR data_win_eventdata_commandLine:/.*[Nn]et +stop.*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc] +(stop|delete|config).*/) AND (data_win_eventdata_commandLine:/.*[Ss]ense.*/ OR data_win_eventdata_commandLine:/.*[Dd]efender.*/ OR data_win_eventdata_commandLine:/.*[Ss]ophos.*/ OR data_win_eventdata_commandLine:/.*[Cc]rowd.*/ OR data_win_eventdata_commandLine:/.*[Ss]entinel.*/ OR data_win_eventdata_commandLine:/.*[Mm][Ss][Mm][Pp][Ee][Nn][Gg].*/)
    pivot_on: host
    window: 2h
  - name: Defender or security tooling disabled or excluded
    query: (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Ww]indows [Dd]efender.*/ AND (data_win_eventdata_targetObject:/.*[Ee]xclusions.*/ OR data_win_eventdata_targetObject:/.*[Dd]isable.*/ OR data_win_eventdata_targetObject:/.*[Tt]amper.*/)) OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Ss]et-[Mm]p[Pp]reference.*/ AND (data_win_eventdata_commandLine:/.*[Ee]xclusion.*/ OR data_win_eventdata_commandLine:/.*[Dd]isable.*/))
    pivot_on: host
    window: 6h
  - name: Kernel driver service creation
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Ss][Cc](\.[Ee][Xx][Ee])? +create.*/ AND data_win_eventdata_commandLine:/.*([Kk]ernel|\.[Ss][Yy][Ss]).*/
    pivot_on: host
    window: 2h
  - name: Credential dumping following evasion
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 4h
