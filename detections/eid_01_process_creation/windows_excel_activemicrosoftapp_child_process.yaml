name: Windows Excel ActiveMicrosoftApp Child Process
id: 4dfd6a58-93b2-4012-bb33-038bb63652b3
version: 1
schema_version: "1.0"
date: "2026-03-30"
author: SOCFortress LLC
status: production
type: Anomaly
description: >
  Detects execution of legacy Microsoft Office processes (WINPROJ.EXE, FOXPROW.exe,
  SCHDPLUS.exe) as child processes of Microsoft Excel (EXCEL.EXE). These are
  discontinued legacy applications that have no legitimate use in modern enterprise
  environments (Microsoft Project discontinued January 2010). Adversaries may abuse
  DCOM/Excel to spawn these processes for lateral movement, code execution, or to
  bypass application control mechanisms as documented in PathWiper attacks.

data_source:
  - Sysmon EventID 1 (ProcessCreate)

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - wildcard:
            data_win_eventdata_parentImage: "*\\EXCEL.EXE"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image: "*\\WINPROJ.EXE"
              - wildcard:
                  data_win_eventdata_image: "*\\FOXPROW.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\SCHDPLUS.exe"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_commandLine
    - data_win_eventdata_originalFileName
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-03-30 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-03-30 23:59:59.999"

how_to_implement: >
  Requires Wazuh agents with Sysmon installed and configured to log process
  creation events (EventID 1) with parent process information.

known_false_positives: >
  Microsoft Project has been discontinued since January 2010, so its presence
  is unlikely in modern environments. If a related child process is observed,
  verify its legitimacy to rule out potential misuse.

references:
  - https://attack.mitre.org/techniques/T1021/003/
  - https://specterops.io/blog/2023/10/30/lateral-movement-abuse-the-power-of-dcom-excel-application/
  - https://blog.talosintelligence.com/pathwiper-targets-ukraine/
  - https://www.trellix.com/blogs/research/dcom-abuse-and-network-erasure-with-trellix-ndr/

response:
  message: >
    Excel spawned legacy ActiveMicrosoftApp process on $agent_name$ by
    $data_win_eventdata_user$.
    Parent: $data_win_eventdata_parentImage$.
    Child: $data_win_eventdata_image$.
    MITRE ATT&CK: T1021.003
  risk_score: 10
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 10
    - field: data_win_eventdata_user
      type: user
      score: 10
  threat_objects:
    - field: data_win_eventdata_image
      type: process_name
    - field: data_win_eventdata_parentImage
      type: parent_process_name

tags:
  analytic_story:
    - PathWiper
    - DCOM Lateral Movement
  asset_type: Endpoint
  mitre_attack_id:
    - T1021.003
  custom_tags:
    - excel
    - dcom
    - lateral_movement
    - legacy_process
    - pathwiper
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\EXCEL\.EXE/ AND (data_win_eventdata_image:/.*\\WINPROJ\.EXE/ OR data_win_eventdata_image:/.*\\FOXPROW\.exe/ OR data_win_eventdata_image:/.*\\SCHDPLUS\.exe/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 551d9c1f-816c-445b-a7a6-7a3864720d60
    name: Potential Excel.EXE DCOM Lateral Movement Via ActivateMicrosoftApp
    reason: Same Excel.Application ActivateMicrosoftApp DCOM abuse; sibling detection confirming the mechanism.
  - id: 438025f9-5856-4663-83f7-52f878a70a50
    name: Suspicious Microsoft Office Child Process
    reason: The spawned legacy binary or Excel typically goes on to launch shells or LOLBins.
  - id: e1693bc8-7168-4eab-8718-cdcaa68a1738
    name: Suspicious WMIC Execution Via Office Process
    reason: Office parents launching wmic for execution/recon after the DCOM foothold.
  - id: 868955d9-697e-45d4-a3da-360cefd7c216
    name: Potential Exploitation Attempt From Office Application
    reason: Office process executing abnormal payload components.
  - id: aa3a6f94-890e-4e22-b634-ffdfd54792cc
    name: Suspicious Binary In User Directory Spawned From Office Application
    reason: Payload dropped to the user profile and launched by Office.
  - id: b1c50487-1967-4315-a026-6491686d860e
    name: Office Macro File Creation From Suspicious Process
    reason: Dropped macro workbook used to drive Excel remotely via DCOM.
  - id: f1f3bf22-deb2-418d-8cce-e1a45e46a5bd
    name: MMC20 Lateral Movement
    reason: Alternate DCOM lateral movement; operators try several DCOM objects on the same targets.
  - id: 692f0bec-83ba-4d04-af7e-e884a96059b6
    name: Potential WMI Lateral Movement WmiPrvSE Spawned PowerShell
    reason: Parallel remote execution path (WMI) if DCOM abuse fails or for follow-up.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Shells and LOLBins spawned by Excel on this host
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ee][Xx][Cc][Ee][Ll]\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Cc][Mm][Dd]\.[Ee][Xx][Ee]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]|[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]|[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 1h
  - name: Legacy Office binaries (WINPROJ/FOXPROW/SCHDPLUS) from any parent
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Ww][Ii][Nn][Pp][Rr][Oo][Jj]\.[Ee][Xx][Ee]|[Ff][Oo][Xx][Pp][Rr][Oo][Ww]\.[Ee][Xx][Ee]|[Ss][Cc][Hh][Dd][Pp][Ll][Uu][Ss]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 2h
  - name: Excel dropped files and macro workbooks
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*\\[Ee][Xx][Cc][Ee][Ll]\.[Ee][Xx][Ee]/ AND data_win_eventdata_targetFilename:/.*\.([Xx][Ll][Ss][Mm]|[Xx][Ll][Ss][Bb]|[Xx][Ll][Ll]|[Dd][Ll][Ll]|[Ee][Xx][Ee]|[Pp][Ss]1|[Bb][Aa][Tt]|[Vv][Bb][Ss]|[Jj][Ss])/
    pivot_on: host
    window: 2h
  - name: Network connections made by Excel or the legacy binaries
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*\\([Ee][Xx][Cc][Ee][Ll]\.[Ee][Xx][Ee]|[Ww][Ii][Nn][Pp][Rr][Oo][Jj]\.[Ee][Xx][Ee]|[Ff][Oo][Xx][Pp][Rr][Oo][Ww]\.[Ee][Xx][Ee]|[Ss][Cc][Hh][Dd][Pp][Ll][Uu][Ss]\.[Ee][Xx][Ee])/)
    pivot_on: host
    window: 1h
  - name: Network logons preceding the event (DCOM source)
    query: data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3"
    pivot_on: host
    window: 1h
