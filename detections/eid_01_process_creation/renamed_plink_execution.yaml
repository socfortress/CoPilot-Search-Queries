name: Renamed Plink Execution
id: 1c12727d-02bf-45ff-a9f3-d49806a3cf43
version: 1
schema_version: "1.0"
date: "2023-02-03"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 1c12727d-02bf-45ff-a9f3-d49806a3cf43
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of a renamed version of the Plink binary. MITRE ATT&CK:
  T1036.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - term:
                  data_win_eventdata_originalFileName:
                    value: "Plink"
                    case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* -l forward*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* -P *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* -R *"
                          case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\plink.exe"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_originalFileName equals
  'Plink'; data_win_eventdata_commandLine matches '* -l forward*';
  data_win_eventdata_commandLine matches '* -P *', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://thedfirreport.com/2022/06/06/will-the-real-msiexec-please-stand-up-exploit-leads-to-data-exfiltration/
  - https://the.earth.li/~sgtatham/putty/0.58/htmldoc/Chapter7.html
  - https://attack.mitre.org/techniques/T1036/

response:
  message: >
    Renamed Plink Execution detected on host $agent_name$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
    MITRE ATT&CK: T1036
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_originalFileName
      type: file_name
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1036
  custom_tags:
    - renamed
    - plink
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_originalFileName:/[Pp][Ll][Ii][Nn][Kk]/ OR (data_win_eventdata_commandLine:/.* -[Ll] [Ff][Oo][Rr][Ww][Aa][Rr][Dd].*/ AND data_win_eventdata_commandLine:/.* -[Pp] .*/ AND data_win_eventdata_commandLine:/.* -[Rr] .*/)) AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/.*\\[Pp][Ll][Ii][Nn][Kk]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: f38ce0b9-5e97-4b47-a211-7dc8d8b871da
    name: Potential RDP Tunneling Via Plink
    reason: Plink commonly forwards RDP; confirms tunnel purpose
  - id: 327f48c1-a6db-4eb8-875a-f6981f1b0183
    name: Port Forwarding Activity Via SSH.EXE
    reason: Native ssh.exe port forwarding is the alternative tunnelling channel on the same host
  - id: f7d7ebd5-a016-46e2-9c54-f9932f2d386d
    name: Potential RDP Tunneling Via SSH
    reason: RDP tunnelling via SSH shows same lateral-movement intent
  - id: 2daa93a0-a5fb-41c5-8cd8-3c11294bfd1f
    name: Potential SSH Tunnel Persistence Install Using A Scheduled Task
    reason: Scheduled-task persistence for SSH tunnels follows a successful Plink test
  - id: 8a3038e8-9c9d-46f8-b184-66234a160f6f
    name: Potential Remote Desktop Tunneling
    reason: Generic remote desktop tunnelling flags the forwarded RDP traffic
  - id: 322ed9ec-fcab-4f67-9a34-e7c6aef43614
    name: New Port Forwarding Rule Added Via Netsh.EXE
    reason: netsh portproxy is a local forwarding companion to a reverse tunnel
  - id: 782d6f3e-4c5d-4b8c-92a3-1d05fed72e63
    name: RDP Port Forwarding Rule Added Via Netsh.EXE
    reason: RDP port forwarding via netsh pairs with an SSH tunnel to expose RDP
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Tunnel flags in command lines
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.* -[Rr] [0-9]+:.*/ OR /.* -[Ll] [0-9]+:.*/ OR /.* -[Dd] [0-9]+.*/ OR /.* -[Pp][Ww] .*/)
    pivot_on: host
    window: 6h
  - name: Outbound SSH-port connections
    query: data_win_system_eventID:3 AND data_win_eventdata_destinationPort:(22 OR 2222) AND data_win_eventdata_initiated:true
    pivot_on: host
    window: 6h
  - name: Netsh portproxy and firewall opens
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Pp]ort[Pp]roxy.*/ OR /.*[Aa]dvfirewall.*[Aa]dd.*[Rr]ule.*/)
    pivot_on: host
    window: 6h
  - name: RDP enablement changes
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ff][Dd][Dd][Ee][Nn][Yy][Tt][Ss][Cc][Oo][Nn][Nn][Ee][Cc][Tt][Ii][Oo][Nn][Ss].*/ OR /.*[Tt]erminal [Ss]erver.*/)
    pivot_on: host
    window: 6h
