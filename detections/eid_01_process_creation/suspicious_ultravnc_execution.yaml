name: Suspicious UltraVNC Execution
id: 871b9555-69ca-4993-99d3-35a59f9f3599
version: 1
schema_version: "1.0"
date: "2022-03-09"
author: Bhabesh Raj
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 871b9555-69ca-4993-99d3-35a59f9f3599
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious UltraVNC command line flag combination that indicate a auto
  reconnect upon execution, e.g. startup (as seen being used by Gamaredon threat
  group). MITRE ATT&CK: T1021.005.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*-autoreconnect *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*-connect *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*-id:*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*-autoreconnect *'; data_win_eventdata_commandLine matches '*-connect *';
  data_win_eventdata_commandLine matches '*-id:*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://web.archive.org/web/20220224045756/https://www.ria.ee/sites/default/files/content-editors/kuberturve/tale_of_gamaredon_infection.pdf
  - https://symantec-enterprise-blogs.security.com/blogs/threat-intelligence/shuckworm-gamaredon-espionage-ukraine
  - https://unit42.paloaltonetworks.com/unit-42-title-gamaredon-group-toolset-evolution
  - https://uvnc.com/docs/uvnc-viewer/52-ultravnc-viewer-commandline-parameters.html
  - https://attack.mitre.org/techniques/T1021/005/

response:
  message: >
    Suspicious UltraVNC Execution detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1021.005
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1021.005
  custom_tags:
    - ultravnc
    - process_creation
    - sysmon
    - lateral_movement
    - g0047
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*-[Aa][Uu][Tt][Oo][Rr][Ee][Cc][Oo][Nn][Nn][Ee][Cc][Tt] .*/ AND data_win_eventdata_commandLine:/.*-[Cc][Oo][Nn][Nn][Ee][Cc][Tt] .*/ AND data_win_eventdata_commandLine:/.*-[Ii][Dd]:.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 145322e4-0fd3-486b-81ca-9addc75736d8
    name: Use of UltraVNC Remote Access Software
    reason: Generic UltraVNC use on the same host; confirms the tool and its location.
  - id: 8a3038e8-9c9d-46f8-b184-66234a160f6f
    name: Potential Remote Desktop Tunneling
    reason: Reverse VNC connections are often paired with tunnels to the operator.
  - id: b52e84a3-029e-4529-b09b-71d19dd27e94
    name: Remote Access Tool - AnyDesk Execution
    reason: Operators commonly stage multiple remote access tools for redundancy.
  - id: 758ff488-18d5-4cbe-8ec4-02b6285a434f
    name: Remote Access Tool - NetSupport Execution
    reason: Another RAT frequently dropped alongside VNC in the same intrusion.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: UltraVNC binaries and configs
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:(/.*\\[Ww][Ii][Nn][Vv][Nn][Cc].*\.exe/ OR /.*\\[Uu][Ll][Tt][Rr][Aa][Vv][Nn][Cc].*/ OR /.*\\[Vv][Nn][Cc][Vv][Ii][Ee][Ww][Ee][Rr]\.exe/) OR data_win_eventdata_commandLine:/.*[Uu][Ll][Tt][Rr][Aa][Vv][Nn][Cc].*/)
    pivot_on: host
    window: 6h
  - name: Persistence for the VNC client
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*schtasks.*/ OR /.*CurrentVersion\\Run.*/ OR /.*[Ss]tartup.*/) AND data_win_eventdata_commandLine:/.*[Vv][Nn][Cc].*/
    pivot_on: host
    window: 6h
  - name: Firewall changes for VNC
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*netsh.*advfirewall.*/ OR /.*netsh.*portopening.*/) AND data_win_eventdata_commandLine:(/.*5900.*/ OR /.*5500.*/ OR /.*[Vv][Nn][Cc].*/)
    pivot_on: host
    window: 6h
  - name: Other remote access tools launched
    query: data_win_system_eventID:1 AND data_win_eventdata_image:(/.*\\[Aa]ny[Dd]esk.*/ OR /.*\\[Tt]eam[Vv]iewer.*/ OR /.*\\[Ss]creen[Cc]onnect.*/ OR /.*\\[Nn]et[Ss]upport.*/ OR /.*\\[Rr]ustdesk.*/)
    pivot_on: host
    window: 6h
