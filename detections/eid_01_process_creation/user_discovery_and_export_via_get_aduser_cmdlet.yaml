name: User Discovery And Export Via Get-ADUser Cmdlet
id: 1114e048-b69c-4f41-bc20-657245ae6e3f
version: 1
schema_version: "1.0"
date: "2022-11-17"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 1114e048-b69c-4f41-bc20-657245ae6e3f
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects usage of the Get-ADUser cmdlet to collect user information and output
  it to a file. MITRE ATT&CK: T1033.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\powershell.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\pwsh.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "PowerShell.EXE"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "pwsh.dll"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*Get-ADUser *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* -Filter \\**"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine: "* > *"
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* | Select *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Out-File*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Set-Content*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Add-Content*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\powershell.exe'; data_win_eventdata_image matches '*\pwsh.exe';
  data_win_eventdata_originalFileName equals 'PowerShell.EXE', among other
  conditions.

known_false_positives: >
  Legitimate admin scripts may use the same technique, it's better to exclude
  specific computers or users who execute these commands or scripts often.
  Baseline expected activity in your environment and tune this detection before
  relying on it for automated response.

references:
  - http://blog.talosintelligence.com/2022/09/lazarus-three-rats.html
  - https://www.microsoft.com/en-us/security/blog/2022/10/18/defenders-beware-a-case-for-post-ransomware-investigations/
  - https://attack.mitre.org/techniques/T1033/

response:
  message: >
    User Discovery And Export Via Get-ADUser Cmdlet detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1033
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1033
  custom_tags:
    - export
    - aduser
    - cmdlet
    - process_creation
    - sysmon
    - discovery
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Pp][Ww][Ss][Hh]\.[Dd][Ll][Ll]/) AND data_win_eventdata_commandLine:/.*[Gg][Ee][Tt]-[Aa][Dd][Uu][Ss][Ee][Rr] .*/ AND data_win_eventdata_commandLine:/.* -[Ff][Ii][Ll][Tt][Ee][Rr] \*.*/ AND (data_win_eventdata_commandLine:/.* \> .*/ OR data_win_eventdata_commandLine:/.* \| [Ss][Ee][Ll][Ee][Cc][Tt] .*/ OR data_win_eventdata_commandLine:/.*[Oo][Uu][Tt]-[Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Cc][Oo][Nn][Tt][Ee][Nn][Tt].*/ OR data_win_eventdata_commandLine:/.*[Aa][Dd][Dd]-[Cc][Oo][Nn][Tt][Ee][Nn][Tt].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 0b6ee3f4-04e3-11ec-a87d-acde48001122
    name: Get ADUser with PowerShell
    reason: Companion Get-ADUser detection; confirms the scope of user enumeration.
  - id: 70bc5215-526f-4477-963c-a47a5c9ebd12
    name: Potential Active Directory Enumeration Using AD Module - ProcCreation
    reason: AD module use is the setup step for Get-ADUser on a non-DC host.
  - id: 93c94be3-bead-4a60-860f-77ca3fe59903
    name: GetDomainGroup with PowerShell
    reason: Domain group enumeration accompanies user dumps to map privileged membership.
  - id: 514e7e3e-b3b4-4a67-af60-be20f139198b
    name: PUA - AdFind.EXE Execution
    reason: AdFind is the alternative bulk AD enumeration tool used in the same recon phase.
  - id: f376c8a7-a2d0-4ddc-aa0c-16c17236d962
    name: HackTool - Bloodhound/Sharphound Execution
    reason: BloodHound/SharpHound collection is the larger-scale follow-on to user listing.
  - id: 1eeed653-dbc8-4187-ad0c-eeebb20e6599
    name: Potential SPN Enumeration Via Setspn.EXE
    reason: SPN enumeration follows to find Kerberoastable accounts from the harvested user list.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other AD enumeration tooling
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Gg][Ee][Tt]-[Aa][Dd](User|Computer|Group|GroupMember|Domain|DefaultDomainPasswordPolicy).*/ OR data_win_eventdata_commandLine:/.*[Aa][Dd][Ff][Ii][Nn][Dd].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ss][Qq][Uu][Ee][Rr][Yy].*/ OR data_win_eventdata_commandLine:/.*[Ss][Hh][Aa][Rr][Pp][Hh][Oo][Uu][Nn][Dd].*/)
    pivot_on: host
    window: 4h
  - name: Staging and archiving of harvested output
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]-[Aa][Rr][Cc][Hh][Ii][Vv][Ee].*/ OR data_win_eventdata_commandLine:/.*[Rr][Aa][Rr] +a .*/ OR data_win_eventdata_commandLine:/.*7[Zz]a? +a .*/ OR data_win_eventdata_commandLine:/.*[Mm][Aa][Kk][Ee][Cc][Aa][Bb].*/)
    pivot_on: host
    window: 4h
  - name: Outbound transfer of results
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Uu][Rr][Ll].*(-T|--upload-file|http).*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*-[Mm][Ee][Tt][Hh][Oo][Dd] +[Pp][Oo][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn].*/[Uu][Pp][Ll][Oo][Aa][Dd].*/)
    pivot_on: host
    window: 6h
  - name: Credential access following user discovery
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Rr][Uu][Bb][Ee][Uu][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Kk][Ee][Rr][Bb][Ee][Rr][Oo][Aa][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Ss][Ss].*[Dd][Uu][Mm][Pp].*/)
    pivot_on: host
    window: 6h
