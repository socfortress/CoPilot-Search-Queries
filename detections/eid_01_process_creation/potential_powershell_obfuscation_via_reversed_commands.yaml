name: Potential PowerShell Obfuscation Via Reversed Commands
id: b6b49cd1-34d6-4ead-b1bf-176e9edba9a4
version: 1
schema_version: "1.0"
date: "2023-05-31"
author: Teymur Kheirkhabarov (idea), Vasiliy Burov (rule), oscd.community, Tim Shelton
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: b6b49cd1-34d6-4ead-b1bf-176e9edba9a4
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the presence of reversed PowerShell commands in the CommandLine. This
  is often used as a method of obfuscation by attackers. MITRE ATT&CK: T1027,
  T1059.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\powershell.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\pwsh.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "PowerShell.EXE"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "pwsh.dll"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*hctac*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*kaerb*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*dnammoc*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*ekovn*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*eliFd*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*rahc*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*etirw*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*golon*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*tninon*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*eddih*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*tpircS*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*ssecorp*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*llehsrewop*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*esnopser*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*daolnwod*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*tneilCbeW*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*tneilc*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*ptth*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*elifotevas*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*46esab*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*htaPpmeTteG*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*tcejbO*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*maerts*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*hcaerof*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*retupmoc*"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_commandLine"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* -EncodedCommand *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* -enc *"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\powershell.exe'; data_win_eventdata_image matches '*\pwsh.exe';
  data_win_eventdata_originalFileName equals 'PowerShell.EXE', among other
  conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://2019.offzone.moscow/ru/report/hunting-for-powershell-abuses/
  - https://speakerdeck.com/heirhabarov/hunting-for-powershell-abuse?slide=66
  - https://attack.mitre.org/techniques/T1027/
  - https://attack.mitre.org/techniques/T1059/001/

response:
  message: >
    Potential PowerShell Obfuscation Via Reversed Commands detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1027, T1059.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1027
    - T1059.001
  custom_tags:
    - powershell
    - obfuscation
    - reversed
    - process_creation
    - sysmon
    - stealth
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Pp][Ww][Ss][Hh]\.[Dd][Ll][Ll]/) AND (data_win_eventdata_commandLine:/.*[Hh][Cc][Tt][Aa][Cc].*/ OR data_win_eventdata_commandLine:/.*[Kk][Aa][Ee][Rr][Bb].*/ OR data_win_eventdata_commandLine:/.*[Dd][Nn][Aa][Mm][Mm][Oo][Cc].*/ OR data_win_eventdata_commandLine:/.*[Ee][Kk][Oo][Vv][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ee][Ll][Ii][Ff][Dd].*/ OR data_win_eventdata_commandLine:/.*[Rr][Aa][Hh][Cc].*/ OR data_win_eventdata_commandLine:/.*[Ee][Tt][Ii][Rr][Ww].*/ OR data_win_eventdata_commandLine:/.*[Gg][Oo][Ll][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*[Tt][Nn][Ii][Nn][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ee][Dd][Dd][Ii][Hh].*/ OR data_win_eventdata_commandLine:/.*[Tt][Pp][Ii][Rr][Cc][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ss][Ee][Cc][Oo][Rr][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ll][Ll][Ee][Hh][Ss][Rr][Ee][Ww][Oo][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ee][Ss][Nn][Oo][Pp][Ss][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Dd][Aa][Oo][Ll][Nn][Ww][Oo][Dd].*/ OR data_win_eventdata_commandLine:/.*[Tt][Nn][Ee][Ii][Ll][Cc][Bb][Ee][Ww].*/ OR data_win_eventdata_commandLine:/.*[Tt][Nn][Ee][Ii][Ll][Cc].*/ OR data_win_eventdata_commandLine:/.*[Pp][Tt][Tt][Hh].*/ OR data_win_eventdata_commandLine:/.*[Ee][Ll][Ii][Ff][Oo][Tt][Ee][Vv][Aa][Ss].*/ OR data_win_eventdata_commandLine:/.*46[Ee][Ss][Aa][Bb].*/ OR data_win_eventdata_commandLine:/.*[Hh][Tt][Aa][Pp][Pp][Mm][Ee][Tt][Tt][Ee][Gg].*/ OR data_win_eventdata_commandLine:/.*[Tt][Cc][Ee][Jj][Bb][Oo].*/ OR data_win_eventdata_commandLine:/.*[Mm][Aa][Ee][Rr][Tt][Ss].*/ OR data_win_eventdata_commandLine:/.*[Hh][Cc][Aa][Ee][Rr][Oo][Ff].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Tt][Uu][Pp][Mm][Oo][Cc].*/) AND _exists_:data_win_eventdata_commandLine AND NOT (data_win_eventdata_commandLine:/.* -[Ee][Nn][Cc][Oo][Dd][Ee][Dd][Cc][Oo][Mm][Mm][Aa][Nn][Dd] .*/ OR data_win_eventdata_commandLine:/.* -[Ee][Nn][Cc] .*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 8d01b53f-456f-48ee-90f6-bc28e67d4e35
    name: Suspicious Obfuscated PowerShell Code
    reason: Another obfuscation family on the same command line; stacked techniques mean deliberate evasion.
  - id: d7bcd677-645d-4691-a8d4-7a5602b780d1
    name: Potential PowerShell Command Line Obfuscation
    reason: Tick/caret/concatenation obfuscation often accompanies reversal.
  - id: e312efd0-35a1-407f-8439-b8d434b438a6
    name: Potential PowerShell Obfuscation Via WCHAR/CHAR
    reason: Char-code reconstruction is a sibling string-building technique in the same loaders.
  - id: e6c54d94-498c-4562-a37c-b469d8e9a275
    name: Suspicious PowerShell Download and Execute Pattern
    reason: Reversed strings usually hide cradle keywords such as DownloadString and WebClient.
  - id: bb780e0c-16cf-4383-8383-1e5471db6cf9
    name: Suspicious XOR Encoded PowerShell Command
    reason: Alternate decode routine for hiding payloads, seen in the same campaigns.
  - id: 754ed792-634f-40ae-b3bc-e0448d33f695
    name: Suspicious PowerShell Parent Process
    reason: Identifies the delivery vector behind the obfuscated launch.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: PowerShell string reversal and rebuild idioms
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*\[[Aa]rray\]::[Rr]everse.*/ OR /.*-[Jj]oin.*/ OR /.*[Rr]everse.*/)
    pivot_on: host
    window: 2h
  - name: Script blocks with execution primitives or char builds
    query: data_win_system_eventID:4104 AND data_win_eventdata_scriptBlockText:(/.*[Ii]nvoke-[Ee]xpression.*/ OR /.*[Rr]everse.*/ OR /.*\[char\].*/)
    pivot_on: host
    window: 2h
  - name: Outbound connections from PowerShell
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND data_win_eventdata_initiated:true
    pivot_on: host
    window: 2h
  - name: Executables and scripts dropped by PowerShell
    query: data_win_system_eventID:11 AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND data_win_eventdata_targetFilename:(/.*\.exe/ OR /.*\.dll/ OR /.*\.ps1/ OR /.*\.bat/)
    pivot_on: host
    window: 4h
