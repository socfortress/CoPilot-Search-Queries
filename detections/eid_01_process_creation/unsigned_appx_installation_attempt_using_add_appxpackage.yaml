name: Unsigned AppX Installation Attempt Using Add-AppxPackage
id: 37651c2a-42cd-4a69-ae0d-22a4349aa04a
version: 1
schema_version: "1.0"
date: "2023-01-31"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 37651c2a-42cd-4a69-ae0d-22a4349aa04a
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects usage of the "Add-AppxPackage" or it's alias "Add-AppPackage" to
  install unsigned AppX packages.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\powershell.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\pwsh.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "PowerShell.EXE"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "pwsh.dll"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Add-AppPackage *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Add-AppxPackage *"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* -AllowUnsigned*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\powershell.exe'; data_win_eventdata_image matches '*\pwsh.exe';
  data_win_eventdata_originalFileName equals 'PowerShell.EXE', among other
  conditions.

known_false_positives: >
  Installation of unsigned packages for testing purposes. Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://learn.microsoft.com/en-us/windows/msix/package/unsigned-package
  - https://twitter.com/WindowsDocs/status/1620078135080325122

response:
  message: >
    Unsigned AppX Installation Attempt Using Add-AppxPackage detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  custom_tags:
    - unsigned
    - installation
    - appxpackage
    - process_creation
    - sysmon
    - persistence
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Pp][Ww][Ss][Hh]\.[Dd][Ll][Ll]/) AND (data_win_eventdata_commandLine:/.*[Aa][Dd][Dd]-[Aa][Pp][Pp][Pp][Aa][Cc][Kk][Aa][Gg][Ee] .*/ OR data_win_eventdata_commandLine:/.*[Aa][Dd][Dd]-[Aa][Pp][Pp][Xx][Pp][Aa][Cc][Kk][Aa][Gg][Ee] .*/) AND data_win_eventdata_commandLine:/.* -[Aa][Ll][Ll][Oo][Ww][Uu][Nn][Ss][Ii][Gg][Nn][Ee][Dd].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e32d4572-9826-4738-b651-95fa63747e8a
    name: Base64 Encoded PowerShell Command Detected
    reason: Malicious AppX installs are often launched from encoded PowerShell stagers.
  - id: 9be56c82-b1cc-4318-87eb-d138afaaca39
    name: Malicious PowerShell Process - Execution Policy Bypass
    reason: Execution policy bypass often appears in the same PowerShell session that sideloads the unsigned package.
  - id: c4db14d9-7909-48b4-a054-aa14d89dbb19
    name: Malicious PowerShell Process - Encoded Command
    reason: Encoded commands are how phishing loaders typically deliver the Add-AppxPackage line.
  - id: 313d6012-51a0-4d93-8dfc-de8553239e25
    name: Install New Package Via Winget Local Manifest
    reason: Sibling abuse of package installers to land untrusted software through a trusted installer.
  - id: 1321dc4e-a1fe-481d-a016-52c45f0c8b4f
    name: Windows Defender Exclusions Added
    reason: Defender exclusions are often added to protect the sideloaded app from scanning.
  - id: de587dce-915e-4218-aac4-835ca6af6f70
    name: Potential Persistence Attempt Via Run Keys Using Reg.EXE
    reason: Follow-on persistence after the unsigned package installs and runs.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Download of the package or its payload
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ss][Tt][Aa][Rr][Tt]-[Bb][Ii][Tt][Ss][Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt]\.[Ww][Ee][Bb][Cc][Ll][Ii][Ee][Nn][Tt].*/ OR data_win_eventdata_commandLine:/.*[Cc][Uu][Rr][Ll].*/ OR data_win_eventdata_commandLine:/.*[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll] -[Uu][Rr][Ll][Cc][Aa][Cc][Hh][Ee].*/)
    pivot_on: host
    window: 2h
  - name: Appx and msix files created
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.([Aa][Pp][Pp][Xx]|[Mm][Ss][Ii][Xx]|[Aa][Pp][Pp][Xx][Bb][Uu][Nn][Dd][Ll][Ee]|[Mm][Ss][Ii][Xx][Bb][Uu][Nn][Dd][Ll][Ee])/
    pivot_on: host
    window: 2h
  - name: Developer mode and sideloading policy enabled
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:/.*[Aa][Pp][Pp][Mm][Oo][Dd][Ee][Ll][Uu][Nn][Ll][Oo][Cc][Kk].*/ OR data_win_eventdata_targetObject:/.*[Aa][Ll][Ll][Oo][Ww][Dd][Ee][Vv][Ee][Ll][Oo][Pp][Mm][Ee][Nn][Tt][Ww][Ii][Tt][Hh][Oo][Uu][Tt][Dd][Ee][Vv][Ll][Ii][Cc][Ee][Nn][Ss][Ee].*/ OR data_win_eventdata_targetObject:/.*[Aa][Ll][Ll][Oo][Ww][Aa][Ll][Ll][Tt][Rr][Uu][Ss][Tt][Ee][Dd][Aa][Pp][Pp][Ss].*/)
    pivot_on: host
    window: 4h
  - name: PowerShell with encoded, hidden or bypass options
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.* -[Ee][Nn][Cc].*/ OR data_win_eventdata_commandLine:/.*-[Ee][Nn][Cc][Oo][Dd][Ee][Dd][Cc][Oo][Mm][Mm][Aa][Nn][Dd].*/ OR data_win_eventdata_commandLine:/.*[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Tt][Yy][Ll][Ee] [Hh][Ii][Dd][Dd][Ee][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ee][Xx][Ee][Cc][Uu][Tt][Ii][Oo][Nn][Pp][Oo][Ll][Ii][Cc][Yy] [Bb][Yy][Pp][Aa][Ss][Ss].*/)
    pivot_on: host
    window: 2h
  - name: Network connections from PowerShell
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 2h
