name: Suspicious Child Process of SAP NetWeaver
id: 5b304bcb-ac33-49d0-87af-fa1b3ca94333
version: 1
schema_version: "1.0"
date: "2025-04-28"
author: Elastic (idea), Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 5b304bcb-ac33-49d0-87af-fa1b3ca94333
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious child processes spawned by SAP NetWeaver that could
  indicate potential exploitation of vulnerability that allows arbitrary
  execution via webshells such as CVE-2025-31324. MITRE ATT&CK: T1190,
  T1059.003.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\j2ee\\\\cluster\\\\apps\\\\sap.com\\\\irj\\\\servlet_jsp\\\\irj\\\\work*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\j2ee\\\\cluster\\\\apps\\\\sap.com\\\\irj\\\\servlet_jsp\\\\irj\\\\root*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_currentDirectory:
                    value: "*\\\\j2ee\\\\cluster\\\\apps\\\\sap.com\\\\irj\\\\servlet_jsp\\\\irj\\\\work*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_currentDirectory:
                    value: "*\\\\j2ee\\\\cluster\\\\apps\\\\sap.com\\\\irj\\\\servlet_jsp\\\\irj\\\\root*"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\cmd.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\powershell.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\powershell_ise.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\pwsh.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\wscript.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\cscript.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\regsvr32.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\rundll32.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\mshta.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\certutil.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\bitsadmin.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\python.exe"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_currentDirectory
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\j2ee\cluster\apps\sap.com\irj\servlet_jsp\irj\work*';
  data_win_eventdata_parentImage matches
  '*\j2ee\cluster\apps\sap.com\irj\servlet_jsp\irj\root*';
  data_win_eventdata_currentDirectory matches
  '*\j2ee\cluster\apps\sap.com\irj\servlet_jsp\irj\work*', among other
  conditions.

known_false_positives: >
  Legitimate administrative activities such as software updates. Baseline
  expected activity in your environment and tune this detection before relying
  on it for automated response.

references:
  - https://reliaquest.com/blog/threat-spotlight-reliaquest-uncovers-vulnerability-behind-sap-netweaver-compromise/
  - https://onapsis.com/blog/active-exploitation-of-sap-vulnerability-cve-2025-31324/
  - https://attack.mitre.org/techniques/T1190/
  - https://attack.mitre.org/techniques/T1059/003/

response:
  message: >
    Suspicious Child Process of SAP NetWeaver detected on host $agent_name$.
    Matched data_win_eventdata_parentImage: $data_win_eventdata_parentImage$.
    Matched data_win_eventdata_currentDirectory:
    $data_win_eventdata_currentDirectory$. MITRE ATT&CK: T1190, T1059.003
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_currentDirectory
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1190
    - T1059.003
  custom_tags:
    - child
    - netweaver
    - process_creation
    - sysmon
    - execution
    - initial_access
    - persistence
    - cve_2025_31324
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Jj]2[Ee][Ee]\\[Cc][Ll][Uu][Ss][Tt][Ee][Rr]\\[Aa][Pp][Pp][Ss]\\[Ss][Aa][Pp]\.[Cc][Oo][Mm]\\[Ii][Rr][Jj]\\[Ss][Ee][Rr][Vv][Ll][Ee][Tt]_[Jj][Ss][Pp]\\[Ii][Rr][Jj]\\[Ww][Oo][Rr][Kk].*/ OR data_win_eventdata_parentImage:/.*\\[Jj]2[Ee][Ee]\\[Cc][Ll][Uu][Ss][Tt][Ee][Rr]\\[Aa][Pp][Pp][Ss]\\[Ss][Aa][Pp]\.[Cc][Oo][Mm]\\[Ii][Rr][Jj]\\[Ss][Ee][Rr][Vv][Ll][Ee][Tt]_[Jj][Ss][Pp]\\[Ii][Rr][Jj]\\[Rr][Oo][Oo][Tt].*/ OR data_win_eventdata_currentDirectory:/.*\\[Jj]2[Ee][Ee]\\[Cc][Ll][Uu][Ss][Tt][Ee][Rr]\\[Aa][Pp][Pp][Ss]\\[Ss][Aa][Pp]\.[Cc][Oo][Mm]\\[Ii][Rr][Jj]\\[Ss][Ee][Rr][Vv][Ll][Ee][Tt]_[Jj][Ss][Pp]\\[Ii][Rr][Jj]\\[Ww][Oo][Rr][Kk].*/ OR data_win_eventdata_currentDirectory:/.*\\[Jj]2[Ee][Ee]\\[Cc][Ll][Uu][Ss][Tt][Ee][Rr]\\[Aa][Pp][Pp][Ss]\\[Ss][Aa][Pp]\.[Cc][Oo][Mm]\\[Ii][Rr][Jj]\\[Ss][Ee][Rr][Vv][Ll][Ee][Tt]_[Jj][Ss][Pp]\\[Ii][Rr][Jj]\\[Rr][Oo][Oo][Tt].*/) AND (data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]_[Ii][Ss][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Yy][Tt][Hh][Oo][Nn]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: fa3c117a-bc0d-416e-a31b-0c0e80653efb
    name: Chopper Webshell Process Pattern
    reason: Chopper-style webshell command chains (cmd /c, whoami) are exactly what the SAP irj webshell produces next
  - id: e6313acd-208c-44fc-a0ff-db85d572e90e
    name: Network Reconnaissance Activity
    reason: Host/network reconnaissance is typically the first thing run from the webshell child
  - id: 97a80ec7-0e2f-4d05-9ef4-65760e634f6b
    name: Security Privileges Enumeration Via Whoami.EXE
    reason: whoami /priv checks the SAP service account's rights right after RCE
  - id: cd219ff3-fa99-45d4-8380-a7d15116c6dc
    name: New User Created Via Net.EXE
    reason: Local account creation for persistence after webshell access
  - id: de587dce-915e-4218-aac4-835ca6af6f70
    name: Potential Persistence Attempt Via Run Keys Using Reg.EXE
    reason: Run-key persistence set from the compromised SAP service context
  - id: 17769c90-230e-488b-a463-e05c08e9d48f
    name: Powershell Defender Exclusion
    reason: Defender exclusion added by the attacker to protect the webshell and payloads
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: comsvcs MiniDump of LSASS is a common credential-theft step from the SAP foothold
  - id: 6309645e-122d-4c5b-bb2b-22e4f9c2fa42
    name: HackTool - Potential CobaltStrike Process Injection
    reason: Beacon injection often follows initial webshell command execution
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: JSP/WAR webshell files written under SAP irj directory
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Ss][Ee][Rr][Vv][Ll][Ee][Tt]_[Jj][Ss][Pp].*/ AND (data_win_eventdata_targetFilename:/.*\.[Jj][Ss][Pp].*/ OR data_win_eventdata_targetFilename:/.*\.[Jj][Ss][Pp][Xx].*/ OR data_win_eventdata_targetFilename:/.*\.[Ww][Aa][Rr].*/ OR data_win_eventdata_targetFilename:/.*\.[Cc][Ll][Aa][Ss][Ss].*/)
    pivot_on: host
    window: 24h
  - name: Recon commands from the exploited host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ww][Hh][Oo][Aa][Mm][Ii]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ss][Yy][Ss][Tt][Ee][Mm][Ii][Nn][Ff][Oo]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ii][Pp][Cc][Oo][Nn][Ff][Ii][Gg]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Nn][Ee][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Nn][Ee][Tt]1\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Nn][Ll][Tt][Ee][Ss][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Nn][Ss][Ll][Oo][Oo][Kk][Uu][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Nn][Ee][Tt][Ss][Tt][Aa][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Tt][Aa][Ss][Kk][Ll][Ii][Ss][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Qq][Uu][Ss][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Aa][Rr][Pp]\.[Ee][Xx][Ee]/)
    pivot_on: host
    window: 2h
  - name: Download cradles and LOLBin retrieval of second stage
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll].*/ OR data_win_eventdata_commandLine:/.*[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn].*/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]\-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]\-[Rr][Ee][Ss][Tt][Mm][Ee][Tt][Hh][Oo][Dd].*/ OR data_win_eventdata_commandLine:/.*[Cc][Uu][Rr][Ll].*/ OR data_win_eventdata_commandLine:/.*[Ww][Gg][Ee][Tt].*/ OR data_win_eventdata_commandLine:/.*\-[Uu][Rr][Ll][Cc][Aa][Cc][Hh][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Tt][Aa][Rr][Tt]\-[Bb][Ii][Tt][Ss][Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr].*/)
    pivot_on: host
    window: 4h
  - name: Account creation or admin group changes
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Nn][Ee][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Nn][Ee][Tt]1\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*\/[Aa][Dd][Dd].*/)
    pivot_on: host
    window: 6h
  - name: Outbound connections by the SAP Java process
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\[Jj][Aa][Vv][Aa]\.[Ee][Xx][Ee]/ AND data_win_eventdata_initiated:"true"
    pivot_on: host
    window: 4h
