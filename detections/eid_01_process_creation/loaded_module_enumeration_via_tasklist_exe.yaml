name: Loaded Module Enumeration Via Tasklist.EXE
id: 34275eb8-fa19-436b-b959-3d9ecd53fa1f
version: 1
schema_version: "1.0"
date: "2024-03-13"
author: Swachchhanda Shrawan Poudel
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 34275eb8-fa19-436b-b959-3d9ecd53fa1f
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the enumeration of a specific DLL or EXE being used by a binary via
  "tasklist.exe". This is often used by attackers in order to find the specific
  process identifier (PID) that is using the DLL in question. In order to dump
  the process memory or perform other nefarious actions. MITRE ATT&CK: T1003.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\tasklist.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "tasklist.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-m*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*/m*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*–m*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*—m*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*―m*"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*rdpcorets.dll*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\tasklist.exe'; data_win_eventdata_originalFileName equals 'tasklist.exe';
  data_win_eventdata_commandLine matches '*-m*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.n00py.io/2021/05/dumping-plaintext-rdp-credentials-from-svchost-exe/
  - https://pentestlab.blog/tag/svchost/
  - https://attack.mitre.org/techniques/T1003/

response:
  message: >
    Loaded Module Enumeration Via Tasklist.EXE detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1003
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003
  custom_tags:
    - module
    - enumeration
    - tasklist
    - process_creation
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Tt][Aa][Ss][Kk][Ll][Ii][Ss][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Tt][Aa][Ss][Kk][Ll][Ii][Ss][Tt]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*-[Mm].*/ OR data_win_eventdata_commandLine:/.*\/[Mm].*/ OR data_win_eventdata_commandLine:/.*–[Mm].*/ OR data_win_eventdata_commandLine:/.*—[Mm].*/ OR data_win_eventdata_commandLine:/.*―[Mm].*/) AND data_win_eventdata_commandLine:/.*[Rr][Dd][Pp][Cc][Oo][Rr][Ee][Tt][Ss]\.[Dd][Ll][Ll].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 5afee48e-67dd-4e03-a783-f74259dcf998
    name: Potential LSASS Process Dump Via Procdump
    reason: Finding the PID hosting rdpcorets.dll precedes dumping that process's memory with procdump.
  - id: 646ea171-dded-4578-8a4d-65e9822892e3
    name: Process Memory Dump Via Comsvcs.DLL
    reason: comsvcs MiniDump is the usual dump method once the target PID is learned from tasklist.
  - id: 2e65275c-8288-4ab4-aeb7-6274f58b6b20
    name: Procdump Execution
    reason: Procdump against the PID discovered by tasklist is the direct follow-on.
  - id: 221b251a-357a-49a9-920a-271802777cc0
    name: Potential Process Reconnaissance via Wmic.EXE
    reason: Alternate process recon on the same host if tasklist is watched.
  - id: c248c896-e412-4279-8c15-1c558067b6fa
    name: Enumerate All Information With Whoami.EXE
    reason: Context discovery usually performed right before targeting a session or process.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Process memory dump tooling
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Pp]rocdump.*/ OR /.*comsvcs.*[Mm]ini[Dd]ump.*/ OR /.*[Dd]ump.*\.dmp.*/)
    pivot_on: host
    window: 2h
  - name: Dump files created
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(/.*\.dmp/ OR /.*\.dmp\.zip/)
    pivot_on: host
    window: 2h
  - name: Suspicious process access with dump-capable rights
    query: data_win_system_eventID:10 AND data_win_eventdata_grantedAccess:(0x1fffff OR 0x1410 OR 0x1010 OR 0x143a) AND NOT data_win_eventdata_sourceImage:/.*([Ww]in[Dd]efend|[Ss]ense|[Mm]s[Mm]peng).*/
    pivot_on: host
    window: 2h
  - name: Other process recon
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*\\tasklist\.exe/ OR data_win_eventdata_commandLine:/.*[Gg]et-[Pp]rocess.*/ OR data_win_eventdata_commandLine:/.*wmic.*process.*/)
    pivot_on: host
    window: 2h
