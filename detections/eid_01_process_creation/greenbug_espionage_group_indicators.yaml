name: Greenbug Espionage Group Indicators
id: 3711eee4-a808-4849-8a14-faf733da3612
version: 1
schema_version: "1.0"
date: "2023-03-09"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 3711eee4-a808-4849-8a14-faf733da3612
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects tools and process executions used by Greenbug in their May 2020
  campaign as reported by Symantec. MITRE ATT&CK: T1059.001, T1105, T1036.005.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*:\\\\ProgramData\\\\adobe\\\\Adobe.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*:\\\\ProgramData\\\\oracle\\\\local.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\revshell.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\infopagesbackup\\\\ncat.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*:\\\\ProgramData\\\\comms\\\\comms.exe"
                    case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*-ExecutionPolicy Bypass -File*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*\\\\msf.ps1*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*infopagesbackup*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*\\\\ncat*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*-e cmd.exe*"
                          case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*system.Data.SqlClient.SqlDataAdapter($cmd); [void]$da.fill*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-nop -w hidden -c $k=new-object*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*[Net.CredentialCache]::DefaultCredentials;IEX *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -nop -w hidden -c $m=new-object net.webclient;$m*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-noninteractive -executionpolicy bypass whoami*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-noninteractive -executionpolicy bypass netstat -a*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*L3NlcnZlcj1*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*:\ProgramData\adobe\Adobe.exe'; data_win_eventdata_image matches
  '*:\ProgramData\oracle\local.exe'; data_win_eventdata_image matches
  '*\revshell.exe', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://symantec-enterprise-blogs.security.com/blogs/threat-intelligence/greenbug-espionage-telco-south-asia
  - https://attack.mitre.org/techniques/T1059/001/
  - https://attack.mitre.org/techniques/T1105/
  - https://attack.mitre.org/techniques/T1036/005/

response:
  message: >
    Greenbug Espionage Group Indicators detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1059.001, T1105, T1036.005
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
    - T1105
    - T1036.005
  custom_tags:
    - greenbug
    - espionage
    - group
    - process_creation
    - sysmon
    - stealth
    - g0049
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\[Aa][Dd][Oo][Bb][Ee]\\[Aa][Dd][Oo][Bb][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\[Oo][Rr][Aa][Cc][Ll][Ee]\\[Ll][Oo][Cc][Aa][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Ee][Vv][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ii][Nn][Ff][Oo][Pp][Aa][Gg][Ee][Ss][Bb][Aa][Cc][Kk][Uu][Pp]\\[Nn][Cc][Aa][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\[Cc][Oo][Mm][Mm][Ss]\\[Cc][Oo][Mm][Mm][Ss]\.[Ee][Xx][Ee]/ OR (data_win_eventdata_commandLine:/.*-[Ee][Xx][Ee][Cc][Uu][Tt][Ii][Oo][Nn][Pp][Oo][Ll][Ii][Cc][Yy] [Bb][Yy][Pp][Aa][Ss][Ss] -[Ff][Ii][Ll][Ee].*/ AND data_win_eventdata_commandLine:/.*\\[Mm][Ss][Ff]\.[Pp][Ss]1.*/) OR (data_win_eventdata_commandLine:/.*[Ii][Nn][Ff][Oo][Pp][Aa][Gg][Ee][Ss][Bb][Aa][Cc][Kk][Uu][Pp].*/ AND data_win_eventdata_commandLine:/.*\\[Nn][Cc][Aa][Tt].*/ AND data_win_eventdata_commandLine:/.*-[Ee] [Cc][Mm][Dd]\.[Ee][Xx][Ee].*/) OR data_win_eventdata_commandLine:/.*[Ss][Yy][Ss][Tt][Ee][Mm]\.[Dd][Aa][Tt][Aa]\.[Ss][Qq][Ll][Cc][Ll][Ii][Ee][Nn][Tt]\.[Ss][Qq][Ll][Dd][Aa][Tt][Aa][Aa][Dd][Aa][Pp][Tt][Ee][Rr]\(\$[Cc][Mm][Dd]\); \[[Vv][Oo][Ii][Dd]\]\$[Dd][Aa]\.[Ff][Ii][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*-[Nn][Oo][Pp] -[Ww] [Hh][Ii][Dd][Dd][Ee][Nn] -[Cc] \$[Kk]=[Nn][Ee][Ww]-[Oo][Bb][Jj][Ee][Cc][Tt].*/ OR data_win_eventdata_commandLine:/.*\[[Nn][Ee][Tt]\.[Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll][Cc][Aa][Cc][Hh][Ee]\]::[Dd][Ee][Ff][Aa][Uu][Ll][Tt][Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll][Ss];[Ii][Ee][Xx] .*/ OR data_win_eventdata_commandLine:/.* -[Nn][Oo][Pp] -[Ww] [Hh][Ii][Dd][Dd][Ee][Nn] -[Cc] \$[Mm]=[Nn][Ee][Ww]-[Oo][Bb][Jj][Ee][Cc][Tt] [Nn][Ee][Tt]\.[Ww][Ee][Bb][Cc][Ll][Ii][Ee][Nn][Tt];\$[Mm].*/ OR data_win_eventdata_commandLine:/.*-[Nn][Oo][Nn][Ii][Nn][Tt][Ee][Rr][Aa][Cc][Tt][Ii][Vv][Ee] -[Ee][Xx][Ee][Cc][Uu][Tt][Ii][Oo][Nn][Pp][Oo][Ll][Ii][Cc][Yy] [Bb][Yy][Pp][Aa][Ss][Ss] [Ww][Hh][Oo][Aa][Mm][Ii].*/ OR data_win_eventdata_commandLine:/.*-[Nn][Oo][Nn][Ii][Nn][Tt][Ee][Rr][Aa][Cc][Tt][Ii][Vv][Ee] -[Ee][Xx][Ee][Cc][Uu][Tt][Ii][Oo][Nn][Pp][Oo][Ll][Ii][Cc][Yy] [Bb][Yy][Pp][Aa][Ss][Ss] [Nn][Ee][Tt][Ss][Tt][Aa][Tt] -[Aa].*/ OR data_win_eventdata_commandLine:/.*[Ll]3[Nn][Ll][Cc][Nn][Zz][Ll][Cc][Jj]1.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e31033fc-33f0-4020-9a16-faf9b31cbf08
    name: PUA - Netcat Suspicious Execution
    reason: Greenbug's ncat.exe/revshell.exe tooling is a netcat-style reverse shell; this fires on the same connect-back/listener behaviour.
  - id: e6c54d94-498c-4562-a37c-b469d8e9a275
    name: Suspicious PowerShell Download and Execute Pattern
    reason: Greenbug stagers use hidden Net.WebClient/IEX PowerShell cradles; generic detection of the same delivery.
  - id: 9be56c82-b1cc-4318-87eb-d138afaaca39
    name: Malicious PowerShell Process - Execution Policy Bypass
    reason: Greenbug runs powershell -ExecutionPolicy Bypass -File msf.ps1 Metasploit payloads; shows the bypass launch.
  - id: de587dce-915e-4218-aac4-835ca6af6f70
    name: Potential Persistence Attempt Via Run Keys Using Reg.EXE
    reason: Binaries dropped in ProgramData (Adobe.exe, local.exe, comms.exe) are typically made persistent via Run keys next.
  - id: c248c896-e412-4279-8c15-1c558067b6fa
    name: Enumerate All Information With Whoami.EXE
    reason: Greenbug's non-interactive bypassed PowerShell runs whoami as first host/privilege recon after foothold.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Netcat/revshell connect-back or listener
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Nn][Cc][Aa][Tt]\.[Ee][Xx][Ee]|\\[Nn][Cc]\.[Ee][Xx][Ee]|\\[Nn][Cc]64\.[Ee][Xx][Ee]|\\[Rr][Ee][Vv][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee])/ OR data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*(\-[Ee] [Cc][Mm][Dd]\.[Ee][Xx][Ee]|\-[Ee] [Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]).*/
    pivot_on: host
    window: 6h
  - name: Network connections by script hosts/LOLBins (C2 beacon)
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*(\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]|\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 6h
  - name: PowerShell download cradle / encoded stager
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee])/ AND data_win_eventdata_commandLine:/.*([Nn][Ee][Tt]\.[Ww][Ee][Bb][Cc][Ll][Ii][Ee][Nn][Tt]|[Ii][Ee][Xx]|[Ii][Nn][Vv][Oo][Kk][Ee]\-[Ee][Xx][Pp][Rr][Ee][Ss][Ss][Ii][Oo][Nn]|\-[Ee][Nn][Cc]).*/
    pivot_on: host
    window: 4h
  - name: Run key / Winlogon persistence writes
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/ OR data_win_eventdata_targetObject:/.*[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]\\[Ss][Hh][Ee][Ll][Ll].*/)
    pivot_on: host
    window: 24h
  - name: Follow-on host and account recon
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Ww][Hh][Oo][Aa][Mm][Ii]\.[Ee][Xx][Ee]|\\[Nn][Ee][Tt]\.[Ee][Xx][Ee]|\\[Nn][Ee][Tt]1\.[Ee][Xx][Ee]|\\[Ii][Pp][Cc][Oo][Nn][Ff][Ii][Gg]\.[Ee][Xx][Ee]|\\[Ss][Yy][Ss][Tt][Ee][Mm][Ii][Nn][Ff][Oo]\.[Ee][Xx][Ee]|\\[Nn][Ll][Tt][Ee][Ss][Tt]\.[Ee][Xx][Ee]|\\[Nn][Ee][Tt][Ss][Tt][Aa][Tt]\.[Ee][Xx][Ee]|\\[Tt][Aa][Ss][Kk][Ll][Ii][Ss][Tt]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 2h
