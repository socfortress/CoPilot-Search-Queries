name: Windows PowerShell FakeCAPTCHA Clipboard Execution
id: d81d4d3d-76b5-4f21-ab51-b17d5164c106
version: 1
schema_version: "1.0"
date: "2026-04-07"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects potential FakeCAPTCHA/ClickFix clipboard hijacking campaigns by looking
  for PowerShell execution with hidden window parameters and distinctive strings
  related to fake CAPTCHA verification. These campaigns use social engineering to
  trick users into pasting malicious PowerShell commands from their clipboard,
  typically delivering information stealers or remote access trojans.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - wildcard:
            data_win_eventdata_commandLine: "*-w*hidden*"
        - wildcard:
            data_win_eventdata_commandLine: "*Clipboard*"
        - wildcard:
            data_win_eventdata_commandLine: "*iex*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-07 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-07 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (Process Creation) logging enabled on endpoints.
  Ensure Sysmon version 6.0.4 or later is configured with process command-line
  arguments captured in full. Configure via Sysmon configuration file with:
  <ProcessCreate onmatch="include"> and capture all CommandLine events.

known_false_positives: >
  Legitimate PowerShell commands that use hidden windows for automation tasks
  may trigger this detection. Review the actual command being executed and user
  context to determine if the activity is authorized. Administrative clipboard
  manipulation scripts may also generate false positives.

references:
  - https://urlhaus.abuse.ch/
  - https://www.proofpoint.com/us/blog/threat-insight/security-brief-clickfix-social-engineering-technique-floods-threat-landscape
  - https://reliaquest.com/blog/using-captcha-for-compromise/
  - https://attack.mitre.org/techniques/T1204/001/
  - https://github.com/MHaggis/ClickGrab

response:
  message: >
    Potential FakeCAPTCHA/ClickFix clipboard hijacking execution detected on
    $agent_name$ by $data_win_eventdata_user$.
    Process: $data_win_eventdata_image$.
    Command: $data_win_eventdata_commandLine$.
    MITRE ATT&CK: T1059.001, T1204.001
  risk_score: 72
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 50
    - field: data_win_eventdata_user
      type: user
      score: 22
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process_command

tags:
  analytic_story:
    - Scattered Lapsus$ Hunters
    - Fake CAPTCHA Campaigns
    - Interlock Ransomware
    - NetSupport RMM Tool Abuse
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
    - T1204.001
    - T1059.003
  custom_tags:
    - fakecaptcha
    - clickfix
    - clipboard_hijacking
    - social_engineering
    - infostealer
    - rat
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*-w.*hidden.*/ AND data_win_eventdata_commandLine:/.*Clipboard.*/ AND data_win_eventdata_commandLine:/.*iex.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d487ed4a-fd24-436d-a0b2-f4e95f7b2635
    name: Suspicious ClickFix/FileFix Execution Pattern
    reason: Generic ClickFix/FileFix command pattern; same social-engineering technique.
  - id: f5fe36cf-f1ec-4c23-903d-09a3110f6bbb
    name: Potential ClickFix Execution Pattern - Registry
    reason: Registry evidence of a ClickFix command pasted into the Run dialog.
  - id: a7df0e9e-91a5-459a-a003-4cde67c2ff5d
    name: Potentially Suspicious Command Executed Via Run Dialog Box - Registry
    reason: Run dialog commands are the paste-and-run vector for ClickFix lures.
  - id: 7a1b4c5e-8f3d-4b9a-7c2e-1f4a5b8c6d9e
    name: Suspicious Space Characters in RunMRU Registry Path - ClickFix
    reason: Whitespace-padded RunMRU entries hide the malicious part of the pasted command.
  - id: c11aecef-9c37-45a6-9c07-bc0782f963fd
    name: RunMRU Registry Key Deletion
    reason: Attackers clear RunMRU after pasting to remove the evidence.
  - id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
    name: PowerShell Download and Execution Cradles
    reason: Pasted IEX command downloads the stealer or RAT stage.
  - id: ee18ed37-0802-4268-9435-b3b91aaa18db
    name: PowerShell - Connect To Internet With Hidden Window
    reason: Hidden-window PowerShell connecting out is the next network step.
  - id: 09576804-7a05-458e-a817-eb718ca91f54
    name: Suspicious PowerShell IEX Execution Patterns
    reason: IEX execution patterns in the clipboard-delivered one-liner.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Explorer parent launching shells
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*explorer\.exe/ AND data_win_eventdata_image:(/.*[Pp]ower[Ss]hell.*/ OR /.*mshta.*/ OR /.*cmd\.exe/)
    pivot_on: host
    window: 1h
  - name: Download and execute of second stage
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ii]nvoke-[Ww]eb[Rr]equest.*/ OR /.*[Dd]ownload[Ss]tring.*/ OR /.*curl.*http.*/ OR /.*mshta.*http.*/)
    pivot_on: host
    window: 2h
  - name: Processes launched from user-writable paths
    query: data_win_system_eventID:1 AND data_win_eventdata_image:(/.*\\[Aa]pp[Dd]ata\\.*/ OR /.*\\[Tt]emp\\.*/ OR /.*\\[Pp]rogram[Dd]ata\\.*/)
    pivot_on: host
    window: 4h
  - name: Persistence from the infected user
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*schtasks.*[Cc]reate.*/ OR /.*CurrentVersion\\Run.*/ OR /.*[Ss]tartup.*/)
    pivot_on: user
    window: 6h
  - name: Browser credential store access
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ll]ogin [Dd]ata.*/ OR /.*[Ww]eb [Dd]ata.*/ OR /.*[Cc]ookies.*/ OR /.*[Ll]ocal [Ss]tate.*/)
    pivot_on: host
    window: 4h
