name: Windows Binary Executed From WSL
id: ed825c86-c009-4014-b413-b76003e33d35
version: 1
schema_version: "1.0"
date: "2023-02-14"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: ed825c86-c009-4014-b413-b76003e33d35
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of Windows binaries from within a WSL instance. This
  could be used to masquerade parent-child relationships. MITRE ATT&CK: T1202.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - regexp:
            data_win_eventdata_image: ".*([a-zA-Z]:\\\\).*"
        - wildcard:
            data_win_eventdata_currentDirectory:
              value: "*\\\\\\\\wsl.localhost*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_currentDirectory
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches the regex
  /.*([a-zA-Z]:\\).*/; data_win_eventdata_currentDirectory matches
  '*\\wsl.localhost*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - Internal Research
  - https://attack.mitre.org/techniques/T1202/

response:
  message: >
    Windows Binary Executed From WSL detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_currentDirectory: $data_win_eventdata_currentDirectory$.
    MITRE ATT&CK: T1202
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_currentDirectory
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1202
  custom_tags:
    - binary
    - executed
    - process_creation
    - sysmon
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*([a-zA-Z]:\\).*/ AND data_win_eventdata_currentDirectory:/.*\\\\[Ww][Ss][Ll]\.[Ll][Oo][Cc][Aa][Ll][Hh][Oo][Ss][Tt].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 2d22a514-e024-4428-9dba-41505bd63a5b
    name: Indirect Command Execution From Script File Via Bash.EXE
    reason: bash.exe/WSL used to run script files so the Windows parent-child chain is masked; same WSL proxy-execution tradecraft
  - id: 5edc2273-c26f-406c-83f3-f4d948e740dd
    name: Indirect Inline Command Execution Via Bash.EXE
    reason: Inline commands via bash.exe -c are the usual launcher for running Windows binaries out of WSL
  - id: eca8ae39-5c3c-4321-b538-9e64fe25822e
    name: Installation of WSL Kali-Linux
    reason: Installing a WSL distro is the precursor that creates the wsl.localhost environment
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: WSL launcher executing commands
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Ww][Ss][Ll]\.[Ee][Xx][Ee]|[Bb][Aa][Ss][Hh]\.[Ee][Xx][Ee]|[Ww][Ss][Ll][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]).*/ AND data_win_eventdata_commandLine:/.*( \-[Ee] | \-\-[Ee][Xx][Ee][Cc] | \-[Cc] |\-\-[Dd][Ii][Ss][Tt][Rr][Ii][Bb][Uu][Tt][Ii][Oo][Nn]| \-[Dd] |\-\-[Ss][Yy][Ss][Tt][Ee][Mm]).*/
    pivot_on: host
    window: 4h
  - name: Windows shells and tools spawned by WSL parents
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\([Ww][Ss][Ll]\.[Ee][Xx][Ee]|[Ww][Ss][Ll][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]|[Bb][Aa][Ss][Hh]\.[Ee][Xx][Ee]|[Ww][Ss][Ll][Ss][Ee][Rr][Vv][Ii][Cc][Ee]\.[Ee][Xx][Ee]).*/ AND data_win_eventdata_image:/.*\\([Cc][Mm][Dd]\.[Ee][Xx][Ee]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]|[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]|[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|[Rr][Ee][Gg]\.[Ee][Xx][Ee]).*/
    pivot_on: host
    window: 2h
  - name: Command lines referencing WSL file shares
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*(\\\\[Ww][Ss][Ll]\$|\\\\[Ww][Ss][Ll]\.[Ll][Oo][Cc][Aa][Ll][Hh][Oo][Ss][Tt]|\/[Mm][Nn][Tt]\/[Cc]\/).*/
    pivot_on: host
    window: 4h
  - name: Files written through WSL share
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(\\\\[Ww][Ss][Ll]\$|\\\\[Ww][Ss][Ll]\.[Ll][Oo][Cc][Aa][Ll][Hh][Oo][Ss][Tt]).*/
    pivot_on: host
    window: 4h
  - name: Network activity by WSL processes
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Ww][Ss][Ll]\.[Ee][Xx][Ee]|[Ww][Ss][Ll][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]|[Ww][Ss][Ll][Ss][Ee][Rr][Vv][Ii][Cc][Ee]\.[Ee][Xx][Ee]|[Bb][Aa][Ss][Hh]\.[Ee][Xx][Ee]).*/
    pivot_on: host
    window: 4h
