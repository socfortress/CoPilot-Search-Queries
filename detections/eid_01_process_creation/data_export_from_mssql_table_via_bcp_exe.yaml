name: Data Export From MSSQL Table Via BCP.EXE
id: c615d676-f655-46b9-b913-78729021e5d7
version: 1
schema_version: "1.0"
date: "2024-08-20"
author: Omar Khaled (@beacon_exe), MahirAli Khan (in/mahiralikhan), Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: c615d676-f655-46b9-b913-78729021e5d7
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of the BCP utility in order to export data from the
  database. Attackers were seen saving their malware to a database column or
  table and then later extracting it via "bcp.exe" into a file. MITRE ATT&CK:
  T1048.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\bcp.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "BCP.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* out *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* queryout *"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches '*\bcp.exe';
  data_win_eventdata_originalFileName equals 'BCP.exe';
  data_win_eventdata_commandLine matches '* out *', among other conditions.

known_false_positives: >
  Legitimate data export operations. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://docs.microsoft.com/en-us/sql/tools/bcp-utility
  - https://asec.ahnlab.com/en/61000/
  - https://asec.ahnlab.com/en/78944/
  - https://www.huntress.com/blog/attacking-mssql-servers
  - https://www.huntress.com/blog/attacking-mssql-servers-pt-ii
  - https://news.sophos.com/en-us/2024/08/07/sophos-mdr-hunt-tracks-mimic-ransomware-campaign-against-organizations-in-india/
  - https://research.nccgroup.com/2018/03/10/apt15-is-alive-and-strong-an-analysis-of-royalcli-and-royaldns/
  - https://attack.mitre.org/techniques/T1048/

response:
  message: >
    Data Export From MSSQL Table Via BCP.EXE detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1048
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1048
  custom_tags:
    - export
    - mssql
    - table
    - process_creation
    - sysmon
    - execution
    - exfiltration
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Bb][Cc][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Bb][Cc][Pp]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.* [Oo][Uu][Tt] .*/ OR data_win_eventdata_commandLine:/.* [Qq][Uu][Ee][Rr][Yy][Oo][Uu][Tt] .*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 2f47f1fd-0901-466e-a770-3b7092834a1b
    name: Potential Conti Ransomware Database Dumping Activity Via SQLCmd
    reason: Alternate database dumping method by the same exfiltration-prep operator behaviour.
  - id: b57ba453-b384-4ab9-9f40-1038086b4e53
    name: VeeamBackup Database Credentials Dump Via Sqlcmd.EXE
    reason: Companion SQL client abuse for credential/data extraction from database servers.
  - id: 5eb76fe2-a869-4865-8c4c-8cff424b18a1
    name: Windows PowerShell Invoke-Sqlcmd Execution
    reason: Queries run before the export that populate the table later dumped with bcp.
  - id: 7f103213-a04e-4d59-8261-213dddf22314
    name: MSSQL XPCmdshell Suspicious Execution
    reason: xp_cmdshell is how attackers often launch bcp from inside SQL Server.
  - id: d08dd86f-681e-4a00-a92c-1db218754417
    name: MSSQL XPCmdshell Option Change
    reason: 'Precursor: xp_cmdshell enabled to allow command execution such as bcp.'
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other SQL client tooling use
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*(sqlcmd|osql|isql)\.exe/ OR data_win_eventdata_originalFileName:/(sqlcmd|osql)\.exe/)
    pivot_on: host
    window: 6h
  - name: Processes spawned by sqlservr
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*sqlservr\.exe/
    pivot_on: host
    window: 6h
  - name: Archive or staging of exported data
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*(7z|rar|zip|Compress-Archive).*/ OR data_win_eventdata_commandLine:/.*(\.bcp|\.dat|\.csv).*/)
    pivot_on: host
    window: 6h
  - name: Exported files written to disk
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\.(bcp|dat|csv|bin|exe|dll)/
    pivot_on: host
    window: 4h
  - name: Outbound transfer tooling
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(curl|certutil|bitsadmin|rclone|scp|ftp).*/
    pivot_on: host
    window: 6h
