name: Github Self-Hosted Runner Execution
id: 5bac7a56-da88-4c27-922e-c81e113b20cb
version: 1
schema_version: "1.0"
date: "2025-11-29"
author: Daniel Koifman (KoifSec)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 5bac7a56-da88-4c27-922e-c81e113b20cb
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects GitHub self-hosted runners executing workflows on local infrastructure
  that could be abused for persistence and code execution. Shai-Hulud is an npm
  supply chain worm targeting CI/CD environments. It installs runners on
  compromised systems to maintain access after credential theft, leveraging
  their access to secrets and internal networks. MITRE ATT&CK: T1102.002, T1071.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\Runner.Worker.exe"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_originalFileName:
                                value: "Runner.Worker.dll"
                                case_insensitive: true
                        minimum_should_match: 1
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*spawnclient*"
                          case_insensitive: true
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\Runner.Listener.exe"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_originalFileName:
                                value: "Runner.Listener.dll"
                                case_insensitive: true
                        minimum_should_match: 1
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*run*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*configure*"
                                case_insensitive: true
                        minimum_should_match: 1
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\Runner.Worker.exe'; data_win_eventdata_originalFileName equals
  'Runner.Worker.dll'; data_win_eventdata_commandLine matches '*spawnclient*',
  among other conditions.

known_false_positives: >
  Legitimate GitHub self-hosted runner installations on designated CI/CD
  infrastructure. Authorized runner deployments by DevOps/Platform teams
  following change management. Scheduled runner updates or reconfigurations on
  existing build agents. Self-hosted runners that follow expected/known naming
  patterns. Installation via expected/known configuration management tools
  (reflected mostly as parent process name). Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://about.gitlab.com/blog/gitlab-discovers-widespread-npm-supply-chain-attack/
  - https://securitylabs.datadoghq.com/articles/shai-hulud-2.0-npm-worm/
  - https://attack.mitre.org/techniques/T1102/002/
  - https://attack.mitre.org/techniques/T1071/

response:
  message: >
    Github Self-Hosted Runner Execution detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1102.002, T1071
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1102.002
    - T1071
  custom_tags:
    - github
    - hosted
    - runner
    - process_creation
    - sysmon
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (((data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Nn][Ee][Rr]\.[Ww][Oo][Rr][Kk][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Rr][Uu][Nn][Nn][Ee][Rr]\.[Ww][Oo][Rr][Kk][Ee][Rr]\.[Dd][Ll][Ll]/) AND data_win_eventdata_commandLine:/.*[Ss][Pp][Aa][Ww][Nn][Cc][Ll][Ii][Ee][Nn][Tt].*/) OR ((data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Nn][Ee][Rr]\.[Ll][Ii][Ss][Tt][Ee][Nn][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Rr][Uu][Nn][Nn][Ee][Rr]\.[Ll][Ii][Ss][Tt][Ee][Nn][Ee][Rr]\.[Dd][Ll][Ll]/) AND (data_win_eventdata_commandLine:/.*[Rr][Uu][Nn].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Nn][Ff][Ii][Gg][Uu][Rr][Ee].*/)))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 5299fadf-f228-4526-8274-251db1960be9
    name: Shai-Hulud Malicious Bun Execution
    reason: Shai-Hulud worm uses Bun to run its payload; precedes runner installation.
  - id: 540703fb-a874-4385-a9d6-7cd1bfab268c
    name: Shai-Hulud Malware Indicators - Windows
    reason: Shai-Hulud indicators on the same host confirm the worm campaign behind the runner.
  - id: 44030449-b0df-4c94-aae1-502359ab28ee
    name: PUA - TruffleHog Execution
    reason: TruffleHog secret scanning is the credential theft that precedes runner persistence.
  - id: df1f26d3-bea7-4700-9ea2-ad3e990cf90e
    name: Node Process Executions
    reason: Node/npm execution is the worm delivery vector (malicious package postinstall).
  - id: 6640f31c-01ad-49b5-beb5-83498a5cd8bd
    name: Potential Arbitrary Code Execution Via Node.EXE
    reason: Arbitrary code execution via Node.exe is how the malicious package runs.
  - id: 21dd6d38-2b18-4453-9404-a0fe4a0cc288
    name: Curl Download And Execute Combination
    reason: Curl download-and-execute can fetch runner binaries or payloads.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: GitHub runner install/config
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*(config\.cmd|run\.cmd|[Rr]unner\.[Ll]istener|actions-runner).*/)
    pivot_on: host
    window: 24h
  - name: Package manager lifecycle execution
    query: data_win_system_eventID:1 AND data_win_eventdata_image:(/.*\\(node|npm|bun|npx)(\.cmd)?\.exe/) AND data_win_eventdata_commandLine:(/.*(install|postinstall|preinstall|run).*/)
    pivot_on: host
    window: 6h
  - name: Secret scanning and token theft
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*([Tt]ruffle[Hh]og|gh +auth +token|NPM_TOKEN|GITHUB_TOKEN|\.npmrc).*/)
    pivot_on: host
    window: 6h
  - name: Runner downloads from GitHub
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*(github\.com\/actions\/runner|actions-runner-win).*/)
    pivot_on: host
    window: 24h
  - name: Runner persistence as service or task
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*(svc\.cmd|[Ss]chtasks.*[Rr]unner|sc(\.exe)? +create.*[Rr]unner).*/)
    pivot_on: host
    window: 24h
