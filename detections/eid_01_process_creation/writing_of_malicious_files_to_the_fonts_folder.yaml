name: Writing Of Malicious Files To The Fonts Folder
id: ae9b0bd7-8888-4606-b444-0ed7410cb728
version: 1
schema_version: "1.0"
date: "2022-03-08"
author: Sreeman
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: ae9b0bd7-8888-4606-b444-0ed7410cb728
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Monitors for the hiding possible malicious files in the C:\Windows\Fonts\
  location. This folder doesn't require admin privillege to be written and
  executed from. MITRE ATT&CK: T1211, T1059.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*echo*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*copy*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*type*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*file createnew*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*cacls*"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*C:\\\\Windows\\\\Fonts\\\\*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.sh*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.exe*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.dll*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.bin*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.bat*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.cmd*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.js*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.msh*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.reg*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.scr*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.ps*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.vb*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.jar*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.pl*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.inf*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.cpl*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.hta*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.msi*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.vbs*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*echo*'; data_win_eventdata_commandLine matches '*copy*';
  data_win_eventdata_commandLine matches '*type*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://thedfirreport.com/2020/04/20/sqlserver-or-the-miner-in-the-basement/
  - https://attack.mitre.org/techniques/T1211/
  - https://attack.mitre.org/techniques/T1059/

response:
  message: >
    Writing Of Malicious Files To The Fonts Folder detected on host
    $agent_name$. Matched data_win_eventdata_commandLine:
    $data_win_eventdata_commandLine$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1211, T1059
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1211
    - T1059
  custom_tags:
    - writing
    - fonts
    - folder
    - process_creation
    - sysmon
    - stealth
    - persistence
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ee][Cc][Hh][Oo].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Pp][Yy].*/ OR data_win_eventdata_commandLine:/.*[Tt][Yy][Pp][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ff][Ii][Ll][Ee] [Cc][Rr][Ee][Aa][Tt][Ee][Nn][Ee][Ww].*/ OR data_win_eventdata_commandLine:/.*[Cc][Aa][Cc][Ll][Ss].*/) AND data_win_eventdata_commandLine:/.*[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ff][Oo][Nn][Tt][Ss]\\.*/ AND (data_win_eventdata_commandLine:/.*\.[Ss][Hh].*/ OR data_win_eventdata_commandLine:/.*\.[Ee][Xx][Ee].*/ OR data_win_eventdata_commandLine:/.*\.[Dd][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*\.[Bb][Ii][Nn].*/ OR data_win_eventdata_commandLine:/.*\.[Bb][Aa][Tt].*/ OR data_win_eventdata_commandLine:/.*\.[Cc][Mm][Dd].*/ OR data_win_eventdata_commandLine:/.*\.[Jj][Ss].*/ OR data_win_eventdata_commandLine:/.*\.[Mm][Ss][Hh].*/ OR data_win_eventdata_commandLine:/.*\.[Rr][Ee][Gg].*/ OR data_win_eventdata_commandLine:/.*\.[Ss][Cc][Rr].*/ OR data_win_eventdata_commandLine:/.*\.[Pp][Ss].*/ OR data_win_eventdata_commandLine:/.*\.[Vv][Bb].*/ OR data_win_eventdata_commandLine:/.*\.[Jj][Aa][Rr].*/ OR data_win_eventdata_commandLine:/.*\.[Pp][Ll].*/ OR data_win_eventdata_commandLine:/.*\.[Ii][Nn][Ff].*/ OR data_win_eventdata_commandLine:/.*\.[Cc][Pp][Ll].*/ OR data_win_eventdata_commandLine:/.*\.[Hh][Tt][Aa].*/ OR data_win_eventdata_commandLine:/.*\.[Mm][Ss][Ii].*/ OR data_win_eventdata_commandLine:/.*\.[Vv][Bb][Ss].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 3dfd06d2-eaf4-4532-9555-68aca59f57c4
    name: Process Execution From A Potentially Suspicious Folder
    reason: A payload dropped to Windows\Fonts is likely executed next from that world-writable location.
  - id: c09dad97-1c78-4f71-b127-7edb2b8e491a
    name: Execution of Suspicious File Type Extension
    reason: Dropped scripts and binaries with odd extensions get executed as the follow-on step.
  - id: b06a555e-dce0-417d-a2eb-28a5d8d66ef7
    name: Execution of File with Multiple Extensions
    reason: Masquerading names hide dropped payloads among font files.
  - id: 4281cb20-2994-4580-aa63-c8b86d019934
    name: Hiding Files with Attrib.exe
    reason: Attackers hide the planted file with attrib after writing it into Fonts.
  - id: b1b1e316-accc-11eb-a9b4-acde48001122
    name: ICACLS Grant Command
    reason: The rule matches cacls; permission changes on the dropped file commonly accompany staging.
  - id: fa7ca5c6-c9d8-11eb-bce9-acde48001122
    name: Permission Modification using Takeown App
    reason: Ownership/ACL takeover on the dropped payload is a related staging step.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Non-font files created in the Fonts folder
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ff][Oo][Nn][Tt][Ss]\\.*/ AND NOT data_win_eventdata_targetFilename:/.*\.([Tt][Tt][Ff]|[Tt][Tt][Cc]|[Oo][Tt][Ff]|[Ff][Oo][Nn])/
    pivot_on: host
    window: 4h
  - name: Process execution from the Fonts folder
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ff][Oo][Nn][Tt][Ss]\\.*/
    pivot_on: host
    window: 4h
  - name: Command lines running Fonts folder payloads
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ff][Oo][Nn][Tt][Ss]\\.*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Bb][Aa][Tt]|[Pp][Ss]1|[Vv][Bb][Ss]|[Hh][Tt][Aa])/
    pivot_on: host
    window: 4h
  - name: Run-key persistence pointing to Fonts
    query: data_win_system_eventID:"13" AND data_win_eventdata_details:/.*[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ff][Oo][Nn][Tt][Ss]\\.*/
    pivot_on: host
    window: 24h
