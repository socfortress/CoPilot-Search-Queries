graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ee][Cc][Hh][Oo].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Pp][Yy].*/ OR data_win_eventdata_commandLine:/.*[Tt][Yy][Pp][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ff][Ii][Ll][Ee] [Cc][Rr][Ee][Aa][Tt][Ee][Nn][Ee][Ww].*/ OR data_win_eventdata_commandLine:/.*[Cc][Aa][Cc][Ll][Ss].*/) AND data_win_eventdata_commandLine:/.*[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ff][Oo][Nn][Tt][Ss]\\.*/ AND (data_win_eventdata_commandLine:/.*\.[Ss][Hh].*/ OR data_win_eventdata_commandLine:/.*\.[Ee][Xx][Ee].*/ OR data_win_eventdata_commandLine:/.*\.[Dd][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*\.[Bb][Ii][Nn].*/ OR data_win_eventdata_commandLine:/.*\.[Bb][Aa][Tt].*/ OR data_win_eventdata_commandLine:/.*\.[Cc][Mm][Dd].*/ OR data_win_eventdata_commandLine:/.*\.[Jj][Ss].*/ OR data_win_eventdata_commandLine:/.*\.[Mm][Ss][Hh].*/ OR data_win_eventdata_commandLine:/.*\.[Rr][Ee][Gg].*/ OR data_win_eventdata_commandLine:/.*\.[Ss][Cc][Rr].*/ OR data_win_eventdata_commandLine:/.*\.[Pp][Ss].*/ OR data_win_eventdata_commandLine:/.*\.[Vv][Bb].*/ OR data_win_eventdata_commandLine:/.*\.[Jj][Aa][Rr].*/ OR data_win_eventdata_commandLine:/.*\.[Pp][Ll].*/ OR data_win_eventdata_commandLine:/.*\.[Ii][Nn][Ff].*/ OR data_win_eventdata_commandLine:/.*\.[Cc][Pp][Ll].*/ OR data_win_eventdata_commandLine:/.*\.[Hh][Tt][Aa].*/ OR data_win_eventdata_commandLine:/.*\.[Mm][Ss][Ii].*/ OR data_win_eventdata_commandLine:/.*\.[Vv][Bb][Ss].*/)

