][Rr][Ss][Hh][Ee][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ss][Hh][Tt][Aa].*/ OR data_win_eventdata_commandLine:/.*[Ww][Ss][Cc][Rr][Ii][Pp][Tt].*/ OR data_win_eventdata_commandLine:/.*[Cc][Ss][Cc][Rr][Ii][Pp][Tt].*/ OR data_win_eventdata_commandLine:/.*[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll].*/ OR data_win_eventdata_commandLine:/.*[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn].*/ OR data_win_eventdata_commandLine:/.*[Bb][Aa][Ss][Hh]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_commandLine:/.*[Bb][Aa][Ss][Hh] .*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc][Rr][Cc][Oo][Nn][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ww][Mm][Ii][Cc] .*/ OR data_win_eventdata_commandLine:/.*[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ff][Oo][Rr][Ff][Ii][Ll][Ee][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc][Rr][Ii][Pp][Tt][Rr][Uu][Nn][Nn][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Hh][Hh]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_commandLine:/.*[Hh][Hh] .*/)

