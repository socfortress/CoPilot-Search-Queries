name: Install New Package Via Winget Local Manifest
id: 313d6012-51a0-4d93-8dfc-de8553239e25
version: 1
schema_version: "1.0"
date: "2023-04-17"
author: Sreeman, Florian Roth (Nextron Systems), frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 313d6012-51a0-4d93-8dfc-de8553239e25
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects usage of winget to install applications via manifest file. Adversaries
  can abuse winget to download payloads remotely and execute them. The manifest
  option enables you to install an application by passing in a YAML file
  directly to the client. Winget can be used to download and install exe, msi or
  msix files later. MITRE ATT&CK: T1059.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\winget.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "winget.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*install*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* add *"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-m *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*--manifest*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\winget.exe'; data_win_eventdata_originalFileName equals 'winget.exe';
  data_win_eventdata_commandLine matches '*install*', among other conditions.

known_false_positives: >
  Some false positives are expected in some environment that may use this
  functionality to install and test their custom applications. Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://learn.microsoft.com/en-us/windows/package-manager/winget/install#local-install
  - https://lolbas-project.github.io/lolbas/Binaries/Winget/
  - https://github.com/nasbench/Misc-Research/tree/b9596e8109dcdb16ec353f316678927e507a5b8d/LOLBINs/Winget
  - https://attack.mitre.org/techniques/T1059/

response:
  message: >
    Install New Package Via Winget Local Manifest detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1059
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059
  custom_tags:
    - install
    - package
    - winget
    - process_creation
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Gg][Ee][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ww][Ii][Nn][Gg][Ee][Tt]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*[Ii][Nn][Ss][Tt][Aa][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.* [Aa][Dd][Dd] .*/) AND (data_win_eventdata_commandLine:/.*-[Mm] .*/ OR data_win_eventdata_commandLine:/.*--[Mm][Aa][Nn][Ii][Ff][Ee][Ss][Tt].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: fa277e82-9b78-42dd-b05c-05555c7b6015
    name: Enable Local Manifest Installation With Winget
    reason: Local manifest installs are disabled by default; this setting change is the direct precursor that makes the command possible.
  - id: 81a0ecb5-0a41-4ba1-b2ba-c944eb92bfa2
    name: Add Insecure Download Source To Winget
    reason: Attackers pair a rogue HTTP winget source with manifest installs to deliver payloads.
  - id: 05ebafc8-7aa2-4bcd-a269-2aec93f9e842
    name: Add New Download Source To Winget
    reason: Adding a custom winget source is an alternate staging path used alongside local manifests.
  - id: c15a46a0-07d4-4c87-b4b6-89207835a83b
    name: Add Potential Suspicious New Download Source To Winget
    reason: Suspicious source additions on the same host reveal the origin the manifest points at.
  - id: 180c7c5c-d64b-4a63-86e9-68910451bc8b
    name: Potential File Download Via MS-AppInstaller Protocol Handler
    reason: Another Microsoft package-installer path for pulling remote payloads.
  - id: windows-advanced-installer-msix-ai-stubs-001
    name: Windows Advanced Installer MSIX with AI_STUBS Execution
    reason: Winget manifests can install MSIX packages; malicious MSIX execute embedded stubs.
  - id: 21dd6d38-2b18-4453-9404-a0fe4a0cc288
    name: Curl Download And Execute Combination
    reason: Manifest or installer staging files are often fetched via curl before winget install.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Winget executions (all subcommands)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Gg][Ee][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ww][Ii][Nn][Gg][Ee][Tt].[Ee][Xx][Ee]/)
    pivot_on: host
    window: 6h
  - name: Winget local-manifest policy registry changes
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Aa][Pp][Pp][Ii][Nn][Ss][Tt][Aa][Ll][Ll][Ee][Rr].*/
    pivot_on: host
    window: 6h
  - name: Manifest and installer package files written
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.([Yy][Aa][Mm][Ll]|[Mm][Ss][Ii][Xx]|[Mm][Ss][Ii]|[Aa][Pp][Pp][Xx])/
    pivot_on: host
    window: 4h
  - name: Network connections by winget or App Installer
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Gg][Ee][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Pp][Aa][Cc][Kk][Aa][Gg][Ee][Mm][Aa][Nn][Aa][Gg][Ee][Rr].*/)
    pivot_on: host
    window: 4h
  - name: Children of winget or msiexec
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\([Ww][Ii][Nn][Gg][Ee][Tt]|[Mm][Ss][Ii][Ee][Xx][Ee][Cc])\.[Ee][Xx][Ee]/)
    pivot_on: host
    window: 2h
