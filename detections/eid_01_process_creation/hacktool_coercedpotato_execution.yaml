name: HackTool - CoercedPotato Execution
id: e8d34729-86a4-4140-adfd-0a29c2106307
version: 1
schema_version: "1.0"
date: "2024-11-23"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: e8d34729-86a4-4140-adfd-0a29c2106307
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the use of CoercedPotato, a tool for privilege escalation. MITRE
  ATT&CK: T1055.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\CoercedPotato.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* --exploitId *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=A75D7669DB6B2E107A44C4057FF7F7D6*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=F91624350E2C678C5DCBE5E1F24E22C9*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=14C81850A079A87E83D50CA41C709A15*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_hashes
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\CoercedPotato.exe'; data_win_eventdata_commandLine matches '* --exploitId
  *'; data_win_eventdata_hashes matches
  '*IMPHASH=A75D7669DB6B2E107A44C4057FF7F7D6*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/hackvens/CoercedPotato
  - https://blog.hackvens.fr/articles/CoercedPotato.html
  - https://attack.mitre.org/techniques/T1055/

response:
  message: >
    HackTool - CoercedPotato Execution detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1055
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1055
  custom_tags:
    - hacktool
    - coercedpotato
    - process_creation
    - sysmon
    - privilege_escalation
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Cc][Oo][Ee][Rr][Cc][Ee][Dd][Pp][Oo][Tt][Aa][Tt][Oo]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.* --[Ee][Xx][Pp][Ll][Oo][Ii][Tt][Ii][Dd] .*/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=[Aa]75[Dd]7669[Dd][Bb]6[Bb]2[Ee]107[Aa]44[Cc]4057[Ff][Ff]7[Ff]7[Dd]6.*/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=[Ff]91624350[Ee]2[Cc]678[Cc]5[Dd][Cc][Bb][Ee]5[Ee]1[Ff]24[Ee]22[Cc]9.*/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=14[Cc]81850[Aa]079[Aa]87[Ee]83[Dd]50[Cc][Aa]41[Cc]709[Aa]15.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 6bd75993-9888-4f91-9404-e1e4e4e34b77
    name: HackTool - LocalPotato Execution
    reason: Sibling Potato local privilege escalation tool; operators try several.
  - id: 9bd04a79-dabe-4f1f-a5ff-92430265c96b
    name: Privilege Escalation via Named Pipe Impersonation
    reason: CoercedPotato abuses named-pipe impersonation to obtain SYSTEM.
  - id: cf0c254b-22f1-4b2b-8221-e137b3c0af94
    name: HackTool - Impersonate Execution
    reason: Token impersonation tool used for the same SeImpersonate escalation.
  - id: f89b08d0-77ad-4728-817b-9b16c5a69c7a
    name: HackTool - SharpImpersonation Execution
    reason: Alternative token impersonation tooling.
  - id: 97a80ec7-0e2f-4d05-9ef4-65760e634f6b
    name: Security Privileges Enumeration Via Whoami.EXE
    reason: 'Precursor: checking for SeImpersonatePrivilege before running a potato.'
  - id: c484e533-ee16-4a93-b6ac-f0ea4868b2f1
    name: HackTool - SharpUp PrivEsc Tool Execution
    reason: 'Precursor: privesc enumeration that finds the SeImpersonate path.'
  - id: 98b53e78-ebaf-46f8-be06-421aafd176d9
    name: HackTool - winPEAS Execution
    reason: 'Precursor: automated local privesc enumeration.'
  - id: 7c0dcd3d-acf8-4f71-9570-f448b0034f94
    name: PsExec Service Child Process Execution as LOCAL SYSTEM
    reason: 'Follow-on: SYSTEM-level execution after escalation.'
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Privilege enumeration before escalation
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ww][Hh][Oo][Aa][Mm][Ii].*\/([Pp][Rr][Ii][Vv]|[Aa][Ll][Ll]).*/ OR data_win_eventdata_commandLine:/.*[Ss]e[Ii]mpersonate[Pp]rivilege.*/ OR data_win_eventdata_commandLine:/.*[Ww][Ii][Nn][Pp][Ee][Aa][Ss].*/)
    pivot_on: host
    window: 4h
  - name: Other Potato or impersonation tooling
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Pp]otato.*\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Pp]rint[Ss]poofer.*/ OR data_win_eventdata_commandLine:/.*[Ee]fs[Pp]otato.*/)
    pivot_on: host
    window: 4h
  - name: Named pipe creation by suspicious process
    query: (data_win_system_eventID:"17" OR data_win_system_eventID:"18") AND (data_win_eventdata_image:/.*\\[Tt]emp\\.*/ OR data_win_eventdata_image:/.*\\[Pp]ublic\\.*/ OR data_win_eventdata_image:/.*\\[Pp]rogram[Dd]ata\\.*/ OR data_win_eventdata_image:/.*[Cc]oerced.*/)
    pivot_on: host
    window: 2h
  - name: SYSTEM children of the tool or temp binaries
    query: data_win_system_eventID:"1" AND data_win_eventdata_user:/.*[Ss][Yy][Ss][Tt][Ee][Mm]/ AND (data_win_eventdata_parentImage:/.*[Cc]oerced[Pp]otato.*/ OR data_win_eventdata_parentImage:/.*\\[Tt]emp\\.*/ OR data_win_eventdata_parentImage:/.*\\[Pp]ublic\\.*/)
    pivot_on: host
    window: 4h
  - name: Post-escalation persistence or credential dumping
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss].*\/[Cc][Rr][Ee][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Nn]et1? [Ll]ocalgroup [Aa]dministrators.*/ OR data_win_eventdata_commandLine:/.*[Ll]sass.*[Dd]ump.*/)
    pivot_on: host
    window: 4h
