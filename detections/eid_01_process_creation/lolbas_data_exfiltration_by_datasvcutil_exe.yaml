name: LOLBAS Data Exfiltration by DataSvcUtil.exe
id: e290b10b-1023-4452-a4a9-eb31a9013b3a
version: 1
schema_version: "1.0"
date: "2022-05-16"
author: Ialle Teixeira @teixeira0xfffff, Austin Songer @austinsonger
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: e290b10b-1023-4452-a4a9-eb31a9013b3a
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects when a user performs data exfiltration by using DataSvcUtil.exe. MITRE
  ATT&CK: T1567.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*/in:*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*/out:*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*/uri:*"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\DataSvcUtil.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "DataSvcUtil.exe"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*/in:*'; data_win_eventdata_commandLine matches '*/out:*';
  data_win_eventdata_commandLine matches '*/uri:*', among other conditions.

known_false_positives: >
  DataSvcUtil.exe being used may be performed by a system administrator.. Verify
  whether the user identity, user agent, and/or hostname should be making
  changes in your environment.. DataSvcUtil.exe being executed from unfamiliar
  users should be investigated. If known behavior is causing false positives, it
  can be exempted from the rule. Baseline expected activity in your environment
  and tune this detection before relying on it for automated response.

references:
  - https://gist.github.com/teixeira0xfffff/837e5bfed0d1b0a29a7cb1e5dbdd9ca6
  - https://learn.microsoft.com/en-us/previous-versions/dotnet/framework/data/wcf/wcf-data-service-client-utility-datasvcutil-exe
  - https://learn.microsoft.com/en-us/previous-versions/dotnet/framework/data/wcf/generating-the-data-service-client-library-wcf-data-services
  - https://learn.microsoft.com/en-us/previous-versions/dotnet/framework/data/wcf/how-to-add-a-data-service-reference-wcf-data-services
  - https://lolbas-project.github.io/lolbas/Binaries/DataSvcUtil/
  - https://attack.mitre.org/techniques/T1567/

response:
  message: >
    LOLBAS Data Exfiltration by DataSvcUtil.exe detected on host $agent_name$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1567
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1567
  custom_tags:
    - lolbas
    - exfiltration
    - datasvcutil
    - process_creation
    - sysmon
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*\/[Ii][Nn]:.*/ OR data_win_eventdata_commandLine:/.*\/[Oo][Uu][Tt]:.*/ OR data_win_eventdata_commandLine:/.*\/[Uu][Rr][Ii]:.*/) AND (data_win_eventdata_image:/.*\\[Dd][Aa][Tt][Aa][Ss][Vv][Cc][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Dd][Aa][Tt][Aa][Ss][Vv][Cc][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7d1aaf3d-4304-425c-b7c3-162055e0b3ab
    name: Potential Data Exfiltration Activity Via CommandLine Tools
    reason: Generic CLI exfil on the same host corroborates the DataSvcUtil upload.
  - id: e328cc73-f92a-42fb-b3fa-7c2cffda981a
    name: Curl File Upload To File Sharing Websites
    reason: Alternate upload channel used by the same actor for staged data.
  - id: 9fbf5927-5261-4284-a71d-f681029ea574
    name: Compress Data and Lock With Password for Exfiltration With 7-ZIP
    reason: Data is typically archived before being sent out.
  - id: faa48cae-6b25-4f00-a094-08947fef582f
    name: Rar Usage with Password and Compression Level
    reason: Password-protected archive staging precedes exfiltration.
  - id: 85a8e5ba-bd03-4bfb-bbfa-a4409a8f8b98
    name: Folder Compress To Potentially Suspicious Output Via Compress-Archive Cmdlet
    reason: PowerShell staging of data to a suspicious output location before sending.
  - id: 32e0baea-b3f1-11eb-a2ce-acde48001122
    name: Detect RClone Command-Line Usage
    reason: Cloud-sync exfil tooling often used alongside LOLBAS exfil.
  - id: 98a96a5a-64a0-4c42-92c5-489da3866cb0
    name: DNS Exfiltration and Tunneling Tools Execution
    reason: Alternative covert exfil channels by the same operator.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: DataSvcUtil and its command lines
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*[Dd]ata[Ss]vc[Uu]til\.exe/ OR data_win_eventdata_originalFileName:/[Dd]ata[Ss]vc[Uu]til\.exe/)
    pivot_on: host
    window: 4h
  - name: Archive creation before exfil
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(7z|7za|rar|WinRAR|zip|Compress-Archive|tar).*( a |-p|-hp|CompressionLevel|-czf).*/
    pivot_on: host
    window: 4h
  - name: Outbound connections to non-private destinations
    query: data_win_system_eventID:3 AND data_win_eventdata_initiated:true AND NOT data_win_eventdata_destinationIp:/(10|127|192\.168|172\.(1[6-9]|2[0-9]|3[01]))\..*/
    pivot_on: host
    window: 4h
  - name: Other exfil utilities
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(rclone|megacmd|curl.*(-T|--upload-file|-F )|Invoke-WebRequest.*-Method +Post).*/
    pivot_on: user
    window: 4h
  - name: Staging file collection
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(robocopy|xcopy|copy|dir).*(Documents|Desktop|\.xlsx|\.docx|\.pst|\.bak).*/
    pivot_on: user
    window: 6h
