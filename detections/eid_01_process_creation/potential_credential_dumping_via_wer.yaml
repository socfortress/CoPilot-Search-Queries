name: Potential Credential Dumping Via WER
id: 9a4ccd1a-3526-4d99-b980-9f9c5d3a6ff3
version: 1
schema_version: "1.0"
date: "2022-12-09"
author: "@pbssubhash , Nasreddine Bencherchali"
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 9a4ccd1a-3526-4d99-b980-9f9c5d3a6ff3
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential credential dumping via Windows Error Reporting LSASS
  Shtinkering technique which uses the Windows Error Reporting to dump lsass.
  MITRE ATT&CK: T1003.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\Werfault.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "WerFault.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_parentUser:
                    value: "*AUTHORI*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentUser:
                    value: "*AUTORI*"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_user:
                    value: "*AUTHORI*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_user:
                    value: "*AUTORI*"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* -u -p *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* -ip *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* -s *"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_parentImage"
        - bool:
            must_not:
              - term:
                  data_win_eventdata_parentImage:
                    value: "C:\\Windows\\System32\\lsass.exe"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_parentUser
    - data_win_eventdata_user
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\Werfault.exe'; data_win_eventdata_originalFileName equals 'WerFault.exe';
  data_win_eventdata_parentUser matches '*AUTHORI*', among other conditions.

known_false_positives: >
  Windows Error Reporting might produce similar behavior. In that case, check
  the PID associated with the "-p" parameter in the CommandLine. Baseline
  expected activity in your environment and tune this detection before relying
  on it for automated response.

references:
  - https://github.com/deepinstinct/Lsass-Shtinkering
  - https://media.defcon.org/DEF%20CON%2030/DEF%20CON%2030%20presentations/Asaf%20Gilboa%20-%20LSASS%20Shtinkering%20Abusing%20Windows%20Error%20Reporting%20to%20Dump%20LSASS.pdf
  - https://attack.mitre.org/techniques/T1003/001/

response:
  message: >
    Potential Credential Dumping Via WER detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1003.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.001
  custom_tags:
    - credential
    - dumping
    - process_creation
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ww][Ee][Rr][Ff][Aa][Uu][Ll][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ww][Ee][Rr][Ff][Aa][Uu][Ll][Tt]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_parentUser:/.*[Aa][Uu][Tt][Hh][Oo][Rr][Ii].*/ OR data_win_eventdata_parentUser:/.*[Aa][Uu][Tt][Oo][Rr][Ii].*/) AND (data_win_eventdata_user:/.*[Aa][Uu][Tt][Hh][Oo][Rr][Ii].*/ OR data_win_eventdata_user:/.*[Aa][Uu][Tt][Oo][Rr][Ii].*/) AND data_win_eventdata_commandLine:/.* -[Uu] -[Pp] .*/ AND data_win_eventdata_commandLine:/.* -[Ii][Pp] .*/ AND data_win_eventdata_commandLine:/.* -[Ss] .*/ AND _exists_:data_win_eventdata_parentImage AND NOT (data_win_eventdata_parentImage:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 1f0b4cac-9c81-41f4-95d0-8475ff46b3e2
    name: PPL Tampering Via WerFaultSecure
    reason: WerFaultSecure abuse is the sibling WER technique used to dump protected processes
  - id: fabfb3a7-3ce1-4445-9c7c-3c27f1051cdd
    name: Potential ReflectDebugger Content Execution Via WerFault.EXE
    reason: Other WerFault abuse by attackers on the same host
  - id: ffa6861c-4461-4f59-8a41-578c39f3f23e
    name: LSASS Dump Keyword In CommandLine
    reason: Explicit lsass dump intent corroborating the WER shtinkering
  - id: c8da0dfd-4ed0-4b68-962d-13c9c884384e
    name: Potential Credential Dumping Via LSASS Process Clone
    reason: Parallel lsass memory-capture technique tried by the same actor
  - id: ec570e53-4c76-45a9-804d-dc3f355ff7a7
    name: 7Zip Compressing Dump Files
    reason: Produced dump gets archived for exfiltration
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: Mimikatz/pypykatz parses the WER-produced dump
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: Alternative method commonly attempted if WER path is blocked
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: WerFault launched with dump arguments
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*\\[Ww]er[Ff]ault(Secure)?\.exe/ AND data_win_eventdata_commandLine:(*-s* OR *-pr* OR *-p*)
    pivot_on: host
    window: 2h
  - name: lsass dump files written
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(*.dmp OR *lsass*)
    pivot_on: host
    window: 2h
  - name: Process access to lsass
    query: data_win_system_eventID:10 AND data_win_eventdata_targetImage:/.*\\lsass\.exe/
    pivot_on: host
    window: 2h
  - name: WER LocalDumps registry changes
    query: data_win_system_eventID:(12 OR 13) AND data_win_eventdata_targetObject:(*Windows\ Error\ Reporting* OR *LocalDumps*)
    pivot_on: host
    window: 24h
  - name: Parsing or exfiltration of dumps
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(*sekurlsa* OR *pypykatz* OR (*.dmp* AND (*7z* OR *curl* OR *rar*)))
    pivot_on: host
    window: 6h
