name: GetDomainComputer with PowerShell
id: ed550c19-712e-43f6-bd19-6f58f61b3a5e
version: 1
schema_version: "1.0"
date: "2026-04-27"
author: SOCFortress LLC
status: production
type: TTP

description: >
  This analytic detects the execution of powershell.exe or pwsh.exe with
  the Get-DomainComputer function referenced in the command line.
  Sysmon EventID 1 is used to match process creation events where the
  image or OriginalFileName is one of the PowerShell binaries AND the
  command line contains Get-DomainComputer. Get-DomainComputer is a
  function from PowerSploit/PowerView - a well-known offensive
  PowerShell toolkit - used to enumerate Active Directory computer
  objects (workstations, servers, domain controllers). This is
  distinct from Microsoft's Get-ADComputer cmdlet (covered separately)
  and the presence of this PowerSploit-specific function name in a
  command line is a strong indicator of attacker tooling rather than
  legitimate administrative activity. This activity is significant as
  it indicates potential reconnaissance efforts by adversaries to map
  out domain computer assets - a hallmark of offensive AD discovery
  toolkits during the early phases of an intrusion. This is a known
  T1018 (Remote System Discovery) technique. If confirmed malicious,
  this activity could allow attackers to map out the network, identify
  critical systems (domain controllers, file servers, database hosts),
  and plan further attacks potentially leading to unauthorized access
  and data exfiltration.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image: "*powershell*.exe"
              - wildcard:
                  data_win_eventdata_image: "*pwsh.exe"
              - term:
                  data_win_eventdata_originalFileName: "PowerShell.EXE"
              - term:
                  data_win_eventdata_originalFileName: "pwsh.dll"
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*Get-DomainComputer*"
              case_insensitive: true
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_parentCommandLine
    - data_win_eventdata_user
    - data_win_eventdata_processId
    - data_win_eventdata_processGuid
    - data_win_eventdata_parentProcessId
    - data_win_eventdata_parentProcessGuid
    - data_win_eventdata_hashes
    - data_win_eventdata_integrityLevel
    - data_win_eventdata_currentDirectory

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-27 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-27 23:59:59.999"

how_to_implement: >
  This detection requires Sysmon EventID 1 (Process Creation) logs to be forwarded
  from Windows endpoints to Wazuh Indexer. Ensure Sysmon is deployed with a
  configuration that captures Image, OriginalFileName, and CommandLine fields
  (SwiftOnSecurity or Olaf Hartong Sysmon modular config recommended). The
  detection matches PowerShell binaries (powershell.exe or pwsh.exe) by
  Image path or PE OriginalFileName, combined with Get-DomainComputer in
  the command line. Case-insensitive matching is used on the function
  name to handle PowerShell's flexible casing. The ES DSL uses
  case_insensitive wildcard option (OpenSearch 2.x / Elasticsearch
  7.10+); Graylog equivalent uses character classes. For deeper coverage,
  also enable PowerShell Script Block Logging (EventID 4104) and
  correlate against the same function name in script blocks - script
  block logging will catch in-memory PowerSploit imports that don't
  appear on the command line.

known_false_positives: >
  Get-DomainComputer is a PowerSploit/PowerView offensive function, not
  a built-in Microsoft cmdlet, so legitimate administrative use is
  rare. Penetration testers, Red Teamers, and authorized internal
  security assessors may produce true-positive alerts that are not
  malicious - these should be tuned via approved-source allow-listing
  (specific parent process or user account) rather than removing the
  detection.

references:
  - https://attack.mitre.org/techniques/T1018/
  - https://powersploit.readthedocs.io/en/latest/Recon/Get-DomainComputer/

response:
  message: >
    PowerSploit Get-DomainComputer remote system discovery was
    identified on endpoint $agent_name$ by user
    $data_win_eventdata_user$. Process image: $data_win_eventdata_image$.
    Parent process: $data_win_eventdata_parentImage$. Command line:
    $data_win_eventdata_commandLine$. This is a high-confidence
    indicator of offensive AD toolkit usage - PowerSploit/PowerView
    function names are not legitimate Microsoft cmdlets and warrant
    immediate investigation, including review of parent process
    lineage, in-memory PowerShell module loads, and concurrent
    discovery activity.
  risk_score: 72
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 60
    - field: data_win_eventdata_user
      type: user
      score: 60
  threat_objects:
    - field: data_win_eventdata_image
      type: process_name
    - field: data_win_eventdata_parentImage
      type: parent_process_name
    - field: data_win_eventdata_commandLine
      type: command_line

tags:
  analytic_story:
    - Active Directory Discovery
    - Active Directory Reconnaissance
    - Remote System Discovery
    - PowerSploit
    - PowerView
    - Offensive PowerShell Toolkit
  asset_type: Endpoint
  mitre_attack_id:
    - T1018
  custom_tags:
    - powershell
    - powersploit
    - powerview
    - get_domaincomputer
    - active_directory
    - ad_enumeration
    - reconnaissance
    - remote_system_discovery
    - lateral_movement_precursor
    - offensive_toolkit
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*\.exe.*/ OR data_win_eventdata_image:/.*[Pp][Ww][Ss][Hh]\.exe.*/ OR data_win_eventdata_originalFileName:"PowerShell.EXE" OR data_win_eventdata_originalFileName:"pwsh.dll") AND data_win_eventdata_commandLine:/.*[Gg][Ee][Tt]\-[Dd][Oo][Mm][Aa][Ii][Nn][Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 435e10e4-992a-4281-96f3-38b11106adde
    name: Computer Discovery And Export Via Get-ADComputer Cmdlet
    reason: Microsoft-cmdlet equivalent of computer enumeration; fallback if PowerView is blocked
  - id: 868ee0e4-52ab-484a-833a-6d85b7c028d0
    name: GetDomainController with PowerShell
    reason: PowerView DC enumeration commonly run in the same session
  - id: 93c94be3-bead-4a60-860f-77ca3fe59903
    name: GetDomainGroup with PowerShell
    reason: PowerView group enumeration from the same toolkit
  - id: 9a5a41d6-04e7-11ec-923c-acde48001122
    name: Get DomainUser with PowerShell
    reason: User enumeration completes the domain survey with computers and groups
  - id: 4fa7f846-054a-11ec-a836-acde48001122
    name: Get-DomainTrust with PowerShell
    reason: Trust mapping rounds out PowerView domain reconnaissance
  - id: f376c8a7-a2d0-4ddc-aa0c-16c17236d962
    name: HackTool - Bloodhound/Sharphound Execution
    reason: BloodHound/SharpHound is the automated counterpart of this manual host mapping
  - id: 514e7e3e-b3b4-4a67-af60-be20f139198b
    name: PUA - AdFind.EXE Execution
    reason: AdFind computer enumeration is a common parallel tool in the same intrusions
  - id: d679950c-abb7-43a6-80fb-2a480c4fc450
    name: PDQ Deploy Remote Adminstartion Tool Execution
    reason: Remote administration tooling often used to reach discovered hosts
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other PowerView and PowerSploit functions
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Gg]et\-(Domain|Net)(User|Group|Computer|Controller|Trust|Forest|Policy|Share|Session|LoggedOn|GPO|OU|Subnet)|[Ff]ind\-(LocalAdminAccess|DomainShare|InterestingFile)|[Ii]nvoke\-(ShareFinder|UserHunter|Kerberoast)|[Pp]ower[Vv]iew|[Pp]ower[Ss]ploit).*/
    pivot_on: host
    window: 4h
  - name: Download cradle or in-memory tool import
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Dd]ownload[Ss]tring|[Ii]nvoke\-[Ww]eb[Rr]equest|[Nn]et\.[Ww]eb[Cc]lient|[Ii]mport\-[Mm]odule.*\.ps1|[Ff]rom[Bb]ase64[Ss]tring).*/
    pivot_on: host
    window: 2h
  - name: Network and share discovery tools
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*(net1? +view|nltest|[Aa]d[Ff]ind|[Ss]harp[Hh]ound|[Ss]harp[Ss]hares|[Nn]map|[Tt]est\-[Nn]et[Cc]onnection).*/
    pivot_on: host
    window: 4h
  - name: Remote execution toward discovered hosts
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Pp]s[Ee]xec|[Ww]inrs|[Ee]nter\-[Pp][Ss][Ss]ession|[Ii]nvoke\-[Cc]ommand +\-[Cc]omputer|[Ww]mic.*\/[Nn][Oo][Dd][Ee]).*/
    pivot_on: host
    window: 24h
  - name: Credential access activity
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ss]ekurlsa|[Ll]sadump|[Rr]ubeus|[Kk]erberoast|[Cc]omsvcs.*[Mm]ini[Dd]ump|[Pp]rocdump.*[Ll]sass).*/
    pivot_on: host
    window: 24h
