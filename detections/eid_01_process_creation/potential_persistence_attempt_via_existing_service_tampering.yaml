name: Potential Persistence Attempt Via Existing Service Tampering
id: 38879043-7e1e-47a9-8d46-6bec88e201df
version: 1
schema_version: "1.0"
date: "2023-02-04"
author: Sreeman
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 38879043-7e1e-47a9-8d46-6bec88e201df
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the modification of an existing service in order to execute an
  arbitrary payload when the service is started or killed as a potential method
  for persistence. MITRE ATT&CK: T1543.003, T1574.011.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*sc *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*config *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*binpath=*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*sc *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*failure*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*command=*"
                          case_insensitive: true
              - bool:
                  must:
                    - bool:
                        should:
                          - bool:
                              must:
                                - wildcard:
                                    data_win_eventdata_commandLine:
                                      value: "*reg *"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_commandLine:
                                      value: "*add *"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_commandLine:
                                      value: "*FailureCommand*"
                                      case_insensitive: true
                          - bool:
                              must:
                                - wildcard:
                                    data_win_eventdata_commandLine:
                                      value: "*reg *"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_commandLine:
                                      value: "*add *"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_commandLine:
                                      value: "*ImagePath*"
                                      case_insensitive: true
                        minimum_should_match: 1
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*.sh*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*.exe*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*.dll*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*.bin$*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*.bat*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*.cmd*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*.js*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*.msh$*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*.reg$*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*.scr*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*.ps*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*.vb*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*.jar*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*.pl*"
                                case_insensitive: true
                        minimum_should_match: 1
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches '*sc
  *'; data_win_eventdata_commandLine matches '*config *';
  data_win_eventdata_commandLine matches '*binpath=*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://pentestlab.blog/2020/01/22/persistence-modify-existing-service/
  - https://attack.mitre.org/techniques/T1543/003/
  - https://attack.mitre.org/techniques/T1574/011/

response:
  message: >
    Potential Persistence Attempt Via Existing Service Tampering detected on
    host $agent_name$. Matched data_win_eventdata_commandLine:
    $data_win_eventdata_commandLine$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1543.003, T1574.011
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1543.003
    - T1574.011
  custom_tags:
    - persistence
    - existing
    - service
    - process_creation
    - sysmon
    - privilege_escalation
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND ((data_win_eventdata_commandLine:/.*[Ss][Cc] .*/ AND data_win_eventdata_commandLine:/.*[Cc][Oo][Nn][Ff][Ii][Gg] .*/ AND data_win_eventdata_commandLine:/.*[Bb][Ii][Nn][Pp][Aa][Tt][Hh]=.*/) OR (data_win_eventdata_commandLine:/.*[Ss][Cc] .*/ AND data_win_eventdata_commandLine:/.*[Ff][Aa][Ii][Ll][Uu][Rr][Ee].*/ AND data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Mm][Aa][Nn][Dd]=.*/) OR (((data_win_eventdata_commandLine:/.*[Rr][Ee][Gg] .*/ AND data_win_eventdata_commandLine:/.*[Aa][Dd][Dd] .*/ AND data_win_eventdata_commandLine:/.*[Ff][Aa][Ii][Ll][Uu][Rr][Ee][Cc][Oo][Mm][Mm][Aa][Nn][Dd].*/) OR (data_win_eventdata_commandLine:/.*[Rr][Ee][Gg] .*/ AND data_win_eventdata_commandLine:/.*[Aa][Dd][Dd] .*/ AND data_win_eventdata_commandLine:/.*[Ii][Mm][Aa][Gg][Ee][Pp][Aa][Tt][Hh].*/)) AND (data_win_eventdata_commandLine:/.*\.[Ss][Hh].*/ OR data_win_eventdata_commandLine:/.*\.[Ee][Xx][Ee].*/ OR data_win_eventdata_commandLine:/.*\.[Dd][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*\.[Bb][Ii][Nn]\$.*/ OR data_win_eventdata_commandLine:/.*\.[Bb][Aa][Tt].*/ OR data_win_eventdata_commandLine:/.*\.[Cc][Mm][Dd].*/ OR data_win_eventdata_commandLine:/.*\.[Jj][Ss].*/ OR data_win_eventdata_commandLine:/.*\.[Mm][Ss][Hh]\$.*/ OR data_win_eventdata_commandLine:/.*\.[Rr][Ee][Gg]\$.*/ OR data_win_eventdata_commandLine:/.*\.[Ss][Cc][Rr].*/ OR data_win_eventdata_commandLine:/.*\.[Pp][Ss].*/ OR data_win_eventdata_commandLine:/.*\.[Vv][Bb].*/ OR data_win_eventdata_commandLine:/.*\.[Jj][Aa][Rr].*/ OR data_win_eventdata_commandLine:/.*\.[Pp][Ll].*/)))

