ta_win_eventdata_commandLine:/.*[Nn][Aa][Rr][Rr][Aa][Tt][Oo][Rr].*/ OR data_win_eventdata_commandLine:/.*[Oo][Ss][Kk].*/ OR data_win_eventdata_commandLine:/.*[Oo][Vv][Ee][Rr][Ll][Aa][Pp][Pp][Ee][Dd][Cc][Oo][Nn][Tt][Ee][Nn][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ss][Hh][Oo][Ww][Ss][Oo][Uu][Nn][Dd][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ss][Oo][Uu][Nn][Dd][Ss][Ee][Nn][Tt][Rr][Yy].*/ OR data_win_eventdata_commandLine:/.*[Ss][Pp][Ee][Ee][Cc][Hh][Rr][Ee][Cc][Oo].*/ OR data_win_eventdata_commandLine:/.*[Ss][Tt][Ii][Cc][Kk][Yy][Kk][Ee][Yy][Ss].*/ OR data_win_eventdata_commandLine:/.*[Tt][Oo][Gg][Gg][Ll][Ee][Kk][Ee][Yy][Ss].*/ OR data_win_eventdata_commandLine:/.*[Vv][Oo][Ii][Cc][Ee][Aa][Cc][Cc][Ee][Ss][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ww][Ii][Nn][Dd][Oo][Ww][Aa][Rr][Rr][Aa][Nn][Gg][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Ww][Ii][Nn][Dd][Oo][Ww][Tt][Rr][Aa][Cc][Kk][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Ww][Ii][Nn][Dd][Oo][Ww][Tt][Rr][Aa][Cc][Kk][Ii][Nn][Gg][Tt][Ii][Mm][Ee][Oo][Uu][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ww][Ii][Nn][Dd][Oo][Ww][Tt][Rr][Aa][Cc][Kk][Ii][Nn][Gg][Zz][Oo][Rr][Dd][Ee][Rr].*/) AND _exists_:data_win_eventdata_commandLine AND NOT (data_win_eventdata_commandLine:/.*[Oo][Rr][Aa][Cc][Ll][Ee]_[Jj][Aa][Vv][Aa][Aa][Cc][Cc][Ee][Ss][Ss][Bb][Rr][Ii][Dd][Gg][Ee].*/)

correlation:
  # Authored by the correlation engine for review.
  enrichment_searches:
  # NEW ad-hoc searches the engine runs around an alert from this rule, scoped to
  # the alert's host/user/IP within the window (not existing CoPilot Searches).
    - name: "Sysmon activity on this host in the window"
      query: 'data_win_system_channel:"Microsoft-Windows-Sysmon/Operational"'
      pivot_on: [host]
      window: 1h
    - name: "Process creation on this host"
      query: 'data_win_system_eventID:"1"'
      pivot_on: [host]
      window: 1h
    - name: "Network connections from this host"
      query: 'data_win_system_eventID:"3"'
      pivot_on: [host]
      window: 1h
    - name: "High-severity alerts on this host"
      query: 'rule_level:>=10'
      pivot_on: [host]
      window: 1h
