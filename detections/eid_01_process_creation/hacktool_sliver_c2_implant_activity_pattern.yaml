name: HackTool - Sliver C2 Implant Activity Pattern
id: 42333b2c-b425-441c-b70e-99404a17170f
version: 1
schema_version: "1.0"
date: "2023-03-05"
author: Nasreddine Bencherchali (Nextron Systems), Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 42333b2c-b425-441c-b70e-99404a17170f
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects process activity patterns as seen being used by Sliver C2 framework
  implants. MITRE ATT&CK: T1059.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*-NoExit -Command [Console]::OutputEncoding=[Text.UTF8Encoding]::UTF8*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*-NoExit -Command [Console]::OutputEncoding=[Text.UTF8Encoding]::UTF8*'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/BishopFox/sliver/blob/79f2d48fcdfc2bee4713b78d431ea4b27f733f30/implant/sliver/shell/shell_windows.go#L36
  - https://www.microsoft.com/security/blog/2022/08/24/looking-for-the-sliver-lining-hunting-for-emerging-command-and-control-frameworks/
  - https://attack.mitre.org/techniques/T1059/

response:
  message: >
    HackTool - Sliver C2 Implant Activity Pattern detected on host $agent_name$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1059
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059
  custom_tags:
    - hacktool
    - sliver
    - implant
    - process_creation
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*-[Nn][Oo][Ee][Xx][Ii][Tt] -[Cc][Oo][Mm][Mm][Aa][Nn][Dd] \[[Cc][Oo][Nn][Ss][Oo][Ll][Ee]\]::[Oo][Uu][Tt][Pp][Uu][Tt][Ee][Nn][Cc][Oo][Dd][Ii][Nn][Gg]=\[[Tt][Ee][Xx][Tt]\.[Uu][Tt][Ff]8[Ee][Nn][Cc][Oo][Dd][Ii][Nn][Gg]\]::[Uu][Tt][Ff]8.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a7c3d773-caef-227e-a7e7-c2f13c622329
    name: Bad Opsec Defaults Sacrificial Processes With Improper Arguments
    reason: Sacrificial processes with improper arguments are the fork-and-run post-exploitation style C2 frameworks like Sliver use
  - id: 15619216-e993-4721-b590-4c520615a67d
    name: Potential Meterpreter/CobaltStrike Activity
    reason: Meterpreter/CobaltStrike-style getsystem and service patterns commonly follow an implant gaining a foothold
  - id: f35c5d71-b489-4e22-a115-f003df287317
    name: Potential CobaltStrike Process Patterns
    reason: Generic C2 process patterns overlap Sliver's execute-assembly and spawn behaviour
  - id: 6309645e-122d-4c5b-bb2b-22e4f9c2fa42
    name: HackTool - Potential CobaltStrike Process Injection
    reason: Remote-thread injection into other processes is how implants migrate and hide post-exploitation
  - id: ee18ed37-0802-4268-9435-b3b91aaa18db
    name: PowerShell - Connect To Internet With Hidden Window
    reason: PowerShell with hidden window connecting out is a common implant shell/staging pattern
  - id: 20384606-a124-4fec-acbb-8bd373728613
    name: Suspicious Network Connection Binary No CommandLine
    reason: A network connection by a binary with no command line is typical of injected or beaconing implants
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Implant PowerShell console shell with NoExit
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:(/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:(/.*[Nn][Oo][Ee][Xx][Ii][Tt].*/)
    pivot_on: host
    window: 4h
  - name: Beaconing outbound connections from LOLBin hosts
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:"true" AND data_win_eventdata_image:(/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR /.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR /.*\\[Dd][Ll][Ll][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ OR /.*\\[Ss][Pp][Oo][Oo][Ll][Ss][Vv]\.[Ee][Xx][Ee]/ OR /.*\\[Ww][Ee][Rr][Ff][Aa][Uu][Ll][Tt]\.[Ee][Xx][Ee]/)
    pivot_on: host
    window: 4h
  - name: Remote thread creation into system processes
    query: data_win_system_eventID:"8" AND data_win_eventdata_targetImage:(/.*\\[Ss][Pp][Oo][Oo][Ll][Ss][Vv]\.[Ee][Xx][Ee]/ OR /.*\\[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]\.[Ee][Xx][Ee]/ OR /.*\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ OR /.*\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\.[Ee][Xx][Ee]/)
    pivot_on: host
    window: 4h
  - name: Discovery commands after implant start
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:(/.*\\[Ww][Hh][Oo][Aa][Mm][Ii]\.[Ee][Xx][Ee]/ OR /.*\\[Nn][Ee][Tt]\.[Ee][Xx][Ee]/ OR /.*\\[Nn][Ll][Tt][Ee][Ss][Tt]\.[Ee][Xx][Ee]/ OR /.*\\[Ii][Pp][Cc][Oo][Nn][Ff][Ii][Gg]\.[Ee][Xx][Ee]/ OR /.*\\[Tt][Aa][Ss][Kk][Ll][Ii][Ss][Tt]\.[Ee][Xx][Ee]/)
    pivot_on: host
    window: 4h
  - name: Persistence set by implant
    query: (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*(CurrentVersion\\Run|Services\\.*\\ImagePath).*/) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:(/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:(/.*\/[Cc][Rr][Ee][Aa][Tt][Ee].*/))
    pivot_on: host
    window: 4h
