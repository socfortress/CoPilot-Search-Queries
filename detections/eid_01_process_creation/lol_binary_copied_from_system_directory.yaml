name: LOL-Binary Copied From System Directory
id: f5d19838-41b5-476c-98d8-ba8af4929ee2
version: 1
schema_version: "1.0"
date: "2025-11-27"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: f5d19838-41b5-476c-98d8-ba8af4929ee2
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a suspicious copy operation that tries to copy a known LOLBIN from
  system (System32, SysWOW64, WinSxS) directories to another on disk in order to
  bypass detections based on locations. MITRE ATT&CK: T1036.003.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\cmd.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*copy *"
                          case_insensitive: true
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\powershell.exe"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\pwsh.exe"
                                case_insensitive: true
                        minimum_should_match: 1
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*copy-item*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* copy *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*cpi *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* cp *"
                                case_insensitive: true
                        minimum_should_match: 1
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\robocopy.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\xcopy.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "robocopy.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "XCOPY.EXE"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\System32*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\SysWOW64*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\WinSxS*"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\bitsadmin.exe*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\calc.exe*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\certutil.exe*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\cmdl32.exe*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\cscript.exe*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\mshta.exe*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\rundll32.exe*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\wscript.exe*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\ie4uinit.exe*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_originalFileName
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches '*\cmd.exe';
  data_win_eventdata_commandLine matches '*copy *'; data_win_eventdata_image
  matches '*\powershell.exe', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.hybrid-analysis.com/sample/8da5b75b6380a41eee3a399c43dfe0d99eeefaa1fd21027a07b1ecaa4cd96fdd?environmentId=120
  - https://web.archive.org/web/20180331144337/https://www.fireeye.com/blog/threat-research/2018/03/sanny-malware-delivery-method-updated-in-recently-observed-attacks.html
  - https://thedfirreport.com/2023/08/28/html-smuggling-leads-to-domain-wide-ransomware/
  - https://www.virustotal.com/gui/file/14e722855605ba78dc1d21153f0e1be90e7528149f2cd2d7d6eba8ef27534bdc/behavior
  - https://attack.mitre.org/techniques/T1036/003/

response:
  message: >
    LOL-Binary Copied From System Directory detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1036.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1036.003
  custom_tags:
    - binary
    - copied
    - system
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Cc][Oo][Pp][Yy] .*/) OR ((data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Pp][Yy]-[Ii][Tt][Ee][Mm].*/ OR data_win_eventdata_commandLine:/.* [Cc][Oo][Pp][Yy] .*/ OR data_win_eventdata_commandLine:/.*[Cc][Pp][Ii] .*/ OR data_win_eventdata_commandLine:/.* [Cc][Pp] .*/)) OR data_win_eventdata_image:/.*\\[Rr][Oo][Bb][Oo][Cc][Oo][Pp][Yy]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Xx][Cc][Oo][Pp][Yy]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Rr][Oo][Bb][Oo][Cc][Oo][Pp][Yy]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Xx][Cc][Oo][Pp][Yy]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*\\[Ss][Yy][Ss][Tt][Ee][Mm]32.*/ OR data_win_eventdata_commandLine:/.*\\[Ss][Yy][Ss][Ww][Oo][Ww]64.*/ OR data_win_eventdata_commandLine:/.*\\[Ww][Ii][Nn][Ss][Xx][Ss].*/) AND (data_win_eventdata_commandLine:/.*\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_commandLine:/.*\\[Cc][Aa][Ll][Cc]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_commandLine:/.*\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_commandLine:/.*\\[Cc][Mm][Dd][Ll]32\.[Ee][Xx][Ee].*/ OR data_win_eventdata_commandLine:/.*\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_commandLine:/.*\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_commandLine:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee].*/ OR data_win_eventdata_commandLine:/.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_commandLine:/.*\\[Ii][Ee]4[Uu][Ii][Nn][Ii][Tt]\.[Ee][Xx][Ee].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 36480ae1-a1cb-4eaa-a0d6-29801d7e9142
    name: Potential Defense Evasion Via Binary Rename
    reason: Copying a LOLBIN out of System32 is the setup for running it renamed/out of place.
  - id: d4ca7c59-e9e4-42d8-bf57-91a776efcb87
    name: LOLBIN Execution From Abnormal Drive
    reason: The copied binary is then executed from an unusual location or drive.
  - id: 2569ed8c-1147-498a-9b8c-2ad3656b10ed
    name: Potential Renamed Rundll32 Execution
    reason: Common copy-then-rename target; execution of the copy is the follow-on.
  - id: 7530cd3d-7671-43e3-b209-976966f6ea48
    name: Renamed CURL.EXE Execution
    reason: Copied curl run under another name for download or exfil.
  - id: 8f45fcf0-5b68-11eb-ae93-0242ac130002
    name: Detect mshta renamed
    reason: Copied mshta executed under a new name to run script payloads.
  - id: 3f7f5b0b-5b16-476c-a85f-ab477f6dd24b
    name: Lazarus System Binary Masquerading
    reason: Same masquerading technique with system binaries in a known intrusion set.
  - id: 855bc8b5-2ae8-402e-a9ed-b889e6df1900
    name: Copy From Or To Admin Share Or Sysvol Folder
    reason: Copy-based staging of tools across hosts often pairs with local LOLBIN copying.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: LOLBIN original names running outside system dirs
    query: data_win_system_eventID:1 AND data_win_eventdata_originalFileName:("certutil.exe" OR "bitsadmin.exe" OR "mshta.exe" OR "rundll32.exe" OR "regsvr32.exe" OR "cscript.exe" OR "wscript.exe" OR "curl.exe" OR "powershell.exe") AND NOT data_win_eventdata_image:/.*\\(System32|SysWOW64|WinSxS)\\.*/
    pivot_on: host
    window: 2h
  - name: Executables dropped in user-writable dirs
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*(\\Temp\\|\\Users\\Public\\|\\ProgramData\\|\\AppData\\).*\.exe/
    pivot_on: host
    window: 2h
  - name: Copy commands sourcing system binaries
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(copy|xcopy|robocopy|Copy-Item).*(System32|SysWOW64|WinSxS).*/
    pivot_on: user
    window: 2h
  - name: Network activity by non-standard binaries
    query: data_win_system_eventID:3 AND NOT data_win_eventdata_image:/.*\\(System32|SysWOW64|Program Files).*/
    pivot_on: host
    window: 2h
