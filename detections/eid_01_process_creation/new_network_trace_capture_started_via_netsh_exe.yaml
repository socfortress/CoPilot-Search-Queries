name: New Network Trace Capture Started Via Netsh.EXE
id: d3c3861d-c504-4c77-ba55-224ba82d0118
version: 1
schema_version: "1.0"
date: "2023-02-13"
author: Kutepov Anton, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: d3c3861d-c504-4c77-ba55-224ba82d0118
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of netsh with the "trace" flag in order to start a
  network capture. MITRE ATT&CK: T1040.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\netsh.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "netsh.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*trace*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*start*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\netsh.exe'; data_win_eventdata_originalFileName equals 'netsh.exe';
  data_win_eventdata_commandLine matches '*trace*', among other conditions.

known_false_positives: >
  Legitimate administration activity. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://blogs.msdn.microsoft.com/canberrapfe/2012/03/30/capture-a-network-trace-without-installing-anything-capture-a-network-trace-of-a-reboot/
  - https://klausjochem.me/2016/02/03/netsh-the-cyber-attackers-tool-of-choice/
  - https://attack.mitre.org/techniques/T1040/

response:
  message: >
    New Network Trace Capture Started Via Netsh.EXE detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1040
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1040
  custom_tags:
    - network
    - trace
    - capture
    - process_creation
    - sysmon
    - discovery
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Nn][Ee][Tt][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Nn][Ee][Tt][Ss][Hh]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Tt][Rr][Aa][Cc][Ee].*/ AND data_win_eventdata_commandLine:/.*[Ss][Tt][Aa][Rr][Tt].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: f956c7c1-0f60-4bc5-b7d7-b39ab3c08908
    name: PktMon.EXE Execution
    reason: alternate built-in packet capture used for the same sniffing goal
  - id: ba1f7802-adc7-48b4-9ecb-81e227fddfd5
    name: Potential Network Sniffing Activity Using Network Tools
    reason: other sniffing tools run alongside or instead of netsh trace
  - id: 42b1a5b8-353f-4f10-b256-39de4467faff
    name: Harvesting Of Wifi Credentials Via Netsh.EXE
    reason: same actor harvesting network secrets via netsh
  - id: 322ed9ec-fcab-4f67-9a34-e7c6aef43614
    name: New Port Forwarding Rule Added Via Netsh.EXE
    reason: netsh abuse for traffic interception or relay on the same host
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: netsh trace stop and capture output
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*[Nn]etsh.*[Tt]race.*(stop|convert|\.etl).*/
    pivot_on: host
    window: 4h
  - name: Capture files written
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\.(etl|cab|pcap|pcapng)/
    pivot_on: host
    window: 4h
  - name: Other packet capture tools
    query: data_win_system_eventID:1 AND data_win_eventdata_image:(*[Pp]ktmon.exe OR *[Dd]umpcap.exe OR *[Tt]shark.exe OR *[Ww]ireshark.exe)
    pivot_on: host
    window: 4h
  - name: Archive or exfil of capture files
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(*.etl* AND (*7z* OR *rar* OR *Compress-Archive* OR *curl* OR *certutil* OR *bitsadmin*))
    pivot_on: host
    window: 6h
