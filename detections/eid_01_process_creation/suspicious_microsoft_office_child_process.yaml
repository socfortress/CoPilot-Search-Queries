description: >
  Detects a suspicious process spawning from one of the Microsoft Office suite
  products (Word, Excel, PowerPoint, Publisher, Visio, etc.). MITRE ATT&CK:
  T1047, T1204.002, T1218.010.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\EQNEDT32.EXE"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\EXCEL.EXE"
                    case_insensitive: true
              - wildcard:
