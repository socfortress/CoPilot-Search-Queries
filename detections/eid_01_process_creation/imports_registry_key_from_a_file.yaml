name: Imports Registry Key From a File
id: 73bba97f-a82d-42ce-b315-9182e76c57b1
version: 1
schema_version: "1.0"
date: "2024-03-13"
author: Oddvar Moe, Sander Wiebing, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 73bba97f-a82d-42ce-b315-9182e76c57b1
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the import of the specified file to the registry with regedit.exe.
  MITRE ATT&CK: T1112.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\regedit.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "REGEDIT.EXE"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /i *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /s *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.reg*"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_commandLine"
        - bool:
            must_not:
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* -e *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* /e *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* –e *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* —e *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* ―e *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* -a *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* /a *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* –a *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* —a *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* ―a *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* -c *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* /c *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* –c *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* —c *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* ―c *"
                                case_insensitive: true
                        minimum_should_match: 1
                    - regexp:
                        data_win_eventdata_commandLine: ".*(:[^ \\\\]).*"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\regedit.exe'; data_win_eventdata_originalFileName equals 'REGEDIT.EXE';
  data_win_eventdata_commandLine matches '* /i *', among other conditions.

known_false_positives: >
  Legitimate import of keys. Evernote. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://lolbas-project.github.io/lolbas/Binaries/Regedit/
  - https://gist.github.com/api0cradle/cdd2d0d0ec9abb686f0e89306e277b8f
  - https://attack.mitre.org/techniques/T1112/

response:
  message: >
    Imports Registry Key From a File detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1112
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
  custom_tags:
    - imports
    - registry
    - process_creation
    - sysmon
    - persistence
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Rr][Ee][Gg][Ee][Dd][Ii][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Rr][Ee][Gg][Ee][Dd][Ii][Tt]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.* \/[Ii] .*/ OR data_win_eventdata_commandLine:/.* \/[Ss] .*/ OR data_win_eventdata_commandLine:/.*\.[Rr][Ee][Gg].*/) AND _exists_:data_win_eventdata_commandLine AND NOT ((data_win_eventdata_commandLine:/.* -[Ee] .*/ OR data_win_eventdata_commandLine:/.* \/[Ee] .*/ OR data_win_eventdata_commandLine:/.* –[Ee] .*/ OR data_win_eventdata_commandLine:/.* —[Ee] .*/ OR data_win_eventdata_commandLine:/.* ―[Ee] .*/ OR data_win_eventdata_commandLine:/.* -[Aa] .*/ OR data_win_eventdata_commandLine:/.* \/[Aa] .*/ OR data_win_eventdata_commandLine:/.* –[Aa] .*/ OR data_win_eventdata_commandLine:/.* —[Aa] .*/ OR data_win_eventdata_commandLine:/.* ―[Aa] .*/ OR data_win_eventdata_commandLine:/.* -[Cc] .*/ OR data_win_eventdata_commandLine:/.* \/[Cc] .*/ OR data_win_eventdata_commandLine:/.* –[Cc] .*/ OR data_win_eventdata_commandLine:/.* —[Cc] .*/ OR data_win_eventdata_commandLine:/.* ―[Cc] .*/) AND data_win_eventdata_commandLine:/.*(:[^ \\]).*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 62e0298b-e994-4189-bc87-bc699aa62d97
    name: Potential Suspicious Registry File Imported Via Reg.EXE
    reason: Same .reg import technique through reg.exe; operators switch between regedit and reg.
  - id: 0b80ade5-6997-4b1d-99a1-71701778ea61
    name: Imports Registry Key From an ADS
    reason: Variant hiding the .reg file in an alternate data stream.
  - id: de587dce-915e-4218-aac4-835ca6af6f70
    name: Potential Persistence Attempt Via Run Keys Using Reg.EXE
    reason: Run-key persistence is the most common payload of an imported .reg file.
  - id: 24357373-078f-44ed-9ac4-6d334a668a11
    name: Direct Autorun Keys Modification
    reason: Autorun key writes are the registry-side effect of the import.
  - id: 48917adc-a28e-4f5d-b729-11e75da8941f
    name: Suspicious Windows Defender Folder Exclusion Added Via Reg.EXE
    reason: Defender exclusions are also pushed through imported registry files.
  - id: 452bce90-6fb0-43cc-97a5-affc283139b3
    name: Suspicious Windows Defender Registry Key Tampering Via Reg.EXE
    reason: Security-tool disablement delivered by registry import.
  - id: 0d5675be-bc88-4172-86d3-1e96a4476536
    name: Potential Tampering With RDP Related Registry Keys Via Reg.EXE
    reason: RDP enablement via .reg import enables follow-on remote access.
  - id: 82880171-b475-4201-b811-e9c826cd5eaa
    name: Exports Critical Registry Keys To a File
    reason: Export-then-reimport or export for staging pairs with this import.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Registry writes to autorun and persistence keys
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*([Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn]|[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn][Oo][Nn][Cc][Ee]|[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]\\([Ss][Hh][Ee][Ll][Ll]|[Uu][Ss][Ee][Rr][Ii][Nn][Ii][Tt])|[Ii][Mm][Aa][Gg][Ee] [Ff][Ii][Ll][Ee] [Ee][Xx][Ee][Cc][Uu][Tt][Ii][Oo][Nn] [Oo][Pp][Tt][Ii][Oo][Nn][Ss]|[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt]\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]).*/
    pivot_on: host
    window: 2h
  - name: .reg files written to disk
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.[Rr][Ee][Gg]/
    pivot_on: host
    window: 4h
  - name: Defender and security tool tampering in registry
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr].*([Ee][Xx][Cc][Ll][Uu][Ss][Ii][Oo][Nn][Ss]|[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Aa][Nn][Tt][Ii][Ss][Pp][Yy][Ww][Aa][Rr][Ee]|[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee][Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg]).*/
    pivot_on: host
    window: 2h
  - name: RDP and credential-exposure registry changes
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*([Ff][Dd][Ee][Nn][Yy][Tt][Ss][Cc][Oo][Nn][Nn][Ee][Cc][Tt][Ii][Oo][Nn][Ss]|[Uu][Ss][Ee][Ll][Oo][Gg][Oo][Nn][Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll]|[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Ss][Tt][Rr][Ii][Cc][Tt][Ee][Dd][Aa][Dd][Mm][Ii][Nn]|[Ll][Mm][Cc][Oo][Mm][Pp][Aa][Tt][Ii][Bb][Ii][Ll][Ii][Tt][Yy][Ll][Ee][Vv][Ee][Ll]).*/
    pivot_on: host
    window: 2h
  - name: Other reg.exe activity on this host
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Rr][Ee][Gg])\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.* +([Aa][Dd][Dd]|[Ii][Mm][Pp][Oo][Rr][Tt]|[Ss][Aa][Vv][Ee]|[Ee][Xx][Pp][Oo][Rr][Tt]) .*/
    pivot_on: host
    window: 2h
