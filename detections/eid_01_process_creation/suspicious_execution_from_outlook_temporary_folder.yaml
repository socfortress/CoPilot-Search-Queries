name: Suspicious Execution From Outlook Temporary Folder
id: a018fdc3-46a3-44e5-9afb-2cd4af1d4b39
version: 1
schema_version: "1.0"
date: "2022-10-09"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: a018fdc3-46a3-44e5-9afb-2cd4af1d4b39
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a suspicious program execution in Outlook temp folder. MITRE ATT&CK:
  T1566.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\Temporary Internet Files\\\\Content.Outlook\\\\*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches '*\Temporary
  Internet Files\Content.Outlook\*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - Internal Research
  - https://attack.mitre.org/techniques/T1566/001/

response:
  message: >
    Suspicious Execution From Outlook Temporary Folder detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
    MITRE ATT&CK: T1566.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1566.001
  custom_tags:
    - outlook
    - temporary
    - folder
    - process_creation
    - sysmon
    - initial_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Tt][Ee][Mm][Pp][Oo][Rr][Aa][Rr][Yy] [Ii][Nn][Tt][Ee][Rr][Nn][Ee][Tt] [Ff][Ii][Ll][Ee][Ss]\\[Cc][Oo][Nn][Tt][Ee][Nn][Tt]\.[Oo][Uu][Tt][Ll][Oo][Oo][Kk]\\.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: fabb0e80-030c-4e3e-a104-d09676991ac3
    name: Suspicious File Created in Outlook Temporary Directory
    reason: 'The Sysmon 11 file drop in Content.Outlook is the direct precursor: the attachment is saved there before the user opens it.'
  - id: 208748f7-881d-47ac-a29c-07ea84bf691d
    name: Suspicious Outlook Child Process
    reason: Outlook spawning script engines or shells is the other half of the same attachment-open chain.
  - id: e212d415-0e93-435f-9e1a-f29005bb4723
    name: Suspicious Remote Child Process From Outlook
    reason: Outlook launching a process from a remote share indicates link or attachment delivery of the same phishing payload.
  - id: 438025f9-5856-4663-83f7-52f878a70a50
    name: Suspicious Microsoft Office Child Process
    reason: Opened Office attachments (macro documents) from the Outlook cache spawn shells; the Office-side variant of the lure.
  - id: aa3a6f94-890e-4e22-b634-ffdfd54792cc
    name: Suspicious Binary In User Directory Spawned From Office Application
    reason: A dropped second-stage binary in the user profile follows macro execution from the attachment.
  - id: c7a74c80-ba5a-486e-9974-ab9e682bc5e4
    name: File With Uncommon Extension Created By An Office Application
    reason: Macro documents commonly drop payload files with unusual extensions right after opening.
  - id: b1c50487-1967-4315-a026-6491686d860e
    name: Office Macro File Creation From Suspicious Process
    reason: Covers weaponized macro files written from non-standard processes in the same delivery chain.
  - id: fcdf69e5-a3d3-452a-9724-26f2308bf2b1
    name: Phishing Pattern ISO in Archive
    reason: ISO-in-archive attachments are a common container that lands in the Outlook cache and leads to executable launch.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Files written under Outlook cache
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*Content\.Outlook.*/
    pivot_on: host
    window: 4h
  - name: Children of the launched binary
    query: data_win_system_eventID:1 AND (data_win_eventdata_parentImage:/.*Content\.Outlook.*/ OR data_win_eventdata_parentCommandLine:/.*Content\.Outlook.*/)
    pivot_on: host
    window: 2h
  - name: Outbound connections from user-profile binaries
    query: data_win_system_eventID:3 AND data_win_eventdata_initiated:true AND (data_win_eventdata_image:/.*Content\.Outlook.*/ OR data_win_eventdata_image:/.*\\\\([Aa]pp[Dd]ata|[Tt]emp)\\\\.*/)
    pivot_on: host
    window: 2h
  - name: Persistence from the same user session
    query: (data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*\\\\(Run|RunOnce)\\\\.*/) OR (data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*[Ss]chtasks.*\/[Cc]reate.*/)
    pivot_on: user
    window: 4h
  - name: Script engine and LOLBin follow-on from mail apps
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*\\\\(powershell|pwsh|wscript|cscript|mshta|rundll32|regsvr32|cmd)\.exe/ AND (data_win_eventdata_parentImage:/.*(OUTLOOK|WINWORD|EXCEL)\.EXE/ OR data_win_eventdata_parentImage:/.*Content\.Outlook.*/)
    pivot_on: host
    window: 2h
