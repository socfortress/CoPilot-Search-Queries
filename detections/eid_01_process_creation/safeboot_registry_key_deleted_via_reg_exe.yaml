name: SafeBoot Registry Key Deleted Via Reg.EXE
id: fc0e89b5-adb0-43c1-b749-c12a10ec37de
version: 1
schema_version: "1.0"
date: "2023-02-04"
author: Nasreddine Bencherchali (Nextron Systems), Tim Shelton
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: fc0e89b5-adb0-43c1-b749-c12a10ec37de
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of "reg.exe" commands with the "delete" flag on safe boot
  registry keys. Often used by attacker to prevent safeboot execution of
  security products. MITRE ATT&CK: T1685.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*reg.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "reg.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* delete *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*\\\\SYSTEM\\\\CurrentControlSet\\\\Control\\\\SafeBoot*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches '*reg.exe';
  data_win_eventdata_originalFileName equals 'reg.exe';
  data_win_eventdata_commandLine matches '* delete *', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.trendmicro.com/en_us/research/22/e/avoslocker-ransomware-variant-abuses-driver-file-to-disable-anti-Virus-scans-log4shell.html
  - https://attack.mitre.org/techniques/T1685/

response:
  message: >
    SafeBoot Registry Key Deleted Via Reg.EXE detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1685
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685
  custom_tags:
    - safeboot
    - registry
    - deleted
    - process_creation
    - sysmon
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Rr][Ee][Gg]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Rr][Ee][Gg]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.* [Dd][Ee][Ll][Ee][Tt][Ee] .*/ AND data_win_eventdata_commandLine:/.*\\[Ss][Yy][Ss][Tt][Ee][Mm]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt]\\[Cc][Oo][Nn][Tt][Rr][Oo][Ll]\\[Ss][Aa][Ff][Ee][Bb][Oo][Oo][Tt].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d7662ff6-9e97-4596-a61d-9839e32dee8d
    name: Add SafeBoot Keys Via Reg Utility
    reason: 'Counterpart SafeBoot manipulation: actors add their own service to SafeBoot to survive Safe Mode while removing security tools'' keys.'
  - id: 1444443e-6757-43e4-9ea4-c8fc705f79a2
    name: Boot Configuration Tampering Via Bcdedit.EXE
    reason: Ransomware forces Safe Mode via bcdedit and strips AV from SafeBoot keys so security tools do not load.
  - id: c9fbe8e9-119d-40a6-9b59-dd58a5d84429
    name: Potential Ransomware or Unauthorized MBR Tampering Via Bcdedit.EXE
    reason: Recovery-disabling bcdedit commands accompany Safe Mode ransomware staging.
  - id: 639c9081-f482-47d3-a0bd-ddee3d4ecd76
    name: All Backups Deleted Via Wbadmin.EXE
    reason: Backup destruction is a pre-encryption step in the same ransomware playbook.
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: Shadow copy deletion precedes or follows Safe Mode preparation before encryption.
  - id: 5e95028c-5229-4214-afae-d653d573d0ec
    name: Security Service Disabled Via Reg.EXE
    reason: Co-occurring defense evasion by reg.exe against security services.
  - id: 05b2aa93-1210-42c8-8d9a-2fcc13b284f5
    name: Service Registry Key Deleted Via Reg.EXE
    reason: 'Same technique: deleting service keys to remove protections.'
  - id: 17769c90-230e-488b-a463-e05c08e9d48f
    name: Powershell Defender Exclusion
    reason: Defender disabling commonly precedes the SafeBoot edit.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Boot config / Safe Mode forcing
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Bb]cdedit.*/ AND data_win_eventdata_commandLine:/.*([Ss]afeboot|[Rr]ecoveryenabled|[Bb]ootstatuspolicy|[Ii]gnoreallfailures).*/
    pivot_on: host
    window: 4h
  - name: Backup and shadow copy destruction
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*[Vv]ssadmin.*/ AND data_win_eventdata_commandLine:/.*[Dd]elete.*/) OR (data_win_eventdata_image:/.*[Ww]badmin.*/ AND data_win_eventdata_commandLine:/.*[Dd]elete.*/) OR data_win_eventdata_commandLine:/.*([Ss]hadowcopy.*[Dd]elete|[Dd]elete.*[Ss]hadows).*/)
    pivot_on: host
    window: 4h
  - name: SafeBoot / security service registry writes
    query: data_win_system_eventID:("12" OR "13" OR "14") AND data_win_eventdata_targetObject:/.*([Ss]afe[Bb]oot|[Ww]in[Dd]efend|[Ss]ense|[Ss]ecurity[Hh]ealth).*/
    pivot_on: host
    window: 4h
  - name: Security services stopped or disabled
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*[Ss]c\.exe/ AND data_win_eventdata_commandLine:/.*(stop|config).*(disabled|[Ww]in[Dd]efend|[Ss]ense|[Ss]ophos|[Ss]ymantec).*/) OR data_win_eventdata_commandLine:/.*([Ss]et-[Mm]p[Pp]reference|[Dd]isable[Rr]ealtime).*/)
    pivot_on: host
    window: 4h
  - name: Forced reboot or shutdown
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Ss]hutdown\.exe/ AND data_win_eventdata_commandLine:/.* [-/](r|s).*/
    pivot_on: host
    window: 2h
