name: Tor Client/Browser Execution
id: 62f7c9bf-9135-49b2-8aeb-1e54a6ecc13c
version: 1
schema_version: "1.0"
date: "2025-10-27"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 62f7c9bf-9135-49b2-8aeb-1e54a6ecc13c
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the use of Tor or Tor-Browser to connect to onion routing networks.
  MITRE ATT&CK: T1090.003.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - term:
                  data_win_eventdata_description:
                    value: "Tor Browser"
                    case_insensitive: true
              - term:
                  data_win_eventdata_product:
                    value: "Tor Browser"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\tor.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\Tor Browser\\\\Browser\\\\firefox.exe"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_description
    - data_win_eventdata_product
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_description equals 'Tor
  Browser'; data_win_eventdata_product equals 'Tor Browser';
  data_win_eventdata_image matches '*\tor.exe', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.logpoint.com/en/blog/detecting-tor-use-with-logpoint/
  - https://attack.mitre.org/techniques/T1090/003/

response:
  message: >
    Tor Client/Browser Execution detected on host $agent_name$. Matched
    data_win_eventdata_description: $data_win_eventdata_description$. Matched
    data_win_eventdata_product: $data_win_eventdata_product$. MITRE ATT&CK:
    T1090.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_description
      type: other
    - field: data_win_eventdata_product
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1090.003
  custom_tags:
    - client
    - browser
    - process_creation
    - sysmon
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_description:/[Tt][Oo][Rr] [Bb][Rr][Oo][Ww][Ss][Ee][Rr]/ OR data_win_eventdata_product:/[Tt][Oo][Rr] [Bb][Rr][Oo][Ww][Ss][Ee][Rr]/ OR data_win_eventdata_image:/.*\\[Tt][Oo][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Tt][Oo][Rr] [Bb][Rr][Oo][Ww][Ss][Ee][Rr]\\[Bb][Rr][Oo][Ww][Ss][Ee][Rr]\\[Ff][Ii][Rr][Ee][Ff][Oo][Xx]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e99375eb-3ee0-407a-9f90-79569cc6a01c
    name: Kalambur Backdoor Curl TOR SOCKS Proxy Execution
    reason: Malware routing traffic through a local Tor SOCKS proxy.
  - id: 222129f7-f4dc-4568-b0d2-22440a9639ba
    name: Cloudflared Quick Tunnel Execution
    reason: Alternative covert tunnelling tooling on the same host.
  - id: cf93e05e-d798-4d9e-b522-b0248dc61eaf
    name: HackTool - SharpChisel Execution
    reason: Alternate proxy tunnel used for the same C2/exfil purpose.
  - id: 1d08ac94-400d-4469-a82f-daee9a908849
    name: Communication To Ngrok Tunneling Service Initiated
    reason: Other anonymising/tunnelling channel indicating evasion.
  - id: 98a96a5a-64a0-4c42-92c5-489da3866cb0
    name: DNS Exfiltration and Tunneling Tools Execution
    reason: Combined with Tor suggests deliberate covert channels.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Network connections by Tor binaries
    query: data_win_system_eventID:3 AND data_win_eventdata_image:(*\\tor.exe OR *Tor\ Browser*) AND data_win_eventdata_destinationPort:(9001 OR 9030 OR 9050 OR 9150 OR 443)
    pivot_on: host
    window: 24h
  - name: Tor files created (installer, browser, torrc)
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(*\\tor.exe OR *tor\-browser* OR *torrc* OR *Tor\ Browser*)
    pivot_on: host
    window: 24h
  - name: Tor-related DNS lookups
    query: data_win_system_eventID:22 AND data_win_eventdata_queryName:(*.onion OR *torproject.org)
    pivot_on: host
    window: 24h
  - name: Tor installer or download via CLI
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(*torproject.org* OR *tor\-browser* OR *torrc*)
    pivot_on: host
    window: 24h
  - name: Local SOCKS proxy usage on Tor ports
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(*127.0.0.1\:9050* OR *127.0.0.1\:9150* OR *socks5h*)
    pivot_on: host
    window: 24h
