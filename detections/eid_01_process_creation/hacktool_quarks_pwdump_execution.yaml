name: HackTool - Quarks PwDump Execution
id: 0685b176-c816-4837-8e7b-1216f346636b
version: 1
schema_version: "1.0"
date: "2023-02-05"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 0685b176-c816-4837-8e7b-1216f346636b
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects usage of the Quarks PwDump tool via commandline arguments. MITRE
  ATT&CK: T1003.002.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\QuarksPwDump.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_commandLine:
                    value: " -dhl"
                    case_insensitive: true
              - term:
                  data_win_eventdata_commandLine:
                    value: " --dump-hash-local"
                    case_insensitive: true
              - term:
                  data_win_eventdata_commandLine:
                    value: " -dhdc"
                    case_insensitive: true
              - term:
                  data_win_eventdata_commandLine:
                    value: " --dump-hash-domain-cached"
                    case_insensitive: true
              - term:
                  data_win_eventdata_commandLine:
                    value: " --dump-bitlocker"
                    case_insensitive: true
              - term:
                  data_win_eventdata_commandLine:
                    value: " -dhd "
                    case_insensitive: true
              - term:
                  data_win_eventdata_commandLine:
                    value: " --dump-hash-domain "
                    case_insensitive: true
              - term:
                  data_win_eventdata_commandLine:
                    value: "--ntds-file"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\QuarksPwDump.exe'; data_win_eventdata_commandLine equals ' -dhl';
  data_win_eventdata_commandLine equals ' --dump-hash-local', among other
  conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/quarkslab/quarkspwdump
  - https://symantec-enterprise-blogs.security.com/blogs/threat-intelligence/seedworm-apt-iran-middle-east
  - https://attack.mitre.org/techniques/T1003/002/

response:
  message: >
    HackTool - Quarks PwDump Execution detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1003.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.002
  custom_tags:
    - hacktool
    - quarks
    - pwdump
    - process_creation
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Qq][Uu][Aa][Rr][Kk][Ss][Pp][Ww][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/ -[Dd][Hh][Ll]/ OR data_win_eventdata_commandLine:/ --[Dd][Uu][Mm][Pp]-[Hh][Aa][Ss][Hh]-[Ll][Oo][Cc][Aa][Ll]/ OR data_win_eventdata_commandLine:/ -[Dd][Hh][Dd][Cc]/ OR data_win_eventdata_commandLine:/ --[Dd][Uu][Mm][Pp]-[Hh][Aa][Ss][Hh]-[Dd][Oo][Mm][Aa][Ii][Nn]-[Cc][Aa][Cc][Hh][Ee][Dd]/ OR data_win_eventdata_commandLine:/ --[Dd][Uu][Mm][Pp]-[Bb][Ii][Tt][Ll][Oo][Cc][Kk][Ee][Rr]/ OR data_win_eventdata_commandLine:/ -[Dd][Hh][Dd] / OR data_win_eventdata_commandLine:/ --[Dd][Uu][Mm][Pp]-[Hh][Aa][Ss][Hh]-[Dd][Oo][Mm][Aa][Ii][Nn] / OR data_win_eventdata_commandLine:/--[Nn][Tt][Dd][Ss]-[Ff][Ii][Ll][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: fd877b94-9bb5-4191-bb25-d79cbd93c167
    name: Dumping of Sensitive Hives Via Reg.EXE
    reason: Alternative hive dump on the same host indicates broader credential harvesting
  - id: 4e87b8e2-2ee9-4b2a-a715-4727d297ece0
    name: Potential SAM Database Dump
    reason: Quarks PwDump reads SAM; dumped SAM file artifacts confirm success
  - id: da63bc76-61ae-11eb-ae93-0242ac130002
    name: Ntdsutil Export NTDS
    reason: Quarks domain hash modes target NTDS on DCs; ntdsutil is the native equivalent
  - id: aa92fd02-09f2-48b0-8a93-864813fb8f41
    name: Conti NTDS Exfiltration Command
    reason: Follow-on exfiltration of NTDS data after domain hash dumping
  - id: 5ef9853e-4d0e-4a70-846f-a9ca37d876da
    name: Potential Credential Dumping Activity Via LSASS
    reason: Hash dumping is commonly paired with LSASS access
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: Companion tool for reuse of dumped credentials
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: NTDS.dit / shadow copy access
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt]|[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll]|[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn]|[Ss][Hh][Aa][Dd][Oo][Ww]).*/
    pivot_on: host
    window: 2h
  - name: Hive save commands
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Rr][Ee][Gg].*[Ss][Aa][Vv][Ee].*/
    pivot_on: host
    window: 2h
  - name: LSASS access
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Hash/dump output files written
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*([Hh]ash|[Dd]ump|[Pp]wdump|[Nn]tds|\.dmp).*/
    pivot_on: host
    window: 2h
  - name: Outbound SMB/RDP/WinRM after dump
    query: data_win_system_eventID:"3" AND (data_win_eventdata_destinationPort:"445" OR data_win_eventdata_destinationPort:"3389" OR data_win_eventdata_destinationPort:"5985")
    pivot_on: host
    window: 4h
