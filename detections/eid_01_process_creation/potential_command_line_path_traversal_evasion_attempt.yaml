name: Potential Command Line Path Traversal Evasion Attempt
id: 1327381e-6ab0-4f38-b583-4c1b8346a56b
version: 1
schema_version: "1.0"
date: "2023-03-29"
author: Christian Burkard (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 1327381e-6ab0-4f38-b583-4c1b8346a56b
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential evasion or obfuscation attempts using bogus path traversal
  via the commandline. MITRE ATT&CK: T1036.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\Windows\\\\*"
                          case_insensitive: true
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*\\\\..\\\\Windows\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*\\\\..\\\\System32\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine: "*\\\\..\\\\..\\\\*"
                        minimum_should_match: 1
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.exe\\\\..\\\\*"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_commandLine"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*\\\\Google\\\\Drive\\\\googledrivesync.exe\\\\..\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*\\\\Citrix\\\\Virtual Smart Card\\\\Citrix.Authentication.VirtualSmartcard.Launcher.exe\\\\..\\\\*"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\Windows\*'; data_win_eventdata_commandLine matches '*\..\Windows\*';
  data_win_eventdata_commandLine matches '*\..\System32\*', among other
  conditions.

known_false_positives: >
  Google Drive. Citrix. Baseline expected activity in your environment and tune
  this detection before relying on it for automated response.

references:
  - https://twitter.com/hexacorn/status/1448037865435320323
  - https://twitter.com/Gal_B1t/status/1062971006078345217
  - https://attack.mitre.org/techniques/T1036/

response:
  message: >
    Potential Command Line Path Traversal Evasion Attempt detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
    MITRE ATT&CK: T1036
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1036
  custom_tags:
    - traversal
    - evasion
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\.*/ AND (data_win_eventdata_commandLine:/.*\\\.\.\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\.*/ OR data_win_eventdata_commandLine:/.*\\\.\.\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\.*/ OR data_win_eventdata_commandLine:/.*\\\.\.\\\.\.\\.*/)) OR data_win_eventdata_commandLine:/.*\.[Ee][Xx][Ee]\\\.\.\\.*/) AND _exists_:data_win_eventdata_commandLine AND NOT (data_win_eventdata_commandLine:/.*\\[Gg][Oo][Oo][Gg][Ll][Ee]\\[Dd][Rr][Ii][Vv][Ee]\\[Gg][Oo][Oo][Gg][Ll][Ee][Dd][Rr][Ii][Vv][Ee][Ss][Yy][Nn][Cc]\.[Ee][Xx][Ee]\\\.\.\\.*/ OR data_win_eventdata_commandLine:/.*\\[Cc][Ii][Tt][Rr][Ii][Xx]\\[Vv][Ii][Rr][Tt][Uu][Aa][Ll] [Ss][Mm][Aa][Rr][Tt] [Cc][Aa][Rr][Dd]\\[Cc][Ii][Tt][Rr][Ii][Xx]\.[Aa][Uu][Tt][Hh][Ee][Nn][Tt][Ii][Cc][Aa][Tt][Ii][Oo][Nn]\.[Vv][Ii][Rr][Tt][Uu][Aa][Ll][Ss][Mm][Aa][Rr][Tt][Cc][Aa][Rr][Dd]\.[Ll][Aa][Uu][Nn][Cc][Hh][Ee][Rr]\.[Ee][Xx][Ee]\\\.\.\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 087790e3-3287-436c-bccf-cbd0184a7db1
    name: Potential CommandLine Path Traversal Via Cmd.EXE
    reason: Cmd.EXE variant of the same bogus ..\ traversal obfuscation.
  - id: ee5e119b-1f75-4b34-add8-3be976961e39
    name: Conhost.exe CommandLine Path Traversal
    reason: Conhost command-line path traversal - sibling technique used to evade path-based detections.
  - id: a16980c2-0c56-4de0-9a79-17971979efdd
    name: Cmd.EXE Missing Space Characters Execution Anomaly
    reason: Cmd missing-space obfuscation often appears in the same evasive command lines.
  - id: 22ac27b4-7189-4a4f-9375-b9017c9620d7
    name: Detect RTLO In Process
    reason: RTLO masquerading is another command-line/file-name evasion used alongside.
  - id: d7bcd677-645d-4691-a8d4-7a5602b780d1
    name: Potential PowerShell Command Line Obfuscation
    reason: PowerShell command-line obfuscation from the same actor tooling.
  - id: f208d6d8-d83a-4c2c-960d-877c37da84e5
    name: Process Launched Without Image Name
    reason: 'Process launched without image name: another masquerading trait that co-occurs.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other path-traversal command lines
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*\\\.\.\\.*/ OR /.*\.exe\\\.\..*/)
    pivot_on: host
    window: 2h
  - name: Children of the traversal-launched process
    query: data_win_system_eventID:1 AND data_win_eventdata_parentCommandLine:(/.*\\\.\.\\.*/ OR /.*\.exe\\\.\..*/)
    pivot_on: host
    window: 2h
  - name: LOLBin proxy execution in the window
    query: data_win_system_eventID:1 AND data_win_eventdata_image:(/.*[Rr]undll32\.exe/ OR /.*[Mm]shta\.exe/ OR /.*[Rr]egsvr32\.exe/ OR /.*[Cc]ertutil\.exe/ OR /.*[Bb]itsadmin\.exe/)
    pivot_on: host
    window: 2h
  - name: Outbound connections from shells/scripting hosts
    query: data_win_system_eventID:3 AND data_win_eventdata_image:(/.*[Cc]md\.exe/ OR /.*[Pp]ower[Ss]hell.*/ OR /.*[Ww]script\.exe/ OR /.*[Cc]script\.exe/) AND data_win_eventdata_initiated:true
    pivot_on: host
    window: 4h
