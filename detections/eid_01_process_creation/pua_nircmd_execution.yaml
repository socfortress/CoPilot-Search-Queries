name: PUA - NirCmd Execution
id: 4e2ed651-1906-4a59-a78a-18220fca1b22
version: 1
schema_version: "1.0"
date: "2023-02-13"
author: Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 4e2ed651-1906-4a59-a78a-18220fca1b22
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the use of NirCmd tool for command execution, which could be the
  result of legitimate administrative activity. MITRE ATT&CK: T1569.002.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\NirCmd.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "NirCmd.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* execmd *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.exe script *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.exe shexec *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* runinteractive *"
                    case_insensitive: true
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* exec *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* exec2 *"
                                case_insensitive: true
                        minimum_should_match: 1
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* show *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* hide *"
                                case_insensitive: true
                        minimum_should_match: 1
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\NirCmd.exe'; data_win_eventdata_originalFileName equals 'NirCmd.exe';
  data_win_eventdata_commandLine matches '* execmd *', among other conditions.

known_false_positives: >
  Legitimate use by administrators. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://www.nirsoft.net/utils/nircmd.html
  - https://www.winhelponline.com/blog/run-program-as-system-localsystem-account-windows/
  - https://www.nirsoft.net/utils/nircmd2.html#using
  - https://attack.mitre.org/techniques/T1569/002/

response:
  message: >
    PUA - NirCmd Execution detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1569.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1569.002
  custom_tags:
    - nircmd
    - process_creation
    - sysmon
    - execution
    - s0029
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Nn][Ii][Rr][Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Nn][Ii][Rr][Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.* [Ee][Xx][Ee][Cc][Mm][Dd] .*/ OR data_win_eventdata_commandLine:/.*\.[Ee][Xx][Ee] [Ss][Cc][Rr][Ii][Pp][Tt] .*/ OR data_win_eventdata_commandLine:/.*\.[Ee][Xx][Ee] [Ss][Hh][Ee][Xx][Ee][Cc] .*/ OR data_win_eventdata_commandLine:/.* [Rr][Uu][Nn][Ii][Nn][Tt][Ee][Rr][Aa][Cc][Tt][Ii][Vv][Ee] .*/ OR ((data_win_eventdata_commandLine:/.* [Ee][Xx][Ee][Cc] .*/ OR data_win_eventdata_commandLine:/.* [Ee][Xx][Ee][Cc]2 .*/) AND (data_win_eventdata_commandLine:/.* [Ss][Hh][Oo][Ww] .*/ OR data_win_eventdata_commandLine:/.* [Hh][Ii][Dd][Ee] .*/)))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d9047477-0359-48c9-b8c7-792cedcdc9c4
    name: PUA - NirCmd Execution As LOCAL SYSTEM
    reason: 'Higher-severity variant: NirCmd run as SYSTEM indicates privileged abuse (e.g. via PsExec).'
  - id: 264982dc-dbad-4dce-b707-1e0d3e0f73d9
    name: Renamed NirCmd.EXE Execution
    reason: 'Evasion twin: attackers rename NirCmd; same tool, same intent.'
  - id: d2b749ee-4225-417e-b20e-a8d2193cbb84
    name: PUA - AdvancedRun Execution
    reason: Sibling utility used to run commands as SYSTEM/TrustedInstaller and disable defenses.
  - id: d08a2711-ee8b-4323-bdec-b7d85e892b31
    name: PUA - CsExec Execution
    reason: Remote-execution PUA that can launch NirCmd as SYSTEM.
  - id: 17769c90-230e-488b-a463-e05c08e9d48f
    name: Powershell Defender Exclusion
    reason: NirCmd exec/shexec is often used to run commands that tamper with Defender.
  - id: d059842b-6b9d-4ed1-b5c3-5b89143c6ede
    name: File Download Via Bitsadmin
    reason: NirCmd is not native; it is typically downloaded before use.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: NirCmd execution variants (exec, shexec, runinteractive)
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Nn][Ii][Rr][Cc][Mm][Dd]\.[Ee][Xx][Ee]|\\[Nn][Ii][Rr][Cc][Mm][Dd][Cc]\.[Ee][Xx][Ee])/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.* [Ee][Xx][Ee][Cc][Mm][Dd] .*/ OR data_win_eventdata_commandLine:/.* [Ss][Hh][Ee][Xx][Ee][Cc] .*/ OR data_win_eventdata_commandLine:/.* [Rr][Uu][Nn][Ii][Nn][Tt][Ee][Rr][Aa][Cc][Tt][Ii][Vv][Ee] .*/ OR data_win_eventdata_commandLine:/.* [Ee][Xx][Ee][Cc]2 .*/))
    pivot_on:
    - host
    window: 2h
  - name: Defender tampering
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Aa][Dd][Dd]\-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]\-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee].*/)
    pivot_on:
    - host
    window: 2h
  - name: Download of NirSoft tooling via LOLBin
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]|\\[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]|\\[Ww][Gg][Ee][Tt]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*[Nn][Ii][Rr][Cc][Mm][Dd].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ii][Rr][Ss][Oo][Ff][Tt].*/)
    pivot_on:
    - host
    window: 2h
  - name: SYSTEM-level remote execution (PsExec/CsExec)
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Pp][Ss][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]|\\[Cc][Ss][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]|\\[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 2h
  - name: Persistence after NirCmd use
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*\/[Cc][Rr][Ee][Aa][Tt][Ee].*/) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Rr][Ee][Gg]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/)
    pivot_on:
    - host
    window: 4h
