name: PowerShell Download and Execution Cradles
id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
version: 1
schema_version: "1.0"
date: "2025-07-18"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects PowerShell download and execution cradles. MITRE ATT&CK: T1059.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.DownloadString(*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.DownloadFile(*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Invoke-WebRequest *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*iwr *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Invoke-RestMethod *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*irm *"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*;iex $*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*| IEX*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*|IEX *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*I`E`X*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*I`EX*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*IE`X*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*iex *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*IEX (*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*IEX(*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Invoke-Expression*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*.DownloadString(*'; data_win_eventdata_commandLine matches
  '*.DownloadFile(*'; data_win_eventdata_commandLine matches '*Invoke-WebRequest
  *', among other conditions.

known_false_positives: >
  Some PowerShell installers were seen using similar combinations. Apply filters
  accordingly. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/VirtualAlllocEx/Payload-Download-Cradles/blob/88e8eca34464a547c90d9140d70e9866dcbc6a12/Download-Cradles.cmd
  - https://labs.withsecure.com/publications/fin7-target-veeam-servers
  - https://attack.mitre.org/techniques/T1059/

response:
  message: >
    PowerShell Download and Execution Cradles detected on host $agent_name$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1059
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059
  custom_tags:
    - powershell
    - download
    - cradles
    - process_creation
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*\.[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg]\(.*/ OR data_win_eventdata_commandLine:/.*\.[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee]\(.*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt] .*/ OR data_win_eventdata_commandLine:/.*[Ii][Ww][Rr] .*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Rr][Ee][Ss][Tt][Mm][Ee][Tt][Hh][Oo][Dd] .*/ OR data_win_eventdata_commandLine:/.*[Ii][Rr][Mm] .*/) AND (data_win_eventdata_commandLine:/.*;[Ii][Ee][Xx] \$.*/ OR data_win_eventdata_commandLine:/.*\| [Ii][Ee][Xx].*/ OR data_win_eventdata_commandLine:/.*\|[Ii][Ee][Xx] .*/ OR data_win_eventdata_commandLine:/.*[Ii]`[Ee]`[Xx].*/ OR data_win_eventdata_commandLine:/.*[Ii]`[Ee][Xx].*/ OR data_win_eventdata_commandLine:/.*[Ii][Ee]`[Xx].*/ OR data_win_eventdata_commandLine:/.*[Ii][Ee][Xx] .*/ OR data_win_eventdata_commandLine:/.*[Ii][Ee][Xx] \(.*/ OR data_win_eventdata_commandLine:/.*[Ii][Ee][Xx]\(.*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ee][Xx][Pp][Rr][Ee][Ss][Ss][Ii][Oo][Nn].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 3b6ab547-8ec2-4991-b9d2-2b06702a48d7
    name: PowerShell Download Pattern
    reason: Overlapping WebClient-style download command lines; corroborates the same cradle.
  - id: 88f680b8-070e-402c-ae11-d2914f2257f1
    name: PowerShell Base64 Encoded IEX Cmdlet
    reason: Same cradle delivered encoded to evade command-line matching.
  - id: 02b64f1b-3f33-4e67-aede-ef3b0a5a8fcf
    name: Potential COM Objects Download Cradles Usage - Process Creation
    reason: Alternative cradle variant the actor may fall back to.
  - id: ee18ed37-0802-4268-9435-b3b91aaa18db
    name: PowerShell - Connect To Internet With Hidden Window
    reason: Hidden-window PowerShell reaching the internet is the stealthy delivery form of this cradle.
  - id: 0f0450f3-8b47-441e-a31b-15a91dc243e2
    name: Potential DLL File Download Via PowerShell Invoke-WebRequest
    reason: Payload type commonly fetched by Invoke-WebRequest cradles.
  - id: b6e04788-29e1-4557-bb14-77f761848ab8
    name: Potentially Suspicious File Download From File Sharing Domain Via PowerShell.EXE
    reason: Common hosting for the downloaded stage.
  - id: 17769c90-230e-488b-a463-e05c08e9d48f
    name: Powershell Defender Exclusion
    reason: Staged payloads are often preceded or followed by Defender exclusions.
  - id: de587dce-915e-4218-aac4-835ca6af6f70
    name: Potential Persistence Attempt Via Run Keys Using Reg.EXE
    reason: Persistence of the downloaded payload.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: PowerShell web download primitives
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Dd]ownload[Ss]tring.*/ OR /.*[Dd]ownload[Ff]ile.*/ OR /.*[Ii]nvoke-[Ww]eb[Rr]equest.*/ OR /.*[Ii]nvoke-[Rr]est[Mm]ethod.*/)
    pivot_on: host
    window: 2h
  - name: Network connections from PowerShell
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/
    pivot_on: host
    window: 2h
  - name: Executables and scripts created by PowerShell
    query: data_win_system_eventID:11 AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND data_win_eventdata_targetFilename:(/.*\.exe/ OR /.*\.dll/ OR /.*\.ps1/ OR /.*\.bat/)
    pivot_on: host
    window: 2h
  - name: Child processes of PowerShell
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Pp]ower[Ss]hell.*/
    pivot_on: host
    window: 2h
  - name: DNS lookups by PowerShell
    query: data_win_system_eventID:22 AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/
    pivot_on: host
    window: 2h
