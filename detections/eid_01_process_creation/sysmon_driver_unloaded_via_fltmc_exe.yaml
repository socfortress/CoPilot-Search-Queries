name: Sysmon Driver Unloaded Via Fltmc.EXE
id: 4d7cda18-1b12-4e52-b45c-d28653210df8
version: 1
schema_version: "1.0"
date: "2023-02-13"
author: Kirill Kiryanov, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 4d7cda18-1b12-4e52-b45c-d28653210df8
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects possible Sysmon filter driver unloaded via fltmc.exe. MITRE ATT&CK:
  T1070, T1685, T1685.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\fltMC.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "fltMC.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*unload*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*sysmon*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\fltMC.exe'; data_win_eventdata_originalFileName equals 'fltMC.exe';
  data_win_eventdata_commandLine matches '*unload*', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.darkoperator.com/blog/2018/10/5/operating-offensively-against-sysmon
  - https://attack.mitre.org/techniques/T1070/
  - https://attack.mitre.org/techniques/T1685/
  - https://attack.mitre.org/techniques/T1685/001/

response:
  message: >
    Sysmon Driver Unloaded Via Fltmc.EXE detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1070, T1685, T1685.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1070
    - T1685
    - T1685.001
  custom_tags:
    - sysmon
    - driver
    - unloaded
    - process_creation
    - stealth
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ff][Ll][Tt][Mm][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ff][Ll][Tt][Mm][Cc]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Uu][Nn][Ll][Oo][Aa][Dd].*/ AND data_win_eventdata_commandLine:/.*[Ss][Yy][Ss][Mm][Oo][Nn].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 37db85d1-b089-490a-a59a-c7b6f984f480
    name: Sysmon Discovery Via Default Driver Altitude Using Findstr.EXE
    reason: 'Typical precursor: locate the (possibly renamed) Sysmon driver before unloading.'
  - id: 4931188c-178e-4ee7-a348-39e8a7a56821
    name: Filter Driver Unloaded Via Fltmc.EXE
    reason: Generic variant; fires when any filter driver, possibly a renamed Sysmon, is unloaded.
  - id: 87911521-7098-470b-a459-9a57fc80bdfd
    name: Sysmon Configuration Update
    reason: Config replacement used alongside or instead of driver unload.
  - id: 6a5f68d1-c4b5-46b9-94ee-5324892ea939
    name: Uninstall Sysinternals Sysmon
    reason: Full removal after driver unload.
  - id: 4916a35e-bfc4-47d0-8e25-a003d7067061
    name: Sysmon Driver Altitude Change
    reason: Altitude change is a registry route to the same blind spot.
  - id: a7ee1722-c3c5-aeff-3212-c777e4733217
    name: Disable Windows Defender AV Security Monitoring
    reason: Operators blind Sysmon and Defender together before the main action.
  - id: 236e7c8e-c9d9-11eb-a824-acde48001122
    name: Disable Logs Using WevtUtil
    reason: Log disabling is part of the same defence-evasion block.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Sysmon driver and service manipulation
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ss]ysmon|[Ff]ltmc).*/
    pivot_on:
    - host
    window: 4h
  - name: Sysmon service state and config events
    query: data_win_system_eventID:"4" OR data_win_system_eventID:"16"
    pivot_on:
    - host
    window: 4h
  - name: Event log tampering commands
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ww]evtutil.*(cl |clear-log|sl )|[Cc]lear-[Ee]vent[Ll]og|[Aa]uditpol.*(disable|clear)).*/
    pivot_on:
    - host
    window: 4h
  - name: Defender disable and exclusions
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ss]et-[Mm]p[Pp]reference|[Dd]isable[Rr]ealtime|[Aa]dd-[Mm]p[Pp]reference.*[Ee]xclusion).*/
    pivot_on:
    - host
    window: 4h
  - name: Post-blinding admin tooling
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ll]sass|[Pp]rocdump|[Nn]et.*user.*\/add|[Ss]chtasks.*\/create|[Rr]eg.*[Ss]ave).*/
    pivot_on:
    - host
    window: 4h
