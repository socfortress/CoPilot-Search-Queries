name: Rundll32 Execution Without Parameters
id: 5bb68627-3198-40ca-b458-49f973db8752
version: 1
schema_version: "1.0"
date: "2023-02-28"
author: Bartlomiej Czyz, Relativity
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 5bb68627-3198-40ca-b458-49f973db8752
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects rundll32 execution without parameters as observed when running
  Metasploit windows/smb/psexec exploit module. MITRE ATT&CK: T1021.002, T1570,
  T1569.002.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - term:
                  data_win_eventdata_commandLine:
                    value: "rundll32.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_commandLine:
                    value: "rundll32"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine equals
  'rundll32.exe'; data_win_eventdata_commandLine equals 'rundll32'.

known_false_positives: >
  False positives may occur if a user called rundll32 from CLI with no options.
  Baseline expected activity in your environment and tune this detection before
  relying on it for automated response.

references:
  - https://bczyz1.github.io/2021/01/30/psexec.html
  - https://attack.mitre.org/techniques/T1021/002/
  - https://attack.mitre.org/techniques/T1570/
  - https://attack.mitre.org/techniques/T1569/002/

response:
  message: >
    Rundll32 Execution Without Parameters detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1021.002, T1570, T1569.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1021.002
    - T1570
    - T1569.002
  custom_tags:
    - rundll32
    - parameters
    - process_creation
    - sysmon
    - lateral_movement
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/[Rr][Uu][Nn][Dd][Ll][Ll]32/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 1775e15e-b61b-4d14-a1a3-80981298085a
    name: Rundll32 Execution Without CommandLine Parameters
    reason: Sibling detection for the same bare rundll32 spawn with parent context.
  - id: ea011323-7045-460b-b2d7-0f7442ea6b38
    name: Potential PsExec Remote Execution
    reason: Metasploit psexec launches bare rundll32 through a remote service.
  - id: 27c3a83d-cada-47c6-9042-67baf19d2574
    name: Detect PsExec With accepteula Flag
    reason: PsExec lateral-movement tooling that precedes the service-launched rundll32.
  - id: 855bc8b5-2ae8-402e-a9ed-b889e6df1900
    name: Copy From Or To Admin Share Or Sysvol Folder
    reason: Payload staging over admin shares precedes remote service execution.
  - id: 15619216-e993-4721-b590-4c520615a67d
    name: Potential Meterpreter/CobaltStrike Activity
    reason: Meterpreter/CS post-exploitation follows the bare spawn.
  - id: bb3c1bac-6bdf-4aa0-8dc9-068b8b712a76
    name: Impacket Lateral Movement smbexec CommandLine Parameters
    reason: Another remote service-exec technique with a similar lateral-movement footprint.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Service installation events
    query: data_win_system_eventID:7045
    pivot_on: host
    window: 4h
  - name: Rundll32 spawned by services.exe
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Ss]ervices\.exe/ AND data_win_eventdata_image:/.*[Rr]undll32\.exe/
    pivot_on: host
    window: 2h
  - name: Network logons from remote hosts
    query: data_win_system_eventID:4624 AND data_win_eventdata_logonType:3
    pivot_on: host
    window: 2h
  - name: Admin share access
    query: data_win_system_eventID:5140 AND data_win_eventdata_shareName:/.*(ADMIN|C)\$/
    pivot_on: host
    window: 2h
  - name: Rundll32 network connections
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*[Rr]undll32\.exe/
    pivot_on: host
    window: 4h
