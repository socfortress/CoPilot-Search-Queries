name: WhoAmI as Parameter
id: e9142d84-fbe0-401d-ac50-3e519fb00c89
version: 1
schema_version: "1.0"
date: "2022-12-25"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: e9142d84-fbe0-401d-ac50-3e519fb00c89
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a suspicious process command line that uses whoami as first parameter
  (as e.g. used by EfsPotato). MITRE ATT&CK: T1033.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*.exe whoami*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches '*.exe
  whoami*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/blackarrowsec/status/1463805700602224645?s=12
  - https://attack.mitre.org/techniques/T1033/

response:
  message: >
    WhoAmI as Parameter detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1033
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1033
  custom_tags:
    - whoami
    - parameter
    - process_creation
    - sysmon
    - discovery
    - car_2016_03_001
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*\.[Ee][Xx][Ee] [Ww][Hh][Oo][Aa][Mm][Ii].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 8de1cbe8-d6f5-496d-8237-5f44a721c7a0
    name: Whoami.EXE Execution Anomaly
    reason: Same discovery step from an odd parent; shows how whoami was launched
  - id: f1086bf7-a0c4-4a37-9102-01e573caf4a0
    name: Renamed Whoami Execution
    reason: Attackers disguise whoami when the plain call is blocked
  - id: 79ce34ca-af29-4d0e-b832-fc1b377020db
    name: Whoami.EXE Execution From Privileged Process
    reason: Indicates the whoami check ran from a SYSTEM/elevated context, i.e. the exploit succeeded
  - id: 97a80ec7-0e2f-4d05-9ef4-65760e634f6b
    name: Security Privileges Enumeration Via Whoami.EXE
    reason: Privilege check (/priv) is the next step after EfsPotato-style escalation
  - id: 9bd04a79-dabe-4f1f-a5ff-92430265c96b
    name: Privilege Escalation via Named Pipe Impersonation
    reason: EfsPotato-type tools impersonate via named pipes before running whoami to prove SYSTEM
  - id: 2c568c34-bb57-4b43-9d75-19c605b98e70
    name: Windows Create Local Administrator Account Via Net
    reason: After privilege proof, local admin account creation for persistence
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Potato-style exploit tools
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Pp]otato|[Ee]fs[Pp]otato|[Pp]rint[Ss]poofer).*/
    pivot_on: host
    window: 2h
  - name: Whoami privilege and group variants
    query: data_win_system_eventID:"1" AND data_win_eventdata_originalFileName:"whoami.exe" AND data_win_eventdata_commandLine:/.*\/(priv|all|groups).*/
    pivot_on: host
    window: 2h
  - name: SYSTEM processes launched from user-writable paths
    query: data_win_system_eventID:"1" AND data_win_eventdata_user:/.*SYSTEM.*/ AND data_win_eventdata_image:/.*(Users|Temp|ProgramData|Public).*/
    pivot_on: host
    window: 2h
  - name: Suspicious named pipe creation
    query: data_win_system_eventID:"17" AND data_win_eventdata_pipeName:/.*(efsrpc|lsarpc|spoolss).*/
    pivot_on: host
    window: 2h
