name: Write Protect For Storage Disabled
id: 75f7a0e2-7154-4c4d-9eae-5cdb4e0a5c13
version: 1
schema_version: "1.0"
date: "2024-01-18"
author: Sreeman
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 75f7a0e2-7154-4c4d-9eae-5cdb4e0a5c13
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects applications trying to modify the registry in order to disable any
  write-protect property for storage devices. This could be a precursor to a
  ransomware attack and has been an observed technique used by cypherpunk group.
  MITRE ATT&CK: T1685.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*\\\\System\\\\CurrentControlSet\\\\Control*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*Write Protection*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine: "*0*"
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*storage*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*\System\CurrentControlSet\Control*'; data_win_eventdata_commandLine matches
  '*Write Protection*'; data_win_eventdata_commandLine matches '*0*', among
  other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.manageengine.com/products/desktop-central/os-imaging-deployment/media-is-write-protected.html
  - https://attack.mitre.org/techniques/T1685/

response:
  message: >
    Write Protect For Storage Disabled detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1685
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685
  custom_tags:
    - write
    - protect
    - storage
    - process_creation
    - sysmon
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*\\[Ss][Yy][Ss][Tt][Ee][Mm]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt]\\[Cc][Oo][Nn][Tt][Rr][Oo][Ll].*/ AND data_win_eventdata_commandLine:/.*[Ww][Rr][Ii][Tt][Ee] [Pp][Rr][Oo][Tt][Ee][Cc][Tt][Ii][Oo][Nn].*/ AND data_win_eventdata_commandLine:/.*0.*/ AND data_win_eventdata_commandLine:/.*[Ss][Tt][Oo][Rr][Aa][Gg][Ee].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c9fbe8e9-119d-40a6-9b59-dd58a5d84429
    name: Potential Ransomware or Unauthorized MBR Tampering Via Bcdedit.EXE
    reason: Ransomware prep often removes write protection on storage and then tampers with boot/recovery config before encrypting.
  - id: 1444443e-6757-43e4-9ea4-c8fc705f79a2
    name: Boot Configuration Tampering Via Bcdedit.EXE
    reason: Boot config tampering on the same host near the write-protect change is a classic pre-encryption sequence.
  - id: 21ff4ca9-f13a-41ad-b828-0077b2af2e40
    name: Deletion of Volume Shadow Copies via WMI with PowerShell
    reason: Shadow copy deletion follows storage unlocking in ransomware and confirms destructive intent.
  - id: b7e2a8d4-74bb-4b78-adc9-3f92af2d4829
    name: Reg Add Suspicious Paths
    reason: The write-protect change is a registry write; other suspicious reg edits by the same parent show wider tampering.
  - id: 921aa10f-2e74-4cca-9498-98f9ca4d6fdf
    name: Registry Modification Attempt Via VBScript
    reason: The same registry value can be set from a script host, an alternative route for the same change.
  - id: 17769c90-230e-488b-a463-e05c08e9d48f
    name: Powershell Defender Exclusion
    reason: Defence impairment typically accompanies storage/write-protect changes before payload execution.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Registry writes to StorageDevicePolicies
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Ss][Tt][Oo][Rr][Aa][Gg][Ee][Dd][Ee][Vv][Ii][Cc][Ee][Pp][Oo][Ll][Ii][Cc][Ii][Ee][Ss].*/
    pivot_on: host
    window: 2h
  - name: Shadow copy and recovery destruction commands
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*[Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ww][Bb][Aa][Dd][Mm][Ii][Nn].*[Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Bb][Cc][Dd][Ee][Dd][Ii][Tt].*[Rr][Ee][Cc][Oo][Vv][Ee][Rr][Yy][Ee][Nn][Aa][Bb][Ll][Ee][Dd].*/)
    pivot_on: host
    window: 4h
  - name: Diskpart or readonly disk attribute changes
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Dd][Ii][Ss][Kk][Pp][Aa][Rr][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Aa][Tt][Tt][Rr][Ii][Bb][Uu][Tt][Ee][Ss].*[Dd][Ii][Ss][Kk].*[Rr][Ee][Aa][Dd][Oo][Nn][Ll][Yy].*/)
    pivot_on: host
    window: 2h
  - name: Ransom-style encrypted file creation
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.([Ll][Oo][Cc][Kk][Ee][Dd]|[Ee][Nn][Cc][Rr][Yy][Pp][Tt][Ee][Dd]|[Cc][Rr][Yy][Pp][Tt])/
    pivot_on: host
    window: 4h
