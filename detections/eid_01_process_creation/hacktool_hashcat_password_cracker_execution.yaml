name: HackTool - Hashcat Password Cracker Execution
id: 39b31e81-5f5f-4898-9c0e-2160cfc0f9bf
version: 1
schema_version: "1.0"
date: "2023-02-04"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 39b31e81-5f5f-4898-9c0e-2160cfc0f9bf
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Execute Hashcat.exe with provided SAM file from registry of Windows and
  Password list to crack against. MITRE ATT&CK: T1110.002.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\hashcat.exe"
                    case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*-a *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*-m 1000 *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*-r *"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\hashcat.exe'; data_win_eventdata_commandLine matches '*-a *';
  data_win_eventdata_commandLine matches '*-m 1000 *', among other conditions.

known_false_positives: >
  Tools that use similar command line flags and values. Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1110.002/T1110.002.md#atomic-test-1---password-cracking-with-hashcat
  - https://hashcat.net/wiki/doku.php?id=hashcat
  - https://attack.mitre.org/techniques/T1110/002/

response:
  message: >
    HackTool - Hashcat Password Cracker Execution detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1110.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1110.002
  custom_tags:
    - hacktool
    - hashcat
    - password
    - process_creation
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Hh][Aa][Ss][Hh][Cc][Aa][Tt]\.[Ee][Xx][Ee]/ OR (data_win_eventdata_commandLine:/.*-[Aa] .*/ AND data_win_eventdata_commandLine:/.*-[Mm] 1000 .*/ AND data_win_eventdata_commandLine:/.*-[Rr] .*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: fd877b94-9bb5-4191-bb25-d79cbd93c167
    name: Dumping of Sensitive Hives Via Reg.EXE
    reason: Hashcat -m 1000 cracks NTLM hashes from a SAM hive; reg save of SAM/SYSTEM on this host is the usual precursor
  - id: d372f928-ce4f-11eb-a762-acde48001122
    name: Esentutl SAM Copy
    reason: Esentutl copy of the SAM file is an alternate way to obtain the hashes being cracked
  - id: 4e87b8e2-2ee9-4b2a-a715-4727d297ece0
    name: Potential SAM Database Dump
    reason: A SAM database dump file written to disk just before cracking supplies the input hash file
  - id: da63bc76-61ae-11eb-ae93-0242ac130002
    name: Ntdsutil Export NTDS
    reason: Ntdsutil NTDS export gives domain hashes that are then cracked offline
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: Mimikatz is the common source of NTLM hashes handed to Hashcat; cracked passwords feed it next
  - id: a49fa4d5-11db-418c-8473-1e014a8dd462
    name: Lsass Memory Dump via Comsvcs DLL
    reason: LSASS dump via comsvcs produces credential material to crack offline
  - id: c2b86e67-b880-4eec-b045-50bc98ef4844
    name: HackTool - LaZagne Execution
    reason: LaZagne harvests hashes and credentials alongside cracking tooling
  - id: 7ec2c172-dceb-4c10-92c9-87c1881b7e18
    name: HackTool - Rubeus Execution
    reason: Rubeus-roasted Kerberos tickets are cracked with Hashcat; cracked passwords then return as ticket use
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: SAM/SYSTEM/SECURITY hive export via reg or esentutl
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*(([Rr][Ee][Gg]\s+[Ss][Aa][Vv][Ee])|[Ee][Ss][Ee][Nn][Tt][Uu][Tt][Ll]).*(\\[Ss][Aa][Mm]|\\[Ss][Yy][Ss][Tt][Ee][Mm]|\\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]|[Ss][Aa][Mm]\\.[Hh][Ii][Vv][Ee]).*/
    pivot_on: host
    window: 6h
  - name: Credential dumping tool execution
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz]|[Ll][Aa][Zz][Aa][Gg][Nn][Ee]|[Pp][Yy][Pp][Yy][Kk][Aa][Tt][Zz]|[Pp][Ww][Dd][Uu][Mm][Pp]|[Ss][Ee][Cc][Rr][Ee][Tt][Ss][Dd][Uu][Mm][Pp])[^\\]*\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa]|[Ss][Aa][Mm][Dd][Uu][Mm][Pp]|[Ll][Ss][Aa][Dd][Uu][Mm][Pp]).*/)
    pivot_on: host
    window: 6h
  - name: Wordlist, rule and hash files staged
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*([Rr][Oo][Cc][Kk][Yy][Oo][Uu]|[Ww][Oo][Rr][Dd][Ll][Ii][Ss][Tt]|[Hh][Aa][Ss][Hh][Cc][Aa][Tt]|[Pp][Oo][Tt][Ff][Ii][Ll][Ee]|\.[Rr][Uu][Ll][Ee]).*/
    pivot_on: host
    window: 6h
  - name: Hash files archived or uploaded for offline cracking
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*(([Rr][Aa][Rr]|7[Zz]|[Zz][Ii][Pp]).*(\.[Hh][Ii][Vv][Ee]|[Ss][Aa][Mm]|[Nn][Tt][Dd][Ss])|[Cc][Uu][Rr][Ll].*(-[Tt]|--upload-file)).*/
    pivot_on: host
    window: 6h
