name: Rundll32 UNC Path Execution
id: 5cdb711b-5740-4fb2-ba88-f7945027afac
version: 1
schema_version: "1.0"
date: "2022-08-10"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 5cdb711b-5740-4fb2-ba88-f7945027afac
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects rundll32 execution where the DLL is located on a remote location
  (share). MITRE ATT&CK: T1021.002, T1218.011.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\rundll32.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "RUNDLL32.EXE"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*rundll32*"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine: "* \\\\\\\\*"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\rundll32.exe'; data_win_eventdata_originalFileName equals 'RUNDLL32.EXE';
  data_win_eventdata_commandLine matches '*rundll32*', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.cybereason.com/blog/rundll32-the-infamous-proxy-for-executing-malicious-code
  - https://attack.mitre.org/techniques/T1021/002/
  - https://attack.mitre.org/techniques/T1218/011/

response:
  message: >
    Rundll32 UNC Path Execution detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1021.002, T1218.011
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1021.002
    - T1218.011
  custom_tags:
    - rundll32
    - process_creation
    - sysmon
    - execution
    - lateral_movement
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Rr][Uu][Nn][Dd][Ll][Ll]32.*/) AND data_win_eventdata_commandLine:/.* \\\\.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 1412aa78-a24c-4abd-83df-767dfb2c5bbe
    name: Potentially Suspicious WebDAV LNK Execution
    reason: LNK to a WebDAV share is a common precursor loading a remote DLL via rundll32
  - id: 855bc8b5-2ae8-402e-a9ed-b889e6df1900
    name: Copy From Or To Admin Share Or Sysvol Folder
    reason: Staging payloads on shares used for remote DLL loading
  - id: e593cf51-88db-4ee1-b920-37e89012a3c9
    name: Potentially Suspicious Rundll32 Activity
    reason: Companion suspicious rundll32 usage
  - id: c3a99af4-35a9-4668-879e-c09aeb4f2bdf
    name: Rundll32 Execution With Uncommon DLL Extension
    reason: Remote payloads frequently carry odd extensions
  - id: 1723e720-616d-4ddc-ab02-f7e3685a4713
    name: Rundll32 Spawned Via Explorer.EXE
    reason: Raspberry Robin style launch of rundll32 from a remote share
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: SMB or WebDAV connections from rundll32
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ AND (data_win_eventdata_destinationPort:"445" OR data_win_eventdata_destinationPort:"80" OR data_win_eventdata_destinationPort:"443")
    pivot_on: host
    window: 2h
  - name: Net use or WebDAV share mapping
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Nn][Ee][Tt]1? +[Uu][Ss][Ee]|[Ww][Ee][Bb][Dd][Aa][Vv]|[Dd][Aa][Vv][Ww][Ww][Ww][Rr][Oo][Oo][Tt]).*/
    pivot_on: host
    window: 6h
  - name: Children spawned by rundll32
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Cc][Mm][Dd]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Mm][Ss][Hh][Tt][Aa]|[Ww][Mm][Ii][Cc]|[Nn][Ee][Tt]|[Nn][Ee][Tt]1|[Nn][Ss][Ll][Oo][Oo][Kk][Uu][Pp]|[Ww][Hh][Oo][Aa][Mm][Ii])\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Discovery after remote DLL execution
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Ww][Hh][Oo][Aa][Mm][Ii]|[Nn][Ee][Tt]|[Nn][Ee][Tt]1|[Nn][Ll][Tt][Ee][Ss][Tt]|[Ss][Yy][Ss][Tt][Ee][Mm][Ii][Nn][Ff][Oo]|[Ii][Pp][Cc][Oo][Nn][Ff][Ii][Gg]|[Tt][Aa][Ss][Kk][Ll][Ii][Ss][Tt]|[Qq][Uu][Ee][Rr][Yy])\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Persistence after remote DLL execution
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]|[Rr][Ee][Gg])\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*[Rr][Uu][Nn][Dd][Ll][Ll]32.*/ OR data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee].*/)
    pivot_on: host
    window: 24h
