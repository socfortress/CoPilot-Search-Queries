name: Port Forwarding Activity Via SSH.EXE
id: 327f48c1-a6db-4eb8-875a-f6981f1b0183
version: 1
schema_version: "1.0"
date: "2024-03-05"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 327f48c1-a6db-4eb8-875a-f6981f1b0183
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects port forwarding activity via SSH.exe. MITRE ATT&CK: T1572, T1021.001,
  T1021.004.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\ssh.exe"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -R *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /R *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* –R *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* —R *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* ―R *"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches '*\ssh.exe';
  data_win_eventdata_commandLine matches '* -R *';
  data_win_eventdata_commandLine matches '* /R *', among other conditions.

known_false_positives: >
  Administrative activity using a remote port forwarding to a local port.
  Baseline expected activity in your environment and tune this detection before
  relying on it for automated response.

references:
  - https://www.absolomb.com/2018-01-26-Windows-Privilege-Escalation-Guide/
  - https://attack.mitre.org/techniques/T1572/
  - https://attack.mitre.org/techniques/T1021/001/
  - https://attack.mitre.org/techniques/T1021/004/

response:
  message: >
    Port Forwarding Activity Via SSH.EXE detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1572, T1021.001, T1021.004
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1572
    - T1021.001
    - T1021.004
  custom_tags:
    - forwarding
    - process_creation
    - sysmon
    - command_and_control
    - lateral_movement
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss][Ss][Hh]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.* -[Rr] .*/ OR data_win_eventdata_commandLine:/.* \/[Rr] .*/ OR data_win_eventdata_commandLine:/.* –[Rr] .*/ OR data_win_eventdata_commandLine:/.* —[Rr] .*/ OR data_win_eventdata_commandLine:/.* ―[Rr] .*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: f7d7ebd5-a016-46e2-9c54-f9932f2d386d
    name: Potential RDP Tunneling Via SSH
    reason: SSH reverse tunnel commonly used to expose RDP 3389 on the same host
  - id: 7d6d30b8-5b91-4b90-a891-46cccaf29598
    name: Program Executed Using Proxy/Local Command Via SSH.EXE
    reason: ssh.exe abused for command execution alongside forwarding
  - id: 2daa93a0-a5fb-41c5-8cd8-3c11294bfd1f
    name: Potential SSH Tunnel Persistence Install Using A Scheduled Task
    reason: Persisting the tunnel via scheduled task is the follow-on
  - id: 782d6f3e-4c5d-4b8c-92a3-1d05fed72e63
    name: RDP Port Forwarding Rule Added Via Netsh.EXE
    reason: Alternative local port-forward of RDP often paired with SSH tunnels
  - id: 322ed9ec-fcab-4f67-9a34-e7c6aef43614
    name: New Port Forwarding Rule Added Via Netsh.EXE
    reason: Additional pivot/forwarding mechanism on same host
  - id: 48a61b29-389f-4032-b317-b30de6b95314
    name: Suspicious Plink Port Forwarding
    reason: Same tunneling behavior via plink instead of ssh.exe
  - id: 8b0e12da-d3c3-49db-bb4f-256703f380e5
    name: PUA - Chisel Tunneling Tool Execution
    reason: Other tunneling tool used as fallback or in parallel
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Netsh portproxy and firewall changes
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(portproxy|advfirewall.*add|firewall.*add).*/
    pivot_on: host
    window: 6h
  - name: Outbound ssh connections
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*[\\]ssh\.exe/ AND data_win_eventdata_initiated:true
    pivot_on: host
    window: 6h
  - name: Scheduled task or service persisting ssh
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(schtasks|sc(\.exe)? +create|New-Service).*ssh.*/
    pivot_on: host
    window: 6h
  - name: Other tunnel and remote access tools
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*[\\](mstsc|plink|chisel|ngrok|cloudflared)\.exe/ OR data_win_eventdata_commandLine:/.*3389.*/)
    pivot_on: host
    window: 6h
  - name: SSH key or config material created
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*[\\]\.ssh[\\].*/
    pivot_on: host
    window: 6h
