name: WebDav Client Execution Via Rundll32.EXE
id: 2dbd9d3d-9e27-42a8-b8df-f13825c6c3d5
version: 1
schema_version: "1.0"
date: "2023-09-18"
author: Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 2dbd9d3d-9e27-42a8-b8df-f13825c6c3d5
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects "svchost.exe" spawning "rundll32.exe" with command arguments like
  "C:\windows\system32\davclnt.dll,DavSetCookie". This could be an indicator of
  exfiltration or use of WebDav to launch code (hosted on a WebDav server).
  MITRE ATT&CK: T1048.003.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_parentImage:
              value: "*\\\\svchost.exe"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\rundll32.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "RUNDLL32.EXE"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*C:\\\\windows\\\\system32\\\\davclnt.dll,DavSetCookie*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\svchost.exe'; data_win_eventdata_image matches '*\rundll32.exe';
  data_win_eventdata_originalFileName equals 'RUNDLL32.EXE', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/OTRF/detection-hackathon-apt29/issues/17
  - https://github.com/OTRF/ThreatHunter-Playbook/blob/2d4257f630f4c9770f78d0c1df059f891ffc3fec/docs/evals/apt29/detections/7.B.4_C10730EA-6345-4934-AA0F-B0EFCA0C4BA6.md
  - https://attack.mitre.org/techniques/T1048/003/

response:
  message: >
    WebDav Client Execution Via Rundll32.EXE detected on host $agent_name$.
    Matched data_win_eventdata_parentImage: $data_win_eventdata_parentImage$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1048.003
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1048.003
  custom_tags:
    - webdav
    - client
    - rundll32
    - process_creation
    - sysmon
    - exfiltration
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Dd][Aa][Vv][Cc][Ll][Nn][Tt]\.[Dd][Ll][Ll],[Dd][Aa][Vv][Ss][Ee][Tt][Cc][Oo][Oo][Kk][Ii][Ee].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 982e9f2d-1a85-4d5b-aea4-31f5e97c6555
    name: Suspicious WebDav Client Execution Via Rundll32.EXE
    reason: Sibling detection of davclnt.dll DavSetCookie with external hosts; confirms remote WebDAV staging.
  - id: f0507c0f-a3a2-40f5-acc6-7f543c334993
    name: Suspicious File Execution From Internet Hosted WebDav Share
    reason: Execution of payloads from the WebDAV share is the direct follow-on.
  - id: 7e6237fe-3ddb-438f-9381-9bf9de5af8d0
    name: Windows Internet Hosted WebDav Share Mount Via Net.EXE
    reason: Alternative WebDAV mount method used for the same staging or exfil.
  - id: 1412aa78-a24c-4abd-83df-767dfb2c5bbe
    name: Potentially Suspicious WebDAV LNK Execution
    reason: LNK files pointing to WebDAV are a common initial vector that triggers davclnt via svchost.
  - id: 5cdb711b-5740-4fb2-ba88-f7945027afac
    name: Rundll32 UNC Path Execution
    reason: Rundll32 loading DLLs from UNC or WebDAV paths is the code-exec variant of the same channel.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Execution from WebDAV paths
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*DavWWWRoot.*/
    pivot_on: host
    window: 2h
  - name: Outbound web connections by svchost
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*[Ss]vchost\.exe/ AND (data_win_eventdata_destinationPort:80 OR data_win_eventdata_destinationPort:443 OR data_win_eventdata_destinationPort:8080)
    pivot_on: host
    window: 2h
  - name: Net use or WebClient service activity
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*[Nn]et[1]?(\.exe)? +use.*http.*/ OR data_win_eventdata_commandLine:/.*[Ww]eb[Cc]lient.*/)
    pivot_on: host
    window: 4h
  - name: Rundll32 with other DLLs
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Rr]undll32\.exe/ AND data_win_eventdata_commandLine:/.*\.dll.*/
    pivot_on: host
    window: 2h
