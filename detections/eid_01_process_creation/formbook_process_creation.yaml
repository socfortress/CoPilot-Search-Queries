name: Formbook Process Creation
id: 032f5fb3-d959-41a5-9263-4173c802dc2b
version: 1
schema_version: "1.0"
date: "2022-10-06"
author: Florian Roth (Nextron Systems), oscd.community, Jonhnathan Ribeiro
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 032f5fb3-d959-41a5-9263-4173c802dc2b
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects Formbook like process executions that inject code into a set of files
  in the System32 folder, which executes a special command command line to
  delete the dropper from the AppData Temp folder. We avoid false positives by
  excluding all parent process with command line parameters. MITRE ATT&CK:
  T1587.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_parentCommandLine:
                    value: "C:\\\\Windows\\\\System32\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentCommandLine:
                    value: "C:\\\\Windows\\\\SysWOW64\\\\*"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_parentCommandLine:
              value: "*.exe"
              case_insensitive: true
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*/c*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*del*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*C:\\\\Users\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*\\\\AppData\\\\Local\\\\Temp\\\\*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*/c*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*del*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*C:\\\\Users\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*\\\\Desktop\\\\*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*/C*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*type nul >*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*C:\\\\Users\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*\\\\Desktop\\\\*"
                          case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*.exe"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentCommandLine
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentCommandLine matches
  'C:\Windows\System32\*'; data_win_eventdata_parentCommandLine matches
  'C:\Windows\SysWOW64\*'; data_win_eventdata_parentCommandLine matches '*.exe',
  among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://inquest.net/blog/2018/06/22/a-look-at-formbook-stealer
  - https://app.any.run/tasks/388d5802-aa48-4826-b069-250420504758/
  - https://app.any.run/tasks/8e22486b-5edc-4cef-821c-373e945f296c/
  - https://app.any.run/tasks/62bb01ae-25a4-4180-b278-8e464a90b8d7/
  - https://attack.mitre.org/techniques/T1587/001/

response:
  message: >
    Formbook Process Creation detected on host $agent_name$. Matched
    data_win_eventdata_parentCommandLine:
    $data_win_eventdata_parentCommandLine$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1587.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_parentCommandLine
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1587.001
  custom_tags:
    - formbook
    - process_creation
    - sysmon
    - resource_development
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_parentCommandLine:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\.*/ OR data_win_eventdata_parentCommandLine:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Ww][Oo][Ww]64\\.*/) AND data_win_eventdata_parentCommandLine:/.*\.[Ee][Xx][Ee]/ AND ((data_win_eventdata_commandLine:/.*\/[Cc].*/ AND data_win_eventdata_commandLine:/.*[Dd][Ee][Ll].*/ AND data_win_eventdata_commandLine:/.*[Cc]:\\[Uu][Ss][Ee][Rr][Ss]\\.*/ AND data_win_eventdata_commandLine:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\.*/) OR (data_win_eventdata_commandLine:/.*\/[Cc].*/ AND data_win_eventdata_commandLine:/.*[Dd][Ee][Ll].*/ AND data_win_eventdata_commandLine:/.*[Cc]:\\[Uu][Ss][Ee][Rr][Ss]\\.*/ AND data_win_eventdata_commandLine:/.*\\[Dd][Ee][Ss][Kk][Tt][Oo][Pp]\\.*/) OR (data_win_eventdata_commandLine:/.*\/[Cc].*/ AND data_win_eventdata_commandLine:/.*[Tt][Yy][Pp][Ee] [Nn][Uu][Ll] \>.*/ AND data_win_eventdata_commandLine:/.*[Cc]:\\[Uu][Ss][Ee][Rr][Ss]\\.*/ AND data_win_eventdata_commandLine:/.*\\[Dd][Ee][Ss][Kk][Tt][Oo][Pp]\\.*/)) AND data_win_eventdata_commandLine:/.*\.[Ee][Xx][Ee]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 678eb5f4-8597-4be6-8be7-905e4234b53a
    name: Droppers Exploiting CVE-2017-11882
    reason: CVE-2017-11882 droppers are a classic Formbook delivery vector via malicious Office documents.
  - id: 868955d9-697e-45d4-a3da-360cefd7c216
    name: Potential Exploitation Attempt From Office Application
    reason: Office spawning child processes is the usual first stage preceding a Formbook dropper.
  - id: b6676963-0353-4f88-90f5-36c20d443c6a
    name: Cscript/Wscript Potentially Suspicious Child Process
    reason: 'Script host spawning children: common loader chain delivering Formbook.'
  - id: ded2b07a-d12f-4284-9b76-653e37b6c8b0
    name: Potentially Suspicious Ping/Copy Command Combination
    reason: Ping/copy/delete combination is the same self-delete anti-forensics idiom of commodity droppers.
  - id: 204b17ae-4007-471b-917b-b917b315c5db
    name: Greedy File Deletion Using Del
    reason: 'Greedy del of files: dropper cleanup after the stealer has injected.'
  - id: 89e1490f-1a3e-452a-bbb8-b68a5f58072f
    name: Injected Browser Process Spawning Rundll32 - GuLoader Activity
    reason: GuLoader is a frequent loader for Formbook; injected browser spawning rundll32.
  - id: 19b3806e-46f2-4b4c-9337-e3d8653245ea
    name: Lummac Stealer Activity - Execution Of More.com And Vbc.exe
    reason: Another commodity stealer using injection into system binaries (more.com/vbc.exe).
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Document or script parents spawning executables
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\([Ww][Ii][Nn][Ww][Oo][Rr][Dd]|[Ee][Xx][Cc][Ee][Ll]|[Oo][Uu][Tt][Ll][Oo][Oo][Kk]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt])\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 4h
  - name: Executable dropped into AppData
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 4h
  - name: Remote thread injection into system binaries
    query: data_win_system_eventID:"8" AND data_win_eventdata_targetImage:/.*\\([Ss][Yy][Ss][Tt][Ee][Mm]32|[Ss][Yy][Ss][Ww][Oo][Ww]64)\\.*/
    pivot_on: host
    window: 2h
  - name: Browser or mail process access (credential theft)
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\([Cc][Hh][Rr][Oo][Mm][Ee]|[Ff][Ii][Rr][Ee][Ff][Oo][Xx]|[Mm][Ss][Ee][Dd][Gg][Ee]|[Oo][Uu][Tt][Ll][Oo][Oo][Kk])\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 4h
  - name: Network connections from System32 helper binaries
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Ss][Yy][Ss][Tt][Ee][Mm]32|[Ss][Yy][Ss][Ww][Oo][Ww]64)\\([Ww][Uu][Aa][Uu][Cc][Ll][Tt]|[Nn][Ee][Tt][Ss][Tt][Aa][Tt]|[Mm][Ss][Tt][Ss][Cc]|[Ss][Yy][Ss][Tt][Ee][Mm][Pp][Rr][Oo][Pp][Ee][Rr][Tt][Ii][Ee][Ss][Aa][Dd][Vv][Aa][Nn][Cc][Ee][Dd]|[Ww][Ll][Aa][Nn][Ee][Xx][Tt]|[Nn][Ee][Tt][Ss][Hh]|[Ww][Ii][Nn][Ii][Nn][Ii][Tt]|[Cc][Mm][Dd]|[Cc][Ll][Ii][Pp]|[Mm][Ss][Ii][Ee][Xx][Ee][Cc])\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 4h
