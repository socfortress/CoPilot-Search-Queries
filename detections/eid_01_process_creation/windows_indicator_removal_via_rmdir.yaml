name: Windows Indicator Removal Via Rmdir
id: windows-indicator-removal-rmdir-001
version: 1
schema_version: "1.0"
date: "2026-02-23"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  Detects rmdir command with /s and /q flags for silent recursive directory 
  deletion. Malware uses this to remove traces and components during cleanup. 
  Used by DarkGate malware and APT37.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - wildcard:
            data_win_eventdata_commandLine: "*rmdir*"
        - wildcard:
            data_win_eventdata_commandLine: "*/s*"
        - wildcard:
            data_win_eventdata_commandLine: "*/q*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-23 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-23 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Windows endpoints with Sysmon 
  installed and configured to log process creation events (EventID 1) with full 
  command-line arguments.

known_false_positives: >
  Users and administrators may use rmdir for cleanup. Investigate target path 
  and parent process context.

references:
  - https://attack.mitre.org/techniques/T1070/
  - https://malpedia.caad.fkie.fraunhofer.de/details/win.darkgate

response:
  message: >
    Directory tree deletion via rmdir on $agent_name$. 
    Command: $data_win_eventdata_commandLine$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1070
  risk_score: 25
  severity: low
  risk_objects:
    - field: agent_name
      type: system
      score: 25
  threat_objects: []

tags:
  analytic_story:
    - DarkGate Malware
    - APT37 Rustonotto and FadeStealer
  asset_type: Endpoint
  mitre_attack_id:
    - T1070
  custom_tags:
    - rmdir
    - indicator_removal
    - anti_forensics
    - cleanup
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*rmdir.*/ AND data_win_eventdata_commandLine:/.*\/s.*/ AND data_win_eventdata_commandLine:/.*\/q.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 204b17ae-4007-471b-917b-b917b315c5db
    name: Greedy File Deletion Using Del
    reason: 'Same cleanup phase: bulk file deletion paired with recursive directory removal.'
  - id: 88516f06-ebe0-47ad-858e-ae9fd060ddea
    name: COLDSTEEL RAT Cleanup Command Execution
    reason: Malware self-cleanup via cmd delete commands; overlapping behaviour.
  - id: 54786ddc-5b8a-11ed-9b6a-0242ac120002
    name: Suspicious Ping/Del Command Combination
    reason: Delay-then-delete self-deletion idiom used alongside rmdir cleanup.
  - id: windows-eventlog-cleared-wevtutil-001
    name: Windows Eventlog Cleared Via Wevtutil
    reason: Log clearing is the other half of trace removal at the end of an intrusion.
  - id: 0649be4a-aeb0-45b0-b89e-7f1668f6d9c0
    name: IIS WebServer Log Deletion via CommandLine Utilities
    reason: Directory and log wipe on web servers by the same cleanup commands.
  - id: cc36992a-4671-4f21-a91d-6c2b72a2edf5
    name: Suspicious Eventlog Clearing or Configuration Change Activity
    reason: Eventlog tampering after directory wipes indicates deliberate anti-forensics.
  - id: 4b046706-5789-4673-b111-66f25fe99534
    name: Deleted Data Overwritten Via Cipher.EXE
    reason: Cipher /w after deletion prevents recovery, a stronger variant of the same cleanup.
  - id: 639c9081-f482-47d3-a0bd-ddee3d4ecd76
    name: All Backups Deleted Via Wbadmin.EXE
    reason: Destroying backups alongside tool directories signals end-stage impact or ransomware.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other deletion commands
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Dd]el\s+.*\/[FfQq].*/ OR /.*[Rr]d\s+\/[Ss].*/ OR /.*[Rr]emove\-[Ii]tem.*\-[Rr]ecurse.*/ OR /.*[Cc]ipher.*\/[Ww].*/)
    pivot_on: host
    window: 4h
  - name: Log clearing and audit tampering
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ww]evtutil.*(cl|clear\-log).*/ OR *Clear\-EventLog* OR *auditpol*)
    pivot_on: host
    window: 6h
  - name: Shadow copy and backup destruction
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(*vssadmin* OR *wbadmin* OR *bcdedit* OR *shadowcopy*) AND data_win_eventdata_commandLine:(*delete* OR *recoveryenabled*)
    pivot_on: host
    window: 6h
  - name: File and directory delete events by shells
    query: data_win_system_eventID:(23 OR 26) AND data_win_eventdata_image:(/.*[Cc]md\.exe/ OR /.*[Pp]ower[Ss]hell\.exe/)
    pivot_on: host
    window: 4h
  - name: Cmd launched by script hosts or Office
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Cc]md\.exe/ AND data_win_eventdata_parentImage:(/.*[Ww]script\.exe/ OR /.*[Cc]script\.exe/ OR /.*[Pp]ower[Ss]hell\.exe/ OR /.*[Mm]shta\.exe/ OR /.*[Ww]inword\.exe/)
    pivot_on: host
    window: 4h
