name: Windows Indicator Removal Via Rmdir
id: windows-indicator-removal-rmdir-001
version: 1
schema_version: "1.0"
date: "2026-02-23"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  Detects rmdir command with /s and /q flags for silent recursive directory 
  deletion. Malware uses this to remove traces and components during cleanup. 
  Used by DarkGate malware and APT37.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - wildcard:
            data_win_eventdata_commandLine: "*rmdir*"
        - wildcard:
            data_win_eventdata_commandLine: "*/s*"
        - wildcard:
            data_win_eventdata_commandLine: "*/q*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-23 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-23 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Windows endpoints with Sysmon 
  installed and configured to log process creation events (EventID 1) with full 
  command-line arguments.

known_false_positives: >
  Users and administrators may use rmdir for cleanup. Investigate target path 
  and parent process context.

references:
  - https://attack.mitre.org/techniques/T1070/
  - https://malpedia.caad.fkie.fraunhofer.de/details/win.darkgate

response:
  message: >
    Directory tree deletion via rmdir on $agent_name$. 
    Command: $data_win_eventdata_commandLine$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1070
  risk_score: 25
  severity: low
  risk_objects:
    - field: agent_name
      type: system
      score: 25
  threat_objects: []

tags:
  analytic_story:
    - DarkGate Malware
    - APT37 Rustonotto and FadeStealer
  asset_type: Endpoint
  mitre_attack_id:
    - T1070
  custom_tags:
    - rmdir
    - indicator_removal
    - anti_forensics
    - cleanup
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*rmdir.*/ AND data_win_eventdata_commandLine:/.*\/s.*/ AND data_win_eventdata_commandLine:/.*\/q.*/

correlation:
  # Authored by the correlation engine for review. Related CoPilot Searches to run
  # around an alert from this rule, scoped to the same host/user/IP within the window.
  related_rules:
    - id: 5ee2bcd0-b2ff-11eb-bb34-acde48001122
      name: "Delete ShadowCopy With PowerShell"
      reason: "same analytic story: DarkGate Malware"
    - id: 27c3a83d-cada-47c6-9042-67baf19d2574
      name: "Detect PsExec With accepteula Flag"
      reason: "same analytic story: DarkGate Malware"
    - id: 72170ec5-f7d2-42f5-aefb-2b8be6aad15f
      name: "Detect Regasm Spawning a Process"
      reason: "same analytic story: DarkGate Malware"
    - id: 683e6196-b8e8-11eb-9a79-acde48001122
      name: "Detect Renamed PSExec"
      reason: "same analytic story: DarkGate Malware"
    - id: 91c79f14-5b41-11eb-ae93-0242ac130002
      name: "Detect Rundll32 Inline HTA Execution"
      reason: "same analytic story: APT37 Rustonotto and FadeStealer"
    - id: b06a555e-dce0-417d-a2eb-28a5d8d66ef7
      name: "Execution of File with Multiple Extensions"
      reason: "same analytic story: DarkGate Malware"
    - id: 9be56c82-b1cc-4318-87eb-d138afaaca39
      name: "Malicious PowerShell Process - Execution Policy Bypass"
      reason: "same analytic story: APT37 Rustonotto and FadeStealer"
    - id: 4aa5d062-e893-11eb-9eb2-acde48001122
      name: "Mshta spawning Rundll32 OR Regsvr32 Process"
      reason: "same analytic story: APT37 Rustonotto and FadeStealer"
    - id: windows-powershell-remote-services-add-trustedhost-001
      name: "Powershell Remote Services Add TrustedHost"
      reason: "same analytic story: DarkGate Malware"
    - id: ba570b3a-d356-11eb-8358-acde48001122
      name: "Recursive Delete of Directory In Batch CMD"
      reason: "same analytic story: APT37 Rustonotto and FadeStealer"
    - id: windows-access-token-manipulation-sedebugprivilege-001
      name: "Windows Access Token Manipulation SeDebugPrivilege"
      reason: "same analytic story: DarkGate Malware"
    - id: Windows_Archive_Collected_Data_via_Powershell
      name: "Windows Archive Collected Data via Powershell"
      reason: "same analytic story: APT37 Rustonotto and FadeStealer"
  window: 1h
  enrichment_searches:
  # NEW ad-hoc searches the engine runs around an alert from this rule, scoped to
  # the alert's host/user/IP within the window (not existing CoPilot Searches).
    - name: "Sysmon activity on this host in the window"
      query: 'data_win_system_channel:"Microsoft-Windows-Sysmon/Operational"'
      pivot_on: [host]
      window: 1h
    - name: "Process creation on this host"
      query: 'data_win_system_eventID:"1"'
      pivot_on: [host]
      window: 1h
    - name: "Network connections from this host"
      query: 'data_win_system_eventID:"3"'
      pivot_on: [host]
      window: 1h
    - name: "High-severity alerts on this host"
      query: 'rule_level:>=10'
      pivot_on: [host]
      window: 1h
