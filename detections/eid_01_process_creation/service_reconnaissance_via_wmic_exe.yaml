name: Service Reconnaissance Via Wmic.EXE
id: 76f55eaa-d27f-4213-9d45-7b0e4b60bbae
version: 1
schema_version: "1.0"
date: "2026-01-07"
author: frack113, Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 76f55eaa-d27f-4213-9d45-7b0e4b60bbae
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  An adversary might use WMI to check if a certain remote service is running on
  a remote device. When the test completes, a service information will be
  displayed on the screen if it exists. A common feedback message is that "No
  instance(s) Available" if the service queried is not running. A common error
  message is "Node - (provided IP or default) ERROR Description =The RPC server
  is unavailable" if the provided remote host is unreachable. MITRE ATT&CK:
  T1047.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\WMIC.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "wmic.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*service*"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_commandLine"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*stopservice*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*startservice*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*Change*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*Create*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*Delete*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*PauseService*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*ResumeService*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*SetSecurityDescriptor*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*StartService*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*StopService*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*UserControlService*"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\WMIC.exe'; data_win_eventdata_originalFileName equals 'wmic.exe';
  data_win_eventdata_commandLine matches '*service*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1047/T1047.md
  - https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/wmic
  - https://learn.microsoft.com/en-us/windows/win32/cimwin32prov/win32-service
  - https://attack.mitre.org/techniques/T1047/

response:
  message: >
    Service Reconnaissance Via Wmic.EXE detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1047
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1047
  custom_tags:
    - service
    - reconnaissance
    - process_creation
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/ AND _exists_:data_win_eventdata_commandLine AND NOT (data_win_eventdata_commandLine:/.*[Ss][Tt][Oo][Pp][Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Tt][Aa][Rr][Tt][Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Cc][Hh][Aa][Nn][Gg][Ee].*/ OR data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Pp][Aa][Uu][Ss][Ee][Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Ss][Uu][Mm][Ee][Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Tt][Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy][Dd][Ee][Ss][Cc][Rr][Ii][Pp][Tt][Oo][Rr].*/ OR data_win_eventdata_commandLine:/.*[Ss][Tt][Aa][Rr][Tt][Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Tt][Oo][Pp][Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Uu][Ss][Ee][Rr][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 68bcd73b-37ef-49cb-95fc-edc809730be6
    name: Potential Unquoted Service Path Reconnaissance Via Wmic.EXE
    reason: Service enumeration often targets privilege-escalation paths
  - id: 15434e33-5027-4914-88d5-3d4145ec25a9
    name: Potential Product Reconnaissance Via Wmic.EXE
    reason: Co-occurring WMIC discovery of installed products
  - id: 221b251a-357a-49a9-920a-271802777cc0
    name: Potential Process Reconnaissance via Wmic.EXE
    reason: 'Same discovery phase: running process listing'
  - id: 847d5ff3-8a31-4737-a970-aeae8fe21765
    name: Potential Tampering With Security Products Via WMIC
    reason: Recon of security services precedes tampering
  - id: 0b7163dc-7eee-4960-af17-c0cd517f92da
    name: Service Started/Stopped Via Wmic.EXE
    reason: 'Follow-on: acting on discovered services'
  - id: c0514f28-fdae-42df-b886-06e2b2bc5b37
    name: Service Startup Type Change Via Wmic.EXE
    reason: 'Follow-on: modifying services found'
  - id: 970007b7-ce32-49d0-a4a4-fbef016950bd
    name: Potential Configuration And Service Reconnaissance Via Reg.EXE
    reason: Same service recon via the registry
  - id: d95de845-b83c-4a9a-8a6a-4fc802ebf6c0
    name: Suspicious Group And Account Reconnaissance Activity Using Net.EXE
    reason: Typical companion discovery commands
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other WMIC discovery commands
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Ww][Mm][Ii][Cc]\.exe/ AND data_win_eventdata_commandLine:(/.* (process|product|qfe|useraccount|group|computersystem|logicaldisk|startup|os) .*/ OR /.*\/[Nn]ode:.*/)
    pivot_on: host
    window: 4h
  - name: WMIC against remote nodes
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Ww][Mm][Ii][Cc]\.exe/ AND data_win_eventdata_commandLine:/.*\/[Nn]ode:.*/
    pivot_on: host
    window: 4h
  - name: Native service enumeration tools
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*sc(\.exe)? +(query|queryex|qc).*/ OR /.*[Gg]et-[Ss]ervice.*/ OR /.*tasklist.*\/svc.*/ OR /.*net +start.*/)
    pivot_on: host
    window: 4h
  - name: Service stop or tamper after recon
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*net +stop.*/ OR /.*sc(\.exe)? +(stop|config|delete).*/ OR /.*[Ss]top-[Ss]ervice.*/)
    pivot_on: host
    window: 4h
  - name: WMIC spawned from script or Office parents
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Ww][Mm][Ii][Cc]\.exe/ AND data_win_eventdata_parentImage:(/.*[Pp]ower[Ss]hell\.exe/ OR /.*[Cc]md\.exe/ OR /.*[Ww]script\.exe/ OR /.*[Ee]xcel\.exe/ OR /.*[Ww]inword\.exe/)
    pivot_on: host
    window: 4h
