name: Qakbot Regsvr32 Calc Pattern
id: 0033cf83-fb87-446d-9cac-43d63ad4d5a9
version: 1
schema_version: "1.0"
date: "2024-03-05"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 0033cf83-fb87-446d-9cac-43d63ad4d5a9
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a specific command line of "regsvr32" where the "calc" keyword is used
  in conjunction with the "/s" flag. This behavior is often seen used by Qakbot.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\regsvr32.exe"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -s*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /s*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* –s*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* —s*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* ―s*"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* calc"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\regsvr32.exe'; data_win_eventdata_commandLine matches '* -s*';
  data_win_eventdata_commandLine matches '* /s*', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/pr0xylife/Qakbot/

response:
  message: >
    Qakbot Regsvr32 Calc Pattern detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - qakbot
    - regsvr32
    - pattern
    - process_creation
    - sysmon
    - execution
    - stealth
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.* -[Ss].*/ OR data_win_eventdata_commandLine:/.* \/[Ss].*/ OR data_win_eventdata_commandLine:/.* –[Ss].*/ OR data_win_eventdata_commandLine:/.* —[Ss].*/ OR data_win_eventdata_commandLine:/.* ―[Ss].*/) AND data_win_eventdata_commandLine:/.* [Cc][Aa][Ll][Cc]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: cf879ffb-793a-4753-9a14-bc8f37cc90df
    name: Potential Qakbot Rundll32 Execution
    reason: Qakbot alternates regsvr32 and rundll32 to load its DLL.
  - id: bfd34392-c591-4009-b938-9fd985a28b85
    name: Qakbot Rundll32 Fake DLL Extension Execution
    reason: Qakbot DLLs carry fake extensions across execution variants.
  - id: 6f0947a4-1c5e-4e0d-8ac7-53159b8f23ca
    name: Potentially Suspicious Child Process Of Regsvr32
    reason: Loaded Qakbot injects into processes spawned from regsvr32.
  - id: 089fc3d2-71e8-4763-a8a5-c97fbb0a403e
    name: Regsvr32 DLL Execution With Suspicious File Extension
    reason: The delivery DLL is often named with a non-.dll extension.
  - id: 438025f9-5856-4663-83f7-52f878a70a50
    name: Suspicious Microsoft Office Child Process
    reason: Qakbot is commonly launched from Office lures.
  - id: ab37a6ec-6068-432b-a64e-2c7bf95b1d22
    name: Scripting/CommandLine Process Spawned Regsvr32
    reason: A parent script or cmd launching regsvr32 reveals the delivery stage.
  - id: 9525dc73-0327-438c-8c04-13c0e037e9da
    name: Regsvr32 Execution From Potential Suspicious Location
    reason: The Qakbot DLL typically sits in user-writable paths.
  - id: c248c896-e412-4279-8c15-1c558067b6fa
    name: Enumerate All Information With Whoami.EXE
    reason: Qakbot performs whoami and network discovery after execution.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Regsvr32 loading DLLs from user paths
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*([Aa]pp[Dd]ata|[Tt]emp|[Pp]rogram[Dd]ata|[Uu]sers.[Pp]ublic).*/
    pivot_on: host
    window: 6h
  - name: Regsvr32 or rundll32 network connections
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*([Rr][Ee][Gg][Ss][Vv][Rr]32|[Rr][Uu][Nn][Dd][Ll][Ll]32)\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 6h
  - name: Qakbot-style discovery burst
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*(whoami|nltest|net1?|arp|ipconfig|nslookup|route|netstat)\.exe/
    pivot_on: host
    window: 2h
  - name: Scheduled task or Run key persistence
    query: (data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Ss]chtasks\.exe/ AND data_win_eventdata_commandLine:/.*\/[Cc]reate.*/) OR (data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*CurrentVersion.[Rr]un.*/)
    pivot_on: host
    window: 6h
  - name: Files created by regsvr32
    query: data_win_system_eventID:11 AND data_win_eventdata_image:/.*[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 6h
