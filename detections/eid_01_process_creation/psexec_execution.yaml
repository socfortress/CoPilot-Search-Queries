name: Psexec Execution
id: 730fc21b-eaff-474b-ad23-90fd265d4988
version: 1
schema_version: "1.0"
date: "2023-02-28"
author: omkar72
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 730fc21b-eaff-474b-ad23-90fd265d4988
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects user accept agreement execution in psexec commandline. MITRE ATT&CK:
  T1569, T1021.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\psexec.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "psexec.c"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\psexec.exe'; data_win_eventdata_originalFileName equals 'psexec.c'.

known_false_positives: >
  Administrative scripts. Baseline expected activity in your environment and
  tune this detection before relying on it for automated response.

references:
  - https://www.fireeye.com/blog/threat-research/2020/10/kegtap-and-singlemalt-with-a-ransomware-chaser.html
  - https://attack.mitre.org/techniques/T1569/
  - https://attack.mitre.org/techniques/T1021/

response:
  message: >
    Psexec Execution detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1569, T1021
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1569
    - T1021
  custom_tags:
    - psexec
    - process_creation
    - sysmon
    - execution
    - lateral_movement
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Pp][Ss][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Pp][Ss][Ee][Xx][Ee][Cc]\.[Cc]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 27c3a83d-cada-47c6-9042-67baf19d2574
    name: Detect PsExec With accepteula Flag
    reason: Same tool seen by command-line flag; corroborates first-time use.
  - id: ea011323-7045-460b-b2d7-0f7442ea6b38
    name: Potential PsExec Remote Execution
    reason: Remote-target syntax means lateral movement rather than local use.
  - id: fdfcbd78-48f1-4a4b-90ac-d82241e368c5
    name: PsExec Service Execution
    reason: Target-side PSEXESVC creation is the other half of the same lateral move.
  - id: 7c0dcd3d-acf8-4f71-9570-f448b0034f94
    name: PsExec Service Child Process Execution as LOCAL SYSTEM
    reason: Commands the service runs on the target after psexec connects.
  - id: 304afd73-55a5-4bb9-8c21-0b1fc84ea9e4
    name: PSEXEC Remote Execution File Artefact
    reason: PSEXESVC.exe dropped into ADMIN$ on the target.
  - id: 41504465-5e3a-4a5b-a5b4-2a0baadd4463
    name: PsExec Tool Execution From Suspicious Locations - PipeName
    reason: psexesvc pipe from non-standard paths indicates an attacker-staged copy.
  - id: 683e6196-b8e8-11eb-9a79-acde48001122
    name: Detect Renamed PSExec
    reason: Attackers rename psexec to evade this image-name detection.
  - id: 855bc8b5-2ae8-402e-a9ed-b889e6df1900
    name: Copy From Or To Admin Share Or Sysvol Folder
    reason: Staging tools to ADMIN$/C$ commonly precedes psexec.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: PsExec remote syntax and SYSTEM context
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Pp][Ss][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]|[Pp][Ss][Ee][Xx][Ee][Cc]64\.[Ee][Xx][Ee]|[Pp][Aa][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*\\\\.*/ OR data_win_eventdata_commandLine:/.* \-[Ss] .*/ OR data_win_eventdata_commandLine:/.* \-[Uu] .*/ OR data_win_eventdata_commandLine:/.* \-[Pp] .*/ OR data_win_eventdata_commandLine:/.*[Aa][Cc][Cc][Ee][Pp][Tt][Ee][Uu][Ll][Aa].*/)
    pivot_on:
    - host
    window: 4h
  - name: PSEXESVC service pipes
    query: (data_win_system_eventID:"17" OR data_win_system_eventID:"18") AND data_win_eventdata_pipeName:/.*([Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]|[Pp][Aa][Ee][Xx][Ee][Cc]|[Rr][Ee][Mm][Cc][Oo][Mm]|[Cc][Ss][Ee][Xx][Ee][Cc]).*/
    pivot_on:
    - host
    window: 4h
  - name: Children of PSEXESVC
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 4h
  - name: Post-lateral-movement recon, dumping or ransomware prep
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ww][Hh][Oo][Aa][Mm][Ii] \/[Aa][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt] [Gg][Rr][Oo][Uu][Pp].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ll][Tt][Ee][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn] [Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ww][Bb][Aa][Dd][Mm][Ii][Nn] [Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Bb][Cc][Dd][Ee][Dd][Ii][Tt].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/)
    pivot_on:
    - host
    window: 4h
  - name: Executables written to admin shares or Windows temp
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*([Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]\.[Ee][Xx][Ee]|\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\).*/ AND data_win_eventdata_targetFilename:/.*\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 4h
