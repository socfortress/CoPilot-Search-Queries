name: Potential Password Spraying Attempt Using Dsacls.EXE
id: bac9fb54-2da7-44e9-988f-11e9a5edbc0c
version: 1
schema_version: "1.0"
date: "2023-02-04"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: bac9fb54-2da7-44e9-988f-11e9a5edbc0c
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects possible password spraying attempts using Dsacls. MITRE ATT&CK: T1218.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\dsacls.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "DSACLS.EXE"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*/user:*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*/passwd:*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\dsacls.exe'; data_win_eventdata_originalFileName equals 'DSACLS.EXE';
  data_win_eventdata_commandLine matches '*/user:*', among other conditions.

known_false_positives: >
  Legitimate use of dsacls to bind to an LDAP session. Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://www.ired.team/offensive-security-experiments/active-directory-kerberos-abuse/using-dsacls-to-check-ad-object-permissions#password-spraying-anyone
  - https://ss64.com/nt/dsacls.html
  - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2012-r2-and-2012/cc771151(v=ws.11)
  - https://attack.mitre.org/techniques/T1218/

response:
  message: >
    Potential Password Spraying Attempt Using Dsacls.EXE detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1218
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218
  custom_tags:
    - password
    - spraying
    - dsacls
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Dd][Ss][Aa][Cc][Ll][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Dd][Ss][Aa][Cc][Ll][Ss]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*\/[Uu][Ss][Ee][Rr]:.*/ AND data_win_eventdata_commandLine:/.*\/[Pp][Aa][Ss][Ss][Ww][Dd]:.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 01c42d3c-242d-4655-85b2-34f1739632f7
    name: Potentially Over Permissive Permissions Granted Using Dsacls.EXE
    reason: 'Same binary: dsacls used to grant permissive ACLs once credentials are validated.'
  - id: aaafa146-074c-11eb-adc1-0242ac120002
    name: HackTool - Hydra Password Bruteforce Execution
    reason: Hydra brute force is another credential-guessing tool used in the same phase.
  - id: caa9a802-8bd8-4b9e-a5cd-4d6221670219
    name: Suspicious Kerberos Ticket Request via CLI
    reason: Kerberos ticket requests via CLI often follow successful credential validation.
  - id: 9f8fc146-1d1a-4dbf-b8fd-dfae15e08541
    name: HackTool - SharpLDAPmonitor Execution
    reason: LDAP recon tooling typically precedes spraying to build the user list.
  - id: d9367cbb-c2e0-47ce-bdc0-128cb6da898d
    name: HackTool - SharpLdapWhoami Execution
    reason: LDAP whoami check after obtaining valid credentials.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Dsacls executions
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Dd]sacls\.exe/
    pivot_on: host
    window: 4h
  - name: Failed logons (4625)
    query: data_win_system_eventID:4625
    pivot_on: host
    window: 4h
  - name: Explicit credential logons (4648)
    query: data_win_system_eventID:4648
    pivot_on: user
    window: 4h
  - name: Kerberos pre-auth failures (4771)
    query: data_win_system_eventID:4771
    pivot_on: user
    window: 4h
  - name: Account lockouts
    query: data_win_system_eventID:4740
    pivot_on: user
    window: 24h
