name: Windows Credential Dumping LSASS Memory Createdump
id: windows-credential-dumping-lsass-createdump-001
version: 1
schema_version: "1.0"
date: "2026-02-23"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects the use of createdump.exe to perform process memory dumps. This .NET 
  utility (shipped with PowerShell 7 and other .NET applications) can be abused 
  to dump LSASS memory for credential extraction. Looks for createdump.exe with 
  -u (PID) and -f (output file) flags. Used by Lapsus$ and other threat actors.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - wildcard:
            data_win_eventdata_image: "*\\\\createdump.exe"
        - wildcard:
            data_win_eventdata_commandLine: "*-u *"
        - wildcard:
            data_win_eventdata_commandLine: "*-f *"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-23 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-23 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Windows endpoints with Sysmon 
  installed and configured to log process creation events (EventID 1) with full 
  command-line arguments.

known_false_positives: >
  Some .NET applications may legitimately use createdump.exe for crash diagnostics. 
  Review the target PID and output file path to determine legitimacy. Filter known 
  application crash handlers.

references:
  - https://attack.mitre.org/techniques/T1003/001/
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1003.001/T1003.001.md#atomic-test-11---dump-lsass-with-createdumpexe-from-net-v5

response:
  message: >
    Credential dumping via createdump.exe on $agent_name$. 
    Command: $data_win_eventdata_commandLine$. 
    Parent: $data_win_eventdata_parentImage$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1003.001
  risk_score: 72
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 72
  threat_objects: []

tags:
  analytic_story:
    - Credential Dumping
    - Compromised Windows Host
    - Scattered Lapsus$ Hunters
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.001
  custom_tags:
    - createdump
    - lsass
    - credential_dumping
    - dotnet_abuse
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*createdump\.exe/ AND data_win_eventdata_commandLine:/.*-u .*/ AND data_win_eventdata_commandLine:/.*-f .*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 515c8be5-e5df-4c5e-8f6d-a4a2f05e4b48
    name: CreateDump Process Dump
    reason: Sigma sibling for createdump.exe dumps; corroborates or catches variants of the same invocation.
  - id: 1a1ed54a-2ba4-4221-94d5-01dee560d71e
    name: Renamed CreateDump Utility Execution
    reason: Attackers rename createdump.exe to dodge image-name matching, so this catches the evasive form.
  - id: a49fa4d5-11db-418c-8473-1e014a8dd462
    name: Lsass Memory Dump via Comsvcs DLL
    reason: Sysmon EID 10 access to lsass.exe is the process-access evidence a dump actually happened.
  - id: a5a2d357-1ab8-4675-a967-ef9990a59391
    name: LSASS Process Memory Dump Files
    reason: Dump file written to disk by createdump -f is the artefact this rule looks for.
  - id: 5ef9853e-4d0e-4a70-846f-a9ca37d876da
    name: Potential Credential Dumping Activity Via LSASS
    reason: Generic LSASS handle access with dump-capable access rights, confirming the memory read.
  - id: ec570e53-4c76-45a9-804d-dc3f355ff7a7
    name: 7Zip Compressing Dump Files
    reason: Dump files are commonly archived before exfiltration right after creation.
  - id: 1ac14d38-3dfc-4635-92c7-e3fd1c5f5bfc
    name: Winrar Compressing Dump Files
    reason: Same staging step with WinRAR.
  - id: 2e65275c-8288-4ab4-aeb7-6274f58b6b20
    name: Procdump Execution
    reason: Operators often fall back to other dumpers (procdump) if createdump is blocked.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Process access to lsass.exe
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 4h
  - name: Dump files written to disk
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\.[Dd][Mm][Pp]/ OR data_win_eventdata_targetFilename:/.*\.[Dd][Uu][Mm][Pp]/ OR data_win_eventdata_targetFilename:/.*[Ll][Ss][Aa][Ss][Ss].*/)
    pivot_on: host
    window: 4h
  - name: Archiving or copying dump files
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Rr][Aa][Rr]|[Ww][Ii][Nn][Rr][Aa][Rr]|7[Zz]|[Tt][Aa][Rr]|[Cc][Uu][Rr][Ll]|[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]|[Xx][Cc][Oo][Pp][Yy]|[Rr][Oo][Bb][Oo][Cc][Oo][Pp][Yy])\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*\.[Dd][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*\.[Dd][Uu][Mm][Pp].*/)
    pivot_on: host
    window: 6h
  - name: Alternate dumpers and credential tool command lines
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_image:/.*\\([Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]6?4?|[Nn][Aa][Nn][Oo][Dd][Uu][Mm][Pp])\.[Ee][Xx][Ee]/)
    pivot_on: host
    window: 4h
  - name: Network and remote logons after dump
    query: data_win_system_eventID:4624 AND data_win_eventdata_logonType:(3 OR 9 OR 10) AND NOT data_win_eventdata_targetUserName:/.*\$/
    pivot_on: user
    window: 24h
