name: Query Usage To Exfil Data
id: 53ef0cef-fa24-4f25-a34a-6c72dfa2e6e2
version: 1
schema_version: "1.0"
date: "2023-01-19"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 53ef0cef-fa24-4f25-a34a-6c72dfa2e6e2
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects usage of "query.exe" a system binary to exfil information such as
  "sessions" and "processes" for later use.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*:\\\\Windows\\\\System32\\\\query.exe"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*session >*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*process >*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*:\Windows\System32\query.exe'; data_win_eventdata_commandLine matches
  '*session >*'; data_win_eventdata_commandLine matches '*process >*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/MichalKoczwara/status/1553634816016498688

response:
  message: >
    Query Usage To Exfil Data detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - query
    - exfil
    - process_creation
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Qq][Uu][Ee][Rr][Yy]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*[Ss][Ee][Ss][Ss][Ii][Oo][Nn] \>.*/ OR data_win_eventdata_commandLine:/.*[Pp][Rr][Oo][Cc][Ee][Ss][Ss] \>.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 954f0af7-62dd-418f-b3df-a84bc2c7a774
    name: New Remote Desktop Connection Initiated Via Mstsc.EXE
    reason: query.exe session/process is typical post-RDP-logon recon; shows how the operator reached or pivoted from the host.
  - id: c248c896-e412-4279-8c15-1c558067b6fa
    name: Enumerate All Information With Whoami.EXE
    reason: Co-occurring operator situational awareness run alongside query.exe.
  - id: bd8b828d-0dca-48e1-8a63-8a58ecf2644f
    name: Group Membership Reconnaissance Via Whoami.EXE
    reason: Same hands-on-keyboard discovery phase.
  - id: 5cc90652-4cbd-4241-aa3b-4b462fa5a248
    name: Potential Recon Activity Via Nltest.EXE
    reason: Domain recon typically follows session/process enumeration.
  - id: 221b251a-357a-49a9-920a-271802777cc0
    name: Potential Process Reconnaissance via Wmic.EXE
    reason: Alternate process enumeration with the same intent as query process.
  - id: 7d1aaf3d-4304-425c-b7c3-162055e0b3ab
    name: Potential Data Exfiltration Activity Via CommandLine Tools
    reason: 'Follow-on: staging and sending the collected output.'
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other host and session discovery tools (quser, qwinsta, tasklist, whoami, net, systeminfo)
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Qq][Uu][Ss][Ee][Rr]\.[Ee][Xx][Ee]|[Qq][Ww][Ii][Nn][Ss][Tt][Aa]\.[Ee][Xx][Ee]|[Qq][Uu][Ee][Rr][Yy]\.[Ee][Xx][Ee]|[Tt][Aa][Ss][Kk][Ll][Ii][Ss][Tt]\.[Ee][Xx][Ee]|[Ww][Hh][Oo][Aa][Mm][Ii]\.[Ee][Xx][Ee]|[Nn][Ee][Tt]\.[Ee][Xx][Ee]|[Nn][Ee][Tt]1\.[Ee][Xx][Ee]|[Ss][Yy][Ss][Tt][Ee][Mm][Ii][Nn][Ff][Oo]\.[Ee][Xx][Ee]|[Hh][Oo][Ss][Tt][Nn][Aa][Mm][Ee]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 2h
  - name: Interactive RDP and remote-session context (mstsc, tscon, rdpclip)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Mm][Ss][Tt][Ss][Cc]\.[Ee][Xx][Ee]|[Tt][Ss][Cc][Oo][Nn]\.[Ee][Xx][Ee]|[Rr][Dd][Pp][Cc][Ll][Ii][Pp]\.[Ee][Xx][Ee])/ OR data_win_eventdata_parentImage:/.*\\([Rr][Dd][Pp][Cc][Ll][Ii][Pp]\.[Ee][Xx][Ee])/)
    pivot_on: host
    window: 4h
  - name: Output redirection to tsclient shares or public paths in commands
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*\\\\[Tt][Ss][Cc][Ll][Ii][Ee][Nn][Tt]\\.*/ OR data_win_eventdata_commandLine:/.*> \\\\.*/ OR data_win_eventdata_commandLine:/.*>> \\\\.*/ OR data_win_eventdata_commandLine:/.*> [Cc]:\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc].*/ OR data_win_eventdata_commandLine:/.*> [Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_commandLine:/.*> %[Tt][Ee][Mm][Pp]%.*/ OR data_win_eventdata_commandLine:/.*> %[Tt][Mm][Pp]%.*/)
    pivot_on: host
    window: 2h
  - name: Archive and transfer tools staging collected output
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\(7[Zz]\.[Ee][Xx][Ee]|[Rr][Aa][Rr]\.[Ee][Xx][Ee]|[Ww][Ii][Nn][Rr][Aa][Rr]\.[Ee][Xx][Ee]|[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]|[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]|[Rr][Oo][Bb][Oo][Cc][Oo][Pp][Yy]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 4h
