name: Hacktool - EDR-Freeze Execution
id: c598cc0c-9e70-4852-b9eb-8921af79f598
version: 1
schema_version: "1.0"
date: "2025-11-27"
author: Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: c598cc0c-9e70-4852-b9eb-8921af79f598
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of EDR-Freeze, a tool that exploits the MiniDumpWriteDump
  function and WerFaultSecure.exe to suspend EDR and Antivirus processes on
  Windows. EDR-Freeze leverages a race-condition attack to put security
  processes into a dormant state by suspending WerFaultSecure at the moment it
  freezes the target process. This technique does not require kernel-level
  exploits or BYOVD, but instead abuses user-mode functionality to temporarily
  disable monitoring by EDR or Antimalware solutions. MITRE ATT&CK: T1685.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\EDR-Freeze*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\EDRFreeze*"
                                case_insensitive: true
                        minimum_should_match: 1
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*.exe"
                          case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=1195F7935954A2CD09157390C33F8E8C*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=129F58DE3D687FB7F012BF6C3D679997*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=2C617A175D0086251642C6619F7CC8BA*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=8828F0B906F7844358FB92A899E9520F*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=AF76D95157EC554DC1EF178E4E66D447*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=E1B04316B61ACA31DD52ABBEC0A37FD5*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=8B2D5B54AFCFEC60D54F6B31D80ED4A0*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=AB8BB31EDD91D2A05FE7B62A535E9EB7*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_hashes
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\EDR-Freeze*'; data_win_eventdata_image matches '*\EDRFreeze*';
  data_win_eventdata_image matches '*.exe', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.zerosalarium.com/2025/09/EDR-Freeze-Puts-EDRs-Antivirus-Into-Coma.html
  - https://github.com/TwoSevenOneT/EDR-Freeze
  - https://attack.mitre.org/techniques/T1685/

response:
  message: >
    Hacktool - EDR-Freeze Execution detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_hashes: $data_win_eventdata_hashes$. MITRE ATT&CK: T1685
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_hashes
      type: file_hash

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685
  custom_tags:
    - hacktool
    - freeze
    - process_creation
    - sysmon
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (((data_win_eventdata_image:/.*\\[Ee][Dd][Rr]-[Ff][Rr][Ee][Ee][Zz][Ee].*/ OR data_win_eventdata_image:/.*\\[Ee][Dd][Rr][Ff][Rr][Ee][Ee][Zz][Ee].*/) AND data_win_eventdata_image:/.*\.[Ee][Xx][Ee]/) OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=1195[Ff]7935954[Aa]2[Cc][Dd]09157390[Cc]33[Ff]8[Ee]8[Cc].*/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=129[Ff]58[Dd][Ee]3[Dd]687[Ff][Bb]7[Ff]012[Bb][Ff]6[Cc]3[Dd]679997.*/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=2[Cc]617[Aa]175[Dd]0086251642[Cc]6619[Ff]7[Cc][Cc]8[Bb][Aa].*/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=8828[Ff]0[Bb]906[Ff]7844358[Ff][Bb]92[Aa]899[Ee]9520[Ff].*/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=[Aa][Ff]76[Dd]95157[Ee][Cc]554[Dd][Cc]1[Ee][Ff]178[Ee]4[Ee]66[Dd]447.*/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=[Ee]1[Bb]04316[Bb]61[Aa][Cc][Aa]31[Dd][Dd]52[Aa][Bb][Bb][Ee][Cc]0[Aa]37[Ff][Dd]5.*/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=8[Bb]2[Dd]5[Bb]54[Aa][Ff][Cc][Ff][Ee][Cc]60[Dd]54[Ff]6[Bb]31[Dd]80[Ee][Dd]4[Aa]0.*/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=[Aa][Bb]8[Bb][Bb]31[Ee][Dd][Dd]91[Dd]2[Aa]05[Ff][Ee]7[Bb]62[Aa]535[Ee]9[Ee][Bb]7.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 1f0b4cac-9c81-41f4-95d0-8475ff46b3e2
    name: PPL Tampering Via WerFaultSecure
    reason: EDR-Freeze drives WerFaultSecure.exe (/h /pid /tid) to suspend a PPL security process; this is the mechanism itself.
  - id: 9a4ccd1a-3526-4d99-b980-9f9c5d3a6ff3
    name: Potential Credential Dumping Via WER
    reason: WER binary abuse with MiniDumpWriteDump is shared tradecraft with WER-based LSASS dumping.
  - id: eb2d07d4-49cb-4523-801a-da002df36602
    name: HackTool - EDRSilencer Execution
    reason: Alternative EDR-blinding tool; attackers stack several to ensure telemetry is cut.
  - id: windows-attempt-stop-security-service-001
    name: Windows Attempt To Stop Security Service
    reason: Direct service-stop attempts against AV/EDR often precede or accompany the freeze.
  - id: windows-powershell-disable-security-monitoring-001
    name: Windows PowerShell Disable Security Monitoring
    reason: Defender tampering is a typical companion step while security tooling is dormant.
  - id: b28e58e4-2a72-4fae-bdee-0fbe904db642
    name: Windows Defender Real-time Protection Disabled
    reason: Defender losing real-time protection confirms the product was neutralised.
  - id: dd80db93-6ec2-4f4c-a017-ad40da6ffe81
    name: Windows Defender Real-Time Protection Failure/Restart
    reason: A suspended Defender engine can surface as protection failure/restart.
  - id: 4931188c-178e-4ee7-a348-39e8a7a56821
    name: Filter Driver Unloaded Via Fltmc.EXE
    reason: Unloading EDR minifilters is another blinding technique used in the same window.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: WerFaultSecure invoked against a target PID
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ww][Ee][Rr][Ff][Aa][Uu][Ll][Tt][Ss][Ee][Cc][Uu][Rr][Ee]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*(\/[Pp][Ii][Dd]).*/
    pivot_on: host
    window: 4h
  - name: Security product stop/kill attempts
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ss][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Nn][Ee][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Tt][Aa][Ss][Kk][Kk][Ii][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*([Ss][Tt][Oo][Pp]|[Kk][Ii][Ll][Ll]|[Ss][Uu][Ss][Pp][Ee][Nn][Dd]|\/[Ii][Mm]).*([Ww][Ii][Nn][Dd][Ee][Ff][Ee][Nn][Dd]|[Mm][Ss][Mm][Pp][Ee][Nn][Gg]|[Ss][Ee][Nn][Ss][Ee]|[Ww][Aa][Zz][Uu][Hh]|[Cc][Ss][Aa][Gg][Ee][Nn][Tt]|[Ss][Ee][Nn][Tt][Ii][Nn][Ee][Ll]|[Ss][Oo][Pp][Hh][Oo][Ss]|[Cc][Bb][Dd][Ee][Ff][Ee][Nn][Ss][Ee]).*/
    pivot_on: host
    window: 4h
  - name: Defender protection state changes
    query: (data_win_system_eventID:"5001" OR data_win_system_eventID:"5004" OR data_win_system_eventID:"5007" OR data_win_system_eventID:"5010" OR data_win_system_eventID:"5012")
    pivot_on: host
    window: 4h
  - name: Credential access or recon while security tooling is dormant
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_grantedAccess:/.*0[Xx]1[Ff][Ff][Ff][Ff][Ff].*/ OR data_win_eventdata_grantedAccess:/.*0[Xx]1010.*/ OR data_win_eventdata_grantedAccess:/.*0[Xx]1410.*/ OR data_win_eventdata_grantedAccess:/.*0[Xx]1438.*/ OR data_win_eventdata_grantedAccess:/.*0[Xx]143[Aa].*/)) OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]|[Cc][Oo][Mm][Ss][Vv][Cc][Ss]|[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll]|[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn]|[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz]).*/)
    pivot_on: host
    window: 4h
  - name: EDR-Freeze binary dropped on disk
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*([Ee][Dd][Rr])-?([Ff][Rr][Ee][Ee][Zz][Ee]).*/
    pivot_on: host
    window: 24h
