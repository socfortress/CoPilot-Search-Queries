name: Process Creation Attempt via Wmic.EXE
id: 526be59f-a573-4eea-b5f7-f0973207634d
version: 1
schema_version: "1.0"
date: "2023-02-14"
author: Michael Haag, Florian Roth (Nextron Systems), juju4, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 526be59f-a573-4eea-b5f7-f0973207634d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the attempt to create a process via "wmic" with the "process call
  create" flag, which might indicate an attempt to execute a malicious process
  on the compromised host. Adversaries may use wmic to execute a process on the
  compromised host as part of their attack. This event is triggered on on
  attempt and process creation can be either successful or unsuccessful. MITRE
  ATT&CK: T1047.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\wmic.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "wmic.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*process*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*call*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*create*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\wmic.exe'; data_win_eventdata_originalFileName equals 'wmic.exe';
  data_win_eventdata_commandLine matches '*process*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.sans.org/blog/wmic-for-incident-response/
  - https://github.com/redcanaryco/atomic-red-team/blob/84215139ee5127f8e3a117e063b604812bd71928/atomics/T1047/T1047.md#atomic-test-5---wmi-execute-local-process
  - https://attack.mitre.org/techniques/T1047/

response:
  message: >
    Process Creation Attempt via Wmic.EXE detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1047
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1047
  custom_tags:
    - process_creation
    - sysmon
    - execution
    - car_2016_03_002
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Pp][Rr][Oo][Cc][Ee][Ss][Ss].*/ AND data_win_eventdata_commandLine:/.*[Cc][Aa][Ll][Ll].*/ AND data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 10c14723-61c7-4c75-92ca-9af245723ad2
    name: HackTool - Potential Impacket Lateral Movement Activity
    reason: WMI process call create is the core of Impacket wmiexec remote execution.
  - id: d6e464e4-5c6a-474e-82d2-aed616a3a492
    name: Impacket Lateral Movement WMIExec Commandline Parameters
    reason: Same remote WMI exec pattern with cmd.exe /Q /c redirects.
  - id: 022eaba8-f0bf-4dd9-9217-4604b0bb3bb0
    name: HackTool - Wmiexec Default Powershell Command
    reason: Wmiexec tool follow-on commands on the target.
  - id: 8d5aca11-22b3-4f22-b7ba-90e60533e1fb
    name: Wmiexec Default Output File
    reason: Wmiexec writes output to an ADMIN$ file; file artefact of the same execution.
  - id: ea011323-7045-460b-b2d7-0f7442ea6b38
    name: Potential PsExec Remote Execution
    reason: Alternative remote-exec channel commonly used in the same lateral movement campaign.
  - id: 221b251a-357a-49a9-920a-271802777cc0
    name: Potential Process Reconnaissance via Wmic.EXE
    reason: Precursor wmic process enumeration before spawning.
  - id: 383572e0-04c5-11ec-bdcc-acde48001122
    name: Domain Account Discovery with Wmic
    reason: Wmic-based discovery often precedes execution on discovered hosts.
  - id: 847d5ff3-8a31-4737-a970-aeae8fe21765
    name: Potential Tampering With Security Products Via WMIC
    reason: Payload spawned via wmic is often followed by defence tampering.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Children of WmiPrvSE (remote WMI exec)
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:(/.*\\WmiPrvSE\.exe/)
    pivot_on: host
    window: 2h
  - name: Wmic with remote node or credentials
    query: data_win_system_eventID:1 AND data_win_eventdata_image:(/.*\\wmic\.exe/) AND data_win_eventdata_commandLine:(/.*(\/node:|\/user:|\/password:).*/)
    pivot_on: host
    window: 4h
  - name: wmiexec-style output redirect
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*(cmd.* \/q \/c|admin\$\\__).*/)
    pivot_on: host
    window: 2h
  - name: Network connections for remote exec
    query: data_win_system_eventID:3 AND data_win_eventdata_destinationPort:(135 OR 445 OR 5985)
    pivot_on: host
    window: 2h
  - name: 'Payload follow-on: download or recon after wmic spawn'
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*(powershell.*(-enc|downloadstring|iwr)|certutil.*urlcache|whoami|net group).*/)
    pivot_on: host
    window: 2h
