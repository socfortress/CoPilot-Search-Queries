name: Visual Studio NodejsTools PressAnyKey Arbitrary Binary Execution
id: a20391f8-76fb-437b-abc0-dba2df1952c6
version: 1
schema_version: "1.0"
date: "2023-04-11"
author: Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: a20391f8-76fb-437b-abc0-dba2df1952c6
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects child processes of Microsoft.NodejsTools.PressAnyKey.exe that can be
  used to execute any other binary. MITRE ATT&CK: T1218.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_parentImage:
              value: "*\\\\Microsoft.NodejsTools.PressAnyKey.exe"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\Microsoft.NodejsTools.PressAnyKey.exe'.

known_false_positives: >
  Legitimate use by developers as part of NodeJS development with Visual Studio
  Tools. Baseline expected activity in your environment and tune this detection
  before relying on it for automated response.

references:
  - https://twitter.com/mrd0x/status/1463526834918854661
  - https://gist.github.com/nasbench/a989ce64cefa8081bd50cf6ad8c491b5
  - https://attack.mitre.org/techniques/T1218/

response:
  message: >
    Visual Studio NodejsTools PressAnyKey Arbitrary Binary Execution detected on
    host $agent_name$. Matched data_win_eventdata_parentImage:
    $data_win_eventdata_parentImage$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1218
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218
  custom_tags:
    - visual
    - studio
    - nodejstools
    - process_creation
    - sysmon
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\.[Nn][Oo][Dd][Ee][Jj][Ss][Tt][Oo][Oo][Ll][Ss]\.[Pp][Rr][Ee][Ss][Ss][Aa][Nn][Yy][Kk][Ee][Yy]\.[Ee][Xx][Ee]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 15c7904e-6ad1-4a45-9b46-5fb25df37fd2
    name: Malicious PE Execution by Microsoft Visual Studio Debugger
    reason: Another Visual Studio developer tool proxy-executing arbitrary binaries; same LOLBin family.
  - id: 6640f31c-01ad-49b5-beb5-83498a5cd8bd
    name: Potential Arbitrary Code Execution Via Node.EXE
    reason: Node.js tooling abused to run arbitrary code; same developer-runtime proxy-execution pattern.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Children of PressAnyKey helper
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\.[Nn][Oo][Dd][Ee][Jj][Ss][Tt][Oo][Oo][Ll][Ss]\.[Pp][Rr][Ee][Ss][Ss][Aa][Nn][Yy][Kk][Ee][Yy]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: PressAnyKey executed outside Visual Studio
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\.[Nn][Oo][Dd][Ee][Jj][Ss][Tt][Oo][Oo][Ll][Ss]\.[Pp][Rr][Ee][Ss][Ss][Aa][Nn][Yy][Kk][Ee][Yy]\.[Ee][Xx][Ee]/ AND NOT data_win_eventdata_image:/.*[Vv][Ii][Ss][Uu][Aa][Ll] [Ss][Tt][Uu][Dd][Ii][Oo].*/
    pivot_on: host
    window: 24h
  - name: PressAnyKey file drops
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Pp][Rr][Ee][Ss][Ss][Aa][Nn][Yy][Kk][Ee][Yy].*/
    pivot_on: host
    window: 24h
  - name: Download or encoded commands from shells
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*(-[Ee][Nn][Cc]|[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg]|[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt]|[Hh][Tt][Tt][Pp]).*/
    pivot_on: host
    window: 2h
