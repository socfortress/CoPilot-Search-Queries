name: Suspicious Key Manager Access
id: a4694263-59a8-4608-a3a0-6f8d3a51664c
version: 1
schema_version: "1.0"
date: "2023-02-09"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: a4694263-59a8-4608-a3a0-6f8d3a51664c
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the invocation of the Stored User Names and Passwords dialogue (Key
  Manager). MITRE ATT&CK: T1555.004.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\rundll32.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "RUNDLL32.EXE"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*keymgr*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*KRShowKeyMgr*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\rundll32.exe'; data_win_eventdata_originalFileName equals 'RUNDLL32.EXE';
  data_win_eventdata_commandLine matches '*keymgr*', among other conditions.

known_false_positives: >
  Administrative activity. Baseline expected activity in your environment and
  tune this detection before relying on it for automated response.

references:
  - https://twitter.com/NinjaParanoid/status/1516442028963659777
  - https://attack.mitre.org/techniques/T1555/004/

response:
  message: >
    Suspicious Key Manager Access detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1555.004
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1555.004
  custom_tags:
    - manager
    - process_creation
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Kk][Ee][Yy][Mm][Gg][Rr].*/ AND data_win_eventdata_commandLine:/.*[Kk][Rr][Ss][Hh][Oo][Ww][Kk][Ee][Yy][Mm][Gg][Rr].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 58f50261-c53b-4c88-bd12-1d71f12eda4c
    name: Windows Credential Manager Access via VaultCmd
    reason: Another route to the same stored credentials
  - id: 07f8bdc2-c9b3-472a-9817-5a670b872f53
    name: Potential Reconnaissance For Cached Credentials Via Cmdkey.EXE
    reason: cmdkey /list enumerates the same stored credential store
  - id: b1ec66c6-f4d1-4b5c-96dd-af28ccae7727
    name: New Generic Credentials Added Via Cmdkey.EXE
    reason: 'Follow-on: harvested credentials stored for reuse'
  - id: 99c49d9c-34ea-45f7-84a7-4751ae6b2cbc
    name: Dump Credentials from Windows Credential Manager With PowerShell
    reason: Scripted dumping of the vault once it is known to hold secrets
  - id: 603c6630-5225-49c1-8047-26c964553e0e
    name: Enumerate Credentials from Windows Credential Manager With PowerShell
    reason: Scripted enumeration of the vault
  - id: e0b0c2ab-3d52-46d9-8cb7-049dc775fbd1
    name: Enumeration for Credentials in Registry
    reason: Broader credential hunting alongside
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: Mimikatz vault module is a common escalation after user-level credential probing
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Credential vault enumeration
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc]md[Kk]ey.*/ OR data_win_eventdata_commandLine:/.*[Vv]ault[Cc]md.*/ OR data_win_eventdata_commandLine:/.*[Cc]redential[Mm]anager.*/)
    pivot_on: host
    window: 4h
  - name: Credential dumping tools
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Mm]imikatz.*/ OR data_win_eventdata_commandLine:/.*[Ss]ekurlsa.*/ OR data_win_eventdata_commandLine:/.*[Vv]ault::.*/ OR data_win_eventdata_commandLine:/.*[Ll]a[Zz]agne.*/)
    pivot_on: host
    window: 4h
  - name: Registry hive and browser credential access
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Rr]eg.*[Ss]ave.*[Ss][Aa][Mm].*/ OR data_win_eventdata_commandLine:/.*[Ll]ogin [Dd]ata.*/ OR data_win_eventdata_commandLine:/.*[Dd][Pp][Aa][Pp][Ii].*/)
    pivot_on: host
    window: 4h
  - name: Lateral movement using stored credentials
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Nn]et +use .*/ OR data_win_eventdata_commandLine:/.*[Pp]s[Ee]xec.*/ OR data_win_eventdata_commandLine:/.*[Mm]stsc.*/)
    pivot_on: host
    window: 6h
