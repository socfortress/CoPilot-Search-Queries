name: APT31 Judgement Panda Activity
id: 03e2746e-2b31-42f1-ab7a-eb39365b2422
version: 1
schema_version: "1.0"
date: "2023-03-10"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 03e2746e-2b31-42f1-ab7a-eb39365b2422
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects APT31 Judgement Panda activity as described in the Crowdstrike 2019
  Global Threat Report. MITRE ATT&CK: T1003.001, T1560.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*ldifde*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*-f -n*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*eprod.ldf*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*copy \\\\\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*c$*"
                          case_insensitive: true
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*\\\\aaaa\\\\procdump64.exe*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*\\\\aaaa\\\\netsess.exe*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*\\\\aaaa\\\\7za.exe*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*\\\\c$\\\\aaaa\\\\*"
                                case_insensitive: true
                        minimum_should_match: 1
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*ldifde*'; data_win_eventdata_commandLine matches '*-f -n*';
  data_win_eventdata_commandLine matches '*eprod.ldf*', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.documentcloud.org/documents/5743766-Global-Threat-Report-2019.html
  - https://attack.mitre.org/techniques/T1003/001/
  - https://attack.mitre.org/techniques/T1560/001/

response:
  message: >
    APT31 Judgement Panda Activity detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1003.001, T1560.001
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.001
    - T1560.001
  custom_tags:
    - apt31
    - judgement
    - panda
    - process_creation
    - sysmon
    - collection
    - lateral_movement
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND ((data_win_eventdata_commandLine:/.*[Ll][Dd][Ii][Ff][Dd][Ee].*/ AND data_win_eventdata_commandLine:/.*-[Ff] -[Nn].*/ AND data_win_eventdata_commandLine:/.*[Ee][Pp][Rr][Oo][Dd]\.[Ll][Dd][Ff].*/) OR (data_win_eventdata_commandLine:/.*[Cc][Oo][Pp][Yy] \\\\.*/ AND data_win_eventdata_commandLine:/.*[Cc]\$.*/ AND (data_win_eventdata_commandLine:/.*\\[Aa][Aa][Aa][Aa]\\[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]64\.[Ee][Xx][Ee].*/ OR data_win_eventdata_commandLine:/.*\\[Aa][Aa][Aa][Aa]\\[Nn][Ee][Tt][Ss][Ee][Ss][Ss]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_commandLine:/.*\\[Aa][Aa][Aa][Aa]\\7[Zz][Aa]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_commandLine:/.*\\[Cc]\$\\[Aa][Aa][Aa][Aa]\\.*/)))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 4f7a6757-ff79-46db-9687-66501a02d9ec
    name: Active Directory Structure Export Via Ldifde.EXE
    reason: APT31 tradecraft starts with ldifde dumping AD structure to a .ldf file; the generic ldifde export rule fires on the same recon step.
  - id: 2e65275c-8288-4ab4-aeb7-6274f58b6b20
    name: Procdump Execution
    reason: The admin-share copy branch stages procdump64.exe on the target; its execution is the credential-dump step that follows.
  - id: 5afee48e-67dd-4e03-a783-f74259dcf998
    name: Potential LSASS Process Dump Via Procdump
    reason: Confirms procdump was pointed at lsass to harvest credentials (T1003.001) after staging.
  - id: ec570e53-4c76-45a9-804d-dc3f355ff7a7
    name: 7Zip Compressing Dump Files
    reason: Staged 7za.exe typically archives the resulting dump files before exfiltration (T1560.001).
  - id: 855bc8b5-2ae8-402e-a9ed-b889e6df1900
    name: Copy From Or To Admin Share Or Sysvol Folder
    reason: Same lateral tool transfer over C$ admin shares used to drop the toolkit into the aaaa directory.
  - id: 044ba588-dff4-4918-9808-3f95e8160606
    name: Copy .DMP/.DUMP Files From Remote Share Via Cmd.EXE
    reason: Operators copy dump output back from the remote share after procdump runs.
  - id: 4a0b2c7e-7cb2-495d-8b63-5f268e7bfd67
    name: Renamed ProcDump Execution
    reason: Actors may rename procdump to evade name-based detection after staging.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Procdump or LSASS dump keywords on host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Ss][Ss].*[Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*-[Mm][Aa] .*[Ll][Ss][Aa][Ss][Ss].*/)
    pivot_on: host
    window: 6h
  - name: Archiving tools creating archives
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\7[Zz][Aa]?\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Aa][Rr]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.* [Aa] .*/
    pivot_on: host
    window: 6h
  - name: Files created in aaaa staging directory
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\[Aa][Aa][Aa][Aa]\\.*/
    pivot_on: host
    window: 6h
  - name: AD and session recon commands
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ll][Dd][Ii][Ff][Dd][Ee].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt][Ss][Ee][Ss][Ss].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt] [Vv][Ii][Ee][Ww].*/)
    pivot_on: host
    window: 24h
