name: Whoami.EXE Execution From Privileged Process
id: 79ce34ca-af29-4d0e-b832-fc1b377020db
version: 1
schema_version: "1.0"
date: "2023-12-04"
author: Florian Roth (Nextron Systems), Teymur Kheirkhabarov
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 79ce34ca-af29-4d0e-b832-fc1b377020db
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of "whoami.exe" by privileged accounts that are often
  abused by threat actors. MITRE ATT&CK: T1033.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - term:
                  data_win_eventdata_originalFileName:
                    value: "whoami.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\whoami.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_user:
                    value: "*AUTHORI*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_user:
                    value: "*AUTORI*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_user:
                    value: "*TrustedInstaller*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_originalFileName
    - data_win_eventdata_image
    - data_win_eventdata_user
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_originalFileName equals
  'whoami.exe'; data_win_eventdata_image matches '*\whoami.exe';
  data_win_eventdata_user matches '*AUTHORI*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://speakerdeck.com/heirhabarov/hunting-for-privilege-escalation-in-windows-environment
  - https://web.archive.org/web/20221019044836/https://nsudo.m2team.org/en-us/
  - https://attack.mitre.org/techniques/T1033/

response:
  message: >
    Whoami.EXE Execution From Privileged Process detected on host $agent_name$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1033
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_originalFileName
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1033
  custom_tags:
    - whoami
    - privileged
    - process_creation
    - sysmon
    - privilege_escalation
    - discovery
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_originalFileName:/[Ww][Hh][Oo][Aa][Mm][Ii]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Hh][Oo][Aa][Mm][Ii]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_user:/.*[Aa][Uu][Tt][Hh][Oo][Rr][Ii].*/ OR data_win_eventdata_user:/.*[Aa][Uu][Tt][Oo][Rr][Ii].*/ OR data_win_eventdata_user:/.*[Tt][Rr][Uu][Ss][Tt][Ee][Dd][Ii][Nn][Ss][Tt][Aa][Ll][Ll][Ee][Rr].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c248c896-e412-4279-8c15-1c558067b6fa
    name: Enumerate All Information With Whoami.EXE
    reason: 'same whoami tooling run with /all: full token, privilege and group dump by the same actor'
  - id: bd8b828d-0dca-48e1-8a63-8a58ecf2644f
    name: Group Membership Reconnaissance Via Whoami.EXE
    reason: whoami /groups follow-up to learn which privileged groups the SYSTEM/service context belongs to
  - id: c30fb093-1109-4dc8-88a8-b30d11c95a5d
    name: Whoami.EXE Execution With Output Option
    reason: whoami output redirected or CSV-formatted, staging results for later use after the privileged check
  - id: d95de845-b83c-4a9a-8a6a-4fc802ebf6c0
    name: Suspicious Group And Account Reconnaissance Activity Using Net.EXE
    reason: net user/group recon commonly follows once whoami confirms SYSTEM or elevated context
  - id: 7c0dcd3d-acf8-4f71-9570-f448b0034f94
    name: PsExec Service Child Process Execution as LOCAL SYSTEM
    reason: whoami as SYSTEM is the typical first command from a PsExec service child shell
  - id: ea011323-7045-460b-b2d7-0f7442ea6b38
    name: Potential PsExec Remote Execution
    reason: remote PsExec execution is a common route into a SYSTEM/privileged whoami
  - id: d522eca2-2973-4391-a3e0-ef0374321dae
    name: Abused Debug Privilege by Arbitrary Parent Processes
    reason: debug-privilege abuse by an arbitrary parent explains how a privileged context was obtained
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Token and privilege enumeration
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*[Ww][Hh][Oo][Aa][Mm][Ii].*([Pp][Rr][Ii][Vv]|[Gg][Rr][Oo][Uu][Pp][Ss]|[Aa][Ll][Ll]).*/
    pivot_on: host
    window: 2h
  - name: Domain and local account discovery
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/(.*[Nn][Ee][Tt]1?(\.[Ee][Xx][Ee])? +([Uu][Ss][Ee][Rr]|[Gg][Rr][Oo][Uu][Pp]|[Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp]).*|.*[Nn][Ll][Tt][Ee][Ss][Tt].*|.*[Ss][Yy][Ss][Tt][Ee][Mm][Ii][Nn][Ff][Oo].*)/
    pivot_on: host
    window: 2h
  - name: Service-based remote execution (PsExec style)
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:*PSEXESVC* OR data_win_eventdata_parentImage:*PSEXESVC* OR data_win_eventdata_commandLine:*[Pp][Ss][Ee][Xx][Ee][Cc]*)
    pivot_on: host
    window: 4h
  - name: Credential access tooling
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*([Ll][Ss][Aa][Ss][Ss]|[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz]|[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]|[Cc][Oo][Mm][Ss][Vv][Cc][Ss]).*/
    pivot_on: host
    window: 4h
