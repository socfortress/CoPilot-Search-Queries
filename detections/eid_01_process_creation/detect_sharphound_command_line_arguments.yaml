name: Detect SharpHound Command-Line Arguments
id: a0bdd2f6-c2ff-11eb-b918-acde48001122
version: 1
schema_version: "1.0"
date: "2026-04-21"
author: SOCFortress LLC
status: production
type: TTP

description: >
  This analytic detects the execution of SharpHound command-line arguments,
  specifically "-CollectionMethod" and "Invoke-BloodHound". Sysmon EventID 1
  is used to match any process whose command line contains these canonical
  SharpHound or BloodHound invocation patterns, regardless of the process
  image name (to catch renamed binaries). This activity is significant because
  SharpHound (the data ingestion component of BloodHound) is commonly used for
  Active Directory enumeration to map out users, groups, computers, sessions,
  trusts, ACLs, and other relationships. AD enumeration is a frequent precursor
  to lateral movement, privilege escalation, and domain compromise. SharpHound
  has been observed in use by multiple ransomware operators (including
  BlackSuit) and in targeted intrusion campaigns. If confirmed malicious, this
  activity could allow an attacker to fully enumerate the Active Directory
  environment, identify high-value targets (Domain Admins, unconstrained
  delegation, Kerberoastable service accounts), and plan further attacks that
  may compromise sensitive information and critical systems.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-collectionMethod*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*invoke-bloodhound*"
                    case_insensitive: true
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_parentCommandLine
    - data_win_eventdata_user
    - data_win_eventdata_processId
    - data_win_eventdata_processGuid
    - data_win_eventdata_parentProcessId
    - data_win_eventdata_parentProcessGuid
    - data_win_eventdata_hashes
    - data_win_eventdata_integrityLevel
    - data_win_eventdata_currentDirectory

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-21 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-21 23:59:59.999"

how_to_implement: >
  This detection requires Sysmon EventID 1 (Process Creation) logs to be forwarded
  from Windows endpoints to Wazuh Indexer. Ensure Sysmon is deployed with a
  configuration that captures Image, OriginalFileName, and CommandLine fields
  (SwiftOnSecurity or Olaf Hartong Sysmon modular config recommended). The
  detection is process-agnostic - it matches on the command-line arguments
  only, regardless of the calling binary name. This covers both
  SharpHound.exe/SharpHound.ps1 invocations and the PowerShell module
  Invoke-BloodHound, including cases where the binary has been renamed.
  Case-insensitive matching is used throughout so variations like
  "Invoke-BloodHound", "invoke-bloodhound", "-CollectionMethod", and
  "-collectionmethod" are all caught.

known_false_positives: >
  False positives should be limited as these arguments are highly specific to
  SharpHound and BloodHound. Legitimate internal security assessment teams,
  penetration testers, or authorized AD auditors may produce true-positive
  alerts that are not malicious - these should be tuned via approved-source
  allow-listing rather than removing the detection. Consider filtering by
  user account or source host in environments where AD auditing is an
  approved ongoing activity.

references:
  - https://attack.mitre.org/software/S0521/
  - https://attack.mitre.org/techniques/T1069/001/
  - https://attack.mitre.org/techniques/T1069/002/
  - https://attack.mitre.org/techniques/T1087/001/
  - https://attack.mitre.org/techniques/T1087/002/
  - https://attack.mitre.org/techniques/T1482/
  - https://thedfirreport.com/?s=bloodhound
  - https://github.com/BloodHoundAD/BloodHound/tree/master/Collectors
  - https://github.com/BloodHoundAD/SharpHound3
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1059.001/T1059.001.md

response:
  message: >
    Possible SharpHound / BloodHound Active Directory enumeration was
    identified on endpoint $agent_name$ by user $data_win_eventdata_user$.
    Process image: $data_win_eventdata_image$. Parent process:
    $data_win_eventdata_parentImage$. Command line:
    $data_win_eventdata_commandLine$. This is a high-confidence indicator of
    domain reconnaissance commonly preceding lateral movement, privilege
    escalation, or ransomware deployment. Investigate immediately.
  risk_score: 72
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 60
    - field: data_win_eventdata_user
      type: user
      score: 60
  threat_objects:
    - field: data_win_eventdata_image
      type: process_name
    - field: data_win_eventdata_commandLine
      type: command_line

tags:
  analytic_story:
    - Windows Discovery Techniques
    - Ransomware
    - BlackSuit Ransomware
    - Active Directory Reconnaissance
  asset_type: Endpoint
  mitre_attack_id:
    - T1069.001
    - T1069.002
    - T1087.001
    - T1087.002
    - T1482
  custom_tags:
    - sharphound
    - bloodhound
    - ad_enumeration
    - active_directory
    - reconnaissance
    - lateral_movement_precursor
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*\-[Cc][Oo][Ll][Ll][Ee][Cc][Tt][Ii][Oo][Nn][Mm][Ee][Tt][Hh][Oo][Dd].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]\-[Bb][Ll][Oo][Oo][Dd][Hh][Oo][Uu][Nn][Dd].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: dd04b29a-beed-11eb-87bc-acde48001122
    name: Detect SharpHound Usage
    reason: Companion SharpHound detection by binary and file markers; confirms the collector rather than just arguments.
  - id: f376c8a7-a2d0-4ddc-aa0c-16c17236d962
    name: HackTool - Bloodhound/Sharphound Execution
    reason: Sigma Bloodhound/Sharphound execution rule; independent corroboration with different patterns.
  - id: 9a132afa-654e-11eb-ae93-0242ac130002
    name: PUA - AdFind Suspicious Execution
    reason: AdFind is the other AD enumeration tool operators run alongside SharpHound.
  - id: c3e05466-5f22-11eb-ae93-0242ac130002
    name: NLTest Domain Trust Discovery
    reason: Nltest trust discovery is manual domain recon that usually accompanies collection.
  - id: d95de845-b83c-4a9a-8a6a-4fc802ebf6c0
    name: Suspicious Group And Account Reconnaissance Activity Using Net.EXE
    reason: net group/user recon of Domain Admins cross-checks the targets BloodHound maps.
  - id: 1eeed653-dbc8-4187-ad0c-eeebb20e6599
    name: Potential SPN Enumeration Via Setspn.EXE
    reason: SPN enumeration via setspn feeds Kerberoasting, a standard follow-on to BloodHound findings.
  - id: f0c9d62f-a232-4edd-b17e-bc409fb133d4
    name: Domain Group Discovery With Dsquery
    reason: Dsquery group discovery is further LDAP-based AD enumeration.
  - id: 27c3a83d-cada-47c6-9042-67baf19d2574
    name: Detect PsExec With accepteula Flag
    reason: PsExec is the typical lateral movement step once BloodHound reveals attack paths.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other AD reconnaissance tooling and commands
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Aa][Dd][Ff][Ii][Nn][Dd]\.[Ee][Xx][Ee]|[Dd][Ss][Qq][Uu][Ee][Rr][Yy]\.[Ee][Xx][Ee]|[Nn][Ll][Tt][Ee][Ss][Tt]\.[Ee][Xx][Ee]|[Ss][Ee][Tt][Ss][Pp][Nn]\.[Ee][Xx][Ee]|[Ll][Dd][Ii][Ff][Dd][Ee]\.[Ee][Xx][Ee]|[Cc][Ss][Vv][Dd][Ee]\.[Ee][Xx][Ee])/ OR (data_win_eventdata_commandLine:/.*[Gg][Ee][Tt]-[Aa][Dd][Uu][Ss][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Gg][Ee][Tt]-[Aa][Dd][Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Gg][Ee][Tt]-[Dd][Oo][Mm][Aa][Ii][Nn][Uu][Ss][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Gg][Ee][Tt]-[Nn][Ee][Tt][Ss][Ee][Ss][Ss][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*[Gg][Ee][Tt]-[Dd][Oo][Mm][Aa][Ii][Nn][Tt][Rr][Uu][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Mm][Aa][Ii][Nn] [Aa][Dd][Mm][Ii][Nn][Ss].*/ OR data_win_eventdata_commandLine:/.*\/[Dd][Oo][Mm][Aa][Ii][Nn]_[Tt][Rr][Uu][Ss][Tt][Ss].*/ OR data_win_eventdata_commandLine:/.*[Pp][Oo][Ww][Ee][Rr][Vv][Ii][Ee][Ww].*/))
    pivot_on:
    - host
    window: 4h
  - name: SharpHound output files written
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*([Bb][Ll][Oo][Oo][Dd][Hh][Oo][Uu][Nn][Dd].*\.[Zz][Ii][Pp]|_([Uu][Ss][Ee][Rr][Ss]|[Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr][Ss]|[Gg][Rr][Oo][Uu][Pp][Ss]|[Dd][Oo][Mm][Aa][Ii][Nn][Ss]|[Gg][Pp][Oo][Ss]|[Oo][Uu][Ss]|[Cc][Oo][Nn][Tt][Aa][Ii][Nn][Ee][Rr][Ss])\.[Jj][Ss][Oo][Nn])/
    pivot_on:
    - host
    window: 4h
  - name: LDAP and global-catalog queries from user processes
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:"true" AND data_win_eventdata_destinationPort:(389 OR 636 OR 3268 OR 3269) AND NOT data_win_eventdata_image:/.*([Ll][Ss][Aa][Ss][Ss]|[Ss][Vv][Cc][Hh][Oo][Ss][Tt]|[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Dd][Ss][Aa][Cc]|[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\.[Aa][Cc][Tt][Ii][Vv][Ee][Dd][Ii][Rr][Ee][Cc][Tt][Oo][Rr][Yy]).*/
    pivot_on:
    - host
    window: 2h
  - name: Credential attack tooling that follows AD mapping
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Rr][Uu][Bb][Ee][Uu][Ss].*/ OR data_win_eventdata_commandLine:/.*[Kk][Ee][Rr][Bb][Ee][Rr][Oo][Aa][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Aa][Ss][Rr][Ee][Pp][Rr][Oo][Aa][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Kk][Ee][Rr][Bb][Ee][Rr][Oo][Aa][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Ss][Ss].*/)
    pivot_on:
    - host
    - user
    window: 6h
  - name: Remote execution and lateral movement attempts
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Pp][Ss][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]|[Pp][Ss][Ee][Xx][Ee][Cc]64\.[Ee][Xx][Ee]|[Pp][Aa][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee])/ OR (data_win_eventdata_commandLine:/.*[Ww][Mm][Ii][Cc] \/[Nn][Oo][Dd][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ee][Nn][Tt][Ee][Rr]-[Pp][Ss][Ss][Ee][Ss][Ss][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Cc][Oo][Mm][Mm][Aa][Nn][Dd].*/ OR data_win_eventdata_commandLine:/.*[Ww][Ii][Nn][Rr][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc] \\\\.*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss] \/[Ss].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Mm][Ii][Mm][Ee][Tt][Hh][Oo][Dd].*/))
    pivot_on:
    - host
    - user
    window: 6h
