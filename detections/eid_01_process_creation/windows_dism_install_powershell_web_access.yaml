name: Windows DISM Install PowerShell Web Access
id: windows-dism-install-pswa-001
version: 1
schema_version: "1.0"
date: "2026-02-23"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects DISM being used to enable PowerShell Web Access 
  (WindowsPowerShellWebAccess) feature. PSWA provides browser-based remote 
  PowerShell access, enabling attackers to execute commands remotely without 
  traditional RDP. Referenced in CISA AA24-241A advisory.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - wildcard:
            data_win_eventdata_commandLine: "*WindowsPowerShellWebAccess*"
        - wildcard:
            data_win_eventdata_commandLine: "*enable-feature*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-23 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-23 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Windows endpoints with Sysmon 
  installed and configured to log process creation events (EventID 1) with full 
  command-line arguments. Note: Dism.exe image path uses capital D.

known_false_positives: >
  Administrators legitimately enabling PSWA on servers. Investigate user context 
  and whether the host is authorized for PSWA deployment.

references:
  - https://attack.mitre.org/techniques/T1548/002/
  - https://www.cisa.gov/news-events/cybersecurity-advisories/aa24-241a

response:
  message: >
    PowerShell Web Access installation via DISM on $agent_name$. 
    Command: $data_win_eventdata_commandLine$. 
    User: $data_win_eventdata_user$. 
    Remote PowerShell access enabled. MITRE ATT&CK: T1548.002
  risk_score: 72
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 72
  threat_objects: []

tags:
  analytic_story:
    - CISA AA24-241A
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1548.002
  custom_tags:
    - dism
    - pswa
    - powershell_web_access
    - remote_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*WindowsPowerShellWebAccess.*/ AND data_win_eventdata_commandLine:/.*enable-feature.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7e8f2d3b-9c1a-4f67-b9e8-8d9006e0e51f
    name: PowerShell Web Access Feature Enabled Via DISM
    reason: Companion detection of the same DISM enable-feature of PSWA; co-firing confirms the feature install.
  - id: cd5cfd80-aa5f-44c0-9c20-108c4ae12e3c
    name: New Firewall Rule Added Via Netsh.EXE
    reason: PSWA needs inbound HTTPS exposure; attacker adds a firewall rule right after enabling it.
  - id: 57c4bf16-227f-4394-8ec7-1b745ee061c3
    name: Firewall Disabled via Netsh.EXE
    reason: Firewall disabled via netsh is a common companion step to expose the new web gateway.
  - id: cd219ff3-fa99-45d4-8380-a7d15116c6dc
    name: New User Created Via Net.EXE
    reason: Attacker typically creates a local account to authenticate to PSWA.
  - id: 043c4b8b-3a54-4780-9682-081cb6b8185c
    name: Suspicious IIS Module Registration
    reason: PSWA runs on IIS; suspicious IIS module changes indicate web-layer persistence alongside it.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: PSWA gateway configuration cmdlets
    query: data_win_eventdata_commandLine:/.*[Ii]nstall-[Pp]ower[Ss]hell[Ww]eb[Aa]ccess.*/ OR data_win_eventdata_commandLine:/.*[Aa]dd-[Pp]swa[Aa]uthorization[Rr]ule.*/ OR data_win_eventdata_commandLine:/.*[Ii]nstall-[Pp]swa[Ww]eb[Aa]pplication.*/
    pivot_on: host
    window: 24h
  - name: IIS or firewall exposure of the web gateway
    query: data_win_eventdata_image:/.*\\(appcmd|netsh)\.exe/ AND (data_win_eventdata_commandLine:/.*[Ii]is.*/ OR data_win_eventdata_commandLine:/.*443.*/ OR data_win_eventdata_commandLine:/.*[Pp]ower[Ss]hell.*/)
    pivot_on: host
    window: 6h
  - name: Local account or group changes granting access
    query: data_win_eventdata_image:/.*\\net1?\.exe/ AND (data_win_eventdata_commandLine:*add* OR data_win_eventdata_commandLine:*localgroup*)
    pivot_on: host
    window: 24h
  - name: IIS worker spawning shells (PSWA sessions)
    query: data_win_eventdata_parentImage:/.*\\w3wp\.exe/ AND data_win_eventdata_image:/.*\\(powershell|cmd)\.exe/
    pivot_on: host
    window: 24h
