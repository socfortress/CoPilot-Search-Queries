name: UAC Bypass via Windows Firewall Snap-In Hijack
id: e52cb31c-10ed-4aea-bcb7-593c9f4a315b
version: 1
schema_version: "1.0"
date: "2022-09-27"
author: Tim Rauch, Elastic (idea)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: e52cb31c-10ed-4aea-bcb7-593c9f4a315b
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects attempts to bypass User Account Control (UAC) by hijacking the
  Microsoft Management Console (MMC) Windows Firewall snap-in. MITRE ATT&CK:
  T1548.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_parentImage:
              value: "*\\\\mmc.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_parentCommandLine:
              value: "*WF.msc*"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\WerFault.exe"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_parentCommandLine
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\mmc.exe'; data_win_eventdata_parentCommandLine matches '*WF.msc*';
  data_win_eventdata_image matches '*\WerFault.exe'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.elastic.co/guide/en/security/current/uac-bypass-via-windows-firewall-snap-in-hijack.html#uac-bypass-via-windows-firewall-snap-in-hijack
  - https://attack.mitre.org/techniques/T1548/

response:
  message: >
    UAC Bypass via Windows Firewall Snap-In Hijack detected on host
    $agent_name$. Matched data_win_eventdata_parentImage:
    $data_win_eventdata_parentImage$. Matched
    data_win_eventdata_parentCommandLine:
    $data_win_eventdata_parentCommandLine$. MITRE ATT&CK: T1548
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_parentCommandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1548
  custom_tags:
    - bypass
    - firewall
    - hijack
    - process_creation
    - sysmon
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Mm][Mm][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_parentCommandLine:/.*[Ww][Ff]\.[Mm][Ss][Cc].*/ AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/.*\\[Ww][Ee][Rr][Ff][Aa][Uu][Ll][Tt]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 05a2ab7e-ce11-4b63-86db-ab32e763e11d
    name: MMC Spawning Windows Shell
    reason: 'Direct overlap: a shell child of mmc.exe is the observable result of a hijacked snap-in.'
  - id: ac30858b-7c25-4f0a-a7fa-bef036e49dc3
    name: Windows Execution of Microsoft MSC File In Suspicious Path
    reason: Snap-in hijacks often run an msc or plant files from a suspicious path.
  - id: windows-msc-eviltwin-directory-path-manipulation-001
    name: Windows MSC EvilTwin Directory Path Manipulation
    reason: Same MMC snap-in path manipulation family; the setup step before the child launch.
  - id: 30fc8de7-d833-40c4-96b6-28319fbc4f6c
    name: UAC Bypass Using Event Viewer RecentViews
    reason: Another mmc-based auto-elevation hijack, tried if one path is blocked.
  - id: d38d2fa4-98e6-4a24-aff1-410b0c9ad177
    name: HackTool - UACMe Akagi Execution
    reason: Akagi includes snap-in hijack methods.
  - id: 178e615d-e666-498b-9630-9ed363038101
    name: Elevated System Shell Spawned From Uncommon Parent Location
    reason: Follow-on elevated shell.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Elevated shell or tool spawned by mmc.exe
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:(/.*\\[Mm][Mm][Cc]\.[Ee][Xx][Ee]/) AND data_win_eventdata_image:(/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR /.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR /.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/) AND data_win_eventdata_integrityLevel:(High OR System)
    pivot_on: host
    window: 2h
  - name: mmc.exe started with firewall snap-in or custom msc
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*\\[Mm][Mm][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:(/.*[Ww][Ff]\.[Mm][Ss][Cc].*/ OR /.*\.[Mm][Ss][Cc].*/)
    pivot_on: host
    window: 2h
  - name: DLL or MUI dropped into System32 or Temp
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(/.*\\[Ss]ystem32\\.*\.([Dd][Ll][Ll]|[Mm][Uu][Ii])/ OR /.*\\[Tt]emp\\.*\.[Dd][Ll][Ll]/)
    pivot_on: host
    window: 2h
  - name: Firewall rule or profile changes
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Nn]etsh.*[Aa]dvfirewall.*/ OR /.*[Ss]et-[Nn]et[Ff]irewall.*/ OR /.*[Nn]ew-[Nn]et[Ff]irewall[Rr]ule.*/)
    pivot_on: host
    window: 6h
  - name: Credential dumping from elevated process
    query: data_win_system_eventID:1 AND data_win_eventdata_integrityLevel:(High OR System) AND data_win_eventdata_commandLine:(/.*[Ll][Ss][Aa][Ss][Ss].*/ OR /.*[Ss]ekurlsa.*/ OR /.*[Rr]eg.* save .*([Ss][Aa][Mm]|[Ss][Yy][Ss][Tt][Ee][Mm]).*/)
    pivot_on: host
    window: 6h
