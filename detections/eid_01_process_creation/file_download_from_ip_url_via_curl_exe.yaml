  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*(:\/\/[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}).*/ AND data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp].*/ AND (data_win_eventdata_commandLine:/.* -[Oo].*/ OR data_win_eventdata_commandLine:/.*--[Rr][Ee][Mm][Oo][Tt][Ee]-[Nn][Aa][Mm][Ee].*/ OR data_win_eventdata_commandLine:/.*--[Oo][Uu][Tt][Pp][Uu][Tt].*/) AND _exists_:data_win_eventdata_commandLine AND NOT (data_win_eventdata_commandLine:/.*\.[Bb][Aa][Tt]/ OR data_win_eventdata_commandLine:/.*\.[Bb][Aa][Tt]\"/ OR data_win_eventdata_commandLine:/.*\.[Dd][Aa][Tt]/ OR data_win_eventdata_commandLine:/.*\.[Dd][Aa][Tt]\"/ OR data_win_eventdata_commandLine:/.*\.[Dd][Ll][Ll]/ OR data_win_eventdata_commandLine:/.*\.[Dd][Ll][Ll]\"/ OR data_win_eventdata_commandLine:/.*\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*\.[Ee][Xx][Ee]\"/ OR data_win_eventdata_commandLine:/.*\.[Gg][Ii][Ff]/ OR data_win_eventdata_commandLine:/.*\.[Gg][Ii][Ff]\"/ OR data_win_eventdata_commandLine:/.*\.[Hh][Tt][Aa]/ OR data_win_eventdata_commandLine:/.*\.[Hh][Tt][Aa]\"/ OR data_win_eventdata_commandLine:/.*\.[Jj][Pp][Ee][Gg]/ OR data_win_eventdata_commandLine:/.*\.[Jj][Pp][Ee][Gg]\"/ OR data_win_eventdata_commandLine:/.*\.[Ll][Oo][Gg]/ OR data_win_eventdata_commandLine:/.*\.[Ll][Oo][Gg]\"/ OR data_win_eventdata_commandLine:/.*\.[Mm][Ss][Ii]/ OR data_win_eventdata_commandLine:/.*\.[Mm][Ss][Ii]\"/ OR data_win_eventdata_commandLine:/.*\.[Pp][Nn][Gg]/ OR data_win_eventdata_commandLine:/.*\.[Pp][Nn][Gg]\"/ OR data_win_eventdata_commandLine:/.*\.[Pp][Ss]1/ OR data_win_eventdata_commandLine:/.*\.[Pp][Ss]1\"/ OR data_win_eventdata_commandLine:/.*\.[Pp][Ss][Mm]1/ OR data_win_eventdata_commandLine:/.*\.[Pp][Ss][Mm]1\"/ OR data_win_eventdata_commandLine:/.*\.[Vv][Bb][Ee]/ OR data_win_eventdata_commandLine:/.*\.[Vv][Bb][Ee]\"/ OR data_win_eventdata_commandLine:/.*\.[Vv][Bb][Ss]/ OR data_win_eventdata_commandLine:/.*\.[Vv][Bb][Ss]\"/ OR data_win_eventdata_commandLine:/.*\.[Bb][Aa][Tt]'/ OR data_win_eventdata_commandLine:/.*\.[Dd][Aa][Tt]'/ OR data_win_eventdata_commandLine:/.*\.[Dd][Ll][Ll]'/ OR data_win_eventdata_commandLine:/.*\.[Ee][Xx][Ee]'/ OR data_win_eventdata_commandLine:/.*\.[Gg][Ii][Ff]'/ OR data_win_eventdata_commandLine:/.*\.[Hh][Tt][Aa]'/ OR data_win_eventdata_commandLine:/.*\.[Jj][Pp][Ee][Gg]'/ OR data_win_eventdata_commandLine:/.*\.[Ll][Oo][Gg]'/ OR data_win_eventdata_commandLine:/.*\.[Mm][Ss][Ii]'/ OR data_win_eventdata_commandLine:/.*\.[Pp][Nn][Gg]'/ OR data_win_eventdata_commandLine:/.*\.[Pp][Ss]1'/ OR data_win_eventdata_commandLine:/.*\.[Pp][Ss][Mm]1'/ OR data_win_eventdata_commandLine:/.*\.[Vv][Bb][Ee]'/ OR data_win_eventdata_commandLine:/.*\.[Vv][Bb][Ss]'/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 21dd6d38-2b18-4453-9404-a0fe4a0cc288
    name: Curl Download And Execute Combination
    reason: Curl fetch chained with execution is the direct escalation of a raw-IP download.
  - id: cb9cc1d1-e84e-4bdc-b7ad-c31b1b7908ec
    name: Insecure Transfer Via Curl.EXE
    reason: Plain-HTTP or insecure curl usage commonly accompanies bare-IP payload servers.
  - id: 85de1f22-d189-44e4-8239-dc276b45379b
    name: Curl Web Request With Potential Custom User-Agent
    reason: The same curl invocation often spoofs a User-Agent to blend staging or C2 traffic.
  - id: e328cc73-f92a-42fb-b3fa-7c2cffda981a
    name: Curl File Upload To File Sharing Websites
    reason: After staging tools, curl is reused to exfiltrate collected data.
  - id: d059842b-6b9d-4ed1-b5c3-5b89143c6ede
    name: File Download Via Bitsadmin
    reason: Alternative built-in downloader used in the same ingress phase.
  - id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
    name: PowerShell Download and Execution Cradles
    reason: Often the process that spawned curl or runs the downloaded payload.
  - id: 69bd9b97-2be2-41b6-9816-fb08757a4d1a
    name: Potentially Suspicious Execution From Parent Process In Public Folder
    reason: Downloaded payloads are frequently dropped to and run from Public folders.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Curl invocations with URLs or output flags
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*\\curl\.exe/ AND data_win_eventdata_commandLine:(*http* OR *ftp* OR *-o* OR *--output*)
    pivot_on: host
    window: 4h
  - name: Curl network connections
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*\\curl\.exe/ AND data_win_eventdata_initiated:true
    pivot_on: host
    window: 2h
  - name: Executable files written to writable directories
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\\(Temp|Users\\Public|ProgramData|AppData|Downloads)\\.*\.(exe|dll|bat|ps1|vbs|msi|js)/
    pivot_on: host
    window: 2h
  - name: Execution from user-writable paths
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*\\(Temp|Users\\Public|ProgramData|AppData)\\.*\.exe/
    pivot_on: host
    window: 2h
  - name: Script hosts and shells spawning curl
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*\\(cmd|powershell|pwsh|wscript|cscript|mshta)\.exe/ AND data_win_eventdata_image:/.*\\curl\.exe/
    pivot_on: host
    window: 2h
