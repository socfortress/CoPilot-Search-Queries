name: File Download Using Notepad++ GUP Utility
id: 44143844-0631-49ab-97a0-96387d6b2d7c
version: 1
schema_version: "1.0"
date: "2023-03-02"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 44143844-0631-49ab-97a0-96387d6b2d7c
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of the Notepad++ updater (gup) from a process other than
  Notepad++ to download files. MITRE ATT&CK: T1105.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\GUP.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "gup.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* -unzipTo *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*http*"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_parentImage"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\notepad++.exe"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches '*\GUP.exe';
  data_win_eventdata_originalFileName equals 'gup.exe';
  data_win_eventdata_commandLine matches '* -unzipTo *', among other conditions.

known_false_positives: >
  Other parent processes other than notepad++ using GUP that are not currently
  identified. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/nas_bench/status/1535322182863179776
  - https://attack.mitre.org/techniques/T1105/

response:
  message: >
    File Download Using Notepad++ GUP Utility detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1105
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1105
  custom_tags:
    - download
    - notepad
    - utility
    - process_creation
    - sysmon
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Gg][Uu][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Gg][Uu][Pp]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.* -[Uu][Nn][Zz][Ii][Pp][Tt][Oo] .*/ AND data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp].*/ AND _exists_:data_win_eventdata_parentImage AND NOT (data_win_eventdata_parentImage:/.*\\[Nn][Oo][Tt][Ee][Pp][Aa][Dd]\+\+\.[Ee][Xx][Ee]/)

