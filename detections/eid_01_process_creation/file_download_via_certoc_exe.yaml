name: File Download via CertOC.EXE
id: 70ad0861-d1fe-491c-a45f-fa48148a300d
version: 1
schema_version: "1.0"
date: "2023-10-18"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 70ad0861-d1fe-491c-a45f-fa48148a300d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects when a user downloads a file by using CertOC.exe. MITRE ATT&CK: T1105.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\certoc.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "CertOC.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*-GetCACAPS*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*http*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\certoc.exe'; data_win_eventdata_originalFileName equals 'CertOC.exe';
  data_win_eventdata_commandLine matches '*-GetCACAPS*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://lolbas-project.github.io/lolbas/Binaries/Certoc/
  - https://attack.mitre.org/techniques/T1105/

response:
  message: >
    File Download via CertOC.EXE detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1105
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1105
  custom_tags:
    - download
    - certoc
    - process_creation
    - sysmon
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Cc][Ee][Rr][Tt][Oo][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Cc][Ee][Rr][Tt][Oo][Cc]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*-[Gg][Ee][Tt][Cc][Aa][Cc][Aa][Pp][Ss].*/ AND data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b86f6dea-0b2f-41f5-bdcc-a057bd19cd6a
    name: File Download From IP Based URL Via CertOC.EXE
    reason: Same CertOC -GetCACAPS download where the URL is a raw IP; raises confidence.
  - id: 242301bc-f92f-4476-8718-78004a6efd9f
    name: DLL Loaded via CertOC.EXE
    reason: CertOC -LoadDLL executes a payload; the likely next step after the fetch.
  - id: 19b08b1c-861d-4e75-a1ef-ea0c1baf202b
    name: Suspicious Download Via Certutil.EXE
    reason: Interchangeable LOLBin downloader often tried on the same host when another is blocked.
  - id: d059842b-6b9d-4ed1-b5c3-5b89143c6ede
    name: File Download Via Bitsadmin
    reason: Generic sibling firing on the same command; confirms the transfer and its URL.
  - id: 74babdd6-a758-4549-9632-26535279e654
    name: Suspicious Executable File Creation
    reason: The downloaded payload landing on disk as an executable in a staging location.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: All CertOC executions
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Cc][Ee][Rr][Tt][Oo][Cc]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 4h
  - name: CertOC LoadDLL / ProcessScript
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Cc][Ee][Rr][Tt][Oo][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*-([Ll][Oo][Aa][Dd][Dd][Ll][Ll]|[Pp][Rr][Oo][Cc][Ee][Ss][Ss][Ss][Cc][Rr][Ii][Pp][Tt]).*/
    pivot_on: host
    window: 4h
  - name: Other LOLBin downloaders (certutil/bitsadmin/MpCmdRun)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Pp][Cc][Mm][Dd][Rr][Uu][Nn]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp].*/
    pivot_on: host
    window: 4h
  - name: Executable or script written to staging folder
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\([Tt]emp|[Pp]ublic|[Pp]rogram[Dd]ata|[Aa]pp[Dd]ata)\\.*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Pp][Ss]1|[Bb][Aa][Tt]|[Vv][Bb][Ss]|[Jj][Ss]|[Hh][Tt][Aa])/
    pivot_on: host
    window: 2h
  - name: Network connections from user-writable paths
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Tt]emp|[Pp]ublic|[Pp]rogram[Dd]ata|[Aa]pp[Dd]ata)\\.*/
    pivot_on: host
    window: 2h
