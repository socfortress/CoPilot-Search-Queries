name: HackTool - KrbRelayUp Execution
id: 12827a56-61a4-476a-a9cb-f3068f191073
version: 1
schema_version: "1.0"
date: "2023-02-04"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 12827a56-61a4-476a-a9cb-f3068f191073
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects KrbRelayUp used to perform a universal no-fix local privilege
  escalation in Windows domain environments where LDAP signing is not enforced.
  MITRE ATT&CK: T1558.003, T1550.003.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\KrbRelayUp.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "KrbRelayUp.exe"
                    case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* relay *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* -Domain *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* -ComputerName *"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* krbscm *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* -sc *"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* spawn *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* -d *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* -cn *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* -cp *"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\KrbRelayUp.exe'; data_win_eventdata_originalFileName equals
  'KrbRelayUp.exe'; data_win_eventdata_commandLine matches '* relay *', among
  other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/Dec0ne/KrbRelayUp
  - https://attack.mitre.org/techniques/T1558/003/
  - https://attack.mitre.org/techniques/T1550/003/

response:
  message: >
    HackTool - KrbRelayUp Execution detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1558.003, T1550.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1558.003
    - T1550.003
  custom_tags:
    - hacktool
    - krbrelayup
    - process_creation
    - sysmon
    - credential_access
    - lateral_movement
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Kk][Rr][Bb][Rr][Ee][Ll][Aa][Yy][Uu][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Kk][Rr][Bb][Rr][Ee][Ll][Aa][Yy][Uu][Pp]\.[Ee][Xx][Ee]/ OR (data_win_eventdata_commandLine:/.* [Rr][Ee][Ll][Aa][Yy] .*/ AND data_win_eventdata_commandLine:/.* -[Dd][Oo][Mm][Aa][Ii][Nn] .*/ AND data_win_eventdata_commandLine:/.* -[Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr][Nn][Aa][Mm][Ee] .*/) OR (data_win_eventdata_commandLine:/.* [Kk][Rr][Bb][Ss][Cc][Mm] .*/ AND data_win_eventdata_commandLine:/.* -[Ss][Cc] .*/) OR (data_win_eventdata_commandLine:/.* [Ss][Pp][Aa][Ww][Nn] .*/ AND data_win_eventdata_commandLine:/.* -[Dd] .*/ AND data_win_eventdata_commandLine:/.* -[Cc][Nn] .*/ AND data_win_eventdata_commandLine:/.* -[Cc][Pp] .*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e96253b8-6b3b-4f90-9e59-3b24b99cf9b4
    name: HackTool - KrbRelay Execution
    reason: KrbRelayUp wraps KrbRelay; operators often fall back to or precede with the raw KrbRelay binary on the same host.
  - id: a7664b14-75fb-4a50-a223-cb9bc0afbacf
    name: HackTool - RemoteKrbRelay Execution
    reason: Sibling Kerberos relay tool; seeing both indicates the actor is iterating relay variants to get a SYSTEM shell.
  - id: 0ed99dda-6a35-11ef-8c99-0242ac120002
    name: Attempts of Kerberos Coercion Via DNS SPN Spoofing
    reason: Kerberos relay chains need a coerced or spoofed SPN authentication; this is the setup step before the relay.
  - id: 5589ab4f-a767-433c-961d-c91f3f704db1
    name: Potential SMB Relay Attack Tool Execution
    reason: Relay-style tooling on the same host indicates NTLM/Kerberos relay tradecraft beyond a single binary.
  - id: 38a1ac5f-9c74-47d2-a345-dd6f5eb4e7c8
    name: HKTL - SharpSuccessor Privilege Escalation Tool Execution
    reason: Another AD privilege escalation tool commonly run in the same operator toolkit after local/domain escalation.
  - id: d9367cbb-c2e0-47ce-bdc0-128cb6da898d
    name: HackTool - SharpLdapWhoami Execution
    reason: Used to verify LDAP signing/channel binding and relay identity, the precondition KrbRelayUp depends on.
  - id: c3e05466-5f22-11eb-ae93-0242ac130002
    name: NLTest Domain Trust Discovery
    reason: Domain recon preceding relay attack, to find DC and domain names fed to -Domain/-ComputerName.
  - id: 13bbd574-83ac-11ec-99d4-acde48001122
    name: Mimikatz PassTheTicket CommandLine Parameters
    reason: KrbRelayUp yields tickets/SYSTEM; follow-on ticket reuse via pass-the-ticket is the natural next step.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Machine account creation and S4U ticket tooling
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*([Rr]ubeus|[Ss]4[Uu]|[Tt]gtdeleg|[Aa]sktgs|[Kk]list|[Kk]rbscm).*/)
    pivot_on: host
    window: 4h
  - name: Domain and DC discovery by the same host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*([Nn][Ll][Tt][Ee][Ss][Tt] .*(dclist|domain_trusts|dsgetdc)|[Nn]et .*group .*domain|[Ss]et-[Aa][Dd]|[Gg]et-[Aa][Dd]).*/)
    pivot_on: host
    window: 4h
  - name: Service creation via krbscm or SYSTEM service install
    query: (data_win_system_eventID:"7045" OR data_win_system_eventID:"4697") AND (data_win_eventdata_imagePath:/.*([Cc]md|[Pp]ower[Ss]hell|[Tt]emp|[Pp]rogram[Dd]ata|[Pp]ublic).*/ OR data_win_eventdata_serviceFileName:/.*([Cc]md|[Pp]ower[Ss]hell|[Tt]emp|[Pp]rogram[Dd]ata|[Pp]ublic).*/)
    pivot_on: host
    window: 2h
  - name: LDAP and Kerberos connections from user-writable tooling
    query: data_win_system_eventID:"3" AND (data_win_eventdata_destinationPort:"389" OR data_win_eventdata_destinationPort:"636" OR data_win_eventdata_destinationPort:"88") AND data_win_eventdata_image:/.*\\([Uu]sers|[Pp]rogram[Dd]ata|[Tt]emp|[Pp]ublic)\\.*/
    pivot_on: host
    window: 2h
  - name: Kerberos service ticket requests with machine account
    query: data_win_system_eventID:"4769" AND data_win_eventdata_targetUserName:/.*\$.*/ AND data_win_eventdata_ticketEncryptionType:"0x17"
    pivot_on: host
    window: 4h
