name: Windows Files and Dirs Access Rights Modification Via Icacls
id: c76b796c-27e1-4520-91c4-4a58695c749e
version: 1
schema_version: "1.0"
date: "2026-04-08"
author: SOCFortress LLC
status: production
type: TTP

description: >
  The following analytic identifies the modification of security permissions on files or directories
  using tools like icacls.exe, cacls.exe, or xcacls.exe. It leverages Sysmon EventID 1 to detect
  process creation events with specific command-line arguments that modify access control lists (ACLs).
  This activity is significant as it is commonly used by Advanced Persistent Threats (APTs) and coinminer
  scripts to evade detection, maintain control over compromised systems, and hinder investigation efforts.
  The use of these tools with permission modification flags (:R, :W, :F, :C, :N, /P, /E) is a strong
  indicator of malicious activity. If confirmed malicious, this behavior could allow attackers to prevent
  remediation efforts and maintain persistent access to the compromised environment.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image: "*icacls.exe"
              - wildcard:
                  data_win_eventdata_image: "*cacls.exe"
              - wildcard:
                  data_win_eventdata_image: "*xcacls.exe"
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine: "*:R*"
              - wildcard:
                  data_win_eventdata_commandLine: "*:W*"
              - wildcard:
                  data_win_eventdata_commandLine: "*:F*"
              - wildcard:
                  data_win_eventdata_commandLine: "*:C*"
              - wildcard:
                  data_win_eventdata_commandLine: "*:N*"
              - wildcard:
                  data_win_eventdata_commandLine: "*/P*"
              - wildcard:
                  data_win_eventdata_commandLine: "*/E*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user
    - agent_name

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "YYYY-MM-DD 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "YYYY-MM-DD 23:59:59.999"

how_to_implement: >
  To successfully implement this search, you need to be ingesting logs with process execution data
  from your endpoints. Sysmon EventID 1 captures process creation events. Ensure that Sysmon is
  configured to log all process creation events and that these logs are properly ingested into
  Elasticsearch with complete command-line information. The detection specifically looks for icacls.exe,
  cacls.exe, or xcacls.exe executions with permission modification flags (:R, :W, :F, :C, :N, /P, /E),
  which are strong indicators of ACL tampering for defense evasion or persistence.

known_false_positives: >
  No false positives have been identified at this time. Legitimate administrative tasks typically
  modify file permissions through the GUI or documented administrative procedures, not through
  command-line tools like icacls.exe. However, filter as needed based on your environment's specific
  administrative practices.

references:
  - https://malpedia.caad.fkie.fraunhofer.de/details/win.amadey

response:
  message: >
    Process name $data_win_eventdata_image$ with access right modification argument executed by
    $data_win_eventdata_user$ to change security permission of a specific file or directory on host
    $agent_name$. CommandLine: $data_win_eventdata_commandLine$. This is indicative of
    malicious ACL tampering for defense evasion or unauthorized access.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
    - field: data_win_eventdata_user
      type: user
      score: 70
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_parentImage
      type: process

tags:
  analytic_story:
    - Amadey
    - Defense Evasion or Unauthorized Access Via SDDL Tampering
  asset_type: Endpoint
  mitre_attack_id:
    - T1222.001
  custom_tags:
    - icacls
    - access_control
    - permission_modification
    - defense_evasion
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:"C:\\\\Windows\\\\System32\\\\icacls.exe" AND (data_win_eventdata_commandLine:/.*:F.*/ OR data_win_eventdata_commandLine:/.*:W.*/ OR data_win_eventdata_commandLine:/.*:R.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: windows-modify-acl-permission-to-files-or-folder-001
    name: Windows Modify ACL Permission To Files Or Folder
    reason: Grants to Everyone/SYSTEM via ACL tools are the dangerous subset of the same permission change, seen on the same command.
  - id: 4ae81040-fc1c-4249-bfa3-938d260214d9
    name: Use Icacls to Hide File to Everyone
    reason: Deny-everyone ACLs hide a dropped payload, the usual purpose of icacls in malware.
  - id: fa7ca5c6-c9d8-11eb-bce9-acde48001122
    name: Permission Modification using Takeown App
    reason: Takeown precedes icacls when taking over protected files or directories.
  - id: 554601fb-9b71-4bcc-abf4-21a611be4fde
    name: Suspicious Recursive Takeown
    reason: Recursive ownership grab followed by icacls grant is a classic ransomware and miner prep sequence.
  - id: 4281cb20-2994-4580-aa63-c8b86d019934
    name: Hiding Files with Attrib.exe
    reason: Hiding files via attrib pairs with ACL lockdown to conceal dropped payloads.
  - id: 17769c90-230e-488b-a463-e05c08e9d48f
    name: Powershell Defender Exclusion
    reason: Amadey and miners weaken defences by adding exclusions alongside permission changes.
  - id: dee4af55-1f22-4e1d-a9d2-4bdc7ecb472a
    name: Disabled Volume Snapshots
    reason: 'Ransomware pairing: permission tampering then recovery inhibition.'
  - id: d059842b-6b9d-4ed1-b5c3-5b89143c6ede
    name: File Download Via Bitsadmin
    reason: Icacls often follows payload download to make the dropped file executable and persistent.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Takeown or attrib used on files
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Tt][Aa][Kk][Ee][Oo][Ww][Nn]\.[Ee][Xx][Ee]/ OR (data_win_eventdata_image:/.*[Aa][Tt][Tt][Rr][Ii][Bb]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.* \+[HhSs].*/))
    pivot_on: host
    window: 4h
  - name: Executables and scripts created in user-writable paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(\\[Tt][Ee][Mm][Pp]|\\[Pp][Uu][Bb][Ll][Ii][Cc]|\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]|\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]).*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Pp][Ss]1|[Bb][Aa][Tt]|[Vv][Bb][Ss])/
    pivot_on: host
    window: 4h
  - name: Persistence via scheduled task or Run key
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*\/[Cc][Rr][Ee][Aa][Tt][Ee].*/) OR (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/)
    pivot_on: host
    window: 4h
  - name: Defender or firewall weakening commands
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Aa][Dd][Vv][Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll].*[Oo][Ff][Ff].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Nn][Ee][Tt][Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll][Pp][Rr][Oo][Ff][Ii][Ll][Ee].*/)
    pivot_on: host
    window: 4h
  - name: Shadow copy deletion or recovery inhibition
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*[Dd][Ee][Ll][Ee][Tt][Ee].*[Ss][Hh][Aa][Dd][Oo][Ww].*/ OR data_win_eventdata_commandLine:/.*[Bb][Cc][Dd][Ee][Dd][Ii][Tt].*[Rr][Ee][Cc][Oo][Vv][Ee][Rr][Yy][Ee][Nn][Aa][Bb][Ll][Ee][Dd].*/ OR data_win_eventdata_commandLine:/.*[Ww][Mm][Ii][Cc].*[Ss][Hh][Aa][Dd][Oo][Ww][Cc][Oo][Pp][Yy].*[Dd][Ee][Ll][Ee][Tt][Ee].*/)
    pivot_on: host
    window: 6h
