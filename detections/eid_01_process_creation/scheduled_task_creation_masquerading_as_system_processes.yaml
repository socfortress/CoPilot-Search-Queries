name: Scheduled Task Creation Masquerading as System Processes
id: 9f8573c9-22b4-40e3-89c1-72bc2b8d49ab
version: 1
schema_version: "1.0"
date: "2025-02-05"
author: Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 9f8573c9-22b4-40e3-89c1-72bc2b8d49ab
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the creation of scheduled tasks that involve system processes, which
  may indicate malicious actors masquerading as or abusing these processes to
  execute payloads or maintain persistence. MITRE ATT&CK: T1053.005, T1036.004,
  T1036.005.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\schtasks.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "schtasks.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -create *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /create *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* –create *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* —create *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* ―create *"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* audiodg*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* conhost*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* dwm.exe*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* explorer*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* lsass*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* lsm*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* mmc*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* msiexec*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* regsvr32*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* rundll32*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* services*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* spoolsv*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* svchost*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* taskeng*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* taskhost*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* wininit*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* winlogon*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\schtasks.exe'; data_win_eventdata_originalFileName equals 'schtasks.exe';
  data_win_eventdata_commandLine matches '* -create *', among other conditions.

known_false_positives: >
  Legitimate system administration tasks scheduling trusted system processes.
  Baseline expected activity in your environment and tune this detection before
  relying on it for automated response.

references:
  - https://tria.ge/241015-l98snsyeje/behavioral2
  - https://attack.mitre.org/techniques/T1053/005/
  - https://attack.mitre.org/techniques/T1036/004/
  - https://attack.mitre.org/techniques/T1036/005/

response:
  message: >
    Scheduled Task Creation Masquerading as System Processes detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1053.005, T1036.004,
    T1036.005
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1053.005
    - T1036.004
    - T1036.005
  custom_tags:
    - scheduled
    - masquerading
    - system
    - process_creation
    - sysmon
    - privilege_escalation
    - execution
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.* -[Cc][Rr][Ee][Aa][Tt][Ee] .*/ OR data_win_eventdata_commandLine:/.* \/[Cc][Rr][Ee][Aa][Tt][Ee] .*/ OR data_win_eventdata_commandLine:/.* –[Cc][Rr][Ee][Aa][Tt][Ee] .*/ OR data_win_eventdata_commandLine:/.* —[Cc][Rr][Ee][Aa][Tt][Ee] .*/ OR data_win_eventdata_commandLine:/.* ―[Cc][Rr][Ee][Aa][Tt][Ee] .*/) AND (data_win_eventdata_commandLine:/.* [Aa][Uu][Dd][Ii][Oo][Dd][Gg].*/ OR data_win_eventdata_commandLine:/.* [Cc][Oo][Nn][Hh][Oo][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.* [Dd][Ww][Mm]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_commandLine:/.* [Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.* [Ll][Ss][Aa][Ss][Ss].*/ OR data_win_eventdata_commandLine:/.* [Ll][Ss][Mm].*/ OR data_win_eventdata_commandLine:/.* [Mm][Mm][Cc].*/ OR data_win_eventdata_commandLine:/.* [Mm][Ss][Ii][Ee][Xx][Ee][Cc].*/ OR data_win_eventdata_commandLine:/.* [Rr][Ee][Gg][Ss][Vv][Rr]32.*/ OR data_win_eventdata_commandLine:/.* [Rr][Uu][Nn][Dd][Ll][Ll]32.*/ OR data_win_eventdata_commandLine:/.* [Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss].*/ OR data_win_eventdata_commandLine:/.* [Ss][Pp][Oo][Oo][Ll][Ss][Vv].*/ OR data_win_eventdata_commandLine:/.* [Ss][Vv][Cc][Hh][Oo][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.* [Tt][Aa][Ss][Kk][Ee][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.* [Tt][Aa][Ss][Kk][Hh][Oo][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.* [Ww][Ii][Nn][Ii][Nn][Ii][Tt].*/ OR data_win_eventdata_commandLine:/.* [Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 81325ce1-be01-4250-944f-b4789644556f
    name: Schedule Task Creation From Env Variable Or Potentially Suspicious Path Via Schtasks.EXE
    reason: Masquerade tasks usually point at a binary in a suspicious path; same creation event.
  - id: 8a8379b8-780b-4dbf-b1e9-31c8d112fefb
    name: Schtasks From Suspicious Folders
    reason: Complements the name-based masquerade with path-based evidence.
  - id: 89ca78fd-b37c-4310-b3d3-81a023f83936
    name: Schtasks Creation Or Modification With SYSTEM Privileges
    reason: Masquerading tasks are typically set to run as SYSTEM.
  - id: 3f7f5b0b-5b16-476c-a85f-ab477f6dd24b
    name: Lazarus System Binary Masquerading
    reason: Related system-binary masquerading tradecraft to hide payloads.
  - id: f91e51c9-f344-4b32-969b-0b6f6b8537d4
    name: Renamed Schtasks Execution
    reason: 'Evasion partner: renamed schtasks used to dodge detection of task creation.'
  - id: 1d174d38-8fda-4081-a9b6-56d9763c0cd8
    name: Scheduled Task Creation with Curl and PowerShell Execution Combo
    reason: Task actions that download/execute payloads may use system-process names.
  - id: 86588b36-c6d3-465f-9cee-8f9093e07798
    name: Scheduled Task Executing Payload from Registry
    reason: Fileless task payload follow-on persistence.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: System-named binaries running from non-system paths
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Ss]vchost\.exe/ OR data_win_eventdata_image:/.*[Ll]sass\.exe/ OR data_win_eventdata_image:/.*[Cc]srss\.exe/ OR data_win_eventdata_image:/.*[Ww]inlogon\.exe/ OR data_win_eventdata_image:/.*[Ss]poolsv\.exe/ OR data_win_eventdata_image:/.*[Tt]askhostw?\.exe/ OR data_win_eventdata_image:/.*[Cc]onhost\.exe/) AND NOT data_win_eventdata_image:/.*[Ww]indows.([Ss]ystem32|[Ss]ys[Ww][Oo][Ww]64).*/
    pivot_on: host
    window: 6h
  - name: Task registration by schtasks (create/xml)
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Ss]chtasks.*/ AND data_win_eventdata_commandLine:/.*(.create|.xml|.change).*/
    pivot_on: host
    window: 6h
  - name: Task-launched interpreters
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*[Ss]vchost.*/ OR data_win_eventdata_parentImage:/.*[Tt]ask[Hh]ost.*/) AND (data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ OR data_win_eventdata_image:/.*[Cc]md\.exe/ OR data_win_eventdata_image:/.*[Rr]undll32.*/ OR data_win_eventdata_image:/.*[Rr]egsvr32.*/ OR data_win_eventdata_image:/.*[Mm]shta.*/ OR data_win_eventdata_image:/.*[Ww]script.*/ OR data_win_eventdata_image:/.*[Cc]script.*/)
    pivot_on: host
    window: 6h
  - name: Executables written with system-binary names
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(svchost|lsass|csrss|winlogon|spoolsv|taskhost|conhost)\.exe/ AND NOT data_win_eventdata_targetFilename:/.*[Ww]indows.[Ss]ystem32.*/
    pivot_on: host
    window: 6h
  - name: Outbound connections from masquerading binaries
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*[Ss]vchost\.exe/ OR data_win_eventdata_image:/.*[Ss]poolsv\.exe/ OR data_win_eventdata_image:/.*[Tt]askhostw?\.exe/ OR data_win_eventdata_image:/.*[Cc]onhost\.exe/) AND NOT data_win_eventdata_image:/.*[Ww]indows.[Ss]ystem32.*/
    pivot_on: host
    window: 6h
