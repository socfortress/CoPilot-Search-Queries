name: Windows Create Local Administrator Account Via Net
id: 2c568c34-bb57-4b43-9d75-19c605b98e70
version: 1
schema_version: "1.0"
date: "2026-04-07"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  The following analytic detects the creation of a local administrator account using the "net.exe"
  command. It leverages Endpoint Detection and Response (EDR) data to identify processes named "net.exe"
  with the "/add" parameter and keywords related to administrator accounts in multiple languages. This
  activity is significant as it may indicate an attacker attempting to gain persistent access or escalate
  privileges. If confirmed malicious, this could lead to unauthorized access, data theft, or further
  system compromise. Review the process details, user context, and related artifacts to determine the
  legitimacy of the activity.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - wildcard:
            data_win_eventdata_image: "*net.exe"
        - wildcard:
            data_win_eventdata_commandLine: "*localgroup*"
        - wildcard:
            data_win_eventdata_commandLine: "*add*"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine: "*administrators*"
              - wildcard:
                  data_win_eventdata_commandLine: "*administratoren*"
              - wildcard:
                  data_win_eventdata_commandLine: "*administrateurs*"
              - wildcard:
                  data_win_eventdata_commandLine: "*administrador*"
              - wildcard:
                  data_win_eventdata_commandLine: "*amministratori*"
              - wildcard:
                  data_win_eventdata_commandLine: "*administratorer*"
              - wildcard:
                  data_win_eventdata_commandLine: "*Rendszergazda*"
              - wildcard:
                  data_win_eventdata_commandLine: "*Администратор*"
              - wildcard:
                  data_win_eventdata_commandLine: "*Administratör*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user
    - agent_name

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "YYYY-MM-DD 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "YYYY-MM-DD 23:59:59.999"

how_to_implement: >
  The detection is based on data that originates from Endpoint Detection and Response (EDR) agents.
  These agents are designed to provide security-related telemetry from the endpoints where the agent
  is installed. To implement this search, you must ingest logs that contain the process GUID, process
  name, and parent process. Additionally, you must ingest complete command-line executions. These logs
  must be processed using the appropriate Splunk Technology Add-ons that are specific to the EDR product.
  The logs must also be mapped to the Processes node of the Endpoint data model. Ensure Sysmon EventID 1
  is enabled and configured to capture process creation events with full command-line arguments.

known_false_positives: >
  Administrators often leverage net.exe to create admin accounts. Verify the context and user performing
  the action. Consider whitelisting known administrative accounts and scripts that legitimately perform
  this action.

references: []

response:
  message: >
    Process $data_win_eventdata_image$ was executed on $agent_name$ by user $data_win_eventdata_user$
    with command line: $data_win_eventdata_commandLine$. This may indicate unauthorized local administrator
    account creation.
  risk_score: 30
  severity: medium
  risk_objects:
    - field: data_win_eventdata_user
      type: user
      score: 30
    - field: agent_name
      type: system
      score: 30
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_parentImage
      type: parent_process

tags:
  analytic_story:
    - Active Directory Privilege Escalation
    - Lateral Movement
    - Account Manipulation
  asset_type: Endpoint
  mitre_attack_id:
    - T1136.001
  custom_tags:
    - admin_account_creation
    - net_exe
    - privilege_escalation
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*net\.exe/ AND data_win_eventdata_commandLine:/.*localgroup.*/ AND data_win_eventdata_commandLine:/.*administrators.*/ AND data_win_eventdata_commandLine:/.*add.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: cd219ff3-fa99-45d4-8380-a7d15116c6dc
    name: New User Created Via Net.EXE
    reason: 'Usually the precursor: the account is created with net user /add and then immediately placed in Administrators.'
  - id: b9f0e6f5-09b4-4358-bae4-08408705bd5c
    name: New User Created Via Net.EXE With Never Expire Option
    reason: Backdoor accounts are often made non-expiring before being granted admin rights.
  - id: bf906d7b-7070-4642-8383-e404cf26eba5
    name: DarkGate - User Created Via Net.EXE
    reason: DarkGate creates a local user via net.exe then adds it to Administrators; same command chain.
  - id: ad720b90-25ad-43ff-9b5e-5c841facc8e5
    name: User Added to Local Administrators Group
    reason: Process-level view of the same group-add that may fire from other binaries (net1, PowerShell, wmic) on the host.
  - id: 5b768e71-86f2-4879-b448-81061cbae951
    name: Suspicious Manipulation Of Default Accounts Via Net.EXE
    reason: Attackers also enable or reset Administrator/Guest instead of creating a new account.
  - id: 9ec9fb1b-e059-4489-9642-f270c207923d
    name: Hiding User Account Via SpecialAccounts Registry Key - CommandLine
    reason: 'Follow-on persistence step: hide the newly created admin account from the logon screen.'
  - id: d95de845-b83c-4a9a-8a6a-4fc802ebf6c0
    name: Suspicious Group And Account Reconnaissance Activity Using Net.EXE
    reason: Account and group enumeration with net.exe typically precedes choosing which group to join.
  - id: d4498716-1d52-438f-8084-4a603157d131
    name: Password Provided In Command Line Of Net.EXE
    reason: Same net.exe account-management tradecraft, with a plaintext password set on the new account.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Local account creation or group change events
    query: data_win_system_eventID:(4720 OR 4722 OR 4724 OR 4732 OR 4738)
    pivot_on: host
    window: 4h
  - name: net.exe user and group management commands
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Nn][Ee][Tt]1?\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*[Uu][Ss][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp].*/)
    pivot_on: host
    window: 4h
  - name: Hidden account registry configuration
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Ss][Pp][Ee][Cc][Ii][Aa][Ll][Aa][Cc][Cc][Oo][Uu][Nn][Tt][Ss]\[Uu][Ss][Ee][Rr][Ll][Ii][Ss][Tt].*/
    pivot_on: host
    window: 6h
  - name: Remote logons by non-machine accounts
    query: data_win_system_eventID:4624 AND data_win_eventdata_logonType:(3 OR 10) AND NOT data_win_eventdata_targetUserName:/.*\$/
    pivot_on: host
    window: 24h
  - name: Interpreter-driven account add commands
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Cc][Mm][Dd]|[Ww][Mm][Ii][Cc])\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*/[Aa][Dd][Dd].*/
    pivot_on: host
    window: 2h
