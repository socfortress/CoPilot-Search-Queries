name: Operator Bloopers Cobalt Strike Commands
id: 647c7b9e-d784-4fda-b9a0-45c565a7b729
version: 1
schema_version: "1.0"
date: "2023-01-30"
author: _pete_0, TheDFIRReport
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 647c7b9e-d784-4fda-b9a0-45c565a7b729
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects use of Cobalt Strike commands accidentally entered in the CMD shell.
  MITRE ATT&CK: T1059.003.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - term:
                  data_win_eventdata_originalFileName:
                    value: "Cmd.Exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\cmd.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "cmd *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "cmd.exe*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "c:\\\\windows\\\\system32\\\\cmd.exe*"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*psinject*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*spawnas*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*make_token*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*remote-exec*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*rev2self*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*dcsync*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*logonpasswords*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*execute-assembly*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*getsystem*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_originalFileName
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_originalFileName equals
  'Cmd.Exe'; data_win_eventdata_image matches '*\cmd.exe';
  data_win_eventdata_commandLine matches 'cmd *', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://hstechdocs.helpsystems.com/manuals/cobaltstrike/current/userguide/content/cobalt-4-5-user-guide.pdf
  - https://thedfirreport.com/2021/10/04/bazarloader-and-the-conti-leaks/
  - https://thedfirreport.com/2022/06/16/sans-ransomware-summit-2022-can-you-detect-this/
  - https://attack.mitre.org/techniques/T1059/003/

response:
  message: >
    Operator Bloopers Cobalt Strike Commands detected on host $agent_name$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1059.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_originalFileName
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.003
  custom_tags:
    - operator
    - bloopers
    - cobalt
    - process_creation
    - sysmon
    - execution
    - stp_1u
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_originalFileName:/[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/[Cc][Mm][Dd] .*/ OR data_win_eventdata_commandLine:/[Cc][Mm][Dd]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_commandLine:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Cc][Mm][Dd]\.[Ee][Xx][Ee].*/) AND (data_win_eventdata_commandLine:/.*[Pp][Ss][Ii][Nn][Jj][Ee][Cc][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ss][Pp][Aa][Ww][Nn][Aa][Ss].*/ OR data_win_eventdata_commandLine:/.*[Mm][Aa][Kk][Ee]_[Tt][Oo][Kk][Ee][Nn].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Mm][Oo][Tt][Ee]-[Ee][Xx][Ee][Cc].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Vv]2[Ss][Ee][Ll][Ff].*/ OR data_win_eventdata_commandLine:/.*[Dd][Cc][Ss][Yy][Nn][Cc].*/ OR data_win_eventdata_commandLine:/.*[Ll][Oo][Gg][Oo][Nn][Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ee][Xx][Ee][Cc][Uu][Tt][Ee]-[Aa][Ss][Ss][Ee][Mm][Bb][Ll][Yy].*/ OR data_win_eventdata_commandLine:/.*[Gg][Ee][Tt][Ss][Yy][Ss][Tt][Ee][Mm].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: f35c5d71-b489-4e22-a115-f003df287317
    name: Potential CobaltStrike Process Patterns
    reason: Beacon post-exploitation spawns characteristic process patterns on the same host.
  - id: 15619216-e993-4721-b590-4c520615a67d
    name: Potential Meterpreter/CobaltStrike Activity
    reason: Service-based getsystem / named-pipe impersonation that a Beacon operator runs.
  - id: 85adeb13-4fc9-4e68-8a4a-c7cb2c336eb7
    name: CobaltStrike Named Pipe Patterns
    reason: Beacon SMB/post-ex named pipes confirm a live implant behind the mistyped command.
  - id: d5601f8c-b26f-4ab0-9035-69e11a8d4ad2
    name: CobaltStrike Named Pipe
    reason: Default Beacon pipe names confirm Cobalt Strike on the host.
  - id: ae9c6a7c-9521-42a6-915e-5aaa8689d529
    name: CobaltStrike Load by Rundll32
    reason: Beacon DLL loaded through rundll32 is a common delivery preceding operator commands.
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: logonpasswords/dcsync style commands imply credential theft that follows.
  - id: dd04b29a-beed-11eb-87bc-acde48001122
    name: Detect SharpHound Usage
    reason: AD enumeration commonly accompanies Beacon operator sessions.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Beacon named pipes
    query: data_win_system_eventID:(17 OR 18) AND (data_win_eventdata_pipeName:/.*[Mm]sse-.*/ OR data_win_eventdata_pipeName:/.*[Pp]ostex_.*/ OR data_win_eventdata_pipeName:/.*[Ss]tatus_.*/ OR data_win_eventdata_pipeName:/.*[Mm]smagent.*/)
    pivot_on: host
    window: 6h
  - name: LSASS access
    query: data_win_system_eventID:10 AND data_win_eventdata_targetImage:/.*[Ll]sass\.exe/
    pivot_on: host
    window: 6h
  - name: Remote thread injection into common hosts
    query: data_win_system_eventID:8 AND data_win_eventdata_targetImage:/.*(rundll32|svchost|dllhost|werfault)\.exe/
    pivot_on: host
    window: 6h
  - name: Lateral movement tooling
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*[Ss]c(\.exe)? +\\\\.*/ OR data_win_eventdata_image:/.*([Pp]s[Ee]xec|[Ww]mic)\.exe/)
    pivot_on: host
    window: 6h
