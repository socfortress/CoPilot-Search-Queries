name: Windows Disable Internet Explorer Addons
id: windows-disable-ie-addons-extoff-001
version: 1
schema_version: "1.0"
date: "2026-02-23"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  Detects iexplore.exe launched with -extoff flag which disables all browser 
  extensions. Adversaries abuse this to open a clean browser session bypassing 
  security controls like antivirus browser extensions and group policy add-ons. 
  Used by malicious Inno Setup loaders and phishing campaigns.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - wildcard:
            data_win_eventdata_commandLine: "*-extoff*"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image: "*\\\\iexplore.exe"
              - wildcard:
                  data_win_eventdata_commandLine: "*iexplore*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-23 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-23 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Windows endpoints with Sysmon 
  installed and configured to log process creation events (EventID 1) with full 
  command-line arguments.

known_false_positives: >
  IT administrators may use -extoff for troubleshooting browser issues. Rare in 
  modern environments. Investigate parent process and user context.

references:
  - https://attack.mitre.org/techniques/T1176/001/
  - https://www.hybrid-analysis.com/sample/e285feeca968b3ca22017a64363eea5e69ccd519696671df523291b089597875

response:
  message: >
    Internet Explorer launched with -extoff (extensions disabled) on $agent_name$. 
    Command: $data_win_eventdata_commandLine$. 
    Parent: $data_win_eventdata_parentImage$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1176.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects: []

tags:
  analytic_story:
    - Malicious Inno Setup Loader
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1176.001
  custom_tags:
    - internet_explorer
    - extoff
    - browser_abuse
    - defense_evasion
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*-extoff.*/ AND (data_win_eventdata_image:/.*iexplore\.exe/ OR data_win_eventdata_commandLine:/.*iexplore.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: fb50eb7a-5ab1-43ae-bcc9-091818cb8424
    name: Disabled IE Security Features
    reason: Adjacent IE hardening bypass via command line; the same actor tends to weaken IE protections before opening a clean session.
  - id: 10344bb3-7f65-46c2-b915-2d00d47be5b0
    name: IE ZoneMap Setting Downgraded To MyComputer Zone For HTTP Protocols Via CLI
    reason: Zone downgrade reduces IE security prompts; used together with -extoff to load payload pages.
  - id: 1193d960-2369-499f-a158-7b50a31df682
    name: Potential Suspicious Browser Launch From Document Reader Process
    reason: 'Phishing delivery: a document reader spawning a browser can precede an -extoff launch.'
  - id: cea72823-df4d-4567-950c-0b579eaf0846
    name: Potential Dropper Script Execution Via WScript/CScript/MSHTA
    reason: Script dropper stage that commonly launches iexplore -extoff to fetch the next payload.
  - id: 94771a71-ba41-4b6e-a757-b531372eaab6
    name: File Download From Browser Process Via Inline URL
    reason: Browser launched with an inline URL to download a payload follows the clean-session launch.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: iexplore launches on host
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Ii]explore.exe/
    pivot_on: host
    window: 2h
  - name: IE spawned by scripts, Office or installers
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Ii]explore.exe/ AND data_win_eventdata_parentImage:/.*([Ww]script|[Cc]script|[Mm]shta|[Pp]owershell|[Cc]md|[Ww]inword|[Ee]xcel|[Aa]cro[Rr]d|[Ss]etup|[Ii]nstall).*/
    pivot_on: host
    window: 2h
  - name: Executables run from temp or download paths
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*\\([Tt]emp|[Dd]ownloads|[Aa]pp[Dd]ata)\\.*.exe/
    pivot_on: host
    window: 2h
  - name: Defender tampering on host
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*[Mm]p[Pp]reference.*/
    pivot_on: host
    window: 2h
