name: Potential Data Stealing Via Chromium Headless Debugging
id: 3e8207c5-fcd2-4ea6-9418-15d45b4890e4
version: 1
schema_version: "1.0"
date: "2022-12-23"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 3e8207c5-fcd2-4ea6-9418-15d45b4890e4
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects chromium based browsers starting in headless and debugging mode and
  pointing to a user profile. This could be a sign of data stealing or remote
  control. MITRE ATT&CK: T1185, T1564.003.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*--remote-debugging-*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*--user-data-dir*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*--headless*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*--remote-debugging-*'; data_win_eventdata_commandLine matches
  '*--user-data-dir*'; data_win_eventdata_commandLine matches '*--headless*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/defaultnamehere/cookie_crimes/
  - https://mango.pdf.zone/stealing-chrome-cookies-without-a-password
  - https://embracethered.com/blog/posts/2020/cookie-crimes-on-mirosoft-edge/
  - https://embracethered.com/blog/posts/2020/chrome-spy-remote-control/
  - https://attack.mitre.org/techniques/T1185/
  - https://attack.mitre.org/techniques/T1564/003/

response:
  message: >
    Potential Data Stealing Via Chromium Headless Debugging detected on host
    $agent_name$. Matched data_win_eventdata_commandLine:
    $data_win_eventdata_commandLine$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1185, T1564.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1185
    - T1564.003
  custom_tags:
    - stealing
    - chromium
    - headless
    - process_creation
    - sysmon
    - credential_access
    - collection
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*--[Rr][Ee][Mm][Oo][Tt][Ee]-[Dd][Ee][Bb][Uu][Gg][Gg][Ii][Nn][Gg]-.*/ AND data_win_eventdata_commandLine:/.*--[Uu][Ss][Ee][Rr]-[Dd][Aa][Tt][Aa]-[Dd][Ii][Rr].*/ AND data_win_eventdata_commandLine:/.*--[Hh][Ee][Aa][Dd][Ll][Ee][Ss][Ss].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b3d34dc5-2efd-4ae3-845f-8ec14921f449
    name: Browser Started with Remote Debugging
    reason: Browser started with remote debugging is the same technique without the headless/profile specifics.
  - id: 4f546cf4-15aa-4368-80f7-940e92bc551e
    name: Windows Chromium Browser with Custom User Data Directory
    reason: Chromium with custom user data directory points the browser at a copied victim profile.
  - id: 869ba261-c272-47d7-affe-5c0aa85c93d6
    name: Headless Browser Usage
    reason: Headless browser usage is the hidden-execution half of this behaviour.
  - id: 47147b5b-9e17-4d76-b8d2-7bac24c5ce1b
    name: Potential Browser Data Stealing
    reason: Browser data stealing via direct profile access is the infostealer-side confirmation.
  - id: 5a6e1e16-07de-48d8-8aae-faa766c05e88
    name: Potential Cookies Session Hijacking
    reason: Cookie session hijacking is the intended outcome of driving a debug session.
  - id: fc028194-969d-4122-8abe-0470d5b8f12f
    name: Access to Browser Login Data
    reason: Script access to browser Login Data confirms credential theft from the same profile.
  - id: 6a69f62d-ce75-4b57-8dce-6351eb55b362
    name: Esentutl Steals Browser Information
    reason: Esentutl copying locked browser databases is an alternative theft path used alongside.
  - id: 0e8cfe08-02c9-4815-a2f8-0d157b7ed33e
    name: File Download with Headless Browser
    reason: Headless browser file download shows the browser being abused for transfer.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Chromium started with remote debugging flags
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*\-\-[Rr][Ee][Mm][Oo][Tt][Ee]\-[Dd][Ee][Bb][Uu][Gg][Gg][Ii][Nn][Gg]\-[Pp][Oo][Rr][Tt].*/ OR data_win_eventdata_commandLine:/.*\-\-[Rr][Ee][Mm][Oo][Tt][Ee]\-[Dd][Ee][Bb][Uu][Gg][Gg][Ii][Nn][Gg]\-[Pp][Ii][Pp][Ee].*/ OR data_win_eventdata_commandLine:/.*\-\-[Rr][Ee][Mm][Oo][Tt][Ee]\-[Aa][Ll][Ll][Oo][Ww]\-[Oo][Rr][Ii][Gg][Ii][Nn][Ss].*/)
    pivot_on: host
    window: 4h
  - name: Access to browser credential and cookie stores
    query: (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*([Ll][Oo][Gg][Ii][Nn] [Dd][Aa][Tt][Aa]|[Cc][Oo][Oo][Kk][Ii][Ee][Ss]|[Ww][Ee][Bb] [Dd][Aa][Tt][Aa]|[Ll][Oo][Cc][Aa][Ll] [Ss][Tt][Aa][Tt][Ee]).*/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ll][Oo][Gg][Ii][Nn] [Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_commandLine:/.*\\[Cc][Oo][Oo][Kk][Ii][Ee][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ll][Oo][Cc][Aa][Ll] [Ss][Tt][Aa][Tt][Ee].*/))
    pivot_on: host
    window: 4h
  - name: Connections to debugging ports by non-browser processes
    query: data_win_system_eventID:"3" AND (data_win_eventdata_destinationPort:"9222" OR data_win_eventdata_destinationPort:"9223" OR data_win_eventdata_destinationPort:"9229") AND NOT data_win_eventdata_image:/.*\\([Cc][Hh][Rr][Oo][Mm][Ee]\.[Ee][Xx][Ee]|[Mm][Ss][Ee][Dd][Gg][Ee]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 4h
  - name: Browser profile copied to staging path
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Xx][Cc][Oo][Pp][Yy].*/ OR data_win_eventdata_commandLine:/.*[Rr][Oo][Bb][Oo][Cc][Oo][Pp][Yy].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Pp][Yy]\-[Ii][Tt][Ee][Mm].*/) AND (data_win_eventdata_commandLine:/.*[Uu][Ss][Ee][Rr] [Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_commandLine:/.*[Ll][Oo][Gg][Ii][Nn] [Dd][Aa][Tt][Aa].*/)
    pivot_on: host
    window: 4h
  - name: Headless browser launched by script interpreter
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|[Cc][Mm][Dd]\.[Ee][Xx][Ee]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|[Pp][Yy][Tt][Hh][Oo][Nn]\.[Ee][Xx][Ee]|[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*\-\-[Hh][Ee][Aa][Dd][Ll][Ee][Ss][Ss].*/)
    pivot_on: host
    window: 2h
