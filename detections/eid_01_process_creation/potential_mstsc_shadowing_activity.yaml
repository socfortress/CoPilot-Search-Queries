name: Potential MSTSC Shadowing Activity
id: 6ba5a05f-b095-4f0a-8654-b825f4f16334
version: 1
schema_version: "1.0"
date: "2023-02-05"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 6ba5a05f-b095-4f0a-8654-b825f4f16334
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects RDP session hijacking by using MSTSC shadowing. MITRE ATT&CK:
  T1563.002.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*noconsentprompt*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*shadow:*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*noconsentprompt*'; data_win_eventdata_commandLine matches '*shadow:*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/kmkz_security/status/1220694202301976576
  - https://github.com/kmkz/Pentesting/blob/47592e5e160d3b86c2024f09ef04ceb87d204995/Post-Exploitation-Cheat-Sheet
  - https://attack.mitre.org/techniques/T1563/002/

response:
  message: >
    Potential MSTSC Shadowing Activity detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1563.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1563.002
  custom_tags:
    - mstsc
    - shadowing
    - process_creation
    - sysmon
    - lateral_movement
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Nn][Oo][Cc][Oo][Nn][Ss][Ee][Nn][Tt][Pp][Rr][Oo][Mm][Pp][Tt].*/ AND data_win_eventdata_commandLine:/.*[Ss][Hh][Aa][Dd][Oo][Ww]:.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: ffa28e60-bdb1-46e0-9f82-05f7a61cc06e
    name: User Added to Remote Desktop Users Group
    reason: Attacker commonly grants RDP rights to an account just before shadowing a session.
  - id: 3f6b7b62-61aa-45db-96bd-9c31b36b653c
    name: RDP Sensitive Settings Changed
    reason: Shadowing requires the Terminal Services Shadow policy value, usually changed shortly before mstsc /shadow.
  - id: 224f140f-3553-4cd1-af78-13d81bf9f7cc
    name: Potential RDP Session Hijacking Activity
    reason: Sibling session takeover technique (tscon); both indicate hijack of another user's session on the same host.
  - id: f72aa3e8-49f9-4c7d-bd74-f8ab84ff9bbb
    name: Suspicious RDP Redirect Using TSCON
    reason: TSCON redirection is the alternative or follow-on method to take over a logged-in session.
  - id: 0d5675be-bc88-4172-86d3-1e96a4476536
    name: Potential Tampering With RDP Related Registry Keys Via Reg.EXE
    reason: reg.exe edits to Terminal Server keys (Shadow value) enable shadowing without consent.
  - id: 01aeb693-138d-49d2-9403-c4f52d7d3d62
    name: RDP Connection Allowed Via Netsh.EXE
    reason: Firewall opening for RDP often precedes remote shadow connections.
  - id: 1012f107-b8f1-4271-af30-5aed2de89b39
    name: Terminal Service Process Spawn
    reason: Processes spawned under the RDP service show what the attacker did inside the hijacked session.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Registry changes to Terminal Services Shadow policy
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND data_win_eventdata_targetObject:/.*[Tt]erminal [Ss]ervices.*[Ss]hadow.*/
    pivot_on: host
    window: 4h
  - name: RDP session tooling and manipulation
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Tt][Ss][Cc][Oo][Nn]\.[Ee][Xx][Ee]|[Mm][Ss][Tt][Ss][Cc]\.[Ee][Xx][Ee]|[Qq][Ww][Ii][Nn][Ss][Tt][Aa]\.[Ee][Xx][Ee]|[Qq][Uu][Ss][Ee][Rr]\.[Ee][Xx][Ee])/)
    pivot_on: host
    window: 4h
  - name: Remote Desktop Users group membership changes
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp].*/ AND data_win_eventdata_commandLine:/.*[Rr][Ee][Mm][Oo][Tt][Ee] [Dd][Ee][Ss][Kk][Tt][Oo][Pp] [Uu][Ss][Ee][Rr][Ss].*/
    pivot_on: host
    window: 24h
  - name: RDP firewall or port forwarding changes via netsh
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Nn][Ee][Tt][Ss][Hh]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*3389.*/ OR data_win_eventdata_commandLine:/.*[Pp][Oo][Rr][Tt][Pp][Rr][Oo][Xx][Yy].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Mm][Oo][Tt][Ee] [Dd][Ee][Ss][Kk][Tt][Oo][Pp].*/)
    pivot_on: host
    window: 24h
