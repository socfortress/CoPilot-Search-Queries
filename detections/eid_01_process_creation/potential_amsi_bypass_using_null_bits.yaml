name: Potential AMSI Bypass Using NULL Bits
id: 92a974db-ab84-457f-9ec0-55db83d7a825
version: 1
schema_version: "1.0"
date: "2023-05-09"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 92a974db-ab84-457f-9ec0-55db83d7a825
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects usage of special strings/null bits in order to potentially bypass AMSI
  functionalities. MITRE ATT&CK: T1685.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*if(0){{{0}}}' -f $(0 -as [char]) +*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*#<NULL>*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*if(0){{{0}}}' -f $(0 -as [char]) +*'; data_win_eventdata_commandLine matches
  '*#<NULL>*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/r00t-3xp10it/hacking-material-books/blob/43cb1e1932c16ff1f58b755bc9ab6b096046853f/obfuscation/simple_obfuscation.md#amsi-bypass-using-null-bits-satoshi
  - https://attack.mitre.org/techniques/T1685/

response:
  message: >
    Potential AMSI Bypass Using NULL Bits detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1685
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685
  custom_tags:
    - bypass
    - process_creation
    - sysmon
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ii][Ff]\(0\)\{\{\{0\}\}\}' -[Ff] \$\(0 -[Aa][Ss] \[[Cc][Hh][Aa][Rr]\]\) \+.*/ OR data_win_eventdata_commandLine:/.*\#\<[Nn][Uu][Ll][Ll]\>.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: fa2559c8-1197-471d-9cdd-05a0273d4522
    name: Potential AMSI Bypass Script Using NULL Bits
    reason: Same NULL-bit bypass seen in script block logging; shows the payload that followed.
  - id: 30edb182-aa75-42c0-b0a9-e998bb29067c
    name: Potential AMSI Bypass Via .NET Reflection
    reason: Alternative AMSI bypass frequently chained in the same loader.
  - id: a21e3484-c94d-11eb-b55b-acde48001122
    name: Unloading AMSI via Reflection
    reason: Another bypass technique used when one fails.
  - id: e0d6c087-2d1c-47fd-8799-3904103c5a98
    name: AMSI Bypass Pattern Assembly GetType
    reason: Reflection-based AmsiUtils patching often accompanies obfuscated one-liners.
  - id: ea9bf0fa-edec-4fb8-8b78-b119f2528186
    name: Windows Defender AMSI Trigger Detected
    reason: Defender AMSI hit on a payload the bypass failed to hide.
  - id: d7bcd677-645d-4691-a8d4-7a5602b780d1
    name: Potential PowerShell Command Line Obfuscation
    reason: Obfuscated command-line wrapper typically delivers the bypass.
  - id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
    name: PowerShell Download and Execution Cradles
    reason: Bypass is usually the prelude to downloading and running the real payload.
  - id: 17769c90-230e-488b-a463-e05c08e9d48f
    name: Powershell Defender Exclusion
    reason: Defense-evasion follow-on after AMSI is neutralised.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: AMSI bypass strings in script blocks
    query: data_win_system_eventID:4104 AND data_win_eventdata_scriptBlockText:/.*([Aa]msi[Uu]tils|amsiInitFailed|[Aa]msi[Cc]ontext|AmsiScanBuffer).*/
    pivot_on: host
    window: 2h
  - name: Download cradles
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*([Ii]nvoke-[Ww]eb[Rr]equest|[Dd]ownload[Ss]tring|[Ii]nvoke-[Ee]xpression|[Ii][Ee][Xx] ).*/
    pivot_on: host
    window: 2h
  - name: Defender configuration tampering
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*([Ss]et-[Mm]p[Pp]reference|[Aa]dd-[Mm]p[Pp]reference).*/
    pivot_on: host
    window: 2h
  - name: PowerShell outbound connections
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/
    pivot_on: host
    window: 2h
  - name: PowerShell child processes
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Pp]ower[Ss]hell.*/
    pivot_on: host
    window: 2h
