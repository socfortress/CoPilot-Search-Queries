name: Suspicious Registry Modification From ADS Via Regini.EXE
id: 77946e79-97f1-45a2-84b4-f37b5c0d8682
version: 1
schema_version: "1.0"
date: "2023-02-08"
author: Eli Salem, Sander Wiebing, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 77946e79-97f1-45a2-84b4-f37b5c0d8682
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the import of an alternate data stream with regini.exe, regini.exe can
  be used to modify registry keys. MITRE ATT&CK: T1112.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\regini.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "REGINI.EXE"
                    case_insensitive: true
            minimum_should_match: 1
        - regexp:
            data_win_eventdata_commandLine: ".*(:[^ \\\\]).*"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\regini.exe'; data_win_eventdata_originalFileName equals 'REGINI.EXE';
  data_win_eventdata_commandLine matches the regex /.*(:[^ \\]).*/.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://lolbas-project.github.io/lolbas/Binaries/Regini/
  - https://gist.github.com/api0cradle/cdd2d0d0ec9abb686f0e89306e277b8f
  - https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/regini
  - https://attack.mitre.org/techniques/T1112/

response:
  message: >
    Suspicious Registry Modification From ADS Via Regini.EXE detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1112
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
  custom_tags:
    - registry
    - regini
    - process_creation
    - sysmon
    - persistence
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Rr][Ee][Gg][Ii][Nn][Ii]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Rr][Ee][Gg][Ii][Nn][Ii]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*(:[^ \\]).*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 0b80ade5-6997-4b1d-99a1-71701778ea61
    name: Imports Registry Key From an ADS
    reason: Same ADS-hiding technique using reg.exe import; actors swap tools to evade detection.
  - id: 7f43c430-5001-4f8b-aaa9-c3b88f18fa5c
    name: Execute From Alternate Data Streams
    reason: Payloads hidden in an ADS are often also executed from it.
  - id: 73bba97f-a82d-42ce-b315-9182e76c57b1
    name: Imports Registry Key From a File
    reason: regini and reg import are interchangeable bulk registry modification methods.
  - id: de587dce-915e-4218-aac4-835ca6af6f70
    name: Potential Persistence Attempt Via Run Keys Using Reg.EXE
    reason: The hidden registry change often establishes persistence via Run keys.
  - id: 5e95028c-5229-4214-afae-d653d573d0ec
    name: Security Service Disabled Via Reg.EXE
    reason: Registry modification from an ADS can be used to disable security services.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Regini executions
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*\\regini\.exe/
    pivot_on: host
    window: 4h
  - name: Alternate data stream creation
    query: data_win_system_eventID:15
    pivot_on: host
    window: 4h
  - name: Registry sets in persistence or security keys
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:(/.*\\CurrentVersion\\Run.*/ OR /.*\\Services\\.*/ OR /.*[Ww]indows [Dd]efender.*/ OR /.*Image File Execution Options.*/)
    pivot_on: host
    window: 4h
  - name: Commands writing to alternate data streams
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*type .*>.*:[A-Za-z0-9_]+.*/ OR /.*[Ss]et-[Cc]ontent.*-[Ss]tream.*/ OR /.*echo .*>.*:[A-Za-z0-9_]+.*/)
    pivot_on: host
    window: 4h
