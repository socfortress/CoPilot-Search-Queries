name: Qakbot Rundll32 Exports Execution
id: 339ed3d6-5490-46d0-96a7-8abe33078f58
version: 1
schema_version: "1.0"
date: "2023-05-30"
author: X__Junior (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 339ed3d6-5490-46d0-96a7-8abe33078f58
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects specific process tree behavior of a "rundll32" execution with exports
  linked with Qakbot activity.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\cmd.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\cscript.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\curl.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\mshta.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\powershell.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\pwsh.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\wscript.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\rundll32.exe"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*:\\\\ProgramData\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*:\\\\Users\\\\Public\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\AppData\\\\Local\\\\Temp\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\AppData\\\\Roaming\\\\*"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*aslr"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*bind"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*DrawThemeIcon"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*GG10"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*GL70"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*jhbvygftr"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*kjhbhkjvydrt"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*LS88"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Motd"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*N115"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*next"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Nikn"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*print"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*qqqb"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*qqqq"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*RS32"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Test"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Time"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Updt"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*vips"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Wind"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*WW50"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*X555"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*XL55"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*xlAutoOpen"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*XS88"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\cmd.exe'; data_win_eventdata_parentImage matches '*\cscript.exe';
  data_win_eventdata_parentImage matches '*\curl.exe', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/pr0xylife/Qakbot/

response:
  message: >
    Qakbot Rundll32 Exports Execution detected on host $agent_name$. Matched
    data_win_eventdata_parentImage: $data_win_eventdata_parentImage$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$.
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - qakbot
    - rundll32
    - exports
    - process_creation
    - sysmon
    - execution
    - stealth
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/) AND data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_commandLine:/.*:\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Rr][Oo][Aa][Mm][Ii][Nn][Gg]\\.*/) AND (data_win_eventdata_commandLine:/.*[Aa][Ss][Ll][Rr]/ OR data_win_eventdata_commandLine:/.*[Bb][Ii][Nn][Dd]/ OR data_win_eventdata_commandLine:/.*[Dd][Rr][Aa][Ww][Tt][Hh][Ee][Mm][Ee][Ii][Cc][Oo][Nn]/ OR data_win_eventdata_commandLine:/.*[Gg][Gg]10/ OR data_win_eventdata_commandLine:/.*[Gg][Ll]70/ OR data_win_eventdata_commandLine:/.*[Jj][Hh][Bb][Vv][Yy][Gg][Ff][Tt][Rr]/ OR data_win_eventdata_commandLine:/.*[Kk][Jj][Hh][Bb][Hh][Kk][Jj][Vv][Yy][Dd][Rr][Tt]/ OR data_win_eventdata_commandLine:/.*[Ll][Ss]88/ OR data_win_eventdata_commandLine:/.*[Mm][Oo][Tt][Dd]/ OR data_win_eventdata_commandLine:/.*[Nn]115/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Xx][Tt]/ OR data_win_eventdata_commandLine:/.*[Nn][Ii][Kk][Nn]/ OR data_win_eventdata_commandLine:/.*[Pp][Rr][Ii][Nn][Tt]/ OR data_win_eventdata_commandLine:/.*[Qq][Qq][Qq][Bb]/ OR data_win_eventdata_commandLine:/.*[Qq][Qq][Qq][Qq]/ OR data_win_eventdata_commandLine:/.*[Rr][Ss]32/ OR data_win_eventdata_commandLine:/.*[Tt][Ee][Ss][Tt]/ OR data_win_eventdata_commandLine:/.*[Tt][Ii][Mm][Ee]/ OR data_win_eventdata_commandLine:/.*[Uu][Pp][Dd][Tt]/ OR data_win_eventdata_commandLine:/.*[Vv][Ii][Pp][Ss]/ OR data_win_eventdata_commandLine:/.*[Ww][Ii][Nn][Dd]/ OR data_win_eventdata_commandLine:/.*[Ww][Ww]50/ OR data_win_eventdata_commandLine:/.*[Xx]555/ OR data_win_eventdata_commandLine:/.*[Xx][Ll]55/ OR data_win_eventdata_commandLine:/.*[Xx][Ll][Aa][Uu][Tt][Oo][Oo][Pp][Ee][Nn]/ OR data_win_eventdata_commandLine:/.*[Xx][Ss]88/)

correlation:
  # Authored by the correlation engine for review.
  enrichment_searches:
  # Rule-specific telemetry pivots the engine runs around an alert from this rule,
  # scoped to the alert's host/user/IP within the window (behaviour-targeted, not a sweep).
    - name: "Other executions of this tool-set on this host (any arguments)"
      query: 'data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee])/'
      pivot_on: [host]
      window: 2h
    - name: "Follow-on LOLBin / signed-binary-proxy execution on this host"
      query: 'data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|\\[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Aa][Ss][Mm]\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Cc][Ss]\.[Ee][Xx][Ee]|\\[Mm][Ss][Bb][Uu][Ii][Ll][Dd]\.[Ee][Xx][Ee]|\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]|\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]|\\[Cc][Mm][Ss][Tt][Pp]\.[Ee][Xx][Ee]|\\[Oo][Dd][Bb][Cc][Cc][Oo][Nn][Ff]\.[Ee][Xx][Ee]|\\[Ff][Oo][Rr][Ff][Ii][Ll][Ee][Ss]\.[Ee][Xx][Ee]|\\[Pp][Cc][Aa][Ll][Uu][Aa]\.[Ee][Xx][Ee]|\\[Mm][Aa][Vv][Ii][Nn][Jj][Ee][Cc][Tt]\.[Ee][Xx][Ee]|\\[Ss][Cc][Rr][Ii][Pp][Tt][Rr][Uu][Nn][Nn][Ee][Rr]\.[Ee][Xx][Ee])/'
      pivot_on: [host]
      window: 1h
    - name: "Outbound connections by script interpreters on this host"
      query: 'data_win_system_eventID:"3" AND data_win_eventdata_image:/.*(\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]|\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]_[Ii][Ss][Ee]\.[Ee][Xx][Ee]|\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]|\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee])/'
      pivot_on: [host]
      window: 1h
