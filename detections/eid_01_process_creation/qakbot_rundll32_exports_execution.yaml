name: Qakbot Rundll32 Exports Execution
id: 339ed3d6-5490-46d0-96a7-8abe33078f58
version: 1
schema_version: "1.0"
date: "2023-05-30"
author: X__Junior (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 339ed3d6-5490-46d0-96a7-8abe33078f58
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects specific process tree behavior of a "rundll32" execution with exports
  linked with Qakbot activity.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\cmd.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\cscript.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\curl.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\mshta.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\powershell.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\pwsh.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\wscript.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\rundll32.exe"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*:\\\\ProgramData\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*:\\\\Users\\\\Public\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\AppData\\\\Local\\\\Temp\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\AppData\\\\Roaming\\\\*"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*aslr"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*bind"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*DrawThemeIcon"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*GG10"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*GL70"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*jhbvygftr"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*kjhbhkjvydrt"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*LS88"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Motd"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*N115"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*next"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Nikn"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*print"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*qqqb"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*qqqq"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*RS32"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Test"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Time"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Updt"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*vips"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Wind"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*WW50"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*X555"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*XL55"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*xlAutoOpen"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*XS88"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\cmd.exe'; data_win_eventdata_parentImage matches '*\cscript.exe';
  data_win_eventdata_parentImage matches '*\curl.exe', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/pr0xylife/Qakbot/

response:
  message: >
    Qakbot Rundll32 Exports Execution detected on host $agent_name$. Matched
    data_win_eventdata_parentImage: $data_win_eventdata_parentImage$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$.
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - qakbot
    - rundll32
    - exports
    - process_creation
    - sysmon
    - execution
    - stealth
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/) AND data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_commandLine:/.*:\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Rr][Oo][Aa][Mm][Ii][Nn][Gg]\\.*/) AND (data_win_eventdata_commandLine:/.*[Aa][Ss][Ll][Rr]/ OR data_win_eventdata_commandLine:/.*[Bb][Ii][Nn][Dd]/ OR data_win_eventdata_commandLine:/.*[Dd][Rr][Aa][Ww][Tt][Hh][Ee][Mm][Ee][Ii][Cc][Oo][Nn]/ OR data_win_eventdata_commandLine:/.*[Gg][Gg]10/ OR data_win_eventdata_commandLine:/.*[Gg][Ll]70/ OR data_win_eventdata_commandLine:/.*[Jj][Hh][Bb][Vv][Yy][Gg][Ff][Tt][Rr]/ OR data_win_eventdata_commandLine:/.*[Kk][Jj][Hh][Bb][Hh][Kk][Jj][Vv][Yy][Dd][Rr][Tt]/ OR data_win_eventdata_commandLine:/.*[Ll][Ss]88/ OR data_win_eventdata_commandLine:/.*[Mm][Oo][Tt][Dd]/ OR data_win_eventdata_commandLine:/.*[Nn]115/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Xx][Tt]/ OR data_win_eventdata_commandLine:/.*[Nn][Ii][Kk][Nn]/ OR data_win_eventdata_commandLine:/.*[Pp][Rr][Ii][Nn][Tt]/ OR data_win_eventdata_commandLine:/.*[Qq][Qq][Qq][Bb]/ OR data_win_eventdata_commandLine:/.*[Qq][Qq][Qq][Qq]/ OR data_win_eventdata_commandLine:/.*[Rr][Ss]32/ OR data_win_eventdata_commandLine:/.*[Tt][Ee][Ss][Tt]/ OR data_win_eventdata_commandLine:/.*[Tt][Ii][Mm][Ee]/ OR data_win_eventdata_commandLine:/.*[Uu][Pp][Dd][Tt]/ OR data_win_eventdata_commandLine:/.*[Vv][Ii][Pp][Ss]/ OR data_win_eventdata_commandLine:/.*[Ww][Ii][Nn][Dd]/ OR data_win_eventdata_commandLine:/.*[Ww][Ww]50/ OR data_win_eventdata_commandLine:/.*[Xx]555/ OR data_win_eventdata_commandLine:/.*[Xx][Ll]55/ OR data_win_eventdata_commandLine:/.*[Xx][Ll][Aa][Uu][Tt][Oo][Oo][Pp][Ee][Nn]/ OR data_win_eventdata_commandLine:/.*[Xx][Ss]88/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: cf879ffb-793a-4753-9a14-bc8f37cc90df
    name: Potential Qakbot Rundll32 Execution
    reason: 'Same loader technique: script host launches rundll32 on a dropped DLL from a user-writable path; one rule catches export names, the other the generic shape.'
  - id: bfd34392-c591-4009-b938-9fd985a28b85
    name: Qakbot Rundll32 Fake DLL Extension Execution
    reason: Qakbot campaigns alternate between named exports and DLLs disguised with non-.dll extensions; either variant confirms the same loader.
  - id: 0033cf83-fb87-446d-9cac-43d63ad4d5a9
    name: Qakbot Regsvr32 Calc Pattern
    reason: Alternate Qakbot execution path (regsvr32 on the same dropped payload) used by sibling campaigns.
  - id: cea72823-df4d-4567-950c-0b579eaf0846
    name: Potential Dropper Script Execution Via WScript/CScript/MSHTA
    reason: 'Precursor: the WSH/MSHTA dropper that wrote the DLL and spawned rundll32.'
  - id: 21dd6d38-2b18-4453-9404-a0fe4a0cc288
    name: Curl Download And Execute Combination
    reason: 'Precursor: curl is a listed parent here and is how Qakbot fetches its DLL before rundll32 runs it.'
  - id: 9b3af1e6-5b68-11eb-ae93-0242ac130002
    name: Detect MSHTA Url in Command Line
    reason: 'Precursor: mshta fetching a remote HTA/payload is a documented Qakbot delivery stage.'
  - id: de587dce-915e-4218-aac4-835ca6af6f70
    name: Potential Persistence Attempt Via Run Keys Using Reg.EXE
    reason: 'Follow-on: Qakbot persists via Run keys after the loader DLL runs.'
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Script host / curl spawning rundll32 or regsvr32 on a dropped payload
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee])/ AND data_win_eventdata_parentImage:/.*\\([Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]|[Cc][Mm][Dd]\.[Ee][Xx][Ee]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Rr][Oo][Aa][Mm][Ii][Nn][Gg]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/)
    pivot_on: host
    window: 2h
  - name: Download tooling run just before the loader (curl, mshta, bitsadmin, certutil)
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]|[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]|[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 2h
  - name: Qakbot-style discovery burst (whoami, net, nltest, arp, ipconfig)
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Ww][Hh][Oo][Aa][Mm][Ii]\.[Ee][Xx][Ee]|[Nn][Ee][Tt]\.[Ee][Xx][Ee]|[Nn][Ee][Tt]1\.[Ee][Xx][Ee]|[Nn][Ll][Tt][Ee][Ss][Tt]\.[Ee][Xx][Ee]|[Aa][Rr][Pp]\.[Ee][Xx][Ee]|[Ii][Pp][Cc][Oo][Nn][Ff][Ii][Gg]\.[Ee][Xx][Ee]|[Nn][Ss][Ll][Oo][Oo][Kk][Uu][Pp]\.[Ee][Xx][Ee]|[Nn][Ee][Tt][Ss][Tt][Aa][Tt]\.[Ee][Xx][Ee]|[Ss][Yy][Ss][Tt][Ee][Mm][Ii][Nn][Ff][Oo]\.[Ee][Xx][Ee]|[Rr][Oo][Uu][Tt][Ee]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 2h
  - name: Persistence set after loader run (Run keys, IFEO, Winlogon, scheduled task)
    query: (((data_win_system_eventID:"13" OR data_win_system_eventID:"12") AND (data_win_eventdata_targetObject:/.*\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/ OR data_win_eventdata_targetObject:/.*\\[Ii][Mm][Aa][Gg][Ee] [Ff][Ii][Ll][Ee] [Ee][Xx][Ee][Cc][Uu][Tt][Ii][Oo][Nn] [Oo][Pp][Tt][Ii][Oo][Nn][Ss]\\.*/ OR data_win_eventdata_targetObject:/.*\\[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]\\[Ss][Hh][Ee][Ll][Ll].*/ OR data_win_eventdata_targetObject:/.*\\[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]\\[Uu][Ss][Ee][Rr][Ii][Nn][Ii][Tt].*/)) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*\/[Cc][Rr][Ee][Aa][Tt][Ee].*/)))
    pivot_on: host
    window: 4h
  - name: Process injection into Windows binaries (wermgr, AtBroker, explorer, msra)
    query: data_win_system_eventID:"8" AND data_win_eventdata_targetImage:/.*\\([Ww][Ee][Rr][Mm][Gg][Rr]\.[Ee][Xx][Ee]|[Aa][Tt][Bb][Rr][Oo][Kk][Ee][Rr]\.[Ee][Xx][Ee]|[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\.[Ee][Xx][Ee]|[Mm][Ss][Rr][Aa]\.[Ee][Xx][Ee]|[Mm][Oo][Bb][Ss][Yy][Nn][Cc]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 2h
