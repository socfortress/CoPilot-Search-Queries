name: Wab Execution From Non Default Location
id: 395907ee-96e5-4666-af2e-2ca91688e151
version: 1
schema_version: "1.0"
date: "2022-09-27"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 395907ee-96e5-4666-af2e-2ca91688e151
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of wab.exe (Windows Contacts) and Wabmig.exe (Microsoft
  Address Book Import Tool) from non default locations as seen with bumblebee
  activity.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\wab.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\wabmig.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "C:\\\\Windows\\\\WinSxS\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "C:\\\\Program Files\\\\Windows Mail\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "C:\\\\Program Files (x86)\\\\Windows Mail\\\\*"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches '*\wab.exe';
  data_win_eventdata_image matches '*\wabmig.exe'; data_win_eventdata_image
  matches 'C:\Windows\WinSxS\*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://thedfirreport.com/2022/08/08/bumblebee-roasts-its-way-to-domain-admin/
  - https://symantec-enterprise-blogs.security.com/blogs/threat-intelligence/bumblebee-loader-cybercrime
  - https://thedfirreport.com/2022/09/26/bumblebee-round-two/

response:
  message: >
    Wab Execution From Non Default Location detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - default
    - location
    - process_creation
    - sysmon
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ww][Aa][Bb]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Aa][Bb][Mm][Ii][Gg]\.[Ee][Xx][Ee]/) AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ww][Ii][Nn][Ss][Xx][Ss]\\.*/ OR data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Mm][Aa][Ii][Ll]\\.*/ OR data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Mm][Aa][Ii][Ll]\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 63d1ccc0-2a43-4f4b-9289-361b308991ff
    name: Wab/Wabmig Unusual Parent Or Child Processes
    reason: Same binary pair; bumblebee-style wab.exe spawns or is spawned by unusual processes such as rundll32.
  - id: d4ca7c59-e9e4-42d8-bf57-91a776efcb87
    name: LOLBIN Execution From Abnormal Drive
    reason: Bumblebee delivery from mounted ISO/VHD drives runs copied LOLBins from those paths.
  - id: 2569ed8c-1147-498a-9b8c-2ad3656b10ed
    name: Potential Renamed Rundll32 Execution
    reason: Bumblebee loads its DLL via rundll32 or a sideloaded wab; renamed rundll32 is a close sibling.
  - id: 2bd8e100-5b3b-4b6a-bbb5-b129d3ddddc5
    name: IcedID Malware Suspicious Single Digit DLL Execution Via Rundll32
    reason: Loader-family cousin sharing delivery chains and follow-on rundll32 execution.
  - id: ae9c6a7c-9521-42a6-915e-5aaa8689d529
    name: CobaltStrike Load by Rundll32
    reason: Bumblebee commonly stages Cobalt Strike next.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Processes spawned by wab/wabmig
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\(wab|wabmig)\.exe/
    pivot_on: host
    window: 4h
  - name: Non-system DLLs loaded by wab
    query: data_win_system_eventID:"7" AND data_win_eventdata_image:/.*\\(wab|wabmig)\.exe/ AND NOT data_win_eventdata_imageLoaded:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\.*/
    pivot_on: host
    window: 4h
  - name: Network connections from wab
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\(wab|wabmig)\.exe/
    pivot_on: host
    window: 4h
  - name: Delivery artefact launches (ISO/LNK/VHD/ZIP)
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*\.([Ii][Ss][Oo]|[Ll][Nn][Kk]|[Vv][Hh][Dd]|[Zz][Ii][Pp]).*/
    pivot_on: host
    window: 4h
  - name: Hands-on recon commands typical after loader
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Nn][Ee][Tt]\s+[Gg][Rr][Oo][Uu][Pp]|[Nn][Ll][Tt][Ee][Ss][Tt]|[Ww][Hh][Oo][Aa][Mm][Ii]\s+\/[Aa][Ll][Ll]|[Aa][Dd][Ff][Ii][Nn][Dd]).*/
    pivot_on: host
    window: 6h
