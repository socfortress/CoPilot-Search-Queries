name: Insecure Transfer Via Curl.EXE
id: cb9cc1d1-e84e-4bdc-b7ad-c31b1b7908ec
version: 1
schema_version: "1.0"
date: "2023-06-30"
author: X__Junior (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: cb9cc1d1-e84e-4bdc-b7ad-c31b1b7908ec
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of "curl.exe" with the "--insecure" flag.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\curl.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "curl.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - regexp:
                  data_win_eventdata_commandLine: ".*([ ]-k[ ]).*"
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*--insecure*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\curl.exe'; data_win_eventdata_originalFileName equals 'curl.exe';
  data_win_eventdata_commandLine matches the regex /.*([ ]-k[ ]).*/, among other
  conditions.

known_false_positives: >
  Access to badly maintained internal or development systems. Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://curl.se/docs/manpage.html

response:
  message: >
    Insecure Transfer Via Curl.EXE detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  custom_tags:
    - insecure
    - transfer
    - process_creation
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*([ ]-k[ ]).*/ OR data_win_eventdata_commandLine:/.*--[Ii][Nn][Ss][Ee][Cc][Uu][Rr][Ee].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 2c1486f5-02e8-4f86-9099-b97f2da4ed77
    name: Insecure Proxy/DOH Transfer Via Curl.EXE
    reason: Sibling insecure-TLS flags on the proxy/DoH leg; both on one host indicates a deliberate certificate-free channel.
  - id: 9cc85849-3b02-4cb5-b371-3a1ff54f2218
    name: File Download From IP URL Via Curl.EXE
    reason: -k is needed because IP-literal servers have no valid certificate, so raw-IP downloads accompany it.
  - id: 5cb299fc-5fb1-4d07-b989-0644c68b6043
    name: Suspicious File Download From IP Via Curl.EXE
    reason: Download of executable content from a raw IP is the staging step --insecure enables.
  - id: 21dd6d38-2b18-4453-9404-a0fe4a0cc288
    name: Curl Download And Execute Combination
    reason: The fetched file is typically run immediately in the same command.
  - id: e218595b-bbe7-4ee5-8a96-f32a24ad3468
    name: Suspicious Curl.EXE Download
    reason: Curl dropping files into suspicious locations follows the insecure fetch.
  - id: windows-curl-download-suspicious-path-001
    name: Windows Curl Download to Suspicious Path
    reason: Confirms the insecure transfer wrote its payload into a staging directory.
  - id: 85de1f22-d189-44e4-8239-dc276b45379b
    name: Curl Web Request With Potential Custom User-Agent
    reason: Custom user-agents on curl indicate scripted C2/beaconing, often alongside TLS skipping.
  - id: 1d174d38-8fda-4081-a9b6-56d9763c0cd8
    name: Scheduled Task Creation with Curl and PowerShell Execution Combo
    reason: 'Persistence follow-on: a scheduled task that re-pulls via curl.'
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Curl outbound connections
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Files written by curl
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*\\[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Curl invoked by scripting or Office parents
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]/ AND data_win_eventdata_parentImage:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Mm][Ss][Hh][Tt][Aa]|[Ww][Ii][Nn][Ww][Oo][Rr][Dd]|[Ee][Xx][Cc][Ee][Ll])\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Executables launched from user-writable paths
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Aa][Pp][Pp][Dd][Aa][Tt][Aa]|[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]|[Tt][Ee][Mm][Pp]|[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa])\\.*/
    pivot_on: host
    window: 2h
  - name: Scheduled task creation after transfer
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*\/[Cc][Rr][Ee][Aa][Tt][Ee].*/
    pivot_on: host
    window: 6h
