name: InfDefaultInstall.exe .inf Execution
id: ce7cf472-6fcc-490a-9481-3786840b5d9b
version: 1
schema_version: "1.0"
date: "2022-10-09"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: ce7cf472-6fcc-490a-9481-3786840b5d9b
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Executes SCT script using scrobj.dll from a command in entered into a
  specially prepared INF file. MITRE ATT&CK: T1218.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*InfDefaultInstall.exe *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*.inf*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*InfDefaultInstall.exe *'; data_win_eventdata_commandLine matches '*.inf*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1218/T1218.md#atomic-test-4---infdefaultinstallexe-inf-execution
  - https://lolbas-project.github.io/lolbas/Binaries/Infdefaultinstall/
  - https://attack.mitre.org/techniques/T1218/

response:
  message: >
    InfDefaultInstall.exe .inf Execution detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1218
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218
  custom_tags:
    - infdefaultinstall
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Ii][Nn][Ff][Dd][Ee][Ff][Aa][Uu][Ll][Tt][Ii][Nn][Ss][Tt][Aa][Ll][Ll]\.[Ee][Xx][Ee] .*/ AND data_win_eventdata_commandLine:/.*\.[Ii][Nn][Ff].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 285b85b1-a555-4095-8652-a8a4106af63f
    name: Suspicious Rundll32 Setupapi.dll Activity
    reason: Rundll32 setupapi.dll INF install is the equivalent INF-driven proxy execution
  - id: a1473adb-5338-4a20-b4c3-126763e2d3d3
    name: Suspicious Advpack Call Via Rundll32.EXE
    reason: Advpack rundll32 calls execute INF sections; same technique family
  - id: 7d4cdc5a-0076-40ca-aac8-f7e714570e47
    name: CMSTP Execution Process Creation
    reason: CMSTP also executes attacker INF files and is a common alternative
  - id: d4ca7c59-e9e4-42d8-bf57-91a776efcb87
    name: LOLBIN Execution From Abnormal Drive
    reason: LOLBin run from abnormal drive can show the staged INF/payload origin
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: INF-driven installers
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*(InfDefaultInstall|cmstp|rundll32)\.exe/ AND data_win_eventdata_commandLine:/.*\.[Ii][Nn][Ff].*/
    pivot_on: host
    window: 4h
  - name: INF file creation
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\.[Ii][Nn][Ff]/
    pivot_on: host
    window: 6h
  - name: Persistence registry writes after install
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*(CurrentVersion\\Run|RunOnce|Services\\).*/
    pivot_on: host
    window: 4h
  - name: Children of InfDefaultInstall/rundll32/cmstp
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*(InfDefaultInstall|cmstp|rundll32)\.exe/
    pivot_on: host
    window: 2h
