name: Renamed FTP.EXE Execution
id: 277a4393-446c-449a-b0ed-7fdc7795244c
version: 1
schema_version: "1.0"
date: "2023-02-03"
author: Victor Sergeev, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 277a4393-446c-449a-b0ed-7fdc7795244c
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of a renamed "ftp.exe" binary based on the PE metadata
  fields. MITRE ATT&CK: T1059, T1202.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - term:
            data_win_eventdata_originalFileName:
              value: "ftp.exe"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\ftp.exe"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_originalFileName
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_originalFileName equals
  'ftp.exe'; data_win_eventdata_image matches '*\ftp.exe'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://lolbas-project.github.io/lolbas/Binaries/Ftp/
  - https://attack.mitre.org/techniques/T1059/
  - https://attack.mitre.org/techniques/T1202/

response:
  message: >
    Renamed FTP.EXE Execution detected on host $agent_name$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1059, T1202
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_originalFileName
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059
    - T1202
  custom_tags:
    - renamed
    - process_creation
    - sysmon
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_originalFileName:/[Ff][Tt][Pp]\.[Ee][Xx][Ee]/ AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/.*\\[Ff][Tt][Pp]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 06b401f4-107c-4ff9-947f-9ec1e7649f1e
    name: Potential Arbitrary Command Execution Via FTP.EXE
    reason: ftp -s script files can run arbitrary commands; the same abuse under the real name.
  - id: a85ffc3a-e8fd-4040-93bf-78aff284d801
    name: Use Of The SFTP.EXE Binary As A LOLBIN
    reason: Sibling file-transfer binary abused the same way for proxy execution.
  - id: 762bb580-79b4-40f4-8b9e-9349ce1710f4
    name: Indirect Command Execution via SFTP ProxyCommand
    reason: Related transfer-client command execution technique.
  - id: 7d1aaf3d-4304-425c-b7c3-162055e0b3ab
    name: Potential Data Exfiltration Activity Via CommandLine Tools
    reason: Command-line exfil is the usual purpose of a disguised ftp client.
  - id: 85a8e5ba-bd03-4bfb-bbfa-a4409a8f8b98
    name: Folder Compress To Potentially Suspicious Output Via Compress-Archive Cmdlet
    reason: Data is staged and archived before FTP upload.
  - id: e37db05d-d1f9-49c8-b464-cee1a4b11638
    name: PUA - Rclone Execution
    reason: Alternative exfil tool commonly seen in the same intrusions.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: ftp script or inline command usage
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*( -s:| -s | -A |open |mput ).*/
    pivot_on: host
    window: 4h
  - name: FTP/SFTP connections on port 21/22
    query: data_win_system_eventID:3 AND data_win_eventdata_destinationPort:(21 OR 22 OR 990)
    pivot_on: host
    window: 4h
  - name: Archive creation before transfer
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\.(zip|rar|7z|tar|gz|cab)$/
    pivot_on: host
    window: 6h
  - name: Staging utilities collecting data
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(Compress-Archive|rar(\.exe)? +a|7z(\.exe)? +a|robocopy|xcopy).*/
    pivot_on: host
    window: 6h
  - name: ftp script file written
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*(ftp|script|cmds?)\.(txt|ftp|scr)$/
    pivot_on: host
    window: 2h
