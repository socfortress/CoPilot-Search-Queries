name: Detection of Tools Built by NirSoft
id: detection-of-tools-built-by-nirsoft-001
version: 1
schema_version: "1.0"
date: "2026-04-20"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  Detects the execution of tools built by NirSoft by identifying specific command-line
  arguments such as "/stext" and "/scomma" in Sysmon EventID 1 (Process Creation) logs.
  NirSoft tools are legitimate utilities that recover credentials and system information
  from Windows hosts, but are commonly abused by attackers and malware families such as
  Emotet, Azorult, and commodity infostealers to dump cached credentials from web
  browsers, email clients, wireless profiles, and other local credential stores. The
  "/stext" flag dumps output to plain text while "/scomma" dumps to CSV — both are
  exfiltration-friendly formats used during credential access and reconnaissance
  stages. If confirmed malicious, this activity could indicate credential theft, data
  staging for exfiltration, or system reconnaissance by an adversary.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine: "* /stext *"
              - wildcard:
                  data_win_eventdata_commandLine: "* /scomma *"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_parentCommandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    type: datetime
    default: "now-24h"
  END_TIME:
    type: datetime
    default: "now"

how_to_implement: >
  Requires Sysmon EventID 1 with full command-line logging enabled. The
  Microsoft-Windows-Sysmon/Operational channel must be forwarded by the Wazuh agent
  via the ossec.conf localfile configuration.

known_false_positives: >
  Administrators, IT support staff, and forensic analysts may occasionally run
  NirSoft utilities for legitimate password recovery, audit, or troubleshooting
  purposes. Other software using the same switch naming convention (/stext,
  /scomma) could also trigger this detection. Verify the tool was used for a
  legitimate purpose by an authorized user and investigate the parent process
  and user context.

references:
  - https://attack.mitre.org/techniques/T1072/
  - https://www.nirsoft.net/
  - https://attack.mitre.org/software/S0349/

response:
  message: >
    NirSoft-style tool execution detected on $agent_name$.
    Process: $data_win_eventdata_image$.
    OriginalFileName: $data_win_eventdata_originalFileName$.
    CommandLine: $data_win_eventdata_commandLine$.
    Parent: $data_win_eventdata_parentImage$.
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1072
  risk_score: 40
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 40
    - field: data_win_eventdata_user
      type: user
      score: 40
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  analytic_story:
    - Emotet Malware DHS Report TA18-201A
    - Azorult
    - Suspicious Command-Line Executions
  asset_type: Endpoint
  mitre_attack_id:
    - T1072
  custom_tags:
    - nirsoft
    - credential_access
    - credential_dumping
    - infostealer
    - reconnaissance
    - lolbin
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.* \/stext .*/ OR data_win_eventdata_commandLine:/.* \/scomma .*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d0dae994-26c6-4d2d-83b5-b3c8b79ae513
    name: PUA - WebBrowserPassView Execution
    reason: WebBrowserPassView is the most abused NirSoft tool and the very same browser credential theft.
  - id: 8ba484e8-4b97-11ec-b19a-acde48001122
    name: Possible Browser Pass View Parameter
    reason: Browser Pass View parameters show the same stealer invocation pattern.
  - id: 47147b5b-9e17-4d76-b8d2-7bac24c5ce1b
    name: Potential Browser Data Stealing
    reason: Direct reads of browser credential stores corroborate browser data theft.
  - id: 87a476dc-0079-4583-a985-dee7a20a03de
    name: Enumeration for 3rd Party Creds From CLI
    reason: Third-party credential enumeration from CLI is the broader credential hunt that NirSoft tools serve.
  - id: 42b1a5b8-353f-4f10-b256-39de4467faff
    name: Harvesting Of Wifi Credentials Via Netsh.EXE
    reason: Wifi credential harvesting is a typical sibling of NirSoft WirelessKeyView-style use.
  - id: e0b0c2ab-3d52-46d9-8cb7-049dc775fbd1
    name: Enumeration for Credentials in Registry
    reason: Registry credential hunting commonly accompanies password-recovery tools.
  - id: 6a69f62d-ce75-4b57-8dce-6351eb55b362
    name: Esentutl Steals Browser Information
    reason: esentutl copying browser databases is an alternative route to the same data.
  - id: 9fbf5927-5261-4284-a71d-f681029ea574
    name: Compress Data and Lock With Password for Exfiltration With 7-ZIP
    reason: Dumped /stext output is commonly compressed with a password before exfiltration.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Output files from /stext /scomma dumps (txt/csv) written by the tool
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*([Pp]ass|[Cc]red|[Ww]ifi|[Mm]ail|[Bb]rowser|[Dd]ump|[Oo]utput).*\.([Tt][Xx][Tt]|[Cc][Ss][Vv]|[Hh][Tt][Mm][Ll]?)/
    pivot_on: host
    window: 6h
  - name: Known NirSoft credential recovery tool binaries
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Ww][Ee][Bb][Bb][Rr][Oo][Ww][Ss][Ee][Rr][Pp][Aa][Ss][Ss][Vv][Ii][Ee][Ww]\.[Ee][Xx][Ee]|\\[Mm][Aa][Ii][Ll][Pp][Vv]\.[Ee][Xx][Ee]|\\[Ww][Ii][Rr][Ee][Ll][Ee][Ss][Ss][Kk][Ee][Yy][Vv][Ii][Ee][Ww]\.[Ee][Xx][Ee]|\\[Cc][Hh][Rr][Oo][Mm][Ee][Pp][Aa][Ss][Ss]\.[Ee][Xx][Ee]|\\[Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd][Ff][Oo][Xx]\.[Ee][Xx][Ee]|\\[Nn][Ee][Tt][Pp][Aa][Ss][Ss]\.[Ee][Xx][Ee]|\\[Vv][Aa][Uu][Ll][Tt][Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd][Vv][Ii][Ee][Ww]\.[Ee][Xx][Ee]|\\[Mm][Ss][Pp][Aa][Ss][Ss]\.[Ee][Xx][Ee]|\\[Dd][Ii][Aa][Ll][Uu][Pp][Aa][Ss][Ss]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 6h
  - name: Direct access to browser credential stores
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(Login Data|Cookies|Web Data|logins\.json|key4\.db|signons).*/
    pivot_on: host
    window: 6h
  - name: Archive and exfiltration of harvested credential dumps
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\7[Zz]\.[Ee][Xx][Ee]|\\[Rr][Aa][Rr]\.[Ee][Xx][Ee]|\\[Ww][Ii][Nn][Rr][Aa][Rr]\.[Ee][Xx][Ee]|\\[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]|\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*.[Zz][Ii][Pp].*/ OR data_win_eventdata_commandLine:/.*.7[Zz].*/ OR data_win_eventdata_commandLine:/.*.[Rr][Aa][Rr].*/ OR data_win_eventdata_commandLine:/.*-[Pp].*/ OR data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp].*/)
    pivot_on: host
    window: 6h
  - name: Downloaders dropping the tool
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]|\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]|\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*[Nn][Ii][Rr][Ss][Oo][Ff][Tt].*/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Uu][Rr][Ll][Cc][Aa][Cc][Hh][Ee].*/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/)
    pivot_on: host
    window: 4h
