name: Renamed NirCmd.EXE Execution
id: 264982dc-dbad-4dce-b707-1e0d3e0f73d9
version: 1
schema_version: "1.0"
date: "2024-03-11"
author: X__Junior (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 264982dc-dbad-4dce-b707-1e0d3e0f73d9
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of a renamed "NirCmd.exe" binary based on the PE
  metadata fields. MITRE ATT&CK: T1059, T1202.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - term:
            data_win_eventdata_originalFileName:
              value: "NirCmd.exe"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\nircmd.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\nircmdc.exe"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_originalFileName
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_originalFileName equals
  'NirCmd.exe'; data_win_eventdata_image matches '*\nircmd.exe';
  data_win_eventdata_image matches '*\nircmdc.exe'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.microsoft.com/en-us/security/blog/2024/01/17/new-ttps-observed-in-mint-sandstorm-campaign-targeting-high-profile-individuals-at-universities-and-research-orgs/
  - https://www.nirsoft.net/utils/nircmd.html
  - https://attack.mitre.org/techniques/T1059/
  - https://attack.mitre.org/techniques/T1202/

response:
  message: >
    Renamed NirCmd.EXE Execution detected on host $agent_name$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1059, T1202
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_originalFileName
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059
    - T1202
  custom_tags:
    - renamed
    - nircmd
    - process_creation
    - sysmon
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_originalFileName:/[Nn][Ii][Rr][Cc][Mm][Dd]\.[Ee][Xx][Ee]/ AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/.*\\[Nn][Ii][Rr][Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Nn][Ii][Rr][Cc][Mm][Dd][Cc]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 4e2ed651-1906-4a59-a78a-18220fca1b22
    name: PUA - NirCmd Execution
    reason: Unrenamed NirCmd on the same host shows the operator also used the tool under its real name.
  - id: d9047477-0359-48c9-b8c7-792cedcdc9c4
    name: PUA - NirCmd Execution As LOCAL SYSTEM
    reason: NirCmd run as SYSTEM is the privileged use that follows renamed staging.
  - id: fdfcbd78-48f1-4a4b-90ac-d82241e368c5
    name: PsExec Service Execution
    reason: NirCmd is commonly launched through PsExec-style SYSTEM services.
  - id: 17769c90-230e-488b-a463-e05c08e9d48f
    name: Powershell Defender Exclusion
    reason: Operators using NirCmd to run hidden commands often blind Defender first.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: NirCmd command verbs
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ee]xec2?\s+(hide|show).*/ OR /.*[Ee]levate[Ss]ystem.*/ OR /.*[Ss]vc\s+(stop|start).*/ OR /.*[Ss]endkey.*/ OR /.*[Ss]hortcut.*/)
    pivot_on: host
    window: 4h
  - name: SYSTEM-context shells and LOLBins
    query: data_win_system_eventID:1 AND data_win_eventdata_user:/.*SYSTEM/ AND data_win_eventdata_image:/.*\\(cmd|powershell|rundll32|regsvr32|mshta)\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 4h
  - name: Security service tampering
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ss]c(\.exe)?\s+(stop|config|delete).*(WinDefend|Sense|MpsSvc|wscsvc).*/ OR /.*[Nn]et\s+stop.*/ OR /.*[Ss]et-[Mm]p[Pp]reference.*/)
    pivot_on: host
    window: 4h
  - name: Tool staging in user-writable paths
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(/.*[Nn]ir[Cc]md.*/ OR /.*\\[Pp]rogram[Dd]ata\\.*\.exe/ OR /.*\\[Pp]ublic\\.*\.exe/)
    pivot_on: host
    window: 4h
  - name: Remote execution tooling alongside
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Pp][Ss][Ee]xec.*/ OR /.*[Pp][Aa][Ee]xec.*/ OR /.*[Ww]mic.*\/node.*/)
    pivot_on: host
    window: 4h
