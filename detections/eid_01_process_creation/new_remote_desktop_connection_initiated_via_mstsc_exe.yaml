name: New Remote Desktop Connection Initiated Via Mstsc.EXE
id: 954f0af7-62dd-418f-b3df-a84bc2c7a774
version: 1
schema_version: "1.0"
date: "2024-06-04"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 954f0af7-62dd-418f-b3df-a84bc2c7a774
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the usage of "mstsc.exe" with the "/v" flag to initiate a connection
  to a remote server. Adversaries may use valid accounts to log into a computer
  using the Remote Desktop Protocol (RDP). The adversary may then perform
  actions as the logged-on user. MITRE ATT&CK: T1021.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\mstsc.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "mstsc.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -v:*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /v:*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* –v:*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* —v:*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* ―v:*"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_parentImage"
        - exists:
            field: "data_win_eventdata_commandLine"
        - bool:
            must_not:
              - bool:
                  must:
                    - term:
                        data_win_eventdata_parentImage:
                          value: "C:\\Windows\\System32\\lxss\\wslhost.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*C:\\\\ProgramData\\\\Microsoft\\\\WSL\\\\wslg.rdp*"
                          case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\mstsc.exe'; data_win_eventdata_originalFileName equals 'mstsc.exe';
  data_win_eventdata_commandLine matches '* -v:*', among other conditions.

known_false_positives: >
  WSL (Windows Sub System For Linux). Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1021.001/T1021.001.md#t1021001---remote-desktop-protocol
  - https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/mstsc
  - https://attack.mitre.org/techniques/T1021/001/

response:
  message: >
    New Remote Desktop Connection Initiated Via Mstsc.EXE detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1021.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1021.001
  custom_tags:
    - desktop
    - connection
    - initiated
    - process_creation
    - sysmon
    - lateral_movement
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Mm][Ss][Tt][Ss][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Mm][Ss][Tt][Ss][Cc]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.* -[Vv]:.*/ OR data_win_eventdata_commandLine:/.* \/[Vv]:.*/ OR data_win_eventdata_commandLine:/.* –[Vv]:.*/ OR data_win_eventdata_commandLine:/.* —[Vv]:.*/ OR data_win_eventdata_commandLine:/.* ―[Vv]:.*/) AND _exists_:data_win_eventdata_parentImage AND _exists_:data_win_eventdata_commandLine AND NOT (data_win_eventdata_parentImage:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ll][Xx][Ss][Ss]\\[Ww][Ss][Ll][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ss][Ll]\\[Ww][Ss][Ll][Gg]\.[Rr][Dd][Pp].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b1ec66c6-f4d1-4b5c-96dd-af28ccae7727
    name: New Generic Credentials Added Via Cmdkey.EXE
    reason: cmdkey commonly stores the credential used by this mstsc /v connection
  - id: ff3b6b39-e765-42f9-bb2c-ea6761e0e0f6
    name: Mstsc.EXE Execution From Uncommon Parent
    reason: mstsc launched by a suspicious parent confirms scripted lateral movement
  - id: 6e22722b-dfb1-4508-a911-49ac840b40f8
    name: Suspicious Mstsc.EXE Execution With Local RDP File
    reason: alternate mstsc launch using a prepared .rdp file
  - id: 6ba5a05f-b095-4f0a-8654-b825f4f16334
    name: Potential MSTSC Shadowing Activity
    reason: mstsc /shadow follows to observe sessions on the target
  - id: f38ce0b9-5e97-4b47-a211-7dc8d8b871da
    name: Potential RDP Tunneling Via Plink
    reason: RDP connection through an SSH tunnel to localhost
  - id: 322ed9ec-fcab-4f67-9a34-e7c6aef43614
    name: New Port Forwarding Rule Added Via Netsh.EXE
    reason: portproxy used to relay the RDP hop
  - id: 07f8bdc2-c9b3-472a-9817-5a670b872f53
    name: Potential Reconnaissance For Cached Credentials Via Cmdkey.EXE
    reason: credential discovery before choosing RDP targets
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Outbound RDP network connections
    query: data_win_system_eventID:3 AND data_win_eventdata_destinationPort:3389 AND data_win_eventdata_initiated:true
    pivot_on: host
    window: 2h
  - name: Credential staging before RDP
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(*cmdkey* OR *vaultcmd* OR *net*use*)
    pivot_on: host
    window: 2h
  - name: RDP files created
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\.rdp/
    pivot_on: user
    window: 24h
  - name: Interactive RDP logons by the user
    query: data_win_system_eventID:4624 AND data_win_eventdata_logonType:(10 OR 7)
    pivot_on: user
    window: 4h
