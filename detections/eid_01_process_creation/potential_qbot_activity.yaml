name: Potential QBot Activity
id: 4fcac6eb-0287-4090-8eea-2602e4c20040
version: 1
schema_version: "1.0"
date: "2023-02-03"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 4fcac6eb-0287-4090-8eea-2602e4c20040
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: production
type: TTP

description: >
  Detects potential QBot activity by looking for process executions used
  previously by QBot. MITRE ATT&CK: T1059.005.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_parentImage:
                          value: "*\\\\WinRAR.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\wscript.exe"
                          case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /c ping.exe -n 6 127.0.0.1 & type *"
                    case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*regsvr32.exe*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*C:\\\\ProgramData*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*.tmp*"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\WinRAR.exe'; data_win_eventdata_image matches '*\wscript.exe';
  data_win_eventdata_commandLine matches '* /c ping.exe -n 6 127.0.0.1 & type
  *', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/killamjr/status/1179034907932315648
  - https://app.any.run/tasks/2e0647b7-eb86-4f72-904b-d2d0ecac07d1/
  - https://attack.mitre.org/techniques/T1059/005/

response:
  message: >
    Potential QBot Activity detected on host $agent_name$. Matched
    data_win_eventdata_parentImage: $data_win_eventdata_parentImage$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1059.005
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.005
  custom_tags:
    - process_creation
    - sysmon
    - execution
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND ((data_win_eventdata_parentImage:/.*\\[Ww][Ii][Nn][Rr][Aa][Rr]\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/) OR data_win_eventdata_commandLine:/.* \/[Cc] [Pp][Ii][Nn][Gg]\.[Ee][Xx][Ee] -[Nn] 6 127\.0\.0\.1 \& [Tt][Yy][Pp][Ee] .*/ OR (data_win_eventdata_commandLine:/.*[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee].*/ AND data_win_eventdata_commandLine:/.*[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa].*/ AND data_win_eventdata_commandLine:/.*\.[Tt][Mm][Pp].*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: cf879ffb-793a-4753-9a14-bc8f37cc90df
    name: Potential Qakbot Rundll32 Execution
    reason: Generic Qakbot rundll32 loader tree; typically the next stage after the script/regsvr32 step.
  - id: 339ed3d6-5490-46d0-96a7-8abe33078f58
    name: Qakbot Rundll32 Exports Execution
    reason: Qakbot rundll32 export names, a family-specific confirmation of the DLL load.
  - id: 0033cf83-fb87-446d-9cac-43d63ad4d5a9
    name: Qakbot Regsvr32 Calc Pattern
    reason: Qakbot regsvr32 calc pattern; same loader family using regsvr32.
  - id: 146aace8-9bd6-42ba-be7a-0070d8027b76
    name: Potentially Suspicious Child Process Of WinRAR.EXE
    reason: 'WinRAR spawning script interpreters/shells: the archive-based delivery the first branch covers.'
  - id: ded2b07a-d12f-4284-9b76-653e37b6c8b0
    name: Potentially Suspicious Ping/Copy Command Combination
    reason: Ping/copy self-delete trick matching the ping-then-type branch; Qakbot cleanup idiom.
  - id: b6676963-0353-4f88-90f5-36c20d443c6a
    name: Cscript/Wscript Potentially Suspicious Child Process
    reason: wscript/cscript spawning suspicious children; the script stage of the chain.
  - id: 9525dc73-0327-438c-8c04-13c0e037e9da
    name: Regsvr32 Execution From Potential Suspicious Location
    reason: regsvr32 run from a suspicious location, as in the ProgramData .tmp branch.
  - id: bc309b7a-3c29-4937-a4a3-e232473f9168
    name: Qakbot Uninstaller Execution
    reason: Qakbot uninstaller/cleanup execution on the same host.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Archiver child script or shell
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:(*[Ww]in[Rr][Aa][Rr].exe OR *7z*.exe) AND data_win_eventdata_image:(*[Ww]script.exe OR *[Cc]script.exe OR *cmd.exe OR *[Pp]ower[Ss]hell.exe)
    pivot_on: host
    window: 2h
  - name: Ping-delay and self-delete cmd chains
    query: data_win_system_eventID:1 AND data_win_eventdata_image:*cmd.exe AND data_win_eventdata_commandLine:*ping*127.0.0.1* AND data_win_eventdata_commandLine:(*type* OR *del* OR *copy*)
    pivot_on: host
    window: 2h
  - name: regsvr32/rundll32 loading tmp or dll from ProgramData
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(*[Rr]egsvr32* OR *[Rr]undll32*) AND data_win_eventdata_commandLine:(*ProgramData* OR *.tmp* OR *AppData*)
    pivot_on: host
    window: 2h
  - name: Loader drops in ProgramData or Temp
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(*ProgramData*.tmp OR *ProgramData*.dll OR *Temp*.js OR *Temp*.vbs)
    pivot_on: host
    window: 2h
  - name: Outbound beaconing from injection-target processes
    query: data_win_system_eventID:3 AND data_win_eventdata_image:(*[Ww]ermgr.exe OR *[Ee]xplorer.exe OR *[Rr]undll32.exe OR *[Rr]egsvr32.exe) AND data_win_eventdata_initiated:true
    pivot_on: host
    window: 4h
