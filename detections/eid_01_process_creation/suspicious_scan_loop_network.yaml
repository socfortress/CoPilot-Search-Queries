name: Suspicious Scan Loop Network
id: f8ad2e2c-40b6-4117-84d7-20b89896ab23
version: 1
schema_version: "1.0"
date: "2022-03-12"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: f8ad2e2c-40b6-4117-84d7-20b89896ab23
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Adversaries may attempt to get a listing of other systems by IP address,
  hostname, or other logical identifier on a network that may be used for
  Lateral Movement from the current system. MITRE ATT&CK: T1059, T1018.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*for *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*foreach *"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*nslookup*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*ping*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches '*for
  *'; data_win_eventdata_commandLine matches '*foreach *';
  data_win_eventdata_commandLine matches '*nslookup*', among other conditions.

known_false_positives: >
  Legitimate script. Baseline expected activity in your environment and tune
  this detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1018/T1018.md
  - https://ss64.com/nt/for.html
  - https://ss64.com/ps/foreach-object.html
  - https://attack.mitre.org/techniques/T1059/
  - https://attack.mitre.org/techniques/T1018/

response:
  message: >
    Suspicious Scan Loop Network detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1059,
    T1018
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059
    - T1018
  custom_tags:
    - network
    - process_creation
    - sysmon
    - execution
    - discovery
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ff][Oo][Rr] .*/ OR data_win_eventdata_commandLine:/.*[Ff][Oo][Rr][Ee][Aa][Cc][Hh] .*/) AND (data_win_eventdata_commandLine:/.*[Nn][Ss][Ll][Oo][Oo][Kk][Uu][Pp].*/ OR data_win_eventdata_commandLine:/.*[Pp][Ii][Nn][Gg].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e6313acd-208c-44fc-a0ff-db85d572e90e
    name: Network Reconnaissance Activity
    reason: Command-line network recon (net/arp/ipconfig) typically accompanies or follows ping-sweep loops.
  - id: 41243735-89a7-4c83-bcdd-570aa78f00a1
    name: Domain Controller Discovery with Nltest
    reason: Domain controller discovery is the next target-finding step after a host sweep.
  - id: c3e05466-5f22-11eb-ae93-0242ac130002
    name: NLTest Domain Trust Discovery
    reason: Domain trust discovery follows initial internal reconnaissance.
  - id: bef37fa2-f205-4a7b-b484-0759bfd5f86f
    name: PUA - Advanced IP Scanner Execution
    reason: Advanced IP Scanner is the GUI alternative operators use for the same sweep.
  - id: 54773c5f-f1cc-4703-9126-2f797d96a69d
    name: PUA - Advanced Port Scanner Execution
    reason: Advanced Port Scanner commonly follows host discovery to find open services.
  - id: af688c76-4ce4-4309-bfdd-e896f01acf27
    name: Grixba Malware Reconnaissance Activity
    reason: Grixba ransomware precursor reconnaissance performs the same internal discovery.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other discovery tools run on the same host
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Nn][Ee][Tt]\.[Ee][Xx][Ee]|[Nn][Ee][Tt]1\.[Ee][Xx][Ee]|[Nn][Ll][Tt][Ee][Ss][Tt]\.[Ee][Xx][Ee]|[Aa][Rr][Pp]\.[Ee][Xx][Ee]|[Nn][Bb][Tt][Ss][Tt][Aa][Tt]\.[Ee][Xx][Ee]|[Nn][Ee][Tt][Ss][Tt][Aa][Tt]\.[Ee][Xx][Ee]|[Ii][Pp][Cc][Oo][Nn][Ff][Ii][Gg]\.[Ee][Xx][Ee]|[Dd][Ss][Qq][Uu][Ee][Rr][Yy]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 2h
  - name: Repeated ping/nslookup executions
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Pp][Ii][Nn][Gg]\.[Ee][Xx][Ee]|[Nn][Ss][Ll][Oo][Oo][Kk][Uu][Pp]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 1h
  - name: Outbound SMB/RDP/WinRM/RPC connections to many peers
    query: data_win_system_eventID:"3" AND (data_win_eventdata_destinationPort:"445" OR data_win_eventdata_destinationPort:"3389" OR data_win_eventdata_destinationPort:"5985" OR data_win_eventdata_destinationPort:"135")
    pivot_on: host
    window: 2h
  - name: Remote execution tools used after discovery
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Pp][Ss][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]|[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]\.[Ee][Xx][Ee]|[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]|[Ww][Ii][Nn][Rr][Ss]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 4h
