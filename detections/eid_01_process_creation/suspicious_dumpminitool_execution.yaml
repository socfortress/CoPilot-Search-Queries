name: Suspicious DumpMinitool Execution
id: eb1c4225-1c23-4241-8dd4-051389fde4ce
version: 1
schema_version: "1.0"
date: "2023-04-12"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: eb1c4225-1c23-4241-8dd4-051389fde4ce
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious ways to use the "DumpMinitool.exe" binary. MITRE ATT&CK:
  T1036, T1003.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\DumpMinitool.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\DumpMinitool.x86.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\DumpMinitool.arm64.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "DumpMinitool.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "DumpMinitool.x86.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "DumpMinitool.arm64.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - bool:
                  must:
                    - exists:
                        field: "data_win_eventdata_image"
                    - bool:
                        must_not:
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*\\\\Microsoft Visual Studio\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*\\\\Extensions\\\\*"
                                      case_insensitive: true
                              minimum_should_match: 1
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.txt*"
                    case_insensitive: true
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* Full*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* Mini*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* WithHeap*"
                                case_insensitive: true
                        minimum_should_match: 1
                    - exists:
                        field: "data_win_eventdata_commandLine"
                    - bool:
                        must_not:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*--dumpType*"
                                case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\DumpMinitool.exe'; data_win_eventdata_image matches
  '*\DumpMinitool.x86.exe'; data_win_eventdata_image matches
  '*\DumpMinitool.arm64.exe', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/mrd0x/status/1511415432888131586
  - https://twitter.com/mrd0x/status/1511489821247684615
  - https://lolbas-project.github.io/lolbas/OtherMSBinaries/DumpMinitool/
  - https://attack.mitre.org/techniques/T1036/
  - https://attack.mitre.org/techniques/T1003/001/

response:
  message: >
    Suspicious DumpMinitool Execution detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1036, T1003.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1036
    - T1003.001
  custom_tags:
    - dumpminitool
    - process_creation
    - sysmon
    - credential_access
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Dd][Uu][Mm][Pp][Mm][Ii][Nn][Ii][Tt][Oo][Oo][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Dd][Uu][Mm][Pp][Mm][Ii][Nn][Ii][Tt][Oo][Oo][Ll]\.[Xx]86\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Dd][Uu][Mm][Pp][Mm][Ii][Nn][Ii][Tt][Oo][Oo][Ll]\.[Aa][Rr][Mm]64\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Dd][Uu][Mm][Pp][Mm][Ii][Nn][Ii][Tt][Oo][Oo][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Dd][Uu][Mm][Pp][Mm][Ii][Nn][Ii][Tt][Oo][Oo][Ll]\.[Xx]86\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Dd][Uu][Mm][Pp][Mm][Ii][Nn][Ii][Tt][Oo][Oo][Ll]\.[Aa][Rr][Mm]64\.[Ee][Xx][Ee]/) AND ((_exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt] [Vv][Ii][Ss][Uu][Aa][Ll] [Ss][Tt][Uu][Dd][Ii][Oo]\\.*/ OR data_win_eventdata_image:/.*\\[Ee][Xx][Tt][Ee][Nn][Ss][Ii][Oo][Nn][Ss]\\.*/)) OR data_win_eventdata_commandLine:/.*\.[Tt][Xx][Tt].*/ OR ((data_win_eventdata_commandLine:/.* [Ff][Uu][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.* [Mm][Ii][Nn][Ii].*/ OR data_win_eventdata_commandLine:/.* [Ww][Ii][Tt][Hh][Hh][Ee][Aa][Pp].*/) AND _exists_:data_win_eventdata_commandLine AND NOT (data_win_eventdata_commandLine:/.*--[Dd][Uu][Mm][Pp][Tt][Yy][Pp][Ee].*/)))

