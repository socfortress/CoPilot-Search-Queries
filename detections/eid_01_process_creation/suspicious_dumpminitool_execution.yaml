name: Suspicious DumpMinitool Execution
id: eb1c4225-1c23-4241-8dd4-051389fde4ce
version: 1
schema_version: "1.0"
date: "2023-04-12"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: eb1c4225-1c23-4241-8dd4-051389fde4ce
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious ways to use the "DumpMinitool.exe" binary. MITRE ATT&CK:
  T1036, T1003.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\DumpMinitool.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\DumpMinitool.x86.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\DumpMinitool.arm64.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "DumpMinitool.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "DumpMinitool.x86.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "DumpMinitool.arm64.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - bool:
                  must:
                    - exists:
                        field: "data_win_eventdata_image"
                    - bool:
                        must_not:
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*\\\\Microsoft Visual Studio\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*\\\\Extensions\\\\*"
                                      case_insensitive: true
                              minimum_should_match: 1
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.txt*"
                    case_insensitive: true
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* Full*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* Mini*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* WithHeap*"
                                case_insensitive: true
                        minimum_should_match: 1
                    - exists:
                        field: "data_win_eventdata_commandLine"
                    - bool:
                        must_not:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*--dumpType*"
                                case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\DumpMinitool.exe'; data_win_eventdata_image matches
  '*\DumpMinitool.x86.exe'; data_win_eventdata_image matches
  '*\DumpMinitool.arm64.exe', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/mrd0x/status/1511415432888131586
  - https://twitter.com/mrd0x/status/1511489821247684615
  - https://lolbas-project.github.io/lolbas/OtherMSBinaries/DumpMinitool/
  - https://attack.mitre.org/techniques/T1036/
  - https://attack.mitre.org/techniques/T1003/001/

response:
  message: >
    Suspicious DumpMinitool Execution detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1036, T1003.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1036
    - T1003.001
  custom_tags:
    - dumpminitool
    - process_creation
    - sysmon
    - credential_access
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Dd][Uu][Mm][Pp][Mm][Ii][Nn][Ii][Tt][Oo][Oo][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Dd][Uu][Mm][Pp][Mm][Ii][Nn][Ii][Tt][Oo][Oo][Ll]\.[Xx]86\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Dd][Uu][Mm][Pp][Mm][Ii][Nn][Ii][Tt][Oo][Oo][Ll]\.[Aa][Rr][Mm]64\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Dd][Uu][Mm][Pp][Mm][Ii][Nn][Ii][Tt][Oo][Oo][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Dd][Uu][Mm][Pp][Mm][Ii][Nn][Ii][Tt][Oo][Oo][Ll]\.[Xx]86\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Dd][Uu][Mm][Pp][Mm][Ii][Nn][Ii][Tt][Oo][Oo][Ll]\.[Aa][Rr][Mm]64\.[Ee][Xx][Ee]/) AND ((_exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt] [Vv][Ii][Ss][Uu][Aa][Ll] [Ss][Tt][Uu][Dd][Ii][Oo]\\.*/ OR data_win_eventdata_image:/.*\\[Ee][Xx][Tt][Ee][Nn][Ss][Ii][Oo][Nn][Ss]\\.*/)) OR data_win_eventdata_commandLine:/.*\.[Tt][Xx][Tt].*/ OR ((data_win_eventdata_commandLine:/.* [Ff][Uu][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.* [Mm][Ii][Nn][Ii].*/ OR data_win_eventdata_commandLine:/.* [Ww][Ii][Tt][Hh][Hh][Ee][Aa][Pp].*/) AND _exists_:data_win_eventdata_commandLine AND NOT (data_win_eventdata_commandLine:/.*--[Dd][Uu][Mm][Pp][Tt][Yy][Pp][Ee].*/)))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: dee0a7a3-f200-4112-a99b-952196d81e42
    name: DumpMinitool Execution
    reason: Sibling rule on the same binary; legitimate Visual Studio use vs abuse
  - id: a18dd26b-6450-46de-8c91-9659150cf088
    name: Potentially Suspicious GrantedAccess Flags On LSASS
    reason: If DumpMinitool targets LSASS, process access shows the handle rights used
  - id: 5ef9853e-4d0e-4a70-846f-a9ca37d876da
    name: Potential Credential Dumping Activity Via LSASS
    reason: Direct evidence of the LSASS access DumpMinitool would produce
  - id: a5a2d357-1ab8-4675-a967-ef9990a59391
    name: LSASS Process Memory Dump Files
    reason: 'Follow-on: the dump file written to disk'
  - id: aba15bdd-657f-422a-bab3-ac2d2a0d6f1c
    name: Potentially Suspicious DMP/HDMP File Creation
    reason: Dump output file created by the tool
  - id: ec570e53-4c76-45a9-804d-dc3f355ff7a7
    name: 7Zip Compressing Dump Files
    reason: 'Staging: dumps are compressed before exfiltration'
  - id: 515c8be5-e5df-4c5e-8f6d-a4a2f05e4b48
    name: CreateDump Process Dump
    reason: Alternative signed .NET dumping binary used for the same purpose
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: LSASS process access events
    query: data_win_system_eventID:10 AND data_win_eventdata_targetImage:/.*[Ll]sass\.exe/
    pivot_on: host
    window: 1h
  - name: Dump files created
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(/.*\.dmp/ OR /.*\.dump/ OR /.*\.mdmp/ OR /.*\.hdmp/)
    pivot_on: host
    window: 2h
  - name: Archive or copy of dumps
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*\.dmp.*/ OR /.*\.dump.*/) AND data_win_eventdata_commandLine:(/.*\.zip.*/ OR /.*\.7z.*/ OR /.*[Cc]opy.*/ OR /.*[Cc]url.*/ OR /.*[Cc]ompress.*/)
    pivot_on: host
    window: 4h
  - name: Other dumping tools
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Pp]rocdump.*/ OR /.*comsvcs.*[Mm]ini[Dd]ump.*/ OR /.*[Ss]qldumper.*/ OR /.*[Cc]reate[Dd]ump.*/)
    pivot_on: host
    window: 2h
