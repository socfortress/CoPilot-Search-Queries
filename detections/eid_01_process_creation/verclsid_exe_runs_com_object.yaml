name: Verclsid.exe Runs COM Object
id: d06be4b9-8045-428b-a567-740a26d9db25
version: 1
schema_version: "1.0"
date: "2025-10-07"
author: Victor Sergeev, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: d06be4b9-8045-428b-a567-740a26d9db25
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects when verclsid.exe is used to run COM object via GUID. MITRE ATT&CK:
  T1218.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\verclsid.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "verclsid.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*/S*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*/C*"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_parentImage"
        - exists:
            field: "data_win_eventdata_commandLine"
        - bool:
            must_not:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_parentImage:
                          value: "*C:\\\\Windows\\\\System32\\\\RuntimeBroker.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*verclsid.exe\" /S /C {*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*} /I {*"
                          case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\verclsid.exe'; data_win_eventdata_originalFileName equals 'verclsid.exe';
  data_win_eventdata_commandLine matches '*/S*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://lolbas-project.github.io/lolbas/Binaries/Verclsid/
  - https://gist.github.com/NickTyrer/0598b60112eaafe6d07789f7964290d5
  - https://bohops.com/2018/08/18/abusing-the-com-registry-structure-part-2-loading-techniques-for-evasion-and-persistence/
  - https://attack.mitre.org/techniques/T1218/

response:
  message: >
    Verclsid.exe Runs COM Object detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1218
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218
  custom_tags:
    - verclsid
    - object
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Vv][Ee][Rr][Cc][Ll][Ss][Ii][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Vv][Ee][Rr][Cc][Ll][Ss][Ii][Dd]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*\/[Ss].*/ AND data_win_eventdata_commandLine:/.*\/[Cc].*/ AND _exists_:data_win_eventdata_parentImage AND _exists_:data_win_eventdata_commandLine AND NOT (data_win_eventdata_parentImage:/.*[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Rr][Uu][Nn][Tt][Ii][Mm][Ee][Bb][Rr][Oo][Kk][Ee][Rr]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Vv][Ee][Rr][Cc][Ll][Ss][Ii][Dd]\.[Ee][Xx][Ee]\" \/[Ss] \/[Cc] \{.*/ AND data_win_eventdata_commandLine:/.*\} \/[Ii] \{.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 53d4bb30-3f36-4e8a-b078-69d36c4a79ff
    name: COM Object Execution via Xwizard.EXE
    reason: 'Same pattern: a signed binary instantiates an arbitrary COM object by GUID for proxy execution.'
  - id: f1edd233-30b5-4823-9e6a-c4171b24d316
    name: Rundll32 Registered COM Objects
    reason: Another route to load registered COM servers via a LOLBin.
  - id: 4b60e6f2-bf39-47b4-b4ea-398e33cfe253
    name: CMSTP UAC Bypass via COM Object Access
    reason: COM object abuse for execution/elevation; co-occurrence suggests COM-based tradecraft.
  - id: dc64d064-d346-11eb-8588-acde48001122
    name: Execute Javascript With Jscript COM CLSID
    reason: Script-engine COM CLSID used to run script, a common payload registered behind a verclsid GUID.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: COM server registration (InprocServer32/LocalServer32)
    query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*[Cc][Ll][Ss][Ii][Dd]\\.*[Ii][Nn][Pp][Rr][Oo][Cc][Ss][Ee][Rr][Vv][Ee][Rr]32.*/ OR data_win_eventdata_targetObject:/.*[Cc][Ll][Ss][Ii][Dd]\\.*[Ll][Oo][Cc][Aa][Ll][Ss][Ee][Rr][Vv][Ee][Rr]32.*/)
    pivot_on: host
    window: 24h
  - name: Children of verclsid
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Vv][Ee][Rr][Cc][Ll][Ss][Ii][Dd]\.[Ee][Xx][Ee].*/
    pivot_on: host
    window: 2h
  - name: DLLs loaded by verclsid from writable paths
    query: data_win_system_eventID:"7" AND data_win_eventdata_image:/.*[Vv][Ee][Rr][Cc][Ll][Ss][Ii][Dd]\.[Ee][Xx][Ee].*/ AND data_win_eventdata_imageLoaded:/.*(\\[Uu][Ss][Ee][Rr][Ss]\\|\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\|\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\|\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\).*/
    pivot_on: host
    window: 2h
  - name: Network from verclsid
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Vv][Ee][Rr][Cc][Ll][Ss][Ii][Dd]\.[Ee][Xx][Ee].*/
    pivot_on: host
    window: 2h
  - name: Scriptlet COM loaders
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]|[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee])/ AND data_win_eventdata_commandLine:/.*[Ss][Cc][Rr][Oo][Bb][Jj].*/
    pivot_on: host
    window: 4h
