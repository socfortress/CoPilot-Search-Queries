name: Suspicious Diantz Alternate Data Stream Execution
id: 6b369ced-4b1d-48f1-b427-fdc0de0790bd
version: 1
schema_version: "1.0"
date: "2022-12-31"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 6b369ced-4b1d-48f1-b427-fdc0de0790bd
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Compress target file into a cab file stored in the Alternate Data Stream (ADS)
  of the target file. MITRE ATT&CK: T1564.004.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*diantz.exe*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*.cab*"
              case_insensitive: true
        - regexp:
            data_win_eventdata_commandLine: ".*(:[^\\\\]).*"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*diantz.exe*'; data_win_eventdata_commandLine matches '*.cab*';
  data_win_eventdata_commandLine matches the regex /.*(:[^\\]).*/.

known_false_positives: >
  Very Possible. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://lolbas-project.github.io/lolbas/Binaries/Diantz/
  - https://attack.mitre.org/techniques/T1564/004/

response:
  message: >
    Suspicious Diantz Alternate Data Stream Execution detected on host
    $agent_name$. Matched data_win_eventdata_commandLine:
    $data_win_eventdata_commandLine$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1564.004
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1564.004
  custom_tags:
    - diantz
    - alternate
    - stream
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Dd][Ii][Aa][Nn][Tt][Zz]\.[Ee][Xx][Ee].*/ AND data_win_eventdata_commandLine:/.*\.[Cc][Aa][Bb].*/ AND data_win_eventdata_commandLine:/.*(:[^\\]).*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7f43c430-5001-4f8b-aaa9-c3b88f18fa5c
    name: Execute From Alternate Data Streams
    reason: A payload hidden in an ADS is typically read, extracted or executed from that stream next.
  - id: b69888d4-380c-45ce-9cf9-d9ce46e67821
    name: Hidden Executable In NTFS Alternate Data Stream
    reason: Sysmon 15 confirms an executable was actually written into an ADS.
  - id: 0b80ade5-6997-4b1d-99a1-71701778ea61
    name: Imports Registry Key From an ADS
    reason: Sibling ADS-hiding technique used by the same operators to stage data.
  - id: 185d7418-f250-42d0-b72e-0c8b70661e93
    name: Suspicious Diantz Download and Compress Into a CAB File
    reason: Other diantz abuse variant; the same actor may also fetch remote files with diantz.
  - id: 9f107a84-532c-41af-b005-8d12a607639f
    name: Potentially Suspicious Cabinet File Expansion
    reason: The cab hidden in the stream must be expanded to recover the payload.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Cab extraction via expand/extrac32/wusa
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Ee][Xx][Pp][Aa][Nn][Dd]\.[Ee][Xx][Ee]|[Ee][Xx][Tt][Rr][Aa][Cc]32\.[Ee][Xx][Ee]|[Ww][Uu][Ss][Aa]\.[Ee][Xx][Ee])/) AND (data_win_eventdata_commandLine:/.*\.[Cc][Aa][Bb].*/)
    pivot_on: host
    window: 4h
  - name: ADS read via type/more/cmd syntax
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Tt][Yy][Pp][Ee] .*/ OR data_win_eventdata_commandLine:/.*[Mm][Oo][Rr][Ee] <.*/ OR data_win_eventdata_commandLine:/.*[Mm][Oo][Rr][Ee]<.*/) AND (data_win_eventdata_commandLine:/.*\.[Tt][Xx][Tt]:.*/ OR data_win_eventdata_commandLine:/.*\.[Dd][Ll][Ll]:.*/ OR data_win_eventdata_commandLine:/.*\.[Ee][Xx][Ee]:.*/ OR data_win_eventdata_commandLine:/.*\.[Cc][Aa][Bb]:.*/ OR data_win_eventdata_commandLine:/.*\.[Ll][Oo][Gg]:.*/)
    pivot_on: host
    window: 4h
  - name: New alternate data streams created
    query: data_win_system_eventID:"15" AND (data_win_eventdata_targetFilename:/.*\.[Tt][Xx][Tt]:.*/ OR data_win_eventdata_targetFilename:/.*\.[Ll][Oo][Gg]:.*/ OR data_win_eventdata_targetFilename:/.*\.[Dd][Ll][Ll]:.*/ OR data_win_eventdata_targetFilename:/.*\.[Ee][Xx][Ee]:.*/ OR data_win_eventdata_targetFilename:/.*\.[Cc][Aa][Bb]:.*/)
    pivot_on: host
    window: 2h
  - name: Processes launched from ADS paths
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\.[Tt][Xx][Tt]:.*/ OR data_win_eventdata_image:/.*\.[Ll][Oo][Gg]:.*/ OR data_win_eventdata_image:/.*\.[Dd][Aa][Tt]:.*/ OR data_win_eventdata_image:/.*\.[Ee][Xx][Ee]:.*/)
    pivot_on: host
    window: 4h
  - name: diantz/makecab activity
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Dd][Ii][Aa][Nn][Tt][Zz]\.[Ee][Xx][Ee]|[Mm][Aa][Kk][Ee][Cc][Aa][Bb]\.[Ee][Xx][Ee])/)
    pivot_on: host
    window: 4h
