name: Potentially Suspicious Desktop Background Change Using Reg.EXE
id: 8cbc9475-8d05-4e27-9c32-df960716c701
version: 1
schema_version: "1.0"
date: "2023-12-21"
author: Stephen Lincoln @slincoln-aiq (AttackIQ)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 8cbc9475-8d05-4e27-9c32-df960716c701
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of "reg.exe" to alter registry keys that would replace
  the user's desktop background. This is a common technique used by malware to
  change the desktop background to a ransom note or other image. MITRE ATT&CK:
  T1112, T1491.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\reg.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "reg.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*add*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Control Panel\\\\Desktop*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*CurrentVersion\\\\Policies\\\\ActiveDesktop*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*CurrentVersion\\\\Policies\\\\System*"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*/v NoChangingWallpaper*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*/d 1*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*/v Wallpaper*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*/t REG_SZ*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*/v WallpaperStyle*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*/d 2*"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches '*\reg.exe';
  data_win_eventdata_originalFileName equals 'reg.exe';
  data_win_eventdata_commandLine matches '*add*', among other conditions.

known_false_positives: >
  Administrative scripts that change the desktop background to a company logo or
  other image. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.attackiq.com/2023/09/20/emulating-rhysida/
  - https://research.checkpoint.com/2023/the-rhysida-ransomware-activity-analysis-and-ties-to-vice-society/
  - https://www.trendmicro.com/en_us/research/23/h/an-overview-of-the-new-rhysida-ransomware.html
  - https://www.virustotal.com/gui/file/a864282fea5a536510ae86c77ce46f7827687783628e4f2ceb5bf2c41b8cd3c6/behavior
  - https://admx.help/?Category=Windows_10_2016&Policy=Microsoft.Policies.WindowsDesktop::Wallpaper
  - https://admx.help/?Category=Windows_10_2016&Policy=Microsoft.Policies.ControlPanelDisplay::CPL_Personalization_NoDesktopBackgroundUI
  - https://attack.mitre.org/techniques/T1112/
  - https://attack.mitre.org/techniques/T1491/001/

response:
  message: >
    Potentially Suspicious Desktop Background Change Using Reg.EXE detected on
    host $agent_name$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1112, T1491.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
    - T1491.001
  custom_tags:
    - desktop
    - background
    - change
    - process_creation
    - sysmon
    - persistence
    - impact
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Rr][Ee][Gg]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Rr][Ee][Gg]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Aa][Dd][Dd].*/ AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Nn][Tt][Rr][Oo][Ll] [Pp][Aa][Nn][Ee][Ll]\\[Dd][Ee][Ss][Kk][Tt][Oo][Pp].*/ OR data_win_eventdata_commandLine:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Pp][Oo][Ll][Ii][Cc][Ii][Ee][Ss]\\[Aa][Cc][Tt][Ii][Vv][Ee][Dd][Ee][Ss][Kk][Tt][Oo][Pp].*/ OR data_win_eventdata_commandLine:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Pp][Oo][Ll][Ii][Cc][Ii][Ee][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm].*/) AND ((data_win_eventdata_commandLine:/.*\/[Vv] [Nn][Oo][Cc][Hh][Aa][Nn][Gg][Ii][Nn][Gg][Ww][Aa][Ll][Ll][Pp][Aa][Pp][Ee][Rr].*/ AND data_win_eventdata_commandLine:/.*\/[Dd] 1.*/) OR (data_win_eventdata_commandLine:/.*\/[Vv] [Ww][Aa][Ll][Ll][Pp][Aa][Pp][Ee][Rr].*/ AND data_win_eventdata_commandLine:/.*\/[Tt] [Rr][Ee][Gg]_[Ss][Zz].*/) OR (data_win_eventdata_commandLine:/.*\/[Vv] [Ww][Aa][Ll][Ll][Pp][Aa][Pp][Ee][Rr][Ss][Tt][Yy][Ll][Ee].*/ AND data_win_eventdata_commandLine:/.*\/[Dd] 2.*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c9fbe8e9-119d-40a6-9b59-dd58a5d84429
    name: Potential Ransomware or Unauthorized MBR Tampering Via Bcdedit.EXE
    reason: Disabling recovery with bcdedit precedes encryption; wallpaper defacement follows at the end.
  - id: 21ff4ca9-f13a-41ad-b828-0077b2af2e40
    name: Deletion of Volume Shadow Copies via WMI with PowerShell
    reason: Shadow-copy deletion is the standard pre-encryption step before the ransom wallpaper is set.
  - id: 965fff6c-1d7e-4e25-91fd-cdccd75f7d2c
    name: DarkSide Ransomware Pattern
    reason: Ransomware family pattern that, together with a wallpaper change, confirms impact-phase activity.
  - id: 689308fc-cfba-4f72-9897-796c1dc61487
    name: Potential Conti Ransomware Activity
    reason: Conti-style encryption chain co-occurs with ransom-note defacement.
  - id: c37510b8-2107-4b78-aa32-72f251e7a844
    name: Potential Ryuk Ransomware Activity
    reason: Ryuk behaviour immediately preceding the ransom wallpaper step.
  - id: 999e8307-a775-4d5f-addc-4855632335be
    name: Potential BlackByte Ransomware Activity
    reason: BlackByte is known to change the wallpaper after encryption.
  - id: de587dce-915e-4218-aac4-835ca6af6f70
    name: Potential Persistence Attempt Via Run Keys Using Reg.EXE
    reason: Same reg.exe tooling is used for persistence earlier in the intrusion.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Shadow copy deletion and recovery disabling
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*[Dd][Ee][Ll][Ee][Tt][Ee]|[Ss][Hh][Aa][Dd][Oo][Ww][Cc][Oo][Pp][Yy]|[Bb][Cc][Dd][Ee][Dd][Ii][Tt].*[Rr][Ee][Cc][Oo][Vv][Ee][Rr][Yy]|[Bb][Cc][Dd][Ee][Dd][Ii][Tt].*[Ii][Gg][Nn][Oo][Rr][Ee][Aa][Ll][Ll][Ff][Aa][Ii][Ll][Uu][Rr][Ee][Ss]|[Ww][Bb][Aa][Dd][Mm][Ii][Nn].*[Dd][Ee][Ll][Ee][Tt][Ee]).*/
    pivot_on: host
    window: 6h
  - name: Ransom note files created
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*([Rr][Ee][Aa][Dd][Mm][Ee]|[Rr][Ee][Cc][Oo][Vv][Ee][Rr]|[Dd][Ee][Cc][Rr][Yy][Pp][Tt]|[Rr][Aa][Nn][Ss][Oo][Mm]|[Rr][Ee][Ss][Tt][Oo][Rr][Ee]).*\.(txt|html|hta)/
    pivot_on: host
    window: 6h
  - name: Security tooling and service stops
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee]|[Nn][Ee][Tt] [Ss][Tt][Oo][Pp]|[Tt][Aa][Ss][Kk][Kk][Ii][Ll][Ll]|[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Aa][Nn][Tt][Ii][Ss][Pp][Yy][Ww][Aa][Rr][Ee]|[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll].*[Cc][Ll]).*/
    pivot_on: host
    window: 6h
  - name: Wallpaper and policy registry tampering
    query: (data_win_system_eventID:"13" OR data_win_system_eventID:"12") AND data_win_eventdata_targetObject:/.*([Pp][Oo][Ll][Ii][Cc][Ii][Ee][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]|[Cc][Oo][Nn][Tt][Rr][Oo][Ll] [Pp][Aa][Nn][Ee][Ll]\\[Dd][Ee][Ss][Kk][Tt][Oo][Pp]|[Aa][Cc][Tt][Ii][Vv][Ee][Dd][Ee][Ss][Kk][Tt][Oo][Pp]|[Ww][Aa][Ll][Ll][Pp][Aa][Pp][Ee][Rr]).*/
    pivot_on: host
    window: 6h
  - name: Lateral deployment via PsExec or admin shares
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Pp][Ss][Ee][Xx][Ee][Cc]|\\\\.*\\[Aa][Dd][Mm][Ii][Nn]\$|\\\\.*\\[Cc]\$).*/
    pivot_on: host
    window: 6h
