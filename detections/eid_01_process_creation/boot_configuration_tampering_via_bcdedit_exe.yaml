name: Boot Configuration Tampering Via Bcdedit.EXE
id: 1444443e-6757-43e4-9ea4-c8fc705f79a2
version: 1
schema_version: "1.0"
date: "2023-02-15"
author: E.M. Anhaus (originally from Atomic Blue Detections, Endgame), oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 1444443e-6757-43e4-9ea4-c8fc705f79a2
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: production
type: TTP

description: >
  Detects the use of the bcdedit command to tamper with the boot configuration
  data. This technique is often times used by malware or attackers as a
  destructive way before launching ransomware. MITRE ATT&CK: T1490.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\bcdedit.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "bcdedit.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*set*"
              case_insensitive: true
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*bootstatuspolicy*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*ignoreallfailures*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*recoveryenabled*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*no*"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\bcdedit.exe'; data_win_eventdata_originalFileName equals 'bcdedit.exe';
  data_win_eventdata_commandLine matches '*set*', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1490/T1490.md
  - https://eqllib.readthedocs.io/en/latest/analytics/c4732632-9c1d-4980-9fa8-1d98c93f918e.html
  - https://attack.mitre.org/techniques/T1490/

response:
  message: >
    Boot Configuration Tampering Via Bcdedit.EXE detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1490
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1490
  custom_tags:
    - configuration
    - tampering
    - bcdedit
    - process_creation
    - sysmon
    - impact
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Bb][Cc][Dd][Ee][Dd][Ii][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Bb][Cc][Dd][Ee][Dd][Ii][Tt]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Ss][Ee][Tt].*/ AND ((data_win_eventdata_commandLine:/.*[Bb][Oo][Oo][Tt][Ss][Tt][Aa][Tt][Uu][Ss][Pp][Oo][Ll][Ii][Cc][Yy].*/ AND data_win_eventdata_commandLine:/.*[Ii][Gg][Nn][Oo][Rr][Ee][Aa][Ll][Ll][Ff][Aa][Ii][Ll][Uu][Rr][Ee][Ss].*/) OR (data_win_eventdata_commandLine:/.*[Rr][Ee][Cc][Oo][Vv][Ee][Rr][Yy][Ee][Nn][Aa][Bb][Ll][Ee][Dd].*/ AND data_win_eventdata_commandLine:/.*[Nn][Oo].*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: Shadow copy deletion is the standard companion step to bcdedit recovery disabling before encryption.
  - id: 639c9081-f482-47d3-a0bd-ddee3d4ecd76
    name: All Backups Deleted Via Wbadmin.EXE
    reason: wbadmin backup/catalog deletion removes restore options alongside boot recovery tampering.
  - id: dee4af55-1f22-4e1d-a9d2-4bdc7ecb472a
    name: Disabled Volume Snapshots
    reason: 'Disabled volume snapshots: further recovery inhibition in the same ransomware prep.'
  - id: c9fbe8e9-119d-40a6-9b59-dd58a5d84429
    name: Potential Ransomware or Unauthorized MBR Tampering Via Bcdedit.EXE
    reason: Closely related bcdedit abuse (MBR/boot tampering) from the same tooling.
  - id: a7ee1722-c3c5-aeff-3212-c777e4733217
    name: Disable Windows Defender AV Security Monitoring
    reason: Ransomware operators disable Defender before impact; precursor on same host.
  - id: 236e7c8e-c9d9-11eb-a824-acde48001122
    name: Disable Logs Using WevtUtil
    reason: Log disabling via wevtutil is typical anti-forensics immediately around impact.
  - id: d7662ff6-9e97-4596-a61d-9839e32dee8d
    name: Add SafeBoot Keys Via Reg Utility
    reason: 'SafeBoot key changes: attackers reboot into safe mode to encrypt with security tools off.'
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Shadow copy / backup destruction
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Vv]ssadmin.*[Dd]elete.*/ OR data_win_eventdata_commandLine:/.*[Ww]badmin.*[Dd]elete.*/ OR data_win_eventdata_commandLine:/.*[Ww]mic.*[Ss]hadowcopy.*[Dd]elete.*/ OR data_win_eventdata_commandLine:/.*[Dd]iskshadow.*/)
    pivot_on: host
    window: 4h
  - name: Other bcdedit usage
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Bb][Cc][Dd][Ee][Dd][Ii][Tt].*/
    pivot_on: host
    window: 4h
  - name: Defender / security tooling disabled
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss]et-[Mm]p[Pp]reference.*[Dd]isable.*/ OR data_win_eventdata_commandLine:/.*[Dd]isable[Aa]nti[Ss]pyware.*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc] +(stop|config).*([Ww]in[Dd]efend|[Ss]ense).*/)
    pivot_on: host
    window: 4h
  - name: Ransom note drops
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*([Rr][Ee][Aa][Dd][Mm][Ee]|[Dd][Ee][Cc][Rr][Yy][Pp][Tt]|[Rr][Aa][Nn][Ss][Oo][Mm]|[Rr][Ee][Cc][Oo][Vv][Ee][Rr]).*\.([Tt][Xx][Tt]|[Hh][Tt][Mm][Ll]?)/
    pivot_on: host
    window: 4h
  - name: Event log clearing
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ww]evtutil.*(cl|clear-log).*/ OR data_win_eventdata_commandLine:/.*[Cc]lear-[Ee]vent[Ll]og.*/)
    pivot_on: host
    window: 4h
