parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\curl.exe'; data_win_eventdata_originalFileName equals 'curl.exe';
  data_win_eventdata_commandLine matches the regex
  /.*(://[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}).*/, among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://labs.withsecure.com/publications/fin7-target-veeam-servers
  - https://github.com/WithSecureLabs/iocs/blob/344203de742bb7e68bd56618f66d34be95a9f9fc/FIN7VEEAM/iocs.csv
  - https://github.com/pr0xylife/IcedID/blob/8dd1e218460db4f750d955b4c65b2f918a1db906/icedID_09.28.2023.txt

response:
  message: >
    Suspicious File Download From IP Via Curl.EXE detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  custom_tags:
    - download
    - process_creation
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*(:\/\/[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}).*/ AND data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp].*/ AND (data_win_eventdata_commandLine:/.* -[Oo].*/ OR data_win_eventdata_commandLine:/.*--[Rr][Ee][Mm][Oo][Tt][Ee]-[Nn][Aa][Mm][Ee].*/ OR data_win_eventdata_commandLine:/.*--[Oo][Uu][Tt][Pp][Uu][Tt].*/) AND (data_win_eventdata_commandLine:/.*\.[Bb][Aa][Tt]/ OR data_win_eventdata_commandLine:/.*\.[Bb][Aa][Tt]\"/ OR data_win_eventdata_commandLine:/.*\.[Dd][Aa][Tt]/ OR data_win_eventdata_commandLine:/.*\.[Dd][Aa][Tt]\"/ OR data_win_eventdata_commandLine:/.*\.[Dd][Ll][Ll]/ OR data_win_eventdata_commandLine:/.*\.[Dd][Ll][Ll]\"/ OR data_win_eventdata_commandLine:/.*\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*\.[Ee][Xx][Ee]\"/ OR data_win_eventdata_commandLine:/.*\.[Gg][Ii][Ff]/ OR data_win_eventdata_commandLine:/.*\.[Gg][Ii][Ff]\"/ OR data_win_eventdata_commandLine:/.*\.[Hh][Tt][Aa]/ OR data_win_eventdata_commandLine:/.*\.[Hh][Tt][Aa]\"/ OR data_win_eventdata_commandLine:/.*\.[Jj][Pp][Ee][Gg]/ OR data_win_eventdata_commandLine:/.*\.[Jj][Pp][Ee][Gg]\"/ OR data_win_eventdata_commandLine:/.*\.[Ll][Oo][Gg]/ OR data_win_eventdata_commandLine:/.*\.[Ll][Oo][Gg]\"/ OR data_win_eventdata_commandLine:/.*\.[Mm][Ss][Ii]/ OR data_win_eventdata_commandLine:/.*\.[Mm][Ss][Ii]\"/ OR data_win_eventdata_commandLine:/.*\.[Pp][Nn][Gg]/ OR data_win_eventdata_commandLine:/.*\.[Pp][Nn][Gg]\"/ OR data_win_eventdata_commandLine:/.*\.[Pp][Ss]1/ OR data_win_eventdata_commandLine:/.*\.[Pp][Ss]1\"/ OR data_win_eventdata_commandLine:/.*\.[Pp][Ss][Mm]1/ OR data_win_eventdata_commandLine:/.*\.[Pp][Ss][Mm]1\"/ OR data_win_eventdata_commandLine:/.*\.[Vv][Bb][Ee]/ OR data_win_eventdata_commandLine:/.*\.[Vv][Bb][Ee]\"/ OR data_win_eventdata_commandLine:/.*\.[Vv][Bb][Ss]/ OR data_win_eventdata_commandLine:/.*\.[Vv][Bb][Ss]\"/ OR data_win_eventdata_commandLine:/.*\.[Bb][Aa][Tt]'/ OR data_win_eventdata_commandLine:/.*\.[Dd][Aa][Tt]'/ OR data_win_eventdata_commandLine:/.*\.[Dd][Ll][Ll]'/ OR data_win_eventdata_commandLine:/.*\.[Ee][Xx][Ee]'/ OR data_win_eventdata_commandLine:/.*\.[Gg][Ii][Ff]'/ OR data_win_eventdata_commandLine:/.*\.[Hh][Tt][Aa]'/ OR data_win_eventdata_commandLine:/.*\.[Jj][Pp][Ee][Gg]'/ OR data_win_eventdata_commandLine:/.*\.[Ll][Oo][Gg]'/ OR data_win_eventdata_commandLine:/.*\.[Mm][Ss][Ii]'/ OR data_win_eventdata_commandLine:/.*\.[Pp][Nn][Gg]'/ OR data_win_eventdata_commandLine:/.*\.[Pp][Ss]1'/ OR data_win_eventdata_commandLine:/.*\.[Pp][Ss][Mm]1'/ OR data_win_eventdata_commandLine:/.*\.[Vv][Bb][Ee]'/ OR data_win_eventdata_commandLine:/.*\.[Vv][Bb][Ss]'/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 21dd6d38-2b18-4453-9404-a0fe4a0cc288
    name: Curl Download And Execute Combination
    reason: Same curl use chained directly into execution of the fetched file
  - id: 9cc85849-3b02-4cb5-b371-3a1ff54f2218
    name: File Download From IP URL Via Curl.EXE
    reason: Sibling download detection for the same transfer pattern; co-fires when URL and output path both look malicious
  - id: a6a39bdb-935c-4f0a-ab77-35f4bbf44d33
    name: Potentially Suspicious Powershell Script Execution From Temp Folder
    reason: Downloaded .ps1 payloads are typically executed from Temp next
  - id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
    name: PowerShell Download and Execution Cradles
    reason: Parallel or follow-on download-and-execute stage using PowerShell
  - id: de587dce-915e-4218-aac4-835ca6af6f70
    name: Potential Persistence Attempt Via Run Keys Using Reg.EXE
    reason: Downloaded payload commonly persists via a Run key
  - id: 8a8379b8-780b-4dbf-b1e9-31c8d112fefb
    name: Schtasks From Suspicious Folders
    reason: Scheduled task pointing at the downloaded file
  - id: 17769c90-230e-488b-a463-e05c08e9d48f
    name: Powershell Defender Exclusion
    reason: Attackers exclude the drop folder before running the download
  - id: 69bd9b97-2be2-41b6-9816-fb08757a4d1a
    name: Potentially Suspicious Execution From Parent Process In Public Folder
    reason: Downloaded binary run from the Public folder spawns children
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: All curl executions on this host (other URLs and outputs)
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Network connections by curl (destination IP and port)
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Executables and scripts created in user-writable paths (downloaded file landing)
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\([Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]|[Tt][Ee][Mm][Pp]|[Pp][Uu][Bb][Ll][Ii][Cc]|[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]|[Aa][Pp][Pp][Dd][Aa][Tt][Aa])\\.*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Pp][Ss]1|[Bb][Aa][Tt]|[Vv][Bb][Ss]|[Hh][Tt][Aa]|[Mm][Ss][Ii])/
    pivot_on:
    - host
    window: 2h
  - name: Execution of binaries from staging paths (downloaded payload running)
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]|[Tt][Ee][Mm][Pp]|[Pp][Uu][Bb][Ll][Ii][Cc]|[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]|[Aa][Pp][Pp][Dd][Aa][Tt][Aa])\\.*\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 4h
  - name: Persistence written after the download (Run keys, services)
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*(\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn]|\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\).*/
    pivot_on:
    - host
    window: 6h
