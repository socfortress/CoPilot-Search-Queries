name: Windows Malicious PowerShell Process - Execution Policy Bypass
id: windows-malicious-powershell-process-execution-policy-bypass-001
version: 1
schema_version: "1.0"
date: "2026-02-12"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  Detects PowerShell processes launched with parameters that bypass the local execution 
  policy for scripts. Bypassing execution policies is a common tactic used by attackers 
  to run malicious scripts undetected. This technique is widely used by threat actors 
  including Volt Typhoon, Salt Typhoon, AsyncRAT, XWorm, and DarkCrystal RAT.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image: "*powershell*"
              - wildcard:
                  data_win_eventdata_image: "*pwsh*"
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine: "*-ex*"
        - wildcard:
            data_win_eventdata_commandLine: "*bypass*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-12 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-12 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Windows endpoints with Sysmon 
  installed and configured to log process creation events (EventID 1) with full 
  command-line arguments. The index pattern should match your Wazuh index naming 
  convention.

known_false_positives: >
  There may be legitimate reasons to bypass the PowerShell execution policy, such as 
  administrative scripts or software deployment tools. Validate the PowerShell script 
  being run and the parent process context to determine legitimacy.

references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://www.microsoft.com/en-us/security/blog/2023/05/24/volt-typhoon-targets-us-critical-infrastructure-with-living-off-the-land-techniques/

response:
  message: >
    PowerShell execution policy bypass detected on $agent_name$. 
    Command line: $data_win_eventdata_commandLine$. 
    Parent process: $data_win_eventdata_parentImage$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1059.001
  risk_score: 42
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 42
  threat_objects: []

tags:
  analytic_story:
    - Volt Typhoon
    - Salt Typhoon
    - AsyncRAT
    - XWorm
    - DarkCrystal RAT
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*powershell.*/ OR data_win_eventdata_image:/.*pwsh.*/) AND data_win_eventdata_commandLine:/.*\-ex.*/ AND data_win_eventdata_commandLine:/.*bypass.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 9be56c82-b1cc-4318-87eb-d138afaaca39
    name: Malicious PowerShell Process - Execution Policy Bypass
    reason: Stricter sibling (-ex* plus space-bounded bypass); co-firing means a true flag rather than a stray substring.
  - id: 87e3c4e8-a6a8-4ad9-bb4f-46e7ff99a180
    name: Change PowerShell Policies to an Insecure Level
    reason: Persistent policy weakening (Set-ExecutionPolicy) is the durable form of the per-session bypass.
  - id: fad91067-08c5-4d1a-8d8c-d96a21b37814
    name: Potential PowerShell Execution Policy Tampering
    reason: Registry-level policy change on the same host indicates the attacker made the bypass permanent.
  - id: 754ed792-634f-40ae-b3bc-e0448d33f695
    name: Suspicious PowerShell Parent Process
    reason: Shows what launched the bypassing PowerShell (Office, WMI, script engine), separating admin automation from intrusion.
  - id: ac175779-025a-4f12-98b0-acdaeb77ea85
    name: PowerShell Script Run in AppData
    reason: Bypass flag is used to run an unsigned script file, commonly dropped in AppData.
  - id: a6a39bdb-935c-4f0a-ab77-35f4bbf44d33
    name: Potentially Suspicious Powershell Script Execution From Temp Folder
    reason: Bypass with a script staged in Temp points to a dropped payload script.
  - id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
    name: PowerShell Download and Execution Cradles
    reason: Bypass sessions often fetch and run a remote script as the next step.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: PowerShell running script files from user-writable paths
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*([Pp]ower[Ss]hell|[Pp]wsh).*/ AND data_win_eventdata_commandLine:/.*(\.ps1).*(\\Temp\\|\\AppData\\|\\ProgramData\\|\\Users\\Public\\|\\Downloads\\).*/
    pivot_on: host
    window: 4h
  - name: PowerShell download cradles and web requests
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*([Pp]ower[Ss]hell|[Pp]wsh).*/ AND data_win_eventdata_commandLine:/.*([Dd]ownload[Ss]tring|[Dd]ownload[Ff]ile|[Ii]nvoke-[Ww]eb[Rr]equest|[Nn]et\.[Ww]eb[Cc]lient|[Ss]tart-[Bb]its[Tt]ransfer).*/
    pivot_on: host
    window: 4h
  - name: Script file creation by PowerShell or script hosts
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\.(ps1|psm1|bat|vbs|js)/ AND data_win_eventdata_image:/.*([Pp]ower[Ss]hell|[Pp]wsh|[Cc]md|[Ww]script|[Cc]script|[Mm]shta).*/
    pivot_on: host
    window: 4h
  - name: Defender or logging tampering from PowerShell
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*([Ss]et-[Mm]p[Pp]reference|[Aa]dd-[Mm]p[Pp]reference|DisableRealtimeMonitoring|[Ee]xclusion[Pp]ath|[Ss]cript[Bb]lock[Ll]ogging).*/
    pivot_on: host
    window: 4h
  - name: Bypass launches by same user
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*([Pp]ower[Ss]hell|[Pp]wsh).*/ AND data_win_eventdata_commandLine:/.* -[Ee][Xx].*[Bb]ypass.*/
    pivot_on: user
    window: 24h
