name: Deleted Data Overwritten Via Cipher.EXE
id: 4b046706-5789-4673-b111-66f25fe99534
version: 1
schema_version: "1.0"
date: "2023-02-21"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 4b046706-5789-4673-b111-66f25fe99534
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects usage of the "cipher" built-in utility in order to overwrite deleted
  data from disk. Adversaries may destroy data and files on specific systems or
  in large numbers on a network to interrupt availability to systems, services,
  and network resources. Data destruction is likely to render stored data
  irrecoverable by forensic techniques through overwriting files or data on
  local and remote drives. MITRE ATT&CK: T1485.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - term:
                  data_win_eventdata_originalFileName:
                    value: "CIPHER.EXE"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\cipher.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* /w:*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_originalFileName
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_originalFileName equals
  'CIPHER.EXE'; data_win_eventdata_image matches '*\cipher.exe';
  data_win_eventdata_commandLine matches '* /w:*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1485/T1485.md#atomic-test-3---overwrite-deleted-data-on-c-drive
  - https://attack.mitre.org/techniques/T1485/

response:
  message: >
    Deleted Data Overwritten Via Cipher.EXE detected on host $agent_name$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1485
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_originalFileName
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1485
  custom_tags:
    - deleted
    - overwritten
    - cipher
    - process_creation
    - sysmon
    - impact
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_originalFileName:/[Cc][Ii][Pp][Hh][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Ii][Pp][Hh][Ee][Rr]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.* \/[Ww]:.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a4824fca-976f-4964-b334-0621379e84c4
    name: Potential File Overwrite Via Sysinternals SDelete
    reason: Alternate anti-forensic secure-wipe tool for the same goal.
  - id: c1d867fe-8d95-4487-aab4-e53f2d339f90
    name: Renamed Sysinternals Sdelete Execution
    reason: Evasive variant of secure-wipe tooling.
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: Shadow copy deletion precedes wiping so deleted data cannot be recovered.
  - id: 639c9081-f482-47d3-a0bd-ddee3d4ecd76
    name: All Backups Deleted Via Wbadmin.EXE
    reason: Backup removal accompanies free-space wiping in destructive attacks.
  - id: c9fbe8e9-119d-40a6-9b59-dd58a5d84429
    name: Potential Ransomware or Unauthorized MBR Tampering Via Bcdedit.EXE
    reason: Recovery inhibition within the same impact chain.
  - id: 236e7c8e-c9d9-11eb-a824-acde48001122
    name: Disable Logs Using WevtUtil
    reason: Log clearing/disabling accompanies anti-forensic wiping.
  - id: 689308fc-cfba-4f72-9897-796c1dc61487
    name: Potential Conti Ransomware Activity
    reason: Ransomware tradecraft; cipher /w is used post-encryption by some operators.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Anti-forensic wipe tools
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*([Ss]delete|[Ee]raser|[Cc]ipher)(64)?\.exe/ OR data_win_eventdata_commandLine:/.*[Ss]delete.*/)
    pivot_on: host
    window: 24h
  - name: Recovery inhibition
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*([Vv]ssadmin|[Ww]badmin|[Bb]cdedit|[Ww]mic.*[Ss]hadowcopy).*([Dd]elete|[Rr]ecoveryenabled).*/
    pivot_on: host
    window: 24h
  - name: Event log clearing
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*([Ww]evtutil.*(cl|clear-log|sl)|[Cc]lear-[Ee]vent[Ll]og).*/
    pivot_on: host
    window: 6h
  - name: Mass file deletion via shell
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(del \/[fFsSqQ]|[Rr]emove-[Ii]tem.*-[Rr]ecurse|rmdir \/[sS]).*/
    pivot_on: host
    window: 6h
  - name: Shell parents invoking cipher
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*(cmd|powershell|wscript|cscript)\.exe/ AND data_win_eventdata_commandLine:/.*[Cc]ipher.*/
    pivot_on: host
    window: 2h
