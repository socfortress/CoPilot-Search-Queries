name: Arbitrary File Download Via ConfigSecurityPolicy.EXE
id: 1f0f6176-6482-4027-b151-00071af39d7e
version: 1
schema_version: "1.0"
date: "2022-05-16"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 1f0f6176-6482-4027-b151-00071af39d7e
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of "ConfigSecurityPolicy.EXE", a binary part of Windows
  Defender used to manage settings in Windows Defender. Users can configure
  different pilot collections for each of the co-management workloads. It can be
  abused by attackers in order to upload or download files. MITRE ATT&CK: T1567.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*ConfigSecurityPolicy.exe*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\ConfigSecurityPolicy.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "ConfigSecurityPolicy.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*ftp://*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*http://*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*https://*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*ConfigSecurityPolicy.exe*'; data_win_eventdata_image matches
  '*\ConfigSecurityPolicy.exe'; data_win_eventdata_originalFileName equals
  'ConfigSecurityPolicy.exe', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://lolbas-project.github.io/lolbas/Binaries/ConfigSecurityPolicy/
  - https://attack.mitre.org/techniques/T1567/

response:
  message: >
    Arbitrary File Download Via ConfigSecurityPolicy.EXE detected on host
    $agent_name$. Matched data_win_eventdata_commandLine:
    $data_win_eventdata_commandLine$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1567
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1567
  custom_tags:
    - arbitrary
    - download
    - configsecuritypolicy
    - process_creation
    - sysmon
    - exfiltration
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Nn][Ff][Ii][Gg][Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy][Pp][Oo][Ll][Ii][Cc][Yy]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Cc][Oo][Nn][Ff][Ii][Gg][Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy][Pp][Oo][Ll][Ii][Cc][Yy]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Cc][Oo][Nn][Ff][Ii][Gg][Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy][Pp][Oo][Ll][Ii][Cc][Yy]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*[Ff][Tt][Pp]:\/\/.*/ OR data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp]:\/\/.*/ OR data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp][Ss]:\/\/.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d059842b-6b9d-4ed1-b5c3-5b89143c6ede
    name: File Download Via Bitsadmin
    reason: Alternate LOLBin downloader an actor commonly uses on the same host to pull follow-on payloads.
  - id: 19b08b1c-861d-4e75-a1ef-ea0c1baf202b
    name: Suspicious Download Via Certutil.EXE
    reason: Another native downloader frequently chained with trusted-binary abuse for staging.
  - id: 46123129-1024-423e-9fae-43af4a0fa9a5
    name: File Download Via Windows Defender MpCmpRun.EXE
    reason: Sibling Defender-component download abuse; both rely on trusted Defender binaries.
  - id: 17769c90-230e-488b-a463-e05c08e9d48f
    name: Powershell Defender Exclusion
    reason: Actors abusing Defender tooling often add exclusions so the downloaded file survives.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other LOLBin downloaders
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn].*[Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll].*[Uu][Rr][Ll][Cc][Aa][Cc][Hh][Ee].*/ OR data_win_eventdata_commandLine:/.*[Cc][Uu][Rr][Ll].*[Hh][Tt][Tt][Pp].*/ OR data_win_eventdata_commandLine:/.*[Mm][Pp][Cc][Mm][Dd][Rr][Uu][Nn].*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee].*/)
    pivot_on: host
    window: 6h
  - name: Executables created in user-writable paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\([Tt][Ee][Mm][Pp]|[Pp][Uu][Bb][Ll][Ii][Cc]|[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]|[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa])\\.*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Pp][Ss]1|[Bb][Aa][Tt])/
    pivot_on: host
    window: 4h
  - name: Network connections by ConfigSecurityPolicy
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\[Cc][Oo][Nn][Ff][Ii][Gg][Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy][Pp][Oo][Ll][Ii][Cc][Yy]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 6h
  - name: Defender tampering
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Aa][Dd][Dd]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/)
    pivot_on: host
    window: 6h
