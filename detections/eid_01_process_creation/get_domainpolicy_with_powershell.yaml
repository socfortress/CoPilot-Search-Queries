name: Get DomainPolicy with Powershell
id: b8f9947e-065a-11ec-aafb-acde48001122
version: 1
schema_version: "1.0"
date: "2026-04-27"
author: SOCFortress LLC
status: production
type: TTP

description: >
  This analytic detects the execution of powershell.exe, pwsh.exe, or
  cmd.exe with the Get-DomainPolicy cmdlet referenced in the command
  line. Sysmon EventID 1 is used to match process creation events where
  the image or OriginalFileName is one of the PowerShell or Command
  Prompt binaries AND the command line contains Get-DomainPolicy.
  Get-DomainPolicy is a function from PowerSploit/PowerView (a
  well-known offensive PowerShell toolkit) used to retrieve domain
  password policy and Kerberos policy settings - distinct from the
  Microsoft ActiveDirectory module's Get-ADDefaultDomainPasswordPolicy
  cmdlet. The presence of this PowerSploit-specific function name in a
  command line is a strong indicator of attacker tooling rather than
  legitimate administrative activity. This activity is significant
  because it indicates use of an offensive AD reconnaissance toolkit
  during the discovery phase of an intrusion. If confirmed malicious,
  this could lead to unauthorized access to sensitive domain
  configurations, aiding in privilege escalation, password attacks,
  and lateral movement within the network.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image: "*cmd.exe"
              - wildcard:
                  data_win_eventdata_image: "*powershell*.exe"
              - wildcard:
                  data_win_eventdata_image: "*pwsh.exe"
              - term:
                  data_win_eventdata_originalFileName: "Cmd.Exe"
              - term:
                  data_win_eventdata_originalFileName: "PowerShell.EXE"
              - term:
                  data_win_eventdata_originalFileName: "pwsh.dll"
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*Get-DomainPolicy*"
              case_insensitive: true
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_parentCommandLine
    - data_win_eventdata_user
    - data_win_eventdata_processId
    - data_win_eventdata_processGuid
    - data_win_eventdata_parentProcessId
    - data_win_eventdata_parentProcessGuid
    - data_win_eventdata_hashes
    - data_win_eventdata_integrityLevel
    - data_win_eventdata_currentDirectory

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-27 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-27 23:59:59.999"

how_to_implement: >
  This detection requires Sysmon EventID 1 (Process Creation) logs to be forwarded
  from Windows endpoints to Wazuh Indexer. Ensure Sysmon is deployed with a
  configuration that captures Image, OriginalFileName, and CommandLine fields
  (SwiftOnSecurity or Olaf Hartong Sysmon modular config recommended). The
  detection matches Windows shells (PowerShell or Command Prompt) by Image
  path or PE OriginalFileName, combined with Get-DomainPolicy in the
  command line. Case-insensitive matching is used on the function name
  to handle PowerShell's flexible casing. The ES DSL uses case_insensitive
  wildcard option (OpenSearch 2.x / Elasticsearch 7.10+); Graylog
  equivalent uses character classes. For deeper coverage, also enable
  PowerShell Script Block Logging (EventID 4104) and correlate against
  the same function name in script blocks - script block logging will
  catch in-memory PowerSploit imports that don't appear on the command
  line.

known_false_positives: >
  Get-DomainPolicy is a PowerSploit/PowerView offensive function, not a
  built-in Microsoft cmdlet, so legitimate administrative use is rare.
  Penetration testers, Red Teamers, and authorized internal security
  assessors may produce true-positive alerts that are not malicious -
  these should be tuned via approved-source allow-listing (specific
  parent process or user account) rather than removing the detection.

references:
  - https://attack.mitre.org/techniques/T1201/
  - https://github.com/S1ckB0y1337/Active-Directory-Exploitation-Cheat-Sheet
  - https://powersploit.readthedocs.io/en/latest/Recon/Get-DomainPolicy/

response:
  message: >
    PowerSploit Get-DomainPolicy reconnaissance was identified on
    endpoint $agent_name$ by user $data_win_eventdata_user$. Process
    image: $data_win_eventdata_image$. Parent process:
    $data_win_eventdata_parentImage$. Command line:
    $data_win_eventdata_commandLine$. This is a high-confidence
    indicator of offensive AD toolkit usage - PowerSploit/PowerView
    function names are not legitimate Microsoft cmdlets and warrant
    immediate investigation, including review of parent process
    lineage, in-memory PowerShell module loads, and concurrent
    discovery activity.
  risk_score: 72
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 60
    - field: data_win_eventdata_user
      type: user
      score: 60
  threat_objects:
    - field: data_win_eventdata_image
      type: process_name
    - field: data_win_eventdata_parentImage
      type: parent_process_name
    - field: data_win_eventdata_commandLine
      type: command_line

tags:
  analytic_story:
    - Active Directory Discovery
    - Active Directory Reconnaissance
    - PowerSploit
    - PowerView
    - Offensive PowerShell Toolkit
  asset_type: Endpoint
  mitre_attack_id:
    - T1201
  custom_tags:
    - powershell
    - powersploit
    - powerview
    - get_domainpolicy
    - active_directory
    - ad_enumeration
    - reconnaissance
    - offensive_toolkit
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Cc][Mm][Dd]\.exe.*/ OR data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*\.exe.*/ OR data_win_eventdata_image:/.*[Pp][Ww][Ss][Hh]\.exe.*/ OR data_win_eventdata_originalFileName:"Cmd.Exe" OR data_win_eventdata_originalFileName:"PowerShell.EXE" OR data_win_eventdata_originalFileName:"pwsh.dll") AND data_win_eventdata_commandLine:/.*[Gg][Ee][Tt]\-[Dd][Oo][Mm][Aa][Ii][Nn][Pp][Oo][Ll][Ii][Cc][Yy].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: dcd74b95-3f36-4ed9-9598-0490951643aa
    name: PowerView PowerShell Cmdlets - ScriptBlock
    reason: Get-DomainPolicy is PowerView; script block logging shows the rest of the PowerView session
  - id: 4fa7f846-054a-11ec-a836-acde48001122
    name: Get-DomainTrust with PowerShell
    reason: Another PowerView function commonly run in the same recon sequence
  - id: 93c94be3-bead-4a60-860f-77ca3fe59903
    name: GetDomainGroup with PowerShell
    reason: PowerView group enumeration to find privileged targets
  - id: 10d62950-0de5-4199-a710-cff9ea79b413
    name: Elevated Group Discovery with PowerView
    reason: Privileged-group discovery follows policy discovery in PowerView workflows
  - id: 36e46ebe-065a-11ec-b4c7-acde48001122
    name: Get ADDefaultDomainPasswordPolicy with Powershell
    reason: AD-module counterpart used for the same policy lookup
  - id: b0b34e2c-90de-11ec-baeb-acde48001122
    name: Disabled Kerberos Pre-Authentication Discovery With PowerView
    reason: AS-REP roast target hunting with the same toolkit
  - id: a0bdd2f6-c2ff-11eb-b918-acde48001122
    name: Detect SharpHound Command-Line Arguments
    reason: Graph-based AD collection frequently runs alongside PowerView
  - id: bac9fb54-2da7-44e9-988f-11e9a5edbc0c
    name: Potential Password Spraying Attempt Using Dsacls.EXE
    reason: Spraying is the usual use of policy data
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: PowerView and PowerSploit functions
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Gg][Ee][Tt]\-[Dd][Oo][Mm][Aa][Ii][Nn][Uu][Ss][Ee][Rr]|[Gg][Ee][Tt]\-[Dd][Oo][Mm][Aa][Ii][Nn][Gg][Rr][Oo][Uu][Pp]|[Gg][Ee][Tt]\-[Dd][Oo][Mm][Aa][Ii][Nn][Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr]|[Gg][Ee][Tt]\-[Dd][Oo][Mm][Aa][Ii][Nn][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ll][Ee][Rr]|[Gg][Ee][Tt]\-[Dd][Oo][Mm][Aa][Ii][Nn][Tt][Rr][Uu][Ss][Tt]|[Gg][Ee][Tt]\-[Nn][Ee][Tt][Uu][Ss][Ee][Rr]|[Gg][Ee][Tt]\-[Nn][Ee][Tt][Dd][Oo][Mm][Aa][Ii][Nn]|[Gg][Ee][Tt]\-[Nn][Ee][Tt][Gg][Rr][Oo][Uu][Pp]|[Ff][Ii][Nn][Dd]\-[Ll][Oo][Cc][Aa][Ll][Aa][Dd][Mm][Ii][Nn][Aa][Cc][Cc][Ee][Ss][Ss]|[Ii][Nn][Vv][Oo][Kk][Ee]\-[Uu][Ss][Ee][Rr][Hh][Uu][Nn][Tt][Ee][Rr]|[Ii][Nn][Vv][Oo][Kk][Ee]\-[Ss][Hh][Aa][Rr][Ee][Ff][Ii][Nn][Dd][Ee][Rr]|[Ii][Nn][Vv][Oo][Kk][Ee]\-[Kk][Ee][Rr][Bb][Ee][Rr][Oo][Aa][Ss][Tt]|[Gg][Ee][Tt]\-[Dd][Oo][Mm][Aa][Ii][Nn][Ss][Pp][Nn][Tt][Ii][Cc][Kk][Ee][Tt]).*/
    pivot_on: host
    window: 2h
  - name: PowerShell download cradles and encoded commands
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg]|[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee]|[Ii][Nn][Vv][Oo][Kk][Ee]\-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt]|[Nn][Ee][Tt]\.[Ww][Ee][Bb][Cc][Ll][Ii][Ee][Nn][Tt]|[Ff][Rr][Oo][Mm][Bb][Aa][Ss][Ee]64[Ss][Tt][Rr][Ii][Nn][Gg]|\-[Ee][Nn][Cc][Oo][Dd][Ee][Dd][Cc][Oo][Mm][Mm][Aa][Nn][Dd]|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn] \/[Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr]|[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll] \-[Uu][Rr][Ll][Cc][Aa][Cc][Hh][Ee]).*/
    pivot_on: host
    window: 2h
  - name: Password-spraying / credential-guessing tooling
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Dd][Oo][Mm][Aa][Ii][Nn][Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd][Ss][Pp][Rr][Aa][Yy]|[Ii][Nn][Vv][Oo][Kk][Ee]\-[Ss][Pp][Rr][Aa][Yy][Ee][Mm][Pp][Tt][Yy][Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd]|[Kk][Ee][Rr][Bb][Rr][Uu][Tt][Ee]|[Cc][Rr][Aa][Cc][Kk][Mm][Aa][Pp][Ee][Xx][Ee][Cc]|[Ss][Pp][Rr][Aa][Yy][Hh][Oo][Uu][Nn][Dd]|[Ii][Nn][Vv][Oo][Kk][Ee]\-[Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll][Ss][Pp][Rr][Aa][Yy]).*/
    pivot_on: host
    window: 4h
  - name: Failed logons and Kerberos pre-auth failures
    query: data_win_system_eventID:(4625 OR 4771 OR 4776)
    pivot_on: ip
    window: 4h
  - name: Credential-theft commands
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz]|[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa]|[Ll][Ss][Aa][Dd][Uu][Mm][Pp]|[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll]|[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp]|[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll]|[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn] [Cc][Rr][Ee][Aa][Tt][Ee] [Ss][Hh][Aa][Dd][Oo][Ww]|[Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt]|[Rr][Uu][Bb][Ee][Uu][Ss]).*/
    pivot_on: host
    window: 4h
