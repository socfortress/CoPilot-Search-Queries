name: Process Memory Dump Via Comsvcs.DLL
id: 646ea171-dded-4578-8a4d-65e9822892e3
version: 1
schema_version: "1.0"
date: "2025-02-23"
author: Florian Roth (Nextron Systems), Modexp, Nasreddine Bencherchali (Nextron Systems), Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 646ea171-dded-4578-8a4d-65e9822892e3
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a process memory dump via "comsvcs.dll" using rundll32, covering
  multiple different techniques (ordinal, minidump function, etc.). MITRE
  ATT&CK: T1036, T1003.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\rundll32.exe"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_originalFileName:
                                value: "RUNDLL32.EXE"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*rundll32*"
                                case_insensitive: true
                        minimum_should_match: 1
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*comsvcs*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*full*"
                          case_insensitive: true
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_commandLine: "*#-*"
                          - wildcard:
                              data_win_eventdata_commandLine: "*#+*"
                          - wildcard:
                              data_win_eventdata_commandLine: "*#24*"
                          - wildcard:
                              data_win_eventdata_commandLine: "*24 *"
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*MiniDump*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine: "*#65560*"
                        minimum_should_match: 1
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine: "*24*"
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*comsvcs*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*full*"
                          case_insensitive: true
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_commandLine: "* #*"
                          - wildcard:
                              data_win_eventdata_commandLine: "*,#*"
                          - wildcard:
                              data_win_eventdata_commandLine: "*, #*"
                          - wildcard:
                              data_win_eventdata_commandLine: "*\"#*"
                        minimum_should_match: 1
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\rundll32.exe'; data_win_eventdata_originalFileName equals 'RUNDLL32.EXE';
  data_win_eventdata_commandLine matches '*rundll32*', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/shantanukhande/status/1229348874298388484
  - https://twitter.com/pythonresponder/status/1385064506049630211?s=21
  - https://twitter.com/Hexacorn/status/1224848930795552769
  - https://modexp.wordpress.com/2019/08/30/minidumpwritedump-via-com-services-dll/
  - https://twitter.com/SBousseaden/status/1167417096374050817
  - https://twitter.com/Wietze/status/1542107456507203586
  - https://github.com/Hackndo/lsassy/blob/14d8f8ae596ecf22b449bfe919829173b8a07635/lsassy/dumpmethod/comsvcs.py
  - https://www.youtube.com/watch?v=52tAmVLg1KM&t=2070s
  - https://attack.mitre.org/techniques/T1036/
  - https://attack.mitre.org/techniques/T1003/001/

response:
  message: >
    Process Memory Dump Via Comsvcs.DLL detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1036, T1003.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1036
    - T1003.001
  custom_tags:
    - memory
    - comsvcs
    - process_creation
    - sysmon
    - credential_access
    - stealth
    - car_2013_05_009
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (((data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Rr][Uu][Nn][Dd][Ll][Ll]32.*/) AND data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss].*/ AND data_win_eventdata_commandLine:/.*[Ff][Uu][Ll][Ll].*/ AND (data_win_eventdata_commandLine:/.*\#-.*/ OR data_win_eventdata_commandLine:/.*\#\+.*/ OR data_win_eventdata_commandLine:/.*\#24.*/ OR data_win_eventdata_commandLine:/.*24 .*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*\#65560.*/)) OR (data_win_eventdata_commandLine:/.*24.*/ AND data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss].*/ AND data_win_eventdata_commandLine:/.*[Ff][Uu][Ll][Ll].*/ AND (data_win_eventdata_commandLine:/.* \#.*/ OR data_win_eventdata_commandLine:/.*,\#.*/ OR data_win_eventdata_commandLine:/.*, \#.*/ OR data_win_eventdata_commandLine:/.*\"\#.*/)))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: Same technique via different command-line shapes; co-fires on the same execution.
  - id: a49fa4d5-11db-418c-8473-1e014a8dd462
    name: Lsass Memory Dump via Comsvcs DLL
    reason: 'Sysmon 10 view of the same act: rundll32 opening LSASS with dump access.'
  - id: 8cde342c-ba48-4b74-b615-172c330f2e93
    name: Suspicious Renamed Comsvcs DLL Loaded By Rundll32
    reason: Evasive variant using a renamed comsvcs copy.
  - id: a5a2d357-1ab8-4675-a967-ef9990a59391
    name: LSASS Process Memory Dump Files
    reason: Resulting dump file written to disk.
  - id: ffa6861c-4461-4f59-8a41-578c39f3f23e
    name: LSASS Dump Keyword In CommandLine
    reason: Operators often use dump keywords in the same or adjacent commands.
  - id: 2569ed8c-1147-498a-9b8c-2ad3656b10ed
    name: Potential Renamed Rundll32 Execution
    reason: Renamed rundll32 is a common evasion for this exact dump command.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Process access to LSASS
    query: data_win_system_eventID:10 AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Dump files written
    query: data_win_system_eventID:11 AND (data_win_eventdata_targetFilename:*.dmp OR data_win_eventdata_targetFilename:*.dump OR data_win_eventdata_targetFilename:*.bin)
    pivot_on: host
    window: 2h
  - name: Dump archived or exfiltrated
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*[Rr]ar.*\.dmp.*/ OR data_win_eventdata_commandLine:/.*7z.*\.dmp.*/ OR data_win_eventdata_commandLine:/.*[Cc]ompress-[Aa]rchive.*/ OR data_win_eventdata_commandLine:/.*[Cc]url.* -[Tt] .*/)
    pivot_on: host
    window: 4h
  - name: Rundll32 comsvcs or ordinal calls
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*[Rr]undll32.*(comsvcs|#24|MiniDump).*/
    pivot_on: host
    window: 4h
  - name: Credential tooling after dump
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*[Ss]ekurlsa.*/ OR data_win_eventdata_commandLine:/.*[Pp]ypykatz.*/)
    pivot_on: host
    window: 6h
