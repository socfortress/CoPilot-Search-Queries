name: Windows Cmdline Tool Execution From Non-Shell Process
id: windows-cmdline-tool-from-non-shell-001
version: 1
schema_version: "1.0"
date: "2026-02-23"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  Detects discovery tools (ipconfig, systeminfo, whoami, arp, nslookup, route, 
  netstat, hostname, net1) spawned by non-standard parent processes. Excludes 
  cmd.exe, powershell.exe, pwsh.exe, explorer.exe as legitimate parents. This 
  pattern indicates process injection or malware using compromised processes for 
  host discovery. Used by FIN7 JSSLoader, Volt Typhoon, Qakbot, DarkGate, and 
  Rhysida ransomware.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image: "*\\\\ipconfig.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\\\systeminfo.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\\\whoami.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\\\net1.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\\\arp.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\\\nslookup.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\\\route.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\\\netstat.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\\\hostname.exe"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - wildcard:
            data_win_eventdata_parentImage: "*\\\\cmd.exe"
        - wildcard:
            data_win_eventdata_parentImage: "*\\\\powershell.exe"
        - wildcard:
            data_win_eventdata_parentImage: "*\\\\pwsh.exe"
        - wildcard:
            data_win_eventdata_parentImage: "*\\\\explorer.exe"
        - wildcard:
            data_win_eventdata_parentImage: "*\\\\powershell_ise.exe"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-23 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-23 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Windows endpoints with Sysmon 
  installed and configured to log process creation events (EventID 1) with full 
  command-line arguments and parent process tracking.

known_false_positives: >
  Automated host discovery tools, system management software, or scheduled tasks 
  may spawn discovery tools from non-shell parents. Baseline known management 
  tools and filter by parent process path.

references:
  - https://attack.mitre.org/techniques/T1059/007/
  - https://www.mandiant.com/resources/fin7-pursuing-an-enigmatic-and-evasive-global-criminal-operation
  - https://www.microsoft.com/en-us/security/blog/2023/05/24/volt-typhoon-targets-us-critical-infrastructure-with-living-off-the-land-techniques/

response:
  message: >
    Discovery tool spawned from non-shell parent on $agent_name$. 
    Parent: $data_win_eventdata_parentImage$. 
    Child: $data_win_eventdata_image$. 
    Command: $data_win_eventdata_commandLine$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1059.007
  risk_score: 56
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 56
  threat_objects: []

tags:
  analytic_story:
    - FIN7
    - Volt Typhoon
    - Qakbot
    - DarkGate Malware
    - Rhysida Ransomware
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.007
  custom_tags:
    - process_injection
    - discovery
    - non_shell_parent
    - lotl
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*ipconfig\.exe/ OR data_win_eventdata_image:/.*systeminfo\.exe/ OR data_win_eventdata_image:/.*whoami\.exe/ OR data_win_eventdata_image:/.*net1\.exe/ OR data_win_eventdata_image:/.*arp\.exe/ OR data_win_eventdata_image:/.*nslookup\.exe/ OR data_win_eventdata_image:/.*route\.exe/ OR data_win_eventdata_image:/.*netstat\.exe/ OR data_win_eventdata_image:/.*hostname\.exe/) AND NOT data_win_eventdata_parentImage:/.*cmd\.exe/ AND NOT data_win_eventdata_parentImage:/.*powershell\.exe/ AND NOT data_win_eventdata_parentImage:/.*pwsh\.exe/ AND NOT data_win_eventdata_parentImage:/.*explorer\.exe/ AND NOT data_win_eventdata_parentImage:/.*powershell_ise\.exe/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: windows-network-connection-discovery-with-arp-001
    name: Windows Network Connection Discovery With Arp
    reason: 'Same implant discovery burst: arp is one of the tools the injected parent runs alongside ipconfig/systeminfo.'
  - id: 2cf5cc25-f39a-436d-a790-4857e5995ede
    name: Network Connection Discovery With Netstat
    reason: netstat is in this rule's tool set; a hit on the same host shows the discovery burst continuing.
  - id: dd83407e-439f-11ec-ab8e-acde48001122
    name: Network Discovery Using Route Windows App
    reason: route.exe is another tool of the same non-shell-parent discovery chain.
  - id: c248c896-e412-4279-8c15-1c558067b6fa
    name: Enumerate All Information With Whoami.EXE
    reason: whoami /all is the privilege-check step malware performs right after landing.
  - id: 8de1cbe8-d6f5-496d-8237-5f44a721c7a0
    name: Whoami.EXE Execution Anomaly
    reason: Whoami from an anomalous parent corroborates the injected or malicious parent process.
  - id: e6313acd-208c-44fc-a0ff-db85d572e90e
    name: Network Reconnaissance Activity
    reason: Broader reconnaissance on the same host that follows initial host discovery.
  - id: cf879ffb-793a-4753-9a14-bc8f37cc90df
    name: Potential Qakbot Rundll32 Execution
    reason: Qakbot runs this discovery batch from rundll32/injected hosts; a hit confirms the family.
  - id: 8a582fe2-0882-4b89-a82a-da6b2dc32937
    name: Suspicious WmiPrvSE Child Process
    reason: WMI-launched children are another non-shell parent path for the same discovery commands.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Parent process of discovery tools
    query: data_win_system_eventID:1 AND data_win_eventdata_image:(/.*[Ww]hoami\.exe/ OR /.*[Ss]ysteminfo\.exe/ OR /.*[Ii]pconfig\.exe/ OR /.*[Nn]et1?\.exe/ OR /.*[Nn]ltest\.exe/)
    pivot_on: host
    window: 1h
  - name: Outbound connections by the odd parent
    query: data_win_system_eventID:3 AND data_win_eventdata_initiated:true AND NOT data_win_eventdata_destinationIp:(10.* OR 192.168.* OR 127.*)
    pivot_on: host
    window: 2h
  - name: Process injection / remote thread
    query: data_win_system_eventID:8
    pivot_on: host
    window: 2h
  - name: Domain and AD reconnaissance commands
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Nn]ltest.*dclist.*/ OR /.*[Dd]squery.*/ OR /.*net.* group.*[Dd]omain.*/ OR /.*[Aa]dfind.*/)
    pivot_on: host
    window: 4h
  - name: Staging binaries after discovery
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(/.*[Aa]pp[Dd]ata.*\.(exe|dll)/ OR /.*[Tt]emp.*\.(exe|dll)/ OR /.*[Pp]rogram[Dd]ata.*\.(exe|dll)/)
    pivot_on: host
    window: 4h
