name: Remote Access Tool - ScreenConnect Server Web Shell Execution
id: b19146a3-25d4-41b4-928b-1e2a92641b1b
version: 1
schema_version: "1.0"
date: "2024-02-26"
author: Jason Rathbun (Blackpoint Cyber)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: b19146a3-25d4-41b4-928b-1e2a92641b1b
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential web shell execution from the ScreenConnect server process.
  MITRE ATT&CK: T1190.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_parentImage:
              value: "*\\\\ScreenConnect.Service.exe"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\cmd.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\csc.exe"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\ScreenConnect.Service.exe'; data_win_eventdata_image matches '*\cmd.exe';
  data_win_eventdata_image matches '*\csc.exe'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://blackpointcyber.com/resources/blog/breaking-through-the-screen/
  - https://www.connectwise.com/company/trust/security-bulletins/connectwise-screenconnect-23.9.8
  - https://attack.mitre.org/techniques/T1190/

response:
  message: >
    Remote Access Tool - ScreenConnect Server Web Shell Execution detected on
    host $agent_name$. Matched data_win_eventdata_parentImage:
    $data_win_eventdata_parentImage$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1190
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1190
  custom_tags:
    - screenconnect
    - server
    - shell
    - process_creation
    - sysmon
    - initial_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ss][Cc][Rr][Ee][Ee][Nn][Cc][Oo][Nn][Nn][Ee][Cc][Tt]\.[Ss][Ee][Rr][Vv][Ii][Cc][Ee]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Ss][Cc]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: fa3c117a-bc0d-416e-a31b-0c0e80653efb
    name: Chopper Webshell Process Pattern
    reason: Generic webshell-spawned recon command pattern, same post-exploitation shape
  - id: 39ac1fb0-07f1-474b-b97e-c5c0eace0d79
    name: Potential MOVEit Transfer CVE-2023-34362 Exploitation - Dynamic Compilation Via Csc.EXE
    reason: Same csc.exe dynamic compilation tradecraft seen in web-server exploitation
  - id: 57bff678-25d1-4d6c-8211-8ca106d12053
    name: Remote Access Tool - ScreenConnect Execution
    reason: ScreenConnect software present on the host
  - id: 7b582f1a-b318-4c6a-bf4e-66fe49bf55a5
    name: Remote Access Tool - ScreenConnect Potential Suspicious Remote Command Execution
    reason: Client-side suspicious commands if attacker pushes agents to downstream hosts
  - id: 0649be4a-aeb0-45b0-b89e-7f1668f6d9c0
    name: IIS WebServer Log Deletion via CommandLine Utilities
    reason: ScreenConnect server runs behind IIS; attackers delete web logs after exploitation
  - id: c248c896-e412-4279-8c15-1c558067b6fa
    name: Enumerate All Information With Whoami.EXE
    reason: First recon command after a server foothold
  - id: 41243735-89a7-4c83-bcdd-570aa78f00a1
    name: Domain Controller Discovery with Nltest
    reason: Domain recon after server foothold
  - id: e32d4572-9826-4738-b651-95fa63747e8a
    name: Base64 Encoded PowerShell Command Detected
    reason: Encoded PowerShell payloads launched from the shell
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Children of ScreenConnect server service
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Ss]creen[Cc]onnect\.[Ss]ervice\.exe/
    pivot_on: host
    window: 6h
  - name: csc.exe compiling from temp
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*csc\.exe/ AND data_win_eventdata_commandLine:/.*([Tt]emp|[Aa]pp[Dd]ata|\.cs).*/
    pivot_on: host
    window: 6h
  - name: Recon commands
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(whoami|net1?|nltest|systeminfo|ipconfig)\.exe/
    pivot_on: host
    window: 2h
  - name: File drops of web content or binaries
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Ss]creen[Cc]onnect.*\.(aspx|ashx|cshtml|dll|exe)/
    pivot_on: host
    window: 24h
  - name: Download tooling from server
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(curl|certutil|bitsadmin|powershell)\.exe/ AND data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp].*/
    pivot_on: host
    window: 6h
