name: Windows Backup Deleted Via Wbadmin.EXE
id: 89f75308-5b1b-4390-b2d8-d6b2340efaf8
version: 1
schema_version: "1.0"
date: "2024-05-10"
author: frack113, Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 89f75308-5b1b-4390-b2d8-d6b2340efaf8
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the deletion of backups or system state backups via "wbadmin.exe".
  This technique is used by numerous ransomware families and actors. This may
  only be successful on server platforms that have Windows Backup enabled. MITRE
  ATT&CK: T1490.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\wbadmin.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "WBADMIN.EXE"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*delete *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*backup*"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_commandLine"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*keepVersions:0*"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\wbadmin.exe'; data_win_eventdata_originalFileName equals 'WBADMIN.EXE';
  data_win_eventdata_commandLine matches '*delete *', among other conditions.

known_false_positives: >
  Legitimate backup activity from administration scripts and software. Baseline
  expected activity in your environment and tune this detection before relying
  on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1490/T1490.md#atomic-test-5---windows---delete-volume-shadow-copies-via-wmi-with-powershell
  - https://github.com/albertzsigovits/malware-notes/blob/558898932c1579ff589290092a2c8febefc3a4c9/Ransomware/Lockbit.md
  - https://www.sentinelone.com/labs/ranzy-ransomware-better-encryption-among-new-features-of-thunderx-derivative/
  - https://www.trendmicro.com/vinfo/us/security/news/cybercrime-and-digital-threats/ransomware-report-avaddon-and-new-techniques-emerge-industrial-sector-targeted
  - https://www.trendmicro.com/content/dam/trendmicro/global/en/research/24/b/lockbit-attempts-to-stay-afloat-with-a-new-version/technical-appendix-lockbit-ng-dev-analysis.pdf
  - https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/wbadmin-delete-systemstatebackup
  - https://attack.mitre.org/techniques/T1490/

response:
  message: >
    Windows Backup Deleted Via Wbadmin.EXE detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1490
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1490
  custom_tags:
    - backup
    - deleted
    - wbadmin
    - process_creation
    - sysmon
    - impact
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ww][Bb][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ww][Bb][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Dd][Ee][Ll][Ee][Tt][Ee] .*/ AND data_win_eventdata_commandLine:/.*[Bb][Aa][Cc][Kk][Uu][Pp].*/ AND _exists_:data_win_eventdata_commandLine AND NOT (data_win_eventdata_commandLine:/.*[Kk][Ee][Ee][Pp][Vv][Ee][Rr][Ss][Ii][Oo][Nn][Ss]:0.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 639c9081-f482-47d3-a0bd-ddee3d4ecd76
    name: All Backups Deleted Via Wbadmin.EXE
    reason: Same tool, broader delete-catalog/backup form; ransomware commonly chains both to erase every restore point
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: Operators pair wbadmin backup deletion with vssadmin/wmic shadow copy deletion to remove local recovery points
  - id: 21ff4ca9-f13a-41ad-b828-0077b2af2e40
    name: Deletion of Volume Shadow Copies via WMI with PowerShell
    reason: Alternate shadow copy deletion path used in the same pre-encryption recovery-inhibition step
  - id: 1444443e-6757-43e4-9ea4-c8fc705f79a2
    name: Boot Configuration Tampering Via Bcdedit.EXE
    reason: bcdedit recoveryenabled/bootstatuspolicy changes disable Windows recovery right alongside backup deletion
  - id: c9fbe8e9-119d-40a6-9b59-dd58a5d84429
    name: Potential Ransomware or Unauthorized MBR Tampering Via Bcdedit.EXE
    reason: Boot-config tampering in the same ransomware prep phase
  - id: 9703792d-fd9a-456d-a672-ff92efe4806a
    name: Backup Catalog Deleted
    reason: Event-log record of the backup catalog deletion; confirms the wbadmin action actually took effect
  - id: 236e7c8e-c9d9-11eb-a824-acde48001122
    name: Disable Logs Using WevtUtil
    reason: Ransomware often clears or disables event logs after removing backups to hinder investigation
  - id: 4b046706-5789-4673-b111-66f25fe99534
    name: Deleted Data Overwritten Via Cipher.EXE
    reason: cipher /w wipes free space so deleted data cannot be carved; follow-on anti-recovery step
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Shadow copy deletion or resize on host
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_commandLine:/.*([Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn]).*/ AND data_win_eventdata_commandLine:/.*([Dd][Ee][Ll][Ee][Tt][Ee]|[Rr][Ee][Ss][Ii][Zz][Ee]).*/) OR (data_win_eventdata_commandLine:/.*([Ss][Hh][Aa][Dd][Oo][Ww][Cc][Oo][Pp][Yy]).*/ AND data_win_eventdata_commandLine:/.*([Dd][Ee][Ll][Ee][Tt][Ee]).*/) OR (data_win_eventdata_commandLine:/.*([Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn]|[Ww][Mm][Ii][Cc]|[Dd][Ii][Ss][Kk][Ss][Hh][Aa][Dd][Oo][Ww]).*/ AND data_win_eventdata_commandLine:/.*([Ss][Hh][Aa][Dd][Oo][Ww][Ss]|[Ss][Hh][Aa][Dd][Oo][Ww][Ss][Tt][Oo][Rr][Aa][Gg][Ee]).*/))
    pivot_on: host
    window: 2h
  - name: Boot recovery disabled via bcdedit
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Bb][Cc][Dd][Ee][Dd][Ii][Tt]).*/ AND data_win_eventdata_commandLine:/.*([Rr][Ee][Cc][Oo][Vv][Ee][Rr][Yy][Ee][Nn][Aa][Bb][Ll][Ee][Dd]|[Bb][Oo][Oo][Tt][Ss][Tt][Aa][Tt][Uu][Ss][Pp][Oo][Ll][Ii][Cc][Yy]|[Ii][Gg][Nn][Oo][Rr][Ee][Aa][Ll][Ll][Ff][Aa][Ii][Ll][Uu][Rr][Ee][Ss]|[Ss][Aa][Ff][Ee][Bb][Oo][Oo][Tt]).*/
    pivot_on: host
    window: 2h
  - name: Anti-recovery and log wiping tools
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_commandLine:/.*([Cc][Ii][Pp][Hh][Ee][Rr]).*/ AND data_win_eventdata_commandLine:/.*(\/[Ww]).*/) OR (data_win_eventdata_commandLine:/.*([Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll]).*/ AND data_win_eventdata_commandLine:/.*( [Cc][Ll] |[Cc][Ll][Ee][Aa][Rr]\-[Ll][Oo][Gg]).*/) OR (data_win_eventdata_commandLine:/.*([Ff][Ss][Uu][Tt][Ii][Ll]).*/ AND data_win_eventdata_commandLine:/.*([Dd][Ee][Ll][Ee][Tt][Ee][Jj][Oo][Uu][Rr][Nn][Aa][Ll]).*/))
    pivot_on: host
    window: 2h
  - name: Backup, database and security services stopped before encryption
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Nn][Ee][Tt] [Ss][Tt][Oo][Pp]|[Nn][Ee][Tt]1 [Ss][Tt][Oo][Pp]|[Ss][Cc] [Ss][Tt][Oo][Pp]|[Ss][Cc] [Cc][Oo][Nn][Ff][Ii][Gg]|[Tt][Aa][Ss][Kk][Kk][Ii][Ll][Ll]).*/ AND data_win_eventdata_commandLine:/.*([Vv][Ss][Ss]|[Ss][Qq][Ll]|[Vv][Ee][Ee][Aa][Mm]|[Bb][Aa][Cc][Kk][Uu][Pp]|[Ss][Oo][Pp][Hh][Oo][Ss]|[Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr]|[Mm][Yy][Ss][Qq][Ll]|[Ee][Xx][Cc][Hh][Aa][Nn][Gg][Ee]|[Aa][Cc][Rr][Oo][Nn][Ii][Ss]).*/
    pivot_on: host
    window: 2h
  - name: Ransom note dropped
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*([Rr][Ee][Aa][Dd][Mm][Ee]|[Dd][Ee][Cc][Rr][Yy][Pp][Tt]|[Hh][Oo][Ww]_[Tt][Oo]_[Rr][Ee][Ss][Tt][Oo][Rr][Ee]|[Rr][Ee][Ss][Tt][Oo][Rr][Ee]\-[Mm][Yy]\-[Ff][Ii][Ll][Ee][Ss]|[Rr][Ee][Cc][Oo][Vv][Ee][Rr]|[Rr][Aa][Nn][Ss][Oo][Mm]).*/ AND data_win_eventdata_targetFilename:/.*(\.[Tt][Xx][Tt]|\.[Hh][Tt][Aa]|\.[Hh][Tt][Mm][Ll]).*/
    pivot_on: host
    window: 4h
