name: Remote Access Tool - GoToAssist Execution
id: b6d98a4f-cef0-4abf-bbf6-24132854a83d
version: 1
schema_version: "1.0"
date: "2023-03-05"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: b6d98a4f-cef0-4abf-bbf6-24132854a83d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  An adversary may use legitimate desktop support and remote access software,
  such as Team Viewer, Go2Assist, LogMein, AmmyyAdmin, etc, to establish an
  interactive command and control channel to target systems within networks.
  These services are commonly used as legitimate technical support software, and
  may be allowed by application control within a target environment. Remote
  access tools like VNC, Ammyy, and Teamviewer are used frequently when compared
  with other legitimate software commonly used by adversaries. (Citation:
  Symantec Living off the Land). MITRE ATT&CK: T1219.002.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - term:
                  data_win_eventdata_description:
                    value: "GoTo Opener"
                    case_insensitive: true
              - term:
                  data_win_eventdata_product:
                    value: "GoTo Opener"
                    case_insensitive: true
              - term:
                  data_win_eventdata_company:
                    value: "LogMeIn, Inc."
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_description
    - data_win_eventdata_product
    - data_win_eventdata_company
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_description equals 'GoTo
  Opener'; data_win_eventdata_product equals 'GoTo Opener';
  data_win_eventdata_company equals 'LogMeIn, Inc.'.

known_false_positives: >
  Legitimate use. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1219/T1219.md#atomic-test-4---gotoassist-files-detected-test-on-windows
  - https://attack.mitre.org/techniques/T1219/002/

response:
  message: >
    Remote Access Tool - GoToAssist Execution detected on host $agent_name$.
    Matched data_win_eventdata_description: $data_win_eventdata_description$.
    Matched data_win_eventdata_product: $data_win_eventdata_product$. MITRE
    ATT&CK: T1219.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_description
      type: other
    - field: data_win_eventdata_product
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1219.002
  custom_tags:
    - gotoassist
    - process_creation
    - sysmon
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_description:/[Gg][Oo][Tt][Oo] [Oo][Pp][Ee][Nn][Ee][Rr]/ OR data_win_eventdata_product:/[Gg][Oo][Tt][Oo] [Oo][Pp][Ee][Nn][Ee][Rr]/ OR data_win_eventdata_company:/[Ll][Oo][Gg][Mm][Ee][Ii][Nn], [Ii][Nn][Cc]\./)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 5d756aee-ad3e-4306-ad95-cb1abec48de2
    name: GoToAssist Temporary Installation Artefact
    reason: Installation artefacts written when GoTo Opener stages the session.
  - id: 1a31b18a-f00c-4061-9900-f735b96c99fc
    name: Remote Access Tool Services Have Been Installed - System
    reason: GoToAssist/LogMeIn services registered after execution.
  - id: c8b00925-926c-47e3-beea-298fd563728e
    name: Remote Access Tool Services Have Been Installed - Security
    reason: Security-log view of the same service installs.
  - id: 4d07b1f4-cb00-4470-b9f8-b0191d48ff52
    name: DNS Query To Remote Access Software Domain From Non-Browser App
    reason: Agent resolving GoTo relay domains.
  - id: d85873ef-a0f8-4c48-a53a-6b621f11729d
    name: Remote Access Tool - LogMeIn Execution
    reason: Same LogMeIn vendor family; co-deployed or substituted RAT.
  - id: ee37eb7c-a4e7-4cd5-8fa4-efa27f1c3f31
    name: PUA - Ngrok Execution
    reason: Attackers pair RATs with tunnels as fallback C2.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: GoTo/LogMeIn binaries executing
    query: data_win_system_eventID:"1" AND (data_win_eventdata_company:/.*[Ll][Oo][Gg][Mm][Ee][Ii][Nn].*/ OR data_win_eventdata_description:/.*[Gg][Oo][Tt][Oo].*/ OR data_win_eventdata_image:/.*[Gg][Oo][Tt][Oo][Aa][Ss][Ss][Ii][Ss][Tt].*/)
    pivot_on: host
    window: 6h
  - name: GoTo/LogMeIn service installs
    query: data_win_system_eventID:"7045" AND (data_win_eventdata_serviceName:/.*[Gg][Oo][Tt][Oo].*/ OR data_win_eventdata_serviceName:/.*[Ll][Oo][Gg][Mm][Ee][Ii][Nn].*/ OR data_win_eventdata_serviceName:/.*[Ll][Mm][Ii].*/)
    pivot_on: host
    window: 24h
  - name: GoTo/LogMeIn relay DNS
    query: data_win_system_eventID:"22" AND (data_win_eventdata_queryName:/.*[Gg][Oo][Tt][Oo][Aa][Ss][Ss][Ii][Ss][Tt]\.[Cc][Oo][Mm]/ OR data_win_eventdata_queryName:/.*[Ll][Oo][Gg][Mm][Ee][Ii][Nn]\.[Cc][Oo][Mm]/ OR data_win_eventdata_queryName:/.*[Ll][Oo][Gg][Mm][Ee][Ii][Nn][Ii][Nn][Cc]\.[Cc][Oo][Mm]/ OR data_win_eventdata_queryName:/.*[Gg][Oo][Tt][Oo]\.[Cc][Oo][Mm]/)
    pivot_on: host
    window: 6h
  - name: GoTo artefacts written to disk
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*([Gg][Oo][Tt][Oo][Aa][Ss][Ss][Ii][Ss][Tt]|[Gg][Oo][Tt][Oo][Oo][Pp][Ee][Nn][Ee][Rr]).*/
    pivot_on: host
    window: 6h
  - name: Other remote-access tools executing on host
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Aa][Nn][Yy][Dd][Ee][Ss][Kk]|[Tt][Ee][Aa][Mm][Vv][Ii][Ee][Ww][Ee][Rr]|[Ss][Cc][Rr][Ee][Ee][Nn][Cc][Oo][Nn][Nn][Ee][Cc][Tt]|[Mm][Ee][Ss][Hh][Aa][Gg][Ee][Nn][Tt]|[Aa][Tt][Ee][Rr][Aa][Aa][Gg][Ee][Nn][Tt])[^\\]*\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 24h
