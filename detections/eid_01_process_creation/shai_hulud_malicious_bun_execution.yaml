name: Shai-Hulud Malicious Bun Execution
id: 5299fadf-f228-4526-8274-251db1960be9
version: 1
schema_version: "1.0"
date: "2025-11-25"
author: Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 5299fadf-f228-4526-8274-251db1960be9
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of `bun_environment.js` via the Bun runtime, a behavior
  associated with the Shai-Hulud "Second Coming" NPM supply chain attack. The
  malware uses a `setup_bun.js` script to install the Bun runtime if not
  present, and then executes the malicious `bun_environment.js` payload. MITRE
  ATT&CK: T1195.002, T1203.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_parentImage:
              value: "*\\\\node.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\bun.exe"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*bun_environment.js*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*https://github.com/actions/runner/releases/download/v2.330.0*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\node.exe'; data_win_eventdata_image matches '*\bun.exe';
  data_win_eventdata_commandLine matches '*bun_environment.js*', among other
  conditions.

known_false_positives: >
  Legitimate but uncommon use of files named `bun_environment.js` could trigger
  this rule. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.aikido.dev/blog/shai-hulud-strikes-again-hitting-zapier-ensdomains
  - https://www.wiz.io/blog/shai-hulud-2-0-ongoing-supply-chain-attack
  - https://github.com/asyncapi/cli/blob/2efa4dff59bc3d3cecdf897ccf178f99b115d63d/setup_bun.js
  - https://semgrep.dev/blog/2025/digging-for-secrets-sha1-hulud-the-second-coming-of-the-npm-worm/
  - https://attack.mitre.org/techniques/T1195/002/
  - https://attack.mitre.org/techniques/T1203/

response:
  message: >
    Shai-Hulud Malicious Bun Execution detected on host $agent_name$. Matched
    data_win_eventdata_parentImage: $data_win_eventdata_parentImage$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1195.002, T1203
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1195.002
    - T1203
  custom_tags:
    - hulud
    - process_creation
    - sysmon
    - execution
    - initial_access
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Nn][Oo][Dd][Ee]\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\[Bb][Uu][Nn]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*[Bb][Uu][Nn]_[Ee][Nn][Vv][Ii][Rr][Oo][Nn][Mm][Ee][Nn][Tt]\.[Jj][Ss].*/ OR data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp][Ss]:\/\/[Gg][Ii][Tt][Hh][Uu][Bb]\.[Cc][Oo][Mm]\/[Aa][Cc][Tt][Ii][Oo][Nn][Ss]\/[Rr][Uu][Nn][Nn][Ee][Rr]\/[Rr][Ee][Ll][Ee][Aa][Ss][Ee][Ss]\/[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd]\/[Vv]2\.330\.0.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 44030449-b0df-4c94-aae1-502359ab28ee
    name: PUA - TruffleHog Execution
    reason: Shai-Hulud runs TruffleHog to harvest secrets from the host after payload execution.
  - id: df1f26d3-bea7-4700-9ea2-ad3e990cf90e
    name: Node Process Executions
    reason: The node/npm install hook that spawns setup_bun.js and bun is the parent activity.
  - id: 8537c866-072e-460d-bfff-aaf39cbd73d3
    name: Potentially Suspicious Inline JavaScript Execution via NodeJS Binary
    reason: Node running malicious inline JS in the same supply-chain infection chain.
  - id: 6640f31c-01ad-49b5-beb5-83498a5cd8bd
    name: Potential Arbitrary Code Execution Via Node.EXE
    reason: Node launching arbitrary code, same precursor behaviour.
  - id: 5bac7a56-da88-4c27-922e-c81e113b20cb
    name: Github Self-Hosted Runner Execution
    reason: The payload registers a rogue self-hosted runner for persistent CI access.
  - id: f6c27ecc-d890-4452-80e6-2e274a10e097
    name: Axios NPM Compromise Indicators - Windows
    reason: Another npm supply-chain compromise with node-spawned malware; correlate across packages.
  - id: 271de298-cc0e-4842-acd8-079a0a99ea65
    name: Windows Suspicious Child Process from Node.js - React2Shell
    reason: Suspicious node-spawned children in the same family of behaviour.
  - id: 6d3a3952-6530-44a3-8554-cf17c116c615
    name: Potentially Suspicious JWT Token Search Via CLI
    reason: Token/secret hunting that follows credential-stealing payload execution.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Node/npm spawning bun or setup_bun
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*\\(node|npm)\.exe/ AND (data_win_eventdata_commandLine:/.*[Ss]etup_bun.*/ OR data_win_eventdata_image:/.*\\bun\.exe/)
    pivot_on: host
    window: 6h
  - name: Secret scanners and credential hunting
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*[Tt]ruffle[Hh]og.*/ OR data_win_eventdata_commandLine:/.*([Gg]itleaks|[Tt]ruffle[Hh]og|\.npmrc|[Gg][Hh]_[Tt][Oo][Kk][Ee][Nn]).*/)
    pivot_on: host
    window: 6h
  - name: GitHub runner and workflow persistence
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*actions\/runner.*/ OR /.*config\.cmd.*--url.*github.*/)
    pivot_on: host
    window: 6h
  - name: Outbound connections by node or bun
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*\\(node|bun)\.exe/ AND data_win_eventdata_initiated:true
    pivot_on: host
    window: 6h
  - name: Malicious payload file creation
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(/.*bun_environment\.js/ OR /.*setup_bun\.js/ OR /.*[Tt]ruffle[Hh]og.*/)
    pivot_on: host
    window: 6h
