name: PUA - Seatbelt Execution
id: 38646daa-e78f-4ace-9de0-55547b2d30da
version: 1
schema_version: "1.0"
date: "2023-02-04"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 38646daa-e78f-4ace-9de0-55547b2d30da
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of the PUA/Recon tool Seatbelt via PE information of
  command line parameters. MITRE ATT&CK: T1526, T1087, T1083.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\Seatbelt.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "Seatbelt.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_description:
                    value: "Seatbelt"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* DpapiMasterKeys*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* InterestingProcesses*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* InterestingFiles*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* CertificateThumbprints*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* ChromiumBookmarks*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* ChromiumHistory*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* ChromiumPresence*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* CloudCredentials*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* CredEnum*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* CredGuard*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* FirefoxHistory*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* ProcessCreationEvents*"
                    case_insensitive: true
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* -group=misc*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* -group=remote*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* -group=chromium*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* -group=slack*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* -group=system*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* -group=user*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* -group=all*"
                                case_insensitive: true
                        minimum_should_match: 1
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* -outputfile=*"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_description
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\Seatbelt.exe'; data_win_eventdata_originalFileName equals 'Seatbelt.exe';
  data_win_eventdata_description equals 'Seatbelt', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/GhostPack/Seatbelt
  - https://www.bluetangle.dev/2022/08/fastening-seatbelt-on-threat-hunting.html
  - https://attack.mitre.org/techniques/T1526/
  - https://attack.mitre.org/techniques/T1087/
  - https://attack.mitre.org/techniques/T1083/

response:
  message: >
    PUA - Seatbelt Execution detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1526, T1087, T1083
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1526
    - T1087
    - T1083
  custom_tags:
    - seatbelt
    - process_creation
    - sysmon
    - discovery
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ss][Ee][Aa][Tt][Bb][Ee][Ll][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ss][Ee][Aa][Tt][Bb][Ee][Ll][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_description:/[Ss][Ee][Aa][Tt][Bb][Ee][Ll][Tt]/ OR data_win_eventdata_commandLine:/.* [Dd][Pp][Aa][Pp][Ii][Mm][Aa][Ss][Tt][Ee][Rr][Kk][Ee][Yy][Ss].*/ OR data_win_eventdata_commandLine:/.* [Ii][Nn][Tt][Ee][Rr][Ee][Ss][Tt][Ii][Nn][Gg][Pp][Rr][Oo][Cc][Ee][Ss][Ss][Ee][Ss].*/ OR data_win_eventdata_commandLine:/.* [Ii][Nn][Tt][Ee][Rr][Ee][Ss][Tt][Ii][Nn][Gg][Ff][Ii][Ll][Ee][Ss].*/ OR data_win_eventdata_commandLine:/.* [Cc][Ee][Rr][Tt][Ii][Ff][Ii][Cc][Aa][Tt][Ee][Tt][Hh][Uu][Mm][Bb][Pp][Rr][Ii][Nn][Tt][Ss].*/ OR data_win_eventdata_commandLine:/.* [Cc][Hh][Rr][Oo][Mm][Ii][Uu][Mm][Bb][Oo][Oo][Kk][Mm][Aa][Rr][Kk][Ss].*/ OR data_win_eventdata_commandLine:/.* [Cc][Hh][Rr][Oo][Mm][Ii][Uu][Mm][Hh][Ii][Ss][Tt][Oo][Rr][Yy].*/ OR data_win_eventdata_commandLine:/.* [Cc][Hh][Rr][Oo][Mm][Ii][Uu][Mm][Pp][Rr][Ee][Ss][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.* [Cc][Ll][Oo][Uu][Dd][Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll][Ss].*/ OR data_win_eventdata_commandLine:/.* [Cc][Rr][Ee][Dd][Ee][Nn][Uu][Mm].*/ OR data_win_eventdata_commandLine:/.* [Cc][Rr][Ee][Dd][Gg][Uu][Aa][Rr][Dd].*/ OR data_win_eventdata_commandLine:/.* [Ff][Ii][Rr][Ee][Ff][Oo][Xx][Hh][Ii][Ss][Tt][Oo][Rr][Yy].*/ OR data_win_eventdata_commandLine:/.* [Pp][Rr][Oo][Cc][Ee][Ss][Ss][Cc][Rr][Ee][Aa][Tt][Ii][Oo][Nn][Ee][Vv][Ee][Nn][Tt][Ss].*/ OR ((data_win_eventdata_commandLine:/.* -[Gg][Rr][Oo][Uu][Pp]=[Mm][Ii][Ss][Cc].*/ OR data_win_eventdata_commandLine:/.* -[Gg][Rr][Oo][Uu][Pp]=[Rr][Ee][Mm][Oo][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.* -[Gg][Rr][Oo][Uu][Pp]=[Cc][Hh][Rr][Oo][Mm][Ii][Uu][Mm].*/ OR data_win_eventdata_commandLine:/.* -[Gg][Rr][Oo][Uu][Pp]=[Ss][Ll][Aa][Cc][Kk].*/ OR data_win_eventdata_commandLine:/.* -[Gg][Rr][Oo][Uu][Pp]=[Ss][Yy][Ss][Tt][Ee][Mm].*/ OR data_win_eventdata_commandLine:/.* -[Gg][Rr][Oo][Uu][Pp]=[Uu][Ss][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.* -[Gg][Rr][Oo][Uu][Pp]=[Aa][Ll][Ll].*/) AND data_win_eventdata_commandLine:/.* -[Oo][Uu][Tt][Pp][Uu][Tt][Ff][Ii][Ll][Ee]=.*/))

