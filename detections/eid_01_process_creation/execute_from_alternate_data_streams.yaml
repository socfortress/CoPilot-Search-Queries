name: Execute From Alternate Data Streams
id: 7f43c430-5001-4f8b-aaa9-c3b88f18fa5c
version: 1
schema_version: "1.0"
date: "2022-10-09"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 7f43c430-5001-4f8b-aaa9-c3b88f18fa5c
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution from an Alternate Data Stream (ADS). Adversaries may use
  NTFS file attributes to hide their malicious data in order to evade detection.
  MITRE ATT&CK: T1564.004.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*txt:*"
              case_insensitive: true
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*type *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine: "* > *"
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*makecab *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*.cab*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*reg *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* export *"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*regedit *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* /E *"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*esentutl *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* /y *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* /d *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* /o *"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*txt:*'; data_win_eventdata_commandLine matches '*type *';
  data_win_eventdata_commandLine matches '* > *', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1564.004/T1564.004.md
  - https://attack.mitre.org/techniques/T1564/004/

response:
  message: >
    Execute From Alternate Data Streams detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1564.004
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1564.004
  custom_tags:
    - execute
    - alternate
    - streams
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Tt][Xx][Tt]:.*/ AND ((data_win_eventdata_commandLine:/.*[Tt][Yy][Pp][Ee] .*/ AND data_win_eventdata_commandLine:/.* \> .*/) OR (data_win_eventdata_commandLine:/.*[Mm][Aa][Kk][Ee][Cc][Aa][Bb] .*/ AND data_win_eventdata_commandLine:/.*\.[Cc][Aa][Bb].*/) OR (data_win_eventdata_commandLine:/.*[Rr][Ee][Gg] .*/ AND data_win_eventdata_commandLine:/.* [Ee][Xx][Pp][Oo][Rr][Tt] .*/) OR (data_win_eventdata_commandLine:/.*[Rr][Ee][Gg][Ee][Dd][Ii][Tt] .*/ AND data_win_eventdata_commandLine:/.* \/[Ee] .*/) OR (data_win_eventdata_commandLine:/.*[Ee][Ss][Ee][Nn][Tt][Uu][Tt][Ll] .*/ AND data_win_eventdata_commandLine:/.* \/[Yy] .*/ AND data_win_eventdata_commandLine:/.* \/[Dd] .*/ AND data_win_eventdata_commandLine:/.* \/[Oo] .*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 45a594aa-1fbd-4972-a809-ff5a99dd81b8
    name: Run PowerShell Script from ADS
    reason: Direct ADS-hosted PowerShell execution; the stream this rule's writes may host.
  - id: 6b369ced-4b1d-48f1-b427-fdc0de0790bd
    name: Suspicious Diantz Alternate Data Stream Execution
    reason: Diantz packs payloads into an ADS then runs them; same hiding technique.
  - id: 4b13db67-0c45-40f1-aba8-66a1a7198a1e
    name: Suspicious Extrac32 Alternate Data Stream Execution
    reason: Extrac32 copies content into an ADS; precursor of stream execution.
  - id: 0b80ade5-6997-4b1d-99a1-71701778ea61
    name: Imports Registry Key From an ADS
    reason: 'Registry import from a stream: payload hidden in ADS used for config or persistence.'
  - id: 77946e79-97f1-45a2-84b4-f37b5c0d8682
    name: Suspicious Registry Modification From ADS Via Regini.EXE
    reason: Regini reading from a stream is a close variant of the same evasion.
  - id: 0900463c-b33b-49a8-be1d-552a3b553dae
    name: Potential Hidden Directory Creation Via NTFS INDEX_ALLOCATION Stream - CLI
    reason: Related NTFS stream abuse to hide files and directories.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Stream creation (Sysmon EID 15)
    query: data_win_system_eventID:15 AND NOT data_win_eventdata_targetFilename:/.*Zone\.Identifier.*/
    pivot_on: host
    window: 4h
  - name: Execution of a stream path
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*\.(txt|log|dat|jpg|png|doc[xm]?|xls[xm]?):[A-Za-z0-9_.]+.*/
    pivot_on: host
    window: 4h
  - name: Archive/copy tools writing to streams
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*(makecab|extrac32|expand|esentutl|diantz|certutil)\.exe/ AND data_win_eventdata_commandLine:/.*\.[A-Za-z0-9]{2,4}:[A-Za-z0-9_.]+.*/
    pivot_on: host
    window: 4h
  - name: Script engines running stream content
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*(wscript|cscript|mshta|powershell|wmic|rundll32)\.exe/ AND data_win_eventdata_commandLine:/.*:[A-Za-z0-9_.]+(\.(js|vbs|ps1|dll|exe|hta))?/
    pivot_on: host
    window: 4h
