name: Change Default File Association To Executable Via Assoc
id: ae6f14e6-14de-45b0-9f44-c0986f50dc89
version: 1
schema_version: "1.0"
date: "2023-03-06"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: ae6f14e6-14de-45b0-9f44-c0986f50dc89
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects when a program changes the default file association of any extension
  to an executable. When a file is opened, the default program used to open the
  file (also called the file association or handler) is checked. File
  association selections are stored in the Windows Registry and can be edited by
  users, administrators, or programs that have Registry access or by
  administrators using the built-in assoc utility. Applications can modify the
  file association for a given file extension to call an arbitrary program when
  a file with the given extension is opened. MITRE ATT&CK: T1546.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\cmd.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "Cmd.Exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*assoc *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*exefile*"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_commandLine"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.exe=exefile*"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches '*\cmd.exe';
  data_win_eventdata_originalFileName equals 'Cmd.Exe';
  data_win_eventdata_commandLine matches '*assoc *', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/assoc
  - https://attack.mitre.org/techniques/T1546/001/

response:
  message: >
    Change Default File Association To Executable Via Assoc detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1546.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1546.001
  custom_tags:
    - change
    - default
    - association
    - process_creation
    - sysmon
    - privilege_escalation
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Cc][Mm][Dd]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Aa][Ss][Ss][Oo][Cc] .*/ AND data_win_eventdata_commandLine:/.*[Ee][Xx][Ee][Ff][Ii][Ll][Ee].*/ AND _exists_:data_win_eventdata_commandLine AND NOT (data_win_eventdata_commandLine:/.*\.[Ee][Xx][Ee]=[Ee][Xx][Ee][Ff][Ii][Ll][Ee].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 44a22d59-b175-4f13-8c16-cbaef5b581ff
    name: New File Association Using Exefile
    reason: Registry-level view of the exefile association hijack that assoc writes.
  - id: Windows-New-Default-File-Association-Value-Set
    name: Windows New Default File Association Value Set
    reason: Registry value set confirming a new default file association.
  - id: windows-change-file-association-notepad-001
    name: Windows Change File Association Command To Notepad
    reason: Sibling file association change via command line on the same host.
  - id: 9e8894c0-0ae0-11ef-9d85-1f2942bec57c
    name: Suspicious Shell Open Command Registry Modification
    reason: Shell open command modification is the alternate handler hijack for persistence.
  - id: 152f3630-77c1-4284-bcc0-4cc68ab2f6e7
    name: Shell Open Registry Keys Manipulation
    reason: Shell Open registry manipulation underlies association-based persistence.
  - id: 24357373-078f-44ed-9ac4-6d334a668a11
    name: Direct Autorun Keys Modification
    reason: Direct autorun key modification is a typical companion persistence step.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Assoc and ftype handler changes
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Aa][Ss][Ss][Oo][Cc] \.|[Ff][Tt][Yy][Pp][Ee] ).*/
    pivot_on: host
    window: 6h
  - name: Shell open and file extension registry writes
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*(\\[Ss][Hh][Ee][Ll][Ll]\\[Oo][Pp][Ee][Nn]\\[Cc][Oo][Mm][Mm][Aa][Nn][Dd]|[Ff][Ii][Ll][Ee][Ee][Xx][Tt][Ss]|\\[Cc][Ll][Aa][Ss][Ss][Ee][Ss]\\\.).*/
    pivot_on: host
    window: 6h
  - name: Executables dropped in user-writable paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\|\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\|\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\|\\[Tt][Ee][Mm][Pp]\\).*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Bb][Aa][Tt]|[Pp][Ss]1|[Vv][Bb][Ss]|[Jj][Ss])/
    pivot_on: host
    window: 6h
  - name: Other persistence via reg or schtasks
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Rr][Ee][Gg] [Aa][Dd][Dd]|[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss] \/[Cc][Rr][Ee][Aa][Tt][Ee]|[Ss][Cc] [Cc][Rr][Ee][Aa][Tt][Ee]|[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn]).*/
    pivot_on: host
    window: 6h
