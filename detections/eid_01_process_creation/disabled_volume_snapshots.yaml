name: Disabled Volume Snapshots
id: dee4af55-1f22-4e1d-a9d2-4bdc7ecb472a
version: 1
schema_version: "1.0"
date: "2023-12-15"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: dee4af55-1f22-4e1d-a9d2-4bdc7ecb472a
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects commands that temporarily turn off Volume Snapshots. MITRE ATT&CK:
  T1685.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*\\\\Services\\\\VSS\\\\Diag*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*/d Disabled*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*\Services\VSS\Diag*'; data_win_eventdata_commandLine matches '*/d
  Disabled*'.

known_false_positives: >
  Legitimate administration. Baseline expected activity in your environment and
  tune this detection before relying on it for automated response.

references:
  - https://twitter.com/0gtweet/status/1354766164166115331
  - https://attack.mitre.org/techniques/T1685/

response:
  message: >
    Disabled Volume Snapshots detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1685
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685
  custom_tags:
    - volume
    - snapshots
    - process_creation
    - sysmon
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\[Vv][Ss][Ss]\\[Dd][Ii][Aa][Gg].*/ AND data_win_eventdata_commandLine:/.*\/[Dd] [Dd][Ii][Ss][Aa][Bb][Ll][Ee][Dd].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: Shadow copy deletion is the direct follow-on once snapshots are disabled in ransomware prep.
  - id: 21ff4ca9-f13a-41ad-b828-0077b2af2e40
    name: Deletion of Volume Shadow Copies via WMI with PowerShell
    reason: WMI/PowerShell shadow copy deletion is an alternate path to the same recovery destruction.
  - id: 639c9081-f482-47d3-a0bd-ddee3d4ecd76
    name: All Backups Deleted Via Wbadmin.EXE
    reason: wbadmin backup deletion removes the remaining restore points after snapshots are disabled.
  - id: 9703792d-fd9a-456d-a672-ff92efe4806a
    name: Backup Catalog Deleted
    reason: Backup catalog deleted confirms backup destruction on the same host.
  - id: 1444443e-6757-43e4-9ea4-c8fc705f79a2
    name: Boot Configuration Tampering Via Bcdedit.EXE
    reason: bcdedit recovery tampering accompanies snapshot disabling in ransomware playbooks.
  - id: c9fbe8e9-119d-40a6-9b59-dd58a5d84429
    name: Potential Ransomware or Unauthorized MBR Tampering Via Bcdedit.EXE
    reason: MBR/boot tampering via bcdedit is a further inhibit-recovery step.
  - id: b28e58e4-2a72-4fae-bdee-0fbe904db642
    name: Windows Defender Real-time Protection Disabled
    reason: Defender real-time protection is typically disabled right before encryption.
  - id: 57b649ef-ff42-4fb0-8bf6-62da243a1708
    name: Windows Defender Threat Detected
    reason: A Defender threat detection shortly before suggests the payload that triggered recovery inhibition.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Shadow copy deletion/resize commands
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*vssadmin.*(delete|resize).*/ OR /.*wmic.*shadowcopy.*delete.*/ OR /.*[Gg]et-[Ww]mi[Oo]bject.*[Ss]hadow[Cc]opy.*/ OR /.*diskshadow.*/)
    pivot_on: host
    window: 6h
  - name: Backup and boot recovery destruction
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*wbadmin.*delete.*/ OR /.*bcdedit.*(recoveryenabled|bootstatuspolicy).*/ OR /.*wevtutil.*cl.*/)
    pivot_on: host
    window: 6h
  - name: Stopping VSS or backup services
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(net|sc)(\.exe)? +(stop|config).*(VSS|vss|SQL|[Vv]eeam|[Bb]ackup).*/
    pivot_on: host
    window: 6h
  - name: Ransom notes and mass file drops
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(/.*[Rr]ead[Mm]e.*\.txt/ OR /.*[Dd]ecrypt.*/ OR /.*[Rr]estore[-_][Ff]iles.*/ OR /.*HOW_TO.*/)
    pivot_on: host
    window: 6h
  - name: Registry writes to VSS service keys
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*Services.*VSS.*/
    pivot_on: host
    window: 6h
