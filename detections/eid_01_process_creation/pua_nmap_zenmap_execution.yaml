name: PUA - Nmap/Zenmap Execution
id: f6ecd1cf-19b8-4488-97f6-00f0924991a3
version: 1
schema_version: "1.0"
date: "2023-12-11"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: f6ecd1cf-19b8-4488-97f6-00f0924991a3
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects usage of namp/zenmap. Adversaries may attempt to get a listing of
  services running on remote hosts, including those that may be vulnerable to
  remote software exploitation. MITRE ATT&CK: T1046.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\nmap.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\zennmap.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "nmap.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "zennmap.exe"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\nmap.exe'; data_win_eventdata_image matches '*\zennmap.exe';
  data_win_eventdata_originalFileName equals 'nmap.exe', among other conditions.

known_false_positives: >
  Legitimate administrator activity. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://nmap.org/
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1046/T1046.md#atomic-test-3---port-scan-nmap-for-windows
  - https://attack.mitre.org/techniques/T1046/

response:
  message: >
    PUA - Nmap/Zenmap Execution detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1046
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1046
  custom_tags:
    - zenmap
    - process_creation
    - sysmon
    - discovery
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Nn][Mm][Aa][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Zz][Ee][Nn][Nn][Mm][Aa][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Nn][Mm][Aa][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Zz][Ee][Nn][Nn][Mm][Aa][Pp]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: bef37fa2-f205-4a7b-b484-0759bfd5f86f
    name: PUA - Advanced IP Scanner Execution
    reason: Alternative network scanner; operators run several during internal discovery.
  - id: 54773c5f-f1cc-4703-9126-2f797d96a69d
    name: PUA - Advanced Port Scanner Execution
    reason: 'Same goal: enumerating open services on remote hosts.'
  - id: 4fd6b1c7-19b8-4488-97f6-00f0924991a3
    name: PUA - NimScan Execution
    reason: Another port scanner used in the same recon phase.
  - id: 2cf5cc25-f39a-436d-a790-4857e5995ede
    name: Network Connection Discovery With Netstat
    reason: Local connection discovery typically accompanies remote scanning.
  - id: 514e7e3e-b3b4-4a67-af60-be20f139198b
    name: PUA - AdFind.EXE Execution
    reason: AD enumeration is commonly paired with port scanning to map targets.
  - id: f376c8a7-a2d0-4ddc-aa0c-16c17236d962
    name: HackTool - Bloodhound/Sharphound Execution
    reason: Scan results feed lateral movement planning alongside SharpHound.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Nmap scan options and scripts
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Nn][Mm][Aa][Pp].* -s[STUVAN].*/ OR /.*[Nn][Mm][Aa][Pp].* -[Pp][Nn].*/ OR /.*[Nn][Mm][Aa][Pp].* --script.*/ OR /.*[Nn][Mm][Aa][Pp].* -p.*/)
    pivot_on: host
    window: 6h
  - name: Fan-out connections to common service ports
    query: data_win_system_eventID:3 AND data_win_eventdata_destinationPort:(22 OR 135 OR 139 OR 445 OR 3389 OR 5985 OR 1433)
    pivot_on: host
    window: 2h
  - name: Other discovery commands on host
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Nn][Ee][Tt][Ss][Tt][Aa][Tt].*/ OR /.*[Aa][Rr][Pp] -[Aa].*/ OR /.*[Nn][Ee][Tt] [Vv][Ii][Ee][Ww].*/ OR /.*[Nn][Ll][Tt][Ee][Ss][Tt].*/)
    pivot_on: host
    window: 6h
  - name: Npcap or WinPcap driver install
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Nn][Pp][Cc][Aa][Pp].*/ OR /.*[Ww][Ii][Nn][Pp][Cc][Aa][Pp].*/)
    pivot_on: host
    window: 24h
  - name: Remote execution follow-on to scanned hosts
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Mm][Ss][Tt][Ss][Cc].*/ OR /.*[Pp][Ss][Ee][Xx][Ee][Cc].*/ OR /.*[Ww][Mm][Ii][Cc] \/[Nn][Oo][Dd][Ee].*/)
    pivot_on: host
    window: 6h
