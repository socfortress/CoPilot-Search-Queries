name: Suspicious Process Parents
id: cbec226f-63d9-4eca-9f52-dfb6652f24df
version: 1
schema_version: "1.0"
date: "2022-09-08"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: cbec226f-63d9-4eca-9f52-dfb6652f24df
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious parent processes that should not have any children or
  should only have a single possible child program. MITRE ATT&CK: T1036.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\minesweeper.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\winver.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\bitsadmin.exe"
                    case_insensitive: true
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_parentImage:
                                value: "*\\\\csrss.exe"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_parentImage:
                                value: "*\\\\certutil.exe"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_parentImage:
                                value: "*\\\\eventvwr.exe"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_parentImage:
                                value: "*\\\\calc.exe"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_parentImage:
                                value: "*\\\\notepad.exe"
                                case_insensitive: true
                        minimum_should_match: 1
                    - bool:
                        must_not:
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*\\\\WerFault.exe"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*\\\\wermgr.exe"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*\\\\conhost.exe"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*\\\\mmc.exe"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*\\\\win32calc.exe"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*\\\\notepad.exe"
                                      case_insensitive: true
                                - bool:
                                    must_not:
                                      - exists:
                                          field: "data_win_eventdata_image"
                              minimum_should_match: 1
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\minesweeper.exe'; data_win_eventdata_parentImage matches '*\winver.exe';
  data_win_eventdata_parentImage matches '*\bitsadmin.exe', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/x86matthew/status/1505476263464607744?s=12
  - https://svch0st.medium.com/stats-from-hunting-cobalt-strike-beacons-c17e56255f9b
  - https://attack.mitre.org/techniques/T1036/

response:
  message: >
    Suspicious Process Parents detected on host $agent_name$. Matched
    data_win_eventdata_parentImage: $data_win_eventdata_parentImage$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1036
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1036
  custom_tags:
    - parents
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Mm][Ii][Nn][Ee][Ss][Ww][Ee][Ee][Pp][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ww][Ii][Nn][Vv][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]/ OR ((data_win_eventdata_parentImage:/.*\\[Cc][Ss][Rr][Ss][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ee][Vv][Ee][Nn][Tt][Vv][Ww][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Cc][Aa][Ll][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Nn][Oo][Tt][Ee][Pp][Aa][Dd]\.[Ee][Xx][Ee]/) AND NOT (data_win_eventdata_image:/.*\\[Ww][Ee][Rr][Ff][Aa][Uu][Ll][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ee][Rr][Mm][Gg][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Oo][Nn][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Mm][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ii][Nn]32[Cc][Aa][Ll][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Nn][Oo][Tt][Ee][Pp][Aa][Dd]\.[Ee][Xx][Ee]/ OR NOT _exists_:data_win_eventdata_image)))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: cbb9e3d1-2386-4e59-912e-62f1484f7a89
    name: Conhost Spawned By Uncommon Parent Process
    reason: 'Same family: system processes appearing under parents they never legitimately have.'
  - id: be344333-921d-4c4d-8bb8-e584cf584780
    name: Potentially Suspicious Event Viewer Child Process
    reason: eventvwr.exe as a parent is a listed trigger and a classic UAC bypass hijack.
  - id: 52ff7941-8211-46f9-84f8-9903efb7077d
    name: HackTool - PPID Spoofing SelectMyParent Tool Execution
    reason: Odd parents are often the artifact of parent PID spoofing.
  - id: d522eca2-2973-4391-a3e0-ef0374321dae
    name: Abused Debug Privilege by Arbitrary Parent Processes
    reason: Another anomalous parent-child chain tied to privilege abuse / injection.
  - id: c248c896-e412-4279-8c15-1c558067b6fa
    name: Enumerate All Information With Whoami.EXE
    reason: Injected or hijacked benign parents (notepad, calc) commonly run recon next.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Remote thread / process access into the odd parent
    query: (data_win_system_eventID:8 OR data_win_system_eventID:10) AND data_win_eventdata_targetImage:(*notepad.exe OR *calc.exe OR *winver.exe OR *eventvwr.exe OR *csrss.exe OR *mmc.exe OR *werfault.exe)
    pivot_on: host
    window: 2h
  - name: Network connections from the benign-looking parent
    query: data_win_system_eventID:3 AND data_win_eventdata_image:(*notepad.exe OR *calc.exe OR *winver.exe OR *minesweeper.exe OR *bitsadmin.exe OR *certutil.exe)
    pivot_on: host
    window: 2h
  - name: Child shells and LOLBins from unusual parents
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:(*notepad.exe OR *calc.exe OR *winver.exe OR *eventvwr.exe OR *werfault.exe OR *wermgr.exe) AND data_win_eventdata_image:(*cmd.exe OR *powershell.exe OR *rundll32.exe OR *regsvr32.exe OR *mshta.exe)
    pivot_on: host
    window: 2h
  - name: Registry hijack of mscfile/ms-settings handler
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*([Mm]sc[Ff]ile|ms-settings).*[Cc]ommand.*/
    pivot_on: host
    window: 2h
