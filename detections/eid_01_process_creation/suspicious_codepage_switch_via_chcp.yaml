name: Suspicious CodePage Switch Via CHCP
id: c7942406-33dd-4377-a564-0f62db0593a3
version: 1
schema_version: "1.0"
date: "2023-03-07"
author: Florian Roth (Nextron Systems), Jonhnathan Ribeiro, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: c7942406-33dd-4377-a564-0f62db0593a3
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a code page switch in command line or batch scripts to a rare
  language. MITRE ATT&CK: T1036.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\chcp.com"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine: "* 936"
              - wildcard:
                  data_win_eventdata_commandLine: "* 1258"
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\chcp.com'; data_win_eventdata_commandLine matches '* 936';
  data_win_eventdata_commandLine matches '* 1258'.

known_false_positives: >
  Administrative activity (adjust code pages according to your organization's
  region). Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://learn.microsoft.com/en-us/windows/win32/intl/code-page-identifiers
  - https://twitter.com/cglyer/status/1183756892952248325
  - https://attack.mitre.org/techniques/T1036/

response:
  message: >
    Suspicious CodePage Switch Via CHCP detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1036
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1036
  custom_tags:
    - codepage
    - switch
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Cc][Hh][Cc][Pp]\.[Cc][Oo][Mm]/ AND (data_win_eventdata_commandLine:/.* 936/ OR data_win_eventdata_commandLine:/.* 1258/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7090adee-82e2-4269-bd59-80691e7c6338
    name: Console CodePage Lookup Via CHCP
    reason: Same binary used for codepage recon; malware often queries then sets the locale.
  - id: c4db14d9-7909-48b4-a054-aa14d89dbb19
    name: Malicious PowerShell Process - Encoded Command
    reason: CHCP switches appear in obfuscated batch/PowerShell loaders handling non-ASCII payloads.
  - id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
    name: PowerShell Download and Execution Cradles
    reason: Batch droppers that switch codepage typically go on to download a payload.
  - id: cea72823-df4d-4567-950c-0b579eaf0846
    name: Potential Dropper Script Execution Via WScript/CScript/MSHTA
    reason: Script droppers run cmd with chcp as part of their launch chain.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Batch and cmd activity around chcp
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*cmd\.exe/ AND (data_win_eventdata_commandLine:/.*\.bat.*/ OR data_win_eventdata_commandLine:/.*\.cmd.*/)
    pivot_on: host
    window: 2h
  - name: Other chcp invocations
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*chcp\.com/
    pivot_on: host
    window: 4h
  - name: Download or decode tooling run after the switch
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*certutil.*-decode.*/ OR data_win_eventdata_commandLine:/.*bitsadmin.*/ OR data_win_eventdata_commandLine:/.*curl.*/ OR data_win_eventdata_commandLine:/.*[Dd]ownload[Ss]tring.*/)
    pivot_on: host
    window: 2h
  - name: Persistence via scheduled task or Run key
    query: (data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*schtasks.*[Cc]reate.*/) OR (data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*CurrentVersion\\Run.*/)
    pivot_on: host
    window: 4h
