name: HackTool - Pypykatz Credentials Dumping Activity
id: a29808fd-ef50-49ff-9c7a-59a9b040b404
version: 1
schema_version: "1.0"
date: "2023-02-05"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: a29808fd-ef50-49ff-9c7a-59a9b040b404
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the usage of "pypykatz" to obtain stored credentials. Adversaries may
  attempt to extract credential material from the Security Account Manager (SAM)
  database through Windows registry where the SAM database is stored. MITRE
  ATT&CK: T1003.002.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\pypykatz.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\python.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*live*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*registry*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\pypykatz.exe'; data_win_eventdata_image matches '*\python.exe';
  data_win_eventdata_commandLine matches '*live*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/skelsec/pypykatz
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1003.002/T1003.002.md#atomic-test-2---registry-parse-with-pypykatz
  - https://attack.mitre.org/techniques/T1003/002/

response:
  message: >
    HackTool - Pypykatz Credentials Dumping Activity detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
    MITRE ATT&CK: T1003.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.002
  custom_tags:
    - hacktool
    - pypykatz
    - credentials
    - process_creation
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Pp][Yy][Pp][Yy][Kk][Aa][Tt][Zz]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Yy][Tt][Hh][Oo][Nn]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Ll][Ii][Vv][Ee].*/ AND data_win_eventdata_commandLine:/.*[Rr][Ee][Gg][Ii][Ss][Tt][Rr][Yy].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: fd877b94-9bb5-4191-bb25-d79cbd93c167
    name: Dumping of Sensitive Hives Via Reg.EXE
    reason: Same SAM/SYSTEM/SECURITY hive theft done offline via reg save; pypykatz registry parses those hives
  - id: 1af57a4b-460a-4738-9034-db68b880c665
    name: PowerShell SAM Copy
    reason: Alternate hive-copy method preceding or substituting for pypykatz live registry
  - id: d372f928-ce4f-11eb-a762-acde48001122
    name: Esentutl SAM Copy
    reason: Alternate living-off-the-land hive copy feeding offline parsing
  - id: 4e87b8e2-2ee9-4b2a-a715-4727d297ece0
    name: Potential SAM Database Dump
    reason: SAM hive files written to disk are the artifacts pypykatz reads
  - id: 6ea858a8-ba71-4a12-b2cc-5d83312404c7
    name: HackTool - Typical HiveNightmare SAM File Export
    reason: Shadow-copy hive export yields the same SAM/SYSTEM files for pypykatz
  - id: 5ef9853e-4d0e-4a70-846f-a9ca37d876da
    name: Potential Credential Dumping Activity Via LSASS
    reason: Operators using pypykatz usually also try LSASS memory credential theft on the same host
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: Companion credential tool commonly run alongside or after pypykatz
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Registry hive save/export commands
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Rr][Ee][Gg].*([Ss][Aa][Vv][Ee]|[Ee][Xx][Pp][Oo][Rr][Tt]).*([Ss][Aa][Mm]|[Ss][Yy][Ss][Tt][Ee][Mm]|[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]).*/
    pivot_on: host
    window: 2h
  - name: SAM/SYSTEM/SECURITY hive files created
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Cc]onfig\\(sam|system|security)|.*\.(save|hive)/
    pivot_on: host
    window: 2h
  - name: LSASS process access
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Pip install of credential libraries / python minidump tooling
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Pp][Ii][Pp]3? [Ii][Nn][Ss][Tt][Aa][Ll][Ll]|[Pp][Yy][Pp][Yy][Kk][Aa][Tt][Zz]|[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp]).*/
    pivot_on: host
    window: 6h
  - name: Archiving of dumped output
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*(7z|[Rr][Aa][Rr]|[Cc]ompress-[Aa]rchive).*\.(txt|json|dmp|hive)/
    pivot_on: host
    window: 4h
