name: HackTool - Pypykatz Credentials Dumping Activity
id: a29808fd-ef50-49ff-9c7a-59a9b040b404
version: 1
schema_version: "1.0"
date: "2023-02-05"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: a29808fd-ef50-49ff-9c7a-59a9b040b404
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the usage of "pypykatz" to obtain stored credentials. Adversaries may
  attempt to extract credential material from the Security Account Manager (SAM)
  database through Windows registry where the SAM database is stored. MITRE
  ATT&CK: T1003.002.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\pypykatz.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\python.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*live*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*registry*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\pypykatz.exe'; data_win_eventdata_image matches '*\python.exe';
  data_win_eventdata_commandLine matches '*live*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/skelsec/pypykatz
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1003.002/T1003.002.md#atomic-test-2---registry-parse-with-pypykatz
  - https://attack.mitre.org/techniques/T1003/002/

response:
  message: >
    HackTool - Pypykatz Credentials Dumping Activity detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
    MITRE ATT&CK: T1003.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.002
  custom_tags:
    - hacktool
    - pypykatz
    - credentials
    - process_creation
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Pp][Yy][Pp][Yy][Kk][Aa][Tt][Zz]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Yy][Tt][Hh][Oo][Nn]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Ll][Ii][Vv][Ee].*/ AND data_win_eventdata_commandLine:/.*[Rr][Ee][Gg][Ii][Ss][Tt][Rr][Yy].*/

