name: Windows Files and Dirs Access Rights Modification Via Icacls
id: windows-files-dirs-access-rights-icacls-001
version: 1
schema_version: "1.0"
date: "2026-02-23"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects icacls.exe, cacls.exe, or xcacls.exe modifying file/directory access 
  rights with permission flags (:R, :W, :F, :C, :N, /P, /E). Used by Amadey 
  malware and coinminers to weaken security controls and maintain access.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image: "*\\\\icacls.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\\\cacls.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\\\xcacls.exe"
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine: "*:F*"
              - wildcard:
                  data_win_eventdata_commandLine: "*:W*"
              - wildcard:
                  data_win_eventdata_commandLine: "*:R*"
              - wildcard:
                  data_win_eventdata_commandLine: "*:C*"
              - wildcard:
                  data_win_eventdata_commandLine: "*:N*"
              - wildcard:
                  data_win_eventdata_commandLine: "*/grant*"
              - wildcard:
                  data_win_eventdata_commandLine: "*/deny*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-23 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-23 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Windows endpoints with Sysmon 
  installed and configured to log process creation events (EventID 1) with full 
  command-line arguments.

known_false_positives: >
  Administrative scripts may use icacls for permission management. Filter by 
  user context and target paths.

references:
  - https://attack.mitre.org/techniques/T1222/001/
  - https://malpedia.caad.fkie.fraunhofer.de/details/win.amadey

response:
  message: >
    Access rights modified via icacls on $agent_name$. 
    Command: $data_win_eventdata_commandLine$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1222.001
  risk_score: 49
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 49
  threat_objects: []

tags:
  analytic_story:
    - Amadey
    - Defense Evasion or Unauthorized Access Via SDDL Tampering
  asset_type: Endpoint
  mitre_attack_id:
    - T1222.001
  custom_tags:
    - icacls
    - access_rights
    - permission_modification
    - defense_evasion
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*icacls\.exe/ OR data_win_eventdata_image:/.*cacls\.exe/ OR data_win_eventdata_image:/.*xcacls\.exe/) AND (data_win_eventdata_commandLine:/.*:F.*/ OR data_win_eventdata_commandLine:/.*:W.*/ OR data_win_eventdata_commandLine:/.*:R.*/ OR data_win_eventdata_commandLine:/.*:C.*/ OR data_win_eventdata_commandLine:/.*:N.*/ OR data_win_eventdata_commandLine:/.*\/grant.*/ OR data_win_eventdata_commandLine:/.*\/deny.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: cf8d753e-a8fe-11eb-8f58-acde48001122
    name: Icacls Deny Command
    reason: Deny ACEs set via icacls are the lock-out variant of the same permission tampering, used to block defenders or users from files.
  - id: b1b1e316-accc-11eb-a9b4-acde48001122
    name: ICACLS Grant Command
    reason: Grant-flavoured icacls on the same host shows the actor widening access to staged payloads or protected paths.
  - id: 4ae81040-fc1c-4249-bfa3-938d260214d9
    name: Use Icacls to Hide File to Everyone
    reason: Denying Everyone on a dropped file hides persistence/payload files; commonly paired with ACL changes by Amadey-style loaders.
  - id: fa7ca5c6-c9d8-11eb-bce9-acde48001122
    name: Permission Modification using Takeown App
    reason: 'takeown typically precedes icacls: ownership is seized first, then ACLs rewritten on protected files.'
  - id: 554601fb-9b71-4bcc-abf4-21a611be4fde
    name: Suspicious Recursive Takeown
    reason: Recursive ownership grabs on directories are the bulk-access step before mass icacls changes, as in ransomware and miner prep.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Ownership seizure and ACL commands
    query: data_win_system_eventID:1 AND data_win_eventdata_image:(/.*\\[Tt]akeown\.exe/ OR /.*\\[Ii]cacls\.exe/ OR /.*\\[Cc]acls\.exe/)
    pivot_on: host
    window: 2h
  - name: Executables launched from user-writable paths
    query: data_win_system_eventID:1 AND data_win_eventdata_image:(/.*\\[Aa]pp[Dd]ata\\.*\.[Ee][Xx][Ee]/ OR /.*\\[Tt]emp\\.*\.[Ee][Xx][Ee]/ OR /.*\\[Pp]rogram[Dd]ata\\.*\.[Ee][Xx][Ee]/)
    pivot_on: host
    window: 2h
  - name: Persistence via schtasks or Run keys
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*\\[Ss]chtasks\.exe/ OR data_win_eventdata_commandLine:/.*[Cc]urrent[Vv]ersion\\[Rr]un.*/) AND data_win_eventdata_commandLine:/.*([Cc]reate|[Aa]dd).*/
    pivot_on: host
    window: 4h
  - name: Defender or firewall weakening
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*[Ss]et-[Mm]p[Pp]reference.*/ OR data_win_eventdata_commandLine:/.*[Aa]dd-[Mm]p[Pp]reference.*[Ee]xclusion.*/ OR data_win_eventdata_commandLine:/.*[Nn]etsh.*[Aa]dv[Ff]irewall.*/)
    pivot_on: host
    window: 4h
  - name: Network connections by binaries in user-writable paths
    query: data_win_system_eventID:3 AND data_win_eventdata_image:(/.*\\[Aa]pp[Dd]ata\\.*/ OR /.*\\[Tt]emp\\.*/)
    pivot_on: host
    window: 4h
