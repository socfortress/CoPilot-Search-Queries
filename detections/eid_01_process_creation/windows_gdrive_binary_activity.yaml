name: Windows Files and Dirs Access Rights Modification Via Icacls
id: windows-files-dirs-access-rights-icacls-001
version: 1
schema_version: "1.0"
date: "2026-02-23"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects icacls.exe, cacls.exe, or xcacls.exe modifying file/directory access 
  rights with permission flags (:R, :W, :F, :C, :N, /P, /E). Used by Amadey 
  malware and coinminers to weaken security controls and maintain access.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image: "*\\\\icacls.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\\\cacls.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\\\xcacls.exe"
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine: "*:F*"
              - wildcard:
                  data_win_eventdata_commandLine: "*:W*"
              - wildcard:
                  data_win_eventdata_commandLine: "*:R*"
              - wildcard:
                  data_win_eventdata_commandLine: "*:C*"
              - wildcard:
                  data_win_eventdata_commandLine: "*:N*"
              - wildcard:
                  data_win_eventdata_commandLine: "*/grant*"
              - wildcard:
                  data_win_eventdata_commandLine: "*/deny*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-23 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-23 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Windows endpoints with Sysmon 
  installed and configured to log process creation events (EventID 1) with full 
  command-line arguments.

known_false_positives: >
  Administrative scripts may use icacls for permission management. Filter by 
  user context and target paths.

references:
  - https://attack.mitre.org/techniques/T1222/001/
  - https://malpedia.caad.fkie.fraunhofer.de/details/win.amadey

response:
  message: >
    Access rights modified via icacls on $agent_name$. 
    Command: $data_win_eventdata_commandLine$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1222.001
  risk_score: 49
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 49
  threat_objects: []

tags:
  analytic_story:
    - Amadey
    - Defense Evasion or Unauthorized Access Via SDDL Tampering
  asset_type: Endpoint
  mitre_attack_id:
    - T1222.001
  custom_tags:
    - icacls
    - access_rights
    - permission_modification
    - defense_evasion
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*icacls\.exe/ OR data_win_eventdata_image:/.*cacls\.exe/ OR data_win_eventdata_image:/.*xcacls\.exe/) AND (data_win_eventdata_commandLine:/.*:F.*/ OR data_win_eventdata_commandLine:/.*:W.*/ OR data_win_eventdata_commandLine:/.*:R.*/ OR data_win_eventdata_commandLine:/.*:C.*/ OR data_win_eventdata_commandLine:/.*:N.*/ OR data_win_eventdata_commandLine:/.*\/grant.*/ OR data_win_eventdata_commandLine:/.*\/deny.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b1b1e316-accc-11eb-a9b4-acde48001122
    name: ICACLS Grant Command
    reason: Granting rights is the permission-weakening half of the same icacls abuse.
  - id: cf8d753e-a8fe-11eb-8f58-acde48001122
    name: Icacls Deny Command
    reason: Deny ACEs are used to lock defenders or users out of the dropped payload folder.
  - id: 4ae81040-fc1c-4249-bfa3-938d260214d9
    name: Use Icacls to Hide File to Everyone
    reason: Amadey-style malware hides its dropped files from all users with icacls denies.
  - id: fa7ca5c6-c9d8-11eb-bce9-acde48001122
    name: Permission Modification using Takeown App
    reason: takeown is the ownership step that typically precedes an icacls grant.
  - id: 554601fb-9b71-4bcc-abf4-21a611be4fde
    name: Suspicious Recursive Takeown
    reason: Recursive ownership grabs precede wide ACL changes.
  - id: 6e5a3ae4-90a3-462d-9aa6-0119f638c0f1
    name: Hiding Files And Directories With Attrib exe
    reason: Often paired with icacls to hide the malware drop directory.
  - id: c5c00f49-b3f9-45a6-997e-cfdecc6e1967
    name: Suspicious Schtasks Execution AppData Folder
    reason: After ACLs are set, Amadey creates a scheduled task to persist the payload from AppData.
  - id: windows-process-creating-lnk-suspicious-location-001
    name: Windows Process Creating LNK File in Suspicious Location
    reason: Amadey also drops LNK persistence files shortly after permission changes.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Scheduled task creation for persistence
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*\/[Cc][Rr][Ee][Aa][Tt][Ee].*/
    pivot_on:
    - host
    window: 2h
  - name: Ownership and attribute changes
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Tt][Aa][Kk][Ee][Oo][Ww][Nn]|[Aa][Tt][Tt][Rr][Ii][Bb])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Executables dropped into user-writable paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\([Aa][Pp][Pp][Dd][Aa][Tt][Aa]|[Tt][Ee][Mm][Pp]|[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa])\\.*\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Run-key autostart written
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/
    pivot_on:
    - host
    window: 4h
