name: Windows Cached Domain Credentials Reg Query
id: windows-cached-domain-credentials-reg-query-001
version: 1
schema_version: "1.0"
date: "2026-02-23"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  Detects processes querying the CachedLogonsCount registry value under Winlogon. 
  Post-exploitation tools like WinPEAS use this to gather login caching settings 
  which can aid credential theft. Used by Prestige ransomware and various 
  post-exploitation frameworks.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - wildcard:
            data_win_eventdata_commandLine: "*Winlogon*"
        - wildcard:
            data_win_eventdata_commandLine: "*CachedLogons*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-23 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-23 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Windows endpoints with Sysmon 
  installed and configured to log process creation events (EventID 1) with full 
  command-line arguments. Note that direct reg.exe query commands may not generate 
  EventID 1 in all configurations — wrapping in cmd.exe ensures capture.

known_false_positives: >
  Administrators may query this registry value for troubleshooting domain login 
  caching issues. Correlate with other reconnaissance activity on the same host.

references:
  - https://attack.mitre.org/techniques/T1003/005/
  - https://github.com/carlospolop/PEASS-ng/tree/master/winPEAS
  - https://www.microsoft.com/en-us/security/blog/2022/10/14/new-prestige-ransomware-impacts-organizations-in-ukraine-and-poland/

response:
  message: >
    Cached domain credentials registry query detected on $agent_name$. 
    Command: $data_win_eventdata_commandLine$. 
    Process: $data_win_eventdata_image$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1003.005
  risk_score: 36
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 36
  threat_objects: []

tags:
  analytic_story:
    - Windows Post-Exploitation
    - Prestige Ransomware
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.005
  custom_tags:
    - credential_access
    - registry_query
    - winpeas
    - reconnaissance
    - cached_credentials
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*Winlogon.*/ AND data_win_eventdata_commandLine:/.*CachedLogons.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e0b0c2ab-3d52-46d9-8cb7-049dc775fbd1
    name: Enumeration for Credentials in Registry
    reason: Registry credential hunting commonly accompanies the CachedLogonsCount lookup.
  - id: 98b53e78-ebaf-46f8-be06-421aafd176d9
    name: HackTool - winPEAS Execution
    reason: winPEAS performs this exact query among many checks.
  - id: 07f8bdc2-c9b3-472a-9817-5a670b872f53
    name: Potential Reconnaissance For Cached Credentials Via Cmdkey.EXE
    reason: Cmdkey cached-credential recon is parallel credential-store discovery.
  - id: 58f50261-c53b-4c88-bd12-1d71f12eda4c
    name: Windows Credential Manager Access via VaultCmd
    reason: VaultCmd reads Credential Manager, a next credential source.
  - id: cc1abf27-78a3-4ac5-a51c-f3070b1d8e40
    name: Registry Export of Third-Party Credentials
    reason: Registry export of third-party credentials is a follow-on harvest.
  - id: c248c896-e412-4279-8c15-1c558067b6fa
    name: Enumerate All Information With Whoami.EXE
    reason: whoami /all is typical early enumeration alongside this query.
  - id: d372f928-ce4f-11eb-a762-acde48001122
    name: Esentutl SAM Copy
    reason: SAM copy via esentutl escalates to offline credential theft.
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: LSASS dump via comsvcs is the usual next step to obtain secrets.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Registry hive saves of SAM, SECURITY or SYSTEM
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Rr][Ee][Gg] [Ss][Aa][Vv][Ee].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Gg]\.[Ee][Xx][Ee] [Ss][Aa][Vv][Ee].*/) AND (data_win_eventdata_commandLine:/.*[Hh][Kk][Ll][Mm]\\[Ss][Aa][Mm].*/ OR data_win_eventdata_commandLine:/.*[Hh][Kk][Ll][Mm]\\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy].*/ OR data_win_eventdata_commandLine:/.*[Hh][Kk][Ll][Mm]\\[Ss][Yy][Ss][Tt][Ee][Mm].*/)
    pivot_on: host
    window: 4h
  - name: LSASS dumping tools and keywords
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Ss][Ss].*/ OR data_win_eventdata_commandLine:/.*[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee][Dd][Uu][Mm][Pp].*/)
    pivot_on: host
    window: 4h
  - name: Account and domain enumeration
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ww][Hh][Oo][Aa][Mm][Ii] /[Aa][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Ww][Hh][Oo][Aa][Mm][Ii] /[Gg][Rr][Oo][Uu][Pp][Ss].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ll][Tt][Ee][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Mm][Aa][Ii][Nn] [Aa][Dd][Mm][Ii][Nn][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp] [Aa][Dd][Mm][Ii][Nn][Ii][Ss][Tt][Rr][Aa][Tt][Oo][Rr][Ss].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ss][Qq][Uu][Ee][Rr][Yy].*/)
    pivot_on: host
    window: 4h
  - name: Credential Manager and cmdkey recon
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Mm][Dd][Kk][Ee][Yy] /[Ll][Ii][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Vv][Aa][Uu][Ll][Tt][Cc][Mm][Dd].*/ OR data_win_eventdata_commandLine:/.*/[Ll][Ii][Ss][Tt][Cc][Rr][Ee][Dd][Ss].*/)
    pivot_on: host
    window: 4h
  - name: Autologon password lookups in Winlogon
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn].*/) AND (data_win_eventdata_commandLine:/.*[Dd][Ee][Ff][Aa][Uu][Ll][Tt][Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd].*/ OR data_win_eventdata_commandLine:/.*[Aa][Uu][Tt][Oo][Aa][Dd][Mm][Ii][Nn][Ll][Oo][Gg][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ee][Ff][Aa][Uu][Ll][Tt][Uu][Ss][Ee][Rr][Nn][Aa][Mm][Ee].*/)
    pivot_on: host
    window: 4h
