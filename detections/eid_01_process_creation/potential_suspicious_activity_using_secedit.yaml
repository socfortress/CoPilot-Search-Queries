name: Potential Suspicious Activity Using SeCEdit
id: c2c76b77-32be-4d1f-82c9-7e544bdfe0eb
version: 1
schema_version: "1.0"
date: "2022-12-30"
author: Janantha Marasinghe
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: c2c76b77-32be-4d1f-82c9-7e544bdfe0eb
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential suspicious behaviour using secedit.exe. Such as exporting or
  modifying the security policy. MITRE ATT&CK: T1685.001, T1547.001, T1505.005,
  T1556.002, T1685, T1574.007, T1564.002, T1546.008, T1546.007, T1547.014,
  T1547.010, T1547.002, T1557, T1082.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\secedit.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "SeCEdit"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*/export*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*/cfg*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*/configure*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*/db*"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\secedit.exe'; data_win_eventdata_originalFileName equals 'SeCEdit';
  data_win_eventdata_commandLine matches '*/export*', among other conditions.

known_false_positives: >
  Legitimate administrative use. Baseline expected activity in your environment
  and tune this detection before relying on it for automated response.

references:
  - https://blueteamops.medium.com/secedit-and-i-know-it-595056dee53d
  - https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/secedit
  - https://attack.mitre.org/techniques/T1685/001/
  - https://attack.mitre.org/techniques/T1547/001/
  - https://attack.mitre.org/techniques/T1505/005/
  - https://attack.mitre.org/techniques/T1556/002/
  - https://attack.mitre.org/techniques/T1685/
  - https://attack.mitre.org/techniques/T1574/007/
  - https://attack.mitre.org/techniques/T1564/002/
  - https://attack.mitre.org/techniques/T1546/008/
  - https://attack.mitre.org/techniques/T1546/007/
  - https://attack.mitre.org/techniques/T1547/014/
  - https://attack.mitre.org/techniques/T1547/010/
  - https://attack.mitre.org/techniques/T1547/002/
  - https://attack.mitre.org/techniques/T1557/
  - https://attack.mitre.org/techniques/T1082/

response:
  message: >
    Potential Suspicious Activity Using SeCEdit detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1685.001, T1547.001, T1505.005, T1556.002, T1685, T1574.007,
    T1564.002, T1546.008, T1546.007, T1547.014, T1547.010, T1547.002, T1557,
    T1082
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685.001
    - T1547.001
    - T1505.005
    - T1556.002
    - T1685
    - T1574.007
    - T1564.002
    - T1546.008
    - T1546.007
    - T1547.014
    - T1547.010
    - T1547.002
    - T1557
    - T1082
  custom_tags:
    - secedit
    - process_creation
    - sysmon
    - collection
    - discovery
    - persistence
    - credential_access
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ss][Ee][Cc][Ee][Dd][Ii][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ss][Ee][Cc][Ee][Dd][Ii][Tt]/) AND ((data_win_eventdata_commandLine:/.*\/[Ee][Xx][Pp][Oo][Rr][Tt].*/ AND data_win_eventdata_commandLine:/.*\/[Cc][Ff][Gg].*/) OR (data_win_eventdata_commandLine:/.*\/[Cc][Oo][Nn][Ff][Ii][Gg][Uu][Rr][Ee].*/ AND data_win_eventdata_commandLine:/.*\/[Dd][Bb].*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 5e95028c-5229-4214-afae-d653d573d0ec
    name: Security Service Disabled Via Reg.EXE
    reason: Policy weakening via secedit is often paired with disabling security services.
  - id: 8470d755-0c13-45b3-bd63-387a373c10cf
    name: Reg exe Manipulating Windows Services Registry Keys
    reason: Other local service and policy tampering in the same intrusion.
  - id: 85c312b7-f44d-4a51-a024-d671c40b49fc
    name: Service StartupType Change Via Sc.EXE
    reason: Service configuration changes accompany security policy changes.
  - id: cd219ff3-fa99-45d4-8380-a7d15116c6dc
    name: New User Created Via Net.EXE
    reason: Modified policy can grant rights to a newly created account.
  - id: d95de845-b83c-4a9a-8a6a-4fc802ebf6c0
    name: Suspicious Group And Account Reconnaissance Activity Using Net.EXE
    reason: Local recon commonly precedes policy export.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Privilege right assignment commands
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*Se[A-Za-z]+Privilege.*/
    pivot_on: host
    window: 6h
  - name: Policy template file writes
    query: data_win_system_eventID:11 AND (data_win_eventdata_targetFilename:/.*\.inf/ OR data_win_eventdata_targetFilename:/.*\.sdb/)
    pivot_on: host
    window: 6h
  - name: Audit policy and user right changes
    query: data_win_system_eventID:(4719 OR 4704 OR 4670)
    pivot_on: host
    window: 6h
  - name: Account creation or group changes
    query: data_win_system_eventID:(4720 OR 4728 OR 4732)
    pivot_on: host
    window: 6h
  - name: Security-weakening registry writes
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*(Lsa|[Pp]olicies|[Ss]ecurity[Cc]enter).*/
    pivot_on: host
    window: 6h
