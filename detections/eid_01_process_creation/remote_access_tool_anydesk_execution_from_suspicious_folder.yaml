      pivot_on: [host]
      window: 1h
    - name: "Other executions of this tool-set on this host (any arguments)"
      query: 'data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Aa][Nn][Yy][Dd][Ee][Ss][Kk]\.[Ee][Xx][Ee]|\\[Aa][Nn][Yy][Dd][Ee][Ss][Kk][Mm][Ss][Ii]\.[Ee][Xx][Ee])/'
