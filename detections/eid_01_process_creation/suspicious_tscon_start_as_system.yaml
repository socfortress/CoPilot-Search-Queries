name: Suspicious TSCON Start as SYSTEM
id: 9847f263-4a81-424f-970c-875dab15b79b
version: 1
schema_version: "1.0"
date: "2022-05-27"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 9847f263-4a81-424f-970c-875dab15b79b
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a tscon.exe start as LOCAL SYSTEM. MITRE ATT&CK: T1219.002.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_user:
                    value: "*AUTHORI*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_user:
                    value: "*AUTORI*"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\tscon.exe"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_user
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_user matches '*AUTHORI*';
  data_win_eventdata_user matches '*AUTORI*'; data_win_eventdata_image matches
  '*\tscon.exe'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - http://www.korznikov.com/2017/03/0-day-or-feature-privilege-escalation.html
  - https://medium.com/@networksecurity/rdp-hijacking-how-to-hijack-rds-and-remoteapp-sessions-transparently-to-move-through-an-da2a1e73a5f6
  - https://www.ired.team/offensive-security/lateral-movement/t1076-rdp-hijacking-for-lateral-movement
  - https://attack.mitre.org/techniques/T1219/002/

response:
  message: >
    Suspicious TSCON Start as SYSTEM detected on host $agent_name$. Matched
    data_win_eventdata_user: $data_win_eventdata_user$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1219.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_user
      type: user
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1219.002
  custom_tags:
    - tscon
    - start
    - system
    - process_creation
    - sysmon
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_user:/.*[Aa][Uu][Tt][Hh][Oo][Rr][Ii].*/ OR data_win_eventdata_user:/.*[Aa][Uu][Tt][Oo][Rr][Ii].*/) AND data_win_eventdata_image:/.*\\[Tt][Ss][Cc][Oo][Nn]\.[Ee][Xx][Ee]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: f72aa3e8-49f9-4c7d-bd74-f8ab84ff9bbb
    name: Suspicious RDP Redirect Using TSCON
    reason: Same tscon session-takeover technique; the command-line form confirms the hijack.
  - id: 224f140f-3553-4cd1-af78-13d81bf9f7cc
    name: Potential RDP Session Hijacking Activity
    reason: Another view of the same session hijack via tscon and service creation.
  - id: 52753ea4-b3a0-4365-910d-36cff487b789
    name: Hijack Legit RDP Session to Move Laterally
    reason: File artifact showing the hijacked session being used to move laterally.
  - id: 7c0dcd3d-acf8-4f71-9570-f448b0034f94
    name: PsExec Service Child Process Execution as LOCAL SYSTEM
    reason: PsExec -s is a common way to obtain the SYSTEM context tscon needs.
  - id: ea011323-7045-460b-b2d7-0f7442ea6b38
    name: Potential PsExec Remote Execution
    reason: Remote service-based execution that can precede SYSTEM tscon.
  - id: ffa28e60-bdb1-46e0-9f82-05f7a61cc06e
    name: User Added to Remote Desktop Users Group
    reason: Attackers may grant RDP rights alongside session takeover.
  - id: 8a3038e8-9c9d-46f8-b184-66234a160f6f
    name: Potential Remote Desktop Tunneling
    reason: RDP tunneling often accompanies lateral movement through hijacked sessions.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: tscon session redirect invocations
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*\\[Tt][Ss][Cc][Oo][Nn]\.exe/
    pivot_on: host
    window: 2h
  - name: Service creation used to run tscon as SYSTEM
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*sc(\.exe)? .*create.*/ OR /.*[Nn]et start.*/) AND data_win_eventdata_commandLine:/.*tscon.*/
    pivot_on: host
    window: 2h
  - name: PsExec or SYSTEM shell launch
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:(/.*\\[Pp][Ss][Ee][Xx][Ee][Cc].*\.exe/ OR /.*\\[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]\.exe/) OR data_win_eventdata_commandLine:/.*[Pp][Ss][Ee][Xx][Ee][Cc].* -s.*/)
    pivot_on: host
    window: 2h
  - name: Logon session enumeration
    query: data_win_system_eventID:1 AND data_win_eventdata_image:(/.*\\[Qq][Uu][Ee][Rr][Yy]\.exe/ OR /.*\\[Qq][Ww][Ii][Nn][Ss][Tt][Aa]\.exe/ OR /.*\\[Qq][Uu][Ss][Ee][Rr]\.exe/)
    pivot_on: host
    window: 2h
