name: RedSun - Conhost.exe Spawned by TieringEngineService.exe
id: 2ad78473-6978-40f5-b8f1-89c7e1c27a1a
version: 1
schema_version: "1.0"
date: "2026-04-17"
author: Swachchhanda Shrawan Poudel (Nextron Systems), @unresolvedhost
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 2ad78473-6978-40f5-b8f1-89c7e1c27a1a
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects two stages of the RedSun post-exploitation process chain that deliver
  a SYSTEM-level shell to the attacker's interactive session. Observed process
  chain services.exe → TieringEngineService.exe → conhost.exe (SYSTEM,
  CommandLine: bare path, no arguments) → cmd.exe / shell (SYSTEM,
  TerminalSessionId = attacker's session) Stage 1 — TieringEngineService.exe
  spawns argument-less conhost.exe: After winning the oplock + Cloud Files mount
  point race, the malicious TieringEngineService.exe (RedSun.exe copied to
  System32, started via CoCreateInstance / services.exe) detects it is NT
  AUTHORITY\SYSTEM and calls LaunchConsoleInSessionId(). This opens
  \\.\pipe\REDSUN, reads the attacker's session ID, duplicates the SYSTEM token,
  re-stamps it with that session ID via SetTokenInformation(TokenSessionId),
  then calls CreateProcessAsUser to spawn conhost.exe with no arguments. Stage 2
  — Shell spawned from rogue conhost.exe (EDR sources with GrandParentImage):
  The rogue SYSTEM conhost.exe spawns a shell (cmd.exe, PowerShell, etc.) as
  SYSTEM in the attacker's interactive session. On EDR sources that expose
  GrandParentImage, the full three-level chain (TieringEngineService.exe →
  conhost.exe → shell) can be matched directly. The legitimate
  TieringEngineService.exe is a headless COM server that is unlikely to spawn
  conhost.exe under normal conditions. MITRE ATT&CK: T1134.002, T1036.005.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_parentImage:
                          value: "*\\\\TieringEngineService.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\conhost.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*conhost.exe\""
                          case_insensitive: true
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_user:
                                value: "*AUTHORI*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_user:
                                value: "*AUTORI*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_user: "*$*"
                        minimum_should_match: 1
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_grandParentImage:
                          value: "*\\\\TieringEngineService.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_parentImage:
                          value: "*\\\\conhost.exe"
                          case_insensitive: true
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\cmd.exe"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\powershell_ise.exe"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\powershell.exe"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\pwsh.exe"
                                case_insensitive: true
                        minimum_should_match: 1
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_user:
                                value: "*AUTHORI*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_user:
                                value: "*AUTORI*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_user: "*$*"
                        minimum_should_match: 1
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_user
    - data_win_eventdata_grandParentImage

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\TieringEngineService.exe'; data_win_eventdata_image matches
  '*\conhost.exe'; data_win_eventdata_commandLine matches '*conhost.exe"', among
  other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/Nightmare-Eclipse/RedSun
  - https://attack.mitre.org/techniques/T1134/002/
  - https://attack.mitre.org/techniques/T1036/005/

response:
  message: >
    RedSun - Conhost.exe Spawned by TieringEngineService.exe detected on host
    $agent_name$. Matched data_win_eventdata_parentImage:
    $data_win_eventdata_parentImage$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1134.002, T1036.005
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1134.002
    - T1036.005
  custom_tags:
    - redsun
    - conhost
    - spawned
    - process_creation
    - sysmon
    - privilege_escalation
    - stealth
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND ((data_win_eventdata_parentImage:/.*\\[Tt][Ii][Ee][Rr][Ii][Nn][Gg][Ee][Nn][Gg][Ii][Nn][Ee][Ss][Ee][Rr][Vv][Ii][Cc][Ee]\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\[Cc][Oo][Nn][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Cc][Oo][Nn][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]\"/ AND (data_win_eventdata_user:/.*[Aa][Uu][Tt][Hh][Oo][Rr][Ii].*/ OR data_win_eventdata_user:/.*[Aa][Uu][Tt][Oo][Rr][Ii].*/ OR data_win_eventdata_user:/.*\$.*/)) OR (data_win_eventdata_grandParentImage:/.*\\[Tt][Ii][Ee][Rr][Ii][Nn][Gg][Ee][Nn][Gg][Ii][Nn][Ee][Ss][Ee][Rr][Vv][Ii][Cc][Ee]\.[Ee][Xx][Ee]/ AND data_win_eventdata_parentImage:/.*\\[Cc][Oo][Nn][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]_[Ii][Ss][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_user:/.*[Aa][Uu][Tt][Hh][Oo][Rr][Ii].*/ OR data_win_eventdata_user:/.*[Aa][Uu][Tt][Oo][Rr][Ii].*/ OR data_win_eventdata_user:/.*\$.*/)))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 9b4e7c2a-3f6d-4a8b-b5e9-1c7d3f2e6a4b
    name: RedSun - Named Pipe Created
    reason: RedSun creates the REDSUN pipe to read the attacker session ID before spawning the SYSTEM conhost; direct precursor in the exploit chain.
  - id: f2e4b7d9-5c3a-4f8b-9e1d-7a6c2b3f4e5d
    name: RedSun - TieringEngineService.exe Staged in RS-Prefixed Temp Dir
    reason: The malicious TieringEngineService.exe is first dropped in an RS-prefixed temp dir; earliest stage of the same exploit.
  - id: a7c3e5f2-8b1d-4e9a-b6c2-3d7f5e8a9b4c
    name: RedSun - TieringEngineService.exe Detected as EICAR Test File
    reason: Defender detection of the fake TieringEngineService.exe is the RedSun trigger and often fires just before this process chain.
  - id: cbb9e3d1-2386-4e59-912e-62f1484f7a89
    name: Conhost Spawned By Uncommon Parent Process
    reason: Generic detection of the same abnormal conhost parentage; corroborates the rogue conhost.
  - id: dfa03a09-8b92-4d83-8e74-f72839b1c407
    name: Potentially Suspicious Child Processes Spawned by ConHost
    reason: 'Stage 2: the rogue SYSTEM conhost spawns the attacker shell.'
  - id: 590a5f4c-6c8c-4f10-8307-89afe9453a9d
    name: Suspicious Child Process Created as System
    reason: The resulting SYSTEM shell in the attacker session is the payoff of the privilege escalation.
  - id: 178e615d-e666-498b-9630-9ed363038101
    name: Elevated System Shell Spawned From Uncommon Parent Location
    reason: Catches the elevated SYSTEM cmd or PowerShell launched after the token swap.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Shells spawned by conhost or TieringEngineService
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:(/.*([Cc]onhost|[Tt]ieringEngineService)\.exe/) AND data_win_eventdata_image:(/.*(cmd|powershell|pwsh|wscript|cscript|mshta)\.exe/)
    pivot_on: host
    window: 2h
  - name: TieringEngineService created or run outside System32
    query: data_win_system_eventID:(1 OR 11) AND (data_win_eventdata_image:/.*[Tt]ieringEngineService\.exe/ OR data_win_eventdata_targetFilename:/.*[Tt]ieringEngineService\.exe/) AND NOT data_win_eventdata_targetFilename:/[Cc]:\\[Ww]indows\\[Ss]ystem32\\.*/
    pivot_on: host
    window: 4h
  - name: SYSTEM recon and credential access commands
    query: data_win_system_eventID:1 AND data_win_eventdata_user:(*AUTHORI* OR *AUTORI*) AND data_win_eventdata_commandLine:(/.*([Ww]hoami|[Nn]et user|[Nn]et localgroup|[Rr]eg save|[Ll]sass|[Mm]imikatz|[Ss]ekurlsa).*/)
    pivot_on: host
    window: 2h
  - name: Defender tampering after escalation
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*([Ss]et-[Mm]p[Pp]reference|[Aa]dd-[Mm]p[Pp]reference|[Dd]isable[Rr]ealtime|[Ee]xclusion).*/)
    pivot_on: host
    window: 4h
