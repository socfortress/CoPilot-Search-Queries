name: Suspicious WebDav Client Execution Via Rundll32.EXE
id: 982e9f2d-1a85-4d5b-aea4-31f5e97c6555
version: 1
schema_version: "1.0"
date: "2023-09-18"
author: Nasreddine Bencherchali (Nextron Systems), Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 982e9f2d-1a85-4d5b-aea4-31f5e97c6555
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects "svchost.exe" spawning "rundll32.exe" with command arguments like
  C:\windows\system32\davclnt.dll,DavSetCookie. This could be an indicator of
  exfiltration or use of WebDav to launch code (hosted on WebDav Server) or
  potentially a sign of exploitation of CVE-2023-23397. MITRE ATT&CK: T1048.003.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_parentImage:
              value: "*\\\\svchost.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_parentCommandLine:
              value: "*-s WebClient*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\rundll32.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*C:\\\\windows\\\\system32\\\\davclnt.dll,DavSetCookie*"
              case_insensitive: true
        - regexp:
            data_win_eventdata_commandLine: ".*(://[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}).*"
        - exists:
            field: "data_win_eventdata_commandLine"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_commandLine: "*://10.*"
                    - wildcard:
                        data_win_eventdata_commandLine: "*://192.168.*"
                    - wildcard:
                        data_win_eventdata_commandLine: "*://172.16.*"
                    - wildcard:
                        data_win_eventdata_commandLine: "*://172.17.*"
                    - wildcard:
                        data_win_eventdata_commandLine: "*://172.18.*"
                    - wildcard:
                        data_win_eventdata_commandLine: "*://172.19.*"
                    - wildcard:
                        data_win_eventdata_commandLine: "*://172.20.*"
                    - wildcard:
                        data_win_eventdata_commandLine: "*://172.21.*"
                    - wildcard:
                        data_win_eventdata_commandLine: "*://172.22.*"
                    - wildcard:
                        data_win_eventdata_commandLine: "*://172.23.*"
                    - wildcard:
                        data_win_eventdata_commandLine: "*://172.24.*"
                    - wildcard:
                        data_win_eventdata_commandLine: "*://172.25.*"
                    - wildcard:
                        data_win_eventdata_commandLine: "*://172.26.*"
                    - wildcard:
                        data_win_eventdata_commandLine: "*://172.27.*"
                    - wildcard:
                        data_win_eventdata_commandLine: "*://172.28.*"
                    - wildcard:
                        data_win_eventdata_commandLine: "*://172.29.*"
                    - wildcard:
                        data_win_eventdata_commandLine: "*://172.30.*"
                    - wildcard:
                        data_win_eventdata_commandLine: "*://172.31.*"
                    - wildcard:
                        data_win_eventdata_commandLine: "*://127.*"
                    - wildcard:
                        data_win_eventdata_commandLine: "*://169.254.*"
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_parentCommandLine
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\svchost.exe'; data_win_eventdata_parentCommandLine matches '*-s
  WebClient*'; data_win_eventdata_image matches '*\rundll32.exe', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/aceresponder/status/1636116096506818562
  - https://www.mdsec.co.uk/2023/03/exploiting-cve-2023-23397-microsoft-outlook-elevation-of-privilege-vulnerability/
  - https://www.pwndefend.com/2023/03/15/the-long-game-persistent-hash-theft/
  - https://www.microsoft.com/en-us/security/blog/wp-content/uploads/2023/03/Figure-7-sample-webdav-process-create-event.png
  - https://www.microsoft.com/en-us/security/blog/2023/03/24/guidance-for-investigating-attacks-using-cve-2023-23397/
  - https://attack.mitre.org/techniques/T1048/003/

response:
  message: >
    Suspicious WebDav Client Execution Via Rundll32.EXE detected on host
    $agent_name$. Matched data_win_eventdata_parentImage:
    $data_win_eventdata_parentImage$. Matched
    data_win_eventdata_parentCommandLine:
    $data_win_eventdata_parentCommandLine$. MITRE ATT&CK: T1048.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_parentCommandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1048.003
  custom_tags:
    - webdav
    - client
    - rundll32
    - process_creation
    - sysmon
    - exfiltration
    - cve_2023_23397
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ AND data_win_eventdata_parentCommandLine:/.*-[Ss] [Ww][Ee][Bb][Cc][Ll][Ii][Ee][Nn][Tt].*/ AND data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Dd][Aa][Vv][Cc][Ll][Nn][Tt]\.[Dd][Ll][Ll],[Dd][Aa][Vv][Ss][Ee][Tt][Cc][Oo][Oo][Kk][Ii][Ee].*/ AND data_win_eventdata_commandLine:/.*(:\/\/[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}).*/ AND _exists_:data_win_eventdata_commandLine AND NOT (data_win_eventdata_commandLine:/.*:\/\/10\..*/ OR data_win_eventdata_commandLine:/.*:\/\/192\.168\..*/ OR data_win_eventdata_commandLine:/.*:\/\/172\.16\..*/ OR data_win_eventdata_commandLine:/.*:\/\/172\.17\..*/ OR data_win_eventdata_commandLine:/.*:\/\/172\.18\..*/ OR data_win_eventdata_commandLine:/.*:\/\/172\.19\..*/ OR data_win_eventdata_commandLine:/.*:\/\/172\.20\..*/ OR data_win_eventdata_commandLine:/.*:\/\/172\.21\..*/ OR data_win_eventdata_commandLine:/.*:\/\/172\.22\..*/ OR data_win_eventdata_commandLine:/.*:\/\/172\.23\..*/ OR data_win_eventdata_commandLine:/.*:\/\/172\.24\..*/ OR data_win_eventdata_commandLine:/.*:\/\/172\.25\..*/ OR data_win_eventdata_commandLine:/.*:\/\/172\.26\..*/ OR data_win_eventdata_commandLine:/.*:\/\/172\.27\..*/ OR data_win_eventdata_commandLine:/.*:\/\/172\.28\..*/ OR data_win_eventdata_commandLine:/.*:\/\/172\.29\..*/ OR data_win_eventdata_commandLine:/.*:\/\/172\.30\..*/ OR data_win_eventdata_commandLine:/.*:\/\/172\.31\..*/ OR data_win_eventdata_commandLine:/.*:\/\/127\..*/ OR data_win_eventdata_commandLine:/.*:\/\/169\.254\..*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 2dbd9d3d-9e27-42a8-b8df-f13825c6c3d5
    name: WebDav Client Execution Via Rundll32.EXE
    reason: Broader WebDav client execution via rundll32, same davclnt.dll DavSetCookie mechanism
  - id: f0507c0f-a3a2-40f5-acc6-7f543c334993
    name: Suspicious File Execution From Internet Hosted WebDav Share
    reason: Execution of a file from an internet-hosted WebDav share is the payload step
  - id: 7e6237fe-3ddb-438f-9381-9bf9de5af8d0
    name: Windows Internet Hosted WebDav Share Mount Via Net.EXE
    reason: net use mounting an internet WebDav share precedes or accompanies the WebClient activity
  - id: 1412aa78-a24c-4abd-83df-767dfb2c5bbe
    name: Potentially Suspicious WebDAV LNK Execution
    reason: WebDAV LNK execution, a common phishing delivery into WebClient
  - id: 5cdb711b-5740-4fb2-ba88-f7945027afac
    name: Rundll32 UNC Path Execution
    reason: Rundll32 UNC path execution, remote DLL staging over SMB/WebDAV
  - id: f40017b3-cb2e-4335-ab5d-3babf679c1de
    name: Remote DLL Load Via Rundll32.EXE
    reason: Remote DLL loaded by rundll32 is the follow-on code execution
  - id: 6c6d9280-e6d0-4b9d-80ac-254701b64916
    name: Potential NTLM Coercion Via Certutil.EXE
    reason: NTLM coercion over WebDAV, related to the CVE-2023-23397 exploitation angle
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Execution from WebDAV paths
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*@[Ss][Ss][Ll]\\.*/ OR data_win_eventdata_commandLine:/.*[Dd][Aa][Vv][Ww][Ww][Ww][Rr][Oo][Oo][Tt].*/)
    pivot_on: host
    window: 2h
  - name: Net use WebDAV mounts
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Nn][Ee][Tt].*[Uu][Ss][Ee].*/ AND data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp].*/
    pivot_on: host
    window: 2h
  - name: Outbound web connections by svchost
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_destinationPort:80 OR data_win_eventdata_destinationPort:443 OR data_win_eventdata_destinationPort:8080) AND data_win_eventdata_initiated:"true"
    pivot_on: host
    window: 2h
  - name: Children of rundll32
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Outlook child processes
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Oo][Uu][Tt][Ll][Oo][Oo][Kk]\.[Ee][Xx][Ee]/
    pivot_on: user
    window: 24h
