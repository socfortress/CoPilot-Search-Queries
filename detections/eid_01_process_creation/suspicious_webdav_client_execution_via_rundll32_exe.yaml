name: Suspicious WebDav Client Execution Via Rundll32.EXE
id: 982e9f2d-1a85-4d5b-aea4-31f5e97c6555
version: 1
schema_version: "1.0"
date: "2023-09-18"
author: Nasreddine Bencherchali (Nextron Systems), Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 982e9f2d-1a85-4d5b-aea4-31f5e97c6555
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects "svchost.exe" spawning "rundll32.exe" with command arguments like
  C:\windows\system32\davclnt.dll,DavSetCookie. This could be an indicator of
  exfiltration or use of WebDav to launch code (hosted on WebDav Server) or
  potentially a sign of exploitation of CVE-2023-23397. MITRE ATT&CK: T1048.003.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_parentImage:
              value: "*\\\\svchost.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_parentCommandLine:
              value: "*-s WebClient*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\rundll32.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*C:\\\\windows\\\\system32\\\\davclnt.dll,DavSetCookie*"
              case_insensitive: true
        - regexp:
            data_win_eventdata_commandLine: ".*(://[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}).*"
        - exists:
            field: "data_win_eventdata_commandLine"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_commandLine: "*://10.*"
                    - wildcard:
                        data_win_eventdata_commandLine: "*://192.168.*"
                    - wildcard:
                        data_win_eventdata_commandLine: "*://172.16.*"
                    - wildcard:
                        data_win_eventdata_commandLine: "*://172.17.*"
                    - wildcard:
                        data_win_eventdata_commandLine: "*://172.18.*"
                    - wildcard:
                        data_win_eventdata_commandLine: "*://172.19.*"
                    - wildcard:
                        data_win_eventdata_commandLine: "*://172.20.*"
                    - wildcard:
                        data_win_eventdata_commandLine: "*://172.21.*"
                    - wildcard:
                        data_win_eventdata_commandLine: "*://172.22.*"
                    - wildcard:
                        data_win_eventdata_commandLine: "*://172.23.*"
                    - wildcard:
                        data_win_eventdata_commandLine: "*://172.24.*"
                    - wildcard:
                        data_win_eventdata_commandLine: "*://172.25.*"
                    - wildcard:
                        data_win_eventdata_commandLine: "*://172.26.*"
                    - wildcard:
                        data_win_eventdata_commandLine: "*://172.27.*"
                    - wildcard:
                        data_win_eventdata_commandLine: "*://172.28.*"
                    - wildcard:
                        data_win_eventdata_commandLine: "*://172.29.*"
                    - wildcard:
                        data_win_eventdata_commandLine: "*://172.30.*"
                    - wildcard:
                        data_win_eventdata_commandLine: "*://172.31.*"
                    - wildcard:
                        data_win_eventdata_commandLine: "*://127.*"
                    - wildcard:
                        data_win_eventdata_commandLine: "*://169.254.*"
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_parentCommandLine
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\svchost.exe'; data_win_eventdata_parentCommandLine matches '*-s
  WebClient*'; data_win_eventdata_image matches '*\rundll32.exe', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/aceresponder/status/1636116096506818562
