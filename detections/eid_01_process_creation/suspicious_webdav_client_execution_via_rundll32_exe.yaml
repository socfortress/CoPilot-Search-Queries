  query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ AND data_win_eventdata_parentCommandLine:/.*-[Ss] [Ww][Ee][Bb][Cc][Ll][Ii][Ee][Nn][Tt].*/ AND data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Dd][Aa][Vv][Cc][Ll][Nn][Tt]\.[Dd][Ll][Ll],[Dd][Aa][Vv][Ss][Ee][Tt][Cc][Oo][Oo][Kk][Ii][Ee].*/ AND data_win_eventdata_commandLine:/.*(:\/\/[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}).*/ AND _exists_:data_win_eventdata_commandLine AND NOT (data_win_eventdata_commandLine:/.*:\/\/10\..*/ OR data_win_eventdata_commandLine:/.*:\/\/192\.168\..*/ OR data_win_eventdata_commandLine:/.*:\/\/172\.16\..*/ OR data_win_eventdata_commandLine:/.*:\/\/172\.17\..*/ OR data_win_eventdata_commandLine:/.*:\/\/172\.18\..*/ OR data_win_eventdata_commandLine:/.*:\/\/172\.19\..*/ OR data_win_eventdata_commandLine:/.*:\/\/172\.20\..*/ OR data_win_eventdata_commandLine:/.*:\/\/172\.21\..*/ OR data_win_eventdata_commandLine:/.*:\/\/172\.22\..*/ OR data_win_eventdata_commandLine:/.*:\/\/172\.23\..*/ OR data_win_eventdata_commandLine:/.*:\/\/172\.24\..*/ OR data_win_eventdata_commandLine:/.*:\/\/172\.25\..*/ OR data_win_eventdata_commandLine:/.*:\/\/172\.26\..*/ OR data_win_eventdata_commandLine:/.*:\/\/172\.27\..*/ OR data_win_eventdata_commandLine:/.*:\/\/172\.28\..*/ OR data_win_eventdata_commandLine:/.*:\/\/172\.29\..*/ OR data_win_eventdata_commandLine:/.*:\/\/172\.30\..*/ OR data_win_eventdata_commandLine:/.*:\/\/172\.31\..*/ OR data_win_eventdata_commandLine:/.*:\/\/127\..*/ OR data_win_eventdata_commandLine:/.*:\/\/169\.254\..*/)

