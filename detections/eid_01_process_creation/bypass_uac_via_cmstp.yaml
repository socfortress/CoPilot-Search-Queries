name: Bypass UAC via CMSTP
id: e66779cc-383e-4224-a3a4-267eeb585c40
version: 1
schema_version: "1.0"
date: "2022-08-30"
author: E.M. Anhaus (originally from Atomic Blue Detections, Endgame), oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: e66779cc-383e-4224-a3a4-267eeb585c40
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detect commandline usage of Microsoft Connection Manager Profile Installer
  (cmstp.exe) to install specially formatted local .INF files. MITRE ATT&CK:
  T1548.002, T1218.003.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\cmstp.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "CMSTP.EXE"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*/s*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-s*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*/au*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-au*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*/ni*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-ni*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\cmstp.exe'; data_win_eventdata_originalFileName equals 'CMSTP.EXE';
  data_win_eventdata_commandLine matches '*/s*', among other conditions.

known_false_positives: >
  Legitimate use of cmstp.exe utility by legitimate user. Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://eqllib.readthedocs.io/en/latest/analytics/e584f1a1-c303-4885-8a66-21360c90995b.html
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1218.003/T1218.003.md
  - https://lolbas-project.github.io/lolbas/Binaries/Cmstp/
  - https://attack.mitre.org/techniques/T1548/002/
  - https://attack.mitre.org/techniques/T1218/003/

response:
  message: >
    Bypass UAC via CMSTP detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1548.002, T1218.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1548.002
    - T1218.003
  custom_tags:
    - bypass
    - cmstp
    - process_creation
    - sysmon
    - privilege_escalation
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Cc][Mm][Ss][Tt][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Cc][Mm][Ss][Tt][Pp]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*\/[Ss].*/ OR data_win_eventdata_commandLine:/.*-[Ss].*/ OR data_win_eventdata_commandLine:/.*\/[Aa][Uu].*/ OR data_win_eventdata_commandLine:/.*-[Aa][Uu].*/ OR data_win_eventdata_commandLine:/.*\/[Nn][Ii].*/ OR data_win_eventdata_commandLine:/.*-[Nn][Ii].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7d4cdc5a-0076-40ca-aac8-f7e714570e47
    name: CMSTP Execution Process Creation
    reason: Same cmstp.exe launch seen from the auto-elevated dllhost/COM side; confirms the INF was actually installed and elevated.
  - id: 4b60e6f2-bf39-47b4-b4ea-398e33cfe253
    name: CMSTP UAC Bypass via COM Object Access
    reason: The CMSTP bypass works through the CMSTPLUA COM object; this is the elevated child that follows a successful cmstp /s run.
  - id: 3b4b232a-af90-427c-a22f-30b0c0837b95
    name: CMSTP Execution Process Access
    reason: cmstp.exe being accessed/injected into is a known companion behaviour of malicious INF execution.
  - id: 49f2f17b-b4c8-4172-a68b-d5bf95d05130
    name: UAC Bypass via ICMLuaUtil
    reason: CMLUA/ICMLuaUtil is the underlying elevation primitive, so a hit shows the same bypass family on the host.
  - id: cea72823-df4d-4567-950c-0b579eaf0846
    name: Potential Dropper Script Execution Via WScript/CScript/MSHTA
    reason: The malicious .inf is commonly dropped by a script dropper just before cmstp runs.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Elevated children of cmstp/dllhost
    query: data_win_system_eventID:1 AND (data_win_eventdata_parentImage:/.*[Cc][Mm][Ss][Tt][Pp]\.exe/ OR (data_win_eventdata_parentImage:/.*[Dd][Ll][Ll][Hh][Oo][Ss][Tt]\.exe/ AND data_win_eventdata_commandLine:/.*[Pp]rocess\.[Ii][Dd].*/))
    pivot_on: host
    window: 1h
  - name: INF files written to user-writable paths
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\.[Ii][Nn][Ff]/ AND (data_win_eventdata_targetFilename:/.*[Tt]emp.*/ OR data_win_eventdata_targetFilename:/.*[Aa]pp[Dd]ata.*/ OR data_win_eventdata_targetFilename:/.*[Pp]ublic.*/)
    pivot_on: host
    window: 2h
  - name: Shells and script hosts spawned by cmstp
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Cc][Mm][Ss][Tt][Pp]\.exe/ AND (data_win_eventdata_image:/.*[Cc][Mm][Dd]\.exe/ OR data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ OR data_win_eventdata_image:/.*[Mm][Ss][Hh][Tt][Aa]\.exe/)
    pivot_on: host
    window: 1h
  - name: Outbound connections from cmstp
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*[Cc][Mm][Ss][Tt][Pp]\.exe/
    pivot_on: host
    window: 4h
