name: Malicious PE Execution by Microsoft Visual Studio Debugger
id: 15c7904e-6ad1-4a45-9b46-5fb25df37fd2
version: 1
schema_version: "1.0"
date: "2022-10-09"
author: Agro (@agro_sev), Ensar Şamil (@sblmsrsn), oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 15c7904e-6ad1-4a45-9b46-5fb25df37fd2
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  There is an option for a MS VS Just-In-Time Debugger "vsjitdebugger.exe" to
  launch specified executable and attach a debugger. This option may be used
  adversaries to execute malicious code by signed verified binary. The debugger
  is installed alongside with Microsoft Visual Studio package. MITRE ATT&CK:
  T1218.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_parentImage:
              value: "*\\\\vsjitdebugger.exe"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\vsimmersiveactivatehelper*.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\devenv.exe"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\vsjitdebugger.exe'; data_win_eventdata_image matches
  '*\vsimmersiveactivatehelper*.exe'; data_win_eventdata_image matches
  '*\devenv.exe'.

known_false_positives: >
  The process spawned by vsjitdebugger.exe is uncommon. Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://twitter.com/pabraeken/status/990758590020452353
  - https://lolbas-project.github.io/lolbas/OtherMSBinaries/Vsjitdebugger/
  - https://learn.microsoft.com/en-us/visualstudio/debugger/debug-using-the-just-in-time-debugger?view=vs-2019
  - https://attack.mitre.org/techniques/T1218/

response:
  message: >
    Malicious PE Execution by Microsoft Visual Studio Debugger detected on host
    $agent_name$. Matched data_win_eventdata_parentImage:
    $data_win_eventdata_parentImage$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1218
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218
  custom_tags:
    - microsoft
    - visual
    - studio
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Vv][Ss][Jj][Ii][Tt][Dd][Ee][Bb][Uu][Gg][Gg][Ee][Rr]\.[Ee][Xx][Ee]/ AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/.*\\[Vv][Ss][Ii][Mm][Mm][Ee][Rr][Ss][Ii][Vv][Ee][Aa][Cc][Tt][Ii][Vv][Aa][Tt][Ee][Hh][Ee][Ll][Pp][Ee][Rr].*\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Dd][Ee][Vv][Ee][Nn][Vv]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b5c7395f-e501-4a08-94d4-57fe7a9da9d2
    name: Potential Binary Proxy Execution Via Cdb.EXE
    reason: Cdb.exe is another debugger LOLBin used to proxy-execute code the same way.
  - id: ac1c92b4-ac81-405a-9978-4604d78cc47e
    name: Potential Binary Proxy Execution Via VSDiagnostics.EXE
    reason: VSDiagnostics is a sibling Visual Studio signed-binary proxy execution technique.
  - id: 45d3a03d-f441-458c-8883-df101a3bb146
    name: Launch-VsDevShell.PS1 Proxy Execution
    reason: Launch-VsDevShell proxy execution is another VS-based LOLBin abuse used interchangeably.
  - id: d4ca7c59-e9e4-42d8-bf57-91a776efcb87
    name: LOLBIN Execution From Abnormal Drive
    reason: LOLBIN executing from abnormal drive often accompanies the dropped PE.
  - id: aa3a6f94-890e-4e22-b634-ffdfd54792cc
    name: Suspicious Binary In User Directory Spawned From Office Application
    reason: Binary in user directory spawned from a lure is a typical precursor to dropping the PE.
  - id: a6a39bdb-935c-4f0a-ab77-35f4bbf44d33
    name: Potentially Suspicious Powershell Script Execution From Temp Folder
    reason: Script launched from Temp commonly stages the vsjitdebugger invocation.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: vsjitdebugger invocations
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*vsjitdebugger.*/ OR data_win_eventdata_commandLine:/.*vsjitdebugger.*/)
    pivot_on: host
    window: 4h
  - name: Executables created in user-writable paths
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\\(Users|ProgramData|Temp).*\.(exe|dll)/
    pivot_on: host
    window: 2h
  - name: Network connections from user-path executables
    query: data_win_system_eventID:3 AND data_win_eventdata_initiated:true AND data_win_eventdata_image:/.*\\(Users|ProgramData|Temp)\\.*\.exe/
    pivot_on: host
    window: 4h
  - name: Persistence following execution
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*schtasks.*\/create.*/ OR data_win_eventdata_commandLine:/.*CurrentVersion\\Run.*/)
    pivot_on: host
    window: 6h
  - name: Debugger-related registry or IFEO changes
    query: (data_win_system_eventID:12 OR data_win_system_eventID:13) AND (data_win_eventdata_targetObject:/.*Image File Execution Options.*/ OR data_win_eventdata_targetObject:/.*AeDebug.*/)
    pivot_on: host
    window: 24h
