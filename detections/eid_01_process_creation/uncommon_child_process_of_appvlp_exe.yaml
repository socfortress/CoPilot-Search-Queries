name: Uncommon Child Process Of Appvlp.EXE
id: 9c7e131a-0f2c-4ae0-9d43-b04f4e266d43
version: 1
schema_version: "1.0"
date: "2023-11-09"
author: Sreeman
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 9c7e131a-0f2c-4ae0-9d43-b04f4e266d43
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects uncommon child processes of Appvlp.EXE Appvlp or the Application
  Virtualization Utility is included with Microsoft Office. Attackers are able
  to abuse "AppVLP" to execute shell commands. Normally, this binary is used for
  Application Virtualization, but it can also be abused to circumvent the ASR
  file path rule folder or to mark a file as a system file. MITRE ATT&CK: T1218.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_parentImage:
              value: "*\\\\appvlp.exe"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*:\\\\Windows\\\\SysWOW64\\\\rundll32.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*:\\\\Windows\\\\System32\\\\rundll32.exe"
                          case_insensitive: true
                  minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  should:
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*:\\\\Program Files\\\\Microsoft Office*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\msoasb.exe"
                                case_insensitive: true
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*:\\\\Program Files\\\\Microsoft Office*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\SkypeSrv\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\SKYPESERVER.EXE"
                                case_insensitive: true
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*:\\\\Program Files\\\\Microsoft Office*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\MSOUC.EXE"
                                case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\appvlp.exe'; data_win_eventdata_image matches
  '*:\Windows\SysWOW64\rundll32.exe'; data_win_eventdata_image matches
  '*:\Windows\System32\rundll32.exe', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://lolbas-project.github.io/lolbas/OtherMSBinaries/Appvlp/
  - https://attack.mitre.org/techniques/T1218/

response:
  message: >
    Uncommon Child Process Of Appvlp.EXE detected on host $agent_name$. Matched
    data_win_eventdata_parentImage: $data_win_eventdata_parentImage$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1218
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218
  custom_tags:
    - uncommon
    - child
    - appvlp
    - process_creation
    - sysmon
    - stealth
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Aa][Pp][Pp][Vv][Ll][Pp]\.[Ee][Xx][Ee]/ AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Ww][Oo][Ww]64\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/) AND _exists_:data_win_eventdata_image AND NOT ((data_win_eventdata_image:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt] [Oo][Ff][Ff][Ii][Cc][Ee].*/ AND data_win_eventdata_image:/.*\\[Mm][Ss][Oo][Aa][Ss][Bb]\.[Ee][Xx][Ee]/) OR (data_win_eventdata_image:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt] [Oo][Ff][Ff][Ii][Cc][Ee].*/ AND data_win_eventdata_image:/.*\\[Ss][Kk][Yy][Pp][Ee][Ss][Rr][Vv]\\.*/ AND data_win_eventdata_image:/.*\\[Ss][Kk][Yy][Pp][Ee][Ss][Ee][Rr][Vv][Ee][Rr]\.[Ee][Xx][Ee]/) OR (data_win_eventdata_image:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt] [Oo][Ff][Ff][Ii][Cc][Ee].*/ AND data_win_eventdata_image:/.*\\[Mm][Ss][Oo][Uu][Cc]\.[Ee][Xx][Ee]/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 438025f9-5856-4663-83f7-52f878a70a50
    name: Suspicious Microsoft Office Child Process
    reason: AppVLP ships with Office and is abused from Office-delivered droppers; shows the Office parent that started the chain.
  - id: fbd7c32d-db2a-4418-b92c-566eb8911133
    name: SyncAppvPublishingServer Execute Arbitrary PowerShell Code
    reason: Sibling App-V LOLBin for the same proxy-execution goal; co-occurs when operators try several App-V binaries.
  - id: 36475a7d-0f6d-4dce-9b01-6aeb473bbaf1
    name: SyncAppvPublishingServer VBS Execute Arbitrary PowerShell Code
    reason: Alternative App-V proxy path to PowerShell on the same host.
  - id: d4ca7c59-e9e4-42d8-bf57-91a776efcb87
    name: LOLBIN Execution From Abnormal Drive
    reason: AppVLP is often run from odd paths to evade ASR path rules.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: AppVLP launch and command line
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*[Aa]pp[Vv][Ll][Pp]\.exe/ OR data_win_eventdata_originalFileName:/[Aa]pp[Vv][Ll][Pp]\.exe/)
    pivot_on: host
    window: 2h
  - name: Script interpreters and shells spawned
    query: data_win_system_eventID:1 AND data_win_eventdata_image:(/.*\\[Cc]md\.exe/ OR /.*\\[Pp]ower[Ss]hell.*\.exe/ OR /.*\\[Ww]script\.exe/ OR /.*\\[Cc]script\.exe/ OR /.*\\[Mm]shta\.exe/)
    pivot_on: host
    window: 1h
  - name: Office applications spawning children
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:(/.*\\[Ww]inword\.exe/ OR /.*\\[Ee]xcel\.exe/ OR /.*\\[Pp]ower[Pp]nt\.exe/ OR /.*\\[Oo]utlook\.exe/)
    pivot_on: host
    window: 4h
  - name: Outbound connections from LOLBins
    query: data_win_system_eventID:3 AND data_win_eventdata_image:(/.*\\[Pp]ower[Ss]hell.*\.exe/ OR /.*\\[Cc]md\.exe/ OR /.*\\[Mm]shta\.exe/ OR /.*\\[Rr]undll32\.exe/)
    pivot_on: host
    window: 1h
