name: Windows Group Discovery Via Net
id: windows-group-discovery-net-001
version: 1
schema_version: "1.0"
date: "2026-02-23"
author: SOCFortress LLC
status: production
type: Hunting

description: >
  Detects net.exe or net1.exe used with group argument for local/domain group 
  enumeration (excludes /add and /delete). Used by Volt Typhoon, Rhysida, 
  IcedID, Medusa, Prestige ransomware, and Azorult for AD reconnaissance.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image: "*\\\\net.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\\\net1.exe"
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine: "*group*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - wildcard:
            data_win_eventdata_commandLine: "*/add*"
        - wildcard:
            data_win_eventdata_commandLine: "*/delete*"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-23 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-23 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Windows endpoints with Sysmon 
  installed and configured to log process creation events (EventID 1) with full 
  command-line arguments.

known_false_positives: >
  Administrators may enumerate groups for troubleshooting. Hunting detection — 
  correlate with other discovery commands for higher confidence.

references:
  - https://attack.mitre.org/techniques/T1069/001/
  - https://attack.mitre.org/techniques/T1069/002/
  - https://media.defense.gov/2023/May/24/2003229517/-1/-1/0/CSA_Living_off_the_Land.PDF

response:
  message: >
    Group discovery via net on $agent_name$. 
    Command: $data_win_eventdata_commandLine$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1069.001, T1069.002
  risk_score: 25
  severity: low
  risk_objects:
    - field: agent_name
      type: system
      score: 25
  threat_objects: []

tags:
  analytic_story:
    - Windows Discovery Techniques
    - Active Directory Discovery
    - Volt Typhoon
    - Rhysida Ransomware
    - IcedID
  asset_type: Endpoint
  mitre_attack_id:
    - T1069.001
    - T1069.002
  custom_tags:
    - net_group
    - ad_discovery
    - hunting
    - reconnaissance
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*net\.exe/ OR data_win_eventdata_image:/.*net1\.exe/) AND data_win_eventdata_commandLine:/.*group.*/ AND NOT data_win_eventdata_commandLine:/.*\/add.*/ AND NOT data_win_eventdata_commandLine:/.*\/delete.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: f0c9d62f-a232-4edd-b17e-bc409fb133d4
    name: Domain Group Discovery With Dsquery
    reason: Same AD group enumeration goal through a different tool, seen when operators vary tradecraft.
  - id: a87736a6-95cd-4728-8689-3c64d5026b3e
    name: Domain Group Discovery With Wmic
    reason: WMIC-based group enumeration alongside net group indicates scripted multi-tool discovery.
  - id: 3f6bbf22-093e-4cb4-9641-83f47b8444b6
    name: Elevated Group Discovery With Wmic
    reason: Targeting privileged groups is the narrowing step after broad group listing.
  - id: bd8b828d-0dca-48e1-8a63-8a58ecf2644f
    name: Group Membership Reconnaissance Via Whoami.EXE
    reason: whoami /groups checks the operator's own privilege, typically run right before or after net group.
  - id: 5cc90652-4cbd-4241-aa3b-4b462fa5a248
    name: Potential Recon Activity Via Nltest.EXE
    reason: nltest finds domain controllers and trusts, the usual companion to net group /domain.
  - id: 514e7e3e-b3b4-4a67-af60-be20f139198b
    name: PUA - AdFind.EXE Execution
    reason: AdFind is the heavier AD enumeration step that follows initial net-based discovery in ransomware intrusions.
  - id: f376c8a7-a2d0-4ddc-aa0c-16c17236d962
    name: HackTool - Bloodhound/Sharphound Execution
    reason: Group discovery escalating to graph collection signals full AD mapping for privilege escalation.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Net account and domain discovery commands
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*\\[Nn]et1?\.exe/ AND data_win_eventdata_commandLine:/.*(user|localgroup|accounts|view).*/
    pivot_on: user
    window: 2h
  - name: Domain and trust discovery tools
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:(/.*\\[Nn]ltest\.exe/ OR /.*\\[Dd]squery\.exe/ OR /.*\\[Aa]d[Ff]ind\.exe/) OR data_win_eventdata_commandLine:/.*[Gg]et-[Aa][Dd](Group|User|Computer).*/)
    pivot_on: user
    window: 4h
  - name: Privilege and identity checks
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*\\[Ww]hoami\.exe/ AND data_win_eventdata_commandLine:/.*(\/groups|\/priv|\/all).*/
    pivot_on: user
    window: 2h
  - name: Discovery spawned by suspicious parents
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:(/.*\\[Ww]inword\.exe/ OR /.*\\[Ee]xcel\.exe/ OR /.*\\[Ww]script\.exe/ OR /.*\\[Mm]shta\.exe/ OR /.*\\[Rr]egsvr32\.exe/) AND data_win_eventdata_image:(/.*\\[Cc]md\.exe/ OR /.*\\[Pp]ower[Ss]hell\.exe/)
    pivot_on: host
    window: 2h
  - name: Lateral movement tooling after discovery
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*\\[Pp]s[Ee]xec.*/ OR data_win_eventdata_commandLine:/.*([Ww]mic.*\/node|[Nn]et use|[Ee]nter-[Pp][Ss]session).*/)
    pivot_on: user
    window: 4h
