correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: f376c8a7-a2d0-4ddc-aa0c-16c17236d962
    name: HackTool - Bloodhound/Sharphound Execution
    reason: SharpHound/BloodHound is the other .NET AD recon tool commonly run by the same operator beside SharpView
  - id: dd04b29a-beed-11eb-87bc-acde48001122
    name: Detect SharpHound Usage
    reason: Second SharpHound detection; confirms graph-based AD collection near SharpView
  - id: 02773bed-83bf-469f-b7ff-e676e7d78bab
    name: BloodHound Collection Files
    reason: BloodHound output files on disk show recon data staged for exfiltration
  - id: 70bc5215-526f-4477-963c-a47a5c9ebd12
    name: Potential Active Directory Enumeration Using AD Module - ProcCreation
    reason: AD module cmdlets are the native variant of the domain enumeration PowerView/SharpView performs
  - id: 9a132afa-654e-11eb-ae93-0242ac130002
    name: PUA - AdFind Suspicious Execution
    reason: AdFind is an alternative AD enumeration used in the same discovery phase
  - id: c3e05466-5f22-11eb-ae93-0242ac130002
    name: NLTest Domain Trust Discovery
    reason: Domain trust discovery via nltest is a standard Get-DomainTrust companion
  - id: 1eeed653-dbc8-4187-ad0c-eeebb20e6599
    name: Potential SPN Enumeration Via Setspn.EXE
    reason: SPN enumeration feeds Kerberoasting, the likely next step after SharpView lists service accounts
  - id: bd8b828d-0dca-48e1-8a63-8a58ecf2644f
    name: Group Membership Reconnaissance Via Whoami.EXE
    reason: Group membership recon with whoami is the local-context step before domain enumeration
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Native AD and domain discovery commands
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:(/.*\\[Nn][Ll][Tt][Ee][Ss][Tt]\.[Ee][Xx][Ee]/ OR /.*\\[Dd][Ss][Qq][Uu][Ee][Rr][Yy]\.[Ee][Xx][Ee]/ OR /.*\\[Ss][Ee][Tt][Ss][Pp][Nn]\.[Ee][Xx][Ee]/ OR /.*\\[Aa][Dd][Ff][Ii][Nn][Dd]\.[Ee][Xx][Ee]/) OR data_win_eventdata_commandLine:(/.*[Nn][Ee][Tt]1? (group|user|accounts|view).*\/[Dd][Oo][Mm][Aa][Ii][Nn].*/))
    pivot_on: host
    window: 6h
  - name: Kerberos roasting tooling and ticket requests
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:(/.*[Kk][Ee][Rr][Bb][Ee][Rr][Oo][Aa][Ss][Tt].*/ OR /.*[Aa][Ss][Rr][Ee][Pp][Rr][Oo][Aa][Ss][Tt].*/ OR /.*[Rr][Uu][Bb][Ee][Uu][Ss].*/ OR /.*[Rr][Ee][Qq][Uu][Ee][Ss][Tt]\-[Ss][Pp][Nn][Tt][Ii][Cc][Kk][Ee][Tt].*/)
    pivot_on: host
    window: 6h
  - name: Recon output staged to disk
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:(/.*[Bb][Ll][Oo][Oo][Dd][Hh][Oo][Uu][Nn][Dd].*/ OR /.*_(computers|users|groups|domains|gpos|ous|containers)\.[Jj][Ss][Oo][Nn]/ OR /.*[Ss][Hh][Aa][Rr][Pp][Vv][Ii][Ee][Ww].*/)
    pivot_on: host
    window: 6h
  - name: Archiving or transfer tools after recon
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:(/.*\\[Rr][Aa][Rr]\.[Ee][Xx][Ee]/ OR /.*\\7[Zz]\.[Ee][Xx][Ee]/ OR /.*\\[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]/ OR /.*\\[Rr][Cc][Ll][Oo][Nn][Ee]\.[Ee][Xx][Ee]/)
    pivot_on: host
    window: 6h
  - name: LDAP/ADWS traffic from non-standard processes
    query: data_win_system_eventID:"3" AND data_win_eventdata_destinationPort:(389 OR 636 OR 3268 OR 9389) AND NOT data_win_eventdata_image:/.*(lsass|svchost|MsMpEng|Microsoft\.ActiveDirectory).*/
    pivot_on: host
    window: 6h
