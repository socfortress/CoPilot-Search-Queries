name: Potential File Download Via MS-AppInstaller Protocol Handler
id: 180c7c5c-d64b-4a63-86e9-68910451bc8b
version: 1
schema_version: "1.0"
date: "2023-11-09"
author: Nasreddine Bencherchali (Nextron Systems), Swachchhanda Shrawan Poudel
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 180c7c5c-d64b-4a63-86e9-68910451bc8b
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects usage of the "ms-appinstaller" protocol handler via command line to
  potentially download arbitrary files via AppInstaller.EXE The downloaded files
  are temporarly stored in
  ":\Users\%username%\AppData\Local\Packages\Microsoft.DesktopAppInstaller_8wekyb3d8bbwe\AC\INetCache\<RANDOM-8-CHAR-DIRECTORY>".
  MITRE ATT&CK: T1218.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*ms-appinstaller://?source=*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*http*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*ms-appinstaller://?source=*'; data_win_eventdata_commandLine matches
  '*http*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://lolbas-project.github.io/lolbas/Binaries/AppInstaller/
  - https://attack.mitre.org/techniques/T1218/

response:
  message: >
    Potential File Download Via MS-AppInstaller Protocol Handler detected on
    host $agent_name$. Matched data_win_eventdata_commandLine:
    $data_win_eventdata_commandLine$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1218
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218
  custom_tags:
    - download
    - appinstaller
    - protocol
    - process_creation
    - sysmon
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Mm][Ss]-[Aa][Pp][Pp][Ii][Nn][Ss][Tt][Aa][Ll][Ll][Ee][Rr]:\/\/.[Ss][Oo][Uu][Rr][Cc][Ee]=.*/ AND data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 37651c2a-42cd-4a69-ae0d-22a4349aa04a
    name: Unsigned AppX Installation Attempt Using Add-AppxPackage
    reason: Alternate route to installing the same malicious MSIX/AppX package after download.
  - id: d059842b-6b9d-4ed1-b5c3-5b89143c6ede
    name: File Download Via Bitsadmin
    reason: Peer LOLBin download technique attackers swap in when AppInstaller is blocked.
  - id: 19b08b1c-861d-4e75-a1ef-ea0c1baf202b
    name: Suspicious Download Via Certutil.EXE
    reason: Peer LOLBin downloader for the same payload delivery stage.
  - id: 208748f7-881d-47ac-a29c-07ea84bf691d
    name: Suspicious Outlook Child Process
    reason: The ms-appinstaller link is commonly delivered by phishing mail and launched from Outlook.
  - id: c4db14d9-7909-48b4-a054-aa14d89dbb19
    name: Malicious PowerShell Process - Encoded Command
    reason: Installed package payloads commonly run encoded PowerShell next.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: AppInstaller and ms-appinstaller process activity
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*[Aa]pp[Ii]nstaller.*/ OR data_win_eventdata_commandLine:*ms-appinstaller*)
    pivot_on: host
    window: 4h
  - name: AppInstaller network connections
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*[Aa]pp[Ii]nstaller.*/
    pivot_on: host
    window: 4h
  - name: Packages dropped in AppInstaller INetCache
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*DesktopAppInstaller.*INetCache.*/
    pivot_on: host
    window: 4h
  - name: MSIX/AppX package installation commands
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(*Add-AppxPackage* OR *.msix* OR *.appx* OR *.appinstaller*)
    pivot_on: host
    window: 4h
  - name: DNS lookups from AppInstaller
    query: data_win_system_eventID:22 AND data_win_eventdata_image:/.*[Aa]pp[Ii]nstaller.*/
    pivot_on: host
    window: 4h
