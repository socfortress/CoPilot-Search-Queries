name: Sysmon Discovery Via Default Driver Altitude Using Findstr.EXE
id: 37db85d1-b089-490a-a59a-c7b6f984f480
version: 1
schema_version: "1.0"
date: "2023-11-14"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 37db85d1-b089-490a-a59a-c7b6f984f480
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects usage of "findstr" with the argument "385201". Which could indicate
  potential discovery of an installed Sysinternals Sysmon service using the
  default driver altitude (even if the name is changed). MITRE ATT&CK:
  T1518.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\find.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\findstr.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "FIND.EXE"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "FINDSTR.EXE"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine: "* 385201*"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\find.exe'; data_win_eventdata_image matches '*\findstr.exe';
  data_win_eventdata_originalFileName equals 'FIND.EXE', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1518.001/T1518.001.md#atomic-test-5---security-software-discovery---sysmon-service
  - https://attack.mitre.org/techniques/T1518/001/

response:
  message: >
    Sysmon Discovery Via Default Driver Altitude Using Findstr.EXE detected on
    host $agent_name$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1518.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1518.001
  custom_tags:
    - sysmon
    - default
    - driver
    - process_creation
    - discovery
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ff][Ii][Nn][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ff][Ii][Nn][Dd][Ss][Tt][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ff][Ii][Nn][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ff][Ii][Nn][Dd][Ss][Tt][Rr]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.* 385201.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 4931188c-178e-4ee7-a348-39e8a7a56821
    name: Filter Driver Unloaded Via Fltmc.EXE
    reason: fltmc output is what gets piped to findstr 385201, and fltmc unload is the next step to blind Sysmon.
  - id: 4d7cda18-1b12-4e52-b45c-d28653210df8
    name: Sysmon Driver Unloaded Via Fltmc.EXE
    reason: 'Direct follow-on: unloading the discovered Sysmon driver.'
  - id: 87911521-7098-470b-a459-9a57fc80bdfd
    name: Sysmon Configuration Update
    reason: Config replacement is the alternative evasion after discovering Sysmon.
  - id: 6a5f68d1-c4b5-46b9-94ee-5324892ea939
    name: Uninstall Sysinternals Sysmon
    reason: Uninstall is the destructive follow-on to finding Sysmon.
  - id: 4916a35e-bfc4-47d0-8e25-a003d7067061
    name: Sysmon Driver Altitude Change
    reason: Altitude change defeats this very discovery method and is a related evasion.
  - id: fe63010f-8823-4864-a96b-a7b4a0f7b929
    name: LSASS Process Reconnaissance Via Findstr.EXE
    reason: Same findstr-based reconnaissance habit used to prep credential access.
  - id: 904e8e61-8edf-4350-b59c-b905fc8e810c
    name: Security Software Discovery Via Powershell Script
    reason: Broader security tooling enumeration by the same operator.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Filter driver enumeration and unload
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Ff]ltmc.*/
    pivot_on:
    - host
    window: 2h
  - name: Security product discovery commands
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ww]mic.*[Aa]nti[Vv]irus[Pp]roduct|[Tt]asklist.*(msmpeng|sysmon)|[Ss]c.*query.*([Ss]ysmon|[Ww]in[Dd]efend)|[Gg]et-[Ss]ervice).*/
    pivot_on:
    - host
    window: 2h
  - name: Sysmon tamper or removal
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Ss]ysmon.*(-u|-c|-i).*/
    pivot_on:
    - host
    window: 2h
  - name: Event log clearing or disabling
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ww]evtutil.*(cl |clear-log|sl )|[Cc]lear-[Ee]vent[Ll]og).*/
    pivot_on:
    - host
    window: 4h
  - name: Findstr discovery of altitude
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Ff]ind.*385201.*/
    pivot_on:
    - host
    window: 2h
