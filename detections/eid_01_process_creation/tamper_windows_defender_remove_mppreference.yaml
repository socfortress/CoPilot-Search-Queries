name: Tamper Windows Defender Remove-MpPreference
id: 07e3cb2c-0608-410d-be4b-1511cb1a0448
version: 1
schema_version: "1.0"
date: "2022-08-05"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 07e3cb2c-0608-410d-be4b-1511cb1a0448
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects attempts to remove Windows Defender configurations using the
  'MpPreference' cmdlet. MITRE ATT&CK: T1685.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*Remove-MpPreference*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-ControlledFolderAccessProtectedFolders *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-AttackSurfaceReductionRules_Ids *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-AttackSurfaceReductionRules_Actions *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-CheckForSignaturesBeforeRunningScan *"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*Remove-MpPreference*'; data_win_eventdata_commandLine matches
  '*-ControlledFolderAccessProtectedFolders *'; data_win_eventdata_commandLine
  matches '*-AttackSurfaceReductionRules_Ids *', among other conditions.

known_false_positives: >
  Legitimate PowerShell scripts. Baseline expected activity in your environment
  and tune this detection before relying on it for automated response.

references:
  - https://techcommunity.microsoft.com/t5/core-infrastructure-and-security/windows-10-controlled-folder-access-event-search/ba-p/2326088
  - https://attack.mitre.org/techniques/T1685/

response:
  message: >
    Tamper Windows Defender Remove-MpPreference detected on host $agent_name$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1685
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685
  custom_tags:
    - tamper
    - defender
    - remove
    - process_creation
    - sysmon
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Rr][Ee][Mm][Oo][Vv][Ee]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ AND (data_win_eventdata_commandLine:/.*-[Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ll][Ee][Dd][Ff][Oo][Ll][Dd][Ee][Rr][Aa][Cc][Cc][Ee][Ss][Ss][Pp][Rr][Oo][Tt][Ee][Cc][Tt][Ee][Dd][Ff][Oo][Ll][Dd][Ee][Rr][Ss] .*/ OR data_win_eventdata_commandLine:/.*-[Aa][Tt][Tt][Aa][Cc][Kk][Ss][Uu][Rr][Ff][Aa][Cc][Ee][Rr][Ee][Dd][Uu][Cc][Tt][Ii][Oo][Nn][Rr][Uu][Ll][Ee][Ss]_[Ii][Dd][Ss] .*/ OR data_win_eventdata_commandLine:/.*-[Aa][Tt][Tt][Aa][Cc][Kk][Ss][Uu][Rr][Ff][Aa][Cc][Ee][Rr][Ee][Dd][Uu][Cc][Tt][Ii][Oo][Nn][Rr][Uu][Ll][Ee][Ss]_[Aa][Cc][Tt][Ii][Oo][Nn][Ss] .*/ OR data_win_eventdata_commandLine:/.*-[Cc][Hh][Ee][Cc][Kk][Ff][Oo][Rr][Ss][Ii][Gg][Nn][Aa][Tt][Uu][Rr][Ee][Ss][Bb][Ee][Ff][Oo][Rr][Ee][Rr][Uu][Nn][Nn][Ii][Nn][Gg][Ss][Cc][Aa][Nn] .*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: windows-defender-asr-threat-tamper-001
    name: Windows Defender ASR or Threat Configuration Tamper
    reason: Set-MpPreference counterpart that weakens the same ASR/threat settings Remove-MpPreference strips.
  - id: 17769c90-230e-488b-a463-e05c08e9d48f
    name: Powershell Defender Exclusion
    reason: Attackers pair removing protections with adding exclusions so payloads survive scans.
  - id: c6fb44c6-71f5-49e6-9462-1425d328aee3
    name: Powershell Base64 Encoded MpPreference Cmdlet
    reason: Same MpPreference tampering hidden in an encoded command.
  - id: a7ee1722-c3c5-aeff-3212-c777e4733217
    name: Disable Windows Defender AV Security Monitoring
    reason: Disabling real-time/behavior monitoring is the usual companion step.
  - id: 801bd44f-ceed-4eb6-887c-11544633c0aa
    name: Windows Defender Configuration Changes
    reason: Defender's own operational log confirms the config change actually landed.
  - id: a3ab73f1-bd46-4319-8f06-4b20d0617886
    name: Windows Defender Exploit Guard Tamper
    reason: Defender-side confirmation that ASR/Controlled Folder Access was altered.
  - id: 1321dc4e-a1fe-481d-a016-52c45f0c8b4f
    name: Windows Defender Exclusions Added
    reason: Exclusion additions logged by Defender around the same time.
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: Removing ASR/Controlled Folder Access protections commonly precedes ransomware impact.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other Defender preference cmdlets
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ss]et|[Aa]dd|[Rr]emove)-[Mm]p[Pp]reference.*/
    pivot_on: host
    window: 2h
  - name: Defender service/registry tampering via CLI
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ww]in[Dd]efend.*/ OR data_win_eventdata_commandLine:/.*[Ss]ec[Hh]ealth.*/) AND (data_win_eventdata_commandLine:/.*[Dd]isable.*/ OR data_win_eventdata_commandLine:/.*[Ss]top.*/ OR data_win_eventdata_commandLine:/.*[Rr]eg.*[Aa]dd.*/)
    pivot_on: host
    window: 2h
  - name: Defender configuration change events
    query: data_win_system_eventID:(5007 OR 5001 OR 5004 OR 5010 OR 5012) AND data_win_system_providerName:"Microsoft-Windows-Windows Defender"
    pivot_on: host
    window: 2h
  - name: Ransomware-prep commands
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Vv]ssadmin.*[Dd]elete.*/ OR data_win_eventdata_commandLine:/.*[Bb]cdedit.*[Rr]ecovery.*/ OR data_win_eventdata_commandLine:/.*[Ww]badmin.*[Dd]elete.*/)
    pivot_on: host
    window: 4h
  - name: Children of PowerShell excluding the tamper itself
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Pp]ower[Ss]hell.*/ AND NOT data_win_eventdata_commandLine:/.*[Mm]p[Pp]reference.*/
    pivot_on: host
    window: 1h
