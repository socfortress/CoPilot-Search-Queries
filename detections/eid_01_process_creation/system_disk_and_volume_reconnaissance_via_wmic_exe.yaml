name: System Disk And Volume Reconnaissance Via Wmic.EXE
id: c79da740-5030-45ec-a2e0-479e824a562c
version: 1
schema_version: "1.0"
date: "2025-10-20"
author: Stephen Lincoln '@slincoln-aiq' (AttackIQ)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: c79da740-5030-45ec-a2e0-479e824a562c
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  An adversary might use WMI to discover information about the system, such as
  the volume name, size, free space, and other disk information. This can be
  done using the 'wmic' command-line utility and has been observed being used by
  threat actors such as Volt Typhoon. MITRE ATT&CK: T1047, T1082.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\WMIC.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "wmic.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* volumename*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* logicaldisk*"
                    case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*path*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*win32_logicaldisk*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* volume*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* list *"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\WMIC.exe'; data_win_eventdata_originalFileName equals 'wmic.exe';
  data_win_eventdata_commandLine matches '* volumename*', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-144a
  - https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/wmic
  - https://attack.mitre.org/techniques/T1047/
  - https://attack.mitre.org/techniques/T1082/

response:
  message: >
    System Disk And Volume Reconnaissance Via Wmic.EXE detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1047, T1082
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1047
    - T1082
  custom_tags:
    - system
    - volume
    - reconnaissance
    - process_creation
    - sysmon
    - execution
    - discovery
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.* [Vv][Oo][Ll][Uu][Mm][Ee][Nn][Aa][Mm][Ee].*/ OR data_win_eventdata_commandLine:/.* [Ll][Oo][Gg][Ii][Cc][Aa][Ll][Dd][Ii][Ss][Kk].*/ OR (data_win_eventdata_commandLine:/.*[Pp][Aa][Tt][Hh].*/ AND data_win_eventdata_commandLine:/.*[Ww][Ii][Nn]32_[Ll][Oo][Gg][Ii][Cc][Aa][Ll][Dd][Ii][Ss][Kk].*/) OR (data_win_eventdata_commandLine:/.* [Vv][Oo][Ll][Uu][Mm][Ee].*/ AND data_win_eventdata_commandLine:/.* [Ll][Ii][Ss][Tt] .*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 9d7ca793-f6bd-471c-8d0f-11e68b2f0d2f
    name: Computer System Reconnaissance Via Wmic.EXE
    reason: WMIC computersystem recon is the sibling step in the same Volt Typhoon-style host profiling sequence.
  - id: 3e3ceccd-6c06-48b8-b5ff-ab1d25db8c1d
    name: Hardware Model Reconnaissance Via Wmic.EXE
    reason: Hardware model/BIOS queries via WMIC are usually issued in the same burst as disk/volume enumeration.
  - id: 221b251a-357a-49a9-920a-271802777cc0
    name: Potential Process Reconnaissance via Wmic.EXE
    reason: WMIC process listing follows disk profiling when the operator inventories security tooling and running software.
  - id: 4902d7aa-0134-11ec-9d65-acde48001122
    name: Local Account Discovery With Wmic
    reason: Local account enumeration via WMIC is the next discovery pivot after storage profiling.
  - id: 64c7adaa-48ee-483c-b0d6-7175bc65e6cc
    name: Domain Controller Discovery with Wmic
    reason: Domain controller discovery via WMIC shows recon escalating from the host to the domain.
  - id: 2cf5cc25-f39a-436d-a790-4857e5995ede
    name: Network Connection Discovery With Netstat
    reason: Netstat connection discovery commonly accompanies WMIC system discovery in hands-on-keyboard recon.
  - id: 68bcd73b-37ef-49cb-95fc-edc809730be6
    name: Potential Unquoted Service Path Reconnaissance Via Wmic.EXE
    reason: WMIC service-path recon looks for privilege-escalation footholds after the host is profiled.
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: Shadow copy deletion/creation is the destructive or credential-theft follow-on to volume enumeration.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other WMIC discovery queries on this host
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr][Ss][Yy][Ss][Tt][Ee][Mm].*/ OR data_win_eventdata_commandLine:/.*[Bb][Ii][Oo][Ss] [Gg][Ee][Tt].*/ OR data_win_eventdata_commandLine:/.*[Cc][Pp][Uu] [Gg][Ee][Tt].*/ OR data_win_eventdata_commandLine:/.*[Oo][Ss] [Gg][Ee][Tt].*/ OR data_win_eventdata_commandLine:/.*[Uu][Ss][Ee][Rr][Aa][Cc][Cc][Oo][Uu][Nn][Tt].*/ OR data_win_eventdata_commandLine:/.*[Pp][Rr][Oo][Cc][Ee][Ss][Ss] [Ll][Ii][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Qq][Ff][Ee].*/ OR data_win_eventdata_commandLine:/.*[Pp][Rr][Oo][Dd][Uu][Cc][Tt] [Gg][Ee][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ss][Hh][Aa][Dd][Oo][Ww][Cc][Oo][Pp][Yy].*/)
    pivot_on: host
    window: 2h
  - name: Native recon utilities run on this host
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Ss][Yy][Ss][Tt][Ee][Mm][Ii][Nn][Ff][Oo]\.[Ee][Xx][Ee]|[Ii][Pp][Cc][Oo][Nn][Ff][Ii][Gg]\.[Ee][Xx][Ee]|[Nn][Ll][Tt][Ee][Ss][Tt]\.[Ee][Xx][Ee]|[Nn][Ee][Tt][Ss][Tt][Aa][Tt]\.[Ee][Xx][Ee]|[Tt][Aa][Ss][Kk][Ll][Ii][Ss][Tt]\.[Ee][Xx][Ee]|[Ww][Hh][Oo][Aa][Mm][Ii]\.[Ee][Xx][Ee]|[Aa][Rr][Pp]\.[Ee][Xx][Ee]|[Qq][Uu][Ss][Ee][Rr]\.[Ee][Xx][Ee]|[Nn][Ee][Tt]\.[Ee][Xx][Ee]|[Nn][Ee][Tt]1\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 1h
  - name: NTDS or registry hive staging via ntdsutil, vssadmin or reg save
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll].*/ OR data_win_eventdata_commandLine:/.*[Ii][Ff][Mm].*/ OR data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee] [Ss][Hh][Aa][Dd][Oo][Ww].*/ OR data_win_eventdata_commandLine:/.*[Ll][Ii][Ss][Tt] [Ss][Hh][Aa][Dd][Oo][Ww][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ss][Aa][Vv][Ee] .*[Hh][Kk][Ll][Mm].*([Ss][Aa][Mm]|[Ss][Yy][Ss][Tt][Ee][Mm]|[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]).*/)
    pivot_on: host
    window: 4h
  - name: Port proxy tunnelling set up via netsh
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Nn][Ee][Tt][Ss][Hh]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*[Pp][Oo][Rr][Tt][Pp][Rr][Oo][Xx][Yy].*/ OR data_win_eventdata_commandLine:/.*[Aa][Dd][Dd] [Vv]4[Tt][Oo][Vv]4.*/)
    pivot_on: host
    window: 4h
  - name: Archive creation staging data for exfiltration
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]-[Aa][Rr][Cc][Hh][Ii][Vv][Ee].*/ OR data_win_eventdata_commandLine:/.*7[Zz].*/ OR data_win_eventdata_commandLine:/.*[Rr][Aa][Rr].[Ee][Xx][Ee].*/ OR data_win_eventdata_commandLine:/.* [Aa] -.*/)
    pivot_on: host
    window: 6h
