name: Windows Attempt To Stop Security Service
id: windows-attempt-stop-security-service-001
version: 1
schema_version: "1.0"
date: "2026-03-03"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects attempts to stop security-related services using sc.exe, net.exe, 
  or PowerShell Stop-Service. Disabling security services undermines endpoint 
  protection, enabling malware execution and persistence. Used by WhisperGate, 
  Azorult, Trickbot, and destructive wipers.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_image: "*\\sc.exe"
                    - wildcard:
                        data_win_eventdata_commandLine: "*stop*"
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_image: "*\\net.exe"
                    - wildcard:
                        data_win_eventdata_commandLine: "*stop*"
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_image: "*\\net1.exe"
                    - wildcard:
                        data_win_eventdata_commandLine: "*stop*"
              - wildcard:
                  data_win_eventdata_commandLine: "*Stop-Service*"
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine: "*WinDefend*"
              - wildcard:
                  data_win_eventdata_commandLine: "*MsMpSvc*"
              - wildcard:
                  data_win_eventdata_commandLine: "*McAfeeDLPAgentService*"
              - wildcard:
                  data_win_eventdata_commandLine: "*mfevtp*"
              - wildcard:
                  data_win_eventdata_commandLine: "*macmnsvc*"
              - wildcard:
                  data_win_eventdata_commandLine: "*masvc*"
              - wildcard:
                  data_win_eventdata_commandLine: "*WdNisSvc*"
              - wildcard:
                  data_win_eventdata_commandLine: "*Sense*"
              - wildcard:
                  data_win_eventdata_commandLine: "*wuauserv*"
              - wildcard:
                  data_win_eventdata_commandLine: "*SentinelAgent*"
              - wildcard:
                  data_win_eventdata_commandLine: "*CrowdStrike*"
              - wildcard:
                  data_win_eventdata_commandLine: "*CarbonBlack*"
              - wildcard:
                  data_win_eventdata_commandLine: "*cbdefense*"
              - wildcard:
                  data_win_eventdata_commandLine: "*Cylance*"
              - wildcard:
                  data_win_eventdata_commandLine: "*Tanium*"
              - wildcard:
                  data_win_eventdata_commandLine: "*WazuhSvc*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    type: string
    required: true
    example: "lab"
  START_TIME:
    type: datetime
    default: "now-24h"
  END_TIME:
    type: datetime
    default: "now"

how_to_implement: >
  Requires Sysmon EventID 1 with full command-line logging. Customize 
  the security service list to match your environment's security tools.

known_false_positives: >
  Administrators may stop services for maintenance. Investigate user 
  context and timing.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1562.001/T1562.001.md
  - https://www.microsoft.com/security/blog/2022/01/15/destructive-malware-targeting-ukrainian-organizations/
  - https://attack.mitre.org/techniques/T1562/001/

response:
  message: >
    Security service stop attempt on $agent_name$. 
    Command: $data_win_eventdata_commandLine$. 
    Parent: $data_win_eventdata_parentImage$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1562.001
  risk_score: 20
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 20
  threat_objects: []

tags:
  analytic_story:
    - WhisperGate
    - Disabling Security Tools
    - Azorult
    - Trickbot
    - Data Destruction
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1562.001
  custom_tags:
    - security_service_stop
    - defense_evasion
    - sc_stop
    - net_stop
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\\\sc\.exe/ AND data_win_eventdata_commandLine:/.*stop.*/) OR (data_win_eventdata_image:/.*\\\\net\.exe/ AND data_win_eventdata_commandLine:/.*stop.*/) OR (data_win_eventdata_image:/.*\\\\net1\.exe/ AND data_win_eventdata_commandLine:/.*stop.*/) OR data_win_eventdata_commandLine:/.*Stop-Service.*/) AND (data_win_eventdata_commandLine:/.*WinDefend.*/ OR data_win_eventdata_commandLine:/.*MsMpSvc.*/ OR data_win_eventdata_commandLine:/.*McAfeeDLPAgentService.*/ OR data_win_eventdata_commandLine:/.*mfevtp.*/ OR data_win_eventdata_commandLine:/.*macmnsvc.*/ OR data_win_eventdata_commandLine:/.*masvc.*/ OR data_win_eventdata_commandLine:/.*WdNisSvc.*/ OR data_win_eventdata_commandLine:/.*Sense.*/ OR data_win_eventdata_commandLine:/.*wuauserv.*/ OR data_win_eventdata_commandLine:/.*SentinelAgent.*/ OR data_win_eventdata_commandLine:/.*CrowdStrike.*/ OR data_win_eventdata_commandLine:/.*CarbonBlack.*/ OR data_win_eventdata_commandLine:/.*cbdefense.*/ OR data_win_eventdata_commandLine:/.*Cylance.*/ OR data_win_eventdata_commandLine:/.*Tanium.*/ OR data_win_eventdata_commandLine:/.*WazuhSvc.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 8f3a614f-6b98-4f7d-82dd-d0df38452a8b
    name: Windows Excessive Service Stop Attempt
    reason: Mass service stopping is the wiper/ransomware pre-encryption pattern.
  - id: windows-powershell-start-or-stop-service-001
    name: PowerShell Start or Stop Service
    reason: Stop-Service is one of this rule's vectors; PowerShell-side detection corroborates.
  - id: 5e95028c-5229-4214-afae-d653d573d0ec
    name: Security Service Disabled Via Reg.EXE
    reason: Persistent disabling of the service via registry usually accompanies the stop.
  - id: 4a6713f6-3331-11ed-a261-0242ac120002
    name: Taskkill Symantec Endpoint Protection
    reason: Killing the AV process is the fallback when service stop is blocked.
  - id: windows-disable-modify-tools-taskkill-001
    name: Windows Disable or Modify Tools Via Taskkill
    reason: Process-level kill of security tools alongside service stop signals defense evasion.
  - id: 17769c90-230e-488b-a463-e05c08e9d48f
    name: Powershell Defender Exclusion
    reason: Defender exclusions are added in the same evasion phase before payload drops.
  - id: windows-powershell-disable-security-monitoring-001
    name: Windows PowerShell Disable Security Monitoring
    reason: Set-MpPreference disabling monitoring is the sibling technique to stopping WinDefend.
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: Ransomware stops security services then deletes shadow copies before impact.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other service stop or disable commands
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*sc(\.exe)?\s+(stop|config|delete).*/ OR data_win_eventdata_commandLine:/.*net1?\s+stop.*/ OR data_win_eventdata_commandLine:/.*[Ss]top-[Ss]ervice.*/ OR data_win_eventdata_commandLine:/.*[Ss]et-[Ss]ervice.*[Dd]isabled.*/)
    pivot_on: host
    window: 2h
  - name: Defender and AV tampering
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*[Ss]et-[Mm]p[Pp]reference.*/ OR data_win_eventdata_commandLine:/.*[Aa]dd-[Mm]p[Pp]reference.*/ OR data_win_eventdata_commandLine:/.*DisableAntiSpyware.*/ OR data_win_eventdata_commandLine:/.*[Tt]askkill.*(MsMpEng|SentinelAgent|CSFalcon|Sophos).*/)
    pivot_on: host
    window: 2h
  - name: Ransomware impact precursors
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*vssadmin.*[Dd]elete.*/ OR data_win_eventdata_commandLine:/.*wmic.*shadowcopy.*delete.*/ OR data_win_eventdata_commandLine:/.*bcdedit.*(recoveryenabled|ignoreallfailures).*/ OR data_win_eventdata_commandLine:/.*wbadmin.*delete.*/)
    pivot_on: host
    window: 2h
  - name: Log clearing after service stop
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*wevtutil.*(cl|clear-log).*/ OR data_win_eventdata_commandLine:/.*auditpol.*(\/clear|\/remove).*/ OR data_win_eventdata_commandLine:/.*[Cc]lear-[Ee]vent[Ll]og.*/)
    pivot_on: host
    window: 2h
  - name: Remote or macro-driven stop context
    query: data_win_system_eventID:1 AND (data_win_eventdata_parentImage:*\\psexesvc.exe OR data_win_eventdata_parentImage:*\\wmiprvse.exe OR data_win_eventdata_parentImage:*\\winword.exe OR data_win_eventdata_parentImage:*\\excel.exe) AND data_win_eventdata_commandLine:/.*([Ss]top|[Dd]isable).*/
    pivot_on: host
    window: 2h
