name: Windows Attempt To Stop Security Service
id: windows-attempt-stop-security-service-001
version: 1
schema_version: "1.0"
date: "2026-03-03"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects attempts to stop security-related services using sc.exe, net.exe, 
  or PowerShell Stop-Service. Disabling security services undermines endpoint 
  protection, enabling malware execution and persistence. Used by WhisperGate, 
  Azorult, Trickbot, and destructive wipers.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_image: "*\\sc.exe"
                    - wildcard:
                        data_win_eventdata_commandLine: "*stop*"
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_image: "*\\net.exe"
                    - wildcard:
                        data_win_eventdata_commandLine: "*stop*"
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_image: "*\\net1.exe"
                    - wildcard:
                        data_win_eventdata_commandLine: "*stop*"
              - wildcard:
                  data_win_eventdata_commandLine: "*Stop-Service*"
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine: "*WinDefend*"
              - wildcard:
                  data_win_eventdata_commandLine: "*MsMpSvc*"
              - wildcard:
                  data_win_eventdata_commandLine: "*McAfeeDLPAgentService*"
              - wildcard:
                  data_win_eventdata_commandLine: "*mfevtp*"
              - wildcard:
                  data_win_eventdata_commandLine: "*macmnsvc*"
              - wildcard:
                  data_win_eventdata_commandLine: "*masvc*"
              - wildcard:
                  data_win_eventdata_commandLine: "*WdNisSvc*"
              - wildcard:
                  data_win_eventdata_commandLine: "*Sense*"
              - wildcard:
                  data_win_eventdata_commandLine: "*wuauserv*"
              - wildcard:
                  data_win_eventdata_commandLine: "*SentinelAgent*"
              - wildcard:
                  data_win_eventdata_commandLine: "*CrowdStrike*"
              - wildcard:
                  data_win_eventdata_commandLine: "*CarbonBlack*"
              - wildcard:
                  data_win_eventdata_commandLine: "*cbdefense*"
              - wildcard:
                  data_win_eventdata_commandLine: "*Cylance*"
              - wildcard:
                  data_win_eventdata_commandLine: "*Tanium*"
              - wildcard:
                  data_win_eventdata_commandLine: "*WazuhSvc*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    type: string
    required: true
    example: "lab"
  START_TIME:
    type: datetime
    default: "now-24h"
  END_TIME:
    type: datetime
    default: "now"

how_to_implement: >
  Requires Sysmon EventID 1 with full command-line logging. Customize 
  the security service list to match your environment's security tools.

known_false_positives: >
  Administrators may stop services for maintenance. Investigate user 
  context and timing.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1562.001/T1562.001.md
  - https://www.microsoft.com/security/blog/2022/01/15/destructive-malware-targeting-ukrainian-organizations/
  - https://attack.mitre.org/techniques/T1562/001/

response:
  message: >
    Security service stop attempt on $agent_name$. 
    Command: $data_win_eventdata_commandLine$. 
    Parent: $data_win_eventdata_parentImage$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1562.001
  risk_score: 20
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 20
  threat_objects: []

tags:
  analytic_story:
    - WhisperGate
    - Disabling Security Tools
    - Azorult
    - Trickbot
    - Data Destruction
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1562.001
  custom_tags:
    - security_service_stop
    - defense_evasion
    - sc_stop
    - net_stop
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\\\sc\.exe/ AND data_win_eventdata_commandLine:/.*stop.*/) OR (data_win_eventdata_image:/.*\\\\net\.exe/ AND data_win_eventdata_commandLine:/.*stop.*/) OR (data_win_eventdata_image:/.*\\\\net1\.exe/ AND data_win_eventdata_commandLine:/.*stop.*/) OR data_win_eventdata_commandLine:/.*Stop-Service.*/) AND (data_win_eventdata_commandLine:/.*WinDefend.*/ OR data_win_eventdata_commandLine:/.*MsMpSvc.*/ OR data_win_eventdata_commandLine:/.*McAfeeDLPAgentService.*/ OR data_win_eventdata_commandLine:/.*mfevtp.*/ OR data_win_eventdata_commandLine:/.*macmnsvc.*/ OR data_win_eventdata_commandLine:/.*masvc.*/ OR data_win_eventdata_commandLine:/.*WdNisSvc.*/ OR data_win_eventdata_commandLine:/.*Sense.*/ OR data_win_eventdata_commandLine:/.*wuauserv.*/ OR data_win_eventdata_commandLine:/.*SentinelAgent.*/ OR data_win_eventdata_commandLine:/.*CrowdStrike.*/ OR data_win_eventdata_commandLine:/.*CarbonBlack.*/ OR data_win_eventdata_commandLine:/.*cbdefense.*/ OR data_win_eventdata_commandLine:/.*Cylance.*/ OR data_win_eventdata_commandLine:/.*Tanium.*/ OR data_win_eventdata_commandLine:/.*WazuhSvc.*/)

correlation:
  # Authored by the correlation engine for review. Related CoPilot Searches to run
  # around an alert from this rule, scoped to the same host/user/IP within the window.
  related_rules:
    - id: de7fcadc-04f3-11ec-a241-acde48001122
      name: "AdsiSearcher Account Discovery"
      reason: "same analytic story: Data Destruction"
    - id: 2452e632-9e0d-11eb-bacd-acde48001122
      name: "DNS Exfiltration Using Nslookup App"
      reason: "same analytic story: Compromised Windows Host"
    - id: cc316032-924a-11eb-91a2-acde48001122
      name: "DSQuery Domain Discovery"
      reason: "same analytic story: Compromised Windows Host"
    - id: 5ee2bcd0-b2ff-11eb-bb34-acde48001122
      name: "Delete ShadowCopy With PowerShell"
      reason: "same analytic story: Data Destruction"
    - id: bc1dc6b8-c954-11eb-bade-acde48001122
      name: "Detect Empire with PowerShell Script Block Logging"
      reason: "same analytic story: Data Destruction"
    - id: 9b3af1e6-5b68-11eb-ae93-0242ac130002
      name: "Detect MSHTA Url in Command Line"
      reason: "same analytic story: Compromised Windows Host"
    - id: 8148c29c-c952-11eb-9255-acde48001122
      name: "Detect Mimikatz With PowerShell Script Block Logging"
      reason: "same analytic story: Data Destruction"
    - id: 72170ec5-f7d2-42f5-aefb-2b8be6aad15f
      name: "Detect Regasm Spawning a Process"
      reason: "same analytic story: Compromised Windows Host"
    - id: bc477b57-5c21-4ab6-9c33-668772e7f114
      name: "Detect Regsvcs Spawning a Process"
      reason: "same analytic story: Compromised Windows Host"
    - id: 070e9b80-6252-11eb-ae93-0242ac130002
      name: "Detect Regsvr32 Application Control Bypass"
      reason: "same analytic story: Compromised Windows Host"
    - id: b89919ed-fe5f-492c-b139-95dbb162039e
      name: "Detect Use of cmd exe to Launch Script Interpreters"
      reason: "same analytic story: Azorult"
    - id: a0873b32-5b68-11eb-ae93-0242ac130002
      name: "Detect mshta inline hta execution"
      reason: "same analytic story: Compromised Windows Host"
  window: 1h
  enrichment_searches:
  # Rule-specific telemetry pivots the engine runs around an alert from this rule,
  # scoped to the alert's host/user/IP within the window (behaviour-targeted, not a sweep).
    - name: "Security-tool / Defender tampering on this host"
      query: 'data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee][Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Aa][Nn][Tt][Ii][Ss][Pp][Yy][Ww][Aa][Rr][Ee].*/ OR data_win_eventdata_commandLine:/.*[Aa][Dd][Dd]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee] -[Ee][Xx][Cc][Ll][Uu][Ss][Ii][Oo][Nn][Pp][Aa][Tt][Hh].*/ OR data_win_eventdata_commandLine:/.*[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll].*/ OR data_win_eventdata_commandLine:/.*[Cc][Ll][Ee][Aa][Rr]-[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg].*/ OR data_win_eventdata_commandLine:/.*[Ff][Ss][Uu][Tt][Ii][Ll] [Uu][Ss][Nn] [Dd][Ee][Ll][Ee][Tt][Ee][Jj][Oo][Uu][Rr][Nn][Aa][Ll].*/ OR data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ss][Tt][Oo][Pp]-[Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc] [Ss][Tt][Oo][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc] [Cc][Oo][Nn][Ff][Ii][Gg].*/)'
      pivot_on: [host]
      window: 2h
    - name: "Follow-on LOLBin / signed-binary-proxy execution on this host"
      query: 'data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|\\[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Aa][Ss][Mm]\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Cc][Ss]\.[Ee][Xx][Ee]|\\[Mm][Ss][Bb][Uu][Ii][Ll][Dd]\.[Ee][Xx][Ee]|\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]|\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]|\\[Cc][Mm][Ss][Tt][Pp]\.[Ee][Xx][Ee]|\\[Oo][Dd][Bb][Cc][Cc][Oo][Nn][Ff]\.[Ee][Xx][Ee]|\\[Ff][Oo][Rr][Ff][Ii][Ll][Ee][Ss]\.[Ee][Xx][Ee]|\\[Pp][Cc][Aa][Ll][Uu][Aa]\.[Ee][Xx][Ee]|\\[Mm][Aa][Vv][Ii][Nn][Jj][Ee][Cc][Tt]\.[Ee][Xx][Ee]|\\[Ss][Cc][Rr][Ii][Pp][Tt][Rr][Uu][Nn][Nn][Ee][Rr]\.[Ee][Xx][Ee])/'
      pivot_on: [host]
      window: 1h
    - name: "Outbound connections by script interpreters on this host"
      query: 'data_win_system_eventID:"3" AND data_win_eventdata_image:/.*(\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]|\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]_[Ii][Ss][Ee]\.[Ee][Xx][Ee]|\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]|\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee])/'
      pivot_on: [host]
      window: 1h
