name: Suspicious Recursive Takeown
id: 554601fb-9b71-4bcc-abf4-21a611be4fde
version: 1
schema_version: "1.0"
date: "2022-11-21"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 554601fb-9b71-4bcc-abf4-21a611be4fde
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Adversaries can interact with the DACLs using built-in Windows commands
  takeown which can grant adversaries higher permissions on specific files and
  folders. MITRE ATT&CK: T1222.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\takeown.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*/f *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*/r*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\takeown.exe'; data_win_eventdata_commandLine matches '*/f *';
  data_win_eventdata_commandLine matches '*/r*'.

known_false_positives: >
  Scripts created by developers and admins. Administrative activity. Baseline
  expected activity in your environment and tune this detection before relying
  on it for automated response.

references:
  - https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/takeown
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1222.001/T1222.001.md#atomic-test-1---take-ownership-using-takeown-utility
  - https://attack.mitre.org/techniques/T1222/001/

response:
  message: >
    Suspicious Recursive Takeown detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1222.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1222.001
  custom_tags:
    - recursive
    - takeown
    - process_creation
    - sysmon
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Tt][Aa][Kk][Ee][Oo][Ww][Nn]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*\/[Ff] .*/ AND data_win_eventdata_commandLine:/.*\/[Rr].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: fa7ca5c6-c9d8-11eb-bce9-acde48001122
    name: Permission Modification using Takeown App
    reason: Generic takeown abuse detection on the same host; confirms the ownership grab from another angle.
  - id: b1b1e316-accc-11eb-a9b4-acde48001122
    name: ICACLS Grant Command
    reason: takeown is almost always followed by icacls /grant to actually gain access to the seized files.
  - id: cf8d753e-a8fe-11eb-8f58-acde48001122
    name: Icacls Deny Command
    reason: Actors also use icacls deny to lock out defenders or users after taking ownership.
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: Recursive ownership grabs are a ransomware prelude that precedes backup and shadow copy destruction.
  - id: c9fbe8e9-119d-40a6-9b59-dd58a5d84429
    name: Potential Ransomware or Unauthorized MBR Tampering Via Bcdedit.EXE
    reason: Disabling boot recovery is a common impact-stage step after permission takeover.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: ACL changes via icacls/cacls
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*\\(icacls|cacls|xcacls)\.exe/ AND data_win_eventdata_commandLine:/.*(grant|deny|reset|setowner).*/
    pivot_on: host
    window: 2h
  - name: All takeown executions
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*\\takeown\.exe/
    pivot_on: host
    window: 4h
  - name: Shadow copy and recovery inhibition
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Vv]ssadmin.*[Dd]elete.*/ OR /.*[Bb]cdedit.*[Rr]ecovery.*/ OR /.*[Ww]badmin.*[Dd]elete.*/ OR /.*[Ss]hadowcopy.*[Dd]elete.*/)
    pivot_on: host
    window: 4h
  - name: Security service stop or tamper
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*net1? stop .*/ OR /.*sc(\.exe)? (stop|config).*/ OR /.*[Tt]askkill.*/)
    pivot_on: host
    window: 2h
