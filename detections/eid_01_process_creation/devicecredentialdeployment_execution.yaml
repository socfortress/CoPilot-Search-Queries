name: DeviceCredentialDeployment Execution
id: b8b1b304-a60f-4999-9a6e-c547bde03ffd
version: 1
schema_version: "1.0"
date: "2022-08-19"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: b8b1b304-a60f-4999-9a6e-c547bde03ffd
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of DeviceCredentialDeployment to hide a process from
  view. MITRE ATT&CK: T1218.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\DeviceCredentialDeployment.exe"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\DeviceCredentialDeployment.exe'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/LOLBAS-Project/LOLBAS/pull/147
  - https://attack.mitre.org/techniques/T1218/

response:
  message: >
    DeviceCredentialDeployment Execution detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1218
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218
  custom_tags:
    - devicecredentialdeployment
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Dd][Ee][Vv][Ii][Cc][Ee][Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll][Dd][Ee][Pp][Ll][Oo][Yy][Mm][Ee][Nn][Tt]\.[Ee][Xx][Ee]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: cc268ac1-42d9-40fd-9ed3-8c4e1a5b87e6
    name: Devtoolslauncher.exe Executes Specified Binary
    reason: Sibling signed-LOLBin proxy execution technique; both run or hide payloads under trusted Microsoft binaries.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: DeviceCredentialDeployment executions
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Dd]evice[Cc]redential[Dd]eployment\.exe/
    pivot_on: host
    window: 4h
  - name: Children of DeviceCredentialDeployment
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Dd]evice[Cc]redential[Dd]eployment\.exe/
    pivot_on: host
    window: 4h
  - name: Commands referencing DeviceCredentialDeployment
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*[Dd]evice[Cc]redential[Dd]eployment.*/
    pivot_on: host
    window: 2h
  - name: LOLBin proxy execution with remote or staged payloads
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*(mshta|rundll32|regsvr32|msbuild|wscript|cscript)\.exe/ AND data_win_eventdata_commandLine:/.*(http|ProgramData|Temp|Users.Public|-enc|javascript:).*/
    pivot_on: host
    window: 4h
  - name: Download cradles and transfer utilities
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(certutil.*-urlcache|bitsadmin.*\/transfer|Invoke-WebRequest|DownloadString|curl ).*/
    pivot_on: host
    window: 4h
