name: Suspicious NTLM Authentication on the Printer Spooler Service
id: bb76d96b-821c-47cf-944b-7ce377864492
version: 1
schema_version: "1.0"
date: "2023-02-09"
author: Elastic (idea), Tobias Michalski (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: bb76d96b-821c-47cf-944b-7ce377864492
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a privilege elevation attempt by coercing NTLM authentication on the
  Printer Spooler service. MITRE ATT&CK: T1212.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\rundll32.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "RUNDLL32.EXE"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*C:\\\\windows\\\\system32\\\\davclnt.dll,DavSetCookie*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*http*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*spoolss*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*srvsvc*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*/print/pipe/*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\rundll32.exe'; data_win_eventdata_originalFileName equals 'RUNDLL32.EXE';
  data_win_eventdata_commandLine matches
  '*C:\windows\system32\davclnt.dll,DavSetCookie*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/med0x2e/status/1520402518685200384
  - https://github.com/elastic/detection-rules/blob/dd224fb3f81d0b4bf8593c5f02a029d647ba2b2d/rules/windows/credential_access_relay_ntlm_auth_via_http_spoolss.toml
  - https://attack.mitre.org/techniques/T1212/

response:
  message: >
    Suspicious NTLM Authentication on the Printer Spooler Service detected on
    host $agent_name$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1212
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1212
  custom_tags:
    - printer
    - spooler
    - service
    - process_creation
    - sysmon
    - privilege_escalation
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Dd][Aa][Vv][Cc][Ll][Nn][Tt]\.[Dd][Ll][Ll],[Dd][Aa][Vv][Ss][Ee][Tt][Cc][Oo][Oo][Kk][Ii][Ee].*/ AND data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp].*/ AND (data_win_eventdata_commandLine:/.*[Ss][Pp][Oo][Oo][Ll][Ss][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ss][Rr][Vv][Ss][Vv][Cc].*/ OR data_win_eventdata_commandLine:/.*\/[Pp][Rr][Ii][Nn][Tt]\/[Pp][Ii][Pp][Ee]\/.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 982e9f2d-1a85-4d5b-aea4-31f5e97c6555
    name: Suspicious WebDav Client Execution Via Rundll32.EXE
    reason: Same davclnt.dll DavSetCookie rundll32 primitive in its broader suspicious-target form; confirms WebClient abuse to reach an attacker host.
  - id: 2dbd9d3d-9e27-42a8-b8df-f13825c6c3d5
    name: WebDav Client Execution Via Rundll32.EXE
    reason: Baseline sighting of rundll32 davclnt.dll usage, the transport that makes the spooler authenticate over HTTP/WebDAV.
  - id: 214e8f95-100a-4e04-bb31-ef6cba8ce07e
    name: DCERPC SMB Spoolss Named Pipe
    reason: Spoolss pipe access over SMB is the other half of the print-spooler coercion path (PrinterBug/PrintNightmare family).
  - id: 637f689e-b4a5-4a86-be0e-0100a0a33ba2
    name: HackTool - EfsPotato Named Pipe Creation
    reason: Potato-style local privilege escalation tools create coercion pipes to capture the forced SYSTEM NTLM authentication.
  - id: 4d0083b3-580b-40da-9bba-626c19fe4033
    name: HackTool - CoercedPotato Named Pipe Creation
    reason: A coerced SYSTEM authentication captured by a rogue pipe turns into a SYSTEM token.
  - id: e8d34729-86a4-4140-adfd-0a29c2106307
    name: HackTool - CoercedPotato Execution
    reason: Process-level execution of the potato tool that consumes the coerced spooler authentication.
  - id: 9bd04a79-dabe-4f1f-a5ff-92430265c96b
    name: Privilege Escalation via Named Pipe Impersonation
    reason: Successful impersonation of the coerced SYSTEM client is how this attack ends in elevation.
  - id: 590a5f4c-6c8c-4f10-8307-89afe9453a9d
    name: Suspicious Child Process Created as System
    reason: 'Post-exploitation: attacker-controlled shells running as SYSTEM after the coercion succeeds.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: WebClient/DAV rundll32 execution
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Dd][Aa][Vv][Cc][Ll][Nn][Tt]\.[Dd][Ll][Ll].*/
    pivot_on: host
    window: 2h
  - name: Spooler and EFS coercion pipe activity
    query: (data_win_system_eventID:"17" OR data_win_system_eventID:"18") AND (data_win_eventdata_pipeName:/.*[Ss][Pp][Oo][Oo][Ll][Ss][Ss].*/ OR data_win_eventdata_pipeName:/.*[Ee][Ff][Ss][Rr][Pp][Cc].*/ OR data_win_eventdata_pipeName:/.*[Ll][Ss][Aa][Rr][Pp][Cc].*/ OR data_win_eventdata_pipeName:/.*[Ss][Rr][Vv][Ss][Vv][Cc].*/)
    pivot_on: host
    window: 2h
  - name: Potato-style privilege escalation tools
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Pp][Oo][Tt][Aa][Tt][Oo].*/ OR data_win_eventdata_commandLine:/.*[Pp][Rr][Ii][Nn][Tt][Ss][Pp][Oo][Oo][Ff][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Ee][Ff][Ss][Pp][Oo][Tt][Aa][Tt][Oo].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Ee][Rr][Cc][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Ss][Pp][Oo][Oo][Ll][Ss][Aa][Mm][Pp][Ll][Ee].*/ OR (data_win_eventdata_image:/.*\\[Pp][Rr][Ii][Nn][Tt][Ss][Pp][Oo][Oo][Ff][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ss][Pp][Oo][Oo][Ll][Ss][Aa][Mm][Pp][Ll][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Jj][Uu][Ii][Cc][Yy][Pp][Oo][Tt][Aa][Tt][Oo]\.[Ee][Xx][Ee]/))
    pivot_on: host
    window: 2h
  - name: SYSTEM shells spawned after coercion
    query: data_win_system_eventID:"1" AND data_win_eventdata_user:/.*[Ss][Yy][Ss][Tt][Ee][Mm]/ AND (data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/) AND NOT (data_win_eventdata_parentImage:/.*\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\.[Ee][Xx][Ee]/)
    pivot_on: host
    window: 2h
  - name: Outbound HTTP/WebDAV from rundll32 or svchost
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:/[Tt][Rr][Uu][Ee]/ AND (data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_destinationPort:"80" OR data_win_eventdata_destinationPort:"443" OR data_win_eventdata_destinationPort:"8080")
    pivot_on: host
    window: 2h
