name: Driver/DLL Installation Via Odbcconf.EXE
id: 3f5491e2-8db8-496b-9e95-1029fce852d4
version: 1
schema_version: "1.0"
date: "2023-05-22"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 3f5491e2-8db8-496b-9e95-1029fce852d4
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of "odbcconf" with "INSTALLDRIVER" which installs a new ODBC
  driver. Attackers abuse this to install and run malicious DLLs. MITRE ATT&CK:
  T1218.008.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\odbcconf.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "odbcconf.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*INSTALLDRIVER *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*.dll*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\odbcconf.exe'; data_win_eventdata_originalFileName equals 'odbcconf.exe';
  data_win_eventdata_commandLine matches '*INSTALLDRIVER *', among other
  conditions.

known_false_positives: >
  Legitimate driver DLLs being registered via "odbcconf" will generate false
  positives. Investigate the path of the DLL and its contents to determine if
  the action is authorized. Baseline expected activity in your environment and
  tune this detection before relying on it for automated response.

references:
  - https://lolbas-project.github.io/lolbas/Binaries/Odbcconf/
  - https://web.archive.org/web/20191023232753/https://twitter.com/Hexacorn/status/1187143326673330176
  - https://www.hexacorn.com/blog/2020/08/23/odbcconf-lolbin-trifecta/
  - https://attack.mitre.org/techniques/T1218/008/

response:
  message: >
    Driver/DLL Installation Via Odbcconf.EXE detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1218.008
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218.008
  custom_tags:
    - driver
    - installation
    - odbcconf
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Oo][Dd][Bb][Cc][Cc][Oo][Nn][Ff]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Oo][Dd][Bb][Cc][Cc][Oo][Nn][Ff]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Dd][Rr][Ii][Vv][Ee][Rr] .*/ AND data_win_eventdata_commandLine:/.*\.[Dd][Ll][Ll].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 9f0a8bf3-a65b-440a-8c1e-5cb1547c8e70
    name: New DLL Registered Via Odbcconf.EXE
    reason: Related odbcconf DLL registration (REGSVR) abuse
  - id: 6b65c28e-11f3-46cb-902a-68f2cafaf474
    name: Odbcconf.EXE Suspicious DLL Location
    reason: Same odbcconf abuse with DLL in user-writable path
  - id: ba4cfc11-d0fa-4d94-bf20-7c332c412e76
    name: Potentially Suspicious DLL Registered Via Odbcconf.EXE
    reason: Same odbcconf abuse with suspicious DLL
  - id: e593cf51-88db-4ee1-b920-37e89012a3c9
    name: Potentially Suspicious Rundll32 Activity
    reason: Alternate DLL proxy-execution LOLBin used by same operators
  - id: d4ca7c59-e9e4-42d8-bf57-91a776efcb87
    name: LOLBIN Execution From Abnormal Drive
    reason: LOLBin abuse from odd paths often accompanies staged DLL loads
  - id: 070e9b80-6252-11eb-ae93-0242ac130002
    name: Detect Regsvr32 Application Control Bypass
    reason: Sibling LOLBin DLL-loading bypass used for the same purpose
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Odbcconf with response file or REGSVR
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Oo][Dd][Bb][Cc][Cc][Oo][Nn][Ff]\.exe/ AND data_win_eventdata_commandLine:(/.*[Rr][Ee][Gg][Ss][Vv][Rr].*/ OR /.* -[Ff] .*/ OR /.*\.rsp.*/ OR /.*[Cc]onfigsysdsn.*/)
    pivot_on: host
    window: 2h
  - name: DLL/RSP files written to user-writable paths
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(/.*\.dll/ OR /.*\.rsp/) AND data_win_eventdata_targetFilename:(/.*[Tt]emp.*/ OR /.*[Uu]sers.*/ OR /.*[Pp]rogram[Dd]ata.*/ OR /.*[Dd]ownloads.*/)
    pivot_on: host
    window: 2h
  - name: Odbcconf loading non-System32 modules
    query: data_win_system_eventID:7 AND data_win_eventdata_image:/.*[Oo][Dd][Bb][Cc][Cc][Oo][Nn][Ff]\.exe/ AND NOT data_win_eventdata_imageLoaded:/.*[Ss]ystem32.*/
    pivot_on: host
    window: 1h
  - name: Odbcconf network connections or child processes
    query: (data_win_system_eventID:3 AND data_win_eventdata_image:/.*[Oo][Dd][Bb][Cc][Cc][Oo][Nn][Ff]\.exe/) OR (data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Oo][Dd][Bb][Cc][Cc][Oo][Nn][Ff]\.exe/)
    pivot_on: host
    window: 2h
  - name: Payload download beforehand
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Cc]url.*/ OR /.*[Cc]ertutil.*urlcache.*/ OR /.*[Bb]its[Aa]dmin.*/ OR /.*[Ii]nvoke-[Ww]eb[Rr]equest.*/ OR /.*[Dd]ownload[Ff]ile.*/)
    pivot_on: host
    window: 4h
