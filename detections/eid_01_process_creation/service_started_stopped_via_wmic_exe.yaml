name: Service Started/Stopped Via Wmic.EXE
id: 0b7163dc-7eee-4960-af17-c0cd517f92da
version: 1
schema_version: "1.0"
date: "2023-02-14"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 0b7163dc-7eee-4960-af17-c0cd517f92da
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects usage of wmic to start or stop a service. MITRE ATT&CK: T1047.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - term:
                  data_win_eventdata_originalFileName:
                    value: "wmic.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\WMIC.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* service *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* call *"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*stopservice*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*startservice*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_originalFileName
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_originalFileName equals
  'wmic.exe'; data_win_eventdata_image matches '*\WMIC.exe';
  data_win_eventdata_commandLine matches '* service *', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://sushant747.gitbooks.io/total-oscp-guide/content/privilege_escalation_windows.html
  - https://attack.mitre.org/techniques/T1047/

response:
  message: >
    Service Started/Stopped Via Wmic.EXE detected on host $agent_name$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1047
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_originalFileName
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1047
  custom_tags:
    - service
    - started
    - stopped
    - process_creation
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_originalFileName:/[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.* [Ss][Ee][Rr][Vv][Ii][Cc][Ee] .*/ AND data_win_eventdata_commandLine:/.* [Cc][Aa][Ll][Ll] .*/ AND (data_win_eventdata_commandLine:/.*[Ss][Tt][Oo][Pp][Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Tt][Aa][Rr][Tt][Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: windows-attempt-stop-security-service-001
    name: Windows Attempt To Stop Security Service
    reason: Stopping services via WMIC is a common way to kill security services.
  - id: 8f3a614f-6b98-4f7d-82dd-d0df38452a8b
    name: Windows Excessive Service Stop Attempt
    reason: Bursts of service stops indicate pre-ransomware or defense evasion.
  - id: 51cbac1e-eee3-4a90-b1b7-358efb81fa0a
    name: Potential Windows Defender Tampering Via Wmic.EXE
    reason: WMIC Defender tampering on the same host shows the stopped service is the AV.
  - id: 847d5ff3-8a31-4737-a970-aeae8fe21765
    name: Potential Tampering With Security Products Via WMIC
    reason: WMIC tampering with security products pairs with stopping their services.
  - id: windows-powershell-start-or-stop-service-001
    name: PowerShell Start or Stop Service
    reason: Alternate PowerShell route for the same start/stop behaviour.
  - id: 85c312b7-f44d-4a51-a024-d671c40b49fc
    name: Service StartupType Change Via Sc.EXE
    reason: Services are often disabled after stopping so they stay off after reboot.
  - id: 236e7c8e-c9d9-11eb-a824-acde48001122
    name: Disable Logs Using WevtUtil
    reason: Disabling logging follows service stops in cover-your-tracks chains.
  - id: 17a1be64-8d88-40bf-b5ff-a4f7a50ebcc8
    name: Suspicious New Service Creation
    reason: Starting a service via WMIC can run a freshly created malicious service.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Service stop/disable via sc, net or taskkill
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(sc(\.exe)? +(stop|config)|net1? +stop|taskkill.*\/f).*/
    pivot_on: host
    window: 2h
  - name: Security and backup services targeted
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(WinDefend|Sense|MpsSvc|EventLog|Sysmon|wazuh|VSS|Veeam|SQL).*(stop|disabled|delete).*/
    pivot_on: host
    window: 2h
  - name: Remote WMIC execution
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*[Ww][Mm][Ii][Cc].*\/node.*/
    pivot_on: host
    window: 4h
  - name: Shadow copy and recovery tampering
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(vssadmin.*delete|wbadmin.*delete|bcdedit.*recoveryenabled).*/
    pivot_on: host
    window: 6h
  - name: WMIC spawned by Office or script host
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*(winword|excel|wscript|cscript|mshta|powershell)\.exe/ AND data_win_eventdata_originalFileName:"wmic.exe"
    pivot_on: host
    window: 4h
