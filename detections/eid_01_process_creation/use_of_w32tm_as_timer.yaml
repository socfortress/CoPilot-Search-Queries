name: Use of W32tm as Timer
id: 6da2c9f5-7c53-401b-aacb-92c040ce1215
version: 1
schema_version: "1.0"
date: "2022-09-25"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 6da2c9f5-7c53-401b-aacb-92c040ce1215
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  When configured with suitable command line arguments, w32tm can act as a delay
  mechanism. MITRE ATT&CK: T1124.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\w32tm.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "w32time.dll"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*/stripchart*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*/computer:*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*/period:*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*/dataonly*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*/samples:*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\w32tm.exe'; data_win_eventdata_originalFileName equals 'w32time.dll';
  data_win_eventdata_commandLine matches '*/stripchart*', among other
  conditions.

known_false_positives: >
  Legitimate use. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/d0dad62dbcae9c60c519368e82c196a3db577055/atomics/T1124/T1124.md
  - https://blogs.blackberry.com/en/2022/05/dirty-deeds-done-dirt-cheap-russian-rat-offers-backdoor-bargains
  - https://attack.mitre.org/techniques/T1124/

response:
  message: >
    Use of W32tm as Timer detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1124
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1124
  custom_tags:
    - w32tm
    - timer
    - process_creation
    - sysmon
    - discovery
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ww]32[Tt][Mm]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ww]32[Tt][Ii][Mm][Ee]\.[Dd][Ll][Ll]/) AND data_win_eventdata_commandLine:/.*\/[Ss][Tt][Rr][Ii][Pp][Cc][Hh][Aa][Rr][Tt].*/ AND data_win_eventdata_commandLine:/.*\/[Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr]:.*/ AND data_win_eventdata_commandLine:/.*\/[Pp][Ee][Rr][Ii][Oo][Dd]:.*/ AND data_win_eventdata_commandLine:/.*\/[Dd][Aa][Tt][Aa][Oo][Nn][Ll][Yy].*/ AND data_win_eventdata_commandLine:/.*\/[Ss][Aa][Mm][Pp][Ll][Ee][Ss]:.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: ce058d6c-79f2-11ec-b476-acde48001122
    name: Ping Sleep Batch Command
    reason: Alternative batch delay idiom with the same sandbox-evasion intent as the w32tm timer.
  - id: b6676963-0353-4f88-90f5-36c20d443c6a
    name: Cscript/Wscript Potentially Suspicious Child Process
    reason: The delay is typically embedded in a script that then launches payload stages.
  - id: 24357373-078f-44ed-9ac4-6d334a668a11
    name: Direct Autorun Keys Modification
    reason: Delayed execution is often chained with persistence setup.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: w32tm stripchart or sample-based delay
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*w32tm\.exe/ AND data_win_eventdata_commandLine:/.*(stripchart|samples|period).*/
    pivot_on: host
    window: 2h
  - name: Other delay and sandbox-evasion commands
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(ping(\.exe)? .*-n [0-9]{2,}|timeout(\.exe)? .*\/t|Start-Sleep).*/
    pivot_on: host
    window: 2h
  - name: Script host or shell parent of the timer
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*\\(cmd|powershell|wscript|cscript|mshta)\.exe/ AND data_win_eventdata_commandLine:/.*w32tm.*/
    pivot_on: host
    window: 2h
  - name: Executables started from user-writable paths
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*\\(AppData|Temp|ProgramData|Users\\Public)\\.*\.exe/
    pivot_on: host
    window: 1h
  - name: Persistence via scheduled tasks or run keys
    query: (data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*schtasks.*create.*/) OR (data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*CurrentVersion\\Run.*/)
    pivot_on: host
    window: 4h
