name: Use Icacls to Hide File to Everyone
id: 4ae81040-fc1c-4249-bfa3-938d260214d9
version: 1
schema_version: "1.0"
date: "2024-04-29"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 4ae81040-fc1c-4249-bfa3-938d260214d9
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detect use of icacls to deny access for everyone in Users folder sometimes
  used to hide malicious files. MITRE ATT&CK: T1564.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - term:
                  data_win_eventdata_originalFileName:
                    value: "iCACLS.EXE"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\icacls.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*/deny*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*S-1-1-0:*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_originalFileName
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_originalFileName equals
  'iCACLS.EXE'; data_win_eventdata_image matches '*\icacls.exe';
  data_win_eventdata_commandLine matches '*/deny*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://app.any.run/tasks/1df999e6-1cb8-45e3-8b61-499d1b7d5a9b/
  - https://attack.mitre.org/techniques/T1564/001/

response:
  message: >
    Use Icacls to Hide File to Everyone detected on host $agent_name$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1564.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_originalFileName
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1564.001
  custom_tags:
    - icacls
    - everyone
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_originalFileName:/[Ii][Cc][Aa][Cc][Ll][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ii][Cc][Aa][Cc][Ll][Ss]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*\/[Dd][Ee][Nn][Yy].*/ AND data_win_eventdata_commandLine:/.*[Ss]-1-1-0:.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: cf8d753e-a8fe-11eb-8f58-acde48001122
    name: Icacls Deny Command
    reason: 'Generic icacls deny command: the base behaviour this alert narrows to Everyone'
  - id: 6e5a3ae4-90a3-462d-9aa6-0119f638c0f1
    name: Hiding Files And Directories With Attrib exe
    reason: attrib hiding is the companion way malware hides the same files and folders
  - id: efec536f-72e8-4656-8960-5e85d091345b
    name: Set Suspicious Files as System Files Using Attrib.EXE
    reason: Setting suspicious files as System via attrib pairs with ACL denial for concealment
  - id: 0900463c-b33b-49a8-be1d-552a3b553dae
    name: Potential Hidden Directory Creation Via NTFS INDEX_ALLOCATION Stream - CLI
    reason: 'Hidden directories via NTFS INDEX_ALLOCATION stream: another stealth-folder trick'
  - id: 554601fb-9b71-4bcc-abf4-21a611be4fde
    name: Suspicious Recursive Takeown
    reason: Recursive takeown is the ownership-tampering counterpart on dropped files
  - id: fa7ca5c6-c9d8-11eb-bce9-acde48001122
    name: Permission Modification using Takeown App
    reason: takeown permission modification used alongside icacls to lock or reclaim files
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other icacls, cacls and takeown permission changes
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Ii][Cc][Aa][Cc][Ll][Ss]\.[Ee][Xx][Ee]|[Cc][Aa][Cc][Ll][Ss]\.[Ee][Xx][Ee]|[Tt][Aa][Kk][Ee][Oo][Ww][Nn]\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 4h
  - name: Hidden or system attributes set on files
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Aa][Tt][Tt][Rr][Ii][Bb]\.[Ee][Xx][Ee])/ AND data_win_eventdata_commandLine:/.*(\+[Hh]|\+[Ss]).*/
    pivot_on:
    - host
    window: 4h
  - name: Executables created in user-profile and public folders
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\|\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\|\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\).*(\.[Ee][Xx][Ee]|\.[Dd][Ll][Ll]|\.[Pp][Ss]1|\.[Vv][Bb][Ss])/
    pivot_on:
    - host
    window: 4h
  - name: Persistence keys written near the ACL change
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND data_win_eventdata_targetObject:/.*(\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn]|\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\|[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]\\[Ss][Hh][Ee][Ll][Ll]|[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]\\[Uu][Ss][Ee][Rr][Ii][Nn][Ii][Tt]).*/
    pivot_on:
    - host
    window: 4h
  - name: Scheduled tasks created on the host
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss] \/[Cc][Rr][Ee][Aa][Tt][Ee]|[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee] \/[Cc][Rr][Ee][Aa][Tt][Ee]).*/
    pivot_on:
    - host
    window: 4h
