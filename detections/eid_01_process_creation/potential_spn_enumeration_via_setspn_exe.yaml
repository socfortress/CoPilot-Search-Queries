name: Potential SPN Enumeration Via Setspn.EXE
id: 1eeed653-dbc8-4187-ad0c-eeebb20e6599
version: 1
schema_version: "1.0"
date: "2023-10-23"
author: Markus Neis, keepwatch
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 1eeed653-dbc8-4187-ad0c-eeebb20e6599
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects service principal name (SPN) enumeration used for Kerberoasting. MITRE
  ATT&CK: T1558.003.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\setspn.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "setspn.exe"
                    case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_description:
                          value: "*Query or reset the computer*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_description:
                          value: "*SPN attribute*"
                          case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -q *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /q *"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_description
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\setspn.exe'; data_win_eventdata_originalFileName equals 'setspn.exe';
  data_win_eventdata_description matches '*Query or reset the computer*', among
  other conditions.

known_false_positives: >
  Administration activity. Baseline expected activity in your environment and
  tune this detection before relying on it for automated response.

references:
  - https://web.archive.org/web/20200329173843/https://p16.praetorian.com/blog/how-to-use-kerberoasting-t1208-for-privilege-escalation
  - https://www.praetorian.com/blog/how-to-use-kerberoasting-t1208-for-privilege-escalation/?edition=2019
  - https://attack.mitre.org/techniques/T1558/003/

response:
  message: >
    Potential SPN Enumeration Via Setspn.EXE detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1558.003
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1558.003
  custom_tags:
    - enumeration
    - setspn
    - process_creation
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ss][Ee][Tt][Ss][Pp][Nn]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ss][Ee][Tt][Ss][Pp][Nn]\.[Ee][Xx][Ee]/ OR (data_win_eventdata_description:/.*[Qq][Uu][Ee][Rr][Yy] [Oo][Rr] [Rr][Ee][Ss][Ee][Tt] [Tt][Hh][Ee] [Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr].*/ AND data_win_eventdata_description:/.*[Ss][Pp][Nn] [Aa][Tt][Tt][Rr][Ii][Bb][Uu][Tt][Ee].*/)) AND (data_win_eventdata_commandLine:/.* -[Qq] .*/ OR data_win_eventdata_commandLine:/.* \/[Qq] .*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: caa9a802-8bd8-4b9e-a5cd-4d6221670219
    name: Suspicious Kerberos Ticket Request via CLI
    reason: Kerberoasting follows SPN discovery with TGS requests.
  - id: a0bdd2f6-c2ff-11eb-b918-acde48001122
    name: Detect SharpHound Command-Line Arguments
    reason: SPN enumeration is commonly paired with AD graph collection.
  - id: 514e7e3e-b3b4-4a67-af60-be20f139198b
    name: PUA - AdFind.EXE Execution
    reason: AdFind is an alternative LDAP enumeration tool used in the same recon phase.
  - id: 41243735-89a7-4c83-bcdd-570aa78f00a1
    name: Domain Controller Discovery with Nltest
    reason: Domain recon commonly accompanies SPN queries.
  - id: d95de845-b83c-4a9a-8a6a-4fc802ebf6c0
    name: Suspicious Group And Account Reconnaissance Activity Using Net.EXE
    reason: Account and group discovery by the same actor.
  - id: 13bbd574-83ac-11ec-99d4-acde48001122
    name: Mimikatz PassTheTicket CommandLine Parameters
    reason: Cracked or stolen tickets are then used for pass-the-ticket.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Kerberos TGS requests with RC4
    query: data_win_system_eventID:4769 AND data_win_eventdata_ticketEncryptionType:0x17
    pivot_on: user
    window: 6h
  - name: Kerberoasting tooling
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*([Rr]ubeus|[Kk]erberoast|GetUserSPNs).*/
    pivot_on: host
    window: 6h
  - name: Other AD recon commands
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*(dsquery|adfind|nltest)\.exe/ OR data_win_eventdata_commandLine:/.*[Gg]et-[Aa][Dd][Uu]ser.*/)
    pivot_on: host
    window: 6h
  - name: LDAP connections from the host
    query: data_win_system_eventID:3 AND data_win_eventdata_destinationPort:(389 OR 636 OR 3268)
    pivot_on: host
    window: 2h
  - name: Ticket export to files
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\.(kirbi|ccache).*/
    pivot_on: host
    window: 6h
