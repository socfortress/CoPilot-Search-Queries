name: ShimCache Flush
id: b0524451-19af-4efa-a46f-562a977f792e
version: 1
schema_version: "1.0"
date: "2021-02-01"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: b0524451-19af-4efa-a46f-562a977f792e
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: production
type: TTP

description: >
  Detects actions that clear the local ShimCache and remove forensic evidence.
  MITRE ATT&CK: T1112.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*rundll32*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*apphelp.dll*"
                          case_insensitive: true
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*ShimFlushCache*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine: "*#250*"
                        minimum_should_match: 1
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*rundll32*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*kernel32.dll*"
                          case_insensitive: true
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*BaseFlushAppcompatCache*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine: "*#46*"
                        minimum_should_match: 1
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*rundll32*'; data_win_eventdata_commandLine matches '*apphelp.dll*';
  data_win_eventdata_commandLine matches '*ShimFlushCache*', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://medium.com/@blueteamops/shimcache-flush-89daff28d15e
  - https://attack.mitre.org/techniques/T1112/

response:
  message: >
    ShimCache Flush detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1112
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
  custom_tags:
    - shimcache
    - flush
    - process_creation
    - sysmon
    - persistence
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND ((data_win_eventdata_commandLine:/.*[Rr][Uu][Nn][Dd][Ll][Ll]32.*/ AND data_win_eventdata_commandLine:/.*[Aa][Pp][Pp][Hh][Ee][Ll][Pp]\.[Dd][Ll][Ll].*/ AND (data_win_eventdata_commandLine:/.*[Ss][Hh][Ii][Mm][Ff][Ll][Uu][Ss][Hh][Cc][Aa][Cc][Hh][Ee].*/ OR data_win_eventdata_commandLine:/.*\#250.*/)) OR (data_win_eventdata_commandLine:/.*[Rr][Uu][Nn][Dd][Ll][Ll]32.*/ AND data_win_eventdata_commandLine:/.*[Kk][Ee][Rr][Nn][Ee][Ll]32\.[Dd][Ll][Ll].*/ AND (data_win_eventdata_commandLine:/.*[Bb][Aa][Ss][Ee][Ff][Ll][Uu][Ss][Hh][Aa][Pp][Pp][Cc][Oo][Mm][Pp][Aa][Tt][Cc][Aa][Cc][Hh][Ee].*/ OR data_win_eventdata_commandLine:/.*\#46.*/)))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 236e7c8e-c9d9-11eb-a824-acde48001122
    name: Disable Logs Using WevtUtil
    reason: 'Companion anti-forensic action: disabling event logs alongside clearing execution artifacts.'
  - id: add64136-62e5-48ea-807e-88638d02df1e
    name: Fsutil Suspicious Invocation
    reason: Fsutil used to erase USN journal evidence, same cleanup phase.
  - id: a4824fca-976f-4964-b334-0621379e84c4
    name: Potential File Overwrite Via Sysinternals SDelete
    reason: Secure deletion of tools and payloads accompanies artifact wiping.
  - id: 204b17ae-4007-471b-917b-b917b315c5db
    name: Greedy File Deletion Using Del
    reason: Bulk deletion of dropped tooling is typical cleanup around ShimCache flush.
  - id: a7ee1722-c3c5-aeff-3212-c777e4733217
    name: Disable Windows Defender AV Security Monitoring
    reason: Defense evasion preceding or accompanying cleanup.
  - id: 21ff4ca9-f13a-41ad-b828-0077b2af2e40
    name: Deletion of Volume Shadow Copies via WMI with PowerShell
    reason: Destructive actors wipe recovery data and execution evidence together.
  - id: e593cf51-88db-4ee1-b920-37e89012a3c9
    name: Potentially Suspicious Rundll32 Activity
    reason: The flush itself runs through rundll32, so related suspicious rundll32 use is likely.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Event log clearing or disabling
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll].*([Cc][Ll]|[Cc][Ll][Ee][Aa][Rr]-[Ll][Oo][Gg]|[Ss][Ll]).*/ OR data_win_eventdata_commandLine:/.*[Cc][Ll][Ee][Aa][Rr]-[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg].*/)
    pivot_on: host
    window: 4h
  - name: USN journal wipe or secure delete
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ff][Ss][Uu][Tt][Ii][Ll].*[Uu][Ss][Nn].*[Dd][Ee][Ll][Ee][Tt][Ee][Jj][Oo][Uu][Rr][Nn][Aa][Ll].*/ OR data_win_eventdata_image:/.*\\[Ss][Dd][Ee][Ll][Ee][Tt][Ee](64)?\.[Ee][Xx][Ee]/)
    pivot_on: host
    window: 4h
  - name: Rundll32 abuse of apphelp/kernel32 exports
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*([Aa][Pp][Pp][Hh][Ee][Ll][Pp]|[Kk][Ee][Rr][Nn][Ee][Ll]32)\.[Dd][Ll][Ll].*/
    pivot_on: host
    window: 4h
  - name: Prefetch or AppCompat artifact deletion
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Rr][Ee][Gg].*[Dd][Ee][Ll][Ee][Tt][Ee].*[Aa][Pp][Pp][Cc][Oo][Mm][Pp][Aa][Tt].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ee][Ll].*[Pp][Rr][Ee][Ff][Ee][Tt][Cc][Hh].*/)
    pivot_on: host
    window: 4h
  - name: Preceding tooling run from user-writable paths
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Tt][Ee][Mm][Pp]|[Aa][Pp][Pp][Dd][Aa][Tt][Aa]|[Pp][Uu][Bb][Ll][Ii][Cc]|[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss])\\.*\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 6h
