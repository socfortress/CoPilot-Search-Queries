name: Recon Command Output Piped To Findstr.EXE
id: ccb5742c-c248-4982-8c5c-5571b9275ad3
version: 1
schema_version: "1.0"
date: "2025-10-08"
author: Nasreddine Bencherchali (Nextron Systems), frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: ccb5742c-c248-4982-8c5c-5571b9275ad3
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of a potential recon command where the results are piped
  to "findstr". This is meant to trigger on inline calls of "cmd.exe" via the
  "/c" or "/k" for example. Attackers often time use this technique to extract
  specific information they require in their reconnaissance phase. MITRE ATT&CK:
  T1057.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*ipconfig*|*find*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*net*|*find*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*netstat*|*find*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*ping*|*find*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*systeminfo*|*find*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*tasklist*|*find*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*whoami*|*find*"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_commandLine"
        - bool:
            must_not:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*cmd.exe /c TASKLIST /V |*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*FIND /I*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*\\\\xampp\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*\\\\catalina_start.bat*"
                          case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*ipconfig*|*find*'; data_win_eventdata_commandLine matches '*net*|*find*';
  data_win_eventdata_commandLine matches '*netstat*|*find*', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/02cb591f75064ffe1e0df9ac3ed5972a2e491c97/atomics/T1057/T1057.md#atomic-test-6---discover-specific-process---tasklist
  - https://www.hhs.gov/sites/default/files/manage-engine-vulnerability-sector-alert-tlpclear.pdf
  - https://www.trendmicro.com/en_us/research/22/d/spring4shell-exploited-to-deploy-cryptocurrency-miners.html
  - https://attack.mitre.org/techniques/T1057/

response:
  message: >
    Recon Command Output Piped To Findstr.EXE detected on host $agent_name$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1057
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1057
  custom_tags:
    - recon
    - output
    - piped
    - process_creation
    - sysmon
    - discovery
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ii][Pp][Cc][Oo][Nn][Ff][Ii][Gg].*\|.*[Ff][Ii][Nn][Dd].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt].*\|.*[Ff][Ii][Nn][Dd].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt][Ss][Tt][Aa][Tt].*\|.*[Ff][Ii][Nn][Dd].*/ OR data_win_eventdata_commandLine:/.*[Pp][Ii][Nn][Gg].*\|.*[Ff][Ii][Nn][Dd].*/ OR data_win_eventdata_commandLine:/.*[Ss][Yy][Ss][Tt][Ee][Mm][Ii][Nn][Ff][Oo].*\|.*[Ff][Ii][Nn][Dd].*/ OR data_win_eventdata_commandLine:/.*[Tt][Aa][Ss][Kk][Ll][Ii][Ss][Tt].*\|.*[Ff][Ii][Nn][Dd].*/ OR data_win_eventdata_commandLine:/.*[Ww][Hh][Oo][Aa][Mm][Ii].*\|.*[Ff][Ii][Nn][Dd].*/) AND _exists_:data_win_eventdata_commandLine AND NOT (data_win_eventdata_commandLine:/.*[Cc][Mm][Dd]\.[Ee][Xx][Ee] \/[Cc] [Tt][Aa][Ss][Kk][Ll][Ii][Ss][Tt] \/[Vv] \|.*/ AND data_win_eventdata_commandLine:/.*[Ff][Ii][Nn][Dd] \/[Ii].*/ AND data_win_eventdata_commandLine:/.*\\[Xx][Aa][Mm][Pp][Pp]\\.*/ AND data_win_eventdata_commandLine:/.*\\[Cc][Aa][Tt][Aa][Ll][Ii][Nn][Aa]_[Ss][Tt][Aa][Rr][Tt]\.[Bb][Aa][Tt].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e6313acd-208c-44fc-a0ff-db85d572e90e
    name: Network Reconnaissance Activity
    reason: Same hands-on-keyboard host/network recon burst.
  - id: 2cf5cc25-f39a-436d-a790-4857e5995ede
    name: Network Connection Discovery With Netstat
    reason: Netstat piped to find/findstr is a direct variant of this triage.
  - id: c248c896-e412-4279-8c15-1c558067b6fa
    name: Enumerate All Information With Whoami.EXE
    reason: Whoami is part of the same first-minutes situational awareness.
  - id: bd8b828d-0dca-48e1-8a63-8a58ecf2644f
    name: Group Membership Reconnaissance Via Whoami.EXE
    reason: Privilege checks typically follow process/user recon.
  - id: fe63010f-8823-4864-a96b-a7b4a0f7b929
    name: LSASS Process Reconnaissance Via Findstr.EXE
    reason: Findstr used to locate lsass is the credential-theft precursor.
  - id: 41243735-89a7-4c83-bcdd-570aa78f00a1
    name: Domain Controller Discovery with Nltest
    reason: Domain recon is the logical next step after local recon.
  - id: 911389c7-5ae3-43ea-bab3-a947ebdeb85e
    name: Potential APT FIN7 Reconnaissance/POWERTRASH Related Activity
    reason: Recon bursts like this are characteristic of FIN7-style post-exploitation.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Recon utilities executed
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*\\(whoami|systeminfo|ipconfig|netstat|tasklist|net|net1|nltest|arp|quser)\.exe/
    pivot_on: host
    window: 2h
  - name: Credential access after recon
    query: (data_win_system_eventID:10 AND data_win_eventdata_targetImage:*lsass.exe) OR (data_win_system_eventID:1 AND (data_win_eventdata_commandLine:*[Cc]omsvcs* OR data_win_eventdata_commandLine:*procdump* OR data_win_eventdata_commandLine:*sekurlsa*))
    pivot_on: host
    window: 2h
  - name: Domain discovery commands
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:*\/domain* OR data_win_eventdata_commandLine:*dsquery* OR data_win_eventdata_commandLine:*adfind* OR data_win_eventdata_commandLine:*nltest*)
    pivot_on: user
    window: 4h
  - name: Cmd spawned by server or script parents
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Cc]md\.exe/ AND data_win_eventdata_parentImage:/.*\\(w3wp|java|winword|excel|wscript|mshta|powershell|wmiprvse)\.exe/
    pivot_on: host
    window: 2h
