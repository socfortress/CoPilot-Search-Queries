name: Uncommon Extension Shim Database Installation Via Sdbinst.EXE
id: 18ee686c-38a3-4f65-9f44-48a077141f42
version: 1
schema_version: "1.0"
date: "2024-01-10"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 18ee686c-38a3-4f65-9f44-48a077141f42
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects installation of a potentially suspicious new shim with an uncommon
  extension using sdbinst.exe. Adversaries may establish persistence and/or
  elevate privileges by executing malicious content triggered by application
  shims. MITRE ATT&CK: T1546.011.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\sdbinst.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "sdbinst.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*.sdb*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* -c"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* -f"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* -mm"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* -t"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* -m -bg*"
                          case_insensitive: true
                    - bool:
                        must_not:
                          - exists:
                              field: "data_win_eventdata_commandLine"
                    - term:
                        data_win_eventdata_commandLine: ""
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\sdbinst.exe'; data_win_eventdata_originalFileName equals 'sdbinst.exe';
  data_win_eventdata_commandLine matches '*.sdb*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.fireeye.com/blog/threat-research/2017/05/fin7-shim-databases-persistence.html
  - https://github.com/nasbench/Misc-Research/blob/8ee690e43a379cbce8c9d61107442c36bd9be3d3/Other/Undocumented-Flags-Sdbinst.md
  - https://attack.mitre.org/techniques/T1546/011/

response:
  message: >
    Uncommon Extension Shim Database Installation Via Sdbinst.EXE detected on
    host $agent_name$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1546.011
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1546.011
  custom_tags:
    - uncommon
    - extension
    - database
    - process_creation
    - sysmon
    - persistence
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ss][Dd][Bb][Ii][Nn][Ss][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ss][Dd][Bb][Ii][Nn][Ss][Tt]\.[Ee][Xx][Ee]/) AND NOT (data_win_eventdata_commandLine:/.*\.[Ss][Dd][Bb].*/ OR data_win_eventdata_commandLine:/.* -[Cc]/ OR data_win_eventdata_commandLine:/.* -[Ff]/ OR data_win_eventdata_commandLine:/.* -[Mm][Mm]/ OR data_win_eventdata_commandLine:/.* -[Tt]/ OR data_win_eventdata_commandLine:/.* -[Mm] -[Bb][Gg].*/ OR NOT _exists_:data_win_eventdata_commandLine OR data_win_eventdata_commandLine:"")

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 517490a7-115a-48c6-8862-1a481504d5a8
    name: Potential Shim Database Persistence via Sdbinst.EXE
    reason: Sibling sdbinst rule for the common .sdb extension; both indicate the same shim-installation persistence technique.
  - id: ee63c85c-6d51-4d12-ad09-04e25877a947
    name: New Custom Shim Database Created
    reason: The shim database file must be written to disk before sdbinst installs it, making this the direct precursor.
  - id: dfb5b4e8-91d0-4291-b40a-e3b0d3942c45
    name: Potential Persistence Via Shim Database Modification
    reason: Installing a shim writes InstalledSDB/Custom registry keys, confirming the install succeeded.
  - id: 6b6976a3-b0e6-4723-ac24-ae38a737af41
    name: Potential Persistence Via Shim Database In Uncommon Location
    reason: Registry confirmation that the installed shim points at a file in an unusual location.
  - id: bf344fea-d947-4ef4-9192-34d008315d3a
    name: Suspicious Shim Database Patching Activity
    reason: Malicious shims patch application behavior via registry, the follow-on effect of installation.
  - id: b0524451-19af-4efa-a46f-562a977f792e
    name: ShimCache Flush
    reason: Attackers flush the shim cache after installing shims to force them to apply and cover tracks.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: All sdbinst executions with arguments
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ss][Dd][Bb][Ii][Nn][Ss][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ss][Dd][Bb][Ii][Nn][Ss][Tt]\.[Ee][Xx][Ee]/)
    pivot_on: host
    window: 6h
  - name: Shim database registry installation keys
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:(/.*[Aa][Pp][Pp][Cc][Oo][Mm][Pp][Aa][Tt][Ff][Ll][Aa][Gg][Ss].*[Cc][Uu][Ss][Tt][Oo][Mm].*/ OR /.*[Aa][Pp][Pp][Cc][Oo][Mm][Pp][Aa][Tt][Ff][Ll][Aa][Gg][Ss].*[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Ee][Dd][Ss][Dd][Bb].*/)
    pivot_on: host
    window: 6h
  - name: Shim database files written to disk
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.[Ss][Dd][Bb]/
    pivot_on: host
    window: 6h
  - name: Shells referencing sdbinst or sdb files
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:(/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR /.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:(/.*[Ss][Dd][Bb][Ii][Nn][Ss][Tt].*/ OR /.*\.[Ss][Dd][Bb].*/)
    pivot_on: host
    window: 2h
