name: Detect Prohibited Applications Spawning cmd exe
id: dcfd6b40-42f9-469d-a433-2e53f7486664
version: 1
schema_version: "1.0"
date: "2026-04-21"
author: SOCFortress LLC
status: production
type: Hunting

description: >
  Identifies executions of cmd.exe spawned by processes that are commonly abused
  by attackers and do not typically launch cmd.exe. This activity is significant
  because it may indicate an attempt to execute unauthorized commands or scripts,
  often a precursor to further malicious actions. If confirmed malicious, this
  behavior could lead to unauthorized code execution, privilege escalation, or
  persistence within the environment.

data_source:
  - Sysmon EventID 1
  - Windows Event Log Security 4688

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - wildcard:
            data_win_eventdata_image: "*cmd.exe"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_parentImage: "*winword.exe"
              - wildcard:
                  data_win_eventdata_parentImage: "*EXCEL.EXE"
              - wildcard:
                  data_win_eventdata_parentImage: "*OUTLOOK.EXE"
              - wildcard:
                  data_win_eventdata_parentImage: "*POWERPNT.EXE"
              - wildcard:
                  data_win_eventdata_parentImage: "*visio.exe"
              - wildcard:
                  data_win_eventdata_parentImage: "*mspub.exe"
              - wildcard:
                  data_win_eventdata_parentImage: "*Acrobat.exe"
              - wildcard:
                  data_win_eventdata_parentImage: "*Acrord32.exe"
              - wildcard:
                  data_win_eventdata_parentImage: "*chrome.exe"
              - wildcard:
                  data_win_eventdata_parentImage: "*iexplore.exe"
              - wildcard:
                  data_win_eventdata_parentImage: "*opera.exe"
              - wildcard:
                  data_win_eventdata_parentImage: "*firefox.exe"
              - wildcard:
                  data_win_eventdata_parentImage: "*java.exe"
              - wildcard:
                  data_win_eventdata_parentImage: "*powershell.exe"
              - wildcard:
                  data_win_eventdata_parentImage: "*mshta.exe"
              - wildcard:
                  data_win_eventdata_parentImage: "*zoom.exe"
              - wildcard:
                  data_win_eventdata_parentImage: "*node.exe"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-21 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-21 23:59:59.999"

how_to_implement: >
  Requires Wazuh agents with Sysmon installed and configured to log process
  creation events (EventID 1). The data_win_eventdata_parentImage and
  data_win_eventdata_image fields must be populated in Elasticsearch/Wazuh
  Indexer. This detection monitors for cmd.exe spawned by applications that
  typically do not execute command-line processes.

known_false_positives: >
  There are circumstances where an application may legitimately execute and
  interact with the Windows command-line interface. Investigate and modify
  the prohibited applications list as appropriate for your environment.

references:
  - https://attack.mitre.org/techniques/T1059/003/

response:
  message: >
    Prohibited application spawning cmd.exe detected on $agent_name$ by user
    $data_win_eventdata_user$. Parent process: $data_win_eventdata_parentImage$.
    Command: $data_win_eventdata_commandLine$. This indicates potential
    unauthorized command execution. MITRE ATT&CK: T1059.003
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
    - field: data_win_eventdata_user
      type: user
      score: 50
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: parent_process
    - field: data_win_eventdata_commandLine
      type: command_line

tags:
  analytic_story:
    - Suspicious Command-Line Executions
    - Suspicious MSHTA Activity
    - NOBELIUM Group
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.003
  custom_tags:
    - cmd_execution
    - prohibited_applications
    - command_line_abuse
    - defense_evasion
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*cmd\.exe.*/ AND (data_win_eventdata_parentImage:/.*winword\.exe.*/ OR data_win_eventdata_parentImage:/.*EXCEL\.EXE.*/ OR data_win_eventdata_parentImage:/.*OUTLOOK\.EXE.*/ OR data_win_eventdata_parentImage:/.*POWERPNT\.EXE.*/ OR data_win_eventdata_parentImage:/.*visio\.exe.*/ OR data_win_eventdata_parentImage:/.*mspub\.exe.*/ OR data_win_eventdata_parentImage:/.*Acrobat\.exe.*/ OR data_win_eventdata_parentImage:/.*Acrord32\.exe.*/ OR data_win_eventdata_parentImage:/.*chrome\.exe.*/ OR data_win_eventdata_parentImage:/.*iexplore\.exe.*/ OR data_win_eventdata_parentImage:/.*opera\.exe.*/ OR data_win_eventdata_parentImage:/.*firefox\.exe.*/ OR data_win_eventdata_parentImage:/.*java\.exe.*/ OR data_win_eventdata_parentImage:/.*powershell\.exe.*/ OR data_win_eventdata_parentImage:/.*mshta\.exe.*/ OR data_win_eventdata_parentImage:/.*zoom\.exe.*/ OR data_win_eventdata_parentImage:/.*node\.exe.*/)

correlation:
  # Authored by the correlation engine for review. Related CoPilot Searches to run
  # around an alert from this rule, scoped to the same host/user/IP within the window.
  related_rules:
    - id: 9b3af1e6-5b68-11eb-ae93-0242ac130002
      name: "Detect MSHTA Url in Command Line"
      reason: "same analytic story: Suspicious MSHTA Activity"
    - id: 91c79f14-5b41-11eb-ae93-0242ac130002
      name: "Detect Rundll32 Inline HTA Execution"
      reason: "same analytic story: Suspicious MSHTA Activity"
    - id: b89919ed-fe5f-492c-b139-95dbb162039e
      name: "Detect Use of cmd exe to Launch Script Interpreters"
      reason: "same analytic story: Suspicious Command-Line Executions"
    - id: a0873b32-5b68-11eb-ae93-0242ac130002
      name: "Detect mshta inline hta execution"
      reason: "same analytic story: Suspicious MSHTA Activity"
    - id: 8f45fcf0-5b68-11eb-ae93-0242ac130002
      name: "Detect mshta renamed"
      reason: "same analytic story: Suspicious MSHTA Activity"
    - id: detection-of-tools-built-by-nirsoft-001
      name: "Detection of Tools Built by NirSoft"
      reason: "same analytic story: Suspicious Command-Line Executions"
    - id: 002f1e24-146e-11ec-a470-acde48001122
      name: "Jscript Execution Using Cscript App"
      reason: "same analytic story: Suspicious Command-Line Executions"
    - id: 213b3148-24ea-11ec-93a2-acde48001122
      name: "MSBuild Suspicious Spawned By Script Process"
      reason: "same analytic story: Suspicious Command-Line Executions"
    - id: c4db14d9-7909-48b4-a054-aa14d89dbb19
      name: "Malicious PowerShell Process - Encoded Command"
      reason: "same analytic story: Suspicious Command-Line Executions"
    - id: 9be56c82-b1cc-4318-87eb-d138afaaca39
      name: "Malicious PowerShell Process - Execution Policy Bypass"
      reason: "same analytic story: Suspicious Command-Line Executions"
    - id: 4aa5d062-e893-11eb-9eb2-acde48001122
      name: "Mshta spawning Rundll32 OR Regsvr32 Process"
      reason: "same analytic story: Suspicious Command-Line Executions"
    - id: 1a382c6c-7c2e-11eb-ac69-acde48001122
      name: "Nishang PowershellTCPOneLine"
      reason: "same analytic story: Suspicious Command-Line Executions"
  window: 1h
  enrichment_searches:
  # Rule-specific telemetry pivots the engine runs around an alert from this rule,
  # scoped to the alert's host/user/IP within the window (behaviour-targeted, not a sweep).
    - name: "Outbound connections by script interpreters on this host"
      query: 'data_win_system_eventID:"3" AND data_win_eventdata_image:/.*(\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]|\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]_[Ii][Ss][Ee]\.[Ee][Xx][Ee]|\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]|\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee])/'
      pivot_on: [host]
      window: 1h
    - name: "Downloader / C2 tooling executed on this host"
      query: '(data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]|\\[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]|\\[Ww][Gg][Ee][Tt]\.[Ee][Xx][Ee])/) OR (data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt]\.[Ww][Ee][Bb][Cc][Ll][Ii][Ee][Nn][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ss][Tt][Aa][Rr][Tt]-[Bb][Ii][Tt][Ss][Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Ii][Ww][Rr] .*/ OR data_win_eventdata_commandLine:/.*[Cc][Uu][Rr][Ll] .*/ OR data_win_eventdata_commandLine:/.*[Ww][Gg][Ee][Tt] .*/)'
      pivot_on: [host]
      window: 1h
    - name: "Follow-on LOLBin / signed-binary-proxy execution on this host"
      query: 'data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|\\[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Aa][Ss][Mm]\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Cc][Ss]\.[Ee][Xx][Ee]|\\[Mm][Ss][Bb][Uu][Ii][Ll][Dd]\.[Ee][Xx][Ee]|\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]|\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]|\\[Cc][Mm][Ss][Tt][Pp]\.[Ee][Xx][Ee]|\\[Oo][Dd][Bb][Cc][Cc][Oo][Nn][Ff]\.[Ee][Xx][Ee]|\\[Ff][Oo][Rr][Ff][Ii][Ll][Ee][Ss]\.[Ee][Xx][Ee]|\\[Pp][Cc][Aa][Ll][Uu][Aa]\.[Ee][Xx][Ee]|\\[Mm][Aa][Vv][Ii][Nn][Jj][Ee][Cc][Tt]\.[Ee][Xx][Ee]|\\[Ss][Cc][Rr][Ii][Pp][Tt][Rr][Uu][Nn][Nn][Ee][Rr]\.[Ee][Xx][Ee])/'
      pivot_on: [host]
      window: 1h
    - name: "Security-tool / Defender tampering on this host"
      query: 'data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee][Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Aa][Nn][Tt][Ii][Ss][Pp][Yy][Ww][Aa][Rr][Ee].*/ OR data_win_eventdata_commandLine:/.*[Aa][Dd][Dd]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee] -[Ee][Xx][Cc][Ll][Uu][Ss][Ii][Oo][Nn][Pp][Aa][Tt][Hh].*/ OR data_win_eventdata_commandLine:/.*[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll].*/ OR data_win_eventdata_commandLine:/.*[Cc][Ll][Ee][Aa][Rr]-[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg].*/ OR data_win_eventdata_commandLine:/.*[Ff][Ss][Uu][Tt][Ii][Ll] [Uu][Ss][Nn] [Dd][Ee][Ll][Ee][Tt][Ee][Jj][Oo][Uu][Rr][Nn][Aa][Ll].*/ OR data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ss][Tt][Oo][Pp]-[Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc] [Ss][Tt][Oo][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc] [Cc][Oo][Nn][Ff][Ii][Gg].*/)'
      pivot_on: [host]
      window: 2h
