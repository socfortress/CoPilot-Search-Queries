name: File Encryption/Decryption Via Gpg4win From Suspicious Locations
id: e1e0b7d7-e10b-4ee4-ac49-a4bda05d320d
version: 1
schema_version: "1.0"
date: "2023-08-09"
author: Nasreddine Bencherchali (Nextron Systems), X__Junior (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: e1e0b7d7-e10b-4ee4-ac49-a4bda05d320d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects usage of Gpg4win to encrypt/decrypt files located in potentially
  suspicious locations.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\gpg.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\gpg2.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_product:
                    value: "GNU Privacy Guard (GnuPG)"
                    case_insensitive: true
              - term:
                  data_win_eventdata_description:
                    value: "GnuPG’s OpenPGP tool"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*-passphrase*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*:\\\\PerfLogs\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*:\\\\Temp\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*:\\\\Users\\\\Public\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*:\\\\Windows\\\\Temp\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\AppData\\\\Local\\\\Temp\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\AppData\\\\Roaming\\\\*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_product
    - data_win_eventdata_description
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches '*\gpg.exe';
  data_win_eventdata_image matches '*\gpg2.exe'; data_win_eventdata_product
  equals 'GNU Privacy Guard (GnuPG)', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://blogs.vmware.com/security/2022/11/batloader-the-evasive-downloader-malware.html
  - https://news.sophos.com/en-us/2022/01/19/zloader-installs-remote-access-backdoors-and-delivers-cobalt-strike/

response:
  message: >
    File Encryption/Decryption Via Gpg4win From Suspicious Locations detected on
    host $agent_name$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. Matched data_win_eventdata_product:
    $data_win_eventdata_product$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_product
      type: other

tags:
  asset_type: Endpoint
  custom_tags:
    - encryption
    - decryption
    - gpg4win
    - process_creation
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Gg][Pp][Gg]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Gg][Pp][Gg]2\.[Ee][Xx][Ee]/ OR data_win_eventdata_product:/[Gg][Nn][Uu] [Pp][Rr][Ii][Vv][Aa][Cc][Yy] [Gg][Uu][Aa][Rr][Dd] \([Gg][Nn][Uu][Pp][Gg]\)/ OR data_win_eventdata_description:/[Gg][Nn][Uu][Pp][Gg]’[Ss] [Oo][Pp][Ee][Nn][Pp][Gg][Pp] [Tt][Oo][Oo][Ll]/) AND data_win_eventdata_commandLine:/.*-[Pp][Aa][Ss][Ss][Pp][Hh][Rr][Aa][Ss][Ee].*/ AND (data_win_eventdata_commandLine:/.*:\\[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss]\\.*/ OR data_win_eventdata_commandLine:/.*:\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_commandLine:/.*:\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_commandLine:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Rr][Oo][Aa][Mm][Ii][Nn][Gg]\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 77df53a5-1d78-4f32-bc5a-0e7465bd8f41
    name: Portable Gpg.EXE Execution
    reason: Portable gpg dropped outside Program Files is the usual tooling for this behaviour
  - id: 550bbb84-ce5d-4e61-84ad-e590f0024dcd
    name: File Encryption Using Gpg4win
    reason: Symmetric encryption with passphrase on the same host, ransomware-style or exfil protection
  - id: 037dcd71-33a8-4392-bb01-293c94663e5a
    name: File Decryption Using Gpg4win
    reason: Decryption of a staged payload or previously encrypted data
  - id: 9fbf5927-5261-4284-a71d-f681029ea574
    name: Compress Data and Lock With Password for Exfiltration With 7-ZIP
    reason: Archive-then-encrypt staging pattern before exfiltration
  - id: 32e0baea-b3f1-11eb-a2ce-acde48001122
    name: Detect RClone Command-Line Usage
    reason: Encrypted data is commonly exfiltrated with rclone next
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: GnuPG executions
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:*gpg.exe OR data_win_eventdata_image:*gpg2.exe)
    pivot_on: host
    window: 6h
  - name: Files created in staging directories or with PGP extensions
    query: data_win_system_eventID:11 AND (data_win_eventdata_targetFilename:/.*[Pp]erf[Ll]ogs.*/ OR data_win_eventdata_targetFilename:/.*[Uu]sers.[Pp]ublic.*/ OR data_win_eventdata_targetFilename:/.*\.(gpg|pgp|asc)/)
    pivot_on: host
    window: 6h
  - name: Archiving and exfil tools
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:*7z* OR data_win_eventdata_image:*rclone* OR data_win_eventdata_image:*winscp* OR data_win_eventdata_image:*curl.exe)
    pivot_on: host
    window: 6h
  - name: Shadow copy and backup deletion
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*vssadmin.*[Dd]elete.*/ OR data_win_eventdata_commandLine:/.*wbadmin.*[Dd]elete.*/ OR data_win_eventdata_commandLine:/.*bcdedit.*recoveryenabled.*/)
    pivot_on: host
    window: 6h
