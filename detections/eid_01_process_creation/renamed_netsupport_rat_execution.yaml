name: Renamed NetSupport RAT Execution
id: 0afbd410-de03-4078-8491-f132303cb67d
version: 1
schema_version: "1.0"
date: "2024-11-23"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 0afbd410-de03-4078-8491-f132303cb67d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of a renamed "client32.exe" (NetSupport RAT) via
  Imphash, Product and OriginalFileName strings.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_product:
                    value: "*NetSupport Remote Control*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_originalFileName:
                    value: "*client32.exe*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=A9D50692E95B79723F3E76FCF70D023E*"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\client32.exe"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_product
    - data_win_eventdata_originalFileName
    - data_win_eventdata_hashes
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_product matches
  '*NetSupport Remote Control*'; data_win_eventdata_originalFileName matches
  '*client32.exe*'; data_win_eventdata_hashes matches
  '*IMPHASH=A9D50692E95B79723F3E76FCF70D023E*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://redcanary.com/blog/misbehaving-rats/

response:
  message: >
    Renamed NetSupport RAT Execution detected on host $agent_name$. Matched
    data_win_eventdata_product: $data_win_eventdata_product$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_product
      type: other
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  custom_tags:
    - renamed
    - netsupport
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_product:/.*[Nn][Ee][Tt][Ss][Uu][Pp][Pp][Oo][Rr][Tt] [Rr][Ee][Mm][Oo][Tt][Ee] [Cc][Oo][Nn][Tt][Rr][Oo][Ll].*/ OR data_win_eventdata_originalFileName:/.*[Cc][Ll][Ii][Ee][Nn][Tt]32\.[Ee][Xx][Ee].*/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=[Aa]9[Dd]50692[Ee]95[Bb]79723[Ff]3[Ee]76[Ff][Cc][Ff]70[Dd]023[Ee].*/) AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/.*\\[Cc][Ll][Ii][Ee][Nn][Tt]32\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 758ff488-18d5-4cbe-8ec4-02b6285a434f
    name: Remote Access Tool - NetSupport Execution
    reason: Same tool; unrenamed client32 activity confirms a NetSupport deployment beside the renamed copy.
  - id: 37e8d358-6408-4853-82f4-98333fca7014
    name: Remote Access Tool - NetSupport Execution From Unusual Location
    reason: Malicious NetSupport is dropped under AppData/Temp/ProgramData; shows the staged copy.
  - id: fcdf69e5-a3d3-452a-9724-26f2308bf2b1
    name: Phishing Pattern ISO in Archive
    reason: NetSupport RAT is commonly delivered by phishing archives/ISO loaders that precede the dropped client.
  - id: 2569ed8c-1147-498a-9b8c-2ad3656b10ed
    name: Potential Renamed Rundll32 Execution
    reason: Same operator tradecraft of renaming binaries to evade detection appears in the same intrusion.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Script or download tooling fetching payloads
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*\\(powershell|wscript|cscript|mshta|curl|bitsadmin|certutil)\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:(/.*[Hh][Tt][Tt][Pp].*/ OR /.*[Ii]nvoke-[Ww]eb[Rr]equest.*/ OR /.*[Dd]ownload.*/)
    pivot_on: host
    window: 6h
  - name: NetSupport artifacts written to disk
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(/.*[Cc]lient32\.(exe|ini).*/ OR /.*[Nn]et[Ss]upport.*/ OR /.*[Pp][Cc][Ii]_[Ss]vc.*/)
    pivot_on: host
    window: 24h
  - name: Run-key persistence pointing at user-writable paths
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*\\CurrentVersion\\Run\\.*/ AND data_win_eventdata_details:(/.*[Aa]pp[Dd]ata.*/ OR /.*[Pp]rogram[Dd]ata.*/ OR /.*[Tt]emp.*/)
    pivot_on: host
    window: 24h
  - name: Hands-on discovery after RAT start
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ww]hoami.*/ OR /.*[Nn]et\s+(user|group|view).*/ OR /.*[Nn]ltest.*/ OR /.*[Ii]pconfig\s+\/all.*/ OR /.*[Aa]rp\s+-a.*/)
    pivot_on: host
    window: 6h
  - name: Outbound connections from user-writable binaries
    query: data_win_system_eventID:3 AND data_win_eventdata_initiated:true AND data_win_eventdata_image:(/.*\\[Aa]pp[Dd]ata\\.*/ OR /.*\\[Pp]rogram[Dd]ata\\.*/ OR /.*\\[Tt]emp\\.*/ OR /.*\\[Pp]ublic\\.*/)
    pivot_on: host
    window: 6h
