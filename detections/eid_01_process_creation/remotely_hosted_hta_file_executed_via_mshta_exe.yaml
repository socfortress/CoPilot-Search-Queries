name: Remotely Hosted HTA File Executed Via Mshta.EXE
id: b98d0db6-511d-45de-ad02-e82a98729620
version: 1
schema_version: "1.0"
date: "2023-02-06"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: b98d0db6-511d-45de-ad02-e82a98729620
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of the "mshta" utility with an argument containing the
  "http" keyword, which could indicate that an attacker is executing a remotely
  hosted malicious hta file. MITRE ATT&CK: T1218.005.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\mshta.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "MSHTA.EXE"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*http://*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*https://*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*ftp://*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\mshta.exe'; data_win_eventdata_originalFileName equals 'MSHTA.EXE';
  data_win_eventdata_commandLine matches '*http://*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.trendmicro.com/en_us/research/22/e/avoslocker-ransomware-variant-abuses-driver-file-to-disable-anti-Virus-scans-log4shell.html
  - https://attack.mitre.org/techniques/T1218/005/

response:
  message: >
    Remotely Hosted HTA File Executed Via Mshta.EXE detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1218.005
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218.005
  custom_tags:
    - remotely
    - hosted
    - executed
    - process_creation
    - sysmon
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp]:\/\/.*/ OR data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp][Ss]:\/\/.*/ OR data_win_eventdata_commandLine:/.*[Ff][Tt][Pp]:\/\/.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 9b3af1e6-5b68-11eb-ae93-0242ac130002
    name: Detect MSHTA Url in Command Line
    reason: Same URL-in-mshta behaviour via a separate detection; corroborates it.
  - id: 8f45fcf0-5b68-11eb-ae93-0242ac130002
    name: Detect mshta renamed
    reason: Attackers rename mshta to evade image-name rules like this one.
  - id: a0873b32-5b68-11eb-ae93-0242ac130002
    name: Detect mshta inline hta execution
    reason: Inline script variant of the same proxy-execution technique.
  - id: cc7abbd0-762b-41e3-8a26-57ad50d2eea3
    name: MSHTA Execution with Suspicious File Extensions
    reason: Locally staged HTA variants appear when the remote fetch is blocked.
  - id: 4aa5d062-e893-11eb-9eb2-acde48001122
    name: Mshta spawning Rundll32 OR Regsvr32 Process
    reason: Common next stage after the HTA runs.
  - id: cea72823-df4d-4567-950c-0b579eaf0846
    name: Potential Dropper Script Execution Via WScript/CScript/MSHTA
    reason: Dropper chain that mshta often participates in.
  - id: ed5d72a6-f8f4-479d-ba79-02f6a80d7471
    name: Potential LethalHTA Technique Execution
    reason: DCOM-based HTA launch used for lateral movement.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Children of mshta
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Mm]shta.*/
    pivot_on: host
    window: 2h
  - name: Network connections by mshta
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*[Mm]shta.*/
    pivot_on: host
    window: 1h
  - name: Run-key persistence after HTA
    query: data_win_system_eventID:(12 OR 13) AND data_win_eventdata_targetObject:/.*\\CurrentVersion\\Run.*/
    pivot_on: host
    window: 4h
  - name: Files dropped by mshta
    query: data_win_system_eventID:11 AND data_win_eventdata_image:/.*[Mm]shta.*/
    pivot_on: host
    window: 2h
  - name: mshta launched with a URL
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*[Mm][Ss][Hh][Tt][Aa].*[Hh][Tt][Tt][Pp][Ss]?:.*/
    pivot_on: host
    window: 6h
