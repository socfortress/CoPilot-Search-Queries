name: Suspicious Scheduled Task Name As GUID
id: ff2fff64-4cd6-4a2b-ba7d-e28a30bbe66b
version: 1
schema_version: "1.0"
date: "2022-10-31"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: ff2fff64-4cd6-4a2b-ba7d-e28a30bbe66b
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects creation of a scheduled task with a GUID like name. MITRE ATT&CK:
  T1053.005.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\schtasks.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*/Create *"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*/TN \"{*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*/TN '{*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*/TN {*"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine: "*}\"*"
              - wildcard:
                  data_win_eventdata_commandLine: "*}'*"
              - wildcard:
                  data_win_eventdata_commandLine: "*} *"
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\schtasks.exe'; data_win_eventdata_commandLine matches '*/Create *';
  data_win_eventdata_commandLine matches '*/TN "{*', among other conditions.

known_false_positives: >
  Legitimate software naming their tasks as GUIDs. Baseline expected activity in
  your environment and tune this detection before relying on it for automated
  response.

references:
  - https://thedfirreport.com/2022/10/31/follina-exploit-leads-to-domain-compromise/
  - https://thedfirreport.com/2022/02/21/qbot-and-zerologon-lead-to-full-domain-compromise/
  - https://attack.mitre.org/techniques/T1053/005/

response:
  message: >
    Suspicious Scheduled Task Name As GUID detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1053.005
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1053.005
  custom_tags:
    - scheduled
    - process_creation
    - sysmon
    - privilege_escalation
    - persistence
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*\/[Cc][Rr][Ee][Aa][Tt][Ee] .*/ AND (data_win_eventdata_commandLine:/.*\/[Tt][Nn] \"\{.*/ OR data_win_eventdata_commandLine:/.*\/[Tt][Nn] '\{.*/ OR data_win_eventdata_commandLine:/.*\/[Tt][Nn] \{.*/) AND (data_win_eventdata_commandLine:/.*\}\".*/ OR data_win_eventdata_commandLine:/.*\}'.*/ OR data_win_eventdata_commandLine:/.*\} .*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 56c217c3-2de2-479b-990f-5c109ba8458f
    name: HackTool - Default PowerSploit/Empire Scheduled Task Creation
    reason: PowerSploit/Empire default tasks are classic tooling creating tasks via schtasks
  - id: 26488ad0-f9fd-4536-876f-52fea846a2e4
    name: HackTool - SharPersist Execution
    reason: SharPersist creates persistence tasks with generated names
  - id: 89ca78fd-b37c-4310-b3d3-81a023f83936
    name: Schtasks Creation Or Modification With SYSTEM Privileges
    reason: GUID-named tasks are often created with SYSTEM rights
  - id: 24c8392b-aa3c-46b7-a545-43f71657fe98
    name: Suspicious Schtasks Schedule Types
    reason: Unusual schedule types accompany implant-created tasks
  - id: 81325ce1-be01-4250-944f-b4789644556f
    name: Schedule Task Creation From Env Variable Or Potentially Suspicious Path Via Schtasks.EXE
    reason: Same schtasks create with suspicious path arguments
  - id: 80e1f67a-4596-4351-98f5-a9c3efabac95
    name: Suspicious Scheduled Task Write to System32 Tasks
    reason: Resulting task file in System32\Tasks
  - id: f2c64357-b1d2-41b7-849f-34d2682c0fad
    name: Suspicious Command Patterns In Scheduled Task Creation
    reason: Task action with suspicious command patterns
  - id: 9f8573c9-22b4-40e3-89c1-72bc2b8d49ab
    name: Scheduled Task Creation Masquerading as System Processes
    reason: Masquerading task names are a sibling evasion
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other schtasks create/change/run activity
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.* \/([Cc][Rr][Ee][Aa][Tt][Ee]|[Cc][Hh][Aa][Nn][Gg][Ee]|[Rr][Uu][Nn]) .*/
    pivot_on: host
    window: 24h
  - name: Shell or script interpreter spawned by Task Scheduler service
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Cc][Mm][Dd]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Mm][Ss][Hh][Tt][Aa]|[Rr][Uu][Nn][Dd][Ll][Ll]32)\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*([Tt][Ee][Mm][Pp]|[Aa][Pp][Pp][Dd][Aa][Tt][Aa]|[Pp][Uu][Bb][Ll][Ii][Cc]).*/
    pivot_on: host
    window: 24h
  - name: Task definition written to Tasks folder
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\.*[Tt][Aa][Ss][Kk][Ss]\\.*/
    pivot_on: host
    window: 4h
  - name: Parallel persistence via Run keys
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\[Rr][Uu][Nn].*/
    pivot_on: host
    window: 24h
  - name: Payload download or staging by LOLBin
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll].*[Uu][Rr][Ll][Cc][Aa][Cc][Hh][Ee].*/ OR data_win_eventdata_commandLine:/.*[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn].*[Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Cc][Uu][Rr][Ll].*[Hh][Tt][Tt][Pp].*/)
    pivot_on: host
    window: 2h
