version: 1
schema_version: "1.0"
date: "2023-01-30"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: c6fb44c6-71f5-49e6-9462-1425d328aee3
