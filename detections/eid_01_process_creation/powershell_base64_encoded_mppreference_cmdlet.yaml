status: experimental
type: TTP

description: >
  Detects base64 encoded "MpPreference" PowerShell cmdlet code that tries to
  modifies or tamper with Windows Defender AV. MITRE ATT&CK: T1685.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*QWRkLU1wUHJlZmVyZW5jZS*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*FkZC1NcFByZWZlcmVuY2Ug*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*BZGQtTXBQcmVmZXJlbmNlI*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*U2V0LU1wUHJlZmVyZW5jZS*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*NldC1NcFByZWZlcmVuY2Ug*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*TZXQtTXBQcmVmZXJlbmNlI*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*YWRkLW1wcHJlZmVyZW5jZS*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*FkZC1tcHByZWZlcmVuY2Ug*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*hZGQtbXBwcmVmZXJlbmNlI*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*c2V0LW1wcHJlZmVyZW5jZS*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*NldC1tcHByZWZlcmVuY2Ug*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
