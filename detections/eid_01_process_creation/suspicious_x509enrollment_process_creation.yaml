name: Suspicious X509Enrollment - Process Creation
id: 114de787-4eb2-48cc-abdb-c0b449f93ea4
version: 1
schema_version: "1.0"
date: "2022-12-23"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 114de787-4eb2-48cc-abdb-c0b449f93ea4
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detect use of X509Enrollment. MITRE ATT&CK: T1553.004.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*X509Enrollment.CBinaryConverter*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*884e2002-217d-11da-b2a4-000e7bbb2b09*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*X509Enrollment.CBinaryConverter*'; data_win_eventdata_commandLine matches
  '*884e2002-217d-11da-b2a4-000e7bbb2b09*'.

known_false_positives: >
  Legitimate administrative script. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://speakerdeck.com/heirhabarov/hunting-for-powershell-abuse?slide=42
  - https://speakerdeck.com/heirhabarov/hunting-for-powershell-abuse?slide=41
  - https://learn.microsoft.com/en-us/dotnet/api/microsoft.hpc.scheduler.store.cx509enrollmentwebclassfactoryclass?view=hpc-sdk-5.1.6115
  - https://attack.mitre.org/techniques/T1553/004/

response:
  message: >
    Suspicious X509Enrollment - Process Creation detected on host $agent_name$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1553.004
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1553.004
  custom_tags:
    - x509enrollment
    - process_creation
    - sysmon
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Xx]509[Ee][Nn][Rr][Oo][Ll][Ll][Mm][Ee][Nn][Tt]\.[Cc][Bb][Ii][Nn][Aa][Rr][Yy][Cc][Oo][Nn][Vv][Ee][Rr][Tt][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*884[Ee]2002-217[Dd]-11[Dd][Aa]-[Bb]2[Aa]4-000[Ee]7[Bb][Bb][Bb]2[Bb]09.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d2125259-ddea-4c1c-9c22-977eb5b29cf0
    name: New Root Certificate Installed Via Certutil.EXE
    reason: A certificate created via X509Enrollment is often followed by installing it as a trusted root.
  - id: ff992eac-6449-4c60-8c1d-91c9722a1d48
    name: New Root Certificate Installed Via CertMgr.EXE
    reason: Alternate tool to trust a self-created certificate.
  - id: 9e716b33-63b2-46da-86a4-bd3c3b9b5dfb
    name: Certificate Exported Via PowerShell
    reason: Generated or stolen certificates are exported to PFX for signing or reuse.
  - id: 3ffd6f51-e6c1-47b7-94b4-c1e61d4117c5
    name: Certificate Exported Via Certutil.EXE
    reason: Certificate export on the same host indicates key theft or staging for code signing.
  - id: 762f2482-ff21-4970-8939-0aa317a886bb
    name: HackTool - Certify Execution
    reason: AD CS abuse tooling that requests certificates, an alternative cert-minting path.
  - id: 6938366d-8954-4ddc-baff-c830b3ba8fcd
    name: HackTool - Certipy Execution
    reason: AD CS abuse tooling used for certificate-based privilege escalation.
  - id: d7bcd677-645d-4691-a8d4-7a5602b780d1
    name: Potential PowerShell Command Line Obfuscation
    reason: X509Enrollment COM usage is typically embedded in obfuscated PowerShell.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: PowerShell certificate and COM object creation
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*[Nn][Ee][Ww]-[Ss][Ee][Ll][Ff][Ss][Ii][Gg][Nn][Ee][Dd][Cc][Ee][Rr][Tt][Ii][Ff][Ii][Cc][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Ww]-[Oo][Bb][Jj][Ee][Cc][Tt] -[Cc][Oo][Mm].*/ OR data_win_eventdata_commandLine:/.*[Cc][Xx]509.*/)
    pivot_on: host
    window: 2h
  - name: Certutil and certmgr usage
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Ee][Rr][Tt][Mm][Gg][Rr]\.[Ee][Xx][Ee]/)
    pivot_on: host
    window: 4h
  - name: Certificate store registry changes
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Ee][Rr][Tt][Ii][Ff][Ii][Cc][Aa][Tt][Ee][Ss].*/
    pivot_on: host
    window: 4h
  - name: Signing tool or pfx file activity
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ss][Ii][Gg][Nn][Tt][Oo][Oo][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*\.[Pp][Ff][Xx].*/)
    pivot_on: host
    window: 6h
