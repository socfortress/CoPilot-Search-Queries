name: Indirect Command Execution via SFTP ProxyCommand
id: 762bb580-79b4-40f4-8b9e-9349ce1710f4
version: 1
schema_version: "1.0"
date: "2026-04-27"
author: Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 762bb580-79b4-40f4-8b9e-9349ce1710f4
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the use of SFTP.exe to execute commands indirectly via ProxyCommand
  parameter. Threat actors were seen leveraging this legitimate Windows binary
  to bypass security controls and execute arbitrary commands while evading
  detection. MITRE ATT&CK: T1202.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\sftp.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*ProxyCommand=*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\sftp.exe'; data_win_eventdata_commandLine matches '*ProxyCommand=*'.

known_false_positives: >
  Legitimate use of SFTP with proxy commands for administration or networking
  tasks. Baseline expected activity in your environment and tune this detection
  before relying on it for automated response.

references:
  - https://lolbas-project.github.io/lolbas/Binaries/Sftp/
  - https://news.sophos.com/en-us/2025/05/09/lumma-stealer-coming-and-going/
  - https://attack.mitre.org/techniques/T1202/

response:
  message: >
    Indirect Command Execution via SFTP ProxyCommand detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
    MITRE ATT&CK: T1202
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1202
  custom_tags:
    - indirect
    - proxycommand
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss][Ff][Tt][Pp]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Pp][Rr][Oo][Xx][Yy][Cc][Oo][Mm][Mm][Aa][Nn][Dd]=.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7d6d30b8-5b91-4b90-a891-46cccaf29598
    name: Program Executed Using Proxy/Local Command Via SSH.EXE
    reason: Program execution via ssh.exe proxy/local command uses the same ProxyCommand-style abuse
  - id: 327f48c1-a6db-4eb8-875a-f6981f1b0183
    name: Port Forwarding Activity Via SSH.EXE
    reason: SSH port forwarding on the same host suggests tunnelling follows or precedes proxy execution
  - id: f7d7ebd5-a016-46e2-9c54-f9932f2d386d
    name: Potential RDP Tunneling Via SSH
    reason: RDP tunneling via SSH is a common follow-on once SSH tooling is abused
  - id: 2daa93a0-a5fb-41c5-8cd8-3c11294bfd1f
    name: Potential SSH Tunnel Persistence Install Using A Scheduled Task
    reason: SSH tunnel persistence via scheduled task is a likely persistence step
  - id: 5edc2273-c26f-406c-83f3-f4d948e740dd
    name: Indirect Inline Command Execution Via Bash.EXE
    reason: Bash.exe inline execution is the sibling T1202 indirect execution technique
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: SSH client family invocations
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*\\(ssh|sftp|scp)\.exe/
    pivot_on: host
    window: 4h
  - name: SSH tunnel/forward options
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.* -[LRD] .*/ AND data_win_eventdata_image:/.*ssh\.exe/
    pivot_on: host
    window: 4h
  - name: Children spawned by ssh/sftp
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*\\(ssh|sftp|scp)\.exe/
    pivot_on: host
    window: 2h
  - name: Outbound connections from ssh clients
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*\\(ssh|sftp|scp)\.exe/
    pivot_on: host
    window: 4h
