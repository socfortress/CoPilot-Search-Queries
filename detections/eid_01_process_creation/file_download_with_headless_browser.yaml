e][Dd][Gg][Ee].*/) AND (data_win_eventdata_image:/.*\\[Mm][Ss][Ee][Dd][Gg][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Ee][Dd][Gg][Ee][Ww][Ee][Bb][Vv][Ii][Ee][Ww]2\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt][Ee][Dd][Gg][Ee]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*--[Hh][Ee][Aa][Dd][Ll][Ee][Ss][Ss] --[Dd][Ii][Ss][Aa][Bb][Ll][Ee]-[Gg][Pp][Uu] --[Dd][Ii][Ss][Aa][Bb][Ll][Ee]-[Ee][Xx][Tt][Ee][Nn][Ss][Ii][Oo][Nn][Ss] --[Dd][Ii][Ss][Aa][Bb][Ll][Ee]-[Pp][Ll][Uu][Gg][Ii][Nn][Ss] --[Mm][Uu][Tt][Ee]-[Aa][Uu][Dd][Ii][Oo] --[Nn][Oo]-[Ff][Ii][Rr][Ss][Tt]-[Rr][Uu][Nn] --[Ii][Nn][Cc][Oo][Gg][Nn][Ii][Tt][Oo] --[Aa][Gg][Gg][Rr][Ee][Ss][Ss][Ii][Vv][Ee]-[Cc][Aa][Cc][Hh][Ee]-[Dd][Ii][Ss][Cc][Aa][Rr][Dd] --[Dd][Uu][Mm][Pp]-[Dd][Oo][Mm].*/) OR ((data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Aa][Pp][Pp][Ss]\\.*/ OR data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm][Aa][Pp][Pp][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\.[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt][Ee][Dd][Gg][Ee].*/) AND (data_win_eventdata_image:/.*\\[Mm][Ss][Ee][Dd][Gg][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt][Ee][Dd][Gg][Ee]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*--[Hh][Ee][Aa][Dd][Ll][Ee][Ss][Ss] --[Dd][Ii][Ss][Aa][Bb][Ll][Ee]-[Gg][Pp][Uu] --[Dd][Ii][Ss][Aa][Bb][Ll][Ee]-[Ee][Xx][Tt][Ee][Nn][Ss][Ii][Oo][Nn][Ss] --[Dd][Ii][Ss][Aa][Bb][Ll][Ee]-[Pp][Ll][Uu][Gg][Ii][Nn][Ss] --[Mm][Uu][Tt][Ee]-[Aa][Uu][Dd][Ii][Oo] --[Nn][Oo]-[Ff][Ii][Rr][Ss][Tt]-[Rr][Uu][Nn] --[Ii][Nn][Cc][Oo][Gg][Nn][Ii][Tt][Oo] --[Aa][Gg][Gg][Rr][Ee][Ss][Ss][Ii][Vv][Ee]-[Cc][Aa][Cc][Hh][Ee]-[Dd][Ii][Ss][Cc][Aa][Rr][Dd] --[Dd][Uu][Mm][Pp]-[Dd][Oo][Mm].*/))

