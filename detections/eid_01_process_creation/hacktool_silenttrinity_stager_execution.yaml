name: HackTool - SILENTTRINITY Stager Execution
id: 03552375-cc2c-4883-bbe4-7958d5a980be
version: 1
schema_version: "1.0"
date: "2023-02-13"
author: Aleksey Potapov, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 03552375-cc2c-4883-bbe4-7958d5a980be
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects SILENTTRINITY stager use via PE metadata. MITRE ATT&CK: T1071.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_description:
              value: "*st2stager*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_description
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_description matches
  '*st2stager*'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/byt3bl33d3r/SILENTTRINITY
  - https://attack.mitre.org/techniques/T1071/

response:
  message: >
    HackTool - SILENTTRINITY Stager Execution detected on host $agent_name$.
    Matched data_win_eventdata_description: $data_win_eventdata_description$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1071
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_description
      type: other
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1071
  custom_tags:
    - hacktool
    - silenttrinity
    - stager
    - process_creation
    - sysmon
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_description:/.*[Ss][Tt]2[Ss][Tt][Aa][Gg][Ee][Rr].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 75c505b1-711d-4f68-a357-8c3fe37dbf2d
    name: HackTool - SILENTTRINITY Stager DLL Load
    reason: The stager loads Boo/IronPython and CLR DLLs; this image-load rule is the same implant at module level
  - id: 50e54b8d-ad73-43f8-96a1-5191685b17a4
    name: Silenttrinity Stager Msbuild Activity
    reason: SILENTTRINITY stager run via MSBuild makes outbound connections to its team server
  - id: 213b3148-24ea-11ec-93a2-acde48001122
    name: MSBuild Suspicious Spawned By Script Process
    reason: MSBuild spawned by scripting processes is a documented SILENTTRINITY delivery chain
  - id: 33be4333-2c6b-44f4-ae28-102cdbde0a31
    name: Suspicious Msbuild Execution By Uncommon Parent Process
    reason: MSBuild from an uncommon parent matches the inline-task project used to launch the stager
  - id: 4508a70e-97ef-4300-b62b-ff27992990ea
    name: DotNet CLR DLL Loaded By Scripting Applications
    reason: CLR loaded by scripting hosts is how the .NET stager runs inside wscript/cscript/msbuild
  - id: 37c1333a-a0db-48be-b64b-7393b2386e3b
    name: Hacktool Execution - PE Metadata
    reason: Hacktool PE-metadata hits can reveal other offensive binaries dropped by the same operator
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: MSBuild executing project files
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:(/.*\\[Mm][Ss][Bb][Uu][Ii][Ll][Dd]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:(/.*\.([Xx][Mm][Ll]|[Cc][Ss][Pp][Rr][Oo][Jj]|[Pp][Rr][Oo][Jj]).*/)
    pivot_on: host
    window: 4h
  - name: MSBuild or script hosts loading CLR and Boo/IronPython
    query: data_win_system_eventID:"7" AND data_win_eventdata_imageLoaded:(/.*\\[Cc][Ll][Rr]\.[Dd][Ll][Ll]/ OR /.*[Bb][Oo][Oo].*\.[Dd][Ll][Ll]/ OR /.*[Ii]ron[Pp]ython.*/) AND data_win_eventdata_image:(/.*\\[Mm][Ss][Bb][Uu][Ii][Ll][Dd]\.[Ee][Xx][Ee]/ OR /.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR /.*\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/)
    pivot_on: host
    window: 4h
  - name: Outbound connections from the stager host process
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:"true" AND data_win_eventdata_image:(/.*\\[Mm][Ss][Bb][Uu][Ii][Ll][Dd]\.[Ee][Xx][Ee]/ OR /.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR /.*\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR /.*\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/)
    pivot_on: host
    window: 4h
  - name: Hands-on-keyboard children of the stager
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:(/.*\\[Mm][Ss][Bb][Uu][Ii][Ll][Dd]\.[Ee][Xx][Ee]/ OR /.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/) AND data_win_eventdata_image:(/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR /.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR /.*\\[Ww][Hh][Oo][Aa][Mm][Ii]\.[Ee][Xx][Ee]/ OR /.*\\[Nn][Ee][Tt]\.[Ee][Xx][Ee]/)
    pivot_on: host
    window: 4h
