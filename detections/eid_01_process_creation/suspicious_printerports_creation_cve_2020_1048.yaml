name: Suspicious PrinterPorts Creation (CVE-2020-1048)
id: cc08d590-8b90-413a-aff6-31d1a99678d7
version: 1
schema_version: "1.0"
date: "2021-11-27"
author: EagleEye Team, Florian Roth
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: cc08d590-8b90-413a-aff6-31d1a99678d7
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects new commands that add new printer port which point to suspicious file.
  MITRE ATT&CK: T1059.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*Add-PrinterPort -Name*"
                          case_insensitive: true
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*.exe*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*.dll*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*.bat*"
                                case_insensitive: true
                        minimum_should_match: 1
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Generic / Text Only*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*Add-PrinterPort -Name*'; data_win_eventdata_commandLine matches '*.exe*';
  data_win_eventdata_commandLine matches '*.dll*', among other conditions.

known_false_positives: >
  New printer port install on host. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://windows-internals.com/printdemon-cve-2020-1048/
  - https://attack.mitre.org/techniques/T1059/001/

response:
  message: >
    Suspicious PrinterPorts Creation (CVE-2020-1048) detected on host
    $agent_name$. Matched data_win_eventdata_commandLine:
    $data_win_eventdata_commandLine$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1059.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
  custom_tags:
    - printerports
    - process_creation
    - sysmon
    - persistence
    - execution
    - cve_2020_1048
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND ((data_win_eventdata_commandLine:/.*[Aa][Dd][Dd]-[Pp][Rr][Ii][Nn][Tt][Ee][Rr][Pp][Oo][Rr][Tt] -[Nn][Aa][Mm][Ee].*/ AND (data_win_eventdata_commandLine:/.*\.[Ee][Xx][Ee].*/ OR data_win_eventdata_commandLine:/.*\.[Dd][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*\.[Bb][Aa][Tt].*/)) OR data_win_eventdata_commandLine:/.*[Gg][Ee][Nn][Ee][Rr][Ii][Cc] \/ [Tt][Ee][Xx][Tt] [Oo][Nn][Ll][Yy].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: bb76d96b-821c-47cf-944b-7ce377864492
    name: Suspicious NTLM Authentication on the Printer Spooler Service
    reason: 'Spooler abuse sibling: NTLM auth against the Print Spooler on the same host points to the same spooler-targeting actor'
  - id: fb843269-508c-4b76-8b8d-88679db22ce7
    name: Suspicious Execution of Powershell with Base64
    reason: Encoded PowerShell is how the Add-PrinterPort exploit is commonly delivered
  - id: b6e04788-29e1-4557-bb14-77f761848ab8
    name: Potentially Suspicious File Download From File Sharing Domain Via PowerShell.EXE
    reason: Add-PrinterPort is invoked from PowerShell; PowerShell fetching tooling is the usual precursor
  - id: 590a5f4c-6c8c-4f10-8307-89afe9453a9d
    name: Suspicious Child Process Created as System
    reason: SYSTEM-level child processes follow a successful spooler privilege escalation
  - id: 178e615d-e666-498b-9630-9ed363038101
    name: Elevated System Shell Spawned From Uncommon Parent Location
    reason: An elevated system shell from an uncommon parent is the expected outcome once the port write lands code as SYSTEM
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Printer port or spooler registry changes
    query: (data_win_system_eventID:"13" OR data_win_system_eventID:"12") AND data_win_eventdata_targetObject:/.*([Pp][Rr][Ii][Nn][Tt][Ee][Rr][Pp][Oo][Rr][Tt][Ss]|[Cc][Oo][Nn][Tt][Rr][Oo][Ll]\\[Pp][Rr][Ii][Nn][Tt]).*/
    pivot_on: host
    window: 4h
  - name: Files written into spooler directories
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*([Ss][Pp][Oo][Oo][Ll]\\[Dd][Rr][Ii][Vv][Ee][Rr][Ss]|[Ss][Pp][Oo][Oo][Ll]\\[Pp][Rr][Tt][Pp][Rr][Oo][Cc][Ss]).*/
    pivot_on: host
    window: 4h
  - name: Child processes spawned by the spooler service
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ss][Pp][Oo][Oo][Ll][Ss][Vv]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 4h
  - name: PowerShell printer cmdlet usage
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Aa][Dd][Dd]-[Pp][Rr][Ii][Nn][Tt][Ee][Rr]|[Pp][Rr][Ii][Nn][Tt][Ee][Rr][Pp][Oo][Rr][Tt]).*/
    pivot_on: host
    window: 4h
