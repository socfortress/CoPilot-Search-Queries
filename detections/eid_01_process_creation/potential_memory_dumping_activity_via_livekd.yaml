name: Potential Memory Dumping Activity Via LiveKD
id: a85f7765-698a-4088-afa0-ecfbf8d01fa4
version: 1
schema_version: "1.0"
date: "2023-05-15"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: a85f7765-698a-4088-afa0-ecfbf8d01fa4
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of LiveKD based on PE metadata or image name.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\livekd.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\livekd64.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "livekd.exe"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\livekd.exe'; data_win_eventdata_image matches '*\livekd64.exe';
  data_win_eventdata_originalFileName equals 'livekd.exe'.

known_false_positives: >
  Administration and debugging activity (must be investigated). Baseline
  expected activity in your environment and tune this detection before relying
  on it for automated response.

references:
  - https://learn.microsoft.com/en-us/sysinternals/downloads/livekd

response:
  message: >
    Potential Memory Dumping Activity Via LiveKD detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  custom_tags:
    - memory
    - dumping
    - livekd
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ll][Ii][Vv][Ee][Kk][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ll][Ii][Vv][Ee][Kk][Dd]64\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ll][Ii][Vv][Ee][Kk][Dd]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c7746f1c-47d3-43d6-8c45-cd1e54b6b0a2
    name: Kernel Memory Dump Via LiveKD
    reason: Same tool with dump-creating arguments; confirms an actual kernel memory dump, not just a launch.
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: Parallel method of dumping credential memory on the same host.
  - id: 5afee48e-67dd-4e03-a783-f74259dcf998
    name: Potential LSASS Process Dump Via Procdump
    reason: Sysinternals sibling used for credential-memory theft in the same session.
  - id: 2e65275c-8288-4ab4-aeb7-6274f58b6b20
    name: Procdump Execution
    reason: Other Sysinternals dumping tooling being run on the same host.
  - id: 044ba588-dff4-4918-9808-3f95e8160606
    name: Copy .DMP/.DUMP Files From Remote Share Via Cmd.EXE
    reason: Dump files are moved between hosts after creation.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Dump file written
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\.[Dd][Mm][Pp]/
    pivot_on: host
    window: 4h
  - name: LiveKD registry and EULA artifacts
    query: data_win_system_eventID:(12 OR 13) AND data_win_eventdata_targetObject:/.*[Ss]ysinternals.*[Ll]ive[Kk][Dd].*/
    pivot_on: host
    window: 4h
  - name: Dump compression or exfil staging
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Dd][Mm][Pp].*/ AND (/.*7z.*/ OR /.*[Rr]ar.*/ OR /.*[Cc]ompress.*/ OR /.*[Cc]url.*/ OR /.*[Ss]cp.*/))
    pivot_on: host
    window: 6h
  - name: Credential extraction tooling
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Mm]imikatz.*/ OR /.*[Pp]ypykatz.*/ OR /.*[Ss]ekurlsa.*/ OR /.*[Ll]saass.*/)
    pivot_on: host
    window: 6h
