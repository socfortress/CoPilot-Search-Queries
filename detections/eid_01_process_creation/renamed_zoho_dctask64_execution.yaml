name: Renamed ZOHO Dctask64 Execution
id: 340a090b-c4e9-412e-bb36-b4b16fe96f9b
version: 1
schema_version: "1.0"
date: "2025-01-22"
author: Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 340a090b-c4e9-412e-bb36-b4b16fe96f9b
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a renamed "dctask64.exe" execution, a signed binary by ZOHO
  Corporation part of ManageEngine Endpoint Central. This binary can be abused
  for DLL injection, arbitrary command and process execution. MITRE ATT&CK:
  T1036, T1055.001, T1202, T1218.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=6834B1B94E49701D77CCB3C0895E1AFD*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=1BB6F93B129F398C7C4A76BB97450BBA*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=FAA2AC19875FADE461C8D89DCF2710A3*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=F1039CED4B91572AB7847D26032E6BBF*"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\dctask64.exe"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_hashes
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_hashes matches
  '*IMPHASH=6834B1B94E49701D77CCB3C0895E1AFD*'; data_win_eventdata_hashes
  matches '*IMPHASH=1BB6F93B129F398C7C4A76BB97450BBA*';
  data_win_eventdata_hashes matches
  '*IMPHASH=FAA2AC19875FADE461C8D89DCF2710A3*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/gN3mes1s/status/1222088214581825540
  - https://twitter.com/gN3mes1s/status/1222095963789111296
  - https://twitter.com/gN3mes1s/status/1222095371175911424
  - https://attack.mitre.org/techniques/T1036/
  - https://attack.mitre.org/techniques/T1055/001/
  - https://attack.mitre.org/techniques/T1202/
  - https://attack.mitre.org/techniques/T1218/

response:
  message: >
    Renamed ZOHO Dctask64 Execution detected on host $agent_name$. Matched
    data_win_eventdata_hashes: $data_win_eventdata_hashes$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1036,
    T1055.001, T1202, T1218
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_hashes
      type: file_hash
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1036
    - T1055.001
    - T1202
    - T1218
  custom_tags:
    - renamed
    - dctask64
    - process_creation
    - sysmon
    - privilege_escalation
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=6834[Bb]1[Bb]94[Ee]49701[Dd]77[Cc][Cc][Bb]3[Cc]0895[Ee]1[Aa][Ff][Dd].*/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=1[Bb][Bb]6[Ff]93[Bb]129[Ff]398[Cc]7[Cc]4[Aa]76[Bb][Bb]97450[Bb][Bb][Aa].*/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=[Ff][Aa][Aa]2[Aa][Cc]19875[Ff][Aa][Dd][Ee]461[Cc]8[Dd]89[Dd][Cc][Ff]2710[Aa]3.*/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=[Ff]1039[Cc][Ee][Dd]4[Bb]91572[Aa][Bb]7847[Dd]26032[Ee]6[Bb][Bb][Ff].*/) AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/.*\\[Dd][Cc][Tt][Aa][Ss][Kk]64\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 6345b048-8441-43a7-9bed-541133633d7a
    name: ManageEngine Endpoint Central Dctask64.EXE Potential Abuse
    reason: Non-renamed dctask64 abuse (DLL injection, command exec) is the same technique in plain form
  - id: 36480ae1-a1cb-4eaa-a0d6-29801d7e9142
    name: Potential Defense Evasion Via Binary Rename
    reason: Generic rename-to-evade detection co-occurs with renamed signed-binary abuse
  - id: 0ba1da6d-b6ce-4366-828c-18826c9de23e
    name: Potential Defense Evasion Via Rename Of Highly Relevant Binaries
    reason: Rename of other highly relevant binaries by the same operator
  - id: 129966c9-de17-4334-a123-8b58172e664d
    name: Potential Windows Defender AV Bypass Via Dump64.EXE Rename
    reason: Another renamed signed binary used for AV bypass and injection
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Remote thread creation (injection)
    query: data_win_system_eventID:8
    pivot_on: host
    window: 1h
  - name: Dctask64 invocations with injection arguments
    query: data_win_system_eventID:1 AND (data_win_eventdata_originalFileName:/[Dd]ctask64.exe/ OR data_win_eventdata_commandLine:/.*[Dd]ctask64.*/ OR data_win_eventdata_commandLine:/.*executeInstructions.*/ OR data_win_eventdata_commandLine:/.*[Ss]tartProcess.*/)
    pivot_on: host
    window: 4h
  - name: Shells and proxy binaries from user-writable parents
    query: data_win_system_eventID:1 AND data_win_eventdata_image:(/.*\\(cmd|powershell|rundll32|regsvr32|mshta)\.exe/) AND data_win_eventdata_parentImage:(/.*\\(Temp|ProgramData|Users\\Public)\\.*/)
    pivot_on: host
    window: 2h
  - name: Executables dropped to temp or public paths
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(/.*\\(Temp|ProgramData|Users\\Public)\\.*\.(exe|dll)/)
    pivot_on: host
    window: 4h
