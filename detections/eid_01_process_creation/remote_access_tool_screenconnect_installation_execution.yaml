name: Remote Access Tool - ScreenConnect Installation Execution
id: 75bfe6e6-cd8e-429e-91d3-03921e1d7962
version: 1
schema_version: "1.0"
date: "2024-02-26"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 75bfe6e6-cd8e-429e-91d3-03921e1d7962
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects ScreenConnect program starts that establish a remote access to a
  system. MITRE ATT&CK: T1133.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*e=Access&*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*y=Guest&*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*&p=*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*&c=*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*&k=*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*e=Access&*'; data_win_eventdata_commandLine matches '*y=Guest&*';
  data_win_eventdata_commandLine matches '*&p=*', among other conditions.

known_false_positives: >
  Legitimate use by administrative staff. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://www.anomali.com/blog/probable-iranian-cyber-actors-static-kitten-conducting-cyberespionage-campaign-targeting-uae-and-kuwait-government-agencies
  - https://attack.mitre.org/techniques/T1133/

response:
  message: >
    Remote Access Tool - ScreenConnect Installation Execution detected on host
    $agent_name$. Matched data_win_eventdata_commandLine:
    $data_win_eventdata_commandLine$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1133
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1133
  custom_tags:
    - screenconnect
    - installation
    - process_creation
    - sysmon
    - persistence
    - initial_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Ee]=[Aa][Cc][Cc][Ee][Ss][Ss]\&.*/ AND data_win_eventdata_commandLine:/.*[Yy]=[Gg][Uu][Ee][Ss][Tt]\&.*/ AND data_win_eventdata_commandLine:/.*\&[Pp]=.*/ AND data_win_eventdata_commandLine:/.*\&[Cc]=.*/ AND data_win_eventdata_commandLine:/.*\&[Kk]=.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 57bff678-25d1-4d6c-8211-8ca106d12053
    name: Remote Access Tool - ScreenConnect Execution
    reason: After the join/install command, the ScreenConnect client service starts running on the host
  - id: 7b582f1a-b318-4c6a-bf4e-66fe49bf55a5
    name: Remote Access Tool - ScreenConnect Potential Suspicious Remote Command Execution
    reason: Operator command execution through the newly connected session
  - id: 5594e67a-7f92-4a04-b65d-1a42fd824a60
    name: MSI Installation From Web
    reason: Installer was usually pulled from the web via MSI just before this launch
  - id: c7c8aa1c-5aff-408e-828b-998e3620b341
    name: MSI Installation From Suspicious Locations
    reason: Installer run from Temp/Downloads indicates phish or dropper delivery of the client
  - id: 79a87aa6-e4bd-42fc-a5bb-5e6fbdcd62f5
    name: Msiexec Quiet Installation
    reason: Silent install of the client package
  - id: 21dd6d38-2b18-4453-9404-a0fe4a0cc288
    name: Curl Download And Execute Combination
    reason: Download-and-run of the client installer
  - id: d059842b-6b9d-4ed1-b5c3-5b89143c6ede
    name: File Download Via Bitsadmin
    reason: Alternate LOLBin used to fetch the installer
  - id: cea72823-df4d-4567-950c-0b579eaf0846
    name: Potential Dropper Script Execution Via WScript/CScript/MSHTA
    reason: Script dropper commonly launches the ScreenConnect installer in phishing chains
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: msiexec installing ScreenConnect
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Mm]siexec\.exe/ AND data_win_eventdata_commandLine:/.*([Ss]creen[Cc]onnect|\.msi).*/
    pivot_on: host
    window: 2h
  - name: Installer download via LOLBin or script
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(curl|bitsadmin|certutil|powershell|pwsh|wscript|cscript|mshta)\.exe/ AND data_win_eventdata_commandLine:/.*([Ss]creen[Cc]onnect|[Cc]lient.*(msi|exe)).*/
    pivot_on: host
    window: 2h
  - name: Service creation for ScreenConnect
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*sc\.exe/ AND data_win_eventdata_commandLine:/.*([Cc]reate|[Cc]onfig).*[Ss]creen[Cc]onnect.*/
    pivot_on: host
    window: 4h
  - name: Shells spawned by ScreenConnect
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentCommandLine:/.*[Ss]creen[Cc]onnect.*/ AND data_win_eventdata_image:/.*(cmd|powershell|pwsh)\.exe/
    pivot_on: host
    window: 4h
