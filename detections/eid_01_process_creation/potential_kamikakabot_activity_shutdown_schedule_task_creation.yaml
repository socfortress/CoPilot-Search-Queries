name: Potential KamiKakaBot Activity - Shutdown Schedule Task Creation
id: fe9e8ba9-4419-41e6-a574-bd9f7b3af961
version: 1
schema_version: "1.0"
date: "2024-03-22"
author: Nasreddine Bencherchali (Nextron Systems), X__Junior (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: fe9e8ba9-4419-41e6-a574-bd9f7b3af961
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the creation of a schedule task that runs weekly and execute the
  "shutdown /l /f" command. This behavior was observed being used by KamiKakaBot
  samples in order to achieve persistence on a system.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\schtasks.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* /create *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*shutdown /l /f*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*WEEKLY*"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_user"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_user:
                          value: "*AUTHORI*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_user:
                          value: "*AUTORI*"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_user
    - data_win_eventdata_parentImage

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\schtasks.exe'; data_win_eventdata_commandLine matches '* /create *';
  data_win_eventdata_commandLine matches '*shutdown /l /f*', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.nextron-systems.com/2024/03/22/unveiling-kamikakabot-malware-analysis/
  - https://tria.ge/240123-rapteaahhr/behavioral1

response:
  message: >
    Potential KamiKakaBot Activity - Shutdown Schedule Task Creation detected on
    host $agent_name$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. Matched data_win_eventdata_commandLine:
    $data_win_eventdata_commandLine$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - kamikakabot
    - shutdown
    - schedule
    - process_creation
    - sysmon
    - persistence
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.* \/[Cc][Rr][Ee][Aa][Tt][Ee] .*/ AND data_win_eventdata_commandLine:/.*[Ss][Hh][Uu][Tt][Dd][Oo][Ww][Nn] \/[Ll] \/[Ff].*/ AND data_win_eventdata_commandLine:/.*[Ww][Ee][Ee][Kk][Ll][Yy].*/ AND _exists_:data_win_eventdata_user AND NOT (data_win_eventdata_user:/.*[Aa][Uu][Tt][Hh][Oo][Rr][Ii].*/ OR data_win_eventdata_user:/.*[Aa][Uu][Tt][Oo][Rr][Ii].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 24474469-bd80-46cc-9e08-9fbe81bfaaca
    name: Potential KamiKakaBot Activity - Lure Document Execution
    reason: Stage-2 lure execution that precedes the persistence task from the same malware.
  - id: 34ebb878-1b15-4895-b352-ca2eeb99b274
    name: Suspicious Execution of Shutdown
    reason: The scheduled task fires shutdown; actual execution shows the persistence triggering.
  - id: ec290c06-9b6b-4338-8b6b-095c0f284f10
    name: Suspicious Execution of Shutdown to Log Out
    reason: The task runs 'shutdown /l /f' (forced logoff); this detects it executing.
  - id: 24c8392b-aa3c-46b7-a545-43f71657fe98
    name: Suspicious Schtasks Schedule Types
    reason: Weekly schtasks creation overlaps on the same schtasks.exe invocation pattern.
  - id: 1c0e41cd-21bb-4433-9acc-4a2cd6367b9b
    name: Suspicious Modification Of Scheduled Tasks
    reason: Follow-on tampering with the same task set during persistence tuning.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Forced logoff executions
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Ss][Hh][Uu][Tt][Dd][Oo][Ww][Nn]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 24h
  - name: Scheduled task create or change
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:*\/create* OR data_win_eventdata_commandLine:*\/change*)
    pivot_on: user
    window: 6h
  - name: Word launched via Start Menu shortcut from cmd
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:*Start\ Menu*Word* AND data_win_eventdata_commandLine:*.lnk*
    pivot_on: host
    window: 6h
  - name: Task registered events
    query: data_win_system_eventID:4698
    pivot_on: user
    window: 6h
  - name: Payloads dropped to user profile
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*(AppData|ProgramData|Temp).*\.(exe|dll|ps1|vbs|bat)/
    pivot_on: host
    window: 6h
