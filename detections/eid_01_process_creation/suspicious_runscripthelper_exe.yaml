name: Suspicious Runscripthelper.exe
id: eca49c87-8a75-4f13-9c73-a5a29e845f03
version: 1
schema_version: "1.0"
date: "2022-07-11"
author: Victor Sergeev, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: eca49c87-8a75-4f13-9c73-a5a29e845f03
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of powershell scripts via Runscripthelper.exe. MITRE ATT&CK:
  T1059, T1202.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\Runscripthelper.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*surfacecheck*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\Runscripthelper.exe'; data_win_eventdata_commandLine matches
  '*surfacecheck*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://lolbas-project.github.io/lolbas/Binaries/Runscripthelper/
  - https://attack.mitre.org/techniques/T1059/
  - https://attack.mitre.org/techniques/T1202/

response:
  message: >
    Suspicious Runscripthelper.exe detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1059, T1202
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059
    - T1202
  custom_tags:
    - runscripthelper
    - process_creation
    - sysmon
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Ss][Cc][Rr][Ii][Pp][Tt][Hh][Ee][Ll][Pp][Ee][Rr]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Ss][Uu][Rr][Ff][Aa][Cc][Ee][Cc][Hh][Ee][Cc][Kk].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 64760eef-87f7-4ed3-93fd-655668ea9420
    name: Use of Scriptrunner.exe
    reason: Scriptrunner.exe is another signed binary that runs commands for the attacker; alternate proxy.
  - id: 59e938ff-0d6d-4dc3-b13f-36cc28734d4e
    name: Execute Code with Pester.bat
    reason: Pester.bat is another LOLBAS PowerShell proxy-execution route often swapped in.
  - id: 0955e4e1-c281-4fb9-9ee1-5ee7b4b754d2
    name: Use of Pcalua For Execution
    reason: Pcalua executes arbitrary commands as a trusted binary, same evasion goal.
  - id: 1fdf31c9-ff4d-4c48-b799-0e8666e08787
    name: Windows Indirect Command Execution Via forfiles
    reason: Forfiles indirect command execution is an equivalent proxy-execution alternative.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: PowerShell spawned by or alongside Runscripthelper
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Rr][Uu][Nn][Ss][Cc][Rr][Ii][Pp][Tt][Hh][Ee][Ll][Pp][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\([Rr][Uu][Nn][Ss][Cc][Rr][Ii][Pp][Tt][Hh][Ee][Ll][Pp][Ee][Rr]\.[Ee][Xx][Ee])/)
    pivot_on: host
    window: 2h
  - name: Script files written to the Windows Temp folder
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\[Tt][Ee][Mm][Pp]\\.*\.([Pp][Ss]1|[Tt][Xx][Tt])/
    pivot_on: host
    window: 2h
  - name: Suspicious PowerShell command lines
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*-[Ee][Nn][Cc].*/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Ii][Ee][Xx].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ee][Xx][Pp][Rr][Ee][Ss][Ss][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*-[Nn][Oo][Pp].*/ OR data_win_eventdata_commandLine:/.*[Bb][Yy][Pp][Aa][Ss][Ss].*/)
    pivot_on: host
    window: 2h
  - name: Outbound connections by PowerShell
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 2h
