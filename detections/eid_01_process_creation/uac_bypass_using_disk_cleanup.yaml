name: UAC Bypass Using Disk Cleanup
id: b697e69c-746f-4a86-9f59-7bfff8eab881
version: 1
schema_version: "1.0"
date: "2024-12-01"
author: Christian Burkard (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: b697e69c-746f-4a86-9f59-7bfff8eab881
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the pattern of UAC Bypass using scheduled tasks and variable expansion
  of cleanmgr.exe (UACMe 34). MITRE ATT&CK: T1548.002.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*\"\\\\system32\\\\cleanmgr.exe /autoclean /d C:"
              case_insensitive: true
        - term:
            data_win_eventdata_parentCommandLine:
              value: "C:\\Windows\\system32\\svchost.exe -k netsvcs -p -s Schedule"
              case_insensitive: true
        - bool:
            should:
              - term:
                  data_win_eventdata_integrityLevel:
                    value: "High"
                    case_insensitive: true
              - term:
                  data_win_eventdata_integrityLevel:
                    value: "System"
                    case_insensitive: true
              - term:
                  data_win_eventdata_integrityLevel:
                    value: "S-1-16-16384"
                    case_insensitive: true
              - term:
                  data_win_eventdata_integrityLevel:
                    value: "S-1-16-12288"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentCommandLine
    - data_win_eventdata_integrityLevel
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*"\system32\cleanmgr.exe /autoclean /d C:';
  data_win_eventdata_parentCommandLine equals 'C:\Windows\system32\svchost.exe
  -k netsvcs -p -s Schedule'; data_win_eventdata_integrityLevel equals 'High',
  among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/hfiref0x/UACME
  - https://attack.mitre.org/techniques/T1548/002/

response:
  message: >
    UAC Bypass Using Disk Cleanup detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_parentCommandLine:
    $data_win_eventdata_parentCommandLine$. MITRE ATT&CK: T1548.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_parentCommandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1548.002
  custom_tags:
    - bypass
    - cleanup
    - process_creation
    - sysmon
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*\"\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Cc][Ll][Ee][Aa][Nn][Mm][Gg][Rr]\.[Ee][Xx][Ee] \/[Aa][Uu][Tt][Oo][Cc][Ll][Ee][Aa][Nn] \/[Dd] [Cc]:/ AND data_win_eventdata_parentCommandLine:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee] -[Kk] [Nn][Ee][Tt][Ss][Vv][Cc][Ss] -[Pp] -[Ss] [Ss][Cc][Hh][Ee][Dd][Uu][Ll][Ee]/ AND (data_win_eventdata_integrityLevel:/[Hh][Ii][Gg][Hh]/ OR data_win_eventdata_integrityLevel:/[Ss][Yy][Ss][Tt][Ee][Mm]/ OR data_win_eventdata_integrityLevel:/[Ss]-1-16-16384/ OR data_win_eventdata_integrityLevel:/[Ss]-1-16-12288/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d38d2fa4-98e6-4a24-aff1-410b0c9ad177
    name: HackTool - UACMe Akagi Execution
    reason: UACMe 34 (Disk Cleanup scheduled task env-var expansion) is implemented in Akagi.
  - id: 81325ce1-be01-4250-944f-b4789644556f
    name: Schedule Task Creation From Env Variable Or Potentially Suspicious Path Via Schtasks.EXE
    reason: Same scheduled-task and environment-variable abuse theme.
  - id: 7f741dcf-fc22-4759-87b4-9ae8376676a2
    name: Bypass UAC via Fodhelper.exe
    reason: Alternate UAC bypass the actor may try.
  - id: 178e615d-e666-498b-9630-9ed363038101
    name: Elevated System Shell Spawned From Uncommon Parent Location
    reason: Follow-on elevated shell.
  - id: c4db14d9-7909-48b4-a054-aa14d89dbb19
    name: Malicious PowerShell Process - Encoded Command
    reason: Common elevated payload.
  - id: 89ca78fd-b37c-4310-b3d3-81a023f83936
    name: Schtasks Creation Or Modification With SYSTEM Privileges
    reason: Elevation is often used to plant SYSTEM scheduled tasks for persistence.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: windir or systemroot environment variable set in HKCU
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Ee][Nn][Vv][Ii][Rr][Oo][Nn][Mm][Ee][Nn][Tt]\\([Ww][Ii][Nn][Dd][Ii][Rr]|[Ss][Yy][Ss][Tt][Ee][Mm][Rr][Oo][Oo][Tt])/
    pivot_on: host
    window: 2h
  - name: Cleanmgr and SilentCleanup execution
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Cc][Ll][Ee][Aa][Nn][Mm][Gg][Rr]\.[Ee][Xx][Ee]/ OR (data_win_eventdata_commandLine:/.*[Ss][Ii][Ll][Ee][Nn][Tt][Cc][Ll][Ee][Aa][Nn][Uu][Pp].*/))
    pivot_on: host
    window: 2h
  - name: Children of cleanmgr
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Cc][Ll][Ee][Aa][Nn][Mm][Gg][Rr]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 1h
  - name: Payload execution from user-writable paths
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\Users\\|\\ProgramData\\|\\Temp\\|\\Public\\).*/
    pivot_on: host
    window: 2h
  - name: Persistence creation after elevation
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*(\/[Cc][Rr][Ee][Aa][Tt][Ee]|\/[Cc][Hh][Aa][Nn][Gg][Ee]).*/) OR (data_win_eventdata_commandLine:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\[Rr][Uu][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc] [Cc][Rr][Ee][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc]\.[Ee][Xx][Ee] [Cc][Rr][Ee][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Ww]\-[Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/))
    pivot_on: host
    window: 4h
