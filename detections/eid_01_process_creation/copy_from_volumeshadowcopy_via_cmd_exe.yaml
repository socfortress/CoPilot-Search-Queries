name: Copy From VolumeShadowCopy Via Cmd.EXE
id: c73124a7-3e89-44a3-bdc1-25fe4df754b1
version: 1
schema_version: "1.0"
date: "2023-03-07"
author: Max Altgelt (Nextron Systems), Tobias Michalski (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: c73124a7-3e89-44a3-bdc1-25fe4df754b1
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of the builtin "copy" command that targets a shadow copy
  (sometimes used to copy registry hives that are in use). MITRE ATT&CK: T1490.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*copy *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*\\\\\\\\\\?\\\\GLOBALROOT\\\\Device\\\\HarddiskVolumeShadowCopy*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches '*copy
  *'; data_win_eventdata_commandLine matches
  '*\\?\GLOBALROOT\Device\HarddiskVolumeShadowCopy*'.

known_false_positives: >
  Backup scenarios using the commandline. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://twitter.com/vxunderground/status/1423336151860002816?s=20
  - https://www.virustotal.com/gui/file/03e9b8c2e86d6db450e5eceec057d7e369ee2389b9daecaf06331a95410aa5f8/detection
  - https://pentestlab.blog/2018/07/04/dumping-domain-password-hashes/
  - https://attack.mitre.org/techniques/T1490/

response:
  message: >
    Copy From VolumeShadowCopy Via Cmd.EXE detected on host $agent_name$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1490
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1490
  custom_tags:
    - volumeshadowcopy
    - process_creation
    - sysmon
    - impact
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Cc][Oo][Pp][Yy] .*/ AND data_win_eventdata_commandLine:/.*\\\\\?\\[Gg][Ll][Oo][Bb][Aa][Ll][Rr][Oo][Oo][Tt]\\[Dd][Ee][Vv][Ii][Cc][Ee]\\[Hh][Aa][Rr][Dd][Dd][Ii][Ss][Kk][Vv][Oo][Ll][Uu][Mm][Ee][Ss][Hh][Aa][Dd][Oo][Ww][Cc][Oo][Pp][Yy].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: f57f8d16-1f39-4dcb-a604-6c73d9b54b3d
    name: Sensitive File Access Via Volume Shadow Copy Backup
    reason: Sensitive file access through a shadow copy is the same technique for SAM/NTDS extraction
  - id: d372f928-ce4f-11eb-a762-acde48001122
    name: Esentutl SAM Copy
    reason: Esentutl SAM copy is an alternative route to lift the same locked credential files
  - id: 1af57a4b-460a-4738-9034-db68b880c665
    name: PowerShell SAM Copy
    reason: PowerShell SAM copy is the scripting variant of the same hive theft
  - id: fd877b94-9bb5-4191-bb25-d79cbd93c167
    name: Dumping of Sensitive Hives Via Reg.EXE
    reason: Reg save of SAM/SYSTEM/SECURITY complements the shadow copy to obtain the boot key
  - id: da63bc76-61ae-11eb-ae93-0242ac130002
    name: Ntdsutil Export NTDS
    reason: Ntdsutil export is the domain-controller counterpart to copying NTDS.dit from a shadow
  - id: 7b30e0a7-c675-4b24-8a46-82fa67e2433d
    name: Conti Volume Shadow Listing
    reason: Listing shadow volumes precedes locating the shadow copy path to copy from
  - id: 21ff4ca9-f13a-41ad-b828-0077b2af2e40
    name: Deletion of Volume Shadow Copies via WMI with PowerShell
    reason: Shadow copies created via WMI/PowerShell are the source being copied here
  - id: ec570e53-4c76-45a9-804d-dc3f355ff7a7
    name: 7Zip Compressing Dump Files
    reason: Copied hive/NTDS files are typically archived before exfiltration
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Shadow copy creation or listing
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]|[Dd][Ii][Ss][Kk][Ss][Hh][Aa][Dd][Oo][Ww]\.[Ee][Xx][Ee]|[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]|[Vv][Ss][Hh][Aa][Dd][Oo][Ww]\.[Ee][Xx][Ee])/ AND data_win_eventdata_commandLine:/.*([Ss][Hh][Aa][Dd][Oo][Ww]).*/
    pivot_on: host
    window: 6h
  - name: Registry hive saves and NTDS extraction
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ss][Aa][Vv][Ee] [Hh][Kk][Ll][Mm]\\[Ss][Aa][Mm]|[Ss][Aa][Vv][Ee] [Hh][Kk][Ll][Mm]\\[Ss][Yy][Ss][Tt][Ee][Mm]|[Ss][Aa][Vv][Ee] [Hh][Kk][Ll][Mm]\\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]|[Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt]|[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll]|[Ee][Ss][Ee][Nn][Tt][Uu][Tt][Ll]).*/
    pivot_on: host
    window: 6h
  - name: PowerShell shadow copy creation via WMI
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee])/ AND data_win_eventdata_commandLine:/.*([Ww][Ii][Nn]32_[Ss][Hh][Aa][Dd][Oo][Ww][Cc][Oo][Pp][Yy]|[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn]|[Gg][Ll][Oo][Bb][Aa][Ll][Rr][Oo][Oo][Tt]).*/
    pivot_on: host
    window: 6h
  - name: Offline credential extraction tools
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ss][Ee][Cc][Rr][Ee][Tt][Ss][Dd][Uu][Mm][Pp]|[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz]|[Ll][Ss][Aa][Dd][Uu][Mm][Pp]|[Pp][Yy][Pp][Yy][Kk][Aa][Tt][Zz]|[Ss][Aa][Mm][Dd][Uu][Mm][Pp]).*/
    pivot_on: host
    window: 24h
  - name: Archive and exfiltration of copied hives
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\(7[Zz]\.[Ee][Xx][Ee]|[Rr][Aa][Rr]\.[Ee][Xx][Ee]|[Ww][Ii][Nn][Rr][Aa][Rr]\.[Ee][Xx][Ee]|[Rr][Cc][Ll][Oo][Nn][Ee]\.[Ee][Xx][Ee]|[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]|[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 6h
