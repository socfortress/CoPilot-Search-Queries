correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 3f7f5b0b-5b16-476c-a85f-ab477f6dd24b
    name: Lazarus System Binary Masquerading
    reason: Lazarus system-binary masquerading is the specific tradecraft of placing renamed or copied system binaries in odd paths.
  - id: 2569ed8c-1147-498a-9b8c-2ad3656b10ed
    name: Potential Renamed Rundll32 Execution
    reason: A rundll32 copy running outside system32 corroborates the same location anomaly with a specific LOLBin.
  - id: e22a6eb2-f8a5-44b5-8b44-a2dbd47b1144
    name: Potential MsiExec Masquerading
    reason: msiexec masquerading is another system-binary impersonation this rule can hit.
  - id: 5394fcc7-aeb2-43b5-9a09-cac9fc5edcd5
    name: Suspicious Execution Location Of Wermgr.EXE
    reason: wermgr run from an unexpected location is a classic masquerade/sideload host and a narrower sibling.
  - id: e7888eb1-13b0-4616-bd99-4bc0c2b054b9
    name: Dllhost.EXE Execution Anomaly
    reason: dllhost anomalies suggest the impersonated binary is used as an injection or proxy host.
  - id: 3dfd06d2-eaf4-4532-9555-68aca59f57c4
    name: Process Execution From A Potentially Suspicious Folder
    reason: Execution from suspicious folders catches the non-system payloads dropped alongside the masquerading binary.
  - id: 5ce0f04e-3efc-42af-839d-5b3a543b76c0
    name: Suspicious Process Execution From Fake Recycle.Bin Folder
    reason: Fake Recycle.Bin execution is a common hiding place for dropped copies of system binaries.
  - id: f1086bf7-a0c4-4a37-9102-01e573caf4a0
    name: Renamed Whoami Execution
    reason: A renamed whoami shows operators staging renamed recon tools the same way.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Executables written with system-binary names outside Windows dirs
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\([Ss][Vv][Cc][Hh][Oo][Ss][Tt]|[Ll][Ss][Aa][Ss][Ss]|[Cc][Ss][Rr][Ss][Ss]|[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]|[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]|[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]|[Tt][Aa][Ss][Kk][Hh][Oo][Ss][Tt]|[Tt][Aa][Ss][Kk][Hh][Oo][Ss][Tt][Ww]|[Ss][Pp][Oo][Oo][Ll][Ss][Vv]|[Rr][Uu][Nn][Dd][Ll][Ll]32|[Rr][Ee][Gg][Ss][Vv][Rr]32|[Dd][Ll][Ll][Hh][Oo][Ss][Tt]|[Cc][Oo][Nn][Hh][Oo][Ss][Tt]|[Ss][Mm][Ss][Ss])\.[Ee][Xx][Ee]/ AND NOT data_win_eventdata_targetFilename:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\.*/
    pivot_on: host
    window: 1h
  - name: Persistence written by processes in user-writable paths
    query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/ OR data_win_eventdata_targetObject:/.*\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\.*/) AND data_win_eventdata_image:/.*\\([Uu][Ss][Ee][Rr][Ss]|[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]|[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]|[Aa][Pp][Pp][Dd][Aa][Tt][Aa]|[Pp][Uu][Bb][Ll][Ii][Cc]|[Tt][Ee][Mm][Pp])\\.*/
    pivot_on: host
    window: 2h
  - name: Scheduled task or service creation pointing at user-writable paths
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]|[Ss][Cc]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*/[Cc][Rr][Ee][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee].*/) AND (data_win_eventdata_commandLine:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc].*/)
    pivot_on: host
    window: 2h
  - name: Network connections from user-writable paths
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Uu][Ss][Ee][Rr][Ss]|[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]|[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]|[Aa][Pp][Pp][Dd][Aa][Tt][Aa]|[Pp][Uu][Bb][Ll][Ii][Cc]|[Tt][Ee][Mm][Pp])\\.*/
    pivot_on: host
    window: 1h
  - name: Security tooling tampering on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Aa][Dd][Dd]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee][Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt][Ss][Hh].*[Aa][Dd][Vv][Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll].*[Oo][Ff][Ff].*/)
    pivot_on: host
    window: 2h
