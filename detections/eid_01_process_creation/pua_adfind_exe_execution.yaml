name: PUA - AdFind.EXE Execution
id: 514e7e3e-b3b4-4a67-af60-be20f139198b
version: 1
schema_version: "1.0"
date: "2025-02-26"
author: Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 514e7e3e-b3b4-4a67-af60-be20f139198b
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of Adfind.exe utility, which can be used for reconnaissance
  in an Active Directory environment. MITRE ATT&CK: T1087.002.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\AdFind.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "AdFind.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=d144de8117df2beceaba2201ad304764*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=12ce1c0f3f5837ecc18a3782408fa975*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=bca5675746d13a1f246e2da3c2217492*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=4fbf3f084fbbb2470b80b2013134df35*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=49b639b4acbecc49d72a01f357aa4930*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=53e117a96057eaf19c41380d0e87f1c2*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=680dad9e300346e05a85023965867201*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=21aa085d54992511b9f115355e468782*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_hashes
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\AdFind.exe'; data_win_eventdata_originalFileName equals 'AdFind.exe';
  data_win_eventdata_hashes matches
  '*IMPHASH=d144de8117df2beceaba2201ad304764*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.joeware.net/freetools/tools/adfind/
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1087.002/T1087.002.md
  - https://attack.mitre.org/techniques/T1087/002/

response:
  message: >
    PUA - AdFind.EXE Execution detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1087.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1087.002
  custom_tags:
    - adfind
    - process_creation
    - sysmon
    - discovery
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Aa][Dd][Ff][Ii][Nn][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Aa][Dd][Ff][Ii][Nn][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=[Dd]144[Dd][Ee]8117[Dd][Ff]2[Bb][Ee][Cc][Ee][Aa][Bb][Aa]2201[Aa][Dd]304764.*/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=12[Cc][Ee]1[Cc]0[Ff]3[Ff]5837[Ee][Cc][Cc]18[Aa]3782408[Ff][Aa]975.*/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=[Bb][Cc][Aa]5675746[Dd]13[Aa]1[Ff]246[Ee]2[Dd][Aa]3[Cc]2217492.*/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=4[Ff][Bb][Ff]3[Ff]084[Ff][Bb][Bb][Bb]2470[Bb]80[Bb]2013134[Dd][Ff]35.*/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=49[Bb]639[Bb]4[Aa][Cc][Bb][Ee][Cc][Cc]49[Dd]72[Aa]01[Ff]357[Aa][Aa]4930.*/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=53[Ee]117[Aa]96057[Ee][Aa][Ff]19[Cc]41380[Dd]0[Ee]87[Ff]1[Cc]2.*/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=680[Dd][Aa][Dd]9[Ee]300346[Ee]05[Aa]85023965867201.*/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=21[Aa][Aa]085[Dd]54992511[Bb]9[Ff]115355[Ee]468782.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 9a132afa-654e-11eb-ae93-0242ac130002
    name: PUA - AdFind Suspicious Execution
    reason: Same tool with enumeration flags (domainlist, trustdmp); shows which recon was run.
  - id: 455b9d50-15a1-4b99-853f-8d37655a4c1b
    name: PUA - Suspicious ActiveDirectory Enumeration Via AdFind.EXE
    reason: Specific AD object enumeration commands from the same binary.
  - id: df55196f-f105-44d3-a675-e9dfb6cc2f2b
    name: Renamed AdFind Execution
    reason: Same tool renamed to evade filename matches; repeat runs on the host.
  - id: c3e05466-5f22-11eb-ae93-0242ac130002
    name: NLTest Domain Trust Discovery
    reason: Companion trust discovery usually done with AdFind in ransomware recon.
  - id: 41243735-89a7-4c83-bcdd-570aa78f00a1
    name: Domain Controller Discovery with Nltest
    reason: DC discovery paired with AdFind recon.
  - id: dd04b29a-beed-11eb-87bc-acde48001122
    name: Detect SharpHound Usage
    reason: Next-stage AD graph collection often follows AdFind.
  - id: cc316032-924a-11eb-91a2-acde48001122
    name: DSQuery Domain Discovery
    reason: Native-tool AD discovery used in the same recon phase.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Native AD and network discovery commands
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(nltest.*(dclist|domain_trusts)|net1? +(group|user).*domain|dsquery|whoami +.(all|groups)|Get-AD[A-Za-z]+).*/
    pivot_on: host
    window: 6h
  - name: AdFind output files and archives
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*(ad_(users|computers|groups|ous)|adfind|trustdmp|domainlist).*\.(txt|csv|zip|7z)/
    pivot_on: host
    window: 6h
  - name: Archiving or staging of recon output
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(7z|rar|Compress-Archive).*(\.txt|\.csv).*/
    pivot_on: host
    window: 6h
  - name: LDAP traffic to domain controllers
    query: data_win_system_eventID:3 AND data_win_eventdata_destinationPort:(389 OR 636 OR 3268 OR 3269)
    pivot_on: host
    window: 2h
  - name: Follow-on lateral movement tooling
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(psexec|wmic.*node|Invoke-Command|sharphound|bloodhound|rubeus).*/
    pivot_on: host
    window: 24h
