  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Aa][Dd][Ff][Ii][Nn][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Aa][Dd][Ff][Ii][Nn][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=[Dd]144[Dd][Ee]8117[Dd][Ff]2[Bb][Ee][Cc][Ee][Aa][Bb][Aa]2201[Aa][Dd]304764.*/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=12[Cc][Ee]1[Cc]0[Ff]3[Ff]5837[Ee][Cc][Cc]18[Aa]3782408[Ff][Aa]975.*/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=[Bb][Cc][Aa]5675746[Dd]13[Aa]1[Ff]246[Ee]2[Dd][Aa]3[Cc]2217492.*/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=4[Ff][Bb][Ff]3[Ff]084[Ff][Bb][Bb][Bb]2470[Bb]80[Bb]2013134[Dd][Ff]35.*/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=49[Bb]639[Bb]4[Aa][Cc][Bb][Ee][Cc][Cc]49[Dd]72[Aa]01[Ff]357[Aa][Aa]4930.*/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=53[Ee]117[Aa]96057[Ee][Aa][Ff]19[Cc]41380[Dd]0[Ee]87[Ff]1[Cc]2.*/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=680[Dd][Aa][Dd]9[Ee]300346[Ee]05[Aa]85023965867201.*/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=21[Aa][Aa]085[Dd]54992511[Bb]9[Ff]115355[Ee]468782.*/)

