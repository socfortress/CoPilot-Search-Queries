name: Remote Access Tool - Simple Help Execution
id: 95e60a2b-4705-444b-b7da-ba0ea81a3ee2
version: 1
schema_version: "1.0"
date: "2024-02-23"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 95e60a2b-4705-444b-b7da-ba0ea81a3ee2
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  An adversary may use legitimate desktop support and remote access software,
  such as Team Viewer, Go2Assist, LogMein, AmmyyAdmin, etc, to establish an
  interactive command and control channel to target systems within networks.
  These services are commonly used as legitimate technical support software, and
  may be allowed by application control within a target environment. Remote
  access tools like VNC, Ammyy, and Teamviewer are used frequently when compared
  with other legitimate software commonly used by adversaries. (Citation:
  Symantec Living off the Land). MITRE ATT&CK: T1219.002.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\JWrapper-Remote Access\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\JWrapper-Remote Support\\\\*"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\SimpleService.exe"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\JWrapper-Remote Access\*'; data_win_eventdata_image matches
  '*\JWrapper-Remote Support\*'; data_win_eventdata_image matches
  '*\SimpleService.exe'.

known_false_positives: >
  Legitimate usage of the tool. Baseline expected activity in your environment
  and tune this detection before relying on it for automated response.

references:
  - https://www.huntress.com/blog/slashandgrab-screen-connect-post-exploitation-in-the-wild-cve-2024-1709-cve-2024-1708
  - https://attack.mitre.org/techniques/T1219/002/

response:
  message: >
    Remote Access Tool - Simple Help Execution detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1219.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1219.002
  custom_tags:
    - simple
    - process_creation
    - sysmon
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Jj][Ww][Rr][Aa][Pp][Pp][Ee][Rr]-[Rr][Ee][Mm][Oo][Tt][Ee] [Aa][Cc][Cc][Ee][Ss][Ss]\\.*/ OR data_win_eventdata_image:/.*\\[Jj][Ww][Rr][Aa][Pp][Pp][Ee][Rr]-[Rr][Ee][Mm][Oo][Tt][Ee] [Ss][Uu][Pp][Pp][Oo][Rr][Tt]\\.*/) AND data_win_eventdata_image:/.*\\[Ss][Ii][Mm][Pp][Ll][Ee][Ss][Ee][Rr][Vv][Ii][Cc][Ee]\.[Ee][Xx][Ee]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 57bff678-25d1-4d6c-8211-8ca106d12053
    name: Remote Access Tool - ScreenConnect Execution
    reason: Attackers deploy multiple RMM tools; ScreenConnect beside SimpleHelp suggests redundancy
  - id: b52e84a3-029e-4529-b09b-71d19dd27e94
    name: Remote Access Tool - AnyDesk Execution
    reason: Co-deployed second remote access tool
  - id: 758ff488-18d5-4cbe-8ec4-02b6285a434f
    name: Remote Access Tool - NetSupport Execution
    reason: Co-deployed second remote access tool
  - id: ccad96d7-a48c-4f13-8b9c-9f6a31cba454
    name: Detect Remote Access Software Usage FileInfo
    reason: Product-metadata detection of other remote access software on the same host
  - id: 79a87aa6-e4bd-42fc-a5bb-5e6fbdcd62f5
    name: Msiexec Quiet Installation
    reason: Silent installation of the agent package
  - id: d4ca7c59-e9e4-42d8-bf57-91a776efcb87
    name: LOLBIN Execution From Abnormal Drive
    reason: Delivered tooling often runs from unusual drives or locations
  - id: e32d4572-9826-4738-b651-95fa63747e8a
    name: Base64 Encoded PowerShell Command Detected
    reason: Payload execution via the remote session
  - id: 32e0baea-b3f1-11eb-a2ce-acde48001122
    name: Detect RClone Command-Line Usage
    reason: SimpleHelp abuse has preceded rclone exfiltration and ransomware
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: SimpleHelp / JWrapper processes
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*(JWrapper|SimpleService|SimpleGatewayService).*/ OR data_win_eventdata_commandLine:/.*JWrapper.*/)
    pivot_on: host
    window: 24h
  - name: Shell children of SimpleHelp
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*(JWrapper|SimpleService).*/ AND data_win_eventdata_image:/.*(cmd|powershell|pwsh)\.exe/
    pivot_on: host
    window: 4h
  - name: Exfil tooling
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*([Rr]clone|[Mm]egasync|[Ww]inscp|[Pp]scp).*/ OR data_win_eventdata_image:/.*(rclone|MEGAsync)\.exe/)
    pivot_on: host
    window: 24h
  - name: Recovery inhibition
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*(vssadmin.*delete|wbadmin.*delete|bcdedit.*(recoveryenabled|ignoreallfailures)|wmic.*shadowcopy.*delete).*/
    pivot_on: host
    window: 24h
  - name: Discovery commands
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(whoami|nltest|net1?|quser|systeminfo)\.exe/
    pivot_on: host
    window: 2h
