name: PUA - Advanced IP Scanner Execution
id: bef37fa2-f205-4a7b-b484-0759bfd5f86f
version: 1
schema_version: "1.0"
date: "2023-02-07"
author: Nasreddine Bencherchali (Nextron Systems), @ROxPinTeddy
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: bef37fa2-f205-4a7b-b484-0759bfd5f86f
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the use of Advanced IP Scanner. Seems to be a popular tool for
  ransomware groups. MITRE ATT&CK: T1046, T1135.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\advanced_ip_scanner*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_originalFileName:
                    value: "*advanced_ip_scanner*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_description:
                    value: "*Advanced IP Scanner*"
                    case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*/portable*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*/lng*"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_description
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\advanced_ip_scanner*'; data_win_eventdata_originalFileName matches
  '*advanced_ip_scanner*'; data_win_eventdata_description matches '*Advanced IP
  Scanner*', among other conditions.

known_false_positives: >
  Legitimate administrative use. Baseline expected activity in your environment
  and tune this detection before relying on it for automated response.

references:
  - https://news.sophos.com/en-us/2019/12/09/snatch-ransomware-reboots-pcs-into-safe-mode-to-bypass-protection/
  - https://www.fireeye.com/blog/threat-research/2020/05/tactics-techniques-procedures-associated-with-maze-ransomware-incidents.html
  - https://labs.f-secure.com/blog/prelude-to-ransomware-systembc
  - https://assets.documentcloud.org/documents/20444693/fbi-pin-egregor-ransomware-bc-01062021.pdf
  - https://thedfirreport.com/2021/01/18/all-that-for-a-coinminer
  - https://github.com/3CORESec/MAL-CL/tree/master/Descriptors/Other/Advanced%20IP%20Scanner
  - https://attack.mitre.org/techniques/T1046/
  - https://attack.mitre.org/techniques/T1135/

response:
  message: >
    PUA - Advanced IP Scanner Execution detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1046, T1135
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1046
    - T1135
  custom_tags:
    - advanced
    - scanner
    - process_creation
    - sysmon
    - discovery
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Aa][Dd][Vv][Aa][Nn][Cc][Ee][Dd]_[Ii][Pp]_[Ss][Cc][Aa][Nn][Nn][Ee][Rr].*/ OR data_win_eventdata_originalFileName:/.*[Aa][Dd][Vv][Aa][Nn][Cc][Ee][Dd]_[Ii][Pp]_[Ss][Cc][Aa][Nn][Nn][Ee][Rr].*/ OR data_win_eventdata_description:/.*[Aa][Dd][Vv][Aa][Nn][Cc][Ee][Dd] [Ii][Pp] [Ss][Cc][Aa][Nn][Nn][Ee][Rr].*/ OR (data_win_eventdata_commandLine:/.*\/[Pp][Oo][Rr][Tt][Aa][Bb][Ll][Ee].*/ AND data_win_eventdata_commandLine:/.*\/[Ll][Nn][Gg].*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 54773c5f-f1cc-4703-9126-2f797d96a69d
    name: PUA - Advanced Port Scanner Execution
    reason: Same vendor toolkit; ransomware affiliates run the IP scanner and port scanner back to back to map live hosts and open services.
  - id: ca387a8e-1c84-4da3-9993-028b45342d30
    name: PUA - SoftPerfect Netscan Execution
    reason: Alternative network scanner for the same host/share discovery; a second scanner shows broad recon.
  - id: f376c8a7-a2d0-4ddc-aa0c-16c17236d962
    name: HackTool - Bloodhound/Sharphound Execution
    reason: AD attack-path mapping usually accompanies network scanning in pre-ransomware discovery.
  - id: 514e7e3e-b3b4-4a67-af60-be20f139198b
    name: PUA - AdFind.EXE Execution
    reason: AdFind AD enumeration is the standard companion to IP scanning in ransomware playbooks.
  - id: 730fc21b-eaff-474b-ad23-90fd265d4988
    name: Psexec Execution
    reason: Scan results (live hosts, admin shares) are followed by PsExec lateral movement to those targets.
  - id: e37db05d-d1f9-49c8-b464-cee1a4b11638
    name: PUA - Rclone Execution
    reason: Discovered file shares are staged and exfiltrated with Rclone before encryption.
  - id: c9fbe8e9-119d-40a6-9b59-dd58a5d84429
    name: Potential Ransomware or Unauthorized MBR Tampering Via Bcdedit.EXE
    reason: Late-stage ransomware impact that follows scanning and lateral movement.
  - id: 1321dc4e-a1fe-481d-a016-52c45f0c8b4f
    name: Windows Defender Exclusions Added
    reason: Operators exclude the scanner or later payloads from AV while preparing the host.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other network scanners and discovery tools
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*[Ss]oft[Pp]erfect.*/ OR data_win_eventdata_image:/.*[Nn]etscan.*/ OR data_win_eventdata_image:/.*[Aa]dvanced_port_scanner.*/ OR data_win_eventdata_image:/.*[Nn]map.*/ OR data_win_eventdata_image:/.*[Mm]asscan.*/)
    pivot_on: host
    window: 6h
  - name: Built-in network and share discovery commands
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*net1? +(view|share|use).*/ OR data_win_eventdata_commandLine:/.*arp +-a.*/ OR data_win_eventdata_commandLine:/.*nltest.*(dclist|domain_trusts).*/ OR data_win_eventdata_commandLine:/.*nslookup.*/)
    pivot_on: host
    window: 4h
  - name: Remote execution tooling on the host
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*[Pp]s[Ee]xec.*/ OR data_win_eventdata_commandLine:/.*[Pp]s[Ee]xec.*/ OR data_win_eventdata_commandLine:/.*wmic.*\/node.*/ OR data_win_eventdata_image:/.*[Cc]s[Ee]xec.*/)
    pivot_on: host
    window: 6h
  - name: Scanner launched from archive or browser parent
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*(7z|[Ww]in[Rr][Aa][Rr]|[Cc]hrome|[Ee]dge|[Ff]irefox|[Pp]ower[Ss]hell|cmd)\.exe/ AND (data_win_eventdata_commandLine:/.*\/portable.*/ OR data_win_eventdata_commandLine:/.*[Aa]dvanced_ip_scanner.*/)
    pivot_on: host
    window: 2h
  - name: Exfiltration tooling on the host
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*[Rr]clone.*/ OR data_win_eventdata_commandLine:/.*[Mm]ega[Cc]md.*/ OR data_win_eventdata_commandLine:/.*[Ww]in[Ss][Cc][Pp].*/)
    pivot_on: host
    window: 24h
