name: Windows Modify System Firewall with Notable Process Path
id: windows-modify-firewall-notable-process-path-001
version: 1
schema_version: "1.0"
date: "2026-02-27"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects firewall rule modifications that allow execution of applications 
  from suspicious file paths such as \windows\temp, \users\public, 
  \windows\fonts, Recycle.bin, and \PerfLogs. NjRAT and Medusa ransomware 
  add firewall exceptions for malware in these locations.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - wildcard:
            data_win_eventdata_commandLine: "*firewall*"
        - wildcard:
            data_win_eventdata_commandLine: "*allow*"
        - wildcard:
            data_win_eventdata_commandLine: "*add*"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine: "*\\windows\\temp\\*"
              - wildcard:
                  data_win_eventdata_commandLine: "*\\users\\public\\*"
              - wildcard:
                  data_win_eventdata_commandLine: "*\\windows\\fonts\\*"
              - wildcard:
                  data_win_eventdata_commandLine: "*\\windows\\debug\\*"
              - wildcard:
                  data_win_eventdata_commandLine: "*Recycle.bin*"
              - wildcard:
                  data_win_eventdata_commandLine: "*\\PerfLogs\\*"
              - wildcard:
                  data_win_eventdata_commandLine: "*\\temp\\*"
              - wildcard:
                  data_win_eventdata_commandLine: "*\\Users\\Default\\*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    type: string
    required: true
  CUSTOMER_CODE:
    type: string
    required: true
  START_TIME:
    type: datetime
    default: "now-24h"
  END_TIME:
    type: datetime
    default: "now"

how_to_implement: >
  Requires Sysmon EventID 1 with full command-line logging.

known_false_positives: >
  Administrators may add firewall rules for applications in temp paths.

references:
  - https://www.splunk.com/en_us/blog/security/more-than-just-a-rat-unveiling-njrat-s-mbr-wiping-capabilities.html

response:
  message: >
    Firewall rule allowing suspicious path on $agent_name$. 
    Command: $data_win_eventdata_commandLine$. 
    Process: $data_win_eventdata_image$. MITRE ATT&CK: T1562.004
  risk_score: 64
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 64

tags:
  analytic_story:
    - Medusa Ransomware
    - NjRAT
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1562.004
  custom_tags:
    - firewall_modification
    - notable_paths
    - defense_evasion
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*firewall.*/ AND data_win_eventdata_commandLine:/.*allow.*/ AND data_win_eventdata_commandLine:/.*add.*/ AND (data_win_eventdata_commandLine:/.*windows.*temp.*/ OR data_win_eventdata_commandLine:/.*users.*public.*/ OR data_win_eventdata_commandLine:/.*windows.*fonts.*/ OR data_win_eventdata_commandLine:/.*windows.*debug.*/ OR data_win_eventdata_commandLine:/.*Recycle\.bin.*/ OR data_win_eventdata_commandLine:/.*PerfLogs.*/ OR data_win_eventdata_commandLine:/.*temp.*/ OR data_win_eventdata_commandLine:/.*Users.*Default.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: cd5cfd80-aa5f-44c0-9c20-108c4ae12e3c
    name: New Firewall Rule Added Via Netsh.EXE
    reason: Generic form of the same firewall rule addition.
  - id: 9a8f63a8-43ac-11ec-904c-acde48001122
    name: Firewall Allowed Program Enable
    reason: Allowed-program firewall exceptions, same malware technique.
  - id: a70dcb37-3bee-453a-99df-d0c683151be6
    name: Firewall Rule Update Via Netsh.EXE
    reason: Rules modified after creation, often to widen malware access.
  - id: 57c4bf16-227f-4394-8ec7-1b745ee061c3
    name: Firewall Disabled via Netsh.EXE
    reason: 'Escalated variant: firewall disabled entirely by same actor.'
  - id: 69bd9b97-2be2-41b6-9816-fb08757a4d1a
    name: Potentially Suspicious Execution From Parent Process In Public Folder
    reason: The allowed binary in a public/temp path is usually executed from there.
  - id: 1321dc4e-a1fe-481d-a016-52c45f0c8b4f
    name: Windows Defender Exclusions Added
    reason: Defense evasion commonly paired with firewall exceptions for the same payload.
  - id: 24357373-078f-44ed-9ac4-6d334a668a11
    name: Direct Autorun Keys Modification
    reason: NjRAT-style persistence follows firewall exception for the payload.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Execution from the whitelisted paths
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:*\\Users\\Public\\* OR data_win_eventdata_image:*\\Windows\\Temp\\* OR data_win_eventdata_image:*\\PerfLogs\\* OR data_win_eventdata_image:*\\Windows\\Fonts\\* OR data_win_eventdata_image:*\\Recycle.bin\\*)
    pivot_on: host
    window: 6h
  - name: Executables dropped in suspicious directories
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:*\\Users\\Public\\*.exe OR data_win_eventdata_targetFilename:*\\Windows\\Temp\\*.exe OR data_win_eventdata_targetFilename:*\\PerfLogs\\*.exe OR data_win_eventdata_targetFilename:*\\Windows\\Fonts\\*.exe)
    pivot_on: host
    window: 6h
  - name: Outbound connections from those paths
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:*\\Users\\Public\\* OR data_win_eventdata_image:*\\Windows\\Temp\\* OR data_win_eventdata_image:*\\PerfLogs\\* OR data_win_eventdata_image:*\\Windows\\Fonts\\*)
    pivot_on: host
    window: 6h
  - name: Run key persistence
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND data_win_eventdata_targetObject:*\\CurrentVersion\\Run*
    pivot_on: host
    window: 6h
  - name: Ransomware precursors
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*[Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Bb][Cc][Dd][Ee][Dd][Ii][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ww][Bb][Aa][Dd][Mm][Ii][Nn].*[Dd][Ee][Ll][Ee][Tt][Ee].*/)
    pivot_on: host
    window: 6h
