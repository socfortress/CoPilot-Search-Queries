name: Potential Commandline Obfuscation Using Escape Characters
id: f0cdd048-82dc-4f7a-8a7a-b87a52b6d0fd
version: 1
schema_version: "1.0"
date: "2023-03-03"
author: juju4
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: f0cdd048-82dc-4f7a-8a7a-b87a52b6d0fd
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential commandline obfuscation using known escape characters. MITRE
  ATT&CK: T1140.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*h^t^t^p*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*h\"t\"t\"p*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*h^t^t^p*'; data_win_eventdata_commandLine matches '*h"t"t"p*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/vysecurity/status/885545634958385153
  - https://twitter.com/Hexacorn/status/885553465417756673
  - https://twitter.com/Hexacorn/status/885570278637678592
  - https://www.mandiant.com/resources/blog/obfuscation-wild-targeted-attackers-lead-way-evasion-techniques
  - https://web.archive.org/web/20190213114956/http://www.windowsinspired.com/understanding-the-command-line-string-and-arguments-received-by-a-windows-program/
  - https://attack.mitre.org/techniques/T1140/

response:
  message: >
    Potential Commandline Obfuscation Using Escape Characters detected on host
    $agent_name$. Matched data_win_eventdata_commandLine:
    $data_win_eventdata_commandLine$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1140
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1140
  custom_tags:
    - obfuscation
    - escape
    - characters
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Hh]\^[Tt]\^[Tt]\^[Pp].*/ OR data_win_eventdata_commandLine:/.*[Hh]\"[Tt]\"[Tt]\"[Pp].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a16980c2-0c56-4de0-9a79-17971979efdd
    name: Cmd.EXE Missing Space Characters Execution Anomaly
    reason: Cmd obfuscation (missing spaces) from the same family of cmd-level obfuscation.
  - id: 584bca0f-3608-4402-80fd-4075ff6072e3
    name: Potential CommandLine Obfuscation Using Unicode Characters From Suspicious Image
    reason: 'Unicode lookalike obfuscation: sibling command-line hiding technique.'
  - id: d7bcd677-645d-4691-a8d4-7a5602b780d1
    name: Potential PowerShell Command Line Obfuscation
    reason: PowerShell obfuscation frequently chained after cmd-level escape obfuscation.
  - id: 21dd6d38-2b18-4453-9404-a0fe4a0cc288
    name: Curl Download And Execute Combination
    reason: Curl download-and-execute is what an obfuscated h^t^t^p URL typically hides.
  - id: d059842b-6b9d-4ed1-b5c3-5b89143c6ede
    name: File Download Via Bitsadmin
    reason: 'Bitsadmin download: another fetcher hiding a URL via escaping.'
  - id: cc9cbe82-7bc0-4ef5-bc23-bbfb83947be7
    name: File Decoded From Base64/Hex Via Certutil.EXE
    reason: Certutil decode follows download of staged payloads.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Caret/quote-escaped commands in other launches
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*\^.*/ OR /.*\".\".\".*/) AND data_win_eventdata_image:(/.*[Cc]md\.exe/ OR /.*[Pp]ower[Ss]hell.*/)
    pivot_on: host
    window: 2h
  - name: Download utilities invoked
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Cc]url.*/ OR /.*[Bb]itsadmin.*/ OR /.*[Cc]ertutil.*[Uu]rlcache.*/ OR /.*[Ii]nvoke-[Ww]eb[Rr]equest.*/ OR /.*[Dd]ownload[Ss]tring.*/)
    pivot_on: host
    window: 2h
  - name: Network connections from cmd/powershell/curl
    query: data_win_system_eventID:3 AND data_win_eventdata_image:(/.*[Cc]md\.exe/ OR /.*[Pp]ower[Ss]hell.*/ OR /.*[Cc]url\.exe/ OR /.*[Bb]itsadmin\.exe/ OR /.*[Cc]ertutil\.exe/) AND data_win_eventdata_initiated:true
    pivot_on: host
    window: 2h
  - name: New executables written to user-writable paths
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(/.*\\Temp\\.*\.(exe|dll|bat|ps1)/ OR /.*\\Users\\Public\\.*/ OR /.*\\ProgramData\\.*\.(exe|dll)/)
    pivot_on: host
    window: 2h
