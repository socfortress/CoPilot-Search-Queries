name: Windows InstallUtil URL in Command Line
id: windows-installutil-url-commandline-001
version: 1
schema_version: "1.0"
date: "2026-02-23"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects InstallUtil.exe with HTTP/HTTPS URL in command line, indicating 
  remote payload download and execution. InstallUtil is not typically used 
  for remote file retrieval, making this highly suspicious LOLBIN abuse.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - wildcard:
            data_win_eventdata_image: "*\\\\InstallUtil.exe"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine: "*http://*"
              - wildcard:
                  data_win_eventdata_commandLine: "*https://*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-23 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-23 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Windows endpoints with Sysmon 
  installed and configured to log process creation events (EventID 1) with full 
  command-line arguments.

known_false_positives: >
  InstallUtil is not typically used for remote downloads. Very few false 
  positives expected.

references:
  - https://attack.mitre.org/techniques/T1218/004/
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1218.004/T1218.004.md

response:
  message: >
    InstallUtil.exe with URL on $agent_name$. 
    Command: $data_win_eventdata_commandLine$. 
    User: $data_win_eventdata_user$. 
    Remote payload execution. MITRE ATT&CK: T1218.004
  risk_score: 80
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 80
  threat_objects: []

tags:
  analytic_story:
    - Living Off The Land
    - Signed Binary Proxy Execution InstallUtil
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1218.004
  custom_tags:
    - installutil
    - url_download
    - lolbin
    - remote_payload
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*InstallUtil\.exe/ AND (data_win_eventdata_commandLine:/.*http:\/\/.*/ OR data_win_eventdata_commandLine:/.*https:\/\/.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 4fbf9270-43da-11ec-9486-acde48001122
    name: Windows InstallUtil Remote Network Connection
    reason: Near-identical logic; the pair corroborates remote payload retrieval through InstallUtil.
  - id: 75edd216-1939-4c73-8d61-7f3a0d85b5cc
    name: File Download Via InstallUtil.EXE
    reason: Download behaviour of InstallUtil is the direct consequence of a URL argument.
  - id: windows-installutil-non-standard-path-001
    name: Windows InstallUtil in Non Standard Path
    reason: Relocated InstallUtil copies are commonly used with remote payloads.
  - id: d042284c-a296-4988-9be5-f424fadcc28c
    name: Suspicious Execution of InstallUtil Without Log
    reason: Quiet-logging flags are commonly combined with remote assembly execution.
  - id: cfa7b9ac-43f0-11ec-9b48-acde48001122
    name: Windows InstallUtil Uninstall Option
    reason: /u runs the assembly's Uninstall routine, the common trigger for the downloaded payload.
  - id: 1412aa78-a24c-4abd-83df-767dfb2c5bbe
    name: Potentially Suspicious WebDAV LNK Execution
    reason: Remote payload delivery via a WebDAV shortcut is a common upstream initial-access path for LOLBin chains.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: InstallUtil outbound network connections
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*[Ii]nstall[Uu]til.*/
    pivot_on: host
    window: 1h
  - name: DNS lookups made by InstallUtil
    query: data_win_system_eventID:22 AND data_win_eventdata_image:/.*[Ii]nstall[Uu]til.*/
    pivot_on: host
    window: 1h
  - name: Child processes spawned by InstallUtil
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Ii]nstall[Uu]til.*/
    pivot_on: host
    window: 2h
  - name: Files written by InstallUtil (payload staging)
    query: data_win_system_eventID:11 AND data_win_eventdata_image:/.*[Ii]nstall[Uu]til.*/
    pivot_on: host
    window: 2h
  - name: Downloader LOLBins used alongside InstallUtil
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*[Cc]ertutil.*urlcache.*/ OR data_win_eventdata_commandLine:/.*[Bb]itsadmin.*transfer.*/ OR data_win_eventdata_commandLine:/.*[Ii]nvoke-[Ww]eb[Rr]equest.*/ OR data_win_eventdata_commandLine:/.*[Cc]url.*http.*/)
    pivot_on: host
    window: 4h
