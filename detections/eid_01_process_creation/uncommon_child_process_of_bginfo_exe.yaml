name: Uncommon Child Process Of BgInfo.EXE
id: aaf46cdc-934e-4284-b329-34aa701e3771
version: 1
schema_version: "1.0"
date: "2023-08-16"
author: Nasreddine Bencherchali (Nextron Systems), Beyu Denis, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: aaf46cdc-934e-4284-b329-34aa701e3771
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects uncommon child processes of "BgInfo.exe" which could be a sign of
  potential abuse of the binary to proxy execution via external VBScript. MITRE
  ATT&CK: T1059.005, T1218, T1202.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\bginfo.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\bginfo64.exe"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\bginfo.exe'; data_win_eventdata_parentImage matches '*\bginfo64.exe'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://lolbas-project.github.io/lolbas/OtherMSBinaries/Bginfo/
  - https://oddvar.moe/2017/05/18/bypassing-application-whitelisting-with-bginfo/
  - https://attack.mitre.org/techniques/T1059/005/
  - https://attack.mitre.org/techniques/T1218/
  - https://attack.mitre.org/techniques/T1202/

response:
  message: >
    Uncommon Child Process Of BgInfo.EXE detected on host $agent_name$. Matched
    data_win_eventdata_parentImage: $data_win_eventdata_parentImage$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1059.005, T1218, T1202
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.005
    - T1218
    - T1202
  custom_tags:
    - uncommon
    - child
    - bginfo
    - process_creation
    - sysmon
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Bb][Gg][Ii][Nn][Ff][Oo]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Bb][Gg][Ii][Nn][Ff][Oo]64\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 811f459f-9231-45d4-959a-0266c6311987
    name: Suspicious Child Process Of BgInfo.EXE
    reason: 'Higher-fidelity sibling: bginfo spawning shells/scripts confirms the VBScript proxy execution.'
  - id: 992dd79f-dde8-4bb0-9085-6350ba97cfb3
    name: New BgInfo.EXE Custom VBScript Registry Configuration
    reason: 'Precursor: BgInfo settings in the registry set to run a custom VBScript is how the child gets spawned.'
  - id: cd277474-5c52-4423-a52b-ac2d7969902f
    name: New BgInfo.EXE Custom WMI Query Registry Configuration
    reason: Alternate BgInfo abuse via the WMI query field; same technique family.
  - id: 53330955-dc52-487f-a3a2-da24dcff99b5
    name: New BgInfo.EXE Custom DB Path Registry Configuration
    reason: BgInfo DB path pointed at an attacker-controlled location, a staging step for the same abuse.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: BgInfo executions and config files
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Bb]g[Ii]nfo(64)?\.exe/
    pivot_on: host
    window: 2h
  - name: BgInfo registry configuration changes
    query: data_win_system_eventID:(12 OR 13 OR 14) AND data_win_eventdata_targetObject:/.*[Bb]g[Ii]nfo.*/
    pivot_on: host
    window: 4h
  - name: bgi or vbs files created
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(/.*\.[Bb][Gg][Ii]/ OR /.*\.[Vv][Bb][Ss]/)
    pivot_on: host
    window: 4h
  - name: Children of wscript and cscript
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:(/.*\\[Ww]script\.exe/ OR /.*\\[Cc]script\.exe/)
    pivot_on: host
    window: 1h
