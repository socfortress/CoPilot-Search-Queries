name: PUA - RunXCmd Execution
id: 93199800-b52a-4dec-b762-75212c196542
version: 1
schema_version: "1.0"
date: "2023-02-14"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 93199800-b52a-4dec-b762-75212c196542
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the use of the RunXCmd tool to execute commands with System or
  TrustedInstaller accounts. MITRE ATT&CK: T1569.002.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /account=system *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /account=ti *"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*/exec=*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches '*
  /account=system *'; data_win_eventdata_commandLine matches '* /account=ti *';
  data_win_eventdata_commandLine matches '*/exec=*'.

known_false_positives: >
  Legitimate use by administrators. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://www.d7xtech.com/free-software/runx/
  - https://www.winhelponline.com/blog/run-program-as-system-localsystem-account-windows/
  - https://attack.mitre.org/techniques/T1569/002/

response:
  message: >
    PUA - RunXCmd Execution detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1569.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1569.002
  custom_tags:
    - runxcmd
    - process_creation
    - sysmon
    - execution
    - s0029
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.* \/[Aa][Cc][Cc][Oo][Uu][Nn][Tt]=[Ss][Yy][Ss][Tt][Ee][Mm] .*/ OR data_win_eventdata_commandLine:/.* \/[Aa][Cc][Cc][Oo][Uu][Nn][Tt]=[Tt][Ii] .*/) AND data_win_eventdata_commandLine:/.*\/[Ee][Xx][Ee][Cc]=.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 771d1eb5-9587-4568-95fb-9ec44153a012
    name: PUA - NSudo Execution
    reason: Sibling run-as-SYSTEM/TrustedInstaller tool; actors often try several to get privileged execution.
  - id: d2b749ee-4225-417e-b20e-a8d2193cbb84
    name: PUA - AdvancedRun Execution
    reason: Another tool for launching commands as SYSTEM/TI; co-occurs when an admin-level actor escalates.
  - id: fdfcbd78-48f1-4a4b-90ac-d82241e368c5
    name: PsExec Service Execution
    reason: PsExec -s is the classic alternative route to SYSTEM; both indicate privilege elevation from admin.
  - id: 7c0dcd3d-acf8-4f71-9570-f448b0034f94
    name: PsExec Service Child Process Execution as LOCAL SYSTEM
    reason: SYSTEM child processes from service-based execution mirror what RunXCmd produces.
  - id: 1321dc4e-a1fe-481d-a016-52c45f0c8b4f
    name: Windows Defender Exclusions Added
    reason: RunXCmd as TI is used to tamper with Defender protected settings; exclusions are the typical outcome.
  - id: b28e58e4-2a72-4fae-bdee-0fbe904db642
    name: Windows Defender Real-time Protection Disabled
    reason: TrustedInstaller/SYSTEM context lets attackers disable Defender, the usual next step.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Defender and security service tampering
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*[Ss]et-[Mm]p[Pp]reference.*/ OR data_win_eventdata_commandLine:/.*[Dd]isable[Rr]ealtime.*/ OR data_win_eventdata_commandLine:/.*[Ss]c(\.exe)? +(stop|config|delete).*(WinDefend|Sense|WdFilter|WdBoot).*/)
    pivot_on: host
    window: 4h
  - name: Service creation / driver install
    query: data_win_system_eventID:7045 OR (data_win_system_eventID:1 AND data_win_eventdata_image:/.*\\[Ss][Cc]\.exe/ AND data_win_eventdata_commandLine:/.*[Cc]reate.*/)
    pivot_on: host
    window: 4h
  - name: Shells spawned as SYSTEM or TrustedInstaller
    query: data_win_system_eventID:1 AND data_win_eventdata_user:/.*(SYSTEM|TrustedInstaller).*/ AND data_win_eventdata_image:/.*\\(cmd|powershell|pwsh|wscript|cscript|mshta)\.exe/
    pivot_on: host
    window: 4h
  - name: Ownership/ACL/registry tampering of protected resources
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*[Ii]cacls.*/ OR data_win_eventdata_commandLine:/.*[Tt]akeown.*/ OR data_win_eventdata_commandLine:/.*[Rr]eg(\.exe)? +(add|delete).*/)
    pivot_on: host
    window: 2h
  - name: Executable staging in user-writable paths
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*(\\Users\\Public\\|\\Temp\\|\\ProgramData\\).*\.(exe|dll|sys)/
    pivot_on: host
    window: 2h
