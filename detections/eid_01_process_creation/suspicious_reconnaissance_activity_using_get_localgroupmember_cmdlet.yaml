name: Suspicious Reconnaissance Activity Using Get-LocalGroupMember Cmdlet
id: c8a180d6-47a3-4345-a609-53f9c3d834fc
version: 1
schema_version: "1.0"
date: "2022-10-10"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: c8a180d6-47a3-4345-a609-53f9c3d834fc
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious reconnaissance command line activity on Windows systems
  using the PowerShell Get-LocalGroupMember Cmdlet. MITRE ATT&CK: T1087.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*Get-LocalGroupMember *"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*domain admins*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* administrator*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* administrateur*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*enterprise admins*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Exchange Trusted Subsystem*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Remote Desktop Users*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Utilisateurs du Bureau à distance*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Usuarios de escritorio remoto*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*Get-LocalGroupMember *'; data_win_eventdata_commandLine matches '*domain
  admins*'; data_win_eventdata_commandLine matches '* administrator*', among
  other conditions.

known_false_positives: >
  Administrative activity. Baseline expected activity in your environment and
  tune this detection before relying on it for automated response.

references:
  - https://www.absolomb.com/2018-01-26-Windows-Privilege-Escalation-Guide/
  - https://attack.mitre.org/techniques/T1087/001/

response:
  message: >
    Suspicious Reconnaissance Activity Using Get-LocalGroupMember Cmdlet
    detected on host $agent_name$. Matched data_win_eventdata_commandLine:
    $data_win_eventdata_commandLine$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1087.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1087.001
  custom_tags:
    - reconnaissance
    - localgroupmember
    - cmdlet
    - process_creation
    - sysmon
    - discovery
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Gg][Ee][Tt]-[Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp][Mm][Ee][Mm][Bb][Ee][Rr] .*/ AND (data_win_eventdata_commandLine:/.*[Dd][Oo][Mm][Aa][Ii][Nn] [Aa][Dd][Mm][Ii][Nn][Ss].*/ OR data_win_eventdata_commandLine:/.* [Aa][Dd][Mm][Ii][Nn][Ii][Ss][Tt][Rr][Aa][Tt][Oo][Rr].*/ OR data_win_eventdata_commandLine:/.* [Aa][Dd][Mm][Ii][Nn][Ii][Ss][Tt][Rr][Aa][Tt][Ee][Uu][Rr].*/ OR data_win_eventdata_commandLine:/.*[Ee][Nn][Tt][Ee][Rr][Pp][Rr][Ii][Ss][Ee] [Aa][Dd][Mm][Ii][Nn][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ee][Xx][Cc][Hh][Aa][Nn][Gg][Ee] [Tt][Rr][Uu][Ss][Tt][Ee][Dd] [Ss][Uu][Bb][Ss][Yy][Ss][Tt][Ee][Mm].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Mm][Oo][Tt][Ee] [Dd][Ee][Ss][Kk][Tt][Oo][Pp] [Uu][Ss][Ee][Rr][Ss].*/ OR data_win_eventdata_commandLine:/.*[Uu][Tt][Ii][Ll][Ii][Ss][Aa][Tt][Ee][Uu][Rr][Ss] [Dd][Uu] [Bb][Uu][Rr][Ee][Aa][Uu] [Àà] [Dd][Ii][Ss][Tt][Aa][Nn][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Uu][Ss][Uu][Aa][Rr][Ii][Oo][Ss] [Dd][Ee] [Ee][Ss][Cc][Rr][Ii][Tt][Oo][Rr][Ii][Oo] [Rr][Ee][Mm][Oo][Tt][Oo].*/)

