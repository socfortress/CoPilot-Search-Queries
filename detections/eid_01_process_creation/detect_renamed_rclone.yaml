name: Detect Renamed RClone
id: 6dca1124-b3ec-11eb-9328-acde48001122
version: 1
schema_version: "1.0"
date: "2026-04-21"
author: SOCFortress LLC
status: production
type: Hunting

description: >
  This analytic detects the execution of a renamed rclone.exe process, which is
  commonly used for data exfiltration to remote cloud destinations. Sysmon
  EventID 1 is used to match events where the PE OriginalFileName attribute
  equals "rclone.exe" while the actual process image filename is NOT rclone.exe.
  This indicates that the binary retains its original rclone metadata but has
  been renamed on disk to evade filename-based detection. This activity is
  significant because ransomware operators (DarkSide, Black Basta, Cactus,
  REvil/Sodinokibi, Hellcat, Storm-0501) and other extortion groups routinely
  use RClone to exfiltrate sensitive data to attacker-controlled cloud storage
  (Mega, pCloud, Backblaze, S3) as part of double-extortion campaigns. If
  confirmed malicious, this behavior could indicate an ongoing data exfiltration
  attempt, potentially leading to significant data loss, regulatory exposure,
  and further compromise of the affected systems. Immediate isolation of the
  endpoint and network traffic analysis are recommended.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - term:
            data_win_eventdata_originalFileName: "rclone.exe"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\rclone.exe"
              case_insensitive: true
  _source:
    - timestamp
    - agent_name
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_parentCommandLine
    - data_win_eventdata_user
    - data_win_eventdata_processId
    - data_win_eventdata_processGuid
    - data_win_eventdata_parentProcessId
    - data_win_eventdata_parentProcessGuid
    - data_win_eventdata_hashes
    - data_win_eventdata_integrityLevel
    - data_win_eventdata_product
    - data_win_eventdata_company
    - data_win_eventdata_currentDirectory

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-21 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-21 23:59:59.999"

how_to_implement: >
  This detection requires Sysmon EventID 1 (Process Creation) logs to be forwarded
  from Windows endpoints to Wazuh Indexer. Ensure Sysmon is deployed with a
  configuration that captures Image and OriginalFileName fields (SwiftOnSecurity
  or Olaf Hartong Sysmon modular config recommended). The OriginalFileName field
  is extracted from the PE version information and is central to this detection -
  official rclone.exe binaries always have OriginalFileName set to "rclone.exe"
  regardless of what the file is renamed to on disk. The Elasticsearch wildcard
  exclusion uses the case_insensitive option (OpenSearch 2.x / Elasticsearch
  7.10+) so RClone.exe, RCLONE.EXE, rclone.exe, etc. are all correctly
  recognized as the unrenamed binary and excluded. The equivalent Graylog regex
  uses character classes to achieve case-insensitivity since Graylog's Lucene
  (?i) inline flag is not reliably honored in all deployments.

known_false_positives: >
  False positives should be limited since this analytic specifically identifies
  renamed instances of rclone.exe. Some legitimate backup administrators,
  DevOps engineers, or IT staff may deploy rclone under non-standard filenames
  for legitimate cloud-sync automation. Filter or tune as needed based on
  endpoint role, parent process lineage, user context, or signing information.
  Consider allow-listing specific service accounts or hosts where renamed
  rclone is an approved tool.

references:
  - https://attack.mitre.org/techniques/T1020/
  - https://redcanary.com/blog/rclone-mega-extortion/
  - https://www.mandiant.com/resources/shining-a-light-on-darkside-ransomware-operations
  - https://thedfirreport.com/2021/03/29/sodinokibi-aka-revil-ransomware/
  - https://rclone.org/

response:
  message: >
    A renamed rclone binary was identified on endpoint $agent_name$ by user
    $data_win_eventdata_user$. The process $data_win_eventdata_image$ was
    spawned by $data_win_eventdata_parentImage$ but its PE OriginalFileName is
    "rclone.exe", indicating the binary is official rclone renamed to evade
    detection. Command line: $data_win_eventdata_commandLine$. This is a
    high-confidence indicator of data exfiltration preparation commonly used in
    ransomware double-extortion campaigns. Investigate immediately for outbound
    cloud traffic and large-volume file access.
  risk_score: 80
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 60
    - field: data_win_eventdata_user
      type: user
      score: 60
  threat_objects:
    - field: data_win_eventdata_image
      type: process_name
    - field: data_win_eventdata_originalFileName
      type: process_name
    - field: data_win_eventdata_commandLine
      type: command_line

tags:
  analytic_story:
    - DarkSide Ransomware
    - Ransomware
    - Black Basta Ransomware
    - Cactus Ransomware
    - Hellcat Ransomware
    - Storm-0501 Ransomware
    - Data Exfiltration
  asset_type: Endpoint
  mitre_attack_id:
    - T1020
  custom_tags:
    - rclone
    - renamed_binary
    - masquerading
    - data_exfiltration
    - cloud_exfiltration
    - ransomware
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_originalFileName:"rclone.exe" AND NOT data_win_eventdata_image:/.*[\\]+[Rr][Cc][Ll][Oo][Nn][Ee]\.exe/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 32e0baea-b3f1-11eb-a2ce-acde48001122
    name: Detect RClone Command-Line Usage
    reason: 'Same tool by its real name or flags: the renamed binary will carry the rclone copy/sync/--config arguments, and shows whether the attacker also ran it unrenamed.'
  - id: e37db05d-d1f9-49c8-b464-cee1a4b11638
    name: PUA - Rclone Execution
    reason: Sigma PUA rclone execution; independent confirmation of rclone use on the host via different image/argument patterns.
  - id: 4057291a-b8cf-11eb-95fe-acde48001122
    name: Detect Renamed 7-Zip
    reason: 'Renamed 7-Zip is the usual staging step: data is archived before rclone pushes it out.'
  - id: 1b7bfb2c-b8e6-11eb-99ac-acde48001122
    name: Detect Renamed WinRAR
    reason: Renamed WinRAR is the alternate staging tool in the same pre-exfiltration phase.
  - id: 9fbf5927-5261-4284-a71d-f681029ea574
    name: Compress Data and Lock With Password for Exfiltration With 7-ZIP
    reason: Password-protected 7-Zip archives are what operators stage and then sync to cloud storage with rclone.
  - id: 643bdcac-8b82-49f4-9fd9-25a90b929f3b
    name: Renamed MegaSync Execution
    reason: Renamed MegaSync is the sibling exfiltration client to the Mega/cloud destinations rclone targets.
  - id: 7d1aaf3d-4304-425c-b7c3-162055e0b3ab
    name: Potential Data Exfiltration Activity Via CommandLine Tools
    reason: Command-line exfiltration tooling used alongside or instead of rclone.
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: Double-extortion ransomware deletes shadow copies after exfiltration; confirms the impact stage following rclone.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Rclone-style transfer arguments from any binary
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*--[Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr][Ss].*/ OR data_win_eventdata_commandLine:/.*--[Mm][Uu][Ll][Tt][Ii]-[Tt][Hh][Rr][Ee][Aa][Dd]-[Ss][Tt][Rr][Ee][Aa][Mm][Ss].*/ OR data_win_eventdata_commandLine:/.*--[Cc][Oo][Nn][Ff][Ii][Gg].*/ OR data_win_eventdata_commandLine:/.*--[Mm][Aa][Xx]-[Aa][Gg][Ee].*/ OR data_win_eventdata_commandLine:/.*--[Nn][Oo]-[Cc][Hh][Ee][Cc][Kk]-[Cc][Ee][Rr][Tt][Ii][Ff][Ii][Cc][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*--[Ii][Gg][Nn][Oo][Rr][Ee]-[Ee][Xx][Ii][Ss][Tt][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*--[Aa][Uu][Tt][Oo]-[Cc][Oo][Nn][Ff][Ii][Rr][Mm].*/ OR data_win_eventdata_commandLine:/.*--[Bb][Ww][Ll][Ii][Mm][Ii][Tt].*/ OR data_win_eventdata_commandLine:/.*[Rr][Cc][Ll][Oo][Nn][Ee].*/)
    pivot_on:
    - host
    window: 2h
  - name: DNS lookups of cloud-storage exfiltration destinations
    query: data_win_system_eventID:"22" AND data_win_eventdata_queryName:/.*([Mm][Ee][Gg][Aa]\.[Nn][Zz]|[Mm][Ee][Gg][Aa]\.[Ii][Oo]|[Mm][Ee][Gg][Aa]\.[Cc][Oo]\.[Nn][Zz]|[Pp][Cc][Ll][Oo][Uu][Dd]\.[Cc][Oo][Mm]|[Bb][Aa][Cc][Kk][Bb][Ll][Aa][Zz][Ee][Bb]2\.[Cc][Oo][Mm]|[Ww][Aa][Ss][Aa][Bb][Ii][Ss][Yy][Ss]\.[Cc][Oo][Mm]|[Rr]2\.[Cc][Ll][Oo][Uu][Dd][Ff][Ll][Aa][Rr][Ee][Ss][Tt][Oo][Rr][Aa][Gg][Ee]\.[Cc][Oo][Mm]|[Aa][Nn][Oo][Nn][Ff][Ii][Ll][Ee][Ss]|[Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr]\.[Ss][Hh]|[Ff][Ii][Ll][Ee]\.[Ii][Oo]|[Dd][Rr][Oo][Pp][Bb][Oo][Xx]\.[Cc][Oo][Mm]|[Ss][Tt][Oo][Rr][Aa][Gg][Ee]\.[Gg][Oo][Oo][Gg][Ll][Ee][Aa][Pp][Ii][Ss]\.[Cc][Oo][Mm]).*/
    pivot_on:
    - host
    window: 2h
  - name: Archive staging tools before the transfer
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\(7[Zz]\.[Ee][Xx][Ee]|7[Zz][Aa]\.[Ee][Xx][Ee]|[Rr][Aa][Rr]\.[Ee][Xx][Ee]|[Ww][Ii][Nn][Rr][Aa][Rr]\.[Ee][Xx][Ee]|[Mm][Aa][Kk][Ee][Cc][Aa][Bb]\.[Ee][Xx][Ee]|[Ww][Zz][Zz][Ii][Pp]\.[Ee][Xx][Ee])/ OR (data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]-[Aa][Rr][Cc][Hh][Ii][Vv][Ee].*/ OR data_win_eventdata_commandLine:/.* [Aa] -[Hh][Pp].*/ OR data_win_eventdata_commandLine:/.* [Aa] -[Pp].*/))
    pivot_on:
    - host
    window: 4h
  - name: Archive and bulk-data files written to disk
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.([Zz][Ii][Pp]|[Rr][Aa][Rr]|7[Zz]|[Tt][Aa][Rr]|[Gg][Zz]|[Bb][Aa][Kk])/
    pivot_on:
    - host
    window: 4h
  - name: Ransomware impact commands following exfiltration
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Dd][Ee][Ll][Ee][Tt][Ee] [Ss][Hh][Aa][Dd][Oo][Ww][Ss].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Cc][Oo][Vv][Ee][Rr][Yy][Ee][Nn][Aa][Bb][Ll][Ee][Dd] [Nn][Oo].*/ OR data_win_eventdata_commandLine:/.*[Ww][Bb][Aa][Dd][Mm][Ii][Nn] [Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Ss][Ii][Zz][Ee] [Ss][Hh][Aa][Dd][Oo][Ww][Ss][Tt][Oo][Rr][Aa][Gg][Ee].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ee][Ll][Ee][Tt][Ee] [Cc][Aa][Tt][Aa][Ll][Oo][Gg].*/)
    pivot_on:
    - host
    window: 24h
