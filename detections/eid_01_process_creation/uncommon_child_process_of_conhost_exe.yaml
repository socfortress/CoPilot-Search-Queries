name: Uncommon Child Process Of Conhost.EXE
id: 7dc2dedd-7603-461a-bc13-15803d132355
version: 1
schema_version: "1.0"
date: "2023-12-11"
author: omkar72
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 7dc2dedd-7603-461a-bc13-15803d132355
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects uncommon "conhost" child processes. This could be a sign of "conhost"
  usage as a LOLBIN or potential process injection activity. MITRE ATT&CK:
  T1202.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_parentImage:
              value: "*\\\\conhost.exe"
              case_insensitive: true
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*:\\\\Windows\\\\System32\\\\conhost.exe"
                          case_insensitive: true
                    - bool:
                        must_not:
                          - exists:
                              field: "data_win_eventdata_image"
                    - term:
                        data_win_eventdata_image: ""
                  minimum_should_match: 1
        - exists:
            field: "data_win_system_providerName"
        - bool:
            must_not:
              - term:
                  data_win_system_providerName:
                    value: "SystemTraceProvider-Process"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_image
    - data_win_system_providerName
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\conhost.exe'; data_win_eventdata_image matches
  '*:\Windows\System32\conhost.exe'; data_win_eventdata_image is absent, among
  other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - http://www.hexacorn.com/blog/2020/05/25/how-to-con-your-host/
  - https://attack.mitre.org/techniques/T1202/

response:
  message: >
    Uncommon Child Process Of Conhost.EXE detected on host $agent_name$. Matched
    data_win_eventdata_parentImage: $data_win_eventdata_parentImage$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1202
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1202
  custom_tags:
    - uncommon
    - child
    - conhost
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Cc][Oo][Nn][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ AND NOT (data_win_eventdata_image:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Cc][Oo][Nn][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ OR NOT _exists_:data_win_eventdata_image OR data_win_eventdata_image:"") AND _exists_:data_win_system_providerName AND NOT (data_win_system_providerName:/[Ss][Yy][Ss][Tt][Ee][Mm][Tt][Rr][Aa][Cc][Ee][Pp][Rr][Oo][Vv][Ii][Dd][Ee][Rr]-[Pp][Rr][Oo][Cc][Ee][Ss][Ss]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: dfa03a09-8b92-4d83-8e74-f72839b1c407
    name: Potentially Suspicious Child Processes Spawned by ConHost
    reason: 'Higher-fidelity form of the same pattern: conhost spawning known-bad children.'
  - id: cbb9e3d1-2386-4e59-912e-62f1484f7a89
    name: Conhost Spawned By Uncommon Parent Process
    reason: 'Upstream view: conhost started by an abnormal parent suggests injection or masquerading.'
  - id: 056c7317-9a09-4bd4-9067-d051312752ea
    name: Powershell Executed From Headless ConHost Process
    reason: conhost --headless launching PowerShell is a common reason for conhost child processes.
  - id: ee5e119b-1f75-4b34-add8-3be976961e39
    name: Conhost.exe CommandLine Path Traversal
    reason: Conhost LOLBin abuse via crafted command line, same behaviour family.
  - id: 2ad78473-6978-40f5-b8f1-89c7e1c27a1a
    name: RedSun - Conhost.exe Spawned by TieringEngineService.exe
    reason: Specific exploit chain where conhost is spawned and then used to run payloads.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Conhost launches and arguments
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*\\[Cc]onhost\.exe/
    pivot_on: host
    window: 2h
  - name: Children of conhost
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*\\[Cc]onhost\.exe/
    pivot_on: host
    window: 2h
  - name: Remote thread or process access into conhost
    query: data_win_system_eventID:(8 OR 10) AND data_win_eventdata_targetImage:/.*\\[Cc]onhost\.exe/
    pivot_on: host
    window: 2h
  - name: Interpreters with encoded or download commands
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*-[Ee]nc.*/ OR /.*[Ii][Ee][Xx].*/ OR /.*[Dd]ownload[Ss]tring.*/ OR /.*[Ff]rom[Bb]ase64.*/)
    pivot_on: host
    window: 1h
