name: MMC20 Lateral Movement
id: f1f3bf22-deb2-418d-8cce-e1a45e46a5bd
version: 1
schema_version: "1.0"
date: "2021-11-27"
author: "@2xxeformyshirt (Security Risk Advisors) - rule; Teymur Kheirkhabarov (idea)"
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: f1f3bf22-deb2-418d-8cce-e1a45e46a5bd
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects MMC20.Application Lateral Movement; specifically looks for the
  spawning of the parent MMC.exe with a command line of "-Embedding" as a child
  of svchost.exe. MITRE ATT&CK: T1021.003.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_parentImage:
              value: "*\\\\svchost.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\mmc.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*-Embedding*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\svchost.exe'; data_win_eventdata_image matches '*\mmc.exe';
  data_win_eventdata_commandLine matches '*-Embedding*'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://enigma0x3.net/2017/01/05/lateral-movement-using-the-mmc20-application-com-object/
  - https://drive.google.com/file/d/1lKya3_mLnR3UQuCoiYruO3qgu052_iS_/view?usp=sharing
  - https://attack.mitre.org/techniques/T1021/003/

response:
  message: >
    MMC20 Lateral Movement detected on host $agent_name$. Matched
    data_win_eventdata_parentImage: $data_win_eventdata_parentImage$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1021.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1021.003
  custom_tags:
    - mmc20
    - lateral
    - movement
    - process_creation
    - sysmon
    - execution
    - lateral_movement
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\[Mm][Mm][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*-[Ee][Mm][Bb][Ee][Dd][Dd][Ii][Nn][Gg].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 05a2ab7e-ce11-4b63-86db-ab32e763e11d
    name: MMC Spawning Windows Shell
    reason: The DCOM-launched mmc.exe (MMC20.Application ExecuteShellCommand) spawns cmd/powershell as the actual remote command.
  - id: windows-mmc-lolbas-execution-process-spawn-001
    name: Windows Mmc LOLBAS Execution Process Spawn
    reason: mmc.exe spawning LOLBAS binaries is the payload stage of this DCOM lateral movement.
  - id: 551d9c1f-816c-445b-a7a6-7a3864720d60
    name: Potential Excel.EXE DCOM Lateral Movement Via ActivateMicrosoftApp
    reason: Sibling DCOM lateral movement technique; attackers rotate DCOM objects across targets.
  - id: 692f0bec-83ba-4d04-af7e-e884a96059b6
    name: Potential WMI Lateral Movement WmiPrvSE Spawned PowerShell
    reason: Alternate remote-exec channel used by the same operator against other hosts.
  - id: ea011323-7045-460b-b2d7-0f7442ea6b38
    name: Potential PsExec Remote Execution
    reason: Another remote-execution method frequently used alongside DCOM during the same lateral phase.
  - id: 8ce07472-496f-11ec-ab3b-3e22fbd008af
    name: Impacket Lateral Movement Commandline Parameters
    reason: Impacket dcomexec uses MMC20.Application; its cmd.exe /Q /c output redirection pattern is the usual origin.
  - id: cb909b3e-512b-11ec-aa31-3e22fbd008af
    name: Possible Lateral Movement PowerShell Spawn
    reason: PowerShell spawned by remote-execution parents is the next artifact on the target.
  - id: windows-mimikatz-passtheticket-commandline-parameters-001
    name: Windows Mimikatz PassTheTicket CommandLine Parameters
    reason: DCOM lateral movement needs valid credentials/tickets, often stolen via pass-the-ticket on the source host.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Shells spawned by mmc.exe
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Mm][Mm][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Cc][Mm][Dd]|[Pp]ower[Ss]hell|[Pp]wsh|[Mm][Ss][Hh][Tt][Aa]|[Rr]egsvr32|[Rr]undll32)\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Impacket-style output redirection
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*cmd\.exe \/[Qq] \/[Cc] .*(ADMIN\$|2>&1).*/
    pivot_on: host
    window: 2h
  - name: Network logons from remote hosts
    query: data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3"
    pivot_on: user
    window: 1h
  - name: Discovery and credential commands after remote exec
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ww]hoami|[Nn]et +(user|group|localgroup)|[Nn]ltest|[Ii]pconfig|[Qq]uery +user|[Ss]ekurlsa).*/
    pivot_on: host
    window: 2h
  - name: Inbound RPC/DCOM connections
    query: data_win_system_eventID:"3" AND data_win_eventdata_destinationPort:"135" AND data_win_eventdata_initiated:"false"
    pivot_on: host
    window: 1h
