name: Windows New Service Security Descriptor Set Via Sc.EXE
id: Windows-New-Service-Security-Descriptor-Set-Via-Sc.EXE
version: 4
schema_version: 1
date: '2025-05-02'
author: SOCFortress LLC
status: production
type: Anomaly
description: >
  Detects any modification to a service security descriptor via sc.exe sdset.
  This is a broader companion to the deny ACE detection — any use of sdset
  against a service is suspicious and warrants investigation. Attackers use
  this technique to blind security products, hide services, or escalate
  privileges by manipulating service access control. Associated with SDDL
  Tampering and Glupteba malware defense evasion tradecraft.
  MITRE ATT&CK: T1564 (Hide Artifacts).

data_source:
  - Sysmon EventID 1 (ProcessCreate)

search:
  query:
    bool:
      must:
        - term:
            agent_name: "AGENT_NAME"
        - term:
            agent_labels_customer: "CUSTOMER_CODE"
        - term:
            data_win_system_eventID: "1"
        - wildcard:
            data_win_eventdata_image: "*\\sc.exe"
        - wildcard:
            data_win_eventdata_commandLine: "*sdset *"
        - range:
            timestamp:
              gte: "START_TIME"
              lte: "END_TIME"

parameters:
  - name: AGENT_NAME
    default: "DESKTOP-AM0HLGE"
  - name: CUSTOMER_CODE
    default: "lab"
  - name: START_TIME
    default: "now-24h"
  - name: END_TIME
    default: "now"

how_to_implement: >
  Requires Sysmon EventID 1 (ProcessCreate) flowing to the Wazuh Indexer.
  Fields data_win_eventdata_image and data_win_eventdata_commandLine are
  confirmed working across all EventID 1 detections in this environment.
  Field-validated based on established EventID 1 detection patterns.
  This is a broader detection than #164 — it fires on any sdset usage
  regardless of ACE type. Use alongside the deny ACE detection for
  layered coverage.

known_false_positives: >
  None identified. Any modification to service security descriptors via
  sc.exe sdset should be investigated, especially against security-related
  services.

references:
  - https://www.sans.org/blog/red-team-tactics-hiding-windows-services/
  - https://news.sophos.com/wp-content/uploads/2020/06/glupteba_final-1.pdf
  - https://attack.mitre.org/techniques/T1564/

response:
  message: >
    Service security descriptor modified via sc.exe sdset on $agent_name$ by $data_win_eventdata_user$.
    Parent: $data_win_eventdata_parentImage$.
    Command: $data_win_eventdata_commandLine$.
    MITRE ATT&CK: T1564
  risk_score: 36
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 36
    - field: data_win_eventdata_user
      type: user
      score: 36
  threat_objects:
    - field: data_win_eventdata_image
      type: process_name
    - field: data_win_eventdata_parentImage
      type: parent_process_name

tags:
  analytic_story:
    - Defense Evasion or Unauthorized Access Via SDDL Tampering
  asset_type: Endpoint
  mitre_attack_id:
    - T1564
  custom_tags:
    - sc_exe
    - sdset
    - sddl
    - service_tampering
    - defense_evasion
  product:
    - Wazuh
  security_domain: endpoint

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 98c5aeef-32d5-492f-b174-64a691896d25
    name: Service Security Descriptor Tampering Via Sc.EXE
    reason: Specific SDDL tampering variant of the same sdset activity.
  - id: Windows-New-Deny-Permission-Set-On-Service-SD-Via-Sc.EXE
    name: Windows New Deny Permission Set On Service SD Via Sc.EXE
    reason: Escalates generic sdset to a deny ACE that hides the service.
  - id: 6c8fbee5-dee8-49bc-851d-c3142d02aa47
    name: Allow Service Access Using Security Descriptor Tampering Via Sc.EXE
    reason: Allow-ACE variant grants low-priv users control of a service, a privilege escalation path.
  - id: d937b75f-a665-4480-88a5-2f20e9f9b22a
    name: Possible Privilege Escalation via Weak Service Permissions
    reason: Weak service permissions created by sdset are then exploited for escalation.
  - id: 85c312b7-f44d-4a51-a024-d671c40b49fc
    name: Service StartupType Change Via Sc.EXE
    reason: Companion service reconfiguration often accompanies SD changes.
  - id: 38879043-7e1e-47a9-8d46-6bec88e201df
    name: Potential Persistence Attempt Via Existing Service Tampering
    reason: Service tampering for persistence follows or accompanies sdset.
  - id: 17a1be64-8d88-40bf-b5ff-a4f7a50ebcc8
    name: Suspicious New Service Creation
    reason: A newly created service is the likely sdset target.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: sc.exe service commands
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Ss][Cc]\.exe/ AND data_win_eventdata_commandLine:/.*(sdset|sdshow|config|create|binPath|start|stop).*/
    pivot_on: host
    window: 4h
  - name: Service ImagePath or Start changed via registry
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*CurrentControlSet.Services.*(ImagePath|Start).*/
    pivot_on: host
    window: 4h
  - name: Service PowerShell cmdlets
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(Set-Service|New-Service|Set-ServiceAcl).*/
    pivot_on: host
    window: 4h
  - name: Service installed (System 7045)
    query: data_win_system_eventID:7045
    pivot_on: host
    window: 4h
