name: Reg Add Suspicious Paths
id: b7e2a8d4-74bb-4b78-adc9-3f92af2d4829
version: 1
schema_version: "1.0"
date: "2022-10-10"
author: frack113, Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: b7e2a8d4-74bb-4b78-adc9-3f92af2d4829
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects when an adversary uses the reg.exe utility to add or modify new keys
  or subkeys. MITRE ATT&CK: T1112, T1685.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\reg.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "reg.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\AppDataLow\\\\Software\\\\Microsoft\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Policies\\\\Microsoft\\\\Windows\\\\OOBE*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Policies\\\\Microsoft\\\\Windows NT\\\\CurrentVersion\\\\Winlogon*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\SOFTWARE\\\\Microsoft\\\\Windows NT\\\\Currentversion\\\\Winlogon*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\CurrentControlSet\\\\Control\\\\SecurityProviders\\\\WDigest*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Microsoft\\\\Windows Defender\\\\*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches '*\reg.exe';
  data_win_eventdata_originalFileName equals 'reg.exe';
  data_win_eventdata_commandLine matches '*\AppDataLow\Software\Microsoft\*',
  among other conditions.

known_false_positives: >
  Rare legitimate add to registry via cli (to these locations). Baseline
  expected activity in your environment and tune this detection before relying
  on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/40b77d63808dd4f4eafb83949805636735a1fd15/atomics/T1112/T1112.md
  - https://github.com/redcanaryco/atomic-red-team/blob/40b77d63808dd4f4eafb83949805636735a1fd15/atomics/T1562.001/T1562.001.md
  - https://www.absolomb.com/2018-01-26-Windows-Privilege-Escalation-Guide/
  - https://attack.mitre.org/techniques/T1112/
  - https://attack.mitre.org/techniques/T1685/

response:
  message: >
    Reg Add Suspicious Paths detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1112, T1685
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
    - T1685
  custom_tags:
    - paths
    - process_creation
    - sysmon
    - persistence
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Rr][Ee][Gg]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Rr][Ee][Gg]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa][Ll][Oo][Ww]\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Pp][Oo][Ll][Ii][Cc][Ii][Ee][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Oo][Oo][Bb][Ee].*/ OR data_win_eventdata_commandLine:/.*\\[Pp][Oo][Ll][Ii][Cc][Ii][Ee][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Nn][Tt]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Nn][Tt]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt]\\[Cc][Oo][Nn][Tt][Rr][Oo][Ll]\\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy][Pp][Rr][Oo][Vv][Ii][Dd][Ee][Rr][Ss]\\[Ww][Dd][Ii][Gg][Ee][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr]\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 452bce90-6fb0-43cc-97a5-affc283139b3
    name: Suspicious Windows Defender Registry Key Tampering Via Reg.EXE
    reason: Same reg.exe technique against Defender keys; a Defender path in this rule often means defense evasion in progress.
  - id: 48917adc-a28e-4f5d-b729-11e75da8941f
    name: Suspicious Windows Defender Folder Exclusion Added Via Reg.EXE
    reason: Attacker adds exclusions via reg add so a payload can run unscanned.
  - id: de587dce-915e-4218-aac4-835ca6af6f70
    name: Potential Persistence Attempt Via Run Keys Using Reg.EXE
    reason: Winlogon and AppDataLow writes are persistence; Run key persistence is the sibling pattern.
  - id: 24357373-078f-44ed-9ac4-6d334a668a11
    name: Direct Autorun Keys Modification
    reason: Covers other autorun locations the same actor typically sets alongside Winlogon edits.
  - id: d6a9b252-c666-4de6-8806-5561bbbd3bdc
    name: Wdigest Enable UseLogonCredential
    reason: The WDigest path re-enables cleartext credentials; registry-level confirmation that LSASS credential theft was prepared.
  - id: bbf59793-6efb-4fa1-95ca-a7d288e52c88
    name: Winlogon Notify Key Logon Persistence
    reason: Registry-event view of Winlogon persistence confirming the reg.exe command actually wrote the value.
  - id: c9b86500-1ec2-4de6-9120-d744c8fb5caf
    name: Potential KamiKakaBot Activity - Winlogon Shell Persistence
    reason: Known malware using Winlogon Shell value persistence, the outcome of this command pattern.
  - id: ffa6861c-4461-4f59-8a41-578c39f3f23e
    name: LSASS Dump Keyword In CommandLine
    reason: WDigest enablement is followed by LSASS dumping to harvest cleartext credentials.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Registry value writes to Winlogon, WDigest, Defender and AppDataLow
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:(/.*(Winlogon|WDigest|Windows Defender|AppDataLow|OOBE).*/)
    pivot_on: host
    window: 4h
  - name: Other reg.exe add, import and load activity
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Rr]eg(\.exe)? +(add|import|load).*/)
    pivot_on: host
    window: 4h
  - name: Credential dumping tools and LSASS access
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*([Ll]sass|[Ss]ekurlsa|[Mm]imikatz|[Pp]rocdump|[Cc]omsvcs.*[Mm]ini[Dd]ump).*/)
    pivot_on: host
    window: 6h
  - name: Binaries launched from user-writable paths
    query: data_win_system_eventID:1 AND data_win_eventdata_image:(/.*\\([Aa]pp[Dd]ata|[Tt]emp|[Pp]rogram[Dd]ata|[Pp]ublic)\\.*\.exe/)
    pivot_on: host
    window: 2h
