name: PrintBrm ZIP Creation of Extraction
id: cafeeba3-01da-4ab4-b6c4-a31b1d9730c7
version: 1
schema_version: "1.0"
date: "2022-05-02"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: cafeeba3-01da-4ab4-b6c4-a31b1d9730c7
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of the LOLBIN PrintBrm.exe, which can be used to create
  or extract ZIP files. PrintBrm.exe should not be run on a normal workstation.
  MITRE ATT&CK: T1105, T1564.004.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\PrintBrm.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* -f*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*.zip*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\PrintBrm.exe'; data_win_eventdata_commandLine matches '* -f*';
  data_win_eventdata_commandLine matches '*.zip*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://lolbas-project.github.io/lolbas/Binaries/PrintBrm/
  - https://attack.mitre.org/techniques/T1105/
  - https://attack.mitre.org/techniques/T1564/004/

response:
  message: >
    PrintBrm ZIP Creation of Extraction detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1105, T1564.004
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1105
    - T1564.004
  custom_tags:
    - printbrm
    - extraction
    - process_creation
    - sysmon
    - command_and_control
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Pp][Rr][Ii][Nn][Tt][Bb][Rr][Mm]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.* -[Ff].*/ AND data_win_eventdata_commandLine:/.*\.[Zz][Ii][Pp].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 9fbf5927-5261-4284-a71d-f681029ea574
    name: Compress Data and Lock With Password for Exfiltration With 7-ZIP
    reason: Other archiving of staged data for exfiltration on the same host.
  - id: 85a8e5ba-bd03-4bfb-bbfa-a4409a8f8b98
    name: Folder Compress To Potentially Suspicious Output Via Compress-Archive Cmdlet
    reason: Alternative archive creation for staging data.
  - id: 7d1aaf3d-4304-425c-b7c3-162055e0b3ab
    name: Potential Data Exfiltration Activity Via CommandLine Tools
    reason: An archive built by PrintBrm is then moved out via transfer tools.
  - id: e328cc73-f92a-42fb-b3fa-7c2cffda981a
    name: Curl File Upload To File Sharing Websites
    reason: Typical upload step after zip staging.
  - id: 99c840f2-2012-46fd-9141-c761987550ef
    name: Suspicious Download From Direct IP Via Bitsadmin
    reason: PrintBrm can extract a zip fetched by a download LOLBin, which precedes it.
  - id: ec570e53-4c76-45a9-804d-dc3f355ff7a7
    name: 7Zip Compressing Dump Files
    reason: Dump archival often follows data staging.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other archiving tools run
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(7z|rar|zip|[Cc]ompress-[Aa]rchive|tar).*/ AND data_win_eventdata_commandLine:/.*\.(zip|7z|rar|tar).*/
    pivot_on: host
    window: 4h
  - name: Archive files created
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\.(zip|7z|rar)/
    pivot_on: host
    window: 4h
  - name: Download or upload LOLBins
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*[Bb]its(admin|[Tt]ransfer).*/ OR data_win_eventdata_commandLine:/.*[Cc]url.*/ OR data_win_eventdata_commandLine:/.*[Cc]ertutil.*urlcache.*/ OR data_win_eventdata_commandLine:/.*[Ii]nvoke-[Ww]eb[Rr]equest.*/)
    pivot_on: host
    window: 4h
  - name: Executables or scripts extracted to writable paths
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\.(exe|dll|ps1|bat|vbs|hta)/ AND data_win_eventdata_targetFilename:/.*\\(Temp|Public|ProgramData|Downloads)\\.*/
    pivot_on: host
    window: 2h
