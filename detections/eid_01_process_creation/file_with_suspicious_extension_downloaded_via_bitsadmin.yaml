graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.* \/[Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr] .*/ OR data_win_eventdata_commandLine:/.* \/[Cc][Rr][Ee][Aa][Tt][Ee] .*/ OR data_win_eventdata_commandLine:/.* \/[Aa][Dd][Dd][Ff][Ii][Ll][Ee] .*/) AND (data_win_eventdata_commandLine:/.*\.7[Zz].*/ OR data_win_eventdata_commandLine:/.*\.[Aa][Ss][Aa][Xx].*/ OR data_win_eventdata_commandLine:/.*\.[Aa][Ss][Hh][Xx].*/ OR data_win_eventdata_commandLine:/.*\.[Aa][Ss][Mm][Xx].*/ OR data_win_eventdata_commandLine:/.*\.[Aa][Ss][Pp].*/ OR data_win_eventdata_commandLine:/.*\.[Aa][Ss][Pp][Xx].*/ OR data_win_eventdata_commandLine:/.*\.[Bb][Aa][Tt].*/ OR data_win_eventdata_commandLine:/.*\.[Cc][Ff][Mm].*/ OR data_win_eventdata_commandLine:/.*\.[Cc][Gg][Ii].*/ OR data_win_eventdata_commandLine:/.*\.[Cc][Hh][Mm].*/ OR data_win_eventdata_commandLine:/.*\.[Cc][Mm][Dd].*/ OR data_win_eventdata_commandLine:/.*\.[Dd][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*\.[Gg][Ii][Ff].*/ OR data_win_eventdata_commandLine:/.*\.[Jj][Pp][Ee][Gg].*/ OR data_win_eventdata_commandLine:/.*\.[Jj][Pp][Gg].*/ OR data_win_eventdata_commandLine:/.*\.[Jj][Ss][Pp].*/ OR data_win_eventdata_commandLine:/.*\.[Jj][Ss][Pp][Xx].*/ OR data_win_eventdata_commandLine:/.*\.[Ll][Oo][Gg].*/ OR data_win_eventdata_commandLine:/.*\.[Pp][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*\.[Pp][Ss]1.*/ OR data_win_eventdata_commandLine:/.*\.[Pp][Ss][Mm]1.*/ OR data_win_eventdata_commandLine:/.*\.[Rr][Aa][Rr].*/ OR data_win_eventdata_commandLine:/.*\.[Ss][Cc][Ff].*/ OR data_win_eventdata_commandLine:/.*\.[Ss][Cc][Tt].*/ OR data_win_eventdata_commandLine:/.*\.[Tt][Xx][Tt].*/ OR data_win_eventdata_commandLine:/.*\.[Vv][Bb][Ee].*/ OR data_win_eventdata_commandLine:/.*\.[Vv][Bb][Ss].*/ OR data_win_eventdata_commandLine:/.*\.[Ww][Aa][Rr].*/ OR data_win_eventdata_commandLine:/.*\.[Ww][Ss][Ff].*/ OR data_win_eventdata_commandLine:/.*\.[Ww][Ss][Hh].*/ OR data_win_eventdata_commandLine:/.*\.[Xx][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*\.[Zz][Ii][Pp].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 2ddef153-167b-4e89-86b6-757a9e65dcac
    name: File Download Via Bitsadmin To A Suspicious Target Folder
    reason: Same download pattern with a different indicator (destination folder); together they strengthen payload-staging confidence.
  - id: 99c840f2-2012-46fd-9141-c761987550ef
    name: Suspicious Download From Direct IP Via Bitsadmin
    reason: 'Source-side indicator for the same BITS job: download directly from a raw IP.'
  - id: 8518ed3d-f7c9-4601-a26c-f361a4256a0c
    name: Suspicious Download From File-Sharing Website Via Bitsadmin
    reason: 'Source-side indicator: payload hosted on a file-sharing service.'
  - id: d059842b-6b9d-4ed1-b5c3-5b89143c6ede
    name: File Download Via Bitsadmin
    reason: Generic bitsadmin download; shows additional or earlier BITS jobs on the host.
  - id: 19b08b1c-861d-4e75-a1ef-ea0c1baf202b
    name: Suspicious Download Via Certutil.EXE
    reason: Attackers rotate between LOLBin downloaders (bitsadmin, certutil) on the same host if one is blocked.
  - id: 587254ee-a24b-4335-b3cd-065c0f1f4baa
    name: Remote File Download Via Findstr.EXE
    reason: Another living-off-the-land download channel used for the same ingress-tool-transfer goal.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Bitsadmin jobs on host
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Bb]itsadmin\.exe/
    pivot_on: host
    window: 6h
  - name: Execution of binaries from user-writable paths spawned by script hosts
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*\\(Users|ProgramData|Temp)\\.*\.(exe|scr)/ AND data_win_eventdata_parentImage:/.*\\(cmd|powershell|wscript|cscript|mshta)\.exe/
    pivot_on: host
    window: 4h
  - name: Persistence via BITS notify command or scheduled task
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*bitsadmin.* \/setnotifycmdline.*/ OR data_win_eventdata_commandLine:/.*schtasks.* \/create.*/)
    pivot_on: host
    window: 6h
  - name: Network connections by bitsadmin
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*[Bb]itsadmin\.exe/
    pivot_on: host
    window: 4h
