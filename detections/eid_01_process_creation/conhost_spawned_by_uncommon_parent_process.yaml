name: Conhost Spawned By Uncommon Parent Process
id: cbb9e3d1-2386-4e59-912e-62f1484f7a89
version: 1
schema_version: "1.0"
date: "2025-03-06"
author: Tim Rauch, Elastic (idea)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: cbb9e3d1-2386-4e59-912e-62f1484f7a89
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects when the Console Window Host (conhost.exe) process is spawned by an
  uncommon parent process, which could be indicative of potential code injection
  activity. MITRE ATT&CK: T1059.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\conhost.exe"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\explorer.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\lsass.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\regsvr32.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\rundll32.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\services.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\smss.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\spoolsv.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\svchost.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\userinit.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\wininit.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\winlogon.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_parentCommandLine"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_parentCommandLine:
                          value: "*-k apphost -s AppHostSvc*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_parentCommandLine:
                          value: "*-k imgsvc*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_parentCommandLine:
                          value: "*-k localService -p -s RemoteRegistry*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_parentCommandLine:
                          value: "*-k LocalSystemNetworkRestricted -p -s NgcSvc*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_parentCommandLine:
                          value: "*-k NetSvcs -p -s NcaSvc*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_parentCommandLine:
                          value: "*-k netsvcs -p -s NetSetupSvc*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_parentCommandLine:
                          value: "*-k netsvcs -p -s wlidsvc*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_parentCommandLine:
                          value: "*-k NetworkService -p -s DoSvc*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_parentCommandLine:
                          value: "*-k wsappx -p -s AppXSvc*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_parentCommandLine:
                          value: "*-k wsappx -p -s ClipSVC*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_parentCommandLine:
                          value: "*-k wusvcs -p -s WaaSMedicSvc*"
                          case_insensitive: true
                  minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_parentCommandLine"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_parentCommandLine:
                          value: "*C:\\\\Program Files (x86)\\\\Dropbox\\\\Client\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_parentCommandLine:
                          value: "*C:\\\\Program Files\\\\Dropbox\\\\Client\\\\*"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_parentCommandLine
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\conhost.exe'; data_win_eventdata_parentImage matches '*\explorer.exe';
  data_win_eventdata_parentImage matches '*\lsass.exe', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.elastic.co/guide/en/security/current/conhost-spawned-by-suspicious-parent-process.html
  - https://attack.mitre.org/techniques/T1059/

response:
  message: >
    Conhost Spawned By Uncommon Parent Process detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_parentImage: $data_win_eventdata_parentImage$. MITRE
    ATT&CK: T1059
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_parentImage
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059
  custom_tags:
    - conhost
    - spawned
    - uncommon
    - process_creation
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Cc][Oo][Nn][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_parentImage:/.*\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ss][Mm][Ss][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ss][Pp][Oo][Oo][Ll][Ss][Vv]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Uu][Ss][Ee][Rr][Ii][Nn][Ii][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ww][Ii][Nn][Ii][Nn][Ii][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]\.[Ee][Xx][Ee]/) AND _exists_:data_win_eventdata_parentCommandLine AND NOT (data_win_eventdata_parentCommandLine:/.*-[Kk] [Aa][Pp][Pp][Hh][Oo][Ss][Tt] -[Ss] [Aa][Pp][Pp][Hh][Oo][Ss][Tt][Ss][Vv][Cc].*/ OR data_win_eventdata_parentCommandLine:/.*-[Kk] [Ii][Mm][Gg][Ss][Vv][Cc].*/ OR data_win_eventdata_parentCommandLine:/.*-[Kk] [Ll][Oo][Cc][Aa][Ll][Ss][Ee][Rr][Vv][Ii][Cc][Ee] -[Pp] -[Ss] [Rr][Ee][Mm][Oo][Tt][Ee][Rr][Ee][Gg][Ii][Ss][Tt][Rr][Yy].*/ OR data_win_eventdata_parentCommandLine:/.*-[Kk] [Ll][Oo][Cc][Aa][Ll][Ss][Yy][Ss][Tt][Ee][Mm][Nn][Ee][Tt][Ww][Oo][Rr][Kk][Rr][Ee][Ss][Tt][Rr][Ii][Cc][Tt][Ee][Dd] -[Pp] -[Ss] [Nn][Gg][Cc][Ss][Vv][Cc].*/ OR data_win_eventdata_parentCommandLine:/.*-[Kk] [Nn][Ee][Tt][Ss][Vv][Cc][Ss] -[Pp] -[Ss] [Nn][Cc][Aa][Ss][Vv][Cc].*/ OR data_win_eventdata_parentCommandLine:/.*-[Kk] [Nn][Ee][Tt][Ss][Vv][Cc][Ss] -[Pp] -[Ss] [Nn][Ee][Tt][Ss][Ee][Tt][Uu][Pp][Ss][Vv][Cc].*/ OR data_win_eventdata_parentCommandLine:/.*-[Kk] [Nn][Ee][Tt][Ss][Vv][Cc][Ss] -[Pp] -[Ss] [Ww][Ll][Ii][Dd][Ss][Vv][Cc].*/ OR data_win_eventdata_parentCommandLine:/.*-[Kk] [Nn][Ee][Tt][Ww][Oo][Rr][Kk][Ss][Ee][Rr][Vv][Ii][Cc][Ee] -[Pp] -[Ss] [Dd][Oo][Ss][Vv][Cc].*/ OR data_win_eventdata_parentCommandLine:/.*-[Kk] [Ww][Ss][Aa][Pp][Pp][Xx] -[Pp] -[Ss] [Aa][Pp][Pp][Xx][Ss][Vv][Cc].*/ OR data_win_eventdata_parentCommandLine:/.*-[Kk] [Ww][Ss][Aa][Pp][Pp][Xx] -[Pp] -[Ss] [Cc][Ll][Ii][Pp][Ss][Vv][Cc].*/ OR data_win_eventdata_parentCommandLine:/.*-[Kk] [Ww][Uu][Ss][Vv][Cc][Ss] -[Pp] -[Ss] [Ww][Aa][Aa][Ss][Mm][Ee][Dd][Ii][Cc][Ss][Vv][Cc].*/) AND _exists_:data_win_eventdata_parentCommandLine AND NOT (data_win_eventdata_parentCommandLine:/.*[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Dd][Rr][Oo][Pp][Bb][Oo][Xx]\\[Cc][Ll][Ii][Ee][Nn][Tt]\\.*/ OR data_win_eventdata_parentCommandLine:/.*[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Dd][Rr][Oo][Pp][Bb][Oo][Xx]\\[Cc][Ll][Ii][Ee][Nn][Tt]\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7dc2dedd-7603-461a-bc13-15803d132355
    name: Uncommon Child Process Of Conhost.EXE
    reason: Injected or spoofed conhost often spawns unusual children; confirms code execution.
  - id: dfa03a09-8b92-4d83-8e74-f72839b1c407
    name: Potentially Suspicious Child Processes Spawned by ConHost
    reason: Follow-on shell/LOLBin spawn from the conhost instance.
  - id: ee5e119b-1f75-4b34-add8-3be976961e39
    name: Conhost.exe CommandLine Path Traversal
    reason: Another conhost abuse technique often seen in the same intrusion.
  - id: 2ad78473-6978-40f5-b8f1-89c7e1c27a1a
    name: RedSun - Conhost.exe Spawned by TieringEngineService.exe
    reason: Known exploit where conhost is spawned by an unexpected service parent.
  - id: windows-conhost-headless-argument-001
    name: Windows ConHost with Headless Argument
    reason: Headless conhost is a common companion used to hide windows of injected activity.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Conhost process starts
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Cc][Oo][Nn][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee].*/
    pivot_on: host
    window: 1h
  - name: Children of conhost
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Cc][Oo][Nn][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee].*/
    pivot_on: host
    window: 2h
  - name: Remote thread injection
    query: data_win_system_eventID:"8"
    pivot_on: host
    window: 1h
  - name: LSASS process access
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee].*/
    pivot_on: host
    window: 2h
