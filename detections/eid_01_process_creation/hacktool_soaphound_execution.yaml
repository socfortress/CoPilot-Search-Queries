name: HackTool - SOAPHound Execution
id: e92a4287-e072-4a40-9739-370c106bb750
version: 1
schema_version: "1.0"
date: "2024-01-26"
author: "@kostastsale"
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: e92a4287-e072-4a40-9739-370c106bb750
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of SOAPHound, a .NET tool for collecting Active
  Directory data, using specific command-line arguments that may indicate an
  attempt to extract sensitive AD information. MITRE ATT&CK: T1087.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* --buildcache *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* --bhdump *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* --certdump *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* --dnsdump *"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -c *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* --cachefilename *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -o *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* --outputdirectory*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches '*
  --buildcache *'; data_win_eventdata_commandLine matches '* --bhdump *';
  data_win_eventdata_commandLine matches '* --certdump *', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/FalconForceTeam/SOAPHound
  - https://medium.com/falconforce/soaphound-tool-to-collect-active-directory-data-via-adws-165aca78288c
  - https://attack.mitre.org/techniques/T1087/

response:
  message: >
    HackTool - SOAPHound Execution detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1087
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1087
  custom_tags:
    - hacktool
    - soaphound
    - process_creation
    - sysmon
    - discovery
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.* --[Bb][Uu][Ii][Ll][Dd][Cc][Aa][Cc][Hh][Ee] .*/ OR data_win_eventdata_commandLine:/.* --[Bb][Hh][Dd][Uu][Mm][Pp] .*/ OR data_win_eventdata_commandLine:/.* --[Cc][Ee][Rr][Tt][Dd][Uu][Mm][Pp] .*/ OR data_win_eventdata_commandLine:/.* --[Dd][Nn][Ss][Dd][Uu][Mm][Pp] .*/) AND (data_win_eventdata_commandLine:/.* -[Cc] .*/ OR data_win_eventdata_commandLine:/.* --[Cc][Aa][Cc][Hh][Ee][Ff][Ii][Ll][Ee][Nn][Aa][Mm][Ee] .*/ OR data_win_eventdata_commandLine:/.* -[Oo] .*/ OR data_win_eventdata_commandLine:/.* --[Oo][Uu][Tt][Pp][Uu][Tt][Dd][Ii][Rr][Ee][Cc][Tt][Oo][Rr][Yy].*/)

