name: Suspicious Download From Direct IP Via Bitsadmin
id: 99c840f2-2012-46fd-9141-c761987550ef
version: 1
schema_version: "1.0"
date: "2023-02-15"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 99c840f2-2012-46fd-9141-c761987550ef
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects usage of bitsadmin downloading a file using an URL that contains an
  IP. MITRE ATT&CK: T1197, T1036.003.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\bitsadmin.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "bitsadmin.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /transfer *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /create *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /addfile *"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine: "*://1*"
              - wildcard:
                  data_win_eventdata_commandLine: "*://2*"
              - wildcard:
                  data_win_eventdata_commandLine: "*://3*"
              - wildcard:
                  data_win_eventdata_commandLine: "*://4*"
              - wildcard:
                  data_win_eventdata_commandLine: "*://5*"
              - wildcard:
                  data_win_eventdata_commandLine: "*://6*"
              - wildcard:
                  data_win_eventdata_commandLine: "*://7*"
              - wildcard:
                  data_win_eventdata_commandLine: "*://8*"
              - wildcard:
                  data_win_eventdata_commandLine: "*://9*"
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_commandLine"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_commandLine: "*://7-*"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\bitsadmin.exe'; data_win_eventdata_originalFileName equals 'bitsadmin.exe';
  data_win_eventdata_commandLine matches '* /transfer *', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://blog.netspi.com/15-ways-to-download-a-file/#bitsadmin
  - https://isc.sans.edu/diary/22264
  - https://lolbas-project.github.io/lolbas/Binaries/Bitsadmin/
  - https://blog.talosintelligence.com/breaking-the-silence-recent-truebot-activity/
  - https://attack.mitre.org/techniques/T1197/
  - https://attack.mitre.org/techniques/T1036/003/

response:
  message: >
    Suspicious Download From Direct IP Via Bitsadmin detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1197, T1036.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1197
    - T1036.003
  custom_tags:
    - download
    - direct
    - bitsadmin
    - process_creation
    - sysmon
    - persistence
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.* \/[Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr] .*/ OR data_win_eventdata_commandLine:/.* \/[Cc][Rr][Ee][Aa][Tt][Ee] .*/ OR data_win_eventdata_commandLine:/.* \/[Aa][Dd][Dd][Ff][Ii][Ll][Ee] .*/) AND (data_win_eventdata_commandLine:/.*:\/\/1.*/ OR data_win_eventdata_commandLine:/.*:\/\/2.*/ OR data_win_eventdata_commandLine:/.*:\/\/3.*/ OR data_win_eventdata_commandLine:/.*:\/\/4.*/ OR data_win_eventdata_commandLine:/.*:\/\/5.*/ OR data_win_eventdata_commandLine:/.*:\/\/6.*/ OR data_win_eventdata_commandLine:/.*:\/\/7.*/ OR data_win_eventdata_commandLine:/.*:\/\/8.*/ OR data_win_eventdata_commandLine:/.*:\/\/9.*/) AND _exists_:data_win_eventdata_commandLine AND NOT (data_win_eventdata_commandLine:/.*:\/\/7-.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d059842b-6b9d-4ed1-b5c3-5b89143c6ede
    name: File Download Via Bitsadmin
    reason: Same bitsadmin transfer tradecraft in generic form; shows other download URLs used by the same actor
  - id: 2ddef153-167b-4e89-86b6-757a9e65dcac
    name: File Download Via Bitsadmin To A Suspicious Target Folder
    reason: Shows whether the IP-sourced payload was written to a staging folder such as Temp/Public
  - id: 5b80a791-ad9b-4b75-bcc1-ad4e1e89c200
    name: File With Suspicious Extension Downloaded Via Bitsadmin
    reason: Payload type (exe/dll/script) fetched from the raw IP
  - id: b9cbbc17-d00d-4e3d-a827-b06d03d2380d
    name: Monitoring For Persistence Via BITS
    reason: BITS jobs with a notify command line run the payload after download and persist
  - id: 025bd229-fd1f-4fdb-97ab-20006e1a5368
    name: Unusual File Download from Direct IP Address
    reason: Zone.Identifier stream for a file fetched from a raw IP corroborates the downloaded artifact
  - id: 9cc85849-3b02-4cb5-b371-3a1ff54f2218
    name: File Download From IP URL Via Curl.EXE
    reason: Actor falling back to curl against the same IP infrastructure
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Bitsadmin/BITS job activity (addfile, resume, complete, SetNotifyCmdLine)
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn].*(\/[Rr][Ee][Ss][Uu][Mm][Ee]|\/[Cc][Oo][Mm][Pp][Ll][Ee][Tt][Ee]|[Ss][Ee][Tt][Nn][Oo][Tt][Ii][Ff][Yy][Cc][Mm][Dd][Ll][Ii][Nn][Ee]|\/[Aa][Dd][Dd][Ff][Ii][Ll][Ee]).*/
    pivot_on:
    - host
    window: 2h
  - name: Executable or script dropped to a user-writable staging path
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\([Tt]emp|[Pp]ublic|[Pp]rogram[Dd]ata|[Aa]pp[Dd]ata)\\.*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Pp][Ss]1|[Bb][Aa][Tt]|[Vv][Bb][Ss]|[Jj][Ss]|[Ss][Cc][Rr])/
    pivot_on:
    - host
    window: 1h
  - name: Execution from staging paths launched by a shell or script host
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\([Pp]ower[Ss]hell|[Cc]md|[Ww]script|[Cc]script|[Mm]shta)\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Tt]emp|[Pp]ublic|[Pp]rogram[Dd]ata|[Aa]pp[Dd]ata)\\.*\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Network connections by download-capable LOLBins
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:/[Tt][Rr][Uu][Ee]/ AND data_win_eventdata_image:/.*\\([Bb]itsadmin|[Cc]ertutil|[Cc]url|[Pp]ower[Ss]hell)\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: Persistence via Run key or scheduled task after the download
    query: (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Cc]urrent[Vv]ersion\\[Rr]un.*/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Gg] [Aa][Dd][Dd].*\\[Rr][Uu][Nn].*/))
    pivot_on:
    - host
    window: 4h
