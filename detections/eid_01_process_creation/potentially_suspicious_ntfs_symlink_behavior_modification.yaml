name: Potentially Suspicious NTFS Symlink Behavior Modification
id: c0b2768a-dd06-4671-8339-b16ca8d1f27f
version: 1
schema_version: "1.0"
date: "2025-11-13"
author: frack113, The DFIR Report
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: c0b2768a-dd06-4671-8339-b16ca8d1f27f
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the modification of NTFS symbolic link behavior using fsutil, which
  could be used to enable remote to local or remote to remote symlinks for
  potential attacks. MITRE ATT&CK: T1059, T1222.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\cmd.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\powershell.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\pwsh.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "Cmd.Exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "PowerShell.EXE"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "pwsh.dll"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*fsutil*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*behavior*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*set*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*SymlinkEvaluation*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*R2L:1*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*R2R:1*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*L2L:1*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches '*\cmd.exe';
  data_win_eventdata_image matches '*\powershell.exe'; data_win_eventdata_image
  matches '*\pwsh.exe', among other conditions.

known_false_positives: >
  Legitimate usage, investigate the parent process and context to determine if
  benign. Baseline expected activity in your environment and tune this detection
  before relying on it for automated response.

references:
  - https://www.cybereason.com/blog/cybereason-vs.-blackcat-ransomware
  - https://learn.microsoft.com/fr-fr/windows-server/administration/windows-commands/fsutil-behavior
  - https://thedfirreport.com/2025/06/30/hide-your-rdp-password-spray-leads-to-ransomhub-deployment/
  - https://attack.mitre.org/techniques/T1059/
  - https://attack.mitre.org/techniques/T1222/001/

response:
  message: >
    Potentially Suspicious NTFS Symlink Behavior Modification detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1059, T1222.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059
    - T1222.001
  custom_tags:
    - symlink
    - behavior
    - process_creation
    - sysmon
    - execution
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Pp][Ww][Ss][Hh]\.[Dd][Ll][Ll]/) AND data_win_eventdata_commandLine:/.*[Ff][Ss][Uu][Tt][Ii][Ll].*/ AND data_win_eventdata_commandLine:/.*[Bb][Ee][Hh][Aa][Vv][Ii][Oo][Rr].*/ AND data_win_eventdata_commandLine:/.*[Ss][Ee][Tt].*/ AND data_win_eventdata_commandLine:/.*[Ss][Yy][Mm][Ll][Ii][Nn][Kk][Ee][Vv][Aa][Ll][Uu][Aa][Tt][Ii][Oo][Nn].*/ AND (data_win_eventdata_commandLine:/.*[Rr]2[Ll]:1.*/ OR data_win_eventdata_commandLine:/.*[Rr]2[Rr]:1.*/ OR data_win_eventdata_commandLine:/.*[Ll]2[Ll]:1.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: add64136-62e5-48ea-807e-88638d02df1e
    name: Fsutil Suspicious Invocation
    reason: Other fsutil abuse on the same host shows broader filesystem tampering.
  - id: 40b19fa6-d835-400c-b301-41f3a2baacaf
    name: VolumeShadowCopy Symlink Creation Via Mklink
    reason: Once symlinks are enabled, mklink links into shadow copies for credential-file theft.
  - id: c73124a7-3e89-44a3-bdc1-25fe4df754b1
    name: Copy From VolumeShadowCopy Via Cmd.EXE
    reason: Follow-on theft of SAM/NTDS from shadow copies reached via symlink.
  - id: 7e6237fe-3ddb-438f-9381-9bf9de5af8d0
    name: Windows Internet Hosted WebDav Share Mount Via Net.EXE
    reason: Remote-to-local symlinks target remote shares; a WebDAV mount is a typical remote side.
  - id: 855bc8b5-2ae8-402e-a9ed-b889e6df1900
    name: Copy From Or To Admin Share Or Sysvol Folder
    reason: Remote-to-remote symlink enablement precedes file staging over admin shares during ransomware lateral movement.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Symlink creation via mklink or New-Item
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Mm][Kk][Ll][Ii][Nn][Kk]|[Nn]ew-[Ii]tem.*[Ss]ymbolic).*/
    pivot_on: host
    window: 4h
  - name: Other fsutil invocations
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Ff][Ss][Uu][Tt][Ii][Ll])\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 4h
  - name: Shadow copy and backup destruction commands
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Vv]ssadmin.*[Dd]elete|[Ww]badmin.*[Dd]elete|[Bb]cdedit.*[Rr]ecoveryenabled|[Ss]hadowcopy.*[Dd]elete).*/
    pivot_on: host
    window: 4h
  - name: Network share and UNC path access
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Nn]et1? +use|\\\\[A-Za-z0-9.-]+\\[A-Za-z0-9$]+|[Dd]avwwwroot).*/
    pivot_on: host
    window: 4h
