name: Potential Signing Bypass Via Windows Developer Features
id: a383dec4-deec-4e6e-913b-ed9249670848
version: 1
schema_version: "1.0"
date: "2023-01-11"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: a383dec4-deec-4e6e-913b-ed9249670848
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects when a user enable developer features such as "Developer Mode" or
  "Application Sideloading". Which allows the user to install untrusted
  packages.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\SystemSettingsAdminFlows.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "SystemSettingsAdminFlows.EXE"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*TurnOnDeveloperFeatures*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*DeveloperUnlock*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*EnableSideloading*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\SystemSettingsAdminFlows.exe'; data_win_eventdata_originalFileName equals
  'SystemSettingsAdminFlows.EXE'; data_win_eventdata_commandLine matches
  '*TurnOnDeveloperFeatures*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - Internal Research
  - https://www.sentinelone.com/labs/inside-malicious-windows-apps-for-malware-deployment/

response:
  message: >
    Potential Signing Bypass Via Windows Developer Features detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  custom_tags:
    - signing
    - bypass
    - developer
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ss][Yy][Ss][Tt][Ee][Mm][Ss][Ee][Tt][Tt][Ii][Nn][Gg][Ss][Aa][Dd][Mm][Ii][Nn][Ff][Ll][Oo][Ww][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ss][Yy][Ss][Tt][Ee][Mm][Ss][Ee][Tt][Tt][Ii][Nn][Gg][Ss][Aa][Dd][Mm][Ii][Nn][Ff][Ll][Oo][Ww][Ss]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Tt][Uu][Rr][Nn][Oo][Nn][Dd][Ee][Vv][Ee][Ll][Oo][Pp][Ee][Rr][Ff][Ee][Aa][Tt][Uu][Rr][Ee][Ss].*/ AND (data_win_eventdata_commandLine:/.*[Dd][Ee][Vv][Ee][Ll][Oo][Pp][Ee][Rr][Uu][Nn][Ll][Oo][Cc][Kk].*/ OR data_win_eventdata_commandLine:/.*[Ee][Nn][Aa][Bb][Ll][Ee][Ss][Ii][Dd][Ee][Ll][Oo][Aa][Dd][Ii][Nn][Gg].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b110ebaf-697f-4da1-afd5-b536fa27a2c1
    name: Potential Signing Bypass Via Windows Developer Features - Registry
    reason: Enabling developer mode writes the AllowAllTrustedApps/AllowDevelopmentWithoutDevLicense registry values; confirms the change applied.
  - id: 37651c2a-42cd-4a69-ae0d-22a4349aa04a
    name: Unsigned AppX Installation Attempt Using Add-AppxPackage
    reason: The purpose of unlocking developer features is to install unsigned packages; this is the typical next step.
  - id: 975b2262-9a49-439d-92a6-0709cccdf0b2
    name: Unsigned AppX Installation Attempt Using Add-AppxPackage - PsScript
    reason: Script-block view of the same unsigned package sideload following developer unlock.
  - id: 7cff77e1-9663-46a3-8260-17f2e1aa9d0a
    name: AppX Package Installation Attempts Via AppInstaller.EXE
    reason: Alternate sideload path (remote package fetch) used once signing enforcement is relaxed.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Developer mode registry changes
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*(AppModelUnlock|AllowAllTrustedApps|AllowDevelopmentWithoutDevLicense).*/
    pivot_on: host
    window: 4h
  - name: AppX package install activity
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*([Aa]dd-[Aa]ppx[Pp]ackage|[Aa]ppinstaller|\.msix|\.appx).*/
    pivot_on: host
    window: 4h
  - name: Package file creation
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\.(msix|appx|msixbundle|appxbundle)/
    pivot_on: host
    window: 4h
  - name: Settings admin flow launches
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Ss]ystem[Ss]ettings[Aa]dmin[Ff]lows\.exe/
    pivot_on: user
    window: 24h
