name: DLL Execution Via Register-cimprovider.exe
id: a2910908-e86f-4687-aeba-76a5f996e652
version: 1
schema_version: "1.0"
date: "2021-11-27"
author: Ivan Dyachkov, Yulia Fomina, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: a2910908-e86f-4687-aeba-76a5f996e652
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects using register-cimprovider.exe to execute arbitrary dll file. MITRE
  ATT&CK: T1574.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\register-cimprovider.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*-path*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*dll*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\register-cimprovider.exe'; data_win_eventdata_commandLine matches
  '*-path*'; data_win_eventdata_commandLine matches '*dll*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/PhilipTsukerman/status/992021361106268161
  - https://lolbas-project.github.io/lolbas/Binaries/Register-cimprovider/
  - https://attack.mitre.org/techniques/T1574/

response:
  message: >
    DLL Execution Via Register-cimprovider.exe detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1574
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574
  custom_tags:
    - register
    - cimprovider
    - process_creation
    - sysmon
    - privilege_escalation
    - persistence
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Rr][Ee][Gg][Ii][Ss][Tt][Ee][Rr]-[Cc][Ii][Mm][Pp][Rr][Oo][Vv][Ii][Dd][Ee][Rr]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*-[Pp][Aa][Tt][Hh].*/ AND data_win_eventdata_commandLine:/.*[Dd][Ll][Ll].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: All register-cimprovider executions (register/unregister)
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Rr][Ee][Gg][Ii][Ss][Tt][Ee][Rr]\-[Cc][Ii][Mm][Pp][Rr][Oo][Vv][Ii][Dd][Ee][Rr]\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 2h
  - name: DLL files dropped in user-writable paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.[Dd][Ll][Ll]/ AND (data_win_eventdata_targetFilename:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/)
    pivot_on:
    - host
    window: 2h
  - name: Non-system DLL loaded into WMI provider host
    query: data_win_system_eventID:"7" AND data_win_eventdata_image:/.*\\([Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee]\.[Ee][Xx][Ee]|[Rr][Ee][Gg][Ii][Ss][Tt][Ee][Rr]\-[Cc][Ii][Mm][Pp][Rr][Oo][Vv][Ii][Dd][Ee][Rr]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_imageLoaded:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/)
    pivot_on:
    - host
    window: 2h
  - name: Child processes of WmiPrvSE or register-cimprovider
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\([Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee]\.[Ee][Xx][Ee]|[Rr][Ee][Gg][Ii][Ss][Tt][Ee][Rr]\-[Cc][Ii][Mm][Pp][Rr][Oo][Vv][Ii][Dd][Ee][Rr]\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 2h
  - name: WMI provider registration registry changes
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:/.*\\[Ww][Bb][Ee][Mm]\\.*/ OR data_win_eventdata_targetObject:/.*[Cc][Ii][Mm][Oo][Mm].*/)
    pivot_on:
    - host
    window: 4h
