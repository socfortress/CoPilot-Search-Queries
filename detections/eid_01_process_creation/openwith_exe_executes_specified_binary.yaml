name: OpenWith.exe Executes Specified Binary
id: cec8e918-30f7-4e2d-9bfa-a59cc97ae60f
version: 1
schema_version: "1.0"
date: "2021-11-27"
author: Beyu Denis, oscd.community (rule), @harr0ey (idea)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: cec8e918-30f7-4e2d-9bfa-a59cc97ae60f
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  The OpenWith.exe executes other binary. MITRE ATT&CK: T1218.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\OpenWith.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*/c*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\OpenWith.exe'; data_win_eventdata_commandLine matches '*/c*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/LOLBAS-Project/LOLBAS/blob/4db780e0f0b2e2bb8cb1fa13e09196da9b9f1834/yml/LOLUtilz/OSBinaries/Openwith.yml
  - https://twitter.com/harr0ey/status/991670870384021504
  - https://attack.mitre.org/techniques/T1218/

response:
  message: >
    OpenWith.exe Executes Specified Binary detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1218
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218
  custom_tags:
    - openwith
    - executes
    - specified
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Oo][Pp][Ee][Nn][Ww][Ii][Tt][Hh]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*\/[Cc].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d4ca7c59-e9e4-42d8-bf57-91a776efcb87
    name: LOLBIN Execution From Abnormal Drive
    reason: OpenWith proxy execution is LOLBIN abuse; the same operator often launches other LOLBINs from odd paths or drives.
  - id: e593cf51-88db-4ee1-b920-37e89012a3c9
    name: Potentially Suspicious Rundll32 Activity
    reason: Operators chain OpenWith with other signed-binary proxies such as rundll32 to run the payload.
  - id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
    name: PowerShell Download and Execution Cradles
    reason: The binary OpenWith launches is frequently a payload fetched by a PowerShell cradle just before.
  - id: 81325ce1-be01-4250-944f-b4789644556f
    name: Schedule Task Creation From Env Variable Or Potentially Suspicious Path Via Schtasks.EXE
    reason: Persistence for the launched binary commonly follows via a scheduled task.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other signed-binary proxy executions
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*\\([Rr]undll32|[Mm]shta|[Rr]egsvr32|[Cc]ertutil|[Bb]itsadmin|[Ff]orfiles|[Pp]calua)\.exe/
    pivot_on: host
    window: 2h
  - name: Children spawned by OpenWith
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Oo]pen[Ww]ith\.exe/
    pivot_on: host
    window: 1h
  - name: Download tooling and cradles
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*([Ii]nvoke-[Ww]eb[Rr]equest|[Dd]ownload[Ss]tring|urlcache|\/transfer|[Cc]url.*http).*/
    pivot_on: host
    window: 2h
  - name: Persistence via schtasks or Run keys
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*[Ss]chtasks.*\/[Cc]reate.*/ OR data_win_eventdata_commandLine:/.*[Cc]urrent[Vv]ersion\\[Rr]un.*/)
    pivot_on: host
    window: 4h
