name: Potentially Suspicious Electron Application CommandLine
id: 378a05d8-963c-46c9-bcce-13c7657eac99
version: 1
schema_version: "1.0"
date: "2023-11-09"
author: frack113, Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 378a05d8-963c-46c9-bcce-13c7657eac99
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potentially suspicious CommandLine of electron apps (teams, discord,
  slack, etc.). This could be a sign of abuse to proxy execution through a
  signed binary.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\chrome.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\code.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\discord.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\GitHubDesktop.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\keybase.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\msedge_proxy.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\msedge.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\msedgewebview2.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\msteams.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\slack.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\Teams.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "chrome.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "code.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "discord.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "GitHubDesktop.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "keybase.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "msedge_proxy.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "msedge.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "msedgewebview2.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "msteams.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "slack.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "Teams.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*--browser-subprocess-path*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*--gpu-launcher*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*--renderer-cmd-prefix*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*--utility-cmd-prefix*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\chrome.exe'; data_win_eventdata_image matches '*\code.exe';
  data_win_eventdata_image matches '*\discord.exe', among other conditions.

known_false_positives: >
  Legitimate usage for debugging purposes. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://positive.security/blog/ms-officecmd-rce
  - https://lolbas-project.github.io/lolbas/Binaries/Teams/
  - https://lolbas-project.github.io/lolbas/Binaries/Msedge/
  - https://lolbas-project.github.io/lolbas/Binaries/msedgewebview2/
  - https://medium.com/@MalFuzzer/one-electron-to-rule-them-all-dc2e9b263daf
  - https://chromium.googlesource.com/chromium/chromium/+/master/content/public/common/content_switches.cc

response:
  message: >
    Potentially Suspicious Electron Application CommandLine detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  custom_tags:
    - electron
    - application
    - process_creation
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Cc][Hh][Rr][Oo][Mm][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Oo][Dd][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Dd][Ii][Ss][Cc][Oo][Rr][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Gg][Ii][Tt][Hh][Uu][Bb][Dd][Ee][Ss][Kk][Tt][Oo][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Kk][Ee][Yy][Bb][Aa][Ss][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Ee][Dd][Gg][Ee]_[Pp][Rr][Oo][Xx][Yy]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Ee][Dd][Gg][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Ee][Dd][Gg][Ee][Ww][Ee][Bb][Vv][Ii][Ee][Ww]2\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Tt][Ee][Aa][Mm][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ss][Ll][Aa][Cc][Kk]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Tt][Ee][Aa][Mm][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Cc][Hh][Rr][Oo][Mm][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Cc][Oo][Dd][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Dd][Ii][Ss][Cc][Oo][Rr][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Gg][Ii][Tt][Hh][Uu][Bb][Dd][Ee][Ss][Kk][Tt][Oo][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Kk][Ee][Yy][Bb][Aa][Ss][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Mm][Ss][Ee][Dd][Gg][Ee]_[Pp][Rr][Oo][Xx][Yy]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Mm][Ss][Ee][Dd][Gg][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Mm][Ss][Ee][Dd][Gg][Ee][Ww][Ee][Bb][Vv][Ii][Ee][Ww]2\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Mm][Ss][Tt][Ee][Aa][Mm][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ss][Ll][Aa][Cc][Kk]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Tt][Ee][Aa][Mm][Ss]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*--[Bb][Rr][Oo][Ww][Ss][Ee][Rr]-[Ss][Uu][Bb][Pp][Rr][Oo][Cc][Ee][Ss][Ss]-[Pp][Aa][Tt][Hh].*/ OR data_win_eventdata_commandLine:/.*--[Gg][Pp][Uu]-[Ll][Aa][Uu][Nn][Cc][Hh][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*--[Rr][Ee][Nn][Dd][Ee][Rr][Ee][Rr]-[Cc][Mm][Dd]-[Pp][Rr][Ee][Ff][Ii][Xx].*/ OR data_win_eventdata_commandLine:/.*--[Uu][Tt][Ii][Ll][Ii][Tt][Yy]-[Cc][Mm][Dd]-[Pp][Rr][Ee][Ff][Ii][Xx].*/)

correlation:
  # Authored by the correlation engine for review.
  enrichment_searches:
  # NEW ad-hoc searches the engine runs around an alert from this rule, scoped to
  # the alert's host/user/IP within the window (not existing CoPilot Searches).
    - name: "Sysmon activity on this host in the window"
      query: 'data_win_system_channel:"Microsoft-Windows-Sysmon/Operational"'
      pivot_on: [host]
      window: 1h
    - name: "Process creation on this host"
      query: 'data_win_system_eventID:"1"'
      pivot_on: [host]
      window: 1h
    - name: "Network connections from this host"
      query: 'data_win_system_eventID:"3"'
      pivot_on: [host]
      window: 1h
    - name: "High-severity alerts on this host"
      query: 'rule_level:>=10'
      pivot_on: [host]
      window: 1h
