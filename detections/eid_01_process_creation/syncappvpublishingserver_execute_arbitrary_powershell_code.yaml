name: SyncAppvPublishingServer Execute Arbitrary PowerShell Code
id: fbd7c32d-db2a-4418-b92c-566eb8911133
version: 1
schema_version: "1.0"
date: "2022-10-04"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: fbd7c32d-db2a-4418-b92c-566eb8911133
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Executes arbitrary PowerShell code using SyncAppvPublishingServer.exe. MITRE
  ATT&CK: T1218.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\SyncAppvPublishingServer.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "syncappvpublishingserver.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*\"n; *"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\SyncAppvPublishingServer.exe'; data_win_eventdata_originalFileName equals
  'syncappvpublishingserver.exe'; data_win_eventdata_commandLine matches '*"n;
  *'.

known_false_positives: >
  App-V clients. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1218/T1218.md
  - https://lolbas-project.github.io/lolbas/Binaries/Syncappvpublishingserver/
  - https://attack.mitre.org/techniques/T1218/

response:
  message: >
    SyncAppvPublishingServer Execute Arbitrary PowerShell Code detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1218
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218
  custom_tags:
    - syncappvpublishingserver
    - execute
    - arbitrary
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ss][Yy][Nn][Cc][Aa][Pp][Pp][Vv][Pp][Uu][Bb][Ll][Ii][Ss][Hh][Ii][Nn][Gg][Ss][Ee][Rr][Vv][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ss][Yy][Nn][Cc][Aa][Pp][Pp][Vv][Pp][Uu][Bb][Ll][Ii][Ss][Hh][Ii][Nn][Gg][Ss][Ee][Rr][Vv][Ee][Rr]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*\"[Nn]; .*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 36475a7d-0f6d-4dce-9b01-6aeb473bbaf1
    name: SyncAppvPublishingServer VBS Execute Arbitrary PowerShell Code
    reason: Same App-V proxy-execution trick via the .vbs wrapper; either variant on the host shows the same actor trying both.
  - id: 9c7e131a-0f2c-4ae0-9d43-b04f4e266d43
    name: Uncommon Child Process Of Appvlp.EXE
    reason: Appvlp.exe is the sibling App-V LOLBin; uncommon children there indicate the same proxy-execution family.
  - id: e32d4572-9826-4738-b651-95fa63747e8a
    name: Base64 Encoded PowerShell Command Detected
    reason: The PowerShell payload run through SyncAppv is frequently base64-encoded; this is the direct follow-on.
  - id: 9be56c82-b1cc-4318-87eb-d138afaaca39
    name: Malicious PowerShell Process - Execution Policy Bypass
    reason: Execution-policy bypass flags commonly accompany the payload launched via this LOLBin.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: PowerShell spawned from App-V or script-host parents
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee])/ AND data_win_eventdata_parentImage:/.*([Ss][Yy][Nn][Cc][Aa][Pp][Pp][Vv]|[Aa][Pp][Pp][Vv][Ll][Pp]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]).*/
    pivot_on: host
    window: 1h
  - name: PowerShell download cradles and encoded commands
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee])/ AND data_win_eventdata_commandLine:/.*([Ff][Rr][Oo][Mm][Bb][Aa][Ss][Ee]64|-[Ee][Nn][Cc]|[Ii][Ee][Xx]|[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd]|[Nn][Ee][Tt]\.[Ww][Ee][Bb][Cc][Ll][Ii][Ee][Nn][Tt]|[Hh][Ii][Dd][Dd][Ee][Nn]).*/
    pivot_on: host
    window: 2h
  - name: PowerShell outbound network connections
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 2h
  - name: PowerShell dropping executables or scripts
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee])/ AND data_win_eventdata_targetFilename:/.*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Pp][Ss]1|[Bb][Aa][Tt]|[Vv][Bb][Ss]|[Jj][Ss])/
    pivot_on: host
    window: 4h
