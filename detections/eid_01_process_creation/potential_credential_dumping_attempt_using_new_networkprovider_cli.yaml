name: Potential Credential Dumping Attempt Using New NetworkProvider - CLI
id: baef1ec6-2ca9-47a3-97cc-4cf2bda10b77
version: 1
schema_version: "1.0"
date: "2023-02-02"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: baef1ec6-2ca9-47a3-97cc-4cf2bda10b77
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects when an attacker tries to add a new network provider in order to dump
  clear text credentials, similar to how the NPPSpy tool does it. MITRE ATT&CK:
  T1003.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*\\\\System\\\\CurrentControlSet\\\\Services\\\\*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*\\\\NetworkProvider*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*\System\CurrentControlSet\Services\*'; data_win_eventdata_commandLine
  matches '*\NetworkProvider*'.

known_false_positives: >
  Other legitimate network providers used and not filtred in this rule. Baseline
  expected activity in your environment and tune this detection before relying
  on it for automated response.

references:
  - https://learn.microsoft.com/en-us/troubleshoot/windows-client/setup-upgrade-and-drivers/network-provider-settings-removed-in-place-upgrade
  - https://github.com/gtworek/PSBits/tree/master/PasswordStealing/NPPSpy
  - https://attack.mitre.org/techniques/T1003/

response:
  message: >
    Potential Credential Dumping Attempt Using New NetworkProvider - CLI
    detected on host $agent_name$. Matched data_win_eventdata_commandLine:
    $data_win_eventdata_commandLine$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003
  custom_tags:
    - credential
    - dumping
    - networkprovider
    - process_creation
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*\\[Ss][Yy][Ss][Tt][Ee][Mm]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt]\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\.*/ AND data_win_eventdata_commandLine:/.*\\[Nn][Ee][Tt][Ww][Oo][Rr][Kk][Pp][Rr][Oo][Vv][Ii][Dd][Ee][Rr].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 8c0eca51-0f88-4db2-9183-fdfb10c703f9
    name: LSA PPL Protection Setting Modification via CommandLine
    reason: Credential-theft prep commonly weakens LSA protection around the same registry work
  - id: fd877b94-9bb5-4191-bb25-d79cbd93c167
    name: Dumping of Sensitive Hives Via Reg.EXE
    reason: Same reg.exe tooling used to harvest SAM/SECURITY hives as an alternative credential source
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: Parallel credential theft tooling by the same operator
  - id: e0b0c2ab-3d52-46d9-8cb7-049dc775fbd1
    name: Enumeration for Credentials in Registry
    reason: Registry credential hunting accompanies registry-based persistence of a credential harvester
  - id: cc1abf27-78a3-4ac5-a51c-f3070b1d8e40
    name: Registry Export of Third-Party Credentials
    reason: Related registry credential collection from the same host
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: NetworkProvider registry writes
    query: data_win_system_eventID:(12 OR 13 OR 14) AND data_win_eventdata_targetObject:*NetworkProvider*
    pivot_on: host
    window: 4h
  - name: Provider order modification
    query: data_win_system_eventID:(12 OR 13) AND data_win_eventdata_targetObject:(*ProviderOrder* OR *HwOrder*)
    pivot_on: host
    window: 4h
  - name: Unsigned DLL loaded by logon processes
    query: data_win_system_eventID:7 AND data_win_eventdata_image:(/.*\\winlogon\.exe/ OR /.*\\mpnotify\.exe/) AND data_win_eventdata_signed:false
    pivot_on: host
    window: 4h
  - name: NPPSpy-style files written
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*[Nn][Pp][Pp][Ss][Pp][Yy].*/
    pivot_on: host
    window: 24h
  - name: Registry tools editing Services keys
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Rr]eg(\.exe)? +add.*[Ss]ervices.*/ OR /.*[Nn]ew-[Ii]tem[Pp]roperty.*[Ss]ervices.*/)
    pivot_on: host
    window: 4h
