name: Suspicious Git Clone
id: aef9d1f1-7396-4e92-a927-4567c7a495c1
version: 1
schema_version: "1.0"
date: "2023-01-10"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: aef9d1f1-7396-4e92-a927-4567c7a495c1
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of "git" in order to clone a remote repository that contain
  suspicious keywords which might be suspicious. MITRE ATT&CK: T1593.003.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\git.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\git-remote-https.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "git.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* clone *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*git-remote-https *"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*exploit*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Vulns*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*vulnerability*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*RemoteCodeExecution*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Invoke-*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*CVE-*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*poc-*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*ProofOfConcept*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*proxyshell*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*log4shell*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*eternalblue*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*eternal-blue*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*MS17-*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches '*\git.exe';
  data_win_eventdata_image matches '*\git-remote-https.exe';
  data_win_eventdata_originalFileName equals 'git.exe', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://gist.githubusercontent.com/MichaelKoczwara/12faba9c061c12b5814b711166de8c2f/raw/e2068486692897b620c25fde1ea258c8218fe3d3/history.txt
  - https://attack.mitre.org/techniques/T1593/003/

response:
  message: >
    Suspicious Git Clone detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1593.003
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1593.003
  custom_tags:
    - clone
    - process_creation
    - sysmon
    - reconnaissance
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Gg][Ii][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Gg][Ii][Tt]-[Rr][Ee][Mm][Oo][Tt][Ee]-[Hh][Tt][Tt][Pp][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Gg][Ii][Tt]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.* [Cc][Ll][Oo][Nn][Ee] .*/ OR data_win_eventdata_commandLine:/.*[Gg][Ii][Tt]-[Rr][Ee][Mm][Oo][Tt][Ee]-[Hh][Tt][Tt][Pp][Ss] .*/) AND (data_win_eventdata_commandLine:/.*[Ee][Xx][Pp][Ll][Oo][Ii][Tt].*/ OR data_win_eventdata_commandLine:/.*[Vv][Uu][Ll][Nn][Ss].*/ OR data_win_eventdata_commandLine:/.*[Vv][Uu][Ll][Nn][Ee][Rr][Aa][Bb][Ii][Ll][Ii][Tt][Yy].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Mm][Oo][Tt][Ee][Cc][Oo][Dd][Ee][Ee][Xx][Ee][Cc][Uu][Tt][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-.*/ OR data_win_eventdata_commandLine:/.*[Cc][Vv][Ee]-.*/ OR data_win_eventdata_commandLine:/.*[Pp][Oo][Cc]-.*/ OR data_win_eventdata_commandLine:/.*[Pp][Rr][Oo][Oo][Ff][Oo][Ff][Cc][Oo][Nn][Cc][Ee][Pp][Tt].*/ OR data_win_eventdata_commandLine:/.*[Pp][Rr][Oo][Xx][Yy][Ss][Hh][Ee][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Ll][Oo][Gg]4[Ss][Hh][Ee][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Ee][Tt][Ee][Rr][Nn][Aa][Ll][Bb][Ll][Uu][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ee][Tt][Ee][Rr][Nn][Aa][Ll]-[Bb][Ll][Uu][Ee].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ss]17-.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 5bac7a56-da88-4c27-922e-c81e113b20cb
    name: Github Self-Hosted Runner Execution
    reason: GitHub self-hosted runner on an endpoint is another route for staging attacker tooling from GitHub.
  - id: 21dd6d38-2b18-4453-9404-a0fe4a0cc288
    name: Curl Download And Execute Combination
    reason: Curl download-and-execute is an alternative fetch path for the same exploit tooling.
  - id: d059842b-6b9d-4ed1-b5c3-5b89143c6ede
    name: File Download Via Bitsadmin
    reason: Bitsadmin download is a parallel tool-fetch method.
  - id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
    name: PowerShell Download and Execution Cradles
    reason: PowerShell cradles often accompany cloned PoC use.
  - id: 50a0aa3d-ab16-4594-a8aa-5145a6e6792b
    name: Python One-Liners with Base64 Decoding
    reason: Python one-liners commonly run cloned PoC scripts.
  - id: 7d1aaf3d-4304-425c-b7c3-162055e0b3ab
    name: Potential Data Exfiltration Activity Via CommandLine Tools
    reason: Data exfiltration via command-line tools may follow exploitation.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Python, Java, node runs after clone
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Pp][Yy][Tt][Hh][Oo][Nn]\.[Ee][Xx][Ee]|\\[Pp][Yy][Tt][Hh][Oo][Nn]3\.[Ee][Xx][Ee]|\\[Jj][Aa][Vv][Aa]\.[Ee][Xx][Ee]|\\[Nn][Oo][Dd][Ee]\.[Ee][Xx][Ee]|\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 4h
  - name: Exploit-tool keywords in command lines
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ee][Xx][Pp][Ll][Oo][Ii][Tt].*/ OR data_win_eventdata_commandLine:/.*[Pp][Oo][Cc]-.*/ OR data_win_eventdata_commandLine:/.*[Cc][Vv][Ee]-.*/ OR data_win_eventdata_commandLine:/.*[Yy][Ss][Oo][Ss][Ee][Rr][Ii][Aa][Ll].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz].*/ OR data_win_eventdata_commandLine:/.*[Pp][Rr][Oo][Xx][Yy][Ss][Hh][Ee][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Ll][Oo][Gg]4[Ss][Hh][Ee][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ss][Ff][Vv][Ee][Nn][Oo][Mm].*/)
    pivot_on: host
    window: 4h
  - name: Reconnaissance commands
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Ww][Hh][Oo][Aa][Mm][Ii]\.[Ee][Xx][Ee]|\\[Nn][Ee][Tt]\.[Ee][Xx][Ee]|\\[Nn][Ee][Tt]1\.[Ee][Xx][Ee]|\\[Nn][Ll][Tt][Ee][Ss][Tt]\.[Ee][Xx][Ee]|\\[Ii][Pp][Cc][Oo][Nn][Ff][Ii][Gg]\.[Ee][Xx][Ee]|\\[Ss][Yy][Ss][Tt][Ee][Mm][Ii][Nn][Ff][Oo]\.[Ee][Xx][Ee]|\\[Aa][Rr][Pp]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 2h
  - name: Connections by git and script interpreters
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*(\\[Gg][Ii][Tt]\.[Ee][Xx][Ee]|\\[Gg][Ii][Tt]-[Rr][Ee][Mm][Oo][Tt][Ee]-[Hh][Tt][Tt][Pp][Ss]\.[Ee][Xx][Ee]|\\[Pp][Yy][Tt][Hh][Oo][Nn]\.[Ee][Xx][Ee]|\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 2h
  - name: Other download tools
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]|\\[Ww][Gg][Ee][Tt]\.[Ee][Xx][Ee]|\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]|\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 4h
