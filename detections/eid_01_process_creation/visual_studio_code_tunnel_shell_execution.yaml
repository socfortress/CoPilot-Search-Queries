name: Visual Studio Code Tunnel Shell Execution
id: f4a623c2-4ef5-4c33-b811-0642f702c9f1
version: 1
schema_version: "1.0"
date: "2023-10-25"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: f4a623c2-4ef5-4c33-b811-0642f702c9f1
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of a shell (powershell, bash, wsl...) via Visual Studio
  Code tunnel. Attackers can abuse this functionality to establish a C2 channel
  and execute arbitrary commands on the system. MITRE ATT&CK: T1071.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_parentImage:
              value: "*\\\\servers\\\\Stable-*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_parentImage:
              value: "*\\\\server\\\\node.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_parentCommandLine:
              value: "*.vscode-server*"
              case_insensitive: true
        - bool:
            should:
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\powershell.exe"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\pwsh.exe"
                                case_insensitive: true
                        minimum_should_match: 1
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*\\\\terminal\\\\browser\\\\media\\\\shellIntegration.ps1*"
                          case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\wsl.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\bash.exe"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_parentCommandLine
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\servers\Stable-*'; data_win_eventdata_parentImage matches
  '*\server\node.exe'; data_win_eventdata_parentCommandLine matches
  '*.vscode-server*', among other conditions.

known_false_positives: >
  Legitimate use of Visual Studio Code tunnel and running code from there.
  Baseline expected activity in your environment and tune this detection before
  relying on it for automated response.

references:
  - https://ipfyx.fr/post/visual-studio-code-tunnel/
  - https://badoption.eu/blog/2023/01/31/code_c2.html
  - https://code.visualstudio.com/docs/remote/tunnels
  - https://attack.mitre.org/techniques/T1071/001/

response:
  message: >
    Visual Studio Code Tunnel Shell Execution detected on host $agent_name$.
    Matched data_win_eventdata_parentImage: $data_win_eventdata_parentImage$.
    Matched data_win_eventdata_parentCommandLine:
    $data_win_eventdata_parentCommandLine$. MITRE ATT&CK: T1071.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_parentCommandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1071.001
  custom_tags:
    - visual
    - studio
    - tunnel
    - process_creation
    - sysmon
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ss][Ee][Rr][Vv][Ee][Rr][Ss]\\[Ss][Tt][Aa][Bb][Ll][Ee]-.*/ AND data_win_eventdata_parentImage:/.*\\[Ss][Ee][Rr][Vv][Ee][Rr]\\[Nn][Oo][Dd][Ee]\.[Ee][Xx][Ee]/ AND data_win_eventdata_parentCommandLine:/.*\.[Vv][Ss][Cc][Oo][Dd][Ee]-[Ss][Ee][Rr][Vv][Ee][Rr].*/ AND (((data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*\\[Tt][Ee][Rr][Mm][Ii][Nn][Aa][Ll]\\[Bb][Rr][Oo][Ww][Ss][Ee][Rr]\\[Mm][Ee][Dd][Ii][Aa]\\[Ss][Hh][Ee][Ll][Ll][Ii][Nn][Tt][Ee][Gg][Rr][Aa][Tt][Ii][Oo][Nn]\.[Pp][Ss]1.*/) OR data_win_eventdata_image:/.*\\[Ww][Ss][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Bb][Aa][Ss][Hh]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 5a3164f2-b373-4152-93cf-090b13c12d27
    name: Potentially Suspicious Child Process Of VsCode
    reason: Other suspicious VS Code children on the host show what the remote operator ran.
  - id: 2cf29f11-e356-4f61-98c0-1bdb9393d6da
    name: Renamed Visual Studio Code Tunnel Execution
    reason: A renamed tunnel binary explains how the tunnel was established undetected.
  - id: 17a1be64-8d88-40bf-b5ff-a4f7a50ebcc8
    name: Suspicious New Service Creation
    reason: Operators install services from the tunnelled shell for persistence.
  - id: e37db05d-d1f9-49c8-b464-cee1a4b11638
    name: PUA - Rclone Execution
    reason: Rclone from the tunnelled shell indicates exfiltration after access.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: VS Code CLI tunnel/serve-web invocations
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Cc][Oo][Dd][Ee](\.[Ee][Xx][Ee])?"? ([Tt][Uu][Nn][Nn][Ee][Ll]|[Ss][Ee][Rr][Vv][Ee]-[Ww][Ee][Bb]).*/
    pivot_on: host
    window: 24h
  - name: Recon and download commands under VS Code server
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentCommandLine:/.*\.[Vv][Ss][Cc][Oo][Dd][Ee]-[Ss][Ee][Rr][Vv][Ee][Rr].*/ AND data_win_eventdata_commandLine:/.*([Ww][Hh][Oo][Aa][Mm][Ii]|[Nn][Ee][Tt] [Uu][Ss][Ee][Rr]|[Nn][Ll][Tt][Ee][Ss][Tt]|[Ii][Pp][Cc][Oo][Nn][Ff][Ii][Gg]|[Cc][Uu][Rr][Ll]|[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]|[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt]).*/
    pivot_on: host
    window: 4h
  - name: Outbound HTTPS by code CLI
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\[Cc][Oo][Dd][Ee](-[Tt][Uu][Nn][Nn][Ee][Ll])?\.[Ee][Xx][Ee]/ AND data_win_eventdata_destinationPort:"443"
    pivot_on: host
    window: 6h
  - name: DNS lookups of VS Code tunnel relay domains
    query: data_win_system_eventID:"22" AND data_win_eventdata_queryName:/.*([Dd][Ee][Vv][Tt][Uu][Nn][Nn][Ee][Ll][Ss]\.[Mm][Ss]|[Tt][Uu][Nn][Nn][Ee][Ll][Ss]\.[Aa][Pp][Ii]\.[Vv][Ii][Ss][Uu][Aa][Ll][Ss][Tt][Uu][Dd][Ii][Oo]\.[Cc][Oo][Mm]).*/
    pivot_on: host
    window: 6h
  - name: VS Code CLI / tunnel log / server artefacts written
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Tt][Uu][Nn][Nn][Ee][Ll]-[Ss][Ee][Rr][Vv][Ii][Cc][Ee]\.[Ll][Oo][Gg].*/ OR data_win_eventdata_targetFilename:/.*[Cc][Oo][Dd][Ee]_[Cc][Ll][Ii].*/ OR data_win_eventdata_targetFilename:/.*\.[Vv][Ss][Cc][Oo][Dd][Ee]-[Ss][Ee][Rr][Vv][Ee][Rr].*/)
    pivot_on: host
    window: 24h
