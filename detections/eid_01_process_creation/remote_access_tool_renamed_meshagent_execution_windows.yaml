name: Remote Access Tool - Renamed MeshAgent Execution - Windows
id: b471f462-eb0d-4832-be35-28d94bdb4780
version: 1
schema_version: "1.0"
date: "2025-05-19"
author: Norbert Jaśniewicz (AlphaSOC)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: b471f462-eb0d-4832-be35-28d94bdb4780
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of a renamed instance of the Remote Monitoring and
  Management (RMM) tool, MeshAgent. RMM tools such as MeshAgent are commonly
  utilized by IT administrators for legitimate remote support and system
  management. However, malicious actors may exploit these tools by renaming them
  to bypass detection mechanisms, enabling unauthorized access and control over
  compromised systems. MITRE ATT&CK: T1219.002, T1036.003.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*--meshServiceName*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_originalFileName:
                    value: "*meshagent*"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\meshagent.exe"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_originalFileName
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*--meshServiceName*'; data_win_eventdata_originalFileName matches
  '*meshagent*'; data_win_eventdata_image matches '*\meshagent.exe'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.huntress.com/blog/know-thy-enemy-a-novel-november-case-on-persistent-remote-access
  - https://thecyberexpress.com/ukraine-hit-by-meshagent-malware-campaign/
  - https://wazuh.com/blog/how-to-detect-meshagent-with-wazuh/
  - https://www.security.com/threat-intelligence/medusa-ransomware-attacks
  - https://attack.mitre.org/techniques/T1219/002/
  - https://attack.mitre.org/techniques/T1036/003/

response:
  message: >
    Remote Access Tool - Renamed MeshAgent Execution - Windows detected on host
    $agent_name$. Matched data_win_eventdata_commandLine:
    $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1219.002, T1036.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1219.002
    - T1036.003
  custom_tags:
    - renamed
    - meshagent
    - process_creation
    - sysmon
    - command_and_control
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*--[Mm][Ee][Ss][Hh][Ss][Ee][Rr][Vv][Ii][Cc][Ee][Nn][Aa][Mm][Ee].*/ OR data_win_eventdata_originalFileName:/.*[Mm][Ee][Ss][Hh][Aa][Gg][Ee][Nn][Tt].*/) AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/.*\\[Mm][Ee][Ss][Hh][Aa][Gg][Ee][Nn][Tt]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 2fbbe9ff-0afc-470b-bdc0-592198339968
    name: Remote Access Tool - Potential MeshAgent Execution - Windows
    reason: Generic MeshAgent command-line rule; both firing confirms the renamed binary is a live Mesh agent.
  - id: 74a2b202-73e0-4693-9a3a-9d36146d0775
    name: Remote Access Tool - MeshAgent Command Execution via MeshCentral
    reason: Shows operator commands executed through the renamed agent.
  - id: de587dce-915e-4218-aac4-835ca6af6f70
    name: Potential Persistence Attempt Via Run Keys Using Reg.EXE
    reason: Renamed agents are typically given Run-key persistence.
  - id: 81325ce1-be01-4250-944f-b4789644556f
    name: Schedule Task Creation From Env Variable Or Potentially Suspicious Path Via Schtasks.EXE
    reason: Scheduled task running the disguised agent from a suspicious path.
  - id: d059842b-6b9d-4ed1-b5c3-5b89143c6ede
    name: File Download Via Bitsadmin
    reason: Bitsadmin often fetches the renamed agent.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Agent run from user-writable paths with mesh arguments
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\(Users|ProgramData|Windows\\Temp|AppData|Public)\\.*/ AND (data_win_eventdata_commandLine:/.*[Mm][Ee][Ss][Hh][Ss][Ee][Rr][Vv][Ii][Cc][Ee][Nn][Aa][Mm][Ee].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ee][Ss][Hh][Aa][Gg][Ee][Nn][Tt].*/)
    pivot_on: host
    window: 2h
  - name: Download of the disguised agent
    query: (data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ss][Tt][Aa][Rr][Tt]-[Bb][Ii][Tt][Ss][Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr].*/)) OR data_win_eventdata_image:/.*\\([Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]|[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]|[Ww][Gg][Ee][Tt]\.[Ee][Xx][Ee])/))
    pivot_on: host
    window: 2h
  - name: Persistence for the renamed agent
    query: (data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\([Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*/[Cc][Rr][Ee][Aa][Tt][Ee].*/)) OR (data_win_eventdata_image:/.*\\([Ss][Cc]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee].*/)) OR (data_win_eventdata_image:/.*\\([Rr][Ee][Gg]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/))))
    pivot_on: host
    window: 6h
  - name: Executables created in temp/public paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\(Windows\\Temp|ProgramData|Users\\Public)\\.*\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Recon and account creation after agent start
    query: ((data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Nn][Ll][Tt][Ee][Ss][Tt]\.[Ee][Xx][Ee]|[Ww][Hh][Oo][Aa][Mm][Ii]\.[Ee][Xx][Ee]|[Ss][Yy][Ss][Tt][Ee][Mm][Ii][Nn][Ff][Oo]\.[Ee][Xx][Ee]|[Qq][Uu][Ss][Ee][Rr]\.[Ee][Xx][Ee]|[Qq][Ww][Ii][Nn][Ss][Tt][Aa]\.[Ee][Xx][Ee]|[Aa][Rr][Pp]\.[Ee][Xx][Ee])/ OR (data_win_eventdata_image:/.*\\([Nn][Ee][Tt]\.[Ee][Xx][Ee]|[Nn][Ee][Tt]1\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*[Vv][Ii][Ee][Ww].*/ OR data_win_eventdata_commandLine:/.*[Gg][Rr][Oo][Uu][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp].*/)))) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Nn][Ee][Tt]\.[Ee][Xx][Ee]|[Nn][Ee][Tt]1\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*[Uu][Ss][Ee][Rr] .*/ OR data_win_eventdata_commandLine:/.*[Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp].*/) AND (data_win_eventdata_commandLine:/.*/[Aa][Dd][Dd].*/)))
    pivot_on: host
    window: 6h
