name: Gzip Archive Decode Via PowerShell
id: 98767d61-b2e8-4d71-b661-e36783ee24c1
version: 1
schema_version: "1.0"
date: "2023-03-13"
author: Hieu Tran
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 98767d61-b2e8-4d71-b661-e36783ee24c1
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects attempts of decoding encoded Gzip archives via PowerShell. MITRE
  ATT&CK: T1132.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*GZipStream*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*::Decompress*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*GZipStream*'; data_win_eventdata_commandLine matches '*::Decompress*'.

known_false_positives: >
  Legitimate administrative scripts may use this functionality. Use
  "ParentImage" in combination with the script names and allowed users and
  applications to filter legitimate executions. Baseline expected activity in
  your environment and tune this detection before relying on it for automated
  response.

references:
  - https://www.zscaler.com/blogs/security-research/onenote-growing-threat-malware-distribution
  - https://attack.mitre.org/techniques/T1132/001/

response:
  message: >
    Gzip Archive Decode Via PowerShell detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1132.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1132.001
  custom_tags:
    - archive
    - decode
    - powershell
    - process_creation
    - sysmon
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Gg][Zz][Ii][Pp][Ss][Tt][Rr][Ee][Aa][Mm].*/ AND data_win_eventdata_commandLine:/.*::[Dd][Ee][Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss].*/

