name: Shadow Copies Creation Using Operating Systems Utilities
id: b17ea6f7-6e90-447e-a799-e6c0a493d6ce
version: 1
schema_version: "1.0"
date: "2022-11-10"
author: Teymur Kheirkhabarov, Daniil Yugoslavskiy, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: b17ea6f7-6e90-447e-a799-e6c0a493d6ce
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Shadow Copies creation using operating systems utilities, possible credential
  access. MITRE ATT&CK: T1003, T1003.002, T1003.003.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\powershell.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\pwsh.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\wmic.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\vssadmin.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "PowerShell.EXE"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "pwsh.dll"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "wmic.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "VSSADMIN.EXE"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*shadow*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*create*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\powershell.exe'; data_win_eventdata_image matches '*\pwsh.exe';
  data_win_eventdata_image matches '*\wmic.exe', among other conditions.

known_false_positives: >
  Legitimate administrator working with shadow copies, access for backup
  purposes. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.slideshare.net/heirhabarov/hunting-for-credentials-dumping-in-windows-environment
  - https://www.trustwave.com/en-us/resources/blogs/spiderlabs-blog/tutorial-for-ntds-goodness-vssadmin-wmis-ntdsdit-system/
  - https://attack.mitre.org/techniques/T1003/
  - https://attack.mitre.org/techniques/T1003/002/
  - https://attack.mitre.org/techniques/T1003/003/

response:
  message: >
    Shadow Copies Creation Using Operating Systems Utilities detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1003, T1003.002,
    T1003.003
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003
    - T1003.002
    - T1003.003
  custom_tags:
    - shadow
    - copies
    - operating
    - process_creation
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Pp][Ww][Ss][Hh]\.[Dd][Ll][Ll]/ OR data_win_eventdata_originalFileName:/[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Ss][Hh][Aa][Dd][Oo][Ww].*/ AND data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 40b19fa6-d835-400c-b301-41f3a2baacaf
    name: VolumeShadowCopy Symlink Creation Via Mklink
    reason: 'Next step: expose the new shadow copy via symlink so locked files can be read.'
  - id: c73124a7-3e89-44a3-bdc1-25fe4df754b1
    name: Copy From VolumeShadowCopy Via Cmd.EXE
    reason: Files (SAM, SYSTEM, NTDS.dit) are copied out of the freshly created shadow.
  - id: 1af57a4b-460a-4738-9034-db68b880c665
    name: PowerShell SAM Copy
    reason: 'Direct follow-on: copying SAM/SYSTEM hives from the shadow copy path.'
  - id: 11b1ed55-154d-4e82-8ad7-83739298f720
    name: NTDS.DIT Creation By Uncommon Process
    reason: On a DC the shadow copy is used to obtain ntds.dit, appearing as a file creation.
  - id: 8bc64091-6875-4881-aaf9-7bd25b5dda08
    name: Suspicious Process Patterns NTDS.DIT Exfil
    reason: Command patterns for pulling ntds.dit from shadow copies.
  - id: 2afafd61-6aae-4df4-baed-139fa1f4c345
    name: Invocation of Active Directory Diagnostic Tool (ntdsutil.exe)
    reason: Alternative AD database extraction (IFM) used with or instead of shadow copies.
  - id: 7b30e0a7-c675-4b24-8a46-82fa67e2433d
    name: Conti Volume Shadow Listing
    reason: Enumeration of existing shadows by the same operator, before or after creation.
  - id: 7df1713a-1a5b-4a4b-a071-dc83b144a101
    name: Esentutl Gather Credentials
    reason: Esentutl copy of locked credential databases is a common companion to shadow creation.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Access to HarddiskVolumeShadowCopy paths
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*[Hh]arddisk[Vv]olume[Ss]hadow[Cc]opy.*/
    pivot_on: host
    window: 2h
  - name: Registry hive and NTDS extraction
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Nn]tds\.dit.*/ OR /.*config\\[Ss][Aa][Mm].*/ OR /.*config\\[Ss][Yy][Ss][Tt][Ee][Mm].*/ OR /.*[Rr]eg.*save.*hklm.*/)
    pivot_on: host
    window: 2h
  - name: Credential file creation
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(/.*[Nn]tds\.dit.*/ OR /.*\\[Ss][Aa][Mm]/ OR /.*[Ss][Yy][Ss][Tt][Ee][Mm]\.(bak|save|hive).*/)
    pivot_on: host
    window: 2h
  - name: Archiving or exfil of dumped files
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*(7z|rar|tar|Compress-Archive).*(ntds|sam|system).*/ OR /.*[Cc]url.* -[Tt] .*/)
    pivot_on: host
    window: 4h
  - name: Shadow creation via diskshadow or WMI
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*[Dd]iskshadow\.exe/ OR data_win_eventdata_commandLine:/.*[Ww]in32_[Ss]hadowcopy.*/)
    pivot_on: host
    window: 2h
