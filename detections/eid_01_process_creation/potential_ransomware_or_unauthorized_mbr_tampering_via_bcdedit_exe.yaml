name: Potential Ransomware or Unauthorized MBR Tampering Via Bcdedit.EXE
id: c9fbe8e9-119d-40a6-9b59-dd58a5d84429
version: 1
schema_version: "1.0"
date: "2023-02-15"
author: "@neu5ron"
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: c9fbe8e9-119d-40a6-9b59-dd58a5d84429
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential malicious and unauthorized usage of bcdedit.exe. MITRE
  ATT&CK: T1070, T1542.003.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\bcdedit.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "bcdedit.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*delete*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*deletevalue*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*import*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*safeboot*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*network*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\bcdedit.exe'; data_win_eventdata_originalFileName equals 'bcdedit.exe';
  data_win_eventdata_commandLine matches '*delete*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://learn.microsoft.com/en-us/windows-hardware/drivers/devtest/bcdedit--set
  - https://twitter.com/malwrhunterteam/status/1372536434125512712/photo/2
  - https://attack.mitre.org/techniques/T1070/
  - https://attack.mitre.org/techniques/T1542/003/

response:
  message: >
    Potential Ransomware or Unauthorized MBR Tampering Via Bcdedit.EXE detected
    on host $agent_name$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1070, T1542.003
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1070
    - T1542.003
  custom_tags:
    - ransomware
    - unauthorized
    - tampering
    - process_creation
    - sysmon
    - stealth
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Bb][Cc][Dd][Ee][Dd][Ii][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Bb][Cc][Dd][Ee][Dd][Ii][Tt]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*[Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ee][Ll][Ee][Tt][Ee][Vv][Aa][Ll][Uu][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ii][Mm][Pp][Oo][Rr][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ss][Aa][Ff][Ee][Bb][Oo][Oo][Tt].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt][Ww][Oo][Rr][Kk].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 1444443e-6757-43e4-9ea4-c8fc705f79a2
    name: Boot Configuration Tampering Via Bcdedit.EXE
    reason: Sibling bcdedit tampering rule (recoveryenabled/bootstatuspolicy); common pairing in ransomware prep.
  - id: windows-bcdedit-prevent-automatic-repair-001
    name: Windows BCDEdit Prevent Automatic Repair Mode
    reason: Disabling automatic repair so the victim cannot recover the encrypted system; same ransomware step.
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: Shadow copy deletion typically runs alongside bcdedit to remove recovery options.
  - id: 639c9081-f482-47d3-a0bd-ddee3d4ecd76
    name: All Backups Deleted Via Wbadmin.EXE
    reason: wbadmin deleting all backups; same inhibit-recovery phase.
  - id: 9703792d-fd9a-456d-a672-ff92efe4806a
    name: Backup Catalog Deleted
    reason: Backup catalog deletion event confirms backup destruction on this host.
  - id: d7662ff6-9e97-4596-a61d-9839e32dee8d
    name: Add SafeBoot Keys Via Reg Utility
    reason: 'SafeBoot keys added: ransomware reboots into safe mode to evade AV; the registry twin of bcdedit safeboot.'
  - id: fc0e89b5-adb0-43c1-b749-c12a10ec37de
    name: SafeBoot Registry Key Deleted Via Reg.EXE
    reason: SafeBoot registry key deletion used to disable boot protections.
  - id: d99b79d2-0a6f-4f46-ad8b-260b6e17f982
    name: Security Eventlog Cleared
    reason: Event log clearing is common right before or after destructive boot changes.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Shadow copy and backup destruction
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(*[Vv]ssadmin*[Dd]elete* OR *[Ww]badmin*[Dd]elete* OR *[Ww]mic*[Ss]hadowcopy*[Dd]elete* OR *[Dd]iskshadow* OR *shadowstorage*)
    pivot_on: host
    window: 2h
  - name: Recovery disabled via bcdedit variants
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(*recoveryenabled* OR *bootstatuspolicy* OR *ignoreallfailures* OR *safeboot*)
    pivot_on: host
    window: 2h
  - name: Security tooling stopped before encryption
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(*[Ss]et-[Mm]p[Pp]reference* OR *[Ss]top-[Ss]ervice* OR *net*stop* OR *taskkill*)
    pivot_on: host
    window: 2h
  - name: Ransom note and mass encrypted file creation
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(*[Rr][Ee][Aa][Dd][Mm][Ee]*.txt OR *[Dd][Ee][Cc][Rr][Yy][Pp][Tt]* OR *[Rr][Ee][Cc][Oo][Vv][Ee][Rr]*)
    pivot_on: host
    window: 2h
  - name: Event log clearing
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(*[Ww]evtutil* OR *[Cc]lear-[Ee]vent[Ll]og*)
    pivot_on: host
    window: 4h
