name: Lazarus Group Activity
id: 24c4d154-05a4-4b99-b57d-9b977472443a
version: 1
schema_version: "1.0"
date: "2023-03-10"
author: Florian Roth (Nextron Systems), wagga
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 24c4d154-05a4-4b99-b57d-9b977472443a
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects different process execution behaviors as described in various threat
  reports on Lazarus group activity. MITRE ATT&CK: T1059.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*reg.exe save hklm\\\\sam %temp%\\\\~reg_sam.save*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*1q2w3e4r@#$@#$@#$*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -hp1q2w3e4 *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.dat data03 10000 -p *"
                    case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*netstat -aon | find *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*ESTA*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* > %temp%\\\\~*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*.255 10 C:\\\\ProgramData\\\\IBM\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*.DAT*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* /c *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* -p 0x*"
                          case_insensitive: true
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*C:\\\\ProgramData\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*C:\\\\RECYCLER\\\\*"
                                case_insensitive: true
                        minimum_should_match: 1
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*rundll32 *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*C:\\\\ProgramData\\\\*"
                          case_insensitive: true
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*.bin,*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*.tmp,*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*.dat,*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*.io,*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*.ini,*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*.db,*"
                                case_insensitive: true
                        minimum_should_match: 1
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*reg.exe save hklm\sam %temp%\~reg_sam.save*'; data_win_eventdata_commandLine
  matches '*1q2w3e4r@#$@#$@#$*'; data_win_eventdata_commandLine matches '*
  -hp1q2w3e4 *', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://securelist.com/lazarus-covets-covid-19-related-intelligence/99906/
  - https://www.hvs-consulting.de/lazarus-report/
  - https://attack.mitre.org/techniques/T1059/

response:
  message: >
    Lazarus Group Activity detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1059
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059
  custom_tags:
    - lazarus
    - group
    - process_creation
    - sysmon
    - g0032
    - execution
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Rr][Ee][Gg]\.[Ee][Xx][Ee] [Ss][Aa][Vv][Ee] [Hh][Kk][Ll][Mm]\\[Ss][Aa][Mm] %[Tt][Ee][Mm][Pp]%\\\~[Rr][Ee][Gg]_[Ss][Aa][Mm]\.[Ss][Aa][Vv][Ee].*/ OR data_win_eventdata_commandLine:/.*1[Qq]2[Ww]3[Ee]4[Rr]\@\#\$\@\#\$\@\#\$.*/ OR data_win_eventdata_commandLine:/.* -[Hh][Pp]1[Qq]2[Ww]3[Ee]4 .*/ OR data_win_eventdata_commandLine:/.*\.[Dd][Aa][Tt] [Dd][Aa][Tt][Aa]03 10000 -[Pp] .*/ OR (data_win_eventdata_commandLine:/.*[Nn][Ee][Tt][Ss][Tt][Aa][Tt] -[Aa][Oo][Nn] \| [Ff][Ii][Nn][Dd] .*/ AND data_win_eventdata_commandLine:/.*[Ee][Ss][Tt][Aa].*/ AND data_win_eventdata_commandLine:/.* \> %[Tt][Ee][Mm][Pp]%\\\~.*/) OR (data_win_eventdata_commandLine:/.*\.255 10 [Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\[Ii][Bb][Mm]\\.*/ AND data_win_eventdata_commandLine:/.*\.[Dd][Aa][Tt].*/) OR (data_win_eventdata_commandLine:/.* \/[Cc] .*/ AND data_win_eventdata_commandLine:/.* -[Pp] 0[Xx].*/ AND (data_win_eventdata_commandLine:/.*[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_commandLine:/.*[Cc]:\\[Rr][Ee][Cc][Yy][Cc][Ll][Ee][Rr]\\.*/)) OR (data_win_eventdata_commandLine:/.*[Rr][Uu][Nn][Dd][Ll][Ll]32 .*/ AND data_win_eventdata_commandLine:/.*[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ AND (data_win_eventdata_commandLine:/.*\.[Bb][Ii][Nn],.*/ OR data_win_eventdata_commandLine:/.*\.[Tt][Mm][Pp],.*/ OR data_win_eventdata_commandLine:/.*\.[Dd][Aa][Tt],.*/ OR data_win_eventdata_commandLine:/.*\.[Ii][Oo],.*/ OR data_win_eventdata_commandLine:/.*\.[Ii][Nn][Ii],.*/ OR data_win_eventdata_commandLine:/.*\.[Dd][Bb],.*/)))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: fd877b94-9bb5-4191-bb25-d79cbd93c167
    name: Dumping of Sensitive Hives Via Reg.EXE
    reason: The Lazarus pattern includes reg save of HKLM SAM to %temp%; the generic hive-dump rule corroborates credential harvesting.
  - id: 2cf5cc25-f39a-436d-a790-4857e5995ede
    name: Network Connection Discovery With Netstat
    reason: Lazarus runs netstat -aon | find ESTA redirected to a temp file for connection recon, which this rule catches generically.
  - id: e593cf51-88db-4ee1-b920-37e89012a3c9
    name: Potentially Suspicious Rundll32 Activity
    reason: Lazarus loads implants through rundll32 of .dat/.tmp/.bin modules from ProgramData.
  - id: 2569ed8c-1147-498a-9b8c-2ad3656b10ed
    name: Potential Renamed Rundll32 Execution
    reason: Implant loaders are sometimes run from renamed rundll32 copies after staging.
  - id: ec570e53-4c76-45a9-804d-dc3f355ff7a7
    name: 7Zip Compressing Dump Files
    reason: Archiving of harvested data (the -hp password indicator) precedes exfiltration.
  - id: 9fbf5927-5261-4284-a71d-f681029ea574
    name: Compress Data and Lock With Password for Exfiltration With 7-ZIP
    reason: Password-locked archives are the staged-exfil step matching the -hp indicator.
  - id: 1af57a4b-460a-4738-9034-db68b880c665
    name: PowerShell SAM Copy
    reason: Alternative SAM theft route on the same host if reg save is blocked.
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: Saved SAM/SYSTEM hives are typically complemented by live credential tooling.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Hive saves and temp-staged files
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Rr]eg(\.exe)? +save.*(sam|system|security).*/ OR /.*~reg_sam.*/)
    pivot_on: host
    window: 24h
  - name: Archiving with password switches
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.* -hp.*/ OR /.*7z.* a .* -p.*/ OR /.*[Rr]ar.* a .*-hp.*/)
    pivot_on: host
    window: 24h
  - name: Rundll32 loading data-extension modules from ProgramData
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*[Rr]undll32.*[Pp]rogram[Dd]ata.*\.(dat|tmp|bin|db|ini|io),.*/
    pivot_on: host
    window: 24h
  - name: Files written to ProgramData/Recycler staging paths
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(/.*[Pp]rogram[Dd]ata\\(IBM|Intel|Microsoft)\\.*\.(dat|tmp|bin|db)/ OR /.*RECYCLER.*/)
    pivot_on: host
    window: 24h
  - name: Outbound connections from rundll32
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*[Rr]undll32\.exe/ AND data_win_eventdata_initiated:true
    pivot_on: host
    window: 24h
