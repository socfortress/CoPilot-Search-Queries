name: Potential Mftrace.EXE Abuse
id: 3d48c9d3-1aa6-418d-98d3-8fd3c01a564e
version: 1
schema_version: "1.0"
date: "2023-08-03"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 3d48c9d3-1aa6-418d-98d3-8fd3c01a564e
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects child processes of the "Trace log generation tool for Media Foundation
  Tools" (Mftrace.exe) which can abused to execute arbitrary binaries. MITRE
  ATT&CK: T1127.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_parentImage:
              value: "*\\\\mftrace.exe"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\mftrace.exe'.

known_false_positives: >
  Legitimate use for tracing purposes. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://lolbas-project.github.io/lolbas/OtherMSBinaries/Mftrace/
  - https://attack.mitre.org/techniques/T1127/

response:
  message: >
    Potential Mftrace.EXE Abuse detected on host $agent_name$. Matched
    data_win_eventdata_parentImage: $data_win_eventdata_parentImage$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1127
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1127
  custom_tags:
    - mftrace
    - abuse
    - process_creation
    - sysmon
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Mm][Ff][Tt][Rr][Aa][Cc][Ee]\.[Ee][Xx][Ee]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 9257c05b-4a4a-48e5-a670-b7b073cf401b
    name: Binary Proxy Execution Via Dotnet-Trace.EXE
    reason: Same tracing-tool proxy-execution LOLBin class; an operator who abuses one trace utility to spawn binaries often tries the others on the same host.
  - id: d4ca7c59-e9e4-42d8-bf57-91a776efcb87
    name: LOLBIN Execution From Abnormal Drive
    reason: Mftrace copied to or run from a relocated path or removable drive is the common staging pattern for this proxy-exec abuse.
  - id: cd71385d-fd9b-4691-9b98-2b1f7e508714
    name: Lolbin Runexehelper Use As Proxy
    reason: Sibling signed-binary proxy execution; operators chain several LOLBins to find one that is not monitored.
  - id: 729ce0ea-5d8f-4769-9762-e35de441586d
    name: MpiExec Lolbin
    reason: Another rarely-seen launcher abused to spawn arbitrary child processes, hunted together with Mftrace.
  - id: 727454c0-d851-48b0-8b89-385611ab0704
    name: Lolbin Unregmp2.exe Use As Proxy
    reason: Windows Media tooling used as a proxy for payload execution, same family as Mftrace.
  - id: dcfd6b40-42f9-469d-a433-2e53f7486664
    name: Detect Prohibited Applications Spawning cmd exe
    reason: The payload spawned via mftrace is typically cmd.exe, so a shell launched from a non-shell parent corroborates it.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Shells and script hosts spawned by Mftrace
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|[Cc][Mm][Dd]\.[Ee][Xx][Ee]|[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee])/ AND data_win_eventdata_parentImage:/.*\\([Mm][Ff][Tt][Rr][Aa][Cc][Ee]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 1h
  - name: Mftrace.exe process starts and command lines
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Mm][Ff][Tt][Rr][Aa][Cc][Ee]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 6h
  - name: Executables and scripts created in user-writable dirs
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(\\[Uu][Ss][Ee][Rr][Ss]\\|\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\|\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\).*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Bb][Aa][Tt]|[Pp][Ss]1)/
    pivot_on: host
    window: 2h
  - name: Outbound connections from scripting hosts and LOLBins
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|[Cc][Mm][Dd]\.[Ee][Xx][Ee]|[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 2h
  - name: Persistence registry writes
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND data_win_eventdata_targetObject:/.*([Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn]|\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\|[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]\\|[Ii][Mm][Aa][Gg][Ee] [Ff][Ii][Ll][Ee] [Ee][Xx][Ee][Cc][Uu][Tt][Ii][Oo][Nn] [Oo][Pp][Tt][Ii][Oo][Nn][Ss]).*/
    pivot_on: host
    window: 4h
