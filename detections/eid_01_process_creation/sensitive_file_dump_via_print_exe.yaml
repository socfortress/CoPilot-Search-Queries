name: Sensitive File Dump Via Print.EXE
id: 2fcda7e2-8c57-4904-86ac-37fc3157e09d
version: 1
schema_version: "1.0"
date: "2026-04-28"
author: Ayush Anand (Securityinbits)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 2fcda7e2-8c57-4904-86ac-37fc3157e09d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the abuse of the Print.exe utility for credential harvesting which
  involves using Print.Exe to copy sensitive files such as ntds.dit, SAM,
  SECURITY, or SYSTEM from the Windows directory in order to extract
  credentials, locally or remotely. MITRE ATT&CK: T1003.003, T1003.002, T1218.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\print.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "Print.EXE"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-D*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*/D*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*–D*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*—D*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*―D*"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\config\\\\SAM*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\config\\\\SECURITY*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\config\\\\SYSTEM*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\windows\\\\ntds\\\\ntds.dit*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\print.exe'; data_win_eventdata_originalFileName equals 'Print.EXE';
  data_win_eventdata_commandLine matches '*-D*', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.microsoft.com/en-us/security/blog/2026/02/06/active-exploitation-solarwinds-web-help-desk/
  - https://www.huntress.com/blog/credential-theft-expanding-your-reach-pt-2
  - https://lolbas-project.github.io/lolbas/Binaries/Print/
  - https://attack.mitre.org/techniques/T1003/003/
  - https://attack.mitre.org/techniques/T1003/002/
  - https://attack.mitre.org/techniques/T1218/

response:
  message: >
    Sensitive File Dump Via Print.EXE detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1003.003, T1003.002, T1218
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.003
    - T1003.002
    - T1218
  custom_tags:
    - sensitive
    - print
    - process_creation
    - sysmon
    - credential_access
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Pp][Rr][Ii][Nn][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Pp][Rr][Ii][Nn][Tt]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*-[Dd].*/ OR data_win_eventdata_commandLine:/.*\/[Dd].*/ OR data_win_eventdata_commandLine:/.*–[Dd].*/ OR data_win_eventdata_commandLine:/.*—[Dd].*/ OR data_win_eventdata_commandLine:/.*―[Dd].*/) AND (data_win_eventdata_commandLine:/.*\\[Cc][Oo][Nn][Ff][Ii][Gg]\\[Ss][Aa][Mm].*/ OR data_win_eventdata_commandLine:/.*\\[Cc][Oo][Nn][Ff][Ii][Gg]\\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy].*/ OR data_win_eventdata_commandLine:/.*\\[Cc][Oo][Nn][Ff][Ii][Gg]\\[Ss][Yy][Ss][Tt][Ee][Mm].*/ OR data_win_eventdata_commandLine:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Nn][Tt][Dd][Ss]\\[Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: f57f8d16-1f39-4dcb-a604-6c73d9b54b3d
    name: Sensitive File Access Via Volume Shadow Copy Backup
    reason: Same credential files read via shadow copy path; same objective.
  - id: e7be6119-fc37-43f0-ad4f-1f3f99be2f9f
    name: Copying Sensitive Files with Credential Data
    reason: Generic copying of SAM/SYSTEM/ntds by other tools on the same host.
  - id: da63bc76-61ae-11eb-ae93-0242ac130002
    name: Ntdsutil Export NTDS
    reason: Alternative ntds.dit extraction if print.exe was one of several attempts.
  - id: d372f928-ce4f-11eb-a762-acde48001122
    name: Esentutl SAM Copy
    reason: Alternative LOLBin SAM copy.
  - id: 8bc64091-6875-4881-aaf9-7bd25b5dda08
    name: Suspicious Process Patterns NTDS.DIT Exfil
    reason: Post-dump exfil patterns of ntds.dit.
  - id: b17ea6f7-6e90-447e-a799-e6c0a493d6ce
    name: Shadow Copies Creation Using Operating Systems Utilities
    reason: Shadow copy creation commonly used to get past file locks before the copy.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Credential files referenced in command lines
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss]\.dit.*/ OR data_win_eventdata_commandLine:/.*\\[Ss][Aa][Mm].*/ OR data_win_eventdata_commandLine:/.*\\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy].*/ OR data_win_eventdata_commandLine:/.*\\[Ss][Yy][Ss][Tt][Ee][Mm].*/)
    pivot_on: host
    window: 6h
  - name: Copy/save of hives with other tools
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss]\.dit.*/ OR data_win_eventdata_commandLine:/.*\\[Ss][Aa][Mm].*/ OR data_win_eventdata_commandLine:/.*\\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy].*/ OR data_win_eventdata_commandLine:/.*\\[Ss][Yy][Ss][Tt][Ee][Mm].*/) AND (data_win_eventdata_commandLine:/.*([Cc]opy|[Rr]eg.*[Ss]ave|[Ee]sentutl|[Xx]copy|[Rr]obocopy).*/)
    pivot_on: host
    window: 6h
  - name: Archiving or staging of output
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*(7z|[Rr]ar|[Zz]ip|[Cc]ompress-[Aa]rchive|[Cc]url|[Rr]clone).*/)
    pivot_on: host
    window: 6h
  - name: Print.exe invocations with UNC destinations
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*\\[Pp]rint\.exe/ AND data_win_eventdata_commandLine:/.*\\\\.*/
    pivot_on: host
    window: 6h
