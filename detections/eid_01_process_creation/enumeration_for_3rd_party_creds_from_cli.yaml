name: Enumeration for 3rd Party Creds From CLI
id: 87a476dc-0079-4583-a985-dee7a20a03de
version: 1
schema_version: "1.0"
date: "2025-05-22"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 87a476dc-0079-4583-a985-dee7a20a03de
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects processes that query known 3rd party registry keys that holds
  credentials via commandline. MITRE ATT&CK: T1552.002.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Software\\\\Aerofox\\\\Foxmail\\\\V3.1*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Software\\\\Aerofox\\\\FoxmailPreview*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Software\\\\DownloadManager\\\\Passwords*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Software\\\\FTPWare\\\\COREFTP\\\\Sites*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Software\\\\IncrediMail\\\\Identities*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Software\\\\Martin Prikryl\\\\WinSCP 2\\\\Sessions*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Software\\\\Mobatek\\\\MobaXterm\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Software\\\\OpenSSH\\\\Agent\\\\Keys*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Software\\\\OpenVPN-GUI\\\\configs*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Software\\\\ORL\\\\WinVNC3\\\\Password*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Software\\\\Qualcomm\\\\Eudora\\\\CommandLine*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Software\\\\RealVNC\\\\WinVNC4*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Software\\\\RimArts\\\\B2\\\\Settings*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Software\\\\SimonTatham\\\\PuTTY\\\\Sessions*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Software\\\\SimonTatham\\\\PuTTY\\\\SshHostKeys\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Software\\\\Sota\\\\FFFTP*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Software\\\\TightVNC\\\\Server*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Software\\\\WOW6432Node\\\\Radmin\\\\v3.0\\\\Server\\\\Parameters\\\\Radmin*"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_image"
        - exists:
            field: "data_win_eventdata_commandLine"
        - bool:
            must_not:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*reg.exe"
                          case_insensitive: true
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*export*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*save*"
                                case_insensitive: true
                        minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*\Software\Aerofox\Foxmail\V3.1*'; data_win_eventdata_commandLine matches
  '*\Software\Aerofox\FoxmailPreview*'; data_win_eventdata_commandLine matches
  '*\Software\DownloadManager\Passwords*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://isc.sans.edu/diary/More+Data+Exfiltration/25698
  - https://github.com/synacktiv/Radmin3-Password-Cracker/blob/acfc87393e4b7c06353973a14a6c7126a51f36ac/regkey.txt
  - https://github.com/HyperSine/how-does-MobaXterm-encrypt-password
  - https://book.hacktricks.xyz/windows-hardening/windows-local-privilege-escalation#inside-the-registry
  - https://attack.mitre.org/techniques/T1552/002/

response:
  message: >
    Enumeration for 3rd Party Creds From CLI detected on host $agent_name$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1552.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1552.002
  custom_tags:
    - enumeration
    - party
    - creds
    - process_creation
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Aa][Ee][Rr][Oo][Ff][Oo][Xx]\\[Ff][Oo][Xx][Mm][Aa][Ii][Ll]\\[Vv]3\.1.*/ OR data_win_eventdata_commandLine:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Aa][Ee][Rr][Oo][Ff][Oo][Xx]\\[Ff][Oo][Xx][Mm][Aa][Ii][Ll][Pp][Rr][Ee][Vv][Ii][Ee][Ww].*/ OR data_win_eventdata_commandLine:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Mm][Aa][Nn][Aa][Gg][Ee][Rr]\\[Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd][Ss].*/ OR data_win_eventdata_commandLine:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Ff][Tt][Pp][Ww][Aa][Rr][Ee]\\[Cc][Oo][Rr][Ee][Ff][Tt][Pp]\\[Ss][Ii][Tt][Ee][Ss].*/ OR data_win_eventdata_commandLine:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Ii][Nn][Cc][Rr][Ee][Dd][Ii][Mm][Aa][Ii][Ll]\\[Ii][Dd][Ee][Nn][Tt][Ii][Tt][Ii][Ee][Ss].*/ OR data_win_eventdata_commandLine:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Aa][Rr][Tt][Ii][Nn] [Pp][Rr][Ii][Kk][Rr][Yy][Ll]\\[Ww][Ii][Nn][Ss][Cc][Pp] 2\\[Ss][Ee][Ss][Ss][Ii][Oo][Nn][Ss].*/ OR data_win_eventdata_commandLine:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Oo][Bb][Aa][Tt][Ee][Kk]\\[Mm][Oo][Bb][Aa][Xx][Tt][Ee][Rr][Mm]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Oo][Pp][Ee][Nn][Ss][Ss][Hh]\\[Aa][Gg][Ee][Nn][Tt]\\[Kk][Ee][Yy][Ss].*/ OR data_win_eventdata_commandLine:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Oo][Pp][Ee][Nn][Vv][Pp][Nn]-[Gg][Uu][Ii]\\[Cc][Oo][Nn][Ff][Ii][Gg][Ss].*/ OR data_win_eventdata_commandLine:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Oo][Rr][Ll]\\[Ww][Ii][Nn][Vv][Nn][Cc]3\\[Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd].*/ OR data_win_eventdata_commandLine:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Qq][Uu][Aa][Ll][Cc][Oo][Mm][Mm]\\[Ee][Uu][Dd][Oo][Rr][Aa]\\[Cc][Oo][Mm][Mm][Aa][Nn][Dd][Ll][Ii][Nn][Ee].*/ OR data_win_eventdata_commandLine:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Rr][Ee][Aa][Ll][Vv][Nn][Cc]\\[Ww][Ii][Nn][Vv][Nn][Cc]4.*/ OR data_win_eventdata_commandLine:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Rr][Ii][Mm][Aa][Rr][Tt][Ss]\\[Bb]2\\[Ss][Ee][Tt][Tt][Ii][Nn][Gg][Ss].*/ OR data_win_eventdata_commandLine:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Ss][Ii][Mm][Oo][Nn][Tt][Aa][Tt][Hh][Aa][Mm]\\[Pp][Uu][Tt][Tt][Yy]\\[Ss][Ee][Ss][Ss][Ii][Oo][Nn][Ss].*/ OR data_win_eventdata_commandLine:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Ss][Ii][Mm][Oo][Nn][Tt][Aa][Tt][Hh][Aa][Mm]\\[Pp][Uu][Tt][Tt][Yy]\\[Ss][Ss][Hh][Hh][Oo][Ss][Tt][Kk][Ee][Yy][Ss]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Ss][Oo][Tt][Aa]\\[Ff][Ff][Ff][Tt][Pp].*/ OR data_win_eventdata_commandLine:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Tt][Ii][Gg][Hh][Tt][Vv][Nn][Cc]\\[Ss][Ee][Rr][Vv][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Ww][Oo][Ww]6432[Nn][Oo][Dd][Ee]\\[Rr][Aa][Dd][Mm][Ii][Nn]\\[Vv]3\.0\\[Ss][Ee][Rr][Vv][Ee][Rr]\\[Pp][Aa][Rr][Aa][Mm][Ee][Tt][Ee][Rr][Ss]\\[Rr][Aa][Dd][Mm][Ii][Nn].*/) AND _exists_:data_win_eventdata_image AND _exists_:data_win_eventdata_commandLine AND NOT (data_win_eventdata_image:/.*[Rr][Ee][Gg]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*[Ee][Xx][Pp][Oo][Rr][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ss][Aa][Vv][Ee].*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: cc1abf27-78a3-4ac5-a51c-f3070b1d8e40
    name: Registry Export of Third-Party Credentials
    reason: Same third-party credential registry keys (PuTTY, WinSCP, VNC) exported rather than queried; the collection step.
  - id: e0b0c2ab-3d52-46d9-8cb7-049dc775fbd1
    name: Enumeration for Credentials in Registry
    reason: Generic reg query for password strings is the broader hunt that accompanies targeted app-key queries.
  - id: c2b86e67-b880-4eec-b045-50bc98ef4844
    name: HackTool - LaZagne Execution
    reason: LaZagne automates harvesting the same third-party app credentials; often replaces manual reg queries.
  - id: d0dae994-26c6-4d2d-83b5-b3c8b79ae513
    name: PUA - WebBrowserPassView Execution
    reason: NirSoft WebBrowserPassView extends the same stored-credential theft to browser password stores.
  - id: detection-of-tools-built-by-nirsoft-001
    name: Detection of Tools Built by NirSoft
    reason: NirSoft recovery utilities are the GUI/CLI alternative for dumping saved application passwords.
  - id: 0f60b28c-64dd-4e2c-9a63-5334d3e3a6e6
    name: Script Interpreter Spawning Credential Scanner - Windows
    reason: A script interpreter launching a credential scanner shows the harvest is scripted, not manual.
  - id: 82880171-b475-4201-b811-e9c826cd5eaa
    name: Exports Critical Registry Keys To a File
    reason: Registry export to a file stages hive data for exfiltration after enumeration.
  - id: 07f8bdc2-c9b3-472a-9817-5a670b872f53
    name: Potential Reconnaissance For Cached Credentials Via Cmdkey.EXE
    reason: Cmdkey /list recon for cached credentials is the Windows-native sibling of the app-key enumeration.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Registry export or save of app credential keys
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:(/.*[Rr]eg +(export|save).*/ OR /.*[Rr]egedit.* \/[Ee] .*/) AND data_win_eventdata_commandLine:(/.*(PuTTY|WinSCP|FileZilla|VNC|OpenSSH|MobaXterm|CoreFTP|FTPWare).*/)
    pivot_on: host
    window: 2h
  - name: Known credential recovery tools
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:(/.*\\(LaZagne|WebBrowserPassView|PasswordFox|ChromePass|mailpv|netpass|VaultPasswordView).*/) OR data_win_eventdata_originalFileName:(/.*(LaZagne|WebBrowserPassView|ChromePass|mailpv).*/))
    pivot_on: host
    window: 4h
  - name: Credential file lookups for SFTP and SSH clients
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:(/.*(sitemanager\.xml|recentservers\.xml|WinSCP\.ini|id_rsa|known_hosts|\.ppk).*/)
    pivot_on: host
    window: 4h
  - name: Registry writes under credential-bearing app keys
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:(/.*(SimonTatham|WinSCP|RealVNC|OpenSSH|MobaXterm|OpenVPN).*/)
    pivot_on: host
    window: 4h
  - name: Archive or transfer of harvested credential output
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:(/.*(7z|rar|zip|Compress-Archive|certutil|curl|bitsadmin).*/) AND data_win_eventdata_commandLine:(/.*(cred|pass|secret|putty|winscp).*/)
    pivot_on: user
    window: 4h
