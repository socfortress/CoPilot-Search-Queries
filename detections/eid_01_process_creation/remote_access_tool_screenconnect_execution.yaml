name: Remote Access Tool - ScreenConnect Execution
id: 57bff678-25d1-4d6c-8211-8ca106d12053
version: 1
schema_version: "1.0"
date: "2023-03-05"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 57bff678-25d1-4d6c-8211-8ca106d12053
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  An adversary may use legitimate desktop support and remote access software,
  such as Team Viewer, Go2Assist, LogMein, AmmyyAdmin, etc, to establish an
  interactive command and control channel to target systems within networks.
  These services are commonly used as legitimate technical support software, and
  may be allowed by application control within a target environment. Remote
  access tools like VNC, Ammyy, and Teamviewer are used frequently when compared
  with other legitimate software commonly used by adversaries. (Citation:
  Symantec Living off the Land). MITRE ATT&CK: T1219.002.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - term:
                  data_win_eventdata_description:
                    value: "ScreenConnect Service"
                    case_insensitive: true
              - term:
                  data_win_eventdata_product:
                    value: "ScreenConnect"
                    case_insensitive: true
              - term:
                  data_win_eventdata_company:
                    value: "ScreenConnect Software"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_description
    - data_win_eventdata_product
    - data_win_eventdata_company
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_description equals
  'ScreenConnect Service'; data_win_eventdata_product equals 'ScreenConnect';
  data_win_eventdata_company equals 'ScreenConnect Software'.

known_false_positives: >
  Legitimate usage of the tool. Baseline expected activity in your environment
  and tune this detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1219/T1219.md#atomic-test-5---screenconnect-application-download-and-install-on-windows
  - https://attack.mitre.org/techniques/T1219/002/

response:
  message: >
    Remote Access Tool - ScreenConnect Execution detected on host $agent_name$.
    Matched data_win_eventdata_description: $data_win_eventdata_description$.
    Matched data_win_eventdata_product: $data_win_eventdata_product$. MITRE
    ATT&CK: T1219.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_description
      type: other
    - field: data_win_eventdata_product
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1219.002
  custom_tags:
    - screenconnect
    - process_creation
    - sysmon
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_description:/[Ss][Cc][Rr][Ee][Ee][Nn][Cc][Oo][Nn][Nn][Ee][Cc][Tt] [Ss][Ee][Rr][Vv][Ii][Cc][Ee]/ OR data_win_eventdata_product:/[Ss][Cc][Rr][Ee][Ee][Nn][Cc][Oo][Nn][Nn][Ee][Cc][Tt]/ OR data_win_eventdata_company:/[Ss][Cc][Rr][Ee][Ee][Nn][Cc][Oo][Nn][Nn][Ee][Cc][Tt] [Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 75bfe6e6-cd8e-429e-91d3-03921e1d7962
    name: Remote Access Tool - ScreenConnect Installation Execution
    reason: Client launched with an inline relay/session URL (e=Access&y=Guest) is the install/join step that precedes the running service this rule sees
  - id: 7b582f1a-b318-4c6a-bf4e-66fe49bf55a5
    name: Remote Access Tool - ScreenConnect Potential Suspicious Remote Command Execution
    reason: Once the service runs, an operator-issued cmd/powershell child from its run.cmd is the hands-on-keyboard follow-on
  - id: b52e84a3-029e-4529-b09b-71d19dd27e94
    name: Remote Access Tool - AnyDesk Execution
    reason: Attackers commonly deploy a second RMM for redundancy; AnyDesk on the same host suggests tool stacking
  - id: 758ff488-18d5-4cbe-8ec4-02b6285a434f
    name: Remote Access Tool - NetSupport Execution
    reason: Co-deployed alternate remote access tool on the same host
  - id: 5594e67a-7f92-4a04-b65d-1a42fd824a60
    name: MSI Installation From Web
    reason: ScreenConnect is typically delivered as an MSI downloaded from the web before first execution
  - id: 79a87aa6-e4bd-42fc-a5bb-5e6fbdcd62f5
    name: Msiexec Quiet Installation
    reason: Silent msiexec install is the usual silent deployment of the ScreenConnect client
  - id: 1444443e-6757-43e4-9ea4-c8fc705f79a2
    name: Boot Configuration Tampering Via Bcdedit.EXE
    reason: Ransomware operators using ScreenConnect access follow with recovery-disabling bcdedit
  - id: 236e7c8e-c9d9-11eb-a824-acde48001122
    name: Disable Logs Using WevtUtil
    reason: Log tampering by the remote operator after access is established
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: ScreenConnect msiexec install
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Mm]siexec\.exe/ AND data_win_eventdata_commandLine:/.*[Ss]creen[Cc]onnect.*/
    pivot_on: host
    window: 4h
  - name: Shell children of ScreenConnect client
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Ss]creen[Cc]onnect.*/ AND data_win_eventdata_image:/.*(cmd|powershell|pwsh|wscript|cscript|mshta)\.exe/
    pivot_on: host
    window: 4h
  - name: Discovery commands after remote access
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(whoami|nltest|net1?|quser|systeminfo|ipconfig)\.exe/
    pivot_on: host
    window: 2h
  - name: Download tooling LOLBins
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(bitsadmin|certutil|curl)\.exe/ AND data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp].*/
    pivot_on: host
    window: 2h
  - name: Other remote access tools on host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_description:/.*([Aa]ny[Dd]esk|[Tt]eam[Vv]iewer|[Nn]et[Ss]upport|[Aa]tera|[Mm]esh[Aa]gent|[Ss]imple[Hh]elp).*/ OR data_win_eventdata_product:/.*([Aa]ny[Dd]esk|[Tt]eam[Vv]iewer|[Nn]et[Ss]upport|[Aa]tera).*/)
    pivot_on: host
    window: 24h
