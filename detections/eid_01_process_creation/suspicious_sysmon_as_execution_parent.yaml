name: Suspicious Sysmon as Execution Parent
id: 6d1058a4-407e-4f3a-a144-1968c11dc5c3
version: 1
schema_version: "1.0"
date: "2025-07-04"
author: Florian Roth (Nextron Systems), Tim Shelton (fp werfault)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 6d1058a4-407e-4f3a-a144-1968c11dc5c3
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious process executions in which Sysmon itself is the parent of
  a process, which could be a sign of exploitation (e.g. CVE-2022-41120). MITRE
  ATT&CK: T1068.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\Sysmon.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\Sysmon64.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            must_not:
              - bool:
                  should:
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "C:\\\\Users\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\AppData\\\\Local\\\\Temp\\\\*"
                                case_insensitive: true
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*\\\\Sysmon.exe"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*\\\\Sysmon64.exe"
                                      case_insensitive: true
                              minimum_should_match: 1
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*:\\\\Windows\\\\Sysmon.exe*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*:\\\\Windows\\\\Sysmon64.exe*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*:\\\\Windows\\\\System32\\\\conhost.exe*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*:\\\\Windows\\\\System32\\\\WerFault.exe*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*:\\\\Windows\\\\System32\\\\WerFaultSecure.exe*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*:\\\\Windows\\\\System32\\\\wevtutil.exe*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*:\\\\Windows\\\\SysWOW64\\\\wevtutil.exe*"
                          case_insensitive: true
                    - bool:
                        must_not:
                          - exists:
                              field: "data_win_eventdata_image"
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\Sysmon.exe'; data_win_eventdata_parentImage matches '*\Sysmon64.exe';
  data_win_eventdata_image matches 'C:\Users\*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://msrc.microsoft.com/update-guide/vulnerability/CVE-2022-41120
  - https://twitter.com/filip_dragovic/status/1590052248260055041
  - https://twitter.com/filip_dragovic/status/1590104354727436290
  - https://attack.mitre.org/techniques/T1068/

response:
  message: >
    Suspicious Sysmon as Execution Parent detected on host $agent_name$. Matched
    data_win_eventdata_parentImage: $data_win_eventdata_parentImage$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1068
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1068
  custom_tags:
    - sysmon
    - parent
    - process_creation
    - privilege_escalation
    - cve_2022_41120
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Ss][Yy][Ss][Mm][Oo][Nn]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ss][Yy][Ss][Mm][Oo][Nn]64\.[Ee][Xx][Ee]/) AND NOT ((data_win_eventdata_image:/[Cc]:\\[Uu][Ss][Ee][Rr][Ss]\\.*/ AND data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\.*/ AND (data_win_eventdata_image:/.*\\[Ss][Yy][Ss][Mm][Oo][Nn]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ss][Yy][Ss][Mm][Oo][Nn]64\.[Ee][Xx][Ee]/)) OR data_win_eventdata_image:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Mm][Oo][Nn]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Mm][Oo][Nn]64\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Cc][Oo][Nn][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ww][Ee][Rr][Ff][Aa][Uu][Ll][Tt]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ww][Ee][Rr][Ff][Aa][Uu][Ll][Tt][Ss][Ee][Cc][Uu][Rr][Ee]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Ww][Oo][Ww]64\\[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee].*/ OR NOT _exists_:data_win_eventdata_image)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 8a7e90c5-fe6e-45dc-889e-057fe4378bd9
    name: HackTool - SysmonEOP Execution
    reason: The public PoC for CVE-2022-41120 is the direct tool that makes Sysmon spawn processes.
  - id: 6a5f68d1-c4b5-46b9-94ee-5324892ea939
    name: Uninstall Sysinternals Sysmon
    reason: The exploit races Sysmon's service/driver; attackers also uninstall Sysmon to blind telemetry.
  - id: 87911521-7098-470b-a459-9a57fc80bdfd
    name: Sysmon Configuration Update
    reason: Config swaps accompany tampering with Sysmon around exploitation.
  - id: 4d7cda18-1b12-4e52-b45c-d28653210df8
    name: Sysmon Driver Unloaded Via Fltmc.EXE
    reason: Unloading SysmonDrv is a defence-evasion step often paired with Sysmon abuse.
  - id: 2617e7ed-adb7-40ba-b0f3-8f9945fe6c09
    name: Suspicious SYSTEM User Process Creation
    reason: Sysmon-parented code runs as SYSTEM, so suspicious SYSTEM process creation is the likely follow-on.
  - id: 178e615d-e666-498b-9630-9ed363038101
    name: Elevated System Shell Spawned From Uncommon Parent Location
    reason: A SYSTEM shell is the typical payload obtained from the Sysmon EoP.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Sysmon binaries staged in user-writable paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*\\[Ss][Yy][Ss][Mm][Oo][Nn](64)?\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Sysmon service control, uninstall or config commands
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Ss][Yy][Ss][Mm][Oo][Nn]\.[Ee][Xx][Ee]|\\[Ss][Yy][Ss][Mm][Oo][Nn]64\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.* -[UuCcIi]( .*)?/ OR data_win_eventdata_commandLine:/.* \/[UuCcIi]( .*)?/)
    pivot_on: host
    window: 2h
  - name: Sysmon configuration changed or driver unloaded
    query: (data_win_system_eventID:"16" OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Ff][Ll][Tt][Mm][Cc]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*[Uu][Nn][Ll][Oo][Aa][Dd].*/)))
    pivot_on: host
    window: 2h
  - name: SYSTEM-context shells and script hosts
    query: data_win_system_eventID:"1" AND (data_win_eventdata_user:/.*[Aa][Uu][Tt][Hh][Oo][Rr][Ii].*/ OR data_win_eventdata_user:/.*[Aa][Uu][Tt][Oo][Rr][Ii].*/) AND data_win_eventdata_image:/.*(\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]|\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]|\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 2h
  - name: Credential theft and account manipulation after SYSTEM
    query: ((data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Nn][Ee][Tt] [Uu][Ss][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt]1 [Uu][Ss][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp] [Aa][Dd][Mm][Ii][Nn][Ii][Ss][Tt][Rr][Aa][Tt][Oo][Rr][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss].*/)) OR (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*(\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee])/))
    pivot_on: host
    window: 2h
