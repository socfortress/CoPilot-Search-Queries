name: Suspicious Vsls-Agent Command With AgentExtensionPath Load
id: 43103702-5886-11ed-9b6a-0242ac120002
version: 1
schema_version: "1.0"
date: "2022-10-30"
author: bohops
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 43103702-5886-11ed-9b6a-0242ac120002
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects Microsoft Visual Studio vsls-agent.exe lolbin execution with a
  suspicious library load using the --agentExtensionPath parameter. MITRE
  ATT&CK: T1218.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\vsls-agent.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*--agentExtensionPath*"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_commandLine"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Microsoft.VisualStudio.LiveShare.Agent.*"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\vsls-agent.exe'; data_win_eventdata_commandLine matches
  '*--agentExtensionPath*'; data_win_eventdata_commandLine matches
  '*Microsoft.VisualStudio.LiveShare.Agent.*'.

known_false_positives: >
  False positives depend on custom use of vsls-agent.exe. Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://twitter.com/bohops/status/1583916360404729857
  - https://attack.mitre.org/techniques/T1218/

response:
  message: >
    Suspicious Vsls-Agent Command With AgentExtensionPath Load detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
    MITRE ATT&CK: T1218
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218
  custom_tags:
    - agent
    - agentextensionpath
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Vv][Ss][Ll][Ss]-[Aa][Gg][Ee][Nn][Tt]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*--[Aa][Gg][Ee][Nn][Tt][Ee][Xx][Tt][Ee][Nn][Ss][Ii][Oo][Nn][Pp][Aa][Tt][Hh].*/ AND _exists_:data_win_eventdata_commandLine AND NOT (data_win_eventdata_commandLine:/.*[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\.[Vv][Ii][Ss][Uu][Aa][Ll][Ss][Tt][Uu][Dd][Ii][Oo]\.[Ll][Ii][Vv][Ee][Ss][Hh][Aa][Rr][Ee]\.[Aa][Gg][Ee][Nn][Tt]\..*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a20391f8-76fb-437b-abc0-dba2df1952c6
    name: Visual Studio NodejsTools PressAnyKey Arbitrary Binary Execution
    reason: Another Visual Studio component abused as a signed proxy-execution LOLBin
  - id: 65c3ca2c-525f-4ced-968e-246a713d164f
    name: Visual Studio NodejsTools PressAnyKey Renamed Execution
    reason: Renamed variant of the Visual Studio PressAnyKey proxy execution
  - id: 15c7904e-6ad1-4a45-9b46-5fb25df37fd2
    name: Malicious PE Execution by Microsoft Visual Studio Debugger
    reason: Visual Studio debugger launching a malicious PE, same dev-tool-as-LOLBin family
  - id: 5a3164f2-b373-4152-93cf-090b13c12d27
    name: Potentially Suspicious Child Process Of VsCode
    reason: Suspicious child of VS Code, related developer-tooling abuse chain
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Children spawned by vsls-agent
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Vv][Ss][Ll][Ss]-[Aa][Gg][Ee][Nn][Tt]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Non-system image loads by vsls-agent
    query: data_win_system_eventID:"7" AND data_win_eventdata_image:/.*[Vv][Ss][Ll][Ss]-[Aa][Gg][Ee][Nn][Tt]\.[Ee][Xx][Ee]/ AND NOT data_win_eventdata_imageLoaded:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\.*/
    pivot_on: host
    window: 2h
  - name: Visual Studio tool proxy execution
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Pp][Rr][Ee][Ss][Ss][Aa][Nn][Yy][Kk][Ee][Yy]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Vv][Ss][Jj][Ii][Tt][Dd][Ee][Bb][Uu][Gg][Gg][Ee][Rr]\.[Ee][Xx][Ee]/)
    pivot_on: host
    window: 4h
  - name: DLLs written to user-writable paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.[Dd][Ll][Ll]/ AND (data_win_eventdata_targetFilename:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/)
    pivot_on: host
    window: 2h
