name: Windows COM Hijacking InprocServer32 Modification
id: windows-com-hijacking-inprocserver32-001
version: 1
schema_version: "1.0"
date: "2026-02-23"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects modification of InProcServer32 registry keys via reg.exe, indicating 
  COM hijacking for persistence. Adversaries replace legitimate COM object DLL 
  paths with malicious ones, causing malicious code to execute whenever the COM 
  object is loaded. Used by Fancy Bear (APT28) and various Living Off The Land 
  techniques.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - wildcard:
            data_win_eventdata_commandLine: "*InprocServer32*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-23 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-23 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Windows endpoints with Sysmon 
  installed and configured to log process creation events (EventID 1) with full 
  command-line arguments.

known_false_positives: >
  Software installation and updates may modify InProcServer32 keys legitimately. 
  Filter by user context and validate the DLL path points to a trusted location.

references:
  - https://attack.mitre.org/techniques/T1546/015/
  - https://blog.cluster25.duskrise.com/2022/09/23/in-the-footsteps-of-the-fancy-bear-powerpoint-graphite/

response:
  message: >
    COM hijacking via InProcServer32 modification on $agent_name$. 
    Command: $data_win_eventdata_commandLine$. 
    Process: $data_win_eventdata_image$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1546.015
  risk_score: 64
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 64
  threat_objects: []

tags:
  analytic_story:
    - Living Off The Land
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1546.015
  custom_tags:
    - com_hijacking
    - persistence
    - registry_modification
    - inprocserver32
    - lotl
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*InprocServer32.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: de587dce-915e-4218-aac4-835ca6af6f70
    name: Potential Persistence Attempt Via Run Keys Using Reg.EXE
    reason: Attackers stack reg.exe persistence methods; Run keys alongside COM hijack.
  - id: 24357373-078f-44ed-9ac4-6d334a668a11
    name: Direct Autorun Keys Modification
    reason: Another registry persistence write on the same host in the same intrusion.
  - id: f1edd233-30b5-4823-9e6a-c4171b24d316
    name: Rundll32 Registered COM Objects
    reason: Executes registered COM objects, a path by which a hijacked CLSID is triggered.
  - id: d06be4b9-8045-428b-a567-740a26d9db25
    name: Verclsid.exe Runs COM Object
    reason: Verclsid instantiates COM objects and can trigger the hijacked CLSID.
  - id: 62e0298b-e994-4189-bc87-bc699aa62d97
    name: Potential Suspicious Registry File Imported Via Reg.EXE
    reason: reg import is the alternative way to write the same hijack keys.
  - id: 26488ad0-f9fd-4536-876f-52fea846a2e4
    name: HackTool - SharPersist Execution
    reason: SharPersist implements COM hijack and other persistence; its hit would explain this write.
  - id: f548a603-c9f2-4c89-b511-b089f7e94549
    name: Potential Persistence Via Microsoft Compatibility Appraiser
    reason: Sibling persistence technique abusing a SYSTEM-run Microsoft component.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Registry writes to CLSID keys
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*CLSID.*(InprocServer32|InprocHandler32|LocalServer32).*/
    pivot_on: host
    window: 6h
  - name: DLL dropped to user-writable path
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*([Aa]pp[Dd]ata|[Tt]emp|[Pp]rogram[Dd]ata|[Pp]ublic).*\.dll/
    pivot_on: host
    window: 6h
  - name: Unsigned DLL loaded from user-writable path
    query: data_win_system_eventID:7 AND data_win_eventdata_imageLoaded:/.*([Aa]pp[Dd]ata|[Tt]emp|[Pp]rogram[Dd]ata|[Pp]ublic|[Dd]ownloads).*\.dll/ AND data_win_eventdata_signed:false
    pivot_on: host
    window: 24h
  - name: Other reg.exe persistence commands
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Rr]eg\.exe/ AND data_win_eventdata_commandLine:/.*(CurrentVersion.Run|Image File Execution|Winlogon|Userinit|AppInit).*/
    pivot_on: host
    window: 6h
  - name: Scheduled task or service persistence
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ss]chtasks.*\/[Cc]reate.*/ OR /.*sc(\.exe)? +create.*/)
    pivot_on: host
    window: 6h
