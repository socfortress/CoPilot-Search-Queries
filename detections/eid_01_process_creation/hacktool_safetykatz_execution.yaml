name: HackTool - SafetyKatz Execution
id: b1876533-4ed5-4a83-90f3-b8645840a413
version: 1
schema_version: "1.0"
date: "2023-02-04"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: b1876533-4ed5-4a83-90f3-b8645840a413
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of the hacktool SafetyKatz via PE information and
  default Image name. MITRE ATT&CK: T1003.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\SafetyKatz.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "SafetyKatz.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_description:
                    value: "SafetyKatz"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_description
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\SafetyKatz.exe'; data_win_eventdata_originalFileName equals
  'SafetyKatz.exe'; data_win_eventdata_description equals 'SafetyKatz'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/GhostPack/SafetyKatz
  - https://attack.mitre.org/techniques/T1003/001/

response:
  message: >
    HackTool - SafetyKatz Execution detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1003.001
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.001
  custom_tags:
    - hacktool
    - safetykatz
    - process_creation
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ss][Aa][Ff][Ee][Tt][Yy][Kk][Aa][Tt][Zz]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ss][Aa][Ff][Ee][Tt][Yy][Kk][Aa][Tt][Zz]\.[Ee][Xx][Ee]/ OR data_win_eventdata_description:/[Ss][Aa][Ff][Ee][Tt][Yy][Kk][Aa][Tt][Zz]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: SafetyKatz embeds a Mimikatz build; a direct Mimikatz execution on the same host shows the operator iterating on the same credential-theft goal
  - id: 5afee48e-67dd-4e03-a783-f74259dcf998
    name: Potential LSASS Process Dump Via Procdump
    reason: Alternate LSASS dump path (ProcDump) tried before or after SafetyKatz's own MiniDumpWriteDump when one is blocked
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: comsvcs.dll MiniDump is the other common LSASS dump method used by the same operators on the same host
  - id: ffa6861c-4461-4f59-8a41-578c39f3f23e
    name: LSASS Dump Keyword In CommandLine
    reason: Command lines naming LSASS dumps indicate manual or scripted dumping around the SafetyKatz run
  - id: fd877b94-9bb5-4191-bb25-d79cbd93c167
    name: Dumping of Sensitive Hives Via Reg.EXE
    reason: SAM/SECURITY/SYSTEM hive saves complement the LSASS dump to harvest local and cached credentials
  - id: c7d33b50-f690-4b51-8cfb-0fb912a31e57
    name: HackTool - SharpDPAPI Execution
    reason: 'GhostPack sibling: SharpDPAPI decrypts DPAPI secrets with the masterkeys SafetyKatz exposes'
  - id: 7ec2c172-dceb-4c10-92c9-87c1881b7e18
    name: HackTool - Rubeus Execution
    reason: Rubeus follows to reuse harvested hashes/tickets (pass-the-ticket, overpass-the-hash)
  - id: ec570e53-4c76-45a9-804d-dc3f355ff7a7
    name: 7Zip Compressing Dump Files
    reason: The dump file (debug.bin/.dmp) is commonly compressed before exfiltration from the host
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: LSASS process access on this host
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Dump file written to disk (debug.bin / .dmp)
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(\\[Dd][Ee][Bb][Uu][Gg]\.[Bb][Ii][Nn]|\\[Ll][Ss][Aa][Ss][Ss].*|\.[Dd][Mm][Pp])/
    pivot_on:
    - host
    window: 2h
  - name: Mimikatz module command arguments
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa]::|[Ll][Ss][Aa][Dd][Uu][Mm][Pp]::|[Pp][Rr][Ii][Vv][Ii][Ll][Ee][Gg][Ee]::[Dd][Ee][Bb][Uu][Gg]|[Kk][Ee][Rr][Bb][Ee][Rr][Oo][Ss]::|[Tt][Oo][Kk][Ee][Nn]::[Ee][Ll][Ee][Vv][Aa][Tt][Ee]|[Dd][Pp][Aa][Pp][Ii]::).*/
    pivot_on:
    - host
    window: 2h
  - name: Dump compressed or moved off host
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\(7[Zz]\.[Ee][Xx][Ee]|7[Zz][Aa]\.[Ee][Xx][Ee]|[Rr][Aa][Rr]\.[Ee][Xx][Ee]|[Ww][Ii][Nn][Rr][Aa][Rr]\.[Ee][Xx][Ee]|[Mm][Aa][Kk][Ee][Cc][Aa][Bb]\.[Ee][Xx][Ee]|[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee])/ AND data_win_eventdata_commandLine:/.*([Dd][Ee][Bb][Uu][Gg]\.[Bb][Ii][Nn]|\.[Dd][Mm][Pp]|[Dd][Uu][Mm][Pp]).*/
    pivot_on:
    - host
    window: 4h
  - name: Explicit-credential and new-credential logons by this account
    query: (data_win_system_eventID:"4648" OR (data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"9"))
    pivot_on:
    - user
    window: 6h
