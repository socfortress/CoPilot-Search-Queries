name: HackTool - HollowReaper Execution
id: 85d23b42-9a9d-4f8f-b3d7-d2733c1d58f5
version: 1
schema_version: "1.0"
date: "2025-07-01"
author: Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 85d23b42-9a9d-4f8f-b3d7-d2733c1d58f5
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects usage of HollowReaper, a process hollowing shellcode launcher used for
  stealth payload execution through process hollowing. It replaces the memory of
  a legitimate process with custom shellcode, allowing the attacker to execute
  payloads under the guise of trusted binaries. MITRE ATT&CK: T1055.012.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\HollowReaper.exe"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\HollowReaper.exe'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/vari-sh/RedTeamGrimoire/tree/b5e7635d34db6e1f0398d8847e8f293186e947c5/HollowReaper
  - https://attack.mitre.org/techniques/T1055/012/

response:
  message: >
    HackTool - HollowReaper Execution detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1055.012
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1055.012
  custom_tags:
    - hacktool
    - hollowreaper
    - process_creation
    - sysmon
    - privilege_escalation
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Hh][Oo][Ll][Ll][Oo][Ww][Rr][Ee][Aa][Pp][Ee][Rr]\.[Ee][Xx][Ee]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d8937fe7-42d5-4b4d-8178-e089c908f63f
    name: Potential Pikabot Hollowing Activity
    reason: Pikabot hollowing is the same T1055.012 technique; co-occurrence suggests a hollowing campaign on the host
  - id: a1a144b7-5c9b-4853-a559-2172be8d4a03
    name: Remote Thread Creation In Uncommon Target Image
    reason: Injection into an uncommon target image is the typical outcome of shellcode launchers
  - id: 66d31e5f-52d6-40a4-9615-002d3789a119
    name: Remote Thread Creation By Uncommon Source Image
    reason: Remote thread by an uncommon source image would be the loader injecting its shellcode
  - id: 02d1d718-dd13-41af-989d-ea85c7fab93f
    name: Rare Remote Thread Creation By Uncommon Source Image
    reason: Rare remote thread source is a related shellcode-execution artifact of the launcher
  - id: d0d2f720-d14f-448d-8242-51ff396a334e
    name: HackTool - Generic Process Access
    reason: Generic hacktool process access with write rights accompanies hollowing setup
  - id: f239b326-2f41-4d6b-9dfa-c846a60ef505
    name: Password Dumper Remote Thread in LSASS
    reason: Once shellcode runs under a trusted process, a credential-dump remote thread into LSASS is a likely next step
  - id: 5ef9853e-4d0e-4a70-846f-a9ca37d876da
    name: Potential Credential Dumping Activity Via LSASS
    reason: Hollowed payloads commonly go after LSASS credentials
  - id: 322ed9ec-fcab-4f67-9a34-e7c6aef43614
    name: New Port Forwarding Rule Added Via Netsh.EXE
    reason: A payload inside a hollowed process may set up port forwarding for pivoting
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Trusted binary spawned by a parent in a user-writable path
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Ss][Vv][Cc][Hh][Oo][Ss][Tt]|[Nn][Oo][Tt][Ee][Pp][Aa][Dd]|[Rr][Uu][Nn][Dd][Ll][Ll]32|[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]|[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]|[Dd][Ll][Ll][Hh][Oo][Ss][Tt]|[Ss][Pp][Oo][Oo][Ll][Ss][Vv]|[Ww][Ee][Rr][Ff][Aa][Uu][Ll][Tt])\.[Ee][Xx][Ee]/ AND data_win_eventdata_parentImage:/.*(\\([Tt][Ee][Mm][Pp]|[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]|[Aa][Pp][Pp][Dd][Aa][Tt][Aa]|[Pp][Uu][Bb][Ll][Ii][Cc])\\).*/
    pivot_on: host
    window: 2h
  - name: Remote thread creation into system processes
    query: data_win_system_eventID:"8" AND data_win_eventdata_targetImage:/.*\\([Ss][Vv][Cc][Hh][Oo][Ss][Tt]|[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]|[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]|[Ll][Ss][Aa][Ss][Ss]|[Nn][Oo][Tt][Ee][Pp][Aa][Dd])\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Process access with injection rights to system processes
    query: data_win_system_eventID:"10" AND data_win_eventdata_grantedAccess:("0x1fffff" OR "0x1f3fff" OR "0x143a" OR "0x1410") AND data_win_eventdata_targetImage:/.*\\([Ss][Vv][Cc][Hh][Oo][Ss][Tt]|[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]|[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]|[Ll][Ss][Aa][Ss][Ss])\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: LSASS access follow-on
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\([Ll][Ss][Aa][Ss][Ss])\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 4h
  - name: External connection from a commonly hollowed process
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:"true" AND data_win_eventdata_image:/.*\\([Ss][Vv][Cc][Hh][Oo][Ss][Tt]|[Nn][Oo][Tt][Ee][Pp][Aa][Dd]|[Rr][Uu][Nn][Dd][Ll][Ll]32|[Ww][Ee][Rr][Ff][Aa][Uu][Ll][Tt])\.[Ee][Xx][Ee]/ AND NOT data_win_eventdata_destinationIp:/(10\..*|192\.168\..*|127\..*)/
    pivot_on: host
    window: 2h
