name: Windows PowerShell Disable Security Monitoring
id: windows-powershell-disable-security-monitoring-001
version: 1
schema_version: "1.0"
date: "2026-02-12"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects attempts to disable Windows Defender security features via PowerShell 
  Set-MpPreference commands. Covers disabling real-time monitoring, behavior monitoring, 
  script scanning, IOAV protection, archive scanning, and other Defender features. 
  Also detects abbreviated parameter forms. This is a common pre-ransomware step used 
  by REvil and other threat actors.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image: "*powershell*"
              - wildcard:
                  data_win_eventdata_image: "*pwsh*"
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine: "*Set-MpPreference*"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine: "*DisableRealtimeMonitoring*"
              - wildcard:
                  data_win_eventdata_commandLine: "*DisableBehaviorMonitoring*"
              - wildcard:
                  data_win_eventdata_commandLine: "*DisableScriptScanning*"
              - wildcard:
                  data_win_eventdata_commandLine: "*DisableIOAVProtection*"
              - wildcard:
                  data_win_eventdata_commandLine: "*DisableBlockAtFirstSeen*"
              - wildcard:
                  data_win_eventdata_commandLine: "*DisableArchiveScanning*"
              - wildcard:
                  data_win_eventdata_commandLine: "*DisableRemovableDriveScanning*"
              - wildcard:
                  data_win_eventdata_commandLine: "*DisableScanningNetworkFiles*"
              - wildcard:
                  data_win_eventdata_commandLine: "*DisableCatchupFullScan*"
              - wildcard:
                  data_win_eventdata_commandLine: "*DisableCatchupQuickScan*"
              - wildcard:
                  data_win_eventdata_commandLine: "*DisableRestorePoint*"
              - wildcard:
                  data_win_eventdata_commandLine: "*PUAProtection*"
              - wildcard:
                  data_win_eventdata_commandLine: "*CloudBlockLevel*"
              - wildcard:
                  data_win_eventdata_commandLine: "*-drtm *"
              - wildcard:
                  data_win_eventdata_commandLine: "*-dbm *"
              - wildcard:
                  data_win_eventdata_commandLine: "*-dioavp *"
              - wildcard:
                  data_win_eventdata_commandLine: "*-dscrptsc *"
              - wildcard:
                  data_win_eventdata_commandLine: "*-dbaf *"
              - wildcard:
                  data_win_eventdata_commandLine: "*-darchsc *"
              - wildcard:
                  data_win_eventdata_commandLine: "*-drdsc *"
              - wildcard:
                  data_win_eventdata_commandLine: "*-dsnf *"
              - wildcard:
                  data_win_eventdata_commandLine: "*-dcfsc *"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-12 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-12 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Windows endpoints with Sysmon 
  installed and configured to log process creation events (EventID 1) with full 
  command-line arguments. The index pattern should match your Wazuh index naming 
  convention.

known_false_positives: >
  Some administrative scripts may legitimately modify Defender settings. Filter 
  based on user context and parent process. Any automated disabling of Defender 
  features should be investigated.

references:
  - https://attack.mitre.org/techniques/T1562/001/
  - https://docs.microsoft.com/en-us/powershell/module/defender/set-mppreference
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1562.001/T1562.001.md

response:
  message: >
    Windows Defender security feature disabled on $agent_name$. 
    Command line: $data_win_eventdata_commandLine$. 
    Parent process: $data_win_eventdata_parentImage$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1562.001
  risk_score: 50
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects: []

tags:
  analytic_story:
    - Ransomware
    - Revil Ransomware
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1562.001
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*powershell.*/ OR data_win_eventdata_image:/.*pwsh.*/) AND data_win_eventdata_commandLine:/.*Set-MpPreference.*/ AND (data_win_eventdata_commandLine:/.*DisableRealtimeMonitoring.*/ OR data_win_eventdata_commandLine:/.*DisableBehaviorMonitoring.*/ OR data_win_eventdata_commandLine:/.*DisableScriptScanning.*/ OR data_win_eventdata_commandLine:/.*DisableIOAVProtection.*/ OR data_win_eventdata_commandLine:/.*DisableBlockAtFirstSeen.*/ OR data_win_eventdata_commandLine:/.*DisableArchiveScanning.*/ OR data_win_eventdata_commandLine:/.*DisableRemovableDriveScanning.*/ OR data_win_eventdata_commandLine:/.*DisableScanningNetworkFiles.*/ OR data_win_eventdata_commandLine:/.*DisableCatchupFullScan.*/ OR data_win_eventdata_commandLine:/.*DisableCatchupQuickScan.*/ OR data_win_eventdata_commandLine:/.*DisableRestorePoint.*/ OR data_win_eventdata_commandLine:/.*PUAProtection.*/ OR data_win_eventdata_commandLine:/.*CloudBlockLevel.*/ OR data_win_eventdata_commandLine:/.*\-drtm\s.*/ OR data_win_eventdata_commandLine:/.*\-dbm\s.*/ OR data_win_eventdata_commandLine:/.*\-dioavp\s.*/ OR data_win_eventdata_commandLine:/.*\-dscrptsc\s.*/ OR data_win_eventdata_commandLine:/.*\-dbaf\s.*/ OR data_win_eventdata_commandLine:/.*\-darchsc\s.*/ OR data_win_eventdata_commandLine:/.*\-drdsc\s.*/ OR data_win_eventdata_commandLine:/.*\-dsnf\s.*/ OR data_win_eventdata_commandLine:/.*\-dcfsc\s.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c148a894-dd93-11eb-bf2a-acde48001122
    name: Powershell Disable Security Monitoring
    reason: Sibling detection of the same Set-MpPreference tampering; corroborates the command from another rule shape.
  - id: a7ee1722-c3c5-aeff-3212-c777e4733217
    name: Disable Windows Defender AV Security Monitoring
    reason: Same real-time protection disable through other command shapes; shows breadth of tampering.
  - id: b28e58e4-2a72-4fae-bdee-0fbe904db642
    name: Windows Defender Real-time Protection Disabled
    reason: Defender log confirmation that real-time protection actually went off.
  - id: bc275be9-0bec-4d77-8c8f-281a2df6710f
    name: Windows Defender Malware And PUA Scanning Disabled
    reason: Defender log confirmation that scanning features were disabled.
  - id: 17769c90-230e-488b-a463-e05c08e9d48f
    name: Powershell Defender Exclusion
    reason: Often combined with disabling monitoring.
  - id: 1e8a9b4d-3c2a-4f9b-8d1e-7c6a5b4f3d2e
    name: PowerShell Defender Threat Severity Default Action Set to 'Allow' or 'NoAction'
    reason: Sibling Defender-impairment step in the same playbook.
  - id: c9fbe8e9-119d-40a6-9b59-dd58a5d84429
    name: Potential Ransomware or Unauthorized MBR Tampering Via Bcdedit.EXE
    reason: Pre-ransomware step typically following Defender disable (REvil-style).
  - id: dee4af55-1f22-4e1d-a9d2-4bdc7ecb472a
    name: Disabled Volume Snapshots
    reason: Recovery inhibition that commonly follows defense impairment in ransomware chains.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: All Defender preference changes
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ss]et|[Aa]dd|[Rr]emove)-[Mm]p[Pp]reference.*/
    pivot_on: host
    window: 4h
  - name: Defender operational config-change events
    query: (data_win_system_eventID:"5007" OR data_win_system_eventID:"5001" OR data_win_system_eventID:"5004") AND (data_win_eventdata_newValue:/.*Exclusions.*/ OR data_win_eventdata_newValue:/.*DisableRealtimeMonitoring.*/ OR data_win_eventdata_newValue:/.*ThreatSeverityDefaultAction.*/ OR data_win_eventdata_newValue:/.*DisableBehaviorMonitoring.*/)
    pivot_on: host
    window: 4h
  - name: Defender registry setting writes
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*Windows [Dd]efender.*/ AND (data_win_eventdata_targetObject:/.*Exclusions.*/ OR data_win_eventdata_targetObject:/.*Real-Time Protection.*/ OR data_win_eventdata_targetObject:/.*Threats.*/ OR data_win_eventdata_targetObject:/.*DisableAntiSpyware.*/)
    pivot_on: host
    window: 4h
  - name: 'Ransomware prep: shadow copy, backup and recovery tampering'
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Vv]ssadmin.*[Dd]elete.*[Ss]hadows.*/ OR data_win_eventdata_commandLine:/.*[Bb]cdedit.*([Rr]ecoveryenabled|[Ii]gnoreallfailures).*/ OR data_win_eventdata_commandLine:/.*[Ww]badmin.*[Dd]elete.*[Cc]atalog.*/ OR data_win_eventdata_commandLine:/.*[Ww]mic.*[Ss]hadowcopy.*[Dd]elete.*/)
    pivot_on: host
    window: 6h
  - name: Payload download after disable
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ OR data_win_eventdata_image:/.*[Pp]wsh.*/) AND data_win_eventdata_commandLine:/.*([Dd]ownload[Ss]tring|[Dd]ownload[Ff]ile|[Ii]nvoke-[Ww]eb[Rr]equest|[Nn]et\.[Ww]eb[Cc]lient|[Ss]tart-[Bb]its[Tt]ransfer|[Ii]nvoke-[Ee]xpression).*/
    pivot_on: host
    window: 4h
