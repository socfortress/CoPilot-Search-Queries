name: Windows PowerShell Disable Security Monitoring
id: windows-powershell-disable-security-monitoring-001
version: 1
schema_version: "1.0"
date: "2026-02-12"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects attempts to disable Windows Defender security features via PowerShell 
  Set-MpPreference commands. Covers disabling real-time monitoring, behavior monitoring, 
  script scanning, IOAV protection, archive scanning, and other Defender features. 
  Also detects abbreviated parameter forms. This is a common pre-ransomware step used 
  by REvil and other threat actors.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image: "*powershell*"
              - wildcard:
                  data_win_eventdata_image: "*pwsh*"
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine: "*Set-MpPreference*"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine: "*DisableRealtimeMonitoring*"
              - wildcard:
                  data_win_eventdata_commandLine: "*DisableBehaviorMonitoring*"
              - wildcard:
                  data_win_eventdata_commandLine: "*DisableScriptScanning*"
              - wildcard:
                  data_win_eventdata_commandLine: "*DisableIOAVProtection*"
              - wildcard:
                  data_win_eventdata_commandLine: "*DisableBlockAtFirstSeen*"
              - wildcard:
                  data_win_eventdata_commandLine: "*DisableArchiveScanning*"
              - wildcard:
                  data_win_eventdata_commandLine: "*DisableRemovableDriveScanning*"
              - wildcard:
                  data_win_eventdata_commandLine: "*DisableScanningNetworkFiles*"
              - wildcard:
                  data_win_eventdata_commandLine: "*DisableCatchupFullScan*"
              - wildcard:
                  data_win_eventdata_commandLine: "*DisableCatchupQuickScan*"
              - wildcard:
                  data_win_eventdata_commandLine: "*DisableRestorePoint*"
              - wildcard:
                  data_win_eventdata_commandLine: "*PUAProtection*"
              - wildcard:
                  data_win_eventdata_commandLine: "*CloudBlockLevel*"
              - wildcard:
                  data_win_eventdata_commandLine: "*-drtm *"
              - wildcard:
                  data_win_eventdata_commandLine: "*-dbm *"
              - wildcard:
                  data_win_eventdata_commandLine: "*-dioavp *"
              - wildcard:
                  data_win_eventdata_commandLine: "*-dscrptsc *"
              - wildcard:
                  data_win_eventdata_commandLine: "*-dbaf *"
              - wildcard:
                  data_win_eventdata_commandLine: "*-darchsc *"
              - wildcard:
                  data_win_eventdata_commandLine: "*-drdsc *"
              - wildcard:
                  data_win_eventdata_commandLine: "*-dsnf *"
              - wildcard:
                  data_win_eventdata_commandLine: "*-dcfsc *"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-12 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-12 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Windows endpoints with Sysmon 
  installed and configured to log process creation events (EventID 1) with full 
  command-line arguments. The index pattern should match your Wazuh index naming 
  convention.

known_false_positives: >
  Some administrative scripts may legitimately modify Defender settings. Filter 
  based on user context and parent process. Any automated disabling of Defender 
  features should be investigated.

references:
  - https://attack.mitre.org/techniques/T1562/001/
  - https://docs.microsoft.com/en-us/powershell/module/defender/set-mppreference
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1562.001/T1562.001.md

response:
  message: >
    Windows Defender security feature disabled on $agent_name$. 
    Command line: $data_win_eventdata_commandLine$. 
    Parent process: $data_win_eventdata_parentImage$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1562.001
  risk_score: 50
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects: []

tags:
  analytic_story:
    - Ransomware
    - Revil Ransomware
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1562.001
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*powershell.*/ OR data_win_eventdata_image:/.*pwsh.*/) AND data_win_eventdata_commandLine:/.*Set-MpPreference.*/ AND (data_win_eventdata_commandLine:/.*DisableRealtimeMonitoring.*/ OR data_win_eventdata_commandLine:/.*DisableBehaviorMonitoring.*/ OR data_win_eventdata_commandLine:/.*DisableScriptScanning.*/ OR data_win_eventdata_commandLine:/.*DisableIOAVProtection.*/ OR data_win_eventdata_commandLine:/.*DisableBlockAtFirstSeen.*/ OR data_win_eventdata_commandLine:/.*DisableArchiveScanning.*/ OR data_win_eventdata_commandLine:/.*DisableRemovableDriveScanning.*/ OR data_win_eventdata_commandLine:/.*DisableScanningNetworkFiles.*/ OR data_win_eventdata_commandLine:/.*DisableCatchupFullScan.*/ OR data_win_eventdata_commandLine:/.*DisableCatchupQuickScan.*/ OR data_win_eventdata_commandLine:/.*DisableRestorePoint.*/ OR data_win_eventdata_commandLine:/.*PUAProtection.*/ OR data_win_eventdata_commandLine:/.*CloudBlockLevel.*/ OR data_win_eventdata_commandLine:/.*\-drtm\s.*/ OR data_win_eventdata_commandLine:/.*\-dbm\s.*/ OR data_win_eventdata_commandLine:/.*\-dioavp\s.*/ OR data_win_eventdata_commandLine:/.*\-dscrptsc\s.*/ OR data_win_eventdata_commandLine:/.*\-dbaf\s.*/ OR data_win_eventdata_commandLine:/.*\-darchsc\s.*/ OR data_win_eventdata_commandLine:/.*\-drdsc\s.*/ OR data_win_eventdata_commandLine:/.*\-dsnf\s.*/ OR data_win_eventdata_commandLine:/.*\-dcfsc\s.*/)

correlation:
  # Authored by the correlation engine for review. Related CoPilot Searches to run
  # around an alert from this rule, scoped to the same host/user/IP within the window.
  related_rules:
    - id: 2452e632-9e0d-11eb-bacd-acde48001122
      name: "DNS Exfiltration Using Nslookup App"
      reason: "same analytic story: Compromised Windows Host"
    - id: cc316032-924a-11eb-91a2-acde48001122
      name: "DSQuery Domain Discovery"
      reason: "same analytic story: Compromised Windows Host"
    - id: 5ee2bcd0-b2ff-11eb-bb34-acde48001122
      name: "Delete ShadowCopy With PowerShell"
      reason: "same analytic story: Ransomware"
    - id: 9b3af1e6-5b68-11eb-ae93-0242ac130002
      name: "Detect MSHTA Url in Command Line"
      reason: "same analytic story: Compromised Windows Host"
    - id: 32e0baea-b3f1-11eb-a2ce-acde48001122
      name: "Detect RClone Command-Line Usage"
      reason: "same analytic story: Ransomware"
    - id: 72170ec5-f7d2-42f5-aefb-2b8be6aad15f
      name: "Detect Regasm Spawning a Process"
      reason: "same analytic story: Compromised Windows Host"
    - id: bc477b57-5c21-4ab6-9c33-668772e7f114
      name: "Detect Regsvcs Spawning a Process"
      reason: "same analytic story: Compromised Windows Host"
    - id: 070e9b80-6252-11eb-ae93-0242ac130002
      name: "Detect Regsvr32 Application Control Bypass"
      reason: "same analytic story: Compromised Windows Host"
    - id: ccad96d7-a48c-4f13-8b9c-9f6a31cba454
      name: "Detect Remote Access Software Usage FileInfo"
      reason: "same analytic story: Ransomware"
    - id: 6dca1124-b3ec-11eb-9328-acde48001122
      name: "Detect Renamed RClone"
      reason: "same analytic story: Ransomware"
    - id: a0bdd2f6-c2ff-11eb-b918-acde48001122
      name: "Detect SharpHound Command-Line Arguments"
      reason: "same analytic story: Ransomware"
    - id: dd04b29a-beed-11eb-87bc-acde48001122
      name: "Detect SharpHound Usage"
      reason: "same analytic story: Ransomware"
  window: 1h
  enrichment_searches:
  # Rule-specific telemetry pivots the engine runs around an alert from this rule,
  # scoped to the alert's host/user/IP within the window (behaviour-targeted, not a sweep).
    - name: "Security-tool / Defender tampering on this host"
      query: 'data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee][Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Aa][Nn][Tt][Ii][Ss][Pp][Yy][Ww][Aa][Rr][Ee].*/ OR data_win_eventdata_commandLine:/.*[Aa][Dd][Dd]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee] -[Ee][Xx][Cc][Ll][Uu][Ss][Ii][Oo][Nn][Pp][Aa][Tt][Hh].*/ OR data_win_eventdata_commandLine:/.*[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll].*/ OR data_win_eventdata_commandLine:/.*[Cc][Ll][Ee][Aa][Rr]-[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg].*/ OR data_win_eventdata_commandLine:/.*[Ff][Ss][Uu][Tt][Ii][Ll] [Uu][Ss][Nn] [Dd][Ee][Ll][Ee][Tt][Ee][Jj][Oo][Uu][Rr][Nn][Aa][Ll].*/ OR data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ss][Tt][Oo][Pp]-[Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc] [Ss][Tt][Oo][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc] [Cc][Oo][Nn][Ff][Ii][Gg].*/)'
      pivot_on: [host]
      window: 2h
    - name: "Follow-on LOLBin / signed-binary-proxy execution on this host"
      query: 'data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|\\[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Aa][Ss][Mm]\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Cc][Ss]\.[Ee][Xx][Ee]|\\[Mm][Ss][Bb][Uu][Ii][Ll][Dd]\.[Ee][Xx][Ee]|\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]|\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]|\\[Cc][Mm][Ss][Tt][Pp]\.[Ee][Xx][Ee]|\\[Oo][Dd][Bb][Cc][Cc][Oo][Nn][Ff]\.[Ee][Xx][Ee]|\\[Ff][Oo][Rr][Ff][Ii][Ll][Ee][Ss]\.[Ee][Xx][Ee]|\\[Pp][Cc][Aa][Ll][Uu][Aa]\.[Ee][Xx][Ee]|\\[Mm][Aa][Vv][Ii][Nn][Jj][Ee][Cc][Tt]\.[Ee][Xx][Ee]|\\[Ss][Cc][Rr][Ii][Pp][Tt][Rr][Uu][Nn][Nn][Ee][Rr]\.[Ee][Xx][Ee])/'
      pivot_on: [host]
      window: 1h
    - name: "Outbound connections by script interpreters on this host"
      query: 'data_win_system_eventID:"3" AND data_win_eventdata_image:/.*(\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]|\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]_[Ii][Ss][Ee]\.[Ee][Xx][Ee]|\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]|\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee])/'
      pivot_on: [host]
      window: 1h
