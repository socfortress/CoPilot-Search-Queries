name: Registry Export of Third-Party Credentials
id: cc1abf27-78a3-4ac5-a51c-f3070b1d8e40
version: 1
schema_version: "1.0"
date: "2025-05-22"
author: Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: cc1abf27-78a3-4ac5-a51c-f3070b1d8e40
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the use of reg.exe to export registry paths associated with
  third-party credentials. Credential stealers have been known to use this
  technique to extract sensitive information from the registry. MITRE ATT&CK:
  T1552.002.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\reg.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "reg.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*save*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*export*"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Software\\\\Aerofox\\\\Foxmail\\\\V3.1*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Software\\\\Aerofox\\\\FoxmailPreview*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Software\\\\DownloadManager\\\\Passwords*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Software\\\\FTPWare\\\\COREFTP\\\\Sites*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Software\\\\IncrediMail\\\\Identities*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Software\\\\Martin Prikryl\\\\WinSCP 2\\\\Sessions*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Software\\\\Mobatek\\\\MobaXterm*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Software\\\\OpenSSH\\\\Agent\\\\Keys*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Software\\\\OpenVPN-GUI\\\\configs*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Software\\\\ORL\\\\WinVNC3\\\\Password*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Software\\\\Qualcomm\\\\Eudora\\\\CommandLine*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Software\\\\RealVNC\\\\WinVNC4*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Software\\\\RimArts\\\\B2\\\\Settings*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Software\\\\SimonTatham\\\\PuTTY\\\\Sessions*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Software\\\\SimonTatham\\\\PuTTY\\\\SshHostKeys*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Software\\\\Sota\\\\FFFTP*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Software\\\\TightVNC\\\\Server*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Software\\\\WOW6432Node\\\\Radmin\\\\v3.0\\\\Server\\\\Parameters\\\\Radmin*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches '*\reg.exe';
  data_win_eventdata_originalFileName equals 'reg.exe';
  data_win_eventdata_commandLine matches '*save*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.virustotal.com/gui/file/fdc86a5b3d7df37a72c3272836f743747c47bfbc538f05af9ecf78547fa2e789/behavior
  - https://attack.mitre.org/techniques/T1552/002/

response:
  message: >
    Registry Export of Third-Party Credentials detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1552.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1552.002
  custom_tags:
    - registry
    - export
    - third
    - process_creation
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Rr][Ee][Gg]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Rr][Ee][Gg]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*[Ss][Aa][Vv][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ee][Xx][Pp][Oo][Rr][Tt].*/) AND (data_win_eventdata_commandLine:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Aa][Ee][Rr][Oo][Ff][Oo][Xx]\\[Ff][Oo][Xx][Mm][Aa][Ii][Ll]\\[Vv]3\.1.*/ OR data_win_eventdata_commandLine:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Aa][Ee][Rr][Oo][Ff][Oo][Xx]\\[Ff][Oo][Xx][Mm][Aa][Ii][Ll][Pp][Rr][Ee][Vv][Ii][Ee][Ww].*/ OR data_win_eventdata_commandLine:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Mm][Aa][Nn][Aa][Gg][Ee][Rr]\\[Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd][Ss].*/ OR data_win_eventdata_commandLine:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Ff][Tt][Pp][Ww][Aa][Rr][Ee]\\[Cc][Oo][Rr][Ee][Ff][Tt][Pp]\\[Ss][Ii][Tt][Ee][Ss].*/ OR data_win_eventdata_commandLine:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Ii][Nn][Cc][Rr][Ee][Dd][Ii][Mm][Aa][Ii][Ll]\\[Ii][Dd][Ee][Nn][Tt][Ii][Tt][Ii][Ee][Ss].*/ OR data_win_eventdata_commandLine:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Aa][Rr][Tt][Ii][Nn] [Pp][Rr][Ii][Kk][Rr][Yy][Ll]\\[Ww][Ii][Nn][Ss][Cc][Pp] 2\\[Ss][Ee][Ss][Ss][Ii][Oo][Nn][Ss].*/ OR data_win_eventdata_commandLine:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Oo][Bb][Aa][Tt][Ee][Kk]\\[Mm][Oo][Bb][Aa][Xx][Tt][Ee][Rr][Mm].*/ OR data_win_eventdata_commandLine:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Oo][Pp][Ee][Nn][Ss][Ss][Hh]\\[Aa][Gg][Ee][Nn][Tt]\\[Kk][Ee][Yy][Ss].*/ OR data_win_eventdata_commandLine:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Oo][Pp][Ee][Nn][Vv][Pp][Nn]-[Gg][Uu][Ii]\\[Cc][Oo][Nn][Ff][Ii][Gg][Ss].*/ OR data_win_eventdata_commandLine:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Oo][Rr][Ll]\\[Ww][Ii][Nn][Vv][Nn][Cc]3\\[Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd].*/ OR data_win_eventdata_commandLine:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Qq][Uu][Aa][Ll][Cc][Oo][Mm][Mm]\\[Ee][Uu][Dd][Oo][Rr][Aa]\\[Cc][Oo][Mm][Mm][Aa][Nn][Dd][Ll][Ii][Nn][Ee].*/ OR data_win_eventdata_commandLine:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Rr][Ee][Aa][Ll][Vv][Nn][Cc]\\[Ww][Ii][Nn][Vv][Nn][Cc]4.*/ OR data_win_eventdata_commandLine:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Rr][Ii][Mm][Aa][Rr][Tt][Ss]\\[Bb]2\\[Ss][Ee][Tt][Tt][Ii][Nn][Gg][Ss].*/ OR data_win_eventdata_commandLine:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Ss][Ii][Mm][Oo][Nn][Tt][Aa][Tt][Hh][Aa][Mm]\\[Pp][Uu][Tt][Tt][Yy]\\[Ss][Ee][Ss][Ss][Ii][Oo][Nn][Ss].*/ OR data_win_eventdata_commandLine:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Ss][Ii][Mm][Oo][Nn][Tt][Aa][Tt][Hh][Aa][Mm]\\[Pp][Uu][Tt][Tt][Yy]\\[Ss][Ss][Hh][Hh][Oo][Ss][Tt][Kk][Ee][Yy][Ss].*/ OR data_win_eventdata_commandLine:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Ss][Oo][Tt][Aa]\\[Ff][Ff][Ff][Tt][Pp].*/ OR data_win_eventdata_commandLine:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Tt][Ii][Gg][Hh][Tt][Vv][Nn][Cc]\\[Ss][Ee][Rr][Vv][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Ww][Oo][Ww]6432[Nn][Oo][Dd][Ee]\\[Rr][Aa][Dd][Mm][Ii][Nn]\\[Vv]3\.0\\[Ss][Ee][Rr][Vv][Ee][Rr]\\[Pp][Aa][Rr][Aa][Mm][Ee][Tt][Ee][Rr][Ss]\\[Rr][Aa][Dd][Mm][Ii][Nn].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e0b0c2ab-3d52-46d9-8cb7-049dc775fbd1
    name: Enumeration for Credentials in Registry
    reason: 'Precursor: querying credential-bearing keys typically precedes exporting them.'
  - id: a0e417e2-2fa1-40da-b6d2-e094cd5e1191
    name: Registry Enumeration via WMI Stdregprov
    reason: Alternate discovery path that finds WinSCP/MobaXterm-style keys without reg.exe.
  - id: fd877b94-9bb5-4191-bb25-d79cbd93c167
    name: Dumping of Sensitive Hives Via Reg.EXE
    reason: 'Same actor pattern: reg save of SAM/SECURITY/SYSTEM often accompanies third-party credential harvest.'
  - id: 82880171-b475-4201-b811-e9c826cd5eaa
    name: Exports Critical Registry Keys To a File
    reason: Generic registry export; co-fires when the credential export is part of a broader harvest.
  - id: 07f8bdc2-c9b3-472a-9817-5a670b872f53
    name: Potential Reconnaissance For Cached Credentials Via Cmdkey.EXE
    reason: Parallel credential-harvest step in stealer playbooks.
  - id: e7be6119-fc37-43f0-ad4f-1f3f99be2f9f
    name: Copying Sensitive Files with Credential Data
    reason: Complementary file-based credential collection by the same stealer.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Reg.exe export or save activity
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Rr][Ee][Gg]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*[Ee][Xx][Pp][Oo][Rr][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ss][Aa][Vv][Ee].*/)
    pivot_on: host
    window: 6h
  - name: Archiving or uploading of .reg exports
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*\.[Rr][Ee][Gg].*/ AND (data_win_eventdata_commandLine:/.*[Rr][Aa][Rr].*/ OR data_win_eventdata_commandLine:/.*[Zz][Ii][Pp].*/ OR data_win_eventdata_commandLine:/.*7[Zz].*/ OR data_win_eventdata_commandLine:/.*[Cc][Uu][Rr][Ll].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]-[Aa][Rr][Cc][Hh][Ii][Vv][Ee].*/)
    pivot_on: host
    window: 6h
  - name: Registry export files created
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.[Rr][Ee][Gg]/
    pivot_on: host
    window: 6h
  - name: Outbound connections from transfer utilities
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*\\[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]/)
    pivot_on: host
    window: 6h
  - name: Remote admin and VPN client launches
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Ss][Cc][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Uu][Tt][Tt][Yy]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Oo][Bb][Aa][Xx][Tt][Ee][Rr][Mm]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Oo][Pp][Ee][Nn][Vv][Pp][Nn]-[Gg][Uu][Ii]\.[Ee][Xx][Ee]/)
    pivot_on: host
    window: 24h
