                              data_win_eventdata_image:
                                value: "*\\\\Common Files\\\\Microsoft Shared\\\\*"
                                case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\OleView.exe"
                          case_insensitive: true
                    - exists:
