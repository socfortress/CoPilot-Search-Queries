                                      value: "*\\\\Microsoft SDK*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*\\\\Windows Kit*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*\\\\Windows Resource Kit\\\\*"
                                      case_insensitive: true
                              minimum_should_match: 1
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\rc.exe"
                          case_insensitive: true
                    - exists:
                        field: "data_win_eventdata_image"
                    - bool:
                        must_not:
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*\\\\Microsoft Visual Studio*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*\\\\Microsoft SDK*"
                                      case_insensitive: true
                                - wildcard:
