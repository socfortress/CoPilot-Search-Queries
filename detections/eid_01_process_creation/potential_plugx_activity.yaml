                        data_win_eventdata_image:
                          value: "*\\\\dvcemumanager.exe"
                          case_insensitive: true
                    - exists:
                        field: "data_win_eventdata_image"
                    - bool:
                        must_not:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\Microsoft Device Emulator\\\\*"
                                case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\Gadget.exe"
                          case_insensitive: true
                    - exists:
                        field: "data_win_eventdata_image"
                    - bool:
                        must_not:
                          - wildcard:
