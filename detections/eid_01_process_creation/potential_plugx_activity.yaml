name: Potential PlugX Activity
id: aeab5ec5-be14-471a-80e8-e344418305c2
version: 1
schema_version: "1.0"
date: "2023-02-03"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: aeab5ec5-be14-471a-80e8-e344418305c2
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of an executable that is typically used by PlugX for DLL
  side loading starting from an uncommon location. MITRE ATT&CK: T1574.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\CamMute.exe"
                          case_insensitive: true
                    - exists:
                        field: "data_win_eventdata_image"
                    - bool:
                        must_not:
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*\\\\Lenovo\\\\Communication Utility\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*\\\\Lenovo\\\\Communications Utility\\\\*"
                                      case_insensitive: true
                              minimum_should_match: 1
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\chrome_frame_helper.exe"
                          case_insensitive: true
                    - exists:
                        field: "data_win_eventdata_image"
                    - bool:
                        must_not:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\Google\\\\Chrome\\\\application\\\\*"
                                case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\dvcemumanager.exe"
                          case_insensitive: true
                    - exists:
                        field: "data_win_eventdata_image"
                    - bool:
                        must_not:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\Microsoft Device Emulator\\\\*"
                                case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\Gadget.exe"
                          case_insensitive: true
                    - exists:
                        field: "data_win_eventdata_image"
                    - bool:
                        must_not:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\Windows Media Player\\\\*"
                                case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\hcc.exe"
                          case_insensitive: true
                    - exists:
                        field: "data_win_eventdata_image"
                    - bool:
                        must_not:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\HTML Help Workshop\\\\*"
                                case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\hkcmd.exe"
                          case_insensitive: true
                    - exists:
                        field: "data_win_eventdata_image"
                    - bool:
                        must_not:
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*\\\\System32\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*\\\\SysNative\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*\\\\SysWow64\\\\*"
                                      case_insensitive: true
                              minimum_should_match: 1
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\Mc.exe"
                          case_insensitive: true
                    - exists:
                        field: "data_win_eventdata_image"
                    - bool:
                        must_not:
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*\\\\Microsoft Visual Studio*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*\\\\Microsoft SDK*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*\\\\Windows Kit*"
                                      case_insensitive: true
                              minimum_should_match: 1
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\MsMpEng.exe"
                          case_insensitive: true
                    - exists:
                        field: "data_win_eventdata_image"
                    - bool:
                        must_not:
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*\\\\Microsoft Security Client\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*\\\\Windows Defender\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*\\\\AntiMalware\\\\*"
                                      case_insensitive: true
                              minimum_should_match: 1
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\msseces.exe"
                          case_insensitive: true
                    - exists:
                        field: "data_win_eventdata_image"
                    - bool:
                        must_not:
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*\\\\Microsoft Security Center\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*\\\\Microsoft Security Client\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*\\\\Microsoft Security Essentials\\\\*"
                                      case_insensitive: true
                              minimum_should_match: 1
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\OInfoP11.exe"
                          case_insensitive: true
                    - exists:
                        field: "data_win_eventdata_image"
                    - bool:
                        must_not:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\Common Files\\\\Microsoft Shared\\\\*"
                                case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\OleView.exe"
                          case_insensitive: true
                    - exists:
                        field: "data_win_eventdata_image"
                    - bool:
                        must_not:
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*\\\\Microsoft Visual Studio*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*\\\\Microsoft SDK*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*\\\\Windows Kit*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*\\\\Windows Resource Kit\\\\*"
                                      case_insensitive: true
                              minimum_should_match: 1
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\rc.exe"
                          case_insensitive: true
                    - exists:
                        field: "data_win_eventdata_image"
                    - bool:
                        must_not:
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*\\\\Microsoft Visual Studio*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*\\\\Microsoft SDK*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*\\\\Windows Kit*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*\\\\Windows Resource Kit\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_image:
                                      value: "*\\\\Microsoft.NET\\\\*"
                                      case_insensitive: true
                              minimum_should_match: 1
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\CamMute.exe'; data_win_eventdata_image matches '*\Lenovo\Communication
  Utility\*'; data_win_eventdata_image matches '*\Lenovo\Communications
  Utility\*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - http://www.hexacorn.com/blog/2016/03/10/beyond-good-ol-run-key-part-36/
  - https://countuponsecurity.com/2017/06/07/threat-hunting-in-the-enterprise-with-appcompatprocessor/
  - https://attack.mitre.org/techniques/T1574/001/

response:
  message: >
    Potential PlugX Activity detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1574.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

