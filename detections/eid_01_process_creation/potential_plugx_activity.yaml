correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 799a5f48-0ac1-4e0f-9152-71d137d48c2a
    name: Abusable DLL Potential Sideloading From Suspicious Location
    reason: 'Same event: the signed executable loads a rogue DLL from its odd directory, which is the actual PlugX loading step.'
  - id: 552b6b65-df37-4d3e-a258-f2fc4771ae54
    name: Potential Antivirus Software DLL Sideloading
    reason: 'Co-occurring: PlugX commonly sideloads through legitimate AV/vendor binaries.'
  - id: windows-dll-loaded-temp-dir-001
    name: Windows DLL Module Loaded in Temp Dir
    reason: 'Co-occurring: the sideloaded PlugX DLL often sits in a temp or user-writable directory.'
  - id: 02ee49e2-e294-4d0f-9278-f5b3212fc588
    name: New RUN Key Pointing to Suspicious Folder
    reason: 'Follow-on: PlugX persists with a Run key pointing at the sideload executable.'
  - id: de587dce-915e-4218-aac4-835ca6af6f70
    name: Potential Persistence Attempt Via Run Keys Using Reg.EXE
    reason: 'Follow-on: Run key persistence set via reg.exe for the sideload host.'
  - id: 81325ce1-be01-4250-944f-b4789644556f
    name: Schedule Task Creation From Env Variable Or Potentially Suspicious Path Via Schtasks.EXE
    reason: 'Follow-on: scheduled task persistence launching the binary from a user path.'
  - id: 16c37b52-b141-42a5-a3ea-bbe098444397
    name: Suspect Svchost Activity
    reason: 'Follow-on: PlugX injects into svchost.exe to run its payload.'
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Unsigned DLLs loaded by known PlugX sideload hosts
    query: data_win_system_eventID:"7" AND (data_win_eventdata_image:/.*\\[Cc][Aa][Mm][Mm][Uu][Tt][Ee]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Cc][Hh][Rr][Oo][Mm][Ee]_[Ff][Rr][Aa][Mm][Ee]_[Hh][Ee][Ll][Pp][Ee][Rr]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Dd][Vv][Cc][Ee][Mm][Uu][Mm][Aa][Nn][Aa][Gg][Ee][Rr]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Gg][Aa][Dd][Gg][Ee][Tt]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Hh][Cc][Cc]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Hh][Kk][Cc][Mm][Dd]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Mm][Cc]\.[Ee][Xx][Ee].*/) AND data_win_eventdata_signed:"false"
    pivot_on: host
    window: 6h
  - name: Network connections from PlugX sideload hosts
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*\\[Cc][Aa][Mm][Mm][Uu][Tt][Ee]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Cc][Hh][Rr][Oo][Mm][Ee]_[Ff][Rr][Aa][Mm][Ee]_[Hh][Ee][Ll][Pp][Ee][Rr]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Dd][Vv][Cc][Ee][Mm][Uu][Mm][Aa][Nn][Aa][Gg][Ee][Rr]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Gg][Aa][Dd][Gg][Ee][Tt]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Hh][Cc][Cc]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Hh][Kk][Cc][Mm][Dd]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Mm][Cc]\.[Ee][Xx][Ee].*/)
    pivot_on: host
    window: 6h
  - name: Run key persistence pointing to user-writable paths
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/ AND (data_win_eventdata_details:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_details:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_details:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_details:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/)
    pivot_on: host
    window: 6h
  - name: Remote threads injected into svchost from user paths
