name: Read Contents From Stdin Via Cmd.EXE
id: 241e802a-b65e-484f-88cd-c2dc10f9206d
version: 1
schema_version: "1.0"
date: "2023-03-07"
author: frack113, Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 241e802a-b65e-484f-88cd-c2dc10f9206d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detect the use of "<" to read and potentially execute a file via cmd.exe.
  MITRE ATT&CK: T1059.003.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - term:
                  data_win_eventdata_originalFileName:
                    value: "Cmd.Exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\cmd.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine: "*<*"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_originalFileName
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_originalFileName equals
  'Cmd.Exe'; data_win_eventdata_image matches '*\cmd.exe';
  data_win_eventdata_commandLine matches '*<*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/40b77d63808dd4f4eafb83949805636735a1fd15/atomics/T1059.003/T1059.003.md
  - https://web.archive.org/web/20220306121156/https://www.x86matthew.com/view_post?id=ntdll_pipe
  - https://attack.mitre.org/techniques/T1059/003/

response:
  message: >
    Read Contents From Stdin Via Cmd.EXE detected on host $agent_name$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1059.003
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_originalFileName
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.003
  custom_tags:
    - contents
    - stdin
    - process_creation
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_originalFileName:/[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*\<.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 8e0bb260-d4b2-4fff-bb8d-3f82118e6892
    name: Potentially Suspicious CMD Shell Output Redirect
    reason: Redirect operators in cmd are the sibling of '<' stdin tricks; same command-line execution family.
  - id: a16980c2-0c56-4de0-9a79-17971979efdd
    name: Cmd.EXE Missing Space Characters Execution Anomaly
    reason: Obfuscated cmd command lines often accompany stdin-fed script execution by the same loader.
  - id: e5144106-8198-4f6e-bfc2-0a551cc8dd94
    name: Potential Pikabot Infection - Suspicious Command Combinations Via Cmd.EXE
    reason: Malware loaders chain cmd command combinations to run staged payloads.
  - id: 087790e3-3287-436c-bccf-cbd0184a7db1
    name: Potential CommandLine Path Traversal Via Cmd.EXE
    reason: Another cmd.exe command-line evasion technique frequently used in the same intrusion chain.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Child processes of cmd running LOLBins
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Cc]md\.exe/ AND data_win_eventdata_image:/.*\\(powershell|pwsh|wscript|cscript|mshta|rundll32|regsvr32|certutil|bitsadmin)\.exe/
    pivot_on: host
    window: 2h
  - name: Cmd launched from office, script host or browser
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Cc]md\.exe/ AND data_win_eventdata_parentImage:/.*\\(winword|excel|outlook|wscript|cscript|mshta|chrome|msedge)\.exe/
    pivot_on: host
    window: 2h
  - name: Download utilities in command lines
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:*[Cc]url* OR data_win_eventdata_commandLine:*[Cc]ertutil* OR data_win_eventdata_commandLine:*[Bb]itsadmin* OR data_win_eventdata_commandLine:*http*)
    pivot_on: host
    window: 2h
  - name: Files created in temp or public paths
    query: data_win_system_eventID:11 AND (data_win_eventdata_targetFilename:*\\Temp\\* OR data_win_eventdata_targetFilename:*\\Users\\Public\\* OR data_win_eventdata_targetFilename:*\\ProgramData\\*)
    pivot_on: host
    window: 2h
