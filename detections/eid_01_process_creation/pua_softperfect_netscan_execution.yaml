name: PUA - SoftPerfect Netscan Execution
id: ca387a8e-1c84-4da3-9993-028b45342d30
version: 1
schema_version: "1.0"
date: "2024-04-25"
author: "@d4ns4n_ (Wuerth-Phoenix)"
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: ca387a8e-1c84-4da3-9993-028b45342d30
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects usage of SoftPerfect's "netscan.exe". An application for scanning
  networks. It is actively used in-the-wild by threat actors to inspect and
  understand the network architecture of a victim. MITRE ATT&CK: T1046.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\netscan.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_product:
                    value: "Network Scanner"
                    case_insensitive: true
              - term:
                  data_win_eventdata_description:
                    value: "Application for scanning networks"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_product
    - data_win_eventdata_description
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\netscan.exe'; data_win_eventdata_product equals 'Network Scanner';
  data_win_eventdata_description equals 'Application for scanning networks'.

known_false_positives: >
  Legitimate administrator activity. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://www.protect.airbus.com/blog/uncovering-cyber-intruders-netscan/
  - https://secjoes-reports.s3.eu-central-1.amazonaws.com/Sockbot%2Bin%2BGoLand.pdf
  - https://www.sentinelone.com/labs/black-basta-ransomware-attacks-deploy-custom-edr-evasion-tools-tied-to-fin7-threat-actor/
  - https://symantec-enterprise-blogs.security.com/blogs/threat-intelligence/yanluowang-ransomware-attacks-continue
  - https://research.nccgroup.com/2022/07/13/climbing-mount-everest-black-byte-bytes-back/
  - https://www.bleepingcomputer.com/news/security/microsoft-exchange-servers-hacked-to-deploy-hive-ransomware/
  - https://www.softperfect.com/products/networkscanner/
  - https://attack.mitre.org/techniques/T1046/

response:
  message: >
    PUA - SoftPerfect Netscan Execution detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_product: $data_win_eventdata_product$. MITRE ATT&CK:
    T1046
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_product
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1046
  custom_tags:
    - softperfect
    - netscan
    - process_creation
    - sysmon
    - discovery
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Nn][Ee][Tt][Ss][Cc][Aa][Nn]\.[Ee][Xx][Ee]/ OR data_win_eventdata_product:/[Nn][Ee][Tt][Ww][Oo][Rr][Kk] [Ss][Cc][Aa][Nn][Nn][Ee][Rr]/ OR data_win_eventdata_description:/[Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn] [Ff][Oo][Rr] [Ss][Cc][Aa][Nn][Nn][Ii][Nn][Gg] [Nn][Ee][Tt][Ww][Oo][Rr][Kk][Ss]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: bef37fa2-f205-4a7b-b484-0759bfd5f86f
    name: PUA - Advanced IP Scanner Execution
    reason: Interchangeable network scanner used by the same ransomware affiliates for pre-encryption discovery.
  - id: 54773c5f-f1cc-4703-9126-2f797d96a69d
    name: PUA - Advanced Port Scanner Execution
    reason: Companion scanner commonly used in the same discovery phase.
  - id: 4fd6b1c7-19b8-4488-97f6-00f0924991a3
    name: PUA - NimScan Execution
    reason: Alternative scanner staged for internal host/port discovery.
  - id: 514e7e3e-b3b4-4a67-af60-be20f139198b
    name: PUA - AdFind.EXE Execution
    reason: AdFind plus Netscan is the classic pre-ransomware discovery pairing.
  - id: 730fc21b-eaff-474b-ad23-90fd265d4988
    name: Psexec Execution
    reason: Scan results feed lateral movement via PsExec to discovered hosts.
  - id: 32e0baea-b3f1-11eb-a2ce-acde48001122
    name: Detect RClone Command-Line Usage
    reason: Exfiltration commonly follows discovery in the ransomware chain.
  - id: c9fbe8e9-119d-40a6-9b59-dd58a5d84429
    name: Potential Ransomware or Unauthorized MBR Tampering Via Bcdedit.EXE
    reason: Impact-stage precursor if the intrusion progresses to ransomware.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Netscan network connections
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*[Nn]etscan.*/
    pivot_on: host
    window: 24h
  - name: Lateral movement after scan
    query: (data_win_system_eventID:1 AND (data_win_eventdata_image:/.*\\(PsExec|PsExec64|PAExec|csexec)\.exe/ OR data_win_eventdata_commandLine:/.*[Ww]mic.*node.*process call create.*/ OR data_win_eventdata_image:/.*\\mstsc\.exe/)) OR data_win_system_eventID:7045
    pivot_on: host
    window: 24h
  - name: Netscan files and config written
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*([Nn]etscan|netscan\.xml|[Ss]canresult).*/
    pivot_on: host
    window: 24h
  - name: Domain and host discovery commands
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*[Nn]ltest.*(dclist|domain_trusts).*/ OR data_win_eventdata_commandLine:/.*[Nn]et1? +(view|group|user) .*domain.*/ OR data_win_eventdata_commandLine:/.*[Aa]dfind.*/)
    pivot_on: host
    window: 24h
  - name: Archive and exfil tooling
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*\\(rclone|7z|rar|winrar|megasync)\.exe/ OR data_win_eventdata_commandLine:/.*[Rr]clone.*(copy|sync).*/)
    pivot_on: host
    window: 24h
