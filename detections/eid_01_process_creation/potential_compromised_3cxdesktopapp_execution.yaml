parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_originalFileName equals
  '3CXDesktopApp.exe'; data_win_eventdata_image matches '*\3CXDesktopApp.exe';
  data_win_eventdata_product equals '3CX Desktop App', among other conditions.

known_false_positives: >
  Legitimate usage of 3CXDesktopApp. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://www.reddit.com/r/crowdstrike/comments/125r3uu/20230329_situational_awareness_crowdstrike/
  - https://attack.mitre.org/techniques/T1218/

response:
  message: >
    Potential Compromised 3CXDesktopApp Execution detected on host $agent_name$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1218
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_originalFileName
      type: file_name
    - field: data_win_eventdata_image
      type: process

