Oo][Aa][Kk][Aa][Aa][Nn][Aa][Ee][Ww][Aa][Jj][Ww][Aa][Rr][Aa][Cc][Cc][Aa][Bb][Ww][Bb][Hh][Aa][Gg][Qq][Aa][Jj][Ww][Aa][Pp][Aa].*/ OR data_win_eventdata_commandLine:/.*[Oo][Gg][Aa]6[Aa][Cc][Gg][Aa][Jj][Ww][Bb][Mm][Aa][Gg]8[Aa][Jj][Ww][Aa][Rr][Aa][Cc][Cc][Aa][Yy][Qq][Bb][Kk][Aa][Cc][Cc][Aa][Kk][Qq].*/ OR data_win_eventdata_commandLine:/.*[Oo][Aa][Oo][Gg][Aa][Oo][Aa][Cc][Cc][Aa][Tt][Aa][Bb][Vv][Aa][Cc][Cc][Aa][Kk][Ww][Aa][Nn][Aa][Gg][Ee][Aa][Zz][Aa][Aa][Nn][Aa][Cc][Kk][Aa].*/ OR data_win_eventdata_commandLine:/.*6[Aa][Dd][Oo][Aa][Kk][Aa][Aa][Nn][Aa][Ee][Ww][Aa][Bb][Ww][Aa][Nn][Aa][Cc][Ss][Aa][Jj][Ww][Bb][Hh][Aa][Gg][Qq][Aa][Jj][Ww][Aa][Pp][Aa].*/ OR data_win_eventdata_commandLine:/.*[Oo][Gg][Aa]6[Aa][Cc][Gg][Aa][Jj][Ww][Bb][Mm][Aa][Gg]8[Aa][Yy][Qq][Aa][Nn][Aa][Cc][Ss][Aa][Jj][Ww][Bb][Kk][Aa][Cc][Cc][Aa][Kk][Qq].*/ OR data_win_eventdata_commandLine:/.*[Oo][Aa][Oo][Gg][Aa][Oo][Aa][Cc][Cc][Aa][Tt][Aa][Bb][Vv][Aa][Gg][Ee][Aa][Jj][Ww][Aa][Rr][Aa][Cc][Cc][Aa][Zz][Aa][Aa][Nn][Aa][Cc][Kk][Aa].*/ OR data_win_eventdata_commandLine:/.*6[Aa][Dd][Oo][Aa][Kk][Aa][Aa][Nn][Aa][Ee][Ww][Aa][Bb][Ww][Bb][Hh][Aa][Cc][Cc][Aa][Kk][Ww][Aa][Nn][Aa][Gg][Qq][Aa][Jj][Ww][Aa][Pp][Aa].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 62b7ccc9-23b4-471e-aa15-6da3663c4d59
    name: PowerShell Base64 Encoded Reflective Assembly Load
    reason: Same behaviour with another encoding variant; commonly fire together
  - id: ca2092a1-c273-4878-9b4b-0d60115bf5ea
    name: Suspicious Encoded PowerShell Command Line
    reason: The encoded launcher that carries the obfuscated assembly load
  - id: c4db14d9-7909-48b4-a054-aa14d89dbb19
    name: Malicious PowerShell Process - Encoded Command
    reason: Encoded-command launcher generally accompanies reflective loaders
  - id: 30edb182-aa75-42c0-b0a9-e998bb29067c
    name: Potential AMSI Bypass Via .NET Reflection
    reason: Reflection is also used to patch AMSI before the payload loads
  - id: 92a974db-ab84-457f-9ec0-55db83d7a825
    name: Potential AMSI Bypass Using NULL Bits
    reason: AMSI evasion typically precedes in-memory assembly loading
  - id: 88f680b8-070e-402c-ae11-d2914f2257f1
    name: PowerShell Base64 Encoded IEX Cmdlet
    reason: Download/execute stage that delivers the assembly
  - id: 0a99eb3e-1617-41bd-b095-13dc767f3def
    name: HackTool - Jlaive In-Memory Assembly Execution
    reason: Packer executing .NET assemblies in memory, same outcome
  - id: ea9bf0fa-edec-4fb8-8b78-b119f2528186
    name: Windows Defender AMSI Trigger Detected
    reason: Defender telemetry confirming the loaded content was flagged
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Script block reflection loads
    query: data_win_system_eventID:4104 AND data_win_eventdata_scriptBlockText:(/.*[Rr]eflection\.[Aa]ssembly.*/ OR /.*\[[Aa]ssembly\]::[Ll]oad.*/ OR /.*[Ll]oad[Ww]ith[Pp]artial[Nn]ame.*/ OR /.*[Ee]ntry[Pp]oint\.[Ii]nvoke.*/)
    pivot_on: host
    window: 2h
  - name: Download cradles
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Dd]ownload[Ss]tring.*/ OR /.*[Dd]ownload[Dd]ata.*/ OR /.*[Ii]nvoke-[Ww]eb[Rr]equest.*/ OR /.*[Nn]et\.[Ww]eb[Cc]lient.*/)
    pivot_on: host
    window: 2h
  - name: AMSI bypass attempts
    query: data_win_system_eventID:4104 AND data_win_eventdata_scriptBlockText:(/.*[Aa]msi[Ii]nit[Ff]ailed.*/ OR /.*[Aa]msi[Cc]ontext.*/ OR /.*[Aa]msi[Ss]can[Bb]uffer.*/)
    pivot_on: host
    window: 2h
  - name: PowerShell network connections
    query: data_win_system_eventID:3 AND data_win_eventdata_image:(/.*\\powershell\.exe/ OR /.*\\pwsh\.exe/)
    pivot_on: host
    window: 2h
  - name: Child processes of PowerShell
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:(/.*\\powershell\.exe/ OR /.*\\pwsh\.exe/)
    pivot_on: host
    window: 2h
