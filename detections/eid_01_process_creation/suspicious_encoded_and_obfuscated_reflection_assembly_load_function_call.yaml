version: 1
schema_version: "1.0"
date: "2023-04-06"
author: pH-T (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 9c0295ce-d60d-40bd-bd74-84673b7592b1
  commit: release-20260810
  license: DRL-1.1
