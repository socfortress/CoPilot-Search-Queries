name: Copying Sensitive Files with Credential Data
id: e7be6119-fc37-43f0-ad4f-1f3f99be2f9f
version: 1
schema_version: "1.0"
date: "2024-06-04"
author: Teymur Kheirkhabarov, Daniil Yugoslavskiy, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: e7be6119-fc37-43f0-ad4f-1f3f99be2f9f
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Files with well-known filenames (sensitive files with credential data)
  copying. MITRE ATT&CK: T1003.002, T1003.003.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\esentutl.exe"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_originalFileName:
                                value: "\\esentutl.exe"
                                case_insensitive: true
                        minimum_should_match: 1
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*vss*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* -m *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* /m *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* –m *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* —m *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* ―m *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* -y *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* /y *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* –y *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* —y *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* ―y *"
                                case_insensitive: true
                        minimum_should_match: 1
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\config\\\\RegBack\\\\sam*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\config\\\\RegBack\\\\security*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\config\\\\RegBack\\\\system*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\config\\\\sam*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\config\\\\security*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\config\\\\system *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\repair\\\\sam*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\repair\\\\security*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\repair\\\\system*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\windows\\\\ntds\\\\ntds.dit*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\esentutl.exe'; data_win_eventdata_originalFileName equals '\esentutl.exe';
  data_win_eventdata_commandLine matches '*vss*', among other conditions.

known_false_positives: >
  Copying sensitive files for legitimate use (eg. backup) or forensic
  investigation by legitimate incident responder or forensic investigator.
  Baseline expected activity in your environment and tune this detection before
  relying on it for automated response.

references:
  - https://room362.com/post/2013/2013-06-10-volume-shadow-copy-ntdsdit-domain-hashes-remotely-part-1/
  - https://www.slideshare.net/heirhabarov/hunting-for-credentials-dumping-in-windows-environment
  - https://dfironthemountain.wordpress.com/2018/12/06/locked-file-access-using-esentutl-exe/
  - https://github.com/LOLBAS-Project/LOLBAS/blob/2cc01b01132b5c304027a658c698ae09dd6a92bf/yml/OSBinaries/Esentutl.yml
  - https://attack.mitre.org/techniques/T1003/002/
  - https://attack.mitre.org/techniques/T1003/003/

response:
  message: >
    Copying Sensitive Files with Credential Data detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1003.002, T1003.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.002
    - T1003.003
  custom_tags:
    - copying
    - sensitive
    - credential
    - process_creation
    - sysmon
    - credential_access
    - s0404
    - car_2013_07_001
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (((data_win_eventdata_image:/.*\\[Ee][Ss][Ee][Nn][Tt][Uu][Tt][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/\\[Ee][Ss][Ee][Nn][Tt][Uu][Tt][Ll]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*[Vv][Ss][Ss].*/ OR data_win_eventdata_commandLine:/.* -[Mm] .*/ OR data_win_eventdata_commandLine:/.* \/[Mm] .*/ OR data_win_eventdata_commandLine:/.* –[Mm] .*/ OR data_win_eventdata_commandLine:/.* —[Mm] .*/ OR data_win_eventdata_commandLine:/.* ―[Mm] .*/ OR data_win_eventdata_commandLine:/.* -[Yy] .*/ OR data_win_eventdata_commandLine:/.* \/[Yy] .*/ OR data_win_eventdata_commandLine:/.* –[Yy] .*/ OR data_win_eventdata_commandLine:/.* —[Yy] .*/ OR data_win_eventdata_commandLine:/.* ―[Yy] .*/)) OR data_win_eventdata_commandLine:/.*\\[Cc][Oo][Nn][Ff][Ii][Gg]\\[Rr][Ee][Gg][Bb][Aa][Cc][Kk]\\[Ss][Aa][Mm].*/ OR data_win_eventdata_commandLine:/.*\\[Cc][Oo][Nn][Ff][Ii][Gg]\\[Rr][Ee][Gg][Bb][Aa][Cc][Kk]\\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy].*/ OR data_win_eventdata_commandLine:/.*\\[Cc][Oo][Nn][Ff][Ii][Gg]\\[Rr][Ee][Gg][Bb][Aa][Cc][Kk]\\[Ss][Yy][Ss][Tt][Ee][Mm].*/ OR data_win_eventdata_commandLine:/.*\\[Cc][Oo][Nn][Ff][Ii][Gg]\\[Ss][Aa][Mm].*/ OR data_win_eventdata_commandLine:/.*\\[Cc][Oo][Nn][Ff][Ii][Gg]\\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy].*/ OR data_win_eventdata_commandLine:/.*\\[Cc][Oo][Nn][Ff][Ii][Gg]\\[Ss][Yy][Ss][Tt][Ee][Mm] .*/ OR data_win_eventdata_commandLine:/.*\\[Rr][Ee][Pp][Aa][Ii][Rr]\\[Ss][Aa][Mm].*/ OR data_win_eventdata_commandLine:/.*\\[Rr][Ee][Pp][Aa][Ii][Rr]\\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy].*/ OR data_win_eventdata_commandLine:/.*\\[Rr][Ee][Pp][Aa][Ii][Rr]\\[Ss][Yy][Ss][Tt][Ee][Mm].*/ OR data_win_eventdata_commandLine:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Nn][Tt][Dd][Ss]\\[Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: fd877b94-9bb5-4191-bb25-d79cbd93c167
    name: Dumping of Sensitive Hives Via Reg.EXE
    reason: Same goal via reg save; attackers try several methods to get SAM/SECURITY/SYSTEM hives.
  - id: d372f928-ce4f-11eb-a762-acde48001122
    name: Esentutl SAM Copy
    reason: Esentutl-specific SAM copy variant; co-occurs when the vss/-y copy technique is used.
  - id: c73124a7-3e89-44a3-bdc1-25fe4df754b1
    name: Copy From VolumeShadowCopy Via Cmd.EXE
    reason: Shadow copy is what makes locked SAM/NTDS.dit copyable; precursor or alternate copy method.
  - id: 2afafd61-6aae-4df4-baed-139fa1f4c345
    name: Invocation of Active Directory Diagnostic Tool (ntdsutil.exe)
    reason: Alternate NTDS.dit extraction path when the copied file is ntds.dit on a domain controller.
  - id: da63bc76-61ae-11eb-ae93-0242ac130002
    name: Ntdsutil Export NTDS
    reason: Ntdsutil IFM export is the other common route to the same NTDS.dit credential database.
  - id: ec570e53-4c76-45a9-804d-dc3f355ff7a7
    name: 7Zip Compressing Dump Files
    reason: Copied hive/NTDS files are typically archived before exfiltration.
  - id: aa92fd02-09f2-48b0-8a93-864813fb8f41
    name: Conti NTDS Exfiltration Command
    reason: Follow-on staging and exfiltration of the extracted NTDS.dit.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Volume shadow copy creation or listing (source for locked hive copies)
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Ss][Hh][Aa][Dd][Oo][Ww].*/ AND (data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Kk][Ss][Hh][Aa][Dd][Oo][Ww].*/)
    pivot_on:
    - host
    window: 2h
  - name: Registry hive export via reg.exe save
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Rr][Ee][Gg]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Ss][Aa][Vv][Ee].*/ AND (data_win_eventdata_commandLine:/.*[Hh][Kk][Ll][Mm]\\[Ss][Aa][Mm].*/ OR data_win_eventdata_commandLine:/.*[Hh][Kk][Ll][Mm]\\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy].*/ OR data_win_eventdata_commandLine:/.*[Hh][Kk][Ll][Mm]\\[Ss][Yy][Ss][Tt][Ee][Mm].*/)
    pivot_on:
    - host
    window: 6h
  - name: Hive or NTDS copies landing as files
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\[Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt].*/ OR data_win_eventdata_targetFilename:/.*\\[Ss][Aa][Mm]\.([Ss][Aa][Vv][Ee]|[Bb][Aa][Kk]|[Hh][Ii][Vv][Ee]).*/ OR data_win_eventdata_targetFilename:/.*\\[Ss][Yy][Ss][Tt][Ee][Mm]\.([Ss][Aa][Vv][Ee]|[Bb][Aa][Kk]|[Hh][Ii][Vv][Ee]).*/)
    pivot_on:
    - host
    window: 6h
  - name: Archiving of copied credential files
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\(7z|7za|[Rr][Aa][Rr]|[Ww][Ii][Nn][Rr][Aa][Rr])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]-[Aa][Rr][Cc][Hh][Ii][Vv][Ee].*/) AND (data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ss][Aa][Mm].*/ OR data_win_eventdata_commandLine:/.*[Ss][Yy][Ss][Tt][Ee][Mm].*/)
    pivot_on:
    - host
    window: 6h
  - name: Offline hash extraction or pass-the-hash tooling
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Ee][Cc][Rr][Ee][Tt][Ss][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa]::[Pp][Tt][Hh].*/ OR data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Pp][Tt][Hh]-.*/)
    pivot_on:
    - host
    window: 24h
