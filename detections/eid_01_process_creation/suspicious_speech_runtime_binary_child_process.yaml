name: Suspicious Speech Runtime Binary Child Process
id: 78f10490-f2f4-4d19-a75b-4e0683bf3b8d
version: 1
schema_version: "1.0"
date: "2025-10-23"
author: andrewdanis
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 78f10490-f2f4-4d19-a75b-4e0683bf3b8d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious Speech Runtime Binary Execution by monitoring its child
  processes. Child processes spawned by SpeechRuntime.exe could indicate an
  attempt for lateral movement via COM & DCOM hijacking. MITRE ATT&CK:
  T1021.003, T1218.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_parentImage:
              value: "*\\\\SpeechRuntime.exe"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\SpeechRuntime.exe'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/rtecCyberSec/SpeechRuntimeMove
  - https://attack.mitre.org/techniques/T1021/003/
  - https://attack.mitre.org/techniques/T1218/

response:
  message: >
    Suspicious Speech Runtime Binary Child Process detected on host
    $agent_name$. Matched data_win_eventdata_parentImage:
    $data_win_eventdata_parentImage$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1021.003, T1218
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1021.003
    - T1218
  custom_tags:
    - speech
    - runtime
    - binary
    - process_creation
    - sysmon
    - lateral_movement
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ss][Pp][Ee][Ee][Cc][Hh][Rr][Uu][Nn][Tt][Ii][Mm][Ee]\.[Ee][Xx][Ee]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: f1f3bf22-deb2-418d-8cce-e1a45e46a5bd
    name: MMC20 Lateral Movement
    reason: Another DCOM-based lateral movement technique spawning children under a COM host process.
  - id: 551d9c1f-816c-445b-a7a6-7a3864720d60
    name: Potential Excel.EXE DCOM Lateral Movement Via ActivateMicrosoftApp
    reason: DCOM lateral movement through Excel; same remote COM activation pattern.
  - id: fa1c3040-4680-11ec-a618-3e22fbd008af
    name: Remote Process Instantiation via DCOM and PowerShell Script Block
    reason: Remote process instantiation via DCOM script blocks; the operator-side of the same lateral method.
  - id: windows-com-hijacking-inprocserver32-001
    name: Windows COM Hijacking InprocServer32 Modification
    reason: COM hijack via InprocServer32 changes is the setup that makes SpeechRuntime load attacker code.
  - id: 9b0f8a61-91b2-464f-aceb-0527e0a45020
    name: Potential COM Object Hijacking Via TreatAs Subkey - Registry
    reason: TreatAs registry subkey COM hijack, an alternate way to redirect the COM class to a payload.
  - id: 790317c0-0a36-4a6a-a105-6e576bf99a14
    name: COM Object Hijacking Via Modification Of Default System CLSID Default Value
    reason: Modification of default system CLSID value; precursor registry change enabling the DCOM hijack.
  - id: dc5c24af-6995-49b2-86eb-a9ff62199e82
    name: COM Hijacking via TreatAs
    reason: COM hijacking via TreatAs; same persistence/lateral prerequisite.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: COM class registry hijack writes
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Cc][Ll][Ss][Ii][Dd]\\.*\\(InprocServer32|LocalServer32|TreatAs).*/
    pivot_on: host
    window: 24h
  - name: Network logons preceding the DCOM activation
    query: data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"3"
    pivot_on: host
    window: 1h
  - name: Interpreters and LOLBins under SpeechRuntime
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ss]peech[Rr]untime\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Cc]md|[Pp]owershell|[Rr]undll32|[Mm]shta|[Ww]script)\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Inbound RPC or SMB connections to the host
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:false AND (data_win_eventdata_destinationPort:"135" OR data_win_eventdata_destinationPort:"445")
    pivot_on: host
    window: 2h
  - name: Dropped DLLs and executables near the COM change
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.(dll|exe)/ AND data_win_eventdata_targetFilename:/.*\\([Tt]emp|[Pp]ublic|[Pp]rogram[Dd]ata|[Aa]pp[Dd]ata)\\.*/
    pivot_on: host
    window: 4h
