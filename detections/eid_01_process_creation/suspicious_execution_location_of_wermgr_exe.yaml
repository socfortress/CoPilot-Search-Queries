name: Suspicious Execution Location Of Wermgr.EXE
id: 5394fcc7-aeb2-43b5-9a09-cac9fc5edcd5
version: 1
schema_version: "1.0"
date: "2023-08-23"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 5394fcc7-aeb2-43b5-9a09-cac9fc5edcd5
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious Windows Error Reporting manager (wermgr.exe) execution
  location.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\wermgr.exe"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "C:\\\\Windows\\\\System32\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "C:\\\\Windows\\\\SysWOW64\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "C:\\\\Windows\\\\WinSxS\\\\*"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\wermgr.exe'; data_win_eventdata_image matches 'C:\Windows\System32\*';
  data_win_eventdata_image matches 'C:\Windows\SysWOW64\*', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.trendmicro.com/en_us/research/22/j/black-basta-infiltrates-networks-via-qakbot-brute-ratel-and-coba.html
  - https://www.echotrail.io/insights/search/wermgr.exe
  - https://github.com/binderlabs/DirCreate2System

response:
  message: >
    Suspicious Execution Location Of Wermgr.EXE detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - location
    - wermgr
    - process_creation
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ww][Ee][Rr][Mm][Gg][Rr]\.[Ee][Xx][Ee]/ AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\.*/ OR data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Ww][Oo][Ww]64\\.*/ OR data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ww][Ii][Nn][Ss][Xx][Ss]\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 50dbc08b-60ce-40f1-a6b6-346497e34c88
    name: Potential CVE-2023-36874 Exploitation - Fake Wermgr Execution
    reason: The CVE-2023-36874 local privilege escalation plants a fake wermgr.exe and launches it; same masquerade, exploit-specific variant.
  - id: ad0960eb-0015-4d16-be13-b3d9f18f1342
    name: Potential CVE-2023-36874 Exploitation - Fake Wermgr.Exe Creation
    reason: File creation of wermgr.exe outside System32 is the staging step immediately before this execution.
  - id: 396f6630-f3ac-44e3-bfc8-1b161bc00c4e
    name: Suspicious Child Process Of Wermgr.EXE
    reason: Wermgr is a common injection host; shells or tools spawned from it show the masquerade doing real work.
  - id: 92389a99-5215-43b0-a09f-e334453b2ed3
    name: Potential CVE-2023-36874 Exploitation - Uncommon Report.Wer Location
    reason: The exploit relies on a Report.wer in a user-controlled folder, confirming the privilege escalation path.
  - id: be58d2e2-06c8-4f58-b666-b99f6dc3b6cd
    name: Suspicious Process Masquerading As SvcHost.EXE
    reason: Same system-binary masquerading tradecraft; implants often imitate several Windows binaries.
  - id: 3f7f5b0b-5b16-476c-a85f-ab477f6dd24b
    name: Lazarus System Binary Masquerading
    reason: Documents actor use of renamed system binaries in non-standard paths, the pattern seen here.
  - id: d4ca7c59-e9e4-42d8-bf57-91a776efcb87
    name: LOLBIN Execution From Abnormal Drive
    reason: System binary names executed from unusual drives or paths are the same masquerade technique.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Creation of wermgr or werfault outside Windows dirs
    query: data_win_system_eventID:11 AND (data_win_eventdata_targetFilename:/.*[Ww]ermgr\.exe/ OR data_win_eventdata_targetFilename:/.*[Ww]er[Ff]ault\.exe/ OR data_win_eventdata_targetFilename:/.*[Rr]eport\.[Ww]er/) AND NOT data_win_eventdata_targetFilename:/[Cc]:\\\\[Ww]indows\\\\.*/
    pivot_on: host
    window: 4h
  - name: Children of any wermgr process
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Ww]ermgr\.exe/
    pivot_on: host
    window: 2h
  - name: Network connections by wermgr
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*[Ww]ermgr\.exe/
    pivot_on: host
    window: 4h
  - name: Shell and script launchers from non-system directories
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*\\\\(ProgramData|Public|Temp|AppData)\\\\.*/ AND data_win_eventdata_parentImage:/.*\\\\(cmd|powershell|wscript|cscript|rundll32)\.exe/
    pivot_on: host
    window: 4h
  - name: Remote thread injection into WER binaries
    query: data_win_system_eventID:8 AND (data_win_eventdata_targetImage:/.*[Ww]ermgr\.exe/ OR data_win_eventdata_targetImage:/.*[Ww]er[Ff]ault\.exe/)
    pivot_on: host
    window: 4h
