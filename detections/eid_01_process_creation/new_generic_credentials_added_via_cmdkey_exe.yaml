name: New Generic Credentials Added Via Cmdkey.EXE
id: b1ec66c6-f4d1-4b5c-96dd-af28ccae7727
version: 1
schema_version: "1.0"
date: "2024-03-05"
author: frack113, Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: b1ec66c6-f4d1-4b5c-96dd-af28ccae7727
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects usage of "cmdkey.exe" to add generic credentials. As an example, this
  can be used before connecting to an RDP session via command line interface.
  MITRE ATT&CK: T1003.005.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\cmdkey.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "cmdkey.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -g*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /g*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* –g*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* —g*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* ―g*"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -u*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /u*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* –u*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* —u*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* ―u*"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -p*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /p*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* –p*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* —p*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* ―p*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\cmdkey.exe'; data_win_eventdata_originalFileName equals 'cmdkey.exe';
  data_win_eventdata_commandLine matches '* -g*', among other conditions.

known_false_positives: >
  Legitimate usage for administration purposes. Baseline expected activity in
  your environment and tune this detection before relying on it for automated
  response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1021.001/T1021.001.md#t1021001---remote-desktop-protocol
  - https://attack.mitre.org/techniques/T1003/005/

response:
  message: >
    New Generic Credentials Added Via Cmdkey.EXE detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1003.005
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.005
  custom_tags:
    - credentials
    - added
    - cmdkey
    - process_creation
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Cc][Mm][Dd][Kk][Ee][Yy]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Cc][Mm][Dd][Kk][Ee][Yy]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.* -[Gg].*/ OR data_win_eventdata_commandLine:/.* \/[Gg].*/ OR data_win_eventdata_commandLine:/.* –[Gg].*/ OR data_win_eventdata_commandLine:/.* —[Gg].*/ OR data_win_eventdata_commandLine:/.* ―[Gg].*/) AND (data_win_eventdata_commandLine:/.* -[Uu].*/ OR data_win_eventdata_commandLine:/.* \/[Uu].*/ OR data_win_eventdata_commandLine:/.* –[Uu].*/ OR data_win_eventdata_commandLine:/.* —[Uu].*/ OR data_win_eventdata_commandLine:/.* ―[Uu].*/) AND (data_win_eventdata_commandLine:/.* -[Pp].*/ OR data_win_eventdata_commandLine:/.* \/[Pp].*/ OR data_win_eventdata_commandLine:/.* –[Pp].*/ OR data_win_eventdata_commandLine:/.* —[Pp].*/ OR data_win_eventdata_commandLine:/.* ―[Pp].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 07f8bdc2-c9b3-472a-9817-5a670b872f53
    name: Potential Reconnaissance For Cached Credentials Via Cmdkey.EXE
    reason: cmdkey /list enumeration is the usual precursor to adding or reusing stored credentials
  - id: 954f0af7-62dd-418f-b3df-a84bc2c7a774
    name: New Remote Desktop Connection Initiated Via Mstsc.EXE
    reason: cmdkey /generic is commonly staged immediately before mstsc /v to give passwordless RDP to the target
  - id: 58f50261-c53b-4c88-bd12-1d71f12eda4c
    name: Windows Credential Manager Access via VaultCmd
    reason: VaultCmd reads Credential Manager entries, the same store cmdkey writes to
  - id: ff3b6b39-e765-42f9-bb2c-ea6761e0e0f6
    name: Mstsc.EXE Execution From Uncommon Parent
    reason: follow-on RDP launched by a script or shell that also planted the credential
  - id: 52753ea4-b3a0-4365-910d-36cff487b789
    name: Hijack Legit RDP Session to Move Laterally
    reason: lateral movement over RDP that stored credentials enable
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: mstsc launches after credential stored
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Mm][Ss][Tt][Ss][Cc]\.exe/
    pivot_on: host
    window: 2h
  - name: cmdkey list or delete activity
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Cc][Mm][Dd][Kk][Ee][Yy]\.exe/ AND data_win_eventdata_commandLine:/.*[ \/-]([Ll]ist|[Dd]elete).*/
    pivot_on: host
    window: 24h
  - name: Outbound RDP port 3389 connections
    query: data_win_system_eventID:3 AND data_win_eventdata_destinationPort:3389 AND data_win_eventdata_initiated:true
    pivot_on: host
    window: 2h
  - name: Script and shell parents running cmdkey
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:(*[Pp]ower[Ss]hell.exe OR *[Cc]md.exe OR *[Ww]script.exe OR *[Cc]script.exe OR *[Mm]shta.exe) AND data_win_eventdata_commandLine:*cmdkey*
    pivot_on: host
    window: 1h
