name: Lazarus System Binary Masquerading
id: 3f7f5b0b-5b16-476c-a85f-ab477f6dd24b
version: 1
schema_version: "1.0"
date: "2023-03-10"
author: Trent Liffick (@tliffick), Bartlomiej Czyz (@bczyz1)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 3f7f5b0b-5b16-476c-a85f-ab477f6dd24b
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects binaries used by the Lazarus group which use system names but are
  executed and launched from non-default location. MITRE ATT&CK: T1036.005.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\msdtc.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\gpsvc.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "C:\\\\Windows\\\\System32\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "C:\\\\Windows\\\\SysWOW64\\\\*"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\msdtc.exe'; data_win_eventdata_image matches '*\gpsvc.exe';
  data_win_eventdata_image matches 'C:\Windows\System32\*', among other
  conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://media.kasperskycontenthub.com/wp-content/uploads/sites/43/2018/03/07180244/Lazarus_Under_The_Hood_PDF_final.pdf
  - https://attack.mitre.org/techniques/T1036/005/

response:
  message: >
    Lazarus System Binary Masquerading detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1036.005
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1036.005
  custom_tags:
    - lazarus
    - system
    - binary
    - process_creation
    - sysmon
    - stealth
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Mm][Ss][Dd][Tt][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Gg][Pp][Ss][Vv][Cc]\.[Ee][Xx][Ee]/) AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\.*/ OR data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Ww][Oo][Ww]64\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 24c4d154-05a4-4b99-b57d-9b977472443a
    name: Lazarus Group Activity
    reason: Same actor; masquerading loaders run alongside the SAM save, netstat recon and rundll32 implant behaviours.
  - id: 2569ed8c-1147-498a-9b8c-2ad3656b10ed
    name: Potential Renamed Rundll32 Execution
    reason: 'Same technique family: system-named binaries run from non-default paths.'
  - id: e22a6eb2-f8a5-44b5-8b44-a2dbd47b1144
    name: Potential MsiExec Masquerading
    reason: Same T1036.005 family; confirms a pattern of system-name impersonation on the host.
  - id: f53714ec-5077-420e-ad20-907ff9bb2958
    name: Forfiles.EXE Child Process Masquerading
    reason: Another masquerading detection that may fire from the same toolkit.
  - id: fd877b94-9bb5-4191-bb25-d79cbd93c167
    name: Dumping of Sensitive Hives Via Reg.EXE
    reason: Fake msdtc/gpsvc loaders are deployed to follow up with credential theft.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Fake msdtc/gpsvc process creations outside system dirs
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*\\(msdtc|gpsvc)\.exe/ AND NOT data_win_eventdata_image:(/[Cc]:\\[Ww]indows\\[Ss]ystem32\\.*/ OR /[Cc]:\\[Ww]indows\\[Ss]ys[Ww][Oo][Ww]64\\.*/)
    pivot_on: host
    window: 24h
  - name: Where the masquerading binary was dropped
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\\(msdtc|gpsvc)\.exe/
    pivot_on: host
    window: 24h
  - name: Persistence created for the fake binary
    query: (data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*schtasks.*(msdtc|gpsvc).*/ OR /.*sc(\.exe)? +(create|config).*(msdtc|gpsvc).*/)) OR (data_win_system_eventID:13 AND data_win_eventdata_details:/.*(msdtc|gpsvc)\.exe.*/)
    pivot_on: host
    window: 24h
  - name: Network connections by msdtc/gpsvc
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*\\(msdtc|gpsvc)\.exe/ AND data_win_eventdata_initiated:true
    pivot_on: host
    window: 24h
