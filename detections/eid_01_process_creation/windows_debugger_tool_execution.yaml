name: Windows Debugger Tool Execution
id: windows-debugger-tool-execution-001
version: 1
schema_version: "1.0"
date: "2026-02-23"
author: SOCFortress LLC
status: production
type: Hunting

description: >
  Detects execution of debugger tools (x32dbg.exe, x64dbg.exe, windbg.exe) in 
  production environments. While legitimate for development, these tools are 
  abused by PlugX and DarkGate malware for DLL side-loading attacks. Unusual 
  in non-developer environments.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image: "*\\\\x32dbg.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\\\x64dbg.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\\\windbg.exe"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-23 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-23 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Windows endpoints with Sysmon 
  installed and configured to log process creation events (EventID 1) with full 
  command-line arguments.

known_false_positives: >
  Developers and IT professionals may legitimately use debugger tools. Filter 
  by user role and endpoint type. Focus on non-developer workstations.

references:
  - https://attack.mitre.org/techniques/T1036/
  - https://www.splunk.com/en_us/blog/security/enter-the-gates-an-analysis-of-the-darkgate-autoit-loader.html
  - https://www.trendmicro.com/en_us/research/23/b/investigating-the-plugx-trojan-disguised-as-a-legitimate-windows.html

response:
  message: >
    Debugger tool execution on $agent_name$. 
    Process: $data_win_eventdata_image$. 
    Command: $data_win_eventdata_commandLine$. 
    Parent: $data_win_eventdata_parentImage$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1036
  risk_score: 36
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 36
  threat_objects: []

tags:
  analytic_story:
    - DarkGate Malware
    - PlugX
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1036
  custom_tags:
    - debugger
    - dll_sideloading
    - hunting
    - x64dbg
    - windbg
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*x32dbg\.exe/ OR data_win_eventdata_image:/.*x64dbg\.exe/ OR data_win_eventdata_image:/.*windbg\.exe/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 6414b5cd-b19d-447e-bb5e-9f03940b5784
    name: Potential DLL Sideloading Of DBGHELP.DLL
    reason: Debugger binaries side-load a rogue dbghelp.dll, the PlugX/DarkGate technique this hunt targets.
  - id: 9ca2bf31-0570-44d8-a543-534c47c33ed7
    name: Potential DLL Sideloading Of DBGCORE.DLL
    reason: Same side-loading pattern using dbgcore.dll next to a debugger.
  - id: fef394cd-f44d-4040-9b18-95d92fe278c0
    name: Potential DLL Sideloading Of DbgModel.DLL
    reason: Rogue DbgModel.dll loaded by a debugger executable copied to a user path.
  - id: 799a5f48-0ac1-4e0f-9152-71d137d48c2a
    name: Abusable DLL Potential Sideloading From Suspicious Location
    reason: Abusable signed-binary DLL loaded from a suspicious folder confirms side-loading.
  - id: 15c7904e-6ad1-4a45-9b46-5fb25df37fd2
    name: Malicious PE Execution by Microsoft Visual Studio Debugger
    reason: Debugger used as a proxy to execute a malicious PE.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Debugger DLLs loaded from user-writable paths
    query: data_win_system_eventID:7 AND data_win_eventdata_imageLoaded:(/.*[Dd]bg[Hh]elp.*/ OR /.*[Dd]bg[Cc]ore.*/ OR /.*[Dd]bg[Mm]odel.*/) AND data_win_eventdata_imageLoaded:(/.*[Aa]pp[Dd]ata.*/ OR /.*[Tt]emp.*/ OR /.*[Pp]ublic.*/ OR /.*[Pp]rogram[Dd]ata.*/)
    pivot_on: host
    window: 2h
  - name: Child processes spawned by debuggers
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:(/.*x32dbg.exe/ OR /.*x64dbg.exe/ OR /.*[Ww]in[Dd]bg.exe/)
    pivot_on: host
    window: 2h
  - name: Debugger executables dropped to disk
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(/.*x32dbg.*/ OR /.*x64dbg.*/ OR /.*[Ww]in[Dd]bg.*/)
    pivot_on: host
    window: 4h
  - name: Network connections from debugger processes
    query: data_win_system_eventID:3 AND data_win_eventdata_image:(/.*x32dbg.exe/ OR /.*x64dbg.exe/ OR /.*[Ww]in[Dd]bg.exe/)
    pivot_on: host
    window: 4h
  - name: Process access to lsass
    query: data_win_system_eventID:10 AND data_win_eventdata_targetImage:/.*[Ll]sass.exe/
    pivot_on: host
    window: 2h
