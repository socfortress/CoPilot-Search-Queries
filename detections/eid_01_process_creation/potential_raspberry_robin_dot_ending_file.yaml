name: Potential Raspberry Robin Dot Ending File
id: a35c97c8-d9c4-4c89-a3e7-533dc0bcb73a
version: 1
schema_version: "1.0"
date: "2023-02-05"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: a35c97c8-d9c4-4c89-a3e7-533dc0bcb73a
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects commandline containing reference to files ending with a "." This
  scheme has been seen used by raspberry-robin.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - regexp:
            data_win_eventdata_commandLine: ".*(\\\\[a-zA-Z0-9]{1,32}\\.[a-zA-Z0-9]{1,6}\\.[ \"']{1}).*"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches the
  regex /.*(\\[a-zA-Z0-9]{1,32}\.[a-zA-Z0-9]{1,6}\.[ "']{1}).*/.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.microsoft.com/en-us/security/blog/2022/10/27/raspberry-robin-worm-part-of-larger-ecosystem-facilitating-pre-ransomware-activity/

response:
  message: >
    Potential Raspberry Robin Dot Ending File detected on host $agent_name$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - raspberry
    - robin
    - ending
    - process_creation
    - sysmon
    - execution
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*(\\[a-zA-Z0-9]{1,32}\.[a-zA-Z0-9]{1,6}\.[ \"']{1}).*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 2c6bea3a-ef58-4f2e-a775-4928f6b7c58a
    name: Raspberry Robin Initial Execution From External Drive
    reason: 'Same worm''s first stage: cmd launching a dot-suffixed LNK/file from a removable drive; precursor to this command line.'
  - id: 92020b88-9caf-464f-bad8-cd0fb0aa2a81
    name: Potential Raspberry Robin CPL Execution Activity
    reason: 'Raspberry Robin follow-on: control.exe/rundll32 loading a malicious CPL/DLL after the dot-ending launch.'
  - id: d52d2e87-eb03-4fac-961d-eb616da79788
    name: Raspberry Robin Subsequent Execution of Commands
    reason: Documents the worm's post-launch cmd/msiexec/rundll32 command chain that follows the dot-ending file.
  - id: f7b5f842-a6af-4da5-9e95-e32478f3cd2f
    name: MsiExec Web Install
    reason: Raspberry Robin downloads its payload via msiexec from a remote URL right after launch.
  - id: 7f741dcf-fc22-4759-87b4-9ae8376676a2
    name: Bypass UAC via Fodhelper.exe
    reason: Raspberry Robin escalates with the fodhelper UAC bypass after establishing execution.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Msiexec remote package install
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*[Mm][Ss][Ii][Ee][Xx][Ee][Cc].*[Hh][Tt][Tt][Pp].*/
    pivot_on: host
    window: 2h
  - name: Control/rundll32 loading CPL or odd-extension DLL
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*[Cc]ontrol.*\.[Cc][Pp][Ll].*/ OR data_win_eventdata_commandLine:/.*[Rr]undll32.*(\.[Ee][Dd][Bb]|\.[Dd]ata|\.[Ll]og).*/)
    pivot_on: host
    window: 2h
  - name: cmd launching LNK from removable drive
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*[Cc]md.*\/[Rr].*\.[Ll][Nn][Kk].*/
    pivot_on: host
    window: 1h
  - name: Outbound connections from msiexec/rundll32/dllhost
    query: data_win_system_eventID:3 AND (data_win_eventdata_image:*msiexec.exe OR data_win_eventdata_image:*rundll32.exe OR data_win_eventdata_image:*dllhost.exe)
    pivot_on: host
    window: 2h
  - name: Fodhelper spawned children (UAC bypass)
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:*fodhelper.exe
    pivot_on: host
    window: 2h
