name: DLL Execution via Rasautou.exe
id: cd3d1298-eb3b-476c-ac67-12847de55813
version: 1
schema_version: "1.0"
date: "2020-10-09"
author: Julia Fomina, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: cd3d1298-eb3b-476c-ac67-12847de55813
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects using Rasautou.exe for loading arbitrary .DLL specified in -d option
  and executes the export specified in -p. MITRE ATT&CK: T1218.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\rasautou.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "rasdlui.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* -d *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* -p *"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\rasautou.exe'; data_win_eventdata_originalFileName equals 'rasdlui.exe';
  data_win_eventdata_commandLine matches '* -d *', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://lolbas-project.github.io/lolbas/Binaries/Rasautou/
  - https://github.com/fireeye/DueDLLigence
  - https://www.fireeye.com/blog/threat-research/2019/10/staying-hidden-on-the-endpoint-evading-detection-with-shellcode.html
  - https://attack.mitre.org/techniques/T1218/

response:
  message: >
    DLL Execution via Rasautou.exe detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1218
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218
  custom_tags:
    - rasautou
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Rr][Aa][Ss][Aa][Uu][Tt][Oo][Uu]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Rr][Aa][Ss][Dd][Ll][Uu][Ii]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.* -[Dd] .*/ AND data_win_eventdata_commandLine:/.* -[Pp] .*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: All rasautou/rasdlui executions (any arguments)
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Rr][Aa][Ss][Aa][Uu][Tt][Oo][Uu]\.[Ee][Xx][Ee]|[Rr][Aa][Ss][Dd][Ll][Uu][Ii]\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 2h
  - name: DLL files dropped in user-writable paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.[Dd][Ll][Ll]/ AND (data_win_eventdata_targetFilename:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/)
    pivot_on:
    - host
    window: 2h
  - name: Child processes spawned by rasautou
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Rr][Aa][Ss][Aa][Uu][Tt][Oo][Uu]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: Non-system DLL loaded into rasautou
    query: data_win_system_eventID:"7" AND data_win_eventdata_image:/.*\\([Rr][Aa][Ss][Aa][Uu][Tt][Oo][Uu]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_imageLoaded:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/)
    pivot_on:
    - host
    window: 1h
  - name: Network connections initiated by rasautou
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Rr][Aa][Ss][Aa][Uu][Tt][Oo][Uu]\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 2h
