name: Active Directory Structure Export Via Ldifde.EXE
id: 4f7a6757-ff79-46db-9687-66501a02d9ec
version: 1
schema_version: "1.0"
date: "2023-03-14"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 4f7a6757-ff79-46db-9687-66501a02d9ec
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of "ldifde.exe" in order to export organizational Active
  Directory structure.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\ldifde.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "ldifde.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*-f*"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_commandLine"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -i*"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\ldifde.exe'; data_win_eventdata_originalFileName equals 'ldifde.exe';
  data_win_eventdata_commandLine matches '*-f*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://businessinsights.bitdefender.com/deep-dive-into-a-backdoordiplomacy-attack-a-study-of-an-attackers-toolkit
  - https://www.documentcloud.org/documents/5743766-Global-Threat-Report-2019.html
  - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2012-r2-and-2012/cc731033(v=ws.11)

response:
  message: >
    Active Directory Structure Export Via Ldifde.EXE detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  custom_tags:
    - active
    - directory
    - structure
    - process_creation
    - sysmon
    - exfiltration
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ll][Dd][Ii][Ff][Dd][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ll][Dd][Ii][Ff][Dd][Ee]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*-[Ff].*/ AND _exists_:data_win_eventdata_commandLine AND NOT (data_win_eventdata_commandLine:/.* -[Ii].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e5d36acd-acb4-4c6f-a13f-9eb203d50099
    name: Active Directory Structure Export Via Csvde.EXE
    reason: Sibling AD export utility (csvde) for the same directory dump.
  - id: 6f535e01-ca1f-40be-ab8d-45b19c0c8b7f
    name: Import LDAP Data Interchange Format File Via Ldifde.EXE
    reason: Ldifde import variant; shows whether the tool was also used to modify AD.
  - id: 514e7e3e-b3b4-4a67-af60-be20f139198b
    name: PUA - AdFind.EXE Execution
    reason: AdFind is the common alternate bulk LDAP enumeration.
  - id: 3bad990e-4848-4a78-9530-b427d854aac0
    name: Domain Trust Discovery Via Dsquery
    reason: Dsquery trust discovery frequently accompanies AD structure mapping.
  - id: f376c8a7-a2d0-4ddc-aa0c-16c17236d962
    name: HackTool - Bloodhound/Sharphound Execution
    reason: BloodHound collection is the typical escalation of AD recon.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: ldifde executions
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*[Ll]difde\.exe/ OR data_win_eventdata_originalFileName:/[Ll]difde\.exe/)
    pivot_on: host
    window: 6h
  - name: Ldifde import (AD modification)
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Ll]difde\.exe/ AND data_win_eventdata_commandLine:/.* -i.*/
    pivot_on: host
    window: 6h
  - name: Sibling AD recon tools
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*[Cc]svde\.exe/ OR data_win_eventdata_image:/.*[Aa]d[Ff]ind\.exe/ OR data_win_eventdata_image:/.*[Dd]squery\.exe/ OR data_win_eventdata_image:/.*[Nn]ltest\.exe/)
    pivot_on: host
    window: 6h
  - name: LDIF output file creation
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\.(ldf|ldif)/
    pivot_on: host
    window: 6h
