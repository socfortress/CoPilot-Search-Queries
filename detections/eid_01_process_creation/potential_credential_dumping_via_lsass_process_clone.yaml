name: Potential Credential Dumping Via LSASS Process Clone
id: c8da0dfd-4ed0-4b68-962d-13c9c884384e
version: 1
schema_version: "1.0"
date: "2023-03-02"
author: Florian Roth (Nextron Systems), Samir Bousseaden
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: c8da0dfd-4ed0-4b68-962d-13c9c884384e
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a suspicious LSASS process process clone that could be a sign of
  credential dumping activity. MITRE ATT&CK: T1003, T1003.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_parentImage:
              value: "*\\\\Windows\\\\System32\\\\lsass.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\Windows\\\\System32\\\\lsass.exe"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\Windows\System32\lsass.exe'; data_win_eventdata_image matches
  '*\Windows\System32\lsass.exe'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.matteomalvica.com/blog/2019/12/02/win-defender-atp-cred-bypass/
  - https://twitter.com/Hexacorn/status/1420053502554951689
  - https://twitter.com/SBousseaden/status/1464566846594691073?s=20
  - https://attack.mitre.org/techniques/T1003/
  - https://attack.mitre.org/techniques/T1003/001/

response:
  message: >
    Potential Credential Dumping Via LSASS Process Clone detected on host
    $agent_name$. Matched data_win_eventdata_parentImage:
    $data_win_eventdata_parentImage$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1003, T1003.001
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003
    - T1003.001
  custom_tags:
    - credential
    - dumping
    - lsass
    - process_creation
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: ffa6861c-4461-4f59-8a41-578c39f3f23e
    name: LSASS Dump Keyword In CommandLine
    reason: Clone is created so the dumper can target lsass indirectly; dump keywords confirm intent
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: Alternative dump method often tried by the same operator
  - id: 5afee48e-67dd-4e03-a783-f74259dcf998
    name: Potential LSASS Process Dump Via Procdump
    reason: ProcDump -r clones lsass via reflection; same technique family
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: Mimikatz parses the dump produced from the clone
  - id: ec570e53-4c76-45a9-804d-dc3f355ff7a7
    name: 7Zip Compressing Dump Files
    reason: Dump file is archived for exfiltration next
  - id: d474c8fe-bb69-4ea0-b7d9-f682b56d52d3
    name: HackTool - Doppelanger LSASS Dumper Execution
    reason: Dedicated LSASS dumper using clone/fork behavior
  - id: a29808fd-ef50-49ff-9c7a-59a9b040b404
    name: HackTool - Pypykatz Credentials Dumping Activity
    reason: Offline parsing of the resulting dump
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Process access to lsass
    query: data_win_system_eventID:10 AND data_win_eventdata_targetImage:/.*\\lsass\.exe/
    pivot_on: host
    window: 2h
  - name: Dump files created
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(*.dmp OR *.dump OR *lsass*)
    pivot_on: host
    window: 2h
  - name: Dump tool command lines
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Mm]ini[Dd]ump.*/ OR /.*[Ss]ekurlsa.*/ OR *lsass*)
    pivot_on: host
    window: 2h
  - name: Archive or exfil of dump files
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(*.dmp* AND (*7z* OR *rar* OR *Compress-Archive* OR *curl*))
    pivot_on: host
    window: 6h
  - name: High-privilege lsass handle requests
    query: data_win_system_eventID:10 AND data_win_eventdata_targetImage:/.*\\lsass\.exe/ AND data_win_eventdata_grantedAccess:(0x1fffff OR 0x1010 OR 0x1410 OR 0x1438 OR 0x143a)
    pivot_on: host
    window: 2h
