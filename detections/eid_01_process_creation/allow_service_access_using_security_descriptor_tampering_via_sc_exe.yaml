name: Allow Service Access Using Security Descriptor Tampering Via Sc.EXE
id: 6c8fbee5-dee8-49bc-851d-c3142d02aa47
version: 1
schema_version: "1.0"
date: "2025-10-22"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 6c8fbee5-dee8-49bc-851d-c3142d02aa47
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious DACL modifications to allow access to a service from a
  suspicious trustee. This can be used to override access restrictions set by
  previous ACLs. MITRE ATT&CK: T1543.003.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\sc.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "sc.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*sdset*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*A;*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*;IU*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*;SU*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*;BA*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*;SY*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*;WD*"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_parentImage"
        - bool:
            must_not:
              - term:
                  data_win_eventdata_parentImage:
                    value: "C:\\Hexnode\\Hexnode Agent\\Current\\HexnodeAgent.exe"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches '*\sc.exe';
  data_win_eventdata_originalFileName equals 'sc.exe';
  data_win_eventdata_commandLine matches '*sdset*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/0gtweet/status/1628720819537936386
  - https://itconnect.uw.edu/tools-services-support/it-systems-infrastructure/msinf/other-help/understanding-sddl-syntax/
  - https://learn.microsoft.com/en-us/windows/win32/secauthz/sid-strings
  - https://attack.mitre.org/techniques/T1543/003/

response:
  message: >
    Allow Service Access Using Security Descriptor Tampering Via Sc.EXE detected
    on host $agent_name$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1543.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1543.003
  custom_tags:
    - allow
    - service
    - security
    - process_creation
    - sysmon
    - privilege_escalation
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ss][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ss][Cc]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Ss][Dd][Ss][Ee][Tt].*/ AND data_win_eventdata_commandLine:/.*[Aa];.*/ AND (data_win_eventdata_commandLine:/.*;[Ii][Uu].*/ OR data_win_eventdata_commandLine:/.*;[Ss][Uu].*/ OR data_win_eventdata_commandLine:/.*;[Bb][Aa].*/ OR data_win_eventdata_commandLine:/.*;[Ss][Yy].*/ OR data_win_eventdata_commandLine:/.*;[Ww][Dd].*/) AND _exists_:data_win_eventdata_parentImage AND NOT (data_win_eventdata_parentImage:/[Cc]:\\[Hh][Ee][Xx][Nn][Oo][Dd][Ee]\\[Hh][Ee][Xx][Nn][Oo][Dd][Ee] [Aa][Gg][Ee][Nn][Tt]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt]\\[Hh][Ee][Xx][Nn][Oo][Dd][Ee][Aa][Gg][Ee][Nn][Tt]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 99cf1e02-00fb-4c0d-8375-563f978dfd37
    name: Deny Service Access Using Security Descriptor Tampering Via Sc.EXE
    reason: Mirror sdset usage; attackers deny defenders access to a service after granting themselves access.
  - id: d937b75f-a665-4480-88a5-2f20e9f9b22a
    name: Possible Privilege Escalation via Weak Service Permissions
    reason: Weak DACLs set via sdset enable the service-based privilege escalation this detects.
  - id: 0f9c21f1-6a73-4b0e-9809-cb562cb8d981
    name: Potential Privilege Escalation via Service Permissions Weakness
    reason: 'Same escalation path: a low-priv user reconfiguring a service after a DACL change.'
  - id: 514e4c3a-c77d-4cde-a00f-046425e2301e
    name: Abuse of Service Permissions to Hide Services Via Set-Service
    reason: Hiding a service via security descriptor is a persistence-stealth sibling.
  - id: 38879043-7e1e-47a9-8d46-6bec88e201df
    name: Potential Persistence Attempt Via Existing Service Tampering
    reason: After the DACL grant the attacker reconfigures the binpath of the existing service.
  - id: 9b0b7ac3-6223-47aa-a3fd-e8f211e637db
    name: Changing Existing Service ImagePath Value Via Reg.EXE
    reason: Service ImagePath rewrite follows access granting to run attacker code.
  - id: 431a1fdb-4799-4f3b-91c3-a683b003fc49
    name: New Kernel Driver Via SC.EXE
    reason: Service creation via sc.exe from the same actor, often driver loading for further impact.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: sc.exe config/create/start/sdset service manipulation
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*\\sc\.exe/ AND data_win_eventdata_commandLine:(/.*[Cc]onfig.*[Bb]in[Pp]ath.*/ OR /.*[Cc]reate.*/ OR /.* [Ss]tart .*/ OR /.*[Ss]dset.*/)
    pivot_on: host
    window: 6h
  - name: Service ImagePath registry changes
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*[Ss]ervices\\.*\\[Ii]mage[Pp]ath/
    pivot_on: host
    window: 6h
  - name: New service installed (7045/4697)
    query: data_win_system_eventID:(7045 OR 4697)
    pivot_on: host
    window: 6h
  - name: Command shells spawned by services.exe
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*\\services\.exe/ AND data_win_eventdata_image:(/.*\\cmd\.exe/ OR /.*\\[Pp]ower[Ss]hell\.exe/)
    pivot_on: host
    window: 6h
