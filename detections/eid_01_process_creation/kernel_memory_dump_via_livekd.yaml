name: Kernel Memory Dump Via LiveKD
id: c7746f1c-47d3-43d6-8c45-cd1e54b6b0a2
version: 1
schema_version: "1.0"
date: "2024-03-13"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: c7746f1c-47d3-43d6-8c45-cd1e54b6b0a2
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of LiveKD with the "-m" flag to potentially dump the kernel
  memory.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\livekd.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\livekd64.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "livekd.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -m*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /m*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* –m*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* —m*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* ―m*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\livekd.exe'; data_win_eventdata_image matches '*\livekd64.exe';
  data_win_eventdata_originalFileName equals 'livekd.exe', among other
  conditions.

known_false_positives: >
  Unlikely in production environment. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://learn.microsoft.com/en-us/sysinternals/downloads/livekd
  - https://4sysops.com/archives/creating-a-complete-memory-dump-without-a-blue-screen/
  - https://kb.acronis.com/content/60892

response:
  message: >
    Kernel Memory Dump Via LiveKD detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  custom_tags:
    - kernel
    - memory
    - livekd
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ll][Ii][Vv][Ee][Kk][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ll][Ii][Vv][Ee][Kk][Dd]64\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ll][Ii][Vv][Ee][Kk][Dd]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.* -[Mm].*/ OR data_win_eventdata_commandLine:/.* \/[Mm].*/ OR data_win_eventdata_commandLine:/.* –[Mm].*/ OR data_win_eventdata_commandLine:/.* —[Mm].*/ OR data_win_eventdata_commandLine:/.* ―[Mm].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a85f7765-698a-4088-afa0-ecfbf8d01fa4
    name: Potential Memory Dumping Activity Via LiveKD
    reason: Sibling LiveKD rule on the same tool; both firing indicates dumping by LiveKD, not just a launch
  - id: 2e65275c-8288-4ab4-aeb7-6274f58b6b20
    name: Procdump Execution
    reason: Another Sysinternals dumping tool commonly used alongside or instead of LiveKD for credential theft
  - id: 5afee48e-67dd-4e03-a783-f74259dcf998
    name: Potential LSASS Process Dump Via Procdump
    reason: Kernel dump yields LSASS secrets; attackers pair with direct LSASS dumping
  - id: 646ea171-dded-4578-8a4d-65e9822892e3
    name: Process Memory Dump Via Comsvcs.DLL
    reason: Alternative memory dumping that often follows when one method is blocked
  - id: fd877b94-9bb5-4191-bb25-d79cbd93c167
    name: Dumping of Sensitive Hives Via Reg.EXE
    reason: Parallel credential-harvesting step for SAM/SYSTEM/SECURITY hives
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: LiveKD executions and arguments
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ll][Ii][Vv][Ee][Kk][Dd](64)?\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 6h
  - name: Dump file creation (.dmp)
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.[Dd][Mm][Pp]/
    pivot_on: host
    window: 6h
  - name: Other dumping tools (procdump, comsvcs, minidump, lsass)
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]|[Cc][Oo][Mm][Ss][Vv][Cc][Ss]|[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp]|[Ll][Ss][Aa][Ss][Ss]).*/
    pivot_on: host
    window: 6h
  - name: Archiving or transfer tools after dump
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Rr][Aa][Rr]|7[Zz]|[Cc][Uu][Rr][Ll]|[Rr][Cc][Ll][Oo][Nn][Ee])\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 6h
