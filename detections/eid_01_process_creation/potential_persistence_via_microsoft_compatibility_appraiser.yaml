name: Potential Persistence Via Microsoft Compatibility Appraiser
id: f548a603-c9f2-4c89-b511-b089f7e94549
version: 1
schema_version: "1.0"
date: "2023-02-10"
author: Sreeman
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: f548a603-c9f2-4c89-b511-b089f7e94549
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects manual execution of the "Microsoft Compatibility Appraiser" task via
  schtasks. In order to trigger persistence stored in the
  "\AppCompatFlags\TelemetryController" registry key. MITRE ATT&CK: T1053.005.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\schtasks.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "schtasks.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*run *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*\\\\Application Experience\\\\Microsoft Compatibility Appraiser*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\schtasks.exe'; data_win_eventdata_originalFileName equals 'schtasks.exe';
  data_win_eventdata_commandLine matches '*run *', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.trustedsec.com/blog/abusing-windows-telemetry-for-persistence/
  - https://attack.mitre.org/techniques/T1053/005/

response:
  message: >
    Potential Persistence Via Microsoft Compatibility Appraiser detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1053.005
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1053.005
  custom_tags:
    - persistence
    - microsoft
    - compatibility
    - process_creation
    - sysmon
    - privilege_escalation
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Rr][Uu][Nn] .*/ AND data_win_eventdata_commandLine:/.*\\[Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn] [Ee][Xx][Pp][Ee][Rr][Ii][Ee][Nn][Cc][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt] [Cc][Oo][Mm][Pp][Aa][Tt][Ii][Bb][Ii][Ll][Ii][Tt][Yy] [Aa][Pp][Pp][Rr][Aa][Ii][Ss][Ee][Rr].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 81325ce1-be01-4250-944f-b4789644556f
    name: Schedule Task Creation From Env Variable Or Potentially Suspicious Path Via Schtasks.EXE
    reason: Attackers commonly create or tamper with scheduled tasks via schtasks.exe on the same host just before force-running the Appraiser task.
  - id: 1c0e41cd-21bb-4433-9acc-4a2cd6367b9b
    name: Suspicious Modification Of Scheduled Tasks
    reason: Task modification on the same host is the sibling scheduled-task persistence/execution step around a manual Appraiser trigger.
  - id: 89ca78fd-b37c-4310-b3d3-81a023f83936
    name: Schtasks Creation Or Modification With SYSTEM Privileges
    reason: Elevated schtasks use on the host shows the operator already abusing Task Scheduler for SYSTEM-level execution.
  - id: de587dce-915e-4218-aac4-835ca6af6f70
    name: Potential Persistence Attempt Via Run Keys Using Reg.EXE
    reason: Registry-based persistence via reg.exe is the usual companion when an operator plants a TelemetryController command and then triggers it.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Writes to AppCompatFlags TelemetryController key
    query: data_win_system_eventID:(12 OR 13 OR 14) AND data_win_eventdata_targetObject:/.*[Aa]pp[Cc]ompat[Ff]lags.*[Tt]elemetry[Cc]ontroller.*/
    pivot_on: host
    window: 24h
  - name: CompatTelRunner child processes
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Cc]ompat[Tt]el[Rr]unner\.exe/
    pivot_on: host
    window: 6h
  - name: Schtasks activity on host
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Ss]chtasks\.exe/
    pivot_on: host
    window: 6h
  - name: Registry Run key or service persistence writes
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*(CurrentVersion\\Run|Services\\).*/ AND NOT data_win_eventdata_image:/.*(msiexec|TrustedInstaller)\.exe/
    pivot_on: host
    window: 6h
