name: Base64 MZ Header In CommandLine
id: 22e58743-4ac8-4a9f-bf19-00a0428d8c5f
version: 1
schema_version: "1.0"
date: "2022-07-12"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 22e58743-4ac8-4a9f-bf19-00a0428d8c5f
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects encoded base64 MZ header in the commandline.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*TVqQAAMAAAAEAAAA*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*TVpQAAIAAAAEAA8A*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*TVqAAAEAAAAEABAA*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*TVoAAAAAAAAAAAAA*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*TVpTAQEAAAAEAAAA*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*TVqQAAMAAAAEAAAA*'; data_win_eventdata_commandLine matches
  '*TVpQAAIAAAAEAA8A*'; data_win_eventdata_commandLine matches
  '*TVqAAAEAAAAEABAA*', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://thedfirreport.com/2022/07/11/select-xmrig-from-sqlserver/

response:
  message: >
    Base64 MZ Header In CommandLine detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - base64
    - header
    - process_creation
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Tt][Vv][Qq][Qq][Aa][Aa][Mm][Aa][Aa][Aa][Aa][Ee][Aa][Aa][Aa][Aa].*/ OR data_win_eventdata_commandLine:/.*[Tt][Vv][Pp][Qq][Aa][Aa][Ii][Aa][Aa][Aa][Aa][Ee][Aa][Aa]8[Aa].*/ OR data_win_eventdata_commandLine:/.*[Tt][Vv][Qq][Aa][Aa][Aa][Ee][Aa][Aa][Aa][Aa][Ee][Aa][Bb][Aa][Aa].*/ OR data_win_eventdata_commandLine:/.*[Tt][Vv][Oo][Aa][Aa][Aa][Aa][Aa][Aa][Aa][Aa][Aa][Aa][Aa][Aa][Aa].*/ OR data_win_eventdata_commandLine:/.*[Tt][Vv][Pp][Tt][Aa][Qq][Ee][Aa][Aa][Aa][Aa][Ee][Aa][Aa][Aa][Aa].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 62b7ccc9-23b4-471e-aa15-6da3663c4d59
    name: PowerShell Base64 Encoded Reflective Assembly Load
    reason: Base64 PE bytes on a command line are usually fed to [Reflection.Assembly]::Load; this is the loader that consumes the MZ blob.
  - id: e32d4572-9826-4738-b651-95fa63747e8a
    name: Base64 Encoded PowerShell Command Detected
    reason: 'Delivery wrapper: the base64 PE is typically carried inside an -EncodedCommand PowerShell invocation.'
  - id: c4db14d9-7909-48b4-a054-aa14d89dbb19
    name: Malicious PowerShell Process - Encoded Command
    reason: Encoded PowerShell process that commonly embeds the base64 MZ payload.
  - id: f26c6093-6f14-4b12-800f-0fcb46f5ffd0
    name: Malicious Base64 Encoded PowerShell Keywords in Command Lines
    reason: Base64-encoded PowerShell keywords (Assembly/Load/FromBase64) often accompany an inline PE payload.
  - id: 9c0295ce-d60d-40bd-bd74-84673b7592b1
    name: Suspicious Encoded And Obfuscated Reflection Assembly Load Function Call
    reason: 'Obfuscated reflection assembly load: the in-memory execution step after the MZ blob is decoded.'
  - id: 0a99eb3e-1617-41bd-b095-13dc767f3def
    name: HackTool - Jlaive In-Memory Assembly Execution
    reason: Jlaive packs a .NET PE as base64 and loads it in memory; same MZ-in-commandline tradecraft.
  - id: cc9cbe82-7bc0-4ef5-bc23-bbfb83947be7
    name: File Decoded From Base64/Hex Via Certutil.EXE
    reason: 'Alternative decode path: certutil -decode turns a base64 blob into a PE on disk.'
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Reflection/assembly load in command lines
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Rr]eflection\.[Aa]ssembly.*/ OR data_win_eventdata_commandLine:/.*[Ll]oad[Ww]ith[Pp]artial[Nn]ame.*/ OR data_win_eventdata_commandLine:/.*[Ff]rom[Bb]ase64[Ss]tring.*/)
    pivot_on: host
    window: 2h
  - name: Encoded PowerShell on the host
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND (data_win_eventdata_commandLine:/.* -[Ee][Nn][Cc].*/ OR data_win_eventdata_commandLine:/.*[Ee]ncoded[Cc]ommand.*/)
    pivot_on: host
    window: 2h
  - name: Executables written to user-writable paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.([Ee][Xx][Ee]|[Dd][Ll][Ll])/ AND (data_win_eventdata_targetFilename:/.*[Tt]emp.*/ OR data_win_eventdata_targetFilename:/.*[Aa]pp[Dd]ata.*/ OR data_win_eventdata_targetFilename:/.*[Pp]ublic.*/)
    pivot_on: host
    window: 2h
  - name: Network connections from script interpreters
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ OR data_win_eventdata_image:/.*[Cc]script\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Ww]script\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Cc][Mm][Dd]\.[Ee][Xx][Ee])
    pivot_on: host
    window: 2h
  - name: Certutil/bitsadmin download or decode
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc]ertutil.*(-[Dd]ecode|-[Uu]rlcache).*/ OR data_win_eventdata_commandLine:/.*[Bb]itsadmin.*[Tt]ransfer.*/)
    pivot_on: host
    window: 4h
