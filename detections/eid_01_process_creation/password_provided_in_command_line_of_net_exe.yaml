name: Password Provided In Command Line Of Net.EXE
id: d4498716-1d52-438f-8084-4a603157d131
version: 1
schema_version: "1.0"
date: "2023-02-21"
author: Tim Shelton (HAWK.IO)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: d4498716-1d52-438f-8084-4a603157d131
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a when net.exe is called with a password in the command line. MITRE
  ATT&CK: T1021.002, T1078.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\net.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\net1.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "net.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "net1.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* use *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine: "*:*\\\\*"
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*/USER:* *"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_commandLine"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_commandLine: "* "
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches '*\net.exe';
  data_win_eventdata_image matches '*\net1.exe';
  data_win_eventdata_originalFileName equals 'net.exe', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - Internal Research
  - https://attack.mitre.org/techniques/T1021/002/
  - https://attack.mitre.org/techniques/T1078/

response:
  message: >
    Password Provided In Command Line Of Net.EXE detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1021.002, T1078
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1021.002
    - T1078
  custom_tags:
    - password
    - provided
    - process_creation
    - sysmon
    - initial_access
    - persistence
    - privilege_escalation
    - lateral_movement
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Nn][Ee][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Nn][Ee][Tt]1\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Nn][Ee][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Nn][Ee][Tt]1\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.* [Uu][Ss][Ee] .*/ AND data_win_eventdata_commandLine:/.*:.*\\.*/ AND data_win_eventdata_commandLine:/.*\/[Uu][Ss][Ee][Rr]:.* .*/ AND _exists_:data_win_eventdata_commandLine AND NOT (data_win_eventdata_commandLine:/.* /)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 855bc8b5-2ae8-402e-a9ed-b889e6df1900
    name: Copy From Or To Admin Share Or Sysvol Folder
    reason: Authenticated share mount precedes file copy to ADMIN$/C$ for staging.
  - id: ea011323-7045-460b-b2d7-0f7442ea6b38
    name: Potential PsExec Remote Execution
    reason: Net use with creds then PsExec is the classic remote-exec sequence.
  - id: 730fc21b-eaff-474b-ad23-90fd265d4988
    name: Psexec Execution
    reason: PsExec after a credentialed SMB session establishes lateral movement.
  - id: 8ce07472-496f-11ec-ab3b-3e22fbd008af
    name: Impacket Lateral Movement Commandline Parameters
    reason: Impacket-style remote exec commonly follows credentialed access.
  - id: 07f8bdc2-c9b3-472a-9817-5a670b872f53
    name: Potential Reconnaissance For Cached Credentials Via Cmdkey.EXE
    reason: Credential hunting often precedes use of plaintext creds with net use.
  - id: 954f0af7-62dd-418f-b3df-a84bc2c7a774
    name: New Remote Desktop Connection Initiated Via Mstsc.EXE
    reason: Valid creds may also be used for RDP into the same target.
  - id: cb909b3e-512b-11ec-aa31-3e22fbd008af
    name: Possible Lateral Movement PowerShell Spawn
    reason: Remote shell spawn on the target after authenticated access.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Net/net1 share and session commands
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*(\\[Nn][Ee][Tt]\.[Ee][Xx][Ee]|\\[Nn][Ee][Tt]1\.[Ee][Xx][Ee]).*/) AND data_win_eventdata_commandLine:/.*( [Uu][Ss][Ee] | [Vv][Ii][Ee][Ww] | [Ss][Hh][Aa][Rr][Ee] ).*/
    pivot_on: host
    window: 2h
  - name: Remote execution tools launched
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*(\\[Pp][Ss][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]|\\[Pp][Ss][Ee][Xx][Ee][Cc]64\.[Ee][Xx][Ee]|\\[Pp][Aa][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]|\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]|\\[Ww][Ii][Nn][Rr][Ss]\.[Ee][Xx][Ee]|\\[Mm][Ss][Tt][Ss][Cc]\.[Ee][Xx][Ee]).*/)
    pivot_on: host
    window: 2h
  - name: Writes to admin shares or PsExec service binary
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(\\[Aa][Dd][Mm][Ii][Nn]\$\\|\\[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]).*/
    pivot_on: host
    window: 2h
  - name: Credential access activity
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Cc][Mm][Dd][Kk][Ee][Yy]|[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa]|[Ll][Ss][Aa][Ss][Ss]|[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]|[Cc][Oo][Mm][Ss][Vv][Cc][Ss]).*/
    pivot_on: host
    window: 4h
  - name: Outbound SMB/RDP/WinRM connections
    query: data_win_system_eventID:"3" AND (data_win_eventdata_destinationPort:"445" OR data_win_eventdata_destinationPort:"3389" OR data_win_eventdata_destinationPort:"5985")
    pivot_on: host
    window: 2h
