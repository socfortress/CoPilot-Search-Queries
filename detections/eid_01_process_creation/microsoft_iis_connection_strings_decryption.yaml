name: Microsoft IIS Connection Strings Decryption
id: 97dbf6e2-e436-44d8-abee-4261b24d3e41
version: 1
schema_version: "1.0"
date: "2022-12-30"
author: Tim Rauch, Elastic (idea)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 97dbf6e2-e436-44d8-abee-4261b24d3e41
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects use of aspnet_regiis to decrypt Microsoft IIS connection strings. An
  attacker with Microsoft IIS web server access via a webshell or alike can
  decrypt and dump any hardcoded connection strings, such as the MSSQL service
  account password using aspnet_regiis command. MITRE ATT&CK: T1003.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\aspnet_regiis.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "aspnet_regiis.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*connectionStrings*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* -pdf*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\aspnet_regiis.exe'; data_win_eventdata_originalFileName equals
  'aspnet_regiis.exe'; data_win_eventdata_commandLine matches
  '*connectionStrings*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.elastic.co/guide/en/security/current/microsoft-iis-connection-strings-decryption.html
  - https://attack.mitre.org/techniques/T1003/

response:
  message: >
    Microsoft IIS Connection Strings Decryption detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003
  custom_tags:
    - microsoft
    - connection
    - strings
    - process_creation
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Aa][Ss][Pp][Nn][Ee][Tt]_[Rr][Ee][Gg][Ii][Ii][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Aa][Ss][Pp][Nn][Ee][Tt]_[Rr][Ee][Gg][Ii][Ii][Ss]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Cc][Oo][Nn][Nn][Ee][Cc][Tt][Ii][Oo][Nn][Ss][Tt][Rr][Ii][Nn][Gg][Ss].*/ AND data_win_eventdata_commandLine:/.* -[Pp][Dd][Ff].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 2d3cdeec-c0db-45b4-aa86-082f7eb75701
    name: Microsoft IIS Service Account Password Dumped
    reason: Sibling IIS credential theft (appcmd list /text:password); attackers typically try both to harvest secrets from the same web server.
  - id: 8202070f-edeb-4d31-a010-a26c72ac5600
    name: Suspicious Process By Web Server Process
    reason: aspnet_regiis decryption is run by an attacker with webshell access; a w3wp-spawned shell is the likely precursor.
  - id: fa3c117a-bc0d-416e-a31b-0c0e80653efb
    name: Chopper Webshell Process Pattern
    reason: China Chopper-style webshell command execution is a classic way to reach this command.
  - id: 043c4b8b-3a54-4780-9682-081cb6b8185c
    name: Suspicious IIS Module Registration
    reason: Post-webshell IIS persistence/backdoor activity on the same web server.
  - id: 0649be4a-aeb0-45b0-b89e-7f1668f6d9c0
    name: IIS WebServer Log Deletion via CommandLine Utilities
    reason: Operators on a compromised IIS host clean access logs after harvesting secrets.
  - id: e4ed6030-ffe5-4e6a-8a8a-ab3c1ab9d94e
    name: Disable Windows IIS HTTP Logging
    reason: Defense evasion on the same IIS server alongside credential harvesting.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Shells spawned by IIS worker process
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Ww]3wp\.exe/ AND (data_win_eventdata_image:/.*cmd\.exe/ OR data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/)
    pivot_on: host
    window: 6h
  - name: Recon commands typical after webshell access
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*whoami\.exe/ OR data_win_eventdata_image:/.*[Nn]et1?\.exe/ OR data_win_eventdata_image:/.*[Nn]ltest\.exe/ OR data_win_eventdata_image:/.*[Ii]pconfig\.exe/)
    pivot_on: host
    window: 6h
  - name: Script files written to web roots
    query: data_win_system_eventID:11 AND (data_win_eventdata_targetFilename:/.*[Ii]netpub.*\.([Aa][Ss][Pp][Xx]?|[Aa][Ss][Hh][Xx]|[Pp][Hh][Pp]|[Jj][Ss][Pp])/ OR data_win_eventdata_targetFilename:/.*[Ww]ww[Rr]oot.*\.([Aa][Ss][Pp][Xx]?|[Aa][Ss][Hh][Xx])/)
    pivot_on: host
    window: 24h
  - name: Database client or SQL tooling use with recovered credentials
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*[Ss]qlcmd\.exe/ OR data_win_eventdata_image:/.*[Oo]sql\.exe/ OR data_win_eventdata_image:/.*[Bb]cp\.exe/ OR data_win_eventdata_commandLine:/.*[Ss]ql[Cc]md.*/)
    pivot_on: host
    window: 6h
  - name: Config file reads and copies of web.config
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*web\.config.*/ AND (data_win_eventdata_commandLine:/.*[Cc]opy.*/ OR data_win_eventdata_commandLine:/.*[Tt]ype.*/ OR data_win_eventdata_commandLine:/.*[Zz]ip.*/ OR data_win_eventdata_commandLine:/.*[Cc]url.*/)
    pivot_on: host
    window: 6h
