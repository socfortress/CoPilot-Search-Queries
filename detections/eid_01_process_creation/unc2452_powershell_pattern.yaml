name: UNC2452 PowerShell Pattern
id: b7155193-8a81-4d8f-805d-88de864ca50c
version: 1
schema_version: "1.0"
date: "2022-10-09"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: b7155193-8a81-4d8f-805d-88de864ca50c
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a specific PowerShell command line pattern used by the UNC2452 actors
  as mentioned in Microsoft and Symantec reports. MITRE ATT&CK: T1059.001,
  T1047.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*Invoke-WMIMethod win32_process -name create -argumentlist*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*rundll32 c:\\\\windows*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*wmic /node:*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*process call create \"rundll32 c:\\\\windows*"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*Invoke-WMIMethod win32_process -name create -argumentlist*';
  data_win_eventdata_commandLine matches '*rundll32 c:\windows*';
  data_win_eventdata_commandLine matches '*wmic /node:*', among other
  conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://symantec-enterprise-blogs.security.com/blogs/threat-intelligence/solarwinds-raindrop-malware
  - https://www.microsoft.com/security/blog/2020/12/18/analyzing-solorigate-the-compromised-dll-file-that-started-a-sophisticated-cyberattack-and-how-microsoft-defender-helps-protect/
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1047/T1047.md#atomic-test-7---create-a-process-using-wmi-query-and-an-encoded-command
  - https://attack.mitre.org/techniques/T1059/001/
  - https://attack.mitre.org/techniques/T1047/

response:
  message: >
    UNC2452 PowerShell Pattern detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1059.001, T1047
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
    - T1047
  custom_tags:
    - unc2452
    - powershell
    - pattern
    - process_creation
    - sysmon
    - execution
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND ((data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Mm][Ii][Mm][Ee][Tt][Hh][Oo][Dd] [Ww][Ii][Nn]32_[Pp][Rr][Oo][Cc][Ee][Ss][Ss] -[Nn][Aa][Mm][Ee] [Cc][Rr][Ee][Aa][Tt][Ee] -[Aa][Rr][Gg][Uu][Mm][Ee][Nn][Tt][Ll][Ii][Ss][Tt].*/ AND data_win_eventdata_commandLine:/.*[Rr][Uu][Nn][Dd][Ll][Ll]32 [Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss].*/) OR (data_win_eventdata_commandLine:/.*[Ww][Mm][Ii][Cc] \/[Nn][Oo][Dd][Ee]:.*/ AND data_win_eventdata_commandLine:/.*[Pp][Rr][Oo][Cc][Ee][Ss][Ss] [Cc][Aa][Ll][Ll] [Cc][Rr][Ee][Aa][Tt][Ee] \"[Rr][Uu][Nn][Dd][Ll][Ll]32 [Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss].*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 9be34ad0-b6a7-4fbd-91cf-fc7ec1047f5f
    name: UNC2452 Process Creation Patterns
    reason: Companion detection for the same actor's other tooling (7-Zip staging, wscript VBS, rundll32 Tk_ DLL); co-firing confirms the campaign.
  - id: 692f0bec-83ba-4d04-af7e-e884a96059b6
    name: Potential WMI Lateral Movement WmiPrvSE Spawned PowerShell
    reason: Remote WMI process creation arrives as a WmiPrvSE child on the target host.
  - id: d21374ff-f574-44a7-9998-4a8c8bf33d7d
    name: WmiPrvSE Spawned A Process
    reason: 'Receiving side of wmic /node or Invoke-WmiMethod remote create: the rundll32 payload spawned under WmiPrvSE.'
  - id: 526be59f-a573-4eea-b5f7-f0973207634d
    name: Process Creation Attempt via Wmic.EXE
    reason: Generic wmic process call create, the exact primitive used to launch the payload remotely.
  - id: 2569ed8c-1147-498a-9b8c-2ad3656b10ed
    name: Potential Renamed Rundll32 Execution
    reason: The payload is a DLL run through rundll32; renamed copies are a common evasion variant.
  - id: ae9c6a7c-9521-42a6-915e-5aaa8689d529
    name: CobaltStrike Load by Rundll32
    reason: UNC2452 payloads were Cobalt Strike-class beacon DLLs loaded through rundll32.
  - id: 1ea13e8c-03ea-409b-877d-ce5c3d2c1cb3
    name: ADFS Database Named Pipe Connection By Uncommon Tool
    reason: UNC2452 post-exploitation targeted ADFS token-signing material (Golden SAML).
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: WMI-based local or remote process creation
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[iI][nN][vV][oO][kK][eE]-[wW][mM][iI][mM][eE][tT][hH][oO][dD] [wW][iI][nN]32_[pP][rR][oO][cC][eE][sS][sS].*/ OR data_win_eventdata_commandLine:/.*[wW][mM][iI][cC] \/[nN][oO][dD][eE]:.*/ OR data_win_eventdata_parentImage:/.*\\([wW][mM][iI][pP][rR][vV][sS][eE]\.[eE][xX][eE])/)
    pivot_on: host
    window: 4h
  - name: rundll32 loading DLLs from the Windows directory
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([rR][uU][nN][dD][lL][lL]32\.[eE][xX][eE])/ AND data_win_eventdata_commandLine:/.*[cC]:\\[wW][iI][nN][dD][oO][wW][sS]\\.*\.[dD][lL][lL].*/
    pivot_on: host
    window: 2h
  - name: Password-protected archive staging
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*7[zZ][a-z]*\.[eE][xX][eE] a .*-[pP].*/
    pivot_on: host
    window: 4h
  - name: Outbound connections from rundll32, wmiprvse or dllhost
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([rR][uU][nN][dD][lL][lL]32\.[eE][xX][eE]|[wW][mM][iI][pP][rR][vV][sS][eE]\.[eE][xX][eE]|[dD][lL][lL][hH][oO][sS][tT]\.[eE][xX][eE])/
    pivot_on: host
    window: 4h
  - name: Service and scheduled task creation
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([sS][cC][hH][tT][aA][sS][kK][sS]\.[eE][xX][eE]|[sS][cC]\.[eE][xX][eE])/ AND data_win_eventdata_commandLine:/.*[cC][rR][eE][aA][tT][eE].*/
    pivot_on: host
    window: 4h
