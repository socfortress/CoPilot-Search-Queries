                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*copy-item*'; data_win_eventdata_commandLine matches '*copy *';
  data_win_eventdata_commandLine matches '*cpi *', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1555.003/T1555.003.md
  - https://www.cisa.gov/sites/default/files/2024-04/aa24-109a-stopransomware-akira-ransomware_2.pdf
  - https://attack.mitre.org/techniques/T1555/003/

response:
  message: >
    Potential Browser Data Stealing detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1555.003
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1555.003
  custom_tags:
    - browser
    - stealing
    - process_creation
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Pp][Yy]-[Ii][Tt][Ee][Mm].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Pp][Yy] .*/ OR data_win_eventdata_commandLine:/.*[Cc][Pp][Ii] .*/ OR data_win_eventdata_commandLine:/.* [Cc][Pp] .*/ OR data_win_eventdata_commandLine:/.*[Mm][Oo][Vv][Ee] .*/ OR data_win_eventdata_commandLine:/.*[Mm][Oo][Vv][Ee]-[Ii][Tt][Ee][Mm].*/ OR data_win_eventdata_commandLine:/.* [Mm][Ii] .*/ OR data_win_eventdata_commandLine:/.* [Mm][Vv] .*/ OR data_win_eventdata_image:/.*\\[Ee][Ss][Ee][Nn][Tt][Uu][Tt][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Xx][Cc][Oo][Pp][Yy]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Oo][Bb][Oo][Cc][Oo][Pp][Yy]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ee][Ss][Ee][Nn][Tt][Uu][Tt][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Xx][Cc][Oo][Pp][Yy]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Rr][Oo][Bb][Oo][Cc][Oo][Pp][Yy]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*\\[Aa][Mm][Ii][Gg][Oo]\\[Uu][Ss][Ee][Rr] [Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_commandLine:/.*\\[Bb][Rr][Aa][Vv][Ee][Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Bb][Rr][Aa][Vv][Ee]-[Bb][Rr][Oo][Ww][Ss][Ee][Rr]\\[Uu][Ss][Ee][Rr] [Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_commandLine:/.*\\[Cc][Ee][Nn][Tt][Bb][Rr][Oo][Ww][Ss][Ee][Rr]\\[Uu][Ss][Ee][Rr] [Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_commandLine:/.*\\[Cc][Hh][Rr][Oo][Mm][Ii][Uu][Mm]\\[Uu][Ss][Ee][Rr] [Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_commandLine:/.*\\[Cc][Oo][Cc][Cc][Oo][Cc]\\[Bb][Rr][Oo][Ww][Ss][Ee][Rr]\\[Uu][Ss][Ee][Rr] [Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_commandLine:/.*\\[Cc][Oo][Mm][Oo][Dd][Oo]\\[Dd][Rr][Aa][Gg][Oo][Nn]\\[Uu][Ss][Ee][Rr] [Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_commandLine:/.*\\[Ee][Ll][Ee][Mm][Ee][Nn][Tt][Ss] [Bb][Rr][Oo][Ww][Ss][Ee][Rr]\\[Uu][Ss][Ee][Rr] [Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_commandLine:/.*\\[Ee][Pp][Ii][Cc] [Pp][Rr][Ii][Vv][Aa][Cc][Yy] [Bb][Rr][Oo][Ww][Ss][Ee][Rr]\\[Uu][Ss][Ee][Rr] [Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_commandLine:/.*\\[Gg][Oo][Oo][Gg][Ll][Ee]\\[Cc][Hh][Rr][Oo][Mm][Ee] [Bb][Ee][Tt][Aa]\\[Uu][Ss][Ee][Rr] [Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_commandLine:/.*\\[Gg][Oo][Oo][Gg][Ll][Ee]\\[Cc][Hh][Rr][Oo][Mm][Ee] [Ss][Xx][Ss]\\[Uu][Ss][Ee][Rr] [Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_commandLine:/.*\\[Gg][Oo][Oo][Gg][Ll][Ee]\\[Cc][Hh][Rr][Oo][Mm][Ee]\\[Uu][Ss][Ee][Rr] [Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Kk][Oo][Mm][Ee][Tt][Aa]\\[Uu][Ss][Ee][Rr] [Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_commandLine:/.*\\[Mm][Aa][Xx][Tt][Hh][Oo][Nn]5\\[Uu][Ss][Ee][Rr][Ss].*/ OR data_win_eventdata_commandLine:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ee][Dd][Gg][Ee]\\[Uu][Ss][Ee][Rr] [Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_commandLine:/.*\\[Mm][Oo][Zz][Ii][Ll][Ll][Aa]\\[Ff][Ii][Rr][Ee][Ff][Oo][Xx]\\[Pp][Rr][Oo][Ff][Ii][Ll][Ee][Ss].*/ OR data_win_eventdata_commandLine:/.*\\[Nn][Ii][Cc][Hh][Rr][Oo][Mm][Ee]\\[Uu][Ss][Ee][Rr] [Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_commandLine:/.*\\[Oo][Pp][Ee][Rr][Aa] [Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Oo][Pp][Ee][Rr][Aa] [Gg][Xx] [Ss][Tt][Aa][Bb][Ll][Ee]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Oo][Pp][Ee][Rr][Aa] [Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Oo][Pp][Ee][Rr][Aa] [Nn][Ee][Oo][Nn]\\[Uu][Ss][Ee][Rr] [Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_commandLine:/.*\\[Oo][Pp][Ee][Rr][Aa] [Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Oo][Pp][Ee][Rr][Aa] [Ss][Tt][Aa][Bb][Ll][Ee]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Oo][Rr][Bb][Ii][Tt][Uu][Mm]\\[Uu][Ss][Ee][Rr] [Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_commandLine:/.*\\[Qq][Ii][Pp] [Ss][Uu][Rr][Ff]\\[Uu][Ss][Ee][Rr] [Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_commandLine:/.*\\[Ss][Pp][Uu][Tt][Nn][Ii][Kk]\\[Uu][Ss][Ee][Rr] [Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_commandLine:/.*\\[Tt][Oo][Rr][Cc][Hh]\\[Uu][Ss][Ee][Rr] [Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_commandLine:/.*\\[Uu][Cc][Oo][Zz][Mm][Ee][Dd][Ii][Aa]\\[Uu][Rr][Aa][Nn]\\[Uu][Ss][Ee][Rr] [Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_commandLine:/.*\\[Vv][Ii][Vv][Aa][Ll][Dd][Ii]\\[Uu][Ss][Ee][Rr] [Dd][Aa][Tt][Aa].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 6a69f62d-ce75-4b57-8dce-6351eb55b362
    name: Esentutl Steals Browser Information
    reason: esentutl copying locked browser/WebCache stores is a sibling method of the same theft
  - id: 8ba484e8-4b97-11ec-b19a-acde48001122
    name: Possible Browser Pass View Parameter
    reason: browser password-viewer parameters indicate credential extraction tooling on the copied profile
  - id: d0dae994-26c6-4d2d-83b5-b3c8b79ae513
    name: PUA - WebBrowserPassView Execution
    reason: WebBrowserPassView is the usual tool run on a copied profile to read stolen logins
  - id: 5a6e1e16-07de-48d8-8aae-faa766c05e88
    name: Potential Cookies Session Hijacking
    reason: cookie copying for session hijacking is the same collection targeting the same profile folders
  - id: b3d34dc5-2efd-4ae3-845f-8ec14921f449
    name: Browser Started with Remote Debugging
    reason: remote-debugging browser launch is an alternate way to pull cookies/credentials
  - id: c7d33b50-f690-4b51-8cfb-0fb912a31e57
    name: HackTool - SharpDPAPI Execution
    reason: SharpDPAPI decrypts the DPAPI master keys needed to open stolen Chrome/Edge secrets
  - id: 85a8e5ba-bd03-4bfb-bbfa-a4409a8f8b98
    name: Folder Compress To Potentially Suspicious Output Via Compress-Archive Cmdlet
    reason: copied profile data is typically compressed to a staging archive before exfiltration
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Browser profile file access by scripts and tools
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ll][Oo][Gg][Ii][Nn] [Dd][Aa][Tt][Aa]|[Ll][Oo][Cc][Aa][Ll] [Ss][Tt][Aa][Tt][Ee]|[Kk][Ee][Yy]4\.[Dd][Bb]|[Ll][Oo][Gg][Ii][Nn][Ss]\.[Jj][Ss][Oo][Nn]|\\[Cc][Oo][Oo][Kk][Ii][Ee][Ss]|[Ww][Ee][Bb] [Dd][Aa][Tt][Aa]).*/
    pivot_on: host
    window: 4h
  - name: DPAPI decryption of stored browser secrets
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Cc][Rr][Yy][Pp][Tt][Uu][Nn][Pp][Rr][Oo][Tt][Ee][Cc][Tt][Dd][Aa][Tt][Aa]|[Pp][Rr][Oo][Tt][Ee][Cc][Tt][Ee][Dd][Dd][Aa][Tt][Aa]|[Dd][Pp][Aa][Pp][Ii]|[Mm][Aa][Ss][Tt][Ee][Rr][Kk][Ee][Yy]).*/
    pivot_on: host
    window: 4h
  - name: Browsers killed to release locked databases
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Tt][Aa][Ss][Kk][Kk][Ii][Ll][Ll]\.[Ee][Xx][Ee].*/ AND data_win_eventdata_commandLine:/.*([Cc][Hh][Rr][Oo][Mm][Ee]\.[Ee][Xx][Ee]|[Mm][Ss][Ee][Dd][Gg][Ee]\.[Ee][Xx][Ee]|[Ff][Ii][Rr][Ee][Ff][Oo][Xx]\.[Ee][Xx][Ee]|[Bb][Rr][Aa][Vv][Ee]\.[Ee][Xx][Ee]).*/
    pivot_on: host
    window: 2h
  - name: Staging archives of collected data
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]-[Aa][Rr][Cc][Hh][Ii][Vv][Ee]|7[Zz]\.[Ee][Xx][Ee] [Aa]|[Rr][Aa][Rr]\.[Ee][Xx][Ee] [Aa]|[Tt][Aa][Rr] -[Cc]|[Mm][Aa][Kk][Ee][Cc][Aa][Bb]).*/
    pivot_on: host
    window: 4h
  - name: Exfiltration over web or cloud transfer tooling
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Cc][Uu][Rr][Ll] |[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt]|[Ii][Nn][Vv][Oo][Kk][Ee]-[Rr][Ee][Ss][Tt][Mm][Ee][Tt][Hh][Oo][Dd]|[Rr][Cc][Ll][Oo][Nn][Ee]|[Mm][Ee][Gg][Aa][Cc][Mm][Dd]|[Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr]\.[Ss][Hh]|[Pp][Aa][Ss][Tt][Ee][Bb][Ii][Nn]).*/
    pivot_on: host
    window: 4h
