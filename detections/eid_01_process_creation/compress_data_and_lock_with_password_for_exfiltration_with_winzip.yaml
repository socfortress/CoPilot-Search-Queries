name: Compress Data and Lock With Password for Exfiltration With WINZIP
id: e2e80da2-8c66-4e00-ae3c-2eebd29f6b6d
version: 1
schema_version: "1.0"
date: "2022-12-25"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: e2e80da2-8c66-4e00-ae3c-2eebd29f6b6d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  An adversary may compress or encrypt data that is collected prior to
  exfiltration using 3rd party utilities. MITRE ATT&CK: T1560.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*winzip.exe*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*winzip64.exe*"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*-s\"*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -min *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -a *"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*winzip.exe*'; data_win_eventdata_commandLine matches '*winzip64.exe*';
  data_win_eventdata_commandLine matches '*-s"*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1560.001/T1560.001.md
  - https://attack.mitre.org/techniques/T1560/001/

response:
  message: >
    Compress Data and Lock With Password for Exfiltration With WINZIP detected
    on host $agent_name$. Matched data_win_eventdata_commandLine:
    $data_win_eventdata_commandLine$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1560.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1560.001
  custom_tags:
    - compress
    - password
    - exfiltration
    - process_creation
    - sysmon
    - collection
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ww][Ii][Nn][Zz][Ii][Pp]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ww][Ii][Nn][Zz][Ii][Pp]64\.[Ee][Xx][Ee].*/) AND data_win_eventdata_commandLine:/.*-[Ss]\".*/ AND (data_win_eventdata_commandLine:/.* -[Mm][Ii][Nn] .*/ OR data_win_eventdata_commandLine:/.* -[Aa] .*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 9fbf5927-5261-4284-a71d-f681029ea574
    name: Compress Data and Lock With Password for Exfiltration With 7-ZIP
    reason: Sibling rule; same password-protected staging with another archiver.
  - id: faa48cae-6b25-4f00-a094-08947fef582f
    name: Rar Usage with Password and Compression Level
    reason: Alternate archiver used for the same staging.
  - id: afe52666-401e-4a02-b4ff-5d128990b8cb
    name: Suspicious Greedy Compression Using Rar.EXE
    reason: Bulk compression of collected data on the same host.
  - id: 85a8e5ba-bd03-4bfb-bbfa-a4409a8f8b98
    name: Folder Compress To Potentially Suspicious Output Via Compress-Archive Cmdlet
    reason: Native PowerShell staging alternative.
  - id: 32e0baea-b3f1-11eb-a2ce-acde48001122
    name: Detect RClone Command-Line Usage
    reason: Likely exfil channel for the produced archive.
  - id: e328cc73-f92a-42fb-b3fa-7c2cffda981a
    name: Curl File Upload To File Sharing Websites
    reason: Upload of the archive to external sharing site.
  - id: 7d1aaf3d-4304-425c-b7c3-162055e0b3ab
    name: Potential Data Exfiltration Activity Via CommandLine Tools
    reason: Follow-on command line exfiltration.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Password-protected archivers
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*[Ww]in[Zz]ip.*/ OR data_win_eventdata_commandLine:/.*7z.*/ OR data_win_eventdata_commandLine:/.*[Rr]ar.*/) AND data_win_eventdata_commandLine:/.*(-s|-p|-hp).*/
    pivot_on: host
    window: 6h
  - name: Archive file creation
    query: data_win_system_eventID:11 AND (data_win_eventdata_targetFilename:/.*\.zip/ OR data_win_eventdata_targetFilename:/.*\.7z/ OR data_win_eventdata_targetFilename:/.*\.rar/)
    pivot_on: host
    window: 6h
  - name: Exfil tools
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*[Rr]clone.*/ OR data_win_eventdata_image:/.*[Cc]url\.exe/ OR data_win_eventdata_image:/.*[Ww]inscp.*/ OR data_win_eventdata_image:/.*[Ff]tp\.exe/)
    pivot_on: host
    window: 6h
  - name: Outbound connections
    query: data_win_system_eventID:3 AND data_win_eventdata_initiated:true AND data_win_eventdata_destinationPort:(443 OR 21 OR 22)
    pivot_on: host
    window: 2h
