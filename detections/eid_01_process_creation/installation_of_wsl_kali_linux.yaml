name: Installation of WSL Kali-Linux
id: eca8ae39-5c3c-4321-b538-9e64fe25822e
version: 1
schema_version: "1.0"
date: "2025-10-10"
author: Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: eca8ae39-5c3c-4321-b538-9e64fe25822e
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects installation of Kali Linux distribution through Windows Subsystem for
  Linux (WSL). Attackers may use Kali Linux WSL to leverage its penetration
  testing tools and capabilities for malicious purposes. MITRE ATT&CK: T1059.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\wsl.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "wsl"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* --install *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -i *"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*kali*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches '*\wsl.exe';
  data_win_eventdata_originalFileName equals 'wsl';
  data_win_eventdata_commandLine matches '* --install *', among other
  conditions.

known_false_positives: >
  Legitimate installation or usage of Kali Linux WSL by administrators or
  security teams. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://medium.com/@redfanatic7/running-kali-linux-on-windows-51ad95166e6e
  - https://learn.microsoft.com/en-us/windows/wsl/install
  - https://attack.mitre.org/techniques/T1059/

response:
  message: >
    Installation of WSL Kali-Linux detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1059
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059
  custom_tags:
    - installation
    - process_creation
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ww][Ss][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ww][Ss][Ll]/) AND (data_win_eventdata_commandLine:/.* --[Ii][Nn][Ss][Tt][Aa][Ll][Ll] .*/ OR data_win_eventdata_commandLine:/.* -[Ii] .*/) AND data_win_eventdata_commandLine:/.*[Kk][Aa][Ll][Ii].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 6f1a11aa-4b8a-4b7f-9e13-4d3e4ff0e0d4
    name: WSL Kali-Linux Usage
    reason: 'Direct follow-on: use of the installed Kali distro on the same host shows whether it is being operated.'
  - id: 2267fe65-0681-42ad-9a6d-46553d3f3480
    name: WSL Child Process Anomaly
    reason: Anomalous processes spawned from wsl.exe reveal tooling executed in the new distro.
  - id: ed825c86-c009-4014-b413-b76003e33d35
    name: Windows Binary Executed From WSL
    reason: WSL-to-Windows interop is how Kali tooling pivots back into the Windows host.
  - id: 5edc2273-c26f-406c-83f3-f4d948e740dd
    name: Indirect Inline Command Execution Via Bash.EXE
    reason: bash.exe/WSL used as a LOLBin to run commands outside normal Windows monitoring.
  - id: 2d22a514-e024-4428-9dba-41505bd63a5b
    name: Indirect Command Execution From Script File Via Bash.EXE
    reason: Script execution via the WSL bash launcher is a follow-on way to run attack scripts.
  - id: a54f842a-3713-4b45-8c84-5f136fdebd3c
    name: New PortProxy Registry Entry Added
    reason: WSL-hosted listeners are often exposed or relayed via netsh portproxy.
  - id: 327f48c1-a6db-4eb8-875a-f6981f1b0183
    name: Port Forwarding Activity Via SSH.EXE
    reason: Tunnelling to attacker infrastructure is a typical use of the Kali install.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: WSL launcher activity
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Ww][Ss][Ll]|[Bb][Aa][Ss][Hh]|[Ww][Ss][Ll][Hh][Oo][Ss][Tt])\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 24h
  - name: Enablement of WSL and virtualization features
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Dd][Ii][Ss][Mm]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll])\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*([Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]-[Ww][Ii][Nn][Dd][Oo][Ww][Ss]-[Ss][Uu][Bb][Ss][Yy][Ss][Tt][Ee][Mm]-[Ll][Ii][Nn][Uu][Xx]|[Vv][Ii][Rr][Tt][Uu][Aa][Ll][Mm][Aa][Cc][Hh][Ii][Nn][Ee][Pp][Ll][Aa][Tt][Ff][Oo][Rr][Mm]).*/
    pivot_on: host
    window: 24h
  - name: Distro rootfs and disk files written
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*([Kk][Aa][Ll][Ii]|[Rr][Oo][Oo][Tt][Ff][Ss]).*/ OR data_win_eventdata_targetFilename:/.*\.[Vv][Hh][Dd][Xx]/)
    pivot_on: host
    window: 24h
  - name: Network connections from WSL helper processes
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Ww][Ss][Ll]|[Ww][Ss][Ll][Hh][Oo][Ss][Tt]|[Ww][Ss][Ll][Ss][Ee][Rr][Vv][Ii][Cc][Ee])\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 24h
  - name: Portproxy and SSH tunnel commands
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\[Nn][Ee][Tt][Ss][Hh]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Pp][Oo][Rr][Tt][Pp][Rr][Oo][Xx][Yy].*/) OR (data_win_eventdata_image:/.*\\[Ss][Ss][Hh]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.* -[RrLlDd] .*/))
    pivot_on: host
    window: 24h
