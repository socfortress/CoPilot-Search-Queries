name: Sticky Key Like Backdoor Execution
id: 2fdefcb3-dbda-401e-ae23-f0db027628bc
version: 1
schema_version: "1.0"
date: "2023-03-07"
author: Florian Roth (Nextron Systems), @twjackomo, Jonhnathan Ribeiro, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 2fdefcb3-dbda-401e-ae23-f0db027628bc
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the usage and installation of a backdoor that uses an option to
  register a malicious debugger for built-in tools that are accessible in the
  login screen. MITRE ATT&CK: T1546.008.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_parentImage:
              value: "*\\\\winlogon.exe"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\cmd.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\cscript.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\mshta.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\powershell.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\pwsh.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\regsvr32.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\rundll32.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\wscript.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\wt.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*sethc.exe*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*utilman.exe*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*osk.exe*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Magnify.exe*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Narrator.exe*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*DisplaySwitch.exe*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\winlogon.exe'; data_win_eventdata_image matches '*\cmd.exe';
  data_win_eventdata_image matches '*\cscript.exe', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://learn.microsoft.com/en-us/archive/blogs/jonathantrull/detecting-sticky-key-backdoors
  - https://attack.mitre.org/techniques/T1546/008/

response:
  message: >
    Sticky Key Like Backdoor Execution detected on host $agent_name$. Matched
    data_win_eventdata_parentImage: $data_win_eventdata_parentImage$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1546.008
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1546.008
  custom_tags:
    - sticky
    - backdoor
    - process_creation
    - sysmon
    - privilege_escalation
    - persistence
    - car_2014_11_003
    - car_2014_11_008
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Tt]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*[Ss][Ee][Tt][Hh][Cc]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_commandLine:/.*[Uu][Tt][Ii][Ll][Mm][Aa][Nn]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_commandLine:/.*[Oo][Ss][Kk]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_commandLine:/.*[Mm][Aa][Gg][Nn][Ii][Ff][Yy]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_commandLine:/.*[Nn][Aa][Rr][Rr][Aa][Tt][Oo][Rr]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Pp][Ll][Aa][Yy][Ss][Ww][Ii][Tt][Cc][Hh]\.[Ee][Xx][Ee].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 1070db9a-3e5d-412e-8e7b-7183b616e1b3
    name: Persistence Via Sticky Key Backdoor
    reason: The installation step (IFEO debugger or binary replacement) that precedes this login-screen execution.
  - id: baca5663-583c-45f9-b5dc-ea96a22ce542
    name: Sticky Key Like Backdoor Usage - Registry
    reason: Registry evidence of the debugger being registered for sethc/utilman/osk.
  - id: ae215552-081e-44c7-805f-be16f975c8a2
    name: Suspicious Debugger Registration Cmdline
    reason: Command-line form of the same IFEO debugger registration.
  - id: 36803969-5421-41ec-b92f-8500f79c23b0
    name: Potential Persistence Via GlobalFlags
    reason: Sibling IFEO-based persistence an operator may plant together.
  - id: windows-winlogon-public-network-connection-001
    name: Windows WinLogon With Public Network Connection
    reason: A backdoor shell started from the login screen may reach out to the internet.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: IFEO Debugger registry set for accessibility tools
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*[Ii]mage [Ff]ile [Ee]xecution [Oo]ptions.*/ AND data_win_eventdata_targetObject:/.*(sethc|utilman|osk|magnify|narrator|displayswitch).*/
    pivot_on: host
    window: 24h
  - name: Commands tampering with accessibility binaries
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(sethc|utilman|osk|magnify|narrator).*/ AND (data_win_eventdata_commandLine:/.*[Dd]ebugger.*/ OR data_win_eventdata_commandLine:/.*([Cc]opy|[Tt]akeown|[Ii]cacls).*/)
    pivot_on: host
    window: 24h
  - name: Account creation or admin group changes
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*net1? user .* \/add.*/ OR data_win_eventdata_commandLine:/.*net1? localgroup administrators.*/)
    pivot_on: host
    window: 6h
  - name: Shell network connections to remote hosts
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*\\(cmd|powershell)\.exe/ AND data_win_eventdata_initiated:true
    pivot_on: host
    window: 6h
  - name: Shells spawned by winlogon
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*\\winlogon\.exe/
    pivot_on: host
    window: 6h
