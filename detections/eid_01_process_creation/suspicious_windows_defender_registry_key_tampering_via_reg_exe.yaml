correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 0eb46774-f1ab-4a74-8238-1155855f2263
    name: Disable Windows Defender Functionalities Via Registry Keys
    reason: Sysmon registry-set view of the same Defender key changes made by reg.exe.
  - id: 93d298a1-d28f-47f1-a468-d971e7796679
    name: Disable Tamper Protection on Windows Defender
    reason: TamperProtection is explicitly in this rule's key list; the registry event confirms the change.
  - id: 49e5bc24-8b86-49f1-b743-535f332c2856
    name: Microsoft Defender Tamper Protection Trigger
    reason: Defender's tamper-protection trigger fires when these edits are attempted or blocked.
  - id: 48917adc-a28e-4f5d-b729-11e75da8941f
    name: Suspicious Windows Defender Folder Exclusion Added Via Reg.EXE
    reason: Folder exclusions via reg.exe are the sibling move in the same defense-evasion step.
  - id: 5e95028c-5229-4214-afae-d653d573d0ec
    name: Security Service Disabled Via Reg.EXE
    reason: reg.exe also used to disable security services in the same operator session.
  - id: b28e58e4-2a72-4fae-bdee-0fbe904db642
    name: Windows Defender Real-time Protection Disabled
    reason: Real-time protection reported disabled is the observable result.
  - id: 07e3cb2c-0608-410d-be4b-1511cb1a0448
    name: Tamper Windows Defender Remove-MpPreference
    reason: Alternate route to undo Defender settings (Remove-MpPreference) in the same intrusions.
  - id: bf9e1387-b040-4393-9851-1598f8ecfae9
    name: Disable Exploit Guard Network Protection on Windows Defender
    reason: Network protection/Exploit Guard disable is another registry change in this tamper family.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Registry value sets on Defender keys
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:(/.*Windows Defender.*/ OR /.*Microsoft Antimalware.*/)
    pivot_on: host
    window: 6h
  - name: PowerShell Defender preference changes
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ss]et-[Mm]p[Pp]reference.*/ OR /.*[Aa]dd-[Mm]p[Pp]reference.*/) AND data_win_eventdata_commandLine:(/.*[Dd]isable.*/ OR /.*[Ee]xclusion.*/)
    pivot_on: host
    window: 6h
  - name: Security service stop or disable
    query: data_win_system_eventID:1 AND data_win_eventdata_image:(/.*\\(sc|net|net1)\.exe/) AND data_win_eventdata_commandLine:(/.*(WinDefend|Sense|WdNisSvc|wscsvc|mpssvc).*/)
    pivot_on: host
    window: 6h
  - name: Ransomware or destructive prep
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ss]hadow.*[Dd]elete.*/ OR /.*recoveryenabled.*/ OR /.*wbadmin.*delete.*/ OR /.*vssadmin.*/)
    pivot_on: host
    window: 6h
  - name: Execution from user-writable paths
    query: data_win_system_eventID:1 AND data_win_eventdata_image:(/.*\\Users\\Public\\.*/ OR /.*\\AppData\\Local\\Temp\\.*/ OR /.*\\ProgramData\\.*/)
    pivot_on: host
    window: 2h
