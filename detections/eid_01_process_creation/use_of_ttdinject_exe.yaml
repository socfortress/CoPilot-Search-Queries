name: Use of TTDInject.exe
id: b27077d6-23e6-45d2-81a0-e2b356eea5fd
version: 1
schema_version: "1.0"
date: "2022-05-16"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: b27077d6-23e6-45d2-81a0-e2b356eea5fd
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the executiob of TTDInject.exe, which is used by Windows 10 v1809 and
  newer to debug time travel (underlying call of tttracer.exe). MITRE ATT&CK:
  T1127.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*ttdinject.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "TTDInject.EXE"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*ttdinject.exe'; data_win_eventdata_originalFileName equals 'TTDInject.EXE'.

known_false_positives: >
  Legitimate use. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://lolbas-project.github.io/lolbas/Binaries/Ttdinject/
  - https://attack.mitre.org/techniques/T1127/

response:
  message: >
    Use of TTDInject.exe detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1127
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1127
  custom_tags:
    - ttdinject
    - process_creation
    - sysmon
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Tt][Tt][Dd][Ii][Nn][Jj][Ee][Cc][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Tt][Tt][Dd][Ii][Nn][Jj][Ee][Cc][Tt]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 4f73421b-5a0b-4bbf-a892-5a7fb99bea66
    name: Mavinject Inject DLL Into Running Process
    reason: Mavinject DLL injection is the sibling Microsoft-signed injector abused the same way as TTDInject.
  - id: e6474a1b-5390-49cd-ab41-8d88655f7394
    name: Renamed Mavinject.EXE Execution
    reason: Renamed Mavinject execution suggests evasion of the same injection technique.
  - id: b5c7395f-e501-4a08-94d4-57fe7a9da9d2
    name: Potential Binary Proxy Execution Via Cdb.EXE
    reason: Cdb.EXE debugger proxy execution is a related debugger-family LOLBin.
  - id: 148431ce-4b70-403d-8525-fcc2993f29ea
    name: Potential DLL Injection Or Execution Using Tracker.exe
    reason: Tracker.exe DLL injection is another signed-tool injection method.
  - id: 744a188b-0415-4792-896f-11ddb0588dbc
    name: Potential Process Injection Via Msra.EXE
    reason: Msra.exe process injection is another living-off-the-land injection technique.
  - id: 5afee48e-67dd-4e03-a783-f74259dcf998
    name: Potential LSASS Process Dump Via Procdump
    reason: Procdump LSASS dump is the credential-theft step debug tooling is often used to enable.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Time-travel tracing tools
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*([Tt][Tt][Tt][Rr][Aa][Cc][Ee][Rr]\.[Ee][Xx][Ee]|[Tt][Tt][Dd][Ii][Nn][Jj][Ee][Cc][Tt]\.[Ee][Xx][Ee]|[Tt][Tt][Dd][Ll][Oo][Aa][Dd][Ee][Rr]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 4h
  - name: Process access to lsass
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*([Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 2h
  - name: Remote thread creation into other processes
    query: data_win_system_eventID:"8"
    pivot_on: host
    window: 2h
  - name: Other injection and debug LOLBins
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*([Mm][Aa][Vv][Ii][Nn][Jj][Ee][Cc][Tt]\.[Ee][Xx][Ee]|[Cc][Dd][Bb]\.[Ee][Xx][Ee]|[Ww][Ii][Nn][Dd][Bb][Gg]\.[Ee][Xx][Ee]|[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]|[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]64\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 4h
  - name: Dump and trace files written
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.([Dd][Mm][Pp]|[Rr][Uu][Nn]|[Tt][Rr][Cc])/
    pivot_on: host
    window: 4h
