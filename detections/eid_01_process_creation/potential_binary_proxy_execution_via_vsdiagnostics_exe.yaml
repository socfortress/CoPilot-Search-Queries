name: Potential Binary Proxy Execution Via VSDiagnostics.EXE
id: ac1c92b4-ac81-405a-9978-4604d78cc47e
version: 1
schema_version: "1.0"
date: "2023-08-03"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: ac1c92b4-ac81-405a-9978-4604d78cc47e
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of "VSDiagnostics.exe" with the "start" command in order to
  launch and proxy arbitrary binaries. MITRE ATT&CK: T1218.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\VSDiagnostics.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "VSDiagnostics.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*start*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /launch:*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -launch:*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\VSDiagnostics.exe'; data_win_eventdata_originalFileName equals
  'VSDiagnostics.exe'; data_win_eventdata_commandLine matches '*start*', among
  other conditions.

known_false_positives: >
  Legitimate usage for tracing and diagnostics purposes. Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://twitter.com/0xBoku/status/1679200664013135872
  - https://attack.mitre.org/techniques/T1218/

response:
  message: >
    Potential Binary Proxy Execution Via VSDiagnostics.EXE detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1218
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218
  custom_tags:
    - binary
    - proxy
    - vsdiagnostics
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Vv][Ss][Dd][Ii][Aa][Gg][Nn][Oo][Ss][Tt][Ii][Cc][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Vv][Ss][Dd][Ii][Aa][Gg][Nn][Oo][Ss][Tt][Ii][Cc][Ss]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Ss][Tt][Aa][Rr][Tt].*/ AND (data_win_eventdata_commandLine:/.* \/[Ll][Aa][Uu][Nn][Cc][Hh]:.*/ OR data_win_eventdata_commandLine:/.* -[Ll][Aa][Uu][Nn][Cc][Hh]:.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b5c7395f-e501-4a08-94d4-57fe7a9da9d2
    name: Potential Binary Proxy Execution Via Cdb.EXE
    reason: cdb.exe is the sibling debugger proxy; same tooling-abuse pattern to launch payloads
  - id: 15c7904e-6ad1-4a45-9b46-5fb25df37fd2
    name: Malicious PE Execution by Microsoft Visual Studio Debugger
    reason: vsjitdebugger launching a PE is another Visual Studio component used as a signed proxy
  - id: 9257c05b-4a4a-48e5-a670-b7b073cf401b
    name: Binary Proxy Execution Via Dotnet-Trace.EXE
    reason: dotnet-trace child-process execution abuses the same diagnostics-tool launch semantics
  - id: 45d3a03d-f441-458c-8883-df101a3bb146
    name: Launch-VsDevShell.PS1 Proxy Execution
    reason: Launch-VsDevShell.ps1 proxy execution comes from the same Visual Studio toolchain
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Children of VSDiagnostics and VS debug components
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*(\\[Vv][Ss][Dd][Ii][Aa][Gg][Nn][Oo][Ss][Tt][Ii][Cc][Ss]\.[Ee][Xx][Ee]|\\[Vv][Ss][Jj][Ii][Tt][Dd][Ee][Bb][Uu][Gg][Gg][Ee][Rr]\.[Ee][Xx][Ee]|\\[Dd][Ii][Aa][Gg][Nn][Oo][Ss][Tt][Ii][Cc][Ss][Hh][Uu][Bb]\.[Ss][Tt][Aa][Nn][Dd][Aa][Rr][Dd][Cc][Oo][Ll][Ll][Ee][Cc][Tt][Oo][Rr]\.[Ll][Aa][Uu][Nn][Cc][Hh][Ee][Rr]\.[Ee][Xx][Ee]).*/
    pivot_on: host
    window: 2h
  - name: VSDiagnostics running outside a Visual Studio install
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Vv][Ss][Dd][Ii][Aa][Gg][Nn][Oo][Ss][Tt][Ii][Cc][Ss]\.[Ee][Xx][Ee].*/ AND NOT data_win_eventdata_image:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt] [Vv][Ii][Ss][Uu][Aa][Ll] [Ss][Tt][Uu][Dd][Ii][Oo]\\.*/
    pivot_on: host
    window: 24h
  - name: VSDiagnostics or collector binaries dropped to disk
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(\\[Vv][Ss][Dd][Ii][Aa][Gg][Nn][Oo][Ss][Tt][Ii][Cc][Ss]\.[Ee][Xx][Ee]|\\[Dd][Ii][Aa][Gg][Nn][Oo][Ss][Tt][Ii][Cc][Ss][Hh][Uu][Bb]\.[Ss][Tt][Aa][Nn][Dd][Aa][Rr][Dd][Cc][Oo][Ll][Ll][Ee][Cc][Tt][Oo][Rr]\.[Ll][Aa][Uu][Nn][Cc][Hh][Ee][Rr]\.[Ee][Xx][Ee]).*/
    pivot_on: host
    window: 6h
  - name: Interpreters spawned from VS tooling
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*(\\[Vv][Ss][Dd][Ii][Aa][Gg][Nn][Oo][Ss][Tt][Ii][Cc][Ss]\.[Ee][Xx][Ee]|\\[Vv][Ss][Jj][Ii][Tt][Dd][Ee][Bb][Uu][Gg][Gg][Ee][Rr]\.[Ee][Xx][Ee]|\\[Dd][Ee][Vv][Ee][Nn][Vv]\.[Ee][Xx][Ee]).*/ AND data_win_eventdata_image:/.*(\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]|\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]).*/
    pivot_on: host
    window: 2h
