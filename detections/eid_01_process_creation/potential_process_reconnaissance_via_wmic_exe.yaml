name: Potential Process Reconnaissance via Wmic.EXE
id: 221b251a-357a-49a9-920a-271802777cc0
version: 1
schema_version: "1.0"
date: "2025-12-15"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 221b251a-357a-49a9-920a-271802777cc0
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of "wmic" with the "process" flag, which might indicate
  an attempt to perform reconnaissance on running processes. Adversaries may use
  wmic to query for running processes and their details as part of their
  reconnaissance efforts. MITRE ATT&CK: T1047, T1057.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\WMIC.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "wmic.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*process*"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_commandLine"
        - bool:
            must_not:
              - bool:
                  should:
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*call*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*create*"
                                case_insensitive: true
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*call*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*terminate*"
                                case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\WMIC.exe'; data_win_eventdata_originalFileName equals 'wmic.exe';
  data_win_eventdata_commandLine matches '*process*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1047/T1047.md
  - https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/wmic
  - https://attack.mitre.org/techniques/T1047/
  - https://attack.mitre.org/techniques/T1057/

response:
  message: >
    Potential Process Reconnaissance via Wmic.EXE detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1047, T1057
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1047
    - T1057
  custom_tags:
    - reconnaissance
    - process_creation
    - sysmon
    - execution
    - discovery
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Pp][Rr][Oo][Cc][Ee][Ss][Ss].*/ AND _exists_:data_win_eventdata_commandLine AND NOT ((data_win_eventdata_commandLine:/.*[Cc][Aa][Ll][Ll].*/ AND data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee].*/) OR (data_win_eventdata_commandLine:/.*[Cc][Aa][Ll][Ll].*/ AND data_win_eventdata_commandLine:/.*[Tt][Ee][Rr][Mm][Ii][Nn][Aa][Tt][Ee].*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 526be59f-a573-4eea-b5f7-f0973207634d
    name: Process Creation Attempt via Wmic.EXE
    reason: wmic 'process call create' is the execution step that commonly follows wmic reconnaissance
  - id: 3c89a1e8-0fba-449e-8f1b-8409d6267ec8
    name: Suspicious Process Created Via Wmic.EXE
    reason: 'Follow-on: attacker moves from enumeration to launching payloads through wmic'
  - id: 7773b877-5abb-4a3e-b9c9-fd0369b59b00
    name: WMIC Remote Command Execution
    reason: 'Same wmic tooling reused with /node: for remote execution after recon'
  - id: 9d5a1274-922a-49d0-87f3-8c653483b909
    name: Uncommon System Information Discovery Via Wmic.EXE
    reason: Sibling wmic discovery that co-occurs in scripted recon batches
  - id: 847d5ff3-8a31-4737-a970-aeae8fe21765
    name: Potential Tampering With Security Products Via WMIC
    reason: Process listing is used to find AV/EDR processes that are then tampered with
  - id: e568650b-5dcd-4658-8f34-ded0b1e13992
    name: Potential Product Class Reconnaissance Via Wmic.EXE
    reason: Process and security-product enumeration are typically run back to back
  - id: 76f55eaa-d27f-4213-9d45-7b0e4b60bbae
    name: Service Reconnaissance Via Wmic.EXE
    reason: Services enumeration usually accompanies process enumeration
  - id: 34275eb8-fa19-436b-b959-3d9ecd53fa1f
    name: Loaded Module Enumeration Via Tasklist.EXE
    reason: Alternative process/module enumeration tool in the same recon phase
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other wmic invocations on host
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Ww][Mm][Ii][Cc]\.exe/
    pivot_on: host
    window: 4h
  - name: Tasklist and Get-Process listing
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*[Tt]asklist\.exe/ OR data_win_eventdata_commandLine:/.*[Gg]et-[Pp]rocess.*/)
    pivot_on: host
    window: 2h
  - name: Security tool process lookups
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*([Ff]indstr|[Ff]ind).*(MsMpEng|csfalcon|CylanceSvc|sentinel|carbon|sysmon|[Dd]efender).*/
    pivot_on: host
    window: 2h
  - name: Discovery commands by same user
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*[Ww]hoami\.exe/ OR data_win_eventdata_image:/.*[Nn]et1?\.exe/ OR data_win_eventdata_image:/.*[Ss]ysteminfo\.exe/ OR data_win_eventdata_image:/.*[Nn]ltest\.exe/)
    pivot_on: user
    window: 4h
  - name: Process termination of tools
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*([Tt]askkill|[Ss]top-[Pp]rocess).*/
    pivot_on: host
    window: 4h
