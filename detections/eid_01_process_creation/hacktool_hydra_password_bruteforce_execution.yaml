name: HackTool - Hydra Password Bruteforce Execution
id: aaafa146-074c-11eb-adc1-0242ac120002
version: 1
schema_version: "1.0"
date: "2023-02-04"
author: Vasiliy Burov
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: aaafa146-074c-11eb-adc1-0242ac120002
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects command line parameters used by Hydra password guessing hack tool.
  MITRE ATT&CK: T1110, T1110.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*-u *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*-p *"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*^USER^*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*^PASS^*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches '*-u
  *'; data_win_eventdata_commandLine matches '*-p *';
  data_win_eventdata_commandLine matches '*^USER^*', among other conditions.

known_false_positives: >
  Software that uses the caret encased keywords PASS and USER in its command
  line. Baseline expected activity in your environment and tune this detection
  before relying on it for automated response.

references:
  - https://github.com/vanhauser-thc/thc-hydra
  - https://attack.mitre.org/techniques/T1110/
  - https://attack.mitre.org/techniques/T1110/001/

response:
  message: >
    HackTool - Hydra Password Bruteforce Execution detected on host
    $agent_name$. Matched data_win_eventdata_commandLine:
    $data_win_eventdata_commandLine$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1110, T1110.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1110
    - T1110.001
  custom_tags:
    - hacktool
    - hydra
    - password
    - process_creation
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*-[Uu] .*/ AND data_win_eventdata_commandLine:/.*-[Pp] .*/ AND (data_win_eventdata_commandLine:/.*\^[Uu][Ss][Ee][Rr]\^.*/ OR data_win_eventdata_commandLine:/.*\^[Pp][Aa][Ss][Ss]\^.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 42a993dd-bb3e-48c8-b372-4d6684c4106c
    name: HackTool - CrackMapExec Execution
    reason: CrackMapExec is the other common password spraying tool and often runs in the same session
  - id: 7638e5fe-600c-4289-a968-f49dd537ec7d
    name: HackTool - NetExec Execution
    reason: NetExec (CME successor) spraying alongside Hydra
  - id: f376c8a7-a2d0-4ddc-aa0c-16c17236d962
    name: HackTool - Bloodhound/Sharphound Execution
    reason: Bloodhound/Sharphound enumeration normally precedes guessing against discovered accounts
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: Credential theft with Mimikatz follows a successful guess on a reachable host
  - id: 0685b176-c816-4837-8e7b-1216f346636b
    name: HackTool - Quarks PwDump Execution
    reason: Credential dumping with PwDump follows a successful guess
  - id: a197e378-d31b-41c0-9635-cfdf1c1bb423
    name: HackTool - WinRM Access Via Evil-WinRM
    reason: Evil-WinRM is how a guessed WinRM credential is used
  - id: 4627c6ae-6899-46e2-aa0c-6ebcb1becd19
    name: HackTool - Impacket Tools Execution
    reason: Impacket tools are used with guessed credentials for remote execution
  - id: d4498716-1d52-438f-8084-4a603157d131
    name: Password Provided In Command Line Of Net.EXE
    reason: Net.exe with a password on the command line shows a credential being used
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Guessing or spray tools and their argument patterns
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Hh][Yy][Dd][Rr][Aa]|[Mm][Ee][Dd][Uu][Ss][Aa]|[Nn][Cc][Rr][Aa][Cc][Kk]|[Cc][Rr][Aa][Cc][Kk][Mm][Aa][Pp][Ee][Xx][Ee][Cc]|[Nn][Ee][Tt][Ee][Xx][Ee][Cc]|[Kk][Ee][Rr][Bb][Rr][Uu][Tt][Ee])[^\\]*\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*(([Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd][Ss]\.[Tt][Xx][Tt]|[Rr][Oo][Cc][Kk][Yy][Oo][Uu]|[Uu][Ss][Ee][Rr][Ss]\.[Tt][Xx][Tt])|--[Pp]assword-).*/)
    pivot_on: host
    window: 6h
  - name: Service URIs targeted on the command line
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ss][Ss][Hh]|[Rr][Dd][Pp]|[Ss][Mm][Bb]|[Ff][Tt][Pp]|[Mm][Ss][Ss][Qq][Ll]|[Ss][Mm][Tt][Pp]):\/\/.*/
    pivot_on: host
    window: 6h
  - name: Outbound connections to remote-auth ports by non-system process
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:"true" AND data_win_eventdata_destinationPort:(22 OR 3389 OR 445 OR 21 OR 5985 OR 5986 OR 1433) AND NOT data_win_eventdata_image:/.*\\([Ss][Vv][Cc][Hh][Oo][Ss][Tt]|[Mm][Ss][Tt][Ss][Cc]|[Ss][Yy][Ss][Tt][Ee][Mm]).*/
    pivot_on: host
    window: 6h
  - name: Wordlists staged
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*([Rr][Oo][Cc][Kk][Yy][Oo][Uu]|[Ww][Oo][Rr][Dd][Ll][Ii][Ss][Tt]|[Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd][Ss]\.[Tt][Xx][Tt]|[Uu][Ss][Ee][Rr][Nn][Aa][Mm][Ee][Ss]\.[Tt][Xx][Tt]).*/
    pivot_on: host
    window: 6h
