name: AWL Bypass with Winrm.vbs and Malicious WsmPty.xsl/WsmTxt.xsl
id: 074e0ded-6ced-4ebd-8b4d-53f55908119d
version: 1
schema_version: "1.0"
date: "2022-10-09"
author: Julia Fomina, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 074e0ded-6ced-4ebd-8b4d-53f55908119d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of attacker-controlled WsmPty.xsl or WsmTxt.xsl via
  winrm.vbs and copied cscript.exe (can be renamed). MITRE ATT&CK: T1216.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*winrm*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*format:pretty*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*format:\"pretty\"*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*format:\"text\"*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*format:text*"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "C:\\\\Windows\\\\System32\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "C:\\\\Windows\\\\SysWOW64\\\\*"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*winrm*'; data_win_eventdata_commandLine matches '*format:pretty*';
  data_win_eventdata_commandLine matches '*format:"pretty"*', among other
  conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://posts.specterops.io/application-whitelisting-bypass-and-arbitrary-unsigned-code-execution-technique-in-winrm-vbs-c8c24fb40404
  - https://attack.mitre.org/techniques/T1216/

response:
  message: >
    AWL Bypass with Winrm.vbs and Malicious WsmPty.xsl/WsmTxt.xsl detected on
    host $agent_name$. Matched data_win_eventdata_commandLine:
    $data_win_eventdata_commandLine$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1216
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1216
  custom_tags:
    - bypass
    - winrm
    - wsmpty
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Ww][Ii][Nn][Rr][Mm].*/ AND (data_win_eventdata_commandLine:/.*[Ff][Oo][Rr][Mm][Aa][Tt]:[Pp][Rr][Ee][Tt][Tt][Yy].*/ OR data_win_eventdata_commandLine:/.*[Ff][Oo][Rr][Mm][Aa][Tt]:\"[Pp][Rr][Ee][Tt][Tt][Yy]\".*/ OR data_win_eventdata_commandLine:/.*[Ff][Oo][Rr][Mm][Aa][Tt]:\"[Tt][Ee][Xx][Tt]\".*/ OR data_win_eventdata_commandLine:/.*[Ff][Oo][Rr][Mm][Aa][Tt]:[Tt][Ee][Xx][Tt].*/) AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\.*/ OR data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Ww][Oo][Ww]64\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 9e50a8b3-dd05-4eb8-9153-bdb6b79d50b0
    name: Msxsl.EXE Execution
    reason: Sibling XSL script-execution LOLBin used for the same application-whitelisting bypass.
  - id: b6676963-0353-4f88-90f5-36c20d443c6a
    name: Cscript/Wscript Potentially Suspicious Child Process
    reason: The XSL payload runs inside a copied cscript.exe; its child processes reveal the payload.
  - id: 99b7460d-c9f1-40d7-a316-1f36f61d52ee
    name: Cscript/Wscript Uncommon Script Extension Execution
    reason: winrm.vbs is run via cscript; unusual script extensions/locations accompany the staging.
  - id: 070e9b80-6252-11eb-ae93-0242ac130002
    name: Detect Regsvr32 Application Control Bypass
    reason: Another AppLocker/AWL bypass an attacker tries on the same host when one is blocked.
  - id: a197e378-d31b-41c0-9635-cfdf1c1bb423
    name: HackTool - WinRM Access Via Evil-WinRM
    reason: Other abuse of WinRM on the host suggests lateral movement context.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Copied cscript and XSL files created
    query: data_win_system_eventID:11 AND (data_win_eventdata_targetFilename:/.*[Ww]sm(Pty|Txt)\.xsl/ OR data_win_eventdata_targetFilename:/.*[Cc]script.*\.exe/)
    pivot_on: host
    window: 4h
  - name: Winrm.vbs invocations
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*winrm\.vbs.*/
    pivot_on: host
    window: 4h
  - name: Children of script hosts
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*\\[cw]script\.exe/ AND data_win_eventdata_image:/.*\\(cmd|powershell|rundll32|regsvr32|mshta)\.exe/
    pivot_on: host
    window: 2h
  - name: Script-host network connections
    query: data_win_system_eventID:3 AND (data_win_eventdata_image:/.*\\[cw]script\.exe/ OR data_win_eventdata_image:/.*\\Users\\.*\.exe/)
    pivot_on: host
    window: 4h
