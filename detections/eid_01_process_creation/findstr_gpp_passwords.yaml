name: Findstr GPP Passwords
id: 91a2c315-9ee6-4052-a853-6f6a8238f90d
version: 1
schema_version: "1.0"
date: "2023-11-11"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 91a2c315-9ee6-4052-a853-6f6a8238f90d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Look for the encrypted cpassword value within Group Policy Preference files on
  the Domain Controller. This value can be decrypted with gpp-decrypt. MITRE
  ATT&CK: T1552.006.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\find.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\findstr.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "FIND.EXE"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "FINDSTR.EXE"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*cpassword*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*\\\\sysvol\\\\*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*.xml*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\find.exe'; data_win_eventdata_image matches '*\findstr.exe';
  data_win_eventdata_originalFileName equals 'FIND.EXE', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1552.006/T1552.006.md#atomic-test-1---gpp-passwords-findstr
  - https://attack.mitre.org/techniques/T1552/006/

response:
  message: >
    Findstr GPP Passwords detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1552.006
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1552.006
  custom_tags:
    - findstr
    - passwords
    - process_creation
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ff][Ii][Nn][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ff][Ii][Nn][Dd][Ss][Tt][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ff][Ii][Nn][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ff][Ii][Nn][Dd][Ss][Tt][Rr]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Cc][Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd].*/ AND data_win_eventdata_commandLine:/.*\\[Ss][Yy][Ss][Vv][Oo][Ll]\\.*/ AND data_win_eventdata_commandLine:/.*\.[Xx][Mm][Ll].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 05f3c945-dcc8-4393-9f3d-af65077a8f86
    name: Suspicious SYSVOL Domain Group Policy Access
    reason: 'Direct sibling: SYSVOL policy folders being searched or read is how cpassword files are found.'
  - id: 0130a0df-83a1-4647-9011-841e950ff302
    name: Windows PowerSploit GPP Discovery
    reason: PowerShell variant (Get-GPPPassword) of the same GPP credential harvesting.
  - id: 855bc8b5-2ae8-402e-a9ed-b889e6df1900
    name: Copy From Or To Admin Share Or Sysvol Folder
    reason: Policy XML files may be copied out of SYSVOL for offline decryption.
  - id: ccb5742c-c248-4982-8c5c-5571b9275ad3
    name: Recon Command Output Piped To Findstr.EXE
    reason: Findstr-based recon on the same host usually precedes the credential hunt.
  - id: 4fe074b4-b833-4081-8f24-7dcfeca72b42
    name: Security Tools Keyword Lookup Via Findstr.EXE
    reason: 'Same operator tradecraft: findstr used for discovery during the hands-on-keyboard phase.'
  - id: da63bc76-61ae-11eb-ae93-0242ac130002
    name: Ntdsutil Export NTDS
    reason: If GPP passwords are not found or insufficient, attackers pivot to bulk domain credential theft.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Findstr/find activity against network shares
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*\\(findstr|find)\.exe/ AND data_win_eventdata_commandLine:/.*\\\\.*/
    pivot_on: host
    window: 6h
  - name: GPP and SYSVOL file hunting
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*[Gg]roups\.xml.*/ OR data_win_eventdata_commandLine:/.*[Ss]cheduled[Tt]asks\.xml.*/ OR data_win_eventdata_commandLine:/.*[Dd]ata[Ss]ources\.xml.*/ OR data_win_eventdata_commandLine:/.*[Gg]pp-?[Dd]ecrypt.*/ OR data_win_eventdata_commandLine:/.*[Gg]et-[Gg][Pp][Pp][Pp]assword.*/)
    pivot_on: host
    window: 6h
  - name: Domain reconnaissance commands
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*nltest.* \/dclist.*/ OR data_win_eventdata_commandLine:/.*net1?(\.exe)? +group.*domain.*/ OR data_win_eventdata_commandLine:/.*[Aa]d[Ff]ind.*/ OR data_win_eventdata_commandLine:/.*[Ss]harp[Hh]ound.*/)
    pivot_on: host
    window: 6h
  - name: Alternate credential access tools
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*[Mm]imikatz.*/ OR data_win_eventdata_commandLine:/.*sekurlsa.*/ OR data_win_eventdata_commandLine:/.*[Ll]a[Zz]agne.*/ OR data_win_eventdata_commandLine:/.*[Rr]ubeus.*/)
    pivot_on: host
    window: 6h
