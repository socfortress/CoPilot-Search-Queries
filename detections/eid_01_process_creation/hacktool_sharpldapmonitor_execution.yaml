name: HackTool - SharpLDAPmonitor Execution
id: 9f8fc146-1d1a-4dbf-b8fd-dfae15e08541
version: 1
schema_version: "1.0"
date: "2023-02-14"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 9f8fc146-1d1a-4dbf-b8fd-dfae15e08541
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of the SharpLDAPmonitor. Which can monitor the creation,
  deletion and changes to LDAP objects.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\SharpLDAPmonitor.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "SharpLDAPmonitor.exe"
                    case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*/user:*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*/pass:*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*/dcip:*"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\SharpLDAPmonitor.exe'; data_win_eventdata_originalFileName equals
  'SharpLDAPmonitor.exe'; data_win_eventdata_commandLine matches '*/user:*',
  among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/p0dalirius/LDAPmonitor

response:
  message: >
    HackTool - SharpLDAPmonitor Execution detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  custom_tags:
    - hacktool
    - sharpldapmonitor
    - process_creation
    - sysmon
    - discovery
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ss][Hh][Aa][Rr][Pp][Ll][Dd][Aa][Pp][Mm][Oo][Nn][Ii][Tt][Oo][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ss][Hh][Aa][Rr][Pp][Ll][Dd][Aa][Pp][Mm][Oo][Nn][Ii][Tt][Oo][Rr]\.[Ee][Xx][Ee]/ OR (data_win_eventdata_commandLine:/.*\/[Uu][Ss][Ee][Rr]:.*/ AND data_win_eventdata_commandLine:/.*\/[Pp][Aa][Ss][Ss]:.*/ AND data_win_eventdata_commandLine:/.*\/[Dd][Cc][Ii][Pp]:.*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: f376c8a7-a2d0-4ddc-aa0c-16c17236d962
    name: HackTool - Bloodhound/Sharphound Execution
    reason: BloodHound/SharpHound collection is the bulk AD enumeration that commonly runs on the same foothold as LDAP monitoring.
  - id: dd04b29a-beed-11eb-87bc-acde48001122
    name: Detect SharpHound Usage
    reason: SharpHound usage points to the same Active Directory mapping phase.
  - id: 455b9d50-15a1-4b99-853f-8d37655a4c1b
    name: PUA - Suspicious ActiveDirectory Enumeration Via AdFind.EXE
    reason: AdFind LDAP enumeration is a close peer used to learn the objects SharpLDAPmonitor then watches for changes.
  - id: d9367cbb-c2e0-47ce-bdc0-128cb6da898d
    name: HackTool - SharpLdapWhoami Execution
    reason: SharpLdapWhoami is from the same SharpLDAP toolset; operators test LDAP auth and identity before monitoring.
  - id: 41243735-89a7-4c83-bcdd-570aa78f00a1
    name: Domain Controller Discovery with Nltest
    reason: Nltest DC discovery locates the controller whose address goes into /dcip:.
  - id: 17d619c1-e020-4347-957e-1d1207455c93
    name: Active Directory Replication from Non Machine Account
    reason: Monitoring AD for changes often precedes or accompanies replication abuse (DCSync) from a non-DC.
  - id: 35ba1d85-724d-42a3-889f-2e2362bcaf23
    name: AD Privileged Users or Groups Reconnaissance
    reason: Privileged group/user reconnaissance in the Security log is the domain-side view of the same LDAP queries.
  - id: 1eeed653-dbc8-4187-ad0c-eeebb20e6599
    name: Potential SPN Enumeration Via Setspn.EXE
    reason: SPN enumeration is another LDAP-based recon step run from the same foothold ahead of Kerberoasting.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: LDAP and Global Catalog connections from endpoint processes
    query: data_win_system_eventID:"3" AND data_win_eventdata_destinationPort:("389" OR "636" OR "3268" OR "3269") AND NOT data_win_eventdata_image:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Active Directory enumeration tooling
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Aa][Dd][Ff][Ii][Nn][Dd]|[Ss][Hh][Aa][Rr][Pp][Hh][Oo][Uu][Nn][Dd]|[Dd][Ss][Qq][Uu][Ee][Rr][Yy]|[Nn][Ll][Tt][Ee][Ss][Tt])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*(-[Cc][Oo][Ll][Ll][Ee][Cc][Tt][Ii][Oo][Nn][Mm][Ee][Tt][Hh][Oo][Dd]|[Dd][Oo][Mm][Aa][Ii][Nn]_[Tt][Rr][Uu][Ss][Tt][Ss]|[Dd][Cc][Ll][Ii][Ss][Tt]).*/)
    pivot_on: host
    window: 6h
  - name: Other Sharp* offensive tools executed
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ss][Hh][Aa][Rr][Pp][A-Za-z0-9_-]+\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ss][Hh][Aa][Rr][Pp][A-Za-z0-9_-]+\.[Ee][Xx][Ee]/)
    pivot_on: host
    window: 6h
  - name: Directory replication rights used by non-DC accounts
    query: data_win_system_eventID:"4662" AND data_win_eventdata_properties:/.*1131f6a[ad]-9c07-11d1-f79f-00c04fc2dcd2.*/
    pivot_on: user
    window: 6h
  - name: 'Explicit credential logons matching /user: /pass: use'
    query: data_win_system_eventID:"4648"
    pivot_on: user
    window: 4h
