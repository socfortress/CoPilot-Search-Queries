name: Bypass UAC via WSReset.exe
id: d797268e-28a9-49a7-b9a8-2f5039011c5c
version: 1
schema_version: "1.0"
date: "2022-05-13"
author: E.M. Anhaus (originally from Atomic Blue Detections, Tony Lambert), oscd.community, Florian Roth
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: d797268e-28a9-49a7-b9a8-2f5039011c5c
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects use of WSReset.exe to bypass User Account Control (UAC). Adversaries
  use this technique to execute privileged processes. MITRE ATT&CK: T1548.002.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_parentImage:
              value: "*\\\\wsreset.exe"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_image"
        - exists:
            field: "data_win_eventdata_originalFileName"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\conhost.exe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_originalFileName:
                          value: "CONHOST.EXE"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\wsreset.exe'; data_win_eventdata_image matches '*\conhost.exe';
  data_win_eventdata_originalFileName equals 'CONHOST.EXE'.

known_false_positives: >
  Unknown sub processes of Wsreset.exe. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://eqllib.readthedocs.io/en/latest/analytics/532b5ed4-7930-11e9-8f5c-d46d6d62a49e.html
  - https://lolbas-project.github.io/lolbas/Binaries/Wsreset/
  - https://www.activecyber.us/activelabs/windows-uac-bypass
  - https://twitter.com/ReaQta/status/1222548288731217921
  - https://attack.mitre.org/techniques/T1548/002/

response:
  message: >
    Bypass UAC via WSReset.exe detected on host $agent_name$. Matched
    data_win_eventdata_parentImage: $data_win_eventdata_parentImage$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1548.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1548.002
  custom_tags:
    - bypass
    - wsreset
    - process_creation
    - sysmon
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ww][Ss][Rr][Ee][Ss][Ee][Tt]\.[Ee][Xx][Ee]/ AND _exists_:data_win_eventdata_image AND _exists_:data_win_eventdata_originalFileName AND NOT (data_win_eventdata_image:/.*\\[Cc][Oo][Nn][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Cc][Oo][Nn][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 89a9a0e0-f61a-42e5-8957-b1479565a658
    name: UAC Bypass WSReset
    reason: Registry-side view of the same WSReset hijack (AppX shell\open\command); the precursor write.
  - id: 40f9af16-589d-4984-b78d-8c2aec023197
    name: Potential UAC Bypass Via Sdclt.EXE
    reason: Sdclt uses the same HKCU command-hijack of an auto-elevated binary; frequently tried alongside.
  - id: d38d2fa4-98e6-4a24-aff1-410b0c9ad177
    name: HackTool - UACMe Akagi Execution
    reason: UACMe includes the WSReset method and cycles through bypasses.
  - id: 7f741dcf-fc22-4759-87b4-9ae8376676a2
    name: Bypass UAC via Fodhelper.exe
    reason: Sibling HKCU-hijack bypass; if WSReset fails operators fall back to fodhelper.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: WSReset AppX command hijack registry write
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*[Aa]pp[Xx]82a6gwre4fdg3bt635tn5ctqjf8msdd2.*[Cc]ommand.*/
    pivot_on: host
    window: 1h
  - name: Any child of wsreset
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Ww][Ss][Rr]eset\.exe/
    pivot_on: host
    window: 1h
  - name: Payload staging in user-writable paths
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*[Uu]sers.[Pp]ublic.*/ OR data_win_eventdata_image:/.*[Aa]pp[Dd]ata.[Ll]ocal.[Tt]emp.*/ OR data_win_eventdata_image:/.*[Pp]erf[Ll]ogs.*/)
    pivot_on: host
    window: 2h
  - name: Persistence via Run keys or scheduled tasks
    query: (data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*CurrentVersion.[Rr]un.*/) OR (data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Ss]ch[Tt]asks\.exe/ AND data_win_eventdata_commandLine:/.*\/[Cc]reate.*/)
    pivot_on: host
    window: 4h
