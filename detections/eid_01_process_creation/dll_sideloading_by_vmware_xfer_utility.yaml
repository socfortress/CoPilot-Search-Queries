name: DLL Sideloading by VMware Xfer Utility
id: ebea773c-a8f1-42ad-a856-00cb221966e8
version: 1
schema_version: "1.0"
date: "2022-08-02"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: ebea773c-a8f1-42ad-a856-00cb221966e8
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of VMware Xfer utility (VMwareXferlogs.exe) from the
  non-default directory which may be an attempt to sideload arbitrary DLL. MITRE
  ATT&CK: T1574.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\VMwareXferlogs.exe"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_image:
                    value: "C:\\\\Program Files\\\\VMware\\\\*"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\VMwareXferlogs.exe'; data_win_eventdata_image matches 'C:\Program
  Files\VMware\*'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.sentinelone.com/labs/lockbit-ransomware-side-loads-cobalt-strike-beacon-with-legitimate-vmware-utility/
  - https://attack.mitre.org/techniques/T1574/001/

response:
  message: >
    DLL Sideloading by VMware Xfer Utility detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1574.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.001
  custom_tags:
    - sideloading
    - vmware
    - utility
    - process_creation
    - sysmon
    - privilege_escalation
    - persistence
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Vv][Mm][Ww][Aa][Rr][Ee][Xx][Ff][Ee][Rr][Ll][Oo][Gg][Ss]\.[Ee][Xx][Ee]/ AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Vv][Mm][Ww][Aa][Rr][Ee]\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 799a5f48-0ac1-4e0f-9152-71d137d48c2a
    name: Abusable DLL Potential Sideloading From Suspicious Location
    reason: Image-load view of abusable signed binaries running with DLLs from odd paths; direct corroboration of the sideload.
  - id: 7002aa10-b8d4-47ae-b5ba-51ab07e228b9
    name: Potential Mpclient.DLL Sideloading Via Defender Binaries
    reason: 'Same technique class: legit signed vendor binary copied to a staging dir to load a rogue DLL.'
  - id: e173ad47-4388-4012-ae62-bd13f71c18a8
    name: Potential DLL Sideloading Via DeviceEnroller.EXE
    reason: Another signed Windows binary sideload; actors often chain several sideload carriers.
  - id: 24007168-a26b-4049-90d0-ce138e13a5cf
    name: Lazarus APT DLL Sideloading Activity
    reason: Lazarus sideloading via image-load; shows the follow-on actor tradecraft pattern.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: DLLs loaded by VMwareXferlogs outside Windows/Program Files
    query: data_win_system_eventID:7 AND data_win_eventdata_image:/.*[Vv][Mm]ware[Xx]ferlogs\.exe/ AND NOT data_win_eventdata_imageLoaded:/.*([Ww]indows|[Pp]rogram [Ff]iles).*/
    pivot_on: host
    window: 2h
  - name: Files dropped in user-writable dirs alongside the VMware binary
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*([Vv][Mm]ware[Xx]ferlogs\.exe|\.dll)/ AND data_win_eventdata_targetFilename:/.*([Tt]emp|[Pp]rogramData|[Uu]sers|[Pp]ublic).*/
    pivot_on: host
    window: 4h
  - name: Network connections by VMwareXferlogs
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*[Vv][Mm]ware[Xx]ferlogs\.exe/
    pivot_on: host
    window: 2h
  - name: Persistence for the staged binary via Run key or scheduled task
    query: (data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*CurrentVersion.Run.*/ AND data_win_eventdata_details:/.*[Vv][Mm]ware[Xx]ferlogs.*/) OR (data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*schtasks.*[Vv][Mm]ware[Xx]ferlogs.*/)
    pivot_on: host
    window: 6h
