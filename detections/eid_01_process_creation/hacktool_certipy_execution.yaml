name: HackTool - Certipy Execution
id: 6938366d-8954-4ddc-baff-c830b3ba8fcd
version: 1
schema_version: "1.0"
date: "2024-10-08"
author: pH-T (Nextron Systems), Sittikorn Sangrattanapitak
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 6938366d-8954-4ddc-baff-c830b3ba8fcd
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects Certipy execution, a tool for Active Directory Certificate Services
  enumeration and abuse based on PE metadata characteristics and common command
  line arguments. MITRE ATT&CK: T1649.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\Certipy.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "Certipy.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_description:
                    value: "*Certipy*"
                    case_insensitive: true
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* account *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* auth *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* cert *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* find *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* forge *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* ptt *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* relay *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* req *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* shadow *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* template *"
                                case_insensitive: true
                        minimum_should_match: 1
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* -bloodhound*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* -ca-pfx *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* -dc-ip *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* -kirbi*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* -old-bloodhound*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* -pfx *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* -target*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* -template*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* -username *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* -vulnerable*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*auth -pfx*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*shadow auto*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*shadow list*"
                                case_insensitive: true
                        minimum_should_match: 1
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_description
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\Certipy.exe'; data_win_eventdata_originalFileName equals 'Certipy.exe';
  data_win_eventdata_description matches '*Certipy*', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/ly4k/Certipy
  - https://research.ifcr.dk/certipy-4-0-esc9-esc10-bloodhound-gui-new-authentication-and-request-methods-and-more-7237d88061f7
  - https://attack.mitre.org/techniques/T1649/

response:
  message: >
    HackTool - Certipy Execution detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1649
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1649
  custom_tags:
    - hacktool
    - certipy
    - process_creation
    - sysmon
    - discovery
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Cc][Ee][Rr][Tt][Ii][Pp][Yy]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Cc][Ee][Rr][Tt][Ii][Pp][Yy]\.[Ee][Xx][Ee]/ OR data_win_eventdata_description:/.*[Cc][Ee][Rr][Tt][Ii][Pp][Yy].*/ OR ((data_win_eventdata_commandLine:/.* [Aa][Cc][Cc][Oo][Uu][Nn][Tt] .*/ OR data_win_eventdata_commandLine:/.* [Aa][Uu][Tt][Hh] .*/ OR data_win_eventdata_commandLine:/.* [Cc][Ee][Rr][Tt] .*/ OR data_win_eventdata_commandLine:/.* [Ff][Ii][Nn][Dd] .*/ OR data_win_eventdata_commandLine:/.* [Ff][Oo][Rr][Gg][Ee] .*/ OR data_win_eventdata_commandLine:/.* [Pp][Tt][Tt] .*/ OR data_win_eventdata_commandLine:/.* [Rr][Ee][Ll][Aa][Yy] .*/ OR data_win_eventdata_commandLine:/.* [Rr][Ee][Qq] .*/ OR data_win_eventdata_commandLine:/.* [Ss][Hh][Aa][Dd][Oo][Ww] .*/ OR data_win_eventdata_commandLine:/.* [Tt][Ee][Mm][Pp][Ll][Aa][Tt][Ee] .*/) AND (data_win_eventdata_commandLine:/.* -[Bb][Ll][Oo][Oo][Dd][Hh][Oo][Uu][Nn][Dd].*/ OR data_win_eventdata_commandLine:/.* -[Cc][Aa]-[Pp][Ff][Xx] .*/ OR data_win_eventdata_commandLine:/.* -[Dd][Cc]-[Ii][Pp] .*/ OR data_win_eventdata_commandLine:/.* -[Kk][Ii][Rr][Bb][Ii].*/ OR data_win_eventdata_commandLine:/.* -[Oo][Ll][Dd]-[Bb][Ll][Oo][Oo][Dd][Hh][Oo][Uu][Nn][Dd].*/ OR data_win_eventdata_commandLine:/.* -[Pp][Ff][Xx] .*/ OR data_win_eventdata_commandLine:/.* -[Tt][Aa][Rr][Gg][Ee][Tt].*/ OR data_win_eventdata_commandLine:/.* -[Tt][Ee][Mm][Pp][Ll][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.* -[Uu][Ss][Ee][Rr][Nn][Aa][Mm][Ee] .*/ OR data_win_eventdata_commandLine:/.* -[Vv][Uu][Ll][Nn][Ee][Rr][Aa][Bb][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Aa][Uu][Tt][Hh] -[Pp][Ff][Xx].*/ OR data_win_eventdata_commandLine:/.*[Ss][Hh][Aa][Dd][Oo][Ww] [Aa][Uu][Tt][Oo].*/ OR data_win_eventdata_commandLine:/.*[Ss][Hh][Aa][Dd][Oo][Ww] [Ll][Ii][Ss][Tt].*/)))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 762f2482-ff21-4970-8939-0aa317a886bb
    name: HackTool - Certify Execution
    reason: Windows counterpart for AD CS enumeration; both may be used in one intrusion.
  - id: cd8c163e-a19b-402e-bdd5-419ff5859f12
    name: HackTool - ADCSPwn Execution
    reason: Relay-to-ADCS (ESC8) path that Certipy relay also implements.
  - id: 5589ab4f-a767-433c-961d-c91f3f704db1
    name: Potential SMB Relay Attack Tool Execution
    reason: Certipy relay mode needs relayed NTLM auth; relay tooling is the feeder.
  - id: 4627c6ae-6899-46e2-aa0c-6ebcb1becd19
    name: HackTool - Impacket Tools Execution
    reason: Certipy is Impacket-based and typically used alongside Impacket tools.
  - id: 7ec2c172-dceb-4c10-92c9-87c1881b7e18
    name: HackTool - Rubeus Execution
    reason: 'Follow-on: certificate-to-TGT conversion and ticket abuse.'
  - id: f376c8a7-a2d0-4ddc-aa0c-16c17236d962
    name: HackTool - Bloodhound/Sharphound Execution
    reason: Parallel AD recon feeding the same escalation path.
  - id: 3ffd6f51-e6c1-47b7-94b4-c1e61d4117c5
    name: Certificate Exported Via Certutil.EXE
    reason: 'Follow-on: certificate export for reuse.'
  - id: 42a993dd-bb3e-48c8-b372-4d6684c4106c
    name: HackTool - CrackMapExec Execution
    reason: Common companion for lateral movement with the obtained hash/ticket.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Certipy subcommands on command line
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Cc]ertipy.* (find|req|auth|shadow|relay|template|ca|forge|account|cert) .*/
    pivot_on: host
    window: 6h
  - name: PFX or ccache files written
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\.[Pp][Ff][Xx]/ OR data_win_eventdata_targetFilename:/.*\.[Cc][Cc][Aa][Cc][Hh][Ee]/ OR data_win_eventdata_targetFilename:/.*_[Cc]ertipy\.(zip|txt|json)/)
    pivot_on: host
    window: 6h
  - name: Python runtime launching Certipy
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Pp]ython.*/ AND data_win_eventdata_commandLine:/.*[Cc]ertipy.*/
    pivot_on: host
    window: 6h
  - name: AD CS issuance events on CA
    query: data_win_system_eventID:(4886 OR 4887)
    pivot_on: user
    window: 6h
  - name: Tool connections to LDAP, RPC and SMB
    query: data_win_system_eventID:"3" AND (data_win_eventdata_destinationPort:"389" OR data_win_eventdata_destinationPort:"636" OR data_win_eventdata_destinationPort:"135" OR data_win_eventdata_destinationPort:"445") AND data_win_eventdata_image:/.*[Cc]ertipy.*/
    pivot_on: host
    window: 2h
