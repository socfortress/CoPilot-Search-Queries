name: Windows EventLog Recon Activity Using Log Query Utilities
id: windows-eventlog-recon-log-query-utilities-001
version: 1
schema_version: "1.0"
date: "2026-02-23"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  Detects event log reconnaissance using wevtutil qe/query-events, PowerShell 
  Get-WinEvent/Get-EventLog, WMIC ntevent queries, Win32_NTLogEvent, PsLogList, 
  or Eventquery. Adversaries enumerate logs to extract usernames, IP addresses, 
  and session data. Used by Lazarus, APT41, and NetSupport intrusions.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine: "*Get-WinEvent*"
              - wildcard:
                  data_win_eventdata_commandLine: "*Get-EventLog*"
              - wildcard:
                  data_win_eventdata_commandLine: "*wevtutil* qe *"
              - wildcard:
                  data_win_eventdata_commandLine: "*wevtutil*query-events*"
              - wildcard:
                  data_win_eventdata_commandLine: "*ntevent*"
              - wildcard:
                  data_win_eventdata_commandLine: "*Win32_NTLogEvent*"
              - wildcard:
                  data_win_eventdata_commandLine: "*PsLogList*"
              - wildcard:
                  data_win_eventdata_commandLine: "*Eventquery*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-23 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-23 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Windows endpoints with Sysmon 
  installed and configured to log process creation events (EventID 1) with full 
  command-line arguments.

known_false_positives: >
  Administrators and monitoring tools may query event logs for troubleshooting. 
  Filter by known admin accounts and monitoring solutions.

references:
  - https://attack.mitre.org/techniques/T1654/
  - https://thedfirreport.com/2023/10/30/netsupport-intrusion-results-in-domain-compromise/
  - https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-144a

response:
  message: >
    Event log reconnaissance on $agent_name$. 
    Command: $data_win_eventdata_commandLine$. 
    Process: $data_win_eventdata_image$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1654
  risk_score: 36
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 36
  threat_objects: []

tags:
  analytic_story:
    - Windows Discovery Techniques
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1654
  custom_tags:
    - wevtutil
    - eventlog_recon
    - discovery
    - log_query
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*Get-WinEvent.*/ OR data_win_eventdata_commandLine:/.*Get-EventLog.*/ OR data_win_eventdata_commandLine:/.*wevtutil.* qe .*/ OR data_win_eventdata_commandLine:/.*wevtutil.*query-events.*/ OR data_win_eventdata_commandLine:/.*ntevent.*/ OR data_win_eventdata_commandLine:/.*Win32_NTLogEvent.*/ OR data_win_eventdata_commandLine:/.*PsLogList.*/ OR data_win_eventdata_commandLine:/.*Eventquery.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: beaa66d6-aa1b-4e3c-80f5-e0145369bfaf
    name: Potentially Suspicious EventLog Recon Activity Using Log Query Utilities
    reason: Near-identical sibling detection of the same log-mining behaviour; co-fires and confirms intent.
  - id: caf201a9-c2ce-4a26-9c3a-2b9525413711
    name: Potentially Suspicious Call To Win32_NTEventlogFile Class
    reason: 'WMI access to event log files: reading or backing up logs for extraction.'
  - id: 9d7ca793-f6bd-471c-8d0f-11e68b2f0d2f
    name: Computer System Reconnaissance Via Wmic.EXE
    reason: WMIC host recon that normally accompanies log mining in the discovery phase.
  - id: bd8b828d-0dca-48e1-8a63-8a58ecf2644f
    name: Group Membership Reconnaissance Via Whoami.EXE
    reason: Privilege/identity discovery performed alongside harvesting usernames from logs.
  - id: e6313acd-208c-44fc-a0ff-db85d572e90e
    name: Network Reconnaissance Activity
    reason: Logs are mined for IPs and sessions to map the network; network recon follows.
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: Credential access is the usual next step once valid accounts are found in logs.
  - id: 07f8bdc2-c9b3-472a-9817-5a670b872f53
    name: Potential Reconnaissance For Cached Credentials Via Cmdkey.EXE
    reason: Cached credential discovery pairs with account harvesting from logs.
  - id: cc36992a-4671-4f21-a91d-6c2b72a2edf5
    name: Suspicious Eventlog Clearing or Configuration Change Activity
    reason: Operators read logs to see what defenders can see, then clear them.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Log extraction to file or staging after querying
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Gg][Ee][Tt]-[Ww][Ii][Nn][Ee][Vv][Ee][Nn][Tt]|[Gg][Ee][Tt]-[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg]|[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll]|[Pp][Ss][Ll][Oo][Gg][Ll][Ii][Ss][Tt]|[Ee][Vv][Ee][Nn][Tt][Qq][Uu][Ee][Rr][Yy]).*/ AND data_win_eventdata_commandLine:/.*([Ee][Xx][Pp][Oo][Rr][Tt]-[Cc][Ss][Vv]|[Oo][Uu][Tt]-[Ff][Ii][Ll][Ee]|>|[Ss][Ee][Tt]-[Cc][Oo][Nn][Tt][Ee][Nn][Tt]|[Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]-[Aa][Rr][Cc][Hh][Ii][Vv][Ee]|\ [Ee][Pp][Ll]\ ).*/
    pivot_on: host
    window: 2h
  - name: Account and host discovery commands near the log query
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Nn][Ee][Tt]\ [Uu][Ss][Ee][Rr]|[Nn][Ee][Tt]\ [Gg][Rr][Oo][Uu][Pp]|[Nn][Ee][Tt]\ [Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp]|[Ww][Hh][Oo][Aa][Mm][Ii]\ \/[Aa][Ll][Ll]|[Nn][Ll][Tt][Ee][Ss][Tt]|[Qq][Uu][Ss][Ee][Rr]|[Qq][Ww][Ii][Nn][Ss][Tt][Aa]|[Aa][Rr][Pp]\ -[Aa]|[Ii][Pp][Cc][Oo][Nn][Ff][Ii][Gg]\ \/[Aa][Ll][Ll]|[Ss][Yy][Ss][Tt][Ee][Mm][Ii][Nn][Ff][Oo]).*/
    pivot_on: host
    window: 1h
  - name: Remote WMI/PowerShell log queries to other hosts
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Nn][Tt][Ee][Vv][Ee][Nn][Tt]|[Ww][Ii][Nn]32_[Nn][Tt][Ll][Oo][Gg][Ee][Vv][Ee][Nn][Tt]|[Gg][Ee][Tt]-[Ww][Ii][Nn][Ee][Vv][Ee][Nn][Tt]|[Gg][Ee][Tt]-[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg]).*/ AND data_win_eventdata_commandLine:/.*(-[Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr][Nn][Aa][Mm][Ee]|\/[Nn][Oo][Dd][Ee]:|-[Cc][Ii][Mm][Ss][Ee][Ss][Ss][Ii][Oo][Nn]|[Ii][Nn][Vv][Oo][Kk][Ee]-[Cc][Oo][Mm][Mm][Aa][Nn][Dd]).*/
    pivot_on: host
    window: 2h
  - name: Credential access tooling following log recon
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa]|[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll]|[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp]|[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]|[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll]|[Ss][Aa][Vv][Ee]\ [Hh][Kk][Ll][Mm]\\[Ss][Aa][Mm]|[Ss][Aa][Vv][Ee]\ [Hh][Kk][Ll][Mm]\\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]).*/
    pivot_on: host
    window: 4h
  - name: Event log clearing after reading logs
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee])/ AND data_win_eventdata_commandLine:/.*(\ [Cc][Ll]\ |[Cc][Ll][Ee][Aa][Rr]-[Ll][Oo][Gg]).*/) OR data_win_system_eventID:"1102"
    pivot_on: host
    window: 4h
