name: Firewall Disabled via Netsh.EXE
id: 57c4bf16-227f-4394-8ec7-1b745ee061c3
version: 1
schema_version: "1.0"
date: "2023-02-13"
author: Fatih Sirin
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 57c4bf16-227f-4394-8ec7-1b745ee061c3
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects netsh commands that turns off the Windows firewall. MITRE ATT&CK:
  T1686.003.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\netsh.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "netsh.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*firewall*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*set*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*opmode*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*disable*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*advfirewall*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*set*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*state*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*off*"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\netsh.exe'; data_win_eventdata_originalFileName equals 'netsh.exe';
  data_win_eventdata_commandLine matches '*firewall*', among other conditions.

known_false_positives: >
  Legitimate administration activity. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://www.winhelponline.com/blog/enable-and-disable-windows-firewall-quickly-using-command-line/
  - https://app.any.run/tasks/210244b9-0b6b-4a2c-83a3-04bd3175d017/
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1562.004/T1562.004.md#atomic-test-1---disable-microsoft-defender-firewall
  - https://attack.mitre.org/techniques/T1686/003/

response:
  message: >
    Firewall Disabled via Netsh.EXE detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1686.003
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1686.003
  custom_tags:
    - firewall
    - netsh
    - process_creation
    - sysmon
    - defense_impairment
    - s0108
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Nn][Ee][Tt][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Nn][Ee][Tt][Ss][Hh]\.[Ee][Xx][Ee]/) AND ((data_win_eventdata_commandLine:/.*[Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll].*/ AND data_win_eventdata_commandLine:/.*[Ss][Ee][Tt].*/ AND data_win_eventdata_commandLine:/.*[Oo][Pp][Mm][Oo][Dd][Ee].*/ AND data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee].*/) OR (data_win_eventdata_commandLine:/.*[Aa][Dd][Vv][Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll].*/ AND data_win_eventdata_commandLine:/.*[Ss][Ee][Tt].*/ AND data_win_eventdata_commandLine:/.*[Ss][Tt][Aa][Tt][Ee].*/ AND data_win_eventdata_commandLine:/.*[Oo][Ff][Ff].*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 6860a62c-9203-11eb-9e05-acde48001122
    name: Disabling Firewall with Netsh
    reason: Overlapping detection of firewall disable via netsh; corroborates.
  - id: 9a8f63a8-43ac-11ec-904c-acde48001122
    name: Firewall Allowed Program Enable
    reason: Allow-program rules are the quieter alternative to turning the firewall off.
  - id: cd5cfd80-aa5f-44c0-9c20-108c4ae12e3c
    name: New Firewall Rule Added Via Netsh.EXE
    reason: Attackers add specific rules after or instead of disabling the firewall.
  - id: b28e58e4-2a72-4fae-bdee-0fbe904db642
    name: Windows Defender Real-time Protection Disabled
    reason: Defender real-time protection disabled commonly accompanies firewall disable in defense evasion.
  - id: a7ee1722-c3c5-aeff-3212-c777e4733217
    name: Disable Windows Defender AV Security Monitoring
    reason: Disabling Defender monitoring is the companion defense-evasion step.
  - id: 1444443e-6757-43e4-9ea4-c8fc705f79a2
    name: Boot Configuration Tampering Via Bcdedit.EXE
    reason: Ransomware prep pairs firewall/AV disable with bcdedit recovery tampering.
  - id: dee4af55-1f22-4e1d-a9d2-4bdc7ecb472a
    name: Disabled Volume Snapshots
    reason: Disabling snapshots follows security control disablement in ransomware prep.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Defender and security tool disablement
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(DisableRealtimeMonitoring|Set-MpPreference|Add-MpPreference.*Exclusion|sc.*(stop|config).*(WinDefend|MpsSvc)).*/
    pivot_on: host
    window: 6h
  - name: Shadow copy deletion and recovery tampering
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(vssadmin.*delete|wmic.*shadowcopy.*delete|bcdedit.*(recoveryenabled|bootstatuspolicy)|wbadmin.*delete).*/
    pivot_on: host
    window: 6h
  - name: Firewall profile registry changes
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*SharedAccess\\Parameters\\FirewallPolicy.*EnableFirewall.*/
    pivot_on: host
    window: 6h
  - name: Inbound remote-access ports (RDP/SMB/WinRM)
    query: data_win_system_eventID:3 AND data_win_eventdata_initiated:false AND data_win_eventdata_destinationPort:(3389 OR 445 OR 5985 OR 5986)
    pivot_on: host
    window: 6h
  - name: Remote execution tooling
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(PsExec|wmic.*\/node|Enter-PSSession|winrs).*/
    pivot_on: host
    window: 4h
