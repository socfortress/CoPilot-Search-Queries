name: Suspicious Rundll32 Activity Invoking Sys File
id: 731231b9-0b5d-4219-94dd-abb6959aa7ea
version: 1
schema_version: "1.0"
date: "2022-10-09"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 731231b9-0b5d-4219-94dd-abb6959aa7ea
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious process related to rundll32 based on command line that
  includes a *.sys file as seen being used by UNC2452. MITRE ATT&CK: T1218.011.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*rundll32.exe*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.sys,*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.sys *"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*rundll32.exe*'; data_win_eventdata_commandLine matches '*.sys,*';
  data_win_eventdata_commandLine matches '*.sys *'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.microsoft.com/security/blog/2021/03/04/goldmax-goldfinder-sibot-analyzing-nobelium-malware/
  - https://attack.mitre.org/techniques/T1218/011/

response:
  message: >
    Suspicious Rundll32 Activity Invoking Sys File detected on host
    $agent_name$. Matched data_win_eventdata_commandLine:
    $data_win_eventdata_commandLine$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1218.011
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218.011
  custom_tags:
    - rundll32
    - invoking
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee].*/ AND (data_win_eventdata_commandLine:/.*\.[Ss][Yy][Ss],.*/ OR data_win_eventdata_commandLine:/.*\.[Ss][Yy][Ss] .*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c3a99af4-35a9-4668-879e-c09aeb4f2bdf
    name: Rundll32 Execution With Uncommon DLL Extension
    reason: 'Same masquerading idea: non-.dll payload loaded by rundll32.'
  - id: e593cf51-88db-4ee1-b920-37e89012a3c9
    name: Potentially Suspicious Rundll32 Activity
    reason: Broad rundll32 anomalies that co-occur with the UNC2452 .sys technique.
  - id: 4aa6040b-3f28-44e3-a769-9208e5feb5ec
    name: Suspicious Rundll32 Execution With Image Extension
    reason: Sibling disguise of a DLL with a different extension.
  - id: 2569ed8c-1147-498a-9b8c-2ad3656b10ed
    name: Potential Renamed Rundll32 Execution
    reason: Attacker may rename rundll32 to evade this and related rules.
  - id: 8cde342c-ba48-4b74-b615-172c330f2e93
    name: Suspicious Renamed Comsvcs DLL Loaded By Rundll32
    reason: Follow-on credential dumping via rundll32 and a renamed comsvcs.
  - id: f40017b3-cb2e-4335-ab5d-3babf679c1de
    name: Remote DLL Load Via Rundll32.EXE
    reason: Remote DLL loading often accompanies the staging of the .sys-named payload.
  - id: ae9c6a7c-9521-42a6-915e-5aaa8689d529
    name: CobaltStrike Load by Rundll32
    reason: Typical post-compromise beacon load by rundll32 in the same intrusion set.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Rundll32 loading non-standard extensions
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*[Rr]undll32.*\.(sys|dat|tmp|bin|png|jpg|txt|db).*/
    pivot_on: host
    window: 6h
  - name: Sys file creation in user-writable paths
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\.sys/ AND data_win_eventdata_targetFilename:/.*(Temp|AppData|ProgramData|Public|Users).*/
    pivot_on: host
    window: 6h
  - name: Rundll32 network connections
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*[Rr]undll32\.exe/
    pivot_on: host
    window: 2h
  - name: Rundll32 child processes
    query: data_win_eventdata_parentImage:/.*[Rr]undll32\.exe/ AND data_win_eventdata_image:/.*(cmd|powershell|pwsh|wmic|nltest|net1?|whoami)\.exe/
    pivot_on: host
    window: 2h
  - name: Lsass access attempts
    query: data_win_system_eventID:10 AND data_win_eventdata_targetImage:/.*lsass\.exe/
    pivot_on: host
    window: 4h
