name: File Explorer Folder Opened Using Explorer Folder Shortcut Via Shell
id: c3d76afc-93df-461e-8e67-9b2bad3f2ac4
version: 1
schema_version: "1.0"
date: "2024-08-23"
author: "@Kostastsale"
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: c3d76afc-93df-461e-8e67-9b2bad3f2ac4
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the initial execution of "cmd.exe" which spawns "explorer.exe" with
  the appropriate command line arguments for opening the "My Computer" folder.
  MITRE ATT&CK: T1135.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\cmd.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\powershell.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\pwsh.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\explorer.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*shell:mycomputerfolder*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\cmd.exe'; data_win_eventdata_parentImage matches '*\powershell.exe';
  data_win_eventdata_parentImage matches '*\pwsh.exe', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://ss64.com/nt/shell.html
  - https://attack.mitre.org/techniques/T1135/

response:
  message: >
    File Explorer Folder Opened Using Explorer Folder Shortcut Via Shell
    detected on host $agent_name$. Matched data_win_eventdata_parentImage:
    $data_win_eventdata_parentImage$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1135
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1135
  custom_tags:
    - explorer
    - folder
    - opened
    - process_creation
    - sysmon
    - discovery
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/) AND data_win_eventdata_image:/.*\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Ss][Hh][Ee][Ll][Ll]:[Mm][Yy][Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr][Ff][Oo][Ll][Dd][Ee][Rr].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 534f2ef7-e8a2-4433-816d-c91bccde289b
    name: Explorer NOUACCHECK Flag
    reason: Explorer launched from a shell with unusual flags, similar abuse of explorer.exe as launcher
  - id: 949f1ffb-6e85-4f00-ae1e-c3c5b190d605
    name: Explorer Process Tree Break
    reason: Another explorer.exe spawn trick used to break process lineage
  - id: c248c896-e412-4279-8c15-1c558067b6fa
    name: Enumerate All Information With Whoami.EXE
    reason: Typical hands-on-keyboard discovery done in the same shell session
  - id: 9d7ca793-f6bd-471c-8d0f-11e68b2f0d2f
    name: Computer System Reconnaissance Via Wmic.EXE
    reason: Host reconnaissance commonly run alongside file system browsing from a shell
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Discovery commands
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:*whoami.exe OR data_win_eventdata_image:*systeminfo.exe OR data_win_eventdata_image:*net.exe OR data_win_eventdata_image:*net1.exe OR data_win_eventdata_image:*nltest.exe)
    pivot_on: host
    window: 2h
  - name: Explorer launched by shells
    query: data_win_system_eventID:1 AND data_win_eventdata_image:*explorer.exe AND (data_win_eventdata_parentImage:*cmd.exe OR data_win_eventdata_parentImage:*powershell.exe OR data_win_eventdata_parentImage:*pwsh.exe)
    pivot_on: host
    window: 2h
  - name: Network share and drive enumeration
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*net.*(view|use|share).*/ OR data_win_eventdata_commandLine:/.*[Gg]et-[Ss]mb[Ss]hare.*/ OR data_win_eventdata_commandLine:/.*wmic.*logicaldisk.*/)
    pivot_on: host
    window: 2h
  - name: Basic recon from interactive shells
    query: data_win_system_eventID:1 AND (data_win_eventdata_parentImage:*cmd.exe OR data_win_eventdata_parentImage:*powershell.exe) AND (data_win_eventdata_image:*tasklist.exe OR data_win_eventdata_image:*ipconfig.exe OR data_win_eventdata_image:*tree.com)
    pivot_on: host
    window: 2h
