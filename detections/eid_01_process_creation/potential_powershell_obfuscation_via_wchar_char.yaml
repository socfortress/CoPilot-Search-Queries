name: Potential PowerShell Obfuscation Via WCHAR/CHAR
id: e312efd0-35a1-407f-8439-b8d434b438a6
version: 1
schema_version: "1.0"
date: "2025-03-03"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: e312efd0-35a1-407f-8439-b8d434b438a6
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious encoded character syntax often used for defense evasion.
  MITRE ATT&CK: T1059.001, T1027.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*[char]0x*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*(WCHAR)0x*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*[char]0x*'; data_win_eventdata_commandLine matches '*(WCHAR)0x*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/0gtweet/status/1281103918693482496
  - https://attack.mitre.org/techniques/T1059/001/
  - https://attack.mitre.org/techniques/T1027/

response:
  message: >
    Potential PowerShell Obfuscation Via WCHAR/CHAR detected on host
    $agent_name$. Matched data_win_eventdata_commandLine:
    $data_win_eventdata_commandLine$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1059.001, T1027
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
    - T1027
  custom_tags:
    - powershell
    - obfuscation
    - wchar
    - process_creation
    - sysmon
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*\[[Cc][Hh][Aa][Rr]\]0[Xx].*/ OR data_win_eventdata_commandLine:/.*\([Ww][Cc][Hh][Aa][Rr]\)0[Xx].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b6b49cd1-34d6-4ead-b1bf-176e9edba9a4
    name: Potential PowerShell Obfuscation Via Reversed Commands
    reason: Sibling string-hiding technique; both together imply a purpose-built obfuscated loader.
  - id: d7bcd677-645d-4691-a8d4-7a5602b780d1
    name: Potential PowerShell Command Line Obfuscation
    reason: Command-line obfuscation (ticks, concatenation) is frequently layered with [char] builds.
  - id: 8d01b53f-456f-48ee-90f6-bc28e67d4e35
    name: Suspicious Obfuscated PowerShell Code
    reason: Generic obfuscation heuristics that corroborate char-code reconstruction.
  - id: e6c54d94-498c-4562-a37c-b469d8e9a275
    name: Suspicious PowerShell Download and Execute Pattern
    reason: Char-built strings typically assemble IEX or DownloadString; the cradle is the next step.
  - id: ca2092a1-c273-4878-9b4b-0d60115bf5ea
    name: Suspicious Encoded PowerShell Command Line
    reason: Alternate payload encoding; both appear in layered loaders.
  - id: 754ed792-634f-40ae-b3bc-e0448d33f695
    name: Suspicious PowerShell Parent Process
    reason: Reveals the delivery vector behind the obfuscated launch.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: PowerShell char-code assembly and invocation
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*\[[Cc]har\].*/ OR /.*-[Jj]oin.*/ OR /.*[Ii]nvoke-[Ee]xpression.*/)
    pivot_on: host
    window: 2h
  - name: Decoded script blocks with web or load primitives
    query: data_win_system_eventID:4104 AND data_win_eventdata_scriptBlockText:(/.*[Dd]ownload[Ss]tring.*/ OR /.*[Nn]et\.[Ww]eb[Cc]lient.*/ OR /.*[Ff]rom[Bb]ase64[Ss]tring.*/ OR /.*[Aa]dd-[Tt]ype.*/)
    pivot_on: host
    window: 2h
  - name: Outbound connections initiated by PowerShell
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND data_win_eventdata_initiated:true
    pivot_on: host
    window: 2h
  - name: LOLBin children spawned by PowerShell
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Pp]ower[Ss]hell.*/ AND data_win_eventdata_image:/.*\\(cmd|rundll32|mshta|certutil|schtasks)\.exe/
    pivot_on: host
    window: 2h
