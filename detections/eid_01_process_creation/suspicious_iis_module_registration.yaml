name: Suspicious IIS Module Registration
id: 043c4b8b-3a54-4780-9682-081cb6b8185c
version: 1
schema_version: "1.0"
date: "2023-01-23"
author: Florian Roth (Nextron Systems), Microsoft (idea)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 043c4b8b-3a54-4780-9682-081cb6b8185c
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a suspicious IIS module registration as described in Microsoft threat
  report on IIS backdoors. MITRE ATT&CK: T1505.004.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_parentImage:
              value: "*\\\\w3wp.exe"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*appcmd.exe add module*"
                    case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* system.enterpriseservices.internal.publish*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\powershell.exe"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*gacutil*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* /I*"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\w3wp.exe'; data_win_eventdata_commandLine matches '*appcmd.exe add
  module*'; data_win_eventdata_commandLine matches '*
  system.enterpriseservices.internal.publish*', among other conditions.

known_false_positives: >
  Administrative activity. Baseline expected activity in your environment and
  tune this detection before relying on it for automated response.

references:
  - https://www.microsoft.com/security/blog/2022/07/26/malicious-iis-extensions-quietly-open-persistent-backdoors-into-servers/
  - https://attack.mitre.org/techniques/T1505/004/

response:
  message: >
    Suspicious IIS Module Registration detected on host $agent_name$. Matched
    data_win_eventdata_parentImage: $data_win_eventdata_parentImage$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1505.004
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1505.004
  custom_tags:
    - module
    - registration
    - process_creation
    - sysmon
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ww]3[Ww][Pp]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*[Aa][Pp][Pp][Cc][Mm][Dd]\.[Ee][Xx][Ee] [Aa][Dd][Dd] [Mm][Oo][Dd][Uu][Ll][Ee].*/ OR (data_win_eventdata_commandLine:/.* [Ss][Yy][Ss][Tt][Ee][Mm]\.[Ee][Nn][Tt][Ee][Rr][Pp][Rr][Ii][Ss][Ee][Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\.[Ii][Nn][Tt][Ee][Rr][Nn][Aa][Ll]\.[Pp][Uu][Bb][Ll][Ii][Ss][Hh].*/ AND data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/) OR (data_win_eventdata_commandLine:/.*[Gg][Aa][Cc][Uu][Tt][Ii][Ll].*/ AND data_win_eventdata_commandLine:/.* \/[Ii].*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 9465ddf4-f9e4-4ebd-8d98-702df3a93239
    name: IIS Native-Code Module Command Line Installation
    reason: Same backdoor mechanism via a different installer syntax (appcmd install module); attackers often try both when registering a malicious native IIS module.
  - id: windows-iis-components-add-new-module-001
    name: Windows IIS Components Add New Module
    reason: Parallel detection of an IIS module being added; confirms the registration took effect rather than merely being attempted.
  - id: e4ed6030-ffe5-4e6a-8a8a-ab3c1ab9d94e
    name: Disable Windows IIS HTTP Logging
    reason: IIS backdoor operators disable HTTP logging right after installing the module to hide C2 traffic.
  - id: 0649be4a-aeb0-45b0-b89e-7f1668f6d9c0
    name: IIS WebServer Log Deletion via CommandLine Utilities
    reason: Log wiping on the same IIS host after module install is the standard anti-forensic follow-on.
  - id: bed2a484-9348-4143-8a8a-b801c979301c
    name: Webshell Detection With Command Line Keywords
    reason: The w3wp.exe parent that ran appcmd/gacutil implies code execution via a webshell, the usual precursor to module registration.
  - id: 4ebc877f-4612-45cb-b3a5-8e3834db36c9
    name: Webshell Hacking Activity Patterns
    reason: Recon and hands-on-keyboard commands spawned from the web server process before the backdoor was planted.
  - id: 2d3cdeec-c0db-45b4-aa86-082f7eb75701
    name: Microsoft IIS Service Account Password Dumped
    reason: Credential theft from IIS config is a common next step once an attacker controls the web server.
  - id: 97dbf6e2-e436-44d8-abee-4261b24d3e41
    name: Microsoft IIS Connection Strings Decryption
    reason: Decrypting web.config connection strings to pivot to backend databases follows IIS compromise.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Processes spawned by the IIS worker process
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ww]3[Ww][Pp]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 6h
  - name: appcmd / IIS module management commands
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Cc][Mm][Dd]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*([Mm][Oo][Dd][Uu][Ll][Ee]|[Ii][Nn][Ss][Tt][Aa][Ll][Ll]|[Ll][Oo][Gg]).*/
    pivot_on: host
    window: 6h
  - name: DLL and ASPX files written under inetsrv, wwwroot or GAC
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*([Ii][Nn][Ee][Tt][Ss][Rr][Vv]|[Ww][Ww][Ww][Rr][Oo][Oo][Tt]|[Aa][Ss][Ss][Ee][Mm][Bb][Ll][Yy]\\[Gg][Aa][Cc]|[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\.[Nn][Ee][Tt]).*\.([Dd][Ll][Ll]|[Aa][Ss][Pp][Xx]|[Aa][Ss][Hh][Xx])/
    pivot_on: host
    window: 6h
  - name: Recon and shell commands run by the web server
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ww]3[Ww][Pp]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*([Ww][Hh][Oo][Aa][Mm][Ii]|[Nn][Ee][Tt] [Uu][Ss][Ee][Rr]|[Ii][Pp][Cc][Oo][Nn][Ff][Ii][Gg]|[Nn][Ee][Tt][Ss][Tt][Aa][Tt]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]).*/
    pivot_on: host
    window: 6h
  - name: IIS logging disabled or logs deleted
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ll][Oo][Gg][Gg][Ii][Nn][Gg]|[Ll][Oo][Gg][Ff][Ii][Ll][Ee]|[Ii][Nn][Ee][Tt][Pp][Uu][Bb]\\[Ll][Oo][Gg][Ss]).*/ AND (data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Dd][Ee][Ll] |[Rr][Mm] |[Rr][Ee][Mm][Oo][Vv][Ee]-[Ii][Tt][Ee][Mm]).*/)
    pivot_on: host
    window: 6h
