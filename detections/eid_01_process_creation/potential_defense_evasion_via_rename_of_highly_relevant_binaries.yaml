parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_description equals
  'Execute processes remotely'; data_win_eventdata_product equals 'Sysinternals
  PsExec'; data_win_eventdata_description matches 'Windows PowerShell*', among
  other conditions.

known_false_positives: >
  Custom applications use renamed binaries adding slight change to binary name.
  Typically this is easy to spot and add to whitelist. PsExec installed via
  Windows Store doesn't contain original filename field (False negative).
  Baseline expected activity in your environment and tune this detection before
  relying on it for automated response.

