response:
  message: >
    Potential Defense Evasion Via Rename Of Highly Relevant Binaries detected on
    host $agent_name$. Matched data_win_eventdata_description:
    $data_win_eventdata_description$. Matched data_win_eventdata_product:
    $data_win_eventdata_product$. MITRE ATT&CK: T1036.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_description
      type: other
    - field: data_win_eventdata_product
      type: other

