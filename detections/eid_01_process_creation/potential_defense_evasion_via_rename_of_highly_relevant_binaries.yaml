version: 1
schema_version: "1.0"
date: "2026-06-29"
author: Matthew Green - @mgreen27, Florian Roth (Nextron Systems), frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 0ba1da6d-b6ce-4366-828c-18826c9de23e
  commit: release-20260810
  license: DRL-1.1
