status: experimental
type: TTP

description: >
  Detects the execution of a renamed binary often used by attackers or malware
  leveraging new Sysmon OriginalFileName datapoint. MITRE ATT&CK: T1036.003.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - term:
                  data_win_eventdata_description:
                    value: "Execute processes remotely"
                    case_insensitive: true
              - term:
                  data_win_eventdata_product:
                    value: "Sysinternals PsExec"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_description:
                    value: "Windows PowerShell*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_description:
                    value: "pwsh*"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "certutil.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "cmstp.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "cscript.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "IE4UINIT.EXE"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "finger.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "mshta.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "msiexec.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "msxsl.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "powershell_ise.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "powershell.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "psexec.c"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "psexec.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "psexesvc.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "pwsh.dll"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "reg.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "regsvr32.exe"
                    case_insensitive: true
              - term:
