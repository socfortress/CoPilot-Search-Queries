name: Certificate Exported Via Certutil.EXE
id: 3ffd6f51-e6c1-47b7-94b4-c1e61d4117c5
version: 1
schema_version: "1.0"
date: "2024-03-05"
author: Florian Roth (Nextron Systems), Jonhnathan Ribeiro, oscd.community, Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 3ffd6f51-e6c1-47b7-94b4-c1e61d4117c5
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of the certutil with the "exportPFX" flag which allows
  the utility to export certificates. MITRE ATT&CK: T1027.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\certutil.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "CertUtil.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-exportPFX *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*/exportPFX *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*–exportPFX *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*—exportPFX *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*―exportPFX *"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\certutil.exe'; data_win_eventdata_originalFileName equals 'CertUtil.exe';
  data_win_eventdata_commandLine matches '*-exportPFX *', among other
  conditions.

known_false_positives: >
  There legitimate reasons to export certificates. Investigate the activity to
  determine if it's benign. Baseline expected activity in your environment and
  tune this detection before relying on it for automated response.

references:
  - https://www.splunk.com/en_us/blog/security/a-golden-saml-journey-solarwinds-continued.html
  - https://attack.mitre.org/techniques/T1027/

response:
  message: >
    Certificate Exported Via Certutil.EXE detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1027
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1027
  custom_tags:
    - certificate
    - exported
    - certutil
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*-[Ee][Xx][Pp][Oo][Rr][Tt][Pp][Ff][Xx] .*/ OR data_win_eventdata_commandLine:/.*\/[Ee][Xx][Pp][Oo][Rr][Tt][Pp][Ff][Xx] .*/ OR data_win_eventdata_commandLine:/.*–[Ee][Xx][Pp][Oo][Rr][Tt][Pp][Ff][Xx] .*/ OR data_win_eventdata_commandLine:/.*—[Ee][Xx][Pp][Oo][Rr][Tt][Pp][Ff][Xx] .*/ OR data_win_eventdata_commandLine:/.*―[Ee][Xx][Pp][Oo][Rr][Tt][Pp][Ff][Xx] .*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 9e716b33-63b2-46da-86a4-bd3c3b9b5dfb
    name: Certificate Exported Via PowerShell
    reason: Same objective (private key theft) via PowerShell cmdlets; actors switch tooling on one host.
  - id: aa7a3fce-bef5-4311-9cc1-5f04bb8c308c
    name: Certificate Exported Via PowerShell - ScriptBlock
    reason: Script-block log of Export-PfxCertificate/Export-Certificate shows a parallel export.
  - id: 213d6a77-3d55-4ce8-ba74-fcfef741974e
    name: Private Keys Reconnaissance Via CommandLine Tools
    reason: Private key file hunting precedes the export (target selection) or follows it.
  - id: 7892ec59-c5bb-496d-8968-e5d210ca3ac4
    name: DPAPI Backup Keys And Certificate Export Activity IOC
    reason: File-creation evidence of DPAPI backup key/certificate export artifacts.
  - id: e62a9f0c-ca1e-46b2-85d5-a6da77f86d1a
    name: File Encoded To Base64 Via Certutil.EXE
    reason: Certutil base64 encoding of the PFX is the usual staging step before exfiltration.
  - id: 762f2482-ff21-4970-8939-0aa317a886bb
    name: HackTool - Certify Execution
    reason: Certify uses AD CS certificates; stolen PFXs are what such tooling consumes.
  - id: 6938366d-8954-4ddc-baff-c830b3ba8fcd
    name: HackTool - Certipy Execution
    reason: Certipy authenticates with stolen certificates/PFX.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Certutil encode/export follow-up
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*(-[Ee][Nn][Cc][Oo][Dd][Ee]|\/[Ee][Nn][Cc][Oo][Dd][Ee]|-[Ee][Xx][Pp][Oo][Rr][Tt][Pp][Ff][Xx]|-[Ss][Tt][Oo][Rr][Ee]|-[Uu][Ss][Ee][Rr]).*/
    pivot_on: host
    window: 4h
  - name: Key and certificate files written
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.([Pp][Ff][Xx]|[Pp]12|[Pp][Ee][Mm]|[Kk][Ee][Yy]|[Cc][Ee][Rr])/
    pivot_on: host
    window: 4h
  - name: Key file reconnaissance
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*(\.[Pp][Ff][Xx]|\.[Pp]12|\.[Pp][Ee][Mm]|[Ii][Dd]_[Rr][Ss][Aa]|[Pp][Rr][Ii][Vv][Aa][Tt][Ee] [Kk][Ee][Yy]).*/
    pivot_on: host
    window: 4h
  - name: Archiving or upload of key material
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]-[Aa][Rr][Cc][Hh][Ii][Vv][Ee]|7[Zz]|[Cc][Uu][Rr][Ll]|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]|[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt]|[Ss][Cc][Pp]).*/ AND data_win_eventdata_commandLine:/.*(\.[Pp][Ff][Xx]|\.[Pp]12|\.[Pp][Ee][Mm]|\.[Bb]64).*/
    pivot_on: host
    window: 6h
  - name: Certificate-based authentication tooling
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Cc][Ee][Rr][Tt][Ii][Pp][Yy]|[Cc][Ee][Rr][Tt][Ii][Ff][Yy]|[Rr][Uu][Bb][Ee][Uu][Ss]|\/[Cc][Ee][Rr][Tt][Ii][Ff][Ii][Cc][Aa][Tt][Ee]|[Pp][Kk][Ii][Nn][Ii][Tt]).*/
    pivot_on: host
    window: 24h
