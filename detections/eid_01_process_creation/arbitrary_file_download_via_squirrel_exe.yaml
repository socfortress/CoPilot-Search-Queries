name: Arbitrary File Download Via Squirrel.EXE
id: 1e75c1cc-c5d4-42aa-ac3d-91b0b68b3b4c
version: 1
schema_version: "1.0"
date: "2023-11-09"
author: Nasreddine Bencherchali (Nextron Systems), Karneades / Markus Neis, Jonhnathan Ribeiro, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 1e75c1cc-c5d4-42aa-ac3d-91b0b68b3b4c
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the usage of the "Squirrel.exe" to download arbitrary files. This
  binary is part of multiple Electron based software installations (Slack,
  Teams, Discord, etc.). MITRE ATT&CK: T1218.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\squirrel.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\update.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* --download *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* --update *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* --updateRollback=*"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*http*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\squirrel.exe'; data_win_eventdata_image matches '*\update.exe';
  data_win_eventdata_commandLine matches '* --download *', among other
  conditions.

known_false_positives: >
  Expected FP with some Electron based applications such as (1Clipboard, Beaker
  Browser, Caret, Discord, GitHub Desktop, etc.). Baseline expected activity in
  your environment and tune this detection before relying on it for automated
  response.

references:
  - https://lolbas-project.github.io/lolbas/OtherMSBinaries/Squirrel/
  - http://www.hexacorn.com/blog/2019/03/30/sqirrel-packages-manager-as-a-lolbin-a-k-a-many-electron-apps-are-lolbins-by-default/
  - http://www.hexacorn.com/blog/2018/08/16/squirrel-as-a-lolbin/
  - https://attack.mitre.org/techniques/T1218/

response:
  message: >
    Arbitrary File Download Via Squirrel.EXE detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1218
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218
  custom_tags:
    - arbitrary
    - download
    - squirrel
    - process_creation
    - sysmon
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ss][Qq][Uu][Ii][Rr][Rr][Ee][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Uu][Pp][Dd][Aa][Tt][Ee]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.* --[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd] .*/ OR data_win_eventdata_commandLine:/.* --[Uu][Pp][Dd][Aa][Tt][Ee] .*/ OR data_win_eventdata_commandLine:/.* --[Uu][Pp][Dd][Aa][Tt][Ee][Rr][Oo][Ll][Ll][Bb][Aa][Cc][Kk]=.*/) AND data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 45239e6a-b035-4aaf-b339-8ad379fcb67e
    name: Process Proxy Execution Via Squirrel.EXE
    reason: Same Squirrel/Update.exe LOLBin abused to launch an arbitrary payload via --processStart; the execution step after the --download staging.
  - id: f26eb764-fd89-464b-85e2-dc4a8e6e77b8
    name: Suspicious Electron Application Child Processes
    reason: Squirrel-based Electron apps spawning shells/LOLBins shows the downloaded payload being run.
  - id: 378a05d8-963c-46c9-bcce-13c7657eac99
    name: Potentially Suspicious Electron Application CommandLine
    reason: Electron app abuse with unusual arguments often accompanies Squirrel misuse for proxy execution.
  - id: 1ac8666b-046f-4201-8aba-1951aaec03a3
    name: Command Line Execution with Suspicious URL and AppData Strings
    reason: Squirrel payloads land under LocalAppData; a command line combining URL and AppData marks the staged payload or its launch.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Squirrel/Update.exe launches on host
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Ss][Qq][Uu][Ii][Rr][Rr][Ee][Ll]\.[Ee][Xx][Ee]|\\[Uu][Pp][Dd][Aa][Tt][Ee]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*\-\-[Pp][Rr][Oo][Cc][Ee][Ss][Ss][Ss][Tt][Aa][Rr][Tt].*/ OR data_win_eventdata_commandLine:/.*\-\-[Pp][Rr][Oo][Cc][Ee][Ss][Ss][Ss][Tt][Aa][Rr][Tt][Aa][Nn][Dd][Ww][Aa][Ii][Tt].*/ OR data_win_eventdata_commandLine:/.*\-\-[Cc][Rr][Ee][Aa][Tt][Ee][Ss][Hh][Oo][Rr][Tt][Cc][Uu][Tt].*/ OR data_win_eventdata_commandLine:/.*\-\-[Ii][Nn][Ss][Tt][Aa][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*\-\-[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd].*/ OR data_win_eventdata_commandLine:/.*\-\-[Uu][Pp][Dd][Aa][Tt][Ee].*/)
    pivot_on: host
    window: 24h
  - name: Executables written under AppData Local by Squirrel
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*(\\[Ss][Qq][Uu][Ii][Rr][Rr][Ee][Ll]\.[Ee][Xx][Ee]|\\[Uu][Pp][Dd][Aa][Tt][Ee]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\.*/)
    pivot_on: host
    window: 2h
  - name: Network connections from Squirrel/Update.exe
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*(\\[Ss][Qq][Uu][Ii][Rr][Rr][Ee][Ll]\.[Ee][Xx][Ee]|\\[Uu][Pp][Dd][Aa][Tt][Ee]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 2h
  - name: DNS lookups by Squirrel/Update.exe
    query: data_win_system_eventID:"22" AND data_win_eventdata_image:/.*(\\[Ss][Qq][Uu][Ii][Rr][Rr][Ee][Ll]\.[Ee][Xx][Ee]|\\[Uu][Pp][Dd][Aa][Tt][Ee]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 2h
  - name: Shells or LOLBins spawned from Squirrel/Update.exe
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Ss][Qq][Uu][Ii][Rr][Rr][Ee][Ll]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_parentImage:/.*\\[Uu][Pp][Dd][Aa][Tt][Ee]\.[Ee][Xx][Ee].*/) AND data_win_eventdata_image:/.*(\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]|\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]|\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 4h
