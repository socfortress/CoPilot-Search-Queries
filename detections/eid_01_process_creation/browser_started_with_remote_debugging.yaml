name: Browser Started with Remote Debugging
id: b3d34dc5-2efd-4ae3-845f-8ec14921f449
version: 1
schema_version: "1.0"
date: "2022-12-23"
author: pH-T (Nextron Systems), Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: b3d34dc5-2efd-4ae3-845f-8ec14921f449
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects browsers starting with the remote debugging flags. Which is a
  technique often used to perform browser injection attacks. MITRE ATT&CK:
  T1185.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* --remote-debugging-*"
                    case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\firefox.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* -start-debugger-server*"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches '*
  --remote-debugging-*'; data_win_eventdata_image matches '*\firefox.exe';
  data_win_eventdata_commandLine matches '* -start-debugger-server*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://yoroi.company/wp-content/uploads/2022/05/EternityGroup_report_compressed.pdf
  - https://www.mdsec.co.uk/2022/10/analysing-lastpass-part-1/
  - https://github.com/defaultnamehere/cookie_crimes/
  - https://github.com/wunderwuzzi23/firefox-cookiemonster
  - https://attack.mitre.org/techniques/T1185/

response:
  message: >
    Browser Started with Remote Debugging detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1185
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1185
  custom_tags:
    - browser
    - started
    - debugging
    - process_creation
    - sysmon
    - credential_access
    - collection
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.* --[Rr][Ee][Mm][Oo][Tt][Ee]-[Dd][Ee][Bb][Uu][Gg][Gg][Ii][Nn][Gg]-.*/ OR (data_win_eventdata_image:/.*\\[Ff][Ii][Rr][Ee][Ff][Oo][Xx]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.* -[Ss][Tt][Aa][Rr][Tt]-[Dd][Ee][Bb][Uu][Gg][Gg][Ee][Rr]-[Ss][Ee][Rr][Vv][Ee][Rr].*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 3e8207c5-fcd2-4ea6-9418-15d45b4890e4
    name: Potential Data Stealing Via Chromium Headless Debugging
    reason: 'Headless debugging launch used to dump browser data via the DevTools port: direct follow-on.'
  - id: 5a6e1e16-07de-48d8-8aae-faa766c05e88
    name: Potential Cookies Session Hijacking
    reason: Cookie/session hijacking is the typical goal of attaching to a remote debugging port.
  - id: 24c77512-782b-448a-8950-eddb0785fc71
    name: SQLite Chromium Profile Data DB Access
    reason: 'SQLite access to Chromium profile DBs: alternate credential/cookie theft on the same host.'
  - id: 47147b5b-9e17-4d76-b8d2-7bac24c5ce1b
    name: Potential Browser Data Stealing
    reason: Browser data stealing command lines confirm stealer behaviour around the debug session.
  - id: 869ba261-c272-47d7-affe-5c0aa85c93d6
    name: Headless Browser Usage
    reason: Headless browser usage frequently coexists with remote debugging for automation by attackers.
  - id: 88d6e60c-759d-4ac1-a447-c0f1466c2d21
    name: Chromium Browser Instance Executed With Custom Extension
    reason: Custom extension load is another browser-injection persistence/steal technique.
  - id: 0a74c5a9-1b71-4475-9af2-7829d320d5c2
    name: ChromeLoader Malware Execution
    reason: ChromeLoader hijacks browsers with injected extensions and debug flags.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Browser launches with debug/headless/extension flags
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(chrome|msedge|brave|firefox|opera)\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*--remote-debugging.*/ OR data_win_eventdata_commandLine:/.*--headless.*/ OR data_win_eventdata_commandLine:/.*--load-extension.*/ OR data_win_eventdata_commandLine:/.*--user-data-dir.*/)
    pivot_on: host
    window: 4h
  - name: Local DevTools port connections
    query: data_win_system_eventID:"3" AND (data_win_eventdata_destinationPort:"9222" OR data_win_eventdata_destinationPort:"9223" OR data_win_eventdata_destinationPort:"9229")
    pivot_on: host
    window: 4h
  - name: Browser credential store access
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ll]ogin [Dd]ata.*/ OR data_win_eventdata_commandLine:/.*[Cc]ookies.*/ OR data_win_eventdata_commandLine:/.*[Ww]eb [Dd]ata.*/ OR data_win_eventdata_commandLine:/.*[Ll]ocal [Ss]tate.*/)
    pivot_on: host
    window: 4h
  - name: Browser parent anomalies
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(chrome|msedge|brave)\.[Ee][Xx][Ee]/ AND (data_win_eventdata_parentImage:/.*[Pp]ower[Ss]hell.*/ OR data_win_eventdata_parentImage:/.*[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*[Ww]script.*/ OR data_win_eventdata_parentImage:/.*[Cc]script.*/)
    pivot_on: host
    window: 4h
  - name: Exfil tooling after browser theft
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc]url.*(--upload-file|-[Tt] ).*/ OR data_win_eventdata_commandLine:/.*[Cc]ompress-[Aa]rchive.*/ OR data_win_eventdata_commandLine:/.*7z.* a .*/)
    pivot_on: host
    window: 4h
