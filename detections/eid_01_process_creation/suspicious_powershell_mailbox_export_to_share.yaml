name: Suspicious PowerShell Mailbox Export to Share
id: 889719ef-dd62-43df-86c3-768fb08dc7c0
version: 1
schema_version: "1.0"
date: "2022-10-26"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 889719ef-dd62-43df-86c3-768fb08dc7c0
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects usage of the powerShell New-MailboxExportRequest Cmdlet to exports a
  mailbox to a remote or local share, as used in ProxyShell exploitations.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*New-MailboxExportRequest*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* -Mailbox *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* -FilePath \\\\\\\\*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*New-MailboxExportRequest*'; data_win_eventdata_commandLine matches '*
  -Mailbox *'; data_win_eventdata_commandLine matches '* -FilePath \\*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://youtu.be/5mqid-7zp8k?t=2481
  - https://blog.orange.tw/2021/08/proxylogon-a-new-attack-surface-on-ms-exchange-part-1.html
  - https://peterjson.medium.com/reproducing-the-proxyshell-pwn2own-exploit-49743a4ea9a1
  - https://m365internals.com/2022/10/07/hunting-in-on-premises-exchange-server-logs/

response:
  message: >
    Suspicious PowerShell Mailbox Export to Share detected on host $agent_name$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$.
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - powershell
    - mailbox
    - export
    - process_creation
    - sysmon
    - exfiltration
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Nn][Ee][Ww]-[Mm][Aa][Ii][Ll][Bb][Oo][Xx][Ee][Xx][Pp][Oo][Rr][Tt][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ AND data_win_eventdata_commandLine:/.* -[Mm][Aa][Ii][Ll][Bb][Oo][Xx] .*/ AND data_win_eventdata_commandLine:/.* -[Ff][Ii][Ll][Ee][Pp][Aa][Tt][Hh] \\\\.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 4a241dea-235b-4a7e-8d76-50d817b146c4
    name: Suspicious PowerShell Mailbox Export to Share - PS
    reason: 'Script block log of the same New-MailboxExportRequest: confirms the export and shows parameters.'
  - id: 25676e10-2121-446e-80a4-71ff8506af47
    name: Exchange PowerShell Snap-Ins Usage
    reason: Exchange snap-in loaded to run the export cmdlets; the setup step.
  - id: 2d10095e-05ae-11ec-8fdf-acde48001122
    name: Exchange PowerShell Module Usage
    reason: Exchange PowerShell module usage in script blocks preceding the export.
  - id: bbb2dedd-a0e3-46ab-ba6c-6c82ae7a9aa7
    name: HAFNIUM Exchange Exploitation Activity
    reason: HAFNIUM/ProxyLogon activity commonly precedes mailbox export from compromised Exchange.
  - id: 7280c9f3-a5af-45d0-916a-bc01cb4151c9
    name: Suspicious MSExchangeMailboxReplication ASPX Write
    reason: ASPX written by MSExchangeMailboxReplication is the ProxyShell webshell drop that enables the export.
  - id: bd1212e5-78da-431e-95fa-c58e3237a8e6
    name: Suspicious ASPX File Drop by Exchange
    reason: Webshell dropped by Exchange (w3wp) in the same exploitation chain.
  - id: b06335b3-55ac-4b41-937e-16b7f5d57dfd
    name: CVE-2021-26858 Exchange Exploitation
    reason: 'CVE-2021-26858 arbitrary file write: initial exploitation preceding export.'
  - id: a55349d8-9588-4c5a-8e3b-1925fe2a4ffe
    name: Exchange PowerShell Cmdlet History Deleted
    reason: Exchange cmdlet history deletion is the cleanup after exporting mailboxes.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Exchange role or permission changes enabling export
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Nn]ew-[Mm]anagement[Rr]ole[Aa]ssignment|[Mm]ailbox [Ii]mport [Ee]xport|[Aa]dd-[Mm]ailbox[Pp]ermission|[Aa]dd-[Rr]ole[Gg]roup[Mm]ember).*/
    pivot_on: host
    window: 24h
  - name: Mailbox export and search cmdlets in script blocks
    query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*([Nn]ew-[Mm]ailbox[Ee]xport[Rr]equest|[Ss]earch-[Mm]ailbox|[Gg]et-[Mm]ailbox[Ee]xport[Rr]equest|[Nn]ew-[Mm]ailbox[Ii]mport[Rr]equest).*/
    pivot_on: host
    window: 24h
  - name: Web server worker spawning shells
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ww]3[Ww][Pp]\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Cc][Mm][Dd]|[Pp]ower[Ss]hell|[Pp][Ww][Ss][Hh]|[Cc][Ss][Cc]|[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll])\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 24h
  - name: PST or archive files created (export output, staging)
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.([Pp][Ss][Tt]|[Zz][Ii][Pp]|7[Zz]|[Rr][Aa][Rr])/
    pivot_on: host
    window: 24h
  - name: Archive or transfer tools touching PST files
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*\.[Pp][Ss][Tt].*/ AND data_win_eventdata_image:/.*\\(7[Zz]|[Ww]in[Rr][Aa][Rr]|[Rr][Aa][Rr]|[Rr]obocopy|[Xx]copy|[Cc]url|[Rr]clone)\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 24h
