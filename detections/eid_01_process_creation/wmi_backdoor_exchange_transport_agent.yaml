name: WMI Backdoor Exchange Transport Agent
id: 797011dc-44f4-4e6f-9f10-a8ceefbe566b
version: 1
schema_version: "1.0"
date: "2023-02-08"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 797011dc-44f4-4e6f-9f10-a8ceefbe566b
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a WMI backdoor in Exchange Transport Agents via WMI event filters.
  MITRE ATT&CK: T1546.003.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_parentImage:
              value: "*\\\\EdgeTransport.exe"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  should:
                    - term:
                        data_win_eventdata_image:
                          value: "C:\\Windows\\System32\\conhost.exe"
                          case_insensitive: true
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "C:\\\\Program Files\\\\Microsoft\\\\Exchange Server\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\Bin\\\\OleConverter.exe"
                                case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\EdgeTransport.exe'; data_win_eventdata_image equals
  'C:\Windows\System32\conhost.exe'; data_win_eventdata_image matches
  'C:\Program Files\Microsoft\Exchange Server\*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/cglyer/status/1182389676876980224
  - https://twitter.com/cglyer/status/1182391019633029120
  - https://attack.mitre.org/techniques/T1546/003/

response:
  message: >
    WMI Backdoor Exchange Transport Agent detected on host $agent_name$. Matched
    data_win_eventdata_parentImage: $data_win_eventdata_parentImage$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1546.003
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1546.003
  custom_tags:
    - backdoor
    - exchange
    - transport
    - process_creation
    - sysmon
    - privilege_escalation
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ee][Dd][Gg][Ee][Tt][Rr][Aa][Nn][Ss][Pp][Oo][Rr][Tt]\.[Ee][Xx][Ee]/ AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Cc][Oo][Nn][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ OR (data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ee][Xx][Cc][Hh][Aa][Nn][Gg][Ee] [Ss][Ee][Rr][Vv][Ee][Rr]\\.*/ AND data_win_eventdata_image:/.*\\[Bb][Ii][Nn]\\[Oo][Ll][Ee][Cc][Oo][Nn][Vv][Ee][Rr][Tt][Ee][Rr]\.[Ee][Xx][Ee]/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 83809e84-4475-4b69-bc3e-4aad8568612f
    name: MSExchange Transport Agent Installation
    reason: 'Direct precursor: a malicious transport agent is registered via Install-TransportAgent before EdgeTransport starts spawning its children.'
  - id: 6b269392-9eba-40b5-acb6-55c882b20ba6
    name: Suspicious File Drop by Exchange
    reason: The backdoor agent DLL or payload is dropped by an Exchange process before registration, or by it afterwards.
  - id: bd1212e5-78da-431e-95fa-c58e3237a8e6
    name: Suspicious ASPX File Drop by Exchange
    reason: Exchange compromise often yields web shells alongside transport-agent persistence.
  - id: 25676e10-2121-446e-80a4-71ff8506af47
    name: Exchange PowerShell Snap-Ins Usage
    reason: Registering or enabling transport agents is done through Exchange snap-ins in PowerShell just before this fires.
  - id: 2d10095e-05ae-11ec-8fdf-acde48001122
    name: Exchange PowerShell Module Usage
    reason: Script-block evidence of the Exchange cmdlets used to install or enable the agent.
  - id: bbb2dedd-a0e3-46ab-ba6c-6c82ae7a9aa7
    name: HAFNIUM Exchange Exploitation Activity
    reason: Exploited Exchange servers frequently get transport-agent backdoors as follow-on persistence.
  - id: a55349d8-9588-4c5a-8e3b-1925fe2a4ffe
    name: Exchange PowerShell Cmdlet History Deleted
    reason: Operators clear Exchange cmdlet history after installing the agent to hide it.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Children of EdgeTransport.exe
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Ee]dge[Tt]ransport\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 6h
  - name: Transport agent install/enable cmdlets
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Tt]ransport[Aa]gent.*/ OR /.*[Ee]nable-[Tt]ransport[Aa]gent.*/)
    pivot_on: host
    window: 24h
  - name: DLL or ASPX files written by Exchange processes
    query: data_win_system_eventID:11 AND data_win_eventdata_image:(/.*[Ee]dge[Tt]ransport\.exe/ OR /.*[Ww]3wp\.exe/ OR /.*[Uu]m[Ww]orker[Pp]rocess\.exe/) AND data_win_eventdata_targetFilename:(/.*\.dll/ OR /.*\.aspx/ OR /.*\.ps1/)
    pivot_on: host
    window: 24h
  - name: Outbound connections from Exchange transport
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*[Ee]dge[Tt]ransport\.[Ee][Xx][Ee]/ AND data_win_eventdata_initiated:true
    pivot_on: host
    window: 6h
