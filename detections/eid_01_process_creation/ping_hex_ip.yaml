name: Ping Hex IP
id: 1a0d4aba-7668-4365-9ce4-6d79ab088dfd
version: 1
schema_version: "1.0"
date: "2025-10-17"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 1a0d4aba-7668-4365-9ce4-6d79ab088dfd
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a ping command that uses a hex encoded IP address. MITRE ATT&CK:
  T1140, T1027.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\ping.exe"
              case_insensitive: true
        - regexp:
            data_win_eventdata_commandLine: ".*(0x[a-fA-F0-9]{8}).*"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\ping.exe'; data_win_eventdata_commandLine matches the regex
  /.*(0x[a-fA-F0-9]{8}).*/.

known_false_positives: >
  Unlikely, because no sane admin pings IP addresses in a hexadecimal form.
  Baseline expected activity in your environment and tune this detection before
  relying on it for automated response.

references:
  - https://github.com/vysecurity/Aggressor-VYSEC/blob/0d61c80387b9432dab64b8b8a9fb52d20cfef80e/ping.cna
  - https://twitter.com/vysecurity/status/977198418354491392
  - https://attack.mitre.org/techniques/T1140/
  - https://attack.mitre.org/techniques/T1027/

response:
  message: >
    Ping Hex IP detected on host $agent_name$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. Matched data_win_eventdata_commandLine:
    $data_win_eventdata_commandLine$. MITRE ATT&CK: T1140, T1027
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1140
    - T1027
  custom_tags:
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Pp][Ii][Nn][Gg]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*(0x[a-fA-F0-9]{8}).*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 54786ddc-5b8a-11ed-9b6a-0242ac120002
    name: Suspicious Ping/Del Command Combination
    reason: Ping used inside obfuscated cmd chains that self-delete payloads; same evasive cmd/ping tradecraft
  - id: ded2b07a-d12f-4284-9b76-653e37b6c8b0
    name: Potentially Suspicious Ping/Copy Command Combination
    reason: Ping-plus-copy chains are the batch-script stager pattern that often carries hex-encoded IPs
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Script interpreter launching hex-IP ping
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[\\](cmd|powershell|wscript|cscript|mshta)\.exe/ AND data_win_eventdata_commandLine:/.*[Pp]ing.*0x[0-9a-fA-F]{8}.*/
    pivot_on: host
    window: 2h
  - name: Other obfuscated IP forms in command lines
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*0x[0-9a-fA-F]{8}.*/ OR data_win_eventdata_commandLine:/.*(curl|wget|certutil|bitsadmin|nslookup|Invoke-WebRequest).*[0-9]{9,10}.*/)
    pivot_on: host
    window: 2h
  - name: Outbound connections from script interpreters
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*[\\](cmd|powershell|wscript|cscript|mshta|rundll32)\.exe/ AND data_win_eventdata_initiated:true
    pivot_on: host
    window: 2h
  - name: Scripts and binaries written to staging paths
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*[\\](Temp|AppData|ProgramData|Public)[\\].*\.(bat|cmd|ps1|vbs|js|exe|dll)/
    pivot_on: host
    window: 2h
