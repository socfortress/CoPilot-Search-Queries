name: HackTool - Jlaive In-Memory Assembly Execution
id: 0a99eb3e-1617-41bd-b095-13dc767f3def
version: 1
schema_version: "1.0"
date: "2023-02-22"
author: Jose Luis Sanchez Martinez (@Joseliyo_Jstnk)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 0a99eb3e-1617-41bd-b095-13dc767f3def
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the use of Jlaive to execute assemblies in a copied PowerShell. MITRE
  ATT&CK: T1059.003.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_parentImage:
              value: "*\\\\cmd.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_parentCommandLine:
              value: "*.bat"
              case_insensitive: true
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\xcopy.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*powershell.exe*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*.bat.exe*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\xcopy.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*pwsh.exe*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*.bat.exe*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\attrib.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*+s*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*+h*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*.bat.exe*"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_parentCommandLine
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\cmd.exe'; data_win_eventdata_parentCommandLine matches '*.bat';
  data_win_eventdata_image matches '*\xcopy.exe', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://jstnk9.github.io/jstnk9/research/Jlaive-Antivirus-Evasion-Tool
  - https://web.archive.org/web/20220514073704/https://github.com/ch2sh/Jlaive
  - https://attack.mitre.org/techniques/T1059/003/

response:
  message: >
    HackTool - Jlaive In-Memory Assembly Execution detected on host
    $agent_name$. Matched data_win_eventdata_parentImage:
    $data_win_eventdata_parentImage$. Matched
    data_win_eventdata_parentCommandLine:
    $data_win_eventdata_parentCommandLine$. MITRE ATT&CK: T1059.003
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_parentCommandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.003
  custom_tags:
    - hacktool
    - jlaive
    - memory
    - process_creation
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ AND data_win_eventdata_parentCommandLine:/.*\.[Bb][Aa][Tt]/ AND ((data_win_eventdata_image:/.*\\[Xx][Cc][Oo][Pp][Yy]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee].*/ AND data_win_eventdata_commandLine:/.*\.[Bb][Aa][Tt]\.[Ee][Xx][Ee].*/) OR (data_win_eventdata_image:/.*\\[Xx][Cc][Oo][Pp][Yy]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee].*/ AND data_win_eventdata_commandLine:/.*\.[Bb][Aa][Tt]\.[Ee][Xx][Ee].*/) OR (data_win_eventdata_image:/.*\\[Aa][Tt][Tt][Rr][Ii][Bb]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*\+[Ss].*/ AND data_win_eventdata_commandLine:/.*\+[Hh].*/ AND data_win_eventdata_commandLine:/.*\.[Bb][Aa][Tt]\.[Ee][Xx][Ee].*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 30edb182-aa75-42c0-b0a9-e998bb29067c
    name: Potential AMSI Bypass Via .NET Reflection
    reason: Packed loaders use AMSI evasion before in-memory assembly load.
  - id: 92a974db-ab84-457f-9ec0-55db83d7a825
    name: Potential AMSI Bypass Using NULL Bits
    reason: Alternative AMSI bypass seen with in-memory loaders in the same launch chain.
  - id: e32d4572-9826-4738-b651-95fa63747e8a
    name: Base64 Encoded PowerShell Command Detected
    reason: The Jlaive stub decodes its payload via PowerShell commands, often base64 encoded.
  - id: 44e24481-6202-4c62-9127-5a0ae8e3fe3d
    name: Obfuscated PowerShell OneLiner Execution
    reason: The copied PowerShell runs an obfuscated one-liner to decrypt and reflectively load the assembly.
  - id: b3512211-c67e-4707-bedc-66efc7848863
    name: Potential PowerShell Downgrade Attack
    reason: Loaders sometimes downgrade PowerShell to evade logging and AMSI before assembly load.
  - id: 9be56c82-b1cc-4318-87eb-d138afaaca39
    name: Malicious PowerShell Process - Execution Policy Bypass
    reason: The copied PowerShell is typically launched with bypass and hidden flags.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Copied or renamed PowerShell binaries (.bat.exe)
    query: data_win_system_eventID:"1" AND data_win_eventdata_originalFileName:/.*([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].[Ee][Xx][Ee]).*/ AND data_win_eventdata_image:/.*(.[Bb][Aa][Tt].[Ee][Xx][Ee]|.[Tt][Mm][Pp].[Ee][Xx][Ee]|.[Tt][Xx][Tt].[Ee][Xx][Ee]).*/
    pivot_on: host
    window: 2h
  - name: 'Batch dropper chain: cmd .bat copying and hiding powershell'
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*([Cc][Mm][Dd].[Ee][Xx][Ee]).*/ AND data_win_eventdata_parentCommandLine:/.*(.[Bb][Aa][Tt]).*/ AND data_win_eventdata_commandLine:/.*([Xx][Cc][Oo][Pp][Yy]|[Aa][Tt][Tt][Rr][Ii][Bb] +[Ss] +[Hh]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].[Ee][Xx][Ee]|[Pp][Ww][Ss][Hh].[Ee][Xx][Ee]).*/
    pivot_on: host
    window: 2h
  - name: CLR and AMSI loaded into copied PowerShell (reflective .NET load)
    query: data_win_system_eventID:"7" AND data_win_eventdata_imageLoaded:/.*([Cc][Ll][Rr].[Dd][Ll][Ll]|[Cc][Ll][Rr][Jj][Ii][Tt].[Dd][Ll][Ll]|[Aa][Mm][Ss][Ii].[Dd][Ll][Ll]).*/ AND data_win_eventdata_image:/.*(.[Bb][Aa][Tt].[Ee][Xx][Ee]).*/
    pivot_on: host
    window: 2h
  - name: Payload decryption or reflection strings in commandline
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ff][Rr][Oo][Mm][Bb][Aa][Ss][Ee]64[Ss][Tt][Rr][Ii][Nn][Gg]|[Gg][Zz][Ii][Pp][Ss][Tt][Rr][Ee][Aa][Mm]|[Cc][Rr][Ee][Aa][Tt][Ee][Dd][Ee][Cc][Rr][Yy][Pp][Tt][Oo][Rr]|[Rr][Ee][Ff][Ll][Ee][Cc][Tt][Ii][Oo][Nn].[Aa][Ss][Ss][Ee][Mm][Bb][Ll][Yy]|[[Aa][Ss][Ss][Ee][Mm][Bb][Ll][Yy]]::[Ll][Oo][Aa][Dd]).*/
    pivot_on: host
    window: 2h
  - name: Outbound network connections from the .bat.exe process
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:"true" AND data_win_eventdata_image:/.*(.[Bb][Aa][Tt].[Ee][Xx][Ee]).*/
    pivot_on: host
    window: 4h
