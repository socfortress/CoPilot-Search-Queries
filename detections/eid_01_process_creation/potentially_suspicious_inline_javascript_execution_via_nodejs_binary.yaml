name: Potentially Suspicious Inline JavaScript Execution via NodeJS Binary
id: 8537c866-072e-460d-bfff-aaf39cbd73d3
version: 1
schema_version: "1.0"
date: "2025-04-21"
author: Microsoft (idea), Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 8537c866-072e-460d-bfff-aaf39cbd73d3
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potentially suspicious inline JavaScript execution using Node.js with
  specific keywords in the command line. MITRE ATT&CK: T1059.007.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\node.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "node.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_product:
                    value: "Node.js"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*http*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*execSync*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*spawn*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*fs*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*path*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*zlib*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_product
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\node.exe'; data_win_eventdata_originalFileName equals 'node.exe';
  data_win_eventdata_product equals 'Node.js', among other conditions.

known_false_positives: >
  Legitimate scripts using Node.js with these modules. Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://www.microsoft.com/en-us/security/blog/2025/04/15/threat-actors-misuse-node-js-to-deliver-malware-and-other-malicious-payloads/
  - https://attack.mitre.org/techniques/T1059/007/

response:
  message: >
    Potentially Suspicious Inline JavaScript Execution via NodeJS Binary
    detected on host $agent_name$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1059.007
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.007
  custom_tags:
    - inline
    - javascript
    - nodejs
    - process_creation
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Nn][Oo][Dd][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Nn][Oo][Dd][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_product:/[Nn][Oo][Dd][Ee]\.[Jj][Ss]/) AND data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp].*/ AND data_win_eventdata_commandLine:/.*[Ee][Xx][Ee][Cc][Ss][Yy][Nn][Cc].*/ AND data_win_eventdata_commandLine:/.*[Ss][Pp][Aa][Ww][Nn].*/ AND data_win_eventdata_commandLine:/.*[Ff][Ss].*/ AND data_win_eventdata_commandLine:/.*[Pp][Aa][Tt][Hh].*/ AND data_win_eventdata_commandLine:/.*[Zz][Ll][Ii][Bb].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 6640f31c-01ad-49b5-beb5-83498a5cd8bd
    name: Potential Arbitrary Code Execution Via Node.EXE
    reason: Same binary used to run attacker-supplied code via eval flags; confirms node.exe is a script runner here, not a dev tool.
  - id: 271de298-cc0e-4842-acd8-079a0a99ea65
    name: Windows Suspicious Child Process from Node.js - React2Shell
    reason: Inline JS with execSync/spawn exists to launch shell children; a node-spawned cmd/powershell is the next stage.
  - id: 21dd6d38-2b18-4453-9404-a0fe4a0cc288
    name: Curl Download And Execute Combination
    reason: Inline JS containing http often downloads a payload; a curl download-and-exec on the same host is the alternative or follow-on stager.
  - id: f6c27ecc-d890-4452-80e6-2e274a10e097
    name: Axios NPM Compromise Indicators - Windows
    reason: Supply-chain npm compromises run node inline with http/execSync; shows whether the activity comes from a compromised package.
  - id: afa71271-6a97-4e47-810f-83120fb1a4ce
    name: New Agent Skills Installation Attempt Via Node.EXE
    reason: Another node.exe abuse by a package or agent tool that may be the origin of the inline command.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Shell or LOLBin children spawned by node.exe
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\([Nn][Oo][Dd][Ee])\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Cc][Mm][Dd]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]|[Cc][Uu][Rr][Ll]|[Ww][Gg][Ee][Tt]|[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn])\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Outbound network connections made by node.exe
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Nn][Oo][Dd][Ee])\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Files written by node.exe in user-writable paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*\\([Nn][Oo][Dd][Ee])\.[Ee][Xx][Ee]/ AND data_win_eventdata_targetFilename:/.*(\\[Tt]emp\\|\\[Aa]pp[Dd]ata\\|\\[Pp]rogram[Dd]ata\\|\\[Pp]ublic\\).*/
    pivot_on: host
    window: 4h
  - name: Other node.exe launches with eval or print flags
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Nn][Oo][Dd][Ee])\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*( -[Ee] | --eval| -[Pp] | --print).*/
    pivot_on: user
    window: 24h
