name: WmiPrvSE Spawned A Process
id: d21374ff-f574-44a7-9998-4a8c8bf33d7d
version: 1
schema_version: "1.0"
date: "2023-03-23"
author: Roberto Rodriguez @Cyb3rWard0g
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: d21374ff-f574-44a7-9998-4a8c8bf33d7d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: production
type: TTP

description: >
  Detects WmiPrvSE spawning a process. MITRE ATT&CK: T1047.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_parentImage:
              value: "*\\\\WmiPrvSe.exe"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_user"
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  should:
                    - term:
                        data_win_eventdata_logonId:
                          value: "0x3e7"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_logonId:
                          value: "null"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_user:
                          value: "*AUTHORI*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_user:
                          value: "*AUTORI*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\WmiPrvSE.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\WerFault.exe"
                          case_insensitive: true
                    - bool:
                        must_not:
                          - exists:
                              field: "data_win_eventdata_logonId"
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_user
    - data_win_eventdata_image
    - data_win_eventdata_logonId
    - data_win_eventdata_commandLine

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\WmiPrvSe.exe'; data_win_eventdata_logonId equals '0x3e7';
  data_win_eventdata_logonId equals 'null', among other conditions.

known_false_positives: >
  False positives are expected (e.g. in environments where WinRM is used
  legitimately). Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://threathunterplaybook.com/hunts/windows/190815-RemoteServiceInstallation/notebook.html
  - https://attack.mitre.org/techniques/T1047/

response:
  message: >
    WmiPrvSE Spawned A Process detected on host $agent_name$. Matched
    data_win_eventdata_parentImage: $data_win_eventdata_parentImage$. Matched
    data_win_eventdata_user: $data_win_eventdata_user$. MITRE ATT&CK: T1047
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_user
      type: user

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1047
  custom_tags:
    - wmiprvse
    - spawned
    - process_creation
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee]\.[Ee][Xx][Ee]/ AND _exists_:data_win_eventdata_user AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_logonId:/0[Xx]3[Ee]7/ OR data_win_eventdata_logonId:/[Nn][Uu][Ll][Ll]/ OR data_win_eventdata_user:/.*[Aa][Uu][Tt][Hh][Oo][Rr][Ii].*/ OR data_win_eventdata_user:/.*[Aa][Uu][Tt][Oo][Rr][Ii].*/ OR data_win_eventdata_image:/.*\\[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ee][Rr][Ff][Aa][Uu][Ll][Tt]\.[Ee][Xx][Ee]/ OR NOT _exists_:data_win_eventdata_logonId)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 8a582fe2-0882-4b89-a82a-da6b2dc32937
    name: Suspicious WmiPrvSE Child Process
    reason: 'More specific variant: WmiPrvSE spawning shells/LOLBins confirms the generic hit is malicious.'
  - id: 692f0bec-83ba-4d04-af7e-e884a96059b6
    name: Potential WMI Lateral Movement WmiPrvSE Spawned PowerShell
    reason: 'Common outcome of remote WMI execution: PowerShell child of WmiPrvSE.'
  - id: 24869767-8579-485d-9a4f-d9ddfd8f0cac
    name: Process Execution via WMI
    reason: Overlapping detection of WMI-launched processes for corroboration.
  - id: 8d5aca11-22b3-4f22-b7ba-90e60533e1fb
    name: Wmiexec Default Output File
    reason: Impacket wmiexec writes output to a file after the WmiPrvSE-spawned cmd.
  - id: d6e464e4-5c6a-474e-82d2-aed616a3a492
    name: Impacket Lateral Movement WMIExec Commandline Parameters
    reason: The cmd.exe command-line shape wmiexec uses under WmiPrvSE.
  - id: 7773b877-5abb-4a3e-b9c9-fd0369b59b00
    name: WMIC Remote Command Execution
    reason: 'Source-side event on the originating host when wmic /node: was the method.'
  - id: 7707a579-e0d8-4886-a853-ce47e4575aaa
    name: Wmiprvse Wbemcomn DLL Hijack
    reason: Attackers hijack WmiPrvSE's DLL loads for code execution under the same parent.
  - id: 941e5c45-cda7-4864-8cea-bbb7458d194a
    name: Suspicious Remote Logon with Explicit Credentials
    reason: Remote WMI use is often preceded by network logons with supplied credentials.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: All WmiPrvSE children
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Ww]mi[Pp]rv[Ss][Ee]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Network logons (type 3) to host
    query: data_win_system_eventID:4624 AND data_win_eventdata_logonType:3
    pivot_on: host
    window: 2h
  - name: Staged payload or output files
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(/.*\\[Ww]indows\\[Tt]emp\\.*/ OR /.*\\[Aa][Dd][Mm][Ii][Nn]\$\\.*/ OR /.*\\__[0-9\.]+/)
    pivot_on: host
    window: 2h
  - name: Persistence or discovery commands run
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ss]chtasks.*\/[Cc]reate.*/ OR /.*[Nn]et1? (user|group|localgroup).*/ OR /.*[Ww]hoami.*/ OR /.*[Rr]eg(\.exe)? add.*/)
    pivot_on: host
    window: 2h
