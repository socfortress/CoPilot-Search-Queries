name: WmiPrvSE Spawned A Process
id: d21374ff-f574-44a7-9998-4a8c8bf33d7d
version: 1
schema_version: "1.0"
date: "2023-03-23"
author: Roberto Rodriguez @Cyb3rWard0g
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: d21374ff-f574-44a7-9998-4a8c8bf33d7d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: production
type: TTP

description: >
  Detects WmiPrvSE spawning a process. MITRE ATT&CK: T1047.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_parentImage:
              value: "*\\\\WmiPrvSe.exe"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_user"
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  should:
                    - term:
                        data_win_eventdata_logonId:
                          value: "0x3e7"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_logonId:
                          value: "null"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_user:
                          value: "*AUTHORI*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_user:
                          value: "*AUTORI*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\WmiPrvSE.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\WerFault.exe"
                          case_insensitive: true
                    - bool:
                        must_not:
                          - exists:
                              field: "data_win_eventdata_logonId"
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_user
    - data_win_eventdata_image
    - data_win_eventdata_logonId
    - data_win_eventdata_commandLine

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\WmiPrvSe.exe'; data_win_eventdata_logonId equals '0x3e7';
  data_win_eventdata_logonId equals 'null', among other conditions.

known_false_positives: >
  False positives are expected (e.g. in environments where WinRM is used
  legitimately). Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://threathunterplaybook.com/hunts/windows/190815-RemoteServiceInstallation/notebook.html
  - https://attack.mitre.org/techniques/T1047/

response:
  message: >
    WmiPrvSE Spawned A Process detected on host $agent_name$. Matched
    data_win_eventdata_parentImage: $data_win_eventdata_parentImage$. Matched
    data_win_eventdata_user: $data_win_eventdata_user$. MITRE ATT&CK: T1047
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_user
      type: user

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1047
  custom_tags:
    - wmiprvse
    - spawned
    - process_creation
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee]\.[Ee][Xx][Ee]/ AND _exists_:data_win_eventdata_user AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_logonId:/0[Xx]3[Ee]7/ OR data_win_eventdata_logonId:/[Nn][Uu][Ll][Ll]/ OR data_win_eventdata_user:/.*[Aa][Uu][Tt][Hh][Oo][Rr][Ii].*/ OR data_win_eventdata_user:/.*[Aa][Uu][Tt][Oo][Rr][Ii].*/ OR data_win_eventdata_image:/.*\\[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ee][Rr][Ff][Aa][Uu][Ll][Tt]\.[Ee][Xx][Ee]/ OR NOT _exists_:data_win_eventdata_logonId)

