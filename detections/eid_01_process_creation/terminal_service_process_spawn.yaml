name: Terminal Service Process Spawn
id: 1012f107-b8f1-4271-af30-5aed2de89b39
version: 1
schema_version: "1.0"
date: "2023-01-25"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 1012f107-b8f1-4271-af30-5aed2de89b39
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a process spawned by the terminal service server process (this could
  be an indicator for an exploitation of CVE-2019-0708). MITRE ATT&CK: T1190,
  T1210.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_parentCommandLine:
              value: "*\\\\svchost.exe*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_parentCommandLine:
              value: "*termsvcs*"
              case_insensitive: true
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\rdpclip.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*:\\\\Windows\\\\System32\\\\csrss.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*:\\\\Windows\\\\System32\\\\wininit.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*:\\\\Windows\\\\System32\\\\winlogon.exe"
                          case_insensitive: true
                    - bool:
                        must_not:
                          - exists:
                              field: "data_win_eventdata_image"
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentCommandLine
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentCommandLine matches
  '*\svchost.exe*'; data_win_eventdata_parentCommandLine matches '*termsvcs*';
  data_win_eventdata_image matches '*\rdpclip.exe', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://securingtomorrow.mcafee.com/other-blogs/mcafee-labs/rdp-stands-for-really-do-patch-understanding-the-wormable-rdp-vulnerability-cve-2019-0708/
  - https://attack.mitre.org/techniques/T1190/
  - https://attack.mitre.org/techniques/T1210/

response:
  message: >
    Terminal Service Process Spawn detected on host $agent_name$. Matched
    data_win_eventdata_parentCommandLine:
    $data_win_eventdata_parentCommandLine$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1190, T1210
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_parentCommandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1190
    - T1210
  custom_tags:
    - terminal
    - service
    - spawn
    - process_creation
    - sysmon
    - initial_access
    - lateral_movement
    - car_2013_07_002
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_parentCommandLine:/.*\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee].*/ AND data_win_eventdata_parentCommandLine:/.*[Tt][Ee][Rr][Mm][Ss][Vv][Cc][Ss].*/ AND NOT (data_win_eventdata_image:/.*\\[Rr][Dd][Pp][Cc][Ll][Ii][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Cc][Ss][Rr][Ss][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ww][Ii][Nn][Ii][Nn][Ii][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]\.[Ee][Xx][Ee]/ OR NOT _exists_:data_win_eventdata_image)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 224f140f-3553-4cd1-af78-13d81bf9f7cc
    name: Potential RDP Session Hijacking Activity
    reason: Post-RDP-compromise session takeover on the same host.
  - id: 52753ea4-b3a0-4365-910d-36cff487b789
    name: Hijack Legit RDP Session to Move Laterally
    reason: Lateral movement artefact following a compromised terminal service.
  - id: 3f6b7b62-61aa-45db-96bd-9c31b36b653c
    name: RDP Sensitive Settings Changed
    reason: An attacker with code execution via termsvcs may alter RDP settings for persistence.
  - id: 37b437cf-3fc5-4c8e-9c94-1d7c9aff842b
    name: Allow RDP Remote Assistance Feature
    reason: RDP feature enablement commonly follows a foothold on an RDP host.
  - id: 6860a62c-9203-11eb-9e05-acde48001122
    name: Disabling Firewall with Netsh
    reason: Foothold followed by firewall changes to open access.
  - id: bf906d7b-7070-4642-8383-e404cf26eba5
    name: DarkGate - User Created Via Net.EXE
    reason: Backdoor account creation is a typical follow-up to RCE.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Children of svchost termsvcs
    query: data_win_system_eventID:1 AND data_win_eventdata_parentCommandLine:*termsvcs*
    pivot_on: host
    window: 4h
  - name: Account creation and group changes
    query: data_win_system_eventID:1 AND data_win_eventdata_image:(*\\net.exe OR *\\net1.exe) AND data_win_eventdata_commandLine:(*user*\/add* OR *localgroup*administrators*\/add*)
    pivot_on: host
    window: 4h
  - name: Recon tools run as SYSTEM
    query: data_win_system_eventID:1 AND data_win_eventdata_image:(*\\cmd.exe OR *\\powershell.exe OR *\\whoami.exe OR *\\ipconfig.exe OR *\\systeminfo.exe) AND data_win_eventdata_user:*SYSTEM*
    pivot_on: host
    window: 2h
  - name: Outbound connections from shells and rundll32
    query: data_win_system_eventID:3 AND data_win_eventdata_image:(*\\cmd.exe OR *\\powershell.exe OR *\\rundll32.exe) AND data_win_eventdata_initiated:true
    pivot_on: host
    window: 2h
  - name: RDP and firewall configuration commands
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(*fDenyTSConnections* OR *advfirewall* OR *portopening*)
    pivot_on: host
    window: 4h
