name: Firewall Rule Update Via Netsh.EXE
id: a70dcb37-3bee-453a-99df-d0c683151be6
version: 1
schema_version: "1.0"
date: "2023-07-18"
author: X__Junior (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: a70dcb37-3bee-453a-99df-d0c683151be6
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of netsh with the "advfirewall" and the "set" option in
  order to set new values for properties of a existing rule.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\netsh.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "netsh.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* firewall *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* set *"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\netsh.exe'; data_win_eventdata_originalFileName equals 'netsh.exe';
  data_win_eventdata_commandLine matches '* firewall *', among other conditions.

known_false_positives: >
  Legitimate administration activity. Software installations and removal.
  Baseline expected activity in your environment and tune this detection before
  relying on it for automated response.

references:
  - https://ss64.com/nt/netsh.html

response:
  message: >
    Firewall Rule Update Via Netsh.EXE detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  custom_tags:
    - firewall
    - update
    - netsh
    - process_creation
    - sysmon
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Nn][Ee][Tt][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Nn][Ee][Tt][Ss][Hh]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.* [Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll] .*/ AND data_win_eventdata_commandLine:/.* [Ss][Ee][Tt] .*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: cd5cfd80-aa5f-44c0-9c20-108c4ae12e3c
    name: New Firewall Rule Added Via Netsh.EXE
    reason: Rule edits and new allow rules are alternative ways to open inbound/outbound paths in the same session.
  - id: 1a5fefe6-734f-452e-a07d-fc1c35bce4b2
    name: Firewall Rule Deleted Via Netsh.EXE
    reason: Update then delete (or vice versa) shows systematic firewall rule manipulation.
  - id: 57c4bf16-227f-4394-8ec7-1b745ee061c3
    name: Firewall Disabled via Netsh.EXE
    reason: Escalation from tweaking a rule to turning the firewall off entirely.
  - id: a35f5a72-f347-4e36-8895-9869b0d5fc6d
    name: Suspicious Program Location Whitelisted In Firewall Via Netsh.EXE
    reason: A set on an existing rule can retarget it to a malware path in a user-writable folder.
  - id: 01aeb693-138d-49d2-9403-c4f52d7d3d62
    name: RDP Connection Allowed Via Netsh.EXE
    reason: Updating a rule to enable remote desktop precedes lateral movement.
  - id: 322ed9ec-fcab-4f67-9a34-e7c6aef43614
    name: New Port Forwarding Rule Added Via Netsh.EXE
    reason: Rule update paired with portproxy builds a pivot/tunnel through the host.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: netsh advfirewall activity on host
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Nn]etsh\.exe/ AND data_win_eventdata_commandLine:/.*[Ff]irewall.*/
    pivot_on: host
    window: 2h
  - name: Firewall rule modified events
    query: data_win_system_eventID:(4947 OR 4946 OR 4948)
    pivot_on: host
    window: 2h
  - name: Netsh portproxy or RDP enablement
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Pp]ortproxy.*/ OR /.*[Ff]Deny[Tt][Ss][Cc]onnections.*/ OR /.*[Rr]emote [Dd]esktop.*/)
    pivot_on: host
    window: 4h
  - name: Inbound connections after rule change
    query: data_win_system_eventID:3 AND data_win_eventdata_initiated:false
    pivot_on: host
    window: 2h
  - name: Process that spawned netsh firewall command
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*[Nn]etsh.*[Ff]irewall.*/ AND NOT data_win_eventdata_parentImage:/.*[Ss]vchost.*/
    pivot_on: user
    window: 1h
