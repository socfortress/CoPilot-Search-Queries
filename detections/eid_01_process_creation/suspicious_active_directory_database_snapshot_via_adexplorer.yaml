name: Suspicious Active Directory Database Snapshot Via ADExplorer
id: ef61af62-bc74-4f58-b49b-626448227652
version: 1
schema_version: "1.0"
date: "2025-07-09"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: ef61af62-bc74-4f58-b49b-626448227652
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of Sysinternals ADExplorer with the "-snapshot" flag in
  order to save a local copy of the active directory database to a suspicious
  directory. This can be used by attackers to extract data for Bloodhound,
  usernames for password spraying or use the meta data for social engineering.
  The snapshot doesn't contain password hashes but there have been cases, where
  administrators put passwords in the comment field. MITRE ATT&CK: T1087.002,
  T1069.002, T1482.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\ADExp.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\ADExplorer.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\ADExplorer64.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\ADExplorer64a.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "AdExp"
                    case_insensitive: true
              - term:
                  data_win_eventdata_description:
                    value: "Active Directory Editor"
                    case_insensitive: true
              - term:
                  data_win_eventdata_product:
                    value: "Sysinternals ADExplorer"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*snapshot*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Downloads\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Users\\\\Public\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\AppData\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Windows\\\\Temp\\\\*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_description
    - data_win_eventdata_product
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\ADExp.exe'; data_win_eventdata_image matches '*\ADExplorer.exe';
  data_win_eventdata_image matches '*\ADExplorer64.exe', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.documentcloud.org/documents/5743766-Global-Threat-Report-2019.html
  - https://learn.microsoft.com/de-de/sysinternals/downloads/adexplorer
  - https://github.com/c3c/ADExplorerSnapshot.py/tree/f700904defac330802bbfedd1d8ffd9248f4ee24
  - https://www.packetlabs.net/posts/scattered-spider-is-a-young-ransomware-gang-exploiting-large-corporations/
  - https://www.nccgroup.com/us/research-blog/lapsus-recent-techniques-tactics-and-procedures/
  - https://trustedsec.com/blog/adexplorer-on-engagements
  - https://attack.mitre.org/techniques/T1087/002/
  - https://attack.mitre.org/techniques/T1069/002/
  - https://attack.mitre.org/techniques/T1482/

response:
  message: >
    Suspicious Active Directory Database Snapshot Via ADExplorer detected on
    host $agent_name$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1087.002, T1069.002,
    T1482
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1087.002
    - T1069.002
    - T1482
  custom_tags:
    - active
    - directory
    - database
    - process_creation
    - sysmon
    - discovery
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Aa][Dd][Ee][Xx][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Aa][Dd][Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Aa][Dd][Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]64\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Aa][Dd][Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]64[Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Aa][Dd][Ee][Xx][Pp]/ OR data_win_eventdata_description:/[Aa][Cc][Tt][Ii][Vv][Ee] [Dd][Ii][Rr][Ee][Cc][Tt][Oo][Rr][Yy] [Ee][Dd][Ii][Tt][Oo][Rr]/ OR data_win_eventdata_product:/[Ss][Yy][Ss][Ii][Nn][Tt][Ee][Rr][Nn][Aa][Ll][Ss] [Aa][Dd][Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]/) AND data_win_eventdata_commandLine:/.*[Ss][Nn][Aa][Pp][Ss][Hh][Oo][Tt].*/ AND (data_win_eventdata_commandLine:/.*\\[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 9212f354-7775-4e28-9c9f-8f0a4544e664
    name: Active Directory Database Snapshot Via ADExplorer
    reason: Generic version of the same snapshot activity; shows whether other paths were used too.
  - id: 0a1255c5-d732-4b62-ac02-b5152d34fb83
    name: ADExplorer Writing Complete AD Snapshot Into .dat File
    reason: File-level proof the snapshot was actually written.
  - id: f376c8a7-a2d0-4ddc-aa0c-16c17236d962
    name: HackTool - Bloodhound/Sharphound Execution
    reason: Snapshots are converted for BloodHound; collector use on the same host strengthens intent.
  - id: 514e7e3e-b3b4-4a67-af60-be20f139198b
    name: PUA - AdFind.EXE Execution
    reason: Common companion AD enumeration tool in the same recon phase.
  - id: cc316032-924a-11eb-91a2-acde48001122
    name: DSQuery Domain Discovery
    reason: Parallel built-in domain enumeration.
  - id: 5cc90652-4cbd-4241-aa3b-4b462fa5a248
    name: Potential Recon Activity Via Nltest.EXE
    reason: Domain and trust recon typically accompanies AD snapshotting.
  - id: 9fbf5927-5261-4284-a71d-f681029ea574
    name: Compress Data and Lock With Password for Exfiltration With 7-ZIP
    reason: The snapshot .dat is archived before exfiltration.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: AD snapshot files written to disk
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\.dat/ AND data_win_eventdata_image:/.*[Aa][Dd][Ee]xp.*/
    pivot_on: host
    window: 24h
  - name: Other AD enumeration tooling
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*\\(adfind|dsquery|nltest|ldifde|csvde)\.exe/ OR data_win_eventdata_commandLine:/.*[Ss]harp[Hh]ound.*/ OR data_win_eventdata_commandLine:/.*[Gg]et-[Aa][Dd][A-Za-z]+.*/)
    pivot_on: host
    window: 24h
  - name: Archiving of snapshot or staged data
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*\\(7z|7za|rar|winrar|tar)\.exe/ OR data_win_eventdata_commandLine:/.*[Cc]ompress-[Aa]rchive.*/) AND (data_win_eventdata_commandLine:/.*\.dat.*/ OR data_win_eventdata_commandLine:/.*[Dd]ownloads.*/ OR data_win_eventdata_commandLine:/.*[Pp]ublic.*/)
    pivot_on: host
    window: 24h
  - name: Download of ADExplorer or recon tools
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*live\.sysinternals\.com.*/ OR (data_win_eventdata_commandLine:/.*([Cc]url|[Ww]get|[Ii]nvoke-[Ww]eb[Rr]equest|bitsadmin).*/ AND data_win_eventdata_commandLine:/.*[Aa][Dd][Ee]xp.*/))
    pivot_on: host
    window: 6h
