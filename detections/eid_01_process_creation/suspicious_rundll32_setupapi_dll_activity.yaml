name: Suspicious Rundll32 Setupapi.dll Activity
id: 285b85b1-a555-4095-8652-a8a4106af63f
version: 1
schema_version: "1.0"
date: "2021-11-27"
author: Konstantin Grishchenko, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 285b85b1-a555-4095-8652-a8a4106af63f
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  setupapi.dll library provide InstallHinfSection function for processing INF
  files. INF file may contain instructions allowing to create values in the
  registry, modify files and install drivers. This technique could be used to
  obtain persistence via modifying one of Run or RunOnce registry keys, run
  process or use other DLLs chain calls (see references) InstallHinfSection
  function in setupapi.dll calls runonce.exe executable regardless of actual
  content of INF file. MITRE ATT&CK: T1218.011.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\runonce.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_parentImage:
              value: "*\\\\rundll32.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_parentCommandLine:
              value: "*setupapi.dll*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_parentCommandLine:
              value: "*InstallHinfSection*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_parentCommandLine
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\runonce.exe'; data_win_eventdata_parentImage matches '*\rundll32.exe';
  data_win_eventdata_parentCommandLine matches '*setupapi.dll*', among other
  conditions.

known_false_positives: >
  Scripts and administrative tools that use INF files for driver installation
  with setupapi.dll. Baseline expected activity in your environment and tune
  this detection before relying on it for automated response.

references:
  - https://lolbas-project.github.io/lolbas/Libraries/Setupapi/
  - https://gist.githubusercontent.com/bohops/0cc6586f205f3691e04a1ebf1806aabd/raw/baf7b29891bb91e76198e30889fbf7d6642e8974/calc_exe.inf
  - https://raw.githubusercontent.com/huntresslabs/evading-autoruns/master/shady.inf
  - https://twitter.com/Z3Jpa29z/status/1313742350292746241?s=20
  - https://attack.mitre.org/techniques/T1218/011/

response:
  message: >
    Suspicious Rundll32 Setupapi.dll Activity detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_parentImage: $data_win_eventdata_parentImage$. MITRE
    ATT&CK: T1218.011
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_parentImage
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218.011
  custom_tags:
    - rundll32
    - setupapi
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Oo][Nn][Cc][Ee]\.[Ee][Xx][Ee]/ AND data_win_eventdata_parentImage:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ AND data_win_eventdata_parentCommandLine:/.*[Ss][Ee][Tt][Uu][Pp][Aa][Pp][Ii]\.[Dd][Ll][Ll].*/ AND data_win_eventdata_parentCommandLine:/.*[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Hh][Ii][Nn][Ff][Ss][Ee][Cc][Tt][Ii][Oo][Nn].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: ce7cf472-6fcc-490a-9481-3786840b5d9b
    name: InfDefaultInstall.exe .inf Execution
    reason: InfDefaultInstall is the sibling INF-based proxy execution that abuses the same INF install path.
  - id: a1473adb-5338-4a20-b4c3-126763e2d3d3
    name: Suspicious Advpack Call Via Rundll32.EXE
    reason: Advpack via rundll32 is the sister INF-handling LOLBin technique (LaunchINFSection).
  - id: e593cf51-88db-4ee1-b920-37e89012a3c9
    name: Potentially Suspicious Rundll32 Activity
    reason: Generic suspicious rundll32 activity co-occurring with the INF launch.
  - id: 24357373-078f-44ed-9ac4-6d334a668a11
    name: Direct Autorun Keys Modification
    reason: INF files typically add Run/RunOnce values; autorun key modification is the expected follow-on.
  - id: de587dce-915e-4218-aac4-835ca6af6f70
    name: Potential Persistence Attempt Via Run Keys Using Reg.EXE
    reason: Run-key persistence via reg.exe is an alternative persistence step after INF abuse.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: INF-driven runonce.exe and install helper execution
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Rr][Uu][Nn][Oo][Nn][Cc][Ee]\.[Ee][Xx][Ee]|[Ii][Nn][Ff][Dd][Ee][Ff][Aa][Uu][Ll][Tt][Ii][Nn][Ss][Tt][Aa][Ll][Ll]\.[Ee][Xx][Ee])/ OR (data_win_eventdata_commandLine:/.*[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Hh][Ii][Nn][Ff][Ss][Ee][Cc][Tt][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ll][Aa][Uu][Nn][Cc][Hh][Ii][Nn][Ff][Ss][Ee][Cc][Tt][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ee][Ff][Aa][Uu][Ll][Tt][Ii][Nn][Ss][Tt][Aa][Ll][Ll].*/))
    pivot_on: host
    window: 4h
  - name: .inf files created in user or temp paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.[Ii][Nn][Ff]/ AND NOT data_win_eventdata_targetFilename:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\.*/
    pivot_on: host
    window: 4h
  - name: Run/RunOnce key values written
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND data_win_eventdata_targetObject:/.*\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn]([Oo][Nn][Cc][Ee])?.*/
    pivot_on: host
    window: 4h
  - name: Child processes of runonce.exe
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Rr][Uu][Nn][Oo][Nn][Cc][Ee]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 4h
