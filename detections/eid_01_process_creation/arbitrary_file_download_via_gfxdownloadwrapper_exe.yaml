name: Arbitrary File Download Via GfxDownloadWrapper.EXE
id: eee00933-a761-4cd0-be70-c42fe91731e7
version: 1
schema_version: "1.0"
date: "2023-10-18"
author: Victor Sergeev, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: eee00933-a761-4cd0-be70-c42fe91731e7
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of GfxDownloadWrapper.exe with a URL as an argument to
  download file. MITRE ATT&CK: T1105.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\GfxDownloadWrapper.exe"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*http://*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*https://*"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_commandLine"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*https://gameplayapi.intel.com/*"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\GfxDownloadWrapper.exe'; data_win_eventdata_commandLine matches
  '*http://*'; data_win_eventdata_commandLine matches '*https://*', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://lolbas-project.github.io/lolbas/HonorableMentions/GfxDownloadWrapper/
  - https://attack.mitre.org/techniques/T1105/

response:
  message: >
    Arbitrary File Download Via GfxDownloadWrapper.EXE detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
    MITRE ATT&CK: T1105
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1105
  custom_tags:
    - arbitrary
    - download
    - gfxdownloadwrapper
    - process_creation
    - sysmon
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Gg][Ff][Xx][Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ww][Rr][Aa][Pp][Pp][Ee][Rr]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp]:\/\/.*/ OR data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp][Ss]:\/\/.*/) AND _exists_:data_win_eventdata_commandLine AND NOT (data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp][Ss]:\/\/[Gg][Aa][Mm][Ee][Pp][Ll][Aa][Yy][Aa][Pp][Ii]\.[Ii][Nn][Tt][Ee][Ll]\.[Cc][Oo][Mm]\/.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d059842b-6b9d-4ed1-b5c3-5b89143c6ede
    name: File Download Via Bitsadmin
    reason: Alternative native downloader used for the same ingress-tool-transfer step on the host.
  - id: 19b08b1c-861d-4e75-a1ef-ea0c1baf202b
    name: Suspicious Download Via Certutil.EXE
    reason: Common companion downloader when an actor tries multiple LOLBins for payload staging.
  - id: 1e75c1cc-c5d4-42aa-ac3d-91b0b68b3b4c
    name: Arbitrary File Download Via Squirrel.EXE
    reason: Similar signed-component download abuse; attackers cycle through these LOLBins.
  - id: 863218bd-c7d0-4c52-80cd-0a96c09f54af
    name: Arbitrary File Download Via IMEWDBLD.EXE
    reason: Another trusted-binary downloader of the same family, likely tried alongside.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other native downloaders
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn].*[Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll].*[Uu][Rr][Ll][Cc][Aa][Cc][Hh][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/)
    pivot_on: host
    window: 6h
  - name: Executables created in user-writable paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\([Tt][Ee][Mm][Pp]|[Pp][Uu][Bb][Ll][Ii][Cc]|[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]|[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa])\\.*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Pp][Ss]1|[Bb][Aa][Tt])/
    pivot_on: host
    window: 4h
  - name: Network connections by GfxDownloadWrapper
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\[Gg][Ff][Xx][Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ww][Rr][Aa][Pp][Pp][Ee][Rr]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 6h
  - name: Processes launched from user-writable paths
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Tt][Ee][Mm][Pp]|[Pp][Uu][Bb][Ll][Ii][Cc]|[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]|[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa])\\.*\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 4h
