name: Use of Remote.exe
id: 4eddc365-79b4-43ff-a9d7-99422dc34b93
version: 1
schema_version: "1.0"
date: "2022-06-02"
author: Christopher Peacock @SecurePeacock, SCYTHE @scythe_io
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 4eddc365-79b4-43ff-a9d7-99422dc34b93
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Remote.exe is part of WinDbg in the Windows SDK and can be used for AWL bypass
  and running remote files. MITRE ATT&CK: T1127.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\remote.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "remote.exe"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\remote.exe'; data_win_eventdata_originalFileName equals 'remote.exe'.

known_false_positives: >
  Approved installs of Windows SDK with Debugging Tools for Windows (WinDbg).
  Baseline expected activity in your environment and tune this detection before
  relying on it for automated response.

references:
  - https://blog.thecybersecuritytutor.com/Exeuction-AWL-Bypass-Remote-exe-LOLBin/
  - https://lolbas-project.github.io/lolbas/OtherMSBinaries/Remote/
  - https://attack.mitre.org/techniques/T1127/

response:
  message: >
    Use of Remote.exe detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1127
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1127
  custom_tags:
    - process_creation
    - sysmon
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Rr][Ee][Mm][Oo][Tt][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Rr][Ee][Mm][Oo][Tt][Ee]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b5c7395f-e501-4a08-94d4-57fe7a9da9d2
    name: Potential Binary Proxy Execution Via Cdb.EXE
    reason: Cdb.EXE is the sibling WinDbg-family debugger LOLBin abused to run commands/shellcode; actors blocked on remote.exe fall back to cdb/ntsd.
  - id: ac1c92b4-ac81-405a-9978-4604d78cc47e
    name: Potential Binary Proxy Execution Via VSDiagnostics.EXE
    reason: VSDiagnostics.EXE is another SDK/debug-tool proxy-execution path used for the same AWL bypass.
  - id: 15c7904e-6ad1-4a45-9b46-5fb25df37fd2
    name: Malicious PE Execution by Microsoft Visual Studio Debugger
    reason: Visual Studio debugger launching a PE is a third debugger-as-launcher bypass seen alongside remote.exe.
  - id: 148431ce-4b70-403d-8525-fcc2993f29ea
    name: Potential DLL Injection Or Execution Using Tracker.exe
    reason: Tracker.exe (SDK binary) executes/injects a DLL; same SDK-tool abuse family, often tried in the same session.
  - id: 5cdb711b-5740-4fb2-ba88-f7945027afac
    name: Rundll32 UNC Path Execution
    reason: Rundll32 UNC path execution is a typical follow-on when a payload is pulled from a remote share.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Debugger-family tools launched on host
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*([Cc][Dd][Bb]\.[Ee][Xx][Ee]|[Nn][Tt][Ss][Dd]\.[Ee][Xx][Ee]|[Ww][Ii][Nn][Dd][Bb][Gg]\.[Ee][Xx][Ee]|[Kk][Dd]\.[Ee][Xx][Ee]|[Dd][Bb][Gg][Ss][Rr][Vv]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 4h
  - name: Children spawned by remote.exe (payload run)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*(\\[Rr][Ee][Mm][Oo][Tt][Ee]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 2h
  - name: Remote.exe server mode or UNC command line
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Rr][Ee][Mm][Oo][Tt][Ee]\.[Ee][Xx][Ee].*( \/[Ss] |\\\\).*/
    pivot_on: host
    window: 2h
  - name: SMB connections from host
    query: data_win_system_eventID:"3" AND (data_win_eventdata_destinationPort:"445" OR data_win_eventdata_destinationPort:"139")
    pivot_on: host
    window: 2h
  - name: Executables written to user-writable paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*([Tt][Ee][Mm][Pp]|[Pp][Uu][Bb][Ll][Ii][Cc]|[Aa][Pp][Pp][Dd][Aa][Tt][Aa]|[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]).*\.([Ee][Xx][Ee]|[Dd][Ll][Ll])/
    pivot_on: host
    window: 2h
