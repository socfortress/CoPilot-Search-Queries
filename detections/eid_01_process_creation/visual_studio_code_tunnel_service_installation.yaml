name: Visual Studio Code Tunnel Service Installation
id: 30bf1789-379d-4fdc-900f-55cd0a90a801
version: 1
schema_version: "1.0"
date: "2023-10-25"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 30bf1789-379d-4fdc-900f-55cd0a90a801
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the installation of VsCode tunnel (code-tunnel) as a service. MITRE
  ATT&CK: T1071.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*tunnel *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*service*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*internal-run*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*tunnel-service.log*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*tunnel *'; data_win_eventdata_commandLine matches '*service*';
  data_win_eventdata_commandLine matches '*internal-run*', among other
  conditions.

known_false_positives: >
  Legitimate installation of code-tunnel as a service. Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://ipfyx.fr/post/visual-studio-code-tunnel/
  - https://badoption.eu/blog/2023/01/31/code_c2.html
  - https://code.visualstudio.com/docs/remote/tunnels
  - https://attack.mitre.org/techniques/T1071/001/

response:
  message: >
    Visual Studio Code Tunnel Service Installation detected on host
    $agent_name$. Matched data_win_eventdata_commandLine:
    $data_win_eventdata_commandLine$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1071.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1071.001
  custom_tags:
    - visual
    - studio
    - tunnel
    - process_creation
    - sysmon
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Tt][Uu][Nn][Nn][Ee][Ll] .*/ AND data_win_eventdata_commandLine:/.*[Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/ AND data_win_eventdata_commandLine:/.*[Ii][Nn][Tt][Ee][Rr][Nn][Aa][Ll]-[Rr][Uu][Nn].*/ AND data_win_eventdata_commandLine:/.*[Tt][Uu][Nn][Nn][Ee][Ll]-[Ss][Ee][Rr][Vv][Ii][Cc][Ee]\.[Ll][Oo][Gg].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 2cf29f11-e356-4f61-98c0-1bdb9393d6da
    name: Renamed Visual Studio Code Tunnel Execution
    reason: Service install normally follows an interactive tunnel start, possibly under a renamed binary.
  - id: 5a3164f2-b373-4152-93cf-090b13c12d27
    name: Potentially Suspicious Child Process Of VsCode
    reason: Once persisted, operator activity appears as suspicious VS Code child processes.
  - id: 17a1be64-8d88-40bf-b5ff-a4f7a50ebcc8
    name: Suspicious New Service Creation
    reason: Generic suspicious service creation can corroborate the tunnel service registration.
  - id: 9a019ffc-3580-4c9d-8d87-079f7e8d3fd4
    name: Cloudflared Tunnel Execution
    reason: Another tunnel service installed as a redundant persistent channel.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: VS Code CLI tunnel/serve-web invocations
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Cc][Oo][Dd][Ee](\.[Ee][Xx][Ee])?"? ([Tt][Uu][Nn][Nn][Ee][Ll]|[Ss][Ee][Rr][Vv][Ee]-[Ww][Ee][Bb]).*/
    pivot_on: host
    window: 24h
  - name: Service installation events for tunnel binaries
    query: data_win_system_eventID:"7045" AND data_win_eventdata_imagePath:/.*([Cc][Oo][Dd][Ee]|[Tt][Uu][Nn][Nn][Ee][Ll]).*/
    pivot_on: host
    window: 24h
  - name: Service or autorun persistence referencing a code tunnel
    query: (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ss][Cc]|[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]|[Nn][Ss][Ss][Mm]).*[Cc][Oo][Dd][Ee].*[Tt][Uu][Nn][Nn][Ee][Ll].*/) OR (data_win_system_eventID:"13" AND data_win_eventdata_details:/.*[Cc][Oo][Dd][Ee].*[Tt][Uu][Nn][Nn][Ee][Ll].*/)
    pivot_on: host
    window: 24h
  - name: DNS lookups of VS Code tunnel relay domains
    query: data_win_system_eventID:"22" AND data_win_eventdata_queryName:/.*([Dd][Ee][Vv][Tt][Uu][Nn][Nn][Ee][Ll][Ss]\.[Mm][Ss]|[Tt][Uu][Nn][Nn][Ee][Ll][Ss]\.[Aa][Pp][Ii]\.[Vv][Ii][Ss][Uu][Aa][Ll][Ss][Tt][Uu][Dd][Ii][Oo]\.[Cc][Oo][Mm]).*/
    pivot_on: host
    window: 6h
  - name: Shells spawned by VS Code server node
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ss][Ee][Rr][Vv][Ee][Rr]\\[Nn][Oo][Dd][Ee]\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]|[Cc][Mm][Dd]|[Ww][Ss][Ll]|[Bb][Aa][Ss][Hh])\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 4h
