name: Sysmon Configuration Update
id: 87911521-7098-470b-a459-9a57fc80bdfd
version: 1
schema_version: "1.0"
date: "2026-06-29"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 87911521-7098-470b-a459-9a57fc80bdfd
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects updates to Sysmon's configuration. Attackers might update or replace
  the Sysmon configuration with a bare bone one to avoid monitoring without
  shutting down the service completely. MITRE ATT&CK: T1685.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\Sysmon64.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\Sysmon64a.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\Sysmon.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_description:
                    value: "System activity monitor"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-c*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*/c*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*–c*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*—c*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*―c*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_description
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\Sysmon64.exe'; data_win_eventdata_image matches '*\Sysmon64a.exe';
  data_win_eventdata_image matches '*\Sysmon.exe', among other conditions.

known_false_positives: >
  Legitimate administrators might use this command to update Sysmon
  configuration. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://learn.microsoft.com/en-us/sysinternals/downloads/sysmon
  - https://attack.mitre.org/techniques/T1685/

response:
  message: >
    Sysmon Configuration Update detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_description: $data_win_eventdata_description$. MITRE
    ATT&CK: T1685
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_description
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685
  custom_tags:
    - sysmon
    - configuration
    - update
    - process_creation
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ss][Yy][Ss][Mm][Oo][Nn]64\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ss][Yy][Ss][Mm][Oo][Nn]64[Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ss][Yy][Ss][Mm][Oo][Nn]\.[Ee][Xx][Ee]/ OR data_win_eventdata_description:/[Ss][Yy][Ss][Tt][Ee][Mm] [Aa][Cc][Tt][Ii][Vv][Ii][Tt][Yy] [Mm][Oo][Nn][Ii][Tt][Oo][Rr]/) AND (data_win_eventdata_commandLine:/.*-[Cc].*/ OR data_win_eventdata_commandLine:/.*\/[Cc].*/ OR data_win_eventdata_commandLine:/.*–[Cc].*/ OR data_win_eventdata_commandLine:/.*—[Cc].*/ OR data_win_eventdata_commandLine:/.*―[Cc].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 8ac03a65-6c84-4116-acad-dc1558ff7a77
    name: Sysmon Configuration Change
    reason: Sysmon itself logs event 16 when the config actually changes; confirms the update was applied.
  - id: 6a5f68d1-c4b5-46b9-94ee-5324892ea939
    name: Uninstall Sysinternals Sysmon
    reason: Alternative path to blinding Sysmon entirely once config tricks are no longer enough.
  - id: 4931188c-178e-4ee7-a348-39e8a7a56821
    name: Filter Driver Unloaded Via Fltmc.EXE
    reason: Unloading the Sysmon minifilter is the other way attackers silence it.
  - id: 4916a35e-bfc4-47d0-8e25-a003d7067061
    name: Sysmon Driver Altitude Change
    reason: Changing the driver altitude is a registry-based evasion paired with config tampering.
  - id: 6d1058a4-407e-4f3a-a144-1968c11dc5c3
    name: Suspicious Sysmon as Execution Parent
    reason: A tampered Sysmon binary spawning children indicates abuse of the tool.
  - id: 8a7e90c5-fe6e-45dc-889e-057fe4378bd9
    name: HackTool - SysmonEOP Execution
    reason: Sysmon privilege-escalation exploit; same tool-focused attacker behaviour.
  - id: 37db85d1-b089-490a-a59a-c7b6f984f480
    name: Sysmon Discovery Via Default Driver Altitude Using Findstr.EXE
    reason: Discovery of Sysmon precedes tampering with it.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Sysmon configuration change events
    query: data_win_system_eventID:"16"
    pivot_on:
    - host
    window: 4h
  - name: Sysmon service or driver manipulation
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ss]ysmon|[Ff]ltmc.*unload).*/
    pivot_on:
    - host
    window: 4h
  - name: Sysmon registry tampering
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*([Ss]ysmon).*/
    pivot_on:
    - host
    window: 4h
  - name: Other logging and defence evasion commands
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ww]evtutil.*(cl|clear-log|sl)|[Aa]uditpol|[Ll]ogman.*(stop|delete)).*/
    pivot_on:
    - host
    window: 4h
  - name: Sysmon config file written to disk
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*([Ss]ysmon.*\.xml|[Cc]onfig.*\.xml).*/
    pivot_on:
    - host
    window: 4h
