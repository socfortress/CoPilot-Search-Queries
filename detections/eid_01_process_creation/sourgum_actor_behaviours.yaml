name: SOURGUM Actor Behaviours
id: 7ba08e95-1e0b-40cd-9db5-b980555e42fd
version: 1
schema_version: "1.0"
date: "2022-10-09"
author: MSTIC, FPT.EagleEye
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 7ba08e95-1e0b-40cd-9db5-b980555e42fd
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Suspicious behaviours related to an actor tracked by Microsoft as SOURGUM.
  MITRE ATT&CK: T1546, T1546.015.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*windows\\\\system32\\\\Physmem.sys*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*Windows\\\\system32\\\\ime\\\\SHARED\\\\WimBootConfigurations.ini*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*Windows\\\\system32\\\\ime\\\\IMEJP\\\\WimBootConfigurations.ini*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*Windows\\\\system32\\\\ime\\\\IMETC\\\\WimBootConfigurations.ini*"
                    case_insensitive: true
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*windows\\\\system32\\\\filepath2*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*windows\\\\system32\\\\ime*"
                                case_insensitive: true
                        minimum_should_match: 1
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*reg add*"
                          case_insensitive: true
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*HKEY_LOCAL_MACHINE\\\\software\\\\classes\\\\clsid\\\\{7c857801-7381-11cf-884d-00aa004b2e24}\\\\inprocserver32*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*HKEY_LOCAL_MACHINE\\\\software\\\\classes\\\\clsid\\\\{cf4cc405-e2c5-4ddd-b3ce-5e7582d8c9fa}\\\\inprocserver32*"
                                case_insensitive: true
                        minimum_should_match: 1
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*windows\system32\Physmem.sys*'; data_win_eventdata_image matches
  '*Windows\system32\ime\SHARED\WimBootConfigurations.ini*';
  data_win_eventdata_image matches
  '*Windows\system32\ime\IMEJP\WimBootConfigurations.ini*', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.virustotal.com/gui/file/c299063e3eae8ddc15839767e83b9808fd43418dc5a1af7e4f44b97ba53fbd3d/detection
  - https://github.com/Azure/Azure-Sentinel/blob/43e9be273dca321295190bfc4902858e009d4a35/Detections/MultipleDataSources/SOURGUM_IOC.yaml
  - https://www.microsoft.com/security/blog/2021/07/15/protecting-customers-from-a-private-sector-offensive-actor-using-0-day-exploits-and-devilstongue-malware/
  - https://attack.mitre.org/techniques/T1546/
  - https://attack.mitre.org/techniques/T1546/015/

response:
  message: >
    SOURGUM Actor Behaviours detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1546, T1546.015
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1546
    - T1546.015
  custom_tags:
    - sourgum
    - actor
    - behaviours
    - process_creation
    - sysmon
    - persistence
    - privilege_escalation
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Pp][Hh][Yy][Ss][Mm][Ee][Mm]\.[Ss][Yy][Ss].*/ OR data_win_eventdata_image:/.*[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ii][Mm][Ee]\\[Ss][Hh][Aa][Rr][Ee][Dd]\\[Ww][Ii][Mm][Bb][Oo][Oo][Tt][Cc][Oo][Nn][Ff][Ii][Gg][Uu][Rr][Aa][Tt][Ii][Oo][Nn][Ss]\.[Ii][Nn][Ii].*/ OR data_win_eventdata_image:/.*[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ii][Mm][Ee]\\[Ii][Mm][Ee][Jj][Pp]\\[Ww][Ii][Mm][Bb][Oo][Oo][Tt][Cc][Oo][Nn][Ff][Ii][Gg][Uu][Rr][Aa][Tt][Ii][Oo][Nn][Ss]\.[Ii][Nn][Ii].*/ OR data_win_eventdata_image:/.*[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ii][Mm][Ee]\\[Ii][Mm][Ee][Tt][Cc]\\[Ww][Ii][Mm][Bb][Oo][Oo][Tt][Cc][Oo][Nn][Ff][Ii][Gg][Uu][Rr][Aa][Tt][Ii][Oo][Nn][Ss]\.[Ii][Nn][Ii].*/ OR ((data_win_eventdata_image:/.*[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ff][Ii][Ll][Ee][Pp][Aa][Tt][Hh]2.*/ OR data_win_eventdata_image:/.*[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ii][Mm][Ee].*/) AND data_win_eventdata_commandLine:/.*[Rr][Ee][Gg] [Aa][Dd][Dd].*/ AND (data_win_eventdata_commandLine:/.*[Hh][Kk][Ee][Yy]_[Ll][Oo][Cc][Aa][Ll]_[Mm][Aa][Cc][Hh][Ii][Nn][Ee]\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Cc][Ll][Aa][Ss][Ss][Ee][Ss]\\[Cc][Ll][Ss][Ii][Dd]\\\{7[Cc]857801-7381-11[Cc][Ff]-884[Dd]-00[Aa][Aa]004[Bb]2[Ee]24\}\\[Ii][Nn][Pp][Rr][Oo][Cc][Ss][Ee][Rr][Vv][Ee][Rr]32.*/ OR data_win_eventdata_commandLine:/.*[Hh][Kk][Ee][Yy]_[Ll][Oo][Cc][Aa][Ll]_[Mm][Aa][Cc][Hh][Ii][Nn][Ee]\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Cc][Ll][Aa][Ss][Ss][Ee][Ss]\\[Cc][Ll][Ss][Ii][Dd]\\\{[Cc][Ff]4[Cc][Cc]405-[Ee]2[Cc]5-4[Dd][Dd][Dd]-[Bb]3[Cc][Ee]-5[Ee]7582[Dd]8[Cc]9[Ff][Aa]\}\\[Ii][Nn][Pp][Rr][Oo][Cc][Ss][Ee][Rr][Vv][Ee][Rr]32.*/)))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: ad7085ac-92e4-4b76-8ce2-276d2c0e68ef
    name: CVE-2021-31979 CVE-2021-33771 Exploits by Sourgum
    reason: 'Same SOURGUM toolset: file creation of physmem.sys and the IME DLLs is the drop step right before these execution/registry behaviours.'
  - id: windows-com-hijacking-inprocserver32-001
    name: Windows COM Hijacking InprocServer32 Modification
    reason: SOURGUM hijacks InprocServer32 of specific CLSIDs via reg add; generic COM hijack detection corroborates it.
  - id: 790317c0-0a36-4a6a-a105-6e576bf99a14
    name: COM Object Hijacking Via Modification Of Default System CLSID Default Value
    reason: Modification of default system CLSID values is the registry-side outcome of the COM hijack.
  - id: dc5c24af-6995-49b2-86eb-a9ff62199e82
    name: COM Hijacking via TreatAs
    reason: TreatAs is an alternate COM hijack path for the same persistence goal.
  - id: 863218bd-c7d0-4c52-80cd-0a96c09f54af
    name: Arbitrary File Download Via IMEWDBLD.EXE
    reason: imewdbld.exe lives in the System32\IME area SOURGUM abuses; its download abuse is a sibling LOLBin behaviour on such hosts.
  - id: 431a1fdb-4799-4f3b-91c3-a683b003fc49
    name: New Kernel Driver Via SC.EXE
    reason: physmem.sys is a kernel driver; a kernel service created via sc.exe is how it would be loaded.
  - id: 2c4523d5-d481-4ed0-8ec3-7fbf0cb41a75
    name: Driver Load From A Temporary Directory
    reason: Drivers loaded from unexpected locations match the physmem.sys kernel-driver step.
  - id: a2ea3ae7-d3d0-40a0-a55c-25a45c87cac1
    name: Suspicious Driver Install by pnputil.exe
    reason: pnputil driver installation is another path to get the physmem.sys driver loaded.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: 'SOURGUM file drops: physmem.sys and IME DLLs'
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*([Pp][Hh][Yy][Ss][Mm][Ee][Mm]\.[Ss][Yy][Ss]|[Ii][Mm][Jj][Pp][Uu][Ee][Aa][Cc][Tt]\.[Dd][Ll][Ll]|[Ii][Mm][Tt][Cc][Pp][Rr][Oo][Tt]\.[Dd][Ll][Ll]|[Ii][Mm][Ee][Cc][Pp][Mm][Ee][Ii][Dd]\.[Dd][Ll][Ll]).*/
    pivot_on: host
    window: 6h
  - name: 'Kernel driver loaded: physmem.sys or unsigned driver'
    query: data_win_system_eventID:"6" AND (data_win_eventdata_imageLoaded:/.*[Pp][Hh][Yy][Ss][Mm][Ee][Mm]\.[Ss][Yy][Ss].*/ OR data_win_eventdata_signed:"false")
    pivot_on: host
    window: 6h
  - name: InprocServer32 COM hijack of the IME CLSIDs or to writable paths
    query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*\\[Cc][Ll][Ss][Ii][Dd]\\\{7[Cc]857801-7381-11[Cc][Ff]-884[Dd]-00[Aa][Aa]004[Bb]2[Ee]24\}\\[Ii][Nn][Pp][Rr][Oo][Cc][Ss][Ee][Rr][Vv][Ee][Rr]32.*/ OR data_win_eventdata_targetObject:/.*\\[Cc][Ll][Ss][Ii][Dd]\\\{[Cc][Ff]4[Cc][Cc]405-[Ee]2[Cc]5-4[Dd][Dd][Dd]-[Bb]3[Cc][Ee]-7582[Dd]8[Cc]9[Ff][Aa]\}\\[Ii][Nn][Pp][Rr][Oo][Cc][Ss][Ee][Rr][Vv][Ee][Rr]32.*/ OR (data_win_eventdata_targetObject:/.*[Ii][Nn][Pp][Rr][Oo][Cc][Ss][Ee][Rr][Vv][Ee][Rr]32.*/ AND data_win_eventdata_details:/.*(\\[Uu][Ss][Ee][Rr][Ss]\\|\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\|\\[Tt][Ee][Mm][Pp]\\).*/))
    pivot_on: host
    window: 6h
  - name: Kernel driver service creation via sc.exe or Services ImagePath
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee].*/ AND data_win_eventdata_commandLine:/.*[Kk][Ee][Rr][Nn][Ee][Ll].*/) OR (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\.*/ AND data_win_eventdata_targetObject:/.*[Ii][Mm][Aa][Gg][Ee][Pp][Aa][Tt][Hh].*/ AND data_win_eventdata_details:/.*\.[Ss][Yy][Ss].*/)
    pivot_on: host
    window: 6h
  - name: LSASS access after foothold (credential theft by implant)
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee].*/
    pivot_on: host
    window: 6h
