name: Suspicious Service DACL Modification Via Set-Service Cmdlet
id: a95b9b42-1308-4735-a1af-abb1c5e6f5ac
version: 1
schema_version: "1.0"
date: "2022-10-18"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: a95b9b42-1308-4735-a1af-abb1c5e6f5ac
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious DACL modifications via the "Set-Service" cmdlet using the
  "SecurityDescriptorSddl" flag (Only available with PowerShell 7) that can be
  used to hide services or make them unstopable. MITRE ATT&CK: T1543.003.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\pwsh.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "pwsh.dll"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-SecurityDescriptorSddl *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-sd *"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*Set-Service *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*D;;*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*;;;IU*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*;;;SU*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*;;;BA*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*;;;SY*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*;;;WD*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\pwsh.exe'; data_win_eventdata_originalFileName equals 'pwsh.dll';
  data_win_eventdata_commandLine matches '*-SecurityDescriptorSddl *', among
  other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.sans.org/blog/red-team-tactics-hiding-windows-services/
  - https://learn.microsoft.com/pt-br/windows/win32/secauthz/sid-strings
  - https://attack.mitre.org/techniques/T1543/003/

response:
  message: >
    Suspicious Service DACL Modification Via Set-Service Cmdlet detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1543.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1543.003
  custom_tags:
    - service
    - cmdlet
    - process_creation
    - sysmon
    - privilege_escalation
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Pp][Ww][Ss][Hh]\.[Dd][Ll][Ll]/) AND (data_win_eventdata_commandLine:/.*-[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy][Dd][Ee][Ss][Cc][Rr][Ii][Pp][Tt][Oo][Rr][Ss][Dd][Dd][Ll] .*/ OR data_win_eventdata_commandLine:/.*-[Ss][Dd] .*/) AND data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Ss][Ee][Rr][Vv][Ii][Cc][Ee] .*/ AND data_win_eventdata_commandLine:/.*[Dd];;.*/ AND (data_win_eventdata_commandLine:/.*;;;[Ii][Uu].*/ OR data_win_eventdata_commandLine:/.*;;;[Ss][Uu].*/ OR data_win_eventdata_commandLine:/.*;;;[Bb][Aa].*/ OR data_win_eventdata_commandLine:/.*;;;[Ss][Yy].*/ OR data_win_eventdata_commandLine:/.*;;;[Ww][Dd].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 22d80745-6f2c-46da-826b-77adaededd74
    name: Suspicious Service DACL Modification Via Set-Service Cmdlet - PS
    reason: Same Set-Service -SecurityDescriptorSddl tampering seen in PowerShell script-block logging; confirms the full SDDL string and any script wrapper.
  - id: 514e4c3a-c77d-4cde-a00f-046425e2301e
    name: Abuse of Service Permissions to Hide Services Via Set-Service
    reason: Sibling Set-Service rule for hiding services via DACL abuse; co-fires when the same technique is used with different flag spelling.
  - id: 953945c5-22fe-4a92-9f8a-a9edc1e522da
    name: Abuse of Service Permissions to Hide Services Via Set-Service - PS
    reason: Script-block variant of hiding services through Set-Service; shows whether this was driven by a larger script.
  - id: a537cfc3-4297-4789-92b5-345bfd845ad0
    name: Service DACL Abuse To Hide Services Via Sc.EXE
    reason: Attacker may use sc.exe sdset with the same hiding DACL on other services; same intent via the native binary.
  - id: 98c5aeef-32d5-492f-b174-64a691896d25
    name: Service Security Descriptor Tampering Via Sc.EXE
    reason: Generic service security-descriptor tampering via sc.exe; adjacent attempts to change who can stop or see a service.
  - id: 99cf1e02-00fb-4c0d-8375-563f978dfd37
    name: Deny Service Access Using Security Descriptor Tampering Via Sc.EXE
    reason: Deny ACEs on a service make it unstoppable for admins; typical goal of the DACL change that just fired.
  - id: 17a1be64-8d88-40bf-b5ff-a4f7a50ebcc8
    name: Suspicious New Service Creation
    reason: A malicious service is typically created first and then hidden; precursor service creation with a suspicious launcher.
  - id: 62b20d44-1546-4e61-afce-8e175eb9473c
    name: Service StartupType Change Via PowerShell Set-Service
    reason: Set-Service is also used to change startup type to keep the service persistent after hiding it.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Service creation preceding the DACL change
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\[Ss][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee].*/) OR data_win_eventdata_commandLine:/.*[Nn]ew-[Ss]ervice.*/)
    pivot_on: host
    window: 4h
  - name: Service control and SDDL changes via sc.exe
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss][Cc]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*[Ss][Dd][Ss][Ee][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ss][Dd][Ss][Hh][Oo][Ww].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Nn][Ff][Ii][Gg].*/)
    pivot_on: host
    window: 4h
  - name: Service installed in System log (7045)
    query: data_win_system_eventID:"7045" AND data_win_system_providerName:/[Ss]ervice [Cc]ontrol [Mm]anager/
    pivot_on: host
    window: 24h
  - name: Service registry key ImagePath and Security writes
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Ss]ervices\\.*/ AND (data_win_eventdata_targetObject:/.*\\[Ii]mage[Pp]ath/ OR data_win_eventdata_targetObject:/.*\\[Ss]ecurity/)
    pivot_on: host
    window: 6h
  - name: PowerShell 7 and encoded launches by the same user
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Pp]wsh\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.* -[Ee]nc.*/)
    pivot_on: user
    window: 2h
