name: Windows Winhlp32 Spawning a Process
id: windows-winhlp32-spawning-process-001
version: 1
schema_version: "1.0"
date: "2026-02-23"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects winhlp32.exe spawning child processes where winhlp32.exe is running 
  from a suspicious location (appdata, programdata, temp). Winhlp32.exe has 
  known vulnerabilities and is exploited by Remcos RAT and other malware to 
  execute malicious code from user-writable directories.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - wildcard:
            data_win_eventdata_parentImage: "*\\\\winhlp32.exe"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_parentImage: "*\\\\appdata\\\\*"
              - wildcard:
                  data_win_eventdata_parentImage: "*\\\\programdata\\\\*"
              - wildcard:
                  data_win_eventdata_parentImage: "*\\\\temp\\\\*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-23 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-23 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Windows endpoints with Sysmon 
  installed and configured to log process creation events (EventID 1) with full 
  command-line arguments and parent process tracking.

known_false_positives: >
  Very low false positive rate as winhlp32.exe is rarely used in modern Windows. 
  Any instance of winhlp32.exe running from temp or appdata directories is highly 
  suspicious and warrants investigation.

references:
  - https://attack.mitre.org/techniques/T1055/
  - https://www.exploit-db.com/exploits/16541
  - https://www.virustotal.com/gui/file/cb77b93150cb0f7fe65ce8a7e2a5781e727419451355a7736db84109fa215a89

response:
  message: >
    winhlp32.exe spawned process from suspicious location on $agent_name$. 
    Parent: $data_win_eventdata_parentImage$. 
    Child: $data_win_eventdata_image$. 
    Command: $data_win_eventdata_commandLine$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1055
  risk_score: 72
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 72
  threat_objects: []

tags:
  analytic_story:
    - Remcos
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1055
  custom_tags:
    - lolbin
    - process_injection
    - winhlp32
    - suspicious_parent
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*winhlp32\.exe/ AND (data_win_eventdata_parentImage:/.*appdata.*/ OR data_win_eventdata_parentImage:/.*programdata.*/ OR data_win_eventdata_parentImage:/.*temp.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 3dfd06d2-eaf4-4532-9555-68aca59f57c4
    name: Process Execution From A Potentially Suspicious Folder
    reason: A winhlp32 copy running from AppData/Temp is itself suspicious-folder execution, usually the dropped loader.
  - id: 15b75071-74cc-47e0-b4c6-b43744a62a2b
    name: Suspicious Process Start Locations
    reason: Same masquerading-binary-in-user-path theme, flags the parent image earlier in the chain.
  - id: 799a5f48-0ac1-4e0f-9152-71d137d48c2a
    name: Abusable DLL Potential Sideloading From Suspicious Location
    reason: A legitimate-named binary beside a malicious DLL is how winhlp32 is abused to run malware.
  - id: 66d31e5f-52d6-40a4-9615-002d3789a119
    name: Remote Thread Creation By Uncommon Source Image
    reason: 'The rule''s injection angle: a winhlp32 child is often followed by remote-thread creation in other processes.'
  - id: 02ee49e2-e294-4d0f-9278-f5b3212fc588
    name: New RUN Key Pointing to Suspicious Folder
    reason: Remcos persists via a Run key pointing at the same user-writable folder.
  - id: b6676963-0353-4f88-90f5-36c20d443c6a
    name: Cscript/Wscript Potentially Suspicious Child Process
    reason: Remcos delivery chains commonly start with script hosts before the dropped loader.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Child processes of winhlp32
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Ww][Ii][Nn][Hh][Ll][Pp]32\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 6h
  - name: Winhlp32 runs outside the Windows directory
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Ww][Ii][Nn][Hh][Ll][Pp]32\.[Ee][Xx][Ee]/ AND NOT data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\.*/
    pivot_on: host
    window: 24h
  - name: DLLs loaded from user-writable paths
    query: data_win_system_eventID:"7" AND (data_win_eventdata_imageLoaded:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Tt][Ee][Mm][Pp]\\.*/)
    pivot_on: host
    window: 6h
  - name: Remote thread creation and full-access process handles
    query: data_win_system_eventID:"8" OR (data_win_system_eventID:"10" AND (data_win_eventdata_grantedAccess:/.*0[Xx]1[Ff][Ff][Ff][Ff][Ff].*/ OR data_win_eventdata_grantedAccess:/.*0[Xx]1[Ff]3[Ff][Ff][Ff].*/))
    pivot_on: host
    window: 4h
  - name: Run keys pointing at user-writable paths
    query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/) AND (data_win_eventdata_details:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_details:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_details:/.*\\[Tt][Ee][Mm][Pp]\\.*/)
    pivot_on: host
    window: 6h
