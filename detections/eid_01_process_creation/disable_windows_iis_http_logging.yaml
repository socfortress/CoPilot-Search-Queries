name: Disable Windows IIS HTTP Logging
id: e4ed6030-ffe5-4e6a-8a8a-ab3c1ab9d94e
version: 1
schema_version: "1.0"
date: "2023-01-22"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: e4ed6030-ffe5-4e6a-8a8a-ab3c1ab9d94e
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Disables HTTP logging on a Windows IIS web server as seen by Threat Group 3390
  (Bronze Union). MITRE ATT&CK: T1685.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\appcmd.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "appcmd.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*set*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*config*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*section:httplogging*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*dontLog:true*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\appcmd.exe'; data_win_eventdata_originalFileName equals 'appcmd.exe';
  data_win_eventdata_commandLine matches '*set*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1562.002/T1562.002.md#atomic-test-1---disable-windows-iis-http-logging
  - https://attack.mitre.org/techniques/T1685/001/

response:
  message: >
    Disable Windows IIS HTTP Logging detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1685.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685.001
  custom_tags:
    - disable
    - logging
    - process_creation
    - sysmon
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Aa][Pp][Pp][Cc][Mm][Dd]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Ss][Ee][Tt].*/ AND data_win_eventdata_commandLine:/.*[Cc][Oo][Nn][Ff][Ii][Gg].*/ AND data_win_eventdata_commandLine:/.*[Ss][Ee][Cc][Tt][Ii][Oo][Nn]:[Hh][Tt][Tt][Pp][Ll][Oo][Gg][Gg][Ii][Nn][Gg].*/ AND data_win_eventdata_commandLine:/.*[Dd][Oo][Nn][Tt][Ll][Oo][Gg]:[Tt][Rr][Uu][Ee].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 0649be4a-aeb0-45b0-b89e-7f1668f6d9c0
    name: IIS WebServer Log Deletion via CommandLine Utilities
    reason: Log deletion is the companion anti-forensic step after HTTP logging is turned off on the same IIS server.
  - id: 7c8af9b2-dcae-41a2-a9db-b28c288b5f08
    name: Suspicious IIS URL GlobalRules Rewrite Via AppCmd
    reason: Attacker with appcmd access typically also rewrites IIS config (URL rules) to hide or redirect traffic.
  - id: 043c4b8b-3a54-4780-9682-081cb6b8185c
    name: Suspicious IIS Module Registration
    reason: Malicious IIS module registration is the persistence step the attacker hides by disabling logging.
  - id: 9465ddf4-f9e4-4ebd-8d98-702df3a93239
    name: IIS Native-Code Module Command Line Installation
    reason: Native-code IIS module install via CLI often follows or precedes logging being blinded.
  - id: bed2a484-9348-4143-8a8a-b801c979301c
    name: Webshell Detection With Command Line Keywords
    reason: Webshell command-line activity on the IIS host is the likely reason logging was disabled.
  - id: 4ebc877f-4612-45cb-b3a5-8e3834db36c9
    name: Webshell Hacking Activity Patterns
    reason: Webshell hacking patterns (whoami, net, recon from w3wp) precede or follow log tampering.
  - id: 2d3cdeec-c0db-45b4-aa86-082f7eb75701
    name: Microsoft IIS Service Account Password Dumped
    reason: IIS service account password dumping is a typical post-compromise action on the same server.
  - id: cc36992a-4671-4f21-a91d-6c2b72a2edf5
    name: Suspicious Eventlog Clearing or Configuration Change Activity
    reason: Eventlog clearing/config change extends the same log-blinding effort to Windows logs.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: IIS worker process spawning shells/recon
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Ww]3wp\.exe/ AND data_win_eventdata_image:(/.*[Cc]md\.exe/ OR /.*[Pp]ower[Ss]hell.*/ OR /.*[Ww]hoami\.exe/ OR /.*[Nn]et1?\.exe/)
    pivot_on: host
    window: 4h
  - name: Other appcmd IIS configuration changes
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*[Aa]ppcmd.*/ AND data_win_eventdata_commandLine:/.*(set|add|install|delete).*/
    pivot_on: host
    window: 24h
  - name: IIS log file deletion or tampering
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ll]og[Ff]iles.*/ OR /.*inetpub.*[Ll]ogs.*/) AND data_win_eventdata_commandLine:/.*(del|Remove-Item|rm |erase).*/
    pivot_on: host
    window: 6h
  - name: Files dropped into IIS web roots
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*inetpub.*wwwroot.*\.(aspx|asp|ashx|php|config|dll).*/
    pivot_on: host
    window: 6h
  - name: Eventlog clearing on the host
    query: data_win_system_eventID:1102 OR (data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*wevtutil.*(cl|clear-log).*/)
    pivot_on: host
    window: 6h
