name: Potential DLL Injection Or Execution Using Tracker.exe
id: 148431ce-4b70-403d-8525-fcc2993f29ea
version: 1
schema_version: "1.0"
date: "2023-01-09"
author: Avneet Singh @v3t0_, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 148431ce-4b70-403d-8525-fcc2993f29ea
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential DLL injection and execution using "Tracker.exe". MITRE
  ATT&CK: T1055.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\tracker.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_description:
                    value: "Tracker"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /d *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /c *"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_commandLine"
        - exists:
            field: "data_win_eventdata_parentImage"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* /ERRORREPORT:PROMPT *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_parentImage:
                          value: "*\\\\Msbuild\\\\Current\\\\Bin\\\\MSBuild.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_parentImage:
                          value: "*\\\\Msbuild\\\\Current\\\\Bin\\\\amd64\\\\MSBuild.exe"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_description
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\tracker.exe'; data_win_eventdata_description equals 'Tracker';
  data_win_eventdata_commandLine matches '* /d *', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://lolbas-project.github.io/lolbas/OtherMSBinaries/Tracker/
  - https://attack.mitre.org/techniques/T1055/001/

response:
  message: >
    Potential DLL Injection Or Execution Using Tracker.exe detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_description: $data_win_eventdata_description$.
    MITRE ATT&CK: T1055.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_description
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1055.001
  custom_tags:
    - injection
    - tracker
    - process_creation
    - sysmon
    - privilege_escalation
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Tt][Rr][Aa][Cc][Kk][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_description:/[Tt][Rr][Aa][Cc][Kk][Ee][Rr]/) AND (data_win_eventdata_commandLine:/.* \/[Dd] .*/ OR data_win_eventdata_commandLine:/.* \/[Cc] .*/) AND _exists_:data_win_eventdata_commandLine AND _exists_:data_win_eventdata_parentImage AND NOT (data_win_eventdata_commandLine:/.* \/[Ee][Rr][Rr][Oo][Rr][Rr][Ee][Pp][Oo][Rr][Tt]:[Pp][Rr][Oo][Mm][Pp][Tt] .*/ OR data_win_eventdata_parentImage:/.*\\[Mm][Ss][Bb][Uu][Ii][Ll][Dd]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt]\\[Bb][Ii][Nn]\\[Mm][Ss][Bb][Uu][Ii][Ll][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Mm][Ss][Bb][Uu][Ii][Ll][Dd]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt]\\[Bb][Ii][Nn]\\[Aa][Mm][Dd]64\\[Mm][Ss][Bb][Uu][Ii][Ll][Dd]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 4782eb5a-a513-4523-a0ac-f3082b26ac5c
    name: Mshtml.DLL RunHTMLApplication Suspicious Usage
    reason: Another signed-LOLBin proxy execution technique used in similar operator toolkits.
  - id: 213b3148-24ea-11ec-93a2-acde48001122
    name: MSBuild Suspicious Spawned By Script Process
    reason: Tracker.exe ships with the MSBuild/VS toolchain; sibling build-tool abuse for code execution.
  - id: 33be4333-2c6b-44f4-ae28-102cdbde0a31
    name: Suspicious Msbuild Execution By Uncommon Parent Process
    reason: Co-located Visual Studio build tool abuse on the same host.
  - id: 0f6da907-5854-4be6-859a-e9958747b0aa
    name: Potential DLL Injection Via AccCheckConsole
    reason: Same class of signed dev-tool DLL injection LOLBin.
  - id: 4f73421b-5a0b-4bbf-a892-5a7fb99bea66
    name: Mavinject Inject DLL Into Running Process
    reason: Alternative signed-binary DLL injection an operator may try next.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Tracker or MSBuild on hosts without dev tooling
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*\\(tracker|msbuild)\.exe/
    pivot_on: host
    window: 4h
  - name: DLL created in user-writable path before injection
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\\(Temp|AppData|Public|Downloads|ProgramData)\\.*\.dll/
    pivot_on: host
    window: 2h
  - name: Tracker spawned by script or Office parents
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*\\tracker\.exe/ AND data_win_eventdata_parentImage:/.*\\(cmd|powershell|wscript|cscript|mshta|winword|excel)\.exe/
    pivot_on: host
    window: 4h
  - name: Other signed-binary DLL loaders
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(mavinject|rundll32|regsvr32).*\.dll.*/
    pivot_on: host
    window: 4h
