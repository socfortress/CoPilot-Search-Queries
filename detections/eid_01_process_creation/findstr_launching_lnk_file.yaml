name: Findstr Launching .lnk File
id: 33339be3-148b-4e16-af56-ad16ec6c7e7b
version: 1
schema_version: "1.0"
date: "2024-01-15"
author: Trent Liffick
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 33339be3-148b-4e16-af56-ad16ec6c7e7b
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects usage of findstr to identify and execute a lnk file as seen within the
  HHS redirect attack. MITRE ATT&CK: T1036, T1202, T1027.003.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\find.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\findstr.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "FIND.EXE"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "FINDSTR.EXE"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.lnk"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.lnk\""
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.lnk'"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\find.exe'; data_win_eventdata_image matches '*\findstr.exe';
  data_win_eventdata_originalFileName equals 'FIND.EXE', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.bleepingcomputer.com/news/security/hhsgov-open-redirect-used-by-coronavirus-phishing-to-spread-malware/
  - https://attack.mitre.org/techniques/T1036/
  - https://attack.mitre.org/techniques/T1202/
  - https://attack.mitre.org/techniques/T1027/003/

response:
  message: >
    Findstr Launching .lnk File detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1036, T1202, T1027.003
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1036
    - T1202
    - T1027.003
  custom_tags:
    - findstr
    - launching
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ff][Ii][Nn][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ff][Ii][Nn][Dd][Ss][Tt][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ff][Ii][Nn][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ff][Ii][Nn][Dd][Ss][Tt][Rr]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*\.[Ll][Nn][Kk]/ OR data_win_eventdata_commandLine:/.*\.[Ll][Nn][Kk]\"/ OR data_win_eventdata_commandLine:/.*\.[Ll][Nn][Kk]'/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 1f32d820-1d5c-43fe-8fe2-feef0c952eb7
    name: Emotet Loader Execution Via .LNK File
    reason: Emotet-style loaders also arrive via .LNK launching a shell; same lure-to-loader chain after findstr abuse.
  - id: cea72823-df4d-4567-950c-0b579eaf0846
    name: Potential Dropper Script Execution Via WScript/CScript/MSHTA
    reason: Findstr-extracted LNK/script payloads commonly hand off to wscript/cscript/mshta droppers.
  - id: a0873b32-5b68-11eb-ae93-0242ac130002
    name: Detect mshta inline hta execution
    reason: LNK-driven chains frequently pivot to inline mshta HTA execution as the next stage.
  - id: 4aa5d062-e893-11eb-9eb2-acde48001122
    name: Mshta spawning Rundll32 OR Regsvr32 Process
    reason: mshta spawning rundll32/regsvr32 is a typical follow-on loading the real payload.
  - id: de587dce-915e-4218-aac4-835ca6af6f70
    name: Potential Persistence Attempt Via Run Keys Using Reg.EXE
    reason: Run-key persistence by the dropped payload is the usual next step after execution.
  - id: 6e5a3ae4-90a3-462d-9aa6-0119f638c0f1
    name: Hiding Files And Directories With Attrib exe
    reason: Droppers hide the disguised LNK/payload files with attrib after staging.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Findstr or Find running with LNK or script arguments
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Ff]ind(str)?\.exe/ AND data_win_eventdata_commandLine:/.*\.([Ll][Nn][Kk]|[Hh][Tt][Aa]|[Jj][Ss]|[Vv][Bb][Ss]).*/
    pivot_on: host
    window: 2h
  - name: Script hosts or LOLBins spawned from cmd/find chain
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*\\(mshta|wscript|cscript|rundll32|regsvr32|powershell)\.exe/ AND data_win_eventdata_parentImage:/.*\\(cmd|find|findstr)\.exe/
    pivot_on: host
    window: 2h
  - name: LNK files created in user-writable paths
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\.[Ll][Nn][Kk]/ AND data_win_eventdata_targetFilename:/.*(Temp|Downloads|AppData|Public).*/
    pivot_on: host
    window: 4h
  - name: Outbound connections from script hosts or rundll32
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*\\(mshta|wscript|cscript|rundll32|powershell)\.exe/ AND data_win_eventdata_initiated:true
    pivot_on: host
    window: 2h
  - name: Run key persistence writes
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*CurrentVersion\\Run.*/
    pivot_on: host
    window: 6h
