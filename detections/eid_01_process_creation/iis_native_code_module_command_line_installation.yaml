name: IIS Native-Code Module Command Line Installation
id: 9465ddf4-f9e4-4ebd-8d98-702df3a93239
version: 1
schema_version: "1.0"
date: "2024-03-13"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 9465ddf4-f9e4-4ebd-8d98-702df3a93239
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious IIS native-code module installations via command line.
  MITRE ATT&CK: T1505.003.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\appcmd.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "appcmd.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*install*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*module*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-name:*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*/name:*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*–name:*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*—name:*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*―name:*"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_parentImage"
        - bool:
            must_not:
              - term:
                  data_win_eventdata_parentImage:
                    value: "C:\\Windows\\System32\\inetsrv\\iissetup.exe"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\appcmd.exe'; data_win_eventdata_originalFileName equals 'appcmd.exe';
  data_win_eventdata_commandLine matches '*install*', among other conditions.

known_false_positives: >
  Unknown as it may vary from organisation to organisation how admins use to
  install IIS modules. Baseline expected activity in your environment and tune
  this detection before relying on it for automated response.

references:
  - https://researchcenter.paloaltonetworks.com/2018/01/unit42-oilrig-uses-rgdoor-iis-backdoor-targets-middle-east/
  - https://www.microsoft.com/security/blog/2022/07/26/malicious-iis-extensions-quietly-open-persistent-backdoors-into-servers/
  - https://attack.mitre.org/techniques/T1505/003/

response:
  message: >
    IIS Native-Code Module Command Line Installation detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1505.003
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1505.003
  custom_tags:
    - native
    - module
    - installation
    - process_creation
    - sysmon
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Aa][Pp][Pp][Cc][Mm][Dd]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Ii][Nn][Ss][Tt][Aa][Ll][Ll].*/ AND data_win_eventdata_commandLine:/.*[Mm][Oo][Dd][Uu][Ll][Ee].*/ AND (data_win_eventdata_commandLine:/.*-[Nn][Aa][Mm][Ee]:.*/ OR data_win_eventdata_commandLine:/.*\/[Nn][Aa][Mm][Ee]:.*/ OR data_win_eventdata_commandLine:/.*–[Nn][Aa][Mm][Ee]:.*/ OR data_win_eventdata_commandLine:/.*—[Nn][Aa][Mm][Ee]:.*/ OR data_win_eventdata_commandLine:/.*―[Nn][Aa][Mm][Ee]:.*/) AND _exists_:data_win_eventdata_parentImage AND NOT (data_win_eventdata_parentImage:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ii][Nn][Ee][Tt][Ss][Rr][Vv]\\[Ii][Ii][Ss][Ss][Ee][Tt][Uu][Pp]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 043c4b8b-3a54-4780-9682-081cb6b8185c
    name: Suspicious IIS Module Registration
    reason: Suspicious IIS module registration is the same backdoor-module technique via other command shapes.
  - id: windows-iis-components-add-new-module-001
    name: Windows IIS Components Add New Module
    reason: Add-new-module activity on IIS components; same persistence goal.
  - id: 7c8af9b2-dcae-41a2-a9db-b28c288b5f08
    name: Suspicious IIS URL GlobalRules Rewrite Via AppCmd
    reason: AppCmd abuse to rewrite IIS config often accompanies backdoor module install.
  - id: e4ed6030-ffe5-4e6a-8a8a-ab3c1ab9d94e
    name: Disable Windows IIS HTTP Logging
    reason: Attackers disable IIS HTTP logging after installing a module to hide traffic.
  - id: 0649be4a-aeb0-45b0-b89e-7f1668f6d9c0
    name: IIS WebServer Log Deletion via CommandLine Utilities
    reason: IIS log deletion is common cleanup after module backdoor deployment.
  - id: 2d3cdeec-c0db-45b4-aa86-082f7eb75701
    name: Microsoft IIS Service Account Password Dumped
    reason: IIS service account password dumping via appcmd is an adjacent step on a compromised IIS server.
  - id: bed2a484-9348-4143-8a8a-b801c979301c
    name: Webshell Detection With Command Line Keywords
    reason: A webshell on the IIS server is the usual precursor providing the execution to run appcmd.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Web worker spawning shells (webshell precursor)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ww]3[Ww][Pp]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Hh][Oo][Aa][Mm][Ii]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Nn][Ee][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/)
    pivot_on: host
    window: 24h
  - name: Other appcmd.exe activity
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Cc][Mm][Dd]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 6h
  - name: DLLs written to inetsrv, inetpub or Temp
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.[Dd][Ll][Ll].*/ AND (data_win_eventdata_targetFilename:/.*\\[Ii][Nn][Ee][Tt][Ss][Rr][Vv]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Ii][Nn][Ee][Tt][Pp][Uu][Bb]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/)
    pivot_on: host
    window: 24h
  - name: w3wp outbound network connections
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\[Ww]3[Ww][Pp]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 6h
