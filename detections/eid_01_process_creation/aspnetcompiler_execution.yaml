name: AspNetCompiler Execution
id: a01b8329-5953-4f73-ae2d-aa01e1f35f00
version: 1
schema_version: "1.0"
date: "2025-02-24"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: a01b8329-5953-4f73-ae2d-aa01e1f35f00
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of "aspnet_compiler.exe" which can be abused to compile and
  execute C# code. MITRE ATT&CK: T1127.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*:\\\\Windows\\\\Microsoft.NET\\\\Framework\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*:\\\\Windows\\\\Microsoft.NET\\\\Framework64\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*:\\\\Windows\\\\Microsoft.NET\\\\FrameworkArm\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*:\\\\Windows\\\\Microsoft.NET\\\\FrameworkArm64\\\\*"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\aspnet_compiler.exe"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*:\Windows\Microsoft.NET\Framework\*'; data_win_eventdata_image matches
  '*:\Windows\Microsoft.NET\Framework64\*'; data_win_eventdata_image matches
  '*:\Windows\Microsoft.NET\FrameworkArm\*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://lolbas-project.github.io/lolbas/Binaries/Aspnet_Compiler/
  - https://ijustwannared.team/2020/08/01/the-curious-case-of-aspnet_compiler-exe/
  - https://attack.mitre.org/techniques/T1127/

response:
  message: >
    AspNetCompiler Execution detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1127
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1127
  custom_tags:
    - aspnetcompiler
    - process_creation
    - sysmon
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\.[Nn][Ee][Tt]\\[Ff][Rr][Aa][Mm][Ee][Ww][Oo][Rr][Kk]\\.*/ OR data_win_eventdata_image:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\.[Nn][Ee][Tt]\\[Ff][Rr][Aa][Mm][Ee][Ww][Oo][Rr][Kk]64\\.*/ OR data_win_eventdata_image:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\.[Nn][Ee][Tt]\\[Ff][Rr][Aa][Mm][Ee][Ww][Oo][Rr][Kk][Aa][Rr][Mm]\\.*/ OR data_win_eventdata_image:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\.[Nn][Ee][Tt]\\[Ff][Rr][Aa][Mm][Ee][Ww][Oo][Rr][Kk][Aa][Rr][Mm]64\\.*/) AND data_win_eventdata_image:/.*\\[Aa][Ss][Pp][Nn][Ee][Tt]_[Cc][Oo][Mm][Pp][Ii][Ll][Ee][Rr]\.[Ee][Xx][Ee]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 9f50fe98-fe5c-4a2d-86c7-fad7f63ed622
    name: Potentially Suspicious ASP.NET Compilation Via AspNetCompiler
    reason: 'Same binary with suspicious arguments/paths: the stronger variant of this alert.'
  - id: 9ccba514-7cb6-4c5c-b377-700758f2f120
    name: Suspicious Child Process of AspNetCompiler
    reason: Compiled code launching children is the proof the LOLBin ran attacker code.
  - id: d80d5c81-04ba-45b4-84e4-92eba40e0ad3
    name: Arbitrary DLL or Csproj Code Execution Via Dotnet.EXE
    reason: Another .NET toolchain LOLBin used to compile/execute code and evade application control.
  - id: 850d55f9-6eeb-4492-ad69-a72338f65ba4
    name: C# IL Code Compilation Via Ilasm.EXE
    reason: Adjacent .NET compile-and-run LOLBin; operators chain these on the same host.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: aspnet_compiler launches on host
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Aa][Ss][Pp][Nn][Ee][Tt]_[Cc][Oo][Mm][Pp][Ii][Ll][Ee][Rr]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 24h
  - name: Children of aspnet_compiler
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Aa][Ss][Pp][Nn][Ee][Tt]_[Cc][Oo][Mm][Pp][Ii][Ll][Ee][Rr]\.[Ee][Xx][Ee].*/)
    pivot_on: host
    window: 4h
  - name: Network activity from aspnet_compiler
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*(\\[Aa][Ss][Pp][Nn][Ee][Tt]_[Cc][Oo][Mm][Pp][Ii][Ll][Ee][Rr]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 2h
  - name: Files written by aspnet_compiler
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*(\\[Aa][Ss][Pp][Nn][Ee][Tt]_[Cc][Oo][Mm][Pp][Ii][Ll][Ee][Rr]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 2h
  - name: Other .NET build LOLBins
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Mm][Ss][Bb][Uu][Ii][Ll][Dd]\.[Ee][Xx][Ee]|\\[Cc][Ss][Cc]\.[Ee][Xx][Ee]|\\[Vv][Bb][Cc]\.[Ee][Xx][Ee]|\\[Jj][Ss][Cc]\.[Ee][Xx][Ee]|\\[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Aa][Ss][Mm]\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Cc][Ss]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 4h
