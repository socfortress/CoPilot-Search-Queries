name: Filter Driver Unloaded Via Fltmc.EXE
id: 4931188c-178e-4ee7-a348-39e8a7a56821
version: 1
schema_version: "1.0"
date: "2025-10-07"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 4931188c-178e-4ee7-a348-39e8a7a56821
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detect filter driver unloading activity via fltmc.exe. MITRE ATT&CK: T1070,
  T1685, T1685.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\fltMC.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "fltMC.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*unload*"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_parentImage"
        - exists:
            field: "data_win_eventdata_commandLine"
        - bool:
            must_not:
              - bool:
                  should:
                    - bool:
                        must:
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_parentImage:
                                      value: "*\\\\AppData\\\\Local\\\\Temp\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_parentImage:
                                      value: "*:\\\\Windows\\\\Temp\\\\*"
                                      case_insensitive: true
                              minimum_should_match: 1
                          - wildcard:
                              data_win_eventdata_parentImage:
                                value: "*\\\\endpoint-protection-installer-x64.tmp"
                                case_insensitive: true
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_commandLine:
                                      value: "*unload rtp_filesystem_filter"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_commandLine:
                                      value: "*unload rtp_filter"
                                      case_insensitive: true
                              minimum_should_match: 1
                    - bool:
                        must:
                          - term:
                              data_win_eventdata_parentImage:
                                value: "C:\\Program Files (x86)\\ManageEngine\\uems_agent\\bin\\dcfaservice64.exe"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*unload DFMFilter"
                                case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\fltMC.exe'; data_win_eventdata_originalFileName equals 'fltMC.exe';
  data_win_eventdata_commandLine matches '*unload*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.darkoperator.com/blog/2018/10/5/operating-offensively-against-sysmon
  - https://www.cybereason.com/blog/threat-analysis-report-lockbit-2.0-all-paths-lead-to-ransom
  - https://attack.mitre.org/techniques/T1070/
  - https://attack.mitre.org/techniques/T1685/
  - https://attack.mitre.org/techniques/T1685/001/

response:
  message: >
    Filter Driver Unloaded Via Fltmc.EXE detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1070, T1685, T1685.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1070
    - T1685
    - T1685.001
  custom_tags:
    - filter
    - driver
    - unloaded
    - process_creation
    - sysmon
    - stealth
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ff][Ll][Tt][Mm][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ff][Ll][Tt][Mm][Cc]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Uu][Nn][Ll][Oo][Aa][Dd].*/ AND _exists_:data_win_eventdata_parentImage AND _exists_:data_win_eventdata_commandLine AND NOT (((data_win_eventdata_parentImage:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_parentImage:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/) AND data_win_eventdata_parentImage:/.*\\[Ee][Nn][Dd][Pp][Oo][Ii][Nn][Tt]-[Pp][Rr][Oo][Tt][Ee][Cc][Tt][Ii][Oo][Nn]-[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Ee][Rr]-[Xx]64\.[Tt][Mm][Pp]/ AND (data_win_eventdata_commandLine:/.*[Uu][Nn][Ll][Oo][Aa][Dd] [Rr][Tt][Pp]_[Ff][Ii][Ll][Ee][Ss][Yy][Ss][Tt][Ee][Mm]_[Ff][Ii][Ll][Tt][Ee][Rr]/ OR data_win_eventdata_commandLine:/.*[Uu][Nn][Ll][Oo][Aa][Dd] [Rr][Tt][Pp]_[Ff][Ii][Ll][Tt][Ee][Rr]/)) OR (data_win_eventdata_parentImage:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Mm][Aa][Nn][Aa][Gg][Ee][Ee][Nn][Gg][Ii][Nn][Ee]\\[Uu][Ee][Mm][Ss]_[Aa][Gg][Ee][Nn][Tt]\\[Bb][Ii][Nn]\\[Dd][Cc][Ff][Aa][Ss][Ee][Rr][Vv][Ii][Cc][Ee]64\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Uu][Nn][Ll][Oo][Aa][Dd] [Dd][Ff][Mm][Ff][Ii][Ll][Tt][Ee][Rr]/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 4d7cda18-1b12-4e52-b45c-d28653210df8
    name: Sysmon Driver Unloaded Via Fltmc.EXE
    reason: Specific case where the unloaded minifilter is Sysmon itself, blinding telemetry; confirms defence evasion.
  - id: 37db85d1-b089-490a-a59a-c7b6f984f480
    name: Sysmon Discovery Via Default Driver Altitude Using Findstr.EXE
    reason: Attackers enumerate filters/altitudes to find Sysmon before unloading it.
  - id: 4916a35e-bfc4-47d0-8e25-a003d7067061
    name: Sysmon Driver Altitude Change
    reason: Alternative way to disable the Sysmon filter driver, via registry altitude change.
  - id: fdb829a8-db84-4832-b64b-3e964cd44f01
    name: Windows Eventlog Cleared Via Wevtutil
    reason: Log clearing frequently accompanies telemetry-blinding to erase remaining traces.
  - id: 236e7c8e-c9d9-11eb-a824-acde48001122
    name: Disable Logs Using WevtUtil
    reason: Disabling event channels is a companion defence-evasion step.
  - id: 1444443e-6757-43e4-9ea4-c8fc705f79a2
    name: Boot Configuration Tampering Via Bcdedit.EXE
    reason: 'Ransomware-style prep: security tooling disabled, then boot recovery tampered.'
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Fltmc activity on host
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Ff]lt[Mm][Cc]\.exe/
    pivot_on: host
    window: 6h
  - name: Sysmon or EDR service stop attempts
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*(sc|net)(\.exe)? +(stop|config).*(sysmon|sense|defend|crowdstrike|csagent|sentinel|carbon).*/ OR data_win_eventdata_commandLine:/.*sysmon.* -u.*/)
    pivot_on: host
    window: 6h
  - name: Sysmon state change and config events
    query: data_win_system_eventID:(4 OR 16)
    pivot_on: host
    window: 6h
  - name: Defender tampering via PowerShell or registry
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*[Ss]et-[Mm]p[Pp]reference.*/ OR data_win_eventdata_commandLine:/.*DisableAntiSpyware.*/ OR data_win_eventdata_commandLine:/.*[Aa]dd-[Mm]p[Pp]reference.*[Ee]xclusion.*/)
    pivot_on: host
    window: 6h
  - name: Event log clearing
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Ww]evtutil\.exe/ AND (data_win_eventdata_commandLine:/.* cl .*/ OR data_win_eventdata_commandLine:/.*clear-log.*/)
    pivot_on: host
    window: 6h
