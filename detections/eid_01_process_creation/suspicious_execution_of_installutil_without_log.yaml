name: Suspicious Execution of InstallUtil Without Log
id: d042284c-a296-4988-9be5-f424fadcc28c
version: 1
schema_version: "1.0"
date: "2022-02-04"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: d042284c-a296-4988-9be5-f424fadcc28c
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Uses the .NET InstallUtil.exe application in order to execute image without
  log.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\InstallUtil.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_image:
              value: "*Microsoft.NET\\\\Framework*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*/logfile= *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*/LogToConsole=false*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\InstallUtil.exe'; data_win_eventdata_image matches
  '*Microsoft.NET\Framework*'; data_win_eventdata_commandLine matches
  '*/logfile= *', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://securelist.com/moonbounce-the-dark-side-of-uefi-firmware/105468/
  - https://learn.microsoft.com/en-us/dotnet/framework/tools/installutil-exe-installer-tool

response:
  message: >
    Suspicious Execution of InstallUtil Without Log detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - installutil
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\.[Nn][Ee][Tt]\\[Ff][Rr][Aa][Mm][Ee][Ww][Oo][Rr][Kk].*/ AND data_win_eventdata_commandLine:/.*\/[Ll][Oo][Gg][Ff][Ii][Ll][Ee]= .*/ AND data_win_eventdata_commandLine:/.*\/[Ll][Oo][Gg][Tt][Oo][Cc][Oo][Nn][Ss][Oo][Ll][Ee]=[Ff][Aa][Ll][Ss][Ee].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 75edd216-1939-4c73-8d61-7f3a0d85b5cc
    name: File Download Via InstallUtil.EXE
    reason: InstallUtil used as a downloader precedes executing a fetched .NET payload silently.
  - id: 72170ec5-f7d2-42f5-aefb-2b8be6aad15f
    name: Detect Regasm Spawning a Process
    reason: Regasm, Regsvcs and InstallUtil are the same .NET installer-LOLBin trio used for signed-binary proxy execution.
  - id: bc477b57-5c21-4ab6-9c33-668772e7f114
    name: Detect Regsvcs Spawning a Process
    reason: Sibling .NET LOLBin proxy; attackers pivot between them when one is blocked.
  - id: cc368ed0-2411-45dc-a222-510ace303cb2
    name: Potentially Suspicious Execution Of Regasm/Regsvcs From Uncommon Location
    reason: Same proxy-execution class run from staging directories.
  - id: 33be4333-2c6b-44f4-ae28-102cdbde0a31
    name: Suspicious Msbuild Execution By Uncommon Parent Process
    reason: MSBuild is another .NET framework LOLBin used to run attacker code, often staged by the same loader.
  - id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
    name: PowerShell Download and Execution Cradles
    reason: The .NET assembly invoked via InstallUtil is typically downloaded by a PowerShell cradle first.
  - id: 19b08b1c-861d-4e75-a1ef-ea0c1baf202b
    name: Suspicious Download Via Certutil.EXE
    reason: Certutil is a frequent alternate fetcher for the installer-class DLL before InstallUtil runs it.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Children of InstallUtil
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Ii]nstall[Uu]til\.exe/
    pivot_on: host
    window: 2h
  - name: Network connections from InstallUtil
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*[Ii]nstall[Uu]til\.exe/
    pivot_on: host
    window: 2h
  - name: Assembly drops by downloaders and shells
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\.(dll|exe)/ AND data_win_eventdata_image:/.*\\\\(powershell|pwsh|cmd|csc|certutil|bitsadmin)\.exe/
    pivot_on: host
    window: 2h
  - name: Other .NET LOLBin proxies
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*\\\\(RegAsm|RegSvcs|MSBuild|csc|jsc|vbc)\.exe/
    pivot_on: host
    window: 4h
  - name: Fetch and encoded-launch precursors
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*([Ii]nvoke-[Ww]eb[Rr]equest|[Dd]ownload[Ff]ile|[Dd]ownload[Ss]tring|[Cc]ertutil.*-urlcache|[Bb]itsadmin.*\/transfer).*/ OR data_win_eventdata_commandLine:/.* -[Ee]nc.*/)
    pivot_on: user
    window: 2h
