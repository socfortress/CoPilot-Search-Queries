name: Potential Conti Ransomware Database Dumping Activity Via SQLCmd
id: 2f47f1fd-0901-466e-a770-3b7092834a1b
version: 1
schema_version: "1.0"
date: "2023-05-04"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 2f47f1fd-0901-466e-a770-3b7092834a1b
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a command used by conti to dump database. MITRE ATT&CK: T1005.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\sqlcmd.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*sqlcmd *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*sqlcmd.exe*"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* -S localhost *"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*sys.sysprocesses*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*master.dbo.sysdatabases*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*BACKUP DATABASE*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\sqlcmd.exe'; data_win_eventdata_commandLine matches '*sqlcmd *';
  data_win_eventdata_commandLine matches '*sqlcmd.exe*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/vxunderground/status/1423336151860002816?s=20
  - https://www.virustotal.com/gui/file/03e9b8c2e86d6db450e5eceec057d7e369ee2389b9daecaf06331a95410aa5f8/detection
  - https://docs.microsoft.com/en-us/sql/tools/sqlcmd-utility?view=sql-server-ver15
  - https://attack.mitre.org/techniques/T1005/

response:
  message: >
    Potential Conti Ransomware Database Dumping Activity Via SQLCmd detected on
    host $agent_name$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. Matched data_win_eventdata_commandLine:
    $data_win_eventdata_commandLine$. MITRE ATT&CK: T1005
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1005
  custom_tags:
    - conti
    - ransomware
    - database
    - process_creation
    - sysmon
    - collection
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ss][Qq][Ll][Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Ss][Qq][Ll][Cc][Mm][Dd] .*/ OR data_win_eventdata_commandLine:/.*[Ss][Qq][Ll][Cc][Mm][Dd]\.[Ee][Xx][Ee].*/) AND data_win_eventdata_commandLine:/.* -[Ss] [Ll][Oo][Cc][Aa][Ll][Hh][Oo][Ss][Tt] .*/ AND (data_win_eventdata_commandLine:/.*[Ss][Yy][Ss]\.[Ss][Yy][Ss][Pp][Rr][Oo][Cc][Ee][Ss][Ss][Ee][Ss].*/ OR data_win_eventdata_commandLine:/.*[Mm][Aa][Ss][Tt][Ee][Rr]\.[Dd][Bb][Oo]\.[Ss][Yy][Ss][Dd][Aa][Tt][Aa][Bb][Aa][Ss][Ee][Ss].*/ OR data_win_eventdata_commandLine:/.*[Bb][Aa][Cc][Kk][Uu][Pp] [Dd][Aa][Tt][Aa][Bb][Aa][Ss][Ee].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 689308fc-cfba-4f72-9897-796c1dc61487
    name: Potential Conti Ransomware Activity
    reason: 'Same Conti playbook: database dump is staged alongside Conti-style recon/execution on the host'
  - id: aa92fd02-09f2-48b0-8a93-864813fb8f41
    name: Conti NTDS Exfiltration Command
    reason: Conti operators collect AD/NTDS data on the same hosts before exfiltration and encryption
  - id: 7b30e0a7-c675-4b24-8a46-82fa67e2433d
    name: Conti Volume Shadow Listing
    reason: Conti enumerates shadow copies prior to deleting them; follow-on to data staging
  - id: c615d676-f655-46b9-b913-78729021e5d7
    name: Data Export From MSSQL Table Via BCP.EXE
    reason: Alternative SQL data-export tool used to bulk-copy the same databases out
  - id: 00321fee-ca72-4cce-b011-5415af3b9960
    name: MSSQL Destructive Query
    reason: Destructive SQL queries are the later impact stage after the database has been dumped
  - id: 7f103213-a04e-4d59-8261-213dddf22314
    name: MSSQL XPCmdshell Suspicious Execution
    reason: xp_cmdshell is a common way the attacker reaches sqlcmd/OS commands via SQL Server
  - id: 639c9081-f482-47d3-a0bd-ddee3d4ecd76
    name: All Backups Deleted Via Wbadmin.EXE
    reason: Ransomware removes backups after exfiltrating database contents
  - id: c9fbe8e9-119d-40a6-9b59-dd58a5d84429
    name: Potential Ransomware or Unauthorized MBR Tampering Via Bcdedit.EXE
    reason: Recovery tampering follows data theft in a Conti pre-encryption phase
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: SQL command-line tools run on host
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*\\(sqlcmd|osql|bcp)\.exe/
    pivot_on: host
    window: 6h
  - name: Backup/dump files written
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(*.bak OR *.mdf OR *.sql OR *.bacpac)
    pivot_on: host
    window: 6h
  - name: Archiving tools staging data
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Rr]ar(\.exe)? .* a .*/ OR /.*7z(a)?(\.exe)? .* a .*/)
    pivot_on: host
    window: 6h
  - name: Shadow copy / backup destruction
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Vv]ssadmin.*[Dd]elete.*[Ss]hadows.*/ OR /.*[Ww]badmin.*[Dd]elete.*/)
    pivot_on: host
    window: 6h
  - name: Outbound transfer tools
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Rr]clone.*/ OR /.*[Mm]egacmd.*/)
    pivot_on: host
    window: 24h
