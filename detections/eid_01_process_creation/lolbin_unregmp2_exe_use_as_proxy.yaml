name: Lolbin Unregmp2.exe Use As Proxy
id: 727454c0-d851-48b0-8b89-385611ab0704
version: 1
schema_version: "1.0"
date: "2024-06-04"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 727454c0-d851-48b0-8b89-385611ab0704
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detect usage of the "unregmp2.exe" binary as a proxy to launch a custom
  version of "wmpnscfg.exe". MITRE ATT&CK: T1218.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\unregmp2.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "unregmp2.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -HideWMP*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /HideWMP*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* –HideWMP*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* —HideWMP*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* ―HideWMP*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\unregmp2.exe'; data_win_eventdata_originalFileName equals 'unregmp2.exe';
  data_win_eventdata_commandLine matches '* -HideWMP*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://lolbas-project.github.io/lolbas/Binaries/Unregmp2/
  - https://attack.mitre.org/techniques/T1218/

response:
  message: >
    Lolbin Unregmp2.exe Use As Proxy detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1218
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218
  custom_tags:
    - lolbin
    - unregmp2
    - proxy
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Uu][Nn][Rr][Ee][Gg][Mm][Pp]2\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Uu][Nn][Rr][Ee][Gg][Mm][Pp]2\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.* -[Hh][Ii][Dd][Ee][Ww][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.* \/[Hh][Ii][Dd][Ee][Ww][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.* –[Hh][Ii][Dd][Ee][Ww][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.* —[Hh][Ii][Dd][Ee][Ww][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.* ―[Hh][Ii][Dd][Ee][Ww][Mm][Pp].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 0058b9e5-bcd7-40d4-9205-95ca5a16d7b2
    name: UAC Bypass Using Windows Media Player - Process
    reason: unregmp2 -HideWMP is the trigger of the WMP UAC bypass; this is the process-side confirmation of the elevated child.
  - id: 5f9db380-ea57-4d1e-beab-8a2d33397e93
    name: UAC Bypass Using Windows Media Player - Registry
    reason: The bypass depends on a registry change made just before unregmp2 runs.
  - id: 68578b43-65df-4f81-9a9b-92f32711a951
    name: UAC Bypass Using Windows Media Player - File
    reason: The bypass plants a file in the WMP location that unregmp2 then executes elevated.
  - id: cd71385d-fd9b-4691-9b98-2b1f7e508714
    name: Lolbin Runexehelper Use As Proxy
    reason: Sibling proxy-execution LOLBIN often tried in the same intrusion.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: unregmp2 executions
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Uu][Nn][Rr][Ee][Gg][Mm][Pp]2.[Ee][Xx][Ee])/
    pivot_on: host
    window: 2h
  - name: Children of unregmp2
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\([Uu][Nn][Rr][Ee][Gg][Mm][Pp]2.[Ee][Xx][Ee])/
    pivot_on: host
    window: 2h
  - name: Windows Media Player registry hijack
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*([Mm][Ee][Dd][Ii][Aa][Pp][Ll][Aa][Yy][Ee][Rr]|[Ww][Mm][Pp][Nn][Ss][Cc][Ff][Gg]|[Uu][Nn][Rr][Ee][Gg][Mm][Pp]2).*/
    pivot_on: host
    window: 2h
  - name: File writes into the WMP directory
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Mm][Ee][Dd][Ii][Aa] [Pp][Ll][Aa][Yy][Ee][Rr].*/
    pivot_on: host
    window: 2h
  - name: Network from shells afterwards
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].[Ee][Xx][Ee]|[Cc][Mm][Dd].[Ee][Xx][Ee])/
    pivot_on: host
    window: 2h
