name: Suspicious Process Execution From Fake Recycle.Bin Folder
id: 5ce0f04e-3efc-42af-839d-5b3a543b76c0
version: 1
schema_version: "1.0"
date: "2023-12-11"
author: X__Junior (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 5ce0f04e-3efc-42af-839d-5b3a543b76c0
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects process execution from a fake recycle bin folder, often used to avoid
  security solution.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*RECYCLERS.BIN\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*RECYCLER.BIN\\\\*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*RECYCLERS.BIN\*'; data_win_eventdata_image matches '*RECYCLER.BIN\*'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.mandiant.com/resources/blog/infected-usb-steal-secrets
  - https://unit42.paloaltonetworks.com/cloaked-ursa-phishing/

response:
  message: >
    Suspicious Process Execution From Fake Recycle.Bin Folder detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - recycle
    - folder
    - process_creation
    - sysmon
    - persistence
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Rr][Ee][Cc][Yy][Cc][Ll][Ee][Rr][Ss]\.[Bb][Ii][Nn]\\.*/ OR data_win_eventdata_image:/.*[Rr][Ee][Cc][Yy][Cc][Ll][Ee][Rr]\.[Bb][Ii][Nn]\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 3dfd06d2-eaf4-4532-9555-68aca59f57c4
    name: Process Execution From A Potentially Suspicious Folder
    reason: Same staging-directory behaviour; other binaries run from odd folders on the host show the wider payload set the fake Recycle.Bin dropper belongs to.
  - id: 1228c958-e64e-4e71-92ad-7d429f4138ba
    name: Script Interpreter Execution From Suspicious Folder
    reason: A loader or script usually drops/launches the binary in the fake RECYCLER.BIN directory; this catches that precursor stage.
  - id: 69bd9b97-2be2-41b6-9816-fb08757a4d1a
    name: Potentially Suspicious Execution From Parent Process In Public Folder
    reason: Co-occurring staging in writable world-accessible directories by the same actor.
  - id: 8a8379b8-780b-4dbf-b1e9-31c8d112fefb
    name: Schtasks From Suspicious Folders
    reason: Malware run from the fake recycle bin commonly persists via a scheduled task pointing back into that folder.
  - id: de587dce-915e-4218-aac4-835ca6af6f70
    name: Potential Persistence Attempt Via Run Keys Using Reg.EXE
    reason: 'Follow-on persistence: Run key written to point at the binary hidden in the fake bin.'
  - id: 36480ae1-a1cb-4eaa-a0d6-29801d7e9142
    name: Potential Defense Evasion Via Binary Rename
    reason: Fake Recycle.Bin hiding is a defence-evasion trait often paired with renamed binaries in the same chain.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Files written into fake Recycle.Bin folders
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*[Rr][Ee][Cc][Yy][Cc][Ll][Ee][Rr][Ss]?[.][Bb][Ii][Nn].*/
    pivot_on: host
    window: 4h
  - name: Persistence referencing the fake bin path
    query: (data_win_system_eventID:13 AND data_win_eventdata_details:/.*[Rr][Ee][Cc][Yy][Cc][Ll][Ee][Rr][Ss]?[.][Bb][Ii][Nn].*/) OR (data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*[Rr][Ee][Cc][Yy][Cc][Ll][Ee][Rr][Ss]?[.][Bb][Ii][Nn].*/)
    pivot_on: host
    window: 24h
  - name: Outbound connections from RECYCLER.BIN binaries
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*[Rr][Ee][Cc][Yy][Cc][Ll][Ee][Rr][Ss]?[.][Bb][Ii][Nn].*/
    pivot_on: host
    window: 4h
  - name: Discovery commands after execution
    query: data_win_system_eventID:1 AND data_win_eventdata_image:(*whoami.exe OR *net.exe OR *net1.exe OR *nltest.exe OR *ipconfig.exe OR *systeminfo.exe)
    pivot_on: host
    window: 2h
