name: Potential Dosfuscation Activity
id: a77c1610-fc73-4019-8e29-0f51efc04a51
version: 1
schema_version: "1.0"
date: "2023-03-06"
author: frack113, Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: a77c1610-fc73-4019-8e29-0f51efc04a51
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects possible payload obfuscation via the commandline. MITRE ATT&CK: T1059.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine: "*^^*"
              - wildcard:
                  data_win_eventdata_commandLine: "*^|^*"
              - wildcard:
                  data_win_eventdata_commandLine: "*,;,*"
              - wildcard:
                  data_win_eventdata_commandLine: "*;;;;*"
              - wildcard:
                  data_win_eventdata_commandLine: "*;; ;;*"
              - wildcard:
                  data_win_eventdata_commandLine: "*(,(,*"
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*%COMSPEC:~*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* c^m^d*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*^c^m^d*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* c^md*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* cm^d*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*^cm^d*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* s^et *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* s^e^t *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* se^t *"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*^^*'; data_win_eventdata_commandLine matches '*^|^*';
  data_win_eventdata_commandLine matches '*,;,*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.fireeye.com/content/dam/fireeye-www/blog/pdfs/dosfuscation-report.pdf
  - https://github.com/danielbohannon/Invoke-DOSfuscation
  - https://attack.mitre.org/techniques/T1059/

response:
  message: >
    Potential Dosfuscation Activity detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1059
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059
  custom_tags:
    - dosfuscation
    - process_creation
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*\^\^.*/ OR data_win_eventdata_commandLine:/.*\^\|\^.*/ OR data_win_eventdata_commandLine:/.*,;,.*/ OR data_win_eventdata_commandLine:/.*;;;;.*/ OR data_win_eventdata_commandLine:/.*;; ;;.*/ OR data_win_eventdata_commandLine:/.*\(,\(,.*/ OR data_win_eventdata_commandLine:/.*%[Cc][Oo][Mm][Ss][Pp][Ee][Cc]:\~.*/ OR data_win_eventdata_commandLine:/.* [Cc]\^[Mm]\^[Dd].*/ OR data_win_eventdata_commandLine:/.*\^[Cc]\^[Mm]\^[Dd].*/ OR data_win_eventdata_commandLine:/.* [Cc]\^[Mm][Dd].*/ OR data_win_eventdata_commandLine:/.* [Cc][Mm]\^[Dd].*/ OR data_win_eventdata_commandLine:/.*\^[Cc][Mm]\^[Dd].*/ OR data_win_eventdata_commandLine:/.* [Ss]\^[Ee][Tt] .*/ OR data_win_eventdata_commandLine:/.* [Ss]\^[Ee]\^[Tt] .*/ OR data_win_eventdata_commandLine:/.* [Ss][Ee]\^[Tt] .*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: f0cdd048-82dc-4f7a-8a7a-b87a52b6d0fd
    name: Potential Commandline Obfuscation Using Escape Characters
    reason: Same family of command-line obfuscation (caret/escape insertion) often in the same loader line.
  - id: d7bcd677-645d-4691-a8d4-7a5602b780d1
    name: Potential PowerShell Command Line Obfuscation
    reason: Dosfuscated cmd lines frequently launch an obfuscated PowerShell stage.
  - id: 44e24481-6202-4c62-9127-5a0ae8e3fe3d
    name: Obfuscated PowerShell OneLiner Execution
    reason: 'Next stage: the obfuscated cmd wrapper hands off to a PowerShell one-liner.'
  - id: b89919ed-fe5f-492c-b139-95dbb162039e
    name: Detect Use of cmd exe to Launch Script Interpreters
    reason: cmd launching wscript/cscript/powershell is the usual payload hand-off after dosfuscation.
  - id: e32d4572-9826-4738-b651-95fa63747e8a
    name: Base64 Encoded PowerShell Command Detected
    reason: Encoded PowerShell commonly follows an obfuscated cmd launcher.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: cmd environment-variable substring obfuscation
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*%[A-Za-z0-9_]+:~[0-9-]+.*/
    pivot_on: host
    window: 1h
  - name: PowerShell spawned by cmd
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 1h
  - name: Script hosts / mshta / rundll32 spawned by cmd
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 1h
  - name: Download tooling in command line
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll].*/ OR data_win_eventdata_commandLine:/.*[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn].*/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Cc][Uu][Rr][Ll].*/)
    pivot_on: host
    window: 2h
  - name: Encoded PowerShell arguments
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.* -[Ee][Nn][Cc].*/ OR data_win_eventdata_commandLine:/.* -[Ee] .*/)
    pivot_on: host
    window: 2h
