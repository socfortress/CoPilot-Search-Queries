name: Windows Credential Target Information Structure in Commandline
id: windows-credential-target-info-commandline-001
version: 1
schema_version: "1.0"
date: "2026-02-23"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects DNS-based Kerberos coercion attacks where adversaries inject marshaled 
  CREDENTIAL_TARGET_INFORMATION structures into command lines. These base64-encoded 
  magic strings (1UWhRCA, AAAAA, YBAAAA) indicate spoofed SPNs used to redirect 
  authentication. Associated with CVE-2025-33073 and KrbRelayUp attacks.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - wildcard:
            data_win_eventdata_commandLine: "*1UWhRCA*"
        - wildcard:
            data_win_eventdata_commandLine: "*AAAAA*"
        - wildcard:
            data_win_eventdata_commandLine: "*YBAAAA*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-23 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-23 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Windows endpoints with Sysmon 
  installed and configured to log process creation events (EventID 1) with full 
  command-line arguments.

known_false_positives: >
  Commands containing all three base64 magic strings are extremely unusual in 
  production environments. Very low false positive rate expected.

references:
  - https://attack.mitre.org/techniques/T1557/001/
  - https://www.synacktiv.com/publications/relaying-kerberos-over-smb-using-krbrelayx
  - https://www.guidepointsecurity.com/blog/the-birth-and-death-of-loopyticket/

response:
  message: >
    Kerberos coercion payload detected on $agent_name$. 
    Command: $data_win_eventdata_commandLine$. 
    Process: $data_win_eventdata_image$. 
    User: $data_win_eventdata_user$. 
    CVE-2025-33073. MITRE ATT&CK: T1557.001
  risk_score: 72
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 72
  threat_objects: []

tags:
  analytic_story:
    - Kerberos Coercion with DNS
    - Local Privilege Escalation With KrbRelayUp
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1557.001
    - T1187
    - T1071.004
  cve:
    - CVE-2025-33073
  custom_tags:
    - kerberos_coercion
    - credential_target_info
    - dns_abuse
    - krb_relay
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*1UWhRCA.*/ AND data_win_eventdata_commandLine:/.*AAAAA.*/ AND data_win_eventdata_commandLine:/.*YBAAAA.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 0ed99dda-6a35-11ef-8c99-0242ac120002
    name: Attempts of Kerberos Coercion Via DNS SPN Spoofing
    reason: Sibling process-creation detection of the same CVE-2025-33073 SPN spoofing command lines.
  - id: e7a21b5f-d8c4-4ae5-b8d9-93c5d3f28e1c
    name: Suspicious DNS Query Indicating Kerberos Coercion via DNS Object SPN Spoofing
    reason: Host DNS lookup of the marshalled-SPN hostname (UWhRCA...BAAAA) confirms the coerced authentication target.
  - id: b07e58cf-cacc-4135-8473-ccb2eba63dd2
    name: Potential Kerberos Coercion by Spoofing SPNs via DNS Manipulation
    reason: Domain-controller-side evidence of the malicious DNS record being added.
  - id: 12827a56-61a4-476a-a9cb-f3068f191073
    name: HackTool - KrbRelayUp Execution
    reason: KrbRelayUp is the relay chain this spoofed SPN technique feeds into for local privilege escalation.
  - id: 749c9f5e-b353-4b90-a9c1-05243357ca4b
    name: Potential Privilege Escalation via Local Kerberos Relay over LDAP
    reason: Resulting loopback Kerberos relay logon that follows a successful coercion.
  - id: e96253b8-6b3b-4f90-9e59-3b24b99cf9b4
    name: HackTool - KrbRelay Execution
    reason: Kerberos relay tooling usually launched alongside or after the coercion.
  - id: 1ce8c8a3-2723-48ed-8246-906ac91061a6
    name: Possible PetitPotam Coerce Authentication Attempt
    reason: Other authentication-coercion primitive used to force the machine account to authenticate.
  - id: e54979bd-c5f9-4d6c-967b-a04b19ac4c74
    name: Uncommon Outbound Kerberos Connection
    reason: Coerced authentication produces unusual Kerberos traffic from non-standard processes.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: DNS queries with marshalled SPN hostnames
    query: data_win_system_eventID:"22" AND data_win_eventdata_queryName:/.*[Uu][Ww][Hh][Rr][Cc][Aa].*/ AND data_win_eventdata_queryName:/.*[Bb][Aa][Aa][Aa][Aa].*/
    pivot_on: host
    window: 2h
  - name: Kerberos port connections from non-lsass processes
    query: data_win_system_eventID:"3" AND data_win_eventdata_destinationPort:"88" AND NOT data_win_eventdata_image:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Kerberos relay and coercion tool command lines
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Kk][Rr][Bb][Rr][Ee][Ll][Aa][Yy].*/ OR data_win_eventdata_commandLine:/.*[Pp][Ee][Tt][Ii][Tt][Pp][Oo][Tt][Aa][Mm].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Ee][Rr][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Rr][Uu][Bb][Ee][Uu][Ss].*/)
    pivot_on: host
    window: 4h
  - name: Machine account logons and Kerberos ticket requests
    query: data_win_system_eventID:(4624 OR 4768 OR 4769) AND data_win_eventdata_targetUserName:/.*\$/
    pivot_on: host
    window: 2h
  - name: Service or admin creation after relay
    query: data_win_system_eventID:(7045 OR 4697 OR 4720 OR 4732)
    pivot_on: host
    window: 4h
