name: UAC Bypass Using Event Viewer RecentViews
id: 30fc8de7-d833-40c4-96b6-28319fbc4f6c
version: 1
schema_version: "1.0"
date: "2022-11-22"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 30fc8de7-d833-40c4-96b6-28319fbc4f6c
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the pattern of UAC Bypass using Event Viewer RecentViews.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Event Viewer\\\\RecentViews*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\EventV~1\\\\RecentViews*"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine: "*>*"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*\Event Viewer\RecentViews*'; data_win_eventdata_commandLine matches
  '*\EventV~1\RecentViews*'; data_win_eventdata_commandLine matches '*>*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/orange_8361/status/1518970259868626944
  - https://lolbas-project.github.io/lolbas/Binaries/Eventvwr/#execute

response:
  message: >
    UAC Bypass Using Event Viewer RecentViews detected on host $agent_name$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - bypass
    - viewer
    - recentviews
    - process_creation
    - sysmon
    - privilege_escalation
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*\\[Ee][Vv][Ee][Nn][Tt] [Vv][Ii][Ee][Ww][Ee][Rr]\\[Rr][Ee][Cc][Ee][Nn][Tt][Vv][Ii][Ee][Ww][Ss].*/ OR data_win_eventdata_commandLine:/.*\\[Ee][Vv][Ee][Nn][Tt][Vv]\~1\\[Rr][Ee][Cc][Ee][Nn][Tt][Vv][Ii][Ee][Ww][Ss].*/) AND data_win_eventdata_commandLine:/.*\>.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 63e4f530-65dc-49cc-8f80-ccfa95c69d43
    name: UAC Bypass Using EventVwr
    reason: 'Sibling EventVwr bypass: attacker file drop that hijacks the Event Viewer path before eventvwr launches.'
  - id: 46dd5308-4572-4d12-aa43-8938f0184d4f
    name: Bypass UAC Using DelegateExecute
    reason: Registry DelegateExecute hijack is another common auto-elevate pivot tried in the same attempt.
  - id: d38d2fa4-98e6-4a24-aff1-410b0c9ad177
    name: HackTool - UACMe Akagi Execution
    reason: UACMe/Akagi implements this method; the tool may be the delivery.
  - id: 178e615d-e666-498b-9630-9ed363038101
    name: Elevated System Shell Spawned From Uncommon Parent Location
    reason: Elevated shell from odd parent is the typical result of a successful bypass.
  - id: 97a80ec7-0e2f-4d05-9ef4-65760e634f6b
    name: Security Privileges Enumeration Via Whoami.EXE
    reason: whoami /priv is the usual check after gaining high integrity.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: eventvwr spawning payload
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Ee]ventvwr\.exe/
    pivot_on: host
    window: 2h
  - name: RecentViews file written
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*[Ee]vent\ [Vv]iewer.*[Rr]ecent[Vv]iews.*/
    pivot_on: host
    window: 2h
  - name: Elevated shell children
    query: data_win_system_eventID:1 AND data_win_eventdata_integrityLevel:(High OR System) AND data_win_eventdata_image:(/.*\\(cmd|powershell|pwsh)\.exe/)
    pivot_on: host
    window: 2h
  - name: Defense evasion after elevation
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ss]et-[Mm]p[Pp]reference.*/ OR /.*vssadmin.*delete.*/ OR /.*wevtutil.*cl.*/)
    pivot_on: host
    window: 4h
