name: PUA - AdvancedRun Suspicious Execution
id: fa00b701-44c6-4679-994d-5a18afa8a707
version: 1
schema_version: "1.0"
date: "2023-02-21"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: fa00b701-44c6-4679-994d-5a18afa8a707
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of AdvancedRun utility in the context of the
  TrustedInstaller, SYSTEM, Local Service or Network Service accounts. MITRE
  ATT&CK: T1134.002.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*/EXEFilename*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*/CommandLine*"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /RunAs 8 *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /RunAs 4 *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /RunAs 10 *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /RunAs 11 *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*/RunAs 8"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*/RunAs 4"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*/RunAs 10"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*/RunAs 11"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*/EXEFilename*'; data_win_eventdata_commandLine matches '*/CommandLine*';
  data_win_eventdata_commandLine matches '* /RunAs 8 *', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/splinter_code/status/1483815103279603714
  - https://medium.com/s2wblog/analysis-of-destructive-malware-whispergate-targeting-ukraine-9d5d158f19f3
  - https://www.elastic.co/security-labs/operation-bleeding-bear
  - https://www.winhelponline.com/blog/run-program-as-system-localsystem-account-windows/
  - https://attack.mitre.org/techniques/T1134/002/

response:
  message: >
    PUA - AdvancedRun Suspicious Execution detected on host $agent_name$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1134.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1134.002
  custom_tags:
    - advancedrun
    - process_creation
    - sysmon
    - privilege_escalation
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*\/[Ee][Xx][Ee][Ff][Ii][Ll][Ee][Nn][Aa][Mm][Ee].*/ OR data_win_eventdata_commandLine:/.*\/[Cc][Oo][Mm][Mm][Aa][Nn][Dd][Ll][Ii][Nn][Ee].*/) AND (data_win_eventdata_commandLine:/.* \/[Rr][Uu][Nn][Aa][Ss] 8 .*/ OR data_win_eventdata_commandLine:/.* \/[Rr][Uu][Nn][Aa][Ss] 4 .*/ OR data_win_eventdata_commandLine:/.* \/[Rr][Uu][Nn][Aa][Ss] 10 .*/ OR data_win_eventdata_commandLine:/.* \/[Rr][Uu][Nn][Aa][Ss] 11 .*/ OR data_win_eventdata_commandLine:/.*\/[Rr][Uu][Nn][Aa][Ss] 8/ OR data_win_eventdata_commandLine:/.*\/[Rr][Uu][Nn][Aa][Ss] 4/ OR data_win_eventdata_commandLine:/.*\/[Rr][Uu][Nn][Aa][Ss] 10/ OR data_win_eventdata_commandLine:/.*\/[Rr][Uu][Nn][Aa][Ss] 11/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d2b749ee-4225-417e-b20e-a8d2193cbb84
    name: PUA - AdvancedRun Execution
    reason: Generic AdvancedRun detection that usually fires on the same process creation.
  - id: 771d1eb5-9587-4568-95fb-9ec44153a012
    name: PUA - NSudo Execution
    reason: Peer TrustedInstaller/SYSTEM launcher; both appear in Defender-kill chains.
  - id: b28e58e4-2a72-4fae-bdee-0fbe904db642
    name: Windows Defender Real-time Protection Disabled
    reason: SYSTEM/TrustedInstaller rights are how Defender gets disabled despite protections.
  - id: 49e5bc24-8b86-49f1-b743-535f332c2856
    name: Microsoft Defender Tamper Protection Trigger
    reason: Tamper Protection events when SYSTEM-level commands target Defender.
  - id: 1321dc4e-a1fe-481d-a016-52c45f0c8b4f
    name: Windows Defender Exclusions Added
    reason: Elevated process adds exclusions to protect payloads.
  - id: 93d298a1-d28f-47f1-a468-d971e7796679
    name: Disable Tamper Protection on Windows Defender
    reason: Registry tamper-protection disable needs the rights obtained here.
  - id: 2617e7ed-adb7-40ba-b0f3-8f9945fe6c09
    name: Suspicious SYSTEM User Process Creation
    reason: Commands launched under the elevated identity.
  - id: d9047477-0359-48c9-b8c7-792cedcdc9c4
    name: PUA - NirCmd Execution As LOCAL SYSTEM
    reason: Companion NirSoft tool used for the same SYSTEM-context execution.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Children of the elevated AdvancedRun launch
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Aa]dvanced[Rr]un.*/
    pivot_on: host
    window: 2h
  - name: Defender registry and policy changes
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*reg +add.*Windows Defender.*/ OR data_win_eventdata_commandLine:/.*DisableAntiSpyware.*/ OR data_win_eventdata_commandLine:/.*TamperProtection.*/ OR data_win_eventdata_commandLine:/.*Add-MpPreference.*Exclusion.*/)
    pivot_on: host
    window: 2h
  - name: Security service stop or disable
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*sc +(stop|config|delete) .*(WinDefend|Sense|MsMpSvc|wscsvc|EventLog).*/ OR data_win_eventdata_commandLine:/.*net +stop.*/)
    pivot_on: host
    window: 2h
  - name: Credential dumping after elevation
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*procdump.*lsass.*/ OR data_win_eventdata_commandLine:/.*comsvcs.*MiniDump.*/ OR data_win_eventdata_commandLine:/.*reg +save +hklm.*(sam|system|security).*/ OR data_win_eventdata_commandLine:/.*[Mm]imikatz.*/)
    pivot_on: host
    window: 4h
  - name: Ransomware preparation commands
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*vssadmin.*delete +shadows.*/ OR data_win_eventdata_commandLine:/.*wbadmin.*delete.*/ OR data_win_eventdata_commandLine:/.*bcdedit.*(recoveryenabled|ignoreallfailures).*/ OR data_win_eventdata_commandLine:/.*wevtutil +cl.*/)
    pivot_on: host
    window: 4h
