name: Suspicious CustomShellHost Execution
id: 84b14121-9d14-416e-800b-f3b829c5a14d
version: 1
schema_version: "1.0"
date: "2025-10-29"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 84b14121-9d14-416e-800b-f3b829c5a14d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of CustomShellHost.exe where the child isn't located in
  'C:\Windows\explorer.exe'. CustomShellHost is a known LOLBin that can be
  abused by attackers for defense evasion techniques. MITRE ATT&CK: T1216.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_parentImage:
              value: "*\\\\CustomShellHost.exe"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - term:
                  data_win_eventdata_image:
                    value: "C:\\Windows\\explorer.exe"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\CustomShellHost.exe'; data_win_eventdata_image equals
  'C:\Windows\explorer.exe'.

known_false_positives: >
  False positives are unlikely, investigate matches carefully. Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://github.com/LOLBAS-Project/LOLBAS/pull/180
  - https://lolbas-project.github.io/lolbas/Binaries/CustomShellHost/
  - https://attack.mitre.org/techniques/T1216/

response:
  message: >
    Suspicious CustomShellHost Execution detected on host $agent_name$. Matched
    data_win_eventdata_parentImage: $data_win_eventdata_parentImage$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1216
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1216
  custom_tags:
    - customshellhost
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Cc][Uu][Ss][Tt][Oo][Mm][Ss][Hh][Ee][Ll][Ll][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d4ca7c59-e9e4-42d8-bf57-91a776efcb87
    name: LOLBIN Execution From Abnormal Drive
    reason: CustomShellHost abuse is a LOLBIN proxy; execution from odd drives/paths indicates a staged copy.
  - id: b2ddd389-f676-4ac4-845a-e00781a48e5f
    name: Using SettingSyncHost.exe as LOLBin
    reason: Sibling Windows shell-host binary abused the same way to launch an attacker payload.
  - id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
    name: PowerShell Download and Execution Cradles
    reason: Child payload or its staging is often a PowerShell cradle.
  - id: e218595b-bbe7-4ee5-8a96-f32a24ad3468
    name: Suspicious Curl.EXE Download
    reason: Common way the replacement payload placed next to CustomShellHost is fetched.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: CustomShellHost launches and children
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*[Cc]ustom[Ss]hell[Hh]ost\.exe/ OR data_win_eventdata_parentImage:/.*[Cc]ustom[Ss]hell[Hh]ost\.exe/)
    pivot_on: host
    window: 4h
  - name: CustomShellHost copied or dropped
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*[Cc]ustom[Ss]hell[Hh]ost\.exe/
    pivot_on: host
    window: 6h
  - name: Fake explorer.exe staged outside Windows dir
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\\explorer\.exe/ AND NOT data_win_eventdata_targetFilename:/C:\\Windows\\explorer\.exe/
    pivot_on: host
    window: 6h
  - name: Network by binaries in user-writable paths
    query: data_win_system_eventID:3 AND data_win_eventdata_initiated:true AND data_win_eventdata_image:/.*\\(Temp|AppData|ProgramData|Users\\Public)\\.*\.exe/
    pivot_on: host
    window: 2h
