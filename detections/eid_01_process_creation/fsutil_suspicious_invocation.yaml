name: Fsutil Suspicious Invocation
id: add64136-62e5-48ea-807e-88638d02df1e
version: 1
schema_version: "1.0"
date: "2023-09-09"
author: Ecco, E.M. Anhaus, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: add64136-62e5-48ea-807e-88638d02df1e
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: production
type: TTP

description: >
  Detects suspicious parameters of fsutil (deleting USN journal, configuring it
  with small size, etc). Might be used by ransomwares during the attack (seen by
  NotPetya and others). MITRE ATT&CK: T1070, T1485.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\fsutil.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "fsutil.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*deletejournal*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*createjournal*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*setZeroData*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\fsutil.exe'; data_win_eventdata_originalFileName equals 'fsutil.exe';
  data_win_eventdata_commandLine matches '*deletejournal*', among other
  conditions.

known_false_positives: >
  Admin activity. Scripts and administrative tools used in the monitored
  environment. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/fsutil-usn
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1070/T1070.md
  - https://eqllib.readthedocs.io/en/latest/analytics/c91f422a-5214-4b17-8664-c5fcf115c0a2.html
  - https://github.com/albertzsigovits/malware-notes/blob/558898932c1579ff589290092a2c8febefc3a4c9/Ransomware/Lockbit.md
  - https://blog.cluster25.duskrise.com/2023/05/22/back-in-black-blackbyte-nt
  - https://attack.mitre.org/techniques/T1070/
  - https://attack.mitre.org/techniques/T1485/

response:
  message: >
    Fsutil Suspicious Invocation detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1070, T1485
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1070
    - T1485
  custom_tags:
    - fsutil
    - invocation
    - process_creation
    - sysmon
    - impact
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ff][Ss][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ff][Ss][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*[Dd][Ee][Ll][Ee][Tt][Ee][Jj][Oo][Uu][Rr][Nn][Aa][Ll].*/ OR data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee][Jj][Oo][Uu][Rr][Nn][Aa][Ll].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Tt][Zz][Ee][Rr][Oo][Dd][Aa][Tt][Aa].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 4e5e024e-fabb-11eb-8b8f-acde48001122
    name: Fsutil Zeroing File
    reason: setzerodata is one of this rule triggers; the dedicated rule marks LockBit-style binary wiping.
  - id: cc36992a-4671-4f21-a91d-6c2b72a2edf5
    name: Suspicious Eventlog Clearing or Configuration Change Activity
    reason: Event log clearing accompanies USN journal deletion in anti-forensic cleanup.
  - id: 236e7c8e-c9d9-11eb-a824-acde48001122
    name: Disable Logs Using WevtUtil
    reason: Disabling logs via wevtutil is the companion visibility-reduction step.
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: 'Shadow copy deletion: NotPetya/ransomware removes recovery options alongside journal deletion.'
  - id: 639c9081-f482-47d3-a0bd-ddee3d4ecd76
    name: All Backups Deleted Via Wbadmin.EXE
    reason: Backup deletion via wbadmin follows the same recovery-inhibit pattern.
  - id: c9fbe8e9-119d-40a6-9b59-dd58a5d84429
    name: Potential Ransomware or Unauthorized MBR Tampering Via Bcdedit.EXE
    reason: Bcdedit boot tampering often precedes encryption or wiping.
  - id: 4b046706-5789-4673-b111-66f25fe99534
    name: Deleted Data Overwritten Via Cipher.EXE
    reason: Cipher /w overwrites deleted data, another anti-recovery step.
  - id: a4824fca-976f-4964-b334-0621379e84c4
    name: Potential File Overwrite Via Sysinternals SDelete
    reason: SDelete overwrite is an equivalent data destruction tool.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Log clearing and recovery inhibition commands
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll] [Cc][Ll].*/ OR data_win_eventdata_commandLine:/.*[Cc][Ll][Ee][Aa][Rr]-[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg].*/ OR data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn] [Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ww][Bb][Aa][Dd][Mm][Ii][Nn] [Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Bb][Cc][Dd][Ee][Dd][Ii][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ww][Mm][Ii][Cc] [Ss][Hh][Aa][Dd][Oo][Ww][Cc][Oo][Pp][Yy] [Dd][Ee][Ll][Ee][Tt][Ee].*/)
    pivot_on: host
    window: 2h
  - name: Event log cleared (Security 1102, System 104)
    query: data_win_system_eventID:"1102" OR data_win_system_eventID:"104"
    pivot_on: host
    window: 2h
  - name: Anti-forensic and wiper tools run on the host
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Ff][Ss][Uu][Tt][Ii][Ll].[Ee][Xx][Ee]|[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].[Ee][Xx][Ee]|[Ww][Bb][Aa][Dd][Mm][Ii][Nn].[Ee][Xx][Ee]|[Bb][Cc][Dd][Ee][Dd][Ii][Tt].[Ee][Xx][Ee]|[Cc][Ii][Pp][Hh][Ee][Rr].[Ee][Xx][Ee]|[Ss][Dd][Ee][Ll][Ee][Tt][Ee].[Ee][Xx][Ee]|[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll].[Ee][Xx][Ee])/
    pivot_on: host
    window: 2h
  - name: Ransom note creation
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*([Rr][Ee][Aa][Dd][Mm][Ee]|[Dd][Ee][Cc][Rr][Yy][Pp][Tt]|[Rr][Aa][Nn][Ss][Oo][Mm]|[Rr][Ee][Cc][Oo][Vv][Ee][Rr]).*\.([Tt][Xx][Tt]|[Hh][Tt][Mm][Ll]?)/
    pivot_on: host
    window: 2h
  - name: Lateral spread via remote execution tools
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Pp][Ss][Ee][Xx][Ee][Cc].*/ OR data_win_eventdata_commandLine:/.*[Ww][Mm][Ii][Cc] \/[Nn][Oo][Dd][Ee].*/ OR data_win_eventdata_commandLine:/.*\\\\[Aa][Dd][Mm][Ii][Nn]$.*/)
    pivot_on: host
    window: 2h
