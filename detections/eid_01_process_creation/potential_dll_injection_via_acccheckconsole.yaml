name: Potential DLL Injection Via AccCheckConsole
id: 0f6da907-5854-4be6-859a-e9958747b0aa
version: 1
schema_version: "1.0"
date: "2024-08-29"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 0f6da907-5854-4be6-859a-e9958747b0aa
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution "AccCheckConsole" a command-line tool for verifying the
  accessibility implementation of an application's UI. One of the tests that
  this checker can run are called "verification routine", which tests for things
  like Consistency, Navigation, etc. The tool allows a user to provide a DLL
  that can contain a custom "verification routine". An attacker can build such
  DLLs and pass it via the CLI, which would then be loaded in the context of the
  "AccCheckConsole" utility.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\AccCheckConsole.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "AccCheckConsole.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -hwnd*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -process *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -window *"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\AccCheckConsole.exe'; data_win_eventdata_originalFileName equals
  'AccCheckConsole.exe'; data_win_eventdata_commandLine matches '* -hwnd*',
  among other conditions.

known_false_positives: >
  Legitimate use of the UI Accessibility Checker. Baseline expected activity in
  your environment and tune this detection before relying on it for automated
  response.

references:
  - https://gist.github.com/bohops/2444129419c8acf837aedda5f0e7f340
  - https://twitter.com/bohops/status/1477717351017680899?s=12
  - https://lolbas-project.github.io/lolbas/OtherMSBinaries/AccCheckConsole/

response:
  message: >
    Potential DLL Injection Via AccCheckConsole detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  custom_tags:
    - injection
    - acccheckconsole
    - process_creation
    - sysmon
    - execution
    - threat_hunting
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Aa][Cc][Cc][Cc][Hh][Ee][Cc][Kk][Cc][Oo][Nn][Ss][Oo][Ll][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Aa][Cc][Cc][Cc][Hh][Ee][Cc][Kk][Cc][Oo][Nn][Ss][Oo][Ll][Ee]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.* -[Hh][Ww][Nn][Dd].*/ OR data_win_eventdata_commandLine:/.* -[Pp][Rr][Oo][Cc][Ee][Ss][Ss] .*/ OR data_win_eventdata_commandLine:/.* -[Ww][Ii][Nn][Dd][Oo][Ww] .*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 148431ce-4b70-403d-8525-fcc2993f29ea
    name: Potential DLL Injection Or Execution Using Tracker.exe
    reason: Sibling signed-LOLBIN technique (Tracker.exe) for loading an attacker DLL into a trusted Microsoft process; same operator tradecraft.
  - id: f7375e28-5c14-432f-b8d1-1db26c832df3
    name: Potential Arbitrary DLL Load Using Winword
    reason: Another trusted-binary arbitrary DLL load proxy; often tried alongside when defenders block one.
  - id: de587dce-915e-4218-aac4-835ca6af6f70
    name: Potential Persistence Attempt Via Run Keys Using Reg.EXE
    reason: 'Typical follow-on: once the DLL runs inside the signed tool the actor persists via Run keys.'
  - id: 24357373-078f-44ed-9ac4-6d334a668a11
    name: Direct Autorun Keys Modification
    reason: Follow-on persistence written by the injected payload.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: AccCheckConsole executions (any args)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Aa][Cc][Cc][Cc][Hh][Ee][Cc][Kk][Cc][Oo][Nn][Ss][Oo][Ll][Ee]\.[Ee][Xx][Ee])/)
    pivot_on: host
    window: 24h
  - name: Children spawned by AccCheckConsole
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Aa][Cc][Cc][Cc][Hh][Ee][Cc][Kk][Cc][Oo][Nn][Ss][Oo][Ll][Ee]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Modules loaded by AccCheckConsole
    query: data_win_system_eventID:"7" AND data_win_eventdata_image:/.*\\([Aa][Cc][Cc][Cc][Hh][Ee][Cc][Kk][Cc][Oo][Nn][Ss][Oo][Ll][Ee]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 2h
  - name: Network connections from AccCheckConsole
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Aa][Cc][Cc][Cc][Hh][Ee][Cc][Kk][Cc][Oo][Nn][Ss][Oo][Ll][Ee]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 4h
  - name: DLLs dropped to user-writable paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\(Users|ProgramData|Windows\\Temp)\\.*\.[Dd][Ll][Ll]/
    pivot_on: host
    window: 1h
