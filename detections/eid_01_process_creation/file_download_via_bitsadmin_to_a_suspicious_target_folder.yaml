name: File Download Via Bitsadmin To A Suspicious Target Folder
id: 2ddef153-167b-4e89-86b6-757a9e65dcac
version: 1
schema_version: "1.0"
date: "2025-12-10"
author: Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 2ddef153-167b-4e89-86b6-757a9e65dcac
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects usage of bitsadmin downloading a file to a suspicious target folder.
  MITRE ATT&CK: T1197, T1036.003, T1105.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\bitsadmin.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "bitsadmin.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /transfer *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /create *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /addfile *"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*:\\\\Perflogs*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*:\\\\ProgramData\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*:\\\\Temp\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*:\\\\Users\\\\Public\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*:\\\\Windows\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\$Recycle.Bin\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\AppData\\\\Local\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\AppData\\\\Roaming\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Contacts\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Desktop\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Favorites\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Favourites\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\inetpub\\\\wwwroot\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Music\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Pictures\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Start Menu\\\\Programs\\\\Startup\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Users\\\\Default\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Videos\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*%ProgramData%*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*%public%*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*%temp%*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*%tmp%*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\bitsadmin.exe'; data_win_eventdata_originalFileName equals 'bitsadmin.exe';
  data_win_eventdata_commandLine matches '* /transfer *', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://blog.netspi.com/15-ways-to-download-a-file/#bitsadmin
  - https://isc.sans.edu/diary/22264
  - https://lolbas-project.github.io/lolbas/Binaries/Bitsadmin/
  - https://blog.talosintelligence.com/breaking-the-silence-recent-truebot-activity/
  - https://attack.mitre.org/techniques/T1197/
  - https://attack.mitre.org/techniques/T1036/003/
  - https://attack.mitre.org/techniques/T1105/

response:
  message: >
    File Download Via Bitsadmin To A Suspicious Target Folder detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1197, T1036.003, T1105
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1197
    - T1036.003
    - T1105
  custom_tags:
    - download
    - bitsadmin
    - target
    - process_creation
    - sysmon
    - persistence
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.* \/[Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr] .*/ OR data_win_eventdata_commandLine:/.* \/[Cc][Rr][Ee][Aa][Tt][Ee] .*/ OR data_win_eventdata_commandLine:/.* \/[Aa][Dd][Dd][Ff][Ii][Ll][Ee] .*/) AND (data_win_eventdata_commandLine:/.*:\\[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss].*/ OR data_win_eventdata_commandLine:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_commandLine:/.*:\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_commandLine:/.*:\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_commandLine:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\.*/ OR data_win_eventdata_commandLine:/.*\\\$[Rr][Ee][Cc][Yy][Cc][Ll][Ee]\.[Bb][Ii][Nn]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Rr][Oo][Aa][Mm][Ii][Nn][Gg]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Cc][Oo][Nn][Tt][Aa][Cc][Tt][Ss]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Dd][Ee][Ss][Kk][Tt][Oo][Pp]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Ff][Aa][Vv][Oo][Rr][Ii][Tt][Ee][Ss]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Ff][Aa][Vv][Oo][Uu][Rr][Ii][Tt][Ee][Ss]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Ii][Nn][Ee][Tt][Pp][Uu][Bb]\\[Ww][Ww][Ww][Rr][Oo][Oo][Tt]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Mm][Uu][Ss][Ii][Cc]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Pp][Ii][Cc][Tt][Uu][Rr][Ee][Ss]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Ss][Tt][Aa][Rr][Tt] [Mm][Ee][Nn][Uu]\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Ss]\\[Ss][Tt][Aa][Rr][Tt][Uu][Pp]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Dd][Ee][Ff][Aa][Uu][Ll][Tt]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Vv][Ii][Dd][Ee][Oo][Ss]\\.*/ OR data_win_eventdata_commandLine:/.*%[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]%.*/ OR data_win_eventdata_commandLine:/.*%[Pp][Uu][Bb][Ll][Ii][Cc]%.*/ OR data_win_eventdata_commandLine:/.*%[Tt][Ee][Mm][Pp]%.*/ OR data_win_eventdata_commandLine:/.*%[Tt][Mm][Pp]%.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d059842b-6b9d-4ed1-b5c3-5b89143c6ede
    name: File Download Via Bitsadmin
    reason: Generic sibling firing on the same command; confirms the transfer and its URL.
  - id: 99c840f2-2012-46fd-9141-c761987550ef
    name: Suspicious Download From Direct IP Via Bitsadmin
    reason: Same BITS download but from a raw IP, strong sign of attacker infrastructure rather than a vendor CDN.
  - id: 8518ed3d-f7c9-4601-a26c-f361a4256a0c
    name: Suspicious Download From File-Sharing Website Via Bitsadmin
    reason: Same technique pulling a payload from a file-sharing host used for staging.
  - id: 5b80a791-ad9b-4b75-bcc1-ad4e1e89c200
    name: File With Suspicious Extension Downloaded Via Bitsadmin
    reason: Downloaded file type (exe/dll/script) shows the transfer is an executable payload.
  - id: b9cbbc17-d00d-4e3d-a827-b06d03d2380d
    name: Monitoring For Persistence Via BITS
    reason: 'BITS jobs with SetNotifyCmdLine relaunch a payload on completion: the persistence follow-on.'
  - id: 74babdd6-a758-4549-9632-26535279e654
    name: Suspicious Executable File Creation
    reason: The downloaded payload landing on disk as an executable in a staging location.
  - id: 2aa0a6b4-a865-495b-ab51-c28249537b75
    name: Startup Folder File Write
    reason: Target folders include Startup; a file written there means persistence at next logon.
  - id: 69bd9b97-2be2-41b6-9816-fb08757a4d1a
    name: Potentially Suspicious Execution From Parent Process In Public Folder
    reason: Execution of what was fetched into the Public/user-writable folder.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: All bitsadmin invocations on host
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 4h
  - name: Executables/scripts/shortcuts created in staging or Startup folders
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(\\[Ss]tartup\\|\\([Tt]emp|[Pp]ublic|[Pp]rogram[Dd]ata|[Aa]pp[Dd]ata)\\|\\[Rr]ecycle\.[Bb]in\\).*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Pp][Ss]1|[Bb][Aa][Tt]|[Vv][Bb][Ss]|[Ll][Nn][Kk]|[Hh][Tt][Aa])/
    pivot_on: host
    window: 2h
  - name: Execution from user-writable path after shell parent
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\([Cc][Mm][Dd]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Mm][Ss][Hh][Tt][Aa])\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Tt]emp|[Pp]ublic|[Pp]rogram[Dd]ata|[Aa]pp[Dd]ata)\\.*/
    pivot_on: host
    window: 2h
  - name: BITS persistence / notify commands
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn].*\/([Ss][Ee][Tt][Nn][Oo][Tt][Ii][Ff][Yy][Cc][Mm][Dd][Ll][Ii][Nn][Ee]|[Rr][Ee][Ss][Uu][Mm][Ee]|[Cc][Oo][Mm][Pp][Ll][Ee][Tt][Ee]).*/ OR data_win_eventdata_commandLine:/.*[Ss][Tt][Aa][Rr][Tt]-[Bb][Ii][Tt][Ss][Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr].*/)
    pivot_on: host
    window: 24h
  - name: DNS lookups by user-writable-path processes
    query: data_win_system_eventID:"22" AND data_win_eventdata_image:/.*\\([Tt]emp|[Pp]ublic|[Pp]rogram[Dd]ata|[Aa]pp[Dd]ata)\\.*/
    pivot_on: host
    window: 2h
