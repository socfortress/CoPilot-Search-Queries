name: Suspicious Process Created Via Wmic.EXE
id: 3c89a1e8-0fba-449e-8f1b-8409d6267ec8
version: 1
schema_version: "1.0"
date: "2023-02-14"
author: Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 3c89a1e8-0fba-449e-8f1b-8409d6267ec8
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects WMIC executing "process call create" with suspicious calls to
  processes such as "rundll32", "regsrv32", etc. MITRE ATT&CK: T1047.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*process *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*call *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*create *"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*rundll32*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*bitsadmin*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*regsvr32*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*cmd.exe /c *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*cmd.exe /k *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*cmd.exe /r *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*cmd /c *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*cmd /k *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*cmd /r *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*powershell*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*pwsh*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*certutil*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*cscript*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*wscript*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*mshta*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Users\\\\Public\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Windows\\\\Temp\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\AppData\\\\Local\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*%temp%*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*%tmp%*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*%ProgramData%*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*%appdata%*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*%comspec%*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*%localappdata%*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*process *'; data_win_eventdata_commandLine matches '*call *';
  data_win_eventdata_commandLine matches '*create *', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://thedfirreport.com/2020/10/08/ryuks-return/
  - https://symantec-enterprise-blogs.security.com/blogs/threat-intelligence/ransomware-hive-conti-avoslocker
  - https://attack.mitre.org/techniques/T1047/

response:
  message: >
    Suspicious Process Created Via Wmic.EXE detected on host $agent_name$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1047
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1047
  custom_tags:
    - process_creation
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Pp][Rr][Oo][Cc][Ee][Ss][Ss] .*/ AND data_win_eventdata_commandLine:/.*[Cc][Aa][Ll][Ll] .*/ AND data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee] .*/ AND (data_win_eventdata_commandLine:/.*[Rr][Uu][Nn][Dd][Ll][Ll]32.*/ OR data_win_eventdata_commandLine:/.*[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Gg][Ss][Vv][Rr]32.*/ OR data_win_eventdata_commandLine:/.*[Cc][Mm][Dd]\.[Ee][Xx][Ee] \/[Cc] .*/ OR data_win_eventdata_commandLine:/.*[Cc][Mm][Dd]\.[Ee][Xx][Ee] \/[Kk] .*/ OR data_win_eventdata_commandLine:/.*[Cc][Mm][Dd]\.[Ee][Xx][Ee] \/[Rr] .*/ OR data_win_eventdata_commandLine:/.*[Cc][Mm][Dd] \/[Cc] .*/ OR data_win_eventdata_commandLine:/.*[Cc][Mm][Dd] \/[Kk] .*/ OR data_win_eventdata_commandLine:/.*[Cc][Mm][Dd] \/[Rr] .*/ OR data_win_eventdata_commandLine:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Pp][Ww][Ss][Hh].*/ OR data_win_eventdata_commandLine:/.*[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll].*/ OR data_win_eventdata_commandLine:/.*[Cc][Ss][Cc][Rr][Ii][Pp][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ww][Ss][Cc][Rr][Ii][Pp][Tt].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ss][Hh][Tt][Aa].*/ OR data_win_eventdata_commandLine:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\.*/ OR data_win_eventdata_commandLine:/.*%[Tt][Ee][Mm][Pp]%.*/ OR data_win_eventdata_commandLine:/.*%[Tt][Mm][Pp]%.*/ OR data_win_eventdata_commandLine:/.*%[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]%.*/ OR data_win_eventdata_commandLine:/.*%[Aa][Pp][Pp][Dd][Aa][Tt][Aa]%.*/ OR data_win_eventdata_commandLine:/.*%[Cc][Oo][Mm][Ss][Pp][Ee][Cc]%.*/ OR data_win_eventdata_commandLine:/.*%[Ll][Oo][Cc][Aa][Ll][Aa][Pp][Pp][Dd][Aa][Tt][Aa]%.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 8a582fe2-0882-4b89-a82a-da6b2dc32937
    name: Suspicious WmiPrvSE Child Process
    reason: A process created via WMI surfaces as a WmiPrvSE child on the target host, confirming execution landed
  - id: 692f0bec-83ba-4d04-af7e-e884a96059b6
    name: Potential WMI Lateral Movement WmiPrvSE Spawned PowerShell
    reason: WMI-spawned PowerShell is a common payload when wmic process call create is used laterally
  - id: d6e464e4-5c6a-474e-82d2-aed616a3a492
    name: Impacket Lateral Movement WMIExec Commandline Parameters
    reason: Impacket wmiexec uses the same WMI process-create mechanism for lateral movement
  - id: e1693bc8-7168-4eab-8718-cdcaa68a1738
    name: Suspicious WMIC Execution Via Office Process
    reason: WMIC launched from Office points to the macro-based initial-access path to this technique
  - id: ebef4391-1a81-4761-a40a-1db446c0e625
    name: NewActiveScriptEventConsumer Creation Attempt via Wmic.EXE
    reason: WMIC is also used for WMI event-consumer persistence by the same actor
  - id: 9d7ca793-f6bd-471c-8d0f-11e68b2f0d2f
    name: Computer System Reconnaissance Via Wmic.EXE
    reason: WMIC system recon typically precedes remote process creation
  - id: d95de845-b83c-4a9a-8a6a-4fc802ebf6c0
    name: Suspicious Group And Account Reconnaissance Activity Using Net.EXE
    reason: Account/group recon via net.exe commonly accompanies WMI-driven lateral movement
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Children of WmiPrvSE
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 4h
  - name: WMIC remote node or process call usage
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*(\/[Nn][Oo][Dd][Ee]:|[Pp][Rr][Oo][Cc][Ee][Ss][Ss] [Cc][Aa][Ll][Ll]).*/
    pivot_on: host
    window: 4h
  - name: Rundll32, regsvr32, bitsadmin or mshta payload execution
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Rr][Uu][Nn][Dd][Ll][Ll]32|[Rr][Ee][Gg][Ss][Vv][Rr]32|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]|[Mm][Ss][Hh][Tt][Aa])\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 4h
  - name: Network connections by wmic or the WMI provider
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Ww][Mm][Ii][Cc]|[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee])\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: WMI event subscription persistence
    query: (data_win_system_eventID:"19" OR data_win_system_eventID:"20" OR data_win_system_eventID:"21")
    pivot_on: host
    window: 24h
