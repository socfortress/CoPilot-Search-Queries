name: Process Memory Dump via RdrLeakDiag.EXE
id: edadb1e5-5919-4e4c-8462-a9e643b02c4b
version: 1
schema_version: "1.0"
date: "2024-08-15"
author: Cedric MAURUGEON, Florian Roth (Nextron Systems), Swachchhanda Shrawan Poudel, Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: edadb1e5-5919-4e4c-8462-a9e643b02c4b
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the use of the Microsoft Windows Resource Leak Diagnostic tool
  "rdrleakdiag.exe" to dump process memory. MITRE ATT&CK: T1003.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\rdrleakdiag.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "RdrLeakDiag.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-memdmp*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*/memdmp*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*–memdmp*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*—memdmp*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*―memdmp*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*fullmemdmp*"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -o *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /o *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* –o *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* —o *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* ―o *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -p *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /p *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* –p *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* —p *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* ―p *"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\rdrleakdiag.exe'; data_win_eventdata_originalFileName equals
  'RdrLeakDiag.exe'; data_win_eventdata_commandLine matches '*-memdmp*', among
  other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.pureid.io/dumping-abusing-windows-credentials-part-1/
  - https://www.crowdstrike.com/blog/overwatch-exposes-aquatic-panda-in-possession-of-log-4-shell-exploit-tools/
  - https://lolbas-project.github.io/lolbas/Binaries/Rdrleakdiag/
  - https://twitter.com/0gtweet/status/1299071304805560321?s=21
  - https://news.sophos.com/en-us/2024/06/05/operation-crimson-palace-a-technical-deep-dive
  - https://attack.mitre.org/techniques/T1003/001/

response:
  message: >
    Process Memory Dump via RdrLeakDiag.EXE detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1003.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.001
  custom_tags:
    - memory
    - rdrleakdiag
    - process_creation
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Rr][Dd][Rr][Ll][Ee][Aa][Kk][Dd][Ii][Aa][Gg]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Rr][Dd][Rr][Ll][Ee][Aa][Kk][Dd][Ii][Aa][Gg]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*-[Mm][Ee][Mm][Dd][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*\/[Mm][Ee][Mm][Dd][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*–[Mm][Ee][Mm][Dd][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*—[Mm][Ee][Mm][Dd][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*―[Mm][Ee][Mm][Dd][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ff][Uu][Ll][Ll][Mm][Ee][Mm][Dd][Mm][Pp].*/) AND (data_win_eventdata_commandLine:/.* -[Oo] .*/ OR data_win_eventdata_commandLine:/.* \/[Oo] .*/ OR data_win_eventdata_commandLine:/.* –[Oo] .*/ OR data_win_eventdata_commandLine:/.* —[Oo] .*/ OR data_win_eventdata_commandLine:/.* ―[Oo] .*/ OR data_win_eventdata_commandLine:/.* -[Pp] .*/ OR data_win_eventdata_commandLine:/.* \/[Pp] .*/ OR data_win_eventdata_commandLine:/.* –[Pp] .*/ OR data_win_eventdata_commandLine:/.* —[Pp] .*/ OR data_win_eventdata_commandLine:/.* ―[Pp] .*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a5a2d357-1ab8-4675-a967-ef9990a59391
    name: LSASS Process Memory Dump Files
    reason: Dump file produced by -memdmp output.
  - id: 5afee48e-67dd-4e03-a783-f74259dcf998
    name: Potential LSASS Process Dump Via Procdump
    reason: Alternative dumper an actor tries when one method is blocked.
  - id: 646ea171-dded-4578-8a4d-65e9822892e3
    name: Process Memory Dump Via Comsvcs.DLL
    reason: Operators commonly try multiple native dump methods in sequence.
  - id: 5ef9853e-4d0e-4a70-846f-a9ca37d876da
    name: Potential Credential Dumping Activity Via LSASS
    reason: Sysmon 10 access to LSASS by the dumper.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Process access to LSASS
    query: data_win_system_eventID:10 AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Dump files written
    query: data_win_system_eventID:11 AND (data_win_eventdata_targetFilename:*.dmp OR data_win_eventdata_targetFilename:*.dump OR data_win_eventdata_targetFilename:*.bin)
    pivot_on: host
    window: 2h
  - name: Rdrleakdiag usage
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*[Rr]dr[Ll]eak[Dd]iag.*/
    pivot_on: host
    window: 6h
  - name: Dump archived or exfiltrated
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*[Rr]ar.*\.dmp.*/ OR data_win_eventdata_commandLine:/.*7z.*\.dmp.*/ OR data_win_eventdata_commandLine:/.*[Cc]ompress-[Aa]rchive.*/ OR data_win_eventdata_commandLine:/.*[Cc]url.* -[Tt] .*/)
    pivot_on: host
    window: 4h
