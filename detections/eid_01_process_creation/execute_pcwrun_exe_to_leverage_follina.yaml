name: Execute Pcwrun.EXE To Leverage Follina
id: 6004abd0-afa4-4557-ba90-49d172e0a299
version: 1
schema_version: "1.0"
date: "2022-06-13"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 6004abd0-afa4-4557-ba90-49d172e0a299
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects indirect command execution via Program Compatibility Assistant
  "pcwrun.exe" leveraging the follina (CVE-2022-30190) vulnerability. MITRE
  ATT&CK: T1218.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\pcwrun.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine: "*../*"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\pcwrun.exe'; data_win_eventdata_commandLine matches '*../*'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/nas_bench/status/1535663791362519040
  - https://attack.mitre.org/techniques/T1218/

response:
  message: >
    Execute Pcwrun.EXE To Leverage Follina detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1218
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218
  custom_tags:
    - execute
    - pcwrun
    - leverage
    - process_creation
    - sysmon
    - stealth
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Pp][Cc][Ww][Rr][Uu][Nn]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*\.\.\/.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 258fc8ce-8352-443a-9120-8a11e4857fa5
    name: Potential Arbitrary Command Execution Using Msdt.EXE
    reason: 'Follina''s core: msdt.exe launched via ms-msdt URI executing arbitrary commands; same exploit family.'
  - id: 9c8c7000-3065-44a8-a555-79bcba5d9955
    name: MSDT Execution Via Answer File
    reason: MSDT answer-file execution is an alternate msdt-based code-exec path in the same diagnostic-tool abuse.
  - id: bd1c6866-65fc-44b2-be51-5588fcff82b9
    name: Renamed Msdt.EXE Execution
    reason: Renamed msdt.exe indicates evasion of Follina detections on the same host.
  - id: 868955d9-697e-45d4-a3da-360cefd7c216
    name: Potential Exploitation Attempt From Office Application
    reason: Follina is typically triggered from a Word document; Office spawning exploit-style children precedes pcwrun.
  - id: 4ae3e30b-b03f-43aa-87e3-b622f4048eed
    name: Potential Arbitrary File Download Using Office Application
    reason: Office application downloading the remote HTML template is the initial Follina fetch.
  - id: aa3a6f94-890e-4e22-b634-ffdfd54792cc
    name: Suspicious Binary In User Directory Spawned From Office Application
    reason: 'Post-exploit: payload binary in a user directory spawned by the Office/msdt chain.'
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Office or diagnostic tool spawning interpreters
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*([Ww][Ii][Nn][Ww][Oo][Rr][Dd]|[Ee][Xx][Cc][Ee][Ll]|[Pp][Oo][Ww][Ee][Rr][Pp][Nn][Tt]|[Oo][Uu][Tt][Ll][Oo][Oo][Kk]|[Mm][Ss][Dd][Tt]|[Ss][Dd][Ii][Aa][Gg][Nn][Hh][Ss][Tt]|[Pp][Cc][Ww][Rr][Uu][Nn])\.exe/ AND data_win_eventdata_image:/.*\\(cmd|powershell|pwsh|mshta|rundll32|regsvr32|wscript|cscript|certutil|bitsadmin)\.exe/
    pivot_on: host
    window: 2h
  - name: msdt or sdiagnhost with Follina arguments
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Mm][Ss][Dd][Tt]\.exe/ OR data_win_eventdata_image:/.*[Ss][Dd][Ii][Aa][Gg][Nn][Hh][Ss][Tt]\.exe/) AND data_win_eventdata_commandLine:/.*([Ii][Tt]_[Bb][Rr][Oo][Ww][Ss][Ee][Ff][Oo][Rr][Ff][Ii][Ll][Ee]|[Ii][Tt]_[Rr][Uu][Nn][Ff][Rr][Oo][Mm]|[Pp][Cc][Ww][Dd][Ii][Aa][Gg]).*/
    pivot_on: host
    window: 2h
  - name: Word network connections
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Ww][Ii][Nn][Ww][Oo][Rr][Dd]\.exe/
    pivot_on: host
    window: 4h
  - name: Office documents written to download paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.(docx|docm|rtf|doc)/ AND data_win_eventdata_targetFilename:/.*([Dd]ownloads|[Tt]emp|INetCache).*/
    pivot_on: host
    window: 24h
