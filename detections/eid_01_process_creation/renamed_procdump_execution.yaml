name: Renamed ProcDump Execution
id: 4a0b2c7e-7cb2-495d-8b63-5f268e7bfd67
version: 1
schema_version: "1.0"
date: "2026-06-29"
author: Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 4a0b2c7e-7cb2-495d-8b63-5f268e7bfd67
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of a renamed ProcDump executable. This often done by
  attackers or malware in order to evade defensive mechanisms. MITRE ATT&CK:
  T1036.003.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - term:
                  data_win_eventdata_originalFileName:
                    value: "procdump"
                    case_insensitive: true
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* -ma *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* /ma *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* –ma *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* —ma *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* ―ma *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* -mp *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* /mp *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* –mp *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* —mp *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* ―mp *"
                                case_insensitive: true
                        minimum_should_match: 1
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* -accepteula*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* /accepteula*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* –accepteula*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* —accepteula*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* ―accepteula*"
                                case_insensitive: true
                        minimum_should_match: 1
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\procdump.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\procdump64.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\procdump64a.exe"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_originalFileName equals
  'procdump'; data_win_eventdata_commandLine matches '* -ma *';
  data_win_eventdata_commandLine matches '* /ma *', among other conditions.

known_false_positives: >
  Procdump illegally bundled with legitimate software.. Administrators who
  rename binaries (should be investigated). Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://learn.microsoft.com/en-us/sysinternals/downloads/procdump
  - https://attack.mitre.org/techniques/T1036/003/

response:
  message: >
    Renamed ProcDump Execution detected on host $agent_name$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
    MITRE ATT&CK: T1036.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_originalFileName
      type: file_name
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1036.003
  custom_tags:
    - renamed
    - procdump
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_originalFileName:/[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]/ OR ((data_win_eventdata_commandLine:/.* -[Mm][Aa] .*/ OR data_win_eventdata_commandLine:/.* \/[Mm][Aa] .*/ OR data_win_eventdata_commandLine:/.* –[Mm][Aa] .*/ OR data_win_eventdata_commandLine:/.* —[Mm][Aa] .*/ OR data_win_eventdata_commandLine:/.* ―[Mm][Aa] .*/ OR data_win_eventdata_commandLine:/.* -[Mm][Pp] .*/ OR data_win_eventdata_commandLine:/.* \/[Mm][Pp] .*/ OR data_win_eventdata_commandLine:/.* –[Mm][Pp] .*/ OR data_win_eventdata_commandLine:/.* —[Mm][Pp] .*/ OR data_win_eventdata_commandLine:/.* ―[Mm][Pp] .*/) AND (data_win_eventdata_commandLine:/.* -[Aa][Cc][Cc][Ee][Pp][Tt][Ee][Uu][Ll][Aa].*/ OR data_win_eventdata_commandLine:/.* \/[Aa][Cc][Cc][Ee][Pp][Tt][Ee][Uu][Ll][Aa].*/ OR data_win_eventdata_commandLine:/.* –[Aa][Cc][Cc][Ee][Pp][Tt][Ee][Uu][Ll][Aa].*/ OR data_win_eventdata_commandLine:/.* —[Aa][Cc][Cc][Ee][Pp][Tt][Ee][Uu][Ll][Aa].*/ OR data_win_eventdata_commandLine:/.* ―[Aa][Cc][Cc][Ee][Pp][Tt][Ee][Uu][Ll][Aa].*/))) AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]64\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]64[Aa]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 5afee48e-67dd-4e03-a783-f74259dcf998
    name: Potential LSASS Process Dump Via Procdump
    reason: Procdump targeting LSASS is the most likely purpose of the renamed binary
  - id: 2e65275c-8288-4ab4-aeb7-6274f58b6b20
    name: Procdump Execution
    reason: Un-renamed procdump runs on the same host indicate repeated dump attempts
  - id: 79b06761-465f-4f88-9ef2-150e24d3d737
    name: Potential SysInternals ProcDump Evasion
    reason: Other procdump evasion variants in the same session
  - id: ffa6861c-4461-4f59-8a41-578c39f3f23e
    name: LSASS Dump Keyword In CommandLine
    reason: lsass keyword on the command line confirms credential-dump intent
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: comsvcs MiniDump is the fallback if procdump gets blocked
  - id: 1a1ed54a-2ba4-4221-94d5-01dee560d71e
    name: Renamed CreateDump Utility Execution
    reason: Renamed createdump is another renamed dumper used the same way
  - id: b2815d0d-7481-4bf0-9b6c-a4c48a94b349
    name: PowerShell Get-Process LSASS
    reason: Get-Process lsass precedes dumping to obtain the PID
  - id: 044ba588-dff4-4918-9808-3f95e8160606
    name: Copy .DMP/.DUMP Files From Remote Share Via Cmd.EXE
    reason: Dump files copied off via share is the exfil step after dumping
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: LSASS targeting in command lines
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ll][Ss][Aa][Ss][Ss].*/ OR /.*[Mm]ini[Dd]ump.*/)
    pivot_on: host
    window: 4h
  - name: Dump files written
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(/.*\.[Dd][Mm][Pp]/ OR /.*[Ll][Ss][Aa][Ss][Ss].*/)
    pivot_on: host
    window: 4h
  - name: LSASS process access
    query: data_win_system_eventID:10 AND data_win_eventdata_targetImage:/.*[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 4h
  - name: Archiving or staging dumps
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*\.[Dd][Mm][Pp].*/
    pivot_on: host
    window: 6h
  - name: Network logons after dump
    query: data_win_system_eventID:4624 AND data_win_eventdata_logonType:(3 OR 9)
    pivot_on: user
    window: 6h
