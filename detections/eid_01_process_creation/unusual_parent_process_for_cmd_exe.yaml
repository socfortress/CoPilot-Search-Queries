name: Unusual Parent Process For Cmd.EXE
id: 4b991083-3d0e-44ce-8fc4-b254025d8d4b
version: 1
schema_version: "1.0"
date: "2023-12-05"
author: Tim Rauch, Elastic (idea)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 4b991083-3d0e-44ce-8fc4-b254025d8d4b
  commit: release-20260810
