name: TAIDOOR RAT DLL Load
id: d1aa3382-abab-446f-96ea-4de52908210b
version: 1
schema_version: "1.0"
date: "2021-11-27"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: d1aa3382-abab-446f-96ea-4de52908210b
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects specific process characteristics of Chinese TAIDOOR RAT malware load.
  MITRE ATT&CK: T1055.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*dll,MyStart*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*dll MyStart*"
                    case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* MyStart"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*rundll32.exe*"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*dll,MyStart*'; data_win_eventdata_commandLine matches '*dll MyStart*';
  data_win_eventdata_commandLine matches '* MyStart', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://us-cert.cisa.gov/ncas/analysis-reports/ar20-216a
  - https://attack.mitre.org/techniques/T1055/001/

response:
  message: >
    TAIDOOR RAT DLL Load detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1055.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1055.001
  custom_tags:
    - taidoor
    - process_creation
    - sysmon
    - privilege_escalation
    - execution
    - stealth
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Dd][Ll][Ll],[Mm][Yy][Ss][Tt][Aa][Rr][Tt].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ll][Ll] [Mm][Yy][Ss][Tt][Aa][Rr][Tt].*/ OR (data_win_eventdata_commandLine:/.* [Mm][Yy][Ss][Tt][Aa][Rr][Tt]/ AND data_win_eventdata_commandLine:/.*[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee].*/))

