name: New User Created Via Net.EXE With Never Expire Option
id: b9f0e6f5-09b4-4358-bae4-08408705bd5c
version: 1
schema_version: "1.0"
date: "2023-02-21"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: b9f0e6f5-09b4-4358-bae4-08408705bd5c
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects creation of local users via the net.exe command with the option "never
  expire". MITRE ATT&CK: T1136.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\net.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\net1.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "net.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "net1.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*user*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*add*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*expires:never*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches '*\net.exe';
  data_win_eventdata_image matches '*\net1.exe';
  data_win_eventdata_originalFileName equals 'net.exe', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://thedfirreport.com/2022/07/11/select-xmrig-from-sqlserver/
  - https://attack.mitre.org/techniques/T1136/001/

response:
  message: >
    New User Created Via Net.EXE With Never Expire Option detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1136.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1136.001
  custom_tags:
    - never
    - expire
    - option
    - process_creation
    - sysmon
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Nn][Ee][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Nn][Ee][Tt]1\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Nn][Ee][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Nn][Ee][Tt]1\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Uu][Ss][Ee][Rr].*/ AND data_win_eventdata_commandLine:/.*[Aa][Dd][Dd].*/ AND data_win_eventdata_commandLine:/.*[Ee][Xx][Pp][Ii][Rr][Ee][Ss]:[Nn][Ee][Vv][Ee][Rr].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: cd219ff3-fa99-45d4-8380-a7d15116c6dc
    name: New User Created Via Net.EXE
    reason: Broader sibling rule firing on the same account creation
  - id: ad720b90-25ad-43ff-9b5e-5c841facc8e5
    name: User Added to Local Administrators Group
    reason: 'Most common next step: the new account is elevated to local admin'
  - id: ffa28e60-bdb1-46e0-9f82-05f7a61cc06e
    name: User Added to Remote Desktop Users Group
    reason: New account granted RDP access for remote persistence
  - id: 2c568c34-bb57-4b43-9d75-19c605b98e70
    name: Windows Create Local Administrator Account Via Net
    reason: 'Escalated variant: local admin account created directly via net'
  - id: 3fb2e8e3-7bc0-4567-9722-c5ab9f8595eb
    name: Windows Create Local Account
    reason: Security-log 4720 confirmation that the account was really created
  - id: c265cf08-3f99-46c1-8d59-328247057d57
    name: User Added to Local Administrator Group
    reason: Security-log confirmation of admin group membership change
  - id: 7864a175-3654-4824-9f0d-f0da18ab27c0
    name: Password Set to Never Expire via WMI
    reason: Same never-expire persistence goal via WMI
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Account creation or password setting by net, PowerShell or WMI
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Nn][Ee][Tt]1? +[Uu][Ss][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Ww]-[Ll][Oo][Cc][Aa][Ll][Uu][Ss][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Uu][Ss][Ee][Rr][Aa][Cc][Cc][Oo][Uu][Nn][Tt].*/)
    pivot_on: host
    window: 2h
  - name: Account added to Administrators or Remote Desktop Users group
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp].*/ OR data_win_eventdata_commandLine:/.*[Aa][Dd][Mm][Ii][Nn][Ii][Ss][Tt][Rr][Aa][Tt][Oo][Rr][Ss].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Mm][Oo][Tt][Ee] [Dd][Ee][Ss][Kk][Tt][Oo][Pp].*/)
    pivot_on: host
    window: 4h
  - name: Hidden account via SpecialAccounts registry key
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Ss][Pp][Ee][Cc][Ii][Aa][Ll][Aa][Cc][Cc][Oo][Uu][Nn][Tt][Ss].*/
    pivot_on: host
    window: 24h
  - name: RDP enablement or firewall opening after account creation
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ff][Dd][Ee][Nn][Yy][Tt][Ss][Cc][Oo][Nn][Nn][Ee][Cc][Tt][Ii][Oo][Nn][Ss].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt][Ss][Hh].*3389.*/ OR data_win_eventdata_commandLine:/.*[Tt][Ee][Rr][Mm][Ii][Nn][Aa][Ll] [Ss][Ee][Rr][Vv][Ee][Rr].*/)
    pivot_on: host
    window: 24h
  - name: Persistence via scheduled tasks or new services
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ OR (data_win_eventdata_image:/.*\\[Ss][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee].*/))
    pivot_on: host
    window: 6h
