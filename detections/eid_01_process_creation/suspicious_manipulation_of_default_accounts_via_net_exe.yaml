 .*/ OR data_win_eventdata_commandLine:/.* \"[Dd][Ee][Ff][Aa][Uu][Ll][Tt][Aa][Cc][Cc][Oo][Uu][Nn][Tt]\" .*/ OR data_win_eventdata_commandLine:/.* '[Jj][Ää][Rr][Jj][Ee][Ss][Tt][Ee][Ll][Mm][Ää][Nn][Vv][Aa][Ll][Vv][Oo][Jj][Aa]' .*/ OR data_win_eventdata_commandLine:/.* '[Rr][Ee][Nn][Dd][Ss][Zz][Ee][Rr][Gg][Aa][Zz][Dd][Aa]' .*/ OR data_win_eventdata_commandLine:/.* '[Аа][Дд][Мм][Ии][Нн][Ии][Сс][Тт][Рр][Аа][Тт][Оо][Рр]' .*/ OR data_win_eventdata_commandLine:/.* '[Aa][Dd][Mm][Ii][Nn][Ii][Ss][Tt][Rr][Aa][Tt][Ee][Uu][Rr]' .*/ OR data_win_eventdata_commandLine:/.* '[Aa][Dd][Mm][Ii][Nn][Ii][Ss][Tt][Rr][Aa][Dd][Oo][Rr]' .*/ OR data_win_eventdata_commandLine:/.* '[Aa][Dd][Mm][Ii][Nn][Ii][Ss][Tt][Rr][Aa][Tt][Öö][Rr]' .*/ OR data_win_eventdata_commandLine:/.* '[Aa][Dd][Mm][Ii][Nn][Ii][Ss][Tt][Rr][Aa][Tt][Oo][Rr]' .*/ OR data_win_eventdata_commandLine:/.* '[Gg][Uu][Ee][Ss][Tt]' .*/ OR data_win_eventdata_commandLine:/.* '[Dd][Ee][Ff][Aa][Uu][Ll][Tt][Aa][Cc][Cc][Oo][Uu][Nn][Tt]' .*/) AND _exists_:data_win_eventdata_commandLine AND NOT (data_win_eventdata_commandLine:/.*[Gg][Uu][Ee][Ss][Tt].*/ AND data_win_eventdata_commandLine:/.*\/[Aa][Cc][Tt][Ii][Vv][Ee] [Nn][Oo].*/)

