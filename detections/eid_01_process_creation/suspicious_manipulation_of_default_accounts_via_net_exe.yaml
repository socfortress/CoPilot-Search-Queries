 .*/ OR data_win_eventdata_commandLine:/.* \"[Dd][Ee][Ff][Aa][Uu][Ll][Tt][Aa][Cc][Cc][Oo][Uu][Nn][Tt]\" .*/ OR data_win_eventdata_commandLine:/.* '[Jj][Ää][Rr][Jj][Ee][Ss][Tt][Ee][Ll][Mm][Ää][Nn][Vv][Aa][Ll][Vv][Oo][Jj][Aa]' .*/ OR data_win_eventdata_commandLine:/.* '[Rr][Ee][Nn][Dd][Ss][Zz][Ee][Rr][Gg][Aa][Zz][Dd][Aa]' .*/ OR data_win_eventdata_commandLine:/.* '[Аа][Дд][Мм][Ии][Нн][Ии][Сс][Тт][Рр][Аа][Тт][Оо][Рр]' .*/ OR data_win_eventdata_commandLine:/.* '[Aa][Dd][Mm][Ii][Nn][Ii][Ss][Tt][Rr][Aa][Tt][Ee][Uu][Rr]' .*/ OR data_win_eventdata_commandLine:/.* '[Aa][Dd][Mm][Ii][Nn][Ii][Ss][Tt][Rr][Aa][Dd][Oo][Rr]' .*/ OR data_win_eventdata_commandLine:/.* '[Aa][Dd][Mm][Ii][Nn][Ii][Ss][Tt][Rr][Aa][Tt][Öö][Rr]' .*/ OR data_win_eventdata_commandLine:/.* '[Aa][Dd][Mm][Ii][Nn][Ii][Ss][Tt][Rr][Aa][Tt][Oo][Rr]' .*/ OR data_win_eventdata_commandLine:/.* '[Gg][Uu][Ee][Ss][Tt]' .*/ OR data_win_eventdata_commandLine:/.* '[Dd][Ee][Ff][Aa][Uu][Ll][Tt][Aa][Cc][Cc][Oo][Uu][Nn][Tt]' .*/) AND _exists_:data_win_eventdata_commandLine AND NOT (data_win_eventdata_commandLine:/.*[Gg][Uu][Ee][Ss][Tt].*/ AND data_win_eventdata_commandLine:/.*\/[Aa][Cc][Tt][Ii][Vv][Ee] [Nn][Oo].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d4498716-1d52-438f-8084-4a603157d131
    name: Password Provided In Command Line Of Net.EXE
    reason: Password reset via net user places the new password on the command line
  - id: d95de845-b83c-4a9a-8a6a-4fc802ebf6c0
    name: Suspicious Group And Account Reconnaissance Activity Using Net.EXE
    reason: Account recon usually precedes choosing which default account to enable
  - id: 4902d7aa-0134-11ec-9d65-acde48001122
    name: Local Account Discovery With Wmic
    reason: Alternate local account discovery step
  - id: cd219ff3-fa99-45d4-8380-a7d15116c6dc
    name: New User Created Via Net.EXE
    reason: Operators who enable default accounts often also create new ones
  - id: ad720b90-25ad-43ff-9b5e-5c841facc8e5
    name: User Added to Local Administrators Group
    reason: Follow-on privilege assignment to the enabled account
  - id: 10fb649c-3600-4d37-b1e6-56ea90bb7e09
    name: User Added To Highly Privileged Group
    reason: Escalation of the reactivated account into privileged groups
  - id: 7b449a5e-1db5-4dd0-a2dc-4e3a67282538
    name: Hidden Local User Creation
    reason: Persistence variant using hidden local accounts
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Local account and group changes via net
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Nn]et1?\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.* user .*/ OR data_win_eventdata_commandLine:/.* localgroup .*/)
    pivot_on: host
    window: 6h
  - name: Remote access enabled after account change
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ff][Dd]eny[Tt][Ss][Cc]onnections.*/ OR data_win_eventdata_commandLine:/.*[Ss]et-[Ll]ocal[Uu]ser.*/ OR data_win_eventdata_commandLine:/.*[Nn]etsh.*3389.*/)
    pivot_on: host
    window: 6h
  - name: Credential dumping preceding account takeover
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Mm]imikatz.*/ OR data_win_eventdata_commandLine:/.*[Rr]eg.*[Ss]ave.*[Ss][Aa][Mm].*/ OR data_win_eventdata_commandLine:/.*[Ll]sass.*/)
    pivot_on: host
    window: 6h
  - name: Remote execution tooling
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Pp]s[Ee]xec.*/ OR data_win_eventdata_commandLine:/.*[Ww]mic.*[Nn]ode.*/ OR data_win_eventdata_commandLine:/.*[Ss]chtasks.*/)
    pivot_on: host
    window: 6h
