name: Potentially Suspicious Call To Win32_NTEventlogFile Class
id: caf201a9-c2ce-4a26-9c3a-2b9525413711
version: 1
schema_version: "1.0"
date: "2023-07-13"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: caf201a9-c2ce-4a26-9c3a-2b9525413711
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects usage of the WMI class "Win32_NTEventlogFile" in a potentially
  suspicious way (delete, backup, change permissions, etc.) from a PowerShell
  script.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*Win32_NTEventlogFile*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.BackupEventlog(*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.ChangeSecurityPermissions(*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.ChangeSecurityPermissionsEx(*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.ClearEventLog(*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.Delete(*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.DeleteEx(*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.Rename(*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.TakeOwnerShip(*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.TakeOwnerShipEx(*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*Win32_NTEventlogFile*'; data_win_eventdata_commandLine matches
  '*.BackupEventlog(*'; data_win_eventdata_commandLine matches
  '*.ChangeSecurityPermissions(*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://learn.microsoft.com/en-us/previous-versions/windows/desktop/legacy/aa394225(v=vs.85)

response:
  message: >
    Potentially Suspicious Call To Win32_NTEventlogFile Class detected on host
    $agent_name$. Matched data_win_eventdata_commandLine:
    $data_win_eventdata_commandLine$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - win32
    - nteventlogfile
    - class
    - process_creation
    - sysmon
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Ww][Ii][Nn]32_[Nn][Tt][Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg][Ff][Ii][Ll][Ee].*/ AND (data_win_eventdata_commandLine:/.*\.[Bb][Aa][Cc][Kk][Uu][Pp][Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg]\(.*/ OR data_win_eventdata_commandLine:/.*\.[Cc][Hh][Aa][Nn][Gg][Ee][Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy][Pp][Ee][Rr][Mm][Ii][Ss][Ss][Ii][Oo][Nn][Ss]\(.*/ OR data_win_eventdata_commandLine:/.*\.[Cc][Hh][Aa][Nn][Gg][Ee][Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy][Pp][Ee][Rr][Mm][Ii][Ss][Ss][Ii][Oo][Nn][Ss][Ee][Xx]\(.*/ OR data_win_eventdata_commandLine:/.*\.[Cc][Ll][Ee][Aa][Rr][Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg]\(.*/ OR data_win_eventdata_commandLine:/.*\.[Dd][Ee][Ll][Ee][Tt][Ee]\(.*/ OR data_win_eventdata_commandLine:/.*\.[Dd][Ee][Ll][Ee][Tt][Ee][Ee][Xx]\(.*/ OR data_win_eventdata_commandLine:/.*\.[Rr][Ee][Nn][Aa][Mm][Ee]\(.*/ OR data_win_eventdata_commandLine:/.*\.[Tt][Aa][Kk][Ee][Oo][Ww][Nn][Ee][Rr][Ss][Hh][Ii][Pp]\(.*/ OR data_win_eventdata_commandLine:/.*\.[Tt][Aa][Kk][Ee][Oo][Ww][Nn][Ee][Rr][Ss][Hh][Ii][Pp][Ee][Xx]\(.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e2812b49-bae0-4b21-b366-7c142eafcde2
    name: Potentially Suspicious Call To Win32_NTEventlogFile Class - PSScript
    reason: Script-block view of the same WMI call; reveals the actual script content.
  - id: cc36992a-4671-4f21-a91d-6c2b72a2edf5
    name: Suspicious Eventlog Clearing or Configuration Change Activity
    reason: Other command-line methods of clearing or reconfiguring event logs used with this WMI method.
  - id: fdb829a8-db84-4832-b64b-3e964cd44f01
    name: Windows Eventlog Cleared Via Wevtutil
    reason: Same anti-forensic goal via wevtutil, often run alongside.
  - id: 236e7c8e-c9d9-11eb-a824-acde48001122
    name: Disable Logs Using WevtUtil
    reason: Disabling logging channels is a companion defense-evasion step.
  - id: a62b37e0-45d3-48d9-a517-90c1a1b0186b
    name: Eventlog Cleared
    reason: Event 104 confirms whether the WMI ClearEventLog call actually cleared a log.
  - id: 0a13e132-651d-11eb-ae93-0242ac130002
    name: Audit Policy Tampering Via Auditpol
    reason: Audit policy tampering commonly accompanies log clearing.
  - id: 21ff4ca9-f13a-41ad-b828-0077b2af2e40
    name: Deletion of Volume Shadow Copies via WMI with PowerShell
    reason: Ransomware and wiper operators combine WMI log wiping with shadow copy deletion.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: wevtutil clearing or disabling
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*[Ww]evtutil.*/ AND (data_win_eventdata_commandLine:/.* cl .*/ OR data_win_eventdata_commandLine:/.*clear-log.*/ OR data_win_eventdata_commandLine:/.* sl .*/)
    pivot_on: host
    window: 4h
  - name: Clear-EventLog and Remove-EventLog
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*[Cc]lear-[Ee]vent[Ll]og.*/ OR data_win_eventdata_commandLine:/.*[Rr]emove-[Ee]vent[Ll]og.*/ OR data_win_eventdata_commandLine:/.*[Ll]imit-[Ee]vent[Ll]og.*/)
    pivot_on: host
    window: 4h
  - name: Security and System log cleared events
    query: data_win_system_eventID:1102 OR data_win_system_eventID:104
    pivot_on: host
    window: 4h
  - name: Audit policy changes
    query: data_win_system_eventID:4719 OR (data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*[Aa]uditpol.*/)
    pivot_on: host
    window: 4h
  - name: Encoded or remote PowerShell preceding the call
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell\.exe/ AND (data_win_eventdata_commandLine:/.*[Ee]nc[Oo]ded.*/ OR data_win_eventdata_commandLine:/.*-[Ee][Nn][Cc] .*/ OR data_win_eventdata_commandLine:/.*[Ii]nvoke-[Cc]ommand.*/)
    pivot_on: host
    window: 4h
