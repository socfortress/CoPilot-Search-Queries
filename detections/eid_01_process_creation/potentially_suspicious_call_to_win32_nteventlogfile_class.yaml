name: Potentially Suspicious Call To Win32_NTEventlogFile Class
id: caf201a9-c2ce-4a26-9c3a-2b9525413711
version: 1
schema_version: "1.0"
date: "2023-07-13"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: caf201a9-c2ce-4a26-9c3a-2b9525413711
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects usage of the WMI class "Win32_NTEventlogFile" in a potentially
  suspicious way (delete, backup, change permissions, etc.) from a PowerShell
  script.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*Win32_NTEventlogFile*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.BackupEventlog(*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.ChangeSecurityPermissions(*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.ChangeSecurityPermissionsEx(*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.ClearEventLog(*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.Delete(*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.DeleteEx(*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.Rename(*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.TakeOwnerShip(*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.TakeOwnerShipEx(*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*Win32_NTEventlogFile*'; data_win_eventdata_commandLine matches
  '*.BackupEventlog(*'; data_win_eventdata_commandLine matches
  '*.ChangeSecurityPermissions(*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://learn.microsoft.com/en-us/previous-versions/windows/desktop/legacy/aa394225(v=vs.85)

response:
  message: >
    Potentially Suspicious Call To Win32_NTEventlogFile Class detected on host
    $agent_name$. Matched data_win_eventdata_commandLine:
    $data_win_eventdata_commandLine$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - win32
    - nteventlogfile
    - class
    - process_creation
    - sysmon
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Ww][Ii][Nn]32_[Nn][Tt][Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg][Ff][Ii][Ll][Ee].*/ AND (data_win_eventdata_commandLine:/.*\.[Bb][Aa][Cc][Kk][Uu][Pp][Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg]\(.*/ OR data_win_eventdata_commandLine:/.*\.[Cc][Hh][Aa][Nn][Gg][Ee][Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy][Pp][Ee][Rr][Mm][Ii][Ss][Ss][Ii][Oo][Nn][Ss]\(.*/ OR data_win_eventdata_commandLine:/.*\.[Cc][Hh][Aa][Nn][Gg][Ee][Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy][Pp][Ee][Rr][Mm][Ii][Ss][Ss][Ii][Oo][Nn][Ss][Ee][Xx]\(.*/ OR data_win_eventdata_commandLine:/.*\.[Cc][Ll][Ee][Aa][Rr][Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg]\(.*/ OR data_win_eventdata_commandLine:/.*\.[Dd][Ee][Ll][Ee][Tt][Ee]\(.*/ OR data_win_eventdata_commandLine:/.*\.[Dd][Ee][Ll][Ee][Tt][Ee][Ee][Xx]\(.*/ OR data_win_eventdata_commandLine:/.*\.[Rr][Ee][Nn][Aa][Mm][Ee]\(.*/ OR data_win_eventdata_commandLine:/.*\.[Tt][Aa][Kk][Ee][Oo][Ww][Nn][Ee][Rr][Ss][Hh][Ii][Pp]\(.*/ OR data_win_eventdata_commandLine:/.*\.[Tt][Aa][Kk][Ee][Oo][Ww][Nn][Ee][Rr][Ss][Hh][Ii][Pp][Ee][Xx]\(.*/)

correlation:
  # Authored by the correlation engine for review.
  enrichment_searches:
  # NEW ad-hoc searches the engine runs around an alert from this rule, scoped to
  # the alert's host/user/IP within the window (not existing CoPilot Searches).
    - name: "Sysmon activity on this host in the window"
      query: 'data_win_system_channel:"Microsoft-Windows-Sysmon/Operational"'
      pivot_on: [host]
      window: 1h
    - name: "Process creation on this host"
      query: 'data_win_system_eventID:"1"'
      pivot_on: [host]
      window: 1h
    - name: "Network connections from this host"
      query: 'data_win_system_eventID:"3"'
      pivot_on: [host]
      window: 1h
    - name: "High-severity alerts on this host"
      query: 'rule_level:>=10'
      pivot_on: [host]
      window: 1h
