name: Rundll32 InstallScreenSaver Execution
id: 15bd98ea-55f4-4d37-b09a-e7caa0fa2221
version: 1
schema_version: "1.0"
date: "2023-02-09"
author: Christopher Peacock @securepeacock, SCYTHE @scythe_io, TactiKoolSec
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 15bd98ea-55f4-4d37-b09a-e7caa0fa2221
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  An attacker may execute an application as a SCR File using rundll32.exe
  desk.cpl,InstallScreenSaver. MITRE ATT&CK: T1218.011.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\rundll32.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "RUNDLL32.EXE"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*InstallScreenSaver*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\rundll32.exe'; data_win_eventdata_originalFileName equals 'RUNDLL32.EXE';
  data_win_eventdata_commandLine matches '*InstallScreenSaver*'.

known_false_positives: >
  Legitimate installation of a new screensaver. Baseline expected activity in
  your environment and tune this detection before relying on it for automated
  response.

references:
  - https://lolbas-project.github.io/lolbas/Libraries/Desk/
  - https://github.com/redcanaryco/atomic-red-team/blob/0f229c0e42bfe7ca736a14023836d65baa941ed2/atomics/T1218.011/T1218.011.md#atomic-test-13---rundll32-with-deskcpl
  - https://attack.mitre.org/techniques/T1218/011/

response:
  message: >
    Rundll32 InstallScreenSaver Execution detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1218.011
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218.011
  custom_tags:
    - rundll32
    - installscreensaver
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Ss][Cc][Rr][Ee][Ee][Nn][Ss][Aa][Vv][Ee][Rr].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 0ba863e6-def5-4e50-9cea-4dd8c7dc46a4
    name: Control Panel Items
    reason: desk.cpl is a Control Panel item; same CPL proxy-execution family
  - id: e593cf51-88db-4ee1-b920-37e89012a3c9
    name: Potentially Suspicious Rundll32 Activity
    reason: Generic suspicious rundll32 command lines co-occur when an operator chains LOLBin proxy execution
  - id: c3a99af4-35a9-4668-879e-c09aeb4f2bdf
    name: Rundll32 Execution With Uncommon DLL Extension
    reason: Payload passed with odd extension is the same masquerading tradecraft
  - id: 2569ed8c-1147-498a-9b8c-2ad3656b10ed
    name: Potential Renamed Rundll32 Execution
    reason: Attacker evading rundll32 name-based detections on the same host
  - id: de587dce-915e-4218-aac4-835ca6af6f70
    name: Potential Persistence Attempt Via Run Keys Using Reg.EXE
    reason: Screensaver payloads are often paired with autorun persistence after execution
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Executable dropped as SCR/DLL/CPL in user-writable path
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.([Dd][Ll][Ll]|[Ss][Cc][Rr]|[Cc][Pp][Ll])/ AND data_win_eventdata_targetFilename:/.*(\\[Tt][Ee][Mm][Pp]|\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]|\\[Pp][Uu][Bb][Ll][Ii][Cc]|\\[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]).*/
    pivot_on: host
    window: 4h
  - name: Screensaver registry settings changed
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND data_win_eventdata_targetObject:/.*[Cc][Oo][Nn][Tt][Rr][Oo][Ll] [Pp][Aa][Nn][Ee][Ll]\\[Dd][Ee][Ss][Kk][Tt][Oo][Pp].*([Ss][Cc][Rr][Nn][Ss][Aa][Vv][Ee]|[Ss][Cc][Rr][Ee][Ee][Nn][Ss][Aa][Vv][Ee][Rr]).*/
    pivot_on: host
    window: 24h
  - name: Children spawned by rundll32
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Cc][Mm][Dd]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Mm][Ss][Hh][Tt][Aa]|[Ww][Mm][Ii][Cc]|[Nn][Ee][Tt]|[Nn][Ee][Tt]1|[Nn][Ss][Ll][Oo][Oo][Kk][Uu][Pp]|[Ww][Hh][Oo][Aa][Mm][Ii])\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Outbound network from rundll32
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Autorun/persistence registry writes
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND data_win_eventdata_targetObject:/.*([Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn]|[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]\\[Ss][Hh][Ee][Ll][Ll]|[Cc][Oo][Nn][Tt][Rr][Oo][Ll] [Pp][Aa][Nn][Ee][Ll]\\[Dd][Ee][Ss][Kk][Tt][Oo][Pp]\\[Ss][Cc][Rr][Nn][Ss][Aa][Vv][Ee].[Ee][Xx][Ee]).*/
    pivot_on: host
    window: 24h
