name: File In Suspicious Location Encoded To Base64 Via Certutil.EXE
id: 82a6714f-4899-4f16-9c1e-9a333544d4c3
version: 1
schema_version: "1.0"
date: "2024-03-05"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 82a6714f-4899-4f16-9c1e-9a333544d4c3
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of certutil with the "encode" flag to encode a file to
  base64 where the files are located in potentially suspicious locations. MITRE
  ATT&CK: T1027.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\certutil.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "CertUtil.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-encode*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*/encode*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*–encode*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*—encode*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*―encode*"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\AppData\\\\Roaming\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Desktop\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Local\\\\Temp\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\PerfLogs\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Users\\\\Public\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Windows\\\\Temp\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*$Recycle.Bin*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\certutil.exe'; data_win_eventdata_originalFileName equals 'CertUtil.exe';
  data_win_eventdata_commandLine matches '*-encode*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.virustotal.com/gui/file/35c22725a92d5cb1016b09421c0a6cdbfd860fd4778b3313669b057d4a131cb7/behavior
  - https://www.virustotal.com/gui/file/427616528b7dbc4a6057ac89eb174a3a90f7abcf3f34e5a359b7a910d82f7a72/behavior
  - https://www.virustotal.com/gui/file/34de4c8beded481a4084a1fd77855c3e977e8ac643e5c5842d0f15f7f9b9086f/behavior
  - https://www.virustotal.com/gui/file/4abe1395a09fda06d897a9c4eb247278c1b6cddda5d126ce5b3f4f499e3b8fa2/behavior
  - https://attack.mitre.org/techniques/T1027/

response:
  message: >
    File In Suspicious Location Encoded To Base64 Via Certutil.EXE detected on
    host $agent_name$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1027
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1027
  custom_tags:
    - location
    - encoded
    - base64
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*-[Ee][Nn][Cc][Oo][Dd][Ee].*/ OR data_win_eventdata_commandLine:/.*\/[Ee][Nn][Cc][Oo][Dd][Ee].*/ OR data_win_eventdata_commandLine:/.*–[Ee][Nn][Cc][Oo][Dd][Ee].*/ OR data_win_eventdata_commandLine:/.*—[Ee][Nn][Cc][Oo][Dd][Ee].*/ OR data_win_eventdata_commandLine:/.*―[Ee][Nn][Cc][Oo][Dd][Ee].*/) AND (data_win_eventdata_commandLine:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Rr][Oo][Aa][Mm][Ii][Nn][Gg]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Dd][Ee][Ss][Kk][Tt][Oo][Pp]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_commandLine:/.*\$[Rr][Ee][Cc][Yy][Cc][Ll][Ee]\.[Bb][Ii][Nn].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 19b08b1c-861d-4e75-a1ef-ea0c1baf202b
    name: Suspicious Download Via Certutil.EXE
    reason: Certutil is often first used to download the payload that is then encoded for staging or exfiltration.
  - id: cc9cbe82-7bc0-4ef5-bc23-bbfb83947be7
    name: File Decoded From Base64/Hex Via Certutil.EXE
    reason: 'The reverse operation: the encoded blob is decoded on the receiving host to rebuild the file.'
  - id: ea0cdc3e-2239-4f26-a947-4e8f8224e464
    name: Suspicious File Encoded To Base64 Via Certutil.EXE
    reason: Sibling detection on suspicious file extensions; same encode-for-exfil behaviour with different file criteria.
  - id: 0dba975d-a193-4ed1-a067-424df57570d1
    name: Uncommon Network Connection Initiated By Certutil.EXE
    reason: Encoded data typically leaves the host over a certutil or other outbound connection next.
  - id: 3ffd6f51-e6c1-47b7-94b4-c1e61d4117c5
    name: Certificate Exported Via Certutil.EXE
    reason: Certutil used to export and base64 encode certificates or private keys, a common exfil staging target.
  - id: 8bc64091-6875-4881-aaf9-7bd25b5dda08
    name: Suspicious Process Patterns NTDS.DIT Exfil
    reason: Credential stores copied to a temp dir are commonly base64 encoded with certutil before exfiltration.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Certutil activity (all modes) on host
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Cc]ertutil\.exe/
    pivot_on: host
    window: 4h
  - name: Certutil decode or download following encode
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Cc]ertutil\.exe/ AND (data_win_eventdata_commandLine:/.*-decode.*/ OR data_win_eventdata_commandLine:/.*urlcache.*/ OR data_win_eventdata_commandLine:/.*-verifyctl.*/)
    pivot_on: host
    window: 6h
  - name: Archive creation of staged data
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*[Rr]ar.* a .*/ OR data_win_eventdata_commandLine:/.*7z.* a .*/ OR data_win_eventdata_commandLine:/.*[Cc]ompress-[Aa]rchive.*/ OR data_win_eventdata_commandLine:/.*tar.* -c.*/)
    pivot_on: host
    window: 4h
  - name: Outbound transfer tools after staging
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*\\(curl|bitsadmin|ftp|scp)\.exe/ OR data_win_eventdata_commandLine:/.*[Ii]nvoke-[Ww]eb[Rr]equest.*/ OR data_win_eventdata_commandLine:/.*[Ss]tart-[Bb]its[Tt]ransfer.*/)
    pivot_on: host
    window: 4h
  - name: Outbound network connections by certutil
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*[Cc]ertutil\.exe/
    pivot_on: host
    window: 4h
