name: Dumping Process via Sqldumper.exe
id: 23ceaf5c-b6f1-4a32-8559-f2ff734be516
version: 1
schema_version: "1.0"
date: "2021-11-27"
author: Kirill Kiryanov, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 23ceaf5c-b6f1-4a32-8559-f2ff734be516
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects process dump via legitimate sqldumper.exe binary. MITRE ATT&CK:
  T1003.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\sqldumper.exe"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*0x0110*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*0x01100:40*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\sqldumper.exe'; data_win_eventdata_commandLine matches '*0x0110*';
  data_win_eventdata_commandLine matches '*0x01100:40*'.

known_false_positives: >
  Legitimate MSSQL Server actions. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://twitter.com/countuponsec/status/910977826853068800
  - https://twitter.com/countuponsec/status/910969424215232518
  - https://lolbas-project.github.io/lolbas/OtherMSBinaries/Sqldumper/
  - https://attack.mitre.org/techniques/T1003/001/

response:
  message: >
    Dumping Process via Sqldumper.exe detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1003.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.001
  custom_tags:
    - dumping
    - sqldumper
    - process_creation
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss][Qq][Ll][Dd][Uu][Mm][Pp][Ee][Rr]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*0[Xx]0110.*/ OR data_win_eventdata_commandLine:/.*0[Xx]01100:40.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: dee0a7a3-f200-4112-a99b-952196d81e42
    name: DumpMinitool Execution
    reason: Sibling signed-Microsoft memory dumper (DumpMinitool); attackers rotate between these when one is blocked.
  - id: 515c8be5-e5df-4c5e-8f6d-a4a2f05e4b48
    name: CreateDump Process Dump
    reason: createdump.exe is another legitimate LOLBin used to dump process memory.
  - id: 5ef9853e-4d0e-4a70-846f-a9ca37d876da
    name: Potential Credential Dumping Activity Via LSASS
    reason: sqldumper dumping lsass produces a process access on LSASS (EID 10); confirms the target.
  - id: 9bd012ee-0dff-44d7-84a0-aa698cfd87a3
    name: LSASS Memory Access by Tool With Dump Keyword In Name
    reason: LSASS access by a tool with dump in its name; matches sqldumper and other dump-named binaries.
  - id: a5a2d357-1ab8-4675-a967-ef9990a59391
    name: LSASS Process Memory Dump Files
    reason: The resulting dump file on disk, where the credentials sit.
  - id: 5afee48e-67dd-4e03-a783-f74259dcf998
    name: Potential LSASS Process Dump Via Procdump
    reason: Procdump is the most common companion or alternative for LSASS dumping.
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: comsvcs.dll MiniDump is the usual fallback LSASS dump method.
  - id: 1ac14d38-3dfc-4635-92c7-e3fd1c5f5bfc
    name: Winrar Compressing Dump Files
    reason: Dumps are compressed with WinRAR before exfiltration.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Dump files created on this host
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Ss][Qq][Ll][Dd][Mm][Pp][Rr].*/ OR data_win_eventdata_targetFilename:/.*(\.[Mm][Dd][Mm][Pp]|\.[Dd][Mm][Pp]).*/)
    pivot_on:
    - host
    window: 1h
  - name: LSASS access with dump-grade rights on this host
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_grantedAccess:"0x1fffff" OR data_win_eventdata_grantedAccess:"0x1f3fff" OR data_win_eventdata_grantedAccess:"0x1410" OR data_win_eventdata_grantedAccess:"0x1010" OR data_win_eventdata_grantedAccess:"0x1438" OR data_win_eventdata_grantedAccess:"0x143a")
    pivot_on:
    - host
    window: 1h
  - name: Other memory-dump commands on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss].*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp].* -[Mm][Aa].*/ OR data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Dd][Bb][Gg][Hh][Ee][Ll][Pp].*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/)
    pivot_on:
    - host
    window: 2h
  - name: Compression or exfil of dump files on this host
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\(7[Zz]\.[Ee][Xx][Ee]|7[Zz][Aa]\.[Ee][Xx][Ee]|[Rr][Aa][Rr]\.[Ee][Xx][Ee]|[Ww][Ii][Nn][Rr][Aa][Rr]\.[Ee][Xx][Ee]|[Tt][Aa][Rr]\.[Ee][Xx][Ee]|[Mm][Aa][Kk][Ee][Cc][Aa][Bb]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*(\.[Mm][Dd][Mm][Pp]|\.[Dd][Mm][Pp]).*/ OR data_win_eventdata_commandLine:/.*[Ss][Qq][Ll][Dd][Mm][Pp][Rr].*/)
    pivot_on:
    - host
    window: 4h
  - name: Commands spawned by the SQL Server service on this host
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ss][Qq][Ll][Ss][Ee][Rr][Vv][Rr]\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Cc][Mm][Dd]\.[Ee][Xx][Ee]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]|[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|[Ww][Hh][Oo][Aa][Mm][Ii]\.[Ee][Xx][Ee]|[Nn][Ee][Tt]\.[Ee][Xx][Ee]|[Nn][Ee][Tt]1\.[Ee][Xx][Ee]|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]|[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 2h
