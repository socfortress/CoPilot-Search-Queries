name: Potential BlackByte Ransomware Activity
id: 999e8307-a775-4d5f-addc-4855632335be
version: 1
schema_version: "1.0"
date: "2023-02-08"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 999e8307-a775-4d5f-addc-4855632335be
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects command line patterns used by BlackByte ransomware in different
  operations. MITRE ATT&CK: T1485, T1498, T1059.001, T1140.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "C:\\\\Users\\\\Public\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* -single *"
                          case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*del C:\\\\Windows\\\\System32\\\\Taskmgr.exe*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*;Set-Service -StartupType Disabled $*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*powershell -command \"$x =[System.Text.Encoding]::Unicode.GetString([System.Convert]::FromBase64String(*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* do start wordpad.exe /p *"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  'C:\Users\Public\*'; data_win_eventdata_commandLine matches '* -single *';
  data_win_eventdata_commandLine matches '*del
  C:\Windows\System32\Taskmgr.exe*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://redcanary.com/blog/blackbyte-ransomware/
  - https://attack.mitre.org/techniques/T1485/
  - https://attack.mitre.org/techniques/T1498/
  - https://attack.mitre.org/techniques/T1059/001/
  - https://attack.mitre.org/techniques/T1140/

response:
  message: >
    Potential BlackByte Ransomware Activity detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1485, T1498, T1059.001, T1140
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1485
    - T1498
    - T1059.001
    - T1140
  custom_tags:
    - blackbyte
    - ransomware
    - process_creation
    - sysmon
    - execution
    - impact
    - stealth
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/[Cc]:\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ AND data_win_eventdata_commandLine:/.* -[Ss][Ii][Nn][Gg][Ll][Ee] .*/) OR data_win_eventdata_commandLine:/.*[Dd][Ee][Ll] [Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Tt][Aa][Ss][Kk][Mm][Gg][Rr]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_commandLine:/.*;[Ss][Ee][Tt]-[Ss][Ee][Rr][Vv][Ii][Cc][Ee] -[Ss][Tt][Aa][Rr][Tt][Uu][Pp][Tt][Yy][Pp][Ee] [Dd][Ii][Ss][Aa][Bb][Ll][Ee][Dd] \$.*/ OR data_win_eventdata_commandLine:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll] -[Cc][Oo][Mm][Mm][Aa][Nn][Dd] \"\$[Xx] =\[[Ss][Yy][Ss][Tt][Ee][Mm]\.[Tt][Ee][Xx][Tt]\.[Ee][Nn][Cc][Oo][Dd][Ii][Nn][Gg]\]::[Uu][Nn][Ii][Cc][Oo][Dd][Ee]\.[Gg][Ee][Tt][Ss][Tt][Rr][Ii][Nn][Gg]\(\[[Ss][Yy][Ss][Tt][Ee][Mm]\.[Cc][Oo][Nn][Vv][Ee][Rr][Tt]\]::[Ff][Rr][Oo][Mm][Bb][Aa][Ss][Ee]64[Ss][Tt][Rr][Ii][Nn][Gg]\(.*/ OR data_win_eventdata_commandLine:/.* [Dd][Oo] [Ss][Tt][Aa][Rr][Tt] [Ww][Oo][Rr][Dd][Pp][Aa][Dd]\.[Ee][Xx][Ee] \/[Pp] .*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: shadow copy deletion is the standard recovery-inhibit step beside BlackByte execution
  - id: 1444443e-6757-43e4-9ea4-c8fc705f79a2
    name: Boot Configuration Tampering Via Bcdedit.EXE
    reason: bcdedit recovery/boot tampering is routinely run in the same ransomware pre-encryption burst
  - id: c9fbe8e9-119d-40a6-9b59-dd58a5d84429
    name: Potential Ransomware or Unauthorized MBR Tampering Via Bcdedit.EXE
    reason: bcdedit ignoreallfailures/recoveryenabled changes hinder restore before encryption
  - id: 639c9081-f482-47d3-a0bd-ddee3d4ecd76
    name: All Backups Deleted Via Wbadmin.EXE
    reason: wbadmin deleting all backups removes the restore path before encryption
  - id: 21ff4ca9-f13a-41ad-b828-0077b2af2e40
    name: Deletion of Volume Shadow Copies via WMI with PowerShell
    reason: WMI/PowerShell shadow copy deletion is the alternative to vssadmin in the same stage
  - id: 85c312b7-f44d-4a51-a024-d671c40b49fc
    name: Service StartupType Change Via Sc.EXE
    reason: BlackByte disables services (backup, SQL, security) via sc config start= disabled
  - id: 62b20d44-1546-4e61-afce-8e175eb9473c
    name: Service StartupType Change Via PowerShell Set-Service
    reason: Set-Service -StartupType Disabled is the PowerShell form of the service disabling this rule also matches
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Backup and recovery inhibition commands
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn]|[Ss][Hh][Aa][Dd][Oo][Ww][Cc][Oo][Pp][Yy] [Dd][Ee][Ll][Ee][Tt][Ee]|[Ww][Bb][Aa][Dd][Mm][Ii][Nn] [Dd][Ee][Ll][Ee][Tt][Ee]|[Rr][Ee][Cc][Oo][Vv][Ee][Rr][Yy][Ee][Nn][Aa][Bb][Ll][Ee][Dd] [Nn][Oo]|[Ii][Gg][Nn][Oo][Rr][Ee][Aa][Ll][Ll][Ff][Aa][Ii][Ll][Uu][Rr][Ee][Ss]|[Rr][Ee][Ss][Ii][Zz][Ee] [Ss][Hh][Aa][Dd][Oo][Ww][Ss][Tt][Oo][Rr][Aa][Gg][Ee]).*/
    pivot_on: host
    window: 6h
  - name: Defender and security tooling tamper or service stop
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee]|[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee][Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg]|[Nn][Ee][Tt] [Ss][Tt][Oo][Pp] |[Ss][Cc] [Cc][Oo][Nn][Ff][Ii][Gg] |[Ss][Cc] [Ss][Tt][Oo][Pp] |[Tt][Aa][Ss][Kk][Kk][Ii][Ll][Ll] /[Ff] /[Ii][Mm]).*/
    pivot_on: host
    window: 6h
  - name: BlackByte ransom note or encrypted file artifacts
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*([Bb][Ll][Aa][Cc][Kk][Bb][Yy][Tt][Ee]|[Rr][Ee][Ss][Tt][Oo][Rr][Ee][Mm][Yy][Ff][Ii][Ll][Ee][Ss]).*/
    pivot_on: host
    window: 6h
  - name: Linked connections and token filter registry changes
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*([Ee][Nn][Aa][Bb][Ll][Ee][Ll][Ii][Nn][Kk][Ee][Dd][Cc][Oo][Nn][Nn][Ee][Cc][Tt][Ii][Oo][Nn][Ss]|[Ll][Oo][Cc][Aa][Ll][Aa][Cc][Cc][Oo][Uu][Nn][Tt][Tt][Oo][Kk][Ee][Nn][Ff][Ii][Ll][Tt][Ee][Rr][Pp][Oo][Ll][Ii][Cc][Yy]|[Ll][Oo][Nn][Gg][Pp][Aa][Tt][Hh][Ss][Ee][Nn][Aa][Bb][Ll][Ee][Dd]).*/
    pivot_on: host
    window: 6h
  - name: Lateral spread tooling before encryption
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Pp][Ss][Ee][Xx][Ee][Cc]|[Ww][Mm][Ii][Cc] /[Nn][Oo][Dd][Ee]|[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss] /[Ss] |[Nn][Ee][Tt] [Uu][Ss][Ee] \\\\|[Ii][Nn][Vv][Oo][Kk][Ee]-[Cc][Oo][Mm][Mm][Aa][Nn][Dd]).*/
    pivot_on: host
    window: 24h
