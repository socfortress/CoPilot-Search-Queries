name: Setup16.EXE Execution With Custom .Lst File
id: 99c8be4f-3087-4f9f-9c24-8c7e257b442e
version: 1
schema_version: "1.0"
date: "2024-12-01"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 99c8be4f-3087-4f9f-9c24-8c7e257b442e
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of "Setup16.EXE" and old installation utility with a
  custom ".lst" file. These ".lst" file can contain references to external
  program that "Setup16.EXE" will execute. Attackers and adversaries might
  leverage this as a living of the land utility. MITRE ATT&CK: T1574.005.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - term:
            data_win_eventdata_parentImage:
              value: "C:\\Windows\\SysWOW64\\setup16.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_parentCommandLine:
              value: "* -m *"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_image:
                    value: "C:\\\\~MSSETUP.T\\\\*"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_parentCommandLine
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage equals
  'C:\Windows\SysWOW64\setup16.exe'; data_win_eventdata_parentCommandLine
  matches '* -m *'; data_win_eventdata_image matches 'C:\~MSSETUP.T\*'.

known_false_positives: >
  On modern Windows system, the "Setup16" utility is practically never used,
  hence false positive should be very rare. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://www.hexacorn.com/blog/2024/10/12/the-sweet16-the-oldbin-lolbin-called-setup16-exe/
  - https://attack.mitre.org/techniques/T1574/005/

response:
  message: >
    Setup16.EXE Execution With Custom .Lst File detected on host $agent_name$.
    Matched data_win_eventdata_parentImage: $data_win_eventdata_parentImage$.
    Matched data_win_eventdata_parentCommandLine:
    $data_win_eventdata_parentCommandLine$. MITRE ATT&CK: T1574.005
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_parentCommandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.005
  custom_tags:
    - setup16
    - custom
    - process_creation
    - sysmon
    - privilege_escalation
    - persistence
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Ww][Oo][Ww]64\\[Ss][Ee][Tt][Uu][Pp]16\.[Ee][Xx][Ee]/ AND data_win_eventdata_parentCommandLine:/.* -[Mm] .*/ AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/[Cc]:\\\~[Mm][Ss][Ss][Ee][Tt][Uu][Pp]\.[Tt]\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 285b85b1-a555-4095-8652-a8a4106af63f
    name: Suspicious Rundll32 Setupapi.dll Activity
    reason: Another setup/INF-based LOLBin proxy-execution technique often tried alongside Setup16.
  - id: d4ca7c59-e9e4-42d8-bf57-91a776efcb87
    name: LOLBIN Execution From Abnormal Drive
    reason: Setup16 with a .lst on a removable/abnormal drive indicates LOLBin proxy execution from media.
  - id: 729ce0ea-5d8f-4769-9762-e35de441586d
    name: MpiExec Lolbin
    reason: Same obscure signed-binary proxy-execution family; actors chain several LOLBins.
  - id: ce7cf472-6fcc-490a-9481-3786840b5d9b
    name: InfDefaultInstall.exe .inf Execution
    reason: Sibling legacy installer proxy execution via an attacker-controlled config file.
  - id: 69bd9b97-2be2-41b6-9816-fb08757a4d1a
    name: Potentially Suspicious Execution From Parent Process In Public Folder
    reason: The .lst/payload is often staged in Public; its children show up here.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Setup16 and ~MSSETUP.T activity
    query: data_win_system_eventID:1 AND (data_win_eventdata_parentImage:/.*[Ss]etup16.*/ OR data_win_eventdata_image:/.*[Ss]etup16.*/ OR data_win_eventdata_image:/.*~MSSETUP.*/)
    pivot_on: host
    window: 2h
  - name: Files with .lst extension created
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\.[Ll][Ss][Tt]/
    pivot_on: host
    window: 2h
  - name: Payload download tools preceding staging
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Cc]url.*http.*/ OR /.*[Cc]ertutil.*urlcache.*/ OR /.*[Bb]itsadmin.*transfer.*/ OR /.*Invoke-WebRequest.*/)
    pivot_on: host
    window: 2h
  - name: Network connections from LOLBin children
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*\\(cmd|powershell|rundll32|mshta|regsvr32)\.exe/ AND data_win_eventdata_initiated:true
    pivot_on: host
    window: 2h
