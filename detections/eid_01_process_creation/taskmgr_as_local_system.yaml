name: Taskmgr as LOCAL_SYSTEM
id: 9fff585c-c33e-4a86-b3cd-39312079a65f
version: 1
schema_version: "1.0"
date: "2022-05-27"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 9fff585c-c33e-4a86-b3cd-39312079a65f
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the creation of taskmgr.exe process in context of LOCAL_SYSTEM. MITRE
  ATT&CK: T1036.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_user:
                    value: "*AUTHORI*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_user:
                    value: "*AUTORI*"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\taskmgr.exe"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_user
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_user matches '*AUTHORI*';
  data_win_eventdata_user matches '*AUTORI*'; data_win_eventdata_image matches
  '*\taskmgr.exe'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - Internal Research
  - https://attack.mitre.org/techniques/T1036/

response:
  message: >
    Taskmgr as LOCAL_SYSTEM detected on host $agent_name$. Matched
    data_win_eventdata_user: $data_win_eventdata_user$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1036
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_user
      type: user
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1036
  custom_tags:
    - taskmgr
    - local
    - system
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_user:/.*[Aa][Uu][Tt][Hh][Oo][Rr][Ii].*/ OR data_win_eventdata_user:/.*[Aa][Uu][Tt][Oo][Rr][Ii].*/) AND data_win_eventdata_image:/.*\\[Tt][Aa][Ss][Kk][Mm][Gg][Rr]\.[Ee][Xx][Ee]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7c0dcd3d-acf8-4f71-9570-f448b0034f94
    name: PsExec Service Child Process Execution as LOCAL SYSTEM
    reason: psexec -s -i is the classic way to get taskmgr running as SYSTEM.
  - id: fdfcbd78-48f1-4a4b-90ac-d82241e368c5
    name: PsExec Service Execution
    reason: Service-based execution that yields a SYSTEM interactive process.
  - id: 730fc21b-eaff-474b-ad23-90fd265d4988
    name: Psexec Execution
    reason: Direct PsExec use as the precursor to SYSTEM context.
  - id: 590a5f4c-6c8c-4f10-8307-89afe9453a9d
    name: Suspicious Child Process Created as System
    reason: Other SYSTEM children from the same escalation path.
  - id: 9bd04a79-dabe-4f1f-a5ff-92430265c96b
    name: Privilege Escalation via Named Pipe Impersonation
    reason: getsystem-style escalation that produces SYSTEM processes.
  - id: 89ca78fd-b37c-4310-b3d3-81a023f83936
    name: Schtasks Creation Or Modification With SYSTEM Privileges
    reason: Scheduled-task route to SYSTEM execution.
  - id: 5722dff1-4bdd-4949-86ab-fbaf707e767a
    name: PUA - System Informer Execution
    reason: Taskmgr as SYSTEM is used to kill protected processes; System Informer serves the same purpose.
  - id: 4a6713f6-3331-11ed-a261-0242ac120002
    name: Taskkill Symantec Endpoint Protection
    reason: 'Follow-on: SYSTEM-level process killing against security tools.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: PsExec and remote-service SYSTEM launches
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Pp][Ss][Ee][Xx][Ee].*\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\PSEXESVC\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Pp][Ss][Ee][Xx][Ee][Cc].* -s.*/)
    pivot_on: host
    window: 2h
  - name: Other interactive SYSTEM processes
    query: data_win_system_eventID:"1" AND data_win_eventdata_user:/.*(AUTHORITY|AUTORIT).*SYSTEM/ AND data_win_eventdata_image:/.*\\(cmd|powershell|regedit|mmc|procexp)[^\\]*\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Process killing and AV tamper
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Tt]askkill.*\/[Ff].*/ OR data_win_eventdata_commandLine:/.*[Ss]top-[Ss]ervice.*/ OR data_win_eventdata_commandLine:/.*[Ss]et-[Mm]p[Pp]reference.*/)
    pivot_on: host
    window: 2h
  - name: Service creation or SYSTEM scheduled task
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*sc.*create.*/ OR data_win_eventdata_commandLine:/.*schtasks.*\/create.*\/ru.*[Ss]ystem.*/)
    pivot_on: host
    window: 4h
  - name: Credential access tools
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ll]sass.*/ OR data_win_eventdata_commandLine:/.*procdump.*/ OR data_win_eventdata_commandLine:/.*comsvcs.*MiniDump.*/)
    pivot_on: host
    window: 4h
