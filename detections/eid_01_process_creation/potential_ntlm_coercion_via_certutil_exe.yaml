name: Potential NTLM Coercion Via Certutil.EXE
id: 6c6d9280-e6d0-4b9d-80ac-254701b64916
version: 1
schema_version: "1.0"
date: "2023-02-14"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 6c6d9280-e6d0-4b9d-80ac-254701b64916
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects possible NTLM coercion via certutil using the 'syncwithWU' flag. MITRE
  ATT&CK: T1218.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\certutil.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "CertUtil.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* -syncwithWU *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine: "* \\\\\\\\*"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\certutil.exe'; data_win_eventdata_originalFileName equals 'CertUtil.exe';
  data_win_eventdata_commandLine matches '* -syncwithWU *', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/LOLBAS-Project/LOLBAS/issues/243
  - https://attack.mitre.org/techniques/T1218/

response:
  message: >
    Potential NTLM Coercion Via Certutil.EXE detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1218
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218
  custom_tags:
    - coercion
    - certutil
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.* -[Ss][Yy][Nn][Cc][Ww][Ii][Tt][Hh][Ww][Uu] .*/ AND data_win_eventdata_commandLine:/.* \\\\.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: bb76d96b-821c-47cf-944b-7ce377864492
    name: Suspicious NTLM Authentication on the Printer Spooler Service
    reason: Alternative NTLM coercion vector toward an attacker-controlled UNC path.
  - id: e8d34729-86a4-4140-adfd-0a29c2106307
    name: HackTool - CoercedPotato Execution
    reason: Coercion-based privilege escalation using the same NTLM relay primitive.
  - id: 1412aa78-a24c-4abd-83df-767dfb2c5bbe
    name: Potentially Suspicious WebDAV LNK Execution
    reason: WebDAV/UNC forced authentication used alongside certutil coercion.
  - id: 982e9f2d-1a85-4d5b-aea4-31f5e97c6555
    name: Suspicious WebDav Client Execution Via Rundll32.EXE
    reason: WebDAV client calls to remote hosts that leak NTLM hashes.
  - id: d67572a0-e2ec-45d6-b8db-c100d14b8ef2
    name: NetNTLM Downgrade Attack - Registry
    reason: Attackers weaken NTLM settings so captured hashes are easier to crack or relay.
  - id: 0dba975d-a193-4ed1-a067-424df57570d1
    name: Uncommon Network Connection Initiated By Certutil.EXE
    reason: Certutil outbound connections confirm the coercion reached the network.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Certutil executions with remote targets
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*\\\\.*/ OR data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp].*/ OR data_win_eventdata_commandLine:/.*-[Uu][Rr][Ll][Cc][Aa][Cc][Hh][Ee].*/)
    pivot_on: host
    window: 4h
  - name: Outbound SMB or WebDAV connections
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:"true" AND (data_win_eventdata_destinationPort:"445" OR data_win_eventdata_destinationPort:"80" OR data_win_eventdata_destinationPort:"5985")
    pivot_on: host
    window: 4h
  - name: UNC paths in command lines
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.* \\\\[A-Za-z0-9.-]+\\.*/
    pivot_on: host
    window: 4h
  - name: Relay and poisoning tool execution
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Nn][Tt][Ll][Mm][Rr][Ee][Ll][Aa][Yy][Xx].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Ss][Pp][Oo][Nn][Dd][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Pp][Ee][Tt][Ii][Tt][Pp][Oo][Tt][Aa][Mm].*/ OR data_win_eventdata_commandLine:/.*[Pp][Rr][Ii][Nn][Tt][Ee][Rr][Bb][Uu][Gg].*/)
    pivot_on: host
    window: 4h
