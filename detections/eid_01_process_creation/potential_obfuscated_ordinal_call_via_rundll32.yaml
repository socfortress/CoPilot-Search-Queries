name: Potential Obfuscated Ordinal Call Via Rundll32
id: 43fa5350-db63-4b8f-9a01-789a427074e1
version: 1
schema_version: "1.0"
date: "2025-02-23"
author: Nasreddine Bencherchali (Nextron Systems), Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 43fa5350-db63-4b8f-9a01-789a427074e1
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of "rundll32" with potential obfuscated ordinal calls. MITRE
  ATT&CK: T1027.010.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\rundll32.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "RUNDLL32.EXE"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*rundll32*"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine: "*#+*"
              - wildcard:
                  data_win_eventdata_commandLine: "*#-*"
              - wildcard:
                  data_win_eventdata_commandLine: "*#0*"
              - wildcard:
                  data_win_eventdata_commandLine: "*#655*"
              - wildcard:
                  data_win_eventdata_commandLine: "*#656*"
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\rundll32.exe'; data_win_eventdata_originalFileName equals 'RUNDLL32.EXE';
  data_win_eventdata_commandLine matches '*rundll32*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - Internal Research
  - https://www.youtube.com/watch?v=52tAmVLg1KM&t=2070s
  - https://attack.mitre.org/techniques/T1027/010/

response:
  message: >
    Potential Obfuscated Ordinal Call Via Rundll32 detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1027.010
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1027.010
  custom_tags:
    - obfuscated
    - ordinal
    - rundll32
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Rr][Uu][Nn][Dd][Ll][Ll]32.*/) AND (data_win_eventdata_commandLine:/.*\#\+.*/ OR data_win_eventdata_commandLine:/.*\#-.*/ OR data_win_eventdata_commandLine:/.*\#0.*/ OR data_win_eventdata_commandLine:/.*\#655.*/ OR data_win_eventdata_commandLine:/.*\#656.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c3a99af4-35a9-4668-879e-c09aeb4f2bdf
    name: Rundll32 Execution With Uncommon DLL Extension
    reason: Ordinal-call DLLs are often dropped with non-.dll extensions; same loader tradecraft.
  - id: 5bb68627-3198-40ca-b458-49f973db8752
    name: Rundll32 Execution Without Parameters
    reason: Bare rundll32 with no parameters is the injection/C2 stub stage that often follows a loaded payload.
  - id: e593cf51-88db-4ee1-b920-37e89012a3c9
    name: Potentially Suspicious Rundll32 Activity
    reason: Generic suspicious rundll32 usage co-occurring on the same host.
  - id: 2569ed8c-1147-498a-9b8c-2ad3656b10ed
    name: Potential Renamed Rundll32 Execution
    reason: Renamed rundll32 is another evasion used alongside obfuscated ordinals.
  - id: 339ed3d6-5490-46d0-96a7-8abe33078f58
    name: Qakbot Rundll32 Exports Execution
    reason: 'Qakbot-style rundll32 export execution commonly uses ordinals such as #1 or #655.'
  - id: cf879ffb-793a-4753-9a14-bc8f37cc90df
    name: Potential Qakbot Rundll32 Execution
    reason: Qakbot rundll32 execution is a known consumer of ordinal exports.
  - id: ae9c6a7c-9521-42a6-915e-5aaa8689d529
    name: CobaltStrike Load by Rundll32
    reason: Rundll32 loading a Cobalt Strike beacon is a likely payload of an ordinal call.
  - id: 5cdb711b-5740-4fb2-ba88-f7945027afac
    name: Rundll32 UNC Path Execution
    reason: Rundll32 loading a DLL from a UNC path is a common staging variant of the same loader.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Rundll32 without export (injection stub)
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Rr]undll32\.exe/ AND NOT data_win_eventdata_commandLine:/.*,.*/
    pivot_on: host
    window: 2h
  - name: Rundll32 loading DLL from user-writable paths
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*[Rr]undll32.*([Tt]emp|[Pp]ublic|[Pp]rogram[Dd]ata|[Aa]pp[Dd]ata).*/
    pivot_on: host
    window: 2h
  - name: Rundll32 image loads from user-writable paths
    query: data_win_system_eventID:7 AND data_win_eventdata_image:/.*[Rr]undll32\.exe/ AND data_win_eventdata_imageLoaded:/.*([Tt]emp|[Pp]ublic|[Pp]rogram[Dd]ata|[Aa]pp[Dd]ata).*/
    pivot_on: host
    window: 1h
  - name: Rundll32 outbound network connections
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*[Rr]undll32\.exe/ AND data_win_eventdata_initiated:true
    pivot_on: host
    window: 2h
  - name: Office/script parents spawning rundll32
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Rr]undll32\.exe/ AND data_win_eventdata_parentImage:/.*(WINWORD|EXCEL|powershell|wscript|cscript|mshta|cmd)\.exe/
    pivot_on: host
    window: 4h
