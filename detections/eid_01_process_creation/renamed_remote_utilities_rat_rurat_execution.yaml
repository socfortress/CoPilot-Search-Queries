name: Renamed Remote Utilities RAT (RURAT) Execution
id: 9ef27c24-4903-4192-881a-3adde7ff92a5
version: 1
schema_version: "1.0"
date: "2023-02-03"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 9ef27c24-4903-4192-881a-3adde7ff92a5
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of renamed Remote Utilities (RURAT) via Product PE header
  field.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - term:
            data_win_eventdata_product:
              value: "Remote Utilities"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\rutserv.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\rfusclient.exe"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_product
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_product equals 'Remote
  Utilities'; data_win_eventdata_image matches '*\rutserv.exe';
  data_win_eventdata_image matches '*\rfusclient.exe'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://redcanary.com/blog/misbehaving-rats/

response:
  message: >
    Renamed Remote Utilities RAT (RURAT) Execution detected on host
    $agent_name$. Matched data_win_eventdata_product:
    $data_win_eventdata_product$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_product
      type: other
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - renamed
    - utilities
    - rurat
    - process_creation
    - sysmon
    - collection
    - command_and_control
    - discovery
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_product:/[Rr][Ee][Mm][Oo][Tt][Ee] [Uu][Tt][Ii][Ll][Ii][Tt][Ii][Ee][Ss]/ AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/.*\\[Rr][Uu][Tt][Ss][Ee][Rr][Vv]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Ff][Uu][Ss][Cc][Ll][Ii][Ee][Nn][Tt]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e01fa958-6893-41d4-ae03-182477c5e77d
    name: Remote Access Tool - RURAT Execution From Unusual Location
    reason: RURAT run from unusual location is the same tool without renaming
  - id: ccad96d7-a48c-4f13-8b9c-9f6a31cba454
    name: Detect Remote Access Software Usage FileInfo
    reason: Remote-access software inventory via file info flags other RATs on host
  - id: cd5cfd80-aa5f-44c0-9c20-108c4ae12e3c
    name: New Firewall Rule Added Via Netsh.EXE
    reason: New firewall rule often opens the RAT's inbound port
  - id: 01aeb693-138d-49d2-9403-c4f52d7d3d62
    name: RDP Connection Allowed Via Netsh.EXE
    reason: RDP allowed via netsh signals additional remote access staging
  - id: b471f462-eb0d-4832-be35-28d94bdb4780
    name: Remote Access Tool - Renamed MeshAgent Execution - Windows
    reason: 'Renamed MeshAgent: attackers often deploy multiple renamed RMM tools'
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: RURAT install and config traces
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Rr]ut[Ss]erv.*/ OR /.*[Rr]fus[Cc]lient.*/ OR /.*[Rr]emote [Uu]tilities.*/)
    pivot_on: host
    window: 6h
  - name: Service creation for remote tool
    query: data_win_system_eventID:7045
    pivot_on: host
    window: 6h
  - name: Run key persistence
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*CurrentVersion.Run.*/
    pivot_on: host
    window: 6h
  - name: Other remote access tools
    query: data_win_system_eventID:1 AND data_win_eventdata_description:(/.*[Aa]ny[Dd]esk.*/ OR /.*[Ss]creen[Cc]onnect.*/ OR /.*[Tt]eam[Vv]iewer.*/ OR /.*[Nn]et[Ss]upport.*/)
    pivot_on: host
    window: 24h
