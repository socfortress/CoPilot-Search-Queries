name: Impacket Lateral Movement WMIExec Commandline Parameters
id: d6e464e4-5c6a-474e-82d2-aed616a3a492
version: 1
schema_version: "1.0"
date: "2026-04-28"
author: SOCFortress LLC
status: production
type: TTP

description: >
  This analytic identifies the canonical command-line signature
  produced by Impacket's wmiexec.py lateral-movement module. Sysmon
  EventID 1 is used to match process creation events whose
  parentImage is wmiprvse.exe (the WMI Provider Host) AND whose
  command line contains all of the following highly specific markers:
  cmd.exe /Q /c (quiet run-and-terminate flags), the loopback address
  127.0.0.1 in a UNC path to an admin share, and the Impacket-style
  temporary output filename pattern __<unix_timestamp>.<microseconds>.
  wmiexec.py operates by invoking the WMI Win32_Process.Create method
  on the target host, which causes WmiPrvSE.exe to spawn cmd.exe as a
  child process with a command line that redirects output to a UNC
  path on an administrative share so the attacker can retrieve the
  results. The combination of WmiPrvSE parentage plus the canonical
  /Q /c + UNC + __<timestamp> command-line pattern is essentially
  unique to wmiexec and unlikely to appear in legitimate software.
  This is a known T1021.002 (SMB/Admin Shares), T1021.003 (DCOM),
  T1047 (Windows Management Instrumentation), and T1543.003 (Service
  Creation) technique observed in named threat activity including
  WhisperGate, Industroyer2, Prestige Ransomware, Volt Typhoon,
  Storm-0501 Ransomware, Gozi Malware, and the Graceful Wipe Out
  Attack. If confirmed malicious, this could allow attackers to
  execute commands on remote endpoints, potentially leading to
  unauthorized access, lateral movement, credential theft,
  persistence, and data exfiltration.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - wildcard:
            data_win_eventdata_parentImage: "*wmiprvse.exe"
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*cmd.exe*/Q /c*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine: "*127.0.0.1*"
        - regexp:
            data_win_eventdata_commandLine:
              value: ".*__[0-9]{1,10}\\.[0-9]{1,10}.*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_parentCommandLine
    - data_win_eventdata_user
    - data_win_eventdata_processId
    - data_win_eventdata_processGuid
    - data_win_eventdata_parentProcessId
    - data_win_eventdata_parentProcessGuid
    - data_win_eventdata_hashes
    - data_win_eventdata_integrityLevel
    - data_win_eventdata_currentDirectory

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-28 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-28 23:59:59.999"

how_to_implement: >
  This detection requires Sysmon EventID 1 (Process Creation) logs to be forwarded
  from Windows endpoints to Wazuh Indexer. Ensure Sysmon is deployed with a
  configuration that captures Image, OriginalFileName, ParentImage, and
  CommandLine fields, and that cmd.exe processes spawned by WmiPrvSE.exe are
  NOT excluded by the Sysmon configuration (some default configurations
  suppress these events as noise - this exclusion must be removed for the
  detection to fire). The Elasticsearch query matches the wmiexec loopback
  variant (127.0.0.1) per the published Splunk source rule. The Graylog
  query uses Lucene regex with a generalized UNC-host pattern
  \\\\<host>\\<share>\\__<digits>.<digits> that matches any IP, hostname,
  or FQDN as the UNC server, making it suitable for detecting real lateral
  movement against remote targets. The __<timestamp>.<microseconds> filename
  pattern is matched via regex/regexp queries since standard wildcards cannot
  enforce length constraints on the random numeric portions. The combination
  of wmiprvse.exe parent + cmd.exe /Q /c + UNC + __<digits>.<digits> is
  essentially unique to wmiexec.py and produces minimal false positives.

known_false_positives: >
  Although uncommon, system administrators may leverage Impacket tools
  for legitimate system administration or automation use cases. The
  highly specific multi-marker combination required by this detection
  makes false positives extremely rare in normal environments.

references:
  - https://attack.mitre.org/techniques/T1021/002/
  - https://attack.mitre.org/techniques/T1021/003/
  - https://attack.mitre.org/techniques/T1047/
  - https://attack.mitre.org/techniques/T1543/003/
  - https://github.com/SecureAuthCorp/impacket
  - https://www.microsoft.com/en-us/security/blog/2023/05/24/volt-typhoon-targets-us-critical-infrastructure-with-living-off-the-land-techniques/
  - https://www.microsoft.com/security/blog/2022/01/15/destructive-malware-targeting-ukrainian-organizations/

response:
  message: >
    Suspicious cmd.exe process spawned by WmiPrvSE.exe with a command
    line consistent with Impacket wmiexec lateral movement was detected
    on endpoint $agent_name$ by user $data_win_eventdata_user$. Process
    image: $data_win_eventdata_image$. Parent process:
    $data_win_eventdata_parentImage$. Command line:
    $data_win_eventdata_commandLine$. The combination of WmiPrvSE
    parentage, /Q /c flags, UNC output redirection to an admin share,
    and the __<timestamp>.<microseconds> output filename is the
    canonical signature for wmiexec.py - this is essentially never a
    false positive. Investigate immediately, identify the source of
    the WMI invocation (incoming network session creating the WMI
    process), look for credential-theft activity, and hunt for
    follow-on lateral movement.
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 80
    - field: data_win_eventdata_user
      type: user
      score: 80
  threat_objects:
    - field: data_win_eventdata_image
      type: process_name
    - field: data_win_eventdata_parentImage
      type: parent_process_name
    - field: data_win_eventdata_commandLine
      type: command_line

tags:
  analytic_story:
    - WhisperGate
    - Gozi Malware
    - Active Directory Lateral Movement
    - Volt Typhoon
    - Prestige Ransomware
    - Industroyer2
    - Data Destruction
    - Graceful Wipe Out Attack
    - Compromised Windows Host
    - CISA AA22-277A
    - Storm-0501 Ransomware
    - Impacket Lateral Movement
    - WMIExec
  asset_type: Endpoint
  mitre_attack_id:
    - T1021.002
    - T1021.003
    - T1047
    - T1543.003
  custom_tags:
    - impacket
    - wmiexec
    - lateral_movement
    - wmi_abuse
    - admin_share_abuse
    - unc_redirection
    - cmd_exe
    - wmiprvse
    - apt_lateral_movement
    - high_fidelity
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee]\.exe.*/ AND data_win_eventdata_commandLine:/.*[Cc][Mm][Dd]\.exe.*\/[Qq] \/[Cc].*/ AND data_win_eventdata_commandLine:/.*\\\\\\\\[^\\\\]+\\\\[^\\\\]+\\\\__[0-9]{1,10}\.[0-9]{1,10}.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: bb3c1bac-6bdf-4aa0-8dc9-068b8b712a76
    name: Impacket Lateral Movement smbexec CommandLine Parameters
    reason: Operators alternate between wmiexec and smbexec against the same target; either indicates the same Impacket session.
  - id: 8ce07472-496f-11ec-ab3b-3e22fbd008af
    name: Impacket Lateral Movement Commandline Parameters
    reason: Covers other Impacket exec variants (psexec/atexec) used from the same source.
  - id: 10c14723-61c7-4c75-92ca-9af245723ad2
    name: HackTool - Potential Impacket Lateral Movement Activity
    reason: Generic Impacket exec command-line detection corroborating the WMI-based variant.
  - id: 4627c6ae-6899-46e2-aa0c-6ebcb1becd19
    name: HackTool - Impacket Tools Execution
    reason: Source-side execution of Impacket tools on a Windows pivot.
  - id: 022eaba8-f0bf-4dd9-9217-4604b0bb3bb0
    name: HackTool - Wmiexec Default Powershell Command
    reason: wmiexec's PowerShell-mode default command is the same tool on a different shell path.
  - id: 692f0bec-83ba-4d04-af7e-e884a96059b6
    name: Potential WMI Lateral Movement WmiPrvSE Spawned PowerShell
    reason: Same wmiprvse.exe parent chain, PowerShell child instead of cmd.
  - id: 8a582fe2-0882-4b89-a82a-da6b2dc32937
    name: Suspicious WmiPrvSE Child Process
    reason: Other abnormal WmiPrvSE children on the host show what else the operator ran through WMI.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Any process spawned by WmiPrvSE on this host
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 1h
  - name: Recon commands in cmd /Q /c shells (wmiexec first moves)
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*\/[Qq] \/[Cc].*([Ww][Hh][Oo][Aa][Mm][Ii]|[Hh][Oo][Ss][Tt][Nn][Aa][Mm][Ee]|[Ii][Pp][Cc][Oo][Nn][Ff][Ii][Gg]|[Ss][Yy][Ss][Tt][Ee][Mm][Ii][Nn][Ff][Oo]|[Tt][Aa][Ss][Kk][Ll][Ii][Ss][Tt]|[Qq][Uu][Ss][Ee][Rr])|\/[Qq] \/[Cc].*[Nn][Ee][Tt] +([Uu][Ss][Ee][Rr]|[Gg][Rr][Oo][Uu][Pp]|[Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp]|[Vv][Ii][Ee][Ww]).*/
    pivot_on: host
    window: 1h
  - name: wmiexec __<epoch> output file written to Windows share
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\__[0-9]{10}\.[0-9]+/
    pivot_on: host
    window: 1h
  - name: Persistence or account changes after remote execution
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Nn][Ee][Tt] +([Uu][Ss][Ee][Rr]|[Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp]).*/[Aa][Dd][Dd]|[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss].*/[Cc][Rr][Ee][Aa][Tt][Ee]|[Ss][Cc](\.exe)? +[Cc][Rr][Ee][Aa][Tt][Ee].*/)
    pivot_on: host
    window: 2h
  - name: Credential dumping follow-on
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll]|[Ll][Ss][Aa][Dd][Uu][Mm][Pp]|[Dd][Cc][Ss][Yy][Nn][Cc]|[Cc][Oo][Mm][Ss][Vv][Cc][Ss])|[Rr][Ee][Gg] +[Ss][Aa][Vv][Ee].*([Ss][Aa][Mm]|[Ss][Yy][Ss][Tt][Ee][Mm]|[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy])|[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp].*[Ll][Ss][Aa][Ss][Ss].*/
    pivot_on: host
    window: 2h
