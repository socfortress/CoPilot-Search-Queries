name: Using SettingSyncHost.exe as LOLBin
id: b2ddd389-f676-4ac4-845a-e00781a48e5f
version: 1
schema_version: "1.0"
date: "2021-11-27"
author: Anton Kutepov, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: b2ddd389-f676-4ac4-845a-e00781a48e5f
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects using SettingSyncHost.exe to run hijacked binary. MITRE ATT&CK:
  T1574.008.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "C:\\\\Windows\\\\System32\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "C:\\\\Windows\\\\SysWOW64\\\\*"
                          case_insensitive: true
                  minimum_should_match: 1
        - wildcard:
            data_win_eventdata_parentCommandLine:
              value: "*cmd.exe /c*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_parentCommandLine:
              value: "*RoamDiag.cmd*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_parentCommandLine:
              value: "*-outputpath*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_parentCommandLine
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  'C:\Windows\System32\*'; data_win_eventdata_image matches
  'C:\Windows\SysWOW64\*'; data_win_eventdata_parentCommandLine matches
  '*cmd.exe /c*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.hexacorn.com/blog/2020/02/02/settingsynchost-exe-as-a-lolbin
  - https://attack.mitre.org/techniques/T1574/008/

response:
  message: >
    Using SettingSyncHost.exe as LOLBin detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_parentCommandLine:
    $data_win_eventdata_parentCommandLine$. MITRE ATT&CK: T1574.008
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_parentCommandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.008
  custom_tags:
    - settingsynchost
    - lolbin
    - process_creation
    - sysmon
    - privilege_escalation
    - persistence
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\.*/ OR data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Ww][Oo][Ww]64\\.*/) AND data_win_eventdata_parentCommandLine:/.*[Cc][Mm][Dd]\.[Ee][Xx][Ee] \/[Cc].*/ AND data_win_eventdata_parentCommandLine:/.*[Rr][Oo][Aa][Mm][Dd][Ii][Aa][Gg]\.[Cc][Mm][Dd].*/ AND data_win_eventdata_parentCommandLine:/.*-[Oo][Uu][Tt][Pp][Uu][Tt][Pp][Aa][Tt][Hh].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d3bf399f-b0cf-4250-8bb4-dfc192ab81dc
    name: Ie4uinit Lolbin Use From Invalid Path
    reason: 'Same technique family: a trusted Windows binary executed so it picks up an attacker-planted binary or script from an unexpected location.'
  - id: 7002aa10-b8d4-47ae-b5ba-51ab07e228b9
    name: Potential Mpclient.DLL Sideloading Via Defender Binaries
    reason: Another signed-Windows-binary hijack (T1574) used for the same persistence/defense-evasion goal; co-occurrence suggests a hijack toolkit.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Children of SettingSyncHost
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Ss][Ee][Tt][Tt][Ii][Nn][Gg][Ss][Yy][Nn][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee].*/
    pivot_on: host
    window: 2h
  - name: RoamDiag.cmd invocations
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Rr][Oo][Aa][Mm][Dd][Ii][Aa][Gg]\.[Cc][Mm][Dd].*/
    pivot_on: host
    window: 4h
  - name: Modules loaded by SettingSyncHost from user-writable paths
    query: data_win_system_eventID:"7" AND data_win_eventdata_image:/.*[Ss][Ee][Tt][Tt][Ii][Nn][Gg][Ss][Yy][Nn][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee].*/ AND data_win_eventdata_imageLoaded:/.*(\\[Uu][Ss][Ee][Rr][Ss]\\|\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\|\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\|\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\).*/
    pivot_on: host
    window: 2h
  - name: PATH environment variable modification
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Ee][Nn][Vv][Ii][Rr][Oo][Nn][Mm][Ee][Nn][Tt]\\[Pp][Aa][Tt][Hh].*/
    pivot_on: host
    window: 24h
  - name: Executables dropped to user-writable paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(\\[Uu][Ss][Ee][Rr][Ss]\\|\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\|\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\|\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\).*\.([Ee][Xx][Ee]|[Cc][Mm][Dd]|[Bb][Aa][Tt])/
    pivot_on: host
    window: 6h
