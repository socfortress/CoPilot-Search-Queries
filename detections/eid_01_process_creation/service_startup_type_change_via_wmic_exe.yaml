name: Service Startup Type Change Via Wmic.EXE
id: c0514f28-fdae-42df-b886-06e2b2bc5b37
version: 1
schema_version: "1.0"
date: "2026-04-27"
author: Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: c0514f28-fdae-42df-b886-06e2b2bc5b37
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects changes to service startup type to 'disabled' or 'manual' using the
  WMIC command-line utility. MITRE ATT&CK: T1047, T1685.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\WMIC.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "wmic.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* service *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*ChangeStartMode*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Manual*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Disabled*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\WMIC.exe'; data_win_eventdata_originalFileName equals 'wmic.exe';
  data_win_eventdata_commandLine matches '* service *', among other conditions.

known_false_positives: >
  Legitimate administrative changes to service startup types using WMIC,
  investigate accordingly. Baseline expected activity in your environment and
  tune this detection before relying on it for automated response.

references:
  - https://blog.talosintelligence.com/uncovering-qilin-attack-methods-exposed-through-multiple-cases/
  - https://attack.mitre.org/techniques/T1047/
  - https://attack.mitre.org/techniques/T1685/

response:
  message: >
    Service Startup Type Change Via Wmic.EXE detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1047, T1685
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1047
    - T1685
  custom_tags:
    - service
    - startup
    - change
    - process_creation
    - sysmon
    - execution
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.* [Ss][Ee][Rr][Vv][Ii][Cc][Ee] .*/ AND data_win_eventdata_commandLine:/.*[Cc][Hh][Aa][Nn][Gg][Ee][Ss][Tt][Aa][Rr][Tt][Mm][Oo][Dd][Ee].*/ AND (data_win_eventdata_commandLine:/.*[Mm][Aa][Nn][Uu][Aa][Ll].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Dd].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 51cbac1e-eee3-4a90-b1b7-358efb81fa0a
    name: Potential Windows Defender Tampering Via Wmic.EXE
    reason: WMIC Defender tampering on the same host shows which service is being disabled.
  - id: 847d5ff3-8a31-4737-a970-aeae8fe21765
    name: Potential Tampering With Security Products Via WMIC
    reason: WMIC tampering with security products, same tooling and goal.
  - id: 0b7163dc-7eee-4960-af17-c0cd517f92da
    name: Service Started/Stopped Via Wmic.EXE
    reason: Disabling startup is typically paired with stopping the service via WMIC.
  - id: 85c312b7-f44d-4a51-a024-d671c40b49fc
    name: Service StartupType Change Via Sc.EXE
    reason: sc.exe equivalent for disabling startup; attackers retry with alternate tools.
  - id: 62b20d44-1546-4e61-afce-8e175eb9473c
    name: Service StartupType Change Via PowerShell Set-Service
    reason: PowerShell Set-Service equivalent for disabling startup.
  - id: windows-attempt-stop-security-service-001
    name: Windows Attempt To Stop Security Service
    reason: Stopping security services is the immediate effect of disabling them.
  - id: e1aa95de-610a-427d-b9e7-9b46cfafbe6a
    name: Windows Defender Service Disabled - Registry
    reason: Registry-level Defender service disable corroborates the WMIC change.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Service disabled via sc or Set-Service
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(sc(\.exe)? +config.*(disabled|demand)|Set-Service.*(Disabled|Manual)).*/
    pivot_on: host
    window: 2h
  - name: Services Start value set to disabled
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*CurrentControlSet.Services.*Start/ AND data_win_eventdata_details:"DWORD (0x00000004)"
    pivot_on: host
    window: 2h
  - name: Security services stopped
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(WinDefend|Sense|MpsSvc|EventLog|Sysmon|wazuh|VSS|Veeam|SQL).*(stop|disabled|delete).*/
    pivot_on: host
    window: 2h
  - name: Defender preference or exclusion changes
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(Set-MpPreference|Add-MpPreference|DisableRealtimeMonitoring).*/
    pivot_on: host
    window: 4h
  - name: Remote WMIC execution
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*[Ww][Mm][Ii][Cc].*\/node.*/
    pivot_on: host
    window: 4h
