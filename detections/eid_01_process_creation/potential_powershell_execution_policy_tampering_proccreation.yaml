name: Potential PowerShell Execution Policy Tampering - ProcCreation
id: cf2e938e-9a3e-4fe8-a347-411642b28a9f
version: 1
schema_version: "1.0"
date: "2023-01-11"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: cf2e938e-9a3e-4fe8-a347-411642b28a9f
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects changes to the PowerShell execution policy registry key in order to
  bypass signing requirements for script execution from the CommandLine.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\ShellIds\\\\Microsoft.PowerShell\\\\ExecutionPolicy*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Policies\\\\Microsoft\\\\Windows\\\\PowerShell\\\\ExecutionPolicy*"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Bypass*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*RemoteSigned*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Unrestricted*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*\ShellIds\Microsoft.PowerShell\ExecutionPolicy*';
  data_win_eventdata_commandLine matches
  '*\Policies\Microsoft\Windows\PowerShell\ExecutionPolicy*';
  data_win_eventdata_commandLine matches '*Bypass*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://learn.microsoft.com/de-de/powershell/module/microsoft.powershell.security/set-executionpolicy?view=powershell-7.3

response:
  message: >
    Potential PowerShell Execution Policy Tampering - ProcCreation detected on
    host $agent_name$. Matched data_win_eventdata_commandLine:
    $data_win_eventdata_commandLine$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - powershell
    - policy
    - tampering
    - process_creation
    - sysmon
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*\\[Ss][Hh][Ee][Ll][Ll][Ii][Dd][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\.[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\\[Ee][Xx][Ee][Cc][Uu][Tt][Ii][Oo][Nn][Pp][Oo][Ll][Ii][Cc][Yy].*/ OR data_win_eventdata_commandLine:/.*\\[Pp][Oo][Ll][Ii][Cc][Ii][Ee][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\\[Ee][Xx][Ee][Cc][Uu][Tt][Ii][Oo][Nn][Pp][Oo][Ll][Ii][Cc][Yy].*/) AND (data_win_eventdata_commandLine:/.*[Bb][Yy][Pp][Aa][Ss][Ss].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Mm][Oo][Tt][Ee][Ss][Ii][Gg][Nn][Ee][Dd].*/ OR data_win_eventdata_commandLine:/.*[Uu][Nn][Rr][Ee][Ss][Tt][Rr][Ii][Cc][Tt][Ee][Dd].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: fad91067-08c5-4d1a-8d8c-d96a21b37814
    name: Potential PowerShell Execution Policy Tampering
    reason: Registry-side view of the same change; confirms the policy value was actually written.
  - id: 87e3c4e8-a6a8-4ad9-bb4f-46e7ff99a180
    name: Change PowerShell Policies to an Insecure Level
    reason: Set-ExecutionPolicy style lowering of the policy to allow unsigned scripts.
  - id: 9be56c82-b1cc-4318-87eb-d138afaaca39
    name: Malicious PowerShell Process - Execution Policy Bypass
    reason: Per-process -ExecutionPolicy Bypass is the alternative route to the same goal and often appears in the same intrusion.
  - id: a6a39bdb-935c-4f0a-ab77-35f4bbf44d33
    name: Potentially Suspicious Powershell Script Execution From Temp Folder
    reason: The policy is relaxed so a dropped script can run; this catches the script launched from Temp.
  - id: fecfd1a1-cc78-4313-a1ea-2ee2e8ec27a7
    name: PowerShell Logging Disabled Via Registry Key Tampering
    reason: Policy tampering via reg.exe is frequently paired with disabling PowerShell logging in the same hive.
  - id: ca2092a1-c273-4878-9b4b-0d60115bf5ea
    name: Suspicious Encoded PowerShell Command Line
    reason: Encoded payloads commonly run once the policy no longer blocks scripts.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Registry writes to PowerShell policy keys
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:(/.*[Ss]hell[Ii]ds.*[Ee]xecution[Pp]olicy.*/ OR /.*[Pp]olicies.*[Pp]ower[Ss]hell.*/)
    pivot_on: host
    window: 2h
  - name: Reg.exe or PowerShell touching execution policy
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*[Ee]xecution[Pp]olicy.*/ AND (data_win_eventdata_image:/.*\\reg\.exe/ OR data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/)
    pivot_on: host
    window: 2h
  - name: PowerShell running script files from user-writable paths
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND data_win_eventdata_commandLine:/.*\.ps1.*/ AND data_win_eventdata_commandLine:(/.*[Tt]emp.*/ OR /.*[Aa]pp[Dd]ata.*/ OR /.*[Pp]ublic.*/ OR /.*[Dd]ownloads.*/)
    pivot_on: host
    window: 4h
  - name: Script file creation in user-writable paths
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(/.*\.ps1/ OR /.*\.psm1/) AND data_win_eventdata_targetFilename:(/.*[Tt]emp.*/ OR /.*[Aa]pp[Dd]ata.*/ OR /.*[Pp]ublic.*/)
    pivot_on: host
    window: 4h
