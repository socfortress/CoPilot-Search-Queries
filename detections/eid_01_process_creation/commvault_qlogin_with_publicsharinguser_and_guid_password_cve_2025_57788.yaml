name: Commvault QLogin with PublicSharingUser and GUID Password (CVE-2025-57788)
id: 917789e1-2c1f-4bf5-8c91-6f71a017f469
version: 1
schema_version: "1.0"
date: "2025-10-20"
author: Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 917789e1-2c1f-4bf5-8c91-6f71a017f469
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a qlogin.exe command attempting to authenticate as the internal
  `_+_PublicSharingUser_` using a GUID as the password. This could be an
  indicator of an attacker exploiting CVE-2025-57788 to gain initial access
  using leaked credentials. MITRE ATT&CK: T1078.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*qlogin*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*_+_PublicSharingUser_*"
              case_insensitive: true
        - regexp:
            data_win_eventdata_commandLine: ".*([A-F0-9]{8}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{12}).*"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*qlogin*'; data_win_eventdata_commandLine matches '*_+_PublicSharingUser_*';
  data_win_eventdata_commandLine matches the regex
  /.*([A-F0-9]{8}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{12}).*/.

known_false_positives: >
  Legitimate administrative scripts that use the `_+_PublicSharingUser_` account
  for valid purposes. Baseline expected activity in your environment and tune
  this detection before relying on it for automated response.

references:
  - https://labs.watchtowr.com/guess-who-would-be-stupid-enough-to-rob-the-same-vault-twice-pre-auth-rce-chains-in-commvault/
  - https://attack.mitre.org/techniques/T1078/001/

response:
  message: >
    Commvault QLogin with PublicSharingUser and GUID Password (CVE-2025-57788)
    detected on host $agent_name$. Matched data_win_eventdata_commandLine:
    $data_win_eventdata_commandLine$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1078.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1078.001
  custom_tags:
    - commvault
    - qlogin
    - publicsharinguser
    - process_creation
    - sysmon
    - privilege_escalation
    - persistence
    - initial_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Qq][Ll][Oo][Gg][Ii][Nn].*/ AND data_win_eventdata_commandLine:/.*_\+_[Pp][Uu][Bb][Ll][Ii][Cc][Ss][Hh][Aa][Rr][Ii][Nn][Gg][Uu][Ss][Ee][Rr]_.*/ AND data_win_eventdata_commandLine:/.*([A-F0-9]{8}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{12}).*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: ff0225a0-1d9a-4bae-ab26-6038b18bb6d4
    name: Commvault QLogin Argument Injection Authentication Bypass (CVE-2025-57791)
    reason: Alternate authentication route in the same CVE chain; yields a privileged token like the PublicSharingUser path.
  - id: bd3b3fff-a018-4994-9876-68af5809160f
    name: Commvault QOperation Path Traversal Webshell Drop (CVE-2025-57790)
    reason: 'Post-authentication step of the chain: authenticated token used to drop a JSP webshell.'
  - id: fa3c117a-bc0d-416e-a31b-0c0e80653efb
    name: Chopper Webshell Process Pattern
    reason: Webshell-driven command execution pattern that follows once a JSP shell is in place or in use.
  - id: c248c896-e412-4279-8c15-1c558067b6fa
    name: Enumerate All Information With Whoami.EXE
    reason: Typical first hands-on-keyboard recon after gaining Commvault/web shell code execution.
  - id: cd219ff3-fa99-45d4-8380-a7d15116c6dc
    name: New User Created Via Net.EXE
    reason: Backup-server compromise is commonly followed by creating a backdoor local account.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Any qlogin invocation
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*[Qq]login.*/
    pivot_on: host
    window: 6h
  - name: qoperation / qcommand follow-on
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(qoperation|qcommand|qlist|qmodify).*/
    pivot_on: host
    window: 6h
  - name: JSP/script files created under Commvault web roots
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*([Aa]pache|[Tt]omcat|[Cc]ommvault|[Ww]ebapps|[Ww]eb[Rr]oot).*\.(jsp|jspx|war|aspx)/
    pivot_on: host
    window: 6h
  - name: Shells and recon spawned by Java/Tomcat
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*([Jj]ava|[Tt]omcat[0-9]*)\.exe/ AND data_win_eventdata_image:/.*(cmd|powershell|whoami|net1?|ipconfig|systeminfo|certutil|bitsadmin)\.exe/
    pivot_on: host
    window: 6h
  - name: Outbound connections from Commvault/Java processes
    query: data_win_system_eventID:3 AND data_win_eventdata_initiated:true AND data_win_eventdata_image:/.*([Jj]ava|[Cc]ommvault|[Cc]v[Dd]).*/
    pivot_on: host
    window: 6h
