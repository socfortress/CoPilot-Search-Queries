name: Windows Recovery Environment Disabled Via Reagentc
id: db1c21e4-cd66-4b4e-85ca-590f0780529c
version: 1
schema_version: "1.0"
date: "2025-07-31"
author: Daniel Koifman (KoifSec), Michael Vilshin
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: db1c21e4-cd66-4b4e-85ca-590f0780529c
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects attempts to disable windows recovery environment using Reagentc.
  ReAgentc.exe is a command-line tool in Windows used to manage the Windows
  Recovery Environment (WinRE). It allows users to enable, disable, and
  configure WinRE, which is used for troubleshooting and repairing common boot
  issues. MITRE ATT&CK: T1490.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\reagentc.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "reagentc.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-disable*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*/disable*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*–disable*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*—disable*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*―disable*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\reagentc.exe'; data_win_eventdata_originalFileName equals 'reagentc.exe';
  data_win_eventdata_commandLine matches '*-disable*', among other conditions.

known_false_positives: >
  Legitimate administrative activity. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://www.elastic.co/security-labs/maas-appeal-an-infostealer-rises-from-the-ashes
  - https://learn.microsoft.com/en-us/windows-hardware/manufacture/desktop/reagentc-command-line-options?view=windows-11
  - https://attack.mitre.org/techniques/T1490/

response:
  message: >
    Windows Recovery Environment Disabled Via Reagentc detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1490
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1490
  custom_tags:
    - recovery
    - environment
    - reagentc
    - process_creation
    - sysmon
    - impact
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Rr][Ee][Aa][Gg][Ee][Nn][Tt][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Rr][Ee][Aa][Gg][Ee][Nn][Tt][Cc]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*-[Dd][Ii][Ss][Aa][Bb][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*\/[Dd][Ii][Ss][Aa][Bb][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*–[Dd][Ii][Ss][Aa][Bb][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*—[Dd][Ii][Ss][Aa][Bb][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*―[Dd][Ii][Ss][Aa][Bb][Ll][Ee].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: Shadow copy deletion is the usual companion to disabling WinRE before encryption.
  - id: 639c9081-f482-47d3-a0bd-ddee3d4ecd76
    name: All Backups Deleted Via Wbadmin.EXE
    reason: Wbadmin backup deletion removes remaining recovery options.
  - id: 89f75308-5b1b-4390-b2d8-d6b2340efaf8
    name: Windows Backup Deleted Via Wbadmin.EXE
    reason: Backup deletion via wbadmin in the same ransomware prep sequence.
  - id: 1444443e-6757-43e4-9ea4-c8fc705f79a2
    name: Boot Configuration Tampering Via Bcdedit.EXE
    reason: Bcdedit tampering to disable recovery is often run together with reagentc.
  - id: c9fbe8e9-119d-40a6-9b59-dd58a5d84429
    name: Potential Ransomware or Unauthorized MBR Tampering Via Bcdedit.EXE
    reason: Bcdedit changes used for ransomware boot tampering.
  - id: windows-bcdedit-prevent-automatic-repair-001
    name: Windows BCDEdit Prevent Automatic Repair Mode
    reason: Disabling automatic repair complements disabling WinRE.
  - id: 9703792d-fd9a-456d-a672-ff92efe4806a
    name: Backup Catalog Deleted
    reason: Backup catalog deletion removes backup history before encryption.
  - id: fdb829a8-db84-4832-b64b-3e964cd44f01
    name: Windows Eventlog Cleared Via Wevtutil
    reason: Event log clearing commonly follows inhibit-recovery steps.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Shadow copy and backup deletion commands
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*vssadmin.*[Dd]elete.*/ OR /.*[Ss]hadow[Cc]opy.*[Dd]elete.*/ OR /.*wbadmin.*[Dd]elete.*/)
    pivot_on: host
    window: 6h
  - name: Boot configuration tampering
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*bcdedit.*recoveryenabled.*/ OR /.*bcdedit.*ignoreallfailures.*/ OR /.*bcdedit.*safeboot.*/)
    pivot_on: host
    window: 6h
  - name: Event log clearing
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*wevtutil.*cl.*/ OR /.*[Cc]lear-[Ee]vent[Ll]og.*/)
    pivot_on: host
    window: 6h
  - name: Security tooling or service stop
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*net1? stop.*/ OR /.*sc(\.exe)? (stop|config).*/ OR /.*[Ss]et-[Mm]p[Pp]reference.*/)
    pivot_on: host
    window: 6h
  - name: Recovery inhibit commands run remotely
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*reagentc.*/ OR /.*vssadmin.*/ OR /.*bcdedit.*/) AND data_win_eventdata_parentImage:(/.*wmiprvse.*/ OR /.*[Pp]ower[Ss]hell.*/ OR /.*psexe.*/)
    pivot_on: user
    window: 6h
