name: Potential File Overwrite Via Sysinternals SDelete
id: a4824fca-976f-4964-b334-0621379e84c4
version: 1
schema_version: "1.0"
date: "2023-02-28"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: a4824fca-976f-4964-b334-0621379e84c4
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the use of SDelete to erase a file not the free space. MITRE ATT&CK:
  T1485.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - term:
            data_win_eventdata_originalFileName:
              value: "sdelete.exe"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_commandLine"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* -h*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* -c*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* -z*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine: "* /\\?*"
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_originalFileName equals
  'sdelete.exe'; data_win_eventdata_commandLine matches '* -h*';
  data_win_eventdata_commandLine matches '* -c*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1485/T1485.md
  - https://attack.mitre.org/techniques/T1485/

response:
  message: >
    Potential File Overwrite Via Sysinternals SDelete detected on host
    $agent_name$. Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1485
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_originalFileName
      type: file_name
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1485
  custom_tags:
    - overwrite
    - sysinternals
    - sdelete
    - process_creation
    - sysmon
    - impact
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_originalFileName:/[Ss][Dd][Ee][Ll][Ee][Tt][Ee]\.[Ee][Xx][Ee]/ AND _exists_:data_win_eventdata_commandLine AND NOT (data_win_eventdata_commandLine:/.* -[Hh].*/ OR data_win_eventdata_commandLine:/.* -[Cc].*/ OR data_win_eventdata_commandLine:/.* -[Zz].*/ OR data_win_eventdata_commandLine:/.* \/\?.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 4b046706-5789-4673-b111-66f25fe99534
    name: Deleted Data Overwritten Via Cipher.EXE
    reason: Cipher /w is the built-in alternative to SDelete for irrecoverable wiping; cleanup often uses both.
  - id: 4e5e024e-fabb-11eb-8b8f-acde48001122
    name: Fsutil Zeroing File
    reason: Another native way to destroy file contents so forensic recovery fails; co-occurs in anti-forensic cleanup.
  - id: 236e7c8e-c9d9-11eb-a824-acde48001122
    name: Disable Logs Using WevtUtil
    reason: Log clearing/disabling commonly accompanies secure deletion of tooling and staged data.
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: 'Wiping files plus removing shadow copies removes every recovery path: destructive or ransomware impact.'
  - id: 204b17ae-4007-471b-917b-b917b315c5db
    name: Greedy File Deletion Using Del
    reason: Bulk deletion before or after the overwrite shows the scope of data destruction.
  - id: c9fbe8e9-119d-40a6-9b59-dd58a5d84429
    name: Potential Ransomware or Unauthorized MBR Tampering Via Bcdedit.EXE
    reason: Recovery-disabling bcdedit alongside overwrite points to the impact stage of ransomware or a wiper.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Log clearing and shadow copy deletion on host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll].* [Cc][Ll].*/ OR data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*[Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Hh][Aa][Dd][Oo][Ww][Cc][Oo][Pp][Yy].*[Dd][Ee][Ll][Ee][Tt][Ee].*/)
    pivot_on: host
    window: 4h
  - name: Other secure-wipe tooling (cipher /w, fsutil)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Ii][Pp][Hh][Ee][Rr].* \/[Ww].*/ OR data_win_eventdata_commandLine:/.*[Ff][Ss][Uu][Tt][Ii][Ll].*[Ss][Ee][Tt][Zz][Ee][Rr][Oo].*/)
    pivot_on: host
    window: 4h
  - name: SDelete dropped or staged on disk
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Ss][Dd][Ee][Ll][Ee][Tt][Ee].*/
    pivot_on: host
    window: 6h
  - name: Shell or script hosts invoking SDelete
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\(cmd|powershell|pwsh|wscript|cscript)\.exe/ AND data_win_eventdata_commandLine:/.*[Ss][Dd][Ee][Ll][Ee][Tt][Ee].*/
    pivot_on: host
    window: 2h
