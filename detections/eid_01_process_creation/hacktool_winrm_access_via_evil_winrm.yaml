name: HackTool - WinRM Access Via Evil-WinRM
id: a197e378-d31b-41c0-9635-cfdf1c1bb423
version: 1
schema_version: "1.0"
date: "2023-02-13"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: a197e378-d31b-41c0-9635-cfdf1c1bb423
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Adversaries may use Valid Accounts to log into a computer using the Remote
  Desktop Protocol (RDP). The adversary may then perform actions as the
  logged-on user. MITRE ATT&CK: T1021.006.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\ruby.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*-i *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*-u *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*-p *"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\ruby.exe'; data_win_eventdata_commandLine matches '*-i *';
  data_win_eventdata_commandLine matches '*-u *', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1021.006/T1021.006.md#atomic-test-3---winrm-access-with-evil-winrm
  - https://github.com/Hackplayers/evil-winrm
  - https://attack.mitre.org/techniques/T1021/006/

response:
  message: >
    HackTool - WinRM Access Via Evil-WinRM detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1021.006
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1021.006
  custom_tags:
    - hacktool
    - winrm
    - process_creation
    - sysmon
    - lateral_movement
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Rr][Uu][Bb][Yy]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*-[Ii] .*/ AND data_win_eventdata_commandLine:/.*-[Uu] .*/ AND data_win_eventdata_commandLine:/.*-[Pp] .*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 79df3f68-dccb-48e9-9171-b75cbc37c51d
    name: Potential Lateral Movement via Windows Remote Shell
    reason: Both are remote shell lateral movement over WinRM
  - id: 7638e5fe-600c-4289-a968-f49dd537ec7d
    name: HackTool - NetExec Execution
    reason: NetExec commonly validates credentials and shells in via WinRM before Evil-WinRM
  - id: 42a993dd-bb3e-48c8-b372-4d6684c4106c
    name: HackTool - CrackMapExec Execution
    reason: CrackMapExec WinRM credential sprays precede Evil-WinRM use
  - id: 10c14723-61c7-4c75-92ca-9af245723ad2
    name: HackTool - Potential Impacket Lateral Movement Activity
    reason: Impacket lateral movement is the sibling pivot technique from the same attacker host
  - id: 30edb182-aa75-42c0-b0a9-e998bb29067c
    name: Potential AMSI Bypass Via .NET Reflection
    reason: Evil-WinRM ships an AMSI bypass in-session
  - id: 7ec2c172-dceb-4c10-92c9-87c1881b7e18
    name: HackTool - Rubeus Execution
    reason: Evil-WinRM sessions are used to load Rubeus for ticket abuse
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: Credential dumping with Mimikatz is a common action inside the shell
  - id: cd219ff3-fa99-45d4-8380-a7d15116c6dc
    name: New User Created Via Net.EXE
    reason: Persistence via new local user follows shell access
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Processes spawned by WinRM host (wsmprovhost)
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*\\[Ww][Ss][Mm][Pp][Rr][Oo][Vv][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee].*/
    pivot_on: host
    window: 4h
  - name: Network logons (type 3) from attacker source
    query: data_win_system_eventID:4624 AND data_win_eventdata_logonType:3
    pivot_on: user
    window: 2h
  - name: Post-shell credential and recon commands
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz].*/ OR /.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR /.*[Ww][Hh][Oo][Aa][Mm][Ii] /[Aa][Ll][Ll].*/ OR /.*[Nn][Ee][Tt] [Gg][Rr][Oo][Uu][Pp].*/ OR /.*[Nn][Ll][Tt][Ee][Ss][Tt].*/)
    pivot_on: host
    window: 4h
  - name: PowerShell remoting and AMSI bypass
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Aa][Mm][Ss][Ii][Uu][Tt][Ii][Ll][Ss].*/ OR /.*[Bb][Yy][Pp][Aa][Ss][Ss]-4[Mm][Ss][Ii].*/ OR /.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Cc][Oo][Mm][Mm][Aa][Nn][Dd].*/ OR /.*[Ee][Nn][Tt][Ee][Rr]-[Pp][Ss][Ss][Ee][Ss][Ss][Ii][Oo][Nn].*/)
    pivot_on: host
    window: 2h
  - name: Persistence by account or service creation
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Nn][Ee][Tt] [Uu][Ss][Ee][Rr].*/ OR /.*[Nn][Ee][Tt] [Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp] [Aa][Dd][Mm][Ii][Nn][Ii][Ss][Tt][Rr][Aa][Tt][Oo][Rr][Ss].*/ OR /.*[Ss][Cc] [Cc][Rr][Ee][Aa][Tt][Ee].*/)
    pivot_on: host
    window: 6h
