name: Windows MOF Event Triggered Execution via WMI
id: windows-mof-event-triggered-execution-wmi-001
version: 1
schema_version: "1.0"
date: "2026-02-27"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects execution of mofcomp.exe loading a MOF file, especially when 
  triggered by cmd.exe or powershell.exe, or from suspicious paths like 
  AppData or Users\Public. WMI MOF compilation is used for persistence 
  and lateral movement via event subscriptions.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - wildcard:
            data_win_eventdata_image: "*mofcomp.exe*"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_parentImage: "*cmd.exe*"
              - wildcard:
                  data_win_eventdata_parentImage: "*powershell.exe*"
              - wildcard:
                  data_win_eventdata_commandLine: "*\\AppData\\Local\\*"
              - wildcard:
                  data_win_eventdata_commandLine: "*\\Users\\Public\\*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    type: string
    required: true
  CUSTOMER_CODE:
    type: string
    required: true
  START_TIME:
    type: datetime
    default: "now-24h"
  END_TIME:
    type: datetime
    default: "now"

how_to_implement: >
  Requires Sysmon EventID 1 with full command-line and parent process logging.

known_false_positives: >
  SCCM and automation tools may use mofcomp.exe. Filter known paths.

references:
  - https://attack.mitre.org/techniques/T1546/003/
  - https://thedfirreport.com/2022/07/11/select-xmrig-from-sqlserver/
  - https://pentestlab.blog/2020/01/21/persistence-wmi-event-subscription/

response:
  message: >
    MOFComp.exe execution on $agent_name$. 
    Command: $data_win_eventdata_commandLine$. 
    Parent: $data_win_eventdata_parentImage$. 
    WMI persistence indicator. MITRE ATT&CK: T1546.003
  risk_score: 64
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 64

tags:
  analytic_story:
    - Living Off The Land
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1546.003
  custom_tags:
    - mofcomp
    - wmi_persistence
    - event_subscription
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*mofcomp\.exe.*/ AND (data_win_eventdata_parentImage:/.*cmd\.exe.*/ OR data_win_eventdata_parentImage:/.*powershell\.exe.*/ OR data_win_eventdata_commandLine:/.*AppData.*Local.*/ OR data_win_eventdata_commandLine:/.*Users.*Public.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 1dd05363-104e-4b4a-b963-196a534b03a1
    name: Potential Suspicious Mofcomp Execution
    reason: Same mofcomp.exe behaviour from a different angle; a hit on both confirms a MOF was compiled from an untrusted location.
  - id: ec1d5e28-8f3b-4188-a6f8-6e8df81dc28e
    name: WMI Persistence - Script Event Consumer
    reason: A compiled MOF typically registers an ActiveScriptEventConsumer; this is the persistence outcome.
  - id: 05936ce2-ee05-4dae-9d03-9a391cf2d2c6
    name: WMI Persistence - Command Line Event Consumer
    reason: MOF-registered CommandLineEventConsumer loads wbemcons.dll; confirms the subscription is armed.
  - id: b439f47d-ef52-4b29-9a2f-57d8a96cb6b8
    name: WMI ActiveScriptEventConsumers Activity Via Scrcons.EXE DLL Load
    reason: 'Follow-on: scrcons.exe running the consumer script when the filter triggers.'
  - id: ebef4391-1a81-4761-a40a-1db446c0e625
    name: NewActiveScriptEventConsumer Creation Attempt via Wmic.EXE
    reason: Alternative way of creating the same consumer; shows which tooling the actor used.
  - id: 8a582fe2-0882-4b89-a82a-da6b2dc32937
    name: Suspicious WmiPrvSE Child Process
    reason: After the subscription fires, WmiPrvSE spawns the payload process.
  - id: 692f0bec-83ba-4d04-af7e-e884a96059b6
    name: Potential WMI Lateral Movement WmiPrvSE Spawned PowerShell
    reason: MOF is also used for lateral movement; PowerShell under WmiPrvSE indicates payload execution.
  - id: c80e66d8-1780-48a9-b412-46663fd21ac0
    name: Suspicious Autorun Registry Modified via WMI
    reason: Related WMI-based persistence in Run keys by the same actor.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: mofcomp executions on host
    query: data_win_system_eventID:1 AND data_win_eventdata_image:*mofcomp.exe*
    pivot_on: host
    window: 24h
  - name: WmiPrvSE/scrcons child processes
    query: data_win_system_eventID:1 AND (data_win_eventdata_parentImage:*WmiPrvSE.exe* OR data_win_eventdata_parentImage:*scrcons.exe*)
    pivot_on: host
    window: 6h
  - name: WMI event filter/consumer/binding activity
    query: data_win_system_eventID:(19 OR 20 OR 21)
    pivot_on: host
    window: 24h
  - name: MOF files written to disk
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:*.[Mm][Oo][Ff]
    pivot_on: host
    window: 4h
  - name: wbemcons/scrcons DLL loads
    query: data_win_system_eventID:7 AND (data_win_eventdata_imageLoaded:*wbemcons.dll* OR data_win_eventdata_imageLoaded:*scrcons*)
    pivot_on: host
    window: 6h
