name: PUA - CsExec Execution
id: d08a2711-ee8b-4323-bdec-b7d85e892b31
version: 1
schema_version: "1.0"
date: "2023-02-21"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: d08a2711-ee8b-4323-bdec-b7d85e892b31
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the use of the lesser known remote execution tool named CsExec a
  PsExec alternative. MITRE ATT&CK: T1587.001, T1569.002.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\csexec.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_description:
                    value: "csexec"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_description
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\csexec.exe'; data_win_eventdata_description equals 'csexec'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/malcomvetter/CSExec
  - https://www.microsoft.com/security/blog/2022/05/09/ransomware-as-a-service-understanding-the-cybercrime-gig-economy-and-how-to-protect-yourself/
  - https://attack.mitre.org/techniques/T1587/001/
  - https://attack.mitre.org/techniques/T1569/002/

response:
  message: >
    PUA - CsExec Execution detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_description: $data_win_eventdata_description$. MITRE
    ATT&CK: T1587.001, T1569.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_description
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1587.001
    - T1569.002
  custom_tags:
    - csexec
    - process_creation
    - sysmon
    - resource_development
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Cc][Ss][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_description:/[Cc][Ss][Ee][Xx][Ee][Cc]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: ea011323-7045-460b-b2d7-0f7442ea6b38
    name: Potential PsExec Remote Execution
    reason: CsExec is a PsExec clone using the same remote-service execution technique.
  - id: fdfcbd78-48f1-4a4b-90ac-d82241e368c5
    name: PsExec Service Execution
    reason: Sibling remote service-execution artifact on the target side.
  - id: 7c0dcd3d-acf8-4f71-9570-f448b0034f94
    name: PsExec Service Child Process Execution as LOCAL SYSTEM
    reason: Remote commands run as SYSTEM children of the temporary service.
  - id: 683e6196-b8e8-11eb-9a79-acde48001122
    name: Detect Renamed PSExec
    reason: Operators rename these tools; co-occurrence indicates deliberate lateral movement.
  - id: bb3c1bac-6bdf-4aa0-8dc9-068b8b712a76
    name: Impacket Lateral Movement smbexec CommandLine Parameters
    reason: Alternative SMB/service-based remote exec used interchangeably by the same operators.
  - id: 855bc8b5-2ae8-402e-a9ed-b889e6df1900
    name: Copy From Or To Admin Share Or Sysvol Folder
    reason: Payload staging over ADMIN$/C$ precedes remote service execution.
  - id: 97b9ce1e-c5ab-11ea-87d0-0242ac130003
    name: PSExec and WMI Process Creations Block
    reason: Defender ASR blocking of PsExec/WMI process creation corroborates the lateral-movement attempt.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Service installs from remote execution
    query: data_win_system_eventID:"7045"
    pivot_on: host
    window: 2h
  - name: Service creation via sc.exe with binary path
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Ss][Cc]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Bb][Ii][Nn][Pp][Aa][Tt][Hh].*/)
    pivot_on: host
    window: 2h
  - name: Other remote exec tools and admin share staging
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*(\\[Pp][Ss][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]|\\[Pp][Ss][Ee][Xx][Ee][Cc]64\.[Ee][Xx][Ee]|\\[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]\.[Ee][Xx][Ee]|\\[Pp][Aa][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]|\\[Ww][Ii][Nn][Rr][Ss]\.[Ee][Xx][Ee]|\\[Cc][Ss][Ee][Xx][Ee][Cc][Ss][Vv][Cc]\.[Ee][Xx][Ee])/ OR (data_win_eventdata_image:/.*(\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]|\\[Xx][Cc][Oo][Pp][Yy]\.[Ee][Xx][Ee]|\\[Rr][Oo][Bb][Oo][Cc][Oo][Pp][Yy]\.[Ee][Xx][Ee]|\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*\\\\[Aa][Dd][Mm][Ii][Nn]$.*/ OR data_win_eventdata_commandLine:/.*\\\\[Cc]$.*/)))
    pivot_on: host
    window: 2h
  - name: Incoming SMB or RPC connections
    query: data_win_system_eventID:"3" AND data_win_eventdata_destinationPort:(445 OR 135) AND data_win_eventdata_initiated:"false"
    pivot_on: host
    window: 2h
  - name: Post-exec persistence and credential access
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Rr][Ee][Gg]\.[Ee][Xx][Ee]|\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*\\[Rr][Uu][Nn].*/ OR data_win_eventdata_commandLine:/.*\/[Cc][Rr][Ee][Aa][Tt][Ee].*/)) OR (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/)
    pivot_on: host
    window: 2h
