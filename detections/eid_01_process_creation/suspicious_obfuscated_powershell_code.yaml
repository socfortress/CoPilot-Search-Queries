status: experimental
type: TTP

description: >
  Detects suspicious UTF16 and base64 encoded and often obfuscated PowerShell
  code often used in command lines.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*IAAtAGIAeABvAHIAIAAwAHgA*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*AALQBiAHgAbwByACAAMAB4A*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*gAC0AYgB4AG8AcgAgADAAeA*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*AC4ASQBuAHYAbwBrAGUAKAApACAAfAAg*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*AuAEkAbgB2AG8AawBlACgAKQAgAHwAI*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*ALgBJAG4AdgBvAGsAZQAoACkAIAB8AC*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*AHsAMQB9AHsAMAB9ACIAIAAtAGYAI*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*B7ADEAfQB7ADAAfQAiACAALQBmAC*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*AewAxAH0AewAwAH0AIgAgAC0AZgAg*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*AHsAMAB9AHsAMwB9ACIAIAAtAGYAI*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*B7ADAAfQB7ADMAfQAiACAALQBmAC*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*AewAwAH0AewAzAH0AIgAgAC0AZgAg*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*AHsAMgB9AHsAMAB9ACIAIAAtAGYAI*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*B7ADIAfQB7ADAAfQAiACAALQBmAC*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*AewAyAH0AewAwAH0AIgAgAC0AZgAg*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*AHsAMQB9AHsAMAB9ACcAIAAtAGYAI*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*B7ADEAfQB7ADAAfQAnACAALQBmAC*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*AewAxAH0AewAwAH0AJwAgAC0AZgAg*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*AHsAMAB9AHsAMwB9ACcAIAAtAGYAI*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*B7ADAAfQB7ADMAfQAnACAALQBmAC*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*AewAwAH0AewAzAH0AJwAgAC0AZgAg*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*AHsAMgB9AHsAMAB9ACcAIAAtAGYAI*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*B7ADIAfQB7ADAAfQAnACAALQBmAC*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*AewAyAH0AewAwAH0AJwAgAC0AZgAg*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*IAAtAGIAeABvAHIAIAAwAHgA*'; data_win_eventdata_commandLine matches
  '*AALQBiAHgAbwByACAAMAB4A*'; data_win_eventdata_commandLine matches
  '*gAC0AYgB4AG8AcgAgADAAeA*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://app.any.run/tasks/fcadca91-3580-4ede-aff4-4d2bf809bf99/

response:
  message: >
    Suspicious Obfuscated PowerShell Code detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - obfuscated
    - powershell
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

