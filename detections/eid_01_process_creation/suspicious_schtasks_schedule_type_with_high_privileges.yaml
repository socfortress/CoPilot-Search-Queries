name: Suspicious Schtasks Schedule Type With High Privileges
id: 7a02e22e-b885-4404-b38b-1ddc7e65258a
version: 1
schema_version: "1.0"
date: "2022-08-31"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 7a02e22e-b885-4404-b38b-1ddc7e65258a
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects scheduled task creations or modification to be run with high
  privileges on a suspicious schedule type. MITRE ATT&CK: T1053.005.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\schtasks.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "schtasks.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* ONLOGON *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* ONSTART *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* ONCE *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* ONIDLE *"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*NT AUT*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* SYSTEM*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*HIGHEST*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\schtasks.exe'; data_win_eventdata_originalFileName equals 'schtasks.exe';
  data_win_eventdata_commandLine matches '* ONLOGON *', among other conditions.

known_false_positives: >
  Some installers were seen using this method of creation unfortunately. Filter
  them in your environment. Baseline expected activity in your environment and
  tune this detection before relying on it for automated response.

references:
  - https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/schtasks-change
  - https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/schtasks-create
  - https://attack.mitre.org/techniques/T1053/005/

response:
  message: >
    Suspicious Schtasks Schedule Type With High Privileges detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1053.005
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1053.005
  custom_tags:
    - schtasks
    - schedule
    - privileges
    - process_creation
    - sysmon
    - privilege_escalation
    - persistence
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.* [Oo][Nn][Ll][Oo][Gg][Oo][Nn] .*/ OR data_win_eventdata_commandLine:/.* [Oo][Nn][Ss][Tt][Aa][Rr][Tt] .*/ OR data_win_eventdata_commandLine:/.* [Oo][Nn][Cc][Ee] .*/ OR data_win_eventdata_commandLine:/.* [Oo][Nn][Ii][Dd][Ll][Ee] .*/) AND (data_win_eventdata_commandLine:/.*[Nn][Tt] [Aa][Uu][Tt].*/ OR data_win_eventdata_commandLine:/.* [Ss][Yy][Ss][Tt][Ee][Mm].*/ OR data_win_eventdata_commandLine:/.*[Hh][Ii][Gg][Hh][Ee][Ss][Tt].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 89ca78fd-b37c-4310-b3d3-81a023f83936
    name: Schtasks Creation Or Modification With SYSTEM Privileges
    reason: Same schtasks /create ... /ru SYSTEM behaviour from a different angle; co-firing confirms privileged persistence being planted.
  - id: 81325ce1-be01-4250-944f-b4789644556f
    name: Schedule Task Creation From Env Variable Or Potentially Suspicious Path Via Schtasks.EXE
    reason: The task payload (/tr) pointing at temp/AppData/env-variable paths shows what the high-privilege task will actually run.
  - id: 8a8379b8-780b-4dbf-b1e9-31c8d112fefb
    name: Schtasks From Suspicious Folders
    reason: schtasks launched from a user-writable folder indicates a dropped tool or script created the task.
  - id: f2c64357-b1d2-41b7-849f-34d2682c0fad
    name: Suspicious Command Patterns In Scheduled Task Creation
    reason: Inline cmd/powershell chains in the task action reveal the payload behind the SYSTEM task.
  - id: 9f8573c9-22b4-40e3-89c1-72bc2b8d49ab
    name: Scheduled Task Creation Masquerading as System Processes
    reason: Attackers name SYSTEM tasks like Windows tasks to hide; same persistence intent.
  - id: ff2fff64-4cd6-4a2b-ba7d-e28a30bbe66b
    name: Suspicious Scheduled Task Name As GUID
    reason: GUID-named tasks are common in malware-created persistence alongside privileged schedules.
  - id: 1c0e41cd-21bb-4433-9acc-4a2cd6367b9b
    name: Suspicious Modification Of Scheduled Tasks
    reason: Follow-on tampering of the same task (changing its action to a malicious binary).
  - id: 86588b36-c6d3-465f-9cee-8f9093e07798
    name: Scheduled Task Executing Payload from Registry
    reason: 'Fileless variant: the privileged task launches a payload stored in the registry.'
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: All schtasks invocations on host
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 4h
  - name: Scheduled task created (Security 4698)
    query: data_win_system_eventID:"4698"
    pivot_on: host
    window: 4h
  - name: Task XML or payload dropped in Tasks folder or AppData
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Tt][Aa][Ss][Kk][Ss]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*\.(exe|dll|ps1|bat|vbs)/)
    pivot_on: host
    window: 4h
  - name: Download or encoded shell activity by same user
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:*-enc* OR data_win_eventdata_commandLine:*http*)
    pivot_on: user
    window: 2h
