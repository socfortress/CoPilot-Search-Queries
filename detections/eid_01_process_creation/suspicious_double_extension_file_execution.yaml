description: >
  Detects suspicious use of an .exe extension after a non-executable file
  extension like .pdf.exe, a set of spaces or underlines to cloak the executable
  file in spear phishing campaigns. MITRE ATT&CK: T1566.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*      .exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*______.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*.doc.exe"
                    case_insensitive: true
              - wildcard:
