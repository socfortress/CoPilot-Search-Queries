correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b4926b47-a9d7-434c-b3a0-adc3fa0bd13e
    name: Suspicious Double Extension Files
    reason: 'File-create counterpart: the double-extension file being dropped immediately precedes its execution.'
  - id: 3215aa19-f060-4332-86d5-5602511f3ca8
    name: Suspicious LNK Double Extension File Created
    reason: Same lure family using LNK as the hidden extension.
  - id: aa3a6f94-890e-4e22-b634-ffdfd54792cc
    name: Suspicious Binary In User Directory Spawned From Office Application
    reason: Phishing chain where an opened Office document launches a user-directory binary.
  - id: fcdf69e5-a3d3-452a-9724-26f2308bf2b1
    name: Phishing Pattern ISO in Archive
    reason: Alternate spear-phishing delivery preceding execution of cloaked executables.
  - id: 9c5037d1-c568-49b3-88c7-9846a5bdc2be
    name: Suspicious Run Key from Download
    reason: Post-execution persistence by a binary run from download or Outlook cache locations.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Double-extension files created
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\.[Pp][Dd][Ff]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_targetFilename:/.*\.[Dd][Oo][Cc]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_targetFilename:/.*\.[Dd][Oo][Cc][Xx]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_targetFilename:/.*\.[Xx][Ll][Ss]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_targetFilename:/.*\.[Xx][Ll][Ss][Xx]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_targetFilename:/.*\.[Jj][Pp][Gg]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_targetFilename:/.*\.[Tt][Xx][Tt]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_targetFilename:/.*\.[Pp][Dd][Ff]\.[Jj][Ss].*/ OR data_win_eventdata_targetFilename:/.*\.[Dd][Oo][Cc]\.[Jj][Ss].*/ OR data_win_eventdata_targetFilename:/.*      \.[Ee][Xx][Ee].*/ OR data_win_eventdata_targetFilename:/.*______\.[Ee][Xx][Ee].*/)
    pivot_on: host
    window: 4h
  - name: Execution from mail, download or temp staging paths
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Cc][Oo][Nn][Tt][Ee][Nn][Tt]\.[Oo][Uu][Tt][Ll][Oo][Oo][Kk]\\.*/ OR data_win_eventdata_image:/.*\\[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]\\.*/ OR data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\.*/) AND (data_win_eventdata_image:/.*\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\.[Jj][Ss].*/ OR data_win_eventdata_image:/.*\.[Ss][Cc][Rr].*/)
    pivot_on: host
    window: 4h
  - name: Persistence and discovery commands after execution
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss].*/ OR data_win_eventdata_commandLine:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ww][Hh][Oo][Aa][Mm][Ii].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt] [Uu][Ss][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Ii][Pp][Cc][Oo][Nn][Ff][Ii][Gg].*/)
    pivot_on: host
    window: 2h
  - name: Network connections from user-directory binaries
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*\\[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]\\.*/ OR data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/)
    pivot_on: host
    window: 2h
  - name: Zone.Identifier streams on executables (mail/web origin)
    query: data_win_system_eventID:"15" AND (data_win_eventdata_targetFilename:/.*\.[Ee][Xx][Ee]:[Zz][Oo][Nn][Ee]\.[Ii][Dd][Ee][Nn][Tt][Ii][Ff][Ii][Ee][Rr].*/ OR data_win_eventdata_targetFilename:/.*\.[Jj][Ss]:[Zz][Oo][Nn][Ee]\.[Ii][Dd][Ee][Nn][Tt][Ii][Ff][Ii][Ee][Rr].*/ OR data_win_eventdata_targetFilename:/.*\.[Ss][Cc][Rr]:[Zz][Oo][Nn][Ee]\.[Ii][Dd][Ee][Nn][Tt][Ii][Ff][Ii][Ee][Rr].*/)
    pivot_on: host
    window: 6h
