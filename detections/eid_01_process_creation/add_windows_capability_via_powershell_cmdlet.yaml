name: Add Windows Capability Via PowerShell Cmdlet
id: b36d01a3-ddaf-4804-be18-18a6247adfcd
version: 1
schema_version: "1.0"
date: "2023-05-09"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: b36d01a3-ddaf-4804-be18-18a6247adfcd
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects usage of the "Add-WindowsCapability" cmdlet to add Windows
  capabilities. Notable capabilities could be "OpenSSH" and others.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\powershell.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\pwsh.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "PowerShell.EXE"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "pwsh.dll"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*Add-WindowsCapability*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*OpenSSH.*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\powershell.exe'; data_win_eventdata_image matches '*\pwsh.exe';
  data_win_eventdata_originalFileName equals 'PowerShell.EXE', among other
  conditions.

known_false_positives: >
  Legitimate usage of the capabilities by administrators or users. Add
  additional filters accordingly. Baseline expected activity in your environment
  and tune this detection before relying on it for automated response.

references:
  - https://learn.microsoft.com/en-us/windows-server/administration/openssh/openssh_install_firstuse?tabs=powershell
  - https://www.virustotal.com/gui/file/af1c82237b6e5a3a7cdbad82cc498d298c67845d92971bada450023d1335e267/content

response:
  message: >
    Add Windows Capability Via PowerShell Cmdlet detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  custom_tags:
    - capability
    - powershell
    - cmdlet
    - process_creation
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Pp][Ww][Ss][Hh]\.[Dd][Ll][Ll]/) AND data_win_eventdata_commandLine:/.*[Aa][Dd][Dd]-[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Cc][Aa][Pp][Aa][Bb][Ii][Ll][Ii][Tt][Yy].*/ AND data_win_eventdata_commandLine:/.*[Oo][Pp][Ee][Nn][Ss][Ss][Hh]\..*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 155c7fd5-47b4-49b2-bbeb-eb4fab335429
    name: Add Windows Capability Via PowerShell Script
    reason: Script-block logging view of the same Add-WindowsCapability call; corroborates script context.
  - id: 2daa93a0-a5fb-41c5-8cd8-3c11294bfd1f
    name: Potential SSH Tunnel Persistence Install Using A Scheduled Task
    reason: OpenSSH install precedes scheduled-task ssh tunnels used for persistence.
  - id: f7d7ebd5-a016-46e2-9c54-f9932f2d386d
    name: Potential RDP Tunneling Via SSH
    reason: Once the ssh client exists, attackers tunnel RDP through it.
  - id: 327f48c1-a6db-4eb8-875a-f6981f1b0183
    name: Port Forwarding Activity Via SSH.EXE
    reason: Follow-on use of the newly installed ssh client for port forwarding.
  - id: 7d6d30b8-5b91-4b90-a891-46cccaf29598
    name: Program Executed Using Proxy/Local Command Via SSH.EXE
    reason: ssh.exe used as a proxy executor after installation.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: ssh/sshd execution and sshd service start
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:(/.*\\ssh\.exe/ OR /.*\\sshd\.exe/ OR /.*\\ssh-keygen\.exe/) OR data_win_eventdata_commandLine:/.*([Ss]tart-[Ss]ervice|[Ss]et-[Ss]ervice).*sshd.*/)
    pivot_on: host
    window: 6h
  - name: Firewall rule opening SSH
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Nn]etsh.*[Ff]irewall.*(22|[Ss]sh).*/ OR /.*[Nn]ew-[Nn]et[Ff]irewall[Rr]ule.*(22|[Ss]sh).*/)
    pivot_on: host
    window: 6h
  - name: Scheduled tasks or services created
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ss]chtasks.*\/[Cc]reate.*/ OR /.*[Ss]c(\.exe)? +create.*/ OR /.*[Rr]egister-[Ss]cheduled[Tt]ask.*/)
    pivot_on: host
    window: 6h
  - name: Other optional feature or capability changes
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ee]nable-[Ww]indows[Oo]ptional[Ff]eature.*/ OR /.*[Dd]ism.*\/[Oo]nline.*\/[Ee]nable.*/ OR /.*[Aa]dd-[Ww]indows[Cc]apability.*/)
    pivot_on: host
    window: 6h
  - name: authorized_keys / sshd_config file writes
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(/.*authorized_keys.*/ OR /.*sshd_config.*/)
    pivot_on: host
    window: 24h
