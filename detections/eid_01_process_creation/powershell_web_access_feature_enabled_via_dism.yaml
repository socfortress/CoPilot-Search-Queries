name: PowerShell Web Access Feature Enabled Via DISM
id: 7e8f2d3b-9c1a-4f67-b9e8-8d9006e0e51f
version: 1
schema_version: "1.0"
date: "2024-09-03"
author: Michael Haag
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 7e8f2d3b-9c1a-4f67-b9e8-8d9006e0e51f
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the use of DISM to enable the PowerShell Web Access feature, which
  could be used for remote access and potential abuse. MITRE ATT&CK: T1548.002.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\dism.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "DISM.EXE"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*WindowsPowerShellWebAccess*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*/online*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*/enable-feature*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\dism.exe'; data_win_eventdata_originalFileName equals 'DISM.EXE';
  data_win_eventdata_commandLine matches '*WindowsPowerShellWebAccess*', among
  other conditions.

known_false_positives: >
  Legitimate PowerShell Web Access installations by administrators. Baseline
  expected activity in your environment and tune this detection before relying
  on it for automated response.

references:
  - https://docs.microsoft.com/en-us/powershell/module/dism/enable-windowsoptionalfeature
  - https://www.cisa.gov/news-events/cybersecurity-advisories/aa24-241a
  - https://gist.github.com/MHaggis/7e67b659af9148fa593cf2402edebb41
  - https://attack.mitre.org/techniques/T1548/002/

response:
  message: >
    PowerShell Web Access Feature Enabled Via DISM detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1548.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1548.002
  custom_tags:
    - powershell
    - feature
    - process_creation
    - sysmon
    - privilege_escalation
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Dd][Ii][Ss][Mm]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Dd][Ii][Ss][Mm]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll][Ww][Ee][Bb][Aa][Cc][Cc][Ee][Ss][Ss].*/ AND data_win_eventdata_commandLine:/.*\/[Oo][Nn][Ll][Ii][Nn][Ee].*/ AND data_win_eventdata_commandLine:/.*\/[Ee][Nn][Aa][Bb][Ll][Ee]-[Ff][Ee][Aa][Tt][Uu][Rr][Ee].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 734f8d9b-42b8-41b2-bcf5-abaf49d5a3c8
    name: Remote PowerShell Session Host Process (WinRM)
    reason: PSWA fronts remote PowerShell; WinRM host processes show the gateway being used.
  - id: 0d5675be-bc88-4172-86d3-1e96a4476536
    name: Potential Tampering With RDP Related Registry Keys Via Reg.EXE
    reason: Attackers enabling one remote access channel typically enable several together.
  - id: cf2e938e-9a3e-4fe8-a347-411642b28a9f
    name: Potential PowerShell Execution Policy Tampering - ProcCreation
    reason: Relaxing execution policy commonly accompanies setting up PowerShell remote access.
  - id: 43e32da2-fdd0-4156-90de-50dfd62636f9
    name: Dism Remove Online Package
    reason: Same DISM tool abused to alter OS features; the attacker may also strip security packages.
  - id: a7ee1722-c3c5-aeff-3212-c777e4733217
    name: Disable Windows Defender AV Security Monitoring
    reason: Defence weakening usually precedes or follows persistent remote access setup.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: PSWA gateway install and authorization rules
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*[Ii]nstall-[Pp]swa.*/ OR data_win_eventdata_commandLine:/.*[Pp]ower[Ss]hell[Ww]eb[Aa]ccess.*/ OR data_win_eventdata_commandLine:/.*[Aa]dd-[Pp]swa[Aa]uthorization[Rr]ule.*/)
    pivot_on: host
    window: 24h
  - name: Windows feature and IIS role changes
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*[Ee]nable-[Ff]eature.*/ OR data_win_eventdata_commandLine:/.*[Ee]nable-[Ww]indows[Oo]ptional[Ff]eature.*/ OR data_win_eventdata_commandLine:/.*[Ii]nstall-[Ww]indows[Ff]eature.*/)
    pivot_on: host
    window: 24h
  - name: WinRM and firewall exposure changes
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*[Ee]nable-[Pp][Ss][Rr]emoting.*/ OR data_win_eventdata_commandLine:/.*[Ww]in[Rr][Mm].*[Qq]uick[Cc]onfig.*/ OR data_win_eventdata_commandLine:/.*[Nn]etsh.*[Aa]dv[Ff]irewall.*/ OR data_win_eventdata_commandLine:/.*[Nn]ew-[Nn]et[Ff]irewall[Rr]ule.*/)
    pivot_on: host
    window: 24h
  - name: Account creation or admin group changes
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*net1? +(user|localgroup).*/ OR data_win_eventdata_commandLine:/.*[Nn]ew-[Ll]ocal[Uu]ser.*/ OR data_win_eventdata_commandLine:/.*[Aa]dd-[Ll]ocal[Gg]roup[Mm]ember.*/)
    pivot_on: host
    window: 24h
