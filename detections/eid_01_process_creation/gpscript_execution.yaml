name: Gpscript Execution
id: 1e59c230-6670-45bf-83b0-98903780607e
version: 1
schema_version: "1.0"
date: "2023-06-14"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 1e59c230-6670-45bf-83b0-98903780607e
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of the LOLBIN gpscript, which executes logon or startup
  scripts configured in Group Policy. MITRE ATT&CK: T1218.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\gpscript.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "GPSCRIPT.EXE"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /logon*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /startup*"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_parentCommandLine"
        - bool:
            must_not:
              - term:
                  data_win_eventdata_parentCommandLine:
                    value: "C:\\windows\\system32\\svchost.exe -k netsvcs -p -s gpsvc"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentCommandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\gpscript.exe'; data_win_eventdata_originalFileName equals 'GPSCRIPT.EXE';
  data_win_eventdata_commandLine matches '* /logon*', among other conditions.

known_false_positives: >
  Legitimate uses of logon scripts distributed via group policy. Baseline
  expected activity in your environment and tune this detection before relying
  on it for automated response.

references:
  - https://oddvar.moe/2018/04/27/gpscript-exe-another-lolbin-to-the-list/
  - https://lolbas-project.github.io/lolbas/Binaries/Gpscript/
  - https://attack.mitre.org/techniques/T1218/

response:
  message: >
    Gpscript Execution detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1218
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218
  custom_tags:
    - gpscript
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Gg][Pp][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Gg][Pp][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.* \/[Ll][Oo][Gg][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.* \/[Ss][Tt][Aa][Rr][Tt][Uu][Pp].*/) AND _exists_:data_win_eventdata_parentCommandLine AND NOT (data_win_eventdata_parentCommandLine:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee] -[Kk] [Nn][Ee][Tt][Ss][Vv][Cc][Ss] -[Pp] -[Ss] [Gg][Pp][Ss][Vv][Cc]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 21d856f9-9281-4ded-9377-51a1a6e2a432
    name: Potential Persistence Via Logon Scripts - CommandLine
    reason: Logon-script persistence setup is what gpscript would then execute.
  - id: 5f87308a-0a5b-4623-ae15-d8fa1809bc60
    name: Suspicious Files in Default GPO Folder
    reason: Malicious files in GPO folders are the payload gpscript runs.
  - id: dcff7e85-d01f-4eb5-badd-84e2e6be8294
    name: Windows Default Domain GPO Modification via GPME
    reason: Tampering with default GPO may stage startup/logon scripts.
  - id: e56d3073-83ff-4021-90fe-c658e0709e72
    name: Gpresult Display Group Policy Information
    reason: gpresult reveals which scripts apply; recon adjacent to gpscript.
  - id: cea72823-df4d-4567-950c-0b579eaf0846
    name: Potential Dropper Script Execution Via WScript/CScript/MSHTA
    reason: Script engines are the likely children of a gpscript run.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Children of script host/gpscript
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:(/.*\\(gpscript|cmd|wscript|cscript|powershell)\.exe/) AND data_win_eventdata_commandLine:(/.*(\\[Ss][Cc][Rr][Ii][Pp][Tt][Ss]|[Ll]ogon|[Ss]tartup|\\[Ss][Yy][Ss][Vv][Oo][Ll]).*/)
    pivot_on: host
    window: 2h
  - name: Suspicious scripts from SYSVOL/netlogon
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*(\\[Ss][Yy][Ss][Vv][Oo][Ll]\\|\\[Nn][Ee][Tt][Ll][Oo][Gg][Oo][Nn]\\).*/)
    pivot_on: host
    window: 4h
  - name: Logon script registry persistence
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*(UserInitMprLogonScript|[Gg]roup[Pp]olicy.*[Ss]cripts).*/)
    pivot_on: host
    window: 6h
  - name: Download cradles after script run
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*(DownloadString|DownloadFile|[Ii]nvoke-[Ww]eb[Rr]equest|certutil.*-urlcache|bitsadmin).*/)
    pivot_on: host
    window: 2h
