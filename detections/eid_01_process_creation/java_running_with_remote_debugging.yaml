name: Java Running with Remote Debugging
id: 8f88e3f6-2a49-48f5-a5c4-2f7eedf78710
version: 1
schema_version: "1.0"
date: "2023-02-01"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 8f88e3f6-2a49-48f5-a5c4-2f7eedf78710
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a JAVA process running with remote debugging allowing more than just
  localhost to connect. MITRE ATT&CK: T1203.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*transport=dt_socket,address=*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*jre1.*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*jdk1.*"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_commandLine"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*address=127.0.0.1*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*address=localhost*"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*transport=dt_socket,address=*'; data_win_eventdata_commandLine matches
  '*jre1.*'; data_win_eventdata_commandLine matches '*jdk1.*', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://dzone.com/articles/remote-debugging-java-applications-with-jdwp
  - https://attack.mitre.org/techniques/T1203/

response:
  message: >
    Java Running with Remote Debugging detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1203
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1203
  custom_tags:
    - running
    - debugging
    - process_creation
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Tt][Rr][Aa][Nn][Ss][Pp][Oo][Rr][Tt]=[Dd][Tt]_[Ss][Oo][Cc][Kk][Ee][Tt],[Aa][Dd][Dd][Rr][Ee][Ss][Ss]=.*/ AND (data_win_eventdata_commandLine:/.*[Jj][Rr][Ee]1\..*/ OR data_win_eventdata_commandLine:/.*[Jj][Dd][Kk]1\..*/) AND _exists_:data_win_eventdata_commandLine AND NOT (data_win_eventdata_commandLine:/.*[Aa][Dd][Dd][Rr][Ee][Ss][Ss]=127\.0\.0\.1.*/ OR data_win_eventdata_commandLine:/.*[Aa][Dd][Dd][Rr][Ee][Ss][Ss]=[Ll][Oo][Cc][Aa][Ll][Hh][Oo][Ss][Tt].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: dff1e1cc-d3fd-47c8-bfc2-aeb878a754c0
    name: Shell Process Spawned by Java.EXE
    reason: An exposed JDWP port allows code execution in the JVM; shells spawned by java.exe show the exploitation outcome
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Shells and tools spawned by java
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\([Jj][Aa][Vv][Aa]|[Jj][Aa][Vv][Aa][Ww])\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Cc][Mm][Dd]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]|[Ww][Hh][Oo][Aa][Mm][Ii]|[Nn][Ee][Tt]|[Cc][Uu][Rr][Ll])\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 4h
  - name: java network traffic on common debug ports
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Jj][Aa][Vv][Aa]|[Jj][Aa][Vv][Aa][Ww])\.[Ee][Xx][Ee]/ AND (data_win_eventdata_destinationPort:(5005 OR 8000 OR 8787 OR 9999 OR 5000) OR data_win_eventdata_sourcePort:(5005 OR 8000 OR 8787 OR 9999 OR 5000))
    pivot_on: host
    window: 4h
  - name: Other processes with JDWP agent options
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Jj][Dd][Ww][Pp].*/ OR data_win_eventdata_commandLine:/.*[Aa][Gg][Ee][Nn][Tt][Ll][Ii][Bb]:[Jj][Dd][Ww][Pp].*/ OR data_win_eventdata_commandLine:/.*[Xx][Rr][Uu][Nn][Jj][Dd][Ww][Pp].*/ OR data_win_eventdata_commandLine:/.*[Xx][Dd][Ee][Bb][Uu][Gg].*/)
    pivot_on: host
    window: 24h
  - name: Files written by java in temp or startup paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*\\([Jj][Aa][Vv][Aa]|[Jj][Aa][Vv][Aa][Ww])\.[Ee][Xx][Ee]/ AND (data_win_eventdata_targetFilename:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Ss][Tt][Aa][Rr][Tt][Uu][Pp]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Tt][Aa][Ss][Kk][Ss]\\.*/)
    pivot_on: host
    window: 4h
