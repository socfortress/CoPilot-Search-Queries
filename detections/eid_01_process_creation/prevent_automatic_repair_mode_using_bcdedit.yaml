name: Windows BCDEdit Prevent Automatic Repair Mode
id: windows-bcdedit-prevent-automatic-repair-001
version: 1
schema_version: "1.0"
date: "2026-02-16"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects the use of bcdedit.exe to set boot status policy to ignore all failures, 
  preventing Windows from entering automatic repair mode. This technique is commonly 
  used by ransomware (Chaos, Ryuk, Conti) to inhibit system recovery and complicate 
  remediation efforts after encryption.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - wildcard:
            data_win_eventdata_commandLine: "*bootstatuspolicy*"
        - wildcard:
            data_win_eventdata_commandLine: "*ignoreallfailures*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-16 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-16 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Windows endpoints with Sysmon 
  installed and configured to log process creation events (EventID 1) with full 
  command-line arguments.

known_false_positives: >
  Administrators may modify boot configuration during testing and debugging. 
  Filter based on user context and verify if change was authorized.

references:
  - https://attack.mitre.org/techniques/T1490/
  - https://jsac.jpcert.or.jp/archive/2020/pdf/JSAC2020_1_tamada-yamazaki-nakatsuru_en.pdf

response:
  message: >
    BCDEdit used to disable automatic repair on $agent_name$. 
    Command: $data_win_eventdata_commandLine$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1490
  risk_score: 50
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects: []

tags:
  analytic_story:
    - Ransomware
    - Chaos Ransomware
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1490
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*bootstatuspolicy.*/ AND data_win_eventdata_commandLine:/.*ignoreallfailures.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c9fbe8e9-119d-40a6-9b59-dd58a5d84429
    name: Potential Ransomware or Unauthorized MBR Tampering Via Bcdedit.EXE
    reason: The same ransomware script usually also sets recoveryenabled No via bcdedit.
  - id: 1444443e-6757-43e4-9ea4-c8fc705f79a2
    name: Boot Configuration Tampering Via Bcdedit.EXE
    reason: Sibling bcdedit boot configuration tampering in the same pre-encryption step.
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: Shadow copy deletion is the paired recovery inhibition before encryption.
  - id: 639c9081-f482-47d3-a0bd-ddee3d4ecd76
    name: All Backups Deleted Via Wbadmin.EXE
    reason: Backup catalog deletion is paired with disabling boot repair.
  - id: 21ff4ca9-f13a-41ad-b828-0077b2af2e40
    name: Deletion of Volume Shadow Copies via WMI with PowerShell
    reason: Alternative shadow deletion method in the same ransomware chain.
  - id: 689308fc-cfba-4f72-9897-796c1dc61487
    name: Potential Conti Ransomware Activity
    reason: Named family behaviours that follow recovery inhibition.
  - id: c37510b8-2107-4b78-aa32-72f251e7a844
    name: Potential Ryuk Ransomware Activity
    reason: Ryuk is a cited family using this exact bcdedit technique.
  - id: 236e7c8e-c9d9-11eb-a824-acde48001122
    name: Disable Logs Using WevtUtil
    reason: Log disabling accompanies ransomware pre-impact cleanup.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Recovery inhibition commands
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*[Vv]ssadmin.*[Dd]elete.*/ OR data_win_eventdata_commandLine:/.*[Ww]badmin.*[Dd]elete.*/ OR data_win_eventdata_commandLine:/.*[Rr]ecoveryenabled.*/ OR data_win_eventdata_commandLine:/.*[Ss]hadow.*[Dd]elete.*/)
    pivot_on: host
    window: 2h
  - name: Event log clearing
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*[Ww]evtutil.*( cl |clear-log).*/ OR data_win_eventdata_commandLine:/.*[Cc]lear-[Ee]vent[Ll]og.*/)
    pivot_on: host
    window: 2h
  - name: Service stops and forced kills
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*(net|sc)(\.exe)? +stop.*/ OR data_win_eventdata_commandLine:/.*[Tt]askkill.* /f.*/)
    pivot_on: host
    window: 2h
  - name: Ransom notes created
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*([Rr]ead[Mm]e|[Dd]ecrypt|[Rr]ansom|[Hh]ow.[Tt]o).*\.(txt|html|hta)/
    pivot_on: host
    window: 2h
  - name: All bcdedit invocations
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*[Bb]cdedit.*/
    pivot_on: host
    window: 2h
