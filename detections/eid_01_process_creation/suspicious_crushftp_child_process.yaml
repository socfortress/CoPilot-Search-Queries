name: Suspicious CrushFTP Child Process
id: 459628e3-1b00-4e9b-9e5b-7da8961aea35
version: 1
schema_version: "1.0"
date: "2025-04-10"
author: Craig Sweeney, Matt Anderson, Jose Oregon, Tim Kasper, Faith Stratton, Samantha Shaw, Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 459628e3-1b00-4e9b-9e5b-7da8961aea35
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious child processes spawned by the CrushFTP service that may
  indicate exploitation of remote code execution vulnerabilities such as
  CVE-2025-31161, where attackers can achieve RCE through crafted HTTP requests.
  The detection focuses on commonly abused Windows executables (like
  powershell.exe, cmd.exe etc.) that attackers typically use post-exploitation
  to execute malicious commands. MITRE ATT&CK: T1059.001, T1059.003, T1190.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_parentImage:
              value: "*\\\\crushftpservice.exe"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\bash.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\cmd.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\cscript.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\mshta.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\powershell.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\powershell_ise.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\pwsh.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\sh.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\wscript.exe"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\crushftpservice.exe'; data_win_eventdata_image matches '*\bash.exe';
  data_win_eventdata_image matches '*\cmd.exe', among other conditions.

known_false_positives: >
  Legitimate CrushFTP administrative actions. Software updates. Baseline
  expected activity in your environment and tune this detection before relying
  on it for automated response.

references:
  - https://nvd.nist.gov/vuln/detail/CVE-2025-2825
  - https://www.crushftp.com/crush11wiki/Wiki.jsp?page=Update
  - https://outpost24.com/blog/crushftp-auth-bypass-vulnerability/
  - https://attackerkb.com/topics/k0EgiL9Psz/cve-2025-2825/rapid7-analysis
  - https://projectdiscovery.io/blog/crushftp-authentication-bypass
  - https://attack.mitre.org/techniques/T1059/001/
  - https://attack.mitre.org/techniques/T1059/003/
  - https://attack.mitre.org/techniques/T1190/

response:
  message: >
    Suspicious CrushFTP Child Process detected on host $agent_name$. Matched
    data_win_eventdata_parentImage: $data_win_eventdata_parentImage$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1059.001, T1059.003, T1190
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
    - T1059.003
    - T1190
  custom_tags:
    - crushftp
    - child
    - process_creation
    - sysmon
    - initial_access
    - execution
    - cve_2025_31161
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Cc][Rr][Uu][Ss][Hh][Ff][Tt][Pp][Ss][Ee][Rr][Vv][Ii][Cc][Ee]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_image:/.*\\[Bb][Aa][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]_[Ii][Ss][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 0fdc7c7f-c690-4217-9ae3-31f5156eed72
    name: Potential Exploitation of CrushFTP RCE Vulnerability (CVE-2025-54309)
    reason: Same product, other CrushFTP RCE CVE; a second CrushFTP exploitation signal on the host confirms the server was targeted, not a benign admin script.
  - id: 8202070f-edeb-4d31-a010-a26c72ac5600
    name: Suspicious Process By Web Server Process
    reason: Generic web-service-spawns-shell pattern; corroborates the service parent being used as an RCE foothold.
  - id: e32d4572-9826-4738-b651-95fa63747e8a
    name: Base64 Encoded PowerShell Command Detected
    reason: Post-exploitation shells spawned by CrushFTP typically run encoded PowerShell payloads next.
  - id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
    name: PowerShell Download and Execution Cradles
    reason: Attacker pulls second-stage tooling via PowerShell from the RCE shell.
  - id: c248c896-e412-4279-8c15-1c558067b6fa
    name: Enumerate All Information With Whoami.EXE
    reason: First hands-on-keyboard step after a web-service RCE is identifying the service account and privileges.
  - id: cd219ff3-fa99-45d4-8380-a7d15116c6dc
    name: New User Created Via Net.EXE
    reason: Common persistence follow-on from a shell obtained via the file-transfer service.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: All children of CrushFTP service
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Cc]rushftp.*/
    pivot_on: host
    window: 4h
  - name: Recon commands run on host
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*\\(whoami|ipconfig|systeminfo|net1?|nltest|tasklist|quser|arp|netstat)\.exe/
    pivot_on: host
    window: 4h
  - name: PowerShell encoded or download activity
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*\\(powershell|pwsh)\.exe/ AND (data_win_eventdata_commandLine:/.*[Ee]nc.*/ OR data_win_eventdata_commandLine:/.*[Dd]ownload(String|File).*/ OR data_win_eventdata_commandLine:/.*[Ii]nvoke-[Ww]eb[Rr]equest.*/ OR data_win_eventdata_commandLine:/.*[Ii][Ee][Xx].*/)
    pivot_on: host
    window: 4h
  - name: Outbound connections by shells and download tools
    query: data_win_system_eventID:3 AND data_win_eventdata_initiated:true AND data_win_eventdata_image:/.*\\(cmd|powershell|curl|bitsadmin|certutil)\.exe/
    pivot_on: host
    window: 2h
  - name: Files dropped in staging paths
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\\(Temp|ProgramData|Users\\Public)\\.*\.(exe|dll|ps1|bat|vbs|jsp)/
    pivot_on: host
    window: 4h
