name: Equation Group DLL_U Export Function Load
id: d465d1d8-27a2-4cca-9621-a800f37cf72e
version: 1
schema_version: "1.0"
date: "2023-03-09"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: d465d1d8-27a2-4cca-9621-a800f37cf72e
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: production
type: TTP

description: >
  Detects a specific export function name used by one of EquationGroup tools.
  MITRE ATT&CK: T1218.011.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-export dll_u*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*,dll_u"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* dll_u"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*-export dll_u*'; data_win_eventdata_commandLine matches '*,dll_u';
  data_win_eventdata_commandLine matches '* dll_u'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/00derp/EquationGroupLeak/search?utf8=%E2%9C%93&q=dll_u&type=
  - https://twitter.com/cyb3rops/status/972186477512839170
  - https://attack.mitre.org/techniques/T1218/011/

response:
  message: >
    Equation Group DLL_U Export Function Load detected on host $agent_name$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1218.011
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218.011
  custom_tags:
    - equation
    - group
    - export
    - process_creation
    - sysmon
    - stealth
    - g0020
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*-[Ee][Xx][Pp][Oo][Rr][Tt] [Dd][Ll][Ll]_[Uu].*/ OR data_win_eventdata_commandLine:/.*,[Dd][Ll][Ll]_[Uu]/ OR data_win_eventdata_commandLine:/.* [Dd][Ll][Ll]_[Uu]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c3a99af4-35a9-4668-879e-c09aeb4f2bdf
    name: Rundll32 Execution With Uncommon DLL Extension
    reason: Rundll32 loading a DLL with an uncommon extension is the typical delivery form of implant DLLs like dll_u.
  - id: 5cdb711b-5740-4fb2-ba88-f7945027afac
    name: Rundll32 UNC Path Execution
    reason: Rundll32 running a DLL from a UNC path shows staged implant loading from a remote share.
  - id: f40017b3-cb2e-4335-ab5d-3babf679c1de
    name: Remote DLL Load Via Rundll32.EXE
    reason: Image-load of a remote DLL by rundll32 confirms the implant DLL actually loaded from a share.
  - id: 43fa5350-db63-4b8f-9a01-789a427074e1
    name: Potential Obfuscated Ordinal Call Via Rundll32
    reason: Ordinal-based rundll32 calls are an alternate evasion form of invoking an implant export.
  - id: 4aa6040b-3f28-44e3-a769-9208e5feb5ec
    name: Suspicious Rundll32 Execution With Image Extension
    reason: Rundll32 invoking a DLL disguised with an image extension is another implant evasion form.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Rundll32 loading DLLs from user-writable or remote paths
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\rundll32\.exe/ AND data_win_eventdata_commandLine:(/.*(\\\\|[Tt]emp|[Aa]pp[Dd]ata|[Pp]rogram[Dd]ata|[Pp]ublic|[Dd]ownloads).*,.*/)
    pivot_on: host
    window: 6h
  - name: Rundll32 with a non-DLL target
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\rundll32\.exe/ AND NOT data_win_eventdata_commandLine:(/.*\.dll.*/ OR /.*shell32.*/ OR /.*[Pp]rint[Uu]i.*/)
    pivot_on: host
    window: 6h
  - name: Unsigned DLL images loaded into rundll32
    query: data_win_system_eventID:"7" AND data_win_eventdata_image:/.*\\rundll32\.exe/ AND data_win_eventdata_signed:"false"
    pivot_on: host
    window: 6h
  - name: Remote execution and lateral movement tooling
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:(/.*[Pp]s[Ee]xec.*/ OR /.*[Ww]mic.*process +call +create.*/ OR /.*[Ss]c +\\\\.*[Cc]reate.*/ OR /.*[Ss]chtasks.* \/[Ss] .*/)
    pivot_on: host
    window: 4h
  - name: Outbound connections by rundll32
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\rundll32\.exe/
    pivot_on: host
    window: 6h
