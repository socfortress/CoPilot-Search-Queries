name: Forfiles Command Execution
id: 9aa5106d-bce3-4b13-86df-3a20f1d5cf0b
version: 1
schema_version: "1.0"
date: "2024-03-05"
author: Tim Rauch, Elastic, E.M. Anhaus (originally from Atomic Blue Detections, Endgame), oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 9aa5106d-bce3-4b13-86df-3a20f1d5cf0b
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of "forfiles" with the "/c" flag. While this is an
  expected behavior of the tool, it can be abused in order to proxy execution
  through it with any binary. Can be used to bypass application whitelisting.
  MITRE ATT&CK: T1059.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\forfiles.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "forfiles.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -c *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /c *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* –c *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* —c *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* ―c *"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\forfiles.exe'; data_win_eventdata_originalFileName equals 'forfiles.exe';
  data_win_eventdata_commandLine matches '* -c *', among other conditions.

known_false_positives: >
  Legitimate use via a batch script or by an administrator. Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://lolbas-project.github.io/lolbas/Binaries/Forfiles/
  - https://pentestlab.blog/2020/07/06/indirect-command-execution/
  - https://attack.mitre.org/techniques/T1059/

response:
  message: >
    Forfiles Command Execution detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1059
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059
  custom_tags:
    - forfiles
    - process_creation
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ff][Oo][Rr][Ff][Ii][Ll][Ee][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ff][Oo][Rr][Ff][Ii][Ll][Ee][Ss]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.* -[Cc] .*/ OR data_win_eventdata_commandLine:/.* \/[Cc] .*/ OR data_win_eventdata_commandLine:/.* –[Cc] .*/ OR data_win_eventdata_commandLine:/.* —[Cc] .*/ OR data_win_eventdata_commandLine:/.* ―[Cc] .*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: f53714ec-5077-420e-ad20-907ff9bb2958
    name: Forfiles.EXE Child Process Masquerading
    reason: Same tool abused from a non-default path to launch a planted cmd.exe; confirms masquerading rather than simple /c proxying.
  - id: 0955e4e1-c281-4fb9-9ee1-5ee7b4b754d2
    name: Use of Pcalua For Execution
    reason: Pcalua is the sibling indirect-execution LOLBin; operators try several proxy binaries to evade application whitelisting.
  - id: e593cf51-88db-4ee1-b920-37e89012a3c9
    name: Potentially Suspicious Rundll32 Activity
    reason: Forfiles /c is often used to launch rundll32 payloads; suspicious rundll32 activity is the likely proxied payload.
  - id: cea72823-df4d-4567-950c-0b579eaf0846
    name: Potential Dropper Script Execution Via WScript/CScript/MSHTA
    reason: Script-host dropper execution is a common initial stage that then uses forfiles to proxy follow-on commands.
  - id: b6676963-0353-4f88-90f5-36c20d443c6a
    name: Cscript/Wscript Potentially Suspicious Child Process
    reason: Wscript/Cscript spawning shells or LOLBins is a typical precursor to forfiles proxy execution.
  - id: de587dce-915e-4218-aac4-835ca6af6f70
    name: Potential Persistence Attempt Via Run Keys Using Reg.EXE
    reason: Proxy-launched commands frequently establish Run-key persistence right after.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Children spawned by forfiles
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ff][Oo][Rr][Ff][Ii][Ll][Ee][Ss]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 1h
  - name: Other LOLBin proxy execution
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Pp][Cc][Aa][Ll][Uu][Aa].[Ee][Xx][Ee]|[Mm][Ss][Hh][Tt][Aa].[Ee][Xx][Ee]|[Rr][Uu][Nn][Dd][Ll][Ll]32.[Ee][Xx][Ee]|[Rr][Ee][Gg][Ss][Vv][Rr]32.[Ee][Xx][Ee]|[Ww][Mm][Ii][Cc].[Ee][Xx][Ee]|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn].[Ee][Xx][Ee]|[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll].[Ee][Xx][Ee]|[Mm][Ss][Bb][Uu][Ii][Ll][Dd].[Ee][Xx][Ee]|[Cc][Mm][Ss][Tt][Pp].[Ee][Xx][Ee]|[Ss][Cc][Rr][Ii][Pp][Tt][Rr][Uu][Nn][Nn][Ee][Rr].[Ee][Xx][Ee])/
    pivot_on: host
    window: 2h
  - name: Download or staging via LOLBin or shell command line
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp]:.*/ OR data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp][Ss]:.*/ OR data_win_eventdata_commandLine:/.*-[Uu][Rr][Ll][Cc][Aa][Cc][Hh][Ee].*/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn] \/[Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr].*/)
    pivot_on: host
    window: 2h
  - name: Persistence commands
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss] \/[Cc][Rr][Ee][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Gg] [Aa][Dd][Dd].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc] [Cc][Rr][Ee][Aa][Tt][Ee].*/)
    pivot_on: host
    window: 4h
  - name: Outbound connections from shells and script hosts
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Cc][Mm][Dd].[Ee][Xx][Ee]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].[Ee][Xx][Ee]|[Pp][Ww][Ss][Hh].[Ee][Xx][Ee]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt].[Ee][Xx][Ee]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt].[Ee][Xx][Ee]|[Mm][Ss][Hh][Tt][Aa].[Ee][Xx][Ee])/
    pivot_on: host
    window: 2h
