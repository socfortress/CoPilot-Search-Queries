name: Domain Controller Discovery with Nltest
id: 41243735-89a7-4c83-bcdd-570aa78f00a1
version: 1
schema_version: "1.0"
date: "2026-04-21"
author: SOCFortress LLC
status: production
type: TTP

description: >
  This analytic detects the execution of nltest.exe with the /dclist: or
  /dsgetdc: command-line arguments, which are used to enumerate domain
  controllers in an Active Directory forest. Sysmon EventID 1 is used to
  match process creation events where either the image is nltest.exe or
  the PE OriginalFileName is nltestrk.exe (the internal PE name of the
  binary regardless of rename), combined with the /dclist: or /dsgetdc:
  flags. This activity is significant because both Red Teams and real
  adversaries routinely use nltest.exe during the discovery and
  situational-awareness phases of an intrusion to identify domain
  controllers prior to credential theft, Kerberos attacks, or lateral
  movement. This technique has been observed in use by multiple ransomware
  operations (Medusa, BlackSuit, Rhysida), documented CISA-tracked
  campaigns (AA23-347A), and in NetSupport RMM tool abuse. If confirmed
  malicious, this behavior could allow attackers to map the domain
  topology, identify primary DCs for targeted attacks, and plan further
  compromise including DCSync, Zerologon exploitation, or Golden Ticket
  attacks.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*nltest.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName: "nltestrk.exe"
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*/dclist:*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*/dsgetdc:*"
                    case_insensitive: true
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_parentCommandLine
    - data_win_eventdata_user
    - data_win_eventdata_processId
    - data_win_eventdata_processGuid
    - data_win_eventdata_parentProcessId
    - data_win_eventdata_parentProcessGuid
    - data_win_eventdata_hashes
    - data_win_eventdata_integrityLevel
    - data_win_eventdata_currentDirectory

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-21 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-21 23:59:59.999"

how_to_implement: >
  This detection requires Sysmon EventID 1 (Process Creation) logs to be forwarded
  from Windows endpoints to Wazuh Indexer. Ensure Sysmon is deployed with a
  configuration that captures Image, OriginalFileName, and CommandLine fields
  (SwiftOnSecurity or Olaf Hartong Sysmon modular config recommended). The
  detection matches nltest.exe either by Image path (case-insensitive) or by
  PE OriginalFileName being "nltestrk.exe" (the internal name assigned by
  Microsoft at build time, present regardless of whether the file is
  renamed). The command-line conditions match either /dclist: or /dsgetdc:
  flags. Case-insensitive matching is used throughout. The ES DSL uses the
  case_insensitive wildcard option (OpenSearch 2.x / Elasticsearch 7.10+);
  Graylog equivalent uses character classes.

known_false_positives: >
  System administrators, helpdesk staff, or domain admins may legitimately
  use nltest.exe for domain controller troubleshooting, replication
  diagnostics, or AD health checks. Review parent process lineage
  (admin session vs. unexpected non-interactive parent), user context
  (admin account vs. standard user vs. compromised account), and timing
  (scheduled maintenance window vs. unexpected off-hours) to distinguish
  authorized administrative activity from reconnaissance. Concurrent use
  of multiple AD discovery tools (dsquery, net group, nltest, dsget,
  Get-ADComputer) on a single host should be treated as high-priority
  regardless of user context.

references:
  - https://attack.mitre.org/techniques/T1018/
  - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2012-r2-and-2012/cc731935(v=ws.11)
  - https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-347a

response:
  message: >
    Domain controller discovery via nltest.exe was identified on endpoint
    $agent_name$ by user $data_win_eventdata_user$. Process image:
    $data_win_eventdata_image$. Parent process:
    $data_win_eventdata_parentImage$. Command line:
    $data_win_eventdata_commandLine$. This is consistent with
    situational-awareness reconnaissance commonly preceding credential
    theft, lateral movement, or ransomware deployment; investigate parent
    process lineage and concurrent discovery activity.
  risk_score: 72
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 60
    - field: data_win_eventdata_user
      type: user
      score: 60
  threat_objects:
    - field: data_win_eventdata_image
      type: process_name
    - field: data_win_eventdata_parentImage
      type: parent_process_name
    - field: data_win_eventdata_commandLine
      type: command_line

tags:
  analytic_story:
    - Active Directory Discovery
    - CISA AA23-347A
    - Medusa Ransomware
    - BlackSuit Ransomware
    - Rhysida Ransomware
    - NetSupport RMM Tool Abuse
    - Active Directory Reconnaissance
  asset_type: Endpoint
  mitre_attack_id:
    - T1018
  custom_tags:
    - nltest
    - domain_controller_discovery
    - ad_enumeration
    - active_directory
    - reconnaissance
    - lolbin
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Nn][Ll][Tt][Ee][Ss][Tt]\.exe.*/ OR data_win_eventdata_originalFileName:"nltestrk.exe") AND (data_win_eventdata_commandLine:/.*\/[Dd][Cc][Ll][Ii][Ss][Tt]:.*/ OR data_win_eventdata_commandLine:/.*\/[Dd][Ss][Gg][Ee][Tt][Dd][Cc]:.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c3e05466-5f22-11eb-ae93-0242ac130002
    name: NLTest Domain Trust Discovery
    reason: nltest /domain_trusts is the usual next switch after /dclist; together they map domain topology.
  - id: 5cc90652-4cbd-4241-aa3b-4b462fa5a248
    name: Potential Recon Activity Via Nltest.EXE
    reason: Broader nltest recon switches from the same operator session.
  - id: 64c7adaa-48ee-483c-b0d6-7175bc65e6cc
    name: Domain Controller Discovery with Wmic
    reason: Redundant DC discovery with another LOLBin.
  - id: b1a8ce04-04c2-11ec-bea7-acde48001122
    name: Domain Account Discovery with Dsquery
    reason: Once DCs are located, accounts are enumerated against them.
  - id: 383572e0-04c5-11ec-bdcc-acde48001122
    name: Domain Account Discovery with Wmic
    reason: Another account enumeration step following DC discovery.
  - id: d95de845-b83c-4a9a-8a6a-4fc802ebf6c0
    name: Suspicious Group And Account Reconnaissance Activity Using Net.EXE
    reason: net group Domain Admins /domain commonly follows DC discovery.
  - id: 514e7e3e-b3b4-4a67-af60-be20f139198b
    name: PUA - AdFind.EXE Execution
    reason: AdFind is the staple tool run right after nltest in ransomware pre-deployment recon.
  - id: f376c8a7-a2d0-4ddc-aa0c-16c17236d962
    name: HackTool - Bloodhound/Sharphound Execution
    reason: Automated AD graphing follows manual DC discovery in many intrusions (CISA AA23-347A).
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Chained discovery commands (nltest, net, whoami, dsquery, adfind)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*(\\[Nn][Ll][Tt][Ee][Ss][Tt].[Ee][Xx][Ee]|\\[Nn][Ee][Tt].[Ee][Xx][Ee]|\\[Nn][Ee][Tt]1.[Ee][Xx][Ee]|\\[Ww][Hh][Oo][Aa][Mm][Ii].[Ee][Xx][Ee]|\\[Dd][Ss][Qq][Uu][Ee][Rr][Yy].[Ee][Xx][Ee]|\\[Aa][Dd][Ff][Ii][Nn][Dd].[Ee][Xx][Ee]|\\[Ss][Ee][Tt][Ss][Pp][Nn].[Ee][Xx][Ee]|\\[Ii][Pp][Cc][Oo][Nn][Ff][Ii][Gg].[Ee][Xx][Ee])/)
    pivot_on: host
    window: 2h
  - name: Domain admin and privileged group queries
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Dd][Oo][Mm][Aa][Ii][Nn] [Aa][Dd][Mm][Ii][Nn][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ee][Nn][Tt][Ee][Rr][Pp][Rr][Ii][Ss][Ee] [Aa][Dd][Mm][Ii][Nn][Ss].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt] [Gg][Rr][Oo][Uu][Pp].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt]1 [Gg][Rr][Oo][Uu][Pp].*/)
    pivot_on: user
    window: 4h
  - name: Shells or LOLBins connecting to LDAP, Kerberos, SMB or RPC
    query: data_win_system_eventID:"3" AND data_win_eventdata_destinationPort:("389" OR "636" OR "445" OR "135" OR "88") AND data_win_eventdata_image:/.*(\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].[Ee][Xx][Ee]|[Cc][Mm][Dd].[Ee][Xx][Ee]|[Ww][Mm][Ii][Cc].[Ee][Xx][Ee]|[Rr][Uu][Nn][Dd][Ll][Ll]32.[Ee][Xx][Ee])/
    pivot_on: host
    window: 4h
  - name: Remote execution or admin share use toward other servers
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*(\\[Pp][Ss][Ee][Xx][Ee][Cc].[Ee][Xx][Ee]|\\[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc].[Ee][Xx][Ee])/ OR (data_win_eventdata_commandLine:/.*[Pp][Rr][Oo][Cc][Ee][Ss][Ss] [Cc][Aa][Ll][Ll] [Cc][Rr][Ee][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Aa][Dd][Mm][Ii][Nn][$].*/ OR data_win_eventdata_commandLine:/.*[Ee][Nn][Tt][Ee][Rr]-[Pp][Ss][Ss][Ee][Ss][Ss][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Cc][Oo][Mm][Mm][Aa][Nn][Dd].*/))
    pivot_on: user
    window: 4h
  - name: Script, Office or LOLBin parents of nltest
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Nn][Ll][Tt][Ee][Ss][Tt].*/) AND data_win_eventdata_parentImage:/.*(\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].[Ee][Xx][Ee]|\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt].[Ee][Xx][Ee]|\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt].[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa].[Ee][Xx][Ee]|\\[Ww][Ii][Nn][Ww][Oo][Rr][Dd].[Ee][Xx][Ee]|\\[Ee][Xx][Cc][Ee][Ll].[Ee][Xx][Ee]|\\[Rr][Uu][Nn][Dd][Ll][Ll]32.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Rr]32.[Ee][Xx][Ee])/
    pivot_on: host
    window: 4h
