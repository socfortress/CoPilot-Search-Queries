name: HackTool - Htran/NATBypass Execution
id: f5e3b62f-e577-4e59-931e-0a15b2b94e1e
version: 1
schema_version: "1.0"
date: "2023-02-04"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: f5e3b62f-e577-4e59-931e-0a15b2b94e1e
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects executable names or flags used by Htran or Htran-like tools (e.g.
  NATBypass). MITRE ATT&CK: T1090.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\htran.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\lcx.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.exe -tran *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.exe -slave *"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\htran.exe'; data_win_eventdata_image matches '*\lcx.exe';
  data_win_eventdata_commandLine matches '*.exe -tran *', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/HiwinCN/HTran
  - https://github.com/cw1997/NATBypass
  - https://attack.mitre.org/techniques/T1090/

response:
  message: >
    HackTool - Htran/NATBypass Execution detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1090
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1090
  custom_tags:
    - hacktool
    - htran
    - natbypass
    - process_creation
    - sysmon
    - command_and_control
    - s0040
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Hh][Tt][Rr][Aa][Nn]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ll][Cc][Xx]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*\.[Ee][Xx][Ee] -[Tt][Rr][Aa][Nn] .*/ OR data_win_eventdata_commandLine:/.*\.[Ee][Xx][Ee] -[Ss][Ll][Aa][Vv][Ee] .*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 322ed9ec-fcab-4f67-9a34-e7c6aef43614
    name: New Port Forwarding Rule Added Via Netsh.EXE
    reason: Netsh portproxy is the built-in analogue of Htran relaying; both establish a pivot on the host
  - id: cd5cfd80-aa5f-44c0-9c20-108c4ae12e3c
    name: New Firewall Rule Added Via Netsh.EXE
    reason: A new firewall rule is typically added so the relay listen port accepts inbound connections
  - id: 57c4bf16-227f-4394-8ec7-1b745ee061c3
    name: Firewall Disabled via Netsh.EXE
    reason: Firewall disabled via netsh commonly precedes standing up a relay
  - id: cf93e05e-d798-4d9e-b522-b0248dc61eaf
    name: HackTool - SharpChisel Execution
    reason: Chisel is a sibling tunneling tool; attackers often drop several relays
  - id: 98a96a5a-64a0-4c42-92c5-489da3866cb0
    name: DNS Exfiltration and Tunneling Tools Execution
    reason: Other tunneling tool execution on the same host indicates a broader tunnel setup
  - id: 1d08ac94-400d-4469-a82f-daee9a908849
    name: Communication To Ngrok Tunneling Service Initiated
    reason: Ngrok connection is an alternate tunnel from the same host
  - id: b1e5da3b-ca8e-4adf-915c-9921f3d85481
    name: RDP to HTTP or HTTPS Target Ports
    reason: RDP to web ports is typical traffic carried through such a relay
  - id: 10c14723-61c7-4c75-92ca-9af245723ad2
    name: HackTool - Potential Impacket Lateral Movement Activity
    reason: Relayed access is then used for Impacket lateral movement from the pivot
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Port forwarding and firewall opening for relay
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Nn][Ee][Tt][Ss][Hh].*(([Pp][Oo][Rr][Tt][Pp][Rr][Oo][Xx][Yy])|([Aa][Dd][Vv][Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll]).*([Aa][Dd][Dd])).*/
    pivot_on: host
    window: 4h
  - name: Other tunneling and proxy tools
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Cc][Hh][Ii][Ss][Ee][Ll]|[Ff][Rr][Pp][Cc]|[Ff][Rr][Pp][Ss]|[Nn][Gg][Rr][Oo][Kk]|[Pp][Ll][Ii][Nn][Kk]|[Ss][Tt][Uu][Nn][Nn][Ee][Ll]|[Nn][Pp][Cc]|[Ss][Oo][Cc][Aa][Tt]|[Pp][Rr][Oo][Xx][Yy][Cc][Hh][Aa][Ii][Nn][Ss])[^\\]*\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 4h
  - name: Listening process in user-writable path
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:"false" AND data_win_eventdata_image:/.*(\\([Tt][Ee][Mm][Pp]|[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]|[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss])\\).*/
    pivot_on: host
    window: 4h
  - name: Relay tool dropped to disk
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\([Hh][Tt][Rr][Aa][Nn]|[Ll][Cc][Xx]|[Nn][Aa][Tt][Bb][Yy][Pp][Aa][Ss][Ss])[^\\]*\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 4h
  - name: Lateral movement through the pivot
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*(\\\\[^ ]+\\[Aa][Dd][Mm][Ii][Nn]\$|([Pp][Ss][Ee][Xx][Ee][Cc])|[Ww][Mm][Ii][Cc].*/[Nn][Oo][Dd][Ee]:).*/
    pivot_on: host
    window: 4h
