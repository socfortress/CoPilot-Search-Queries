name: Suspicious Processes Spawned by WinRM
id: 5cc2cda8-f261-4d88-a2de-e9e193c86716
version: 1
schema_version: "1.0"
date: "2022-07-14"
author: Andreas Hunkeler (@Karneades), Markus Neis
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 5cc2cda8-f261-4d88-a2de-e9e193c86716
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious processes including shells spawnd from WinRM host process.
  MITRE ATT&CK: T1190.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_parentImage:
              value: "*\\\\wsmprovhost.exe"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\cmd.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\sh.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\bash.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\powershell.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\pwsh.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\wsl.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\schtasks.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\certutil.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\whoami.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\bitsadmin.exe"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\wsmprovhost.exe'; data_win_eventdata_image matches '*\cmd.exe';
  data_win_eventdata_image matches '*\sh.exe', among other conditions.

known_false_positives: >
  Legitimate WinRM usage. Baseline expected activity in your environment and
  tune this detection before relying on it for automated response.

references:
  - Internal Research
  - https://attack.mitre.org/techniques/T1190/

response:
  message: >
    Suspicious Processes Spawned by WinRM detected on host $agent_name$. Matched
    data_win_eventdata_parentImage: $data_win_eventdata_parentImage$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1190
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1190
  custom_tags:
    - spawned
    - winrm
    - process_creation
    - sysmon
    - initial_access
    - persistence
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ww][Ss][Mm][Pp][Rr][Oo][Vv][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Bb][Aa][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ss][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Hh][Oo][Aa][Mm][Ii]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 734f8d9b-42b8-41b2-bcf5-abaf49d5a3c8
    name: Remote PowerShell Session Host Process (WinRM)
    reason: Same wsmprovhost.exe session host seen from the other side; confirms an inbound remote PS session.
  - id: a197e378-d31b-41c0-9635-cfdf1c1bb423
    name: HackTool - WinRM Access Via Evil-WinRM
    reason: Evil-WinRM is the common offensive client producing wsmprovhost children.
  - id: cb909b3e-512b-11ec-aa31-3e22fbd008af
    name: Possible Lateral Movement PowerShell Spawn
    reason: Remote PowerShell spawn is a core lateral-movement pattern; same technique family.
  - id: 10c14723-61c7-4c75-92ca-9af245723ad2
    name: HackTool - Potential Impacket Lateral Movement Activity
    reason: Other remote execution channels the same actor may use on neighbouring hosts.
  - id: c248c896-e412-4279-8c15-1c558067b6fa
    name: Enumerate All Information With Whoami.EXE
    reason: whoami is the first command after landing in a WinRM shell.
  - id: e32d4572-9826-4738-b651-95fa63747e8a
    name: Base64 Encoded PowerShell Command Detected
    reason: Payload staging commonly pushed through the remote shell.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: All children of WinRM host process
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*\\wsmprovhost\.exe/
    pivot_on: host
    window: 4h
  - name: Recon commands in remote session
    query: data_win_system_eventID:1 AND data_win_eventdata_image:(/.*\\whoami\.exe/ OR /.*\\net1?\.exe/ OR /.*\\nltest\.exe/ OR /.*\\systeminfo\.exe/ OR /.*\\ipconfig\.exe/)
    pivot_on: host
    window: 4h
  - name: Inbound WinRM connections
    query: data_win_system_eventID:3 AND data_win_eventdata_destinationPort:(5985 OR 5986)
    pivot_on: host
    window: 4h
  - name: Persistence and tool staging after remote shell
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(schtasks.*\/[Cc]reate|certutil.*(urlcache|decode)|sc(\.exe)? +create|reg(\.exe)? +add.*[Rr]un).*/
    pivot_on: host
    window: 4h
  - name: Network logons preceding WinRM activity
    query: data_win_system_eventID:4624 AND data_win_eventdata_logonType:3
    pivot_on: user
    window: 4h
