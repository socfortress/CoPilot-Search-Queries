name: Nslookup PowerShell Download Cradle - ProcessCreation
id: 1b3b01c7-84e9-4072-86e5-fc285a41ff23
version: 1
schema_version: "1.0"
date: "2022-12-19"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 1b3b01c7-84e9-4072-86e5-fc285a41ff23
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious powershell download cradle using nslookup. This cradle uses
  nslookup to extract payloads from DNS records.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\nslookup.exe*"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "\\nslookup.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\powershell.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\pwsh.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -q=txt *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -querytype=txt *"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_parentImage
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\nslookup.exe*'; data_win_eventdata_originalFileName equals '\nslookup.exe';
  data_win_eventdata_parentImage matches '*\powershell.exe', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/Alh4zr3d/status/1566489367232651264

response:
  message: >
    Nslookup PowerShell Download Cradle - ProcessCreation detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  custom_tags:
    - nslookup
    - powershell
    - download
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Nn][Ss][Ll][Oo][Oo][Kk][Uu][Pp]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_originalFileName:/\\[Nn][Ss][Ll][Oo][Oo][Kk][Uu][Pp]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_parentImage:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.* -[Qq]=[Tt][Xx][Tt] .*/ OR data_win_eventdata_commandLine:/.* -[Qq][Uu][Ee][Rr][Yy][Tt][Yy][Pp][Ee]=[Tt][Xx][Tt] .*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 2452e632-9e0d-11eb-bacd-acde48001122
    name: DNS Exfiltration Using Nslookup App
    reason: Same nslookup-over-DNS abuse, in the exfil direction instead of payload retrieval
  - id: 98a96a5a-64a0-4c42-92c5-489da3866cb0
    name: DNS Exfiltration and Tunneling Tools Execution
    reason: DNS tunneling tooling used by the same actor for C2/data channel alongside the DNS payload fetch
  - id: 02b64f1b-3f33-4e67-aede-ef3b0a5a8fcf
    name: Potential COM Objects Download Cradles Usage - Process Creation
    reason: Alternative PowerShell download cradle; actors fall back between cradles
  - id: ee18ed37-0802-4268-9435-b3b91aaa18db
    name: PowerShell - Connect To Internet With Hidden Window
    reason: Parent PowerShell is typically launched hidden and connects out in the same stage
  - id: c4db14d9-7909-48b4-a054-aa14d89dbb19
    name: Malicious PowerShell Process - Encoded Command
    reason: The parent PowerShell is commonly an encoded-command launch that carries the cradle
  - id: 88f680b8-070e-402c-ae11-d2914f2257f1
    name: PowerShell Base64 Encoded IEX Cmdlet
    reason: The DNS TXT result is executed via IEX; encoded IEX is the execution stage
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: nslookup TXT queries from scripting parents
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Nn][Ss][Ll][Oo][Oo][Kk][Uu][Pp]\.exe/ AND data_win_eventdata_commandLine:/.*([Tt][Yy][Pp][Ee]|[Qq][Tt][Yy][Pp][Ee])[ =]+[Tt][Xx][Tt].*/
    pivot_on: host
    window: 2h
  - name: DNS queries from nslookup (Sysmon 22)
    query: data_win_system_eventID:22 AND data_win_eventdata_image:/.*[Nn][Ss][Ll][Oo][Oo][Kk][Uu][Pp]\.exe/
    pivot_on: host
    window: 1h
  - name: PowerShell execution of fetched content
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ii][Ee][Xx].*/ OR /.*[Ii]nvoke-[Ee]xpression.*/ OR /.*[Ff]rom[Bb]ase64[Ss]tring.*/ OR /.*-[Ee]nc.*/) AND data_win_eventdata_image:/.*([Pp]owershell|[Pp]wsh)\.exe/
    pivot_on: host
    window: 1h
  - name: Outbound connections from PowerShell after cradle
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*([Pp]owershell|[Pp]wsh)\.exe/ AND data_win_eventdata_initiated:true
    pivot_on: host
    window: 2h
  - name: Payload drops and persistence
    query: data_win_system_eventID:(11 OR 13) AND data_win_eventdata_targetFilename:(/.*\.(exe|dll|ps1|bat)/ OR /.*\\CurrentVersion\\Run.*/)
    pivot_on: host
    window: 2h
