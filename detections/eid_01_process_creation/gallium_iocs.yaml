status: experimental
type: TTP

description: >
  Detects artifacts associated with GALLIUM cyber espionage group as reported by
  Microsoft Threat Intelligence Center in the December 2019 report. MITRE
  ATT&CK: T1212, T1071.

data_source:
  - Sysmon EventID 1 - Process Creation

