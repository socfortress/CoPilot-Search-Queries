name: Suspicious Debugger Registration Cmdline
id: ae215552-081e-44c7-805f-be16f975c8a2
version: 1
schema_version: "1.0"
date: "2022-08-06"
author: Florian Roth (Nextron Systems), oscd.community, Jonhnathan Ribeiro
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: ae215552-081e-44c7-805f-be16f975c8a2
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the registration of a debugger for a program that is available in the
  logon screen (sticky key backdoor). MITRE ATT&CK: T1546.008.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*\\\\CurrentVersion\\\\Image File Execution Options\\\\*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*sethc.exe*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*utilman.exe*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*osk.exe*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*magnify.exe*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*narrator.exe*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*displayswitch.exe*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*atbroker.exe*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*HelpPane.exe*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*\CurrentVersion\Image File Execution Options\*';
  data_win_eventdata_commandLine matches '*sethc.exe*';
  data_win_eventdata_commandLine matches '*utilman.exe*', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://blogs.technet.microsoft.com/jonathantrull/2016/10/03/detecting-sticky-key-backdoors/
  - https://bazaar.abuse.ch/sample/6f3aa9362d72e806490a8abce245331030d1ab5ac77e400dd475748236a6cc81/
  - https://attack.mitre.org/techniques/T1546/008/

response:
  message: >
    Suspicious Debugger Registration Cmdline detected on host $agent_name$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1546.008
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1546.008
  custom_tags:
    - debugger
    - registration
    - cmdline
    - process_creation
    - sysmon
    - persistence
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Ii][Mm][Aa][Gg][Ee] [Ff][Ii][Ll][Ee] [Ee][Xx][Ee][Cc][Uu][Tt][Ii][Oo][Nn] [Oo][Pp][Tt][Ii][Oo][Nn][Ss]\\.*/ AND (data_win_eventdata_commandLine:/.*[Ss][Ee][Tt][Hh][Cc]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_commandLine:/.*[Uu][Tt][Ii][Ll][Mm][Aa][Nn]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_commandLine:/.*[Oo][Ss][Kk]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_commandLine:/.*[Mm][Aa][Gg][Nn][Ii][Ff][Yy]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_commandLine:/.*[Nn][Aa][Rr][Rr][Aa][Tt][Oo][Rr]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Pp][Ll][Aa][Yy][Ss][Ww][Ii][Tt][Cc][Hh]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_commandLine:/.*[Aa][Tt][Bb][Rr][Oo][Kk][Ee][Rr]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_commandLine:/.*[Hh][Ee][Ll][Pp][Pp][Aa][Nn][Ee]\.[Ee][Xx][Ee].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 1070db9a-3e5d-412e-8e7b-7183b616e1b3
    name: Persistence Via Sticky Key Backdoor
    reason: Same sticky-keys/IFEO persistence seen from another command-line angle, confirming the backdoor was installed.
  - id: 2fdefcb3-dbda-401e-ae23-f0db027628bc
    name: Sticky Key Like Backdoor Execution
    reason: 'Direct follow-on: attacker triggers sethc/utilman at the logon screen, spawning cmd as SYSTEM.'
  - id: cd219ff3-fa99-45d4-8380-a7d15116c6dc
    name: New User Created Via Net.EXE
    reason: Backdoor builders often add a local account to pair with the logon-screen shell.
  - id: 01aeb693-138d-49d2-9403-c4f52d7d3d62
    name: RDP Connection Allowed Via Netsh.EXE
    reason: Sticky-key backdoors are used over RDP; opening RDP is the precursor.
  - id: 6860a62c-9203-11eb-9e05-acde48001122
    name: Disabling Firewall with Netsh
    reason: Often paired with enabling RDP for logon-screen access.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Registry writes to IFEO Debugger
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*Image File Execution Options.*[Dd]ebugger.*/
    pivot_on: host
    window: 24h
  - name: Shell spawned from logon context
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*\\(winlogon|atbroker)\.exe/ AND data_win_eventdata_image:/.*\\(cmd|powershell|pwsh)\.exe/
    pivot_on: host
    window: 24h
  - name: Accessibility binary replaced on disk
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\\System32\\(sethc|utilman|osk|magnify|narrator|displayswitch)\.exe/
    pivot_on: host
    window: 24h
  - name: RDP enablement and account creation
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*fDenyTSConnections.*/ OR data_win_eventdata_commandLine:/.*net1? +(user|localgroup).*/)
    pivot_on: host
    window: 24h
  - name: Inbound RDP to host
    query: data_win_system_eventID:3 AND data_win_eventdata_destinationPort:3389 AND data_win_eventdata_initiated:false
    pivot_on: host
    window: 24h
