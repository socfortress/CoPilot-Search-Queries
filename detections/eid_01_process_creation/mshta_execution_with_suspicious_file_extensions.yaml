data_win_eventdata_commandLine:/.*[Vv][Bb][Ss][Cc][Rr][Ii][Pp][Tt].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b98d0db6-511d-45de-ad02-e82a98729620
    name: Remotely Hosted HTA File Executed Via Mshta.EXE
    reason: Disguised-extension payloads are often fetched remotely; same mshta invocation may carry a URL.
  - id: 9b3af1e6-5b68-11eb-ae93-0242ac130002
    name: Detect MSHTA Url in Command Line
    reason: Mshta pulling content from a URL is the delivery variant of the polyglot-file trick.
  - id: 03cc0c25-389f-4bf8-b48d-11878079f1ca
    name: Suspicious MSHTA Child Process
    reason: 'Next step: the HTA script spawns shells or proxy binaries.'
  - id: 4aa5d062-e893-11eb-9eb2-acde48001122
    name: Mshta spawning Rundll32 OR Regsvr32 Process
    reason: Common follow-on of mshta loading a DLL payload.
  - id: cea72823-df4d-4567-950c-0b579eaf0846
    name: Potential Dropper Script Execution Via WScript/CScript/MSHTA
    reason: Script dropper from user-writable path preceding mshta execution.
  - id: 67f113fa-e23d-4271-befa-30113b3e08b1
    name: Suspicious JavaScript Execution Via Mshta.EXE
    reason: Same binary used with inline script content to evade extension checks.
  - id: 8f45fcf0-5b68-11eb-ae93-0242ac130002
    name: Detect mshta renamed
    reason: Attackers who disguise payload extensions also rename the LOLBin.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Children spawned by mshta
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Mm][Ss][Hh][Tt][Aa]\.exe/
    pivot_on: host
    window: 2h
  - name: Script/DLL payload files written to user-writable paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.([Hh][Tt][Aa]|[Jj][Ss]|[Vv][Bb][Ss]|[Dd][Ll][Ll])/ AND data_win_eventdata_targetFilename:/.*([Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]|[Tt][Ee][Mm][Pp]|[Aa][Pp][Pp][Dd][Aa][Tt][Aa]).*/
    pivot_on: host
    window: 6h
  - name: Persistence via schtasks or Run key
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.exe/ OR data_win_eventdata_commandLine:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/)
    pivot_on: host
    window: 4h
  - name: DNS lookups by mshta
    query: data_win_system_eventID:"22" AND data_win_eventdata_image:/.*[Mm][Ss][Hh][Tt][Aa]\.exe/
    pivot_on: host
    window: 2h
