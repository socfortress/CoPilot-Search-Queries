description: >
  Detects execution of mshta.exe with file types that looks like they do not
  typically represent HTA (HTML Application) content, such as .png, .jpg, .zip,
  .pdf, and others, which are often polyglots. MSHTA is a legitimate Windows
  utility for executing HTML Applications containing VBScript or JScript. Threat
  actors often abuse this lolbin utility to download and execute malicious
  scripts disguised as benign files or hosted under misleading extensions to
  evade detection. MITRE ATT&CK: T1140, T1218.005, T1059.007.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\mshta.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "mshta.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.7z*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.avi*"
                    case_insensitive: true
