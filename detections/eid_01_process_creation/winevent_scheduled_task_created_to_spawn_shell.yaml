name: Windows Scheduled Task Created to Spawn Shell
id: windows-scheduled-task-created-spawn-shell-001
version: 1
schema_version: "1.0"
date: "2026-02-23"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects creation of scheduled tasks designed to execute commands using native 
  shells like PowerShell, Cmd, Wscript, Cscript, or Bash. Uses Sysmon EventID 1 
  to capture schtasks.exe process creation with shell references in the command 
  line. This is a common persistence and execution technique used by ransomware 
  (Ryuk, Medusa), RATs (Castle RAT), and APT groups (Salt Typhoon).

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - wildcard:
            data_win_eventdata_commandLine: "*schtasks*/create*"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine: "*cmd.exe*"
              - wildcard:
                  data_win_eventdata_commandLine: "*powershell.exe*"
              - wildcard:
                  data_win_eventdata_commandLine: "*pwsh.exe*"
              - wildcard:
                  data_win_eventdata_commandLine: "*wscript.exe*"
              - wildcard:
                  data_win_eventdata_commandLine: "*cscript.exe*"
              - wildcard:
                  data_win_eventdata_commandLine: "*bash.exe*"
              - wildcard:
                  data_win_eventdata_commandLine: "*scrcons.exe*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-23 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-23 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Windows endpoints with Sysmon 
  installed and configured to log process creation events (EventID 1) with full 
  command-line arguments. Note: This uses Sysmon EventID 1 instead of Windows 
  Security EventCode 4698 as 4698 may not be available on all Windows editions.

known_false_positives: >
  Legitimate applications and administrators may create scheduled tasks that 
  invoke shells. Filter based on task name, parent process, and user context. 
  Common false positives include software update tasks and IT management tools.

references:
  - https://attack.mitre.org/techniques/T1053/005/
  - https://redcanary.com/threat-detection-report/techniques/scheduled-task-job/
  - https://www.ultimatewindowssecurity.com/securitylog/encyclopedia/event.aspx?eventID=4698

response:
  message: >
    Scheduled task created with shell execution on $agent_name$. 
    Command: $data_win_eventdata_commandLine$. 
    Parent: $data_win_eventdata_parentImage$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1053.005
  risk_score: 63
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 63
  threat_objects: []

tags:
  analytic_story:
    - Ransomware
    - Ryuk Ransomware
    - Medusa Ransomware
    - Scheduled Tasks
    - Windows Persistence Techniques
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1053.005
  custom_tags:
    - scheduled_task
    - persistence
    - shell_spawn
    - schtasks
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*schtasks.*\/create.*/ AND (data_win_eventdata_commandLine:/.*cmd\.exe.*/ OR data_win_eventdata_commandLine:/.*powershell\.exe.*/ OR data_win_eventdata_commandLine:/.*pwsh\.exe.*/ OR data_win_eventdata_commandLine:/.*wscript\.exe.*/ OR data_win_eventdata_commandLine:/.*cscript\.exe.*/ OR data_win_eventdata_commandLine:/.*bash\.exe.*/ OR data_win_eventdata_commandLine:/.*scrcons\.exe.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: f2c64357-b1d2-41b7-849f-34d2682c0fad
    name: Suspicious Command Patterns In Scheduled Task Creation
    reason: Same schtasks /create often carries obfuscated or LOLBin payload syntax beyond the bare shell reference; confirms the task payload is hostile.
  - id: 89ca78fd-b37c-4310-b3d3-81a023f83936
    name: Schtasks Creation Or Modification With SYSTEM Privileges
    reason: A shell-spawning task registered as SYSTEM means the persistence will run with full privilege.
  - id: 9f8573c9-22b4-40e3-89c1-72bc2b8d49ab
    name: Scheduled Task Creation Masquerading as System Processes
    reason: Attackers name shell-launching tasks like OS tasks to hide; a hit shows deliberate concealment.
  - id: 1d174d38-8fda-4081-a9b6-56d9763c0cd8
    name: Scheduled Task Creation with Curl and PowerShell Execution Combo
    reason: Task that launches PowerShell and pulls a payload via curl is the download-and-persist variant of this alert.
  - id: 86588b36-c6d3-465f-9cee-8f9093e07798
    name: Scheduled Task Executing Payload from Registry
    reason: Shell-spawning tasks frequently read a fileless payload staged in the registry.
  - id: c4eeeeae-89f4-43a7-8b48-8d1bdfa66c78
    name: Scheduled Task Executing Encoded Payload from Registry
    reason: Encoded variant of registry-staged payload run by the new task's shell.
  - id: 39019a4e-317f-4ce3-ae63-309a8c6b53c5
    name: Suspicious Scheduled Task Creation Involving Temp Folder
    reason: Task shell pointing at a script/binary in Temp indicates staged malware being persisted.
  - id: 80e1f67a-4596-4351-98f5-a9c3efabac95
    name: Suspicious Scheduled Task Write to System32 Tasks
    reason: Task XML dropped directly into the Tasks folder bypasses schtasks logging; companion evidence of the same persistence.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: All schtasks create/change activity and task events
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss].*/) AND (data_win_eventdata_commandLine:/.*/[Cc][Rr][Ee][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*/[Cc][Hh][Aa][Nn][Gg][Ee].*/ OR data_win_eventdata_commandLine:/.*/[Rr][Uu][Nn].*/)) OR data_win_system_eventID:"4698" OR data_win_system_eventID:"4702"
    pivot_on: host
    window: 6h
  - name: Shells spawned by the Task Scheduler service
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentCommandLine:/.*-[Ss] [Ss][Cc][Hh][Ee][Dd][Uu][Ll][Ee].*/ OR data_win_eventdata_parentCommandLine:/.*[Tt][Aa][Ss][Kk][Ee][Nn][Gg]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_parentCommandLine:/.*[Tt][Aa][Ss][Kk][Hh][Oo][Ss][Tt][Ww]\.[Ee][Xx][Ee].*/) AND (data_win_eventdata_image:/.*\\([Cc][Mm][Dd]\.[Ee][Xx][Ee]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee])/)
    pivot_on: host
    window: 24h
  - name: Task payload staged in user-writable path
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss].*/) AND (data_win_eventdata_commandLine:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc].*/ OR data_win_eventdata_commandLine:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Tt][Ee][Mm][Pp]\\.*/)
    pivot_on: host
    window: 6h
  - name: Encoded or download-cradle shell commands
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*-[Ee][Nn][Cc].*/ OR data_win_eventdata_commandLine:/.*-[Ee][Nn][Cc][Oo][Dd][Ee][Dd][Cc][Oo][Mm][Mm][Aa][Nn][Dd].*/ OR data_win_eventdata_commandLine:/.*[Ff][Rr][Oo][Mm][Bb][Aa][Ss][Ee]64[Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ee][Xx][Pp][Rr][Ee][Ss][Ss][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn].*/ OR data_win_eventdata_commandLine:/.*[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll].*/)
    pivot_on: host
    window: 4h
  - name: Outbound connections from script interpreters
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|[Cc][Mm][Dd]\.[Ee][Xx][Ee]|[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee])/)
    pivot_on: host
    window: 4h
