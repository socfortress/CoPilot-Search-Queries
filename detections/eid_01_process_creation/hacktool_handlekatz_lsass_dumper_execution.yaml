name: HackTool - HandleKatz LSASS Dumper Execution
id: ca621ba5-54ab-4035-9942-d378e6fcde3c
version: 1
schema_version: "1.0"
date: "2024-11-23"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: ca621ba5-54ab-4035-9942-d378e6fcde3c
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the use of HandleKatz, a tool that demonstrates the usage of cloned
  handles to Lsass in order to create an obfuscated memory dump of the same.
  MITRE ATT&CK: T1003.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\loader.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*--pid:*"
                          case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=38D9E015591BBFD4929E0D0F47FA0055*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=0E2216679CA6E1094D63322E3412D650*"
                    case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*--pid:*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*--outfile:*"
                          case_insensitive: true
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*.dmp*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*lsass*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*.obf*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*dump*"
                                case_insensitive: true
                        minimum_should_match: 1
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_hashes
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\loader.exe'; data_win_eventdata_commandLine matches '*--pid:*';
  data_win_eventdata_hashes matches
  '*IMPHASH=38D9E015591BBFD4929E0D0F47FA0055*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/codewhitesec/HandleKatz
  - https://attack.mitre.org/techniques/T1003/001/

response:
  message: >
    HackTool - HandleKatz LSASS Dumper Execution detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1003.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.001
  custom_tags:
    - hacktool
    - handlekatz
    - lsass
    - process_creation
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\[Ll][Oo][Aa][Dd][Ee][Rr]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*--[Pp][Ii][Dd]:.*/) OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=38[Dd]9[Ee]015591[Bb][Bb][Ff][Dd]4929[Ee]0[Dd]0[Ff]47[Ff][Aa]0055.*/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=0[Ee]2216679[Cc][Aa]6[Ee]1094[Dd]63322[Ee]3412[Dd]650.*/ OR (data_win_eventdata_commandLine:/.*--[Pp][Ii][Dd]:.*/ AND data_win_eventdata_commandLine:/.*--[Oo][Uu][Tt][Ff][Ii][Ll][Ee]:.*/ AND (data_win_eventdata_commandLine:/.*\.[Dd][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Ss][Ss].*/ OR data_win_eventdata_commandLine:/.*\.[Oo][Bb][Ff].*/ OR data_win_eventdata_commandLine:/.*[Dd][Uu][Mm][Pp].*/)))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b1bd3a59-c1fd-4860-9f40-4dd161a7d1f5
    name: HackTool - HandleKatz Duplicating LSASS Handle
    reason: 'Sysmon EID 10 counterpart: the same HandleKatz loader duplicating a cloned LSASS handle, confirming the dump actually ran after the process creation.'
  - id: 5ef9853e-4d0e-4a70-846f-a9ca37d876da
    name: Potential Credential Dumping Activity Via LSASS
    reason: Generic LSASS access with dump-capable rights from the same host; corroborates credential theft beyond the tool name.
  - id: a18dd26b-6450-46de-8c91-9659150cf088
    name: Potentially Suspicious GrantedAccess Flags On LSASS
    reason: HandleKatz requests handle rights on LSASS; suspicious GrantedAccess flags show the memory read.
  - id: d474c8fe-bb69-4ea0-b7d9-f682b56d52d3
    name: HackTool - Doppelanger LSASS Dumper Execution
    reason: Sibling LSASS dumper; operators try several dumpers when one is blocked by EDR.
  - id: 2704ab9e-afe2-4854-a3b1-0c0706d03578
    name: HackTool - Dumpert Process Dumper Execution
    reason: Another syscall-based LSASS dumper commonly swapped in as a fallback on the same host.
  - id: 8fbf3271-1ef6-4e94-8210-03c2317947f6
    name: Cred Dump Tools Dropped Files
    reason: Dumper tool or output files dropped to disk around the HandleKatz run.
  - id: ec570e53-4c76-45a9-804d-dc3f355ff7a7
    name: 7Zip Compressing Dump Files
    reason: 'Follow-on: the .dmp/.obf output is archived before exfiltration.'
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: The obfuscated dump is parsed offline with mimikatz/pypykatz; the same operator may also run mimikatz on the host.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: LSASS process access on the host
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_grantedAccess:"0x1FFFFF" OR data_win_eventdata_grantedAccess:"0x1F3FFF" OR data_win_eventdata_grantedAccess:"0x1410" OR data_win_eventdata_grantedAccess:"0x1010" OR data_win_eventdata_grantedAccess:"0x1438")
    pivot_on: host
    window: 1h
  - name: Memory dump files written to disk
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\.[Dd][Mm][Pp]/ OR data_win_eventdata_targetFilename:/.*[Ll][Ss][Aa][Ss][Ss].*/ OR data_win_eventdata_targetFilename:/.*\.[Oo][Bb][Ff]/)
    pivot_on: host
    window: 2h
  - name: Loader executables taking --pid arguments
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*--[Pp][Ii][Dd]:.*/
    pivot_on: host
    window: 2h
  - name: Archiver or transfer tool staging dump data
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*\.[Dd][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*\.[Oo][Bb][Ff].*/) AND (data_win_eventdata_image:/.*\\([Rr]clone|[Ww]in[Rr][Aa][Rr]|7[Zz]|[Cc]url)\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Cc]ompress-[Aa]rchive|[Xx]copy|[Cc]opy).*/)
    pivot_on: host
    window: 4h
  - name: Network or remote logons using possibly stolen credentials
    query: data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"9" OR data_win_eventdata_logonType:"10")
    pivot_on: host
    window: 6h
