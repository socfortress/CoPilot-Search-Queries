name: Uncommon AddinUtil.EXE CommandLine Execution
id: 4f2cd9b6-4a17-440f-bb2a-687abb65993a
version: 1
schema_version: "1.0"
date: "2023-09-18"
author: Michael McKinley (@McKinleyMike), Tony Latteri (@TheLatteri)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 4f2cd9b6-4a17-440f-bb2a-687abb65993a
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of the Add-In deployment cache updating utility
  (AddInutil.exe) with uncommon Addinroot or Pipelineroot paths. An adversary
  may execute AddinUtil.exe with uncommon Addinroot/Pipelineroot paths that
  point to the adversaries Addins.Store payload. MITRE ATT&CK: T1218.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\addinutil.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "AddInUtil.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-AddInRoot:*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-PipelineRoot:*"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_commandLine"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*-AddInRoot:\"C:\\\\Program Files (x86)\\\\Common Files\\\\Microsoft Shared\\\\VSTA*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*-AddInRoot:C:\\\\Program Files (x86)\\\\Common Files\\\\Microsoft Shared\\\\VSTA*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*-PipelineRoot:\"C:\\\\Program Files (x86)\\\\Common Files\\\\Microsoft Shared\\\\VSTA*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*-PipelineRoot:C:\\\\Program Files (x86)\\\\Common Files\\\\Microsoft Shared\\\\VSTA*"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\addinutil.exe'; data_win_eventdata_originalFileName equals 'AddInUtil.exe';
  data_win_eventdata_commandLine matches '*-AddInRoot:*', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.blue-prints.blog/content/blog/posts/lolbin/addinutil-lolbas.html
  - https://attack.mitre.org/techniques/T1218/

response:
  message: >
    Uncommon AddinUtil.EXE CommandLine Execution detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1218
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218
  custom_tags:
    - uncommon
    - addinutil
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Aa][Dd][Dd][Ii][Nn][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Aa][Dd][Dd][Ii][Nn][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*-[Aa][Dd][Dd][Ii][Nn][Rr][Oo][Oo][Tt]:.*/ OR data_win_eventdata_commandLine:/.*-[Pp][Ii][Pp][Ee][Ll][Ii][Nn][Ee][Rr][Oo][Oo][Tt]:.*/) AND _exists_:data_win_eventdata_commandLine AND NOT (data_win_eventdata_commandLine:/.*-[Aa][Dd][Dd][Ii][Nn][Rr][Oo][Oo][Tt]:\"[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Cc][Oo][Mm][Mm][Oo][Nn] [Ff][Ii][Ll][Ee][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt] [Ss][Hh][Aa][Rr][Ee][Dd]\\[Vv][Ss][Tt][Aa].*/ OR data_win_eventdata_commandLine:/.*-[Aa][Dd][Dd][Ii][Nn][Rr][Oo][Oo][Tt]:[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Cc][Oo][Mm][Mm][Oo][Nn] [Ff][Ii][Ll][Ee][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt] [Ss][Hh][Aa][Rr][Ee][Dd]\\[Vv][Ss][Tt][Aa].*/ OR data_win_eventdata_commandLine:/.*-[Pp][Ii][Pp][Ee][Ll][Ii][Nn][Ee][Rr][Oo][Oo][Tt]:\"[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Cc][Oo][Mm][Mm][Oo][Nn] [Ff][Ii][Ll][Ee][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt] [Ss][Hh][Aa][Rr][Ee][Dd]\\[Vv][Ss][Tt][Aa].*/ OR data_win_eventdata_commandLine:/.*-[Pp][Ii][Pp][Ee][Ll][Ii][Nn][Ee][Rr][Oo][Oo][Tt]:[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Cc][Oo][Mm][Mm][Oo][Nn] [Ff][Ii][Ll][Ee][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt] [Ss][Hh][Aa][Rr][Ee][Dd]\\[Vv][Ss][Tt][Aa].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 6120ac2a-a34b-42c0-a9bd-1fb9f459f348
    name: AddinUtil.EXE Execution From Uncommon Directory
    reason: A copied or renamed AddinUtil run from an odd directory commonly accompanies the same Addins.Store payload abuse.
  - id: b5746143-59d6-4603-8d06-acbd60e166ee
    name: Uncommon Child Process Of AddinUtil.EXE
    reason: 'Direct follow-on: the abused AddinUtil loads the payload and spawns an unexpected child.'
  - id: 631b22a4-70f4-4e2f-9ea8-42f84d9df6d8
    name: Suspicious AddinUtil.EXE CommandLine Execution
    reason: Sibling detection for suspicious AddinUtil arguments; co-firing raises confidence.
  - id: 5205613d-2a63-4412-a895-3a2458b587b3
    name: Network Connection Initiated By AddinUtil.EXE
    reason: A loaded payload typically beacons; AddinUtil has no legitimate reason to connect out.
  - id: 4508a70e-97ef-4300-b62b-ff27992990ea
    name: DotNet CLR DLL Loaded By Scripting Applications
    reason: AddinUtil is .NET-based; payload execution loads CLR components in the proxy process.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Addins.Store and pipeline store file writes
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*([aA][dD][dD][iI][nN][sS]|[pP][iI][pP][eE][lL][iI][nN][eE])\.[sS][tT][oO][rR][eE].*/
    pivot_on: host
    window: 4h
  - name: Children of AddinUtil.exe
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\([aA][dD][dD][iI][nN][uU][tT][iI][lL]\.[eE][xX][eE])/
    pivot_on: host
    window: 2h
  - name: Network connections by AddinUtil.exe
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([aA][dD][dD][iI][nN][uU][tT][iI][lL]\.[eE][xX][eE])/
    pivot_on: host
    window: 2h
  - name: Other LOLBin proxy execution
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([iI][nN][sS][tT][aA][lL][lL][uU][tT][iI][lL]\.[eE][xX][eE]|[mM][sS][bB][uU][iI][lL][dD]\.[eE][xX][eE]|[rR][eE][gG][aA][sS][mM]\.[eE][xX][eE]|[rR][eE][gG][sS][vV][cC][sS]\.[eE][xX][eE]|[mM][sS][hH][tT][aA]\.[eE][xX][eE]|[rR][eE][gG][sS][vV][rR]32\.[eE][xX][eE])/
    pivot_on: host
    window: 2h
  - name: Executables and DLLs dropped in user-writable folders
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(\\[Tt]emp\\|\\[Aa]pp[Dd]ata\\|\\[Pp]ublic\\|\\[Dd]ownloads\\).*\.([Dd][Ll][Ll]|[Ee][Xx][Ee]|[Ss][Tt][Oo][Rr][Ee]).*/
    pivot_on: host
    window: 4h
