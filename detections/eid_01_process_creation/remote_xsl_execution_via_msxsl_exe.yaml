name: Remote XSL Execution Via Msxsl.EXE
id: 75d0a94e-6252-448d-a7be-d953dff527bb
version: 1
schema_version: "1.0"
date: "2023-11-09"
author: Swachchhanda Shrawan Poudel
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 75d0a94e-6252-448d-a7be-d953dff527bb
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of the "msxsl" binary with an "http" keyword in the
  command line. This might indicate a potential remote execution of XSL files.
  MITRE ATT&CK: T1220.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\msxsl.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*http*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\msxsl.exe'; data_win_eventdata_commandLine matches '*http*'.

known_false_positives: >
  Msxsl is not installed by default and is deprecated, so unlikely on most
  systems. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1220/T1220.md
  - https://lolbas-project.github.io/lolbas/OtherMSBinaries/Msxsl/
  - https://attack.mitre.org/techniques/T1220/

response:
  message: >
    Remote XSL Execution Via Msxsl.EXE detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1220
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1220
  custom_tags:
    - msxsl
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Mm][Ss][Xx][Ss][Ll]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 9e50a8b3-dd05-4eb8-9153-bdb6b79d50b0
    name: Msxsl.EXE Execution
    reason: Generic msxsl execution on the same host; msxsl is not present by default so it was likely dropped.
  - id: 074e0ded-6ced-4ebd-8b4d-53f55908119d
    name: AWL Bypass with Winrm.vbs and Malicious WsmPty.xsl/WsmTxt.xsl
    reason: Another XSL-based script-execution technique used for the same application-allowlisting bypass.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Network connections by msxsl
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*[Mm]sxsl.*/
    pivot_on: host
    window: 1h
  - name: msxsl and XSL file drops
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(/.*[Mm]sxsl.*/ OR /.*\.xsl/)
    pivot_on: host
    window: 4h
  - name: Children of msxsl
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Mm]sxsl.*/
    pivot_on: host
    window: 1h
  - name: Script engine loads in msxsl
    query: data_win_system_eventID:7 AND data_win_eventdata_image:/.*[Mm]sxsl.*/ AND data_win_eventdata_imageLoaded:(/.*[Jj]script.*/ OR /.*[Vv]bscript.*/)
    pivot_on: host
    window: 1h
