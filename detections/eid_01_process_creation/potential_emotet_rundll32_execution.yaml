name: Potential Emotet Rundll32 Execution
id: 54e57ce3-0672-46eb-a402-2c0948d5e3e9
version: 1
schema_version: "1.0"
date: "2023-02-21"
author: FPT.EagleEye
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 54e57ce3-0672-46eb-a402-2c0948d5e3e9
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detecting Emotet DLL loading by looking for rundll32.exe processes with
  command lines ending in ,RunDLL or ,Control_RunDLL. MITRE ATT&CK: T1218.011.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\rundll32.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "RUNDLL32.EXE"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*,RunDLL"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*,Control_RunDLL"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_commandLine"
        - exists:
            field: "data_win_eventdata_parentImage"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*.dll,Control_RunDLL"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*.dll\",Control_RunDLL"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*.dll',Control_RunDLL"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_parentImage:
                          value: "*\\\\tracker.exe"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\rundll32.exe'; data_win_eventdata_originalFileName equals 'RUNDLL32.EXE';
  data_win_eventdata_commandLine matches '*,RunDLL', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://paste.cryptolaemus.com/emotet/2020/12/22/emotet-malware-IoCs_12-22-20.html
  - https://cyber.wtf/2021/11/15/guess-whos-back/
  - https://attack.mitre.org/techniques/T1218/011/

response:
  message: >
    Potential Emotet Rundll32 Execution detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1218.011
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218.011
  custom_tags:
    - emotet
    - rundll32
    - process_creation
    - sysmon
    - stealth
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*,[Rr][Uu][Nn][Dd][Ll][Ll]/ OR data_win_eventdata_commandLine:/.*,[Cc][Oo][Nn][Tt][Rr][Oo][Ll]_[Rr][Uu][Nn][Dd][Ll][Ll]/) AND _exists_:data_win_eventdata_commandLine AND _exists_:data_win_eventdata_parentImage AND NOT (data_win_eventdata_commandLine:/.*\.[Dd][Ll][Ll],[Cc][Oo][Nn][Tt][Rr][Oo][Ll]_[Rr][Uu][Nn][Dd][Ll][Ll]/ OR data_win_eventdata_commandLine:/.*\.[Dd][Ll][Ll]\",[Cc][Oo][Nn][Tt][Rr][Oo][Ll]_[Rr][Uu][Nn][Dd][Ll][Ll]/ OR data_win_eventdata_commandLine:/.*\.[Dd][Ll][Ll]',[Cc][Oo][Nn][Tt][Rr][Oo][Ll]_[Rr][Uu][Nn][Dd][Ll][Ll]/ OR data_win_eventdata_parentImage:/.*\\[Tt][Rr][Aa][Cc][Kk][Ee][Rr]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d02e8cf5-6099-48cf-9bfc-1eec2d0c7b18
    name: Potential Emotet Activity
    reason: 'Precursor: Emotet obfuscated PowerShell stage that downloads the DLL loaded here'
  - id: 1f32d820-1d5c-43fe-8fe2-feef0c952eb7
    name: Emotet Loader Execution Via .LNK File
    reason: 'Precursor: .LNK loader delivery of Emotet that leads to rundll32 execution'
  - id: e593cf51-88db-4ee1-b920-37e89012a3c9
    name: Potentially Suspicious Rundll32 Activity
    reason: 'Co-occurring: generic suspicious rundll32 usage from odd paths or parents'
  - id: 2569ed8c-1147-498a-9b8c-2ad3656b10ed
    name: Potential Renamed Rundll32 Execution
    reason: 'Co-occurring: affiliates rename or relocate rundll32 to evade this pattern'
  - id: cf879ffb-793a-4753-9a14-bc8f37cc90df
    name: Potential Qakbot Rundll32 Execution
    reason: 'Related loader: Qakbot/Emotet share the rundll32 DLL execution pattern and delivery chain'
  - id: de587dce-915e-4218-aac4-835ca6af6f70
    name: Potential Persistence Attempt Via Run Keys Using Reg.EXE
    reason: 'Follow-on: Emotet persists via Run key after the DLL is running'
  - id: 24357373-078f-44ed-9ac4-6d334a668a11
    name: Direct Autorun Keys Modification
    reason: 'Follow-on: autorun key modification to retain the DLL across reboots'
  - id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
    name: PowerShell Download and Execution Cradles
    reason: 'Precursor: PowerShell download cradle that fetched the Emotet DLL'
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Document and script parents launching rundll32
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\([Ww][Ii][Nn][Ww][Oo][Rr][Dd]|[Ee][Xx][Cc][Ee][Ll]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Cc][Mm][Dd]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Mm][Ss][Hh][Tt][Aa])\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Rr][Uu][Nn][Dd][Ll][Ll]32)\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Rundll32 network connections
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:"true" AND data_win_eventdata_image:/.*\\([Rr][Uu][Nn][Dd][Ll][Ll]32)\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 4h
  - name: DLLs written to profile paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\([Aa][Pp][Pp][Dd][Aa][Tt][Aa]|[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]|[Tt][Ee][Mm][Pp])\\.*\.[Dd][Ll][Ll]/
    pivot_on: host
    window: 2h
  - name: Run key writes pointing at rundll32 or DLLs
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Rr][Uu][Nn]\\.*/ AND data_win_eventdata_details:/.*([Rr][Uu][Nn][Dd][Ll][Ll]32|\.[Dd][Ll][Ll]).*/
    pivot_on: host
    window: 6h
  - name: Recon and task commands spawned by rundll32
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\([Rr][Uu][Nn][Dd][Ll][Ll]32)\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Cc][Mm][Dd]|[Nn][Ee][Tt]|[Nn][Ee][Tt]1|[Nn][Ll][Tt][Ee][Ss][Tt]|[Ww][Hh][Oo][Aa][Mm][Ii]|[Ii][Pp][Cc][Oo][Nn][Ff][Ii][Gg]|[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss])\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 4h
