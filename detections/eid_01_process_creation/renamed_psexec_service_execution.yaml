name: Renamed PsExec Service Execution
id: 51ae86a2-e2e1-4097-ad85-c46cb6851de4
version: 1
schema_version: "1.0"
date: "2022-07-21"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 51ae86a2-e2e1-4097-ad85-c46cb6851de4
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious launch of a renamed version of the PSEXESVC service with,
  which is not often used by legitimate administrators.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - term:
            data_win_eventdata_originalFileName:
              value: "psexesvc.exe"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - term:
                  data_win_eventdata_image:
                    value: "C:\\Windows\\PSEXESVC.exe"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_originalFileName
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_originalFileName equals
  'psexesvc.exe'; data_win_eventdata_image equals 'C:\Windows\PSEXESVC.exe'.

known_false_positives: >
  Legitimate administrative tasks. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://learn.microsoft.com/en-us/sysinternals/downloads/psexec
  - https://www.youtube.com/watch?v=ro2QuZTIMBM

response:
  message: >
    Renamed PsExec Service Execution detected on host $agent_name$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_originalFileName
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - renamed
    - psexec
    - service
    - process_creation
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_originalFileName:/[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]\.[Ee][Xx][Ee]/ AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: fdfcbd78-48f1-4a4b-90ac-d82241e368c5
    name: PsExec Service Execution
    reason: Standard PSEXESVC service execution is the baseline this rule evades
  - id: 7c0dcd3d-acf8-4f71-9570-f448b0034f94
    name: PsExec Service Child Process Execution as LOCAL SYSTEM
    reason: Children of the PsExec service as SYSTEM reveal what the remote operator ran
  - id: ea011323-7045-460b-b2d7-0f7442ea6b38
    name: Potential PsExec Remote Execution
    reason: Source-side PsExec remote execution marks the originating host
  - id: 683e6196-b8e8-11eb-9a79-acde48001122
    name: Detect Renamed PSExec
    reason: Renamed PsExec client on the originating machine
  - id: 855bc8b5-2ae8-402e-a9ed-b889e6df1900
    name: Copy From Or To Admin Share Or Sysvol Folder
    reason: Admin share copy delivers the renamed service binary before it runs
  - id: 27c3a83d-cada-47c6-9042-67baf19d2574
    name: Detect PsExec With accepteula Flag
    reason: accepteula on the client side precedes service push
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: SYSTEM shells and recon children
    query: data_win_system_eventID:1 AND data_win_eventdata_user:/.*SYSTEM.*/ AND data_win_eventdata_image:(/.*[Cc]md\.[Ee][Xx][Ee]/ OR /.*[Pp]ower[Ss]hell\.[Ee][Xx][Ee]/ OR /.*[Ww]hoami\.[Ee][Xx][Ee]/)
    pivot_on: host
    window: 4h
  - name: New service installs
    query: data_win_system_eventID:7045
    pivot_on: host
    window: 4h
  - name: Remote network logons
    query: data_win_system_eventID:4624 AND data_win_eventdata_logonType:3
    pivot_on: host
    window: 4h
  - name: Admin share access
    query: data_win_system_eventID:5145 AND data_win_eventdata_shareName:(/.*ADMIN.*/ OR /.*C\$.*/)
    pivot_on: host
    window: 4h
