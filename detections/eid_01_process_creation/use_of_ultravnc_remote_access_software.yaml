name: Use of UltraVNC Remote Access Software
id: 145322e4-0fd3-486b-81ca-9addc75736d8
version: 1
schema_version: "1.0"
date: "2022-10-02"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 145322e4-0fd3-486b-81ca-9addc75736d8
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  An adversary may use legitimate desktop support and remote access software,to
  establish an interactive command and control channel to target systems within
  networks. MITRE ATT&CK: T1219.002.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - term:
                  data_win_eventdata_description:
                    value: "VNCViewer"
                    case_insensitive: true
              - term:
                  data_win_eventdata_product:
                    value: "UltraVNC VNCViewer"
                    case_insensitive: true
              - term:
                  data_win_eventdata_company:
                    value: "UltraVNC"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "VNCViewer.exe"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_description
    - data_win_eventdata_product
    - data_win_eventdata_company
    - data_win_eventdata_originalFileName
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_description equals
  'VNCViewer'; data_win_eventdata_product equals 'UltraVNC VNCViewer';
  data_win_eventdata_company equals 'UltraVNC', among other conditions.

known_false_positives: >
  Legitimate use. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/9e5b12c4912c07562aec7500447b11fa3e17e254/atomics/T1219/T1219.md
  - https://attack.mitre.org/techniques/T1219/002/

response:
  message: >
    Use of UltraVNC Remote Access Software detected on host $agent_name$.
    Matched data_win_eventdata_description: $data_win_eventdata_description$.
    Matched data_win_eventdata_product: $data_win_eventdata_product$. MITRE
    ATT&CK: T1219.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_description
      type: other
    - field: data_win_eventdata_product
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1219.002
  custom_tags:
    - ultravnc
    - software
    - process_creation
    - sysmon
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_description:/[Vv][Nn][Cc][Vv][Ii][Ee][Ww][Ee][Rr]/ OR data_win_eventdata_product:/[Uu][Ll][Tt][Rr][Aa][Vv][Nn][Cc] [Vv][Nn][Cc][Vv][Ii][Ee][Ww][Ee][Rr]/ OR data_win_eventdata_company:/[Uu][Ll][Tt][Rr][Aa][Vv][Nn][Cc]/ OR data_win_eventdata_originalFileName:/[Vv][Nn][Cc][Vv][Ii][Ee][Ww][Ee][Rr]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: ccad96d7-a48c-4f13-8b9c-9f6a31cba454
    name: Detect Remote Access Software Usage FileInfo
    reason: Generic remote-access software detection often co-fires when several tools are staged.
  - id: b52e84a3-029e-4529-b09b-71d19dd27e94
    name: Remote Access Tool - AnyDesk Execution
    reason: AnyDesk is the most common alternate remote tool installed alongside or instead of VNC.
  - id: 57bff678-25d1-4d6c-8211-8ca106d12053
    name: Remote Access Tool - ScreenConnect Execution
    reason: ScreenConnect is another commonly abused remote-access tool in the same intrusions.
  - id: 758ff488-18d5-4cbe-8ec4-02b6285a434f
    name: Remote Access Tool - NetSupport Execution
    reason: NetSupport is a frequently paired remote-access RAT.
  - id: ee37eb7c-a4e7-4cd5-8fa4-efa27f1c3f31
    name: PUA - Ngrok Execution
    reason: Ngrok tunnels expose VNC/RDP ports to the internet, a typical companion.
  - id: 8a3038e8-9c9d-46f8-b184-66234a160f6f
    name: Potential Remote Desktop Tunneling
    reason: Remote desktop tunneling indicates reaching the VNC/RDP service through a pivot.
  - id: cd5cfd80-aa5f-44c0-9c20-108c4ae12e3c
    name: New Firewall Rule Added Via Netsh.EXE
    reason: A new firewall rule is commonly added to allow inbound VNC.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: UltraVNC server/viewer binaries and service
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*([Ww][Ii][Nn][Vv][Nn][Cc]\.[Ee][Xx][Ee]|[Vv][Nn][Cc][Vv][Ii][Ee][Ww][Ee][Rr]\.[Ee][Xx][Ee]|[Uu][Vv][Nn][Cc]_[Ss][Ee][Rr][Vv][Ii][Cc][Ee]\.[Ee][Xx][Ee])/ OR data_win_eventdata_commandLine:/.*[Uu][Ll][Tt][Rr][Aa][Vv][Nn][Cc].*/)
    pivot_on: host
    window: 6h
  - name: VNC network connections
    query: data_win_system_eventID:"3" AND (data_win_eventdata_destinationPort:"5900" OR data_win_eventdata_destinationPort:"5901" OR data_win_eventdata_destinationPort:"5800" OR data_win_eventdata_sourcePort:"5900")
    pivot_on: host
    window: 6h
  - name: Firewall opened or service installed for VNC
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*([Nn][Ee][Tt][Ss][Hh]\.[Ee][Xx][Ee])/ AND data_win_eventdata_commandLine:/.*[Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll].*(5900|[Vv][Nn][Cc]).*/) OR (data_win_eventdata_image:/.*([Ss][Cc]\.[Ee][Xx][Ee])/ AND data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee].*[Vv][Nn][Cc].*/))
    pivot_on: host
    window: 6h
  - name: Other remote-access tools on host
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*([Aa][Nn][Yy][Dd][Ee][Ss][Kk]\.[Ee][Xx][Ee]|[Tt][Ee][Aa][Mm][Vv][Ii][Ee][Ww][Ee][Rr]\.[Ee][Xx][Ee]|[Ss][Cc][Rr][Ee][Ee][Nn][Cc][Oo][Nn][Nn][Ee][Cc][Tt]\.[Cc][Ll][Ii][Ee][Nn][Tt][Ss][Ee][Rr][Vv][Ii][Cc][Ee]\.[Ee][Xx][Ee]|[Rr][Uu][Tt][Ss][Ee][Rr][Vv]\.[Ee][Xx][Ee]|[Nn][Gg][Rr][Oo][Kk]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 24h
  - name: VNC installer or config written to disk
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*([Uu][Ll][Tt][Rr][Aa][Vv][Nn][Cc]|[Ww][Ii][Nn][Vv][Nn][Cc]).*/
    pivot_on: host
    window: 6h
