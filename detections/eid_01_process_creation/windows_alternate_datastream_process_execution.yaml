name: Windows Alternate DataStream - Process Execution
id: windows-alternate-datastream-process-execution-001
version: 1
schema_version: "1.0"
date: "2026-03-03"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects when a known LOLBin process executes a file from an NTFS alternate 
  data stream (ADS). ADS can conceal malicious payloads within legitimate 
  files. The colon separator in file paths (e.g., file.txt:payload.exe) 
  indicates ADS execution. Used by BitPaymer ransomware and APT groups.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image: "*\\wscript.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\cscript.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\mshta.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\rundll32.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\powershell.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\pwsh.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\bitsadmin.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\control.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\forfiles.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\ftp.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\regsvr32.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\wmic.exe"
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine: "*:*.*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user
    - data_win_eventdata_hashes

parameters:
  AGENT_NAME:
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    type: string
    required: true
    example: "lab"
  START_TIME:
    type: datetime
    default: "now-24h"
  END_TIME:
    type: datetime
    default: "now"

how_to_implement: >
  Requires Sysmon EventID 1 with full command-line logging. The wildcard 
  *:*.* catches ADS colon patterns but may produce false positives from 
  drive letter colons (C:\). CoPilot post-processing should apply regex 
  to validate true ADS patterns excluding drive letters.

known_false_positives: >
  Command lines containing drive letter colons (C:\) will match the 
  wildcard. Post-processing regex recommended to filter: match only 
  patterns like filename.ext:stream.ext (not drive letters).

references:
  - https://car.mitre.org/analytics/CAR-2020-08-001/
  - https://blogs.juniper.net/en-us/threat-research/bitpaymer-ransomware-hides-behind-windows-alternate-data-streams
  - https://blog.netwrix.com/2022/12/16/alternate_data_stream/
  - https://attack.mitre.org/techniques/T1564/004/

response:
  message: >
    ADS execution detected on $agent_name$. 
    Process: $data_win_eventdata_image$. 
    Command: $data_win_eventdata_commandLine$. 
    Parent: $data_win_eventdata_parentImage$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1564.004
  risk_score: 80
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 80
  threat_objects: []

tags:
  analytic_story:
    - Windows Defense Evasion Tactics
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1564.004
  custom_tags:
    - alternate_data_stream
    - ads_execution
    - lolbin
    - defense_evasion
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\\\wscript\.exe/ OR data_win_eventdata_image:/.*\\\\cscript\.exe/ OR data_win_eventdata_image:/.*\\\\mshta\.exe/ OR data_win_eventdata_image:/.*\\\\rundll32\.exe/ OR data_win_eventdata_image:/.*\\\\powershell\.exe/ OR data_win_eventdata_image:/.*\\\\pwsh\.exe/ OR data_win_eventdata_image:/.*\\\\bitsadmin\.exe/ OR data_win_eventdata_image:/.*\\\\control\.exe/ OR data_win_eventdata_image:/.*\\\\forfiles\.exe/ OR data_win_eventdata_image:/.*\\\\ftp\.exe/ OR data_win_eventdata_image:/.*\\\\regsvr32\.exe/ OR data_win_eventdata_image:/.*\\\\wmic\.exe/) AND data_win_eventdata_commandLine:/.*:.*\..*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7f43c430-5001-4f8b-aaa9-c3b88f18fa5c
    name: Execute From Alternate Data Streams
    reason: Sibling detection of the same ADS execution via native utilities; confirms the technique.
  - id: b69888d4-380c-45ce-9cf9-d9ce46e67821
    name: Hidden Executable In NTFS Alternate Data Stream
    reason: Stream-hash event showing the executable was hidden in an ADS before the LOLBin ran it.
  - id: 0d7a9363-af70-4e7b-a3b7-1a176b7fbe84
    name: Exports Registry Key To an Alternate Data Stream
    reason: Another way data lands in an ADS before execution.
  - id: 573df571-a223-43bc-846e-3f98da481eca
    name: Creation Of a Suspicious ADS File Outside a Browser Download
    reason: Non-browser ADS creation is the staging step preceding ADS execution.
  - id: 0b80ade5-6997-4b1d-99a1-71701778ea61
    name: Imports Registry Key From an ADS
    reason: Same ADS-hiding tradecraft using reg.exe import.
  - id: 6b369ced-4b1d-48f1-b427-fdc0de0790bd
    name: Suspicious Diantz Alternate Data Stream Execution
    reason: Diantz packing a file into an ADS is a related staging variant.
  - id: 4b13db67-0c45-40f1-aba8-66a1a7198a1e
    name: Suspicious Extrac32 Alternate Data Stream Execution
    reason: Extrac32 copying payloads into an ADS precedes execution from it.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: ADS file stream creation
    query: data_win_system_eventID:15 AND data_win_eventdata_targetFilename:/.*:[^\\]+/
    pivot_on: host
    window: 6h
  - name: Files written with colon stream names
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\.[A-Za-z0-9]+:[A-Za-z0-9_.-]+/
    pivot_on: host
    window: 4h
  - name: Script engines and LOLBins with payload arguments
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*(wscript|cscript|mshta|regsvr32|rundll32|powershell|wmic)\.exe/ AND data_win_eventdata_commandLine:/.*(Invoke-|http|-enc|\.dll|\.sct).*/
    pivot_on: host
    window: 2h
  - name: Outbound connections from LOLBins
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*(wscript|cscript|mshta|regsvr32|rundll32|bitsadmin)\.exe/
    pivot_on: host
    window: 2h
