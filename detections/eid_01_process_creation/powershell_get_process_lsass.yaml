name: PowerShell Get-Process LSASS
id: b2815d0d-7481-4bf0-9b6c-a4c48a94b349
version: 1
schema_version: "1.0"
date: "2023-01-05"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: b2815d0d-7481-4bf0-9b6c-a4c48a94b349
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a "Get-Process" cmdlet and it's aliases on lsass process, which is in
  almost all cases a sign of malicious activity. MITRE ATT&CK: T1552.004.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Get-Process lsas*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*ps lsas*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*gps lsas*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*Get-Process lsas*'; data_win_eventdata_commandLine matches '*ps lsas*';
  data_win_eventdata_commandLine matches '*gps lsas*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://web.archive.org/web/20220205033028/https://twitter.com/PythonResponder/status/1385064506049630211
  - https://attack.mitre.org/techniques/T1552/004/

response:
  message: >
    PowerShell Get-Process LSASS detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1552.004
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1552.004
  custom_tags:
    - powershell
    - lsass
    - process_creation
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Gg][Ee][Tt]-[Pp][Rr][Oo][Cc][Ee][Ss][Ss] [Ll][Ss][Aa][Ss].*/ OR data_win_eventdata_commandLine:/.*[Pp][Ss] [Ll][Ss][Aa][Ss].*/ OR data_win_eventdata_commandLine:/.*[Gg][Pp][Ss] [Ll][Ss][Aa][Ss].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: ffa6861c-4461-4f59-8a41-578c39f3f23e
    name: LSASS Dump Keyword In CommandLine
    reason: Locating the lsass PID is the preparatory step for a dump command naming lsass.
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: Get-Process lsass yields the PID passed to comsvcs.dll MiniDump.
  - id: 5afee48e-67dd-4e03-a783-f74259dcf998
    name: Potential LSASS Process Dump Via Procdump
    reason: Procdump -ma lsass is a common follow-on once the PID is known.
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: Direct credential extraction from lsass after reconnaissance.
  - id: ec570e53-4c76-45a9-804d-dc3f355ff7a7
    name: 7Zip Compressing Dump Files
    reason: Dump files are archived before exfiltration.
  - id: fe63010f-8823-4864-a96b-a7b4a0f7b929
    name: LSASS Process Reconnaissance Via Findstr.EXE
    reason: Alternate way of locating the lsass process in the same recon step.
  - id: c8da0dfd-4ed0-4b68-962d-13c9c884384e
    name: Potential Credential Dumping Via LSASS Process Clone
    reason: Evasive dumping variant that follows lsass discovery.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: LSASS dump tooling command lines
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ll]sass.*[Dd]ump.*/ OR /.*[Mm]ini[Dd]ump.*/ OR /.*comsvcs.*/ OR /.*[Pp]rocdump.*[Ll]sass.*/ OR /.*sekurlsa.*/)
    pivot_on: host
    window: 2h
  - name: Dump file staging and compression
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*\.[Dd][Mm][Pp].*/ OR /.*[Cc]ompress-[Aa]rchive.*/ OR /.*7z.*\.dmp.*/)
    pivot_on: host
    window: 4h
  - name: Process access to lsass
    query: data_win_system_eventID:10 AND data_win_eventdata_targetImage:/.*[Ll]sass\.exe/
    pivot_on: host
    window: 2h
  - name: Offline credential store extraction
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*reg.* save .*(sam|system|security).*/ OR /.*ntdsutil.*/ OR /.*[Vv]ssadmin.*/ OR /.*esentutl.*/)
    pivot_on: host
    window: 4h
  - name: Lateral movement with harvested credentials
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Pp]ass-?[Tt]he-?[Hh]ash.*/ OR /.*psexec.*/ OR /.*wmiexec.*/ OR /.*sekurlsa::pth.*/)
    pivot_on: user
    window: 6h
