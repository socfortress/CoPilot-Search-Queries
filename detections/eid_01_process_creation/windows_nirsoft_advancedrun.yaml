name: Windows NirSoft AdvancedRun
id: Windows-NirSoft-AdvancedRun
version: 8
schema_version: 1
date: '2025-05-02'
author: SOCFortress LLC
status: production
type: TTP
description: >
  Detects execution of AdvancedRun.exe (NirSoft), a tool with capabilities
  similar to PsExec for remote code execution and configuration-based automation.
  Detection focuses on common command-line arguments (EXEFilename, /cfg, RunAs,
  WindowState) used in both legitimate and malicious contexts. Abused by destructive
  malware including WhisperGate targeting Ukrainian organizations.
  MITRE ATT&CK: T1588.002 (Obtain Capabilities: Tool).

data_source:
  - Sysmon EventID 1 (ProcessCreate)

search:
  query:
    bool:
      must:
        - term:
            agent_name: "AGENT_NAME"
        - term:
            agent_labels_customer: "CUSTOMER_CODE"
        - term:
            data_win_system_eventID: "1"
        - wildcard:
            data_win_eventdata_image: "*\\advancedrun.exe"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine: "*EXEFilename*"
              - wildcard:
                  data_win_eventdata_commandLine: "*/cfg*"
              - wildcard:
                  data_win_eventdata_commandLine: "*RunAs*"
              - wildcard:
                  data_win_eventdata_commandLine: "*WindowState*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "START_TIME"
              lte: "END_TIME"

parameters:
  - name: AGENT_NAME
    default: "DESKTOP-AM0HLGE"
  - name: CUSTOMER_CODE
    default: "lab"
  - name: START_TIME
    default: "now-24h"
  - name: END_TIME
    default: "now"

how_to_implement: >
  Requires Sysmon EventID 1 (ProcessCreate) flowing to the Wazuh Indexer.
  Fields data_win_eventdata_image and data_win_eventdata_commandLine are
  confirmed working across all EventID 1 detections in this environment.
  Field-validated based on established EventID 1 detection patterns.

known_false_positives: >
  False positives are limited given the specificity of AdvancedRun.exe.
  Filter based on known legitimate administrative usage if present in
  the environment.

references:
  - http://www.nirsoft.net/utils/advanced_run.html
  - https://www.microsoft.com/security/blog/2022/01/15/destructive-malware-targeting-ukrainian-organizations/
  - https://attack.mitre.org/techniques/T1588/002/

response:
  message: >
    AdvancedRun.exe execution detected on $agent_name$ by $data_win_eventdata_user$.
    Parent: $data_win_eventdata_parentImage$.
    Command: $data_win_eventdata_commandLine$.
    MITRE ATT&CK: T1588.002
  risk_score: 60
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 60
    - field: data_win_eventdata_user
      type: user
      score: 60
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: parent_process_name
    - field: data_win_eventdata_image
      type: process_name

tags:
  analytic_story:
    - Ransomware
    - Unusual Processes
    - Data Destruction
    - WhisperGate
  asset_type: Endpoint
  mitre_attack_id:
    - T1588.002
  custom_tags:
    - advancedrun
    - nirsoft
    - lolbins
    - remote_execution
    - tool_abuse
  product:
    - Wazuh
  security_domain: endpoint

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d2b749ee-4225-417e-b20e-a8d2193cbb84
    name: PUA - AdvancedRun Execution
    reason: Same binary detected by generic execution logic.
  - id: fa00b701-44c6-4679-994d-5a18afa8a707
    name: PUA - AdvancedRun Suspicious Execution
    reason: Flags RunAs SYSTEM/TrustedInstaller use, the privilege-escalation core of AdvancedRun abuse.
  - id: Windows-NirSoft-Utilities
    name: Windows NirSoft Utilities
    reason: Other NirSoft tools are typically dropped alongside AdvancedRun.
  - id: detection-of-tools-built-by-nirsoft-001
    name: Detection of Tools Built by NirSoft
    reason: Detects other NirSoft tools staged in the same intrusion.
  - id: windows-attempt-stop-security-service-001
    name: Windows Attempt To Stop Security Service
    reason: AdvancedRun as SYSTEM/TrustedInstaller is used to stop Defender and security services (WhisperGate).
  - id: fdfcbd78-48f1-4a4b-90ac-d82241e368c5
    name: PsExec Service Execution
    reason: Alternate privileged-execution tooling in the same attack chain.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: AdvancedRun executions and config
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*[Aa]dvanced[Rr]un.*/ OR data_win_eventdata_originalFileName:/.*[Aa]dvanced[Rr]un.*/ OR data_win_eventdata_commandLine:/.*(EXEFilename|RunAs).*/)
    pivot_on: host
    window: 4h
  - name: Defender and security service tampering
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(WinDefend|Set-MpPreference|DisableRealtimeMonitoring|[Ss]c(\.exe)? (stop|delete|config)|net stop).*/
    pivot_on: host
    window: 4h
  - name: NirSoft tool file drops
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*([Aa]dvanced[Rr]un|[Nn]ir[Cc]md|[Nn]ir[Ss]oft).*/
    pivot_on: host
    window: 4h
  - name: Children of AdvancedRun running as SYSTEM or TrustedInstaller
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Aa]dvanced[Rr]un.*/ AND data_win_eventdata_user:/.*(SYSTEM|TrustedInstaller).*/
    pivot_on: host
    window: 4h
  - name: Wiper or recovery-inhibit commands
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(vssadmin.*delete|bcdedit|wevtutil.* cl|cipher.*\/w|diskpart).*/
    pivot_on: host
    window: 4h
