name: Monitoring For Persistence Via BITS
id: b9cbbc17-d00d-4e3d-a827-b06d03d2380d
version: 1
schema_version: "1.0"
date: "2024-01-25"
author: Sreeman
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: b9cbbc17-d00d-4e3d-a827-b06d03d2380d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  BITS will allow you to schedule a command to execute after a successful
  download to notify you that the job is finished. When the job runs on the
  system the command specified in the BITS job will be executed. This can be
  abused by actors to create a backdoor within the system and for persistence.
  It will be chained in a BITS job to schedule the download of
  malware/additional binaries and execute the program after being downloaded.
  MITRE ATT&CK: T1197.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\bitsadmin.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "bitsadmin.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*/SetNotifyCmdLine*"
                          case_insensitive: true
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*%COMSPEC%*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*cmd.exe*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*regsvr32.exe*"
                                case_insensitive: true
                        minimum_should_match: 1
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*/Addfile*"
                          case_insensitive: true
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*http:*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*https:*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*ftp:*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*ftps:*"
                                case_insensitive: true
                        minimum_should_match: 1
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\bitsadmin.exe'; data_win_eventdata_originalFileName equals 'bitsadmin.exe';
  data_win_eventdata_commandLine matches '*/SetNotifyCmdLine*', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.fireeye.com/blog/threat-research/2020/10/kegtap-and-singlemalt-with-a-ransomware-chaser.html
  - http://0xthem.blogspot.com/2014/03/t-emporal-persistence-with-and-schtasks.html
  - https://isc.sans.edu/diary/Wipe+the+drive+Stealthy+Malware+Persistence+Mechanism+-+Part+1/15394
  - https://attack.mitre.org/techniques/T1197/

response:
  message: >
    Monitoring For Persistence Via BITS detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1197
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1197
  custom_tags:
    - monitoring
    - persistence
    - process_creation
    - sysmon
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]/) AND ((data_win_eventdata_commandLine:/.*\/[Ss][Ee][Tt][Nn][Oo][Tt][Ii][Ff][Yy][Cc][Mm][Dd][Ll][Ii][Nn][Ee].*/ AND (data_win_eventdata_commandLine:/.*%[Cc][Oo][Mm][Ss][Pp][Ee][Cc]%.*/ OR data_win_eventdata_commandLine:/.*[Cc][Mm][Dd]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee].*/)) OR (data_win_eventdata_commandLine:/.*\/[Aa][Dd][Dd][Ff][Ii][Ll][Ee].*/ AND (data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp]:.*/ OR data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp][Ss]:.*/ OR data_win_eventdata_commandLine:/.*[Ff][Tt][Pp]:.*/ OR data_win_eventdata_commandLine:/.*[Ff][Tt][Pp][Ss]:.*/)))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d059842b-6b9d-4ed1-b5c3-5b89143c6ede
    name: File Download Via Bitsadmin
    reason: The BITS job carrying the notify command usually also downloads the payload.
  - id: 2ddef153-167b-4e89-86b6-757a9e65dcac
    name: File Download Via Bitsadmin To A Suspicious Target Folder
    reason: Staging of the payload that the SetNotifyCmdLine job will execute.
  - id: 5b80a791-ad9b-4b75-bcc1-ad4e1e89c200
    name: File With Suspicious Extension Downloaded Via Bitsadmin
    reason: Downloaded executable or script paired with the BITS persistence job.
  - id: 99c840f2-2012-46fd-9141-c761987550ef
    name: Suspicious Download From Direct IP Via Bitsadmin
    reason: Direct-IP download is the typical C2 staging leg before notify-command execution.
  - id: 8518ed3d-f7c9-4601-a26c-f361a4256a0c
    name: Suspicious Download From File-Sharing Website Via Bitsadmin
    reason: Alternative payload source for the same BITS abuse.
  - id: 39e2605a-90d8-11eb-899e-acde48001122
    name: PowerShell Start-BitsTransfer
    reason: PowerShell equivalent of BITS abuse; the same actor may mix both tools.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: All bitsadmin activity
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*[Bb]itsadmin.*/
    pivot_on: host
    window: 4h
  - name: BITS client job lifecycle events
    query: data_win_system_providerName:"Microsoft-Windows-Bits-Client"
    pivot_on: host
    window: 4h
  - name: Processes spawned by the BITS service host
    query: data_win_system_eventID:1 AND data_win_eventdata_parentCommandLine:/.*[Ss]vchost.*BITS.*/
    pivot_on: host
    window: 4h
  - name: Executables and scripts dropped in user-writable paths
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*(Temp|AppData|ProgramData|Users.Public).*\.(exe|dll|ps1|bat|vbs|js)/
    pivot_on: host
    window: 2h
