name: Windows Office Product Spawned Child Process For Download
id: Windows-Office-Product-Spawned-Child-Process-For-Download
version: 6
schema_version: 1
date: '2025-09-18'
author: SOCFortress LLC
status: production
type: TTP
description: >
  Detects Office applications (Word, Excel, PowerPoint, OneNote, etc.) spawning
  child processes with HTTP/HTTPS URLs in the command line, excluding common
  browsers. This pattern indicates malicious documents using LOLBins for payload
  delivery — a core technique in spearphishing campaigns. Associated with
  CVE-2023-36884, PlugX, NjRAT, APT37, and Formbook delivery via trojanized
  OneNote documents.
  MITRE ATT&CK: T1566.001 (Spearphishing Attachment).

data_source:
  - Sysmon EventID 1 (ProcessCreate)

search:
  query:
    bool:
      must:
        - term:
            agent_name: "AGENT_NAME"
        - term:
            agent_labels_customer: "CUSTOMER_CODE"
        - term:
            data_win_system_eventID: "1"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_parentImage: "*\\winword.exe"
              - wildcard:
                  data_win_eventdata_parentImage: "*\\excel.exe"
              - wildcard:
                  data_win_eventdata_parentImage: "*\\powerpnt.exe"
              - wildcard:
                  data_win_eventdata_parentImage: "*\\onenote.exe"
              - wildcard:
                  data_win_eventdata_parentImage: "*\\onenotem.exe"
              - wildcard:
                  data_win_eventdata_parentImage: "*\\outlook.exe"
              - wildcard:
                  data_win_eventdata_parentImage: "*\\msaccess.exe"
              - wildcard:
                  data_win_eventdata_parentImage: "*\\mspub.exe"
              - wildcard:
                  data_win_eventdata_parentImage: "*\\visio.exe"
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine: "*http:*"
              - wildcard:
                  data_win_eventdata_commandLine: "*https:*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "START_TIME"
              lte: "END_TIME"
      must_not:
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image: "*\\firefox.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\chrome.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\iexplore.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\msedge.exe"
            minimum_should_match: 1

parameters:
  - name: AGENT_NAME
    default: "DESKTOP-AM0HLGE"
  - name: CUSTOMER_CODE
    default: "lab"
  - name: START_TIME
    default: "now-24h"
  - name: END_TIME
    default: "now"

how_to_implement: >
  Requires Sysmon EventID 1 (ProcessCreate) flowing to the Wazuh Indexer.
  Fields data_win_eventdata_parentImage, data_win_eventdata_image, and
  data_win_eventdata_commandLine are confirmed working across all EventID 1
  detections in this environment. Field-validated based on established
  EventID 1 detection patterns. Add any additional browsers used in the
  environment to the must_not exclusion list to reduce false positives.

known_false_positives: >
  Default browser not included in the exclusion list may trigger false positives.
  Add any additional browsers present in the environment to the must_not clause.

references:
  - https://app.any.run/tasks/92d7ef61-bfd7-4c92-bc15-322172b4ebec/
  - https://www.trustwave.com/en-us/resources/blogs/spiderlabs-blog/trojanized-onenote-document-leads-to-formbook-malware/
  - https://attack.mitre.org/techniques/T1566/001/

response:
  message: >
    Office application spawned child process with HTTP/HTTPS URL on $agent_name$.
    Office parent: $data_win_eventdata_parentImage$.
    Child process: $data_win_eventdata_image$.
    Command: $data_win_eventdata_commandLine$.
    MITRE ATT&CK: T1566.001
  risk_score: 35
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 35
    - field: data_win_eventdata_user
      type: user
      score: 35
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: parent_process_name
    - field: data_win_eventdata_image
      type: process_name

tags:
  analytic_story:
    - Spearphishing Attachments
    - CVE-2023-36884 Office and Windows HTML RCE Vulnerability
    - PlugX
    - NjRAT
    - APT37 Rustonotto and FadeStealer
  asset_type: Endpoint
  mitre_attack_id:
    - T1566.001
  custom_tags:
    - office_macro
    - spearphishing
    - lolbins
    - download
    - malicious_document
  product:
    - Wazuh
  security_domain: endpoint

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 438025f9-5856-4663-83f7-52f878a70a50
    name: Suspicious Microsoft Office Child Process
    reason: Same Office-spawns-LOLBin chain, often hit by the same process tree.
  - id: c27515df-97a9-4162-8a60-dc0eeb51b775
    name: Suspicious Microsoft OneNote Child Process
    reason: OneNote embedded-script delivery (Formbook, trojanized notes) is part of this rule's campaign story.
  - id: 84b1706c-932a-44c4-ae28-892b28a25b94
    name: OneNote.EXE Execution of Malicious Embedded Scripts
    reason: OneNote launching embedded scripts precedes the download command.
  - id: 4ae3e30b-b03f-43aa-87e3-b622f4048eed
    name: Potential Arbitrary File Download Using Office Application
    reason: Office fetching remote content directly, an alternate download path in the same lure.
  - id: e1693bc8-7168-4eab-8718-cdcaa68a1738
    name: Suspicious WMIC Execution Via Office Process
    reason: Another Office-child execution route from the same malicious document.
  - id: aa3a6f94-890e-4e22-b634-ffdfd54792cc
    name: Suspicious Binary In User Directory Spawned From Office Application
    reason: Downloaded payload executing from a user directory under Office is the next stage.
  - id: 868955d9-697e-45d4-a3da-360cefd7c216
    name: Potential Exploitation Attempt From Office Application
    reason: Exploit-based (e.g. CVE-2023-36884) variant of the same Office-initiated chain.
  - id: cea72823-df4d-4567-950c-0b579eaf0846
    name: Potential Dropper Script Execution Via WScript/CScript/MSHTA
    reason: Downloaded content commonly executes through script hosts.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Payloads executing from user-writable paths under Office or its shells
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*(\\[Ww][Ii][Nn][Ww][Oo][Rr][Dd]\.[Ee][Xx][Ee]|\\[Ee][Xx][Cc][Ee][Ll]\.[Ee][Xx][Ee]|\\[Pp][Oo][Ww][Ee][Rr][Pp][Nn][Tt]\.[Ee][Xx][Ee]|\\[Oo][Nn][Ee][Nn][Oo][Tt][Ee]\.[Ee][Xx][Ee]|\\[Oo][Uu][Tt][Ll][Oo][Oo][Kk]\.[Ee][Xx][Ee]|\\[Mm][Ss][Pp][Uu][Bb]\.[Ee][Xx][Ee]|\\[Mm][Ss][Aa][Cc][Cc][Ee][Ss][Ss]\.[Ee][Xx][Ee]|\\[Vv][Ii][Ss][Ii][Oo]\.[Ee][Xx][Ee]|\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]|\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee])/ AND data_win_eventdata_image:/.*(\\[Uu][Ss][Ee][Rr][Ss]\\|\\[Tt][Ee][Mm][Pp]\\|\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\|\\[Pp][Uu][Bb][Ll][Ii][Cc]\\).*\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Downloaded executables, scripts or DLLs written to disk
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(\\[Tt][Ee][Mm][Pp]\\|\\[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]\\|\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\|\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\|\\[Pp][Uu][Bb][Ll][Ii][Cc]\\).*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Jj][Ss]|[Jj][Ss][Ee]|[Vv][Bb][Ss]|[Hh][Tt][Aa]|[Pp][Ss]1|[Bb][Aa][Tt]|[Ss][Cc][Rr]|[Ll][Nn][Kk])/
    pivot_on: host
    window: 2h
  - name: Script interpreters and downloaders fetching URLs
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]|\\[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]|\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp]\:.*/ OR data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp][Ss]\:.*/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Uu][Rr][Ll][Cc][Aa][Cc][Hh][Ee].*/)
    pivot_on: host
    window: 2h
  - name: Persistence set shortly after the download
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*\/[Cc][Rr][Ee][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ss][Tt][Aa][Rr][Tt][Uu][Pp].*/)
    pivot_on: host
    window: 4h
  - name: Network connections by Office and the interpreters it spawns
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*(\\[Ww][Ii][Nn][Ww][Oo][Rr][Dd]\.[Ee][Xx][Ee]|\\[Ee][Xx][Cc][Ee][Ll]\.[Ee][Xx][Ee]|\\[Pp][Oo][Ww][Ee][Rr][Pp][Nn][Tt]\.[Ee][Xx][Ee]|\\[Oo][Nn][Ee][Nn][Oo][Tt][Ee]\.[Ee][Xx][Ee]|\\[Oo][Uu][Tt][Ll][Oo][Oo][Kk]\.[Ee][Xx][Ee]|\\[Mm][Ss][Pp][Uu][Bb]\.[Ee][Xx][Ee]|\\[Mm][Ss][Aa][Cc][Cc][Ee][Ss][Ss]\.[Ee][Xx][Ee]|\\[Vv][Ii][Ss][Ii][Oo]\.[Ee][Xx][Ee]|\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 2h
