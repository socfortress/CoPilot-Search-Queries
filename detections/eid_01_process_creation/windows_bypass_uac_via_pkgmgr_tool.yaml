name: Windows Bypass UAC via Pkgmgr Tool
id: cce58e2c-988a-4319-9390-0daa9eefa3cd
version: 6
schema_version: 1
date: '2025-05-02'
author: SOCFortress LLC
status: production
type: Anomaly
description: >
  Detects execution of the deprecated pkgmgr.exe with an XML input file argument.
  pkgmgr.exe is a legacy Windows package manager that has been replaced by DISM
  but remains present on modern systems. Warzone RAT abuses this binary to bypass
  UAC by passing a crafted XML manifest, allowing silent package installation with
  elevated privileges without triggering a UAC prompt. Any execution of pkgmgr.exe
  with an XML file argument from a non-system parent process should be investigated.
  MITRE ATT&CK: T1548.002 (Abuse Elevation Control Mechanism: Bypass UAC).

data_source:
  - Sysmon EventID 1 (ProcessCreate)

search:
  query:
    bool:
      must:
        - term:
            agent_name: "AGENT_NAME"
        - term:
            agent_labels_customer: "CUSTOMER_CODE"
        - term:
            data_win_system_eventID: "1"
        - wildcard:
            data_win_eventdata_image: "*\\PkgMgr.exe"
        - wildcard:
            data_win_eventdata_commandLine: "*.xml*"
        - range:
            timestamp:
              gte: "START_TIME"
              lte: "END_TIME"

parameters:
  - name: AGENT_NAME
    default: "DESKTOP-AM0HLGE"
  - name: CUSTOMER_CODE
    default: "lab"
  - name: START_TIME
    default: "now-24h"
  - name: END_TIME
    default: "now"

how_to_implement: >
  Requires Sysmon EventID 1 (ProcessCreate) flowing to the Wazuh Indexer.
  Validated on DESKTOP-AM0HLGE with PkgMgr.exe /n:C:\Windows\Temp\test.xml
  executed from PowerShell. Important: data_win_eventdata_image stores the
  binary as "PkgMgr.exe" (mixed case) — Elasticsearch wildcard queries are
  case-sensitive on keyword fields, use "*\\PkgMgr.exe" not "*\\pkgmgr.exe".
  Confirmed field names: data_win_eventdata_image, data_win_eventdata_commandLine,
  data_win_eventdata_parentImage, data_win_eventdata_user.

known_false_positives: >
  Legitimate use of pkgmgr.exe is extremely rare on modern Windows systems as
  it has been replaced by DISM. Some legacy software deployment tools may invoke
  it. Filter on data_win_eventdata_parentImage for known deployment tool paths
  (e.g. SCCM, software distribution agents). Any execution from user-space
  parent processes should be treated as high priority.

references:
  - https://asec.ahnlab.com/en/17692/
  - https://www.blackberry.com/us/en/solutions/endpoint-security/ransomware-protection/warzone
  - https://attack.mitre.org/techniques/T1548/002/

response:
  message: >
    pkgmgr.exe executed with XML argument on $agent_name$.
    Command line: $data_win_eventdata_commandLine$.
    Parent process: $data_win_eventdata_parentImage$.
    User: $data_win_eventdata_user$.
    Possible UAC bypass via deprecated package manager (Warzone RAT TTP).
    MITRE ATT&CK: T1548.002
  risk_score: 9
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 9
    - field: data_win_eventdata_user
      type: user
      score: 9
  threat_objects:
    - field: data_win_eventdata_image
      type: process_name

tags:
  analytic_story:
    - Warzone RAT
    - UAC Bypass
  asset_type: Endpoint
  mitre_attack_id:
    - T1548.002
  custom_tags:
    - pkgmgr
    - uac_bypass
    - warzone_rat
    - privilege_escalation
    - deprecated_binary
  product:
    - Wazuh
  security_domain: endpoint

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a743ceba-c771-4d75-97eb-8a90f7f4844c
    name: UAC Bypass Using PkgMgr and DISM
    reason: Same pkgmgr/DISM UAC bypass seen by a sibling pattern; corroborates the technique.
  - id: 853e74f9-9392-4935-ad3b-2e8c040dae86
    name: UAC Bypass Using DismHost
    reason: DismHost loading a hijacked DLL is the elevated stage pkgmgr/DISM abuse produces.
  - id: 4ac47ed3-44c2-4b1f-9d51-bf46e8914126
    name: TrustedPath UAC Bypass Pattern
    reason: Trusted-path UAC bypass is another auto-elevate trick chained when one fails.
  - id: d38d2fa4-98e6-4a24-aff1-410b0c9ad177
    name: HackTool - UACMe Akagi Execution
    reason: UACMe/Akagi runs many UAC bypass methods including pkgmgr-style ones.
  - id: 178e615d-e666-498b-9630-9ed363038101
    name: Elevated System Shell Spawned From Uncommon Parent Location
    reason: Elevated shell from an uncommon parent is the visible result once UAC is bypassed.
  - id: windows-powershell-disable-security-monitoring-001
    name: Windows PowerShell Disable Security Monitoring
    reason: Warzone RAT disables Defender once elevated; this is the likely next step.
  - id: windows-dism-remove-defender-001
    name: Windows DISM Remove Defender
    reason: DISM is also used to strip Defender; same tool family and privilege goal.
  - id: 24357373-078f-44ed-9ac4-6d334a668a11
    name: Direct Autorun Keys Modification
    reason: Autorun key modification is the persistence step after elevation.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Children of pkgmgr, DISM or DismHost
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Pp][Kk][Gg][Mm][Gg][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Dd][Ii][Ss][Mm]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Dd][Ii][Ss][Mm][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/)
    pivot_on: host
    window: 2h
  - name: DismHost or pkgmgr run from a user-writable path
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Dd][Ii][Ss][Mm][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Kk][Gg][Mm][Gg][Rr]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_image:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/)
    pivot_on: host
    window: 2h
  - name: Defender exclusions or real-time protection disabled
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Aa][Dd][Dd]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee][Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Ee][Xx][Cc][Ll][Uu][Ss][Ii][Oo][Nn][Pp][Aa][Tt][Hh].*/ OR data_win_eventdata_commandLine:/.*[Ee][Xx][Cc][Ll][Uu][Ss][Ii][Oo][Nn][Ee][Xx][Tt][Ee][Nn][Ss][Ii][Oo][Nn].*/)
    pivot_on: host
    window: 4h
  - name: Run key or scheduled task persistence
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss] /[Cc][Rr][Ee][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee] /[Cc][Rr][Ee][Aa][Tt][Ee].*/)
    pivot_on: host
    window: 6h
  - name: Package manifest XML written to a staging path
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\.[Xx][Mm][Ll]/) AND (data_win_eventdata_targetFilename:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/) AND (data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Pp][Kk][Gg][Mm][Gg][Rr]\.[Ee][Xx][Ee].*/)
    pivot_on: host
    window: 2h
