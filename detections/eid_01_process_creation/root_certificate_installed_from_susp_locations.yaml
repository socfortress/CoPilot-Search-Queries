name: Root Certificate Installed From Susp Locations
id: 5f6a601c-2ecb-498b-9c33-660362323afa
version: 1
schema_version: "1.0"
date: "2023-01-16"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 5f6a601c-2ecb-498b-9c33-660362323afa
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Adversaries may install a root certificate on a compromised system to avoid
  warnings when connecting to adversary controlled web servers. MITRE ATT&CK:
  T1553.004.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*Import-Certificate*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* -FilePath *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*Cert:\\\\LocalMachine\\\\Root*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\AppData\\\\Local\\\\Temp\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*:\\\\Windows\\\\TEMP\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Desktop\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Downloads\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Perflogs\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*:\\\\Users\\\\Public\\\\*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*Import-Certificate*'; data_win_eventdata_commandLine matches '* -FilePath
  *'; data_win_eventdata_commandLine matches '*Cert:\LocalMachine\Root*', among
  other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.microsoft.com/security/blog/2022/09/07/profiling-dev-0270-phosphorus-ransomware-operations/
  - https://learn.microsoft.com/en-us/powershell/module/pki/import-certificate?view=windowsserver2022-ps
  - https://attack.mitre.org/techniques/T1553/004/

response:
  message: >
    Root Certificate Installed From Susp Locations detected on host
    $agent_name$. Matched data_win_eventdata_commandLine:
    $data_win_eventdata_commandLine$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1553.004
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1553.004
  custom_tags:
    - certificate
    - installed
    - locations
    - process_creation
    - sysmon
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Ii][Mm][Pp][Oo][Rr][Tt]-[Cc][Ee][Rr][Tt][Ii][Ff][Ii][Cc][Aa][Tt][Ee].*/ AND data_win_eventdata_commandLine:/.* -[Ff][Ii][Ll][Ee][Pp][Aa][Tt][Hh] .*/ AND data_win_eventdata_commandLine:/.*[Cc][Ee][Rr][Tt]:\\[Ll][Oo][Cc][Aa][Ll][Mm][Aa][Cc][Hh][Ii][Nn][Ee]\\[Rr][Oo][Oo][Tt].*/ AND (data_win_eventdata_commandLine:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_commandLine:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Dd][Ee][Ss][Kk][Tt][Oo][Pp]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss]\\.*/ OR data_win_eventdata_commandLine:/.*:\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 42821614-9264-4761-acfc-5772c3286f76
    name: Root Certificate Installed - PowerShell
    reason: Same PowerShell root-store install seen in script-block logs; confirms the content.
  - id: d2125259-ddea-4c1c-9c22-977eb5b29cf0
    name: New Root Certificate Installed Via Certutil.EXE
    reason: Attackers alternate Import-Certificate with certutil -addstore to plant roots.
  - id: ff992eac-6449-4c60-8c1d-91c9722a1d48
    name: New Root Certificate Installed Via CertMgr.EXE
    reason: certmgr is another way to add a root; co-occurs when tooling varies.
  - id: d223b46b-5621-4037-88fe-fda32eead684
    name: New Root or CA or AuthRoot Certificate to Store
    reason: Registry write to the Root store is the persistent artefact of this installation.
  - id: 19b08b1c-861d-4e75-a1ef-ea0c1baf202b
    name: Suspicious Download Via Certutil.EXE
    reason: The cert file is typically downloaded just before import, often via certutil.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Certificate download or staging
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_commandLine:/.*[Uu][Rr][Ll][Cc][Aa][Cc][Hh][Ee].*/) OR (data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ AND data_win_eventdata_commandLine:/.*\.[Cc][Ee][Rr].*/) OR (data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee].*/ AND data_win_eventdata_commandLine:/.*\.[Cc][Rr][Tt].*/))
    pivot_on: host
    window: 4h
  - name: Other root-store installs
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*-[Aa][Dd][Dd][Ss][Tt][Oo][Rr][Ee].*/ OR data_win_eventdata_commandLine:/.*[Cc][Ee][Rr][Tt]:\\[Ll][Oo][Cc][Aa][Ll][Mm][Aa][Cc][Hh][Ii][Nn][Ee]\\[Rr][Oo][Oo][Tt].*/ OR data_win_eventdata_commandLine:/.*[Cc][Ee][Rr][Tt][Mm][Gg][Rr].*/)
    pivot_on: host
    window: 4h
  - name: Registry Root store modification
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Cc][Ee][Rr][Tt][Ii][Ff][Ii][Cc][Aa][Tt][Ee][Ss]\\.*/ AND data_win_eventdata_targetObject:/.*[Rr][Oo][Oo][Tt].*/
    pivot_on: host
    window: 4h
  - name: Certificate files created
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\.[Cc][Ee][Rr].*/ OR data_win_eventdata_targetFilename:/.*\.[Cc][Rr][Tt].*/ OR data_win_eventdata_targetFilename:/.*\.[Pp][Ff][Xx].*/)
    pivot_on: host
    window: 2h
  - name: Proxy or hosts changes enabling interception
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Pp][Rr][Oo][Xx][Yy][Ss][Ee][Rr][Vv][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Ww][Ii][Nn][Hh][Tt][Tt][Pp] [Ss][Ee][Tt] [Pp][Rr][Oo][Xx][Yy].*/ OR data_win_eventdata_commandLine:/.*[Dd][Rr][Ii][Vv][Ee][Rr][Ss]\\[Ee][Tt][Cc]\\[Hh][Oo][Ss][Tt][Ss].*/)
    pivot_on: host
    window: 6h
