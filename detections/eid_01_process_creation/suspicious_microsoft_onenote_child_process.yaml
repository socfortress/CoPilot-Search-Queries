status: experimental
type: TTP

description: >
  Detects suspicious child processes of the Microsoft OneNote application. This
  may indicate an attempt to execute malicious embedded objects from a .one
  file. MITRE ATT&CK: T1566, T1566.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_parentImage:
              value: "*\\\\onenote.exe"
              case_insensitive: true
        - bool:
            should:
              - term:
                  data_win_eventdata_originalFileName:
                    value: "bitsadmin.exe"
                    case_insensitive: true
              - term:
