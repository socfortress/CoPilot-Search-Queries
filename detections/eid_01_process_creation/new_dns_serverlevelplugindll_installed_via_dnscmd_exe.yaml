name: New DNS ServerLevelPluginDll Installed Via Dnscmd.EXE
id: f63b56ee-3f79-4b8a-97fb-5c48007e8573
version: 1
schema_version: "1.0"
date: "2023-02-05"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: f63b56ee-3f79-4b8a-97fb-5c48007e8573
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the installation of a DNS plugin DLL via ServerLevelPluginDll
  parameter in registry, which can be used to execute code in context of the DNS
  server (restart required). MITRE ATT&CK: T1574.001, T1112.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\dnscmd.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*/config*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*/serverlevelplugindll*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\dnscmd.exe'; data_win_eventdata_commandLine matches '*/config*';
  data_win_eventdata_commandLine matches '*/serverlevelplugindll*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://medium.com/@esnesenon/feature-not-bug-dnsadmin-to-dc-compromise-in-one-line-a0f779b8dc83
  - https://blog.3or.de/hunting-dns-server-level-plugin-dll-injection.html
  - https://attack.mitre.org/techniques/T1574/001/
  - https://attack.mitre.org/techniques/T1112/

response:
  message: >
    New DNS ServerLevelPluginDll Installed Via Dnscmd.EXE detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
    MITRE ATT&CK: T1574.001, T1112
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.001
    - T1112
  custom_tags:
    - serverlevelplugindll
    - installed
    - dnscmd
    - process_creation
    - sysmon
    - privilege_escalation
    - persistence
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Dd][Nn][Ss][Cc][Mm][Dd]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*\/[Cc][Oo][Nn][Ff][Ii][Gg].*/ AND data_win_eventdata_commandLine:/.*\/[Ss][Ee][Rr][Vv][Ee][Rr][Ll][Ee][Vv][Ee][Ll][Pp][Ll][Uu][Gg][Ii][Nn][Dd][Ll][Ll].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b6457d63-d2a2-4e29-859d-4e7affc153d1
    name: Potential Discovery Activity Via Dnscmd.EXE
    reason: Dnscmd discovery on the same DNS server typically precedes the plugin DLL install.
  - id: b5281f31-f9cc-4d0d-95d0-45b91c45b487
    name: DNS RCE CVE-2020-1350
    reason: DNS server code-execution exploitation (SIGRed) is an alternative route to code in dns.exe on the same host.
  - id: 0f0450f3-8b47-441e-a31b-15a91dc243e2
    name: Potential DLL File Download Via PowerShell Invoke-WebRequest
    reason: DLL download via PowerShell often supplies the plugin DLL staged before the registry change.
  - id: 70bc5215-526f-4477-963c-a47a5c9ebd12
    name: Potential Active Directory Enumeration Using AD Module - ProcCreation
    reason: AD enumeration by a DnsAdmins member shows how the attacker identified the DNS server and privileges.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Dnscmd activity on host
    query: data_win_system_eventID:1 AND data_win_eventdata_image:*[Dd][Nn][Ss][Cc][Mm][Dd].exe
    pivot_on: host
    window: 24h
  - name: ServerLevelPluginDll registry value set
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:*[Ss]erver[Ll]evel[Pp]lugin[Dd]ll*
    pivot_on: host
    window: 24h
  - name: DNS service stop or restart
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:*[Nn]et*[Ss]top*[Dd][Nn][Ss]* OR data_win_eventdata_commandLine:*[Ss]c*[Ss]top*[Dd][Nn][Ss]* OR data_win_eventdata_commandLine:*[Rr]estart-[Ss]ervice*[Dd][Nn][Ss]*)
    pivot_on: host
    window: 24h
  - name: Non-system DLL loaded into dns.exe
    query: data_win_system_eventID:7 AND data_win_eventdata_image:*\[Dd][Nn][Ss].exe AND NOT data_win_eventdata_imageLoaded:*\[Ww]indows\*
    pivot_on: host
    window: 24h
  - name: DLL written to disk on DNS server
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:*.dll AND NOT data_win_eventdata_targetFilename:*\[Ww]indows\*
    pivot_on: host
    window: 24h
