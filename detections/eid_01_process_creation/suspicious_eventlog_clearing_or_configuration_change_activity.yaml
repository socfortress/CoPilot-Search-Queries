  - https://gist.github.com/fovtran/ac0624983c7722e80a8f5a4babb170ee
  - https://jdhnet.wordpress.com/2017/12/19/changing-the-location-of-the-windows-event-logs/
  - https://www.linkedin.com/posts/huntress-labs_when-a-sketchy-incident-hits-your-network-activity-7304940371078238208-Th_l/?utm_source=share&utm_medium=member_desktop&rcm=ACoAAAJTlRcB28IaUtg03HUU-IdliwzoAL1flGc
  - https://stackoverflow.com/questions/66011412/how-to-clear-a-event-log-in-powershell-7
  - https://learn.microsoft.com/en-us/dotnet/api/system.diagnostics.eventing.reader.eventlogsession.clearlog?view=windowsdesktop-9.0&viewFallbackFrom=dotnet-plat-ext-5.0#System_Diagnostics_Eventing_Reader_EventLogSession_ClearLog_System_String_
  - https://learn.microsoft.com/en-us/dotnet/api/system.diagnostics.eventlog.clear
  - https://attack.mitre.org/techniques/T1685/005/
  - https://attack.mitre.org/techniques/T1685/001/

response:
  message: >
    Suspicious Eventlog Clearing or Configuration Change Activity detected on
    host $agent_name$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1685.005, T1685.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685.005
    - T1685.001
  custom_tags:
    - eventlog
    - clearing
    - configuration
    - process_creation
    - sysmon
    - defense_impairment
    - car_2016_04_002
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (((data_win_eventdata_image:/.*\\[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*[Cc][Ll][Ee][Aa][Rr]-[Ll][Oo][Gg] .*/ OR data_win_eventdata_commandLine:/.* [Cc][Ll] .*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Ll][Oo][Gg] .*/ OR data_win_eventdata_commandLine:/.* [Ss][Ll] .*/ OR data_win_eventdata_commandLine:/.*[Ll][Ff][Nn]:.*/)) OR ((data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]_[Ii][Ss][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*[Cc][Ll][Ee][Aa][Rr]-[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg] .*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Mm][Oo][Vv][Ee]-[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg] .*/ OR data_win_eventdata_commandLine:/.*[Ll][Ii][Mm][Ii][Tt]-[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg] .*/ OR data_win_eventdata_commandLine:/.*[Cc][Ll][Ee][Aa][Rr]-[Ww][Ii][Nn][Ee][Vv][Ee][Nn][Tt] .*/ OR (data_win_eventdata_commandLine:/.*[Ee][Vv][Ee][Nn][Tt][Ii][Nn][Gg]\.[Rr][Ee][Aa][Dd][Ee][Rr]\.[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg][Ss][Ee][Ss][Ss][Ii][Oo][Nn].*/ AND data_win_eventdata_commandLine:/.*[Cc][Ll][Ee][Aa][Rr][Ll][Oo][Gg].*/) OR (data_win_eventdata_commandLine:/.*[Dd][Ii][Aa][Gg][Nn][Oo][Ss][Tt][Ii][Cc][Ss]\.[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg].*/ AND data_win_eventdata_commandLine:/.*[Cc][Ll][Ee][Aa][Rr].*/))) OR ((data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]_[Ii][Ss][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Cc][Ll][Ee][Aa][Rr][Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg].*/)) AND _exists_:data_win_eventdata_parentImage AND _exists_:data_win_eventdata_commandLine AND NOT ((data_win_eventdata_parentImage:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Ww][Oo][Ww]64\\[Mm][Ss][Ii][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Mm][Ss][Ii][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.* [Ss][Ll] .*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 236e7c8e-c9d9-11eb-a824-acde48001122
    name: Disable Logs Using WevtUtil
    reason: 'Same wevtutil tampering family: disabling a channel (sl /e:false) is the quieter sibling of clearing and is often run in the same script.'
  - id: 0a13e132-651d-11eb-ae93-0242ac130002
    name: Audit Policy Tampering Via Auditpol
    reason: Attackers blind the Security log by turning off audit categories alongside clearing existing events.
  - id: caf201a9-c2ce-4a26-9c3a-2b9525413711
    name: Potentially Suspicious Call To Win32_NTEventlogFile Class
    reason: WMI ClearEventLog/BackupEventlog is an alternate clearing route used when wevtutil is monitored.
  - id: a238b5d0-ce2d-4414-a676-7a531b3d13d6
    name: ETW Trace Evasion Activity
    reason: ETW session tampering is a parallel defense-evasion step taken with log clearing to starve telemetry.
  - id: cd1f961e-0b96-436b-b7c6-38da4583ec00
    name: Suspicious Windows Trace ETW Session Tamper Via Logman.EXE
    reason: Logman stopping or deleting trace sessions accompanies clearing as part of anti-forensics cleanup.
  - id: 1a4bd6af-99ac-4466-b5b2-7b72b4a05462
    name: Security Event Logging Disabled via MiniNt Registry Key - Process
    reason: MiniNt key creation disables Security event logging, an alternate way to cover tracks before or after clearing.
  - id: 87911521-7098-470b-a459-9a57fc80bdfd
    name: Sysmon Configuration Update
    reason: Changing the Sysmon config removes the process telemetry this rule relies on; an actor clearing logs often neuters Sysmon too.
  - id: 21ff4ca9-f13a-41ad-b828-0077b2af2e40
    name: Deletion of Volume Shadow Copies via WMI with PowerShell
    reason: Ransomware playbooks pair log clearing with shadow copy deletion immediately before encryption.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other log tampering tools on host
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*[Ww]evtutil\.exe/ OR data_win_eventdata_image:/.*[Aa]uditpol\.exe/ OR data_win_eventdata_image:/.*[Ll]ogman\.exe/ OR data_win_eventdata_image:/.*[Ff]ltmc\.exe/ OR data_win_eventdata_commandLine:/.*([Cc]lear-[Ee]vent[Ll]og|[Ss]et-[Ee]vent[Ll]og|[Rr]emove-[Ee]vent[Ll]og).*/)
    pivot_on: host
    window: 2h
  - name: Shadow copy and backup destruction
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*[Vv]ssadmin.*[Dd]elete.*/ OR data_win_eventdata_commandLine:/.*[Ww]mic.*[Ss]hadowcopy.*[Dd]elete.*/ OR data_win_eventdata_commandLine:/.*[Bb]cdedit.*([Rr]ecoveryenabled|[Ii]gnoreallfailures).*/ OR data_win_eventdata_commandLine:/.*[Ww]badmin.*[Dd]elete.*/)
    pivot_on: host
    window: 2h
  - name: 'Defense evasion: Defender and firewall tampering'
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*[Ss]et-[Mm]p[Pp]reference.*/ OR data_win_eventdata_commandLine:/.*[Dd]isable[Rr]ealtime[Mm]onitoring.*/ OR data_win_eventdata_commandLine:/.*[Nn]etsh.*advfirewall.*off.*/ OR data_win_eventdata_commandLine:/.*[Ss]c(\.exe)? +(stop|config).*/)
    pivot_on: host
    window: 2h
  - name: Account and privilege tooling by same user
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*[Nn]et1? +(user|localgroup|group).*/ OR data_win_eventdata_commandLine:/.*[Ww]hoami.*\/(priv|all).*/ OR data_win_eventdata_image:/.*[Pp]s[Ee]xec.*\.exe/ OR data_win_eventdata_commandLine:/.*[Ss]chtasks.*\/[Cc]reate.*/)
    pivot_on: user
    window: 6h
  - name: Execution from user-writable paths
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*\\\\([Tt]emp|[Pp]rogram[Dd]ata|[Pp]ublic|[Aa]pp[Dd]ata)\\\\.*/)
    pivot_on: host
    window: 6h
