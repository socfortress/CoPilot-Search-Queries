  - https://github.com/lkys37en/Start-ADEnum/blob/5b42c54215fe5f57fc59abc52c20487d15764005/Functions/Start-ADEnum.ps1#L680
  - https://github.com/projectHULK/AD_Recon/blob/dde2daba9b3393a9388cbebda87068972cc0bd3b/SecurityAssessment.ps1#L2699
  - https://github.com/802-1x/Compliance/blob/2e53df8b6e89686a0b91116b3f42c8f717dca820/Ping%20Castle/Get-PingCastle-HTMLComplianceReport.ps1#L8
  - https://github.com/EvotecIT/TheDashboard/blob/481a9ce8f82f2fd55fe65220ee6486bae6df0c9d/Examples/RunReports/PingCastle.ps1
  - https://attack.mitre.org/techniques/T1595/

response:
  message: >
    PUA - PingCastle Execution From Potentially Suspicious Parent detected on
    host $agent_name$. Matched data_win_eventdata_parentCommandLine:
    $data_win_eventdata_parentCommandLine$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1595
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_parentCommandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1595
  custom_tags:
    - pingcastle
    - parent
    - process_creation
    - sysmon
    - reconnaissance
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_parentCommandLine:/.*\.[Bb][Aa][Tt].*/ OR data_win_eventdata_parentCommandLine:/.*\.[Cc][Hh][Mm].*/ OR data_win_eventdata_parentCommandLine:/.*\.[Cc][Mm][Dd].*/ OR data_win_eventdata_parentCommandLine:/.*\.[Hh][Tt][Aa].*/ OR data_win_eventdata_parentCommandLine:/.*\.[Hh][Tt][Mm].*/ OR data_win_eventdata_parentCommandLine:/.*\.[Hh][Tt][Mm][Ll].*/ OR data_win_eventdata_parentCommandLine:/.*\.[Jj][Ss].*/ OR data_win_eventdata_parentCommandLine:/.*\.[Ll][Nn][Kk].*/ OR data_win_eventdata_parentCommandLine:/.*\.[Pp][Ss]1.*/ OR data_win_eventdata_parentCommandLine:/.*\.[Vv][Bb][Ee].*/ OR data_win_eventdata_parentCommandLine:/.*\.[Vv][Bb][Ss].*/ OR data_win_eventdata_parentCommandLine:/.*\.[Ww][Ss][Ff].*/ OR data_win_eventdata_parentCommandLine:/.*:\\[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss]\\.*/ OR data_win_eventdata_parentCommandLine:/.*:\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_parentCommandLine:/.*:\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_parentCommandLine:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_parentCommandLine:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp].*/ OR data_win_eventdata_parentCommandLine:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Rr][Oo][Aa][Mm][Ii][Nn][Gg]\\.*/ OR data_win_eventdata_parentCommandLine:/.*\\[Tt][Ee][Mm][Pp][Oo][Rr][Aa][Rr][Yy] [Ii][Nn][Tt][Ee][Rr][Nn][Ee][Tt].*/ OR (data_win_eventdata_parentCommandLine:/.*:\\[Uu][Ss][Ee][Rr][Ss]\\.*/ AND data_win_eventdata_parentCommandLine:/.*\\[Ff][Aa][Vv][Oo][Rr][Ii][Tt][Ee][Ss]\\.*/) OR (data_win_eventdata_parentCommandLine:/.*:\\[Uu][Ss][Ee][Rr][Ss]\\.*/ AND data_win_eventdata_parentCommandLine:/.*\\[Ff][Aa][Vv][Oo][Uu][Rr][Ii][Tt][Ee][Ss]\\.*/) OR (data_win_eventdata_parentCommandLine:/.*:\\[Uu][Ss][Ee][Rr][Ss]\\.*/ AND data_win_eventdata_parentCommandLine:/.*\\[Cc][Oo][Nn][Tt][Aa][Cc][Tt][Ss]\\.*/)) AND (data_win_eventdata_parentCommandLine:/.*\.[Bb][Aa][Tt].*/ OR data_win_eventdata_parentCommandLine:/.*\.[Cc][Hh][Mm].*/ OR data_win_eventdata_parentCommandLine:/.*\.[Cc][Mm][Dd].*/ OR data_win_eventdata_parentCommandLine:/.*\.[Hh][Tt][Aa].*/ OR data_win_eventdata_parentCommandLine:/.*\.[Hh][Tt][Mm].*/ OR data_win_eventdata_parentCommandLine:/.*\.[Hh][Tt][Mm][Ll].*/ OR data_win_eventdata_parentCommandLine:/.*\.[Jj][Ss].*/ OR data_win_eventdata_parentCommandLine:/.*\.[Ll][Nn][Kk].*/ OR data_win_eventdata_parentCommandLine:/.*\.[Pp][Ss]1.*/ OR data_win_eventdata_parentCommandLine:/.*\.[Vv][Bb][Ee].*/ OR data_win_eventdata_parentCommandLine:/.*\.[Vv][Bb][Ss].*/ OR data_win_eventdata_parentCommandLine:/.*\.[Ww][Ss][Ff].*/) AND (data_win_eventdata_image:/.*\\[Pp][Ii][Nn][Gg][Cc][Aa][Ss][Tt][Ll][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Pp][Ii][Nn][Gg][Cc][Aa][Ss][Tt][Ll][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_product:/[Pp][Ii][Nn][Gg] [Cc][Aa][Ss][Tt][Ll][Ee]/ OR data_win_eventdata_commandLine:/.*--[Ss][Cc][Aa][Nn][Nn][Ee][Rr] [Aa][Cc][Ll][Cc][Hh][Ee][Cc][Kk].*/ OR data_win_eventdata_commandLine:/.*--[Ss][Cc][Aa][Nn][Nn][Ee][Rr] [Aa][Nn][Tt][Ii][Vv][Ii][Rr][Uu][Ss].*/ OR data_win_eventdata_commandLine:/.*--[Ss][Cc][Aa][Nn][Nn][Ee][Rr] [Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr][Vv][Ee][Rr][Ss][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*--[Ss][Cc][Aa][Nn][Nn][Ee][Rr] [Ff][Oo][Rr][Ee][Ii][Gg][Nn][Uu][Ss][Ee][Rr][Ss].*/ OR data_win_eventdata_commandLine:/.*--[Ss][Cc][Aa][Nn][Nn][Ee][Rr] [Ll][Aa][Pp][Ss]_[Bb][Ii][Tt][Ll][Oo][Cc][Kk][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*--[Ss][Cc][Aa][Nn][Nn][Ee][Rr] [Ll][Oo][Cc][Aa][Ll][Aa][Dd][Mm][Ii][Nn].*/ OR data_win_eventdata_commandLine:/.*--[Ss][Cc][Aa][Nn][Nn][Ee][Rr] [Nn][Uu][Ll][Ll][Ss][Ee][Ss][Ss][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*--[Ss][Cc][Aa][Nn][Nn][Ee][Rr] [Nn][Uu][Ll][Ll][Ss][Ee][Ss][Ss][Ii][Oo][Nn]-[Tt][Rr][Uu][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*--[Ss][Cc][Aa][Nn][Nn][Ee][Rr] [Oo][Xx][Ii][Dd][Bb][Ii][Nn][Dd][Ii][Nn][Gg][Ss].*/ OR data_win_eventdata_commandLine:/.*--[Ss][Cc][Aa][Nn][Nn][Ee][Rr] [Rr][Ee][Mm][Oo][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*--[Ss][Cc][Aa][Nn][Nn][Ee][Rr] [Ss][Hh][Aa][Rr][Ee].*/ OR data_win_eventdata_commandLine:/.*--[Ss][Cc][Aa][Nn][Nn][Ee][Rr] [Ss][Mm][Bb].*/ OR data_win_eventdata_commandLine:/.*--[Ss][Cc][Aa][Nn][Nn][Ee][Rr] [Ss][Mm][Bb]3[Qq][Uu][Ee][Rr][Yy][Nn][Ee][Tt][Ww][Oo][Rr][Kk].*/ OR data_win_eventdata_commandLine:/.*--[Ss][Cc][Aa][Nn][Nn][Ee][Rr] [Ss][Pp][Oo][Oo][Ll][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*--[Ss][Cc][Aa][Nn][Nn][Ee][Rr] [Ss][Tt][Aa][Rr][Tt][Uu][Pp].*/ OR data_win_eventdata_commandLine:/.*--[Ss][Cc][Aa][Nn][Nn][Ee][Rr] [Zz][Ee][Rr][Oo][Ll][Oo][Gg][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*--[Nn][Oo]-[Ee][Nn][Uu][Mm]-[Ll][Ii][Mm][Ii][Tt].*/ OR (data_win_eventdata_commandLine:/.*--[Hh][Ee][Aa][Ll][Tt][Hh][Cc][Hh][Ee][Cc][Kk].*/ AND data_win_eventdata_commandLine:/.*--[Ll][Ee][Vv][Ee][Ll] [Ff][Uu][Ll][Ll].*/) OR (data_win_eventdata_commandLine:/.*--[Hh][Ee][Aa][Ll][Tt][Hh][Cc][Hh][Ee][Cc][Kk].*/ AND data_win_eventdata_commandLine:/.*--[Ss][Ee][Rr][Vv][Ee][Rr] .*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 2433a154-bb3d-42e4-86c3-a26bdac91c45
    name: Renamed PingCastle Binary Execution
    reason: Same tool with its name hidden; confirms evasive use.
  - id: 514e7e3e-b3b4-4a67-af60-be20f139198b
    name: PUA - AdFind.EXE Execution
    reason: Companion AD-mapping tool used in the same recon phase.
  - id: f376c8a7-a2d0-4ddc-aa0c-16c17236d962
    name: HackTool - Bloodhound/Sharphound Execution
    reason: AD attack-path collection usually accompanies PingCastle audits.
  - id: 9212f354-7775-4e28-9c9f-8f0a4544e664
    name: Active Directory Database Snapshot Via ADExplorer
    reason: Alternate AD snapshot technique.
  - id: 70bc5215-526f-4477-963c-a47a5c9ebd12
    name: Potential Active Directory Enumeration Using AD Module - ProcCreation
    reason: PowerShell AD enumeration in the same phase.
  - id: 41243735-89a7-4c83-bcdd-570aa78f00a1
    name: Domain Controller Discovery with Nltest
    reason: 'Precursor: locating DCs before an AD audit.'
  - id: 1eeed653-dbc8-4187-ad0c-eeebb20e6599
    name: Potential SPN Enumeration Via Setspn.EXE
    reason: 'Follow-on: Kerberoasting target discovery.'
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: PingCastle health-check command lines
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Pp][Ii][Nn][Gg][Cc][Aa][Ss][Tt][Ll][Ee].*/ OR /.*--[Hh][Ee][Aa][Ll][Tt][Hh][Cc][Hh][Ee][Cc][Kk].*/ OR /.*--[Ss][Cc][Aa][Nn][Nn][Ee][Rr].*/)
    pivot_on: host
    window: 6h
  - name: Script host parents launching tools
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:(/.*[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.exe/ OR /.*[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.exe/ OR /.*[Mm][Ss][Hh][Tt][Aa]\.exe/)
    pivot_on: host
    window: 2h
  - name: Other AD reconnaissance commands
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Nn][Ll][Tt][Ee][Ss][Tt] \/[Dd][Cc][Ll][Ii][Ss][Tt].*/ OR /.*[Nn][Ll][Tt][Ee][Ss][Tt] \/[Dd][Oo][Mm][Aa][Ii][Nn]_[Tt][Rr][Uu][Ss][Tt][Ss].*/ OR /.*[Dd][Ss][Qq][Uu][Ee][Rr][Yy].*/ OR /.*[Aa][Dd][Ff][Ii][Nn][Dd].*/ OR /.*[Nn][Ee][Tt] [Gg][Rr][Oo][Uu][Pp] \/[Dd][Oo][Mm][Aa][Ii][Nn].*/)
    pivot_on: host
    window: 6h
  - name: LDAP and SMB traffic from host to DCs
    query: data_win_system_eventID:3 AND data_win_eventdata_destinationPort:(389 OR 636 OR 3268 OR 445)
    pivot_on: host
    window: 2h
  - name: PingCastle report files written
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(/.*[Aa][Dd]_[Hh][Cc]_.*/ OR /.*[Pp][Ii][Nn][Gg][Cc][Aa][Ss][Tt][Ll][Ee].*/)
    pivot_on: host
    window: 24h
