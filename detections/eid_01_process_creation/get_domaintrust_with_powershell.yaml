name: Get-DomainTrust with PowerShell
id: 4fa7f846-054a-11ec-a836-acde48001122
version: 1
schema_version: "1.0"
date: "2026-04-27"
author: SOCFortress LLC
status: production
type: TTP

description: >
  This analytic identifies the execution of the Get-DomainTrust function
  from PowerSploit/PowerView. Sysmon EventID 1 is used to match process
  creation events whose command line contains "get-domaintrust"
  (case-insensitive). Get-DomainTrust is a PowerView/PowerSploit function
  used to enumerate Active Directory domain trust relationships,
  identifying trust types (parent-child, external, forest), trust
  direction (inbound, outbound, bidirectional), and trust attributes
  (transitive, quarantined). This is distinct from Microsoft's
  Get-ADTrust cmdlet and is a hallmark of offensive AD reconnaissance
  toolkits. The detection is process-agnostic, matching anywhere the
  function name appears in a command line. This activity is significant
  as it indicates potential reconnaissance efforts by an adversary to
  understand domain trust relationships, which directly informs lateral
  movement strategies including cross-domain attacks (trust ticket
  forgery, SID history abuse, cross-forest exploitation). If confirmed
  malicious, this could allow attackers to map out the network, identify
  trusted domains as additional attack targets, and plan further
  attacks potentially compromising additional systems and forests.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*get-domaintrust*"
              case_insensitive: true
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_parentCommandLine
    - data_win_eventdata_user
    - data_win_eventdata_processId
    - data_win_eventdata_processGuid
    - data_win_eventdata_parentProcessId
    - data_win_eventdata_parentProcessGuid
    - data_win_eventdata_hashes
    - data_win_eventdata_integrityLevel
    - data_win_eventdata_currentDirectory

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-27 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-27 23:59:59.999"

how_to_implement: >
  This detection requires Sysmon EventID 1 (Process Creation) logs to be forwarded
  from Windows endpoints to Wazuh Indexer. Ensure Sysmon is deployed with a
  configuration that captures Image, OriginalFileName, and CommandLine fields
  (SwiftOnSecurity or Olaf Hartong Sysmon modular config recommended). The
  detection is process-agnostic - any process with "get-domaintrust" in its
  command line will match. Case-insensitive matching is used on the function
  name to handle PowerShell's flexible casing. The ES DSL uses
  case_insensitive wildcard option (OpenSearch 2.x / Elasticsearch 7.10+);
  Graylog equivalent uses character classes. For deeper coverage, also
  enable PowerShell Script Block Logging (EventID 4104) and correlate
  against the same function name in script blocks - script block logging
  will catch in-memory PowerSploit imports that don't appear on the command
  line.

known_false_positives: >
  Limited false positives expected. Get-DomainTrust is a
  PowerSploit/PowerView offensive function, not a built-in Microsoft
  cmdlet, so legitimate administrative use is rare. Penetration
  testers, Red Teamers, and authorized internal security assessors may
  produce true-positive alerts that are not malicious - these should
  be tuned via approved-source allow-listing (specific parent process
  or user account) rather than removing the detection.

references:
  - https://attack.mitre.org/techniques/T1482/
  - https://blog.harmj0y.net/redteaming/a-guide-to-attacking-domain-trusts/
  - https://powersploit.readthedocs.io/en/latest/Recon/Get-DomainTrust/

response:
  message: >
    Suspicious PowerSploit Get-DomainTrust execution was identified on
    endpoint $agent_name$ by user $data_win_eventdata_user$. Process
    image: $data_win_eventdata_image$. Parent process:
    $data_win_eventdata_parentImage$. Command line:
    $data_win_eventdata_commandLine$. This is a high-confidence
    indicator of offensive AD trust enumeration commonly preceding
    cross-domain lateral movement; investigate immediately, review
    parent process lineage, in-memory PowerShell module loads, and
    concurrent discovery activity.
  risk_score: 72
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 60
    - field: data_win_eventdata_user
      type: user
      score: 60
  threat_objects:
    - field: data_win_eventdata_image
      type: process_name
    - field: data_win_eventdata_parentImage
      type: parent_process_name
    - field: data_win_eventdata_commandLine
      type: command_line

tags:
  analytic_story:
    - Active Directory Discovery
    - Active Directory Reconnaissance
    - Domain Trust Discovery
    - PowerSploit
    - PowerView
    - Offensive PowerShell Toolkit
  asset_type: Endpoint
  mitre_attack_id:
    - T1482
  custom_tags:
    - powershell
    - powersploit
    - powerview
    - get_domaintrust
    - domain_trust_discovery
    - active_directory
    - reconnaissance
    - cross_domain_attack
    - offensive_toolkit
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Gg][Ee][Tt]\-[Dd][Oo][Mm][Aa][Ii][Nn][Tt][Rr][Uu][Ss][Tt].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 3bad990e-4848-4a78-9530-b427d854aac0
    name: Domain Trust Discovery Via Dsquery
    reason: Same trust mapping via dsquery; operators alternate tooling to enumerate domain trusts from one host.
  - id: c3e05466-5f22-11eb-ae93-0242ac130002
    name: NLTest Domain Trust Discovery
    reason: nltest trust listing is the native twin of Get-DomainTrust; both on one host confirms deliberate trust mapping.
  - id: 584f4884-0bf1-11ec-a5ec-acde48001122
    name: Get-ForestTrust with PowerShell
    reason: Forest-level trust enumeration from the same PowerView session widens the map from domain to forest.
  - id: 9a5a41d6-04e7-11ec-923c-acde48001122
    name: Get DomainUser with PowerShell
    reason: PowerView user enumeration normally runs alongside trust mapping in the same module import.
  - id: 868ee0e4-52ab-484a-833a-6d85b7c028d0
    name: GetDomainController with PowerShell
    reason: Locating domain controllers is the step before or after trust mapping to pick cross-domain targets.
  - id: f376c8a7-a2d0-4ddc-aa0c-16c17236d962
    name: HackTool - Bloodhound/Sharphound Execution
    reason: BloodHound/SharpHound collects trusts as graph edges; its execution confirms full AD mapping.
  - id: 7ec2c172-dceb-4c10-92c9-87c1881b7e18
    name: HackTool - Rubeus Execution
    reason: 'Rubeus follow-on: ticket requests across the trusts just discovered.'
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: Mimikatz trust-key and krbtgt extraction is the usual exploit of a discovered trust (SID history, trust tickets).
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other PowerView/AD recon commands on host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Gg][Ee][Tt]-[Dd][Oo][Mm][Aa][Ii][Nn][Uu][Ss][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Gg][Ee][Tt]-[Dd][Oo][Mm][Aa][Ii][Nn][Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Gg][Ee][Tt]-[Dd][Oo][Mm][Aa][Ii][Nn][Gg][Rr][Oo][Uu][Pp].*/ OR data_win_eventdata_commandLine:/.*[Gg][Ee][Tt]-[Dd][Oo][Mm][Aa][Ii][Nn][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ll][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Gg][Ee][Tt]-[Aa][Dd][Uu][Ss][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Gg][Ee][Tt]-[Aa][Dd][Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Gg][Ee][Tt]-[Aa][Dd][Gg][Rr][Oo][Uu][Pp].*/ OR data_win_eventdata_commandLine:/.*[Gg][Ee][Tt]-[Dd][Oo][Mm][Aa][Ii][Nn][Tt][Rr][Uu][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Gg][Ee][Tt]-[Ff][Oo][Rr][Ee][Ss][Tt][Tt][Rr][Uu][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Gg][Ee][Tt]-[Nn][Ee][Tt][Uu][Ss][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Gg][Ee][Tt]-[Nn][Ee][Tt][Gg][Rr][Oo][Uu][Pp].*/ OR data_win_eventdata_commandLine:/.*[Gg][Ee][Tt]-[Nn][Ee][Tt][Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr].*/)
    pivot_on: host
    window: 4h
  - name: Native trust and DC discovery tools
    query: data_win_system_eventID:"1" AND (data_win_eventdata_originalFileName:"net.exe" OR data_win_eventdata_originalFileName:"net1.exe" OR data_win_eventdata_originalFileName:"nltest.exe" OR data_win_eventdata_originalFileName:"dsquery.exe" OR data_win_eventdata_originalFileName:"setspn.exe") AND (data_win_eventdata_commandLine:/.*[Gg][Rr][Oo][Uu][Pp].*/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Mm][Aa][Ii][Nn].*/ OR data_win_eventdata_commandLine:/.*[Tt][Rr][Uu][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ss][Pp][Nn].*/ OR data_win_eventdata_commandLine:/.*[Dd][Cc][Ll][Ii][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Aa][Dd][Mm][Ii][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ss][Hh][Aa][Rr][Ee].*/)
    pivot_on: host
    window: 4h
  - name: PowerView/PowerSploit module loading or bypass flags
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ OR data_win_eventdata_image:/.*[Pp][Ww][Ss][Hh]\.exe/) AND (data_win_eventdata_commandLine:/.*[Ii][Mm][Pp][Oo][Rr][Tt]-[Mm][Oo][Dd][Uu][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Pp][Oo][Ww][Ee][Rr][Vv][Ii][Ee][Ww].*/ OR data_win_eventdata_commandLine:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Pp][Ll][Oo][Ii][Tt].*/ OR data_win_eventdata_commandLine:/.*[Bb][Yy][Pp][Aa][Ss][Ss].*/ OR data_win_eventdata_commandLine:/.*[Hh][Ii][Dd][Dd][Ee][Nn].*/)
    pivot_on: host
    window: 4h
  - name: LDAP/Kerberos connections from host
    query: data_win_system_eventID:"3" AND (data_win_eventdata_destinationPort:"389" OR data_win_eventdata_destinationPort:"636" OR data_win_eventdata_destinationPort:"3268" OR data_win_eventdata_destinationPort:"3269" OR data_win_eventdata_destinationPort:"88")
    pivot_on: host
    window: 2h
  - name: Credential theft or Kerberos tooling after trust recon
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz].*/ OR data_win_eventdata_commandLine:/.*[Kk][Ee][Rr][Bb][Ee][Rr][Oo][Aa][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Rr][Uu][Bb][Ee][Uu][Ss].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Ss][Ss].*/)
    pivot_on: host
    window: 24h
