name: Windows DiskShadow Proxy Execution
id: windows-diskshadow-proxy-execution-001
version: 1
schema_version: "1.0"
date: "2026-02-23"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects diskshadow.exe executed in scripting mode (-s or /s flag), which can 
  execute arbitrary unsigned code. DiskShadow is a legitimate Windows backup 
  tool (LOLBIN) abused for proxy execution, VSS evasion, persistence, and 
  Active Directory database extraction.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - wildcard:
            data_win_eventdata_image: "*\\\\diskshadow.exe"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine: "*-s *"
              - wildcard:
                  data_win_eventdata_commandLine: "*/s *"
              - wildcard:
                  data_win_eventdata_commandLine: "*-s*"
              - wildcard:
                  data_win_eventdata_commandLine: "*/s*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-23 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-23 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Windows endpoints with Sysmon 
  installed and configured to log process creation events (EventID 1) with full 
  command-line arguments.

known_false_positives: >
  Administrators using DiskShadow as a backup tool with scripts. Filter by 
  authorized backup schedules and admin accounts.

references:
  - https://attack.mitre.org/techniques/T1218/
  - https://bohops.com/2018/03/26/diskshadow-the-return-of-vss-evasion-persistence-and-active-directory-database-extraction/

response:
  message: >
    DiskShadow proxy execution on $agent_name$. 
    Command: $data_win_eventdata_commandLine$. 
    Parent: $data_win_eventdata_parentImage$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1218
  risk_score: 56
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 56
  threat_objects: []

tags:
  analytic_story:
    - Living Off The Land
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1218
  custom_tags:
    - diskshadow
    - lolbin
    - proxy_execution
    - signed_binary_abuse
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*diskshadow\.exe/ AND (data_win_eventdata_commandLine:/.*-s .*/ OR data_win_eventdata_commandLine:/.*\/s .*/ OR data_win_eventdata_commandLine:/.*-s.*/ OR data_win_eventdata_commandLine:/.*\/s.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: fa1a7e52-3d02-435b-81b8-00da14dd66c1
    name: Diskshadow Script Mode - Execution From Potential Suspicious Location
    reason: Same diskshadow script mode, with the script in a staging path.
  - id: 1dde5376-a648-492e-9e54-4241dd9b0c7f
    name: Diskshadow Script Mode - Uncommon Script Extension Execution
    reason: Script file with an odd extension confirms proxy-execution intent.
  - id: 9f546b25-5f12-4c8d-8532-5893dcb1e4b8
    name: Potentially Suspicious Child Process Of DiskShadow.EXE
    reason: Diskshadow exec commands spawn the proxied payload as a child.
  - id: da63bc76-61ae-11eb-ae93-0242ac130002
    name: Ntdsutil Export NTDS
    reason: Diskshadow snapshots a DC volume so ntds.dit can be copied.
  - id: c73124a7-3e89-44a3-bdc1-25fe4df754b1
    name: Copy From VolumeShadowCopy Via Cmd.EXE
    reason: Files copied out of the exposed shadow copy after diskshadow expose.
  - id: f57f8d16-1f39-4dcb-a604-6c73d9b54b3d
    name: Sensitive File Access Via Volume Shadow Copy Backup
    reason: Reading SAM or NTDS from the shadow copy is the usual goal.
  - id: 94dc4390-6b7c-4784-8ffc-335334404650
    name: Dump Ntds.dit To Suspicious Location
    reason: Resulting ntds.dit copy staged to a writable path.
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: Diskshadow delete shadows is also used for ransomware recovery inhibition.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Diskshadow child processes
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*diskshadow\.exe/
    pivot_on: host
    window: 6h
  - name: Shadow copy listing, copy or expose
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*(HarddiskVolumeShadowCopy|[Vv]ssadmin.*(list|create)|[Ee]xpose|[Ww]mic.*shadowcopy).*/
    pivot_on: host
    window: 6h
  - name: NTDS, SAM and SYSTEM hive extraction
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*(ntds\.dit|[Nn]tdsutil|reg(\.exe)? +save.*(sam|system|security)).*/
    pivot_on: host
    window: 6h
  - name: Diskshadow invoked with script file
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*diskshadow\.exe/ AND data_win_eventdata_commandLine:/.*(\.txt|\.dsh|\.ini|\.tmp).*/
    pivot_on: host
    window: 6h
  - name: Archive and exfil tools after dump
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*(7z|rar|tar|compress-archive|curl|certutil.*-encode).*/
    pivot_on: host
    window: 6h
