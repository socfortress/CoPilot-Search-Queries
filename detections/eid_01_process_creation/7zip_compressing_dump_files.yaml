name: 7Zip Compressing Dump Files
id: ec570e53-4c76-45a9-804d-dc3f355ff7a7
version: 1
schema_version: "1.0"
date: "2026-06-05"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: ec570e53-4c76-45a9-804d-dc3f355ff7a7
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of 7z in order to compress a file with a ".dmp"/".dump"
  extension, which could be a step in a process of dump file exfiltration. MITRE
  ATT&CK: T1560.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_description:
                    value: "*7-Zip*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\7z.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\7zr.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\7za.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "7z.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "7za.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "7zr.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.dmp*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.dump*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.hdmp*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_description
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_description matches
  '*7-Zip*'; data_win_eventdata_image matches '*\7z.exe';
  data_win_eventdata_image matches '*\7zr.exe', among other conditions.

known_false_positives: >
  Legitimate use of 7z with a command line in which ".dmp" or ".dump" appears
  accidentally. Legitimate use of 7z to compress WER ".dmp" files for
  troubleshooting. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://thedfirreport.com/2022/09/26/bumblebee-round-two/
  - https://attack.mitre.org/techniques/T1560/001/

response:
  message: >
    7Zip Compressing Dump Files detected on host $agent_name$. Matched
    data_win_eventdata_description: $data_win_eventdata_description$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1560.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_description
      type: other
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1560.001
  custom_tags:
    - compressing
    - process_creation
    - sysmon
    - collection
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_description:/.*7-[Zz][Ii][Pp].*/ OR data_win_eventdata_image:/.*\\7[Zz]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\7[Zz][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\7[Zz][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/7[Zz]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/7[Zz][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/7[Zz][Rr]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*\.[Dd][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*\.[Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*\.[Hh][Dd][Mm][Pp].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: 'Typical source of the .dmp being archived: LSASS memory dumped just before compression.'
  - id: 5afee48e-67dd-4e03-a783-f74259dcf998
    name: Potential LSASS Process Dump Via Procdump
    reason: Procdump-created .dmp files are the most common dump then zipped for exfil.
  - id: ffa6861c-4461-4f59-8a41-578c39f3f23e
    name: LSASS Dump Keyword In CommandLine
    reason: Catches the dump step by command line when the dump tool is custom or renamed.
  - id: 515c8be5-e5df-4c5e-8f6d-a4a2f05e4b48
    name: CreateDump Process Dump
    reason: Built-in createdump.exe produces dump files that are then compressed.
  - id: 23ceaf5c-b6f1-4a32-8559-f2ff734be516
    name: Dumping Process via Sqldumper.exe
    reason: Living-off-the-land dump producer preceding archive creation.
  - id: 9fbf5927-5261-4284-a71d-f681029ea574
    name: Compress Data and Lock With Password for Exfiltration With 7-ZIP
    reason: Password-protected 7z use on the same host is the exfil-prep variant of the same staging behaviour.
  - id: 85a8e5ba-bd03-4bfb-bbfa-a4409a8f8b98
    name: Folder Compress To Potentially Suspicious Output Via Compress-Archive Cmdlet
    reason: Alternative archiving the operator may use for other staged data.
  - id: 32e0baea-b3f1-11eb-a2ce-acde48001122
    name: Detect RClone Command-Line Usage
    reason: Rclone is a common next step to ship the archive to cloud storage.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: 'Memory dump producers: procdump, comsvcs MiniDump, createdump, sqldumper, ntdsutil'
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]64\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Rr][Ee][Aa][Tt][Ee][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ss][Qq][Ll][Dd][Uu][Mm][Pp][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/) OR (data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Ss][Ss].*/ OR data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/))
    pivot_on:
    - host
    window: 4h
  - name: LSASS process access by non-system tools (dump source)
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ AND NOT data_win_eventdata_sourceImage:/.*\\(?:[Ww][Ii][Nn][Ii][Nn][Ii][Tt]|[Cc][Ss][Rr][Ss][Ss]|[Ss][Vv][Cc][Hh][Oo][Ss][Tt]|[Mm][Ss][Mm][Pp][Ee][Nn][Gg]|[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 4h
  - name: Dump or archive files created on disk
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\.[Dd][Mm][Pp].*/ OR data_win_eventdata_targetFilename:/.*\.[Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_targetFilename:/.*\.[Hh][Dd][Mm][Pp].*/ OR data_win_eventdata_targetFilename:/.*\.7[Zz].*/ OR data_win_eventdata_targetFilename:/.*\.[Zz][Ii][Pp].*/ OR data_win_eventdata_targetFilename:/.*\.[Rr][Aa][Rr].*/)
    pivot_on:
    - host
    window: 4h
  - name: 'Exfiltration tooling: rclone, curl, WinSCP, mega, or upload cmdlets'
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\[Rr][Cc][Ll][Oo][Nn][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Ss][Cc][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ss][Cc][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ee][Gg][Aa][Cc][Mm][Dd]\.[Ee][Xx][Ee]/) OR (data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Rr][Ee][Ss][Tt][Mm][Ee][Tt][Hh][Oo][Dd].*/ OR data_win_eventdata_commandLine:/.*[Ss][Tt][Aa][Rr][Tt]-[Bb][Ii][Tt][Ss][Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn].*/ OR data_win_eventdata_commandLine:/.*[Rr][Cc][Ll][Oo][Nn][Ee].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ee][Gg][Aa]\.[Nn][Zz].*/))
    pivot_on:
    - host
    window: 6h
  - name: Archive or dump copied to a network share
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*\\\\.*/) AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Pp][Yy] .*/ OR data_win_eventdata_commandLine:/.*[Rr][Oo][Bb][Oo][Cc][Oo][Pp][Yy].*/ OR data_win_eventdata_commandLine:/.*[Xx][Cc][Oo][Pp][Yy].*/ OR data_win_eventdata_commandLine:/.*[Mm][Oo][Vv][Ee]-[Ii][Tt][Ee][Mm].*/) AND (data_win_eventdata_commandLine:/.*\.7[Zz].*/ OR data_win_eventdata_commandLine:/.*\.[Zz][Ii][Pp].*/ OR data_win_eventdata_commandLine:/.*\.[Dd][Mm][Pp].*/)
    pivot_on:
    - host
    window: 4h
