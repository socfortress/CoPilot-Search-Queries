name: AddinUtil.EXE Execution From Uncommon Directory
id: 6120ac2a-a34b-42c0-a9bd-1fb9f459f348
version: 1
schema_version: "1.0"
date: "2025-02-24"
author: Michael McKinley (@McKinleyMike), Tony Latteri (@TheLatteri)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 6120ac2a-a34b-42c0-a9bd-1fb9f459f348
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of the Add-In deployment cache updating utility
  (AddInutil.exe) from a non-standard directory. MITRE ATT&CK: T1218.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\addinutil.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "AddInUtil.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*:\\\\Windows\\\\Microsoft.NET\\\\Framework\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*:\\\\Windows\\\\Microsoft.NET\\\\Framework64\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*:\\\\Windows\\\\Microsoft.NET\\\\FrameworkArm\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*:\\\\Windows\\\\Microsoft.NET\\\\FrameworkArm64\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*:\\\\Windows\\\\WinSxS\\\\*"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\addinutil.exe'; data_win_eventdata_originalFileName equals 'AddInUtil.exe';
  data_win_eventdata_image matches '*:\Windows\Microsoft.NET\Framework\*', among
  other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.blue-prints.blog/content/blog/posts/lolbin/addinutil-lolbas.html
  - https://attack.mitre.org/techniques/T1218/

response:
  message: >
    AddinUtil.EXE Execution From Uncommon Directory detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1218
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218
  custom_tags:
    - addinutil
    - uncommon
    - directory
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Aa][Dd][Dd][Ii][Nn][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Aa][Dd][Dd][Ii][Nn][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/) AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\.[Nn][Ee][Tt]\\[Ff][Rr][Aa][Mm][Ee][Ww][Oo][Rr][Kk]\\.*/ OR data_win_eventdata_image:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\.[Nn][Ee][Tt]\\[Ff][Rr][Aa][Mm][Ee][Ww][Oo][Rr][Kk]64\\.*/ OR data_win_eventdata_image:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\.[Nn][Ee][Tt]\\[Ff][Rr][Aa][Mm][Ee][Ww][Oo][Rr][Kk][Aa][Rr][Mm]\\.*/ OR data_win_eventdata_image:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\.[Nn][Ee][Tt]\\[Ff][Rr][Aa][Mm][Ee][Ww][Oo][Rr][Kk][Aa][Rr][Mm]64\\.*/ OR data_win_eventdata_image:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ww][Ii][Nn][Ss][Xx][Ss]\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 631b22a4-70f4-4e2f-9ea8-42f84d9df6d8
    name: Suspicious AddinUtil.EXE CommandLine Execution
    reason: Same binary invoked with AddinRoot/PipelineRoot pointing at attacker-controlled paths loads a malicious add-in.
  - id: 4f2cd9b6-4a17-440f-bb2a-687abb65993a
    name: Uncommon AddinUtil.EXE CommandLine Execution
    reason: Uncommon arguments on AddInUtil, typical of an abused or renamed copy.
  - id: b5746143-59d6-4603-8d06-acbd60e166ee
    name: Uncommon Child Process Of AddinUtil.EXE
    reason: 'Direct follow-on: add-in payload spawning a shell or other child.'
  - id: 5205613d-2a63-4412-a895-3a2458b587b3
    name: Network Connection Initiated By AddinUtil.EXE
    reason: A copied AddInUtil used as downloader/C2 proxy makes network connections.
  - id: 75edd216-1939-4c73-8d61-7f3a0d85b5cc
    name: File Download Via InstallUtil.EXE
    reason: Sibling .NET LOLBin proxy-execution technique often used in the same toolkit.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: AddInUtil process, parent and children
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*[Aa]dd[Ii]n[Uu]til\.exe/ OR data_win_eventdata_parentImage:/.*[Aa]dd[Ii]n[Uu]til\.exe/ OR data_win_eventdata_originalFileName:/[Aa]dd[Ii]n[Uu]til\.exe/)
    pivot_on: host
    window: 4h
  - name: AddInUtil network connections
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*[Aa]dd[Ii]n[Uu]til\.exe/
    pivot_on: host
    window: 4h
  - name: Add-in DLL/XML pipeline files dropped
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(/.*[Aa]dd[Ii]n.*\.(dll|xml)/ OR /.*[Hh]ost[Vv]iew.*\.dll/ OR /.*[Pp]ipeline.*\.(dll|xml)/)
    pivot_on: host
    window: 4h
  - name: Other .NET LOLBin proxy execution
    query: data_win_system_eventID:1 AND data_win_eventdata_image:(/.*[Ii]nstall[Uu]til\.exe/ OR /.*[Rr]egasm\.exe/ OR /.*[Rr]egsvcs\.exe/ OR /.*[Mm]s[Bb]uild\.exe/ OR /.*[Cc]sc\.exe/)
    pivot_on: host
    window: 4h
  - name: Executables or archives written to user-writable paths
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(/.*\\[Uu]sers\\.*\\([Dd]ownloads|[Aa]pp[Dd]ata|[Tt]emp).*\.(exe|dll|zip)/ OR /.*\\[Pp]rogram[Dd]ata\\.*\.(exe|dll)/)
    pivot_on: host
    window: 2h
