name: HackTool - RemoteKrbRelay Execution
id: a7664b14-75fb-4a50-a223-cb9bc0afbacf
version: 1
schema_version: "1.0"
date: "2024-06-27"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: a7664b14-75fb-4a50-a223-cb9bc0afbacf
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the use of RemoteKrbRelay, a Kerberos relaying tool via CommandLine
  flags and PE metadata. MITRE ATT&CK: T1558.003.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\RemoteKrbRelay.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "RemoteKrbRelay.exe"
                    case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* -clsid *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* -target *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* -victim *"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*-rbcd *"
                          case_insensitive: true
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*-cn *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*--computername *"
                                case_insensitive: true
                        minimum_should_match: 1
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*-chp *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*-chpPass *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*-chpUser *"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*-addgroupmember *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*-group *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*-groupuser *"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*-smb *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*--smbkeyword *"
                          case_insensitive: true
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*interactive*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*secrets*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*service-add*"
                                case_insensitive: true
                        minimum_should_match: 1
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\RemoteKrbRelay.exe'; data_win_eventdata_originalFileName equals
  'RemoteKrbRelay.exe'; data_win_eventdata_commandLine matches '* -clsid *',
  among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/CICADA8-Research/RemoteKrbRelay
  - https://attack.mitre.org/techniques/T1558/003/

response:
  message: >
    HackTool - RemoteKrbRelay Execution detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1558.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1558.003
  custom_tags:
    - hacktool
    - remotekrbrelay
    - process_creation
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Rr][Ee][Mm][Oo][Tt][Ee][Kk][Rr][Bb][Rr][Ee][Ll][Aa][Yy]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Rr][Ee][Mm][Oo][Tt][Ee][Kk][Rr][Bb][Rr][Ee][Ll][Aa][Yy]\.[Ee][Xx][Ee]/ OR (data_win_eventdata_commandLine:/.* -[Cc][Ll][Ss][Ii][Dd] .*/ AND data_win_eventdata_commandLine:/.* -[Tt][Aa][Rr][Gg][Ee][Tt] .*/ AND data_win_eventdata_commandLine:/.* -[Vv][Ii][Cc][Tt][Ii][Mm] .*/) OR (data_win_eventdata_commandLine:/.*-[Rr][Bb][Cc][Dd] .*/ AND (data_win_eventdata_commandLine:/.*-[Cc][Nn] .*/ OR data_win_eventdata_commandLine:/.*--[Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr][Nn][Aa][Mm][Ee] .*/)) OR (data_win_eventdata_commandLine:/.*-[Cc][Hh][Pp] .*/ AND data_win_eventdata_commandLine:/.*-[Cc][Hh][Pp][Pp][Aa][Ss][Ss] .*/ AND data_win_eventdata_commandLine:/.*-[Cc][Hh][Pp][Uu][Ss][Ee][Rr] .*/) OR (data_win_eventdata_commandLine:/.*-[Aa][Dd][Dd][Gg][Rr][Oo][Uu][Pp][Mm][Ee][Mm][Bb][Ee][Rr] .*/ AND data_win_eventdata_commandLine:/.*-[Gg][Rr][Oo][Uu][Pp] .*/ AND data_win_eventdata_commandLine:/.*-[Gg][Rr][Oo][Uu][Pp][Uu][Ss][Ee][Rr] .*/) OR (data_win_eventdata_commandLine:/.*-[Ss][Mm][Bb] .*/ AND data_win_eventdata_commandLine:/.*--[Ss][Mm][Bb][Kk][Ee][Yy][Ww][Oo][Rr][Dd] .*/ AND (data_win_eventdata_commandLine:/.*[Ii][Nn][Tt][Ee][Rr][Aa][Cc][Tt][Ii][Vv][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Cc][Rr][Ee][Tt][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Rr][Vv][Ii][Cc][Ee]-[Aa][Dd][Dd].*/)))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e96253b8-6b3b-4f90-9e59-3b24b99cf9b4
    name: HackTool - KrbRelay Execution
    reason: Predecessor tool family; same relay primitives in the same intrusion
  - id: 12827a56-61a4-476a-a9cb-f3068f191073
    name: HackTool - KrbRelayUp Execution
    reason: Related Kerberos relay LPE chain (RBCD/shadow credentials)
  - id: 3ab79e90-9fab-4cdf-a7b2-6522bc742adb
    name: HackTool - RemoteKrbRelay SMB Relay Secrets Dump Module Indicators
    reason: File artifacts of RemoteKrbRelay's SMB secrets dump module
  - id: 0ed99dda-6a35-11ef-8c99-0242ac120002
    name: Attempts of Kerberos Coercion Via DNS SPN Spoofing
    reason: Coercion setup RemoteKrbRelay relies on
  - id: e7a21b5f-d8c4-4ae5-b8d9-93c5d3f28e1c
    name: Suspicious DNS Query Indicating Kerberos Coercion via DNS Object SPN Spoofing
    reason: DNS evidence of the coercion preceding the relay
  - id: caa9a802-8bd8-4b9e-a5cd-4d6221670219
    name: Suspicious Kerberos Ticket Request via CLI
    reason: Kerberos ticket abuse accompanying relay
  - id: 5589ab4f-a767-433c-961d-c91f3f704db1
    name: Potential SMB Relay Attack Tool Execution
    reason: Alternate relay tooling in same attack
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Relay tooling flags
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*(-[Cc][Ll][Ss][Ii][Dd]|-[Rr][Bb][Cc][Dd]|-[Ss][Mm][Bb]|[Ss][Ee][Rr][Vv][Ii][Cc][Ee]-[Aa][Dd][Dd]|[Kk][Rr][Bb][Rr][Ee][Ll][Aa][Yy]).*/
    pivot_on: host
    window: 2h
  - name: Machine account / RBCD / delegation changes via CLI
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ss]et-[Aa][Dd][Cc]omputer|[Mm]s[Dd][Ss]-[Aa]llowedtoactonbehalf|[Nn]ew-[Aa][Dd][Cc]omputer|[Ss]et-[Aa][Dd][Aa]ccount).*/
    pivot_on: host
    window: 2h
  - name: Outbound Kerberos/SMB/RPC from the host
    query: data_win_system_eventID:"3" AND (data_win_eventdata_destinationPort:"88" OR data_win_eventdata_destinationPort:"445" OR data_win_eventdata_destinationPort:"135")
    pivot_on: host
    window: 2h
  - name: Service creation or hive save (secrets dump follow-on)
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ss][Cc]\.[Ee][Xx][Ee].*[Cc][Rr][Ee][Aa][Tt][Ee]|[Rr][Ee][Gg].*[Ss][Aa][Vv][Ee]).*/
    pivot_on: host
    window: 2h
