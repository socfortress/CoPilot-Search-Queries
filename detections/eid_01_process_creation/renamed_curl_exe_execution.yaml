name: Renamed CURL.EXE Execution
id: 7530cd3d-7671-43e3-b209-976966f6ea48
version: 1
schema_version: "1.0"
date: "2023-10-12"
author: X__Junior (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 7530cd3d-7671-43e3-b209-976966f6ea48
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of a renamed "CURL.exe" binary based on the PE metadata
  fields. MITRE ATT&CK: T1059, T1202.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - term:
                  data_win_eventdata_originalFileName:
                    value: "curl.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_description:
                    value: "The curl executable"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\curl*"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_originalFileName
    - data_win_eventdata_description
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_originalFileName equals
  'curl.exe'; data_win_eventdata_description equals 'The curl executable';
  data_win_eventdata_image matches '*\curl*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/Kostastsale/status/1700965142828290260
  - https://attack.mitre.org/techniques/T1059/
  - https://attack.mitre.org/techniques/T1202/

response:
  message: >
    Renamed CURL.EXE Execution detected on host $agent_name$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    Matched data_win_eventdata_description: $data_win_eventdata_description$.
    MITRE ATT&CK: T1059, T1202
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_originalFileName
      type: file_name
    - field: data_win_eventdata_description
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059
    - T1202
  custom_tags:
    - renamed
    - process_creation
    - sysmon
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_originalFileName:/[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_description:/[Tt][Hh][Ee] [Cc][Uu][Rr][Ll] [Ee][Xx][Ee][Cc][Uu][Tt][Aa][Bb][Ll][Ee]/) AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/.*\\[Cc][Uu][Rr][Ll].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 56454143-524f-49fb-b1c6-3fb8b1ad41fb
    name: Suspicious File Download From File Sharing Domain Via Curl.EXE
    reason: Download behaviour a hidden curl is typically used for.
  - id: 9cc85849-3b02-4cb5-b371-3a1ff54f2218
    name: File Download From IP URL Via Curl.EXE
    reason: Raw-IP payload fetch is a common curl staging pattern.
  - id: 21dd6d38-2b18-4453-9404-a0fe4a0cc288
    name: Curl Download And Execute Combination
    reason: Download-then-run chain that follows a renamed curl fetch.
  - id: e328cc73-f92a-42fb-b3fa-7c2cffda981a
    name: Curl File Upload To File Sharing Websites
    reason: Exfiltration use of curl that the renaming may be hiding.
  - id: cb9cc1d1-e84e-4bdc-b7ad-c31b1b7908ec
    name: Insecure Transfer Via Curl.EXE
    reason: Cleartext/insecure curl transfers hint at attacker infrastructure.
  - id: d059842b-6b9d-4ed1-b5c3-5b89143c6ede
    name: File Download Via Bitsadmin
    reason: Alternative downloader used when curl is detected or blocked.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: curl-style transfer arguments
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(http:\/\/|https:\/\/|ftp:\/\/).*/ AND data_win_eventdata_commandLine:/.*( -o | -O |--output|-T |--upload-file|--data|-F ).*/
    pivot_on: host
    window: 4h
  - name: Executables and scripts dropped to disk
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\.(exe|dll|ps1|bat|vbs|js|hta|zip)$/
    pivot_on: host
    window: 4h
  - name: Shell parents spawning binaries from user-writable paths
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*(cmd|powershell|pwsh|wscript|cscript|mshta)\.exe/ AND data_win_eventdata_image:/.*(\\Temp\\|\\AppData\\|\\ProgramData\\|\\Users\\Public\\).*/
    pivot_on: host
    window: 2h
  - name: Outbound connections from user-writable paths
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*(\\Temp\\|\\AppData\\|\\ProgramData\\|\\Users\\Public\\).*/ AND data_win_eventdata_initiated:true AND NOT data_win_eventdata_destinationIp:(10.* OR 192.168.* OR 127.*)
    pivot_on: host
    window: 4h
