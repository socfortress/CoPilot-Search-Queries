name: Esentutl Steals Browser Information
id: 6a69f62d-ce75-4b57-8dce-6351eb55b362
version: 1
schema_version: "1.0"
date: "2024-03-05"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 6a69f62d-ce75-4b57-8dce-6351eb55b362
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  One way Qbot steals sensitive information is by extracting browser data from
  Internet Explorer and Microsoft Edge by using the built-in utility
  esentutl.exe. MITRE ATT&CK: T1005.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\esentutl.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "esentutl.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-r*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*/r*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*–r*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*—r*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*―r*"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*\\\\Windows\\\\WebCache*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\esentutl.exe'; data_win_eventdata_originalFileName equals 'esentutl.exe';
  data_win_eventdata_commandLine matches '*-r*', among other conditions.

known_false_positives: >
  Legitimate use. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://thedfirreport.com/2022/02/07/qbot-likes-to-move-it-move-it/
  - https://redcanary.com/threat-detection-report/threats/qbot/
  - https://thedfirreport.com/2022/10/31/follina-exploit-leads-to-domain-compromise/
  - https://attack.mitre.org/techniques/T1005/

response:
  message: >
    Esentutl Steals Browser Information detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1005
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1005
  custom_tags:
    - esentutl
    - steals
    - browser
    - process_creation
    - sysmon
    - collection
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ee][Ss][Ee][Nn][Tt][Uu][Tt][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ee][Ss][Ee][Nn][Tt][Uu][Tt][Ll]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*-[Rr].*/ OR data_win_eventdata_commandLine:/.*\/[Rr].*/ OR data_win_eventdata_commandLine:/.*–[Rr].*/ OR data_win_eventdata_commandLine:/.*—[Rr].*/ OR data_win_eventdata_commandLine:/.*―[Rr].*/) AND data_win_eventdata_commandLine:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ww][Ee][Bb][Cc][Aa][Cc][Hh][Ee].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7df1713a-1a5b-4a4b-a071-dc83b144a101
    name: Esentutl Gather Credentials
    reason: Same actor often runs esentutl against other credential stores alongside WebCache.
  - id: 47147b5b-9e17-4d76-b8d2-7bac24c5ce1b
    name: Potential Browser Data Stealing
    reason: Generic copy of browser profile data; same objective via another tool.
  - id: 8ba484e8-4b97-11ec-b19a-acde48001122
    name: Possible Browser Pass View Parameter
    reason: Browser password dumpers are the usual follow-on to extract creds from the copied data.
  - id: d0dae994-26c6-4d2d-83b5-b3c8b79ae513
    name: PUA - WebBrowserPassView Execution
    reason: Tool used to decrypt/parse stolen browser credentials.
  - id: windows-disable-stop-browser-process-001
    name: Windows Disable or Stop Browser Process
    reason: Browsers are killed to release locks on the database files being copied.
  - id: b17ea6f7-6e90-447e-a799-e6c0a493d6ce
    name: Shadow Copies Creation Using Operating Systems Utilities
    reason: A shadow copy is another way to read locked browser/WebCache files.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Browser killed to unlock data
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Tt][Aa][Ss][Kk][Kk][Ii][Ll][Ll]|[Ss]top-[Pp]rocess).*([Cc]hrome|[Ff]irefox|[Mm]sedge|[Ii]explore|[Bb]rave).*/
    pivot_on: host
    window: 2h
  - name: Browser credential dumpers
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*([Ww]eb[Bb]rowser[Pp]ass[Vv]iew|[Ll]a[Zz]agne|[Ss]harp[Cc]hrome).*/ OR data_win_eventdata_commandLine:/.*([Ll]ogin [Dd]ata|[Ww]eb [Dd]ata|[Ll]ocal [Ss]tate).*/)
    pivot_on: host
    window: 4h
  - name: Browser data files written outside profile
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*([Ww]eb[Cc]ache|[Ll]ogin [Dd]ata|\.[Ee][Dd][Bb]).*/
    pivot_on: host
    window: 2h
  - name: Outbound transfer tooling after harvest
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ii]nvoke-[Rr]est[Mm]ethod|[Ss]tart-[Bb]its[Tt]ransfer|[Cc]url|[Rr]clone|[Pp]astebin|[Mm]ega\.nz).*/
    pivot_on: host
    window: 4h
