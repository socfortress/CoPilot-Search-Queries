name: Uninstall Crowdstrike Falcon Sensor
id: f0f7be61-9cf5-43be-9836-99d6ef448a18
version: 1
schema_version: "1.0"
date: "2023-03-09"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: f0f7be61-9cf5-43be-9836-99d6ef448a18
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Adversaries may disable security tools to avoid possible detection of their
  tools and activities by uninstalling Crowdstrike Falcon. MITRE ATT&CK: T1685.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*\\\\WindowsSensor.exe*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* /uninstall*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* /quiet*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*\WindowsSensor.exe*'; data_win_eventdata_commandLine matches '*
  /uninstall*'; data_win_eventdata_commandLine matches '* /quiet*'.

known_false_positives: >
  Administrator might leverage the same command line for debugging or other
  purposes. However this action must be always investigated. Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1562.001/T1562.001.md
  - https://attack.mitre.org/techniques/T1685/

response:
  message: >
    Uninstall Crowdstrike Falcon Sensor detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1685
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685
  custom_tags:
    - uninstall
    - crowdstrike
    - falcon
    - process_creation
    - sysmon
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Ss][Ee][Nn][Ss][Oo][Rr]\.[Ee][Xx][Ee].*/ AND data_win_eventdata_commandLine:/.* \/[Uu][Nn][Ii][Nn][Ss][Tt][Aa][Ll][Ll].*/ AND data_win_eventdata_commandLine:/.* \/[Qq][Uu][Ii][Ee][Tt].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 847d5ff3-8a31-4737-a970-aeae8fe21765
    name: Potential Tampering With Security Products Via WMIC
    reason: Alternative EDR removal route (wmic product call uninstall) used by the same defense-evasion playbooks.
  - id: 49d9671b-0a0a-4c09-8280-d215bfd30662
    name: Application Termination Attempt via Wmic.EXE
    reason: Terminating security processes via wmic often accompanies or replaces sensor uninstall.
  - id: b53317a0-8acf-4fd1-8de8-a5401e776b96
    name: Application Removed Via Wmic.EXE
    reason: Wmic uninstall of an application is the parallel method for removing security software.
  - id: eb2d07d4-49cb-4523-801a-da002df36602
    name: HackTool - EDRSilencer Execution
    reason: If uninstall is blocked by a maintenance token, actors fall back to silencing EDR telemetry.
  - id: c598cc0c-9e70-4852-b9eb-8921af79f598
    name: Hacktool - EDR-Freeze Execution
    reason: Another EDR neutralization fallback tried when the sensor cannot be cleanly removed.
  - id: b28e58e4-2a72-4fae-bdee-0fbe904db642
    name: Windows Defender Real-time Protection Disabled
    reason: Attackers blind the second layer (Defender) right after removing the primary EDR.
  - id: 1321dc4e-a1fe-481d-a016-52c45f0c8b4f
    name: Windows Defender Exclusions Added
    reason: Defender exclusions are added to stage payloads once EDR is gone.
  - id: 236e7c8e-c9d9-11eb-a824-acde48001122
    name: Disable Logs Using WevtUtil
    reason: Log disabling and clearing typically follows security tool removal to hide the next stage.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other security-tool kill and uninstall attempts
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Tt][Aa][Ss][Kk][Kk][Ii][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc] [Ss][Tt][Oo][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc] [Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc] [Cc][Oo][Nn][Ff][Ii][Gg].*/ OR data_win_eventdata_commandLine:/.*[Pp][Rr][Oo][Dd][Uu][Cc][Tt] [Ww][Hh][Ee][Rr][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Tt][Oo][Pp]-[Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Cc][Ss][Aa][Gg][Ee][Nn][Tt].*/ OR data_win_eventdata_commandLine:/.*[Cc][Ss][Ff][Aa][Ll][Cc][Oo][Nn][Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/)
    pivot_on: host
    window: 4h
  - name: Defender tamper via PowerShell
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee][Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Aa][Dd][Dd]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Aa][Nn][Tt][Ii][Ss][Pp][Yy][Ww][Aa][Rr][Ee].*/)
    pivot_on: host
    window: 4h
  - name: Log clearing and audit tampering
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll] [Cc][Ll].*/ OR data_win_eventdata_commandLine:/.*[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll] [Ss][Ll].*/ OR data_win_eventdata_commandLine:/.*[Cc][Ll][Ee][Aa][Rr]-[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg].*/ OR data_win_eventdata_commandLine:/.*[Aa][Uu][Dd][Ii][Tt][Pp][Oo][Ll].*/)
    pivot_on: host
    window: 4h
  - name: Ransomware and destructive follow-on
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn] [Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Cc][Oo][Vv][Ee][Rr][Yy][Ee][Nn][Aa][Bb][Ll][Ee][Dd].*/ OR data_win_eventdata_commandLine:/.*[Ww][Bb][Aa][Dd][Mm][Ii][Nn] [Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Hh][Aa][Dd][Oo][Ww][Cc][Oo][Pp][Yy] [Dd][Ee][Ll][Ee][Tt][Ee].*/)
    pivot_on: host
    window: 6h
  - name: Remote tooling launched afterwards
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Pp][Ss][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]|[Pp][Aa][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]|[Mm][Ss][Tt][Ss][Cc]\.[Ee][Xx][Ee]|[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]|[Rr][Cc][Ll][Oo][Nn][Ee]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 6h
