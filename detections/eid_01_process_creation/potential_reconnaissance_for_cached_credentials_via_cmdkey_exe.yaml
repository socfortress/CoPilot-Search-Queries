name: Potential Reconnaissance For Cached Credentials Via Cmdkey.EXE
id: 07f8bdc2-c9b3-472a-9817-5a670b872f53
version: 1
schema_version: "1.0"
date: "2024-03-05"
author: jmallette, Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 07f8bdc2-c9b3-472a-9817-5a670b872f53
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects usage of cmdkey to look for cached credentials on the system. MITRE
  ATT&CK: T1003.005.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\cmdkey.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "cmdkey.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -l*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /l*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* –l*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* —l*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* ―l*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\cmdkey.exe'; data_win_eventdata_originalFileName equals 'cmdkey.exe';
  data_win_eventdata_commandLine matches '* -l*', among other conditions.

known_false_positives: >
  Legitimate administrative tasks. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://www.peew.pw/blog/2017/11/26/exploring-cmdkey-an-edge-case-for-privilege-escalation
  - https://technet.microsoft.com/en-us/library/cc754243(v=ws.11).aspx
  - https://github.com/redcanaryco/atomic-red-team/blob/b27a3cb25025161d49ac861cb216db68c46a3537/atomics/T1003.005/T1003.005.md#atomic-test-1---cached-credential-dump-via-cmdkey
  - https://attack.mitre.org/techniques/T1003/005/

response:
  message: >
    Potential Reconnaissance For Cached Credentials Via Cmdkey.EXE detected on
    host $agent_name$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1003.005
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.005
  custom_tags:
    - reconnaissance
    - cached
    - credentials
    - process_creation
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Cc][Mm][Dd][Kk][Ee][Yy]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Cc][Mm][Dd][Kk][Ee][Yy]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.* -[Ll].*/ OR data_win_eventdata_commandLine:/.* \/[Ll].*/ OR data_win_eventdata_commandLine:/.* –[Ll].*/ OR data_win_eventdata_commandLine:/.* —[Ll].*/ OR data_win_eventdata_commandLine:/.* ―[Ll].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b1ec66c6-f4d1-4b5c-96dd-af28ccae7727
    name: New Generic Credentials Added Via Cmdkey.EXE
    reason: cmdkey /generic or /add stores credentials; seen when an operator plants or reuses entries after listing them
  - id: 58f50261-c53b-4c88-bd12-1d71f12eda4c
    name: Windows Credential Manager Access via VaultCmd
    reason: VaultCmd /list is the parallel Credential Manager enumeration tool used alongside cmdkey /list
  - id: windows-credentials-access-vaultcli-module-001
    name: Windows Credentials Access Via Vaultcli Module
    reason: vaultcli.dll loaded by an unexpected process indicates programmatic Credential Manager extraction after listing
  - id: 603c6630-5225-49c1-8047-26c964553e0e
    name: Enumerate Credentials from Windows Credential Manager With PowerShell
    reason: PowerShell enumeration of Credential Manager is an alternate path to the same stored secrets
  - id: 99c49d9c-34ea-45f7-84a7-4751ae6b2cbc
    name: Dump Credentials from Windows Credential Manager With PowerShell
    reason: PowerShell dumping of Credential Manager contents is the escalation from listing to extraction
  - id: e0b0c2ab-3d52-46d9-8cb7-049dc775fbd1
    name: Enumeration for Credentials in Registry
    reason: Registry credential sweeps usually accompany cmdkey /list during credential hunting
  - id: 5ef9853e-4d0e-4a70-846f-a9ca37d876da
    name: Potential Credential Dumping Activity Via LSASS
    reason: LSASS access is the next credential source when stored credentials are insufficient
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other credential-store enumeration commands
    query: data_win_system_eventID:"1" AND (((data_win_eventdata_image:/.*\\[Vv][Aa][Uu][Ll][Tt][Cc][Mm][Dd]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*/[Ll][Ii][Ss][Tt].*/)) OR ((data_win_eventdata_image:/.*\\[Rr][Ee][Gg]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*[Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd].*/)) OR ((data_win_eventdata_image:/.*\\[Rr][Ee][Gg]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn].*/)) OR (data_win_eventdata_commandLine:/.*[Gg][Ee][Tt]-[Ss][Tt][Oo][Rr][Ee][Dd][Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll].*/ OR data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Dd][Ee][Nn][Uu][Mm][Ee][Rr][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd][Vv][Aa][Uu][Ll][Tt].*/))
    pivot_on: host
    window: 2h
  - name: Credential Manager / vault library loaded
    query: data_win_system_eventID:"7" AND (data_win_eventdata_imageLoaded:/.*\\[Vv][Aa][Uu][Ll][Tt][Cc][Ll][Ii]\.[Dd][Ll][Ll]/ OR data_win_eventdata_imageLoaded:/.*\\[Cc][Rr][Ee][Dd][Uu][Ii]\.[Dd][Ll][Ll]/)
    pivot_on: host
    window: 2h
  - name: Credential reuse via runas, net use or mstsc
    query: data_win_system_eventID:"1" AND (((data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Aa][Ss]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*/[Ss][Aa][Vv][Ee][Cc][Rr][Ee][Dd].*/)) OR ((data_win_eventdata_image:/.*\\[Nn][Ee][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Nn][Ee][Tt]1\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*[Uu][Ss][Ee].*/) AND (data_win_eventdata_commandLine:/.*/[Uu][Ss][Ee][Rr].*/)) OR ((data_win_eventdata_image:/.*\\[Mm][Ss][Tt][Ss][Cc]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*/[Vv]:.*/)))
    pivot_on: host
    window: 4h
  - name: LSASS access on this host
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 4h
  - name: Remote logons by this account
    query: data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"10")
    pivot_on: user
    window: 6h
