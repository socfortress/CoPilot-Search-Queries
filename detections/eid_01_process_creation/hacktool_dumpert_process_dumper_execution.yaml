name: HackTool - Dumpert Process Dumper Execution
id: 2704ab9e-afe2-4854-a3b1-0c0706d03578
version: 1
schema_version: "1.0"
date: "2025-01-22"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 2704ab9e-afe2-4854-a3b1-0c0706d03578
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the use of Dumpert process dumper, which dumps the lsass.exe process
  memory. MITRE ATT&CK: T1003.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*MD5=09D278F9DE118EF09163C6140255C690*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Dumpert.dll*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_hashes
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_hashes matches
  '*MD5=09D278F9DE118EF09163C6140255C690*'; data_win_eventdata_commandLine
  matches '*Dumpert.dll*'.

known_false_positives: >
  Very unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/outflanknl/Dumpert
  - https://unit42.paloaltonetworks.com/actors-still-exploiting-sharepoint-vulnerability/
  - https://attack.mitre.org/techniques/T1003/001/

response:
  message: >
    HackTool - Dumpert Process Dumper Execution detected on host $agent_name$.
    Matched data_win_eventdata_hashes: $data_win_eventdata_hashes$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1003.001
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_hashes
      type: file_hash
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.001
  custom_tags:
    - hacktool
    - dumpert
    - dumper
    - process_creation
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_hashes:/.*[Mm][Dd]5=09[Dd]278[Ff]9[Dd][Ee]118[Ee][Ff]09163[Cc]6140255[Cc]690.*/ OR data_win_eventdata_commandLine:/.*[Dd][Uu][Mm][Pp][Ee][Rr][Tt]\.[Dd][Ll][Ll].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 93d94efc-d7ad-4161-ad7d-1638c4f908d8
    name: HackTool - Dumpert Process Dumper Default File
    reason: Dumpert writes dumpert.dmp by default; the file-creation event confirms the dump succeeded after this execution.
  - id: 5ef9853e-4d0e-4a70-846f-a9ca37d876da
    name: Potential Credential Dumping Activity Via LSASS
    reason: Dumpert's direct-syscall LSASS read surfaces as suspicious GrantedAccess on lsass.exe in the same minutes.
  - id: a5a2d357-1ab8-4675-a967-ef9990a59391
    name: LSASS Process Memory Dump Files
    reason: The resulting LSASS dump file lands on disk right after the tool runs.
  - id: aba15bdd-657f-422a-bab3-ac2d2a0d6f1c
    name: Potentially Suspicious DMP/HDMP File Creation
    reason: Shell or scripting processes writing .dmp files indicate dumper output being created or moved.
  - id: ec570e53-4c76-45a9-804d-dc3f355ff7a7
    name: 7Zip Compressing Dump Files
    reason: Operators compress the LSASS dump before exfiltration; this is the next staging step.
  - id: 044ba588-dff4-4918-9808-3f95e8160606
    name: Copy .DMP/.DUMP Files From Remote Share Via Cmd.EXE
    reason: Dump files are commonly pulled off the victim over SMB once created.
  - id: fd877b94-9bb5-4191-bb25-d79cbd93c167
    name: Dumping of Sensitive Hives Via Reg.EXE
    reason: Attackers dumping LSASS often also save SAM/SECURITY/SYSTEM hives for offline credential extraction.
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: Same operator goal; credentials may also be parsed live with Mimikatz.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: LSASS opened with dump-capable access rights
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_grantedAccess:/.*0[Xx]1[Ff][Ff][Ff][Ff][Ff].*/ OR data_win_eventdata_grantedAccess:/.*0[Xx]1010.*/ OR data_win_eventdata_grantedAccess:/.*0[Xx]1410.*/ OR data_win_eventdata_grantedAccess:/.*0[Xx]1438.*/ OR data_win_eventdata_grantedAccess:/.*0[Xx]143[Aa].*/)
    pivot_on: host
    window: 4h
  - name: Dump artefacts written to disk
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*([Dd][Uu][Mm][Pp][Ee][Rr][Tt]|[Ll][Ss][Aa][Ss][Ss]|[Dd][Uu][Mm][Pp]|[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp])[^\\]*\.([Dd][Mm][Pp]|[Dd][Uu][Mm][Pp]|[Bb][Ii][Nn]|[Zz][Ii][Pp]|[Rr][Aa][Rr]|7[Zz])/
    pivot_on: host
    window: 4h
  - name: Dump staged for exfiltration (archive or transfer tool)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\7[Zz]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\7[Zz][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Aa][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Tt][Aa][Rr]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*([Dd][Mm][Pp]|[Ll][Ss][Aa][Ss][Ss]).*/
    pivot_on: host
    window: 4h
  - name: Dumpert.dll or Outflank loader invoked via rundll32
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*([Dd][Uu][Mm][Pp][Ee][Rr][Tt]|[Oo][Uu][Tt][Ff][Ll][Aa][Nn][Kk]).*/
    pivot_on: host
    window: 4h
  - name: 'Dumped credentials reused: explicit-credential or NewCredentials logons'
    query: (data_win_system_eventID:"4648" OR (data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"9"))
    pivot_on: user
    window: 24h
