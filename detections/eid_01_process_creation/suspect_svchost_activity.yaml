name: Suspect Svchost Activity
id: 16c37b52-b141-42a5-a3ea-bbe098444397
version: 1
schema_version: "1.0"
date: "2022-06-27"
author: David Burkett, @signalblur
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 16c37b52-b141-42a5-a3ea-bbe098444397
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  It is extremely abnormal for svchost.exe to spawn without any CLI arguments
  and is normally observed when a malicious process spawns the process and
  injects code into the process memory space. MITRE ATT&CK: T1055.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*svchost.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\svchost.exe"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_parentImage"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_parentImage:
                          value: "*\\\\rpcnet.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_parentImage:
                          value: "*\\\\rpcnetp.exe"
                          case_insensitive: true
                    - bool:
                        must_not:
                          - exists:
                              field: "data_win_eventdata_commandLine"
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*svchost.exe'; data_win_eventdata_image matches '*\svchost.exe';
  data_win_eventdata_parentImage matches '*\rpcnet.exe', among other conditions.

known_false_positives: >
  Rpcnet.exe / rpcnetp.exe which is a lojack style software.
  https://www.blackhat.com/docs/us-14/materials/us-14-Kamlyuk-Kamluk-Computrace-Backdoor-Revisited.pdf.
  Baseline expected activity in your environment and tune this detection before
  relying on it for automated response.

references:
  - https://web.archive.org/web/20180718061628/https://securitybytes.io/blue-team-fundamentals-part-two-windows-processes-759fe15965e2
  - https://attack.mitre.org/techniques/T1055/

response:
  message: >
    Suspect Svchost Activity detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1055
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1055
  custom_tags:
    - suspect
    - svchost
    - process_creation
    - sysmon
    - privilege_escalation
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ AND _exists_:data_win_eventdata_parentImage AND NOT (data_win_eventdata_parentImage:/.*\\[Rr][Pp][Cc][Nn][Ee][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Rr][Pp][Cc][Nn][Ee][Tt][Pp]\.[Ee][Xx][Ee]/ OR NOT _exists_:data_win_eventdata_commandLine)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: be58d2e2-06c8-4f58-b666-b99f6dc3b6cd
    name: Suspicious Process Masquerading As SvcHost.EXE
    reason: Same goal of passing as svchost; one fakes the binary, the other hollows the real one.
  - id: 01d2e2a1-5f09-44f7-9fc1-24faa7479b6d
    name: Uncommon Svchost Parent Process
    reason: Wrong-parent svchost is the sibling indicator of the same spawn-and-inject chain.
  - id: 166e9c50-8cd9-44af-815d-d1f0c0e90dde
    name: Suspicious Svchost Process Access
    reason: Injection into svchost memory follows the argument-less spawn.
  - id: 174afcfa-6e40-4ae9-af64-496546389294
    name: Credential Dumping Attempt Via Svchost
    reason: An injected svchost is commonly used to reach LSASS and dump credentials.
  - id: d8937fe7-42d5-4b4d-8178-e089c908f63f
    name: Potential Pikabot Hollowing Activity
    reason: Known malware family using the same hollowing technique.
  - id: 85d23b42-9a9d-4f8f-b3d7-d2733c1d58f5
    name: HackTool - HollowReaper Execution
    reason: Tooling that produces exactly this hollowed-process pattern.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Processes accessing svchost memory
    query: data_win_system_eventID:10 AND data_win_eventdata_targetImage:/.*\\svchost\.exe/ AND NOT data_win_eventdata_sourceImage:/.*\\(csrss|services|lsass|wininit|MsMpEng)\.exe/
    pivot_on: host
    window: 2h
  - name: Remote threads created in svchost
    query: data_win_system_eventID:8 AND data_win_eventdata_targetImage:/.*\\svchost\.exe/
    pivot_on: host
    window: 2h
  - name: svchost connections to external addresses
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*\\svchost\.exe/ AND data_win_eventdata_initiated:true AND NOT data_win_eventdata_destinationIp:(10.* OR 192.168.* OR 127.*)
    pivot_on: host
    window: 4h
  - name: svchost launched without -k
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*\\svchost\.exe/ AND NOT data_win_eventdata_commandLine:/.*-k .*/
    pivot_on: host
    window: 2h
  - name: Dropper files in user-writable paths
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\\(AppData|Temp|ProgramData)\\.*\.(exe|dll)/
    pivot_on: host
    window: 2h
