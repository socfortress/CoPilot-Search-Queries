name: Potentially Suspicious Ping/Copy Command Combination
id: ded2b07a-d12f-4284-9b76-653e37b6c8b0
version: 1
schema_version: "1.0"
date: "2024-03-06"
author: X__Junior (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: ded2b07a-d12f-4284-9b76-653e37b6c8b0
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects uncommon and potentially suspicious one-liner command containing both
  "ping" and "copy" at the same time, which is usually used by malware. MITRE
  ATT&CK: T1070.004.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\cmd.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "Cmd.Exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*ping*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*copy *"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -n *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /n *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* –n *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* —n *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* ―n *"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -y *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /y *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* –y *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* —y *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* ―y *"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches '*\cmd.exe';
  data_win_eventdata_originalFileName equals 'Cmd.Exe';
  data_win_eventdata_commandLine matches '*ping*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - Internal Research
  - https://attack.mitre.org/techniques/T1070/004/

response:
  message: >
    Potentially Suspicious Ping/Copy Command Combination detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1070.004
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1070.004
  custom_tags:
    - combination
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Cc][Mm][Dd]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Pp][Ii][Nn][Gg].*/ AND data_win_eventdata_commandLine:/.*[Cc][Oo][Pp][Yy] .*/ AND (data_win_eventdata_commandLine:/.* -[Nn] .*/ OR data_win_eventdata_commandLine:/.* \/[Nn] .*/ OR data_win_eventdata_commandLine:/.* –[Nn] .*/ OR data_win_eventdata_commandLine:/.* —[Nn] .*/ OR data_win_eventdata_commandLine:/.* ―[Nn] .*/) AND (data_win_eventdata_commandLine:/.* -[Yy] .*/ OR data_win_eventdata_commandLine:/.* \/[Yy] .*/ OR data_win_eventdata_commandLine:/.* –[Yy] .*/ OR data_win_eventdata_commandLine:/.* —[Yy] .*/ OR data_win_eventdata_commandLine:/.* ―[Yy] .*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: ce058d6c-79f2-11ec-b476-acde48001122
    name: Ping Sleep Batch Command
    reason: Ping used as a sleep timer to delay actions; ping plus copy/del is the delayed self-replace or self-delete idiom.
  - id: 204b17ae-4007-471b-917b-b917b315c5db
    name: Greedy File Deletion Using Del
    reason: Delay-then-delete one-liners remove the dropper afterwards; deletion confirms cleanup.
  - id: b6676963-0353-4f88-90f5-36c20d443c6a
    name: Cscript/Wscript Potentially Suspicious Child Process
    reason: Script droppers commonly launch such cmd one-liners; identifies the parent chain.
  - id: 5a6b7c8d-9e0f-1a2b-3c4d-5e6f7a8b9c0d
    name: Cmd Launched with Hidden Start Flags to Suspicious Targets
    reason: Same hidden cmd launching pattern used by malware loaders around the one-liner.
  - id: 855bc8b5-2ae8-402e-a9ed-b889e6df1900
    name: Copy From Or To Admin Share Or Sysvol Folder
    reason: If the copy targets a share, the one-liner is lateral spread of the binary rather than self-cleanup.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: cmd one-liners mixing ping with copy, delete or move
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Cc][Mm][Dd])\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Pp][Ii][Nn][Gg].*([Cc][Oo][Pp][Yy]|[Dd][Ee][Ll]|[Mm][Oo][Vv][Ee]).*/
    pivot_on: host
    window: 2h
  - name: Executables and scripts created in user-writable paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(\\[Tt]emp\\|\\[Aa]pp[Dd]ata\\|\\[Pp]rogram[Dd]ata\\|\\[Pp]ublic\\|\\[Dd]ownloads\\).*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Bb][Aa][Tt]|[Pp][Ss]1|[Vv][Bb][Ss]|[Jj][Ss])/
    pivot_on: host
    window: 2h
  - name: File deletion and wipe commands
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*(( |&)[Dd][Ee][Ll] |[Rr][Dd] \/[Ss]|[Ee][Rr][Aa][Ss][Ee] |[Ss][Dd][Ee][Ll][Ee][Tt][Ee]).*/
    pivot_on: host
    window: 2h
  - name: Persistence via run keys or scheduled tasks
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss].*\/[Cc][Rr][Ee][Aa][Tt][Ee]|[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn]).*/
    pivot_on: host
    window: 4h
