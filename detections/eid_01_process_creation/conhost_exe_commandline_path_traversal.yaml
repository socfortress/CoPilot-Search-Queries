name: Conhost.exe CommandLine Path Traversal
id: ee5e119b-1f75-4b34-add8-3be976961e39
version: 1
schema_version: "1.0"
date: "2022-06-14"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: ee5e119b-1f75-4b34-add8-3be976961e39
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  detects the usage of path traversal in conhost.exe indicating possible
  command/argument confusion/hijacking. MITRE ATT&CK: T1059.003.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_parentCommandLine:
              value: "*conhost*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine: "*/../../*"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentCommandLine
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentCommandLine matches
  '*conhost*'; data_win_eventdata_commandLine matches '*/../../*'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://pentestlab.blog/2020/07/06/indirect-command-execution/
  - https://attack.mitre.org/techniques/T1059/003/

response:
  message: >
    Conhost.exe CommandLine Path Traversal detected on host $agent_name$.
    Matched data_win_eventdata_parentCommandLine:
    $data_win_eventdata_parentCommandLine$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1059.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_parentCommandLine
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.003
  custom_tags:
    - conhost
    - traversal
    - process_creation
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_parentCommandLine:/.*[Cc][Oo][Nn][Hh][Oo][Ss][Tt].*/ AND data_win_eventdata_commandLine:/.*\/\.\.\/\.\.\/.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7dc2dedd-7603-461a-bc13-15803d132355
    name: Uncommon Child Process Of Conhost.EXE
    reason: Conhost argument hijack is used to make conhost launch an arbitrary child; this shows the child that actually ran.
  - id: dfa03a09-8b92-4d83-8e74-f72839b1c407
    name: Potentially Suspicious Child Processes Spawned by ConHost
    reason: 'Direct follow-on: conhost spawning shells or LOLBins after traversal-abused arguments.'
  - id: cbb9e3d1-2386-4e59-912e-62f1484f7a89
    name: Conhost Spawned By Uncommon Parent Process
    reason: Same conhost abuse family; an odd parent suggests injection or proxy execution delivering the traversal.
  - id: windows-conhost-headless-argument-001
    name: Windows ConHost with Headless Argument
    reason: Headless conhost is the commonest conhost proxy-execution form used alongside argument tricks.
  - id: 056c7317-9a09-4bd4-9067-d051312752ea
    name: Powershell Executed From Headless ConHost Process
    reason: 'Typical payload stage: PowerShell launched through conhost to evade parent-based detection.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Conhost launching children
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Cc][Oo][Nn][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee].*/
    pivot_on: host
    window: 1h
  - name: Path traversal in conhost command lines
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Cc][Oo][Nn][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee].*/ AND data_win_eventdata_commandLine:/.*\.\.[\\/]\.\..*/
    pivot_on: host
    window: 2h
  - name: Shells and LOLBins spawned from conhost
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Cc][Oo][Nn][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee].*/ AND data_win_eventdata_image:(/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ OR /.*[Cc][Mm][Dd]\.[Ee][Xx][Ee].*/ OR /.*[Rr][Ee][Gg][Ss][Vv][Rr]32.*/ OR /.*[Rr][Uu][Nn][Dd][Ll][Ll]32.*/ OR /.*[Mm][Ss][Hh][Tt][Aa].*/)
    pivot_on: host
    window: 1h
  - name: Headless conhost invocations
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Cc][Oo][Nn][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee].*/ AND data_win_eventdata_commandLine:/.*--headless.*/
    pivot_on: host
    window: 4h
