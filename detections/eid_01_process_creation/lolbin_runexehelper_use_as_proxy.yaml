name: Lolbin Runexehelper Use As Proxy
id: cd71385d-fd9b-4691-9b98-2b1f7e508714
version: 1
schema_version: "1.0"
date: "2022-12-29"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: cd71385d-fd9b-4691-9b98-2b1f7e508714
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detect usage of the "runexehelper.exe" binary as a proxy to launch other
  programs. MITRE ATT&CK: T1218.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_parentImage:
              value: "*\\\\runexehelper.exe"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\runexehelper.exe'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/0gtweet/status/1206692239839289344
  - https://lolbas-project.github.io/lolbas/Binaries/Runexehelper/
  - https://attack.mitre.org/techniques/T1218/

response:
  message: >
    Lolbin Runexehelper Use As Proxy detected on host $agent_name$. Matched
    data_win_eventdata_parentImage: $data_win_eventdata_parentImage$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1218
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218
  custom_tags:
    - lolbin
    - runexehelper
    - proxy
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Rr][Uu][Nn][Ee][Xx][Ee][Hh][Ee][Ll][Pp][Ee][Rr]\.[Ee][Xx][Ee]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 727454c0-d851-48b0-8b89-385611ab0704
    name: Lolbin Unregmp2.exe Use As Proxy
    reason: Sibling signed-binary proxy-execution abuse; attackers cycle through such LOLBINs on the same host.
  - id: 729ce0ea-5d8f-4769-9762-e35de441586d
    name: MpiExec Lolbin
    reason: Another rarely-used signed binary that launches arbitrary executables as proxy.
  - id: d3bf399f-b0cf-4250-8bb4-dfc192ab81dc
    name: Ie4uinit Lolbin Use From Invalid Path
    reason: Same T1218 proxy-execution family, often chained after the first proxy succeeds or is blocked.
  - id: d4ca7c59-e9e4-42d8-bf57-91a776efcb87
    name: LOLBIN Execution From Abnormal Drive
    reason: Runexehelper copied to or run from a removable/mounted drive would also trip this.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Runexehelper executions
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Rr][Uu][Nn][Ee][Xx][Ee][Hh][Ee][Ll][Pp][Ee][Rr].[Ee][Xx][Ee])/
    pivot_on: host
    window: 4h
  - name: Runexehelper binary dropped or copied
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Rr][Uu][Nn][Ee][Xx][Ee][Hh][Ee][Ll][Pp][Ee][Rr].*/
    pivot_on: host
    window: 24h
  - name: Shells and scripting engines spawned by it
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\([Rr][Uu][Nn][Ee][Xx][Ee][Hh][Ee][Ll][Pp][Ee][Rr].[Ee][Xx][Ee])/ AND data_win_eventdata_image:/.*\\([Cc][Mm][Dd].[Ee][Xx][Ee]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].[Ee][Xx][Ee]|[Pp][Ww][Ss][Hh].[Ee][Xx][Ee]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt].[Ee][Xx][Ee]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt].[Ee][Xx][Ee]|[Mm][Ss][Hh][Tt][Aa].[Ee][Xx][Ee])/
    pivot_on: host
    window: 2h
  - name: Network from proxy-launched processes
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].[Ee][Xx][Ee]|[Cc][Mm][Dd].[Ee][Xx][Ee]|[Rr][Uu][Nn][Dd][Ll][Ll]32.[Ee][Xx][Ee]|[Rr][Ee][Gg][Ss][Vv][Rr]32.[Ee][Xx][Ee]|[Mm][Ss][Hh][Tt][Aa].[Ee][Xx][Ee])/
    pivot_on: host
    window: 2h
