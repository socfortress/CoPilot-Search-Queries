name: Uncommon Child Process Of AddinUtil.EXE
id: b5746143-59d6-4603-8d06-acbd60e166ee
version: 1
schema_version: "1.0"
date: "2023-09-18"
author: Michael McKinley (@McKinleyMike), Tony Latteri (@TheLatteri)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: b5746143-59d6-4603-8d06-acbd60e166ee
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects uncommon child processes of the Add-In deployment cache updating
  utility (AddInutil.exe) which could be a sign of potential abuse of the binary
  to proxy execution via a custom Addins.Store payload. MITRE ATT&CK: T1218.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_parentImage:
              value: "*\\\\addinutil.exe"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*:\\\\Windows\\\\System32\\\\conhost.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*:\\\\Windows\\\\System32\\\\werfault.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*:\\\\Windows\\\\SysWOW64\\\\werfault.exe"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\addinutil.exe'; data_win_eventdata_image matches
  '*:\Windows\System32\conhost.exe'; data_win_eventdata_image matches
  '*:\Windows\System32\werfault.exe', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.blue-prints.blog/content/blog/posts/lolbin/addinutil-lolbas.html
  - https://attack.mitre.org/techniques/T1218/

response:
  message: >
    Uncommon Child Process Of AddinUtil.EXE detected on host $agent_name$.
    Matched data_win_eventdata_parentImage: $data_win_eventdata_parentImage$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1218
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218
  custom_tags:
    - uncommon
    - child
    - addinutil
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Aa][Dd][Dd][Ii][Nn][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/ AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Cc][Oo][Nn][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ww][Ee][Rr][Ff][Aa][Uu][Ll][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Ww][Oo][Ww]64\\[Ww][Ee][Rr][Ff][Aa][Uu][Ll][Tt]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 631b22a4-70f4-4e2f-9ea8-42f84d9df6d8
    name: Suspicious AddinUtil.EXE CommandLine Execution
    reason: Same binary invoked with -AddinRoot/-PipelineRoot pointing at attacker Addins.Store content; the cause of the child process.
  - id: 4f2cd9b6-4a17-440f-bb2a-687abb65993a
    name: Uncommon AddinUtil.EXE CommandLine Execution
    reason: Parent invocation with unusual arguments immediately precedes the child spawn.
  - id: 6120ac2a-a34b-42c0-a9bd-1fb9f459f348
    name: AddinUtil.EXE Execution From Uncommon Directory
    reason: Copied AddinUtil in a writable folder next to a malicious Addins.Store is the staging step.
  - id: 5205613d-2a63-4412-a895-3a2458b587b3
    name: Network Connection Initiated By AddinUtil.EXE
    reason: AddinUtil should not use the network; a connection indicates the payload or a download inside its process.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: AddinUtil invocations and arguments
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Aa]ddin[Uu]til\.exe/
    pivot_on: host
    window: 2h
  - name: Addins.Store files created
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(/.*[Aa]ddins\.[Ss]tore/ OR /.*[Pp]ipeline.*\.dll/)
    pivot_on: host
    window: 4h
  - name: Network connections by AddinUtil
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*[Aa]ddin[Uu]til\.exe/
    pivot_on: host
    window: 2h
  - name: Shells and script hosts spawned
    query: data_win_system_eventID:1 AND data_win_eventdata_image:(/.*\\[Cc]md\.exe/ OR /.*\\[Pp]ower[Ss]hell.*\.exe/ OR /.*\\[Ww]script\.exe/ OR /.*\\[Cc]script\.exe/ OR /.*\\[Mm]shta\.exe/)
    pivot_on: host
    window: 1h
