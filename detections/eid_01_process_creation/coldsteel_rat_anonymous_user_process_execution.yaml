name: COLDSTEEL RAT Anonymous User Process Execution
id: e01b6eb5-1eb4-4465-a165-85d40d874add
version: 1
schema_version: "1.0"
date: "2023-04-30"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: e01b6eb5-1eb4-4465-a165-85d40d874add
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the creation of a process executing as user called "ANONYMOUS" seen
  used by the "MileStone2016" variant of COLDSTEEL.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\Windows\\\\System32\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\AppData\\\\*"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_user:
              value: "*ANONYMOUS*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_user
    - data_win_eventdata_image
    - data_win_eventdata_commandLine

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\Windows\System32\*'; data_win_eventdata_parentImage matches '*\AppData\*';
  data_win_eventdata_user matches '*ANONYMOUS*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.ncsc.gov.uk/static-assets/documents/malware-analysis-reports/cold-steel/NCSC-MAR-Cold-Steel.pdf

response:
  message: >
    COLDSTEEL RAT Anonymous User Process Execution detected on host
    $agent_name$. Matched data_win_eventdata_parentImage:
    $data_win_eventdata_parentImage$. Matched data_win_eventdata_user:
    $data_win_eventdata_user$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_user
      type: user

tags:
  asset_type: Endpoint
  custom_tags:
    - coldsteel
    - anonymous
    - process_creation
    - sysmon
    - persistence
    - stealth
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\.*/ OR data_win_eventdata_parentImage:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/) AND data_win_eventdata_user:/.*[Aa][Nn][Oo][Nn][Yy][Mm][Oo][Uu][Ss].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 9f9cd389-cea0-4142-bf1a-a3fd424abedd
    name: COLDSTEEL RAT Service Persistence Execution
    reason: The MileStone2016 variant runs its persistence svchost service -k msupdate/alg, which yields the ANONYMOUS-context processes.
  - id: 88516f06-ebe0-47ad-858e-ae9fd060ddea
    name: COLDSTEEL RAT Cleanup Command Execution
    reason: Same malware; cleanup rundll32 spawned from the persistence service ends the infection.
  - id: 16c37b52-b141-42a5-a3ea-bbe098444397
    name: Suspect Svchost Activity
    reason: Malicious svchost with unusual parameters or location hosts the ColdSteel service.
  - id: 01d2e2a1-5f09-44f7-9fc1-24faa7479b6d
    name: Uncommon Svchost Parent Process
    reason: A svchost launched by a non-services parent corroborates the implant.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Processes running as ANONYMOUS user
    query: data_win_system_eventID:1 AND data_win_eventdata_user:/.*ANONYMOUS.*/
    pivot_on: host
    window: 6h
  - name: Svchost with ColdSteel service group names
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*svchost\.exe/ AND data_win_eventdata_commandLine:/.*-k (msupdate|msupdate2|alg).*/
    pivot_on: host
    window: 24h
  - name: Service registry persistence for msupdate
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*\\Services\\.*(msupdate|alg).*/
    pivot_on: host
    window: 24h
  - name: Rundll32 calling service-style exports
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*[Rr]undll32.*(ServiceMain|UpdateDriverForPlugAndPlayDevicesW|DiUninstallDevice).*/
    pivot_on: host
    window: 6h
  - name: Outbound connections from svchost or AppData binaries
    query: data_win_system_eventID:3 AND (data_win_eventdata_image:/.*svchost\.exe/ OR data_win_eventdata_image:/.*\\AppData\\.*/)
    pivot_on: host
    window: 6h
