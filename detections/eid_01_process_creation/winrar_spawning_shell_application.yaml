name: Windows WinRAR Spawning Shell Application
id: windows-winrar-spawning-shell-001
version: 1
schema_version: "1.0"
date: "2026-02-23"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects WinRAR spawning shell processes such as cmd.exe, powershell.exe, 
  certutil.exe, mshta.exe, bitsadmin.exe, wscript.exe, or cscript.exe. This 
  may indicate exploitation of CVE-2023-38831 where malicious scripts are 
  executed from spoofed ZIP archives opened in WinRAR.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - wildcard:
            data_win_eventdata_parentImage: "*\\\\winrar.exe"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image: "*\\\\cmd.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\\\powershell.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\\\pwsh.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\\\certutil.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\\\mshta.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\\\bitsadmin.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\\\wscript.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\\\cscript.exe"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-23 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-23 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Windows endpoints with Sysmon 
  installed and configured to log process creation events (EventID 1) with full 
  command-line arguments and parent process tracking.

known_false_positives: >
  WinRAR may legitimately spawn command-line processes in rare cases such as 
  running post-extraction scripts. Review the command line arguments and user 
  context to determine legitimacy.

references:
  - https://attack.mitre.org/techniques/T1105/
  - https://www.group-ib.com/blog/cve-2023-38831-winrar-zero-day/
  - https://github.com/b1tg/CVE-2023-38831-winrar-exploit

response:
  message: >
    WinRAR spawned shell process on $agent_name$. 
    Parent: $data_win_eventdata_parentImage$. 
    Child: $data_win_eventdata_image$. 
    Command: $data_win_eventdata_commandLine$. 
    User: $data_win_eventdata_user$. 
    Possible CVE-2023-38831 exploitation. MITRE ATT&CK: T1105
  risk_score: 72
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 72
  threat_objects: []

tags:
  analytic_story:
    - WinRAR Spoofing Attack CVE-2023-38831
    - Compromised Windows Host
  asset_type: Endpoint
  cve:
    - CVE-2023-38831
  mitre_attack_id:
    - T1105
  custom_tags:
    - winrar
    - cve_exploit
    - shell_spawn
    - archive_exploitation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*winrar\.exe/ AND (data_win_eventdata_image:/.*cmd\.exe/ OR data_win_eventdata_image:/.*powershell\.exe/ OR data_win_eventdata_image:/.*pwsh\.exe/ OR data_win_eventdata_image:/.*certutil\.exe/ OR data_win_eventdata_image:/.*mshta\.exe/ OR data_win_eventdata_image:/.*bitsadmin\.exe/ OR data_win_eventdata_image:/.*wscript\.exe/ OR data_win_eventdata_image:/.*cscript\.exe/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 146aace8-9bd6-42ba-be7a-0070d8027b76
    name: Potentially Suspicious Child Process Of WinRAR.EXE
    reason: Same parent-child relationship; fires together when the lure payload launches.
  - id: ec3a3c2f-9bb0-4a9b-8f4b-5ec386544343
    name: CVE-2023-38331 Exploitation Attempt - Suspicious WinRAR Child Process
    reason: Exploit-specific variant of WinRAR spawning a script/shell from a crafted archive.
  - id: 74a2b37d-fea4-41e0-9ac7-c9fbcf1f60cc
    name: WinRAR Creating Files in Startup Locations
    reason: 'Follow-on: payload extracted by WinRAR is placed in Startup for persistence.'
  - id: 19b08b1c-861d-4e75-a1ef-ea0c1baf202b
    name: Suspicious Download Via Certutil.EXE
    reason: 'Follow-on: the spawned shell/certutil downloads the second stage.'
  - id: d059842b-6b9d-4ed1-b5c3-5b89143c6ede
    name: File Download Via Bitsadmin
    reason: 'Follow-on: bitsadmin is a listed child and a standard second-stage downloader.'
  - id: e32d4572-9826-4738-b651-95fa63747e8a
    name: Base64 Encoded PowerShell Command Detected
    reason: 'Follow-on: spawned PowerShell commonly runs encoded loader commands.'
  - id: 81325ce1-be01-4250-944f-b4789644556f
    name: Schedule Task Creation From Env Variable Or Potentially Suspicious Path Via Schtasks.EXE
    reason: 'Follow-on: persistence via scheduled task after the payload executes.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Files written by WinRAR (extracted lure payloads)
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Rr][Aa][Rr]\.[Ee][Xx][Ee]/ AND data_win_eventdata_targetFilename:/.*\.([Cc][Mm][Dd]|[Bb][Aa][Tt]|[Pp][Ss]1|[Vv][Bb][Ss]|[Jj][Ss]|[Ee][Xx][Ee]|[Ss][Cc][Rr]|[Ll][Nn][Kk]|[Hh][Tt][Aa])/
    pivot_on: host
    window: 2h
  - name: Download cradles from shell children
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg]|[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee]|[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt]|[Uu][Rr][Ll][Cc][Aa][Cc][Hh][Ee]|[Bb][Ii][Tt][Ss][Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr]|[Ff][Rr][Oo][Mm][Bb][Aa][Ss][Ee]64).*/
    pivot_on: host
    window: 2h
  - name: Outbound connections from script hosts
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Cc][Mm][Dd]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]|[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]|[Mm][Ss][Hh][Tt][Aa]|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt])\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Persistence via schtasks or Run key
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/)
    pivot_on: host
    window: 4h
  - name: DNS lookups by script interpreters
    query: data_win_system_eventID:"22" AND data_win_eventdata_image:/.*\\([Cc][Mm][Dd]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]|[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]|[Mm][Ss][Hh][Tt][Aa]|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt])\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
