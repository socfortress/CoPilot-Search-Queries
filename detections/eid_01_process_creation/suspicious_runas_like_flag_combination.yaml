name: Suspicious RunAs-Like Flag Combination
id: 50d66fb0-03f8-4da0-8add-84e77d12a020
version: 1
schema_version: "1.0"
date: "2022-11-11"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 50d66fb0-03f8-4da0-8add-84e77d12a020
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious command line flags that let the user set a target user and
  command as e.g. seen in PsExec-like tools.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -u system *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* --user system *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -u NT*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -u \"NT*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -u 'NT*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* --system *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -u administrator *"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -c cmd*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -c \"cmd*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -c powershell*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -c \"powershell*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* --command cmd*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* --command powershell*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -c whoami*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -c wscript*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -c cscript*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches '* -u
  system *'; data_win_eventdata_commandLine matches '* --user system *';
  data_win_eventdata_commandLine matches '* -u NT*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.trendmicro.com/en_us/research/22/k/hack-the-real-box-apt41-new-subgroup-earth-longzhi.html

response:
  message: >
    Suspicious RunAs-Like Flag Combination detected on host $agent_name$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - runas
    - combination
    - process_creation
    - sysmon
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.* -[Uu] [Ss][Yy][Ss][Tt][Ee][Mm] .*/ OR data_win_eventdata_commandLine:/.* --[Uu][Ss][Ee][Rr] [Ss][Yy][Ss][Tt][Ee][Mm] .*/ OR data_win_eventdata_commandLine:/.* -[Uu] [Nn][Tt].*/ OR data_win_eventdata_commandLine:/.* -[Uu] \"[Nn][Tt].*/ OR data_win_eventdata_commandLine:/.* -[Uu] '[Nn][Tt].*/ OR data_win_eventdata_commandLine:/.* --[Ss][Yy][Ss][Tt][Ee][Mm] .*/ OR data_win_eventdata_commandLine:/.* -[Uu] [Aa][Dd][Mm][Ii][Nn][Ii][Ss][Tt][Rr][Aa][Tt][Oo][Rr] .*/) AND (data_win_eventdata_commandLine:/.* -[Cc] [Cc][Mm][Dd].*/ OR data_win_eventdata_commandLine:/.* -[Cc] \"[Cc][Mm][Dd].*/ OR data_win_eventdata_commandLine:/.* -[Cc] [Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.* -[Cc] \"[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.* --[Cc][Oo][Mm][Mm][Aa][Nn][Dd] [Cc][Mm][Dd].*/ OR data_win_eventdata_commandLine:/.* --[Cc][Oo][Mm][Mm][Aa][Nn][Dd] [Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.* -[Cc] [Ww][Hh][Oo][Aa][Mm][Ii].*/ OR data_win_eventdata_commandLine:/.* -[Cc] [Ww][Ss][Cc][Rr][Ii][Pp][Tt].*/ OR data_win_eventdata_commandLine:/.* -[Cc] [Cc][Ss][Cc][Rr][Ii][Pp][Tt].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 730fc21b-eaff-474b-ad23-90fd265d4988
    name: Psexec Execution
    reason: PsExec-style -u/-s flags are the typical match for this rule.
  - id: 27c3a83d-cada-47c6-9042-67baf19d2574
    name: Detect PsExec With accepteula Flag
    reason: First-run PsExec shows the accepteula flag alongside the user switch.
  - id: 7c0dcd3d-acf8-4f71-9570-f448b0034f94
    name: PsExec Service Child Process Execution as LOCAL SYSTEM
    reason: Resulting SYSTEM child process on the target after the runas-like launch.
  - id: fdfcbd78-48f1-4a4b-90ac-d82241e368c5
    name: PsExec Service Execution
    reason: Service-based execution on the destination host.
  - id: 304afd73-55a5-4bb9-8c21-0b1fc84ea9e4
    name: PSEXEC Remote Execution File Artefact
    reason: PSEXESVC artifact written on the remote target.
  - id: ea011323-7045-460b-b2d7-0f7442ea6b38
    name: Potential PsExec Remote Execution
    reason: Remote execution variant sharing the same command-line pattern.
  - id: 683e6196-b8e8-11eb-9a79-acde48001122
    name: Detect Renamed PSExec
    reason: Renamed copies evade name-based detection yet use the same flags.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: PsExec-style tool use
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*([Pp]s[Ee]xec|PSEXESVC|[Pp]aexec|[Rr]emcom|[Cc]sexec).*/ OR data_win_eventdata_originalFileName:/.*[Pp]s[Ee]xec.*/)
    pivot_on: host
    window: 4h
  - name: SYSTEM children of PSEXESVC or services
    query: data_win_system_eventID:1 AND data_win_eventdata_user:/.*SYSTEM/ AND data_win_eventdata_parentImage:/.*(PSEXESVC|services)\.exe/
    pivot_on: host
    window: 2h
  - name: Credential access tooling
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(sekurlsa|lsass|procdump|MiniDump|ntdsutil).*/
    pivot_on: host
    window: 4h
  - name: Service creation and net use
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(sc(.exe)? .*create |net1? use ).*/
    pivot_on: host
    window: 4h
  - name: Shells launched with user switch
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*(cmd|powershell)\.exe/ AND data_win_eventdata_commandLine:/.* -[Uu] .*/
    pivot_on: host
    window: 2h
