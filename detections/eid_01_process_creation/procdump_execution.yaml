name: Procdump Execution
id: 2e65275c-8288-4ab4-aeb7-6274f58b6b20
version: 1
schema_version: "1.0"
date: "2026-06-29"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 2e65275c-8288-4ab4-aeb7-6274f58b6b20
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects usage of the SysInternals Procdump utility. MITRE ATT&CK: T1036,
  T1003.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\procdump.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\procdump64.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\procdump64a.exe"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\procdump.exe'; data_win_eventdata_image matches '*\procdump64.exe';
  data_win_eventdata_image matches '*\procdump64a.exe'.

known_false_positives: >
  Legitimate use of procdump by a developer or administrator. Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://learn.microsoft.com/en-us/sysinternals/downloads/procdump
  - https://attack.mitre.org/techniques/T1036/
  - https://attack.mitre.org/techniques/T1003/001/

response:
  message: >
    Procdump Execution detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1036, T1003.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1036
    - T1003.001
  custom_tags:
    - procdump
    - process_creation
    - sysmon
    - stealth
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]64\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]64[Aa]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 5afee48e-67dd-4e03-a783-f74259dcf998
    name: Potential LSASS Process Dump Via Procdump
    reason: Procdump targeting lsass is the high-severity variant of this same execution.
  - id: 79b06761-465f-4f88-9ef2-150e24d3d737
    name: Potential SysInternals ProcDump Evasion
    reason: Renamed or evasive procdump invocations accompany deliberate dumping.
  - id: 5ef9853e-4d0e-4a70-846f-a9ca37d876da
    name: Potential Credential Dumping Activity Via LSASS
    reason: Sysmon process access to lsass confirms procdump actually read LSASS memory.
  - id: a18dd26b-6450-46de-8c91-9659150cf088
    name: Potentially Suspicious GrantedAccess Flags On LSASS
    reason: Access mask 0x1fffff/0x1010 on lsass corroborates the dump.
  - id: ffa6861c-4461-4f59-8a41-578c39f3f23e
    name: LSASS Dump Keyword In CommandLine
    reason: Dump-named output files in the command line show the same intent.
  - id: ec570e53-4c76-45a9-804d-dc3f355ff7a7
    name: 7Zip Compressing Dump Files
    reason: 'Follow-on: dump is compressed for exfiltration.'
  - id: 044ba588-dff4-4918-9808-3f95e8160606
    name: Copy .DMP/.DUMP Files From Remote Share Via Cmd.EXE
    reason: Dump file moved to another system for offline parsing.
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: Dumps are parsed with mimikatz/pypykatz after collection.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Procdump arguments targeting lsass or -ma
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*(-ma|-mm|-mp|-accepteula|lsass).*/) AND data_win_eventdata_image:(/.*procdump.*/)
    pivot_on: host
    window: 4h
  - name: Dump file creation (.dmp)
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(/.*\.dmp/)
    pivot_on: host
    window: 4h
  - name: LSASS process access events
    query: data_win_system_eventID:10 AND data_win_eventdata_targetImage:(/.*\\lsass\.exe/)
    pivot_on: host
    window: 4h
  - name: Archiving or copying dumps
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*(\.dmp).*(7z|rar|zip|copy|xcopy|curl|scp|rclone).*/)
    pivot_on: host
    window: 6h
  - name: Parsing tools run on dumps
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*(sekurlsa|pypykatz|minidump|mimikatz).*/)
    pivot_on: host
    window: 24h
