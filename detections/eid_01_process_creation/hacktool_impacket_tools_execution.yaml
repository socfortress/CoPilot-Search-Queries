  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Gg][Oo][Ll][Dd][Ee][Nn][Pp][Aa][Cc].*/ OR data_win_eventdata_image:/.*\\[Kk][Aa][Rr][Mm][Aa][Ss][Mm][Bb].*/ OR data_win_eventdata_image:/.*\\[Kk][Ii][Nn][Tt][Ee][Rr][Cc][Ee][Pp][Tt].*/ OR data_win_eventdata_image:/.*\\[Nn][Tt][Ll][Mm][Rr][Ee][Ll][Aa][Yy][Xx].*/ OR data_win_eventdata_image:/.*\\[Rr][Pp][Cc][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_image:/.*\\[Ss][Aa][Mm][Rr][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_image:/.*\\[Ss][Ee][Cc][Rr][Ee][Tt][Ss][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_image:/.*\\[Ss][Mm][Bb][Ee][Xx][Ee][Cc].*/ OR data_win_eventdata_image:/.*\\[Ss][Mm][Bb][Rr][Ee][Ll][Aa][Yy][Xx].*/ OR data_win_eventdata_image:/.*\\[Ww][Mm][Ii][Ee][Xx][Ee][Cc].*/ OR data_win_eventdata_image:/.*\\[Ww][Mm][Ii][Pp][Ee][Rr][Ss][Ii][Ss][Tt].*/ OR data_win_eventdata_image:/.*\\[Aa][Tt][Ee][Xx][Ee][Cc]_[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Dd][Cc][Oo][Mm][Ee][Xx][Ee][Cc]_[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Dd][Pp][Aa][Pp][Ii]_[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ff][Ii][Nn][Dd][Dd][Ee][Ll][Ee][Gg][Aa][Tt][Ii][Oo][Nn]_[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Gg][Ee][Tt][Aa][Dd][Uu][Ss][Ee][Rr][Ss]_[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Gg][Ee][Tt][Nn][Pp][Uu][Ss][Ee][Rr][Ss]_[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Gg][Ee][Tt][Pp][Aa][Cc]_[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Gg][Ee][Tt][Ss][Tt]_[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Gg][Ee][Tt][Tt][Gg][Tt]_[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Gg][Ee][Tt][Uu][Ss][Ee][Rr][Ss][Pp][Nn][Ss]_[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ii][Ff][Mm][Aa][Pp]_[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz]_[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Nn][Ee][Tt][Vv][Ii][Ee][Ww]_[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Nn][Mm][Aa][Pp][Aa][Nn][Ss][Ww][Ee][Rr][Mm][Aa][Cc][Hh][Ii][Nn][Ee]_[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Oo][Pp][Dd][Uu][Mm][Pp]_[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ss][Ee][Xx][Ee][Cc]_[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Dd][Pp]_[Cc][Hh][Ee][Cc][Kk]_[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ss][Aa][Mm][Bb][Aa][Pp][Ii][Pp][Ee]_[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ss][Mm][Bb][Cc][Ll][Ii][Ee][Nn][Tt]_[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ss][Mm][Bb][Ss][Ee][Rr][Vv][Ee][Rr]_[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ss][Nn][Ii][Ff][Ff]_[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ss][Nn][Ii][Ff][Ff][Ee][Rr]_[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ss][Pp][Ll][Ii][Tt]_[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Tt][Ii][Cc][Kk][Ee][Tt][Ee][Rr]_[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 10c14723-61c7-4c75-92ca-9af245723ad2
    name: HackTool - Potential Impacket Lateral Movement Activity
    reason: Potential Impacket lateral movement is the on-target footprint of these tools
  - id: 8ce07472-496f-11ec-ab3b-3e22fbd008af
    name: Impacket Lateral Movement Commandline Parameters
    reason: Impacket command-line parameters (cmd /Q /c ... ADMIN$ output) confirm remote exec
  - id: bb3c1bac-6bdf-4aa0-8dc9-068b8b712a76
    name: Impacket Lateral Movement smbexec CommandLine Parameters
    reason: smbexec service/command pattern is the footprint of the smbexec binary
  - id: d6e464e4-5c6a-474e-82d2-aed616a3a492
    name: Impacket Lateral Movement WMIExec Commandline Parameters
    reason: wmiexec command-line pattern is the footprint of wmiexec
  - id: 022eaba8-f0bf-4dd9-9217-4604b0bb3bb0
    name: HackTool - Wmiexec Default Powershell Command
    reason: Wmiexec default PowerShell command is another footprint of impacket-style WMI exec
  - id: da63bc76-61ae-11eb-ae93-0242ac130002
    name: Ntdsutil Export NTDS
    reason: secretsdump is often paired with an ntdsutil NTDS export
  - id: fd877b94-9bb5-4191-bb25-d79cbd93c167
    name: Dumping of Sensitive Hives Via Reg.EXE
    reason: secretsdump and reg save both dump SAM/SYSTEM/SECURITY hives
  - id: 42a993dd-bb3e-48c8-b372-4d6684c4106c
    name: HackTool - CrackMapExec Execution
    reason: CrackMapExec is frequently used alongside impacket for the same operation
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Impacket-style remote exec command lines
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*(\\\\127\.0\.0\.1\\[Aa][Dd][Mm][Ii][Nn]\$\\__|[Cc][Mm][Dd](\.[Ee][Xx][Ee])?\s+\/[Qq]\s+\/[Cc].*2>&1).*/
    pivot_on: host
    window: 4h
  - name: Service creation by remote service-exec tools
    query: data_win_system_eventID:"7045" AND (data_win_eventdata_serviceName:/.*[Bb][Tt][Oo][Bb][Tt][Oo].*/ OR data_win_eventdata_imagePath:/.*(%[Cc][Oo][Mm][Ss][Pp][Ee][Cc]%|[Cc][Mm][Dd](\.[Ee][Xx][Ee])?\s+\/[Qq]\s+\/[Cc]).*/)
    pivot_on: host
    window: 4h
  - name: Credential hive or NTDS extraction
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Rr][Ee][Gg]\s+[Ss][Aa][Vv][Ee].*([Ss][Aa][Mm]|[Ss][Yy][Ss][Tt][Ee][Mm]|[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy])|[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll].*[Ii][Ff][Mm]|[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*[Ss][Hh][Aa][Dd][Oo][Ww]).*/
    pivot_on: host
    window: 4h
  - name: WMI or scheduled task persistence
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss].*\/[Cc][Rr][Ee][Aa][Tt][Ee]|[Ww][Mm][Ii][Cc].*\/[Nn][Oo][Dd][Ee]:|[Ee][Vv][Ee][Nn][Tt][Ff][Ii][Ll][Tt][Ee][Rr]|[Cc][Oo][Mm][Mm][Aa][Nn][Dd][Ll][Ii][Nn][Ee][Ee][Vv][Ee][Nn][Tt][Cc][Oo][Nn][Ss][Uu][Mm][Ee][Rr]).*/
    pivot_on: host
    window: 4h
  - name: Kerberos roasting and delegation recon tools
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Gg][Ee][Tt][Nn][Pp][Uu][Ss][Ee][Rr][Ss]|[Gg][Ee][Tt][Uu][Ss][Ee][Rr][Ss][Pp][Nn][Ss]|[Gg][Ee][Tt][Aa][Dd][Uu][Ss][Ee][Rr][Ss]|[Ff][Ii][Nn][Dd][Dd][Ee][Ll][Ee][Gg][Aa][Tt][Ii][Oo][Nn]|[Rr][Uu][Bb][Ee][Uu][Ss])[^\\]*\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 4h
