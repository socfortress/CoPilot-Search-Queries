name: Windows Recall Feature Enabled Via Reg.EXE
id: 817f252c-5143-4dae-b418-48c3e9f63728
version: 1
schema_version: "1.0"
date: "2024-06-02"
author: Sajid Nawaz Khan
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 817f252c-5143-4dae-b418-48c3e9f63728
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the enabling of the Windows Recall feature via registry manipulation.
  Windows Recall can be enabled by deleting the existing "DisableAIDataAnalysis"
  value, or setting it to 0. Adversaries may enable Windows Recall as part of
  post-exploitation discovery and collection activities. This rule assumes that
  Recall is already explicitly disabled on the host, and subsequently enabled by
  the adversary. MITRE ATT&CK: T1113.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\reg.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "reg.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*Microsoft\\\\Windows\\\\WindowsAI*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*DisableAIDataAnalysis*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*add*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine: "*0*"
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*delete*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches '*\reg.exe';
  data_win_eventdata_originalFileName equals 'reg.exe';
  data_win_eventdata_commandLine matches '*Microsoft\Windows\WindowsAI*', among
  other conditions.

known_false_positives: >
  Legitimate use/activation of Windows Recall. Baseline expected activity in
  your environment and tune this detection before relying on it for automated
  response.

references:
  - https://learn.microsoft.com/en-us/windows/client-management/manage-recall
  - https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-csp-windowsai#disableaidataanalysis
  - https://attack.mitre.org/techniques/T1113/

response:
  message: >
    Windows Recall Feature Enabled Via Reg.EXE detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1113
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1113
  custom_tags:
    - recall
    - feature
    - process_creation
    - sysmon
    - collection
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Rr][Ee][Gg]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Rr][Ee][Gg]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Aa][Ii].*/ AND data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Aa][Ii][Dd][Aa][Tt][Aa][Aa][Nn][Aa][Ll][Yy][Ss][Ii][Ss].*/ AND (data_win_eventdata_commandLine:/.*[Aa][Dd][Dd].*/ OR data_win_eventdata_commandLine:/.*0.*/ OR data_win_eventdata_commandLine:/.*[Dd][Ee][Ll][Ee][Tt][Ee].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 75180c5f-4ea1-461a-a4f6-6e4700c065d4
    name: Windows Recall Feature Enabled - Registry
    reason: Registry-level confirmation that the Recall policy value was set.
  - id: 5dfc1465-8f65-4fde-8eb5-6194380c6a62
    name: Windows Recall Feature Enabled - DisableAIDataAnalysis Value Deleted
    reason: Deleting DisableAIDataAnalysis is the other way to enable Recall.
  - id: 2158f96f-43c2-43cb-952a-ab4580f32382
    name: Screen Capture Activity Via Psr.EXE
    reason: Screen capture via psr is a parallel collection technique.
  - id: 5e0b1936-8f99-4399-8ee2-9edc5b32e170
    name: Windows Screen Capture Via Powershell
    reason: PowerShell screen capture complements Recall as visual collection.
  - id: d4a11f63-2390-411c-9adf-d791fd152830
    name: Windows Screen Capture with CopyFromScreen
    reason: CopyFromScreen capture is a related collection method.
  - id: b9aeac14-2ffd-4ad3-b967-1354a4e628c3
    name: PowerShell Get-Clipboard Cmdlet Via CLI
    reason: Clipboard harvesting pairs with Recall for data collection.
  - id: 932fb0d8-692b-4b0f-a26e-5643a50fe7d6
    name: Audio Capture via PowerShell
    reason: Audio capture is another post-exploitation collection step.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other reg.exe changes to WindowsAI or policy keys
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*reg\.exe/ AND data_win_eventdata_commandLine:(/.*WindowsAI.*/ OR /.*[Pp]olicies.*/)
    pivot_on: host
    window: 24h
  - name: Access to Recall snapshot database or AI data
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*ukg\.db.*/ OR /.*[Cc]ore[Aa][Ii][Pp]latform.*/ OR /.*[Ww]indows[Aa][Ii].*/)
    pivot_on: host
    window: 24h
  - name: Screen or clipboard capture tooling
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Cc]opy[Ff]rom[Ss]creen.*/ OR /.*[Gg]et-[Cc]lipboard.*/ OR /.*psr\.exe.*/)
    pivot_on: host
    window: 24h
  - name: Script or remote parent of reg.exe
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*reg\.exe/ AND data_win_eventdata_parentImage:(/.*[Pp]ower[Ss]hell.*/ OR /.*cmd\.exe/ OR /.*wmiprvse.*/)
    pivot_on: user
    window: 6h
