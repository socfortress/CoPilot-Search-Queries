name: Windows Admin Share Mount Via Net.EXE
id: 3abd6094-7027-475f-9630-8ab9be7b9725
version: 1
schema_version: "1.0"
date: "2023-02-21"
author: oscd.community, Teymur Kheirkhabarov @HeirhabarovT, Zach Stanford @svch0st, wagga
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 3abd6094-7027-475f-9630-8ab9be7b9725
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects when an admin share is mounted using net.exe. MITRE ATT&CK: T1021.002.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\net.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\net1.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "net.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "net1.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* use *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine: "* \\\\\\\\*\\\\*$*"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches '*\net.exe';
  data_win_eventdata_image matches '*\net1.exe';
  data_win_eventdata_originalFileName equals 'net.exe', among other conditions.

known_false_positives: >
  Administrators. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://drive.google.com/file/d/1lKya3_mLnR3UQuCoiYruO3qgu052_iS_/view
  - https://attack.mitre.org/techniques/T1021/002/

response:
  message: >
    Windows Admin Share Mount Via Net.EXE detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1021.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1021.002
  custom_tags:
    - admin
    - share
    - mount
    - process_creation
    - sysmon
    - lateral_movement
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Nn][Ee][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Nn][Ee][Tt]1\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Nn][Ee][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Nn][Ee][Tt]1\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.* [Uu][Ss][Ee] .*/ AND data_win_eventdata_commandLine:/.* \\\\.*\\.*\$.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: Windows-Network-Share-Interaction-Via-Net
    name: Windows Network Share Interaction Via Net
    reason: net share/use interaction is the same family; shows wider share enumeration around the mount
  - id: 855bc8b5-2ae8-402e-a9ed-b889e6df1900
    name: Copy From Or To Admin Share Or Sysvol Folder
    reason: copy to/from an admin share is the immediate use of the mounted share (payload staging)
  - id: ab9e3b40-0c85-4ba1-aede-455d226fd124
    name: Suspicious Redirection to Local Admin Share
    reason: output redirection to a local admin share seen in the same lateral movement
  - id: ea011323-7045-460b-b2d7-0f7442ea6b38
    name: Potential PsExec Remote Execution
    reason: PsExec execution typically follows mounting ADMIN$/C$ on the target
  - id: fdfcbd78-48f1-4a4b-90ac-d82241e368c5
    name: PsExec Service Execution
    reason: PsExec service execution confirms the share was used to run code
  - id: 17a1be64-8d88-40bf-b5ff-a4f7a50ebcc8
    name: Suspicious New Service Creation
    reason: suspicious new service creation is the usual execution step after a payload lands on an admin share
  - id: d4498716-1d52-438f-8084-4a603157d131
    name: Password Provided In Command Line Of Net.EXE
    reason: net use with a plaintext password suggests use of harvested credentials
  - id: 044ba588-dff4-4918-9808-3f95e8160606
    name: Copy .DMP/.DUMP Files From Remote Share Via Cmd.EXE
    reason: copying dump files from remote shares is exfiltration of credential dumps via the same shares
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Admin share file copy
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*([Cc][Oo][Pp][Yy]|[Xx][Cc][Oo][Pp][Yy]|[Rr][Oo][Bb][Oo][Cc][Oo][Pp][Yy]|[Mm][Oo][Vv][Ee]).*\\\\.*[$].*/
    pivot_on: host
    window: 4h
  - name: Remote service creation or PsExec
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*[Ss][Cc](\.exe)? +\\\\.*[Cc][Rr][Ee][Aa][Tt][Ee].*/ OR data_win_eventdata_image:*PSEXESVC* OR data_win_eventdata_commandLine:*[Pp][Ss][Ee][Xx][Ee][Cc]*)
    pivot_on: host
    window: 4h
  - name: Remote scheduled task or WMI execution
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*([Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss].* /[Ss] |[Ww][Mm][Ii][Cc].*/[Nn][Oo][Dd][Ee]|[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Mm][Ii][Mm][Ee][Tt][Hh][Oo][Dd]).*/
    pivot_on: host
    window: 4h
  - name: Credential material in command line
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*([Nn][Ee][Tt] +[Uu][Ss][Ee].*/[Uu][Ss][Ee][Rr]:|[Ll][Ss][Aa][Ss][Ss]|[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz]).*/
    pivot_on: host
    window: 4h
