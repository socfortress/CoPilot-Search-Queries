name: Suspicious Rundll32 Execution With Image Extension
id: 4aa6040b-3f28-44e3-a769-9208e5feb5ec
version: 1
schema_version: "1.0"
date: "2023-03-13"
author: Hieu Tran
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 4aa6040b-3f28-44e3-a769-9208e5feb5ec
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of Rundll32.exe with DLL files masquerading as image
  files. MITRE ATT&CK: T1218.011.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\rundll32.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "RUNDLL32.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.bmp*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.cr2*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.eps*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.gif*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.ico*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.jpeg*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.jpg*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.nef*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.orf*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.png*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.raw*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.sr2*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.tif*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.tiff*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\rundll32.exe'; data_win_eventdata_originalFileName equals 'RUNDLL32.exe';
  data_win_eventdata_commandLine matches '*.bmp*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.zscaler.com/blogs/security-research/onenote-growing-threat-malware-distribution
  - https://attack.mitre.org/techniques/T1218/011/

response:
  message: >
    Suspicious Rundll32 Execution With Image Extension detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1218.011
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218.011
  custom_tags:
    - rundll32
    - image
    - extension
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*\.[Bb][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*\.[Cc][Rr]2.*/ OR data_win_eventdata_commandLine:/.*\.[Ee][Pp][Ss].*/ OR data_win_eventdata_commandLine:/.*\.[Gg][Ii][Ff].*/ OR data_win_eventdata_commandLine:/.*\.[Ii][Cc][Oo].*/ OR data_win_eventdata_commandLine:/.*\.[Jj][Pp][Ee][Gg].*/ OR data_win_eventdata_commandLine:/.*\.[Jj][Pp][Gg].*/ OR data_win_eventdata_commandLine:/.*\.[Nn][Ee][Ff].*/ OR data_win_eventdata_commandLine:/.*\.[Oo][Rr][Ff].*/ OR data_win_eventdata_commandLine:/.*\.[Pp][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*\.[Rr][Aa][Ww].*/ OR data_win_eventdata_commandLine:/.*\.[Ss][Rr]2.*/ OR data_win_eventdata_commandLine:/.*\.[Tt][Ii][Ff].*/ OR data_win_eventdata_commandLine:/.*\.[Tt][Ii][Ff][Ff].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: bfd34392-c591-4009-b938-9fd985a28b85
    name: Qakbot Rundll32 Fake DLL Extension Execution
    reason: Qakbot loads its DLL through rundll32 with a fake image extension; same masquerade, confirms the family.
  - id: 1bf0ba65-9a39-42a2-9271-31d31bf2f0bf
    name: Pikabot Fake DLL Extension Execution Via Rundll32.EXE
    reason: Pikabot uses a fake DLL extension via rundll32; same technique, different loader.
  - id: c3a99af4-35a9-4668-879e-c09aeb4f2bdf
    name: Rundll32 Execution With Uncommon DLL Extension
    reason: Generic rundll32 load of a non-.dll file; broader variant firing on the same command line.
  - id: 5cdb711b-5740-4fb2-ba88-f7945027afac
    name: Rundll32 UNC Path Execution
    reason: Image-named payload fetched from a UNC/WebDAV share and run by rundll32 is a common delivery path.
  - id: 982e9f2d-1a85-4d5b-aea4-31f5e97c6555
    name: Suspicious WebDav Client Execution Via Rundll32.EXE
    reason: WebDAV client spawned through rundll32 indicates the disguised DLL was pulled from a remote share.
  - id: e593cf51-88db-4ee1-b920-37e89012a3c9
    name: Potentially Suspicious Rundll32 Activity
    reason: Generic suspicious rundll32 usage that often co-fires with the disguised-DLL launch.
  - id: 84b1706c-932a-44c4-ae28-892b28a25b94
    name: OneNote.EXE Execution of Malicious Embedded Scripts
    reason: 'Source article describes OneNote-embedded scripts dropping image-named DLLs run by rundll32: the likely precursor.'
  - id: c27515df-97a9-4162-8a60-dc0eeb51b775
    name: Suspicious Microsoft OneNote Child Process
    reason: OneNote spawning a child process is the initial-access step before rundll32 runs the disguised DLL.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Rundll32 process creations with non-DLL payload arguments
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee])/ AND NOT data_win_eventdata_commandLine:/.*\.[Dd][Ll][Ll].*/
    pivot_on: host
    window: 2h
  - name: Image files written to user-writable paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\|\\[Tt][Ee][Mm][Pp]\\|\\[Pp][Uu][Bb][Ll][Ii][Cc]\\|\\[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]\\).*\.([Jj][Pp][Gg]|[Pp][Nn][Gg]|[Gg][Ii][Ff]|[Bb][Mm][Pp]|[Ii][Cc][Oo]|[Tt][Ii][Ff][Ff]?)/
    pivot_on: host
    window: 2h
  - name: Non-dll image modules loaded by rundll32
    query: data_win_system_eventID:"7" AND data_win_eventdata_image:/.*\\([Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee])/ AND data_win_eventdata_imageLoaded:/.*\.([Jj][Pp][Gg]|[Pp][Nn][Gg]|[Gg][Ii][Ff]|[Bb][Mm][Pp]|[Ii][Cc][Oo]|[Tt][Ii][Ff]).*/
    pivot_on: host
    window: 2h
  - name: Outbound network connections made by rundll32
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 2h
  - name: Office/OneNote or script host parented child processes
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\([Oo][Nn][Ee][Nn][Oo][Tt][Ee]|[Ww][Ii][Nn][Ww][Oo][Rr][Dd]|[Ee][Xx][Cc][Ee][Ll]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt])\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 1h
