name: Windows Mimikatz PassTheTicket CommandLine Parameters
id: windows-mimikatz-passtheticket-commandline-parameters-001
version: 1
schema_version: "1.0"
date: "2026-02-12"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects the use of Mimikatz command line parameters associated with pass-the-ticket 
  attacks, specifically sekurlsa::tickets /export and kerberos::ptt. Pass-the-ticket 
  attacks allow adversaries to move laterally within an environment using stolen 
  Kerberos tickets, bypassing normal access controls. Used by Sandworm, Lapsus$, 
  and other threat actors.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine: "*sekurlsa::tickets*"
              - wildcard:
                  data_win_eventdata_commandLine: "*kerberos::ptt*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-12 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-12 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Windows endpoints with Sysmon 
  installed and configured to log process creation events (EventID 1) with full 
  command-line arguments. The index pattern should match your Wazuh index naming 
  convention.

known_false_positives: >
  Although highly unlikely, legitimate applications may use the same command line 
  parameters as Mimikatz. Investigate any matches thoroughly as these are strong 
  indicators of credential theft and lateral movement.

references:
  - https://attack.mitre.org/techniques/T1550/003/
  - https://github.com/gentilkiwi/mimikatz

response:
  message: >
    Mimikatz pass-the-ticket command line parameters detected on $agent_name$. 
    Command line: $data_win_eventdata_commandLine$. 
    Parent process: $data_win_eventdata_parentImage$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1550.003
  risk_score: 72
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 36
    - field: data_win_eventdata_user
      type: user
      score: 36
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: parent_process_name

tags:
  analytic_story:
    - Active Directory Kerberos Attacks
    - Sandworm Tools
    - Scattered Lapsus$ Hunters
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1550.003
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*sekurlsa::tickets.*/ OR data_win_eventdata_commandLine:/.*kerberos::ptt.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: windows-mimikatz-binary-execution-001
    name: Windows Mimikatz Binary Execution
    reason: Mimikatz itself ran on this host; the sekurlsa::tickets /export or kerberos::ptt command is its payload, so the binary execution corroborates and dates the tooling.
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: Broader Mimikatz command-line module coverage (sekurlsa/lsadump) usually surrounds ticket export in the same session.
  - id: 5ef9853e-4d0e-4a70-846f-a9ca37d876da
    name: Potential Credential Dumping Activity Via LSASS
    reason: sekurlsa::tickets reads Kerberos tickets from LSASS memory, producing a process-access event on lsass.exe just before the export.
  - id: 9e099d99-44c2-42b6-a6d8-54c3545cab29
    name: HackTool - Mimikatz Kirbi File Creation
    reason: /export writes .kirbi ticket files to disk; their creation confirms tickets were actually harvested.
  - id: 7ec2c172-dceb-4c10-92c9-87c1881b7e18
    name: HackTool - Rubeus Execution
    reason: Rubeus is the common alternative/companion for ptt, tgtdeleg and ticket renewal in the same intrusion.
  - id: caa9a802-8bd8-4b9e-a5cd-4d6221670219
    name: Suspicious Kerberos Ticket Request via CLI
    reason: Attackers request/forge tickets from the CLI before or after injecting them with kerberos::ptt.
  - id: e54979bd-c5f9-4d6c-967b-a04b19ac4c74
    name: Uncommon Outbound Kerberos Connection
    reason: Injected tickets are then used against DCs/services; a non-standard process talking Kerberos (port 88) follows the pass-the-ticket.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: LSASS access by non-system process
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Kirbi / ticket file creation
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*([Kk][Ii][Rr][Bb][Ii]|[Kk][Rr][Bb]5[Cc][Cc]).*/
    pivot_on: host
    window: 4h
  - name: Other Mimikatz / Rubeus modules on host
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*(sekurlsa::|lsadump::|kerberos::|[Rr]ubeus|[Mm]imikatz|privilege::debug).*/
    pivot_on: host
    window: 6h
  - name: Kerberos traffic from non-system processes
    query: data_win_system_eventID:"3" AND data_win_eventdata_destinationPort:"88"
    pivot_on: host
    window: 2h
  - name: Remote exec tooling after ticket use
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Pp][Ss][Ee][Xx][Ee][Cc]|[Ww][Mm][Ii][Cc].*\/node|[Ss][Cc]\.[Ee][Xx][Ee] +\\\\).*/
    pivot_on: user
    window: 4h
