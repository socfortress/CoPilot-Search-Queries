[Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.* -[Ee][Nn][Cc] .*/ OR data_win_eventdata_commandLine:/.* -[Ee][Nn][Cc][Oo][Dd][Ee][Dd][Cc][Oo][Mm][Mm][Aa][Nn][Dd] .*/ OR data_win_eventdata_commandLine:/.* -[Ww] [Hh][Ii][Dd][Dd][Ee][Nn] .*/ OR data_win_eventdata_commandLine:/.* -[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Tt][Yy][Ll][Ee] [Hh][Ii][Dd][Dd][Ee][Nn].*/ OR data_win_eventdata_commandLine:/.*\.[Ww][Ee][Bb][Cc][Ll][Ii][Ee][Nn][Tt]\)\.[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd].*/)) OR data_win_eventdata_image:/.*\\[Dd][Ss][Qq][Uu][Ee][Rr][Yy]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ff][Ii][Nn][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ff][Ii][Nn][Dd][Ss][Tt][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ii][Pp][Cc][Oo][Nn][Ff][Ii][Gg]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Nn][Ee][Tt][Ss][Tt][Aa][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Nn][Ss][Ll][Oo][Oo][Kk][Uu][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Aa][Tt][Hh][Pp][Ii][Nn][Gg]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Qq][Uu][Ss][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ss][Yy][Ss][Tt][Ee][Mm][Ii][Nn][Ff][Oo]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Tt][Aa][Ss][Kk][Ll][Ii][Ss][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Tt][Rr][Aa][Cc][Ee][Rr][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Vv][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Hh][Oo][Aa][Mm][Ii]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Dd][Ss][Qq][Uu][Ee][Rr][Yy]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ff][Ii][Nn][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ff][Ii][Nn][Dd][Ss][Tt][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ii][Pp][Cc][Oo][Nn][Ff][Ii][Gg]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Nn][Ee][Tt][Ss][Tt][Aa][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Nn][Ss][Ll][Oo][Oo][Kk][Uu][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Pp][Aa][Tt][Hh][Pp][Ii][Nn][Gg]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Qq][Uu][Ss][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ss][Yy][Ss][Ii][Nn][Ff][Oo]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Tt][Aa][Ss][Kk][Ll][Ii][Ss][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Tt][Rr][Aa][Cc][Ee][Rr][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Vv][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ww][Hh][Oo][Aa][Mm][Ii]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.* [Tt][Ee][Ss][Tt]-[Nn][Ee][Tt][Cc][Oo][Nn][Nn][Ee][Cc][Tt][Ii][Oo][Nn] .*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Rr] \\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 4ebc877f-4612-45cb-b3a5-8e3834db36c9
    name: Webshell Hacking Activity Patterns
    reason: Web server child processes running attacker commands are the same webshell session seen through different patterns.
  - id: f64e5c19-879c-4bae-b471-6d84c8339677
    name: Webshell Tool Reconnaissance Activity
    reason: Recon commands from web server parents confirm interactive shell use.
  - id: fa3c117a-bc0d-416e-a31b-0c0e80653efb
    name: Chopper Webshell Process Pattern
    reason: China Chopper style cmd chains from web server processes corroborate a webshell.
  - id: 39f1f9f2-9636-45de-98f6-a4046aa8e4b9
    name: Potential Webshell Creation On Static Website
    reason: Webshell file drop in the web root is the precursor to the command execution.
  - id: c248c896-e412-4279-8c15-1c558067b6fa
    name: Enumerate All Information With Whoami.EXE
    reason: whoami /all is the typical first command typed into a webshell.
  - id: 0649be4a-aeb0-45b0-b89e-7f1668f6d9c0
    name: IIS WebServer Log Deletion via CommandLine Utilities
    reason: Attackers clean IIS logs after webshell use.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Web server process spawning shells
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*(w3wp|php-cgi|nginx|httpd|caddy|java|javaw|tomcat[0-9]*)\.exe/ AND data_win_eventdata_image:/.*(cmd|powershell|pwsh|wscript|cscript|mshta|certutil|bitsadmin)\.exe/
    pivot_on: host
    window: 2h
  - name: Webshell file drops in web roots
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*(inetpub|wwwroot|htdocs|webapps).*\.(aspx?|ashx|asmx|jsp|jspx|php|cer)/
    pivot_on: host
    window: 6h
  - name: Post-exploitation recon commands
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*[Ww]hoami.*/ OR data_win_eventdata_commandLine:/.*[Nn]et[1]?(\.exe)? +(user|group|localgroup|view).*/ OR data_win_eventdata_commandLine:/.*[Ii]pconfig.*/ OR data_win_eventdata_commandLine:/.*[Nn]ltest.*/)
    pivot_on: host
    window: 2h
  - name: Tool download or encoded PowerShell
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*([Cc]ertutil.*-urlcache|[Bb]itsadmin.*\/transfer|[Ii]nvoke-[Ww]eb[Rr]equest).*/ OR data_win_eventdata_commandLine:/.*-[Ee]nc.*/)
    pivot_on: host
    window: 4h
  - name: Outbound connections from web server processes
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*(w3wp|php-cgi|nginx|httpd|java)\.exe/
    pivot_on: host
    window: 4h
