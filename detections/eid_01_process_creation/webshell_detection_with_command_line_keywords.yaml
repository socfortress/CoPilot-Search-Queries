  - https://www.fireeye.com/blog/threat-research/2013/08/breaking-down-the-china-chopper-web-shell-part-ii.html
  - https://unit42.paloaltonetworks.com/bumblebee-webshell-xhunt-campaign/
  - https://www.huntress.com/blog/threat-advisory-oh-no-cleo-cleo-software-actively-being-exploited-in-the-wild
  - https://attack.mitre.org/techniques/T1505/003/
  - https://attack.mitre.org/techniques/T1018/
  - https://attack.mitre.org/techniques/T1033/
  - https://attack.mitre.org/techniques/T1087/

response:
  message: >
    Webshell Detection With Command Line Keywords detected on host $agent_name$.
    Matched data_win_eventdata_parentImage: $data_win_eventdata_parentImage$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
    MITRE ATT&CK: T1505.003, T1018, T1033, T1087
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1505.003
    - T1018
    - T1033
    - T1087
  custom_tags:
    - webshell
    - keywords
    - process_creation
    - sysmon
    - persistence
    - discovery
  product:
