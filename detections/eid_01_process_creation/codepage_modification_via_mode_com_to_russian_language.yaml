name: CodePage Modification Via MODE.COM To Russian Language
id: 12fbff88-16b5-4b42-9754-cd001a789fb3
version: 1
schema_version: "1.0"
date: "2024-01-17"
author: Joseliyo Sanchez, @Joseliyo_Jstnk
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 12fbff88-16b5-4b42-9754-cd001a789fb3
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a CodePage modification using the "mode.com" utility to Russian
  language. This behavior has been used by threat actors behind Dharma
  ransomware. MITRE ATT&CK: T1036.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\mode.com"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "MODE.COM"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* con *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* cp *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* select=*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine: "*=1251"
              - wildcard:
                  data_win_eventdata_commandLine: "*=866"
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\mode.com'; data_win_eventdata_originalFileName equals 'MODE.COM';
  data_win_eventdata_commandLine matches '* con *', among other conditions.

known_false_positives: >
  Russian speaking people changing the CodePage. Baseline expected activity in
  your environment and tune this detection before relying on it for automated
  response.

references:
  - https://learn.microsoft.com/en-us/windows/win32/intl/code-page-identifiers
  - https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/mode
  - https://strontic.github.io/xcyclopedia/library/mode.com-59D1ED51ACB8C3D50F1306FD75F20E99.html
  - https://www.virustotal.com/gui/file/5e75ef02517afd6e8ba6462b19217dc4a5a574abb33d10eb0f2bab49d8d48c22/behavior
  - https://attack.mitre.org/techniques/T1036/

response:
  message: >
    CodePage Modification Via MODE.COM To Russian Language detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1036
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1036
  custom_tags:
    - codepage
    - russian
    - language
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Mm][Oo][Dd][Ee]\.[Cc][Oo][Mm]/ OR data_win_eventdata_originalFileName:/[Mm][Oo][Dd][Ee]\.[Cc][Oo][Mm]/) AND data_win_eventdata_commandLine:/.* [Cc][Oo][Nn] .*/ AND data_win_eventdata_commandLine:/.* [Cc][Pp] .*/ AND data_win_eventdata_commandLine:/.* [Ss][Ee][Ll][Ee][Cc][Tt]=.*/ AND (data_win_eventdata_commandLine:/.*=1251/ OR data_win_eventdata_commandLine:/.*=866/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: Dharma-style ransomware scripts set the codepage then delete shadow copies before encryption.
  - id: 1444443e-6757-43e4-9ea4-c8fc705f79a2
    name: Boot Configuration Tampering Via Bcdedit.EXE
    reason: Ransomware batch scripts disable recovery via bcdedit alongside the codepage change.
  - id: 639c9081-f482-47d3-a0bd-ddee3d4ecd76
    name: All Backups Deleted Via Wbadmin.EXE
    reason: Backup catalog destruction is the usual next step in the ransomware batch.
  - id: 57c4bf16-227f-4394-8ec7-1b745ee061c3
    name: Firewall Disabled via Netsh.EXE
    reason: Dharma batches commonly disable the firewall in the same script.
  - id: 7090adee-82e2-4269-bd59-80691e7c6338
    name: Console CodePage Lookup Via CHCP
    reason: Codepage probing in the same cmd session is sibling behaviour of the same script.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Shadow copy, backup and recovery destruction
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*[Vv]ssadmin.*[Dd]elete.*/ OR data_win_eventdata_commandLine:/.*[Ww]badmin.*[Dd]elete.*/ OR data_win_eventdata_commandLine:/.*[Bb]cdedit.*(recoveryenabled|ignoreallfailures).*/)
    pivot_on: host
    window: 2h
  - name: Batch file executed via cmd
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Cc]md\.exe/ AND data_win_eventdata_commandLine:/.*\.(bat|cmd).*/
    pivot_on: host
    window: 2h
  - name: Ransom note or encrypted-extension file creation
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*(\.id-.*|[Ff]iles[ _][Ee]ncrypted|info\.hta).*/
    pivot_on: host
    window: 6h
  - name: RDP logons (Dharma entry vector)
    query: data_win_system_eventID:4624 AND data_win_eventdata_logonType:10
    pivot_on: host
    window: 24h
