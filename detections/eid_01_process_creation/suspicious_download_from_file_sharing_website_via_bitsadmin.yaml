ventdata_commandLine:/.*[Pp][Aa][Ss][Tt][Ee][Bb][Ii][Nn]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_commandLine:/.*[Pp][Aa][Ss][Tt][Ee][Bb][Ii][Nn]\.[Pp][Ll].*/ OR data_win_eventdata_commandLine:/.*[Pp][Aa][Ss][Tt][Ee][Tt][Ee][Xx][Tt]\.[Nn][Ee][Tt].*/ OR data_win_eventdata_commandLine:/.*[Pp][Rr][Ii][Vv][Aa][Tt][Ll][Aa][Bb]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_commandLine:/.*[Pp][Rr][Ii][Vv][Aa][Tt][Ll][Aa][Bb]\.[Nn][Ee][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Nn][Dd]\.[Ee][Xx][Pp][Ll][Oo][Ii][Tt]\.[Ii][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Nn][Dd][Ss][Pp][Aa][Cc][Ee]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_commandLine:/.*[Ss][Tt][Oo][Rr][Aa][Gg][Ee]\.[Gg][Oo][Oo][Gg][Ll][Ee][Aa][Pp][Ii][Ss]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_commandLine:/.*[Ss][Tt][Oo][Rr][Jj][Ss][Hh][Aa][Rr][Ee]\.[Ii][Oo].*/ OR data_win_eventdata_commandLine:/.*[Ss][Uu][Pp][Aa][Bb][Aa][Ss][Ee]\.[Cc][Oo].*/ OR data_win_eventdata_commandLine:/.*[Tt][Ee][Mm][Pp]\.[Ss][Hh].*/ OR data_win_eventdata_commandLine:/.*[Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr]\.[Ss][Hh].*/ OR data_win_eventdata_commandLine:/.*[Tt][Rr][Yy][Cc][Ll][Oo][Uu][Dd][Ff][Ll][Aa][Rr][Ee]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_commandLine:/.*[Uu][Ff][Ii][Ll][Ee]\.[Ii][Oo].*/ OR data_win_eventdata_commandLine:/.*[Ww]3[Ss][Pp][Aa][Cc][Ee][Ss]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_commandLine:/.*[Ww][Oo][Rr][Kk][Ee][Rr][Ss]\.[Dd][Ee][Vv].*/ OR data_win_eventdata_commandLine:/.*[Xx]0\.[Aa][Tt].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d059842b-6b9d-4ed1-b5c3-5b89143c6ede
    name: File Download Via Bitsadmin
    reason: Generic bitsadmin download on the same host; broadens to non-file-sharing sources
  - id: 2ddef153-167b-4e89-86b6-757a9e65dcac
    name: File Download Via Bitsadmin To A Suspicious Target Folder
    reason: Destination folder of the file-sharing download
  - id: 5b80a791-ad9b-4b75-bcc1-ad4e1e89c200
    name: File With Suspicious Extension Downloaded Via Bitsadmin
    reason: Type of payload pulled from the paste/file host
  - id: b9cbbc17-d00d-4e3d-a827-b06d03d2380d
    name: Monitoring For Persistence Via BITS
    reason: Notify command lines make BITS execute the payload and persist
  - id: 52182dfb-afb7-41db-b4bc-5336cb29b464
    name: Suspicious File Download From File Sharing Websites -  File Stream
    reason: Zone.Identifier ADS recording the file-sharing host as the file origin
  - id: b6e04788-29e1-4557-bb14-77f761848ab8
    name: Potentially Suspicious File Download From File Sharing Domain Via PowerShell.EXE
    reason: Same actor switching to PowerShell for file-sharing downloads
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Bitsadmin/BITS job activity (addfile, resume, complete, SetNotifyCmdLine)
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn].*(\/[Rr][Ee][Ss][Uu][Mm][Ee]|\/[Cc][Oo][Mm][Pp][Ll][Ee][Tt][Ee]|[Ss][Ee][Tt][Nn][Oo][Tt][Ii][Ff][Yy][Cc][Mm][Dd][Ll][Ii][Nn][Ee]|\/[Aa][Dd][Dd][Ff][Ii][Ll][Ee]).*/
    pivot_on:
    - host
    window: 2h
  - name: Executable or script dropped to a user-writable staging path
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\([Tt]emp|[Pp]ublic|[Pp]rogram[Dd]ata|[Aa]pp[Dd]ata)\\.*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Pp][Ss]1|[Bb][Aa][Tt]|[Vv][Bb][Ss]|[Jj][Ss]|[Ss][Cc][Rr])/
    pivot_on:
    - host
    window: 1h
  - name: Execution from staging paths launched by a shell or script host
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\([Pp]ower[Ss]hell|[Cc]md|[Ww]script|[Cc]script|[Mm]shta)\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Tt]emp|[Pp]ublic|[Pp]rogram[Dd]ata|[Aa]pp[Dd]ata)\\.*\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: DNS lookups by download-capable LOLBins and PowerShell
    query: data_win_system_eventID:"22" AND data_win_eventdata_image:/.*\\([Bb]itsadmin|[Cc]ertutil|[Cc]url|[Pp]ower[Ss]hell)\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: Other file-sharing/paste downloads via curl, PowerShell or certutil
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*(github(usercontent)?\.com|pastebin\.com|transfer\.sh|mediafire\.com|mega\.nz|anonfiles\.com|discordapp\.com|ghostbin\.co|gofile\.io|temp\.sh).*/ AND (data_win_eventdata_image:/.*\\([Cc]url|[Pp]ower[Ss]hell|[Cc]ertutil)\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Ii]nvoke-[Ww]eb[Rr]equest|[Dd]ownload[Ff]ile|[Ii][Ww][Rr] ).*/)
    pivot_on:
    - host
    - user
    window: 4h
