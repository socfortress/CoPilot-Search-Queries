name: Windows WSUS Spawning Shell
id: windows-wsus-spawning-shell-001
version: 1
schema_version: "1.0"
date: "2026-02-23"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects wsusservice.exe spawning cmd.exe or powershell.exe, which may indicate 
  exploitation of CVE-2025-59287, a critical deserialization vulnerability in 
  Windows Server Update Services allowing unauthenticated remote code execution. 
  wsusservice.exe should never spawn interactive shells under normal operation.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - wildcard:
            data_win_eventdata_parentImage: "*\\\\wsusservice.exe"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image: "*\\\\powershell.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\\\cmd.exe"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-23 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-23 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Windows WSUS servers with 
  Sysmon installed and configured to log process creation events (EventID 1) 
  with full command-line arguments and parent process tracking.

known_false_positives: >
  Legitimate WSUS maintenance scripts may rarely spawn shells. Review command 
  line arguments and user context. wsusservice.exe spawning interactive shells 
  is highly abnormal.

references:
  - https://attack.mitre.org/techniques/T1190/
  - https://www.huntress.com/blog/exploitation-of-windows-server-update-services-remote-code-execution-vulnerability
  - https://msrc.microsoft.com/update-guide/vulnerability/CVE-2025-59287

response:
  message: >
    CRITICAL: WSUS service spawned shell on $agent_name$. 
    Process: $data_win_eventdata_image$. 
    Command: $data_win_eventdata_commandLine$. 
    User: $data_win_eventdata_user$. 
    Possible CVE-2025-59287 exploitation. MITRE ATT&CK: T1190, T1505.003
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects: []

tags:
  analytic_story:
    - Microsoft WSUS CVE-2025-59287
    - Compromised Windows Host
  asset_type: Endpoint
  cve:
    - CVE-2025-59287
  mitre_attack_id:
    - T1190
    - T1505.003
  custom_tags:
    - wsus
    - rce
    - cve_exploit
    - shell_spawn
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*wsusservice\.exe/ AND (data_win_eventdata_image:/.*powershell\.exe/ OR data_win_eventdata_image:/.*cmd\.exe/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e5f66e87-7d6b-404f-92fe-7aa67814b5cd
    name: Exploitation Activity of CVE-2025-59287 - WSUS Deserialization
    reason: The deserialization error logged just before wsusservice spawns a shell.
  - id: 43259cc4-1b80-4931-bd98-baea01afc196
    name: Exploitation Activity of CVE-2025-59287 - WSUS Suspicious Child Process
    reason: Broader child process coverage of the same exploit, e.g. whoami, curl, net.
  - id: b0ce780f-10bd-496d-9067-066d23dc3aa5
    name: HackTool - SharpWSUS/WSUSpendu Execution
    reason: Offensive WSUS tooling on the same server for lateral movement via update abuse.
  - id: c248c896-e412-4279-8c15-1c558067b6fa
    name: Enumerate All Information With Whoami.EXE
    reason: First recon step after RCE as the WSUS service account.
  - id: c4db14d9-7909-48b4-a054-aa14d89dbb19
    name: Malicious PowerShell Process - Encoded Command
    reason: Exploit payloads are typically delivered as encoded PowerShell.
  - id: 9cc85849-3b02-4cb5-b371-3a1ff54f2218
    name: File Download From IP URL Via Curl.EXE
    reason: Second-stage retrieval after the exploit.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Any child of wsusservice or w3wp on WSUS
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*wsusservice\.exe/ OR data_win_eventdata_parentImage:/.*w3wp\.exe/)
    pivot_on: host
    window: 6h
  - name: Recon commands after service RCE
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(whoami|systeminfo|ipconfig|net1?|nltest|hostname|tasklist)\.exe/
    pivot_on: host
    window: 4h
  - name: Encoded PowerShell and download cradles
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(powershell|pwsh)\.exe/ AND data_win_eventdata_commandLine:/.*([Ee]nc|[Ii][Ee][Xx]|[Dd]ownload|[Ff]rom[Bb]ase64|[Hh]idden).*/
    pivot_on: host
    window: 4h
  - name: Tool download and persistence
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*(curl|certutil|bitsadmin)\.exe/ AND data_win_eventdata_commandLine:/.*(http|urlcache|transfer).*/) OR (data_win_eventdata_image:/.*schtasks\.exe/ AND data_win_eventdata_commandLine:/.*\/[Cc]reate.*/))
    pivot_on: host
    window: 6h
