name: Audio Capture via SoundRecorder
id: 83865853-59aa-449e-9600-74b9d89a6d6e
version: 1
schema_version: "1.0"
date: "2021-11-27"
author: E.M. Anhaus (originally from Atomic Blue Detections, Endgame), oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 83865853-59aa-449e-9600-74b9d89a6d6e
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detect attacker collecting audio via SoundRecorder application. MITRE ATT&CK:
  T1123.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\SoundRecorder.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*/FILE*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\SoundRecorder.exe'; data_win_eventdata_commandLine matches '*/FILE*'.

known_false_positives: >
  Legitimate audio capture by legitimate user. Baseline expected activity in
  your environment and tune this detection before relying on it for automated
  response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1123/T1123.md
  - https://eqllib.readthedocs.io/en/latest/analytics/f72a98cb-7b3d-4100-99c3-a138b6e9ff6e.html
  - https://attack.mitre.org/techniques/T1123/

response:
  message: >
    Audio Capture via SoundRecorder detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1123
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1123
  custom_tags:
    - audio
    - capture
    - soundrecorder
    - process_creation
    - sysmon
    - collection
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss][Oo][Uu][Nn][Dd][Rr][Ee][Cc][Oo][Rr][Dd][Ee][Rr]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*\/[Ff][Ii][Ll][Ee].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 932fb0d8-692b-4b0f-a26e-5643a50fe7d6
    name: Audio Capture via PowerShell
    reason: Alternative audio-capture method; both together indicate deliberate microphone collection.
  - id: 2158f96f-43c2-43cb-952a-ab4580f32382
    name: Screen Capture Activity Via Psr.EXE
    reason: Native-binary screen capture often paired with audio recording for surveillance.
  - id: b9aeac14-2ffd-4ad3-b967-1354a4e628c3
    name: PowerShell Get-Clipboard Cmdlet Via CLI
    reason: Further user-input collection on the same host.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: SoundRecorder launches
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Ss]ound[Rr]ecorder.exe/
    pivot_on: host
    window: 6h
  - name: Audio output file creation
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(/.*\.[Ww][Aa][Vv]/ OR /.*\.[Mm]4[Aa]/ OR /.*\.[Ww][Mm][Aa]/)
    pivot_on: host
    window: 6h
  - name: Scripted shell parents launching recording
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:(/.*[Cc]md.exe/ OR /.*[Pp]ower[Ss]hell.exe/ OR /.*[Ww]script.exe/ OR /.*[Cc]script.exe/) AND data_win_eventdata_commandLine:/.*[Ss]ound[Rr]ecorder.*/
    pivot_on: host
    window: 6h
  - name: Archive, copy or upload of collected files
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Cc]ompress-[Aa]rchive.*/ OR /.*[Cc]url.*/ OR /.*[Bb]itsadmin.*/ OR /.*[Rr]obocopy.*/)
    pivot_on: user
    window: 24h
