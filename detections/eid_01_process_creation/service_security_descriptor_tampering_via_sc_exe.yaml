name: Service Security Descriptor Tampering Via Sc.EXE
id: 98c5aeef-32d5-492f-b174-64a691896d25
version: 1
schema_version: "1.0"
date: "2023-02-28"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 98c5aeef-32d5-492f-b174-64a691896d25
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detection of sc.exe utility adding a new service with special permission which
  hides that service. MITRE ATT&CK: T1574.011.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\sc.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "sc.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*sdset*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches '*\sc.exe';
  data_win_eventdata_originalFileName equals 'sc.exe';
  data_win_eventdata_commandLine matches '*sdset*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://blog.talosintelligence.com/2021/10/threat-hunting-in-large-datasets-by.html
  - https://www.sans.org/blog/red-team-tactics-hiding-windows-services/
  - https://twitter.com/Alh4zr3d/status/1580925761996828672
  - https://twitter.com/0gtweet/status/1628720819537936386
  - https://itconnect.uw.edu/tools-services-support/it-systems-infrastructure/msinf/other-help/understanding-sddl-syntax/
  - https://attack.mitre.org/techniques/T1574/011/

response:
  message: >
    Service Security Descriptor Tampering Via Sc.EXE detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1574.011
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.011
  custom_tags:
    - service
    - security
    - descriptor
    - process_creation
    - sysmon
    - persistence
    - privilege_escalation
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ss][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ss][Cc]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Ss][Dd][Ss][Ee][Tt].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a537cfc3-4297-4789-92b5-345bfd845ad0
    name: Service DACL Abuse To Hide Services Via Sc.EXE
    reason: Same sc.exe sdset abuse that hides a service from enumeration; usually the sibling step.
  - id: 99cf1e02-00fb-4c0d-8375-563f978dfd37
    name: Deny Service Access Using Security Descriptor Tampering Via Sc.EXE
    reason: Deny-ACE variant of service SD tampering; attackers often apply both to blind admins.
  - id: 6c8fbee5-dee8-49bc-851d-c3142d02aa47
    name: Allow Service Access Using Security Descriptor Tampering Via Sc.EXE
    reason: Allow-ACE variant granting low-privileged users control of a service (privilege escalation).
  - id: 17a1be64-8d88-40bf-b5ff-a4f7a50ebcc8
    name: Suspicious New Service Creation
    reason: A service is typically created just before its descriptor is changed to hide it.
  - id: 38879043-7e1e-47a9-8d46-6bec88e201df
    name: Potential Persistence Attempt Via Existing Service Tampering
    reason: Tampering with an existing service for persistence often accompanies hiding it.
  - id: 138d3531-8793-4f50-a2cd-f291b2863d78
    name: Suspicious Service Path Modification
    reason: Binary path change on the same service points to hijack/persistence next to the SD change.
  - id: a95b9b42-1308-4735-a1af-abb1c5e6f5ac
    name: Suspicious Service DACL Modification Via Set-Service Cmdlet
    reason: PowerShell Set-Service equivalent of the same DACL manipulation.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: sc.exe service creation or config
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*[Ss][Cc]\.exe.*(create|config|failure).*/
    pivot_on: host
    window: 2h
  - name: Service binpath in user-writable dirs
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*binpath.*(temp|appdata|programdata|public|users).*/
    pivot_on: host
    window: 4h
  - name: Service ImagePath/ServiceDll registry writes
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*CurrentControlSet.Services.*(ImagePath|ServiceDll).*/
    pivot_on: host
    window: 4h
  - name: Security services stopped or disabled
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(WinDefend|Sense|MpsSvc|EventLog|Sysmon|wazuh|VSS|Veeam|SQL).*(stop|disabled|delete).*/
    pivot_on: host
    window: 2h
  - name: Binaries launched by services.exe from odd paths
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*services\.exe/ AND data_win_eventdata_image:/.*(Temp|AppData|ProgramData|Public).*/
    pivot_on: host
    window: 4h
