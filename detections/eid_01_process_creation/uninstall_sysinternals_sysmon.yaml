name: Uninstall Sysinternals Sysmon
id: 6a5f68d1-c4b5-46b9-94ee-5324892ea939
version: 1
schema_version: "1.0"
date: "2026-06-29"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 6a5f68d1-c4b5-46b9-94ee-5324892ea939
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the removal of Sysmon, which could be a potential attempt at defense
  evasion. MITRE ATT&CK: T1685.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\Sysmon64.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\Sysmon64a.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\Sysmon.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_description:
                    value: "System activity monitor"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-u*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*/u*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*–u*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*—u*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*―u*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_description
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\Sysmon64.exe'; data_win_eventdata_image matches '*\Sysmon64a.exe';
  data_win_eventdata_image matches '*\Sysmon.exe', among other conditions.

known_false_positives: >
  Legitimate administrators might use this command to remove Sysmon for
  debugging purposes. Baseline expected activity in your environment and tune
  this detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1562.001/T1562.001.md#atomic-test-11---uninstall-sysmon
  - https://attack.mitre.org/techniques/T1685/

response:
  message: >
    Uninstall Sysinternals Sysmon detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_description: $data_win_eventdata_description$. MITRE
    ATT&CK: T1685
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_description
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685
  custom_tags:
    - uninstall
    - sysinternals
    - sysmon
    - process_creation
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ss][Yy][Ss][Mm][Oo][Nn]64\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ss][Yy][Ss][Mm][Oo][Nn]64[Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ss][Yy][Ss][Mm][Oo][Nn]\.[Ee][Xx][Ee]/ OR data_win_eventdata_description:/[Ss][Yy][Ss][Tt][Ee][Mm] [Aa][Cc][Tt][Ii][Vv][Ii][Tt][Yy] [Mm][Oo][Nn][Ii][Tt][Oo][Rr]/) AND (data_win_eventdata_commandLine:/.*-[Uu].*/ OR data_win_eventdata_commandLine:/.*\/[Uu].*/ OR data_win_eventdata_commandLine:/.*–[Uu].*/ OR data_win_eventdata_commandLine:/.*—[Uu].*/ OR data_win_eventdata_commandLine:/.*―[Uu].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 4d7cda18-1b12-4e52-b45c-d28653210df8
    name: Sysmon Driver Unloaded Via Fltmc.EXE
    reason: Alternative way to blind Sysmon by unloading its filter driver; often tried alongside or instead of uninstall.
  - id: 87911521-7098-470b-a459-9a57fc80bdfd
    name: Sysmon Configuration Update
    reason: Config changes that gut event coverage are the quieter sibling of uninstalling Sysmon.
  - id: 37db85d1-b089-490a-a59a-c7b6f984f480
    name: Sysmon Discovery Via Default Driver Altitude Using Findstr.EXE
    reason: Attacker locates Sysmon (even renamed) via driver altitude 385201 before removing it.
  - id: 4931188c-178e-4ee7-a348-39e8a7a56821
    name: Filter Driver Unloaded Via Fltmc.EXE
    reason: Unloading any minifilter driver is the generic form of blinding file telemetry.
  - id: 236e7c8e-c9d9-11eb-a824-acde48001122
    name: Disable Logs Using WevtUtil
    reason: Disabling channel logging is the companion step to hide activity after losing Sysmon.
  - id: b28e58e4-2a72-4fae-bdee-0fbe904db642
    name: Windows Defender Real-time Protection Disabled
    reason: Defense-evasion actors disable Defender in the same blinding window.
  - id: 8a7e90c5-fe6e-45dc-889e-057fe4378bd9
    name: HackTool - SysmonEOP Execution
    reason: Sysmon-targeting tooling indicates hostile interest in Sysmon rather than admin maintenance.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Sysmon discovery and driver manipulation
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*385201.*/ OR data_win_eventdata_commandLine:/.*[Ff][Ll][Tt][Mm][Cc] [Uu][Nn][Ll][Oo][Aa][Dd].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc] [Ss][Tt][Oo][Pp] [Ss][Yy][Ss][Mm][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc] [Dd][Ee][Ll][Ee][Tt][Ee] [Ss][Yy][Ss][Mm][Oo][Nn].*/)
    pivot_on: host
    window: 4h
  - name: Sysmon configuration state change events
    query: data_win_system_eventID:"16" OR data_win_system_eventID:"4"
    pivot_on: host
    window: 4h
  - name: Log clearing and audit tampering
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll] [Cc][Ll].*/ OR data_win_eventdata_commandLine:/.*[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll] [Ss][Ll].*/ OR data_win_eventdata_commandLine:/.*[Cc][Ll][Ee][Aa][Rr]-[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg].*/ OR data_win_eventdata_commandLine:/.*[Aa][Uu][Dd][Ii][Tt][Pp][Oo][Ll].*/)
    pivot_on: host
    window: 4h
  - name: Defender and security tool tamper
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee][Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Pp][Rr][Oo][Dd][Uu][Cc][Tt] [Ww][Hh][Ee][Rr][Ee].*/)
    pivot_on: host
    window: 4h
  - name: Credential dumping and remote exec after blinding
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]|[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]64\.[Ee][Xx][Ee]|[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|[Pp][Ss][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]|[Rr][Ee][Gg]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 6h
