name: HackTool - CrackMapExec PowerShell Obfuscation
id: 6f8b3439-a203-45dc-a88b-abf57ea15ccf
version: 1
schema_version: "1.0"
date: "2023-02-21"
author: Thomas Patzke
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 6f8b3439-a203-45dc-a88b-abf57ea15ccf
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  The CrachMapExec pentesting framework implements a PowerShell obfuscation with
  some static strings detected by this rule. MITRE ATT&CK: T1059.001, T1027.005.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\powershell.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\pwsh.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "PowerShell.EXE"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "pwsh.dll"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*join*split*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*( $ShellId[1]+$ShellId[13]+'x')*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*( $PSHome[*]+$PSHOME[*]+*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*( $env:Public[13]+$env:Public[5]+'x')*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*( $env:ComSpec[4,*,25]-Join'')*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*[1,3]+'x'-Join'')*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\powershell.exe'; data_win_eventdata_image matches '*\pwsh.exe';
  data_win_eventdata_originalFileName equals 'PowerShell.EXE', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/byt3bl33d3r/CrackMapExec
  - https://github.com/byt3bl33d3r/CrackMapExec/blob/0a49f75347b625e81ee6aa8c33d3970b5515ea9e/cme/helpers/powershell.py#L242
  - https://attack.mitre.org/techniques/T1059/001/
  - https://attack.mitre.org/techniques/T1027/005/

response:
  message: >
    HackTool - CrackMapExec PowerShell Obfuscation detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1059.001, T1027.005
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
    - T1027.005
  custom_tags:
    - hacktool
    - crackmapexec
    - powershell
    - process_creation
    - sysmon
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Pp][Ww][Ss][Hh]\.[Dd][Ll][Ll]/) AND (data_win_eventdata_commandLine:/.*[Jj][Oo][Ii][Nn].*[Ss][Pp][Ll][Ii][Tt].*/ OR data_win_eventdata_commandLine:/.*\( \$[Ss][Hh][Ee][Ll][Ll][Ii][Dd]\[1\]\+\$[Ss][Hh][Ee][Ll][Ll][Ii][Dd]\[13\]\+'[Xx]'\).*/ OR data_win_eventdata_commandLine:/.*\( \$[Pp][Ss][Hh][Oo][Mm][Ee]\[.*\]\+\$[Pp][Ss][Hh][Oo][Mm][Ee]\[.*\]\+.*/ OR data_win_eventdata_commandLine:/.*\( \$[Ee][Nn][Vv]:[Pp][Uu][Bb][Ll][Ii][Cc]\[13\]\+\$[Ee][Nn][Vv]:[Pp][Uu][Bb][Ll][Ii][Cc]\[5\]\+'[Xx]'\).*/ OR data_win_eventdata_commandLine:/.*\( \$[Ee][Nn][Vv]:[Cc][Oo][Mm][Ss][Pp][Ee][Cc]\[4,.*,25\]-[Jj][Oo][Ii][Nn]''\).*/ OR data_win_eventdata_commandLine:/.*\[1,3\]\+'[Xx]'-[Jj][Oo][Ii][Nn]''\).*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 42a993dd-bb3e-48c8-b372-4d6684c4106c
    name: HackTool - CrackMapExec Execution
    reason: Operator-side flag usage that generates this obfuscated payload.
  - id: 058f4380-962d-40a5-afce-50207d36d7e2
    name: HackTool - CrackMapExec Execution Patterns
    reason: Same session's cmd/PowerShell exec wrapper around the obfuscated payload.
  - id: f26307d8-14cd-47e3-a26b-4b4769f24af6
    name: HackTool - CrackMapExec Process Patterns
    reason: Process chain on target for the same CME run.
  - id: d7bcd677-645d-4691-a8d4-7a5602b780d1
    name: Potential PowerShell Command Line Obfuscation
    reason: Generic obfuscation detector that co-fires on CME's join/split style.
  - id: 8d01b53f-456f-48ee-90f6-bc28e67d4e35
    name: Suspicious Obfuscated PowerShell Code
    reason: Obfuscated payload content co-detection.
  - id: 44e24481-6202-4c62-9127-5a0ae8e3fe3d
    name: Obfuscated PowerShell OneLiner Execution
    reason: One-liner execution form of the same obfuscation.
  - id: 7dbbcac2-57a0-45ac-b306-ff30a8bd2981
    name: Windows AMSI Related Registry Tampering Via CommandLine
    reason: CME payloads may tamper with AMSI/defense settings.
  - id: 4627c6ae-6899-46e2-aa0c-6ebcb1becd19
    name: HackTool - Impacket Tools Execution
    reason: Impacket-based transport that carries the PowerShell.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: PowerShell with heavy string join/split/replace obfuscation
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND data_win_eventdata_commandLine:(/.*[Jj]oin.*[Ss]plit.*/ OR /.*[Rr]eplace.*[Rr]eplace.*/ OR /.*\[[Cc]har\].*/)
    pivot_on: host
    window: 4h
  - name: PowerShell spawned from remote-execution parents
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND data_win_eventdata_parentImage:(/.*wmiprvse\.exe/ OR /.*\\services\.exe/ OR /.*cmd\.exe/)
    pivot_on: host
    window: 4h
  - name: PowerShell outbound or SMB connections
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/
    pivot_on: host
    window: 4h
  - name: Credential access follow-on
    query: data_win_system_eventID:(1 OR 10) AND (data_win_eventdata_commandLine:(/.*[Ll]sass.*/ OR /.*[Mm]imikatz.*/ OR /.*reg.*save.*/) OR data_win_eventdata_targetImage:/.*lsass\.exe/)
    pivot_on: host
    window: 6h
  - name: Network logons from remote sources
    query: data_win_system_eventID:4624 AND data_win_eventdata_logonType:3
    pivot_on: ip
    window: 4h
