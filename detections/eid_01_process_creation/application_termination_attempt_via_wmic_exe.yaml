name: Application Termination Attempt via Wmic.EXE
id: 49d9671b-0a0a-4c09-8280-d215bfd30662
version: 1
schema_version: "1.0"
date: "2023-09-11"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 49d9671b-0a0a-4c09-8280-d215bfd30662
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects an attempt to terminate a process via "wmic" with the "call terminate"
  flag. Adversaries may use wmic to terminate security products or other
  applications on the compromised host. This event is triggered on on attempt
  and process creation can be either successful or unsuccessful. MITRE ATT&CK:
  T1047.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\WMIC.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "wmic.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*call*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*terminate*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\WMIC.exe'; data_win_eventdata_originalFileName equals 'wmic.exe';
  data_win_eventdata_commandLine matches '*call*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://cyble.com/blog/lockfile-ransomware-using-proxyshell-attack-to-deploy-ransomware/
  - https://www.bitdefender.com/files/News/CaseStudies/study/377/Bitdefender-Whitepaper-WMI-creat4871-en-EN-GenericUse.pdf
  - https://attack.mitre.org/techniques/T1047/

response:
  message: >
    Application Termination Attempt via Wmic.EXE detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1047
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1047
  custom_tags:
    - application
    - termination
    - process_creation
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Cc][Aa][Ll][Ll].*/ AND data_win_eventdata_commandLine:/.*[Tt][Ee][Rr][Mm][Ii][Nn][Aa][Tt][Ee].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b53317a0-8acf-4fd1-8de8-a5401e776b96
    name: Application Removed Via Wmic.EXE
    reason: Attackers who terminate a product with wmic often follow by uninstalling it.
  - id: 847d5ff3-8a31-4737-a970-aeae8fe21765
    name: Potential Tampering With Security Products Via WMIC
    reason: Killing security processes is the typical goal; covers the security-product variants.
  - id: 51cbac1e-eee3-4a90-b1b7-358efb81fa0a
    name: Potential Windows Defender Tampering Via Wmic.EXE
    reason: Defender tampering via wmic alongside process termination.
  - id: 221b251a-357a-49a9-920a-271802777cc0
    name: Potential Process Reconnaissance via Wmic.EXE
    reason: Process listing via wmic precedes choosing which process to kill.
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: Ransomware kills backup/database processes, then deletes shadow copies.
  - id: a7ee1722-c3c5-aeff-3212-c777e4733217
    name: Disable Windows Defender AV Security Monitoring
    reason: Parallel defense-evasion step on the same host.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other process kill methods
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*[Tt]askkill\.exe/ OR data_win_eventdata_commandLine:/.*[Ss]top-[Pp]rocess.*/ OR data_win_eventdata_commandLine:/.*[Nn]et.*stop.*/)
    pivot_on: host
    window: 2h
  - name: Wmic process enumeration
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Ww]mic\.exe/ AND data_win_eventdata_commandLine:/.*[Pp]rocess.*/
    pivot_on: host
    window: 2h
  - name: Service stop or disable
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*sc.*stop.*/ OR /.*sc.*config.*disabled.*/ OR /.*[Ss]et-[Ss]ervice.*[Dd]isabled.*/)
    pivot_on: host
    window: 2h
  - name: Backup and recovery destruction follow-up
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*vssadmin.*delete.*/ OR /.*wbadmin.*delete.*/ OR /.*bcdedit.*recoveryenabled.*/)
    pivot_on: host
    window: 4h
