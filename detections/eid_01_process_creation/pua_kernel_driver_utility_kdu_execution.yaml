name: PUA - Kernel Driver Utility (KDU) Execution
id: e76ca062-4de0-4d79-8d90-160a0d335eca
version: 1
schema_version: "1.0"
date: "2026-01-02"
author: Matt Anderson, Dray Agha, Anna Pham (Huntress)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: e76ca062-4de0-4d79-8d90-160a0d335eca
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of the Kernel Driver Utility (KDU) tool. KDU can be used to
  bypass driver signature enforcement and load unsigned or malicious drivers
  into the Windows kernel. Potentially allowing for privilege escalation,
  persistence, or evasion of security controls. MITRE ATT&CK: T1543.003.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\kdu.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\hamakaze.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "hamakaze.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-map *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-prv *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-dse *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-ps *"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches '*\kdu.exe';
  data_win_eventdata_image matches '*\hamakaze.exe';
  data_win_eventdata_originalFileName equals 'hamakaze.exe', among other
  conditions.

known_false_positives: >
  Legitimate driver development, testing, or administrative troubleshooting
  (e.g., enabling/disabling hardware). Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://github.com/h4rmy/KDU
  - https://huntress.com/blog/esxi-vm-escape-exploit
  - https://attack.mitre.org/techniques/T1543/003/

response:
  message: >
    PUA - Kernel Driver Utility (KDU) Execution detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1543.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1543.003
  custom_tags:
    - kernel
    - driver
    - utility
    - process_creation
    - sysmon
    - persistence
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Kk][Dd][Uu]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Hh][Aa][Mm][Aa][Kk][Aa][Zz][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Hh][Aa][Mm][Aa][Kk][Aa][Zz][Ee]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*-[Mm][Aa][Pp] .*/ OR data_win_eventdata_commandLine:/.*-[Pp][Rr][Vv] .*/ OR data_win_eventdata_commandLine:/.*-[Dd][Ss][Ee] .*/ OR data_win_eventdata_commandLine:/.*-[Pp][Ss] .*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 431a1fdb-4799-4f3b-91c3-a683b003fc49
    name: New Kernel Driver Via SC.EXE
    reason: Vulnerable driver is typically registered as a kernel service around KDU mapping.
  - id: 2c4523d5-d481-4ed0-8ec3-7fbf0cb41a75
    name: Driver Load From A Temporary Directory
    reason: KDU provider drivers are dropped and loaded from temp paths.
  - id: 1a42dfa6-6cb2-4df9-9b48-295be477e835
    name: Vulnerable WinRing0 Driver Load
    reason: WinRing0 is a driver abused for kernel read/write in BYOVD chains.
  - id: 295c9289-acee-4503-a571-8eacaef36b28
    name: Vulnerable HackSys Extreme Vulnerable Driver Load
    reason: Another vulnerable driver loaded for kernel exploitation.
  - id: 39b64854-5497-4b57-a448-40977b8c9679
    name: Malicious Driver Load By Name
    reason: Known malicious/vulnerable driver names loaded in the same BYOVD chain.
  - id: 22154f0e-5132-4a54-aa78-cc62f6def531
    name: Vulnerable Driver Blocklist Registry Tampering Via CommandLine
    reason: Attackers disable the blocklist so vulnerable drivers will load.
  - id: 6225c53a-a96e-4235-b28f-8d7997cd96eb
    name: Hypervisor-protected Code Integrity (HVCI) Related Registry Tampering Via CommandLine
    reason: HVCI must be off for kernel tampering to succeed.
  - id: a7ee1722-c3c5-aeff-3212-c777e4733217
    name: Disable Windows Defender AV Security Monitoring
    reason: 'Typical objective: blind security tooling once kernel access is gained.'
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Driver loads from unusual locations
    query: data_win_system_eventID:6 AND data_win_eventdata_imageLoaded:(/.*[Tt]emp.*/ OR /.*[Uu]sers.*/ OR /.*[Pp]ublic.*/ OR /.*[Pp]rogram[Dd]ata.*/)
    pivot_on: host
    window: 6h
  - name: Kernel service creation or driver registration
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Cc]reate.*[Kk]ernel.*/ OR /.*\.sys.*/)
    pivot_on: host
    window: 6h
  - name: New .sys files written to disk
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\.sys/
    pivot_on: host
    window: 6h
  - name: Security tooling tampering after driver load
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ss]et-[Mm]p[Pp]reference.*/ OR /.*[Dd]isable[Rr]ealtime.*/ OR /.*[Ss]top.*[Dd]efend.*/)
    pivot_on: host
    window: 6h
  - name: Registry tamper of HVCI or driver blocklist
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:(/.*[Dd]evice[Gg]uard.*/ OR /.*[Vv]ulnerable[Dd]river[Bb]locklist.*/ OR /.*[Hh]ypervisor[Ee]nforced.*/)
    pivot_on: host
    window: 6h
