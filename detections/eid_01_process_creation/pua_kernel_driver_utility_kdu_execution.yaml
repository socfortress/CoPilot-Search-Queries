name: PUA - Kernel Driver Utility (KDU) Execution
id: e76ca062-4de0-4d79-8d90-160a0d335eca
version: 1
schema_version: "1.0"
date: "2026-01-02"
author: Matt Anderson, Dray Agha, Anna Pham (Huntress)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: e76ca062-4de0-4d79-8d90-160a0d335eca
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of the Kernel Driver Utility (KDU) tool. KDU can be used to
  bypass driver signature enforcement and load unsigned or malicious drivers
  into the Windows kernel. Potentially allowing for privilege escalation,
  persistence, or evasion of security controls. MITRE ATT&CK: T1543.003.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\kdu.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\hamakaze.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "hamakaze.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-map *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-prv *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-dse *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-ps *"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches '*\kdu.exe';
  data_win_eventdata_image matches '*\hamakaze.exe';
  data_win_eventdata_originalFileName equals 'hamakaze.exe', among other
  conditions.

known_false_positives: >
  Legitimate driver development, testing, or administrative troubleshooting
  (e.g., enabling/disabling hardware). Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://github.com/h4rmy/KDU
  - https://huntress.com/blog/esxi-vm-escape-exploit
  - https://attack.mitre.org/techniques/T1543/003/

response:
  message: >
    PUA - Kernel Driver Utility (KDU) Execution detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1543.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1543.003
  custom_tags:
    - kernel
    - driver
    - utility
    - process_creation
    - sysmon
    - persistence
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Kk][Dd][Uu]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Hh][Aa][Mm][Aa][Kk][Aa][Zz][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Hh][Aa][Mm][Aa][Kk][Aa][Zz][Ee]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*-[Mm][Aa][Pp] .*/ OR data_win_eventdata_commandLine:/.*-[Pp][Rr][Vv] .*/ OR data_win_eventdata_commandLine:/.*-[Dd][Ss][Ee] .*/ OR data_win_eventdata_commandLine:/.*-[Pp][Ss] .*/)

