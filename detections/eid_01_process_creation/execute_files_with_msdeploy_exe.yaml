name: Execute Files with Msdeploy.exe
id: 646bc99f-6682-4b47-a73a-17b1b64c9d34
version: 1
schema_version: "1.0"
date: "2021-11-27"
author: Beyu Denis, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 646bc99f-6682-4b47-a73a-17b1b64c9d34
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects file execution using the msdeploy.exe lolbin. MITRE ATT&CK: T1218.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*verb:sync*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*-source:RunCommand*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*-dest:runCommand*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\msdeploy.exe"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*verb:sync*'; data_win_eventdata_commandLine matches '*-source:RunCommand*';
  data_win_eventdata_commandLine matches '*-dest:runCommand*', among other
  conditions.

known_false_positives: >
  System administrator Usage. Baseline expected activity in your environment and
  tune this detection before relying on it for automated response.

references:
  - https://lolbas-project.github.io/lolbas/OtherMSBinaries/Msdeploy/
  - https://twitter.com/pabraeken/status/995837734379032576
  - https://twitter.com/pabraeken/status/999090532839313408
  - https://attack.mitre.org/techniques/T1218/

response:
  message: >
    Execute Files with Msdeploy.exe detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1218
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218
  custom_tags:
    - execute
    - msdeploy
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Vv][Ee][Rr][Bb]:[Ss][Yy][Nn][Cc].*/ AND data_win_eventdata_commandLine:/.*-[Ss][Oo][Uu][Rr][Cc][Ee]:[Rr][Uu][Nn][Cc][Oo][Mm][Mm][Aa][Nn][Dd].*/ AND data_win_eventdata_commandLine:/.*-[Dd][Ee][Ss][Tt]:[Rr][Uu][Nn][Cc][Oo][Mm][Mm][Aa][Nn][Dd].*/ AND data_win_eventdata_image:/.*\\[Mm][Ss][Dd][Ee][Pp][Ll][Oo][Yy]\.[Ee][Xx][Ee]/

correlation:
  # Authored by the correlation engine for review.
  enrichment_searches:
  # NEW ad-hoc searches the engine runs around an alert from this rule, scoped to
  # the alert's host/user/IP within the window (not existing CoPilot Searches).
    - name: "Sysmon activity on this host in the window"
      query: 'data_win_system_channel:"Microsoft-Windows-Sysmon/Operational"'
      pivot_on: [host]
      window: 1h
    - name: "Process creation on this host"
      query: 'data_win_system_eventID:"1"'
      pivot_on: [host]
      window: 1h
    - name: "Network connections from this host"
      query: 'data_win_system_eventID:"3"'
      pivot_on: [host]
      window: 1h
    - name: "High-severity alerts on this host"
      query: 'rule_level:>=10'
      pivot_on: [host]
      window: 1h
