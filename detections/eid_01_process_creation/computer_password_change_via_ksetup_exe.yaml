name: Computer Password Change Via Ksetup.EXE
id: de16d92c-c446-4d53-8938-10aeef41c8b6
version: 1
schema_version: "1.0"
date: "2023-04-06"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: de16d92c-c446-4d53-8938-10aeef41c8b6
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects password change for the computer's domain account or host principal
  via "ksetup.exe".

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\ksetup.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "ksetup.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* /setcomputerpassword *"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\ksetup.exe'; data_win_eventdata_originalFileName equals 'ksetup.exe';
  data_win_eventdata_commandLine matches '* /setcomputerpassword *'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/Oddvarmoe/status/1641712700605513729
  - https://learn.microsoft.com/en-gb/windows-server/administration/windows-commands/ksetup

response:
  message: >
    Computer Password Change Via Ksetup.EXE detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  custom_tags:
    - computer
    - password
    - change
    - process_creation
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Kk][Ss][Ee][Tt][Uu][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Kk][Ss][Ee][Tt][Uu][Pp]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.* \/[Ss][Ee][Tt][Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr][Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd] .*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c9783e20-4793-4164-ba96-d9ee483992c4
    name: Logged-On User Password Change Via Ksetup.EXE
    reason: Sibling ksetup password rule; same tool altering Kerberos credentials.
  - id: dcc6a01e-9471-44a0-a699-71ea96f8ed8b
    name: Exploitation Attempt Of CVE-2020-1472 - Execution of ZeroLogon PoC
    reason: ZeroLogon also resets the computer account password; related machine-credential attack.
  - id: caa9a802-8bd8-4b9e-a5cd-4d6221670219
    name: Suspicious Kerberos Ticket Request via CLI
    reason: Resetting the machine secret enables forging or requesting tickets as the host.
  - id: 1eeed653-dbc8-4187-ad0c-eeebb20e6599
    name: Potential SPN Enumeration Via Setspn.EXE
    reason: Kerberos service-principal recon that precedes machine-account abuse.
  - id: 0ed99dda-6a35-11ef-8c99-0242ac120002
    name: Attempts of Kerberos Coercion Via DNS SPN Spoofing
    reason: Related Kerberos abuse chain against machine accounts.
  - id: 2afafd61-6aae-4df4-baed-139fa1f4c345
    name: Invocation of Active Directory Diagnostic Tool (ntdsutil.exe)
    reason: Follow-on domain credential access after machine-secret manipulation.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Kerberos tool usage
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*[Kk]setup\.exe/ OR data_win_eventdata_commandLine:/.*[Kk]list.*/ OR data_win_eventdata_commandLine:/.*[Ss]etspn.*/)
    pivot_on: host
    window: 4h
  - name: Account password change events
    query: data_win_system_eventID:(4742 OR 4723 OR 4724)
    pivot_on: host
    window: 4h
  - name: Kerberos ticket requests and network logons
    query: data_win_system_eventID:(4768 OR 4769 OR 4624) AND data_win_eventdata_logonType:3
    pivot_on: host
    window: 4h
  - name: SYSTEM-level shell activity
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*[Cc]md\.exe/ OR data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/) AND data_win_eventdata_integrityLevel:System
    pivot_on: host
    window: 2h
