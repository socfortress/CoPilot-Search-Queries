name: Delete All Scheduled Tasks
id: 220457c1-1c9f-4c2e-afe6-9598926222c1
version: 1
schema_version: "1.0"
date: "2022-09-09"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 220457c1-1c9f-4c2e-afe6-9598926222c1
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the usage of schtasks with the delete flag and the asterisk symbol to
  delete all tasks from the schedule of the local computer, including tasks
  scheduled by other users. MITRE ATT&CK: T1489.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\schtasks.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* /delete *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*/tn \\**"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* /f*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\schtasks.exe'; data_win_eventdata_commandLine matches '* /delete *';
  data_win_eventdata_commandLine matches '*/tn **', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/schtasks-delete
  - https://attack.mitre.org/techniques/T1489/

response:
  message: >
    Delete All Scheduled Tasks detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1489
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1489
  custom_tags:
    - delete
    - scheduled
    - tasks
    - process_creation
    - sysmon
    - impact
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.* \/[Dd][Ee][Ll][Ee][Tt][Ee] .*/ AND data_win_eventdata_commandLine:/.*\/[Tt][Nn] \*.*/ AND data_win_eventdata_commandLine:/.* \/[Ff].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: dbc1f800-0fe0-4bc0-9c66-292c2abe3f78
    name: Delete Important Scheduled Task
    reason: Targeted variant of the same schtasks /delete behaviour; wiping all tasks often accompanies or follows removal of backup/BitLocker/Defender tasks.
  - id: 9ac94dc8-9042-493c-ba45-3b5e7c86b980
    name: Disable Important Scheduled Task
    reason: Adversaries disable key maintenance/security tasks alongside mass deletion to blind defenders.
  - id: db596056-3019-11ec-a9ff-acde48001122
    name: Disable Schedule Task
    reason: Disabling tasks via schtasks /change is the quieter sibling of deleting them.
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: 'Impact-phase step: task wipe is typically followed by shadow copy deletion in a ransomware sequence.'
  - id: 639c9081-f482-47d3-a0bd-ddee3d4ecd76
    name: All Backups Deleted Via Wbadmin.EXE
    reason: Backup destruction commonly co-occurs with schedule wipe to prevent recovery jobs from running.
  - id: c9fbe8e9-119d-40a6-9b59-dd58a5d84429
    name: Potential Ransomware or Unauthorized MBR Tampering Via Bcdedit.EXE
    reason: Recovery-inhibit step in the same destructive playbook.
  - id: 236e7c8e-c9d9-11eb-a824-acde48001122
    name: Disable Logs Using WevtUtil
    reason: Log disabling by the same actor to hide the destructive activity.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other schtasks activity (create/change/end/delete)
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Ss]chtasks\.exe/ AND data_win_eventdata_commandLine:/.*\/(create|change|end|delete).*/
    pivot_on: host
    window: 24h
  - name: Recovery inhibition commands
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*[Vv]ssadmin.*[Dd]elete.*/ OR data_win_eventdata_commandLine:/.*[Ww]badmin.*[Dd]elete.*/ OR data_win_eventdata_commandLine:/.*[Bb]cdedit.*([Rr]ecoveryenabled|[Bb]ootstatuspolicy).*/)
    pivot_on: host
    window: 6h
  - name: Service and process stopping
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*([Nn]et1? stop|[Ss]c(\.exe)? (stop|config)|[Tt]askkill).*/
    pivot_on: host
    window: 6h
  - name: Security tooling tampering
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*([Ss]et-[Mm]pPreference|[Dd]isable[Rr]ealtime|[Ww]evtutil.*(cl|sl)).*/
    pivot_on: host
    window: 6h
  - name: Script launchers invoking schtasks
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*(powershell|cmd|wscript|cscript|mshta)\.exe/ AND data_win_eventdata_commandLine:/.*[Ss]chtasks.*/
    pivot_on: host
    window: 2h
