name: Potential Windows Defender Tampering Via Wmic.EXE
id: 51cbac1e-eee3-4a90-b1b7-358efb81fa0a
version: 1
schema_version: "1.0"
date: "2023-02-14"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 51cbac1e-eee3-4a90-b1b7-358efb81fa0a
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential tampering with Windows Defender settings such as adding
  exclusion using wmic. MITRE ATT&CK: T1047, T1685.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - term:
                  data_win_eventdata_originalFileName:
                    value: "wmic.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\WMIC.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*/Namespace:\\\\\\\\root\\\\Microsoft\\\\Windows\\\\Defender*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_originalFileName
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_originalFileName equals
  'wmic.exe'; data_win_eventdata_image matches '*\WMIC.exe';
  data_win_eventdata_commandLine matches
  '*/Namespace:\\root\Microsoft\Windows\Defender*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/5c1e6f1b4fafd01c8d1ece85f510160fc1275fbf/atomics/T1562.001/T1562.001.md
  - https://www.bleepingcomputer.com/news/security/gootkit-malware-bypasses-windows-defender-by-setting-path-exclusions/
  - https://www.bleepingcomputer.com/news/security/iobit-forums-hacked-to-spread-ransomware-to-its-members/
  - https://attack.mitre.org/techniques/T1047/
  - https://attack.mitre.org/techniques/T1685/

response:
  message: >
    Potential Windows Defender Tampering Via Wmic.EXE detected on host
    $agent_name$. Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1047, T1685
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_originalFileName
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1047
    - T1685
  custom_tags:
    - defender
    - tampering
    - process_creation
    - sysmon
    - execution
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_originalFileName:/[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*\/[Nn][Aa][Mm][Ee][Ss][Pp][Aa][Cc][Ee]:\\\\[Rr][Oo][Oo][Tt]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 847d5ff3-8a31-4737-a970-aeae8fe21765
    name: Potential Tampering With Security Products Via WMIC
    reason: wmic against SecurityCenter2 to tamper with other security products - same wmic evasion
  - id: 1321dc4e-a1fe-481d-a016-52c45f0c8b4f
    name: Windows Defender Exclusions Added
    reason: Defender exclusion added is the resulting event of this wmic change
  - id: 801bd44f-ceed-4eb6-887c-11544633c0aa
    name: Windows Defender Configuration Changes
    reason: Defender configuration change event confirms the setting was applied
  - id: b28e58e4-2a72-4fae-bdee-0fbe904db642
    name: Windows Defender Real-time Protection Disabled
    reason: Real-time protection disabled is the likely outcome of the tampering
  - id: 17769c90-230e-488b-a463-e05c08e9d48f
    name: Powershell Defender Exclusion
    reason: PowerShell exclusion is the alternate path to the same goal
  - id: 07e3cb2c-0608-410d-be4b-1511cb1a0448
    name: Tamper Windows Defender Remove-MpPreference
    reason: Remove-MpPreference reverts protections - tampering sibling
  - id: 5e95028c-5229-4214-afae-d653d573d0ec
    name: Security Service Disabled Via Reg.EXE
    reason: Security service disabled via reg.exe - parallel defender disable technique
  - id: 526be59f-a573-4eea-b5f7-f0973207634d
    name: Process Creation Attempt via Wmic.EXE
    reason: wmic process call create launches the payload now excluded from scanning
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Defender exclusion or protection changes via any tool
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Aa]dd-[Mm]p[Pp]reference.*/ OR /.*[Ss]et-[Mm]p[Pp]reference.*/ OR /.*[Ee]xclusion(Path|Process|Extension).*/ OR /.*[Mm]p[Cc]md[Rr]un.*/)
    pivot_on: host
    window: 2h
  - name: Defender registry exclusions and disable flags
    query: data_win_system_eventID:(12 OR 13) AND data_win_eventdata_targetObject:(/.*[Ww]indows [Dd]efender.*[Ee]xclusions.*/ OR /.*[Dd]isable[Aa]nti[Ss]pyware.*/ OR /.*[Dd]isable[Rr]ealtime[Mm]onitoring.*/)
    pivot_on: host
    window: 2h
  - name: Defender operational log changes
    query: data_win_system_eventID:(5001 OR 5004 OR 5007 OR 5010 OR 5012)
    pivot_on: host
    window: 2h
  - name: wmic process or WMI-driven execution
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ww]mic.*[Pp]rocess.*[Cc]all.*[Cc]reate.*/ OR /.*[Ww]mic.*\/[Nn]ode:.*/ OR /.*[Ww]mic.*[Ss]hadowcopy.*/)
    pivot_on: host
    window: 4h
  - name: Payload execution after protection reduced
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:(/.*[Ww]mi[Pp]rvse\.exe/ OR /.*[Ww]mic\.exe/) AND data_win_eventdata_image:(/.*[Pp]ower[Ss]hell.*/ OR /.*[Cc]md\.exe/ OR /.*[Rr]undll32\.exe/)
    pivot_on: host
    window: 4h
