    - T1053
    - T1059.003
    - T1059.001
    - T1110
    - T1201
  custom_tags:
    - hacktool
    - crackmapexec
    - process_creation
    - sysmon
    - execution
    - persistence
    - privilege_escalation
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Cc][Rr][Aa][Cc][Kk][Mm][Aa][Pp][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.* -[Mm] [Pp][Ee]_[Ii][Nn][Jj][Ee][Cc][Tt] .*/ OR (data_win_eventdata_commandLine:/.* --[Ll][Oo][Cc][Aa][Ll]-[Aa][Uu][Tt][Hh].*/ AND data_win_eventdata_commandLine:/.* -[Uu] .*/ AND data_win_eventdata_commandLine:/.* -[Xx] .*/) OR (data_win_eventdata_commandLine:/.* --[Ll][Oo][Cc][Aa][Ll]-[Aa][Uu][Tt][Hh].*/ AND data_win_eventdata_commandLine:/.* -[Uu] .*/ AND data_win_eventdata_commandLine:/.* -[Pp] .*/ AND data_win_eventdata_commandLine:/.* -[Hh] '[Nn][Tt][Hh][Aa][Ss][Hh]'.*/) OR (data_win_eventdata_commandLine:/.* [Mm][Ss][Ss][Qq][Ll] .*/ AND data_win_eventdata_commandLine:/.* -[Uu] .*/ AND data_win_eventdata_commandLine:/.* -[Pp] .*/ AND data_win_eventdata_commandLine:/.* -[Mm] .*/ AND data_win_eventdata_commandLine:/.* -[Dd] .*/) OR (data_win_eventdata_commandLine:/.* [Ss][Mm][Bb] .*/ AND data_win_eventdata_commandLine:/.* -[Uu] .*/ AND data_win_eventdata_commandLine:/.* -[Hh] .*/ AND data_win_eventdata_commandLine:/.* -[Mm] .*/ AND data_win_eventdata_commandLine:/.* -[Oo] .*/) OR (data_win_eventdata_commandLine:/.* [Ss][Mm][Bb] .*/ AND data_win_eventdata_commandLine:/.* -[Uu] .*/ AND data_win_eventdata_commandLine:/.* -[Pp] .*/ AND data_win_eventdata_commandLine:/.* --[Ll][Oo][Cc][Aa][Ll]-[Aa][Uu][Tt][Hh].*/) OR (data_win_eventdata_commandLine:/.* --[Ll][Oo][Cc][Aa][Ll]-[Aa][Uu][Tt][Hh].*/ AND data_win_eventdata_commandLine:/.* -[Uu] .*/ AND data_win_eventdata_commandLine:/.* -[Pp] .*/ AND data_win_eventdata_commandLine:/.* 10\..*/ AND data_win_eventdata_commandLine:/.* 192\.168\..*/ AND data_win_eventdata_commandLine:/.*\/24 .*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 058f4380-962d-40a5-afce-50207d36d7e2
    name: HackTool - CrackMapExec Execution Patterns
    reason: 'Sibling CME rule: cmd output redirection to ADMIN$ shares and noni/nop PowerShell; same operator session.'
  - id: f26307d8-14cd-47e3-a26b-4b4769f24af6
    name: HackTool - CrackMapExec Process Patterns
    reason: CME-spawned remote process chains (wmiprvse/services parents) on the target side.
  - id: 6f8b3439-a203-45dc-a88b-abf57ea15ccf
    name: HackTool - CrackMapExec PowerShell Obfuscation
    reason: CME's obfuscated PowerShell payload for -x/-X command execution.
  - id: 4627c6ae-6899-46e2-aa0c-6ebcb1becd19
    name: HackTool - Impacket Tools Execution
    reason: CME builds on Impacket; same remote exec primitives.
  - id: d6e464e4-5c6a-474e-82d2-aed616a3a492
    name: Impacket Lateral Movement WMIExec Commandline Parameters
    reason: CME wmiexec method produces the same command-line artefacts.
  - id: bb3c1bac-6bdf-4aa0-8dc9-068b8b712a76
    name: Impacket Lateral Movement smbexec CommandLine Parameters
    reason: CME smbexec method creates service-based execution with identical patterns.
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: CME --lsa/--sam and mimikatz module often follow successful auth to dump creds.
  - id: cd219ff3-fa99-45d4-8380-a7d15116c6dc
    name: New User Created Via Net.EXE
    reason: CME -x commonly used to add local admin accounts.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Admin share output redirection (CME exec output)
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*cmd.*\/[Cc].*>.*\\\\.*\\(ADMIN|C)\$.*/ OR /.*2>&1.*[Tt]emp.*/)
    pivot_on: host
    window: 6h
  - name: Remote execution parents (WMI, services, taskeng)
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:(/.*wmiprvse\.exe/ OR /.*\\services\.exe/ OR /.*taskeng\.exe/) AND data_win_eventdata_image:(/.*cmd\.exe/ OR /.*[Pp]ower[Ss]hell\.exe/)
    pivot_on: host
    window: 6h
  - name: Credential dumping tooling
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ll]sass.*/ OR /.*reg.*save.*(sam|system|security).*/ OR /.*ntdsutil.*/ OR /.*[Mm]imikatz.*/)
    pivot_on: host
    window: 6h
  - name: Local account and group manipulation
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*net1? +(user|localgroup).*\/add.*/)
    pivot_on: host
    window: 6h
  - name: Network logons from the attacker source
    query: data_win_system_eventID:4624 AND data_win_eventdata_logonType:3 AND data_win_eventdata_authenticationPackageName:NTLM
    pivot_on: ip
    window: 6h
