response:
  message: >
    Potential Tampering With RDP Related Registry Keys Via Reg.EXE detected on
    host $agent_name$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1021.001, T1112
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1021.001
    - T1112
  custom_tags:
    - tampering
    - related
    - registry
    - process_creation
    - sysmon
    - persistence
    - lateral_movement
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Rr][Ee][Gg]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Rr][Ee][Gg]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.* [Aa][Dd][Dd] .*/ AND data_win_eventdata_commandLine:/.*\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt]\\[Cc][Oo][Nn][Tt][Rr][Oo][Ll]\\[Tt][Ee][Rr][Mm][Ii][Nn][Aa][Ll] [Ss][Ee][Rr][Vv][Ee][Rr].*/ AND data_win_eventdata_commandLine:/.*[Rr][Ee][Gg]_[Dd][Ww][Oo][Rr][Dd].*/ AND data_win_eventdata_commandLine:/.* \/[Ff].*/ AND ((data_win_eventdata_commandLine:/.*[Ll][Ii][Cc][Ee][Nn][Ss][Ii][Nn][Gg] [Cc][Oo][Rr][Ee].*/ AND data_win_eventdata_commandLine:/.*[Ee][Nn][Aa][Bb][Ll][Ee][Cc][Oo][Nn][Cc][Uu][Rr][Rr][Ee][Nn][Tt][Ss][Ee][Ss][Ss][Ii][Oo][Nn][Ss].*/) OR data_win_eventdata_commandLine:/.*[Aa][Ll][Ll][Oo][Ww][Tt][Ss][Cc][Oo][Nn][Nn][Ee][Cc][Tt][Ii][Oo][Nn][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ff][Dd][Ee][Nn][Yy][Tt][Ss][Cc][Oo][Nn][Nn][Ee][Cc][Tt][Ii][Oo][Nn][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ff][Ee][Nn][Aa][Bb][Ll][Ee][Ww][Ii][Nn][Ss][Tt][Aa][Tt][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ff][Ss][Ii][Nn][Gg][Ll][Ee][Ss][Ee][Ss][Ss][Ii][Oo][Nn][Pp][Ee][Rr][Uu][Ss][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Ii][Dd][Ll][Ee][Ww][Ii][Nn][Ss][Tt][Aa][Tt][Ii][Oo][Nn][Pp][Oo][Oo][Ll][Cc][Oo][Uu][Nn][Tt].*/ OR data_win_eventdata_commandLine:/.*[Mm][Aa][Xx][Ii][Nn][Ss][Tt][Aa][Nn][Cc][Ee][Cc][Oo][Uu][Nn][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy][Ll][Aa][Yy][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Tt][Ss][Aa][Dd][Vv][Ee][Rr][Tt][Ii][Ss][Ee].*/ OR data_win_eventdata_commandLine:/.*[Tt][Ss][Aa][Pp][Pp][Cc][Oo][Mm][Pp][Aa][Tt].*/ OR data_win_eventdata_commandLine:/.*[Tt][Ss][Ee][Nn][Aa][Bb][Ll][Ee][Dd].*/ OR data_win_eventdata_commandLine:/.*[Tt][Ss][Uu][Ss][Ee][Rr][Ee][Nn][Aa][Bb][Ll][Ee][Dd].*/ OR data_win_eventdata_commandLine:/.*[Ww][Ii][Nn][Ss][Tt][Aa][Tt][Ii][Oo][Nn][Ss]\\[Rr][Dd][Pp]-[Tt][Cc][Pp].*/) AND _exists_:data_win_eventdata_commandLine AND NOT (data_win_eventdata_commandLine:/.*[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy][Ll][Aa][Yy][Ee][Rr].*/ AND data_win_eventdata_commandLine:/.*02.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 01aeb693-138d-49d2-9403-c4f52d7d3d62
    name: RDP Connection Allowed Via Netsh.EXE
    reason: firewall opening is typically paired with enabling RDP in the registry
  - id: ffa28e60-bdb1-46e0-9f82-05f7a61cc06e
    name: User Added to Remote Desktop Users Group
    reason: granting a user RDP access completes the enablement
  - id: 4b8f6d3a-9c5e-4f2a-a7d8-6b9c3e5f2a8d
    name: RDP Enable or Disable via Win32_TerminalServiceSetting WMI Class
    reason: alternative method of enabling RDP
  - id: 57c4bf16-227f-4394-8ec7-1b745ee061c3
    name: Firewall Disabled via Netsh.EXE
    reason: firewall disabled to allow inbound RDP
  - id: cd219ff3-fa99-45d4-8380-a7d15116c6dc
    name: New User Created Via Net.EXE
    reason: backdoor account created to use the enabled RDP
  - id: 782d6f3e-4c5d-4b8c-92a3-1d05fed72e63
    name: RDP Port Forwarding Rule Added Via Netsh.EXE
    reason: RDP exposure or pivot via portproxy
  - id: f38ce0b9-5e97-4b47-a211-7dc8d8b871da
    name: Potential RDP Tunneling Via Plink
    reason: RDP tunnelled out when direct exposure is blocked
  - id: 954f0af7-62dd-418f-b3df-a84bc2c7a774
    name: New Remote Desktop Connection Initiated Via Mstsc.EXE
    reason: outbound RDP hops from this host as lateral movement
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Firewall changes allowing RDP
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Nn][Ee][Tt][Ss][Hh]|[Nn]ew\-[Nn]et[Ff]irewall[Rr]ule|[Ee]nable\-[Nn]et[Ff]irewall[Rr]ule).*/ AND data_win_eventdata_commandLine:/.*([Rr][Dd][Pp]|[Rr]emote [Dd]esktop|3389).*/
    pivot_on: host
    window: 4h
  - name: Account creation / RDP group membership
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Nn][Ee][Tt]1? +([Uu][Ss][Ee][Rr]|[Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp]).*/ AND data_win_eventdata_commandLine:/.*(\/[Aa][Dd][Dd]|[Rr]emote [Dd]esktop [Uu]sers).*/
    pivot_on: host
    window: 4h
  - name: Terminal Server registry values set
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*([Tt]erminal [Ss]erver|[Ww]inStations).*/
    pivot_on: host
    window: 4h
  - name: Port forwarding or tunnelling of 3389
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*3389.*/ AND (data_win_eventdata_commandLine:/.*[Pp]ortproxy.*/ OR data_win_eventdata_commandLine:/.*[Pp][Ll][Ii][Nn][Kk].*/ OR data_win_eventdata_commandLine:/.* \-[Rr] .*/)
    pivot_on: host
    window: 6h
