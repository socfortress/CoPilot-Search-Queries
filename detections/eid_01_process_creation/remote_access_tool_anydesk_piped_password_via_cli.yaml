name: Remote Access Tool - AnyDesk Piped Password Via CLI
id: b1377339-fda6-477a-b455-ac0923f9ec2c
version: 1
schema_version: "1.0"
date: "2023-03-05"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: b1377339-fda6-477a-b455-ac0923f9ec2c
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects piping the password to an anydesk instance via CMD and the
  '--set-password' flag. MITRE ATT&CK: T1219.002.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*/c *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*echo *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*.exe --set-password*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches '*/c
  *'; data_win_eventdata_commandLine matches '*echo *';
  data_win_eventdata_commandLine matches '*.exe --set-password*'.

known_false_positives: >
  Legitimate piping of the password to anydesk. Some FP could occur with similar
  tools that uses the same command line '--set-password'. Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://redcanary.com/blog/misbehaving-rats/
  - https://attack.mitre.org/techniques/T1219/002/

response:
  message: >
    Remote Access Tool - AnyDesk Piped Password Via CLI detected on host
    $agent_name$. Matched data_win_eventdata_commandLine:
    $data_win_eventdata_commandLine$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1219.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1219.002
  custom_tags:
    - anydesk
    - piped
    - password
    - process_creation
    - sysmon
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*\/[Cc] .*/ AND data_win_eventdata_commandLine:/.*[Ee][Cc][Hh][Oo] .*/ AND data_win_eventdata_commandLine:/.*\.[Ee][Xx][Ee] --[Ss][Ee][Tt]-[Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 114e7f1c-f137-48c8-8f54-3088c24ce4b9
    name: Remote Access Tool - AnyDesk Silent Installation
    reason: Unattended password setting follows a silent install of AnyDesk; same install chain.
  - id: 530a6faa-ff3d-4022-b315-50828e77eef5
    name: Anydesk Remote Access Software Service Installation
    reason: AnyDesk service registered for persistence around the time the password is set.
  - id: 0b9ad457-2554-44c1-82c2-d56a99c42377
    name: Anydesk Temporary Artefact
    reason: user.conf/system.conf are written when the password and unattended config are applied.
  - id: d58ba5c6-0ed7-4b9d-a433-6878379efda9
    name: Remote Access Tool - AnyDesk Incoming Connection
    reason: Once the password is set, the operator connects inbound to use it.
  - id: 065b00ca-5d5c-4557-ac95-64a6d0b64d86
    name: Remote Access Tool - Anydesk Execution From Suspicious Folder
    reason: Dropped AnyDesk binary running from a user-writable path.
  - id: 2d367498-5112-4ae5-a06a-96e7bc33a211
    name: Suspicious Binary Writes Via AnyDesk
    reason: AnyDesk file transfer used to drop tools after access is gained.
  - id: b52e84a3-029e-4529-b09b-71d19dd27e94
    name: Remote Access Tool - AnyDesk Execution
    reason: Underlying AnyDesk process execution accompanying the CLI call.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: AnyDesk executions and CLI flags
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Aa][Nn][Yy][Dd][Ee][Ss][Kk].*/
    pivot_on: host
    window: 4h
  - name: AnyDesk config files written
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Aa][Nn][Yy][Dd][Ee][Ss][Kk]\\.*\.[Cc][Oo][Nn][Ff].*/
    pivot_on: host
    window: 4h
  - name: AnyDesk service installs
    query: data_win_system_eventID:"7045" AND data_win_eventdata_serviceName:/.*[Aa][Nn][Yy][Dd][Ee][Ss][Kk].*/
    pivot_on: host
    window: 24h
  - name: AnyDesk relay DNS lookups
    query: data_win_system_eventID:"22" AND (data_win_eventdata_queryName:/.*[Aa][Nn][Yy][Dd][Ee][Ss][Kk]\.[Cc][Oo][Mm]/)
    pivot_on: host
    window: 4h
  - name: Local account creation or admin-group add
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Nn][Ee][Tt]1? +([Uu][Ss][Ee][Rr]|[Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp]).*\/[Aa][Dd][Dd].*/
    pivot_on: host
    window: 4h
