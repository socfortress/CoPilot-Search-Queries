correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: fadb84f0-4e84-4f6d-a1ce-9ef2bffb6ccd
    name: Cloudflared Portable Execution
    reason: Quick tunnels are usually run from a portable binary dropped in a user-writable folder.
  - id: 9a019ffc-3580-4c9d-8d87-079f7e8d3fd4
    name: Cloudflared Tunnel Execution
    reason: Attackers may graduate from an ad-hoc quick tunnel to a persistent named tunnel.
  - id: 7050bba1-1aed-454e-8f73-3f46f09ce56a
    name: Cloudflared Tunnel Connections Cleanup
    reason: Tunnel cleanup indicates the same operator managing cloudflared tunnels.
  - id: 32e0baea-b3f1-11eb-a2ce-acde48001122
    name: Detect RClone Command-Line Usage
    reason: Akira-style intrusions pair a tunnel with rclone to exfiltrate data over the established channel.
  - id: ccad96d7-a48c-4f13-8b9c-9f6a31cba454
    name: Detect Remote Access Software Usage FileInfo
    reason: Actors who stage cloudflared usually layer other remote-access tooling on the same host as redundant access.
  - id: cf93e05e-d798-4d9e-b522-b0248dc61eaf
    name: HackTool - SharpChisel Execution
    reason: Another reverse-tunnel tool commonly deployed alongside or instead of cloudflared.
  - id: 327f48c1-a6db-4eb8-875a-f6981f1b0183
    name: Port Forwarding Activity Via SSH.EXE
    reason: Alternative tunnelling method used by the same operators as a fallback to cloudflared.
  - id: 21dd6d38-2b18-4453-9404-a0fe4a0cc288
    name: Curl Download And Execute Combination
    reason: cloudflared.exe is usually pulled down from GitHub with curl before it is run.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Quick tunnel command lines targeting local services
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Tt][Uu][Nn][Nn][Ee][Ll].*-[Uu][Rr][Ll].*(3389|445|22|5985|8080|80|443|[Ll][Oo][Cc][Aa][Ll][Hh][Oo][Ss][Tt]).*/
    pivot_on: host
    window: 6h
  - name: Bulk transfer or archiving tools
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*([Rr][Cc][Ll][Oo][Nn][Ee]|[Ww][Ii][Nn][Rr][Aa][Rr]|7[Zz]).*/ OR data_win_eventdata_image:/.*([Rr][Cc][Ll][Oo][Nn][Ee]|7[Zz]).*/)
    pivot_on: host
    window: 6h
  - name: Cloudflared network connections to Cloudflare edge
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*[Cc][Ll][Oo][Uu][Dd][Ff][Ll][Aa][Rr][Ee].*/ OR data_win_eventdata_destinationHostname:/.*([Tt][Rr][Yy])?[Cc][Ll][Oo][Uu][Dd][Ff][Ll][Aa][Rr][Ee].*/ OR data_win_eventdata_destinationPort:"7844")
    pivot_on: host
    window: 6h
  - name: DNS lookups for trycloudflare and argotunnel
    query: data_win_system_eventID:"22" AND data_win_eventdata_queryName:/.*([Tt][Rr][Yy][Cc][Ll][Oo][Uu][Dd][Ff][Ll][Aa][Rr][Ee]|[Aa][Rr][Gg][Oo][Tt][Uu][Nn][Nn][Ee][Ll]|[Cc][Ll][Oo][Uu][Dd][Ff][Ll][Aa][Rr][Ee]).*/
    pivot_on: host
    window: 6h
