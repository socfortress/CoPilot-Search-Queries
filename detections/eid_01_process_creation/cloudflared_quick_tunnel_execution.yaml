status: experimental
type: TTP

description: >
  Detects creation of an ad-hoc Cloudflare Quick Tunnel, which can be used to
  tunnel local services such as HTTP, RDP, SSH and SMB. The free TryCloudflare
  Quick Tunnel will generate a random subdomain on trycloudflare[.]com,
  following a call to api[.]trycloudflare[.]com. The tool has been observed in
  use by threat groups including Akira ransomware. MITRE ATT&CK: T1090.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\cloudflared.exe"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\cloudflared-windows-386.exe"
                                case_insensitive: true
                          - wildcard:
