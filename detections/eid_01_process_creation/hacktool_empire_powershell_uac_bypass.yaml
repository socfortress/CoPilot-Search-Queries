name: HackTool - Empire PowerShell UAC Bypass
id: 3268b746-88d8-4cd3-bffc-30077d02c787
version: 1
schema_version: "1.0"
date: "2023-02-21"
author: Ecco
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 3268b746-88d8-4cd3-bffc-30077d02c787
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: production
type: TTP

description: >
  Detects some Empire PowerShell UAC bypass methods. MITRE ATT&CK: T1548.002.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -NoP -NonI -w Hidden -c $x=$((gp HKCU:Software\\\\Microsoft\\\\Windows Update).Update)*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -NoP -NonI -c $x=$((gp HKCU:Software\\\\Microsoft\\\\Windows Update).Update);*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches '*
  -NoP -NonI -w Hidden -c $x=$((gp HKCU:Software\Microsoft\Windows
  Update).Update)*'; data_win_eventdata_commandLine matches '* -NoP -NonI -c
  $x=$((gp HKCU:Software\Microsoft\Windows Update).Update);*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/EmpireProject/Empire/blob/e37fb2eef8ff8f5a0a689f1589f424906fe13055/data/module_source/privesc/Invoke-EventVwrBypass.ps1#L64
  - https://github.com/EmpireProject/Empire/blob/e37fb2eef8ff8f5a0a689f1589f424906fe13055/data/module_source/privesc/Invoke-FodHelperBypass.ps1#L64
  - https://attack.mitre.org/techniques/T1548/002/

response:
  message: >
    HackTool - Empire PowerShell UAC Bypass detected on host $agent_name$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1548.002
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1548.002
  custom_tags:
    - hacktool
    - empire
    - powershell
    - process_creation
    - sysmon
    - privilege_escalation
    - car_2019_04_001
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.* -[Nn][Oo][Pp] -[Nn][Oo][Nn][Ii] -[Ww] [Hh][Ii][Dd][Dd][Ee][Nn] -[Cc] \$[Xx]=\$\(\([Gg][Pp] [Hh][Kk][Cc][Uu]:[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Uu][Pp][Dd][Aa][Tt][Ee]\)\.[Uu][Pp][Dd][Aa][Tt][Ee]\).*/ OR data_win_eventdata_commandLine:/.* -[Nn][Oo][Pp] -[Nn][Oo][Nn][Ii] -[Cc] \$[Xx]=\$\(\([Gg][Pp] [Hh][Kk][Cc][Uu]:[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Uu][Pp][Dd][Aa][Tt][Ee]\)\.[Uu][Pp][Dd][Aa][Tt][Ee]\);.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 79f4ede3-402e-41c8-bc3e-ebbf5f162581
    name: HackTool - Empire PowerShell Launch Parameters
    reason: The initial Empire stager launch that normally precedes the privilege escalation.
  - id: 56c217c3-2de2-479b-990f-5c109ba8458f
    name: HackTool - Default PowerSploit/Empire Scheduled Task Creation
    reason: Empire persistence frequently follows elevation.
  - id: 10152a7b-b566-438f-a33c-390b607d1c8d
    name: Potential EmpireMonkey Activity
    reason: Other Empire tradecraft from the same operator.
  - id: e32d4572-9826-4738-b651-95fa63747e8a
    name: Base64 Encoded PowerShell Command Detected
    reason: Elevated Empire payloads are typically launched as base64 PowerShell.
  - id: 7f741dcf-fc22-4759-87b4-9ae8376676a2
    name: Bypass UAC via Fodhelper.exe
    reason: Fodhelper hijack is a sibling UAC bypass an operator may try on the same host.
  - id: 63e4f530-65dc-49cc-8f80-ccfa95c69d43
    name: UAC Bypass Using EventVwr
    reason: Eventvwr hijack is another Empire-style bypass that may appear on the same host.
  - id: d38d2fa4-98e6-4a24-aff1-410b0c9ad177
    name: HackTool - UACMe Akagi Execution
    reason: If Empire's method is blocked, operators try UACMe for elevation.
  - id: 24357373-078f-44ed-9ac4-6d334a668a11
    name: Direct Autorun Keys Modification
    reason: Elevated persistence via Run keys is a common next step.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Registry write of Empire UAC payload (HKCU Windows Update)
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\([Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee])\\([Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt])\\([Ww][Ii][Nn][Dd][Oo][Ww][Ss])\\([Uu][Pp][Dd][Aa][Tt][Ee]).*/
    pivot_on: host
    window: 4h
  - name: Auto-elevate registry hijack keys
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND data_win_eventdata_targetObject:/.*(ms-settings|mscfile|exefile)\\([Ss][Hh][Ee][Ll][Ll])\\([Oo][Pp][Ee][Nn])\\([Cc][Oo][Mm][Mm][Aa][Nn][Dd]).*/
    pivot_on: host
    window: 4h
  - name: High-integrity encoded PowerShell after bypass
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_integrityLevel:/[Hh][Ii][Gg][Hh]/ OR data_win_eventdata_integrityLevel:/[Ss][Yy][Ss][Tt][Ee][Mm]/) AND data_win_eventdata_commandLine:/.*-([Ee][Nn][Cc]).*/
    pivot_on: host
    window: 4h
  - name: Auto-elevating binaries spawning shells
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\([Ee][Vv][Ee][Nn][Tt][Vv][Ww][Rr]|[Ff][Oo][Dd][Hh][Ee][Ll][Pp][Ee][Rr]|[Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr][Dd][Ee][Ff][Aa][Uu][Ll][Tt][Ss]|[Ss][Dd][Cc][Ll][Tt]|[Ww][Ss][Rr][Ee][Ss][Ee][Tt]|[Cc][Mm][Ss][Tt][Pp])\.([Ee][Xx][Ee])/ AND (data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/)
    pivot_on: host
    window: 4h
  - name: LSASS access shortly after elevation
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_grantedAccess:/.*0[Xx]1[Ff][Ff][Ff][Ff][Ff].*/ OR data_win_eventdata_grantedAccess:/.*0[Xx]1010.*/ OR data_win_eventdata_grantedAccess:/.*0[Xx]1410.*/ OR data_win_eventdata_grantedAccess:/.*0[Xx]1438.*/ OR data_win_eventdata_grantedAccess:/.*0[Xx]143[Aa].*/)
    pivot_on: host
    window: 4h
