name: Suspicious SYSVOL Domain Group Policy Access
id: 05f3c945-dcc8-4393-9f3d-af65077a8f86
version: 1
schema_version: "1.0"
date: "2022-01-07"
author: Markus Neis, Jonhnathan Ribeiro, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 05f3c945-dcc8-4393-9f3d-af65077a8f86
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects Access to Domain Group Policies stored in SYSVOL. MITRE ATT&CK:
  T1552.006.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*\\\\SYSVOL\\\\*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*\\\\policies\\\\*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*\SYSVOL\*'; data_win_eventdata_commandLine matches '*\policies\*'.

known_false_positives: >
  Administrative activity. Baseline expected activity in your environment and
  tune this detection before relying on it for automated response.

references:
  - https://adsecurity.org/?p=2288
  - https://www.hybrid-analysis.com/sample/f2943f5e45befa52fb12748ca7171d30096e1d4fc3c365561497c618341299d5?environmentId=100
  - https://attack.mitre.org/techniques/T1552/006/

response:
  message: >
    Suspicious SYSVOL Domain Group Policy Access detected on host $agent_name$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1552.006
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1552.006
  custom_tags:
    - sysvol
    - domain
    - group
    - process_creation
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*\\[Ss][Yy][Ss][Vv][Oo][Ll]\\.*/ AND data_win_eventdata_commandLine:/.*\\[Pp][Oo][Ll][Ii][Cc][Ii][Ee][Ss]\\.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 91a2c315-9ee6-4052-a853-6f6a8238f90d
    name: Findstr GPP Passwords
    reason: Hunting SYSVOL policies for cpassword in Groups.xml is the usual purpose of this access; a hit confirms credential harvesting.
  - id: 855bc8b5-2ae8-402e-a9ed-b889e6df1900
    name: Copy From Or To Admin Share Or Sysvol Folder
    reason: Copying policy files out of SYSVOL is the staging step right after browsing them.
  - id: ada4b0c4-758b-46ac-9033-9004613a150d
    name: Modify Group Policy Settings
    reason: Write access to policies after reading them suggests GPO tampering for persistence or evasion.
  - id: e56d3073-83ff-4021-90fe-c658e0709e72
    name: Gpresult Display Group Policy Information
    reason: Policy reconnaissance often accompanies SYSVOL browsing.
  - id: 5cc90652-4cbd-4241-aa3b-4b462fa5a248
    name: Potential Recon Activity Via Nltest.EXE
    reason: Domain and DC discovery precedes locating the SYSVOL share to read.
  - id: 41243735-89a7-4c83-bcdd-570aa78f00a1
    name: Domain Controller Discovery with Nltest
    reason: Finding the DC is a prerequisite to addressing its SYSVOL path.
  - id: 455b9d50-15a1-4b99-853f-8d37655a4c1b
    name: PUA - Suspicious ActiveDirectory Enumeration Via AdFind.EXE
    reason: AD enumeration tooling commonly runs in the same recon burst.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: GPP password hunting in commands
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Cc]password.*/ OR /.*[Gg]roups\.xml.*/ OR /.*[Ss]cheduledtasks\.xml.*/ OR /.*[Dd]atasources\.xml.*/)
    pivot_on: host
    window: 4h
  - name: SYSVOL copy or search commands
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ff]indstr.*/ OR /.*[Xx]copy.*/ OR /.*[Rr]obocopy.*/ OR /.*[Cc]opy .*/) AND data_win_eventdata_commandLine:/.*[Ss][Yy][Ss][Vv][Oo][Ll].*/
    pivot_on: host
    window: 4h
  - name: Domain discovery tooling
    query: data_win_system_eventID:1 AND data_win_eventdata_image:(/.*\\[Nn][Ll][Tt][Ee][Ss][Tt]\.exe/ OR /.*\\[Dd][Ss][Qq][Uu][Ee][Rr][Yy]\.exe/ OR /.*\\[Aa][Dd][Ff][Ii][Nn][Dd]\.exe/ OR /.*\\[Gg][Pp][Rr][Ee][Ss][Uu][Ll][Tt]\.exe/)
    pivot_on: host
    window: 2h
  - name: PowerShell GPO or AD queries
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Gg]et-GPO.*/ OR /.*[Gg]et-GPPassword.*/ OR /.*[Gg]et-DomainGPO.*/ OR /.*[Gg]et-ADComputer.*/)
    pivot_on: host
    window: 4h
