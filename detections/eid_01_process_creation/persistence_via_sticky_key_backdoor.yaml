name: Persistence Via Sticky Key Backdoor
id: 1070db9a-3e5d-412e-8e7b-7183b616e1b3
version: 1
schema_version: "1.0"
date: "2023-03-07"
author: Sreeman
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 1070db9a-3e5d-412e-8e7b-7183b616e1b3
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  By replacing the sticky keys executable with the local admins CMD executable,
  an attacker is able to access a privileged windows console session without
  authenticating to the system. When the sticky keys are "activated" the
  privilleged shell is launched. MITRE ATT&CK: T1546.008.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*copy *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*/y *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*C:\\\\windows\\\\system32\\\\cmd.exe C:\\\\windows\\\\system32\\\\sethc.exe*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches '*copy
  *'; data_win_eventdata_commandLine matches '*/y *';
  data_win_eventdata_commandLine matches '*C:\windows\system32\cmd.exe
  C:\windows\system32\sethc.exe*'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.fireeye.com/blog/threat-research/2017/03/apt29_domain_frontin.html
  - https://www.clearskysec.com/wp-content/uploads/2020/02/ClearSky-Fox-Kitten-Campaign-v1.pdf
  - https://learn.microsoft.com/en-us/archive/blogs/jonathantrull/detecting-sticky-key-backdoors
  - https://attack.mitre.org/techniques/T1546/008/

response:
  message: >
    Persistence Via Sticky Key Backdoor detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1546.008
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1546.008
  custom_tags:
    - persistence
    - sticky
    - backdoor
    - process_creation
    - sysmon
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Cc][Oo][Pp][Yy] .*/ AND data_win_eventdata_commandLine:/.*\/[Yy] .*/ AND data_win_eventdata_commandLine:/.*[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Cc][Mm][Dd]\.[Ee][Xx][Ee] [Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ss][Ee][Tt][Hh][Cc]\.[Ee][Xx][Ee].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 2fdefcb3-dbda-401e-ae23-f0db027628bc
    name: Sticky Key Like Backdoor Execution
    reason: 'Follow-on: winlogon spawning cmd at the lock screen proves the sethc replacement was triggered and used.'
  - id: ae215552-081e-44c7-805f-be16f975c8a2
    name: Suspicious Debugger Registration Cmdline
    reason: 'Sibling technique: IFEO Debugger values hijack the same accessibility binaries and are often set together.'
  - id: e9b61244-893f-427c-b287-3e708f321c6b
    name: Potential Privilege Escalation Using Symlink Between Osk and Cmd
    reason: Alternative accessibility-binary-to-cmd hijack giving the same lock-screen shell.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Winlogon-spawned shells (lock-screen backdoor use)
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:*\\winlogon.exe AND data_win_eventdata_image:(*\\cmd.exe OR *\\powershell.exe)
    pivot_on: host
    window: 24h
  - name: IFEO Debugger set via command line
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:*Image\ File\ Execution\ Options* AND data_win_eventdata_commandLine:*Debugger*
    pivot_on: host
    window: 4h
  - name: Takeown/icacls on accessibility binaries
    query: data_win_system_eventID:1 AND data_win_eventdata_image:(*\\takeown.exe OR *\\icacls.exe) AND data_win_eventdata_commandLine:(*sethc* OR *utilman* OR *osk.exe* OR *narrator*)
    pivot_on: host
    window: 4h
  - name: Local account or admin group additions
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(*user*\ /add* OR *localgroup*administrators*/add*)
    pivot_on: host
    window: 24h
