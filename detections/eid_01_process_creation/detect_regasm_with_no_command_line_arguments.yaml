name: Detect Regasm with no Command Line Arguments
id: c3bc1430-04e7-4178-835f-047d8e6e97df
version: 1
schema_version: "1.0"
date: "2026-04-21"
author: SOCFortress LLC
status: production
type: TTP

description: >
  This analytic detects instances of regasm.exe running without any command line
  arguments (where the command line consists solely of the binary path, with or
  without surrounding quotes). This behavior typically indicates process injection,
  where another process manipulates regasm.exe by spawning it in a suspended state
  and injecting malicious code. regasm.exe is a Microsoft .NET Framework Assembly
  Registration Tool and should normally always be invoked with an assembly file
  argument. A bare invocation with no arguments is highly anomalous and may signal
  an attempt to evade detection or execute malicious code via process hollowing. If
  confirmed malicious, attackers could achieve arbitrary code execution, potentially
  leading to privilege escalation, persistence, or access to sensitive information.
  Investigate network connections, parallel processes, and suspicious module loads
  for further context.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image: "*regasm.exe"
              - wildcard:
                  data_win_eventdata_originalFileName: "RegAsm.exe"
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine: "*regasm.exe\\\\\""
              - wildcard:
                  data_win_eventdata_commandLine: "*regasm.exe"
              - wildcard:
                  data_win_eventdata_commandLine: "*regasm"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_parentCommandLine
    - data_win_eventdata_user
    - data_win_eventdata_processId
    - data_win_eventdata_processGuid
    - data_win_eventdata_parentProcessId
    - data_win_eventdata_parentProcessGuid
    - data_win_eventdata_hashes
    - data_win_eventdata_integrityLevel

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-21 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-21 23:59:59.999"

how_to_implement: >
  This detection requires Sysmon EventID 1 (Process Creation) logs to be forwarded
  from Windows endpoints to Wazuh Indexer. Ensure Sysmon is deployed with a
  configuration that captures process creation events including Image,
  OriginalFileName, and CommandLine fields (SwiftOnSecurity or Olaf Hartong Sysmon
  modular config recommended). The detection identifies regasm.exe invocations where
  the command line is exactly the process path (no arguments), which is extremely
  unusual for legitimate use since regasm.exe requires an assembly argument to
  function normally. The wildcard patterns account for Wazuh's ingestion format
  where quoted command lines are stored with escaped quotes and backslashes.

known_false_positives: >
  Although unlikely, limited instances of regasm.exe with no command line arguments
  may legitimately occur during manual testing, help/usage queries, or unusual
  installer behavior. Filter based on endpoint usage, parent process lineage, or
  user context as needed. Consider allow-listing specific developer workstations
  where this behavior is expected.

references:
  - https://attack.mitre.org/techniques/T1218/009/
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1218.009/T1218.009.md
  - https://lolbas-project.github.io/lolbas/Binaries/Regasm/

response:
  message: >
    The process regasm.exe ($data_win_eventdata_image$) was spawned by
    $data_win_eventdata_parentImage$ without any command-line arguments on endpoint
    $agent_name$ by user $data_win_eventdata_user$. This behavior is highly
    indicative of process injection or process hollowing attempts. Command line:
    $data_win_eventdata_commandLine$
  risk_score: 72
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 60
    - field: data_win_eventdata_user
      type: user
      score: 60
  threat_objects:
    - field: data_win_eventdata_image
      type: process_name
    - field: data_win_eventdata_parentImage
      type: parent_process_name
    - field: data_win_eventdata_commandLine
      type: command_line

tags:
  analytic_story:
    - Suspicious Regsvcs Regasm Activity
    - Living Off The Land
    - Handala Wiper
    - Void Manticore
  asset_type: Endpoint
  mitre_attack_id:
    - T1218.009
  custom_tags:
    - regasm
    - lolbin
    - process_injection
    - process_hollowing
    - dotnet_abuse
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*regasm\.exe.*/ OR data_win_eventdata_originalFileName:/RegAsm\.exe/) AND data_win_eventdata_commandLine:/.*regasm\.exe\\\"/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 72170ec5-f7d2-42f5-aefb-2b8be6aad15f
    name: Detect Regasm Spawning a Process
    reason: A hollowed regasm often goes on to spawn children, which confirms code execution.
  - id: 6b74d578-a02e-4e94-a0d1-39440d0bf254
    name: Detect Regsvcs with No Command Line Arguments
    reason: Same bare-invocation hollowing pattern against regsvcs, often used interchangeably.
  - id: 85d23b42-9a9d-4f8f-b3d7-d2733c1d58f5
    name: HackTool - HollowReaper Execution
    reason: Hollowing tooling that spawns a suspended legitimate binary exactly like this.
  - id: d8937fe7-42d5-4b4d-8178-e089c908f63f
    name: Potential Pikabot Hollowing Activity
    reason: Known malware hollowing into legitimate processes yields this bare launch.
  - id: cc368ed0-2411-45dc-a222-510ace303cb2
    name: Potentially Suspicious Execution Of Regasm/Regsvcs From Uncommon Location
    reason: Regasm run from an odd path suggests a dropped loader started it.
  - id: 66d31e5f-52d6-40a4-9615-002d3789a119
    name: Remote Thread Creation By Uncommon Source Image
    reason: Remote thread creation from an uncommon source image is the injection step into the suspended process.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Injection into regasm or regsvcs
    query: (data_win_system_eventID:"8" OR data_win_system_eventID:"10") AND (data_win_eventdata_targetImage:/.*[Rr][Ee][Gg][Aa][Ss][Mm]\.exe/ OR data_win_eventdata_targetImage:/.*[Rr][Ee][Gg][Ss][Vv][Cc][Ss]\.exe/)
    pivot_on: host
    window: 2h
  - name: Regasm outbound connections (C2)
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Rr][Ee][Gg][Aa][Ss][Mm]\.exe/
    pivot_on: host
    window: 2h
  - name: Regasm DNS queries
    query: data_win_system_eventID:"22" AND data_win_eventdata_image:/.*[Rr][Ee][Gg][Aa][Ss][Mm]\.exe/
    pivot_on: host
    window: 2h
  - name: Loader that launched regasm
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Rr][Ee][Gg][Aa][Ss][Mm]\.exe/ AND (data_win_eventdata_parentImage:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ OR data_win_eventdata_parentImage:/.*[Ww][Ss][Cc][Rr][Ii][Pp][Tt].*/ OR data_win_eventdata_parentImage:/.*[Cc][Ss][Cc][Rr][Ii][Pp][Tt].*/ OR data_win_eventdata_parentImage:/.*[Mm][Ss][Hh][Tt][Aa].*/ OR data_win_eventdata_parentImage:/.*[Ww][Ii][Nn][Ww][Oo][Rr][Dd].*/)
    pivot_on: host
    window: 2h
  - name: Persistence after injection
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss].*\/[Cc][Rr][Ee][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Gg].* [Aa][Dd][Dd] .*[Rr][Uu][Nn].*/)
    pivot_on: host
    window: 4h
