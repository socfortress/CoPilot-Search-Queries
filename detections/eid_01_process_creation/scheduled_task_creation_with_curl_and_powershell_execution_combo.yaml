name: Scheduled Task Creation with Curl and PowerShell Execution Combo
id: 1d174d38-8fda-4081-a9b6-56d9763c0cd8
version: 1
schema_version: "1.0"
date: "2025-02-05"
author: Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 1d174d38-8fda-4081-a9b6-56d9763c0cd8
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the creation of a scheduled task using schtasks.exe, potentially in
  combination with curl for downloading payloads and PowerShell for executing
  them. This facilitates executing malicious payloads or connecting with C&C
  server persistently without dropping the malware sample on the host. MITRE
  ATT&CK: T1053.005, T1218, T1105.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\schtasks.exe"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -create *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /create *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* –create *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* —create *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* ―create *"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*curl *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*http*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*-o*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*powershell*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\schtasks.exe'; data_win_eventdata_commandLine matches '* -create *';
  data_win_eventdata_commandLine matches '* /create *', among other conditions.

known_false_positives: >
  Legitimate use of schtasks for administrative purposes.. Automation scripts
  combining curl and PowerShell in controlled environments. Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://tria.ge/241015-l98snsyeje/behavioral2
  - https://attack.mitre.org/techniques/T1053/005/
  - https://attack.mitre.org/techniques/T1218/
  - https://attack.mitre.org/techniques/T1105/

response:
  message: >
    Scheduled Task Creation with Curl and PowerShell Execution Combo detected on
    host $agent_name$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. Matched data_win_eventdata_commandLine:
    $data_win_eventdata_commandLine$. MITRE ATT&CK: T1053.005, T1218, T1105
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1053.005
    - T1218
    - T1105
  custom_tags:
    - scheduled
    - powershell
    - combo
    - process_creation
    - sysmon
    - privilege_escalation
    - execution
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.* -[Cc][Rr][Ee][Aa][Tt][Ee] .*/ OR data_win_eventdata_commandLine:/.* \/[Cc][Rr][Ee][Aa][Tt][Ee] .*/ OR data_win_eventdata_commandLine:/.* –[Cc][Rr][Ee][Aa][Tt][Ee] .*/ OR data_win_eventdata_commandLine:/.* —[Cc][Rr][Ee][Aa][Tt][Ee] .*/ OR data_win_eventdata_commandLine:/.* ―[Cc][Rr][Ee][Aa][Tt][Ee] .*/) AND data_win_eventdata_commandLine:/.*[Cc][Uu][Rr][Ll] .*/ AND data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp].*/ AND data_win_eventdata_commandLine:/.*-[Oo].*/ AND data_win_eventdata_commandLine:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 21dd6d38-2b18-4453-9404-a0fe4a0cc288
    name: Curl Download And Execute Combination
    reason: Same curl-then-execute chain observed outside the task.
  - id: 9cc85849-3b02-4cb5-b371-3a1ff54f2218
    name: File Download From IP URL Via Curl.EXE
    reason: Payload URL is often a raw IP; confirms the download leg.
  - id: cb9cc1d1-e84e-4bdc-b7ad-c31b1b7908ec
    name: Insecure Transfer Via Curl.EXE
    reason: Plain-HTTP curl download of staging payloads.
  - id: ee18ed37-0802-4268-9435-b3b91aaa18db
    name: PowerShell - Connect To Internet With Hidden Window
    reason: Task-run PowerShell stager typically hidden and connecting out.
  - id: e32d4572-9826-4738-b651-95fa63747e8a
    name: Base64 Encoded PowerShell Command Detected
    reason: Execution leg often uses encoded PowerShell.
  - id: 81325ce1-be01-4250-944f-b4789644556f
    name: Schedule Task Creation From Env Variable Or Potentially Suspicious Path Via Schtasks.EXE
    reason: Same persistence primitive via suspicious paths.
  - id: 9f8573c9-22b4-40e3-89c1-72bc2b8d49ab
    name: Scheduled Task Creation Masquerading as System Processes
    reason: Alternate schtasks persistence by the same actor.
  - id: 89ca78fd-b37c-4310-b3d3-81a023f83936
    name: Schtasks Creation Or Modification With SYSTEM Privileges
    reason: Persistent downloader task likely runs as SYSTEM.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: curl downloads with output file
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Cc]url\.exe/ AND data_win_eventdata_commandLine:/.*[Hh]ttp.*/
    pivot_on: host
    window: 2h
  - name: PowerShell spawned by Task Scheduler or curl
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND (data_win_eventdata_parentImage:/.*[Ss]vchost.*/ OR data_win_eventdata_parentImage:/.*[Tt]ask[Hh]ost.*/ OR data_win_eventdata_parentImage:/.*[Cc]url.*/)
    pivot_on: host
    window: 2h
  - name: Outbound connections by curl or PowerShell
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*[Cc]url\.exe/ OR data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/)
    pivot_on: host
    window: 2h
  - name: DNS queries from curl or PowerShell
    query: data_win_system_eventID:"22" AND (data_win_eventdata_image:/.*[Cc]url\.exe/ OR data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/)
    pivot_on: host
    window: 2h
  - name: Files created by curl or PowerShell
    query: data_win_system_eventID:"11" AND (data_win_eventdata_image:/.*[Cc]url\.exe/ OR data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/) AND data_win_eventdata_targetFilename:/.*\.(exe|dll|ps1|bat|vbs|js|hta|zip)/
    pivot_on: host
    window: 2h
