    - T1059.003
    - T1059.005
    - T1059.007
    - T1218
    - T1218.001
    - T1218.010
    - T1218.011
    - T1566
    - T1566.001
  custom_tags:
    - process_creation
    - sysmon
    - execution
    - initial_access
    - stealth
  product:
