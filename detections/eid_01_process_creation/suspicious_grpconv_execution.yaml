name: Suspicious GrpConv Execution
id: f14e169e-9978-4c69-acb3-1cff8200bc36
version: 1
schema_version: "1.0"
date: "2022-05-19"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: f14e169e-9978-4c69-acb3-1cff8200bc36
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the suspicious execution of a utility to convert Windows 3.x .grp
  files or for persistence purposes by malicious software or actors. MITRE
  ATT&CK: T1547.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*grpconv.exe -o*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*grpconv -o*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*grpconv.exe -o*'; data_win_eventdata_commandLine matches '*grpconv -o*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/0gtweet/status/1526833181831200770
  - https://attack.mitre.org/techniques/T1547/

response:
  message: >
    Suspicious GrpConv Execution detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1547
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1547
  custom_tags:
    - grpconv
    - process_creation
    - sysmon
    - privilege_escalation
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Gg][Rr][Pp][Cc][Oo][Nn][Vv]\.[Ee][Xx][Ee] -[Oo].*/ OR data_win_eventdata_commandLine:/.*[Gg][Rr][Pp][Cc][Oo][Nn][Vv] -[Oo].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 24357373-078f-44ed-9ac4-6d334a668a11
    name: Direct Autorun Keys Modification
    reason: grpconv -o is abused for persistence; confirm the autorun key it leaves behind or that was set next to it.
  - id: f59c3faf-50f3-464b-9f4c-1b67ab512d99
    name: Common Autorun Keys Modification
    reason: Autorun registry writes in the same window show which persistence mechanism the actor actually landed.
  - id: de587dce-915e-4218-aac4-835ca6af6f70
    name: Potential Persistence Attempt Via Run Keys Using Reg.EXE
    reason: Actors layer reg add Run key persistence beside obscure grpconv persistence for redundancy.
  - id: 2aa0a6b4-a865-495b-ab51-c28249537b75
    name: Startup Folder File Write
    reason: Another autostart location commonly written together when persistence is being established.
  - id: 28208707-fe31-437f-9a7f-4b1108b94d2e
    name: Suspicious Startup Folder Persistence
    reason: Startup-folder persistence of a script or executable is a likely companion to this program-group trick.
  - id: 02ee49e2-e294-4d0f-9278-f5b3212fc588
    name: New RUN Key Pointing to Suspicious Folder
    reason: Confirms the persisted payload lives in a user-writable path.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Autorun registry writes
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:/.*\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\[Rr][Uu][Nn].*/ OR data_win_eventdata_targetObject:/.*\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\[Rr][Uu][Nn][Oo][Nn][Cc][Ee].*/ OR data_win_eventdata_targetObject:/.*\[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]\[Ss][Hh][Ee][Ll][Ll].*/ OR data_win_eventdata_targetObject:/.*\[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]\[Uu][Ss][Ee][Rr][Ii][Nn][Ii][Tt].*/ OR data_win_eventdata_targetObject:/.*\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Mm][Aa][Nn][Aa][Gg][Ee][Rr].*/)
    pivot_on: host
    window: 2h
  - name: Startup folder and .grp file creation
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\[Ss][Tt][Aa][Rr][Tt] [Mm][Ee][Nn][Uu]\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Ss]\[Ss][Tt][Aa][Rr][Tt][Uu][Pp]\.*/ OR data_win_eventdata_targetFilename:/.*\.[Gg][Rr][Pp].*/)
    pivot_on: host
    window: 2h
  - name: Script and LOLBin execution from writable paths (possible launcher)
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]|\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]|\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*[Aa][Pp][Pp][Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_commandLine:/.*\[Tt][Ee][Mm][Pp]\.*/ OR data_win_eventdata_commandLine:/.*[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_commandLine:/.*\[Uu][Ss][Ee][Rr][Ss]\[Pp][Uu][Bb][Ll][Ii][Cc]\.*/ OR data_win_eventdata_commandLine:/.*-[Ee][Nn][Cc].*/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/)
    pivot_on: host
    window: 2h
  - name: Child processes of grpconv
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*(\\[Gg][Rr][Pp][Cc][Oo][Nn][Vv]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 1h
  - name: Credential dumping after persistence
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*(\\[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]|\\[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]64\.[Ee][Xx][Ee]|\\[Nn][Aa][Nn][Oo][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]|\\[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee])/ OR (data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/))
    pivot_on: host
    window: 6h
