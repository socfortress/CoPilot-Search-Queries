name: Potentially Suspicious Regsvr32 HTTP/FTP Pattern
id: 867356ee-9352-41c9-a8f2-1be690d78216
version: 1
schema_version: "1.0"
date: "2023-05-26"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 867356ee-9352-41c9-a8f2-1be690d78216
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects regsvr32 execution to download/install/register new DLLs that are
  hosted on Web or FTP servers. MITRE ATT&CK: T1218.010.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\regsvr32.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "REGSVR32.EXE"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /i*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -i*"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*ftp*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*http*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\regsvr32.exe'; data_win_eventdata_originalFileName equals 'REGSVR32.EXE';
  data_win_eventdata_commandLine matches '* /i*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/mrd0x/status/1461041276514623491
  - https://twitter.com/tccontre18/status/1480950986650832903
  - https://lolbas-project.github.io/lolbas/Binaries/Regsvr32/
  - https://attack.mitre.org/techniques/T1218/010/

response:
  message: >
    Potentially Suspicious Regsvr32 HTTP/FTP Pattern detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1218.010
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218.010
  custom_tags:
    - regsvr32
    - pattern
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.* \/[Ii].*/ OR data_win_eventdata_commandLine:/.* -[Ii].*/) AND (data_win_eventdata_commandLine:/.*[Ff][Tt][Pp].*/ OR data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 070e9b80-6252-11eb-ae93-0242ac130002
    name: Detect Regsvr32 Application Control Bypass
    reason: 'Same regsvr32 scrobj.dll /i: remote-scriptlet (Squiblydoo) technique, a sibling detection.'
  - id: 2dd2c217-bf68-437a-b57c-fe9fd01d5de8
    name: Potentially Suspicious Regsvr32 HTTP IP Pattern
    reason: IP-literal variant of the same remote DLL/scriptlet load; co-fires when the host is a raw IP.
  - id: c7e91a02-d771-4a6d-a700-42587e0b1095
    name: Network Connection Initiated By Regsvr32.EXE
    reason: regsvr32 making the network connection that fetches the remote payload.
  - id: 6f0947a4-1c5e-4e0d-8ac7-53159b8f23ca
    name: Potentially Suspicious Child Process Of Regsvr32
    reason: 'Follow-on: suspicious child process spawned by regsvr32 after the payload runs.'
  - id: ab37a6ec-6068-432b-a64e-2c7bf95b1d22
    name: Scripting/CommandLine Process Spawned Regsvr32
    reason: 'Precursor: script/cmd process launching regsvr32 (macro, HTA or script delivery).'
  - id: 88a87a10-384b-4ad7-8871-2f9bf9259ce5
    name: Suspicious Regsvr32 Execution From Remote Share
    reason: Alternate remote-delivery path via UNC share for the same regsvr32 abuse.
  - id: b236190c-1c61-41e9-84b3-3fe03f6d76b0
    name: Potential Regsvr32 Commandline Flag Anomaly
    reason: Anomalous regsvr32 flag usage often accompanies obfuscated variants of this attack.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: regsvr32 network connections
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*regsvr32\.exe/
    pivot_on: host
    window: 2h
  - name: regsvr32 DNS lookups
    query: data_win_system_eventID:22 AND data_win_eventdata_image:/.*regsvr32\.exe/
    pivot_on: host
    window: 2h
  - name: regsvr32 child processes
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*regsvr32\.exe/
    pivot_on: host
    window: 2h
  - name: Delivery processes launching regsvr32
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*regsvr32\.exe/ AND data_win_eventdata_parentImage:/.*(winword|excel|powerpnt|outlook|mshta|wscript|cscript|cmd|powershell)\.exe/
    pivot_on: host
    window: 4h
  - name: Scriptlet or DLL files dropped
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\.(sct|dll|ocx|wsc)/
    pivot_on: host
    window: 4h
