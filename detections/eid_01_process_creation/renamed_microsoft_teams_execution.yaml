name: Renamed Microsoft Teams Execution
id: 88f46b67-14d4-4f45-ac2c-d66984f22191
version: 1
schema_version: "1.0"
date: "2024-07-12"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 88f46b67-14d4-4f45-ac2c-d66984f22191
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of a renamed Microsoft Teams binary.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - term:
                  data_win_eventdata_originalFileName:
                    value: "msteams.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "teams.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\msteams.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\teams.exe"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_originalFileName
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_originalFileName equals
  'msteams.exe'; data_win_eventdata_originalFileName equals 'teams.exe';
  data_win_eventdata_image matches '*\msteams.exe', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - Internal Research

response:
  message: >
    Renamed Microsoft Teams Execution detected on host $agent_name$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_originalFileName
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - renamed
    - microsoft
    - teams
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_originalFileName:/[Mm][Ss][Tt][Ee][Aa][Mm][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Tt][Ee][Aa][Mm][Ss]\.[Ee][Xx][Ee]/) AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/.*\\[Mm][Ss][Tt][Ee][Aa][Mm][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Tt][Ee][Aa][Mm][Ss]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 0ba1da6d-b6ce-4366-828c-18826c9de23e
    name: Potential Defense Evasion Via Rename Of Highly Relevant Binaries
    reason: Same masquerade-by-rename tradecraft
  - id: 36480ae1-a1cb-4eaa-a0d6-29801d7e9142
    name: Potential Defense Evasion Via Binary Rename
    reason: Generic rename mismatch seen on other binaries
  - id: d2eb17db-1d39-41dc-b57f-301f6512fa75
    name: Potentially Suspicious Command Targeting Teams Sensitive Files
    reason: Teams token/cookie theft; a renamed Teams binary is a known cover for it
  - id: 0b0cd537-fc77-4e6e-a973-e53495c1083d
    name: Renamed Office Binary Execution
    reason: Sibling trusted-app masquerade, likely same actor tooling
  - id: b6e04788-29e1-4557-bb14-77f761848ab8
    name: Potentially Suspicious File Download From File Sharing Domain Via PowerShell.EXE
    reason: 'Precursor: delivery of the renamed Electron/Teams payload'
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Teams data and token file access
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Mm]icrosoft\\[Tt]eams|[Cc]ookies|[Ll]evel[Dd][Bb]).*/
    pivot_on: host
    window: 4h
  - name: Outbound connections from user-writable paths
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:"true" AND data_win_eventdata_image:/.*(\\Users\\|\\ProgramData\\|\\Temp\\).*/
    pivot_on: host
    window: 2h
  - name: Shells spawned from user-path parents
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*(\\Users\\|\\ProgramData\\|\\Temp\\).*/ AND data_win_eventdata_image:/.*(cmd|powershell|pwsh|wscript|cscript|mshta|rundll32)\.exe/
    pivot_on: host
    window: 2h
  - name: Executables dropped in user-writable paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(\\AppData\\|\\ProgramData\\|\\Temp\\).*\.([Ee][Xx][Ee]|[Dd][Ll][Ll])/
    pivot_on: host
    window: 6h
