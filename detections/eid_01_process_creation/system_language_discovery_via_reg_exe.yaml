name: System Language Discovery via Reg.Exe
id: c43a5405-e8e1-4221-9ac9-dbe3fa14e886
version: 1
schema_version: "1.0"
date: "2026-01-09"
author: Marco Pedrinazzi (@pedrinazziM) (InTheCyber)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: c43a5405-e8e1-4221-9ac9-dbe3fa14e886
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the usage of Reg.Exe to query system language settings. Attackers may
  discover the system language to determine the geographic location of victims,
  customize payloads for specific regions, or avoid targeting certain locales to
  evade detection. MITRE ATT&CK: T1614.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\reg.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "reg.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*query*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*Control\\\\Nls\\\\Language*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches '*\reg.exe';
  data_win_eventdata_originalFileName equals 'reg.exe';
  data_win_eventdata_commandLine matches '*query*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://scythe.io/threat-thursday/threatthursday-darkside-ransomware
  - https://attack.mitre.org/techniques/T1614/001/

response:
  message: >
    System Language Discovery via Reg.Exe detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1614.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1614.001
  custom_tags:
    - system
    - language
    - process_creation
    - sysmon
    - discovery
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Rr][Ee][Gg]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Rr][Ee][Gg]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Qq][Uu][Ee][Rr][Yy].*/ AND data_win_eventdata_commandLine:/.*[Cc][Oo][Nn][Tt][Rr][Oo][Ll]\\[Nn][Ll][Ss]\\[Ll][Aa][Nn][Gg][Uu][Aa][Gg][Ee].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 12fbff88-16b5-4b42-9754-cd001a789fb3
    name: CodePage Modification Via MODE.COM To Russian Language
    reason: Codepage change to Russian is the same locale/geo-fencing family ransomware uses to avoid CIS victims.
  - id: 965fff6c-1d7e-4e25-91fd-cdccd75f7d2c
    name: DarkSide Ransomware Pattern
    reason: DarkSide pattern is the ransomware known to perform this reg language check before encrypting.
  - id: 970007b7-ce32-49d0-a4a4-fbef016950bd
    name: Potential Configuration And Service Reconnaissance Via Reg.EXE
    reason: Reg.exe configuration/service recon often runs in the same scripted discovery pass.
  - id: 9d7ca793-f6bd-471c-8d0f-11e68b2f0d2f
    name: Computer System Reconnaissance Via Wmic.EXE
    reason: WMIC system recon is the companion host-profiling step alongside language checks.
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: Shadow copy deletion is the typical next ransomware step once the locale check passes.
  - id: 5de03871-5d46-4539-a82d-3aa992a69a83
    name: Registry Disable System Restore
    reason: Disabling System Restore in the registry follows locale gating in ransomware preparation.
  - id: 1444443e-6757-43e4-9ea4-c8fc705f79a2
    name: Boot Configuration Tampering Via Bcdedit.EXE
    reason: Boot configuration tampering is recovery inhibition after the victim is deemed in scope.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other locale and keyboard probes
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Gg][Ee][Tt]-[Ww][Ii][Nn][Ss][Yy][Ss][Tt][Ee][Mm][Ll][Oo][Cc][Aa][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Gg][Ee][Tt]-[Cc][Uu][Ll][Tt][Uu][Rr][Ee].*/ OR data_win_eventdata_commandLine:/.*[Gg][Ee][Tt]-[Ww][Ii][Nn][Uu][Ss][Ee][Rr][Ll][Aa][Nn][Gg][Uu][Aa][Gg][Ee][Ll][Ii][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Gg][Ee][Tt][Uu][Ss][Ee][Rr][Dd][Ee][Ff][Aa][Uu][Ll][Tt][Uu][Ii][Ll][Aa][Nn][Gg][Uu][Aa][Gg][Ee].*/ OR data_win_eventdata_commandLine:/.*[Kk][Ee][Yy][Bb][Oo][Aa][Rr][Dd] [Ll][Aa][Yy][Oo][Uu][Tt].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Nn][Tt][Rr][Oo][Ll] [Pp][Aa][Nn][Ee][Ll]\\[Ii][Nn][Tt][Ee][Rr][Nn][Aa][Tt][Ii][Oo][Nn][Aa][Ll].*/ OR data_win_eventdata_commandLine:/.*[Cc][Hh][Cc][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ss][Yy][Ss][Tt][Ee][Mm][Ii][Nn][Ff][Oo].*/)
    pivot_on: host
    window: 2h
  - name: Recovery inhibition commands that follow a locale check
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*[Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Hh][Aa][Dd][Oo][Ww][Cc][Oo][Pp][Yy].*[Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Bb][Cc][Dd][Ee][Dd][Ii][Tt].*[Rr][Ee][Cc][Oo][Vv][Ee][Rr][Yy][Ee][Nn][Aa][Bb][Ll][Ee][Dd].*/ OR data_win_eventdata_commandLine:/.*[Bb][Cc][Dd][Ee][Dd][Ii][Tt].*[Ii][Gg][Nn][Oo][Rr][Ee][Aa][Ll][Ll][Ff][Aa][Ii][Ll][Uu][Rr][Ee][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ww][Bb][Aa][Dd][Mm][Ii][Nn].*[Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Ss][Ii][Zz][Ee] [Ss][Hh][Aa][Dd][Oo][Ww][Ss][Tt][Oo][Rr][Aa][Gg][Ee].*/)
    pivot_on: host
    window: 4h
  - name: Services stopped ahead of encryption (backup, database, AV)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Nn][Ee][Tt] [Ss][Tt][Oo][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc] [Ss][Tt][Oo][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc] [Cc][Oo][Nn][Ff][Ii][Gg].*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Dd].*/ OR data_win_eventdata_commandLine:/.*[Tt][Aa][Ss][Kk][Kk][Ii][Ll][Ll].*([Ss][Qq][Ll]|[Vv][Ee][Ee][Aa][Mm]|[Bb][Aa][Cc][Kk][Uu][Pp]|[Vv][Ss][Ss]|[Ss][Oo][Pp][Hh][Oo][Ss]|[Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr]).*/)
    pivot_on: host
    window: 4h
  - name: Defender disabled or excluded on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Aa][Dd][Dd]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee][Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Aa][Nn][Tt][Ii][Ss][Pp][Yy][Ww][Aa][Rr][Ee].*/)
    pivot_on: host
    window: 4h
  - name: Ransom note file creation
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Rr][Ee][Aa][Dd][Mm][Ee].*\.[Tt][Xx][Tt]/ OR data_win_eventdata_targetFilename:/.*[Rr][Ee][Ss][Tt][Oo][Rr][Ee]-[Mm][Yy]-[Ff][Ii][Ll][Ee][Ss].*/ OR data_win_eventdata_targetFilename:/.*[Hh][Oo][Ww]_[Tt][Oo]_[Dd][Ee][Cc][Rr][Yy][Pp][Tt].*/)
    pivot_on: host
    window: 6h
