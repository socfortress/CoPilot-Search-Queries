name: Potential SysInternals ProcDump Evasion
id: 79b06761-465f-4f88-9ef2-150e24d3d737
version: 1
schema_version: "1.0"
date: "2023-05-09"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 79b06761-465f-4f88-9ef2-150e24d3d737
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects uses of the SysInternals ProcDump utility in which ProcDump or its
  output get renamed, or a dump file is moved or copied to a different name.
  MITRE ATT&CK: T1036, T1003.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*copy procdump*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*move procdump*"
                    case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*copy *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*.dmp *"
                          case_insensitive: true
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*2.dmp*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*lsass*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*out.dmp*"
                                case_insensitive: true
                        minimum_should_match: 1
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*copy lsass.exe_*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*move lsass.exe_*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches '*copy
  procdump*'; data_win_eventdata_commandLine matches '*move procdump*';
  data_win_eventdata_commandLine matches '*copy *', among other conditions.

known_false_positives: >
  False positives are expected in cases in which ProcDump just gets copied to a
  different directory without any renaming. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://twitter.com/mrd0x/status/1480785527901204481
  - https://attack.mitre.org/techniques/T1036/
  - https://attack.mitre.org/techniques/T1003/001/

response:
  message: >
    Potential SysInternals ProcDump Evasion detected on host $agent_name$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1036, T1003.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1036
    - T1003.001
  custom_tags:
    - sysinternals
    - procdump
    - evasion
    - process_creation
    - sysmon
    - stealth
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Pp][Yy] [Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Mm][Oo][Vv][Ee] [Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp].*/ OR (data_win_eventdata_commandLine:/.*[Cc][Oo][Pp][Yy] .*/ AND data_win_eventdata_commandLine:/.*\.[Dd][Mm][Pp] .*/ AND (data_win_eventdata_commandLine:/.*2\.[Dd][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Ss][Ss].*/ OR data_win_eventdata_commandLine:/.*[Oo][Uu][Tt]\.[Dd][Mm][Pp].*/)) OR data_win_eventdata_commandLine:/.*[Cc][Oo][Pp][Yy] [Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]_.*/ OR data_win_eventdata_commandLine:/.*[Mm][Oo][Vv][Ee] [Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]_.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 2e65275c-8288-4ab4-aeb7-6274f58b6b20
    name: Procdump Execution
    reason: the original procdump run whose binary or output is being renamed/copied
  - id: 4a0b2c7e-7cb2-495d-8b63-5f268e7bfd67
    name: Renamed ProcDump Execution
    reason: renamed procdump binary is the evasion variant of this same tradecraft
  - id: 5afee48e-67dd-4e03-a783-f74259dcf998
    name: Potential LSASS Process Dump Via Procdump
    reason: the dump being renamed is most likely an LSASS credential dump
  - id: ffa6861c-4461-4f59-8a41-578c39f3f23e
    name: LSASS Dump Keyword In CommandLine
    reason: LSASS dump keywords confirm credential-theft intent behind the rename
  - id: 129966c9-de17-4334-a123-8b58172e664d
    name: Potential Windows Defender AV Bypass Via Dump64.EXE Rename
    reason: sibling dumper-rename evasion to dodge AV/EDR name signatures
  - id: 044ba588-dff4-4918-9808-3f95e8160606
    name: Copy .DMP/.DUMP Files From Remote Share Via Cmd.EXE
    reason: dump file movement toward staging after renaming
  - id: ec570e53-4c76-45a9-804d-dc3f355ff7a7
    name: 7Zip Compressing Dump Files
    reason: 'follow-on: dump archived for exfiltration'
  - id: 1ac14d38-3dfc-4635-92c7-e3fd1c5f5bfc
    name: Winrar Compressing Dump Files
    reason: 'follow-on: dump archived with WinRAR before exfiltration'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: ProcDump / LSASS dump invocations
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp].*/ OR (data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Ss][Ss].*/ AND data_win_eventdata_commandLine:/.* \-[Mm][Aa] .*/) OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss].*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/)
    pivot_on: host
    window: 2h
  - name: Dump files written to disk
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.[Dd][Mm][Pp]/
    pivot_on: host
    window: 2h
  - name: Process access to LSASS
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 1h
  - name: Archiving or exfil tooling touching dump files
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Dd][Mm][Pp].*/ AND (data_win_eventdata_commandLine:/.* [Aa] .*/ OR data_win_eventdata_commandLine:/.*[Cc][Uu][Rr][Ll].*/ OR data_win_eventdata_commandLine:/.*[Rr][Cc][Ll][Oo][Nn][Ee].*/ OR data_win_eventdata_commandLine:/.*[Cc]ompress\-[Aa]rchive.*/)
    pivot_on: host
    window: 6h
