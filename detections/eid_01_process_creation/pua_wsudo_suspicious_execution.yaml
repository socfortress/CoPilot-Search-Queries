name: PUA - Wsudo Suspicious Execution
id: bdeeabc9-ff2a-4a51-be59-bb253aac7891
version: 1
schema_version: "1.0"
date: "2023-02-14"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: bdeeabc9-ff2a-4a51-be59-bb253aac7891
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects usage of wsudo (Windows Sudo Utility). Which is a tool that let the
  user execute programs with different permissions (System, Trusted Installer,
  Administrator...etc). MITRE ATT&CK: T1059.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\wsudo.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "wsudo.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_description:
                    value: "Windows sudo utility"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\wsudo-bridge.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-u System*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-uSystem*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-u TrustedInstaller*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-uTrustedInstaller*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* --ti *"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_description
    - data_win_eventdata_parentImage
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\wsudo.exe'; data_win_eventdata_originalFileName equals 'wsudo.exe';
  data_win_eventdata_description equals 'Windows sudo utility', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/M2Team/Privexec/
  - https://attack.mitre.org/techniques/T1059/

response:
  message: >
    PUA - Wsudo Suspicious Execution detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1059
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059
  custom_tags:
    - wsudo
    - process_creation
    - sysmon
    - execution
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ww][Ss][Uu][Dd][Oo]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ww][Ss][Uu][Dd][Oo]\.[Ee][Xx][Ee]/ OR data_win_eventdata_description:/[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Ss][Uu][Dd][Oo] [Uu][Tt][Ii][Ll][Ii][Tt][Yy]/ OR data_win_eventdata_parentImage:/.*\\[Ww][Ss][Uu][Dd][Oo]-[Bb][Rr][Ii][Dd][Gg][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*-[Uu] [Ss][Yy][Ss][Tt][Ee][Mm].*/ OR data_win_eventdata_commandLine:/.*-[Uu][Ss][Yy][Ss][Tt][Ee][Mm].*/ OR data_win_eventdata_commandLine:/.*-[Uu] [Tt][Rr][Uu][Ss][Tt][Ee][Dd][Ii][Nn][Ss][Tt][Aa][Ll][Ll][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*-[Uu][Tt][Rr][Uu][Ss][Tt][Ee][Dd][Ii][Nn][Ss][Tt][Aa][Ll][Ll][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.* --[Tt][Ii] .*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 771d1eb5-9587-4568-95fb-9ec44153a012
    name: PUA - NSudo Execution
    reason: 'NSudo is the same class of tool: run as SYSTEM/TrustedInstaller.'
  - id: 178e615d-e666-498b-9630-9ed363038101
    name: Elevated System Shell Spawned From Uncommon Parent Location
    reason: Elevated SYSTEM shell from an uncommon parent is the outcome of wsudo -u System.
  - id: 730fc21b-eaff-474b-ad23-90fd265d4988
    name: Psexec Execution
    reason: PsExec -s is the alternative route to SYSTEM execution.
  - id: d2b749ee-4225-417e-b20e-a8d2193cbb84
    name: PUA - AdvancedRun Execution
    reason: AdvancedRun likewise runs programs as SYSTEM/TrustedInstaller.
  - id: d9047477-0359-48c9-b8c7-792cedcdc9c4
    name: PUA - NirCmd Execution As LOCAL SYSTEM
    reason: NirCmd as SYSTEM is another elevation utility often paired in toolkits.
  - id: 89ca78fd-b37c-4310-b3d3-81a023f83936
    name: Schtasks Creation Or Modification With SYSTEM Privileges
    reason: SYSTEM scheduled task creation is a typical persistence follow-on.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Children of wsudo / wsudo-bridge
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ww][Ss][Uu][Dd][Oo](-[Bb][Rr][Ii][Dd][Gg][Ee])?\\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Defender or security tool tampering
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee]|[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee]|[Ss][Cc] [Ss][Tt][Oo][Pp] [Ww][Ii][Nn][Dd][Ee][Ff][Ee][Nn][Dd]|[Tt][Aa][Mm][Pp][Ee][Rr]).*/
    pivot_on: host
    window: 4h
  - name: Account, service and task persistence
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Nn][Ee][Tt] [Uu][Ss][Ee][Rr].*\/[Aa][Dd][Dd]|[Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp] [Aa][Dd][Mm][Ii][Nn][Ii][Ss][Tt][Rr][Aa][Tt][Oo][Rr][Ss]|[Ss][Cc] [Cc][Rr][Ee][Aa][Tt][Ee]|[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss].*\/[Cc][Rr][Ee][Aa][Tt][Ee]).*/
    pivot_on: host
    window: 4h
  - name: Other SYSTEM-elevation tooling
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Nn][Ss][Uu][Dd][Oo]|[Pp][Ss][Ee][Xx][Ee][Cc].* -[Ss] |[Tt][Rr][Uu][Ss][Tt][Ee][Dd][Ii][Nn][Ss][Tt][Aa][Ll][Ll][Ee][Rr]).*/
    pivot_on: host
    window: 4h
  - name: Shells running as SYSTEM
    query: data_win_system_eventID:"1" AND data_win_eventdata_user:/.*[Ss][Yy][Ss][Tt][Ee][Mm]/ AND data_win_eventdata_image:/.*\\([Cc][Mm][Dd]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh])\\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
