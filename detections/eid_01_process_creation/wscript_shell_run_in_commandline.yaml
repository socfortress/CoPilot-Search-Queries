name: Wscript Shell Run In CommandLine
id: 2c28c248-7f50-417a-9186-a85b223010ee
version: 1
schema_version: "1.0"
date: "2023-05-15"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 2c28c248-7f50-417a-9186-a85b223010ee
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the presence of the keywords "Wscript", "Shell" and "Run" in the
  command, which could indicate a suspicious activity. MITRE ATT&CK: T1059.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*Wscript.*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*.Shell*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*.Run*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*Wscript.*'; data_win_eventdata_commandLine matches '*.Shell*';
  data_win_eventdata_commandLine matches '*.Run*'.

known_false_positives: >
  Inline scripting can be used by some rare third party applications or
  administrators. Investigate and apply additional filters accordingly. Baseline
  expected activity in your environment and tune this detection before relying
  on it for automated response.

references:
  - https://web.archive.org/web/20220830122045/http://blog.talosintelligence.com/2022/08/modernloader-delivers-multiple-stealers.html
  - https://blog.talosintelligence.com/modernloader-delivers-multiple-stealers-cryptominers-and-rats/
  - https://attack.mitre.org/techniques/T1059/

response:
  message: >
    Wscript Shell Run In CommandLine detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1059
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059
  custom_tags:
    - wscript
    - shell
    - process_creation
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\..*/ AND data_win_eventdata_commandLine:/.*\.[Ss][Hh][Ee][Ll][Ll].*/ AND data_win_eventdata_commandLine:/.*\.[Rr][Uu][Nn].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b6676963-0353-4f88-90f5-36c20d443c6a
    name: Cscript/Wscript Potentially Suspicious Child Process
    reason: WScript.Shell.Run spawns children; suspicious children confirm the launch chain.
  - id: cea72823-df4d-4567-950c-0b579eaf0846
    name: Potential Dropper Script Execution Via WScript/CScript/MSHTA
    reason: Inline WScript.Shell.Run is the typical body of a dropper script.
  - id: 99b7460d-c9f1-40d7-a316-1f36f61d52ee
    name: Cscript/Wscript Uncommon Script Extension Execution
    reason: Script hosts run files with disguised extensions to carry this payload.
  - id: 002f1e24-146e-11ec-a470-acde48001122
    name: Jscript Execution Using Cscript App
    reason: JScript content calling WScript.Shell.Run is executed via cscript on the same host.
  - id: 921aa10f-2e74-4cca-9498-98f9ca4d6fdf
    name: Registry Modification Attempt Via VBScript
    reason: VBScript using WScript.Shell often also writes the registry for persistence or impairment.
  - id: 3dfd06d2-eaf4-4532-9555-68aca59f57c4
    name: Process Execution From A Potentially Suspicious Folder
    reason: The launched payload frequently runs from temp/public/user-writable folders.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Script hosts spawning shells and LOLBins
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/)
    pivot_on: host
    window: 2h
  - name: Script files run by wscript or cscript
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*\.([Vv][Bb][Ss]|[Vv][Bb][Ee]|[Jj][Ss]|[Jj][Ss][Ee]|[Ww][Ss][Ff])/
    pivot_on: host
    window: 4h
  - name: Script files created in user-writable paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.([Vv][Bb][Ss]|[Vv][Bb][Ee]|[Jj][Ss][Ee]|[Ww][Ss][Ff])/ AND (data_win_eventdata_targetFilename:/.*[Aa][Pp][Pp][Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_targetFilename:/.*[Tt][Ee][Mm][Pp].*/ OR data_win_eventdata_targetFilename:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss].*/)
    pivot_on: host
    window: 4h
  - name: Network connections from script hosts
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/)
    pivot_on: host
    window: 2h
  - name: Run-key persistence set by script hosts
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/ AND (data_win_eventdata_image:/.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/)
    pivot_on: host
    window: 6h
