name: Uncommon FileSystem Load Attempt By Format.com
id: 9fb6b26e-7f9e-4517-a48b-8cac4a1b6c60
version: 1
schema_version: "1.0"
date: "2024-05-13"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 9fb6b26e-7f9e-4517-a48b-8cac4a1b6c60
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of format.com with an uncommon filesystem selection that
  could indicate a defense evasion activity in which "format.com" is used to
  load malicious DLL files or other programs.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\format.com"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*/fs:*"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_commandLine"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*/fs:exFAT*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*/fs:FAT*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*/fs:NTFS*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*/fs:ReFS*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*/fs:UDF*"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\format.com'; data_win_eventdata_commandLine matches '*/fs:*';
  data_win_eventdata_commandLine matches '*/fs:exFAT*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/0gtweet/status/1477925112561209344
  - https://twitter.com/wdormann/status/1478011052130459653?s=20

response:
  message: >
    Uncommon FileSystem Load Attempt By Format.com detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - uncommon
    - filesystem
    - format
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ff][Oo][Rr][Mm][Aa][Tt]\.[Cc][Oo][Mm]/ AND data_win_eventdata_commandLine:/.*\/[Ff][Ss]:.*/ AND _exists_:data_win_eventdata_commandLine AND NOT (data_win_eventdata_commandLine:/.*\/[Ff][Ss]:[Ee][Xx][Ff][Aa][Tt].*/ OR data_win_eventdata_commandLine:/.*\/[Ff][Ss]:[Ff][Aa][Tt].*/ OR data_win_eventdata_commandLine:/.*\/[Ff][Ss]:[Nn][Tt][Ff][Ss].*/ OR data_win_eventdata_commandLine:/.*\/[Ff][Ss]:[Rr][Ee][Ff][Ss].*/ OR data_win_eventdata_commandLine:/.*\/[Ff][Ss]:[Uu][Dd][Ff].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d4ca7c59-e9e4-42d8-bf57-91a776efcb87
    name: LOLBIN Execution From Abnormal Drive
    reason: format.com abuse is a LOLBIN proxy-exec trick; execution from an abnormal drive (attacker media holding the fake FS DLL) is a sibling signal
  - id: e593cf51-88db-4ee1-b920-37e89012a3c9
    name: Potentially Suspicious Rundll32 Activity
    reason: 'Same operator toolbox: rundll32 proxying of payloads commonly accompanies format.com DLL-load tradecraft'
  - id: a7ee1722-c3c5-aeff-3212-c777e4733217
    name: Disable Windows Defender AV Security Monitoring
    reason: 'Defense evasion intent: AV is typically disabled before the payload loads'
  - id: b6676963-0353-4f88-90f5-36c20d443c6a
    name: Cscript/Wscript Potentially Suspicious Child Process
    reason: Script hosts spawning children are the typical delivery stage leading to the format.com call
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Format.com invocations (any filesystem) on host
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Ff][Oo][Rr][Mm][Aa][Tt]\.[Cc][Oo][Mm])/
    pivot_on: host
    window: 24h
  - name: DLL loads by format.com
    query: data_win_system_eventID:"7" AND data_win_eventdata_image:/.*\\([Ff][Oo][Rr][Mm][Aa][Tt]\.[Cc][Oo][Mm])/
    pivot_on: host
    window: 2h
  - name: Script hosts and LOLBins launched around the event
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Cc][Mm][Dd]\.[Ee][Xx][Ee]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 2h
  - name: DLL/EXE dropped in user-writable paths (fake FS driver)
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\([Uu][Ss][Ee][Rr][Ss]|[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]|[Tt][Ee][Mm][Pp])\\.*\.([Dd][Ll][Ll]|[Ee][Xx][Ee])/
    pivot_on: host
    window: 2h
