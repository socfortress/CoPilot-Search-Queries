name: Remote File Download Via Findstr.EXE
id: 587254ee-a24b-4335-b3cd-065c0f1f4baa
version: 1
schema_version: "1.0"
date: "2024-03-05"
author: Furkan CALISKAN, @caliskanfurkan_, @oscd_initiative, Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 587254ee-a24b-4335-b3cd-065c0f1f4baa
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of "findstr" with specific flags and a remote share path.
  This specific set of CLI flags would allow "findstr" to download the content
  of the file located on the remote share as described in the LOLBAS entry.
  MITRE ATT&CK: T1218, T1564.004, T1552.001, T1105.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*findstr*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*findstr.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "FINDSTR.EXE"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -v *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /v *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* –v *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* —v *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* ―v *"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -l *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /l *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* –l *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* —l *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* ―l *"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine: "*\\\\\\\\*"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*findstr*'; data_win_eventdata_image matches '*findstr.exe';
  data_win_eventdata_originalFileName equals 'FINDSTR.EXE', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://lolbas-project.github.io/lolbas/Binaries/Findstr/
  - https://oddvar.moe/2018/04/11/putting-data-in-alternate-data-streams-and-how-to-execute-it-part-2/
  - https://gist.github.com/api0cradle/cdd2d0d0ec9abb686f0e89306e277b8f
  - https://attack.mitre.org/techniques/T1218/
  - https://attack.mitre.org/techniques/T1564/004/
  - https://attack.mitre.org/techniques/T1552/001/
  - https://attack.mitre.org/techniques/T1105/

response:
  message: >
    Remote File Download Via Findstr.EXE detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1218,
    T1564.004, T1552.001, T1105
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218
    - T1564.004
    - T1552.001
    - T1105
  custom_tags:
    - download
    - findstr
    - process_creation
    - sysmon
    - credential_access
    - command_and_control
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ff][Ii][Nn][Dd][Ss][Tt][Rr].*/ OR data_win_eventdata_image:/.*[Ff][Ii][Nn][Dd][Ss][Tt][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ff][Ii][Nn][Dd][Ss][Tt][Rr]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.* -[Vv] .*/ OR data_win_eventdata_commandLine:/.* \/[Vv] .*/ OR data_win_eventdata_commandLine:/.* –[Vv] .*/ OR data_win_eventdata_commandLine:/.* —[Vv] .*/ OR data_win_eventdata_commandLine:/.* ―[Vv] .*/) AND (data_win_eventdata_commandLine:/.* -[Ll] .*/ OR data_win_eventdata_commandLine:/.* \/[Ll] .*/ OR data_win_eventdata_commandLine:/.* –[Ll] .*/ OR data_win_eventdata_commandLine:/.* —[Ll] .*/ OR data_win_eventdata_commandLine:/.* ―[Ll] .*/) AND data_win_eventdata_commandLine:/.*\\\\.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 33339be3-148b-4e16-af56-ad16ec6c7e7b
    name: Findstr Launching .lnk File
    reason: findstr is reused as a LOLBin launcher after staging payloads, so a findstr-launched .lnk on the same host extends the chain.
  - id: aa0b3a82-eacc-4ec3-9150-b5a9a3e3f82f
    name: Potential Download/Upload Activity Using Type Command
    reason: Alternative built-in way to pull files from a remote share; attackers rotate between them when one is blocked.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Outbound SMB/WebDAV connections by findstr
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*[Ff]indstr.*/
    pivot_on: host
    window: 1h
  - name: Files written after remote findstr
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*(Temp|AppData|ProgramData|Users\\Public).*/
    pivot_on: host
    window: 2h
  - name: Follow-on execution from temp/public paths
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*(Temp|ProgramData|Users\\Public|AppData).*/
    pivot_on: host
    window: 2h
  - name: UNC path command lines
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*\\\\[A-Za-z0-9.$_-]+\\.*/
    pivot_on: host
    window: 4h
