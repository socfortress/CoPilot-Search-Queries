name: C# IL Code Compilation Via Ilasm.EXE
id: 850d55f9-6eeb-4492-ad69-a72338f65ba4
version: 1
schema_version: "1.0"
date: "2022-05-16"
author: frack113, Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 850d55f9-6eeb-4492-ad69-a72338f65ba4
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the use of "Ilasm.EXE" in order to compile C# intermediate (IL) code
  to EXE or DLL. MITRE ATT&CK: T1127.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\ilasm.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "ilasm.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /dll*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /exe*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\ilasm.exe'; data_win_eventdata_originalFileName equals 'ilasm.exe';
  data_win_eventdata_commandLine matches '* /dll*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://lolbas-project.github.io/lolbas/Binaries/Ilasm/
  - https://www.echotrail.io/insights/search/ilasm.exe
  - https://attack.mitre.org/techniques/T1127/

response:
  message: >
    C# IL Code Compilation Via Ilasm.EXE detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1127
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1127
  custom_tags:
    - compilation
    - ilasm
    - process_creation
    - sysmon
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ii][Ll][Aa][Ss][Mm]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ii][Ll][Aa][Ss][Mm]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.* \/[Dd][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.* \/[Ee][Xx][Ee].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7b10f171-7f04-47c7-9fa2-5be43c76e535
    name: Visual Basic Command Line Compiler Usage
    reason: Both are on-host .NET compilers used to build payloads in place and evade static detection.
  - id: 39ac1fb0-07f1-474b-b97e-c5c0eace0d79
    name: Potential MOVEit Transfer CVE-2023-34362 Exploitation - Dynamic Compilation Via Csc.EXE
    reason: csc.exe is the sibling compiler abused for the same dynamic-build tradecraft.
  - id: a01b8329-5953-4f73-ae2d-aa01e1f35f00
    name: AspNetCompiler Execution
    reason: Another trusted .NET toolchain binary abused to compile attacker code.
  - id: d042284c-a296-4988-9be5-f424fadcc28c
    name: Suspicious Execution of InstallUtil Without Log
    reason: A freshly ILASM-built assembly is often executed through InstallUtil as a proxy.
  - id: 72170ec5-f7d2-42f5-aefb-2b8be6aad15f
    name: Detect Regasm Spawning a Process
    reason: Regasm/regsvcs are common launchers for compiled .NET payloads.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: IL source files created in user-writable paths
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\.[Ii][Ll]/ AND (data_win_eventdata_targetFilename:/.*[Tt]emp.*/ OR data_win_eventdata_targetFilename:/.*[Pp]ublic.*/ OR data_win_eventdata_targetFilename:/.*[Aa]pp[Dd]ata.*/ OR data_win_eventdata_targetFilename:/.*[Dd]ownloads.*/)
    pivot_on: host
    window: 2h
  - name: Executable or DLL written by ilasm
    query: data_win_system_eventID:11 AND data_win_eventdata_image:/.*[Ii]lasm\.exe/ AND (data_win_eventdata_targetFilename:/.*\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetFilename:/.*\.[Dd][Ll][Ll]/)
    pivot_on: host
    window: 2h
  - name: .NET proxy-execution LOLBins
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*[Ii]nstall[Uu]til\.exe/ OR data_win_eventdata_image:/.*[Rr]egasm\.exe/ OR data_win_eventdata_image:/.*[Rr]egsvcs\.exe/ OR data_win_eventdata_image:/.*[Mm][Ss][Bb]uild\.exe/)
    pivot_on: host
    window: 2h
  - name: Other on-host compilers invoked
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*[Cc]sc\.exe/ OR data_win_eventdata_image:/.*[Vv]bc\.exe/ OR data_win_eventdata_image:/.*[Jj]sc\.exe/)
    pivot_on: host
    window: 4h
  - name: Ilasm launched from a shell or script host
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*([Pp]ower[Ss]hell|[Cc][Mm][Dd]|[Ww][Ss]cript|[Cc][Ss]cript)\.exe/ AND data_win_eventdata_image:/.*[Ii]lasm\.exe/
    pivot_on: host
    window: 1h
