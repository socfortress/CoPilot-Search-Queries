name: UNC2452 Process Creation Patterns
id: 9be34ad0-b6a7-4fbd-91cf-fc7ec1047f5f
version: 1
schema_version: "1.0"
date: "2024-09-12"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 9be34ad0-b6a7-4fbd-91cf-fc7ec1047f5f
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a specific process creation patterns as seen used by UNC2452 and
  provided by Microsoft as Microsoft Defender ATP queries. MITRE ATT&CK:
  T1059.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*7z.exe a -v500m -mx9 -r0 -p*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*7z.exe a -mx9 -r0 -p*"
                                case_insensitive: true
                        minimum_should_match: 1
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*.zip*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*.txt*"
                          case_insensitive: true
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*7z.exe a -v500m -mx9 -r0 -p*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*7z.exe a -mx9 -r0 -p*"
                                case_insensitive: true
                        minimum_should_match: 1
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*.zip*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*.log*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_parentCommandLine:
                          value: "*wscript.exe*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_parentCommandLine:
                          value: "*.vbs*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*rundll32.exe*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*C:\\\\Windows*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*.dll,Tk_*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_parentImage:
                          value: "*\\\\rundll32.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_parentCommandLine:
                          value: "*C:\\\\Windows*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_parentCommandLine:
                          value: "*.dll*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*cmd.exe /C *"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_parentImage:
                          value: "*\\\\rundll32.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\dllhost.exe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_commandLine: ""
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentCommandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*7z.exe a -v500m -mx9 -r0 -p*'; data_win_eventdata_commandLine matches
  '*7z.exe a -mx9 -r0 -p*'; data_win_eventdata_commandLine matches '*.zip*',
  among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.microsoft.com/security/blog/2021/01/20/deep-dive-into-the-solorigate-second-stage-activation-from-sunburst-to-teardrop-and-raindrop/
  - https://attack.mitre.org/techniques/T1059/001/

response:
  message: >
    UNC2452 Process Creation Patterns detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_parentCommandLine:
    $data_win_eventdata_parentCommandLine$. MITRE ATT&CK: T1059.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_parentCommandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
  custom_tags:
    - unc2452
    - patterns
    - process_creation
    - sysmon
    - execution
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (((data_win_eventdata_commandLine:/.*7[Zz]\.[Ee][Xx][Ee] [Aa] -[Vv]500[Mm] -[Mm][Xx]9 -[Rr]0 -[Pp].*/ OR data_win_eventdata_commandLine:/.*7[Zz]\.[Ee][Xx][Ee] [Aa] -[Mm][Xx]9 -[Rr]0 -[Pp].*/) AND data_win_eventdata_commandLine:/.*\.[Zz][Ii][Pp].*/ AND data_win_eventdata_commandLine:/.*\.[Tt][Xx][Tt].*/) OR ((data_win_eventdata_commandLine:/.*7[Zz]\.[Ee][Xx][Ee] [Aa] -[Vv]500[Mm] -[Mm][Xx]9 -[Rr]0 -[Pp].*/ OR data_win_eventdata_commandLine:/.*7[Zz]\.[Ee][Xx][Ee] [Aa] -[Mm][Xx]9 -[Rr]0 -[Pp].*/) AND data_win_eventdata_commandLine:/.*\.[Zz][Ii][Pp].*/ AND data_win_eventdata_commandLine:/.*\.[Ll][Oo][Gg].*/) OR (data_win_eventdata_parentCommandLine:/.*[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee].*/ AND data_win_eventdata_parentCommandLine:/.*\.[Vv][Bb][Ss].*/ AND data_win_eventdata_commandLine:/.*[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee].*/ AND data_win_eventdata_commandLine:/.*[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss].*/ AND data_win_eventdata_commandLine:/.*\.[Dd][Ll][Ll],[Tt][Kk]_.*/) OR (data_win_eventdata_parentImage:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ AND data_win_eventdata_parentCommandLine:/.*[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss].*/ AND data_win_eventdata_parentCommandLine:/.*\.[Dd][Ll][Ll].*/ AND data_win_eventdata_commandLine:/.*[Cc][Mm][Dd]\.[Ee][Xx][Ee] \/[Cc] .*/) OR (data_win_eventdata_parentImage:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\[Dd][Ll][Ll][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:""))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b7155193-8a81-4d8f-805d-88de864ca50c
    name: UNC2452 PowerShell Pattern
    reason: Companion UNC2452 detection covering WMI launching of the rundll32 payload; same intrusion set.
  - id: 9fbf5927-5261-4284-a71d-f681029ea574
    name: Compress Data and Lock With Password for Exfiltration With 7-ZIP
    reason: The 7z a -mx9 -p archive pattern is the staging step before exfiltration.
  - id: faa48cae-6b25-4f00-a094-08947fef582f
    name: Rar Usage with Password and Compression Level
    reason: Alternative archiver for the same password-protected staging.
  - id: b6676963-0353-4f88-90f5-36c20d443c6a
    name: Cscript/Wscript Potentially Suspicious Child Process
    reason: The wscript.exe VBS stage spawns child processes to run follow-on payloads.
  - id: e7888eb1-13b0-4616-bd99-4bc0c2b054b9
    name: Dllhost.EXE Execution Anomaly
    reason: The rule matches rundll32 spawning dllhost; this flags the anomalous dllhost carrying injected code.
  - id: ae9c6a7c-9521-42a6-915e-5aaa8689d529
    name: CobaltStrike Load by Rundll32
    reason: The rundll32 .dll,Tk_ export is Cobalt Strike-class beacon loading.
  - id: 15619216-e993-4721-b590-4c520615a67d
    name: Potential Meterpreter/CobaltStrike Activity
    reason: cmd.exe /C spawned from rundll32/dllhost is the beacon command-execution pattern.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Password-protected archive creation
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*7[zZ][a-z]*\.[eE][xX][eE] a .*-[pP].*/ OR data_win_eventdata_commandLine:/.*[rR][aA][rR]\.[eE][xX][eE] a .*-[hH][pP].*/)
    pivot_on: host
    window: 4h
  - name: wscript running VBS files
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([wW][sS][cC][rR][iI][pP][tT]\.[eE][xX][eE])/ AND data_win_eventdata_commandLine:/.*\.[vV][bB][sS].*/
    pivot_on: host
    window: 2h
  - name: Shells and dllhost spawned from rundll32
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\([rR][uU][nN][dD][lL][lL]32\.[eE][xX][eE])/ AND data_win_eventdata_image:/.*\\([cC][mM][dD]\.[eE][xX][eE]|[dD][lL][lL][hH][oO][sS][tT]\.[eE][xX][eE]|[pP][oO][wW][eE][rR][sS][hH][eE][lL][lL]\.[eE][xX][eE])/
    pivot_on: host
    window: 2h
  - name: Network connections by rundll32 or dllhost
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([rR][uU][nN][dD][lL][lL]32\.[eE][xX][eE]|[dD][lL][lL][hH][oO][sS][tT]\.[eE][xX][eE])/
    pivot_on: host
    window: 4h
  - name: DLLs dropped under the Windows directory
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[cC]:\\[wW][iI][nN][dD][oO][wW][sS]\\.*\.[dD][lL][lL].*/
    pivot_on: host
    window: 4h
