name: Use of Pcalua For Execution
id: 0955e4e1-c281-4fb9-9ee1-5ee7b4b754d2
version: 1
schema_version: "1.0"
date: "2023-01-04"
author: Nasreddine Bencherchali (Nextron Systems), E.M. Anhaus (originally from Atomic Blue Detections, Endgame), oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 0955e4e1-c281-4fb9-9ee1-5ee7b4b754d2
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execition of commands and binaries from the context of The program
  compatibility assistant (Pcalua.exe). This can be used as a LOLBIN in order to
  bypass application whitelisting. MITRE ATT&CK: T1059.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\pcalua.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* -a*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\pcalua.exe'; data_win_eventdata_commandLine matches '* -a*'.

known_false_positives: >
  Legitimate use by a via a batch script or by an administrator. Baseline
  expected activity in your environment and tune this detection before relying
  on it for automated response.

references:
  - https://lolbas-project.github.io/lolbas/Binaries/Pcalua/
  - https://pentestlab.blog/2020/07/06/indirect-command-execution/
  - https://attack.mitre.org/techniques/T1059/

response:
  message: >
    Use of Pcalua For Execution detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1059
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059
  custom_tags:
    - pcalua
    - process_creation
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Pp][Cc][Aa][Ll][Uu][Aa]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.* -[Aa].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 3428ac18-a410-4823-816c-ce697d26f7a8
    name: Windows Indirect Command Execution Via pcalua
    reason: 'Direct overlap: pcalua -a launching arbitrary programs.'
  - id: 9aa5106d-bce3-4b13-86df-3a20f1d5cf0b
    name: Forfiles Command Execution
    reason: Equivalent indirect-execution LOLBin often tried alongside pcalua.
  - id: 64760eef-87f7-4ed3-93fd-655668ea9420
    name: Use of Scriptrunner.exe
    reason: Another Windows proxy-execution binary used to evade parent-child detections.
  - id: 814c95cc-8192-4378-a70a-f1aafd877af1
    name: Use of OpenConsole
    reason: Another signed binary used to launch payloads indirectly.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Children spawned by pcalua
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Pp][Cc][Aa][Ll][Uu][Aa][.][Ee][Xx][Ee]/
    pivot_on: host
    window: 1h
  - name: pcalua launches with -a/-c
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Pp][Cc][Aa][Ll][Uu][Aa][.][Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*( -[Aa]| -[Cc]).*/
    pivot_on: host
    window: 2h
  - name: Other LOLBin proxy executions
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*([Rr][Uu][Nn][Dd][Ll][Ll]32[.][Ee][Xx][Ee]|[Rr][Ee][Gg][Ss][Vv][Rr]32[.][Ee][Xx][Ee]|[Mm][Ss][Hh][Tt][Aa][.][Ee][Xx][Ee]|[Mm][Ss][Bb][Uu][Ii][Ll][Dd][.][Ee][Xx][Ee]|[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll][.][Ee][Xx][Ee]|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn][.][Ee][Xx][Ee]|[Ww][Mm][Ii][Cc][.][Ee][Xx][Ee]|[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Uu][Tt][Ii][Ll][.][Ee][Xx][Ee]|[Rr][Ee][Gg][Aa][Ss][Mm][.][Ee][Xx][Ee]|[Rr][Ee][Gg][Ss][Vv][Cc][Ss][.][Ee][Xx][Ee])/
    pivot_on: host
    window: 2h
  - name: Download tooling in command lines
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll].*/ OR data_win_eventdata_commandLine:/.*[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp]://.*/ OR data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp][Ss]://.*/)
    pivot_on: host
    window: 2h
  - name: Persistence registry writes
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND data_win_eventdata_targetObject:/.*([Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn][\\][Rr][Uu][Nn]|[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn][\\][Rr][Uu][Nn][Oo][Nn][Cc][Ee]|[Ii][Mm][Aa][Gg][Ee] [Ff][Ii][Ll][Ee] [Ee][Xx][Ee][Cc][Uu][Tt][Ii][Oo][Nn] [Oo][Pp][Tt][Ii][Oo][Nn][Ss]|[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn][\\][Ss][Hh][Ee][Ll][Ll]).*/
    pivot_on: host
    window: 4h
