name: Attempts of Kerberos Coercion Via DNS SPN Spoofing
id: 0ed99dda-6a35-11ef-8c99-0242ac120002
version: 1
schema_version: "1.0"
date: "2025-06-20"
author: Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 0ed99dda-6a35-11ef-8c99-0242ac120002
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the presence of "UWhRC....AAYBAAAA" pattern in command line. The
  pattern "1UWhRCAAAAA..BAAAA" is a base64-encoded signature that corresponds to
  a marshaled CREDENTIAL_TARGET_INFORMATION structure. Attackers can use this
  technique to coerce authentication from victim systems to attacker-controlled
  hosts. It is one of the strong indicators of a Kerberos coercion attack, where
  adversaries manipulate DNS records to spoof Service Principal Names (SPNs) and
  redirect authentication requests like in CVE-2025-33073. If you see this
  pattern in the command line, it is likely an attempt to add spoofed Service
  Principal Names (SPNs) to DNS records, or checking for the presence of such
  records through the `nslookup` command. MITRE ATT&CK: T1557.001, T1187.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*UWhRCA*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*BAAAA*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*UWhRCA*'; data_win_eventdata_commandLine matches '*BAAAA*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.synacktiv.com/publications/ntlm-reflection-is-dead-long-live-ntlm-reflection-an-in-depth-analysis-of-cve-2025
  - https://googleprojectzero.blogspot.com/2021/10/using-kerberos-for-authentication-relay.html
  - https://attack.mitre.org/techniques/T1557/001/
  - https://attack.mitre.org/techniques/T1187/

response:
  message: >
    Attempts of Kerberos Coercion Via DNS SPN Spoofing detected on host
    $agent_name$. Matched data_win_eventdata_commandLine:
    $data_win_eventdata_commandLine$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1557.001, T1187
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1557.001
    - T1187
  custom_tags:
    - kerberos
    - coercion
    - spoofing
    - process_creation
    - sysmon
    - collection
    - credential_access
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Uu][Ww][Hh][Rr][Cc][Aa].*/ AND data_win_eventdata_commandLine:/.*[Bb][Aa][Aa][Aa][Aa].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: windows-credential-target-info-commandline-001
    name: Windows Credential Target Information Structure in Commandline
    reason: Same marshaled CREDENTIAL_TARGET_INFORMATION command-line pattern; co-firing confirms the DNS SPN spoof record add/check.
  - id: 1eeed653-dbc8-4187-ad0c-eeebb20e6599
    name: Potential SPN Enumeration Via Setspn.EXE
    reason: SPN reconnaissance commonly precedes choosing a coercion/relay target.
  - id: 12827a56-61a4-476a-a9cb-f3068f191073
    name: HackTool - KrbRelayUp Execution
    reason: Kerberos relay tooling is the usual follow-on once authentication is coerced (CVE-2025-33073 chain).
  - id: e96253b8-6b3b-4f90-9e59-3b24b99cf9b4
    name: HackTool - KrbRelay Execution
    reason: Relay of the coerced Kerberos authentication to a target service.
  - id: a7664b14-75fb-4a50-a223-cb9bc0afbacf
    name: HackTool - RemoteKrbRelay Execution
    reason: Remote relay variant that consumes the spoofed-SPN authentication.
  - id: 5589ab4f-a767-433c-961d-c91f3f704db1
    name: Potential SMB Relay Attack Tool Execution
    reason: Relay tooling on the attacker side receiving the coerced SMB authentication.
  - id: bb76d96b-821c-47cf-944b-7ce377864492
    name: Suspicious NTLM Authentication on the Printer Spooler Service
    reason: Sibling authentication-coercion technique often tried alongside DNS SPN spoofing.
  - id: caa9a802-8bd8-4b9e-a5cd-4d6221670219
    name: Suspicious Kerberos Ticket Request via CLI
    reason: Post-coercion ticket abuse from the same host/user.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: nslookup queries carrying marshaled credential-target SPN names
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Nn]slookup.exe/ AND data_win_eventdata_commandLine:/.*[Uu][Ww][Hh][Rr][Cc][Aa].*/
    pivot_on: host
    window: 4h
  - name: Relay or coercion tooling executions
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Kk]rb[Rr]elay.*/ OR /.*[Pp]etit[Pp]otam.*/ OR /.*[Rr]esponder.*/ OR /.*[Nn]tlm[Rr]elay[Xx].*/ OR /.*[Dd]fs[Cc]oerce.*/)
    pivot_on: host
    window: 6h
  - name: DNS record additions via dnstool or PowerShell DNS cmdlets
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Dd]nstool.*/ OR /.*[Aa]dd-[Dd]ns[Ss]erver[Rr]esource[Rr]ecord.*/ OR /.*[Dd]nscmd.*[Rr]ecordadd.*/)
    pivot_on: user
    window: 6h
  - name: SPN enumeration and Kerberos ticket requests
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ss]etspn.*/ OR /.*[Rr]ubeus.*/ OR /.*[Kk]linit.*/)
    pivot_on: host
    window: 4h
  - name: Outbound SMB/Kerberos from the host
    query: data_win_system_eventID:3 AND data_win_eventdata_destinationPort:(88 OR 445)
    pivot_on: host
    window: 2h
