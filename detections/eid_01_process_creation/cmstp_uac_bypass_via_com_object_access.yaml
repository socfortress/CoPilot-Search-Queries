name: CMSTP UAC Bypass via COM Object Access
id: 4b60e6f2-bf39-47b4-b4ea-398e33cfe253
version: 1
schema_version: "1.0"
date: "2024-12-01"
author: Nik Seetharaman, Christian Burkard (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 4b60e6f2-bf39-47b4-b4ea-398e33cfe253
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: production
type: TTP

description: >
  Detects UAC Bypass Attempt Using Microsoft Connection Manager Profile
  Installer Autoelevate-capable COM Objects (e.g. UACMe ID of 41, 43, 58 or 65).
  MITRE ATT&CK: T1548.002, T1218.003.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_parentImage:
              value: "*\\\\DllHost.exe"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_parentCommandLine:
                    value: "* /Processid:{3E5FC7F9-9A51-4367-9063-A120244FBEC7}*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentCommandLine:
                    value: "* /Processid:{3E000D72-A845-4CD9-BD83-80C07C3B881F}*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentCommandLine:
                    value: "* /Processid:{BD54C901-076B-434E-B6C7-17C531F4AB41}*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentCommandLine:
                    value: "* /Processid:{D2E7041B-2927-42FB-8E9F-7CE93B6DC937}*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentCommandLine:
                    value: "* /Processid:{E9495B87-D950-4AB5-87A5-FF6D70BF3E90}*"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - term:
                  data_win_eventdata_integrityLevel:
                    value: "High"
                    case_insensitive: true
              - term:
                  data_win_eventdata_integrityLevel:
                    value: "System"
                    case_insensitive: true
              - term:
                  data_win_eventdata_integrityLevel:
                    value: "S-1-16-16384"
                    case_insensitive: true
              - term:
                  data_win_eventdata_integrityLevel:
                    value: "S-1-16-12288"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_parentCommandLine
    - data_win_eventdata_integrityLevel
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\DllHost.exe'; data_win_eventdata_parentCommandLine matches '*
  /Processid:{3E5FC7F9-9A51-4367-9063-A120244FBEC7}*';
  data_win_eventdata_parentCommandLine matches '*
  /Processid:{3E000D72-A845-4CD9-BD83-80C07C3B881F}*', among other conditions.

known_false_positives: >
  Legitimate CMSTP use (unlikely in modern enterprise environments). Baseline
  expected activity in your environment and tune this detection before relying
  on it for automated response.

references:
  - https://web.archive.org/web/20190720093911/http://www.endurant.io/cmstp/detecting-cmstp-enabled-code-execution-and-uac-bypass-with-sysmon/
  - https://twitter.com/hFireF0X/status/897640081053364225
  - https://medium.com/falconforce/falconfriday-detecting-uac-bypasses-0xff16-86c2a9107abf
  - https://github.com/hfiref0x/UACME
  - https://attack.mitre.org/techniques/T1548/002/
  - https://attack.mitre.org/techniques/T1218/003/

response:
  message: >
    CMSTP UAC Bypass via COM Object Access detected on host $agent_name$.
    Matched data_win_eventdata_parentImage: $data_win_eventdata_parentImage$.
    Matched data_win_eventdata_parentCommandLine:
    $data_win_eventdata_parentCommandLine$. MITRE ATT&CK: T1548.002, T1218.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_parentCommandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1548.002
    - T1218.003
  custom_tags:
    - cmstp
    - bypass
    - object
    - process_creation
    - sysmon
    - execution
    - privilege_escalation
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Dd][Ll][Ll][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_parentCommandLine:/.* \/[Pp][Rr][Oo][Cc][Ee][Ss][Ss][Ii][Dd]:\{3[Ee]5[Ff][Cc]7[Ff]9-9[Aa]51-4367-9063-[Aa]120244[Ff][Bb][Ee][Cc]7\}.*/ OR data_win_eventdata_parentCommandLine:/.* \/[Pp][Rr][Oo][Cc][Ee][Ss][Ss][Ii][Dd]:\{3[Ee]000[Dd]72-[Aa]845-4[Cc][Dd]9-[Bb][Dd]83-80[Cc]07[Cc]3[Bb]881[Ff]\}.*/ OR data_win_eventdata_parentCommandLine:/.* \/[Pp][Rr][Oo][Cc][Ee][Ss][Ss][Ii][Dd]:\{[Bb][Dd]54[Cc]901-076[Bb]-434[Ee]-[Bb]6[Cc]7-17[Cc]531[Ff]4[Aa][Bb]41\}.*/ OR data_win_eventdata_parentCommandLine:/.* \/[Pp][Rr][Oo][Cc][Ee][Ss][Ss][Ii][Dd]:\{[Dd]2[Ee]7041[Bb]-2927-42[Ff][Bb]-8[Ee]9[Ff]-7[Cc][Ee]93[Bb]6[Dd][Cc]937\}.*/ OR data_win_eventdata_parentCommandLine:/.* \/[Pp][Rr][Oo][Cc][Ee][Ss][Ss][Ii][Dd]:\{[Ee]9495[Bb]87-[Dd]950-4[Aa][Bb]5-87[Aa]5-[Ff][Ff]6[Dd]70[Bb][Ff]3[Ee]90\}.*/) AND (data_win_eventdata_integrityLevel:/[Hh][Ii][Gg][Hh]/ OR data_win_eventdata_integrityLevel:/[Ss][Yy][Ss][Tt][Ee][Mm]/ OR data_win_eventdata_integrityLevel:/[Ss]-1-16-16384/ OR data_win_eventdata_integrityLevel:/[Ss]-1-16-12288/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e66779cc-383e-4224-a3a4-267eeb585c40
    name: Bypass UAC via CMSTP
    reason: cmstp.exe with an INF is what typically triggers the auto-elevated CMSTPLUA COM object; precursor in the same chain.
  - id: 7d4cdc5a-0076-40ca-aac8-f7e714570e47
    name: CMSTP Execution Process Creation
    reason: cmstp.exe-spawned children are the other face of this bypass; both fire in the same chain when cmstp is the trigger.
  - id: d38d2fa4-98e6-4a24-aff1-410b0c9ad177
    name: HackTool - UACMe Akagi Execution
    reason: UACMe methods 41/43/58/65 are the exact CMSTP COM objects named in this rule; Akagi execution identifies the tool.
  - id: 49f2f17b-b4c8-4172-a68b-d5bf95d05130
    name: UAC Bypass via ICMLuaUtil
    reason: Another auto-elevated COM (ICMLuaUtil) UAC bypass via dllhost; operators chain COM-based bypasses and fall back between them.
  - id: e7888eb1-13b0-4616-bd99-4bc0c2b054b9
    name: Dllhost.EXE Execution Anomaly
    reason: Anomalous dllhost.exe activity is the host process of the abused COM objects; corroborates the elevation pivot.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Children of dllhost.exe COM surrogate (elevated shells/scripts)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Dd][Ll][Ll][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Ii][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]/)
    pivot_on: host
    window: 1h
  - name: High/System-integrity recon or shell right after the bypass
    query: data_win_system_eventID:"1" AND data_win_eventdata_integrityLevel:/[Hh][Ii][Gg][Hh]|[Ss][Yy][Ss][Tt][Ee][Mm]/ AND (data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Nn][Ee][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Nn][Ee][Tt]1\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Hh][Oo][Aa][Mm][Ii]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Ee][Gg]\.[Ee][Xx][Ee]/)
    pivot_on: host
    window: 1h
  - name: Defender tampering or exclusions after elevation
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Aa][Dd][Dd]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee][Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Ee][Xx][Cc][Ll][Uu][Ss][Ii][Oo][Nn][Pp][Aa][Tt][Hh].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc] [Ss][Tt][Oo][Pp] [Ww][Ii][Nn][Dd][Ee][Ff][Ee][Nn][Dd].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt][Ss][Hh] [Aa][Dd][Vv][Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll].*/)
    pivot_on: host
    window: 2h
  - name: Persistence and account creation by elevated process
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Nn][Ee][Tt] [Uu][Ss][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt] [Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp] [Aa][Dd][Mm][Ii][Nn][Ii][Ss][Tt][Rr][Aa][Tt][Oo][Rr][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss] /[Cc][Rr][Ee][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc] [Cc][Rr][Ee][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/)
    pivot_on: host
    window: 4h
