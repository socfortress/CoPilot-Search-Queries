name: TropicTrooper Campaign November 2018
id: 8c7090c3-e0a0-4944-bd08-08c3a0cecf79
version: 1
schema_version: "1.0"
date: "2020-08-27"
author: "@41thexplorer, Microsoft Defender ATP"
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 8c7090c3-e0a0-4944-bd08-08c3a0cecf79
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: production
type: TTP

description: >
  Detects TropicTrooper activity, an actor who targeted high-profile
  organizations in the energy and food and beverage sectors in Asia. MITRE
  ATT&CK: T1059.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*abCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCc*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*abCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCc*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.microsoft.com/en-us/security/blog/2018/11/28/windows-defender-atp-device-risk-score-exposes-new-cyberattack-drives-conditional-access-to-protect-networks/
  - https://attack.mitre.org/techniques/T1059/001/

response:
  message: >
    TropicTrooper Campaign November 2018 detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1059.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
  custom_tags:
    - tropictrooper
    - campaign
    - november
    - process_creation
    - sysmon
    - execution
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Aa][Bb][Cc][Cc][Cc][Cc][Cc][Cc][Cc][Cc][Cc][Cc][Cc][Cc][Cc][Cc][Cc][Cc][Cc][Cc][Cc][Cc][Cc][Cc][Cc][Cc][Cc][Cc][Cc][Cc][Cc][Cc][Cc][Cc][Cc][Cc][Cc][Cc][Cc][Cc][Cc][Cc][Cc][Cc][Cc][Cc][Cc][Cc][Cc].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e32d4572-9826-4738-b651-95fa63747e8a
    name: Base64 Encoded PowerShell Command Detected
    reason: TropicTrooper delivers via obfuscated PowerShell; encoded commands on the same host are the loader stage around the marker string.
  - id: 88f680b8-070e-402c-ae11-d2914f2257f1
    name: PowerShell Base64 Encoded IEX Cmdlet
    reason: Encoded IEX is the in-memory execution step that typically follows the staged PowerShell this rule matches.
  - id: 62b7ccc9-23b4-471e-aa15-6da3663c4d59
    name: PowerShell Base64 Encoded Reflective Assembly Load
    reason: Reflective assembly loading is the common next step when a PowerShell stager pulls the backdoor payload into memory.
  - id: c4eeeeae-89f4-43a7-8b48-8d1bdfa66c78
    name: Scheduled Task Executing Encoded Payload from Registry
    reason: Persistence for fileless PowerShell payloads usually follows initial execution on the same host.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Encoded or download-cradle PowerShell on host
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND data_win_eventdata_commandLine:(/.*[Ee]nc.*/ OR /.*[Ii][Ee][Xx].*/ OR /.*[Dd]ownload[Ss]tring.*/ OR /.*[Ff]rom[Bb]ase64.*/)
    pivot_on: host
    window: 4h
  - name: Scheduled task or Run key persistence
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ss]chtasks.*[Cc]reate.*/ OR /.*CurrentVersion.Run.*/)
    pivot_on: host
    window: 4h
  - name: Outbound connections by script interpreters
    query: data_win_system_eventID:3 AND data_win_eventdata_image:(/.*[Pp]ower[Ss]hell.*/ OR /.*wscript.*/ OR /.*cscript.*/ OR /.*mshta.*/) AND data_win_eventdata_initiated:true
    pivot_on: host
    window: 4h
  - name: Discovery commands after execution
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ww]hoami.*/ OR /.*[Ss]ysteminfo.*/ OR /.*[Nn]et[ ]+(user|group|view).*/ OR /.*[Ii]pconfig.*/)
    pivot_on: host
    window: 2h
