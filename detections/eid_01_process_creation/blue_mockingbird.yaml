name: Blue Mockingbird
id: c3198a27-23a0-4c2c-af19-e5328d49680e
version: 1
schema_version: "1.0"
date: "2022-10-09"
author: Trent Liffick (@tliffick)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: c3198a27-23a0-4c2c-af19-e5328d49680e
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Attempts to detect system changes made by Blue Mockingbird. MITRE ATT&CK:
  T1112, T1047.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\cmd.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*sc config*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*wercplsupporte.dll*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\wmic.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*COR_PROFILER"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches '*\cmd.exe';
  data_win_eventdata_commandLine matches '*sc config*';
  data_win_eventdata_commandLine matches '*wercplsupporte.dll*', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://redcanary.com/blog/blue-mockingbird-cryptominer/
  - https://attack.mitre.org/techniques/T1112/
  - https://attack.mitre.org/techniques/T1047/

response:
  message: >
    Blue Mockingbird detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1112, T1047
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
    - T1047
  custom_tags:
    - mockingbird
    - process_creation
    - sysmon
    - persistence
    - execution
    - defense_impairment
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Ss][Cc] [Cc][Oo][Nn][Ff][Ii][Gg].*/ AND data_win_eventdata_commandLine:/.*[Ww][Ee][Rr][Cc][Pp][Ll][Ss][Uu][Pp][Pp][Oo][Rr][Tt][Ee]\.[Dd][Ll][Ll].*/) OR (data_win_eventdata_image:/.*\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Cc][Oo][Rr]_[Pp][Rr][Oo][Ff][Ii][Ll][Ee][Rr]/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 38879043-7e1e-47a9-8d46-6bec88e201df
    name: Potential Persistence Attempt Via Existing Service Tampering
    reason: Blue Mockingbird hijacks existing service config (sc config to a rogue DLL); this detects the same service-tampering persistence.
  - id: 85c312b7-f44d-4a51-a024-d671c40b49fc
    name: Service StartupType Change Via Sc.EXE
    reason: sc.exe service config change is the persistence mechanism used with wercplsupporte.dll.
  - id: 9b0b7ac3-6223-47aa-a3fd-e8f211e637db
    name: Changing Existing Service ImagePath Value Via Reg.EXE
    reason: 'Service ImagePath modification via reg.exe: alternate way to repoint a service to attacker code.'
  - id: a7ee1722-c3c5-aeff-3212-c777e4733217
    name: Disable Windows Defender AV Security Monitoring
    reason: Campaign payload (XMRig miner) is usually preceded by Defender being disabled.
  - id: c148a894-dd93-11eb-bf2a-acde48001122
    name: Powershell Disable Security Monitoring
    reason: PowerShell disabling security monitoring commonly accompanies the miner's installation phase.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: COR_PROFILER env/registry setup
    query: (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Cc][Oo][Rr]_[Pp][Rr][Oo][Ff][Ii][Ll][Ee][Rr].*/) OR (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Cc][Oo][Rr]_[Pp][Rr][Oo][Ff][Ii][Ll][Ee][Rr].*/)
    pivot_on: host
    window: 24h
  - name: Service config/creation changes
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Cc](\.[Ee][Xx][Ee])? +(config|create).*/ OR data_win_eventdata_commandLine:/.*[Nn]ew-[Ss]ervice.*/)
    pivot_on: host
    window: 24h
  - name: Service DLL / ImagePath registry modification
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Ss]ervices\\.*(ImagePath|ServiceDll)/
    pivot_on: host
    window: 24h
  - name: Cryptominer indicators
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Xx][Mm][Rr][Ii][Gg].*/ OR data_win_eventdata_commandLine:/.*stratum\+.*/ OR data_win_eventdata_commandLine:/.*[Mm]onero.*/ OR data_win_eventdata_commandLine:/.*--donate-level.*/)
    pivot_on: host
    window: 24h
  - name: WMIC process call create
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Pp]rocess +[Cc]all +[Cc]reate.*/
    pivot_on: host
    window: 24h
