name: HackTool - SharPersist Execution
id: 26488ad0-f9fd-4536-876f-52fea846a2e4
version: 1
schema_version: "1.0"
date: "2023-02-04"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 26488ad0-f9fd-4536-876f-52fea846a2e4
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of the hacktool SharPersist - used to deploy various
  different kinds of persistence mechanisms. MITRE ATT&CK: T1053.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\SharPersist.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_product:
                    value: "SharPersist"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -t schtask -c *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -t startupfolder -c *"
                    case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* -t reg -c *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* -m add*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* -t service -c *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* -m add*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* -t schtask -c *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* -m add*"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_product
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\SharPersist.exe'; data_win_eventdata_product equals 'SharPersist';
  data_win_eventdata_commandLine matches '* -t schtask -c *', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.mandiant.com/resources/blog/sharpersist-windows-persistence-toolkit
  - https://github.com/mandiant/SharPersist
  - https://attack.mitre.org/techniques/T1053/

response:
  message: >
    HackTool - SharPersist Execution detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_product: $data_win_eventdata_product$. MITRE ATT&CK:
    T1053
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_product
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1053
  custom_tags:
    - hacktool
    - sharpersist
    - process_creation
    - sysmon
    - privilege_escalation
    - execution
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ss][Hh][Aa][Rr][Pp][Ee][Rr][Ss][Ii][Ss][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_product:/[Ss][Hh][Aa][Rr][Pp][Ee][Rr][Ss][Ii][Ss][Tt]/ OR data_win_eventdata_commandLine:/.* -[Tt] [Ss][Cc][Hh][Tt][Aa][Ss][Kk] -[Cc] .*/ OR data_win_eventdata_commandLine:/.* -[Tt] [Ss][Tt][Aa][Rr][Tt][Uu][Pp][Ff][Oo][Ll][Dd][Ee][Rr] -[Cc] .*/ OR (data_win_eventdata_commandLine:/.* -[Tt] [Rr][Ee][Gg] -[Cc] .*/ AND data_win_eventdata_commandLine:/.* -[Mm] [Aa][Dd][Dd].*/) OR (data_win_eventdata_commandLine:/.* -[Tt] [Ss][Ee][Rr][Vv][Ii][Cc][Ee] -[Cc] .*/ AND data_win_eventdata_commandLine:/.* -[Mm] [Aa][Dd][Dd].*/) OR (data_win_eventdata_commandLine:/.* -[Tt] [Ss][Cc][Hh][Tt][Aa][Ss][Kk] -[Cc] .*/ AND data_win_eventdata_commandLine:/.* -[Mm] [Aa][Dd][Dd].*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: de587dce-915e-4218-aac4-835ca6af6f70
    name: Potential Persistence Attempt Via Run Keys Using Reg.EXE
    reason: SharPersist reg mode adds Run key values; reg.exe Run key persistence is the manual equivalent
  - id: 24357373-078f-44ed-9ac4-6d334a668a11
    name: Direct Autorun Keys Modification
    reason: Direct autorun key modification is the registry artifact SharPersist reg/hklmrun produces
  - id: 89ca78fd-b37c-4310-b3d3-81a023f83936
    name: Schtasks Creation Or Modification With SYSTEM Privileges
    reason: SYSTEM-level scheduled task creation is the privileged form of SharPersist schtask
  - id: 81325ce1-be01-4250-944f-b4789644556f
    name: Schedule Task Creation From Env Variable Or Potentially Suspicious Path Via Schtasks.EXE
    reason: Scheduled tasks pointing to suspicious paths or env variables usually carry the SharPersist payload
  - id: 8a8379b8-780b-4dbf-b1e9-31c8d112fefb
    name: Schtasks From Suspicious Folders
    reason: Schtasks launched from suspicious folders accompanies dropper-planted persistence
  - id: 56c217c3-2de2-479b-990f-5c109ba8458f
    name: HackTool - Default PowerSploit/Empire Scheduled Task Creation
    reason: 'Default PowerSploit/Empire scheduled task creation: the same persistence tradecraft family'
  - id: 38879043-7e1e-47a9-8d46-6bec88e201df
    name: Potential Persistence Attempt Via Existing Service Tampering
    reason: Existing service tampering is the service-mode persistence variant
  - id: f91e51c9-f344-4b32-969b-0b6f6b8537d4
    name: Renamed Schtasks Execution
    reason: Renamed schtasks is evasion used alongside persistence tooling
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Scheduled task registered or modified
    query: (data_win_system_eventID:"4698" OR data_win_system_eventID:"4702")
    pivot_on:
    - host
    window: 4h
  - name: Schtasks create/modify command lines
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee])/ AND data_win_eventdata_commandLine:/.*\/([Cc][Rr][Ee][Aa][Tt][Ee]|[Cc][Hh][Aa][Nn][Gg][Ee]).*/
    pivot_on:
    - host
    window: 4h
  - name: Run key or Startup folder persistence written
    query: (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\([Rr][Uu][Nn]|[Rr][Uu][Nn][Oo][Nn][Cc][Ee])\\.*/) OR (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\[Ss][Tt][Aa][Rr][Tt] [Mm][Ee][Nn][Uu]\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Ss]\\[Ss][Tt][Aa][Rr][Tt][Uu][Pp]\\.*/)
    pivot_on:
    - host
    window: 4h
  - name: New service installed
    query: (data_win_system_eventID:"7045" OR data_win_system_eventID:"4697")
    pivot_on:
    - host
    window: 4h
  - name: Script interpreters launched by the Task Scheduler service
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentCommandLine:/.*-[Ss] [Ss][Cc][Hh][Ee][Dd][Uu][Ll][Ee].*/ AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|[Cc][Mm][Dd]\.[Ee][Xx][Ee]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 4h
