name: Suspicious Execution of Powershell with Base64
id: fb843269-508c-4b76-8b8d-88679db22ce7
version: 1
schema_version: "1.0"
date: "2023-01-05"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: fb843269-508c-4b76-8b8d-88679db22ce7
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Commandline to launch powershell with a base64 payload. MITRE ATT&CK:
  T1059.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\powershell.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\pwsh.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -e *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -en *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -enc *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -enco*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -ec *"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_commandLine"
        - exists:
            field: "data_win_eventdata_parentImage"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* -Encoding *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_parentImage:
                          value: "*C:\\\\Packages\\\\Plugins\\\\Microsoft.GuestConfiguration.ConfigurationforWindows\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_parentImage:
                          value: "*\\\\gc_worker.exe*"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\powershell.exe'; data_win_eventdata_image matches '*\pwsh.exe';
  data_win_eventdata_commandLine matches '* -e *', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1059.001/T1059.001.md#atomic-test-20---powershell-invoke-known-malicious-cmdlets
  - https://unit42.paloaltonetworks.com/unit42-pulling-back-the-curtains-on-encodedcommand-powershell-attacks/
  - https://mikefrobbins.com/2017/06/15/simple-obfuscation-with-powershell-using-base64-encoding/
  - https://attack.mitre.org/techniques/T1059/001/

response:
  message: >
    Suspicious Execution of Powershell with Base64 detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
    MITRE ATT&CK: T1059.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
  custom_tags:
    - powershell
    - base64
    - process_creation
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.* -[Ee] .*/ OR data_win_eventdata_commandLine:/.* -[Ee][Nn] .*/ OR data_win_eventdata_commandLine:/.* -[Ee][Nn][Cc] .*/ OR data_win_eventdata_commandLine:/.* -[Ee][Nn][Cc][Oo].*/ OR data_win_eventdata_commandLine:/.* -[Ee][Cc] .*/) AND _exists_:data_win_eventdata_commandLine AND _exists_:data_win_eventdata_parentImage AND NOT (data_win_eventdata_commandLine:/.* -[Ee][Nn][Cc][Oo][Dd][Ii][Nn][Gg] .*/ OR data_win_eventdata_parentImage:/.*[Cc]:\\[Pp][Aa][Cc][Kk][Aa][Gg][Ee][Ss]\\[Pp][Ll][Uu][Gg][Ii][Nn][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\.[Gg][Uu][Ee][Ss][Tt][Cc][Oo][Nn][Ff][Ii][Gg][Uu][Rr][Aa][Tt][Ii][Oo][Nn]\.[Cc][Oo][Nn][Ff][Ii][Gg][Uu][Rr][Aa][Tt][Ii][Oo][Nn][Ff][Oo][Rr][Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\.*/ OR data_win_eventdata_parentImage:/.*\\[Gg][Cc]_[Ww][Oo][Rr][Kk][Ee][Rr]\.[Ee][Xx][Ee].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e32d4572-9826-4738-b651-95fa63747e8a
    name: Base64 Encoded PowerShell Command Detected
    reason: Same encoded-command launch family, flagging the payload content once decoded.
  - id: 88f680b8-070e-402c-ae11-d2914f2257f1
    name: PowerShell Base64 Encoded IEX Cmdlet
    reason: Encoded payload containing Invoke-Expression means a download-and-execute stager.
  - id: 62b7ccc9-23b4-471e-aa15-6da3663c4d59
    name: PowerShell Base64 Encoded Reflective Assembly Load
    reason: Encoded reflective loading means an in-memory .NET implant follows.
  - id: c6fb44c6-71f5-49e6-9462-1425d328aee3
    name: Powershell Base64 Encoded MpPreference Cmdlet
    reason: Encoded Defender exclusion or disable commands are a common first action of the payload.
  - id: 754ed792-634f-40ae-b3bc-e0448d33f695
    name: Suspicious PowerShell Parent Process
    reason: The parent that spawned encoded PowerShell (Office, WMI, script host) identifies the initial access vector.
  - id: 692f0bec-83ba-4d04-af7e-e884a96059b6
    name: Potential WMI Lateral Movement WmiPrvSE Spawned PowerShell
    reason: Encoded PowerShell from WmiPrvSE indicates remote lateral movement delivering the payload.
  - id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
    name: PowerShell Download and Execution Cradles
    reason: The decoded command is often a download cradle fetching the next stage.
  - id: 30edb182-aa75-42c0-b0a9-e998bb29067c
    name: Potential AMSI Bypass Via .NET Reflection
    reason: Encoded loaders disable AMSI before running the payload, producing this follow-on.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Children spawned by encoded PowerShell
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*\\\\(powershell|pwsh)\.exe/ AND data_win_eventdata_parentCommandLine:/.* -([Ee]|[Ee][Nn]|[Ee][Nn][Cc].*|[Ee][Cc]) .*/
    pivot_on: host
    window: 2h
  - name: PowerShell outbound network connections
    query: data_win_system_eventID:3 AND data_win_eventdata_initiated:true AND data_win_eventdata_image:/.*\\\\(powershell|pwsh)\.exe/
    pivot_on: host
    window: 2h
  - name: Persistence and scheduled execution
    query: (data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*[Ss]chtasks.*\/[Cc]reate.*/ OR data_win_eventdata_commandLine:/.*[Rr]eg(\.exe)? +add.*\\\\[Rr]un.*/)) OR (data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*\\\\(Run|RunOnce)\\\\.*/)
    pivot_on: host
    window: 4h
  - name: Defender tampering and credential tooling
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*([Ss]et-[Mm]p[Pp]reference|[Aa]dd-[Mm]p[Pp]reference|[Dd]isable[Rr]ealtime).*/ OR data_win_eventdata_commandLine:/.*(comsvcs.*MiniDump|procdump.*lsass|sekurlsa|[Ii]nvoke-[Mm]imikatz).*/)
    pivot_on: host
    window: 4h
  - name: Other encoded PowerShell by same user
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*\\\\(powershell|pwsh)\.exe/ AND data_win_eventdata_commandLine:/.* -([Ee]|[Ee][Nn]|[Ee][Nn][Cc].*|[Ee][Cc]) .*/
    pivot_on: user
    window: 24h
