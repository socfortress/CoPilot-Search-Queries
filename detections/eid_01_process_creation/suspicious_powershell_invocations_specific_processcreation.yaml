name: Suspicious PowerShell Invocations - Specific - ProcessCreation
id: 536e2947-3729-478c-9903-745aaffe60d2
version: 1
schema_version: "1.0"
date: "2023-01-05"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 536e2947-3729-478c-9903-745aaffe60d2
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious PowerShell invocation command parameters.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*-nop*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* -w *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*hidden*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* -c *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*[Convert]::FromBase64String*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* -w *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*hidden*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*-noni*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*-nop*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* -c *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*iex*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*New-Object*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* -w *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*hidden*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*-ep*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*bypass*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*-Enc*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*powershell*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*reg*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*add*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*\\\\software\\\\*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*bypass*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*-noprofile*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*-windowstyle*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*hidden*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*new-object*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*system.net.webclient*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*.download*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*iex*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*New-Object*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*Net.WebClient*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*.Download*"
                          case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_commandLine"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*(New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*Write-ChocolateyWarning*"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*-nop*'; data_win_eventdata_commandLine matches '* -w *';
  data_win_eventdata_commandLine matches '*hidden*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - Internal Research

response:
  message: >
    Suspicious PowerShell Invocations - Specific - ProcessCreation detected on
    host $agent_name$. Matched data_win_eventdata_commandLine:
    $data_win_eventdata_commandLine$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - powershell
    - invocations
    - specific
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND ((data_win_eventdata_commandLine:/.*-[Nn][Oo][Pp].*/ AND data_win_eventdata_commandLine:/.* -[Ww] .*/ AND data_win_eventdata_commandLine:/.*[Hh][Ii][Dd][Dd][Ee][Nn].*/ AND data_win_eventdata_commandLine:/.* -[Cc] .*/ AND data_win_eventdata_commandLine:/.*\[[Cc][Oo][Nn][Vv][Ee][Rr][Tt]\]::[Ff][Rr][Oo][Mm][Bb][Aa][Ss][Ee]64[Ss][Tt][Rr][Ii][Nn][Gg].*/) OR (data_win_eventdata_commandLine:/.* -[Ww] .*/ AND data_win_eventdata_commandLine:/.*[Hh][Ii][Dd][Dd][Ee][Nn].*/ AND data_win_eventdata_commandLine:/.*-[Nn][Oo][Nn][Ii].*/ AND data_win_eventdata_commandLine:/.*-[Nn][Oo][Pp].*/ AND data_win_eventdata_commandLine:/.* -[Cc] .*/ AND data_win_eventdata_commandLine:/.*[Ii][Ee][Xx].*/ AND data_win_eventdata_commandLine:/.*[Nn][Ee][Ww]-[Oo][Bb][Jj][Ee][Cc][Tt].*/) OR (data_win_eventdata_commandLine:/.* -[Ww] .*/ AND data_win_eventdata_commandLine:/.*[Hh][Ii][Dd][Dd][Ee][Nn].*/ AND data_win_eventdata_commandLine:/.*-[Ee][Pp].*/ AND data_win_eventdata_commandLine:/.*[Bb][Yy][Pp][Aa][Ss][Ss].*/ AND data_win_eventdata_commandLine:/.*-[Ee][Nn][Cc].*/) OR (data_win_eventdata_commandLine:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ AND data_win_eventdata_commandLine:/.*[Rr][Ee][Gg].*/ AND data_win_eventdata_commandLine:/.*[Aa][Dd][Dd].*/ AND data_win_eventdata_commandLine:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\.*/) OR (data_win_eventdata_commandLine:/.*[Bb][Yy][Pp][Aa][Ss][Ss].*/ AND data_win_eventdata_commandLine:/.*-[Nn][Oo][Pp][Rr][Oo][Ff][Ii][Ll][Ee].*/ AND data_win_eventdata_commandLine:/.*-[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Tt][Yy][Ll][Ee].*/ AND data_win_eventdata_commandLine:/.*[Hh][Ii][Dd][Dd][Ee][Nn].*/ AND data_win_eventdata_commandLine:/.*[Nn][Ee][Ww]-[Oo][Bb][Jj][Ee][Cc][Tt].*/ AND data_win_eventdata_commandLine:/.*[Ss][Yy][Ss][Tt][Ee][Mm]\.[Nn][Ee][Tt]\.[Ww][Ee][Bb][Cc][Ll][Ii][Ee][Nn][Tt].*/ AND data_win_eventdata_commandLine:/.*\.[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd].*/) OR (data_win_eventdata_commandLine:/.*[Ii][Ee][Xx].*/ AND data_win_eventdata_commandLine:/.*[Nn][Ee][Ww]-[Oo][Bb][Jj][Ee][Cc][Tt].*/ AND data_win_eventdata_commandLine:/.*[Nn][Ee][Tt]\.[Ww][Ee][Bb][Cc][Ll][Ii][Ee][Nn][Tt].*/ AND data_win_eventdata_commandLine:/.*\.[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd].*/)) AND _exists_:data_win_eventdata_commandLine AND NOT (data_win_eventdata_commandLine:/.*\([Nn][Ee][Ww]-[Oo][Bb][Jj][Ee][Cc][Tt] [Ss][Yy][Ss][Tt][Ee][Mm]\.[Nn][Ee][Tt]\.[Ww][Ee][Bb][Cc][Ll][Ii][Ee][Nn][Tt]\)\.[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg]\('[Hh][Tt][Tt][Pp][Ss]:\/\/[Cc][Oo][Mm][Mm][Uu][Nn][Ii][Tt][Yy]\.[Cc][Hh][Oo][Cc][Oo][Ll][Aa][Tt][Ee][Yy]\.[Oo][Rr][Gg]\/[Ii][Nn][Ss][Tt][Aa][Ll][Ll]\.[Pp][Ss]1.*/ OR data_win_eventdata_commandLine:/.*[Ww][Rr][Ii][Tt][Ee]-[Cc][Hh][Oo][Cc][Oo][Ll][Aa][Tt][Ee][Yy][Ww][Aa][Rr][Nn][Ii][Nn][Gg].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 36210e0d-5b19-485d-a087-c096088885f0
    name: Suspicious PowerShell Parameter Substring
    reason: Abbreviated or substring parameters (-nop, -w hidden) as used by this rule, seen on the same launch.
  - id: 9be56c82-b1cc-4318-87eb-d138afaaca39
    name: Malicious PowerShell Process - Execution Policy Bypass
    reason: Execution policy bypass flags typically accompany these stealth parameters.
  - id: 3b6ab547-8ec2-4991-b9d2-2b06702a48d7
    name: PowerShell Download Pattern
    reason: 'Download pattern in the same command line: the cradle half of the invocation.'
  - id: ee18ed37-0802-4268-9435-b3b91aaa18db
    name: PowerShell - Connect To Internet With Hidden Window
    reason: Hidden-window PowerShell reaching the internet is the network outcome of these invocations.
  - id: ca2092a1-c273-4878-9b4b-0d60115bf5ea
    name: Suspicious Encoded PowerShell Command Line
    reason: Encoded command line variant of the same stealth launch.
  - id: 79f4ede3-402e-41c8-bc3e-ebbf5f162581
    name: HackTool - Empire PowerShell Launch Parameters
    reason: Empire launcher parameters match several patterns in this rule (-nop -w hidden -enc).
  - id: c4eeeeae-89f4-43a7-8b48-8d1bdfa66c78
    name: Scheduled Task Executing Encoded Payload from Registry
    reason: The reg add branch stores an encoded payload; this shows a scheduled task executing it.
  - id: a6a39bdb-935c-4f0a-ab77-35f4bbf44d33
    name: Potentially Suspicious Powershell Script Execution From Temp Folder
    reason: PowerShell script run from Temp is a common follow-on stage.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Registry-stored payload written by PowerShell
    query: data_win_system_eventID:"13" AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh])\.[Ee][Xx][Ee]/ AND data_win_eventdata_targetObject:/.*\\[Ss]oftware\\.*/
    pivot_on: host
    window: 2h
  - name: Scheduled task running PowerShell
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee].*([Pp]ower[Ss]hell|[Pp]wsh).*/
    pivot_on: host
    window: 4h
  - name: Download cradle in script blocks
    query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*([Nn]et\.[Ww]eb[Cc]lient|[Dd]ownload[Ss]tring|[Dd]ownload[Ff]ile|[Ii]nvoke-[Ww]eb[Rr]equest).*/
    pivot_on: host
    window: 2h
  - name: Outbound connections by PowerShell
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh])\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 1h
  - name: Defender exclusion or tampering from PowerShell
    query: data_win_system_eventID:"4104" AND data_win_eventdata_scriptBlockText:/.*([Aa]dd-[Mm]p[Pp]reference|[Ss]et-[Mm]p[Pp]reference|[Dd]isable[Rr]ealtime[Mm]onitoring).*/
    pivot_on: host
    window: 4h
