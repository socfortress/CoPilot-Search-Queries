name: RunMRU Registry Key Deletion
id: c11aecef-9c37-45a6-9c07-bc0782f963fd
version: 1
schema_version: "1.0"
date: "2025-09-25"
author: Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: c11aecef-9c37-45a6-9c07-bc0782f963fd
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects deletion of the RunMRU registry key, which stores the history of
  commands executed via the Run dialog. In the clickfix techniques, the phishing
  lures instruct users to open a run dialog through (Win + R) and execute
  malicious commands. Adversaries may delete this key to cover their tracks
  after executing commands. MITRE ATT&CK: T1070.003.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\reg.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "reg.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* del*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*\\\\Software\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Explorer\\\\RunMRU*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches '*\reg.exe';
  data_win_eventdata_originalFileName equals 'reg.exe';
  data_win_eventdata_commandLine matches '* del*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.zscaler.com/blogs/security-research/coldriver-updates-arsenal-baitswitch-and-simplefix
  - https://attack.mitre.org/techniques/T1070/003/

response:
  message: >
    RunMRU Registry Key Deletion detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1070.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1070.003
  custom_tags:
    - runmru
    - registry
    - deletion
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Rr][Ee][Gg]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Rr][Ee][Gg]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.* [Dd][Ee][Ll].*/ AND data_win_eventdata_commandLine:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\\[Rr][Uu][Nn][Mm][Rr][Uu].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c4db14d9-7909-48b4-a054-aa14d89dbb19
    name: Malicious PowerShell Process - Encoded Command
    reason: ClickFix lures paste an encoded PowerShell command into Win+R; that command is the payload whose RunMRU trace is then erased.
  - id: 9b3af1e6-5b68-11eb-ae93-0242ac130002
    name: Detect MSHTA Url in Command Line
    reason: ClickFix Run-dialog commands commonly invoke mshta with a remote URL; precursor to the history wipe.
  - id: 9cc85849-3b02-4cb5-b371-3a1ff54f2218
    name: File Download From IP URL Via Curl.EXE
    reason: The pasted command often downloads the next stage via curl before cleanup.
  - id: de587dce-915e-4218-aac4-835ca6af6f70
    name: Potential Persistence Attempt Via Run Keys Using Reg.EXE
    reason: 'Same reg.exe tradecraft: after covering tracks the actor often sets Run-key persistence.'
  - id: 236e7c8e-c9d9-11eb-a824-acde48001122
    name: Disable Logs Using WevtUtil
    reason: Other anti-forensic cleanup commonly co-occurs with RunMRU deletion.
  - id: ee18ed37-0802-4268-9435-b3b91aaa18db
    name: PowerShell - Connect To Internet With Hidden Window
    reason: Hidden PowerShell stager launched from the Run dialog preceding the cleanup.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Run-dialog launched LOLBin/script interpreters
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Ee]xplorer\.[Ee]xe/ AND (data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ OR data_win_eventdata_image:/.*[Mm]shta.*/ OR data_win_eventdata_image:/.*[Cc]md\.exe/ OR data_win_eventdata_image:/.*[Cc]url\.exe/ OR data_win_eventdata_image:/.*[Ww]script.*/ OR data_win_eventdata_image:/.*[Cc]script.*/ OR data_win_eventdata_image:/.*[Mm]siexec.*/)
    pivot_on: host
    window: 1h
  - name: PowerShell download cradle / encoded command
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND data_win_eventdata_commandLine:/.*(iwr|irm|iex|[Dd]ownload[Ss]tring|[Ii]nvoke-[Ww]eb[Rr]equest|-[Ee]nc|-[Ee]ncodedcommand|[Ff]rom[Bb]ase64[Ss]tring).*/
    pivot_on: host
    window: 1h
  - name: RunMRU or related Explorer history registry changes
    query: data_win_system_eventID:("12" OR "13") AND data_win_eventdata_targetObject:/.*([Rr]un[Mm][Rr][Uu]|[Tt]yped[Pp]aths|[Rr]ecent[Dd]ocs).*/
    pivot_on: host
    window: 2h
  - name: Event-log or history clearing
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*[Ww]evtutil.*/ AND data_win_eventdata_commandLine:/.* (cl|clear-log).*/) OR data_win_eventdata_commandLine:/.*([Cc]lear-[Ee]vent[Ll]og|[Cc]onsole[Hh]ost[Hh]istory).*/)
    pivot_on: host
    window: 2h
  - name: Outbound connections by script interpreters
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ OR data_win_eventdata_image:/.*[Mm]shta.*/ OR data_win_eventdata_image:/.*[Ww]script.*/ OR data_win_eventdata_image:/.*[Cc]script.*/ OR data_win_eventdata_image:/.*[Cc]url\.exe/ OR data_win_eventdata_image:/.*[Rr]undll32.*/)
    pivot_on: host
    window: 1h
