name: Abusing Print Executable
id: bafac3d6-7de9-4dd9-8874-4a1194b493ed
version: 1
schema_version: "1.0"
date: "2022-07-07"
author: Furkan CALISKAN, @caliskanfurkan_, @oscd_initiative
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: bafac3d6-7de9-4dd9-8874-4a1194b493ed
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Attackers can use print.exe for remote file copy. MITRE ATT&CK: T1218.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\print.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "print*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*/D*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*.exe*"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_commandLine"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*print.exe*"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\print.exe'; data_win_eventdata_commandLine matches 'print*';
  data_win_eventdata_commandLine matches '*/D*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://lolbas-project.github.io/lolbas/Binaries/Print/
  - https://twitter.com/Oddvarmoe/status/985518877076541440
  - https://attack.mitre.org/techniques/T1218/

response:
  message: >
    Abusing Print Executable detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1218
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218
  custom_tags:
    - abusing
    - print
    - executable
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Pp][Rr][Ii][Nn][Tt]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/[Pp][Rr][Ii][Nn][Tt].*/ AND data_win_eventdata_commandLine:/.*\/[Dd].*/ AND data_win_eventdata_commandLine:/.*\.[Ee][Xx][Ee].*/ AND _exists_:data_win_eventdata_commandLine AND NOT (data_win_eventdata_commandLine:/.*[Pp][Rr][Ii][Nn][Tt]\.[Ee][Xx][Ee].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 2fcda7e2-8c57-4904-86ac-37fc3157e09d
    name: Sensitive File Dump Via Print.EXE
    reason: Same binary abused to copy sensitive files to a remote UNC target; confirms print.exe used as a data-movement LOLBin.
  - id: 19b08b1c-861d-4e75-a1ef-ea0c1baf202b
    name: Suspicious Download Via Certutil.EXE
    reason: Alternate LOLBin file transfer (certutil) commonly used alongside print.exe to stage the same payload.
  - id: d059842b-6b9d-4ed1-b5c3-5b89143c6ede
    name: File Download Via Bitsadmin
    reason: Bitsadmin download is a sibling remote-file-fetch technique; co-occurrence suggests payload staging.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: print.exe executions with /D target
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Pp]rint\.exe/
    pivot_on: host
    window: 4h
  - name: Executables launched from user-writable paths after copy
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*[Pp]rogram[Dd]ata.*/ OR data_win_eventdata_image:/.*[Tt]emp.*/ OR data_win_eventdata_image:/.*[Pp]ublic.*/)
    pivot_on: host
    window: 2h
  - name: Other LOLBin transfer tools
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*[Cc]ertutil\.exe/ OR data_win_eventdata_image:/.*[Bb]itsadmin\.exe/ OR data_win_eventdata_image:/.*[Ee]xpand\.exe/ OR data_win_eventdata_image:/.*[Ee]xtrac32\.exe/)
    pivot_on: host
    window: 4h
  - name: Files created in staging directories
    query: data_win_system_eventID:11 AND (data_win_eventdata_targetFilename:/.*[Pp]rogram[Dd]ata.*\.exe/ OR data_win_eventdata_targetFilename:/.*[Tt]emp.*\.(exe|dll)/)
    pivot_on: host
    window: 2h
