name: Windows PowerShell Connect To Internet With Hidden Window
id: windows-powershell-connect-to-internet-with-hidden-window-001
version: 1
schema_version: "1.0"
date: "2026-02-12"
author: SOCFortress LLC
status: production
type: Hunting

description: >
  Detects PowerShell commands using the WindowStyle parameter to hide the window, 
  which is often used to conceal malicious activity. This technique attempts to bypass 
  default PowerShell execution policies and run commands stealthily. Used by AgentTesla, 
  HAFNIUM Group, Hermetic Wiper, and Log4Shell exploitation chains.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image: "*powershell*"
              - wildcard:
                  data_win_eventdata_image: "*pwsh*"
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine: "*-WindowStyle*hidden*"
              - wildcard:
                  data_win_eventdata_commandLine: "*-w hidden*"
              - wildcard:
                  data_win_eventdata_commandLine: "*-win hid*"
              - wildcard:
                  data_win_eventdata_commandLine: "*-windowst*hid*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-12 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-12 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Windows endpoints with Sysmon 
  installed and configured to log process creation events (EventID 1) with full 
  command-line arguments. The index pattern should match your Wazuh index naming 
  convention.

known_false_positives: >
  Some legitimate processes may use -WindowStyle Hidden for background tasks. 
  Filter based on parent process context and the full command line to determine 
  legitimacy. Common false positives include scheduled tasks and software updaters.

references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://ss64.com/ps/powershell.html
  - https://blog.netlab.360.com/ten-families-of-malicious-samples-are-spreading-using-the-log4j2-vulnerability-now/

response:
  message: >
    PowerShell with hidden window detected on $agent_name$. 
    Command line: $data_win_eventdata_commandLine$. 
    Parent process: $data_win_eventdata_parentImage$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1059.001
  risk_score: 42
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 42
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: parent_process_name

tags:
  analytic_story:
    - AgentTesla
    - HAFNIUM Group
    - Hermetic Wiper
    - Malicious PowerShell
    - Data Destruction
    - Log4Shell CVE-2021-44228
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*powershell.*/ OR data_win_eventdata_image:/.*pwsh.*/) AND (data_win_eventdata_commandLine:/.*\-WindowStyle.*hidden.*/ OR data_win_eventdata_commandLine:/.*\-w\s+hidden.*/ OR data_win_eventdata_commandLine:/.*\-win\s+hid.*/ OR data_win_eventdata_commandLine:/.*\-windowst.*hid.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 30e92f50-bb5a-4884-98b5-d20aa80f3d7a
    name: Hidden Powershell in Link File Pattern
    reason: Phishing LNK delivery is a common way hidden-window PowerShell is launched; same host shortly before.
  - id: e32d4572-9826-4738-b651-95fa63747e8a
    name: Base64 Encoded PowerShell Command Detected
    reason: Hidden-window launches usually carry an encoded payload in the same command line or a sibling process.
  - id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
    name: PowerShell Download and Execution Cradles
    reason: The hidden window typically exists to fetch and run a remote stage; the cradle confirms download intent.
  - id: 02b64f1b-3f33-4e67-aede-ef3b0a5a8fcf
    name: Potential COM Objects Download Cradles Usage - Process Creation
    reason: Alternative stealth download method used by the same loaders when the web client is blocked.
  - id: cf2e938e-9a3e-4fe8-a347-411642b28a9f
    name: Potential PowerShell Execution Policy Tampering - ProcCreation
    reason: Policy bypass flags usually accompany -WindowStyle hidden in loader command lines.
  - id: c148a894-dd93-11eb-bf2a-acde48001122
    name: Powershell Disable Security Monitoring
    reason: 'Follow-on: hidden stage disables Defender before dropping its payload.'
  - id: 17769c90-230e-488b-a463-e05c08e9d48f
    name: Powershell Defender Exclusion
    reason: 'Follow-on: hidden stage excludes its drop path from AV scanning.'
  - id: 24357373-078f-44ed-9ac4-6d334a668a11
    name: Direct Autorun Keys Modification
    reason: Follow-on persistence for the hidden implant on the same host.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Outbound connections from PowerShell
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ OR data_win_eventdata_image:/.*[Pp]wsh.*/) AND data_win_eventdata_initiated:"true"
    pivot_on: host
    window: 2h
  - name: DNS lookups by PowerShell
    query: data_win_system_eventID:"22" AND (data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ OR data_win_eventdata_image:/.*[Pp]wsh.*/)
    pivot_on: host
    window: 2h
  - name: PowerShell download cradle
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ OR data_win_eventdata_image:/.*[Pp]wsh.*/) AND data_win_eventdata_commandLine:/.*([Dd]ownload[Ss]tring|[Dd]ownload[Ff]ile|[Ii]nvoke-[Ww]eb[Rr]equest|[Nn]et\.[Ww]eb[Cc]lient|[Ss]tart-[Bb]its[Tt]ransfer|[Ii]nvoke-[Ee]xpression).*/
    pivot_on: host
    window: 2h
  - name: Child processes spawned by PowerShell
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*[Pp]ower[Ss]hell.*/ OR data_win_eventdata_parentImage:/.*[Pp]wsh.*/) AND data_win_eventdata_image:/.*(cmd|rundll32|regsvr32|mshta|wscript|cscript|certutil|bitsadmin|schtasks|wmic)\.exe/
    pivot_on: host
    window: 2h
  - name: Executable or script dropped to user-writable paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(AppData|ProgramData|Temp|Users.Public).*\.(exe|dll|ps1|bat|vbs|js)/
    pivot_on: host
    window: 2h
