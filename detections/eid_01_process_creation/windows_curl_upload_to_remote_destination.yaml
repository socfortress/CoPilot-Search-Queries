name: Windows Curl Upload to Remote Destination
id: windows-curl-upload-remote-destination-001
version: 1
schema_version: "1.0"
date: "2026-02-23"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects curl.exe used to upload files to remote destinations via -T, 
  --upload-file, -d, --data, or -F flags. Adversaries use curl for data 
  exfiltration and malicious payload uploads. Used in supply chain attacks, 
  ransomware operations, and data theft campaigns.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - wildcard:
            data_win_eventdata_image: "*\\\\curl.exe"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine: "*-T *"
              - wildcard:
                  data_win_eventdata_commandLine: "*--upload-file *"
              - wildcard:
                  data_win_eventdata_commandLine: "*-d *"
              - wildcard:
                  data_win_eventdata_commandLine: "*--data *"
              - wildcard:
                  data_win_eventdata_commandLine: "*-F *"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-23 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-23 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Windows endpoints with Sysmon 
  installed and configured to log process creation events (EventID 1) with full 
  command-line arguments.

known_false_positives: >
  Source control applications and CI/CD pipelines may use curl upload flags 
  legitimately. Filter by user context and destination URL.

references:
  - https://attack.mitre.org/techniques/T1105/
  - https://everything.curl.dev/usingcurl/uploads

response:
  message: >
    Curl upload to remote destination on $agent_name$. 
    Command: $data_win_eventdata_commandLine$. 
    Parent: $data_win_eventdata_parentImage$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1105
  risk_score: 72
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 72
  threat_objects: []

tags:
  analytic_story:
    - Ingress Tool Transfer
    - Compromised Windows Host
    - NPM Supply Chain Compromise
  asset_type: Endpoint
  mitre_attack_id:
    - T1105
  custom_tags:
    - curl
    - upload
    - exfiltration
    - data_transfer
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*curl\.exe/ AND (data_win_eventdata_commandLine:/.*-T .*/ OR data_win_eventdata_commandLine:/.*--upload-file .*/ OR data_win_eventdata_commandLine:/.*-d .*/ OR data_win_eventdata_commandLine:/.*--data .*/ OR data_win_eventdata_commandLine:/.*-F .*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e328cc73-f92a-42fb-b3fa-7c2cffda981a
    name: Curl File Upload To File Sharing Websites
    reason: Same upload primitive aimed at file-sharing sites, the common exfil destination.
  - id: 7d1aaf3d-4304-425c-b7c3-162055e0b3ab
    name: Potential Data Exfiltration Activity Via CommandLine Tools
    reason: Generic command-line exfiltration tooling usually co-occurs with curl uploads.
  - id: aa6f6ea6-0676-40dd-b510-6e46f02d8867
    name: Local File Read Using Curl.EXE
    reason: curl reading local files is how the data being posted is selected.
  - id: 9fbf5927-5261-4284-a71d-f681029ea574
    name: Compress Data and Lock With Password for Exfiltration With 7-ZIP
    reason: 'Precursor: data compressed and password-locked with 7-Zip right before upload.'
  - id: e2e80da2-8c66-4e00-ae3c-2eebd29f6b6d
    name: Compress Data and Lock With Password for Exfiltration With WINZIP
    reason: 'Precursor: WinZip password-protected staging archive prior to exfiltration.'
  - id: ec570e53-4c76-45a9-804d-dc3f355ff7a7
    name: 7Zip Compressing Dump Files
    reason: 'Precursor: dump files archived before being sent out.'
  - id: cb9cc1d1-e84e-4bdc-b7ad-c31b1b7908ec
    name: Insecure Transfer Via Curl.EXE
    reason: Upload over unencrypted HTTP indicates cleartext exfil to attacker infrastructure.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Archive creation before upload
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Rr]ar.* a .*/ OR /.*7z.* a .*/ OR /.*[Cc]ompress-[Aa]rchive.*/ OR /.*[Zz]ip.* -[Pp].*/)
    pivot_on: host
    window: 6h
  - name: Archive files written to disk
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(/.*.7z/ OR /.*.rar/ OR /.*.zip/)
    pivot_on: host
    window: 6h
  - name: Outbound connections from curl
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*curl.exe/
    pivot_on: host
    window: 2h
  - name: Sensitive data collection commands
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Nn]tds.*/ OR /.*[Ll]sass.*/ OR /.*[Rr]eg.* save .*/ OR /.*[Xx]copy.*/ OR /.*[Rr]obocopy.*/)
    pivot_on: host
    window: 6h
  - name: Other exfil tooling
    query: data_win_system_eventID:1 AND data_win_eventdata_image:(/.*[Rr]clone.exe/ OR /.*[Ww]in[Ss][Cc][Pp].*/ OR /.*[Mm]ega.*/ OR /.*[Pp]scp.exe/)
    pivot_on: host
    window: 24h
