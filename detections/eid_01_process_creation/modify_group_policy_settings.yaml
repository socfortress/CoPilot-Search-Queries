name: Modify Group Policy Settings
id: ada4b0c4-758b-46ac-9033-9004613a150d
version: 1
schema_version: "1.0"
date: "2022-08-19"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: ada4b0c4-758b-46ac-9033-9004613a150d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detect malicious GPO modifications can be used to implement many other
  malicious behaviors. MITRE ATT&CK: T1484.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\reg.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "reg.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*\\\\SOFTWARE\\\\Policies\\\\Microsoft\\\\Windows\\\\System*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*GroupPolicyRefreshTimeDC*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*GroupPolicyRefreshTimeOffsetDC*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*GroupPolicyRefreshTime*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*GroupPolicyRefreshTimeOffset*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*EnableSmartScreen*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*ShellSmartScreenLevel*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches '*\reg.exe';
  data_win_eventdata_originalFileName equals 'reg.exe';
  data_win_eventdata_commandLine matches
  '*\SOFTWARE\Policies\Microsoft\Windows\System*', among other conditions.

known_false_positives: >
  Legitimate use. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/40b77d63808dd4f4eafb83949805636735a1fd15/atomics/T1484.001/T1484.001.md
  - https://attack.mitre.org/techniques/T1484/001/

response:
  message: >
    Modify Group Policy Settings detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1484.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1484.001
  custom_tags:
    - modify
    - group
    - policy
    - process_creation
    - sysmon
    - privilege_escalation
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Rr][Ee][Gg]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Rr][Ee][Gg]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Pp][Oo][Ll][Ii][Cc][Ii][Ee][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm].*/ AND (data_win_eventdata_commandLine:/.*[Gg][Rr][Oo][Uu][Pp][Pp][Oo][Ll][Ii][Cc][Yy][Rr][Ee][Ff][Rr][Ee][Ss][Hh][Tt][Ii][Mm][Ee][Dd][Cc].*/ OR data_win_eventdata_commandLine:/.*[Gg][Rr][Oo][Uu][Pp][Pp][Oo][Ll][Ii][Cc][Yy][Rr][Ee][Ff][Rr][Ee][Ss][Hh][Tt][Ii][Mm][Ee][Oo][Ff][Ff][Ss][Ee][Tt][Dd][Cc].*/ OR data_win_eventdata_commandLine:/.*[Gg][Rr][Oo][Uu][Pp][Pp][Oo][Ll][Ii][Cc][Yy][Rr][Ee][Ff][Rr][Ee][Ss][Hh][Tt][Ii][Mm][Ee].*/ OR data_win_eventdata_commandLine:/.*[Gg][Rr][Oo][Uu][Pp][Pp][Oo][Ll][Ii][Cc][Yy][Rr][Ee][Ff][Rr][Ee][Ss][Hh][Tt][Ii][Mm][Ee][Oo][Ff][Ff][Ss][Ee][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ee][Nn][Aa][Bb][Ll][Ee][Ss][Mm][Aa][Rr][Tt][Ss][Cc][Rr][Ee][Ee][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ss][Hh][Ee][Ll][Ll][Ss][Mm][Aa][Rr][Tt][Ss][Cc][Rr][Ee][Ee][Nn][Ll][Ee][Vv][Ee][Ll].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e56d3073-83ff-4021-90fe-c658e0709e72
    name: Gpresult Display Group Policy Information
    reason: Attacker GPO recon (gpresult) typically precedes tampering with policy refresh settings on the same host.
  - id: 05f3c945-dcc8-4393-9f3d-af65077a8f86
    name: Suspicious SYSVOL Domain Group Policy Access
    reason: Reading or altering GPO files in SYSVOL is the sibling step of the same GPO abuse chain.
  - id: 347906f3-e207-4d18-ae5b-a9403d6bcdef
    name: Netsh Allow Group Policy on Microsoft Defender Firewall
    reason: Co-occurring policy/firewall tampering used to push or permit malicious GPO-driven changes.
  - id: 48917adc-a28e-4f5d-b729-11e75da8941f
    name: Suspicious Windows Defender Folder Exclusion Added Via Reg.EXE
    reason: Follow-on defense evasion via reg.exe once policy control is gained.
  - id: 5e95028c-5229-4214-afae-d653d573d0ec
    name: Security Service Disabled Via Reg.EXE
    reason: 'Common next step: disabling security services through the registry after policy manipulation.'
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other reg.exe writes under Policies hives
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*[Rr]eg.*[Aa]dd.*[Pp]olicies.*/
    pivot_on: host
    window: 4h
  - name: GPO recon and management tooling
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*[Gg]presult.*/ OR data_win_eventdata_commandLine:/.*[Gg]pupdate.*/ OR data_win_eventdata_commandLine:/.*[Gg]roup[Pp]olicy.*/)
    pivot_on: host
    window: 4h
  - name: Defender and security tampering
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*([Dd]isable[Aa]nti[Ss]pyware|[Ee]xclusions|[Ss]et-[Mm]p[Pp]reference).*/
    pivot_on: host
    window: 4h
  - name: GPO administration cmdlets by the same user
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*[Gg]et-[Gg][Pp][Oo].*/ OR data_win_eventdata_commandLine:/.*[Nn]ew-[Gg][Pp][Oo].*/ OR data_win_eventdata_commandLine:/.*[Ss]et-[Gg][Pp].*/)
    pivot_on: user
    window: 6h
