name: PUA - Mouse Lock Execution
id: c9192ad9-75e5-43eb-8647-82a0a5b493e3
version: 1
schema_version: "1.0"
date: "2023-02-21"
author: Cian Heasley
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: c9192ad9-75e5-43eb-8647-82a0a5b493e3
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  In Kaspersky's 2020 Incident Response Analyst Report they listed legitimate
  tool "Mouse Lock" as being used for both credential access and collection in
  security incidents. MITRE ATT&CK: T1056.002.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_product:
                    value: "*Mouse Lock*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_company:
                    value: "*Misc314*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Mouse Lock_*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_product
    - data_win_eventdata_company
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_product matches '*Mouse
  Lock*'; data_win_eventdata_company matches '*Misc314*';
  data_win_eventdata_commandLine matches '*Mouse Lock_*'.

known_false_positives: >
  Legitimate uses of Mouse Lock software. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://github.com/klsecservices/Publications/blob/657deb6a6eb6e00669afd40173f425fb49682eaa/Incident-Response-Analyst-Report-2020.pdf
  - https://sourceforge.net/projects/mouselock/
  - https://attack.mitre.org/techniques/T1056/002/

response:
  message: >
    PUA - Mouse Lock Execution detected on host $agent_name$. Matched
    data_win_eventdata_product: $data_win_eventdata_product$. Matched
    data_win_eventdata_company: $data_win_eventdata_company$. MITRE ATT&CK:
    T1056.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_product
      type: other
    - field: data_win_eventdata_company
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1056.002
  custom_tags:
    - mouse
    - process_creation
    - sysmon
    - credential_access
    - collection
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_product:/.*[Mm][Oo][Uu][Ss][Ee] [Ll][Oo][Cc][Kk].*/ OR data_win_eventdata_company:/.*[Mm][Ii][Ss][Cc]314.*/ OR data_win_eventdata_commandLine:/.*[Mm][Oo][Uu][Ss][Ee] [Ll][Oo][Cc][Kk]_.*/)

