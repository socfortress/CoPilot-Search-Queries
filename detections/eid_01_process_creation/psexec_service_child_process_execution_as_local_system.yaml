name: PsExec Service Child Process Execution as LOCAL SYSTEM
id: 7c0dcd3d-acf8-4f71-9570-f448b0034f94
version: 1
schema_version: "1.0"
date: "2023-02-28"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 7c0dcd3d-acf8-4f71-9570-f448b0034f94
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious launch of the PSEXESVC service on this system and a sub
  process run as LOCAL_SYSTEM (-s), which means that someone remotely started a
  command on this system running it with highest privileges and not only the
  privileges of the login user account (e.g. the administrator account).

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - term:
            data_win_eventdata_parentImage:
              value: "C:\\Windows\\PSEXESVC.exe"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_user:
                    value: "*AUTHORI*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_user:
                    value: "*AUTORI*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_user
    - data_win_eventdata_image
    - data_win_eventdata_commandLine

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage equals
  'C:\Windows\PSEXESVC.exe'; data_win_eventdata_user matches '*AUTHORI*';
  data_win_eventdata_user matches '*AUTORI*'.

known_false_positives: >
  Users that debug Microsoft Intune issues using the commands mentioned in the
  official documentation; see
  https://learn.microsoft.com/en-us/mem/intune/apps/intune-management-extension.
  Baseline expected activity in your environment and tune this detection before
  relying on it for automated response.

references:
  - https://learn.microsoft.com/en-us/sysinternals/downloads/psexec

response:
  message: >
    PsExec Service Child Process Execution as LOCAL SYSTEM detected on host
    $agent_name$. Matched data_win_eventdata_parentImage:
    $data_win_eventdata_parentImage$. Matched data_win_eventdata_user:
    $data_win_eventdata_user$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_user
      type: user

tags:
  asset_type: Endpoint
  custom_tags:
    - psexec
    - service
    - child
    - process_creation
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_user:/.*[Aa][Uu][Tt][Hh][Oo][Rr][Ii].*/ OR data_win_eventdata_user:/.*[Aa][Uu][Tt][Oo][Rr][Ii].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: fdfcbd78-48f1-4a4b-90ac-d82241e368c5
    name: PsExec Service Execution
    reason: Same PSEXESVC launch on the target; this rule adds the SYSTEM child, confirming -s was used.
  - id: 51ae86a2-e2e1-4097-ad85-c46cb6851de4
    name: Renamed PsExec Service Execution
    reason: Attacker may rename the service binary so the parent path match is missed; same remote-exec event.
  - id: ea011323-7045-460b-b2d7-0f7442ea6b38
    name: Potential PsExec Remote Execution
    reason: Source-side command line of the same remote execution (-s, \\target) on the operator host.
  - id: 730fc21b-eaff-474b-ad23-90fd265d4988
    name: Psexec Execution
    reason: Client-side psexec.exe launch on the pivot machine that delivered this SYSTEM session.
  - id: 27c3a83d-cada-47c6-9042-67baf19d2574
    name: Detect PsExec With accepteula Flag
    reason: First-use EULA flag on the originating host precedes the remote SYSTEM shell.
  - id: 683e6196-b8e8-11eb-9a79-acde48001122
    name: Detect Renamed PSExec
    reason: Renamed client binary used to launch the service, evading name-based detection.
  - id: f1f3bf22-deb2-418d-8cce-e1a45e46a5bd
    name: MMC20 Lateral Movement
    reason: Alternative lateral movement technique the same operator may mix with PsExec.
  - id: 692f0bec-83ba-4d04-af7e-e884a96059b6
    name: Potential WMI Lateral Movement WmiPrvSE Spawned PowerShell
    reason: Parallel remote-exec channel often used alongside PsExec during spread.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: PSEXESVC service installation
    query: data_win_system_eventID:(7045 OR 4697) AND /.*[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc].*/
    pivot_on: host
    window: 4h
  - name: Admin share access and service pipe
    query: data_win_system_eventID:(5145 OR 18 OR 17) AND (/.*[Aa][Dd][Mm][Ii][Nn]\$.*/ OR /.*[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc].*/)
    pivot_on: host
    window: 2h
  - name: Network logon preceding SYSTEM shell
    query: data_win_system_eventID:4624 AND data_win_eventdata_logonType:3
    pivot_on: host
    window: 1h
  - name: Post-exploitation commands run by SYSTEM children
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]\.exe/ AND data_win_eventdata_image:/.*(cmd|powershell|rundll32|reg|net1?|whoami)\.exe/
    pivot_on: host
    window: 4h
  - name: Credential dump or Defender tampering on host
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(sekurlsa|lsass|procdump|comsvcs|Set-MpPreference|DisableRealtimeMonitoring).*/
    pivot_on: host
    window: 6h
