name: PUA - NimScan Execution
id: 4fd6b1c7-19b8-4488-97f6-00f0924991a3
version: 1
schema_version: "1.0"
date: "2025-02-05"
author: Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 4fd6b1c7-19b8-4488-97f6-00f0924991a3
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects usage of NimScan, a portscanner utility. In early 2025, adversaries
  were observed using this utility to scan for open ports on remote hosts in a
  compromised environment. This rule identifies the execution of NimScan based
  on the process image name and specific hash values associated with different
  versions of the tool. MITRE ATT&CK: T1046.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\NimScan.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=41BB1C7571B3A724EB83A1D2B96DBB8C*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=B1B6ADACB172795480179EFD18A29549*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=0D1F896DC7642AD8384F9042F30279C2*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_hashes
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\NimScan.exe'; data_win_eventdata_hashes matches
  '*IMPHASH=41BB1C7571B3A724EB83A1D2B96DBB8C*'; data_win_eventdata_hashes
  matches '*IMPHASH=B1B6ADACB172795480179EFD18A29549*', among other conditions.

known_false_positives: >
  Legitimate administrator activity. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://x.com/cyberfeeddigest/status/1887041526397587859
  - https://github.com/elddy/NimScan
  - https://attack.mitre.org/techniques/T1046/

response:
  message: >
    PUA - NimScan Execution detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_hashes: $data_win_eventdata_hashes$. MITRE ATT&CK: T1046
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_hashes
      type: file_hash

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1046
  custom_tags:
    - nimscan
    - process_creation
    - sysmon
    - discovery
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Nn][Ii][Mm][Ss][Cc][Aa][Nn]\.[Ee][Xx][Ee]/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=41[Bb][Bb]1[Cc]7571[Bb]3[Aa]724[Ee][Bb]83[Aa]1[Dd]2[Bb]96[Dd][Bb][Bb]8[Cc].*/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=[Bb]1[Bb]6[Aa][Dd][Aa][Cc][Bb]172795480179[Ee][Ff][Dd]18[Aa]29549.*/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=0[Dd]1[Ff]896[Dd][Cc]7642[Aa][Dd]8384[Ff]9042[Ff]30279[Cc]2.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 54773c5f-f1cc-4703-9126-2f797d96a69d
    name: PUA - Advanced Port Scanner Execution
    reason: Same discovery intent (T1046) with a different scanner; actors rotate scanners.
  - id: bef37fa2-f205-4a7b-b484-0759bfd5f86f
    name: PUA - Advanced IP Scanner Execution
    reason: Network host discovery usually accompanies port scanning in internal recon.
  - id: ca387a8e-1c84-4da3-9993-028b45342d30
    name: PUA - SoftPerfect Netscan Execution
    reason: Commonly used alongside port scanners prior to lateral movement or ransomware.
  - id: f6ecd1cf-19b8-4488-97f6-00f0924991a3
    name: PUA - Nmap/Zenmap Execution
    reason: Equivalent scanner; both indicate active internal port scanning.
  - id: 74a12f18-505c-4114-8d0b-8448dd5485c6
    name: PUA - Nimgrab Execution
    reason: Nim-based tooling; nimgrab commonly delivers NimScan onto the host.
  - id: d95de845-b83c-4a9a-8a6a-4fc802ebf6c0
    name: Suspicious Group And Account Reconnaissance Activity Using Net.EXE
    reason: Account/group recon is the identity-side counterpart to the network scan.
  - id: 514e7e3e-b3b4-4a67-af60-be20f139198b
    name: PUA - AdFind.EXE Execution
    reason: AD enumeration is typically paired with port scanning during discovery.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: NimScan / Nim tooling execution
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Nn][Ii][Mm][Ss][Cc][Aa][Nn]\.[Ee][Xx][Ee]|\\[Nn][Ii][Mm][Gg][Rr][Aa][Bb]\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 4h
  - name: Outbound connections to common lateral-movement ports
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:"true" AND data_win_eventdata_destinationPort:(445 OR 3389 OR 5985 OR 5986 OR 135 OR 22 OR 1433)
    pivot_on:
    - host
    window: 2h
  - name: Tool delivery via LOLBin downloaders
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]|\\[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]|\\[Ww][Gg][Ee][Tt]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp].*/)
    pivot_on:
    - host
    window: 4h
  - name: Built-in discovery commands (net, nltest, arp)
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Nn][Ee][Tt]\.[Ee][Xx][Ee]|\\[Nn][Ee][Tt]1\.[Ee][Xx][Ee]|\\[Nn][Ll][Tt][Ee][Ss][Tt]\.[Ee][Xx][Ee]|\\[Aa][Rr][Pp]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.* [Vv][Ii][Ee][Ww].*/ OR data_win_eventdata_commandLine:/.* [Gg][Rr][Oo][Uu][Pp].*/ OR data_win_eventdata_commandLine:/.* [Dd][Oo][Mm][Aa][Ii][Nn].*/ OR data_win_eventdata_commandLine:/.* /[Dd][Cc][Ll][Ii][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.* \-[Aa].*/)
    pivot_on:
    - host
    window: 4h
  - name: Remote execution tooling following scan
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Pp][Ss][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]|\\[Cc][Ss][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]|\\[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 4h
