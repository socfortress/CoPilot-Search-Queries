name: Suspicious VBoxDrvInst.exe Parameters
id: b7b19cb6-9b32-4fc4-a108-73f19acfe262
version: 1
schema_version: "1.0"
date: "2021-11-27"
author: Konstantin Grishchenko, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: b7b19cb6-9b32-4fc4-a108-73f19acfe262
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detect VBoxDrvInst.exe run with parameters allowing processing INF file. This
  allows to create values in the registry and install drivers. For example one
  could use this technique to obtain persistence via modifying one of Run or
  RunOnce registry keys. MITRE ATT&CK: T1112.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\VBoxDrvInst.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*driver*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*executeinf*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\VBoxDrvInst.exe'; data_win_eventdata_commandLine matches '*driver*';
  data_win_eventdata_commandLine matches '*executeinf*'.

known_false_positives: >
  Legitimate use of VBoxDrvInst.exe utility by VirtualBox Guest Additions
  installation process. Baseline expected activity in your environment and tune
  this detection before relying on it for automated response.

references:
  - https://github.com/LOLBAS-Project/LOLBAS/blob/4db780e0f0b2e2bb8cb1fa13e09196da9b9f1834/yml/LOLUtilz/OtherBinaries/VBoxDrvInst.yml
  - https://twitter.com/pabraeken/status/993497996179492864
  - https://attack.mitre.org/techniques/T1112/

response:
  message: >
    Suspicious VBoxDrvInst.exe Parameters detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1112
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
  custom_tags:
    - vboxdrvinst
    - parameters
    - process_creation
    - sysmon
    - persistence
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Vv][Bb][Oo][Xx][Dd][Rr][Vv][Ii][Nn][Ss][Tt]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Dd][Rr][Ii][Vv][Ee][Rr].*/ AND data_win_eventdata_commandLine:/.*[Ee][Xx][Ee][Cc][Uu][Tt][Ee][Ii][Nn][Ff].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: ce7cf472-6fcc-490a-9481-3786840b5d9b
    name: InfDefaultInstall.exe .inf Execution
    reason: Sibling INF-install LOLBin; attackers who try VBoxDrvInst often fall back to InfDefaultInstall on the same host
  - id: a2ea3ae7-d3d0-40a0-a55c-25a45c87cac1
    name: Suspicious Driver Install by pnputil.exe
    reason: Alternate driver/INF installation via pnputil in the same staging chain
  - id: 285b85b1-a555-4095-8652-a8a4106af63f
    name: Suspicious Rundll32 Setupapi.dll Activity
    reason: Rundll32 setupapi.dll InstallHinfSection is the other classic INF-execution path for registry persistence
  - id: 24357373-078f-44ed-9ac4-6d334a668a11
    name: Direct Autorun Keys Modification
    reason: INF executed by VBoxDrvInst writes Run/RunOnce keys; direct autorun key edits are the same persistence goal
  - id: de587dce-915e-4218-aac4-835ca6af6f70
    name: Potential Persistence Attempt Via Run Keys Using Reg.EXE
    reason: Run-key persistence via reg.exe is the follow-on or companion to INF-based registry writes
  - id: 431a1fdb-4799-4f3b-91c3-a683b003fc49
    name: New Kernel Driver Via SC.EXE
    reason: Kernel driver service creation is a follow-on if the INF installs a driver
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: INF execution via other LOLBins
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ii][Nn][Ff][Dd][Ee][Ff][Aa][Uu][Ll][Tt][Ii][Nn][Ss][Tt][Aa][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Hh][Ii][Nn][Ff][Ss][Ee][Cc][Tt][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*[Pp][Nn][Pp][Uu][Tt][Ii][Ll].*/)
    pivot_on: host
    window: 2h
  - name: Autorun registry values written
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/
    pivot_on: host
    window: 2h
  - name: Children of VBoxDrvInst
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Vv][Bb][Oo][Xx][Dd][Rr][Vv][Ii][Nn][Ss][Tt]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Driver or service installation
    query: (data_win_system_eventID:"6" OR data_win_system_eventID:"7045" OR data_win_system_eventID:"4697")
    pivot_on: host
    window: 4h
