name: Potential UAC Bypass Via Sdclt.EXE
id: 40f9af16-589d-4984-b78d-8c2aec023197
version: 1
schema_version: "1.0"
date: "2024-12-01"
author: Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 40f9af16-589d-4984-b78d-8c2aec023197
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  A General detection for sdclt being spawned as an elevated process. This could
  be an indicator of sdclt being used for bypass UAC techniques. MITRE ATT&CK:
  T1548.002.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*sdclt.exe"
              case_insensitive: true
        - bool:
            should:
              - term:
                  data_win_eventdata_integrityLevel:
                    value: "High"
                    case_insensitive: true
              - term:
                  data_win_eventdata_integrityLevel:
                    value: "S-1-16-12288"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_integrityLevel
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*sdclt.exe'; data_win_eventdata_integrityLevel equals 'High';
  data_win_eventdata_integrityLevel equals 'S-1-16-12288'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/OTRF/detection-hackathon-apt29/issues/6
  - https://github.com/OTRF/ThreatHunter-Playbook/blob/2d4257f630f4c9770f78d0c1df059f891ffc3fec/docs/evals/apt29/detections/3.B.2_C36B49B5-DF58-4A34-9FE9-56189B9DEFEA.md
  - https://attack.mitre.org/techniques/T1548/002/

response:
  message: >
    Potential UAC Bypass Via Sdclt.EXE detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_integrityLevel: $data_win_eventdata_integrityLevel$.
    MITRE ATT&CK: T1548.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_integrityLevel
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1548.002
  custom_tags:
    - bypass
    - sdclt
    - process_creation
    - sysmon
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Ss][Dd][Cc][Ll][Tt]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_integrityLevel:/[Hh][Ii][Gg][Hh]/ OR data_win_eventdata_integrityLevel:/[Ss]-1-16-12288/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 152f3630-77c1-4284-bcc0-4cc68ab2f6e7
    name: Shell Open Registry Keys Manipulation
    reason: sdclt UAC bypass is staged by writing the HKCU shell/open/command or App Paths control.exe value just before sdclt runs; registry hijack is the direct precursor
  - id: 9e8894c0-0ae0-11ef-9d85-1f2942bec57c
    name: Suspicious Shell Open Command Registry Modification
    reason: Hijacked shell open command registry value is what sdclt auto-elevates into the payload
  - id: da2738f2-fadb-4394-afa7-0a0674885afa
    name: Sdclt Child Processes
    reason: The high-integrity child spawned by sdclt is the payload execution that follows the bypass
  - id: 4ac47ed3-44c2-4b1f-9d51-bf46e8914126
    name: TrustedPath UAC Bypass Pattern
    reason: Sibling UAC bypass pattern; attackers try alternative auto-elevate techniques when one fails
  - id: 7f741dcf-fc22-4759-87b4-9ae8376676a2
    name: Bypass UAC via Fodhelper.exe
    reason: Fodhelper is the common alternative registry-hijack UAC bypass tried on the same host
  - id: d38d2fa4-98e6-4a24-aff1-410b0c9ad177
    name: HackTool - UACMe Akagi Execution
    reason: UACMe Akagi implements sdclt among many bypass methods and may be the source tool
  - id: 178e615d-e666-498b-9630-9ed363038101
    name: Elevated System Shell Spawned From Uncommon Parent Location
    reason: Elevated shell from an uncommon parent is the privileged follow-on after successful elevation
  - id: c4db14d9-7909-48b4-a054-aa14d89dbb19
    name: Malicious PowerShell Process - Encoded Command
    reason: Encoded PowerShell is the usual payload launched through the elevated sdclt child
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Registry hijack values for sdclt auto-elevation
    query: data_win_system_eventID:(12 OR 13) AND data_win_eventdata_targetObject:(/.*[Aa]pp [Pp]aths.*[Cc]ontrol\.exe.*/ OR /.*[Ss]hell.*[Oo]pen.*[Cc]ommand.*/ OR /.*[Ii]solated[Cc]ommand.*/)
    pivot_on: host
    window: 1h
  - name: Children of sdclt or control.exe
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:(/.*[Ss]dclt\.exe/ OR /.*[Cc]ontrol\.exe/) AND data_win_eventdata_image:(/.*[Cc]md\.exe/ OR /.*[Pp]ower[Ss]hell.*/ OR /.*[Pp]wsh\.exe/ OR /.*[Mm]shta\.exe/ OR /.*[Rr]undll32\.exe/)
    pivot_on: host
    window: 2h
  - name: Other UAC bypass binaries launched at High integrity
    query: data_win_system_eventID:1 AND data_win_eventdata_image:(/.*[Ff]odhelper\.exe/ OR /.*[Ee]ventvwr\.exe/ OR /.*[Cc]mstp\.exe/ OR /.*[Cc]omputer[Dd]efaults\.exe/ OR /.*[Ww][Ss][Rr]eset\.exe/) AND data_win_eventdata_integrityLevel:High
    pivot_on: host
    window: 2h
  - name: Post-elevation defense evasion and credential tooling
    query: data_win_system_eventID:1 AND data_win_eventdata_integrityLevel:(High OR System) AND data_win_eventdata_commandLine:(/.*[Ss]et-[Mm]p[Pp]reference.*/ OR /.*[Vv]ssadmin.*[Dd]elete.*/ OR /.*[Ll]sass.*/ OR /.*[Ss]chtasks.*\/[Cc]reate.*/)
    pivot_on: host
    window: 4h
