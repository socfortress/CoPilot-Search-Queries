name: MSDT Execution Via Answer File
id: 9c8c7000-3065-44a8-a555-79bcba5d9955
version: 1
schema_version: "1.0"
date: "2025-10-29"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 9c8c7000-3065-44a8-a555-79bcba5d9955
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of "msdt.exe" using an answer file which is simulating the
  legitimate way of calling msdt via "pcwrun.exe" (For example from the
  compatibility tab). MITRE ATT&CK: T1218.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\msdt.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*\\\\WINDOWS\\\\diagnostics\\\\index\\\\PCWDiagnostic.xml*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -af *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /af *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* –af *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* —af *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* ―af *"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_parentImage"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\pcwrun.exe"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\msdt.exe'; data_win_eventdata_commandLine matches
  '*\WINDOWS\diagnostics\index\PCWDiagnostic.xml*';
  data_win_eventdata_commandLine matches '* -af *', among other conditions.

known_false_positives: >
  Possible undocumented parents of "msdt" other than "pcwrun". Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://lolbas-project.github.io/lolbas/Binaries/Msdt/
  - https://attack.mitre.org/techniques/T1218/

response:
  message: >
    MSDT Execution Via Answer File detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1218
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218
  custom_tags:
    - answer
    - process_creation
    - sysmon
    - stealth
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Mm][Ss][Dd][Tt]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Dd][Ii][Aa][Gg][Nn][Oo][Ss][Tt][Ii][Cc][Ss]\\[Ii][Nn][Dd][Ee][Xx]\\[Pp][Cc][Ww][Dd][Ii][Aa][Gg][Nn][Oo][Ss][Tt][Ii][Cc]\.[Xx][Mm][Ll].*/ AND (data_win_eventdata_commandLine:/.* -[Aa][Ff] .*/ OR data_win_eventdata_commandLine:/.* \/[Aa][Ff] .*/ OR data_win_eventdata_commandLine:/.* –[Aa][Ff] .*/ OR data_win_eventdata_commandLine:/.* —[Aa][Ff] .*/ OR data_win_eventdata_commandLine:/.* ―[Aa][Ff] .*/) AND _exists_:data_win_eventdata_parentImage AND NOT (data_win_eventdata_parentImage:/.*\\[Pp][Cc][Ww][Rr][Uu][Nn]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 258fc8ce-8352-443a-9120-8a11e4857fa5
    name: Potential Arbitrary Command Execution Using Msdt.EXE
    reason: Alternate msdt abuse used in the same Follina/diagcab family.
  - id: 7a74da6b-ea76-47db-92cc-874ad90df734
    name: Suspicious MSDT Parent Process
    reason: Office or script parent launching msdt is the delivery origin of this answer-file launch.
  - id: 6004abd0-afa4-4557-ba90-49d172e0a299
    name: Execute Pcwrun.EXE To Leverage Follina
    reason: Pcwrun is the legitimate launcher whose msdt call this rule imitates.
  - id: 9386d78a-7207-4048-9c9f-a93a7c2d1c05
    name: Code Execution via Pcwutl.dll
    reason: Related Program Compatibility Wizard proxy-execution technique.
  - id: dc4576d4-7467-424f-9eee-fd2b02855fe0
    name: Suspicious Cabinet File Execution Via Msdt.EXE
    reason: Diagcab-based msdt abuse by the same actor class.
  - id: bd1c6866-65fc-44b2-be51-5588fcff82b9
    name: Renamed Msdt.EXE Execution
    reason: Evasion variant if msdt was renamed to dodge image-name detections.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: All msdt and pcwrun executions
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*[Mm]sdt\.exe/ OR data_win_eventdata_image:/.*[Pp]cwrun\.exe/ OR data_win_eventdata_originalFileName:"msdt.exe")
    pivot_on: host
    window: 2h
  - name: Children of msdt or sdiagnhost
    query: data_win_system_eventID:1 AND (data_win_eventdata_parentImage:/.*[Mm]sdt\.exe/ OR data_win_eventdata_parentImage:/.*[Ss]diagnhost\.exe/)
    pivot_on: host
    window: 2h
  - name: Office or browser spawning msdt
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*(WINWORD|EXCEL|OUTLOOK|POWERPNT|chrome|msedge)\.exe/ AND (data_win_eventdata_image:/.*[Mm]sdt\.exe/ OR data_win_eventdata_image:/.*[Pp]cwrun\.exe/)
    pivot_on: user
    window: 2h
  - name: Diagnostic and document files dropped
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\.(diagcab|diagcfg|docx|doc|rtf)/
    pivot_on: host
    window: 2h
