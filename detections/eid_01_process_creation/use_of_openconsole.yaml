name: Use of OpenConsole
id: 814c95cc-8192-4378-a70a-f1aafd877af1
version: 1
schema_version: "1.0"
date: "2022-06-16"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 814c95cc-8192-4378-a70a-f1aafd877af1
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects usage of OpenConsole binary as a LOLBIN to launch other binaries to
  bypass application Whitelisting. MITRE ATT&CK: T1059.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - term:
                  data_win_eventdata_originalFileName:
                    value: "OpenConsole.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\OpenConsole.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_image:
                    value: "C:\\\\Program Files\\\\WindowsApps\\\\Microsoft.WindowsTerminal*"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_originalFileName
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_originalFileName equals
  'OpenConsole.exe'; data_win_eventdata_image matches '*\OpenConsole.exe';
  data_win_eventdata_image matches 'C:\Program
  Files\WindowsApps\Microsoft.WindowsTerminal*'.

known_false_positives: >
  Legitimate use by an administrator. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://twitter.com/nas_bench/status/1537563834478645252
  - https://attack.mitre.org/techniques/T1059/

response:
  message: >
    Use of OpenConsole detected on host $agent_name$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1059
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_originalFileName
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059
  custom_tags:
    - openconsole
    - process_creation
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_originalFileName:/[Oo][Pp][Ee][Nn][Cc][Oo][Nn][Ss][Oo][Ll][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Oo][Pp][Ee][Nn][Cc][Oo][Nn][Ss][Oo][Ll][Ee]\.[Ee][Xx][Ee]/) AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Aa][Pp][Pp][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\.[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Tt][Ee][Rr][Mm][Ii][Nn][Aa][Ll].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: dfa03a09-8b92-4d83-8e74-f72839b1c407
    name: Potentially Suspicious Child Processes Spawned by ConHost
    reason: Console host family; OpenConsole proxies launch of arbitrary binaries much like conhost.
  - id: 7dc2dedd-7603-461a-bc13-15803d132355
    name: Uncommon Child Process Of Conhost.EXE
    reason: Related console-host proxy execution detection for uncommon children.
  - id: 056c7317-9a09-4bd4-9067-d051312752ea
    name: Powershell Executed From Headless ConHost Process
    reason: Console host proxying used to hide PowerShell launch.
  - id: d4ca7c59-e9e4-42d8-bf57-91a776efcb87
    name: LOLBIN Execution From Abnormal Drive
    reason: OpenConsole outside the WindowsApps path is a copied or planted binary.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Children spawned by OpenConsole
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Oo][Pp][Ee][Nn][Cc][Oo][Nn][Ss][Oo][Ll][Ee][.][Ee][Xx][Ee]/
    pivot_on: host
    window: 1h
  - name: Shells spawned by console hosts
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*([Cc][Oo][Nn][Hh][Oo][Ss][Tt][.][Ee][Xx][Ee]|[Oo][Pp][Ee][Nn][Cc][Oo][Nn][Ss][Oo][Ll][Ee][.][Ee][Xx][Ee])/ AND data_win_eventdata_image:/.*([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll][.][Ee][Xx][Ee]|[Pp][Ww][Ss][Hh][.][Ee][Xx][Ee]|[Cc][Mm][Dd][.][Ee][Xx][Ee]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt][.][Ee][Xx][Ee]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt][.][Ee][Xx][Ee]|[Mm][Ss][Hh][Tt][Aa][.][Ee][Xx][Ee])/
    pivot_on: host
    window: 2h
  - name: OpenConsole file drops
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Oo][Pp][Ee][Nn][Cc][Oo][Nn][Ss][Oo][Ll][Ee][.][Ee][Xx][Ee].*/
    pivot_on: host
    window: 4h
  - name: Download tooling in command lines
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll].*/ OR data_win_eventdata_commandLine:/.*[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp]://.*/ OR data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp][Ss]://.*/)
    pivot_on: host
    window: 2h
  - name: Outbound connections from script hosts
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll][.][Ee][Xx][Ee]|[Pp][Ww][Ss][Hh][.][Ee][Xx][Ee]|[Cc][Mm][Dd][.][Ee][Xx][Ee]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt][.][Ee][Xx][Ee]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt][.][Ee][Xx][Ee]|[Mm][Ss][Hh][Tt][Aa][.][Ee][Xx][Ee]|[Rr][Uu][Nn][Dd][Ll][Ll]32[.][Ee][Xx][Ee]|[Rr][Ee][Gg][Ss][Vv][Rr]32[.][Ee][Xx][Ee])/
    pivot_on: host
    window: 2h
