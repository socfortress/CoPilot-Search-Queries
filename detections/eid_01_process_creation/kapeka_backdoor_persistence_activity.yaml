name: Kapeka Backdoor Persistence Activity
id: 64a871dd-83f6-4e5f-80fc-5a7ca3a8a819
version: 1
schema_version: "1.0"
date: "2024-07-03"
author: Swachchhanda Shrawan Poudel
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 64a871dd-83f6-4e5f-80fc-5a7ca3a8a819
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects Kapeka backdoor persistence activity. Depending on the process
  privileges, the Kapeka dropper then sets persistence for the backdoor either
  as a scheduled task (if admin or SYSTEM) or autorun registry (if not). For the
  scheduled task, it creates a scheduled task called "Sens Api" via schtasks
  command, which is set to run upon system startup as SYSTEM. To establish
  persistence through the autorun utility, it adds an autorun entry called "Sens
  Api" under HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Run via the "reg
  add" command. Both persistence mechanisms are set to launch the binary by
  calling rundll32 and passing the backdoor's first export ordinal (#1) without
  any additional argument. MITRE ATT&CK: T1053.005.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\schtasks.exe"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_originalFileName:
                                value: "schtasks.exe"
                                case_insensitive: true
                        minimum_should_match: 1
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*create*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*ONSTART*"
                          case_insensitive: true
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\reg.exe"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_originalFileName:
                                value: "reg.exe"
                                case_insensitive: true
                        minimum_should_match: 1
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*add*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*\\\\Software\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Run*"
                          case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*rundll32*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*.wll*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine: "*#1*"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Sens Api*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*OneDrive*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\schtasks.exe'; data_win_eventdata_originalFileName equals 'schtasks.exe';
  data_win_eventdata_commandLine matches '*create*', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://labs.withsecure.com/publications/kapeka
  - https://app.any.run/tasks/1efb3ed4-cc0f-4690-a0ed-24516809bc72/
  - https://www.virustotal.com/gui/file/bd07fb1e9b4768e7202de6cc454c78c6891270af02085c51fce5539db1386c3f/behavior
  - https://attack.mitre.org/techniques/T1053/005/

response:
  message: >
    Kapeka Backdoor Persistence Activity detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1053.005
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1053.005
  custom_tags:
    - kapeka
    - backdoor
    - persistence
    - process_creation
    - sysmon
    - privilege_escalation
    - execution
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (((data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee].*/ AND data_win_eventdata_commandLine:/.*[Oo][Nn][Ss][Tt][Aa][Rr][Tt].*/) OR ((data_win_eventdata_image:/.*\\[Rr][Ee][Gg]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Rr][Ee][Gg]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Aa][Dd][Dd].*/ AND data_win_eventdata_commandLine:/.*\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/)) AND data_win_eventdata_commandLine:/.*[Rr][Uu][Nn][Dd][Ll][Ll]32.*/ AND data_win_eventdata_commandLine:/.*\.[Ww][Ll][Ll].*/ AND data_win_eventdata_commandLine:/.*\#1.*/ AND (data_win_eventdata_commandLine:/.*[Ss][Ee][Nn][Ss] [Aa][Pp][Ii].*/ OR data_win_eventdata_commandLine:/.*[Oo][Nn][Ee][Dd][Rr][Ii][Vv][Ee].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e98f741c-6a5b-4c83-bc2a-1f4e58d07b12
    name: Kapeka Backdoor Execution Via RunDLL32.EXE
    reason: 'Same backdoor: the persisted ''Sens Api'' entry fires rundll32 on the .wll export #1 at logon/boot; confirms the implant actually ran'
  - id: de587dce-915e-4218-aac4-835ca6af6f70
    name: Potential Persistence Attempt Via Run Keys Using Reg.EXE
    reason: Generic view of the same reg add HKCU Run persistence path used when Kapeka runs unprivileged
  - id: f59c3faf-50f3-464b-9f4c-1b67ab512d99
    name: Common Autorun Keys Modification
    reason: Registry-level sysmon confirmation of the Run key value written by the dropper
  - id: 89ca78fd-b37c-4310-b3d3-81a023f83936
    name: Schtasks Creation Or Modification With SYSTEM Privileges
    reason: 'Privileged branch: ONSTART task running as SYSTEM for the backdoor'
  - id: 81325ce1-be01-4250-944f-b4789644556f
    name: Schedule Task Creation From Env Variable Or Potentially Suspicious Path Via Schtasks.EXE
    reason: Backdoor DLL lives in a user-writable path (OneDrive-looking folder); a task pointing there is the same persistence
  - id: c3a99af4-35a9-4668-879e-c09aeb4f2bdf
    name: Rundll32 Execution With Uncommon DLL Extension
    reason: Loader runs rundll32 against a .wll file, an uncommon DLL extension
  - id: 43fa5350-db63-4b8f-9a01-789a427074e1
    name: Potential Obfuscated Ordinal Call Via Rundll32
    reason: 'Backdoor is invoked by ordinal #1 rather than export name, the same call style'
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Rundll32 loading .wll payload by ordinal
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Rr][Uu][Nn][Dd][Ll][Ll]32.*\.[Ww][Ll][Ll].*/
    pivot_on: host
    window: 24h
  - name: Run key writes (persistence value set)
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/
    pivot_on: host
    window: 6h
  - name: Scheduled task creation or modification events
    query: data_win_system_eventID:("4698" OR "4702")
    pivot_on: host
    window: 24h
  - name: Backdoor .wll file creation
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.[Ww][Ll][Ll]/
    pivot_on: host
    window: 6h
  - name: Outbound connections from rundll32 (C2 beaconing)
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 6h
