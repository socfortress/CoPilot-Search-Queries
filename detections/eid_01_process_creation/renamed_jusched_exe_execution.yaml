name: Renamed Jusched.EXE Execution
id: edd8a48c-1b9f-4ba1-83aa-490338cd1ccb
version: 1
schema_version: "1.0"
date: "2023-02-03"
author: Markus Neis, Swisscom
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: edd8a48c-1b9f-4ba1-83aa-490338cd1ccb
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of a renamed "jusched.exe" as seen used by the cobalt
  group. MITRE ATT&CK: T1036.003.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - term:
                  data_win_eventdata_description:
                    value: "Java Update Scheduler"
                    case_insensitive: true
              - term:
                  data_win_eventdata_description:
                    value: "Java(TM) Update Scheduler"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\jusched.exe"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_description
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_description equals 'Java
  Update Scheduler'; data_win_eventdata_description equals 'Java(TM) Update
  Scheduler'; data_win_eventdata_image matches '*\jusched.exe'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.bitdefender.com/files/News/CaseStudies/study/262/Bitdefender-WhitePaper-An-APT-Blueprint-Gaining-New-Visibility-into-Financial-Threats-interactive.pdf
  - https://attack.mitre.org/techniques/T1036/003/

response:
  message: >
    Renamed Jusched.EXE Execution detected on host $agent_name$. Matched
    data_win_eventdata_description: $data_win_eventdata_description$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1036.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_description
      type: other
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1036.003
  custom_tags:
    - renamed
    - jusched
    - process_creation
    - sysmon
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_description:/[Jj][Aa][Vv][Aa] [Uu][Pp][Dd][Aa][Tt][Ee] [Ss][Cc][Hh][Ee][Dd][Uu][Ll][Ee][Rr]/ OR data_win_eventdata_description:/[Jj][Aa][Vv][Aa]\([Tt][Mm]\) [Uu][Pp][Dd][Aa][Tt][Ee] [Ss][Cc][Hh][Ee][Dd][Uu][Ll][Ee][Rr]/) AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/.*\\[Jj][Uu][Ss][Cc][Hh][Ee][Dd]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 0ba1da6d-b6ce-4366-828c-18826c9de23e
    name: Potential Defense Evasion Via Rename Of Highly Relevant Binaries
    reason: Same renamed-binary masquerade technique; confirms deliberate evasion rather than a one-off
  - id: 36480ae1-a1cb-4eaa-a0d6-29801d7e9142
    name: Potential Defense Evasion Via Binary Rename
    reason: Same OriginalFileName mismatch pattern for other binaries on the host
  - id: e37db05d-d1f9-49c8-b464-cee1a4b11638
    name: PUA - Rclone Execution
    reason: Renamed binaries are frequently staging tools like rclone for exfiltration
  - id: b6e04788-29e1-4557-bb14-77f761848ab8
    name: Potentially Suspicious File Download From File Sharing Domain Via PowerShell.EXE
    reason: 'Precursor: likely delivery of the masqueraded executable'
  - id: e218595b-bbe7-4ee5-8a96-f32a24ad3468
    name: Suspicious Curl.EXE Download
    reason: 'Precursor: payload download that dropped the masqueraded executable'
  - id: dff1e1cc-d3fd-47c8-bfc2-aeb878a754c0
    name: Shell Process Spawned by Java.EXE
    reason: Java-themed masquerade; a shell spawned from a java-like process is the follow-on execution
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Run key or scheduled task persistence
    query: data_win_system_eventID:("12" OR "13") AND data_win_eventdata_targetObject:/.*(CurrentVersion\\Run|Schedule\\TaskCache).*/
    pivot_on: host
    window: 4h
  - name: Outbound connections from user-writable paths
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:"true" AND data_win_eventdata_image:/.*(\\Users\\|\\ProgramData\\|\\Temp\\).*/
    pivot_on: host
    window: 2h
  - name: Children of fake jusched
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Jj][Uu][Ss][Cc][Hh].*/
    pivot_on: host
    window: 2h
  - name: Executables written to user-writable paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(\\AppData\\|\\ProgramData\\|\\Temp\\|\\Public\\).*\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 6h
