name: Dump LSASS via comsvcs DLL
id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
version: 1
schema_version: "1.0"
date: "2026-04-21"
author: SOCFortress LLC
status: production
type: TTP

description: >
  This analytic detects the behavior of dumping credentials from memory by
  exploiting the Local Security Authority Subsystem Service (LSASS)
  process using comsvcs.dll and its MiniDumpW export (export ordinal #24)
  via rundll32.exe. Sysmon EventID 1 is used to match process creation
  events where rundll32.exe is invoked with comsvcs.dll as the DLL to
  load, combined with either "MiniDump" as the named export to call or
  "#24" as the ordinal reference. This is a classic Living-Off-the-Land
  credential theft technique - comsvcs.dll is a legitimate signed
  Microsoft DLL, and its MiniDumpW export allows any caller with
  sufficient privileges to produce a full memory dump of a target
  process. When targeted at the LSASS process, the dump contains
  plaintext credentials, NTLM hashes, Kerberos tickets, and other
  sensitive authentication material that can be extracted offline with
  tools like Mimikatz or pypykatz. This activity is significant because
  it indicates potential credential theft, which can lead to broader
  system compromise, persistence, lateral movement, and privilege
  escalation. This technique has been observed in use by multiple
  nation-state groups (Volt Typhoon, HAFNIUM, Flax Typhoon) and
  ransomware operations (Prestige, Hellcat, Scattered Lapsus$), and is
  documented in CISA advisories AA22-257A and AA22-264A. If confirmed
  malicious, attackers could gain unauthorized access to sensitive
  credentials, leading to data theft, ransomware attacks, or other
  damaging outcomes. Immediate investigation and credential rotation for
  accounts active on the affected host is strongly recommended.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*rundll32.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName: "RUNDLL32.EXE"
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*comsvcs.dll*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*MiniDump*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*#24*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_parentCommandLine
    - data_win_eventdata_user
    - data_win_eventdata_processId
    - data_win_eventdata_processGuid
    - data_win_eventdata_parentProcessId
    - data_win_eventdata_parentProcessGuid
    - data_win_eventdata_hashes
    - data_win_eventdata_integrityLevel
    - data_win_eventdata_currentDirectory

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-21 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-21 23:59:59.999"

how_to_implement: >
  This detection requires Sysmon EventID 1 (Process Creation) logs to be forwarded
  from Windows endpoints to Wazuh Indexer. Ensure Sysmon is deployed with a
  configuration that captures Image, OriginalFileName, and CommandLine fields
  (SwiftOnSecurity or Olaf Hartong Sysmon modular config recommended). The
  detection matches rundll32.exe either by Image path (case-insensitive) or
  PE OriginalFileName, combined with "comsvcs.dll" in the command line AND
  either the named export "MiniDump" or the ordinal reference "#24".
  Case-insensitive matching is used throughout for string keywords; the "#24"
  pattern is matched literally. The ES DSL uses case_insensitive wildcard
  option (OpenSearch 2.x / Elasticsearch 7.10+); Graylog equivalent uses
  character classes. Note that Microsoft Defender ASR rule "Block credential
  stealing from the Windows local security authority subsystem (lsass.exe)"
  will block this technique at execution time when ASR is enabled; deploy
  this detection alongside ASR for layered coverage (ASR blocks, Wazuh
  alerts).

known_false_positives: >
  No benign false positives have been identified. Legitimate use of
  comsvcs.dll MiniDump/export #24 from rundll32.exe is extremely rare and
  any occurrence should be treated as a high-priority security incident.
  Authorized penetration testing or incident response memory acquisition
  using this specific pattern should be documented in the change
  management system and whitelisted if necessary.

references:
  - https://attack.mitre.org/techniques/T1003/001/
  - https://modexp.wordpress.com/2019/08/30/minidumpwritedump-via-com-services-dll/
  - https://twitter.com/SBousseaden/status/1167417096374050817
  - https://www.microsoft.com/en-us/security/blog/2023/05/24/volt-typhoon-targets-us-critical-infrastructure-with-living-off-the-land-techniques/
  - https://www.cisa.gov/news-events/cybersecurity-advisories/aa22-257a
  - https://www.cisa.gov/news-events/cybersecurity-advisories/aa22-264a

response:
  message: >
    An instance of $data_win_eventdata_parentImage$ spawning rundll32.exe
    ($data_win_eventdata_image$) was identified accessing credentials via
    comsvcs.dll MiniDump on endpoint $agent_name$ by user
    $data_win_eventdata_user$. Command line:
    $data_win_eventdata_commandLine$. This is a high-confidence indicator
    of LSASS credential dumping - investigate immediately, isolate the
    host, and initiate credential rotation for any accounts that may
    have authenticated on this system.
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 80
    - field: data_win_eventdata_user
      type: user
      score: 80
  threat_objects:
    - field: data_win_eventdata_image
      type: process_name
    - field: data_win_eventdata_parentImage
      type: parent_process_name
    - field: data_win_eventdata_commandLine
      type: command_line

tags:
  analytic_story:
    - Living Off The Land
    - CISA AA22-257A
    - CISA AA22-264A
    - Volt Typhoon
    - HAFNIUM Group
    - Flax Typhoon
    - Prestige Ransomware
    - Industroyer2
    - Data Destruction
    - Suspicious Rundll32 Activity
    - Compromised Windows Host
    - Credential Dumping
    - Scattered Lapsus$ Hunters
    - Hellcat Ransomware
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.001
  custom_tags:
    - lsass
    - credential_dumping
    - comsvcs
    - minidump
    - rundll32
    - lolbin
    - living_off_the_land
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Rr][Uu][Nn][Dd][Ll][Ll]32\.exe.*/ OR data_win_eventdata_originalFileName:"RUNDLL32.EXE") AND data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll].*/ AND (data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*\#24.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a49fa4d5-11db-418c-8473-1e014a8dd462
    name: Lsass Memory Dump via Comsvcs DLL
    reason: The exact same comsvcs.dll MiniDump technique seen from the Sysmon EID 10 process-access angle (sourceImage rundll32 -> targetImage lsass.exe, callTrace comsvcs.dll). Firing on the same host in-window is high-confidence confirmation this EID 1 alert is a true LSASS dump rather than a benign command-line artifact.
  - id: a5a2d357-1ab8-4675-a967-ef9990a59391
    name: LSASS Process Memory Dump Files
    reason: The on-disk .dmp file this comsvcs MiniDump call writes (EID 11 FileCreate of lsass*.dmp). Its appearance proves the dump actually succeeded and hands the analyst the exact output path to chase for compression/exfiltration.
  - id: d6a9b252-c666-4de6-8806-5561bbbd3bdc
    name: Wdigest Enable UseLogonCredential
    reason: 'Classic precursor: the attacker flips WDigest UseLogonCredential=1 so LSASS caches cleartext passwords, making the subsequent comsvcs dump yield plaintext credentials and not just NTLM hashes.'
  - id: fe63010f-8823-4864-a96b-a7b4a0f7b929
    name: LSASS Process Reconnaissance Via Findstr.EXE
    reason: 'Precursor recon: ''tasklist | findstr lsass'' obtains the LSASS process ID that MiniDump #24 requires as its first argument, usually seconds-to-minutes before this dump command runs.'
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: 'Follow-on extraction: Mimikatz (sekurlsa::minidump / lsadump) is the tool this rule''s own description names for parsing the comsvcs dump offline to recover plaintext creds, NTLM hashes and Kerberos tickets.'
  - id: a29808fd-ef50-49ff-9c7a-59a9b040b404
    name: HackTool - Pypykatz Credentials Dumping Activity
    reason: 'Follow-on extraction: pypykatz is the other parser named in this rule for pulling credentials out of the comsvcs dump; its execution on the same host corroborates an active credential-harvesting operation by the same actor.'
  - id: 611eab06-a145-4dfa-a295-3ccc5c20f59a
    name: Mimikatz DC Sync
    reason: 'Escalation follow-on: if the LSASS dump yielded domain-admin credentials, DCSync (DRSUAPI ''Replicating Directory Changes'') pulls every account hash straight from the DC - the natural next move once privileged creds are harvested.'
  - id: 8eef149c-bd26-49f2-9e5a-9b00e3af499b
    name: Pass the Hash Activity 2
    reason: 'Payoff follow-on: NTLM hashes extracted from this dump are replayed (type-3 NTLMSSP / seclogo logons) to authenticate laterally to other hosts without ever cracking the plaintext password.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: LSASS dump confirmation, alternative dump methods, and dump-file artifacts on this host
    query: ((data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_image:/.*\\([Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]|[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]64|[Nn][Aa][Nn][Oo][Dd][Uu][Mm][Pp]|[Rr][Dd][Rr][Ll][Ee][Aa][Kk][Dd][Ii][Aa][Gg]|[Cc][Rr][Ee][Aa][Tt][Ee][Dd][Uu][Mm][Pp]|[Dd][Uu][Mm][Pp][Ee][Rr][Tt])\.[Ee][Xx][Ee]/)) OR (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Ll][Ss][Aa][Ss][Ss].*\.[Dd][Mm][Pp].*/))
    pivot_on:
    - host
    window: 1h
  - name: LSASS PID discovery (recon that precedes the dump) on this host
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Ss][Ss].*/ AND (data_win_eventdata_commandLine:/.*[Tt][Aa][Ss][Kk][Ll][Ii][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ff][Ii][Nn][Dd][Ss][Tt][Rr].*/ OR data_win_eventdata_commandLine:/.*[Gg][Ee][Tt]-[Pp][Rr][Oo][Cc][Ee][Ss][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ww][Mm][Ii][Cc].*/ OR data_win_eventdata_commandLine:/.*[Qq][Pp][Rr][Oo][Cc][Ee][Ss][Ss].*/)
    pivot_on:
    - host
    window: 2h
  - name: LSASS-protection defeat enabling the dump (WDigest / RunAsPPL / Defender) on this host
    query: (data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*[Ww][Dd][Ii][Gg][Ee][Ss][Tt]\\[Uu][Ss][Ee][Ll][Oo][Gg][Oo][Nn][Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll].*/ OR data_win_eventdata_targetObject:/.*[Rr][Uu][Nn][Aa][Ss][Pp][Pp][Ll].*/ OR data_win_eventdata_targetObject:/.*[Ll][Ss][Aa][Cc][Ff][Gg][Ff][Ll][Aa][Gg][Ss].*/)) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Uu][Ss][Ee][Ll][Oo][Gg][Oo][Nn][Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll].*/ OR data_win_eventdata_commandLine:/.*[Rr][Uu][Nn][Aa][Ss][Pp][Pp][Ll].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee][Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Ee][Xx][Cc][Ll][Uu][Ss][Ii][Oo][Nn][Pp][Aa][Tt][Hh].*/))
    pivot_on:
    - host
    window: 4h
  - name: Credential-parser tooling and dump-file staging/exfil on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Pp][Yy][Pp][Yy][Kk][Aa][Tt][Zz].*/ OR data_win_eventdata_image:/.*\\[Pp][Yy][Pp][Yy][Kk][Aa][Tt][Zz]\.[Ee][Xx][Ee]/ OR (data_win_eventdata_commandLine:/.*\.[Dd][Mm][Pp].*/ AND data_win_eventdata_image:/.*\\(7[Zz]|7[Zz][Gg]|[Rr][Aa][Rr]|[Ww][Ii][Nn][Rr][Aa][Rr])\.[Ee][Xx][Ee]/))
    pivot_on:
    - host
    window: 4h
  - name: Remote credential replay by this account across the estate (pass-the-hash / lateral logons)
    query: (data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"9" OR data_win_eventdata_logonType:"10") AND (data_win_eventdata_logonProcessName:/[Nn][Tt][Ll][Mm][Ss][Ss][Pp]/ OR data_win_eventdata_logonProcessName:/[Ss][Ee][Cc][Ll][Oo][Gg][Oo]/)) OR (data_win_system_eventID:"4625" AND data_win_eventdata_logonType:"3")
    pivot_on:
    - user
    window: 6h
