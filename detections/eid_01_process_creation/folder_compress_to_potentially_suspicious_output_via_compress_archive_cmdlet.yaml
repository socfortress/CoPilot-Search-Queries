name: Folder Compress To Potentially Suspicious Output Via Compress-Archive Cmdlet
id: 85a8e5ba-bd03-4bfb-bbfa-a4409a8f8b98
version: 1
schema_version: "1.0"
date: "2022-10-09"
author: Nasreddine Bencherchali (Nextron Systems), frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 85a8e5ba-bd03-4bfb-bbfa-a4409a8f8b98
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects PowerShell scripts that make use of the "Compress-Archive" Cmdlet in
  order to compress folders and files where the output is stored in a
  potentially suspicious location that is used often by malware for
  exfiltration. An adversary might compress data (e.g., sensitive documents)
  that is collected prior to exfiltration in order to make it portable and
  minimize the amount of data sent over the network. MITRE ATT&CK: T1074.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Compress-Archive -Path*-DestinationPath $env:TEMP*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Compress-Archive -Path*-DestinationPath*\\\\AppData\\\\Local\\\\Temp\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Compress-Archive -Path*-DestinationPath*:\\\\Windows\\\\Temp\\\\*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*Compress-Archive -Path*-DestinationPath $env:TEMP*';
  data_win_eventdata_commandLine matches '*Compress-Archive
  -Path*-DestinationPath*\AppData\Local\Temp\*'; data_win_eventdata_commandLine
  matches '*Compress-Archive -Path*-DestinationPath*:\Windows\Temp\*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1074.001/T1074.001.md
  - https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-347a
  - https://attack.mitre.org/techniques/T1074/001/

response:
  message: >
    Folder Compress To Potentially Suspicious Output Via Compress-Archive Cmdlet
    detected on host $agent_name$. Matched data_win_eventdata_commandLine:
    $data_win_eventdata_commandLine$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1074.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1074.001
  custom_tags:
    - folder
    - compress
    - output
    - process_creation
    - sysmon
    - collection
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]-[Aa][Rr][Cc][Hh][Ii][Vv][Ee] -[Pp][Aa][Tt][Hh].*-[Dd][Ee][Ss][Tt][Ii][Nn][Aa][Tt][Ii][Oo][Nn][Pp][Aa][Tt][Hh] \$[Ee][Nn][Vv]:[Tt][Ee][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]-[Aa][Rr][Cc][Hh][Ii][Vv][Ee] -[Pp][Aa][Tt][Hh].*-[Dd][Ee][Ss][Tt][Ii][Nn][Aa][Tt][Ii][Oo][Nn][Pp][Aa][Tt][Hh].*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]-[Aa][Rr][Cc][Hh][Ii][Vv][Ee] -[Pp][Aa][Tt][Hh].*-[Dd][Ee][Ss][Tt][Ii][Nn][Aa][Tt][Ii][Oo][Nn][Pp][Aa][Tt][Hh].*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 9fbf5927-5261-4284-a71d-f681029ea574
    name: Compress Data and Lock With Password for Exfiltration With 7-ZIP
    reason: Alternate staging archiver; both indicate collected data being packaged for exfil.
  - id: faa48cae-6b25-4f00-a094-08947fef582f
    name: Rar Usage with Password and Compression Level
    reason: Password-protected RAR is the common sibling staging step.
  - id: afe52666-401e-4a02-b4ff-5d128990b8cb
    name: Suspicious Greedy Compression Using Rar.EXE
    reason: Bulk compression of directories with Rar shows the same collect-and-package intent.
  - id: 7d1aaf3d-4304-425c-b7c3-162055e0b3ab
    name: Potential Data Exfiltration Activity Via CommandLine Tools
    reason: The archive in Temp is then uploaded with command-line transfer tools.
  - id: e328cc73-f92a-42fb-b3fa-7c2cffda981a
    name: Curl File Upload To File Sharing Websites
    reason: Typical exfil channel that moves the staged archive off-host.
  - id: ec570e53-4c76-45a9-804d-dc3f355ff7a7
    name: 7Zip Compressing Dump Files
    reason: If the compressed content is credential dumps this is the follow-on packaging step.
  - id: 8bc64091-6875-4881-aaf9-7bd25b5dda08
    name: Suspicious Process Patterns NTDS.DIT Exfil
    reason: Compress-Archive of NTDS/registry hives is a known staging pattern for domain credential theft.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Archive files created in staging locations
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\.([Zz]ip|7z|[Rr]ar|[Cc]ab)/ AND data_win_eventdata_targetFilename:(/.*[Tt]emp.*/ OR /.*[Pp]rogram[Dd]ata.*/ OR /.*[Pp]ublic.*/)
    pivot_on: host
    window: 4h
  - name: Outbound transfer tools after staging
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*curl.*(-T|--upload-file|-F).*/ OR /.*[Ii]nvoke-[Ww]eb[Rr]equest.*-[Mm]ethod [Pp]ost.*/ OR /.*[Ii]nvoke-[Rr]est[Mm]ethod.*/ OR /.*rclone.*/ OR /.*[Ww]inscp.*/)
    pivot_on: host
    window: 4h
  - name: Bulk file collection commands
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Gg]et-[Cc]hild[Ii]tem.*-[Rr]ecurse.*/ OR /.*xcopy.* \/[Ss].*/ OR /.*robocopy.*/)
    pivot_on: user
    window: 4h
  - name: DNS lookups to common exfil services
    query: data_win_system_eventID:22 AND data_win_eventdata_queryName:(/.*mega\.nz/ OR /.*anonfiles.*/ OR /.*transfer\.sh/ OR /.*file\.io/ OR /.*pastebin.*/ OR /.*dropbox.*/)
    pivot_on: host
    window: 6h
  - name: Compress-Archive executions
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*[Cc]ompress-[Aa]rchive.*/
    pivot_on: user
    window: 2h
