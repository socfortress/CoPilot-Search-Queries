name: Potential Amazon SSM Agent Hijacking
id: d20ee2f4-822c-4827-9e15-41500b1fff10
version: 1
schema_version: "1.0"
date: "2023-08-02"
author: Muhammad Faisal
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: d20ee2f4-822c-4827-9e15-41500b1fff10
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential Amazon SSM agent hijack attempts as outlined in the Mitiga
  research report. MITRE ATT&CK: T1219.002.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\amazon-ssm-agent.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*-register *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*-code *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*-id *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*-region *"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\amazon-ssm-agent.exe'; data_win_eventdata_commandLine matches '*-register
  *'; data_win_eventdata_commandLine matches '*-code *', among other conditions.

known_false_positives: >
  Legitimate activity of system administrators. Baseline expected activity in
  your environment and tune this detection before relying on it for automated
  response.

references:
  - https://www.mitiga.io/blog/mitiga-security-advisory-abusing-the-ssm-agent-as-a-remote-access-trojan
  - https://www.bleepingcomputer.com/news/security/amazons-aws-ssm-agent-can-be-used-as-post-exploitation-rat-malware/
  - https://www.helpnetsecurity.com/2023/08/02/aws-instances-attackers-access/
  - https://attack.mitre.org/techniques/T1219/002/

response:
  message: >
    Potential Amazon SSM Agent Hijacking detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1219.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1219.002
  custom_tags:
    - amazon
    - agent
    - hijacking
    - process_creation
    - sysmon
    - command_and_control
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Aa][Mm][Aa][Zz][Oo][Nn]-[Ss][Ss][Mm]-[Aa][Gg][Ee][Nn][Tt]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*-[Rr][Ee][Gg][Ii][Ss][Tt][Ee][Rr] .*/ AND data_win_eventdata_commandLine:/.*-[Cc][Oo][Dd][Ee] .*/ AND data_win_eventdata_commandLine:/.*-[Ii][Dd] .*/ AND data_win_eventdata_commandLine:/.*-[Rr][Ee][Gg][Ii][Oo][Nn] .*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 2db93a3f-3249-4f73-9e68-0e77a0f8ae7e
    name: Remote Access Tool - TacticalRMM Agent Registration to Potentially Attacker-Controlled Server
    reason: Same pattern of re-registering a legitimate management agent to an attacker-controlled backend.
  - id: 57bff678-25d1-4d6c-8211-8ca106d12053
    name: Remote Access Tool - ScreenConnect Execution
    reason: Attackers holding the host often layer additional remote-management tooling as redundant access.
  - id: b52e84a3-029e-4529-b09b-71d19dd27e94
    name: Remote Access Tool - AnyDesk Execution
    reason: Alternative remote-access tool installed alongside hijacked agents for persistence.
  - id: 9a019ffc-3580-4c9d-8d87-079f7e8d3fd4
    name: Cloudflared Tunnel Execution
    reason: Tunnelling over a legitimate service is another C2 channel often combined with SSM abuse.
  - id: cd219ff3-fa99-45d4-8380-a7d15116c6dc
    name: New User Created Via Net.EXE
    reason: Post-compromise persistence on the instance often includes a backdoor local account.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: SSM agent process activity
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Aa]mazon-ssm-agent.*/
    pivot_on: host
    window: 24h
  - name: SSM agent network connections
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*[Aa]mazon-ssm-agent.*/
    pivot_on: host
    window: 24h
  - name: SSM registration/config files changed
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*[Aa]mazon.*[Ss][Ss][Mm].*/
    pivot_on: host
    window: 24h
  - name: Commands spawned by SSM agent
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Aa]mazon-ssm-agent.*/
    pivot_on: host
    window: 24h
  - name: SSM service stop/start
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*([Ss]top|[Rr]estart|[Ss]tart)-?[Ss]ervice.*[Aa]mazon[Ss][Ss][Mm].*/
    pivot_on: host
    window: 24h
