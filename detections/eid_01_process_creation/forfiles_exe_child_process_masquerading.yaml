name: Forfiles.EXE Child Process Masquerading
id: f53714ec-5077-420e-ad20-907ff9bb2958
version: 1
schema_version: "1.0"
date: "2024-01-05"
author: Nasreddine Bencherchali (Nextron Systems), Anish Bogati
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: f53714ec-5077-420e-ad20-907ff9bb2958
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of "forfiles" from a non-default location, in order to
  potentially spawn a custom "cmd.exe" from the current working directory. MITRE
  ATT&CK: T1036.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_parentCommandLine:
                    value: "*.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentCommandLine:
                    value: "*.exe\""
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\cmd.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "/c echo \"*"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_parentImage"
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_parentImage:
                                value: "*:\\\\Windows\\\\System32\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_parentImage:
                                value: "*:\\\\Windows\\\\SysWOW64\\\\*"
                                case_insensitive: true
                        minimum_should_match: 1
                    - wildcard:
                        data_win_eventdata_parentImage:
                          value: "*\\\\forfiles.exe"
                          case_insensitive: true
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*:\\\\Windows\\\\System32\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*:\\\\Windows\\\\SysWOW64\\\\*"
                                case_insensitive: true
                        minimum_should_match: 1
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\cmd.exe"
                          case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentCommandLine
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentCommandLine matches
  '*.exe'; data_win_eventdata_parentCommandLine matches '*.exe"';
  data_win_eventdata_image matches '*\cmd.exe', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.hexacorn.com/blog/2023/12/31/1-little-known-secret-of-forfiles-exe/
  - https://attack.mitre.org/techniques/T1036/

response:
  message: >
    Forfiles.EXE Child Process Masquerading detected on host $agent_name$.
    Matched data_win_eventdata_parentCommandLine:
    $data_win_eventdata_parentCommandLine$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1036
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_parentCommandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1036
  custom_tags:
    - forfiles
    - child
    - masquerading
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_parentCommandLine:/.*\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentCommandLine:/.*\.[Ee][Xx][Ee]\"/) AND data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/\/[Cc] [Ee][Cc][Hh][Oo] \".*/ AND _exists_:data_win_eventdata_parentImage AND _exists_:data_win_eventdata_image AND NOT ((data_win_eventdata_parentImage:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\.*/ OR data_win_eventdata_parentImage:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Ww][Oo][Ww]64\\.*/) AND data_win_eventdata_parentImage:/.*\\[Ff][Oo][Rr][Ff][Ii][Ll][Ee][Ss]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_image:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\.*/ OR data_win_eventdata_image:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Ww][Oo][Ww]64\\.*/) AND data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 9aa5106d-bce3-4b13-86df-3a20f1d5cf0b
    name: Forfiles Command Execution
    reason: Forfiles /c execution is the generic form of this proxy technique and often fires alongside the masquerade variant.
  - id: 3f7f5b0b-5b16-476c-a85f-ab477f6dd24b
    name: Lazarus System Binary Masquerading
    reason: 'Lazarus system binary masquerading: planted copies of system binaries in the same evasion family.'
  - id: be58d2e2-06c8-4f58-b666-b99f6dc3b6cd
    name: Suspicious Process Masquerading As SvcHost.EXE
    reason: Another system-process masquerading detection; a planted cmd.exe may be paired with fake svchost.
  - id: 0955e4e1-c281-4fb9-9ee1-5ee7b4b754d2
    name: Use of Pcalua For Execution
    reason: Pcalua indirect execution used interchangeably with forfiles to evade whitelisting.
  - id: cea72823-df4d-4567-950c-0b579eaf0846
    name: Potential Dropper Script Execution Via WScript/CScript/MSHTA
    reason: Dropper scripts typically stage the custom cmd.exe in a writable directory before invoking forfiles.
  - id: 69bd9b97-2be2-41b6-9816-fb08757a4d1a
    name: Potentially Suspicious Execution From Parent Process In Public Folder
    reason: 'Execution from Public folders: a common staging location for the planted binary.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Processes launched from user-writable paths
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Uu][Ss][Ee][Rr][Ss]\\|\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\|\\[Tt][Ee][Mm][Pp]\\).*/
    pivot_on: host
    window: 2h
  - name: Fake cmd.exe outside System32
    query: data_win_system_eventID:"1" AND data_win_eventdata_originalFileName:"Cmd.Exe" AND NOT data_win_eventdata_image:/.*[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\([Ss][Yy][Ss][Tt][Ee][Mm]32|[Ss][Yy][Ss][Ww][Oo][Ww]64)\\.*/
    pivot_on: host
    window: 4h
  - name: Executable file creation in user paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.([Ee][Xx][Ee]|[Dd][Ll][Ll])/ AND data_win_eventdata_targetFilename:/.*(\\[Uu][Ss][Ee][Rr][Ss]\\|\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\|\\[Tt][Ee][Mm][Pp]\\).*/
    pivot_on: host
    window: 2h
  - name: Children of the masqueraded cmd.exe
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].[Ee][Xx][Ee]|[Rr][Uu][Nn][Dd][Ll][Ll]32.[Ee][Xx][Ee]|[Rr][Ee][Gg][Ss][Vv][Rr]32.[Ee][Xx][Ee]|[Mm][Ss][Hh][Tt][Aa].[Ee][Xx][Ee]|[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll].[Ee][Xx][Ee]|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn].[Ee][Xx][Ee])/
    pivot_on: host
    window: 2h
