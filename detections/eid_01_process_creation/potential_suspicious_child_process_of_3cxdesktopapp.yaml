name: Potential Suspicious Child Process Of 3CXDesktopApp
id: 63f3605b-979f-48c2-b7cc-7f90523fed88
version: 1
schema_version: "1.0"
date: "2023-03-29"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 63f3605b-979f-48c2-b7cc-7f90523fed88
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential suspicious child processes of "3CXDesktopApp.exe". Which
  could be related to the 3CXDesktopApp supply chain compromise. MITRE ATT&CK:
  T1218.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_parentImage:
              value: "*\\\\3CXDesktopApp.exe"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\cmd.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\cscript.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\mshta.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\powershell.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\pwsh.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\regsvr32.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\rundll32.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\wscript.exe"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\3CXDesktopApp.exe'; data_win_eventdata_image matches '*\cmd.exe';
  data_win_eventdata_image matches '*\cscript.exe', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.reddit.com/r/crowdstrike/comments/125r3uu/20230329_situational_awareness_crowdstrike/
  - https://www.crowdstrike.com/blog/crowdstrike-detects-and-prevents-active-intrusion-campaign-targeting-3cxdesktopapp-customers/
  - https://attack.mitre.org/techniques/T1218/

response:
  message: >
    Potential Suspicious Child Process Of 3CXDesktopApp detected on host
    $agent_name$. Matched data_win_eventdata_parentImage:
    $data_win_eventdata_parentImage$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1218
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218
  custom_tags:
    - child
    - 3cxdesktopapp
    - process_creation
    - sysmon
    - command_and_control
    - execution
    - stealth
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\3[Cc][Xx][Dd][Ee][Ss][Kk][Tt][Oo][Pp][Aa][Pp][Pp]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 93bbde78-dc86-4e73-9ffc-ff8a384ca89c
    name: Potential Compromised 3CXDesktopApp Execution
    reason: Same trojanized 3CX campaign; confirms the app binary itself is the compromised build.
  - id: e7581747-1e44-4d4b-85a6-0db0b4a00f2a
    name: Potential Compromised 3CXDesktopApp Update Activity
    reason: 'Precursor: the trojanized update or its staged files precede the child process.'
  - id: d0b65ad3-e945-435e-a7a9-438e62dd48e9
    name: Malicious DLL Load By Compromised 3CXDesktopApp
    reason: 'Initial-stage mechanism: the malicious DLL load that leads to shell spawning.'
  - id: 51eecf75-d069-43c7-9ea2-63f75499edd4
    name: Potential Compromised 3CXDesktopApp Beaconing Activity - Netcon
    reason: C2 beaconing from the 3CX process accompanies or precedes command execution.
  - id: 553d0429-1a1c-44bf-b3f5-a8513deb9ee5
    name: Hunting 3CXDesktopApp Software
    reason: 'Scoping: identifies 3CX installs and versions on the host.'
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Network connections from 3CXDesktopApp
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\(3[Cc][Xx][Dd][Ee][Ss][Kk][Tt][Oo][Pp][Aa][Pp][Pp]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 24h
  - name: DNS lookups from 3CXDesktopApp
    query: data_win_system_eventID:"22" AND data_win_eventdata_image:/.*\\(3[Cc][Xx][Dd][Ee][Ss][Kk][Tt][Oo][Pp][Aa][Pp][Pp]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 24h
  - name: Dropped DLLs and manifests near the 3CX install
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Ff][Ff][Mm][Pp][Ee][Gg]\.[Dd][Ll][Ll].*/ OR data_win_eventdata_targetFilename:/.*[Dd]3[Dd][Cc][Oo][Mm][Pp][Ii][Ll][Ee][Rr]_47\.[Dd][Ll][Ll].*/ OR data_win_eventdata_targetFilename:/.*[Mm][Aa][Nn][Ii][Ff][Ee][Ss][Tt].*/ OR data_win_eventdata_targetFilename:/.*3[Cc][Xx][Dd][Ee][Ss][Kk][Tt][Oo][Pp][Aa][Pp][Pp].*/)
    pivot_on: host
    window: 24h
  - name: Credential and browser-data theft tooling after shell spawn
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Ee][Ss][Ee][Nn][Tt][Uu][Tt][Ll]\.[Ee][Xx][Ee]|[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]|[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]64\.[Ee][Xx][Ee])/ OR (data_win_eventdata_commandLine:/.*[Ll][Oo][Gg][Ii][Nn] [Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Oo][Kk][Ii][Ee][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Ss][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/))
    pivot_on: host
    window: 6h
  - name: Persistence creation after the 3CX child shell
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]|[Rr][Ee][Gg]\.[Ee][Xx][Ee]|[Ss][Cc]\.[Ee][Xx][Ee])/) OR (data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*\\[Rr][Uu][Nn].*/ OR data_win_eventdata_targetObject:/.*\\[Rr][Uu][Nn][Oo][Nn][Cc][Ee].*/ OR data_win_eventdata_targetObject:/.*\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss].*/))
    pivot_on: host
    window: 6h
