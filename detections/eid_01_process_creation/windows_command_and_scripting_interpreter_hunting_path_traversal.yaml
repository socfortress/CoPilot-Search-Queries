name: Windows Command and Scripting Interpreter Path Traversal
id: windows-command-interpreter-path-traversal-001
version: 1
schema_version: "1.0"
date: "2026-02-23"
author: SOCFortress LLC
status: production
type: Hunting

description: >
  Detects command-line executions containing multiple path traversal sequences 
  (\..\..\ or /../..). This technique is used to evade defenses by executing 
  binaries through relative path traversal, notably seen in CVE-2022-30190 
  (msdt.exe Follina) exploitation.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - wildcard:
            data_win_eventdata_commandLine: "*..\\\\*..\\\\*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-23 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-23 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Windows endpoints with Sysmon 
  installed and configured to log process creation events (EventID 1) with full 
  command-line arguments.

known_false_positives: >
  Some legitimate software may use relative path references with traversal 
  sequences. Review the full command line and parent process to determine 
  legitimacy. Hunting-type detection — expect some tuning.

references:
  - https://attack.mitre.org/techniques/T1059/
  - https://app.any.run/tasks/713f05d2-fe78-4b9d-a744-f7c133e3fafb/

response:
  message: >
    Path traversal detected in command line on $agent_name$. 
    Command: $data_win_eventdata_commandLine$. 
    Process: $data_win_eventdata_image$. 
    Parent: $data_win_eventdata_parentImage$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1059
  risk_score: 36
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 36
  threat_objects: []

tags:
  analytic_story:
    - Windows Defense Evasion Tactics
    - Microsoft Support Diagnostic Tool Vulnerability CVE-2022-30190
  asset_type: Endpoint
  mitre_attack_id:
    - T1059
  custom_tags:
    - path_traversal
    - defense_evasion
    - hunting
    - follina
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*(\.\.\\){2}.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 1327381e-6ab0-4f38-b583-4c1b8346a56b
    name: Potential Command Line Path Traversal Evasion Attempt
    reason: 'Direct sibling: traversal used to evade path-based detections.'
  - id: 087790e3-3287-436c-bccf-cbd0184a7db1
    name: Potential CommandLine Path Traversal Via Cmd.EXE
    reason: Traversal through cmd.exe, the most common interpreter for this pattern.
  - id: ee5e119b-1f75-4b34-add8-3be976961e39
    name: Conhost.exe CommandLine Path Traversal
    reason: Traversal chained into conhost to hide the launched binary.
  - id: 258fc8ce-8352-443a-9120-8a11e4857fa5
    name: Potential Arbitrary Command Execution Using Msdt.EXE
    reason: CVE-2022-30190 (Follina) abuses msdt with ..\ traversal in the cited exploit chain.
  - id: 7a74da6b-ea76-47db-92cc-874ad90df734
    name: Suspicious MSDT Parent Process
    reason: Office/script parent spawning msdt is the Follina delivery stage.
  - id: e1d5145f-38fe-42b9-a5d5-457796715f97
    name: Windows Execute Arbitrary Commands with MSDT
    reason: msdt execution of arbitrary commands, payload stage of the traversal exploit.
  - id: 6004abd0-afa4-4557-ba90-49d172e0a299
    name: Execute Pcwrun.EXE To Leverage Follina
    reason: Pcwrun is the alternate Follina trigger using relative paths.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Office or browser spawning interpreters
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*(WINWORD|EXCEL|POWERPNT|OUTLOOK|msedge|chrome|firefox|AcroRd32)\.exe/ AND data_win_eventdata_image:/.*(cmd|powershell|pwsh|wscript|cscript|mshta|msdt)\.exe/
    pivot_on: host
    window: 2h
  - name: msdt and pcwrun invocations
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*([Mm]sdt|[Pp]cwrun|[Ss]diagnhost)\.exe/
    pivot_on: host
    window: 2h
  - name: Payload executed from user path
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*([Dd]ownloads|[Tt]emp|[Aa]pp[Dd]ata).*\.exe/
    pivot_on: host
    window: 2h
  - name: Outbound connections from interpreters
    query: data_win_system_eventID:3 AND data_win_eventdata_initiated:true AND data_win_eventdata_image:/.*(cmd|powershell|mshta|wscript|cscript|msdt)\.exe/
    pivot_on: host
    window: 2h
  - name: Files created in startup or temp by interpreters
    query: data_win_system_eventID:11 AND data_win_eventdata_image:/.*(cmd|powershell|wscript|cscript|msdt)\.exe/ AND data_win_eventdata_targetFilename:/.*(Startup|[Tt]emp|[Pp]ublic).*/
    pivot_on: host
    window: 4h
