name: Security Tools Keyword Lookup Via Findstr.EXE
id: 4fe074b4-b833-4081-8f24-7dcfeca72b42
version: 1
schema_version: "1.0"
date: "2023-11-14"
author: Nasreddine Bencherchali (Nextron Systems), frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 4fe074b4-b833-4081-8f24-7dcfeca72b42
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of "findstr" to search for common names of security tools.
  Attackers often pipe the results of recon commands such as "tasklist" or
  "whoami" to "findstr" in order to filter out the results. This detection
  focuses on the keywords that the attacker might use as a filter. MITRE ATT&CK:
  T1518.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\find.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\findstr.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "FIND.EXE"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "FINDSTR.EXE"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* avira"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* avira\""
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* cb"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* cb\""
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* cylance"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* cylance\""
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* defender"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* defender\""
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* kaspersky"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* kaspersky\""
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* kes"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* kes\""
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* mc"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* mc\""
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* sec"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* sec\""
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* sentinel"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* sentinel\""
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* symantec"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* symantec\""
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* virus"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* virus\""
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\find.exe'; data_win_eventdata_image matches '*\findstr.exe';
  data_win_eventdata_originalFileName equals 'FIND.EXE', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/987e3ca988ae3cff4b9f6e388c139c05bf44bbb8/atomics/T1518.001/T1518.001.md#atomic-test-1---security-software-discovery
  - https://www.microsoft.com/en-us/security/blog/2023/10/18/multiple-north-korean-threat-actors-exploiting-the-teamcity-cve-2023-42793-vulnerability/
  - https://www.hhs.gov/sites/default/files/manage-engine-vulnerability-sector-alert-tlpclear.pdf
  - https://attack.mitre.org/techniques/T1518/001/

response:
  message: >
    Security Tools Keyword Lookup Via Findstr.EXE detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1518.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1518.001
  custom_tags:
    - security
    - tools
    - keyword
    - process_creation
    - sysmon
    - discovery
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ff][Ii][Nn][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ff][Ii][Nn][Dd][Ss][Tt][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ff][Ii][Nn][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ff][Ii][Nn][Dd][Ss][Tt][Rr]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.* [Aa][Vv][Ii][Rr][Aa]/ OR data_win_eventdata_commandLine:/.* [Aa][Vv][Ii][Rr][Aa]\"/ OR data_win_eventdata_commandLine:/.* [Cc][Bb]/ OR data_win_eventdata_commandLine:/.* [Cc][Bb]\"/ OR data_win_eventdata_commandLine:/.* [Cc][Yy][Ll][Aa][Nn][Cc][Ee]/ OR data_win_eventdata_commandLine:/.* [Cc][Yy][Ll][Aa][Nn][Cc][Ee]\"/ OR data_win_eventdata_commandLine:/.* [Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr]/ OR data_win_eventdata_commandLine:/.* [Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr]\"/ OR data_win_eventdata_commandLine:/.* [Kk][Aa][Ss][Pp][Ee][Rr][Ss][Kk][Yy]/ OR data_win_eventdata_commandLine:/.* [Kk][Aa][Ss][Pp][Ee][Rr][Ss][Kk][Yy]\"/ OR data_win_eventdata_commandLine:/.* [Kk][Ee][Ss]/ OR data_win_eventdata_commandLine:/.* [Kk][Ee][Ss]\"/ OR data_win_eventdata_commandLine:/.* [Mm][Cc]/ OR data_win_eventdata_commandLine:/.* [Mm][Cc]\"/ OR data_win_eventdata_commandLine:/.* [Ss][Ee][Cc]/ OR data_win_eventdata_commandLine:/.* [Ss][Ee][Cc]\"/ OR data_win_eventdata_commandLine:/.* [Ss][Ee][Nn][Tt][Ii][Nn][Ee][Ll]/ OR data_win_eventdata_commandLine:/.* [Ss][Ee][Nn][Tt][Ii][Nn][Ee][Ll]\"/ OR data_win_eventdata_commandLine:/.* [Ss][Yy][Mm][Aa][Nn][Tt][Ee][Cc]/ OR data_win_eventdata_commandLine:/.* [Ss][Yy][Mm][Aa][Nn][Tt][Ee][Cc]\"/ OR data_win_eventdata_commandLine:/.* [Vv][Ii][Rr][Uu][Ss]/ OR data_win_eventdata_commandLine:/.* [Vv][Ii][Rr][Uu][Ss]\"/)

