name: Suspicious File Execution From Internet Hosted WebDav Share
id: f0507c0f-a3a2-40f5-acc6-7f543c334993
version: 1
schema_version: "1.0"
date: "2023-02-21"
author: pH-T (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: f0507c0f-a3a2-40f5-acc6-7f543c334993
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of the "net use" command to mount a WebDAV server and
  then immediately execute some content in it. As seen being used in malicious
  LNK files. MITRE ATT&CK: T1059.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\cmd.exe*"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "Cmd.EXE"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* net use http*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*& start /b *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*\\\\DavWWWRoot\\\\*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.exe *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.dll *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.bat *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.vbs *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.ps1 *"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\cmd.exe*'; data_win_eventdata_originalFileName equals 'Cmd.EXE';
  data_win_eventdata_commandLine matches '* net use http*', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/ShadowChasing1/status/1552595370961944576
  - https://www.virustotal.com/gui/file/a63376ee1dba76361df73338928e528ca5b20171ea74c24581605366dcaa0104/behavior
  - https://attack.mitre.org/techniques/T1059/001/

response:
  message: >
    Suspicious File Execution From Internet Hosted WebDav Share detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1059.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
  custom_tags:
    - internet
    - hosted
    - webdav
    - process_creation
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_originalFileName:/[Cc][Mm][Dd]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.* [Nn][Ee][Tt] [Uu][Ss][Ee] [Hh][Tt][Tt][Pp].*/ AND data_win_eventdata_commandLine:/.*\& [Ss][Tt][Aa][Rr][Tt] \/[Bb] .*/ AND data_win_eventdata_commandLine:/.*\\[Dd][Aa][Vv][Ww][Ww][Ww][Rr][Oo][Oo][Tt]\\.*/ AND (data_win_eventdata_commandLine:/.*\.[Ee][Xx][Ee] .*/ OR data_win_eventdata_commandLine:/.*\.[Dd][Ll][Ll] .*/ OR data_win_eventdata_commandLine:/.*\.[Bb][Aa][Tt] .*/ OR data_win_eventdata_commandLine:/.*\.[Vv][Bb][Ss] .*/ OR data_win_eventdata_commandLine:/.*\.[Pp][Ss]1 .*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7e6237fe-3ddb-438f-9381-9bf9de5af8d0
    name: Windows Internet Hosted WebDav Share Mount Via Net.EXE
    reason: The net use http mount step seen on its own; confirms the WebDAV mount.
  - id: 1412aa78-a24c-4abd-83df-767dfb2c5bbe
    name: Potentially Suspicious WebDAV LNK Execution
    reason: 'Precursor: the malicious LNK that launches this cmd chain via WebDAV.'
  - id: 1f32d820-1d5c-43fe-8fe2-feef0c952eb7
    name: Emotet Loader Execution Via .LNK File
    reason: LNK-launched cmd loader chain, a known delivery pattern for this behaviour.
  - id: 3215aa19-f060-4332-86d5-5602511f3ca8
    name: Suspicious LNK Double Extension File Created
    reason: 'Precursor: lure LNK dropped by the phishing attachment.'
  - id: fcdf69e5-a3d3-452a-9724-26f2308bf2b1
    name: Phishing Pattern ISO in Archive
    reason: Delivery container for LNK lures that then mount WebDAV.
  - id: 4358e5a5-7542-4dcb-b9f3-87667371839b
    name: ISO or Image Mount Indicator in Recent Files
    reason: Container mount that commonly precedes the LNK launching this chain.
  - id: a6a39bdb-935c-4f0a-ab77-35f4bbf44d33
    name: Potentially Suspicious Powershell Script Execution From Temp Folder
    reason: Follow-on script stage run from the payload.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: net use mounting of http WebDAV shares
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Nn][Ee][Tt] [Uu][Ss][Ee] [Hh][Tt][Tt][Pp].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt]1 [Uu][Ss][Ee] [Hh][Tt][Tt][Pp].*/ OR data_win_eventdata_commandLine:/.*[Dd][Aa][Vv][Ww][Ww][Ww][Rr][Oo][Oo][Tt].*/)
    pivot_on: host
    window: 2h
  - name: Processes started from the WebDAV share
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Dd][Aa][Vv][Ww][Ww][Ww][Rr][Oo][Oo][Tt].*/ OR data_win_eventdata_currentDirectory:/.*[Dd][Aa][Vv][Ww][Ww][Ww][Rr][Oo][Oo][Tt].*/ OR data_win_eventdata_parentCommandLine:/.*[Dd][Aa][Vv][Ww][Ww][Ww][Rr][Oo][Oo][Tt].*/)
    pivot_on: host
    window: 2h
  - name: LNK launching cmd or PowerShell
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]|\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee])/ AND data_win_eventdata_parentImage:/.*(\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\.[Ee][Xx][Ee]|\\[Cc][Mm][Dd]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*\.[Ll][Nn][Kk].*/ OR data_win_eventdata_commandLine:/.*[Dd][Aa][Vv][Ww][Ww][Ww][Rr][Oo][Oo][Tt].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt] [Uu][Ss][Ee].*/)
    pivot_on: host
    window: 2h
  - name: rundll32 or regsvr32 loading from a WebDAV or UNC path
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*(\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee])/) AND (data_win_eventdata_commandLine:/.*[Dd][Aa][Vv][Ww][Ww][Ww][Rr][Oo][Oo][Tt].*/ OR data_win_eventdata_commandLine:/.*\\\\.*/)
    pivot_on: host
    window: 2h
  - name: Web connections by shell hosts and svchost
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*(\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]|\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]|\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee])/) AND (data_win_eventdata_destinationPort:"80" OR data_win_eventdata_destinationPort:"443" OR data_win_eventdata_destinationPort:"8080")
    pivot_on: host
    window: 2h
