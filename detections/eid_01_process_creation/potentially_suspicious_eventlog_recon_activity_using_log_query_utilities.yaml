response:
  message: >
    Potentially Suspicious EventLog Recon Activity Using Log Query Utilities
    detected on host $agent_name$. Matched data_win_eventdata_commandLine:
    $data_win_eventdata_commandLine$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1552, T1087
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1552
    - T1087
  custom_tags:
    - eventlog
    - recon
    - query
    - process_creation
    - sysmon
    - credential_access
    - discovery
  product:
    - Wazuh
  security_domain: endpoint

graylog:
