Dd] -[Ee][Qq] 4778.*/ OR data_win_eventdata_commandLine:/.*\.[Ii][Dd] -[Ee][Qq] 4778.*/ OR data_win_eventdata_commandLine:/.*[Ee][Vv][Ee][Nn][Tt][Cc][Oo][Dd][Ee]=.4778..*/ OR data_win_eventdata_commandLine:/.*[Ee][Vv][Ee][Nn][Tt][Ii][Dd][Ee][Nn][Tt][Ii][Ff][Ii][Ee][Rr]=.4778..*/ OR data_win_eventdata_commandLine:/.*[Ss][Yy][Ss][Tt][Ee][Mm]\[[Ee][Vv][Ee][Nn][Tt][Ii][Dd]=4778\].*/ OR data_win_eventdata_commandLine:/.*-[Ii][Nn][Ss][Tt][Aa][Nn][Cc][Ee][Ii][Dd] 25.*/ OR data_win_eventdata_commandLine:/.*\.[Ee][Vv][Ee][Nn][Tt][Ii][Dd] -[Ee][Qq] 25.*/ OR data_win_eventdata_commandLine:/.*\.[Ii][Dd] -[Ee][Qq] 25.*/ OR data_win_eventdata_commandLine:/.*[Ee][Vv][Ee][Nn][Tt][Cc][Oo][Dd][Ee]=.25..*/ OR data_win_eventdata_commandLine:/.*[Ee][Vv][Ee][Nn][Tt][Ii][Dd][Ee][Nn][Tt][Ii][Ff][Ii][Ee][Rr]=.25..*/ OR data_win_eventdata_commandLine:/.*[Ss][Yy][Ss][Tt][Ee][Mm]\[[Ee][Vv][Ee][Nn][Tt][Ii][Dd]=25\].*/ OR data_win_eventdata_commandLine:/.*-[Ii][Nn][Ss][Tt][Aa][Nn][Cc][Ee][Ii][Dd] 1149.*/ OR data_win_eventdata_commandLine:/.*\.[Ee][Vv][Ee][Nn][Tt][Ii][Dd] -[Ee][Qq] 1149.*/ OR data_win_eventdata_commandLine:/.*\.[Ii][Dd] -[Ee][Qq] 1149.*/ OR data_win_eventdata_commandLine:/.*[Ee][Vv][Ee][Nn][Tt][Cc][Oo][Dd][Ee]=.1149..*/ OR data_win_eventdata_commandLine:/.*[Ee][Vv][Ee][Nn][Tt][Ii][Dd][Ee][Nn][Tt][Ii][Ff][Ii][Ee][Rr]=.1149..*/ OR data_win_eventdata_commandLine:/.*[Ss][Yy][Ss][Tt][Ee][Mm]\[[Ee][Vv][Ee][Nn][Tt][Ii][Dd]=1149\].*/ OR data_win_eventdata_commandLine:/.*-[Ii][Nn][Ss][Tt][Aa][Nn][Cc][Ee][Ii][Dd] 21.*/ OR data_win_eventdata_commandLine:/.*\.[Ee][Vv][Ee][Nn][Tt][Ii][Dd] -[Ee][Qq] 21.*/ OR data_win_eventdata_commandLine:/.*\.[Ii][Dd] -[Ee][Qq] 21.*/ OR data_win_eventdata_commandLine:/.*[Ee][Vv][Ee][Nn][Tt][Cc][Oo][Dd][Ee]=.21..*/ OR data_win_eventdata_commandLine:/.*[Ee][Vv][Ee][Nn][Tt][Ii][Dd][Ee][Nn][Tt][Ii][Ff][Ii][Ee][Rr]=.21..*/ OR data_win_eventdata_commandLine:/.*[Ss][Yy][Ss][Tt][Ee][Mm]\[[Ee][Vv][Ee][Nn][Tt][Ii][Dd]=21\].*/ OR data_win_eventdata_commandLine:/.*-[Ii][Nn][Ss][Tt][Aa][Nn][Cc][Ee][Ii][Dd] 22.*/ OR data_win_eventdata_commandLine:/.*\.[Ee][Vv][Ee][Nn][Tt][Ii][Dd] -[Ee][Qq] 22.*/ OR data_win_eventdata_commandLine:/.*\.[Ii][Dd] -[Ee][Qq] 22.*/ OR data_win_eventdata_commandLine:/.*[Ee][Vv][Ee][Nn][Tt][Cc][Oo][Dd][Ee]=.22..*/ OR data_win_eventdata_commandLine:/.*[Ee][Vv][Ee][Nn][Tt][Ii][Dd][Ee][Nn][Tt][Ii][Ff][Ii][Ee][Rr]=.22..*/ OR data_win_eventdata_commandLine:/.*[Ss][Yy][Ss][Tt][Ee][Mm]\[[Ee][Vv][Ee][Nn][Tt][Ii][Dd]=22\].*/) AND ((data_win_eventdata_commandLine:/.*[Ss][Ee][Ll][Ee][Cc][Tt].*/ AND data_win_eventdata_commandLine:/.*[Ww][Ii][Nn]32_[Nn][Tt][Ll][Oo][Gg][Ee][Vv][Ee][Nn][Tt].*/) OR ((data_win_eventdata_image:/.*\\[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.* [Qq][Ee] .*/ OR data_win_eventdata_commandLine:/.* [Qq][Uu][Ee][Rr][Yy]-[Ee][Vv][Ee][Nn][Tt][Ss] .*/)) OR ((data_win_eventdata_image:/.*\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.* [Nn][Tt][Ee][Vv][Ee][Nn][Tt].*/) OR data_win_eventdata_commandLine:/.*[Gg][Ee][Tt]-[Ww][Ii][Nn][Ee][Vv][Ee][Nn][Tt] .*/ OR data_win_eventdata_commandLine:/.*[Gg][Ee][Tt]-[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg] .*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 236e7c8e-c9d9-11eb-a824-acde48001122
    name: Disable Logs Using WevtUtil
    reason: After mining logs for data, attackers disable or clear logging with wevtutil.
  - id: caf201a9-c2ce-4a26-9c3a-2b9525413711
    name: Potentially Suspicious Call To Win32_NTEventlogFile Class
    reason: WMI route to read or clear event logs, an alternative to log query utilities.
  - id: 383572e0-04c5-11ec-bdcc-acde48001122
    name: Domain Account Discovery with Wmic
    reason: Account discovery commonly accompanies harvesting usernames from logs.
  - id: 224f140f-3553-4cd1-af78-13d81bf9f7cc
    name: Potential RDP Session Hijacking Activity
    reason: RDP session logs queried for source IPs and users precede session abuse.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Wevtutil and Get-WinEvent usage
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Gg]et-[Ww]in[Ee]vent|[Gg]et-[Ee]vent[Ll]og|[Ww]evtutil).*/)
    pivot_on: host
    window: 6h
  - name: Log clearing or logging disabled
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ww]evtutil.*( cl | clear-log|sl .*\/e:false)|[Cc]lear-[Ee]vent[Ll]og|[Rr]emove-[Ee]vent[Ll]og).*/
    pivot_on: host
    window: 6h
  - name: Account and network discovery commands
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*(net +(user|group|localgroup)|whoami|nltest|quser|qwinsta|ipconfig|arp +-a).*/
    pivot_on: host
    window: 4h
  - name: Credential access or lateral movement follow-on
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ll][Ss][Aa][Ss][Ss]|[Mm]imikatz|[Pp][Ss][Ee][Xx][Ee][Cc]|[Ww]inrm|[Ee]nter-[Pp][Ss][Ss]ession|[Ss]ekurlsa).*/
    pivot_on: host
    window: 6h
