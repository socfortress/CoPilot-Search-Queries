name: Windows DiskCryptor Usage
id: windows-diskcryptor-usage-001
version: 1
schema_version: "1.0"
date: "2026-02-23"
author: SOCFortress LLC
status: production
type: Hunting

description: >
  Detects execution of DiskCryptor (dcrypt.exe or dcinst.exe), an open-source 
  disk encryption tool abused by ransomware operators for full disk encryption 
  during attacks. Immediate investigation required as this may indicate an 
  active ransomware operation.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image: "*\\\\dcrypt.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\\\dcinst.exe"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-23 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-23 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Windows endpoints with Sysmon 
  installed and configured to log process creation events (EventID 1).

known_false_positives: >
  Legitimate use of DiskCryptor for authorized disk encryption. Very rare in 
  enterprise environments. Investigate immediately.

references:
  - https://attack.mitre.org/techniques/T1486/
  - https://thedfirreport.com/2021/11/15/exchange-exploit-leads-to-domain-wide-ransomware/
  - https://github.com/DavidXanatos/DiskCryptor

response:
  message: >
    DiskCryptor detected on $agent_name$. 
    Process: $data_win_eventdata_image$. 
    Command: $data_win_eventdata_commandLine$. 
    User: $data_win_eventdata_user$. 
    Possible ransomware disk encryption. MITRE ATT&CK: T1486
  risk_score: 72
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 72
  threat_objects: []

tags:
  analytic_story:
    - Ransomware
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1486
  custom_tags:
    - diskcryptor
    - ransomware
    - disk_encryption
    - data_destruction
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*dcrypt\.exe/ OR data_win_eventdata_image:/.*dcinst\.exe/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: Ransomware deletes shadow copies before full-disk encryption to block recovery.
  - id: 639c9081-f482-47d3-a0bd-ddee3d4ecd76
    name: All Backups Deleted Via Wbadmin.EXE
    reason: Backup destruction precedes disk encryption in ransomware playbooks.
  - id: c9fbe8e9-119d-40a6-9b59-dd58a5d84429
    name: Potential Ransomware or Unauthorized MBR Tampering Via Bcdedit.EXE
    reason: Boot recovery disabling pairs with boot-level disk encryption.
  - id: d7662ff6-9e97-4596-a61d-9839e32dee8d
    name: Add SafeBoot Keys Via Reg Utility
    reason: Encryptors often reboot into safe mode to encrypt without AV.
  - id: windows-attempt-stop-security-service-001
    name: Windows Attempt To Stop Security Service
    reason: Security tooling is stopped before the encryptor runs.
  - id: windows-modify-registry-configure-bitlocker-001
    name: Windows Modify Registry Configure BitLocker
    reason: Native disk-encryption abuse with the same objective.
  - id: 0e0255bf-2548-47b8-9582-c0955c9283f5
    name: Suspicious Reg Add BitLocker
    reason: Attacker-driven BitLocker configuration alongside or instead of DiskCryptor.
  - id: 4b046706-5789-4673-b111-66f25fe99534
    name: Deleted Data Overwritten Via Cipher.EXE
    reason: Free-space wiping to prevent recovery after encryption.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Recovery inhibition commands
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Vv]ssadmin.*delete|[Ww]badmin.*delete|[Bb]cdedit.*(recoveryenabled|bootstatuspolicy)|[Ww]mic.*shadowcopy.*delete).*/
    pivot_on: host
    window: 24h
  - name: Disk encryption driver or tool names
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*(dcrypt|dcinst|dcapi|dcconsole|[Vv]era[Cc]rypt).*/
    pivot_on: host
    window: 24h
  - name: Security service stops and kills
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*(net1? +stop|sc(\.exe)? +stop|[Tt]askkill).*/
    pivot_on: host
    window: 6h
  - name: Safe mode boot configuration
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Bb]cdedit.*safeboot|SafeBoot\\Minimal|SafeBoot\\Network).*/
    pivot_on: host
    window: 6h
  - name: Cipher free-space wipe, format or diskpart
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Cc]ipher.*\/[Ww]|[Ff]ormat\.com|diskpart).*/
    pivot_on: host
    window: 24h
