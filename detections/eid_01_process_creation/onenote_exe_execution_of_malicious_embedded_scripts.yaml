name: OneNote.EXE Execution of Malicious Embedded Scripts
id: 84b1706c-932a-44c4-ae28-892b28a25b94
version: 1
schema_version: "1.0"
date: "2023-02-02"
author: "@kostastsale"
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 84b1706c-932a-44c4-ae28-892b28a25b94
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of malicious OneNote documents that contain embedded
  scripts. When a user clicks on a OneNote attachment and then on the malicious
  link inside the ".one" file, it exports and executes the malicious embedded
  script from specific directories. MITRE ATT&CK: T1218.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_parentImage:
              value: "*\\\\onenote.exe"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\cmd.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\cscript.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\mshta.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\powershell.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\pwsh.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\wscript.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\exported\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\onenoteofflinecache_files\\\\*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\onenote.exe'; data_win_eventdata_image matches '*\cmd.exe';
  data_win_eventdata_image matches '*\cscript.exe', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://bazaar.abuse.ch/browse/tag/one/
  - https://attack.mitre.org/techniques/T1218/001/

response:
  message: >
    OneNote.EXE Execution of Malicious Embedded Scripts detected on host
    $agent_name$. Matched data_win_eventdata_parentImage:
    $data_win_eventdata_parentImage$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1218.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218.001
  custom_tags:
    - onenote
    - embedded
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Oo][Nn][Ee][Nn][Oo][Tt][Ee]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*\\[Ee][Xx][Pp][Oo][Rr][Tt][Ee][Dd]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Oo][Nn][Ee][Nn][Oo][Tt][Ee][Oo][Ff][Ff][Ll][Ii][Nn][Ee][Cc][Aa][Cc][Hh][Ee]_[Ff][Ii][Ll][Ee][Ss]\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c27515df-97a9-4162-8a60-dc0eeb51b775
    name: Suspicious Microsoft OneNote Child Process
    reason: Sibling OneNote suspicious child process detection; confirms the same lure.
  - id: 7fd164ba-126a-4d9c-9392-0d4f7c243df0
    name: OneNote Attachment File Dropped In Suspicious Location
    reason: 'Precursor: the .one attachment dropped to a suspicious location before click.'
  - id: fcc6d700-68d9-4241-9a1a-06874d621b06
    name: Suspicious File Created Via OneNote Application
    reason: 'Precursor: OneNote writing an executable/script file when the embedded object is exported.'
  - id: cea72823-df4d-4567-950c-0b579eaf0846
    name: Potential Dropper Script Execution Via WScript/CScript/MSHTA
    reason: 'Follow-on: dropper script executed by WScript/CScript/MSHTA.'
  - id: b6676963-0353-4f88-90f5-36c20d443c6a
    name: Cscript/Wscript Potentially Suspicious Child Process
    reason: 'Follow-on: script host spawning downloaders or shells.'
  - id: 9b3af1e6-5b68-11eb-ae93-0242ac130002
    name: Detect MSHTA Url in Command Line
    reason: 'Follow-on: mshta fetching remote content, a common OneNote payload.'
  - id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
    name: PowerShell Download and Execution Cradles
    reason: 'Follow-on: PowerShell download cradle launched by the embedded script.'
  - id: a6a39bdb-935c-4f0a-ab77-35f4bbf44d33
    name: Potentially Suspicious Powershell Script Execution From Temp Folder
    reason: 'Follow-on: PowerShell script run from a temp folder where OneNote exports content.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Script files created by OneNote
    query: data_win_system_eventID:11 AND data_win_eventdata_image:/.*[Oo]ne[Nn]ote\.exe/ AND data_win_eventdata_targetFilename:/.*\.([Vv][Bb][Ss]|[Jj][Ss]|[Hh][Tt][Aa]|[Ww][Ss][Ff]|[Cc][Mm][Dd]|[Bb][Aa][Tt]|[Pp][Ss]1|[Ee][Xx][Ee]|[Ll][Nn][Kk])/
    pivot_on: host
    window: 2h
  - name: Script hosts running from OneNote cache
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*([Ww]script|[Cc]script|[Mm]shta)\.exe/ AND data_win_eventdata_commandLine:/.*([Oo]ne[Nn]ote|[Ee]xported).*/
    pivot_on: host
    window: 2h
  - name: Downloader children of script hosts
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*([Ww]script|[Cc]script|[Mm]shta|[Cc]md)\.exe/ AND data_win_eventdata_commandLine:/.*([Cc]url|[Bb]itsadmin|[Cc]ertutil|[Ii]nvoke-[Ww]eb[Rr]equest|[Dd]ownload[Ss]tring|http).*/
    pivot_on: host
    window: 2h
  - name: Network from OneNote and script hosts
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*([Oo]ne[Nn]ote|[Ww]script|[Cc]script|[Mm]shta)\.exe/
    pivot_on: host
    window: 2h
  - name: DNS lookups by script hosts
    query: data_win_system_eventID:22 AND data_win_eventdata_image:/.*([Ww]script|[Cc]script|[Mm]shta)\.exe/
    pivot_on: host
    window: 2h
