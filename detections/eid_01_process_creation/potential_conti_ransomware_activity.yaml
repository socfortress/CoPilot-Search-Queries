name: Potential Conti Ransomware Activity
id: 689308fc-cfba-4f72-9897-796c1dc61487
version: 1
schema_version: "1.0"
date: "2023-02-13"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 689308fc-cfba-4f72-9897-796c1dc61487
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a specific command used by the Conti ransomware group. MITRE ATT&CK:
  T1486.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*-m *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*-net *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*-size *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*-nomutex *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*-p \\\\\\\\*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine: "*$*"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches '*-m
  *'; data_win_eventdata_commandLine matches '*-net *';
  data_win_eventdata_commandLine matches '*-size *', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://news.sophos.com/en-us/2021/09/03/conti-affiliates-use-proxyshell-exchange-exploit-in-ransomware-attacks/
  - https://twitter.com/VK_Intel/status/1447795359900704769?t=Xz7vaLTvaaCZ5kHoZa6gMw&s=19
  - https://attack.mitre.org/techniques/T1486/

response:
  message: >
    Potential Conti Ransomware Activity detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1486
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1486
  custom_tags:
    - conti
    - ransomware
    - process_creation
    - sysmon
    - impact
    - s0575
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*-[Mm] .*/ AND data_win_eventdata_commandLine:/.*-[Nn][Ee][Tt] .*/ AND data_win_eventdata_commandLine:/.*-[Ss][Ii][Zz][Ee] .*/ AND data_win_eventdata_commandLine:/.*-[Nn][Oo][Mm][Uu][Tt][Ee][Xx] .*/ AND data_win_eventdata_commandLine:/.*-[Pp] \\\\.*/ AND data_win_eventdata_commandLine:/.*\$.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 2f47f1fd-0901-466e-a770-3b7092834a1b
    name: Potential Conti Ransomware Database Dumping Activity Via SQLCmd
    reason: Conti operators dump databases before encrypting (double extortion).
  - id: aa92fd02-09f2-48b0-8a93-864813fb8f41
    name: Conti NTDS Exfiltration Command
    reason: Conti steals NTDS.dit for domain compromise ahead of encryption.
  - id: 7b30e0a7-c675-4b24-8a46-82fa67e2433d
    name: Conti Volume Shadow Listing
    reason: Conti enumerates shadow copies before deleting them to block recovery.
  - id: c9fbe8e9-119d-40a6-9b59-dd58a5d84429
    name: Potential Ransomware or Unauthorized MBR Tampering Via Bcdedit.EXE
    reason: Recovery inhibition via bcdedit accompanies encryption.
  - id: 514e7e3e-b3b4-4a67-af60-be20f139198b
    name: PUA - AdFind.EXE Execution
    reason: Conti uses AdFind for AD discovery in the pre-encryption stage.
  - id: bef37fa2-f205-4a7b-b484-0759bfd5f86f
    name: PUA - Advanced IP Scanner Execution
    reason: Network scan to find SMB hosts/shares the encryptor targets with -net.
  - id: e37db05d-d1f9-49c8-b464-cee1a4b11638
    name: PUA - Rclone Execution
    reason: Rclone exfiltration is the data-theft step preceding encryption.
  - id: 855bc8b5-2ae8-402e-a9ed-b889e6df1900
    name: Copy From Or To Admin Share Or Sysvol Folder
    reason: Lateral staging of the encryptor to admin shares across hosts.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Shadow copy / backup deletion and recovery inhibition
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*[Ss]hadows?.*[Dd]elete.*/ OR data_win_eventdata_commandLine:/.*[Ww]badmin.*[Dd]elete.*/ OR data_win_eventdata_commandLine:/.*[Rr]ecoveryenabled.*/)
    pivot_on: host
    window: 6h
  - name: Remote execution of the encryptor (PsExec/WMI)
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*[Pp]s[Ee]xec.*/ OR data_win_eventdata_parentImage:/.*[Ww]mi[Pp]rv[Ss][Ee]\.exe/ OR data_win_eventdata_commandLine:/.*[Pp]s[Ee]xec.*/)
    pivot_on: host
    window: 6h
  - name: Ransom notes and encrypted file artefacts
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(/.*\.[Cc][Oo][Nn][Tt][Ii].*/ OR /.*[Rr][Ee][Aa][Dd][Mm][Ee]\.txt/)
    pivot_on: host
    window: 6h
  - name: Disabling security tooling and backup services
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*[Ss]et-[Mm]p[Pp]reference.*[Dd]isable.*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc].*(stop|config).*(sql|veeam|backup|defend).*/ OR data_win_eventdata_commandLine:/.*[Tt]askkill.*/)
    pivot_on: host
    window: 6h
  - name: Outbound transfer / exfil tooling
    query: data_win_system_eventID:1 AND data_win_eventdata_image:(/.*[Rr]clone.*/ OR /.*[Mm]egasync.*/ OR /.*[Ww]in[Ss][Cp][Pp].*/ OR /.*[Ff]ile[Zz]illa.*/)
    pivot_on: host
    window: 24h
