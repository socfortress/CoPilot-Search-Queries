name: Windows Defender Disabled Via SystemSettingsAdminFlows.EXE
id: da92713f-ca2d-4fab-8320-098013d3f43a
version: 1
schema_version: "1.0"
date: "2026-07-01"
author: Chirag Damani (KPMG India), Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: da92713f-ca2d-4fab-8320-098013d3f43a
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the usage of SystemSettingsAdminFlows.exe to disable Windows Defender.
  SystemSettingsAdminFlows.exe is a legitimate Windows component used for
  administrative configuration tasks. However, attackers may abuse it to disable
  Windows Defender as part of their attack chain, especially in the context of
  ransomware or other malware campaigns. MITRE ATT&CK: T1685.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\SystemSettingsAdminFlows.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "SystemSettingsAdminFlows.EXE"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*defender*"
              case_insensitive: true
        - bool:
            should:
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*RTP *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*RealTimeProtection *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*DisableEnhancedNotifications *"
                                case_insensitive: true
                        minimum_should_match: 1
                    - wildcard:
                        data_win_eventdata_commandLine: "*1*"
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*SubmitSamplesConsent *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*SpyNetReporting *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*DisableCDPUserAuthPolicy *"
                                case_insensitive: true
                        minimum_should_match: 1
                    - wildcard:
                        data_win_eventdata_commandLine: "*0*"
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\SystemSettingsAdminFlows.exe'; data_win_eventdata_originalFileName equals
  'SystemSettingsAdminFlows.EXE'; data_win_eventdata_commandLine matches
  '*defender*', among other conditions.

known_false_positives: >
  Legitimate turn off of Windows Defender by the technical users or
  administrators for troubleshooting or other purposes. Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://thedfirreport.com/2026/02/23/apache-activemq-exploit-leads-to-lockbit-ransomware/
  - https://www.huntress.com/blog/lolbin-to-inc-ransomware
  - https://attack.mitre.org/techniques/T1685/

response:
  message: >
    Windows Defender Disabled Via SystemSettingsAdminFlows.EXE detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1685
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685
  custom_tags:
    - defender
    - systemsettingsadminflows
    - process_creation
    - sysmon
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ss][Yy][Ss][Tt][Ee][Mm][Ss][Ee][Tt][Tt][Ii][Nn][Gg][Ss][Aa][Dd][Mm][Ii][Nn][Ff][Ll][Oo][Ww][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ss][Yy][Ss][Tt][Ee][Mm][Ss][Ee][Tt][Tt][Ii][Nn][Gg][Ss][Aa][Dd][Mm][Ii][Nn][Ff][Ll][Oo][Ww][Ss]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr].*/ AND (((data_win_eventdata_commandLine:/.*[Rr][Tt][Pp] .*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee][Pp][Rr][Oo][Tt][Ee][Cc][Tt][Ii][Oo][Nn] .*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Ee][Nn][Hh][Aa][Nn][Cc][Ee][Dd][Nn][Oo][Tt][Ii][Ff][Ii][Cc][Aa][Tt][Ii][Oo][Nn][Ss] .*/) AND data_win_eventdata_commandLine:/.*1.*/) OR ((data_win_eventdata_commandLine:/.*[Ss][Uu][Bb][Mm][Ii][Tt][Ss][Aa][Mm][Pp][Ll][Ee][Ss][Cc][Oo][Nn][Ss][Ee][Nn][Tt] .*/ OR data_win_eventdata_commandLine:/.*[Ss][Pp][Yy][Nn][Ee][Tt][Rr][Ee][Pp][Oo][Rr][Tt][Ii][Nn][Gg] .*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Cc][Dd][Pp][Uu][Ss][Ee][Rr][Aa][Uu][Tt][Hh][Pp][Oo][Ll][Ii][Cc][Yy] .*/) AND data_win_eventdata_commandLine:/.*0.*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b28e58e4-2a72-4fae-bdee-0fbe904db642
    name: Windows Defender Real-time Protection Disabled
    reason: Direct Defender-log outcome of real-time protection being switched off via this utility.
  - id: 93d298a1-d28f-47f1-a468-d971e7796679
    name: Disable Tamper Protection on Windows Defender
    reason: Disabling Defender via the settings flow generally requires or follows tamper protection being turned off.
  - id: 0eb46774-f1ab-4a74-8238-1155855f2263
    name: Disable Windows Defender Functionalities Via Registry Keys
    reason: Registry changes that accompany this binary in the same disabling routine.
  - id: bc275be9-0bec-4d77-8c8f-281a2df6710f
    name: Windows Defender Malware And PUA Scanning Disabled
    reason: Scanning-disabled events confirm the tool changed Defender state.
  - id: 49e5bc24-8b86-49f1-b743-535f332c2856
    name: Microsoft Defender Tamper Protection Trigger
    reason: Tamper protection may fire if the disabling attempt was blocked.
  - id: a7ee1722-c3c5-aeff-3212-c777e4733217
    name: Disable Windows Defender AV Security Monitoring
    reason: Alternate command-line method for the same objective, often tried in sequence.
  - id: 1321dc4e-a1fe-481d-a016-52c45f0c8b4f
    name: Windows Defender Exclusions Added
    reason: Ransomware playbooks add exclusions alongside disabling.
  - id: 9719a8aa-401c-41af-8108-ced7ec9cd75c
    name: Windows Defender Definition Files Removed
    reason: Another Defender-impairment step common in the same intrusion.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: SystemSettingsAdminFlows executions
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Ss]ystem[Ss]ettings[Aa]dmin[Ff]lows.exe/
    pivot_on: host
    window: 4h
  - name: Defender real-time or tamper protection registry changes
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*([Dd]isable[Rr]ealtime[Mm]onitoring|[Tt]amper[Pp]rotection|[Dd]isable[Aa]nti[Ss]pyware|[Rr]eal-[Tt]ime [Pp]rotection).*/
    pivot_on: host
    window: 4h
  - name: Defender operational log disable events
    query: data_win_system_eventID:(5001 OR 5007 OR 5010 OR 5012 OR 5013)
    pivot_on: host
    window: 4h
  - name: 'Ransomware precursors: shadow copy and recovery tampering'
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*[Vv]ssadmin.*[Dd]elete.*[Ss]hadows.*/ OR data_win_eventdata_commandLine:/.*[Bb]cdedit.*(recoveryenabled|bootstatuspolicy).*/ OR data_win_eventdata_commandLine:/.*[Ww]badmin.*[Dd]elete.*/)
    pivot_on: host
    window: 6h
