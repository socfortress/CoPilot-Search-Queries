name: Potentially Suspicious WebDAV LNK Execution
id: 1412aa78-a24c-4abd-83df-767dfb2c5bbe
version: 1
schema_version: "1.0"
date: "2023-08-21"
author: Micah Babinski
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 1412aa78-a24c-4abd-83df-767dfb2c5bbe
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects possible execution via LNK file accessed on a WebDAV server. MITRE
  ATT&CK: T1059.001, T1204.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_parentImage:
              value: "*\\\\explorer.exe"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\cmd.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\cscript.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\mshta.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\powershell.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\pwsh.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\wscript.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*\\\\DavWWWRoot\\\\*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\explorer.exe'; data_win_eventdata_image matches '*\cmd.exe';
  data_win_eventdata_image matches '*\cscript.exe', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.trellix.com/en-us/about/newsroom/stories/research/beyond-file-search-a-novel-method.html
  - https://micahbabinski.medium.com/search-ms-webdav-and-chill-99c5b23ac462
  - https://attack.mitre.org/techniques/T1059/001/
  - https://attack.mitre.org/techniques/T1204/

response:
  message: >
    Potentially Suspicious WebDAV LNK Execution detected on host $agent_name$.
    Matched data_win_eventdata_parentImage: $data_win_eventdata_parentImage$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1059.001, T1204
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
    - T1204
  custom_tags:
    - webdav
    - process_creation
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*\\[Dd][Aa][Vv][Ww][Ww][Ww][Rr][Oo][Oo][Tt]\\.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7e6237fe-3ddb-438f-9381-9bf9de5af8d0
    name: Windows Internet Hosted WebDav Share Mount Via Net.EXE
    reason: Net use of an internet WebDAV share is the sibling way victims reach the same attacker share
  - id: f0507c0f-a3a2-40f5-acc6-7f543c334993
    name: Suspicious File Execution From Internet Hosted WebDav Share
    reason: Direct execution of payloads from DavWWWRoot is the next stage once the LNK launches
  - id: 2dbd9d3d-9e27-42a8-b8df-f13825c6c3d5
    name: WebDav Client Execution Via Rundll32.EXE
    reason: davclnt.dll via rundll32 is a WebDAV client precursor/alternate delivery
  - id: 982e9f2d-1a85-4d5b-aea4-31f5e97c6555
    name: Suspicious WebDav Client Execution Via Rundll32.EXE
    reason: Variant of rundll32 WebDAV fetch tied to the same phishing delivery
  - id: cea72823-df4d-4567-950c-0b579eaf0846
    name: Potential Dropper Script Execution Via WScript/CScript/MSHTA
    reason: The LNK often launches a script dropper through these interpreters
  - id: b98d0db6-511d-45de-ad02-e82a98729620
    name: Remotely Hosted HTA File Executed Via Mshta.EXE
    reason: Remote HTA is a common payload fetched from the same WebDAV server
  - id: 33339be3-148b-4e16-af56-ad16ec6c7e7b
    name: Findstr Launching .lnk File
    reason: Related LNK-based launch technique in the same phishing family
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Payload execution from DavWWWRoot or WebDAV UNC
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Dd][Aa][Vv][Ww][Ww][Ww][Rr][Oo][Oo][Tt].*/ OR data_win_eventdata_commandLine:/.*@(80|443|8080|8443)\\.*/ OR data_win_eventdata_commandLine:/.*[Dd]av[Cc]lnt.*/)
    pivot_on: host
    window: 2h
  - name: WebDAV share mount via net use or WebClient service
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Nn]et1? [Uu]se .*http.*/ OR data_win_eventdata_commandLine:/.*[Nn]et1? [Ss]tart [Ww]eb[Cc]lient.*/ OR data_win_eventdata_commandLine:/.*[Ss]c .*[Ww]eb[Cc]lient.*/)
    pivot_on: host
    window: 2h
  - name: Script and LOLBin children fetching remote content
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\(powershell|pwsh|mshta|wscript|cscript|rundll32|regsvr32)\.exe/ AND (data_win_eventdata_commandLine:/.*[Hh]ttp.*/ OR data_win_eventdata_commandLine:/.*[Ee]nc.*/ OR data_win_eventdata_commandLine:/.*[Hh]idden.*/ OR data_win_eventdata_commandLine:/.*[Dd]ownload.*/)
    pivot_on: host
    window: 2h
  - name: Payload staged in user-writable paths
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Aa]pp[Dd]ata.*\.(exe|dll|js|vbs|hta|bat|ps1).*/ OR data_win_eventdata_commandLine:/.*[Pp]rogram[Dd]ata.*\.(exe|dll|js|vbs).*/ OR data_win_eventdata_commandLine:/.*[Pp]ublic.*\.(exe|dll|js|vbs).*/)
    pivot_on: host
    window: 4h
  - name: Persistence by the same user after execution
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss].*\/[Cc][Rr][Ee][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Rr]eg .*[Aa]dd.*[Rr]un.*/)
    pivot_on: user
    window: 4h
