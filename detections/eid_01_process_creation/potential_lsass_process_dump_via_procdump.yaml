name: Potential LSASS Process Dump Via Procdump
id: 5afee48e-67dd-4e03-a783-f74259dcf998
version: 1
schema_version: "1.0"
date: "2025-10-19"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 5afee48e-67dd-4e03-a783-f74259dcf998
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: production
type: TTP

description: >
  Detects potential credential harvesting attempts through LSASS memory dumps
  using ProcDump. This rule identifies suspicious command-line patterns that
  combine memory dump flags (-ma, -mm, -mp) with LSASS-related process markers.
  LSASS (Local Security Authority Subsystem Service) contains sensitive
  authentication data including plaintext passwords, NTLM hashes, and Kerberos
  tickets in memory. Attackers commonly dump LSASS memory to extract credentials
  for lateral movement and privilege escalation. MITRE ATT&CK: T1036, T1003.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -ma *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /ma *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* –ma *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* —ma *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* ―ma *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -mm *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /mm *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* –mm *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* —mm *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* ―mm *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -mp *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /mp *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* –mp *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* —mp *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* ―mp *"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* ls*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* keyiso*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* samss*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches '* -ma
  *'; data_win_eventdata_commandLine matches '* /ma *';
  data_win_eventdata_commandLine matches '* –ma *', among other conditions.

known_false_positives: >
  Unlikely, because no one should dump an lsass process memory. Another tool
  that uses command line flags similar to ProcDump. Baseline expected activity
  in your environment and tune this detection before relying on it for automated
  response.

references:
  - https://learn.microsoft.com/en-us/sysinternals/downloads/procdump
  - https://research.splunk.com/endpoint/3742ebfe-64c2-11eb-ae93-0242ac130002
  - https://x.com/wietze/status/1958302556033065292?s=12
  - https://attack.mitre.org/techniques/T1036/
  - https://attack.mitre.org/techniques/T1003/001/

response:
  message: >
    Potential LSASS Process Dump Via Procdump detected on host $agent_name$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1036, T1003.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1036
    - T1003.001
  custom_tags:
    - lsass
    - procdump
    - process_creation
    - sysmon
    - stealth
    - credential_access
    - car_2013_05_009
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.* -[Mm][Aa] .*/ OR data_win_eventdata_commandLine:/.* \/[Mm][Aa] .*/ OR data_win_eventdata_commandLine:/.* –[Mm][Aa] .*/ OR data_win_eventdata_commandLine:/.* —[Mm][Aa] .*/ OR data_win_eventdata_commandLine:/.* ―[Mm][Aa] .*/ OR data_win_eventdata_commandLine:/.* -[Mm][Mm] .*/ OR data_win_eventdata_commandLine:/.* \/[Mm][Mm] .*/ OR data_win_eventdata_commandLine:/.* –[Mm][Mm] .*/ OR data_win_eventdata_commandLine:/.* —[Mm][Mm] .*/ OR data_win_eventdata_commandLine:/.* ―[Mm][Mm] .*/ OR data_win_eventdata_commandLine:/.* -[Mm][Pp] .*/ OR data_win_eventdata_commandLine:/.* \/[Mm][Pp] .*/ OR data_win_eventdata_commandLine:/.* –[Mm][Pp] .*/ OR data_win_eventdata_commandLine:/.* —[Mm][Pp] .*/ OR data_win_eventdata_commandLine:/.* ―[Mm][Pp] .*/) AND (data_win_eventdata_commandLine:/.* [Ll][Ss].*/ OR data_win_eventdata_commandLine:/.* [Kk][Ee][Yy][Ii][Ss][Oo].*/ OR data_win_eventdata_commandLine:/.* [Ss][Aa][Mm][Ss][Ss].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 2e65275c-8288-4ab4-aeb7-6274f58b6b20
    name: Procdump Execution
    reason: Generic ProcDump launch on the same host; shows other dump targets or staging used alongside the LSASS dump.
  - id: 4a0b2c7e-7cb2-495d-8b63-5f268e7bfd67
    name: Renamed ProcDump Execution
    reason: Attackers rename procdump to dodge name-based rules; a renamed copy on the same host confirms deliberate evasion.
  - id: 79b06761-465f-4f88-9ef2-150e24d3d737
    name: Potential SysInternals ProcDump Evasion
    reason: Alternate procdump invocation tricks used to evade LSASS dump detection, same tool family.
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: If procdump is blocked or fails, operators fall back to comsvcs MiniDump to get the same LSASS credentials.
  - id: ffa6861c-4461-4f59-8a41-578c39f3f23e
    name: LSASS Dump Keyword In CommandLine
    reason: Other commands naming lsass dumps on the host in the same credential-theft attempt.
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: Dump is typically parsed with mimikatz/pypykatz; direct mimikatz use is the parallel path.
  - id: a29808fd-ef50-49ff-9c7a-59a9b040b404
    name: HackTool - Pypykatz Credentials Dumping Activity
    reason: Pypykatz is a common follow-on that parses the dump file produced by procdump.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: LSASS access by other processes
    query: data_win_system_eventID:10 AND data_win_eventdata_targetImage:/.*[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 1h
  - name: Dump file creation
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\.[Dd][Mm][Pp]/
    pivot_on: host
    window: 2h
  - name: Dump compression or transfer
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Dd][Mm][Pp].*/ AND (/.*[Cc]ompress-[Aa]rchive.*/ OR /.*[Rr]ar.*/ OR /.*7z.*/ OR /.*[Cc]opy.*/ OR /.*[Cc]url.*/))
    pivot_on: host
    window: 4h
  - name: Credential tool or lateral movement follow-on
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ss]ekurlsa.*/ OR /.*[Pp]ypykatz.*/ OR /.*[Pp]sexec.*/ OR /.*[Nn]et use.*/)
    pivot_on: host
    window: 4h
  - name: Network logons by the same account
    query: data_win_system_eventID:4624 AND data_win_eventdata_logonType:(3 OR 9 OR 10)
    pivot_on: user
    window: 6h
