name: Potential Network Sniffing Activity Using Network Tools
id: ba1f7802-adc7-48b4-9ecb-81e227fddfd5
version: 1
schema_version: "1.0"
date: "2023-02-20"
author: Timur Zinniatullin, oscd.community, Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: ba1f7802-adc7-48b4-9ecb-81e227fddfd5
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential network sniffing via use of network tools such as "tshark",
  "windump". Network sniffing refers to using the network interface on a system
  to monitor or capture information sent over a wired or wireless connection. An
  adversary may place a network interface into promiscuous mode to passively
  access data in transit over the network, or use span ports to capture a larger
  amount of data. MITRE ATT&CK: T1040.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\tshark.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*-i*"
                          case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\windump.exe"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\tshark.exe'; data_win_eventdata_commandLine matches '*-i*';
  data_win_eventdata_image matches '*\windump.exe'.

known_false_positives: >
  Legitimate administration activity to troubleshoot network issues. Baseline
  expected activity in your environment and tune this detection before relying
  on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1040/T1040.md
  - https://attack.mitre.org/techniques/T1040/

response:
  message: >
    Potential Network Sniffing Activity Using Network Tools detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
    MITRE ATT&CK: T1040
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1040
  custom_tags:
    - network
    - sniffing
    - tools
    - process_creation
    - sysmon
    - credential_access
    - discovery
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\[Tt][Ss][Hh][Aa][Rr][Kk]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*-[Ii].*/) OR data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: f956c7c1-0f60-4bc5-b7d7-b39ab3c08908
    name: PktMon.EXE Execution
    reason: Built-in packet capture alternative to tshark/windump used for the same purpose.
  - id: da34e323-1e65-42db-83be-a6725ac2caa3
    name: Potential Packet Capture Activity Via Start-NetEventSession - ScriptBlock
    reason: PowerShell-native capture; attackers switch tools if one is blocked.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other capture tools
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Tt][Ss][Hh][Aa][Rr][Kk]\.[Ee][Xx][Ee]|[Ww][Ii][Nn][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]|[Dd][Uu][Mm][Pp][Cc][Aa][Pp]\.[Ee][Xx][Ee]|[Pp][Kk][Tt][Mm][Oo][Nn]\.[Ee][Xx][Ee]|[Ww][Ii][Rr][Ee][Ss][Hh][Aa][Rr][Kk]\.[Ee][Xx][Ee])/ OR (data_win_eventdata_image:/.*\\([Nn][Ee][Tt][Ss][Hh]\.[Ee][Xx][Ee])/ AND data_win_eventdata_commandLine:/.*[Tt][Rr][Aa][Cc][Ee].*/))
    pivot_on: host
    window: 24h
  - name: Capture driver or capture file written
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*([Nn][Pp][Cc][Aa][Pp]|[Ww][Ii][Nn][Pp][Cc][Aa][Pp]|\.[Pp][Cc][Aa][Pp]|\.[Ee][Tt][Ll]).*/
    pivot_on: host
    window: 24h
  - name: Capture output archived or exfiltrated
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\(7[Zz]\.[Ee][Xx][Ee]|[Rr][Aa][Rr]\.[Ee][Xx][Ee]|[Tt][Aa][Rr]\.[Ee][Xx][Ee]|[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee])/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]-[Aa][Rr][Cc][Hh][Ii][Vv][Ee].*/) AND (data_win_eventdata_commandLine:/.*[Pp][Cc][Aa][Pp].*/ OR data_win_eventdata_commandLine:/.*\.[Ee][Tt][Ll].*/)
    pivot_on: host
    window: 24h
  - name: Credential access tooling after capture
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Ss][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Cc][Rr][Ee][Tt][Ss][Dd][Uu][Mm][Pp].*/)
    pivot_on: host
    window: 24h
