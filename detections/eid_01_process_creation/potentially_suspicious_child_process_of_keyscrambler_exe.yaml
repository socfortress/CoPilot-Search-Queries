name: Potentially Suspicious Child Process of KeyScrambler.exe
id: ca5583e9-8f80-46ac-ab91-7f314d13b984
version: 1
schema_version: "1.0"
date: "2024-05-13"
author: Swachchhanda Shrawan Poudel
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: ca5583e9-8f80-46ac-ab91-7f314d13b984
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potentially suspicious child processes of KeyScrambler.exe. MITRE
  ATT&CK: T1203, T1574.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_parentImage:
              value: "*\\\\KeyScrambler.exe"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\cmd.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\cscript.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\mshta.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\powershell.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\pwsh.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\regsvr32.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\rundll32.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\wscript.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "Cmd.Exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "cscript.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "mshta.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "PowerShell.EXE"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "pwsh.dll"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "regsvr32.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "RUNDLL32.EXE"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "wscript.exe"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\KeyScrambler.exe'; data_win_eventdata_image matches '*\cmd.exe';
  data_win_eventdata_image matches '*\cscript.exe', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/DTCERT/status/1712785421845790799
  - https://attack.mitre.org/techniques/T1203/
  - https://attack.mitre.org/techniques/T1574/001/

response:
  message: >
    Potentially Suspicious Child Process of KeyScrambler.exe detected on host
    $agent_name$. Matched data_win_eventdata_parentImage:
    $data_win_eventdata_parentImage$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1203, T1574.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1203
    - T1574.001
  custom_tags:
    - child
    - keyscrambler
    - process_creation
    - sysmon
    - persistence
    - execution
    - privilege_escalation
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Kk][Ee][Yy][Ss][Cc][Rr][Aa][Mm][Bb][Ll][Ee][Rr]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Pp][Ww][Ss][Hh]\.[Dd][Ll][Ll]/ OR data_win_eventdata_originalFileName:/[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e593cf51-88db-4ee1-b920-37e89012a3c9
    name: Potentially Suspicious Rundll32 Activity
    reason: rundll32 child of KeyScrambler indicates DLL proxy execution after hijack.
  - id: cf879ffb-793a-4753-9a14-bc8f37cc90df
    name: Potential Qakbot Rundll32 Execution
    reason: Loader families using DLL side-loading (e.g. Qakbot) then run rundll32 execution.
  - id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
    name: PowerShell Download and Execution Cradles
    reason: A hijacked process spawning powershell often downloads a next-stage payload.
  - id: b6676963-0353-4f88-90f5-36c20d443c6a
    name: Cscript/Wscript Potentially Suspicious Child Process
    reason: wscript/cscript children continue the chain with script payloads.
  - id: 24357373-078f-44ed-9ac4-6d334a668a11
    name: Direct Autorun Keys Modification
    reason: Side-loading actors persist through autorun keys after first execution.
  - id: 9525dc73-0327-438c-8c04-13c0e037e9da
    name: Regsvr32 Execution From Potential Suspicious Location
    reason: regsvr32 execution from user-writable locations accompanies loader staging.
  - id: f421c250-24e7-11ec-bc43-acde48001122
    name: Regsvr32 Silent and Install Param Dll Loading
    reason: Silent regsvr32 DLL loading is a typical child of a hijacked process.
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: Credential dumping via comsvcs follows once the actor has a foothold from the sideloaded loader.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: KeyScrambler loading DLLs from user-writable paths
    query: data_win_system_eventID:"7" AND data_win_eventdata_image:/.*[Kk][Ee][Yy][Ss][Cc][Rr][Aa][Mm][Bb][Ll][Ee][Rr]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_imageLoaded:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_imageLoaded:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/)
    pivot_on: host
    window: 4h
  - name: KeyScrambler spawning children
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Kk][Ee][Yy][Ss][Cc][Rr][Aa][Mm][Bb][Ll][Ee][Rr]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 4h
  - name: DLL/EXE dropped in user-writable dirs
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*\.([Dd][Ll][Ll]|[Ee][Xx][Ee])/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*\.([Dd][Ll][Ll]|[Ee][Xx][Ee])/)
    pivot_on: host
    window: 6h
  - name: Registry Run-key persistence
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND data_win_eventdata_targetObject:/.*\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/
    pivot_on: host
    window: 4h
  - name: Outbound connections by script interpreters
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]|[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 4h
