name: Potential Persistence Via VMwareToolBoxCmd.EXE VM State Change Script
id: 7aa4e81a-a65c-4e10-9f81-b200eb229d7d
version: 1
schema_version: "1.0"
date: "2023-06-14"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 7aa4e81a-a65c-4e10-9f81-b200eb229d7d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of the "VMwareToolBoxCmd.exe" with the "script" and "set"
  flag to setup a specific script to run for a specific VM state. MITRE ATT&CK:
  T1059.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\VMwareToolBoxCmd.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "toolbox-cmd.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* script *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* set *"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\VMwareToolBoxCmd.exe'; data_win_eventdata_originalFileName equals
  'toolbox-cmd.exe'; data_win_eventdata_commandLine matches '* script *', among
  other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://bohops.com/2021/10/08/analyzing-and-detecting-a-vmtools-persistence-technique/
  - https://www.hexacorn.com/blog/2017/01/14/beyond-good-ol-run-key-part-53/
  - https://attack.mitre.org/techniques/T1059/

response:
  message: >
    Potential Persistence Via VMwareToolBoxCmd.EXE VM State Change Script
    detected on host $agent_name$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1059
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059
  custom_tags:
    - persistence
    - vmwaretoolboxcmd
    - state
    - process_creation
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Vv][Mm][Ww][Aa][Rr][Ee][Tt][Oo][Oo][Ll][Bb][Oo][Xx][Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Tt][Oo][Oo][Ll][Bb][Oo][Xx]-[Cc][Mm][Dd]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.* [Ss][Cc][Rr][Ii][Pp][Tt] .*/ AND data_win_eventdata_commandLine:/.* [Ss][Ee][Tt] .*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 85f520e7-6f5e-43ca-874c-222e5bf9c0de
    name: Devcon Execution Disabling VMware VMCI Device
    reason: Another VMware-tooling abuse on a guest, indicating operator tampering with VM integration components.
  - id: de587dce-915e-4218-aac4-835ca6af6f70
    name: Potential Persistence Attempt Via Run Keys Using Reg.EXE
    reason: Operators planting a VM-state script typically add redundant Run-key persistence on the same guest.
  - id: 81325ce1-be01-4250-944f-b4789644556f
    name: Schedule Task Creation From Env Variable Or Potentially Suspicious Path Via Schtasks.EXE
    reason: Scheduled-task persistence is the common companion mechanism to the VM state script.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: VMware toolbox-cmd executions
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*[Vv][Mm]ware[Tt]ool[Bb]ox[Cc]md\.exe/ OR data_win_eventdata_originalFileName:"toolbox-cmd.exe")
    pivot_on: host
    window: 6h
  - name: Script files written to user-writable paths
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\.(bat|cmd|ps1|vbs|exe)/ AND data_win_eventdata_targetFilename:/.*(\\Users\\|\\ProgramData\\|\\Temp\\|\\Public\\).*/
    pivot_on: host
    window: 6h
  - name: Children of VMware Tools service
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Vv][Mm]ware[Tt]ools[Dd]\.exe/ AND NOT data_win_eventdata_image:/.*[Vv][Mm]ware.*/
    pivot_on: host
    window: 24h
  - name: Shells launched by Office or WMI parents
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*(cmd|powershell|wscript|cscript)\.exe/ AND data_win_eventdata_parentImage:/.*(winword|excel|wmiprvse|mshta)\.exe/
    pivot_on: host
    window: 6h
