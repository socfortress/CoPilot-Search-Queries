  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Aa][Dd][Dd][Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy][Pp][Aa][Cc][Kk][Aa][Gg][Ee].*/ OR data_win_eventdata_commandLine:/.*[Aa][Dd][Jj][Uu][Ss][Tt][Tt][Oo][Kk][Ee][Nn][Pp][Rr][Ii][Vv][Ii][Ll][Ee][Gg][Ee][Ss].*/ OR data_win_eventdata_commandLine:/.*[Aa][Dd][Vv][Aa][Pp][Ii]32.*/ OR data_win_eventdata_commandLine:/.*[Cc][Ll][Oo][Ss][Ee][Hh][Aa][Nn][Dd][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee][Pp][Rr][Oo][Cc][Ee][Ss][Ss][Ww][Ii][Tt][Hh][Tt][Oo][Kk][Ee][Nn].*/ OR data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee][Pp][Ss][Ee][Uu][Dd][Oo][Cc][Oo][Nn][Ss][Oo][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee][Rr][Ee][Mm][Oo][Tt][Ee][Tt][Hh][Rr][Ee][Aa][Dd].*/ OR data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee][Tt][Hh][Rr][Ee][Aa][Dd].*/ OR data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee][Uu][Ss][Ee][Rr][Tt][Hh][Rr][Ee][Aa][Dd].*/ OR data_win_eventdata_commandLine:/.*[Dd][Aa][Nn][Gg][Ee][Rr][Oo][Uu][Ss][Gg][Ee][Tt][Hh][Aa][Nn][Dd][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Dd][Uu][Pp][Ll][Ii][Cc][Aa][Tt][Ee][Tt][Oo][Kk][Ee][Nn][Ee][Xx].*/ OR data_win_eventdata_commandLine:/.*[Ee][Nn][Uu][Mm][Ee][Rr][Aa][Tt][Ee][Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy][Pp][Aa][Cc][Kk][Aa][Gg][Ee][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ff][Rr][Ee][Ee][Hh][Gg][Ll][Oo][Bb][Aa][Ll].*/ OR data_win_eventdata_commandLine:/.*[Ff][Rr][Ee][Ee][Ll][Ii][Bb][Rr][Aa][Rr][Yy].*/ OR data_win_eventdata_commandLine:/.*[Gg][Ee][Tt][Dd][Ee][Ll][Ee][Gg][Aa][Tt][Ee][Ff][Oo][Rr][Ff][Uu][Nn][Cc][Tt][Ii][Oo][Nn][Pp][Oo][Ii][Nn][Tt][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Gg][Ee][Tt][Ll][Oo][Gg][Oo][Nn][Ss][Ee][Ss][Ss][Ii][Oo][Nn][Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_commandLine:/.*[Gg][Ee][Tt][Mm][Oo][Dd][Uu][Ll][Ee][Hh][Aa][Nn][Dd][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Gg][Ee][Tt][Pp][Rr][Oo][Cc][Aa][Dd][Dd][Rr][Ee][Ss][Ss].*/ OR data_win_eventdata_commandLine:/.*[Gg][Ee][Tt][Pp][Rr][Oo][Cc][Ee][Ss][Ss][Hh][Aa][Nn][Dd][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Gg][Ee][Tt][Tt][Oo][Kk][Ee][Nn][Ii][Nn][Ff][Oo][Rr][Mm][Aa][Tt][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ii][Mm][Pp][Ee][Rr][Ss][Oo][Nn][Aa][Tt][Ee][Ll][Oo][Gg][Gg][Ee][Dd][Oo][Nn][Uu][Ss][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Kk][Ee][Rr][Nn][Ee][Ll]32.*/ OR data_win_eventdata_commandLine:/.*[Ll][Oo][Aa][Dd][Ll][Ii][Bb][Rr][Aa][Rr][Yy].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ee][Mm][Cc][Pp][Yy].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp][Ww][Rr][Ii][Tt][Ee][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Oo][Pp][Ee][Nn][Dd][Ee][Ss][Kk][Tt][Oo][Pp].*/ OR data_win_eventdata_commandLine:/.*[Oo][Pp][Ee][Nn][Pp][Rr][Oo][Cc][Ee][Ss][Ss].*/ OR data_win_eventdata_commandLine:/.*[Oo][Pp][Ee][Nn][Pp][Rr][Oo][Cc][Ee][Ss][Ss][Tt][Oo][Kk][Ee][Nn].*/ OR data_win_eventdata_commandLine:/.*[Oo][Pp][Ee][Nn][Tt][Hh][Rr][Ee][Aa][Dd][Tt][Oo][Kk][Ee][Nn].*/ OR data_win_eventdata_commandLine:/.*[Oo][Pp][Ee][Nn][Ww][Ii][Nn][Dd][Oo][Ww][Ss][Tt][Aa][Tt][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*[Pp][Tt][Rr][Tt][Oo][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Qq][Uu][Ee][Uu][Ee][Uu][Ss][Ee][Rr][Aa][Pp][Cc].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Aa][Dd][Pp][Rr][Oo][Cc][Ee][Ss][Ss][Mm][Ee][Mm][Oo][Rr][Yy].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Vv][Ee][Rr][Tt][Tt][Oo][Ss][Ee][Ll][Ff].*/ OR data_win_eventdata_commandLine:/.*[Rr][Tt][Ll][Cc][Rr][Ee][Aa][Tt][Ee][Uu][Ss][Ee][Rr][Tt][Hh][Rr][Ee][Aa][Dd].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Cc][Uu][Rr]32.*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Tt][Tt][Hh][Rr][Ee][Aa][Dd][Tt][Oo][Kk][Ee][Nn].*/ OR data_win_eventdata_commandLine:/.*[Vv][Ii][Rr][Tt][Uu][Aa][Ll][Aa][Ll][Ll][Oo][Cc].*/ OR data_win_eventdata_commandLine:/.*[Vv][Ii][Rr][Tt][Uu][Aa][Ll][Ff][Rr][Ee][Ee].*/ OR data_win_eventdata_commandLine:/.*[Vv][Ii][Rr][Tt][Uu][Aa][Ll][Pp][Rr][Oo][Tt][Ee][Cc][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ww][Aa][Ii][Tt][Ff][Oo][Rr][Ss][Ii][Nn][Gg][Ll][Ee][Oo][Bb][Jj][Ee][Cc][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ww][Rr][Ii][Tt][Ee][Ii][Nn][Tt]32.*/ OR data_win_eventdata_commandLine:/.*[Ww][Rr][Ii][Tt][Ee][Pp][Rr][Oo][Cc][Ee][Ss][Ss][Mm][Ee][Mm][Oo][Rr][Yy].*/ OR data_win_eventdata_commandLine:/.*[Zz][Ee][Rr][Oo][Ff][Rr][Ee][Ee][Gg][Ll][Oo][Bb][Aa][Ll][Aa][Ll][Ll][Oo][Cc][Uu][Nn][Ii][Cc][Oo][Dd][Ee].*/) AND _exists_:data_win_eventdata_image AND _exists_:data_win_eventdata_commandLine AND _exists_:data_win_eventdata_parentImage AND NOT ((data_win_eventdata_image:/.*\\[Mm][Pp][Cc][Mm][Dd][Rr][Uu][Nn]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Gg][Ee][Tt][Ll][Oo][Aa][Dd][Ll][Ii][Bb][Rr][Aa][Rr][Yy][Ww][Aa][Dd][Dd][Rr][Ee][Ss][Ss]32.*/) OR (data_win_eventdata_parentImage:/.*\\[Cc][Oo][Mm][Pp][Aa][Tt][Tt][Ee][Ll][Rr][Uu][Nn][Nn][Ee][Rr]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*[Ff][Rr][Ee][Ee][Hh][Gg][Ll][Oo][Bb][Aa][Ll].*/ OR data_win_eventdata_commandLine:/.*[Pp][Tt][Rr][Tt][Oo][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Kk][Ee][Rr][Nn][Ee][Ll]32.*/ OR data_win_eventdata_commandLine:/.*[Cc][Ll][Oo][Ss][Ee][Hh][Aa][Nn][Dd][Ll][Ee].*/)))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 62b7ccc9-23b4-471e-aa15-6da3663c4d59
    name: PowerShell Base64 Encoded Reflective Assembly Load
    reason: Reflective assembly load is how PowerShell reaches the WinAPI P/Invoke wrappers (winapiexec-style)
  - id: 9c0295ce-d60d-40bd-bd74-84673b7592b1
    name: Suspicious Encoded And Obfuscated Reflection Assembly Load Function Call
    reason: Obfuscated reflection assembly load often precedes direct API calls
  - id: 92a974db-ab84-457f-9ec0-55db83d7a825
    name: Potential AMSI Bypass Using NULL Bits
    reason: AMSI bypass is typically applied before running API-calling script content
  - id: 30edb182-aa75-42c0-b0a9-e998bb29067c
    name: Potential AMSI Bypass Via .NET Reflection
    reason: AMSI bypass via .NET reflection - same evasion preceding raw API use
  - id: c4db14d9-7909-48b4-a054-aa14d89dbb19
    name: Malicious PowerShell Process - Encoded Command
    reason: Encoded PowerShell is the common carrier of the API-call command line
  - id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
    name: PowerShell Download and Execution Cradles
    reason: Download cradles typically fetch the tool or script invoking these APIs
  - id: d78b5d61-187d-44b6-bf02-93486a80de5a
    name: HackTool - DInjector PowerShell Cradle Execution
    reason: DInjector cradle performs process injection via the same WinAPI primitives
  - id: 5ef9853e-4d0e-4a70-846f-a9ca37d876da
    name: Potential Credential Dumping Activity Via LSASS
    reason: AdjustTokenPrivileges/OpenProcess usage frequently ends in LSASS access
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: PowerShell encoded or in-memory loading
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ff]rom[Bb]ase64[Ss]tring.*/ OR /.*[Aa]ssembly.*[Ll]oad.*/ OR /.*[Aa]dd-[Tt]ype.*/ OR /.*[Ee]ncodedcommand.*/)
    pivot_on: host
    window: 2h
  - name: Process injection and memory API names on command line
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Vv]irtual[Aa]lloc.*/ OR /.*[Ww]rite[Pp]rocess[Mm]emory.*/ OR /.*[Cc]reate[Rr]emote[Tt]hread.*/ OR /.*[Nn]t[Cc]reate[Tt]hread.*/)
    pivot_on: host
    window: 2h
  - name: Remote thread and process access events
    query: data_win_system_eventID:(8 OR 10) AND data_win_eventdata_targetImage:(/.*[Ll]sass\.exe/ OR /.*[Ww]inlogon\.exe/ OR /.*[Ee]xplorer\.exe/)
    pivot_on: host
    window: 2h
  - name: Image loads from temp or appdata by script hosts
    query: data_win_system_eventID:7 AND data_win_eventdata_image:(/.*[Pp]ower[Ss]hell.*/ OR /.*[Rr]undll32\.exe/) AND data_win_eventdata_imageLoaded:(/.*\\[Tt]emp\\.*/ OR /.*\\[Aa]pp[Dd]ata\\.*/)
    pivot_on: host
    window: 2h
  - name: Outbound connections from script hosts
    query: data_win_system_eventID:3 AND data_win_eventdata_image:(/.*[Pp]ower[Ss]hell.*/ OR /.*[Pp]wsh\.exe/ OR /.*[Rr]undll32\.exe/)
    pivot_on: host
    window: 2h
