                    value: "*VirtualProtect*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*WaitForSingleObject*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*WriteInt32*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*WriteProcessMemory*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*ZeroFreeGlobalAllocUnicode*"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_image"
        - exists:
            field: "data_win_eventdata_commandLine"
        - exists:
            field: "data_win_eventdata_parentImage"
        - bool:
            must_not:
              - bool:
                  should:
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\MpCmdRun.exe"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*GetLoadLibraryWAddress32*"
                                case_insensitive: true
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_parentImage:
                                value: "*\\\\CompatTelRunner.exe"
                                case_insensitive: true
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_commandLine:
                                      value: "*FreeHGlobal*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_commandLine:
                                      value: "*PtrToString*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_commandLine:
                                      value: "*kernel32*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_commandLine:
                                      value: "*CloseHandle*"
                                      case_insensitive: true
                              minimum_should_match: 1
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*AddSecurityPackage*'; data_win_eventdata_commandLine matches
  '*AdjustTokenPrivileges*'; data_win_eventdata_commandLine matches
  '*Advapi32*', among other conditions.

known_false_positives: >
  Some legitimate action or applications may use these functions. Investigate
  further to determine the legitimacy of the activity. Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://twitter.com/m417z/status/1566674631788007425
  - https://attack.mitre.org/techniques/T1106/

response:
  message: >
    Potential WinAPI Calls Via CommandLine detected on host $agent_name$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1106
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1106
  custom_tags:
