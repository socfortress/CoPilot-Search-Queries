                  data_win_eventdata_commandLine:
                    value: "*memcpy*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*MiniDumpWriteDump*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*ntdll*"
                    case_insensitive: true
