name: Potential KamiKakaBot Activity - Lure Document Execution
id: 24474469-bd80-46cc-9e08-9fbe81bfaaca
version: 1
schema_version: "1.0"
date: "2024-03-22"
author: Nasreddine Bencherchali (Nextron Systems), X__Junior (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 24474469-bd80-46cc-9e08-9fbe81bfaaca
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of a Word document via the WinWord Start Menu shortcut.
  This behavior was observed being used by KamiKakaBot samples in order to
  initiate the 2nd stage of the infection. MITRE ATT&CK: T1059.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\cmd.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*/c *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*.lnk ~*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*Start Menu\\\\Programs\\\\Word*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*.doc"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches '*\cmd.exe';
  data_win_eventdata_commandLine matches '*/c *'; data_win_eventdata_commandLine
  matches '*.lnk ~*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.nextron-systems.com/2024/03/22/unveiling-kamikakabot-malware-analysis/
  - https://attack.mitre.org/techniques/T1059/

response:
  message: >
    Potential KamiKakaBot Activity - Lure Document Execution detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
    MITRE ATT&CK: T1059
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059
  custom_tags:
    - kamikakabot
    - document
    - process_creation
    - sysmon
    - execution
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*\/[Cc] .*/ AND data_win_eventdata_commandLine:/.*\.[Ll][Nn][Kk] \~.*/ AND data_win_eventdata_commandLine:/.*[Ss][Tt][Aa][Rr][Tt] [Mm][Ee][Nn][Uu]\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Ss]\\[Ww][Oo][Rr][Dd].*/ AND data_win_eventdata_commandLine:/.*\.[Dd][Oo][Cc]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: fe9e8ba9-4419-41e6-a574-bd9f7b3af961
    name: Potential KamiKakaBot Activity - Shutdown Schedule Task Creation
    reason: 'Same malware family: the weekly ''shutdown /l /f'' schtask is KamiKakaBot persistence set up right after the lure launches stage 2.'
  - id: 868955d9-697e-45d4-a3da-360cefd7c216
    name: Potential Exploitation Attempt From Office Application
    reason: The chain is document-driven; Office spawning unusual children precedes the cmd-launched shortcut.
  - id: f99abdf0-6283-4e71-bd2b-b5c048a94743
    name: Potentially Suspicious Office Document Executed From Trusted Location
    reason: Lure documents are often staged in trusted/user paths and opened before the Start Menu shortcut trick.
  - id: 1412aa78-a24c-4abd-83df-767dfb2c5bbe
    name: Potentially Suspicious WebDAV LNK Execution
    reason: Delivery commonly uses LNK files; remote LNK execution would precede cmd /c .lnk launching.
  - id: 2daa93a0-a5fb-41c5-8cd8-3c11294bfd1f
    name: Potential SSH Tunnel Persistence Install Using A Scheduled Task
    reason: Scheduled-task persistence is the typical follow-on after a stage-2 foothold.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Office/Explorer spawning cmd
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ AND data_win_eventdata_parentImage:/.*([Ww][Ii][Nn][Ww][Oo][Rr][Dd]|[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]|[Ee][Xx][Cc][Ee][Ll]).*/
    pivot_on: host
    window: 2h
  - name: Persistence via schtasks creation
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:*\/create*
    pivot_on: host
    window: 4h
  - name: Script host or LOLBin spawned by cmd/Word
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*([Pp]ower[Ss]hell|[Mm]shta|[Ww]script|[Cc]script|[Rr]undll32|[Rr]egsvr32)\.[Ee][Xx][Ee]/ AND data_win_eventdata_parentImage:/.*([Cc][Mm][Dd]|[Ww][Ii][Nn][Ww][Oo][Rr][Dd])\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Executables dropped by Word
    query: data_win_system_eventID:11 AND data_win_eventdata_image:/.*[Ww][Ii][Nn][Ww][Oo][Rr][Dd]\.[Ee][Xx][Ee]/ AND data_win_eventdata_targetFilename:/.*(AppData|Temp|Startup).*/
    pivot_on: host
    window: 2h
  - name: Outbound connections from script hosts
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*([Pp]ower[Ss]hell|[Cc][Mm][Dd]|[Ww]script|[Mm]shta)\.[Ee][Xx][Ee]/ AND data_win_eventdata_initiated:true
    pivot_on: host
    window: 2h
