name: Dllhost.EXE Execution Anomaly
id: e7888eb1-13b0-4616-bd99-4bc0c2b054b9
version: 1
schema_version: "1.0"
date: "2023-05-15"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: e7888eb1-13b0-4616-bd99-4bc0c2b054b9
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a "dllhost" process spawning with no commandline arguments which is
  very rare to happen and could indicate process injection activity or malware
  mimicking similar system processes. MITRE ATT&CK: T1055.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\dllhost.exe"
              case_insensitive: true
        - bool:
            should:
              - term:
                  data_win_eventdata_commandLine:
                    value: "dllhost.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_commandLine:
                    value: "dllhost"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            must_not:
              - bool:
                  must_not:
                    - exists:
                        field: "data_win_eventdata_commandLine"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\dllhost.exe'; data_win_eventdata_commandLine equals 'dllhost.exe';
  data_win_eventdata_commandLine equals 'dllhost', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://redcanary.com/blog/child-processes/
  - https://nasbench.medium.com/what-is-the-dllhost-exe-process-actually-running-ef9fe4c19c08
  - https://www.ncsc.gov.uk/static-assets/documents/malware-analysis-reports/goofy-guineapig/NCSC-MAR-Goofy-Guineapig.pdf
  - https://attack.mitre.org/techniques/T1055/

response:
  message: >
    Dllhost.EXE Execution Anomaly detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1055
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1055
  custom_tags:
    - dllhost
    - anomaly
    - process_creation
    - sysmon
    - privilege_escalation
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Dd][Ll][Ll][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/[Dd][Ll][Ll][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/[Dd][Ll][Ll][Hh][Oo][Ss][Tt]/) AND NOT (NOT _exists_:data_win_eventdata_commandLine)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 6309645e-122d-4c5b-bb2b-22e4f9c2fa42
    name: HackTool - Potential CobaltStrike Process Injection
    reason: Cobalt Strike injection into a sacrificial process (dllhost is a default spawn-to target); direct co-occurrence.
  - id: f35c5d71-b489-4e22-a115-f003df287317
    name: Potential CobaltStrike Process Patterns
    reason: CobaltStrike process patterns; argument-less dllhost is a classic post-ex host.
  - id: 15619216-e993-4721-b590-4c520615a67d
    name: Potential Meterpreter/CobaltStrike Activity
    reason: Meterpreter/CS process spawn patterns that precede or accompany the empty dllhost.
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: Credential dumping commonly follows once a beacon runs in an injected process.
  - id: ae9c6a7c-9521-42a6-915e-5aaa8689d529
    name: CobaltStrike Load by Rundll32
    reason: Rundll32 loading a Cobalt Strike payload is a typical initial loader before dllhost injection.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Remote thread creation into dllhost
    query: data_win_system_eventID:8 AND data_win_eventdata_targetImage:/.*dllhost\.exe/
    pivot_on: host
    window: 2h
  - name: Network connections made by dllhost
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*dllhost\.exe/
    pivot_on: host
    window: 2h
  - name: Process access to LSASS from injection-prone processes
    query: data_win_system_eventID:10 AND data_win_eventdata_targetImage:/.*lsass\.exe/ AND data_win_eventdata_sourceImage:/.*(dllhost|rundll32|svchost)\.exe/
    pivot_on: host
    window: 4h
  - name: Shell and recon children of dllhost
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*dllhost\.exe/ AND data_win_eventdata_image:/.*(cmd|powershell|whoami|net|nltest)\.exe/
    pivot_on: host
    window: 4h
  - name: Named pipes created by dllhost
    query: data_win_system_eventID:17 AND data_win_eventdata_image:/.*dllhost\.exe/
    pivot_on: host
    window: 2h
