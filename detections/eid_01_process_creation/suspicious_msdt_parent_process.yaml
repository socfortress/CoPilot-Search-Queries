name: Suspicious MSDT Parent Process
id: 7a74da6b-ea76-47db-92cc-874ad90df734
version: 1
schema_version: "1.0"
date: "2023-02-06"
author: Nextron Systems
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 7a74da6b-ea76-47db-92cc-874ad90df734
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects msdt.exe executed by a suspicious parent as seen in CVE-2022-30190 /
  Follina exploitation. MITRE ATT&CK: T1036, T1218.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\cmd.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\cscript.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\mshta.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\powershell.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\pwsh.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\regsvr32.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\rundll32.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\schtasks.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\wmic.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\wscript.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\wsl.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\msdt.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "msdt.exe"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\cmd.exe'; data_win_eventdata_parentImage matches '*\cscript.exe';
  data_win_eventdata_parentImage matches '*\mshta.exe', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/nao_sec/status/1530196847679401984
  - https://app.any.run/tasks/713f05d2-fe78-4b9d-a744-f7c133e3fafb/
  - https://attack.mitre.org/techniques/T1036/
  - https://attack.mitre.org/techniques/T1218/

response:
  message: >
    Suspicious MSDT Parent Process detected on host $agent_name$. Matched
    data_win_eventdata_parentImage: $data_win_eventdata_parentImage$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1036,
    T1218
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1036
    - T1218
  custom_tags:
    - parent
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ww][Ss][Ll]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_image:/.*\\[Mm][Ss][Dd][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Mm][Ss][Dd][Tt]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 258fc8ce-8352-443a-9120-8a11e4857fa5
    name: Potential Arbitrary Command Execution Using Msdt.EXE
    reason: msdt with arbitrary command arguments is the Follina exploit payload and fires with this parent finding.
  - id: 6004abd0-afa4-4557-ba90-49d172e0a299
    name: Execute Pcwrun.EXE To Leverage Follina
    reason: pcwrun.exe is the sibling Follina launcher that accompanies or substitutes msdt.
  - id: 2d9403d5-7927-46b7-8216-37ab7c9ec5e3
    name: Suspicious Set Value of MSDT in Registry (CVE-2022-30190)
    reason: Registry value set for the ms-msdt protocol handler is the CVE-2022-30190 precursor or tampering.
  - id: bd1c6866-65fc-44b2-be51-5588fcff82b9
    name: Renamed Msdt.EXE Execution
    reason: Renamed msdt indicates evasion of the same chain.
  - id: dc4576d4-7467-424f-9eee-fd2b02855fe0
    name: Suspicious Cabinet File Execution Via Msdt.EXE
    reason: Cabinet-file msdt execution is a known variant for loading attacker content.
  - id: 9c8c7000-3065-44a8-a555-79bcba5d9955
    name: MSDT Execution Via Answer File
    reason: msdt via answer file is an alternate proxy-execution technique for the same binary.
  - id: 318557a5-150c-4c8d-b70e-a9910e199857
    name: File Creation In Suspicious Directory By Msdt.EXE
    reason: msdt writing files to suspicious directories shows payload staging after launch.
  - id: ec8c4047-fad9-416a-8c81-0f479353d7f6
    name: Diagnostic Library Sdiageng.DLL Loaded By Msdt.EXE
    reason: sdiageng.dll loading into msdt confirms the diagnostic engine ran the injected script.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: msdt and pcwrun invocations with diagnostic or exploit arguments
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Mm][Ss][Dd][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Cc][Ww][Rr][Uu][Nn]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*[Ii][Tt]_[Bb][Rr][Oo][Ww][Ss][Ee][Ff][Oo][Rr][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Pp][Cc][Ww][Dd][Ii][Aa][Gg][Nn][Oo][Ss][Tt][Ii][Cc].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ss]-[Mm][Ss][Dd][Tt]:.*/ OR data_win_eventdata_commandLine:/.*[Ii][Tt]_[Rr][Ee][Bb][Rr][Oo][Ww][Ss][Ee][Ff][Oo][Rr][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*\/[Ii][Dd] .*/)
    pivot_on: host
    window: 4h
  - name: Shells spawned by msdt or sdiagnhost
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Mm][Ss][Dd][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ss][Dd][Ii][Aa][Gg][Nn][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/)
    pivot_on: host
    window: 4h
  - name: Office or browser spawning msdt (document lure)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Ww][Ii][Nn][Ww][Oo][Rr][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ee][Xx][Cc][Ee][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Oo][Uu][Tt][Ll][Oo][Oo][Kk]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Pp][Oo][Ww][Ee][Rr][Pp][Nn][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Mm][Ss][Ee][Dd][Gg][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Cc][Hh][Rr][Oo][Mm][Ee]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_image:/.*\\[Mm][Ss][Dd][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Cc][Ww][Rr][Uu][Nn]\.[Ee][Xx][Ee]/)
    pivot_on: host
    window: 4h
  - name: Files created by msdt or sdiagnhost
    query: data_win_system_eventID:"11" AND (data_win_eventdata_image:/.*\\[Mm][Ss][Dd][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ss][Dd][Ii][Aa][Gg][Nn][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/)
    pivot_on: host
    window: 4h
  - name: Outbound network from msdt chain and shells
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:"true" AND (data_win_eventdata_image:/.*\\[Mm][Ss][Dd][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ss][Dd][Ii][Aa][Gg][Nn][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/)
    pivot_on: host
    window: 4h
