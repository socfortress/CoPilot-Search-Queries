name: PowerShell Base64 Encoded FromBase64String Cmdlet
id: fdb62a13-9a81-4e5c-a38f-ea93a16f6d7c
version: 1
schema_version: "1.0"
date: "2023-04-06"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: fdb62a13-9a81-4e5c-a38f-ea93a16f6d7c
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects usage of a base64 encoded "FromBase64String" cmdlet in a process
  command line. MITRE ATT&CK: T1140, T1059.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*OjpGcm9tQmFzZTY0U3RyaW5n*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*o6RnJvbUJhc2U2NFN0cmluZ*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*6OkZyb21CYXNlNjRTdHJpbm*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*OgA6AEYAcgBvAG0AQgBhAHMAZQA2ADQAUwB0AHIAaQBuAGcA*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*oAOgBGAHIAbwBtAEIAYQBzAGUANgA0AFMAdAByAGkAbgBnA*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*6ADoARgByAG8AbQBCAGEAcwBlADYANABTAHQAcgBpAG4AZw*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*OjpGcm9tQmFzZTY0U3RyaW5n*'; data_win_eventdata_commandLine matches
  '*o6RnJvbUJhc2U2NFN0cmluZ*'; data_win_eventdata_commandLine matches
  '*6OkZyb21CYXNlNjRTdHJpbm*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - Internal Research
  - https://attack.mitre.org/techniques/T1140/
  - https://attack.mitre.org/techniques/T1059/001/

response:
  message: >
    PowerShell Base64 Encoded FromBase64String Cmdlet detected on host
    $agent_name$. Matched data_win_eventdata_commandLine:
    $data_win_eventdata_commandLine$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1140, T1059.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1140
    - T1059.001
  custom_tags:
    - powershell
    - base64
    - encoded
    - process_creation
    - sysmon
    - stealth
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Oo][Jj][Pp][Gg][Cc][Mm]9[Tt][Qq][Mm][Ff][Zz][Zz][Tt][Yy]0[Uu]3[Rr][Yy][Aa][Ww]5[Nn].*/ OR data_win_eventdata_commandLine:/.*[Oo]6[Rr][Nn][Jj][Vv][Bb][Uu][Jj][Hh][Cc]2[Uu]2[Nn][Ff][Nn]0[Cc][Mm][Ll][Uu][Zz].*/ OR data_win_eventdata_commandLine:/.*6[Oo][Kk][Zz][Yy][Bb]21[Cc][Yy][Xx][Nn][Ll][Nn][Jj][Rr][Tt][Dd][Hh][Jj][Pp][Bb][Mm].*/ OR data_win_eventdata_commandLine:/.*[Oo][Gg][Aa]6[Aa][Ee][Yy][Aa][Cc][Gg][Bb][Vv][Aa][Gg]0[Aa][Qq][Gg][Bb][Hh][Aa][Hh][Mm][Aa][Zz][Qq][Aa]2[Aa][Dd][Qq][Aa][Uu][Ww][Bb]0[Aa][Hh][Ii][Aa][Aa][Qq][Bb][Uu][Aa][Gg][Cc][Aa].*/ OR data_win_eventdata_commandLine:/.*[Oo][Aa][Oo][Gg][Bb][Gg][Aa][Hh][Ii][Aa][Bb][Ww][Bb][Tt][Aa][Ee][Ii][Aa][Yy][Qq][Bb][Zz][Aa][Gg][Uu][Aa][Nn][Gg][Aa]0[Aa][Ff][Mm][Aa][Dd][Aa][Bb][Yy][Aa][Gg][Kk][Aa][Bb][Gg][Bb][Nn][Aa].*/ OR data_win_eventdata_commandLine:/.*6[Aa][Dd][Oo][Aa][Rr][Gg][Bb][Yy][Aa][Gg]8[Aa][Bb][Qq][Bb][Cc][Aa][Gg][Ee][Aa][Cc][Ww][Bb][Ll][Aa][Dd][Yy][Aa][Nn][Aa][Bb][Tt][Aa][Hh][Qq][Aa][Cc][Gg][Bb][Pp][Aa][Gg]4[Aa][Zz][Ww].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 62b7ccc9-23b4-471e-aa15-6da3663c4d59
    name: PowerShell Base64 Encoded Reflective Assembly Load
    reason: Decoded bytes are commonly loaded in-memory via Assembly.Load right after FromBase64String
  - id: 88f680b8-070e-402c-ae11-d2914f2257f1
    name: PowerShell Base64 Encoded IEX Cmdlet
    reason: The decoded script is typically executed with IEX; same obfuscated command line family
  - id: 6385697e-9f1b-40bd-8817-f4a91f40508e
    name: PowerShell Base64 Encoded Invoke Keyword
    reason: Sibling encoded-keyword indicator in the same payload
  - id: d75d6b6b-adb9-48f7-824b-ac2e786efe1f
    name: Suspicious FromBase64String Usage On Gzip Archive - Process Creation
    reason: Base64 plus gzip decompress stager pattern
  - id: ca2092a1-c273-4878-9b4b-0d60115bf5ea
    name: Suspicious Encoded PowerShell Command Line
    reason: Outer -enc wrapper that hides this cmdlet
  - id: c6fb44c6-71f5-49e6-9462-1425d328aee3
    name: Powershell Base64 Encoded MpPreference Cmdlet
    reason: Defense evasion commonly embedded in the same encoded stager
  - id: ee18ed37-0802-4268-9435-b3b91aaa18db
    name: PowerShell - Connect To Internet With Hidden Window
    reason: Staging download that supplies or follows the encoded payload
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Reflective loading and in-memory execution
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Rr]eflection\.[Aa]ssembly.*/ OR data_win_eventdata_commandLine:/.*[Ll]oad[Ww]ith[Pp]artial[Nn]ame.*/ OR data_win_eventdata_commandLine:/.*[Vv]irtual[Aa]lloc.*/ OR data_win_eventdata_commandLine:/.*[Aa]ssembly\]::[Ll]oad.*/)
    pivot_on: host
    window: 2h
  - name: Download cradles and hidden PowerShell
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Dd]ownload(String|File|Data).*/ OR data_win_eventdata_commandLine:/.*[Ii]nvoke-[Ww]eb[Rr]equest.*/ OR data_win_eventdata_commandLine:/.*[Nn]et\.[Ww]eb[Cc]lient.*/ OR data_win_eventdata_commandLine:/.*[Ww]indow[Ss]tyle [Hh]idden.*/ OR data_win_eventdata_commandLine:/.*[Ss]tart-[Bb]its[Tt]ransfer.*/)
    pivot_on: host
    window: 2h
  - name: Defender tampering from PowerShell
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss]et-[Mm]p[Pp]reference.*/ OR data_win_eventdata_commandLine:/.*[Aa]dd-[Mm]p[Pp]reference.*[Ee]xclusion.*/ OR data_win_eventdata_commandLine:/.*[Dd]isable[Rr]ealtime[Mm]onitoring.*/)
    pivot_on: host
    window: 4h
  - name: Encoded or obfuscated PowerShell invocations
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\(powershell|pwsh)\.exe/ AND (data_win_eventdata_commandLine:/.* -[Ee]nc.*/ OR data_win_eventdata_commandLine:/.*-[Ee]ncoded[Cc]ommand.*/ OR data_win_eventdata_commandLine:/.*[Nn]on[Ii].*[Bb]ypass.*/)
    pivot_on: host
    window: 2h
  - name: Persistence and credential access after payload
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss].*\/[Cc][Rr][Ee][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Rr]eg .*[Aa]dd.*[Rr]un.*/ OR data_win_eventdata_commandLine:/.*[Cc]omsvcs.*[Mm]ini[Dd]ump.*/ OR data_win_eventdata_commandLine:/.*[Pp]rocdump.*[Ll]sass.*/)
    pivot_on: host
    window: 6h
