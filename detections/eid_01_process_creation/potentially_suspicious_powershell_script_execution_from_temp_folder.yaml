name: Potentially Suspicious Powershell Script Execution From Temp Folder
id: a6a39bdb-935c-4f0a-ab77-35f4bbf44d33
version: 1
schema_version: "1.0"
date: "2026-02-17"
author: Florian Roth (Nextron Systems), Max Altgelt (Nextron Systems), Tim Shelton
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: a6a39bdb-935c-4f0a-ab77-35f4bbf44d33
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a potentially suspicious powershell script executions from temporary
  folder. MITRE ATT&CK: T1059.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\powershell.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\pwsh.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Windows\\\\Temp*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Temporary Internet*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\AppData\\\\Local\\\\Temp*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\AppData\\\\Roaming\\\\Temp*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*%TEMP%*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*%TMP%*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*%LocalAppData%\\\\Temp*"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_commandLine"
        - exists:
            field: "data_win_eventdata_parentImage"
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*-WindowStyle hidden -Verb runAs*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*\\\\Windows\\\\system32\\\\config\\\\systemprofile\\\\AppData\\\\Local\\\\Temp\\\\Amazon\\\\EC2-Windows\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine: "* >*"
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*Out-File*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*ConvertTo-Json*"
                          case_insensitive: true
                    - bool:
                        must:
                          - bool:
                              should:
                                - term:
                                    data_win_eventdata_parentImage:
                                      value: "C:\\Windows\\System32\\Msiexec.exe"
                                      case_insensitive: true
                                - term:
                                    data_win_eventdata_parentImage:
                                      value: "C:\\Windows\\SysWOW64\\Msiexec.exe"
                                      case_insensitive: true
                              minimum_should_match: 1
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\powershell.exe"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*-NoProfile -ExecutionPolicy Bypass -Command*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*AppData\\\\Local\\\\Temp\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*Install-Chocolatey.ps1*"
                                case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\powershell.exe'; data_win_eventdata_image matches '*\pwsh.exe';
  data_win_eventdata_commandLine matches '*\Windows\Temp*', among other
  conditions.

known_false_positives: >
  Administrative scripts. Baseline expected activity in your environment and
  tune this detection before relying on it for automated response.

references:
  - https://www.microsoft.com/security/blog/2021/07/13/microsoft-discovers-threat-actor-targeting-solarwinds-serv-u-software-with-0-day-exploit/
  - https://attack.mitre.org/techniques/T1059/001/

response:
  message: >
    Potentially Suspicious Powershell Script Execution From Temp Folder detected
    on host $agent_name$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. Matched data_win_eventdata_commandLine:
    $data_win_eventdata_commandLine$. MITRE ATT&CK: T1059.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
  custom_tags:
    - powershell
    - folder
    - process_creation
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*\\[Tt][Ee][Mm][Pp][Oo][Rr][Aa][Rr][Yy] [Ii][Nn][Tt][Ee][Rr][Nn][Ee][Tt].*/ OR data_win_eventdata_commandLine:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Rr][Oo][Aa][Mm][Ii][Nn][Gg]\\[Tt][Ee][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*%[Tt][Ee][Mm][Pp]%.*/ OR data_win_eventdata_commandLine:/.*%[Tt][Mm][Pp]%.*/ OR data_win_eventdata_commandLine:/.*%[Ll][Oo][Cc][Aa][Ll][Aa][Pp][Pp][Dd][Aa][Tt][Aa]%\\[Tt][Ee][Mm][Pp].*/) AND _exists_:data_win_eventdata_commandLine AND _exists_:data_win_eventdata_parentImage AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_commandLine:/.*-[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Tt][Yy][Ll][Ee] [Hh][Ii][Dd][Dd][Ee][Nn] -[Vv][Ee][Rr][Bb] [Rr][Uu][Nn][Aa][Ss].*/ OR data_win_eventdata_commandLine:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Cc][Oo][Nn][Ff][Ii][Gg]\\[Ss][Yy][Ss][Tt][Ee][Mm][Pp][Rr][Oo][Ff][Ii][Ll][Ee]\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\[Aa][Mm][Aa][Zz][Oo][Nn]\\[Ee][Cc]2-[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\.*/ OR data_win_eventdata_commandLine:/.* \>.*/ OR data_win_eventdata_commandLine:/.*[Oo][Uu][Tt]-[Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Nn][Vv][Ee][Rr][Tt][Tt][Oo]-[Jj][Ss][Oo][Nn].*/ OR ((data_win_eventdata_parentImage:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Mm][Ss][Ii][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Ww][Oo][Ww]64\\[Mm][Ss][Ii][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]/) AND data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*-[Nn][Oo][Pp][Rr][Oo][Ff][Ii][Ll][Ee] -[Ee][Xx][Ee][Cc][Uu][Tt][Ii][Oo][Nn][Pp][Oo][Ll][Ii][Cc][Yy] [Bb][Yy][Pp][Aa][Ss][Ss] -[Cc][Oo][Mm][Mm][Aa][Nn][Dd].*/ AND data_win_eventdata_commandLine:/.*[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\.*/ AND data_win_eventdata_commandLine:/.*[Ii][Nn][Ss][Tt][Aa][Ll][Ll]-[Cc][Hh][Oo][Cc][Oo][Ll][Aa][Tt][Ee][Yy]\.[Pp][Ss]1.*/))

