name: Potentially Over Permissive Permissions Granted Using Dsacls.EXE
id: 01c42d3c-242d-4655-85b2-34f1739632f7
version: 1
schema_version: "1.0"
date: "2023-02-04"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 01c42d3c-242d-4655-85b2-34f1739632f7
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects usage of Dsacls to grant over permissive permissions. MITRE ATT&CK:
  T1218.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\dsacls.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "DSACLS.EXE"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* /G *"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*GR*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*GE*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*GW*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*GA*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*WP*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*WD*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\dsacls.exe'; data_win_eventdata_originalFileName equals 'DSACLS.EXE';
  data_win_eventdata_commandLine matches '* /G *', among other conditions.

known_false_positives: >
  Legitimate administrators granting over permissive permissions to users.
  Baseline expected activity in your environment and tune this detection before
  relying on it for automated response.

references:
  - https://ss64.com/nt/dsacls.html
  - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2012-r2-and-2012/cc771151(v=ws.11)
  - https://attack.mitre.org/techniques/T1218/

response:
  message: >
    Potentially Over Permissive Permissions Granted Using Dsacls.EXE detected on
    host $agent_name$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1218
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218
  custom_tags:
    - permissive
    - permissions
    - granted
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Dd][Ss][Aa][Cc][Ll][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Dd][Ss][Aa][Cc][Ll][Ss]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.* \/[Gg] .*/ AND (data_win_eventdata_commandLine:/.*[Gg][Rr].*/ OR data_win_eventdata_commandLine:/.*[Gg][Ee].*/ OR data_win_eventdata_commandLine:/.*[Gg][Ww].*/ OR data_win_eventdata_commandLine:/.*[Gg][Aa].*/ OR data_win_eventdata_commandLine:/.*[Ww][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ww][Dd].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: bac9fb54-2da7-44e9-988f-11e9a5edbc0c
    name: Potential Password Spraying Attempt Using Dsacls.EXE
    reason: Same dsacls.exe LOLBin abused with explicit credentials; indicates the operator is using it for AD attack, not admin work.
  - id: b1b1e316-accc-11eb-a9b4-acde48001122
    name: ICACLS Grant Command
    reason: Parallel permission-granting step on file system objects, commonly used alongside AD ACL changes.
  - id: e5d36acd-acb4-4c6f-a13f-9eb203d50099
    name: Active Directory Structure Export Via Csvde.EXE
    reason: AD structure enumeration typically precedes selecting the object to grant rights on.
  - id: 4f7a6757-ff79-46db-9687-66501a02d9ec
    name: Active Directory Structure Export Via Ldifde.EXE
    reason: Same AD reconnaissance precursor via ldifde.
  - id: 2afafd61-6aae-4df4-baed-139fa1f4c345
    name: Invocation of Active Directory Diagnostic Tool (ntdsutil.exe)
    reason: Granting replication or full-control rights is often followed by directory credential extraction.
  - id: da63bc76-61ae-11eb-ae93-0242ac130002
    name: Ntdsutil Export NTDS
    reason: 'Follow-on: rights granted on domain objects enable NTDS credential export.'
  - id: cc316032-924a-11eb-91a2-acde48001122
    name: DSQuery Domain Discovery
    reason: Domain discovery before choosing a target OU/object for ACL abuse.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other dsacls invocations
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*\\dsacls\.exe/
    pivot_on: host
    window: 24h
  - name: AD object ACL/DACL modification events
    query: data_win_system_eventID:5136 OR data_win_system_eventID:4662 OR data_win_system_eventID:4670
    pivot_on: user
    window: 4h
  - name: AD export and discovery tooling
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*\\(csvde|ldifde|dsquery|nltest|adfind)\.exe/
    pivot_on: host
    window: 6h
  - name: Privileged group membership changes
    query: data_win_system_eventID:4728 OR data_win_system_eventID:4732 OR data_win_system_eventID:4756
    pivot_on: user
    window: 4h
  - name: NTDS or replication credential theft
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*[Nn]tds.*/ OR data_win_eventdata_commandLine:/.*[Dd]c[Ss]ync.*/ OR data_win_eventdata_image:/.*\\ntdsutil\.exe/)
    pivot_on: host
    window: 6h
