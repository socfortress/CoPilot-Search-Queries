name: Potential Excel.EXE DCOM Lateral Movement Via ActivateMicrosoftApp
id: 551d9c1f-816c-445b-a7a6-7a3864720d60
version: 1
schema_version: "1.0"
date: "2023-11-13"
author: Aaron Stratton
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 551d9c1f-816c-445b-a7a6-7a3864720d60
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious child processes of Excel which could be an indicator of
  lateral movement leveraging the "ActivateMicrosoftApp" Excel DCOM object.
  MITRE ATT&CK: T1021.003.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_parentImage:
              value: "*\\\\excel.exe"
              case_insensitive: true
        - bool:
            should:
              - term:
                  data_win_eventdata_originalFileName:
                    value: "foxprow.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "schdplus.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "winproj.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\foxprow.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\schdplus.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\winproj.exe"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_originalFileName
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\excel.exe'; data_win_eventdata_originalFileName equals 'foxprow.exe';
  data_win_eventdata_originalFileName equals 'schdplus.exe', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://posts.specterops.io/lateral-movement-abuse-the-power-of-dcom-excel-application-3c016d0d9922
  - https://github.com/grayhatkiller/SharpExShell
  - https://learn.microsoft.com/en-us/office/vba/api/excel.xlmsapplication
  - https://attack.mitre.org/techniques/T1021/003/

response:
  message: >
    Potential Excel.EXE DCOM Lateral Movement Via ActivateMicrosoftApp detected
    on host $agent_name$. Matched data_win_eventdata_parentImage:
    $data_win_eventdata_parentImage$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1021.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1021.003
  custom_tags:
    - excel
    - lateral
    - movement
    - process_creation
    - sysmon
    - lateral_movement
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ee][Xx][Cc][Ee][Ll]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_originalFileName:/[Ff][Oo][Xx][Pp][Rr][Oo][Ww]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ss][Cc][Hh][Dd][Pp][Ll][Uu][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ww][Ii][Nn][Pp][Rr][Oo][Jj]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ff][Oo][Xx][Pp][Rr][Oo][Ww]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Dd][Pp][Ll][Uu][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Pp][Rr][Oo][Jj]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: f1f3bf22-deb2-418d-8cce-e1a45e46a5bd
    name: MMC20 Lateral Movement
    reason: Sibling DCOM lateral-movement technique; an operator with Excel DCOM working often tries other DCOM objects on the same target.
  - id: 692f0bec-83ba-4d04-af7e-e884a96059b6
    name: Potential WMI Lateral Movement WmiPrvSE Spawned PowerShell
    reason: Alternative remote-execution path used by the same operator against the same target when DCOM is blocked or noisy.
  - id: 8a582fe2-0882-4b89-a82a-da6b2dc32937
    name: Suspicious WmiPrvSE Child Process
    reason: Co-occurring remote execution via WMI on the destination host once credentials are held.
  - id: 438025f9-5856-4663-83f7-52f878a70a50
    name: Suspicious Microsoft Office Child Process
    reason: Excel launching a shell or script engine is the usual next payload step once the DCOM-launched Excel is under attacker control.
  - id: aa3a6f94-890e-4e22-b634-ffdfd54792cc
    name: Suspicious Binary In User Directory Spawned From Office Application
    reason: 'Follow-on: attacker-dropped binary from a user directory executed by the hijacked Excel instance.'
  - id: 0b0cd537-fc77-4e6e-a973-e53495c1083d
    name: Renamed Office Binary Execution
    reason: Attacker may rename or copy Office binaries to evade the parentImage match used here.
  - id: cb909b3e-512b-11ec-aa31-3e22fbd008af
    name: Possible Lateral Movement PowerShell Spawn
    reason: PowerShell spawned by remote-execution parents is a typical post-DCOM payload on the target.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Excel spawning shells or script engines
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:*excel.exe AND data_win_eventdata_image:(*cmd.exe OR *powershell.exe OR *pwsh.exe OR *mshta.exe OR *wscript.exe OR *cscript.exe OR *rundll32.exe OR *regsvr32.exe)
    pivot_on: host
    window: 2h
  - name: Excel network connections
    query: data_win_system_eventID:3 AND data_win_eventdata_image:*excel.exe
    pivot_on: host
    window: 2h
  - name: Excel dropping executable content
    query: data_win_system_eventID:11 AND data_win_eventdata_image:*excel.exe AND data_win_eventdata_targetFilename:(*.exe OR *.dll OR *.ps1 OR *.hta OR *.vbs OR *.bat OR *.js)
    pivot_on: host
    window: 4h
  - name: Network logons by the account around the event
    query: data_win_system_eventID:4624 AND data_win_eventdata_logonType:3
    pivot_on: user
    window: 2h
  - name: Post-compromise reconnaissance commands
    query: data_win_system_eventID:1 AND data_win_eventdata_image:(*whoami.exe OR *net.exe OR *net1.exe OR *nltest.exe OR *systeminfo.exe OR *ipconfig.exe OR *quser.exe)
    pivot_on: host
    window: 2h
