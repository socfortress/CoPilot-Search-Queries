name: Audio Capture via PowerShell
id: 932fb0d8-692b-4b0f-a26e-5643a50fe7d6
version: 1
schema_version: "1.0"
date: "2023-04-06"
author: E.M. Anhaus (originally from Atomic Blue Detections, Endgame), oscd.community, Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 932fb0d8-692b-4b0f-a26e-5643a50fe7d6
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects audio capture via PowerShell Cmdlet. MITRE ATT&CK: T1123.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*WindowsAudioDevice-Powershell-Cmdlet*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Toggle-AudioDevice*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Get-AudioDevice *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Set-AudioDevice *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Write-AudioDevice *"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*WindowsAudioDevice-Powershell-Cmdlet*'; data_win_eventdata_commandLine
  matches '*Toggle-AudioDevice*'; data_win_eventdata_commandLine matches
  '*Get-AudioDevice *', among other conditions.

known_false_positives: >
  Legitimate audio capture by legitimate user. Baseline expected activity in
  your environment and tune this detection before relying on it for automated
  response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1123/T1123.md
  - https://eqllib.readthedocs.io/en/latest/analytics/ab7a6ef4-0983-4275-a4f1-5c6bd3c31c23.html
  - https://github.com/frgnca/AudioDeviceCmdlets
  - https://attack.mitre.org/techniques/T1123/

response:
  message: >
    Audio Capture via PowerShell detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1123
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1123
  custom_tags:
    - audio
    - capture
    - powershell
    - process_creation
    - sysmon
    - collection
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Aa][Uu][Dd][Ii][Oo][Dd][Ee][Vv][Ii][Cc][Ee]-[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]-[Cc][Mm][Dd][Ll][Ee][Tt].*/ OR data_win_eventdata_commandLine:/.*[Tt][Oo][Gg][Gg][Ll][Ee]-[Aa][Uu][Dd][Ii][Oo][Dd][Ee][Vv][Ii][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Gg][Ee][Tt]-[Aa][Uu][Dd][Ii][Oo][Dd][Ee][Vv][Ii][Cc][Ee] .*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Aa][Uu][Dd][Ii][Oo][Dd][Ee][Vv][Ii][Cc][Ee] .*/ OR data_win_eventdata_commandLine:/.*[Ww][Rr][Ii][Tt][Ee]-[Aa][Uu][Dd][Ii][Oo][Dd][Ee][Vv][Ii][Cc][Ee] .*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 83865853-59aa-449e-9600-74b9d89a6d6e
    name: Audio Capture via SoundRecorder
    reason: Alternative native audio recording method by the same actor on the same host.
  - id: 2158f96f-43c2-43cb-952a-ab4580f32382
    name: Screen Capture Activity Via Psr.EXE
    reason: Sibling collection technique; actors collecting audio often capture screen too.
  - id: b9aeac14-2ffd-4ad3-b967-1354a4e628c3
    name: PowerShell Get-Clipboard Cmdlet Via CLI
    reason: Other PowerShell-based input capture used in the same collection phase.
  - id: c4db14d9-7909-48b4-a054-aa14d89dbb19
    name: Malicious PowerShell Process - Encoded Command
    reason: 'Delivery vehicle: audio module typically loaded by an obfuscated PowerShell stager.'
  - id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
    name: PowerShell Download and Execution Cradles
    reason: 'Precursor: AudioDeviceCmdlets module is fetched via a download cradle.'
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: AudioDeviceCmdlets module install or import
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ii]nstall-[Mm]odule.*[Aa]udio.*/ OR /.*[Ii]mport-[Mm]odule.*[Aa]udio.*/ OR /.*[Aa]udio[Dd]evice[Cc]mdlets.*/)
    pivot_on: host
    window: 6h
  - name: PowerShell download cradles on host
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND data_win_eventdata_commandLine:(/.*[Ii]nvoke-[Ww]eb[Rr]equest.*/ OR /.*[Dd]ownload[Ss]tring.*/ OR /.*[Ss]tart-[Bb]its[Tt]ransfer.*/)
    pivot_on: host
    window: 6h
  - name: Audio file creation
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(/.*\.[Ww][Aa][Vv]/ OR /.*\.[Mm][Pp]3/ OR /.*\.[Ww][Mm][Aa]/)
    pivot_on: host
    window: 6h
  - name: Other capture tooling (screen, clipboard, keylog)
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Gg]et-[Cc]lipboard.*/ OR /.*[Gg]et-[Kk]eystrokes.*/ OR /.*[Ss]creen[Ss]hot.*/ OR /.*[Pp]sr\.exe.*/)
    pivot_on: user
    window: 6h
  - name: Archive or exfil staging after capture
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Cc]ompress-[Aa]rchive.*/ OR /.*[Cc]url.*/ OR /.*[Ii]nvoke-[Rr]est[Mm]ethod.*/)
    pivot_on: host
    window: 24h
