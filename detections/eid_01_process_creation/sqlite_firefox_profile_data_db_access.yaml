name: SQLite Firefox Profile Data DB Access
id: 4833155a-4053-4c9c-a997-777fcea0baa7
version: 1
schema_version: "1.0"
date: "2023-01-19"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 4833155a-4053-4c9c-a997-777fcea0baa7
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detect usage of the "sqlite" binary to query databases in Firefox and other
  Gecko-based browsers for potential data stealing. MITRE ATT&CK: T1539, T1005.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - term:
                  data_win_eventdata_product:
                    value: "SQLite"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\sqlite.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\sqlite3.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*cookies.sqlite*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*places.sqlite*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_product
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_product equals 'SQLite';
  data_win_eventdata_image matches '*\sqlite.exe'; data_win_eventdata_image
  matches '*\sqlite3.exe', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1539/T1539.md#atomic-test-1---steal-firefox-cookies-windows
  - https://blog.cyble.com/2022/04/21/prynt-stealer-a-new-info-stealer-performing-clipper-and-keylogger-activities/
  - https://attack.mitre.org/techniques/T1539/
  - https://attack.mitre.org/techniques/T1005/

response:
  message: >
    SQLite Firefox Profile Data DB Access detected on host $agent_name$. Matched
    data_win_eventdata_product: $data_win_eventdata_product$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1539,
    T1005
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_product
      type: other
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1539
    - T1005
  custom_tags:
    - sqlite
    - firefox
    - profile
    - process_creation
    - sysmon
    - credential_access
    - collection
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_product:/[Ss][Qq][Ll][Ii][Tt][Ee]/ OR data_win_eventdata_image:/.*\\[Ss][Qq][Ll][Ii][Tt][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ss][Qq][Ll][Ii][Tt][Ee]3\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Oo][Kk][Ii][Ee][Ss]\.[Ss][Qq][Ll][Ii][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Pp][Ll][Aa][Cc][Ee][Ss]\.[Ss][Qq][Ll][Ii][Tt][Ee].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 24c77512-782b-448a-8950-eddb0785fc71
    name: SQLite Chromium Profile Data DB Access
    reason: Same sqlite-based browser credential/cookie theft technique against Chromium browsers; stealers usually hit every browser on the host.
  - id: 47147b5b-9e17-4d76-b8d2-7bac24c5ce1b
    name: Potential Browser Data Stealing
    reason: Copying/reading browser profile databases is the alternative way to take the same cookies and logins.
  - id: 5a6e1e16-07de-48d8-8aae-faa766c05e88
    name: Potential Cookies Session Hijacking
    reason: Stolen Firefox cookies are what enable session hijacking; this is the direct follow-on.
  - id: 6a69f62d-ce75-4b57-8dce-6351eb55b362
    name: Esentutl Steals Browser Information
    reason: Parallel LOLBin route to browser data theft on the same host.
  - id: 8ba484e8-4b97-11ec-b19a-acde48001122
    name: Possible Browser Pass View Parameter
    reason: Browser credential-dump tooling is often run in the same stealer session.
  - id: 9fbf5927-5261-4284-a71d-f681029ea574
    name: Compress Data and Lock With Password for Exfiltration With 7-ZIP
    reason: Stolen browser DBs are typically archived before exfiltration.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Browser profile database file activity
    query: data_win_system_eventID:11 AND (data_win_eventdata_targetFilename:/.*[Cc]ookies\.sqlite.*/ OR data_win_eventdata_targetFilename:/.*[Pp]laces\.sqlite.*/ OR data_win_eventdata_targetFilename:/.*[Ll]ogins\.json.*/ OR data_win_eventdata_targetFilename:/.*[Kk]ey4\.db.*/)
    pivot_on: host
    window: 4h
  - name: Browser credential or cookie extraction tooling
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*[Ll]ogin [Dd]ata.*/ OR data_win_eventdata_commandLine:/.*[Ww]eb [Dd]ata.*/ OR data_win_eventdata_commandLine:/.*[Ll]ogins\.json.*/ OR data_win_eventdata_commandLine:/.*[Bb]rowser[Pp]ass.*/ OR data_win_eventdata_commandLine:/.*[Ll]azagne.*/)
    pivot_on: host
    window: 4h
  - name: Archiving of collected data
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*\\(7z|7za|rar|winrar)\.exe/ OR data_win_eventdata_commandLine:/.*[Cc]ompress-[Aa]rchive.*/)
    pivot_on: host
    window: 4h
  - name: DNS to exfil or paste services
    query: data_win_system_eventID:22 AND (data_win_eventdata_queryName:*discord* OR data_win_eventdata_queryName:*telegram* OR data_win_eventdata_queryName:*pastebin* OR data_win_eventdata_queryName:*transfer.sh* OR data_win_eventdata_queryName:*mega.nz*)
    pivot_on: host
    window: 4h
