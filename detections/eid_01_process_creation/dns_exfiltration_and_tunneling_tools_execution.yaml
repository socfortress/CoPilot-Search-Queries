name: DNS Exfiltration and Tunneling Tools Execution
id: 98a96a5a-64a0-4c42-92c5-489da3866cb0
version: 1
schema_version: "1.0"
date: "2021-11-27"
author: Daniil Yugoslavskiy, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 98a96a5a-64a0-4c42-92c5-489da3866cb0
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Well-known DNS Exfiltration tools execution. MITRE ATT&CK: T1048.001,
  T1071.004, T1132.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\iodine.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\dnscat2*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\iodine.exe'; data_win_eventdata_image matches '*\dnscat2*'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/iagox86/dnscat2
  - https://github.com/yarrick/iodine
  - https://attack.mitre.org/techniques/T1048/001/
  - https://attack.mitre.org/techniques/T1071/004/
  - https://attack.mitre.org/techniques/T1132/001/

response:
  message: >
    DNS Exfiltration and Tunneling Tools Execution detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
    MITRE ATT&CK: T1048.001, T1071.004, T1132.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1048.001
    - T1071.004
    - T1132.001
  custom_tags:
    - exfiltration
    - tunneling
    - tools
    - process_creation
    - sysmon
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ii][Oo][Dd][Ii][Nn][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Dd][Nn][Ss][Cc][Aa][Tt]2.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 2452e632-9e0d-11eb-bacd-acde48001122
    name: DNS Exfiltration Using Nslookup App
    reason: Nslookup-based DNS exfil is the living-off-the-land counterpart; both indicate DNS C2/exfil.
  - id: 8b0e12da-d3c3-49db-bb4f-256703f380e5
    name: PUA - Chisel Tunneling Tool Execution
    reason: Chisel tunneling; attackers deploy multiple tunnel tools as fallbacks.
  - id: ee37eb7c-a4e7-4cd5-8fa4-efa27f1c3f31
    name: PUA - Ngrok Execution
    reason: Ngrok execution; alternate tunnel when the DNS channel is blocked.
  - id: cf93e05e-d798-4d9e-b522-b0248dc61eaf
    name: HackTool - SharpChisel Execution
    reason: SharpChisel tunnel tool; same intent of covert C2 channel.
  - id: 7d1aaf3d-4304-425c-b7c3-162055e0b3ab
    name: Potential Data Exfiltration Activity Via CommandLine Tools
    reason: Command-line data exfiltration tooling; the data being tunneled out.
  - id: 1b3b01c7-84e9-4072-86e5-fc285a41ff23
    name: Nslookup PowerShell Download Cradle - ProcessCreation
    reason: Nslookup PowerShell cradle; DNS used as a staging/C2 channel.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Long-label DNS queries from non-browser processes
    query: data_win_system_eventID:22 AND data_win_eventdata_queryName:/.{50,}/ AND NOT data_win_eventdata_image:/.*(chrome|firefox|msedge|svchost)\.exe/
    pivot_on: host
    window: 2h
  - name: DNS queries by the tunneling tools themselves
    query: data_win_system_eventID:22 AND data_win_eventdata_image:/.*(iodine|dnscat).*/
    pivot_on: host
    window: 2h
  - name: TXT/NULL record lookups via nslookup
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*nslookup\.exe/ AND data_win_eventdata_commandLine:/.*(TXT|NULL|CNAME|MX).*/
    pivot_on: host
    window: 4h
  - name: Network connections by the tunneling tools
    query: data_win_system_eventID:3 AND (data_win_eventdata_image:/.*iodine.*/ OR data_win_eventdata_image:/.*dnscat.*/)
    pivot_on: host
    window: 2h
  - name: Archive staging before exfiltration
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*(7z|rar|winrar|tar)\.exe/ AND data_win_eventdata_commandLine:/.*( a | -p| -hp).*/
    pivot_on: host
    window: 6h
