name: Proxy Execution Via Wuauclt.EXE
id: af77cf95-c469-471c-b6a0-946c685c4798
version: 1
schema_version: "1.0"
date: "2023-11-11"
author: Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research), Florian Roth (Nextron Systems), Sreeman, FPT.EagleEye Team
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: af77cf95-c469-471c-b6a0-946c685c4798
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the use of the Windows Update Client binary (wuauclt.exe) for proxy
  execution. MITRE ATT&CK: T1218.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\wuauclt.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "wuauclt.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*UpdateDeploymentProvider*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*RunHandlerComServer*"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_commandLine"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* /UpdateDeploymentProvider UpdateDeploymentProvider.dll *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* wuaueng.dll *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*:\\\\Windows\\\\UUS\\\\Packages\\\\Preview\\\\amd64\\\\updatedeploy.dll /ClassId*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*:\\\\Windows\\\\UUS\\\\amd64\\\\UpdateDeploy.dll /ClassId*"
                          case_insensitive: true
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*:\\\\Windows\\\\WinSxS\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*\\\\UpdateDeploy.dll /ClassId *"
                                case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\wuauclt.exe'; data_win_eventdata_originalFileName equals 'wuauclt.exe';
  data_win_eventdata_commandLine matches '*UpdateDeploymentProvider*', among
  other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://dtm.uk/wuauclt/
  - https://blog.malwarebytes.com/threat-intelligence/2022/01/north-koreas-lazarus-apt-leverages-windows-update-client-github-in-latest-campaign/
  - https://attack.mitre.org/techniques/T1218/

response:
  message: >
    Proxy Execution Via Wuauclt.EXE detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1218
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218
  custom_tags:
    - proxy
    - wuauclt
    - process_creation
    - sysmon
    - stealth
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ww][Uu][Aa][Uu][Cc][Ll][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ww][Uu][Aa][Uu][Cc][Ll][Tt]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Uu][Pp][Dd][Aa][Tt][Ee][Dd][Ee][Pp][Ll][Oo][Yy][Mm][Ee][Nn][Tt][Pp][Rr][Oo][Vv][Ii][Dd][Ee][Rr].*/ AND data_win_eventdata_commandLine:/.*[Rr][Uu][Nn][Hh][Aa][Nn][Dd][Ll][Ee][Rr][Cc][Oo][Mm][Ss][Ee][Rr][Vv][Ee][Rr].*/ AND _exists_:data_win_eventdata_commandLine AND NOT (data_win_eventdata_commandLine:/.* \/[Uu][Pp][Dd][Aa][Tt][Ee][Dd][Ee][Pp][Ll][Oo][Yy][Mm][Ee][Nn][Tt][Pp][Rr][Oo][Vv][Ii][Dd][Ee][Rr] [Uu][Pp][Dd][Aa][Tt][Ee][Dd][Ee][Pp][Ll][Oo][Yy][Mm][Ee][Nn][Tt][Pp][Rr][Oo][Vv][Ii][Dd][Ee][Rr]\.[Dd][Ll][Ll] .*/ OR data_win_eventdata_commandLine:/.* [Ww][Uu][Aa][Uu][Ee][Nn][Gg]\.[Dd][Ll][Ll] .*/ OR data_win_eventdata_commandLine:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Uu][Uu][Ss]\\[Pp][Aa][Cc][Kk][Aa][Gg][Ee][Ss]\\[Pp][Rr][Ee][Vv][Ii][Ee][Ww]\\[Aa][Mm][Dd]64\\[Uu][Pp][Dd][Aa][Tt][Ee][Dd][Ee][Pp][Ll][Oo][Yy]\.[Dd][Ll][Ll] \/[Cc][Ll][Aa][Ss][Ss][Ii][Dd].*/ OR data_win_eventdata_commandLine:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Uu][Uu][Ss]\\[Aa][Mm][Dd]64\\[Uu][Pp][Dd][Aa][Tt][Ee][Dd][Ee][Pp][Ll][Oo][Yy]\.[Dd][Ll][Ll] \/[Cc][Ll][Aa][Ss][Ss][Ii][Dd].*/ OR (data_win_eventdata_commandLine:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ww][Ii][Nn][Ss][Xx][Ss]\\.*/ AND data_win_eventdata_commandLine:/.*\\[Uu][Pp][Dd][Aa][Tt][Ee][Dd][Ee][Pp][Ll][Oo][Yy]\.[Dd][Ll][Ll] \/[Cc][Ll][Aa][Ss][Ss][Ii][Dd] .*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e593cf51-88db-4ee1-b920-37e89012a3c9
    name: Potentially Suspicious Rundll32 Activity
    reason: wuauclt UpdateDeploymentProvider loads an arbitrary DLL, same DLL-proxy technique as rundll32.
  - id: c3a99af4-35a9-4668-879e-c09aeb4f2bdf
    name: Rundll32 Execution With Uncommon DLL Extension
    reason: Sibling DLL proxy execution operators alternate with wuauclt.
  - id: 590a5f4c-6c8c-4f10-8307-89afe9453a9d
    name: Suspicious Child Process Created as System
    reason: A DLL loaded by wuauclt often spawns child shells as SYSTEM.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: wuauclt invocations loading a DLL
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Ww][Uu][Aa][Uu][Cc][Ll][Tt]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*\.[Dd][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Rr][Uu][Nn][Hh][Aa][Nn][Dd][Ll][Ee][Rr][Cc][Oo][Mm][Ss][Ee][Rr][Vv][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Uu][Pp][Dd][Aa][Tt][Ee][Dd][Ee][Pp][Ll][Oo][Yy][Mm][Ee][Nn][Tt][Pp][Rr][Oo][Vv][Ii][Dd][Ee][Rr].*/)
    pivot_on:
    - host
    window: 2h
  - name: DLL dropped in user-writable path
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.[Dd][Ll][Ll]/ AND data_win_eventdata_targetFilename:/.*(\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\|\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\|\\[Tt][Ee][Mm][Pp]\\|\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\|\\[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]\\).*/
    pivot_on:
    - host
    window: 2h
  - name: Non-system image loads into wuauclt
    query: data_win_system_eventID:"7" AND data_win_eventdata_image:/.*\\[Ww][Uu][Aa][Uu][Cc][Ll][Tt]\.[Ee][Xx][Ee]/ AND NOT data_win_eventdata_imageLoaded:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\.*/
    pivot_on:
    - host
    window: 2h
  - name: Network connections from wuauclt
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\[Ww][Uu][Aa][Uu][Cc][Ll][Tt]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
