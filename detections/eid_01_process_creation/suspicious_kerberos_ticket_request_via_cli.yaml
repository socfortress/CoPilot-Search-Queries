name: Suspicious Kerberos Ticket Request via CLI
id: caa9a802-8bd8-4b9e-a5cd-4d6221670219
version: 1
schema_version: "1.0"
date: "2025-11-18"
author: Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: caa9a802-8bd8-4b9e-a5cd-4d6221670219
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious Kerberos ticket requests via command line using
  System.IdentityModel.Tokens.KerberosRequestorSecurityToken class. Threat
  actors may use command line interfaces to request Kerberos tickets for service
  accounts in order to perform offline password cracking attacks commonly known
  as Kerberoasting or other Kerberos ticket abuse techniques like silver ticket
  attacks. MITRE ATT&CK: T1558.003.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\powershell.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\pwsh.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "powershell.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "pwsh.dll"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*System.IdentityModel.Tokens.KerberosRequestorSecurityToken*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*.GetRequest()*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\powershell.exe'; data_win_eventdata_image matches '*\pwsh.exe';
  data_win_eventdata_originalFileName equals 'powershell.exe', among other
  conditions.

known_false_positives: >
  Legitimate command line usage by administrators or security tools. Baseline
  expected activity in your environment and tune this detection before relying
  on it for automated response.

references:
  - https://www.huntress.com/blog/gootloader-threat-detection-woff2-obfuscation
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1558.003/T1558.003.md#atomic-test-4---request-a-single-ticket-via-powershell
  - https://learn.microsoft.com/en-us/dotnet/api/system.identitymodel.tokens.kerberosrequestorsecuritytoken?view=netframework-4.8.1
  - https://attack.mitre.org/techniques/T1558/003/

response:
  message: >
    Suspicious Kerberos Ticket Request via CLI detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1558.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1558.003
  custom_tags:
    - kerberos
    - ticket
    - request
    - process_creation
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Pp][Ww][Ss][Hh]\.[Dd][Ll][Ll]/) AND data_win_eventdata_commandLine:/.*[Ss][Yy][Ss][Tt][Ee][Mm]\.[Ii][Dd][Ee][Nn][Tt][Ii][Tt][Yy][Mm][Oo][Dd][Ee][Ll]\.[Tt][Oo][Kk][Ee][Nn][Ss]\.[Kk][Ee][Rr][Bb][Ee][Rr][Oo][Ss][Rr][Ee][Qq][Uu][Ee][Ss][Tt][Oo][Rr][Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy][Tt][Oo][Kk][Ee][Nn].*/ AND data_win_eventdata_commandLine:/.*\.[Gg][Ee][Tt][Rr][Ee][Qq][Uu][Ee][Ss][Tt]\(\).*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 1eeed653-dbc8-4187-ad0c-eeebb20e6599
    name: Potential SPN Enumeration Via Setspn.EXE
    reason: SPN enumeration is the usual precursor that selects which service accounts to request tickets for
  - id: a7093c28-796c-4ebb-9997-e2c18b870837
    name: Windows PowerView SPN Discovery
    reason: PowerView SPN discovery feeds the same in-memory Kerberoast workflow
  - id: 7ec2c172-dceb-4c10-92c9-87c1881b7e18
    name: HackTool - Rubeus Execution
    reason: Rubeus is the alternate Kerberoast tool an operator pivots to on the same host
  - id: 3245cd30-e015-40ff-a31d-5cadd5f377ec
    name: HackTool - Rubeus Execution - ScriptBlock
    reason: Reflective Rubeus loaded via PowerShell script blocks
  - id: d04ae2b8-ad54-4de0-bd87-4bc1da66aa59
    name: Kerberoasting Activity - Initial Query
    reason: DC-side TGS requests for service accounts confirm tickets were actually issued
  - id: f6de9536-0441-4b3f-a646-f4e00f300ffd
    name: Weak Encryption Enabled and Kerberoast
    reason: RC4 downgrade on service tickets makes the harvested tickets crackable
  - id: 13bbd574-83ac-11ec-99d4-acde48001122
    name: Mimikatz PassTheTicket CommandLine Parameters
    reason: Follow-on use of cracked or exported tickets via pass-the-ticket
  - id: e32d4572-9826-4738-b651-95fa63747e8a
    name: Base64 Encoded PowerShell Command Detected
    reason: The .NET class call is commonly delivered in encoded PowerShell
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: SPN enumeration tooling
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss]et[Ss][Pp][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ss]erviceprincipalname.*/)
    pivot_on: host
    window: 6h
  - name: Kerberoast tooling execution
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Kk]erberoast.*/ OR data_win_eventdata_commandLine:/.*[Rr]ubeus.*/ OR data_win_eventdata_commandLine:/.*[Gg]et-[Dd]omain[Ss][Pp][Nn][Tt]icket.*/)
    pivot_on: host
    window: 6h
  - name: Encoded or download-cradle PowerShell
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND (data_win_eventdata_commandLine:/.* -[Ee]nc.*/ OR data_win_eventdata_commandLine:/.*[Ii][Ee][Xx].*/ OR data_win_eventdata_commandLine:/.*[Dd]ownload[Ss]tring.*/)
    pivot_on: host
    window: 2h
  - name: Ticket handling and credential theft
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Kk]list.*/ OR data_win_eventdata_commandLine:/.*[Ss]ekurlsa.*/ OR data_win_eventdata_commandLine:/.*[Kk]erberos::.*/)
    pivot_on: host
    window: 6h
  - name: Offline cracking tools
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Hh]ashcat.*/ OR data_win_eventdata_image:/.*[Jj]ohn.*/)
    pivot_on: host
    window: 24h
