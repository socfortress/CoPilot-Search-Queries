name: Registry Manipulation via WMI Stdregprov
id: c453ab7a-1f5c-4716-a3b4-dea8135fb43a
version: 1
schema_version: "1.0"
date: "2026-06-19"
author: Daniel Koifman (KoifSec)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: c453ab7a-1f5c-4716-a3b4-dea8135fb43a
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the usage of wmic.exe to modify Windows registry via the WMI
  StdRegProv class write methods (CreateKey, DeleteKey, SetStringValue, etc.).
  This behaviour could be potentially suspicious because it uses an alternative
  method to modify registry keys instead of legitimate registry tools like
  reg.exe or regedit.exe. Attackers specifically choose this technique to evade
  detection and bypass security monitoring focused on traditional registry
  modification commands. MITRE ATT&CK: T1047, T1112.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\wmic.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "wmic.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*stdregprov*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*call*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*CreateKey*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*DeleteKey*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*DeleteValue*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*SetBinaryValue*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*SetDWORDValue*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*SetExpandedStringValue*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*SetMultiStringValue*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*SetQWORDValue*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*SetSecurityDescriptor*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*SetStringValue*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\wmic.exe'; data_win_eventdata_originalFileName equals 'wmic.exe';
  data_win_eventdata_commandLine matches '*stdregprov*', among other conditions.

known_false_positives: >
  Legitimate administrative activity. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://www.bitdefender.com/en-us/blog/businessinsights/shrinklocker-decryptor-from-friend-to-foe-and-back-again
  - https://trustedsec.com/blog/command-line-underdog-wmic-in-action
  - https://trustedsec.com/blog/wmi-for-script-kiddies
  - https://learn.microsoft.com/en-us/previous-versions/windows/desktop/regprov/stdregprov
  - https://attack.mitre.org/techniques/T1047/
  - https://attack.mitre.org/techniques/T1112/

response:
  message: >
    Registry Manipulation via WMI Stdregprov detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1047, T1112
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1047
    - T1112
  custom_tags:
    - registry
    - manipulation
    - stdregprov
    - process_creation
    - sysmon
    - execution
    - persistence
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Ss][Tt][Dd][Rr][Ee][Gg][Pp][Rr][Oo][Vv].*/ AND data_win_eventdata_commandLine:/.*[Cc][Aa][Ll][Ll].*/ AND (data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee][Kk][Ee][Yy].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ee][Ll][Ee][Tt][Ee][Kk][Ee][Yy].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ee][Ll][Ee][Tt][Ee][Vv][Aa][Ll][Uu][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Tt][Bb][Ii][Nn][Aa][Rr][Yy][Vv][Aa][Ll][Uu][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Tt][Dd][Ww][Oo][Rr][Dd][Vv][Aa][Ll][Uu][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Tt][Ee][Xx][Pp][Aa][Nn][Dd][Ee][Dd][Ss][Tt][Rr][Ii][Nn][Gg][Vv][Aa][Ll][Uu][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Tt][Mm][Uu][Ll][Tt][Ii][Ss][Tt][Rr][Ii][Nn][Gg][Vv][Aa][Ll][Uu][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Tt][Qq][Ww][Oo][Rr][Dd][Vv][Aa][Ll][Uu][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Tt][Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy][Dd][Ee][Ss][Cc][Rr][Ii][Pp][Tt][Oo][Rr].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Tt][Ss][Tt][Rr][Ii][Nn][Gg][Vv][Aa][Ll][Uu][Ee].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a0e417e2-2fa1-40da-b6d2-e094cd5e1191
    name: Registry Enumeration via WMI Stdregprov
    reason: 'Precursor: operators enumerate through StdRegProv before writing to it.'
  - id: c80e66d8-1780-48a9-b412-46663fd21ac0
    name: Suspicious Autorun Registry Modified via WMI
    reason: Persistence variant of WMI-based registry writes (Run keys).
  - id: de587dce-915e-4218-aac4-835ca6af6f70
    name: Potential Persistence Attempt Via Run Keys Using Reg.EXE
    reason: Same persistence goal via the traditional tool; shows tool switching.
  - id: 51cbac1e-eee3-4a90-b1b7-358efb81fa0a
    name: Potential Windows Defender Tampering Via Wmic.EXE
    reason: StdRegProv writes are used to disable Defender; companion defense evasion.
  - id: 847d5ff3-8a31-4737-a970-aeae8fe21765
    name: Potential Tampering With Security Products Via WMIC
    reason: Wmic-based security product tampering often co-occurs with registry modification.
  - id: 7f4c43f9-b1a5-4c7d-b24a-b41bf3a3ebf2
    name: Registry Tampering by Potentially Suspicious Processes
    reason: Sysmon registry-event view of the same write, confirming key and value.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Registry value sets by wmic or WmiPrvSE
    query: data_win_system_eventID:"13" AND (data_win_eventdata_image:/.*\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee]\.[Ee][Xx][Ee]/)
    pivot_on: host
    window: 4h
  - name: Run key and service ImagePath writes
    query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/ OR (data_win_eventdata_targetObject:/.*\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\.*/ AND data_win_eventdata_targetObject:/.*[Ii][Mm][Aa][Gg][Ee][Pp][Aa][Tt][Hh].*/))
    pivot_on: host
    window: 4h
  - name: Defender configuration changes in registry
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND data_win_eventdata_targetObject:/.*[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr].*/
    pivot_on: host
    window: 4h
  - name: Wmic process call or remote node usage
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*[Pp][Rr][Oo][Cc][Ee][Ss][Ss] [Cc][Aa][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Nn][Oo][Dd][Ee]:.*/)
    pivot_on: host
    window: 4h
