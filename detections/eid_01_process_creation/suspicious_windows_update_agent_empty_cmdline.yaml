name: Suspicious Windows Update Agent Empty Cmdline
id: 52d097e2-063e-4c9c-8fbb-855c8948d135
version: 1
schema_version: "1.0"
date: "2023-11-11"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 52d097e2-063e-4c9c-8fbb-855c8948d135
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious Windows Update Agent activity in which a wuauclt.exe
  process command line doesn't contain any command line flags. MITRE ATT&CK:
  T1036.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\Wuauclt.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "Wuauclt.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Wuauclt"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Wuauclt.exe"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\Wuauclt.exe'; data_win_eventdata_originalFileName equals 'Wuauclt.exe';
  data_win_eventdata_commandLine matches '*Wuauclt', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://redcanary.com/blog/blackbyte-ransomware/
  - https://attack.mitre.org/techniques/T1036/

response:
  message: >
    Suspicious Windows Update Agent Empty Cmdline detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1036
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1036
  custom_tags:
    - update
    - agent
    - empty
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ww][Uu][Aa][Uu][Cc][Ll][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ww][Uu][Aa][Uu][Cc][Ll][Tt]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*[Ww][Uu][Aa][Uu][Cc][Ll][Tt]/ OR data_win_eventdata_commandLine:/.*[Ww][Uu][Aa][Uu][Cc][Ll][Tt]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: af77cf95-c469-471c-b6a0-946c685c4798
    name: Proxy Execution Via Wuauclt.EXE
    reason: Wuauclt is also abused as a DLL proxy-execution LOLBin; same binary, different abuse path.
  - id: 20384606-a124-4fec-acbb-8bd373728613
    name: Suspicious Network Connection Binary No CommandLine
    reason: A flagless system binary that then makes network connections is the typical implant (spawn-to) behaviour.
  - id: 7b434893-c57d-4f41-908d-6a17bf1ae98f
    name: Network Connection Initiated From Process Located In Potentially Suspicious Or Uncommon Location
    reason: Implant processes calling out from uncommon locations pair with a fake system binary.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Network connections by wuauclt
    query: data_win_system_eventID:3 AND data_win_eventdata_image:(/.*\\[Ww]uauclt\.exe/)
    pivot_on: host
    window: 4h
  - name: Remote thread or process access into wuauclt
    query: (data_win_system_eventID:8 OR data_win_system_eventID:10) AND data_win_eventdata_targetImage:(/.*\\[Ww]uauclt\.exe/)
    pivot_on: host
    window: 4h
  - name: Wuauclt child processes
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:(/.*\\[Ww]uauclt\.exe/)
    pivot_on: host
    window: 4h
  - name: Wuauclt outside System32
    query: data_win_system_eventID:1 AND data_win_eventdata_image:(/.*[Ww]uauclt\.exe/) AND NOT data_win_eventdata_image:(/.*\\Windows\\System32\\.*/)
    pivot_on: host
    window: 24h
