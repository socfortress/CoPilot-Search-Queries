name: Suspicious Use of CSharp Interactive Console
id: a9e416a8-e613-4f8b-88b8-a7d1d1af2f61
version: 1
schema_version: "1.0"
date: "2022-07-14"
author: Michael R. (@nahamike01)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: a9e416a8-e613-4f8b-88b8-a7d1d1af2f61
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of CSharp interactive console by PowerShell. MITRE
  ATT&CK: T1127.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\csi.exe"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\powershell.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\pwsh.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\powershell_ise.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - term:
            data_win_eventdata_originalFileName:
              value: "csi.exe"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches '*\csi.exe';
  data_win_eventdata_parentImage matches '*\powershell.exe';
  data_win_eventdata_parentImage matches '*\pwsh.exe', among other conditions.

known_false_positives: >
  Possible depending on environment. Pair with other factors such as net
  connections, command-line args, etc. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://redcanary.com/blog/detecting-attacks-leveraging-the-net-framework/
  - https://attack.mitre.org/techniques/T1127/

response:
  message: >
    Suspicious Use of CSharp Interactive Console detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_parentImage: $data_win_eventdata_parentImage$. MITRE
    ATT&CK: T1127
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_parentImage
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1127
  custom_tags:
    - csharp
    - interactive
    - console
    - process_creation
    - sysmon
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Cc][Ss][Ii]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_parentImage:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]_[Ii][Ss][Ee]\.[Ee][Xx][Ee]/) AND data_win_eventdata_originalFileName:/[Cc][Ss][Ii]\.[Ee][Xx][Ee]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 40b95d31-1afc-469e-8d34-9a3a667d058e
    name: Suspicious Csi.exe Usage
    reason: Sibling csi.exe detection; both flag the same signed-Microsoft C# scripting LOLBin used to run attacker code.
  - id: d80d5c81-04ba-45b4-84e4-92eba40e0ad3
    name: Arbitrary DLL or Csproj Code Execution Via Dotnet.EXE
    reason: Another .NET signed-binary proxy-execution path used interchangeably with csi.
  - id: 39ac1fb0-07f1-474b-b97e-c5c0eace0d79
    name: Potential MOVEit Transfer CVE-2023-34362 Exploitation - Dynamic Compilation Via Csc.EXE
    reason: Dynamic C# compilation via csc is the compile-based sibling of csi's interpreted C# execution.
  - id: 850d55f9-6eeb-4492-ad69-a72338f65ba4
    name: C# IL Code Compilation Via Ilasm.EXE
    reason: Alternative .NET toolchain binary for building code on the host.
  - id: 30edb182-aa75-42c0-b0a9-e998bb29067c
    name: Potential AMSI Bypass Via .NET Reflection
    reason: C# run from a PowerShell-launched csi often performs reflection-based AMSI bypass before staging.
  - id: b6676963-0353-4f88-90f5-36c20d443c6a
    name: Cscript/Wscript Potentially Suspicious Child Process
    reason: Parallel script-host LOLBin execution typical of the same operator toolkit.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: csi.exe execution with script arguments
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Cc][Ss][Ii])\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:(/.*\.[Cc][Ss][Xx].*/)
    pivot_on: host
    window: 4h
  - name: .csx or .cs files written to disk
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.([Cc][Ss][Xx]|[Cc][Ss])/
    pivot_on: host
    window: 4h
  - name: Network connections from csi or csc
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Cc][Ss][Ii]|[Cc][Ss][Cc])\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 4h
  - name: PowerShell download or encoded commands
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh])\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:(/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR /.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd].*/ OR /.* -[Ee][Nn][Cc].*/)
    pivot_on: host
    window: 2h
