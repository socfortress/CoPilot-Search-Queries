name: Potential Adplus.EXE Abuse
id: 2f869d59-7f6a-4931-992c-cce556ff2d53
version: 1
schema_version: "1.0"
date: "2023-06-23"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 2f869d59-7f6a-4931-992c-cce556ff2d53
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of "AdPlus.exe", a binary that is part of the Windows SDK
  that can be used as a LOLBIN in order to dump process memory and execute
  arbitrary commands. MITRE ATT&CK: T1003.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\adplus.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "Adplus.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -hang *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -pn *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -pmn *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -p *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -po *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -c *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -sc *"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\adplus.exe'; data_win_eventdata_originalFileName equals 'Adplus.exe';
  data_win_eventdata_commandLine matches '* -hang *', among other conditions.

known_false_positives: >
  Legitimate usage of Adplus for debugging purposes. Baseline expected activity
  in your environment and tune this detection before relying on it for automated
  response.

references:
  - https://lolbas-project.github.io/lolbas/OtherMSBinaries/Adplus/
  - https://twitter.com/nas_bench/status/1534916659676422152
  - https://twitter.com/nas_bench/status/1534915321856917506
  - https://attack.mitre.org/techniques/T1003/001/

response:
  message: >
    Potential Adplus.EXE Abuse detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1003.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.001
  custom_tags:
    - adplus
    - abuse
    - process_creation
    - sysmon
    - execution
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Aa][Dd][Pp][Ll][Uu][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Aa][Dd][Pp][Ll][Uu][Ss]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.* -[Hh][Aa][Nn][Gg] .*/ OR data_win_eventdata_commandLine:/.* -[Pp][Nn] .*/ OR data_win_eventdata_commandLine:/.* -[Pp][Mm][Nn] .*/ OR data_win_eventdata_commandLine:/.* -[Pp] .*/ OR data_win_eventdata_commandLine:/.* -[Pp][Oo] .*/ OR data_win_eventdata_commandLine:/.* -[Cc] .*/ OR data_win_eventdata_commandLine:/.* -[Ss][Cc] .*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b5c7395f-e501-4a08-94d4-57fe7a9da9d2
    name: Potential Binary Proxy Execution Via Cdb.EXE
    reason: AdPlus drives cdb.exe from the same Debugging Tools package; cdb proxy execution is the sibling LOLBIN abuse.
  - id: 5afee48e-67dd-4e03-a783-f74259dcf998
    name: Potential LSASS Process Dump Via Procdump
    reason: Alternative LSASS dumper; operators try several dump tools on the same host.
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: Another LSASS dump method commonly tried if one tool is blocked or detected.
  - id: ffa6861c-4461-4f59-8a41-578c39f3f23e
    name: LSASS Dump Keyword In CommandLine
    reason: Generic LSASS-dump cue that overlaps with adplus -pn lsass.exe.
  - id: 2e65275c-8288-4ab4-aeb7-6274f58b6b20
    name: Procdump Execution
    reason: Generic dumper execution on the same host confirms a credential-dumping spree beyond adplus.
  - id: fd877b94-9bb5-4191-bb25-d79cbd93c167
    name: Dumping of Sensitive Hives Via Reg.EXE
    reason: 'Credential theft follow-on: SAM/SECURITY hive export complements an LSASS dump.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: LSASS access events
    query: data_win_system_eventID:10 AND data_win_eventdata_targetImage:*\\lsass.exe
    pivot_on: host
    window: 2h
  - name: Dump files written
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\.([Dd][Mm][Pp]|[Mm][Dd][Mm][Pp]).*/
    pivot_on: host
    window: 2h
  - name: Debugger tools spawned
    query: data_win_system_eventID:1 AND data_win_eventdata_image:(*\\cdb.exe OR *\\windbg.exe OR *\\adplus.exe OR *\\ntsd.exe)
    pivot_on: host
    window: 2h
  - name: Archiving of dump files for exfil
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(7z|rar|zip|Compress-Archive).*\.([Dd][Mm][Pp]).*/
    pivot_on: host
    window: 4h
  - name: Network logons with possible stolen creds
    query: data_win_system_eventID:4624 AND data_win_eventdata_logonType:(3 OR 9 OR 10)
    pivot_on: user
    window: 4h
