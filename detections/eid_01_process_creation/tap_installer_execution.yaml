name: Tap Installer Execution
id: 99793437-3e16-439b-be0f-078782cf953d
version: 1
schema_version: "1.0"
date: "2023-12-11"
author: Daniil Yugoslavskiy, Ian Davis, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 99793437-3e16-439b-be0f-078782cf953d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Well-known TAP software installation. Possible preparation for data
  exfiltration using tunneling techniques. MITRE ATT&CK: T1048.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\tapinstall.exe"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*:\\\\Program Files\\\\Avast Software\\\\SecureLine VPN\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*:\\\\Program Files (x86)\\\\Avast Software\\\\SecureLine VPN\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*:\\\\Program Files\\\\OpenVPN Connect\\\\drivers\\\\tap\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*:\\\\Program Files (x86)\\\\Proton Technologies\\\\ProtonVPNTap\\\\installer\\\\*"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\tapinstall.exe'; data_win_eventdata_image matches '*:\Program Files\Avast
  Software\SecureLine VPN\*'; data_win_eventdata_image matches '*:\Program Files
  (x86)\Avast Software\SecureLine VPN\*', among other conditions.

known_false_positives: >
  Legitimate OpenVPN TAP installation. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://community.openvpn.net/openvpn/wiki/ManagingWindowsTAPDrivers
  - https://attack.mitre.org/techniques/T1048/

response:
  message: >
    Tap Installer Execution detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1048
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1048
  custom_tags:
    - installer
    - process_creation
    - sysmon
    - exfiltration
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Tt][Aa][Pp][Ii][Nn][Ss][Tt][Aa][Ll][Ll]\.[Ee][Xx][Ee]/ AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Aa][Vv][Aa][Ss][Tt] [Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Ss][Ee][Cc][Uu][Rr][Ee][Ll][Ii][Nn][Ee] [Vv][Pp][Nn]\\.*/ OR data_win_eventdata_image:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Aa][Vv][Aa][Ss][Tt] [Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Ss][Ee][Cc][Uu][Rr][Ee][Ll][Ii][Nn][Ee] [Vv][Pp][Nn]\\.*/ OR data_win_eventdata_image:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Oo][Pp][Ee][Nn][Vv][Pp][Nn] [Cc][Oo][Nn][Nn][Ee][Cc][Tt]\\[Dd][Rr][Ii][Vv][Ee][Rr][Ss]\\[Tt][Aa][Pp]\\.*/ OR data_win_eventdata_image:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Pp][Rr][Oo][Tt][Oo][Nn] [Tt][Ee][Cc][Hh][Nn][Oo][Ll][Oo][Gg][Ii][Ee][Ss]\\[Pp][Rr][Oo][Tt][Oo][Nn][Vv][Pp][Nn][Tt][Aa][Pp]\\[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Ee][Rr]\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 8b0e12da-d3c3-49db-bb4f-256703f380e5
    name: PUA - Chisel Tunneling Tool Execution
    reason: A TAP adapter is often installed to run a tunnel such as chisel.
  - id: ee37eb7c-a4e7-4cd5-8fa4-efa27f1c3f31
    name: PUA - Ngrok Execution
    reason: Alternate tunneling tool used for exfiltration/C2 after TAP setup.
  - id: f38ce0b9-5e97-4b47-a211-7dc8d8b871da
    name: Potential RDP Tunneling Via Plink
    reason: Tunnelling follow-on once the virtual adapter exists.
  - id: a2ea3ae7-d3d0-40a0-a55c-25a45c87cac1
    name: Suspicious Driver Install by pnputil.exe
    reason: Driver install path often used alongside tapinstall to load the TAP driver.
  - id: e37db05d-d1f9-49c8-b464-cee1a4b11638
    name: PUA - Rclone Execution
    reason: Bulk data exfiltration tooling that may flow through the tunnel.
  - id: 9a019ffc-3580-4c9d-8d87-079f7e8d3fd4
    name: Cloudflared Tunnel Execution
    reason: Another tunneling channel an actor may stand up in the same session.
  - id: 431a1fdb-4799-4f3b-91c3-a683b003fc49
    name: New Kernel Driver Via SC.EXE
    reason: Kernel driver registration is an alternate way to load the adapter driver.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Driver installs on the host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Pp]nputil|[Dd]evcon|[Tt]apinstall)\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Ii]nf.*[Tt]ap.*/)
    pivot_on: host
    window: 6h
  - name: VPN / tunnel client launches
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\(openvpn|wireguard|tailscale|zerotier|chisel|ngrok|plink|ssh)[^\\]*\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 6h
  - name: Network adapter and route changes
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Nn]etsh.*(interface|portproxy).*/ OR data_win_eventdata_commandLine:/.*[Rr]oute.*[Aa]dd.*/)
    pivot_on: host
    window: 4h
  - name: tapinstall as parent or child
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\tapinstall\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\tapinstall\.[Ee][Xx][Ee]/)
    pivot_on: host
    window: 6h
  - name: Archive and upload staging by user
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Rr]clone|7z|[Ww]inrar|[Rr]ar).*/ AND data_win_eventdata_commandLine:/.*(copy|sync| a |-hp).*/
    pivot_on: user
    window: 6h
