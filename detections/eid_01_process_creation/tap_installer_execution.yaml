name: Tap Installer Execution
id: 99793437-3e16-439b-be0f-078782cf953d
version: 1
schema_version: "1.0"
date: "2023-12-11"
author: Daniil Yugoslavskiy, Ian Davis, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 99793437-3e16-439b-be0f-078782cf953d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Well-known TAP software installation. Possible preparation for data
  exfiltration using tunneling techniques. MITRE ATT&CK: T1048.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\tapinstall.exe"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*:\\\\Program Files\\\\Avast Software\\\\SecureLine VPN\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*:\\\\Program Files (x86)\\\\Avast Software\\\\SecureLine VPN\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*:\\\\Program Files\\\\OpenVPN Connect\\\\drivers\\\\tap\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*:\\\\Program Files (x86)\\\\Proton Technologies\\\\ProtonVPNTap\\\\installer\\\\*"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\tapinstall.exe'; data_win_eventdata_image matches '*:\Program Files\Avast
  Software\SecureLine VPN\*'; data_win_eventdata_image matches '*:\Program Files
  (x86)\Avast Software\SecureLine VPN\*', among other conditions.

known_false_positives: >
  Legitimate OpenVPN TAP installation. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://community.openvpn.net/openvpn/wiki/ManagingWindowsTAPDrivers
  - https://attack.mitre.org/techniques/T1048/

response:
  message: >
    Tap Installer Execution detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1048
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1048
  custom_tags:
    - installer
    - process_creation
    - sysmon
    - exfiltration
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Tt][Aa][Pp][Ii][Nn][Ss][Tt][Aa][Ll][Ll]\.[Ee][Xx][Ee]/ AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Aa][Vv][Aa][Ss][Tt] [Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Ss][Ee][Cc][Uu][Rr][Ee][Ll][Ii][Nn][Ee] [Vv][Pp][Nn]\\.*/ OR data_win_eventdata_image:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Aa][Vv][Aa][Ss][Tt] [Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Ss][Ee][Cc][Uu][Rr][Ee][Ll][Ii][Nn][Ee] [Vv][Pp][Nn]\\.*/ OR data_win_eventdata_image:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Oo][Pp][Ee][Nn][Vv][Pp][Nn] [Cc][Oo][Nn][Nn][Ee][Cc][Tt]\\[Dd][Rr][Ii][Vv][Ee][Rr][Ss]\\[Tt][Aa][Pp]\\.*/ OR data_win_eventdata_image:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Pp][Rr][Oo][Tt][Oo][Nn] [Tt][Ee][Cc][Hh][Nn][Oo][Ll][Oo][Gg][Ii][Ee][Ss]\\[Pp][Rr][Oo][Tt][Oo][Nn][Vv][Pp][Nn][Tt][Aa][Pp]\\[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Ee][Rr]\\.*/)

