name: Potentially Suspicious CMD Shell Output Redirect
id: 8e0bb260-d4b2-4fff-bb8d-3f82118e6892
version: 1
schema_version: "1.0"
date: "2024-03-19"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 8e0bb260-d4b2-4fff-bb8d-3f82118e6892
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects inline Windows shell commands redirecting output via the ">" symbol to
  a suspicious location. This technique is sometimes used by malicious actors in
  order to redirect the output of reconnaissance commands such as "hostname" and
  "dir" to files for future exfiltration. MITRE ATT&CK: T1218.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\cmd.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "Cmd.Exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*>?%APPDATA%\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*>?%TEMP%\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*>?%TMP%\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*>?%USERPROFILE%\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*>?C:\\\\ProgramData\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*>?C:\\\\Temp\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*>?C:\\\\Users\\\\Public\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*>?C:\\\\Windows\\\\Temp\\\\*"
                    case_insensitive: true
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_commandLine: "* >*"
                          - wildcard:
                              data_win_eventdata_commandLine: "*\">*"
                          - wildcard:
                              data_win_eventdata_commandLine: "*'>*"
                        minimum_should_match: 1
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*C:\\\\Users\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*\\\\AppData\\\\Local\\\\*"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches '*\cmd.exe';
  data_win_eventdata_originalFileName equals 'Cmd.Exe';
  data_win_eventdata_commandLine matches '*>?%APPDATA%\*', among other
  conditions.

known_false_positives: >
  Legitimate admin or third party scripts used for diagnostic collection might
  generate some false positives. Baseline expected activity in your environment
  and tune this detection before relying on it for automated response.

references:
  - https://thedfirreport.com/2022/07/11/select-xmrig-from-sqlserver/
  - https://attack.mitre.org/techniques/T1218/

response:
  message: >
    Potentially Suspicious CMD Shell Output Redirect detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1218
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218
  custom_tags:
    - shell
    - output
    - redirect
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Cc][Mm][Dd]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*\>.%[Aa][Pp][Pp][Dd][Aa][Tt][Aa]%\\.*/ OR data_win_eventdata_commandLine:/.*\>.%[Tt][Ee][Mm][Pp]%\\.*/ OR data_win_eventdata_commandLine:/.*\>.%[Tt][Mm][Pp]%\\.*/ OR data_win_eventdata_commandLine:/.*\>.%[Uu][Ss][Ee][Rr][Pp][Rr][Oo][Ff][Ii][Ll][Ee]%\\.*/ OR data_win_eventdata_commandLine:/.*\>.[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_commandLine:/.*\>.[Cc]:\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_commandLine:/.*\>.[Cc]:\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_commandLine:/.*\>.[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/ OR ((data_win_eventdata_commandLine:/.* \>.*/ OR data_win_eventdata_commandLine:/.*\"\>.*/ OR data_win_eventdata_commandLine:/.*'\>.*/) AND data_win_eventdata_commandLine:/.*[Cc]:\\[Uu][Ss][Ee][Rr][Ss]\\.*/ AND data_win_eventdata_commandLine:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\.*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 698d4431-514f-4c82-af4d-cf573872a9f5
    name: Potential Pikabot Discovery Activity
    reason: Pikabot runs discovery commands via cmd and redirects output to temp files, the behaviour seen here.
  - id: e5144106-8198-4f6e-bfc2-0a551cc8dd94
    name: Potential Pikabot Infection - Suspicious Command Combinations Via Cmd.EXE
    reason: Chained cmd discovery commands with redirected output commonly co-occur in this loader's recon.
  - id: 087790e3-3287-436c-bccf-cbd0184a7db1
    name: Potential CommandLine Path Traversal Via Cmd.EXE
    reason: Cmd obfuscation often used by the same operators to evade command-line matching.
  - id: 3dfd06d2-eaf4-4532-9555-68aca59f57c4
    name: Process Execution From A Potentially Suspicious Folder
    reason: Redirect targets are writable folders where tools are then staged and executed.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Discovery commands on host
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Ww][Hh][Oo][Aa][Mm][Ii]|[Ii][Pp][Cc][Oo][Nn][Ff][Ii][Gg]|[Ss][Yy][Ss][Tt][Ee][Mm][Ii][Nn][Ff][Oo]|[Nn][Ll][Tt][Ee][Ss][Tt]|[Nn][Ee][Tt]|[Nn][Ee][Tt]1|[Tt][Aa][Ss][Kk][Ll][Ii][Ss][Tt]|[Nn][Ee][Tt][Ss][Tt][Aa][Tt]|[Qq][Uu][Ss][Ee][Rr]|[Aa][Rr][Pp]|[Nn][Ss][Ll][Oo][Oo][Kk][Uu][Pp]|[Hh][Oo][Ss][Tt][Nn][Aa][Mm][Ee])\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Text/log files created in staging folders
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(\\[Tt]emp\\|\\ProgramData\\|\\Users\\Public\\|\\AppData\\).*\.(txt|log|tmp|dat)/
    pivot_on: host
    window: 2h
  - name: Collection or exfil tooling
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Cc][Uu][Rr][Ll]|[Rr][Cc][Ll][Oo][Nn][Ee]|[Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]-[Aa][Rr][Cc][Hh][Ii][Vv][Ee]|7[Zz]|[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]).*/
    pivot_on: host
    window: 4h
  - name: Script hosts with encoded or hidden commands
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Mm][Ss][Hh][Tt][Aa])\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*(-[Ee][Nn][Cc]|[Hh][Ii][Dd][Dd][Ee][Nn]|.[Jj][Ss]|.[Vv][Bb][Ss]).*/
    pivot_on: host
    window: 2h
