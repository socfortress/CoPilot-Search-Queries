name: Detect Path Interception By Creation Of program exe
id: cbef820c-e1ff-407f-887f-0a9240a2d477
version: 1
schema_version: "1.0"
date: "2026-04-21"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Identifies the creation of a program executable in an unquoted service path,
  a common technique for privilege escalation. It leverages data from Endpoint
  Detection and Response (EDR) agents, focusing on process creation events where
  an executable with a common name is created in a service directory path.
  This activity is significant because unquoted service paths can be exploited
  by attackers to execute arbitrary code with elevated privileges. If confirmed
  malicious, this could allow an attacker to gain higher-level access,
  potentially leading to full system compromise and persistent control over the
  affected endpoint.

data_source:
  - Sysmon EventID 1
  - Windows Event Log Security 4688

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image: "*Program Files*program.exe"
              - wildcard:
                  data_win_eventdata_image: "*Program Files*program.bat"
              - wildcard:
                  data_win_eventdata_image: "*Program Files*program.com"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-21 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-21 23:59:59.999"

how_to_implement: >
  Requires Wazuh agents with Sysmon installed and configured to log process
  creation events (EventID 1). The data_win_eventdata_image field must be
  populated with full file paths in Elasticsearch/Wazuh Indexer. This detection
  monitors for suspicious executables created in Program Files directories with
  common generic names like program.exe, program.bat, or program.com.

known_false_positives: >
  No false positives have been identified at this time. Legitimate applications
  should not create generic named executables in Program Files directories.

references:
  - https://medium.com/@SumitVerma101/windows-privilege-escalation-part-1-unquoted-service-path-c7a011a8d8ae
  - https://attack.mitre.org/techniques/T1574/009/

response:
  message: >
    Suspicious program executable detected in Program Files directory on
    $agent_name$ by user $data_win_eventdata_user$. Image:
    $data_win_eventdata_image$. Parent: $data_win_eventdata_parentImage$.
    Command: $data_win_eventdata_commandLine$. This indicates potential
    unquoted service path exploitation for privilege escalation.
    MITRE ATT&CK: T1574.009
  risk_score: 70
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 70
    - field: data_win_eventdata_user
      type: user
      score: 70
  threat_objects:
    - field: data_win_eventdata_image
      type: process_name
    - field: data_win_eventdata_parentImage
      type: parent_process

tags:
  analytic_story:
    - Windows Persistence Techniques
    - Privilege Escalation
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.009
  custom_tags:
    - unquoted_service_path
    - privilege_escalation
    - program_files
    - path_interception
    - generic_executable
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*Program Files.*program\.exe.*/ OR data_win_eventdata_image:/.*Program Files.*program\.bat.*/ OR data_win_eventdata_image:/.*Program Files.*program\.com.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 68bcd73b-37ef-49cb-95fc-edc809730be6
    name: Potential Unquoted Service Path Reconnaissance Via Wmic.EXE
    reason: Attackers enumerate unquoted service paths before planting program.exe, a direct precursor.
  - id: d937b75f-a665-4480-88a5-2f20e9f9b22a
    name: Possible Privilege Escalation via Weak Service Permissions
    reason: Sibling service-based privilege escalation often tried when unquoted paths are hunted.
  - id: 0f9c21f1-6a73-4b0e-9809-cb562cb8d981
    name: Potential Privilege Escalation via Service Permissions Weakness
    reason: Same privesc family; shared service-abuse follow-up or alternative.
  - id: 76f55eaa-d27f-4213-9d45-7b0e4b60bbae
    name: Service Reconnaissance Via Wmic.EXE
    reason: Service discovery precedes selecting a hijackable service.
  - id: 38879043-7e1e-47a9-8d46-6bec88e201df
    name: Potential Persistence Attempt Via Existing Service Tampering
    reason: After SYSTEM execution attackers tamper with services for persistence.
  - id: 8470d755-0c13-45b3-bd63-387a373c10cf
    name: Reg exe Manipulating Windows Services Registry Keys
    reason: Service registry edits are an alternative route to the same escalation.
  - id: 7c0dcd3d-acf8-4f71-9570-f448b0034f94
    name: PsExec Service Child Process Execution as LOCAL SYSTEM
    reason: Other path to SYSTEM-level child processes that follows successful escalation.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Service path reconnaissance
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*wmic.*service.*pathname.*/ OR /.*sc.*(qc|query).*/ OR /.*[Gg]et-[Ww]mi[Oo]bject.*[Ss]ervice.*/)
    pivot_on: host
    window: 6h
  - name: Executables dropped in Program Files root
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*[Pp]rogram.*[Ff]iles.*\\[A-Za-z0-9_]+\.(exe|bat|com)/
    pivot_on: host
    window: 6h
  - name: Service starts or stops
    query: data_win_system_eventID:1 AND data_win_eventdata_image:(/.*sc\.exe/ OR /.*net1?\.exe/) AND data_win_eventdata_commandLine:/.*(start|stop).*/
    pivot_on: host
    window: 2h
  - name: SYSTEM-context shells after planted binary
    query: data_win_system_eventID:1 AND data_win_eventdata_user:/.*SYSTEM/ AND data_win_eventdata_image:(/.*cmd\.exe/ OR /.*[Pp]ower[Ss]hell.*/)
    pivot_on: host
    window: 2h
  - name: Local account or group changes
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*net.*user.*\/add.*/ OR /.*net.*localgroup.*administrators.*/)
    pivot_on: host
    window: 4h
