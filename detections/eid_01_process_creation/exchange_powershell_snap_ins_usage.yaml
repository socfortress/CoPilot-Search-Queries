name: Exchange PowerShell Snap-Ins Usage
id: 25676e10-2121-446e-80a4-71ff8506af47
version: 1
schema_version: "1.0"
date: "2023-03-24"
author: FPT.EagleEye, Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 25676e10-2121-446e-80a4-71ff8506af47
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects adding and using Exchange PowerShell snap-ins to export mailbox data.
  As seen used by HAFNIUM and APT27. MITRE ATT&CK: T1059.001, T1114.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\powershell.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\pwsh.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "PowerShell.EXE"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "pwsh.dll"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*Add-PSSnapin*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Microsoft.Exchange.Powershell.Snapin*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Microsoft.Exchange.Management.PowerShell.SnapIn*"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_parentImage"
        - exists:
            field: "data_win_eventdata_commandLine"
        - bool:
            must_not:
              - bool:
                  must:
                    - term:
                        data_win_eventdata_parentImage:
                          value: "C:\\Windows\\System32\\msiexec.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*$exserver=Get-ExchangeServer ([Environment]::MachineName) -ErrorVariable exerr 2> $null*"
                          case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\powershell.exe'; data_win_eventdata_image matches '*\pwsh.exe';
  data_win_eventdata_originalFileName equals 'PowerShell.EXE', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.volexity.com/blog/2021/03/02/active-exploitation-of-microsoft-exchange-zero-day-vulnerabilities/
  - https://www.microsoft.com/security/blog/2021/03/02/hafnium-targeting-exchange-servers/
  - https://www.intrinsec.com/apt27-analysis/
  - https://attack.mitre.org/techniques/T1059/001/
  - https://attack.mitre.org/techniques/T1114/

response:
  message: >
    Exchange PowerShell Snap-Ins Usage detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1059.001, T1114
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
    - T1114
  custom_tags:
    - exchange
    - powershell
    - process_creation
    - sysmon
    - execution
    - collection
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Pp][Ww][Ss][Hh]\.[Dd][Ll][Ll]/) AND data_win_eventdata_commandLine:/.*[Aa][Dd][Dd]-[Pp][Ss][Ss][Nn][Aa][Pp][Ii][Nn].*/ AND (data_win_eventdata_commandLine:/.*[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\.[Ee][Xx][Cc][Hh][Aa][Nn][Gg][Ee]\.[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ss][Nn][Aa][Pp][Ii][Nn].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\.[Ee][Xx][Cc][Hh][Aa][Nn][Gg][Ee]\.[Mm][Aa][Nn][Aa][Gg][Ee][Mm][Ee][Nn][Tt]\.[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ss][Nn][Aa][Pp][Ii][Nn].*/) AND _exists_:data_win_eventdata_parentImage AND _exists_:data_win_eventdata_commandLine AND NOT (data_win_eventdata_parentImage:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Mm][Ss][Ii][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*\$[Ee][Xx][Ss][Ee][Rr][Vv][Ee][Rr]=[Gg][Ee][Tt]-[Ee][Xx][Cc][Hh][Aa][Nn][Gg][Ee][Ss][Ee][Rr][Vv][Ee][Rr] \(\[[Ee][Nn][Vv][Ii][Rr][Oo][Nn][Mm][Ee][Nn][Tt]\]::[Mm][Aa][Cc][Hh][Ii][Nn][Ee][Nn][Aa][Mm][Ee]\) -[Ee][Rr][Rr][Oo][Rr][Vv][Aa][Rr][Ii][Aa][Bb][Ll][Ee] [Ee][Xx][Ee][Rr][Rr] 2\> \$[Nn][Uu][Ll][Ll].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 889719ef-dd62-43df-86c3-768fb08dc7c0
    name: Suspicious PowerShell Mailbox Export to Share
    reason: The snap-in is loaded to run New-MailboxExportRequest; this is the exfil step that follows when mailbox data is staged to a share.
  - id: bbb2dedd-a0e3-46ab-ba6c-6c82ae7a9aa7
    name: HAFNIUM Exchange Exploitation Activity
    reason: 'Same HAFNIUM tradecraft: Exchange exploitation on the server precedes snap-in mailbox export.'
  - id: b06335b3-55ac-4b41-937e-16b7f5d57dfd
    name: CVE-2021-26858 Exchange Exploitation
    reason: ProxyLogon file-write exploit is a typical precursor giving code execution on the Exchange host.
  - id: 8202070f-edeb-4d31-a010-a26c72ac5600
    name: Suspicious Process By Web Server Process
    reason: A webshell under w3wp/IIS spawning shells is the usual way PowerShell gets launched on Exchange.
  - id: bd1212e5-78da-431e-95fa-c58e3237a8e6
    name: Suspicious ASPX File Drop by Exchange
    reason: Webshell dropped by Exchange processes is the persistence behind the PowerShell session.
  - id: 83809e84-4475-4b69-bc3e-4aad8568612f
    name: MSExchange Transport Agent Installation
    reason: Also uses Exchange cmdlets; attackers with an Exchange admin shell install transport-agent backdoors next.
  - id: fa3c117a-bc0d-416e-a31b-0c0e80653efb
    name: Chopper Webshell Process Pattern
    reason: China Chopper was the webshell HAFNIUM/APT27 used to run the snap-in commands.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Mailbox export/search cmdlets
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*([Nn]ew-[Mm]ailbox[Ee]xport[Rr]equest|[Ss]earch-[Mm]ailbox|[Gg]et-[Mm]ailbox[Ee]xport).*/
    pivot_on: host
    window: 4h
  - name: Exchange shell spawned by IIS worker
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Ww]3wp\.exe/ AND data_win_eventdata_image:/.*(cmd|powershell|pwsh)\.exe/
    pivot_on: host
    window: 4h
  - name: PST/archive staging file creation
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\.(pst|zip|rar|7z)/
    pivot_on: host
    window: 6h
  - name: Exchange webshell file drops
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*([Ii]netpub|[Ee]xchange[Ss]erver|[Ff]ront[Ee]nd).*\.(aspx|ashx)/
    pivot_on: host
    window: 6h
  - name: Credential dump tooling on Exchange host
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*([Cc]omsvcs.*[Mm]ini[Dd]ump|[Pp]rocdump.*lsass|[Nn]tds[Uu]til).*/
    pivot_on: host
    window: 6h
