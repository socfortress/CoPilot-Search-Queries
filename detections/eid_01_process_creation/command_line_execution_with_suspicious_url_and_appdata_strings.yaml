name: Command Line Execution with Suspicious URL and AppData Strings
id: 1ac8666b-046f-4201-8aba-1951aaec03a3
version: 1
schema_version: "1.0"
date: "2021-11-27"
author: Florian Roth (Nextron Systems), Jonhnathan Ribeiro, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 1ac8666b-046f-4201-8aba-1951aaec03a3
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a suspicious command line execution that includes an URL and AppData
  string in the command line parameters as used by several droppers (js/vbs >
  powershell). MITRE ATT&CK: T1059.003, T1059.001, T1105.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\cmd.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*http*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine: "*://*"
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*%AppData%*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches '*\cmd.exe';
  data_win_eventdata_commandLine matches '*http*';
  data_win_eventdata_commandLine matches '*://*', among other conditions.

known_false_positives: >
  High. Baseline expected activity in your environment and tune this detection
  before relying on it for automated response.

references:
  - https://www.hybrid-analysis.com/sample/3a1f01206684410dbe8f1900bbeaaa543adfcd07368ba646b499fa5274b9edf6?environmentId=100
  - https://www.hybrid-analysis.com/sample/f16c729aad5c74f19784a24257236a8bbe27f7cdc4a89806031ec7f1bebbd475?environmentId=100
  - https://attack.mitre.org/techniques/T1059/003/
  - https://attack.mitre.org/techniques/T1059/001/
  - https://attack.mitre.org/techniques/T1105/

response:
  message: >
    Command Line Execution with Suspicious URL and AppData Strings detected on
    host $agent_name$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. Matched data_win_eventdata_commandLine:
    $data_win_eventdata_commandLine$. MITRE ATT&CK: T1059.003, T1059.001, T1105
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.003
    - T1059.001
    - T1105
  custom_tags:
    - appdata
    - strings
    - process_creation
    - sysmon
    - execution
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp].*/ AND data_win_eventdata_commandLine:/.*:\/\/.*/ AND data_win_eventdata_commandLine:/.*%[Aa][Pp][Pp][Dd][Aa][Tt][Aa]%.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: cea72823-df4d-4567-950c-0b579eaf0846
    name: Potential Dropper Script Execution Via WScript/CScript/MSHTA
    reason: Rule describes js/vbs droppers launching cmd/powershell; this is the script-host stage that precedes the cmd URL+AppData command.
  - id: b6676963-0353-4f88-90f5-36c20d443c6a
    name: Cscript/Wscript Potentially Suspicious Child Process
    reason: Wscript/cscript spawning cmd is the parent link of this dropper chain.
  - id: a6a39bdb-935c-4f0a-ab77-35f4bbf44d33
    name: Potentially Suspicious Powershell Script Execution From Temp Folder
    reason: Downloaded payload is commonly staged in user-writable folders and executed via powershell next.
  - id: 02b64f1b-3f33-4e67-aede-ef3b0a5a8fcf
    name: Potential COM Objects Download Cradles Usage - Process Creation
    reason: Alternative download cradle used by the same dropper family.
  - id: d059842b-6b9d-4ed1-b5c3-5b89143c6ede
    name: File Download Via Bitsadmin
    reason: Common fallback download method co-occurring in staged dropper chains.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Script hosts and Office spawning cmd/powershell (dropper parent)
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*([Ww]script|[Cc]script|[Mm]shta|[Ww]inword|[Ee]xcel|[Oo]utlook)\.exe/ AND data_win_eventdata_image:/.*(cmd|powershell|pwsh)\.exe/
    pivot_on: host
    window: 2h
  - name: PowerShell download cradles
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*powershell.*/ AND data_win_eventdata_commandLine:/.*([Dd]ownload[Ss]tring|[Dd]ownload[Ff]ile|[Ii]nvoke-[Ww]eb[Rr]equest|[Ii]wr|[Ii]ex|[Ss]tart-[Bb]its[Tt]ransfer|[Nn]et\.[Ww]eb[Cc]lient).*/
    pivot_on: host
    window: 2h
  - name: Executable/script files created in AppData or Temp
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*([Aa]pp[Dd]ata|[Tt]emp).*\.(exe|dll|ps1|js|vbs|bat|scr)/
    pivot_on: host
    window: 2h
  - name: Outbound connections from cmd/powershell/script hosts
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*(cmd|powershell|wscript|cscript|mshta)\.exe/ AND data_win_eventdata_initiated:true
    pivot_on: host
    window: 2h
  - name: Run-key / scheduled task persistence
    query: (data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*[Cc]urrent[Vv]ersion.[Rr]un.*/) OR (data_win_system_eventID:1 AND data_win_eventdata_image:/.*schtasks\.exe/ AND data_win_eventdata_commandLine:/.*.[Cc]reate.*/)
    pivot_on: host
    window: 4h
