name: Suspicious Process Start Locations
id: 15b75071-74cc-47e0-b4c6-b43744a62a2b
version: 1
schema_version: "1.0"
date: "2022-01-07"
author: juju4, Jonhnathan Ribeiro, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 15b75071-74cc-47e0-b4c6-b43744a62a2b
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious process run from unusual locations. MITRE ATT&CK: T1036.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*:\\\\RECYCLER\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*:\\\\SystemVolumeInformation\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "C:\\\\Windows\\\\Tasks\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "C:\\\\Windows\\\\debug\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "C:\\\\Windows\\\\fonts\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "C:\\\\Windows\\\\help\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "C:\\\\Windows\\\\drivers\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "C:\\\\Windows\\\\addins\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "C:\\\\Windows\\\\cursors\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "C:\\\\Windows\\\\system32\\\\tasks\\\\*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*:\RECYCLER\*'; data_win_eventdata_image matches
  '*:\SystemVolumeInformation\*'; data_win_eventdata_image matches
  'C:\Windows\Tasks\*', among other conditions.

known_false_positives: >
  False positives depend on scripts and administrative tools used in the
  monitored environment. Baseline expected activity in your environment and tune
  this detection before relying on it for automated response.

references:
  - https://car.mitre.org/wiki/CAR-2013-05-002
  - https://attack.mitre.org/techniques/T1036/

response:
  message: >
    Suspicious Process Start Locations detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1036
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1036
  custom_tags:
    - start
    - locations
    - process_creation
    - sysmon
    - stealth
    - car_2013_05_002
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*:\\[Rr][Ee][Cc][Yy][Cc][Ll][Ee][Rr]\\.*/ OR data_win_eventdata_image:/.*:\\[Ss][Yy][Ss][Tt][Ee][Mm][Vv][Oo][Ll][Uu][Mm][Ee][Ii][Nn][Ff][Oo][Rr][Mm][Aa][Tt][Ii][Oo][Nn]\\.*/ OR data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Aa][Ss][Kk][Ss]\\.*/ OR data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Dd][Ee][Bb][Uu][Gg]\\.*/ OR data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ff][Oo][Nn][Tt][Ss]\\.*/ OR data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Hh][Ee][Ll][Pp]\\.*/ OR data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Dd][Rr][Ii][Vv][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Aa][Dd][Dd][Ii][Nn][Ss]\\.*/ OR data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Cc][Uu][Rr][Ss][Oo][Rr][Ss]\\.*/ OR data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Tt][Aa][Ss][Kk][Ss]\\.*/)

correlation:
  # Authored by the correlation engine for review.
  enrichment_searches:
  # NEW ad-hoc searches the engine runs around an alert from this rule, scoped to
  # the alert's host/user/IP within the window (not existing CoPilot Searches).
    - name: "Sysmon activity on this host in the window"
      query: 'data_win_system_channel:"Microsoft-Windows-Sysmon/Operational"'
      pivot_on: [host]
      window: 1h
    - name: "Process creation on this host"
      query: 'data_win_system_eventID:"1"'
      pivot_on: [host]
      window: 1h
    - name: "Network connections from this host"
      query: 'data_win_system_eventID:"3"'
      pivot_on: [host]
      window: 1h
    - name: "High-severity alerts on this host"
      query: 'rule_level:>=10'
      pivot_on: [host]
      window: 1h
