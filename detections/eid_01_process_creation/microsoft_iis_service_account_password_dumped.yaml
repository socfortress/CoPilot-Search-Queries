name: Microsoft IIS Service Account Password Dumped
id: 2d3cdeec-c0db-45b4-aa86-082f7eb75701
version: 1
schema_version: "1.0"
date: "2023-01-22"
author: Tim Rauch, Janantha Marasinghe, Elastic (original idea)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 2d3cdeec-c0db-45b4-aa86-082f7eb75701
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the Internet Information Services (IIS) command-line tool, AppCmd,
  being used to list passwords. MITRE ATT&CK: T1003.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\appcmd.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "appcmd.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*list *"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /config*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /xml*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -config*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -xml*"
                    case_insensitive: true
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* /@t*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* /text*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* /show*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* -@t*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* -text*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* -show*"
                                case_insensitive: true
                        minimum_should_match: 1
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_commandLine: "*:\\**"
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*password*"
                                case_insensitive: true
                        minimum_should_match: 1
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\appcmd.exe'; data_win_eventdata_originalFileName equals 'appcmd.exe';
  data_win_eventdata_commandLine matches '*list *', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.elastic.co/guide/en/security/current/microsoft-iis-service-account-password-dumped.html
  - https://twitter.com/0gtweet/status/1588815661085917186?cxt=HHwWhIDUyaDbzYwsAAAA
  - https://www.netspi.com/blog/technical/network-penetration-testing/decrypting-iis-passwords-to-break-out-of-the-dmz-part-2/
  - https://attack.mitre.org/techniques/T1003/

response:
  message: >
    Microsoft IIS Service Account Password Dumped detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003
  custom_tags:
    - microsoft
    - service
    - account
    - process_creation
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Aa][Pp][Pp][Cc][Mm][Dd]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Ll][Ii][Ss][Tt] .*/ AND (data_win_eventdata_commandLine:/.* \/[Cc][Oo][Nn][Ff][Ii][Gg].*/ OR data_win_eventdata_commandLine:/.* \/[Xx][Mm][Ll].*/ OR data_win_eventdata_commandLine:/.* -[Cc][Oo][Nn][Ff][Ii][Gg].*/ OR data_win_eventdata_commandLine:/.* -[Xx][Mm][Ll].*/ OR ((data_win_eventdata_commandLine:/.* \/\@[Tt].*/ OR data_win_eventdata_commandLine:/.* \/[Tt][Ee][Xx][Tt].*/ OR data_win_eventdata_commandLine:/.* \/[Ss][Hh][Oo][Ww].*/ OR data_win_eventdata_commandLine:/.* -\@[Tt].*/ OR data_win_eventdata_commandLine:/.* -[Tt][Ee][Xx][Tt].*/ OR data_win_eventdata_commandLine:/.* -[Ss][Hh][Oo][Ww].*/) AND (data_win_eventdata_commandLine:/.*:\*.*/ OR data_win_eventdata_commandLine:/.*[Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd].*/)))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 97dbf6e2-e436-44d8-abee-4261b24d3e41
    name: Microsoft IIS Connection Strings Decryption
    reason: Companion IIS secret theft via aspnet_regiis; both harvest app-pool and database credentials from the same server.
  - id: 8202070f-edeb-4d31-a010-a26c72ac5600
    name: Suspicious Process By Web Server Process
    reason: AppCmd is run from an attacker shell on the web server, typically spawned by w3wp via a webshell.
  - id: fa3c117a-bc0d-416e-a31b-0c0e80653efb
    name: Chopper Webshell Process Pattern
    reason: Webshell command execution is the usual route to running appcmd.
  - id: 7c8af9b2-dcae-41a2-a9db-b28c288b5f08
    name: Suspicious IIS URL GlobalRules Rewrite Via AppCmd
    reason: Same binary abused for IIS manipulation by an intruder on the host.
  - id: 043c4b8b-3a54-4780-9682-081cb6b8185c
    name: Suspicious IIS Module Registration
    reason: IIS backdoor module installation follows credential harvesting on compromised servers.
  - id: e4ed6030-ffe5-4e6a-8a8a-ab3c1ab9d94e
    name: Disable Windows IIS HTTP Logging
    reason: Log tampering to hide the intrusion on the same IIS server.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Shells spawned by IIS worker process
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Ww]3wp\.exe/ AND (data_win_eventdata_image:/.*cmd\.exe/ OR data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/)
    pivot_on: host
    window: 6h
  - name: Other AppCmd and IIS admin tooling use
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*[Aa]pp[Cc]md\.exe/ OR data_win_eventdata_image:/.*aspnet_regiis\.exe/ OR data_win_eventdata_image:/.*[Ii]isreset\.exe/)
    pivot_on: host
    window: 6h
  - name: Account and privilege recon after credential recovery
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*whoami\.exe/ OR data_win_eventdata_commandLine:/.*[Nn]et1?\s+(user|group|localgroup).*/ OR data_win_eventdata_commandLine:/.*[Nn]ltest.*/)
    pivot_on: host
    window: 6h
  - name: Remote logons using recovered service account
    query: data_win_system_eventID:4624 AND (data_win_eventdata_logonType:3 OR data_win_eventdata_logonType:10)
    pivot_on: user
    window: 24h
  - name: Webroot script drops
    query: data_win_system_eventID:11 AND (data_win_eventdata_targetFilename:/.*[Ii]netpub.*\.([Aa][Ss][Pp][Xx]?|[Aa][Ss][Hh][Xx]|[Pp][Hh][Pp])/)
    pivot_on: host
    window: 24h
