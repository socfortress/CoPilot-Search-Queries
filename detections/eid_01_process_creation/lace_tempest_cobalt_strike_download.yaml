name: Lace Tempest Cobalt Strike Download
id: aa5b0a40-ed88-46aa-9fdc-0337b379ca9d
version: 1
schema_version: "1.0"
date: "2023-11-09"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: aa5b0a40-ed88-46aa-9fdc-0337b379ca9d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects specific command line execution used by Lace Tempest to download
  Cobalt Strike as reported by SysAid Team.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*-nop -w hidden -c IEX ((new-object net.webclient).downloadstring(*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*/a')*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches '*-nop
  -w hidden -c IEX ((new-object net.webclient).downloadstring(*';
  data_win_eventdata_commandLine matches '*/a')*'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.sysaid.com/blog/service-desk/on-premise-software-security-vulnerability-notification

response:
  message: >
    Lace Tempest Cobalt Strike Download detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - tempest
    - cobalt
    - strike
    - process_creation
    - sysmon
    - execution
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*-[Nn][Oo][Pp] -[Ww] [Hh][Ii][Dd][Dd][Ee][Nn] -[Cc] [Ii][Ee][Xx] \(\([Nn][Ee][Ww]-[Oo][Bb][Jj][Ee][Cc][Tt] [Nn][Ee][Tt]\.[Ww][Ee][Bb][Cc][Ll][Ii][Ee][Nn][Tt]\)\.[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg]\(.*/ AND data_win_eventdata_commandLine:/.*\/[Aa]'\).*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 745ea50b-9673-4ba7-9426-cb45cf4a8e6d
    name: Lace Tempest Malware Loader Execution
    reason: 'Same SysAid campaign: user.exe loader preceded or followed this PowerShell Cobalt Strike stager'
  - id: ee18ed37-0802-4268-9435-b3b91aaa18db
    name: PowerShell - Connect To Internet With Hidden Window
    reason: Same hidden-window PowerShell download behaviour
  - id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
    name: PowerShell Download and Execution Cradles
    reason: Generic IEX/DownloadString cradle matching the stager
  - id: ae9c6a7c-9521-42a6-915e-5aaa8689d529
    name: CobaltStrike Load by Rundll32
    reason: 'Next step: Cobalt Strike beacon loaded via rundll32'
  - id: f35c5d71-b489-4e22-a115-f003df287317
    name: Potential CobaltStrike Process Patterns
    reason: Post-stager Cobalt Strike process behaviour
  - id: 15619216-e993-4721-b590-4c520615a67d
    name: Potential Meterpreter/CobaltStrike Activity
    reason: Beacon post-exploitation parent/child process patterns
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: PowerShell spawned by java/tomcat/cmd
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\([Jj][Aa][Vv][Aa][Ww]?|[Tt][Oo][Mm][Cc][Aa][Tt].*|[Cc][Mm][Dd])\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 6h
  - name: PowerShell network connections after stager
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Cobalt Strike style rundll32 and named pipes
    query: (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Rr][Uu][Nn][Dd][Ll][Ll]32.*/) OR (data_win_system_eventID:("17" OR "18") AND data_win_eventdata_pipeName:/.*([Mm][Ss][Ss][Ee]|[Pp][Oo][Ss][Tt][Ee][Xx]|[Ss][Tt][Aa][Tt][Uu][Ss]).*/)
    pivot_on: host
    window: 6h
  - name: Discovery and credential commands after beacon
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ww][Hh][Oo][Aa][Mm][Ii]|[Nn][Ee][Tt] [Gg][Rr][Oo][Uu][Pp]|[Nn][Ll][Tt][Ee][Ss][Tt]|[Ll][Ss][Aa][Ss][Ss]).*/
    pivot_on: host
    window: 6h
