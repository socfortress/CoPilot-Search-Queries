name: Use Short Name Path in Image
id: a96970af-f126-420d-90e1-d37bf25e50e1
version: 1
schema_version: "1.0"
date: "2025-10-20"
author: frack113, Nasreddine Bencherchali
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: a96970af-f126-420d-90e1-d37bf25e50e1
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detect use of the Windows 8.3 short name. Which could be used as a method to
  avoid Image detection. MITRE ATT&CK: T1564.004.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image: "*~1\\\\*"
              - wildcard:
                  data_win_eventdata_image: "*~2\\\\*"
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_parentImage"
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  should:
                    - term:
                        data_win_eventdata_parentImage:
                          value: "C:\\Windows\\System32\\Dism.exe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_parentImage:
                          value: "C:\\Windows\\System32\\cleanmgr.exe"
                          case_insensitive: true
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\AppData\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\Temp\\\\*"
                                case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*~1\\\\unzip.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*~1\\\\7zG.exe"
                          case_insensitive: true
                  minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_parentImage"
        - exists:
            field: "data_win_eventdata_product"
        - exists:
            field: "data_win_eventdata_description"
        - exists:
            field: "data_win_eventdata_company"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_parentImage:
                          value: "*\\\\WebEx\\\\WebexHost.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_parentImage:
                          value: "*\\\\thor\\\\thor64.exe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_product:
                          value: "InstallShield (R)"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_description:
                          value: "InstallShield (R) Setup Engine"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_company:
                          value: "InstallShield Software Corporation"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_product
    - data_win_eventdata_description
    - data_win_eventdata_company
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches '*~1\*';
  data_win_eventdata_image matches '*~2\*'; data_win_eventdata_parentImage
  equals 'C:\Windows\System32\Dism.exe', among other conditions.

known_false_positives: >
  Applications could use this notation occasionally which might generate some
  false positives. In that case Investigate the parent and child process.
  Baseline expected activity in your environment and tune this detection before
  relying on it for automated response.

references:
  - https://www.acunetix.com/blog/articles/windows-short-8-3-filenames-web-security-problem/
  - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-2000-server/cc959352(v=technet.10)
  - https://twitter.com/frack113/status/1555830623633375232
  - https://attack.mitre.org/techniques/T1564/004/

response:
  message: >
    Use Short Name Path in Image detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_parentImage: $data_win_eventdata_parentImage$. MITRE
    ATT&CK: T1564.004
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_parentImage
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1564.004
  custom_tags:
    - short
    - image
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\~1\\.*/ OR data_win_eventdata_image:/.*\~2\\.*/) AND _exists_:data_win_eventdata_parentImage AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_parentImage:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Dd][Ii][Ss][Mm]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Cc][Ll][Ee][Aa][Nn][Mm][Gg][Rr]\.[Ee][Xx][Ee]/ OR (data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ AND data_win_eventdata_image:/.*\\[Tt][Ee][Mm][Pp]\\.*/) OR data_win_eventdata_image:/.*\~1\\[Uu][Nn][Zz][Ii][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\~1\\7[Zz][Gg]\.[Ee][Xx][Ee]/) AND _exists_:data_win_eventdata_parentImage AND _exists_:data_win_eventdata_product AND _exists_:data_win_eventdata_description AND _exists_:data_win_eventdata_company AND NOT (data_win_eventdata_parentImage:/.*\\[Ww][Ee][Bb][Ee][Xx]\\[Ww][Ee][Bb][Ee][Xx][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Tt][Hh][Oo][Rr]\\[Tt][Hh][Oo][Rr]64\.[Ee][Xx][Ee]/ OR data_win_eventdata_product:/[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Ss][Hh][Ii][Ee][Ll][Dd] \([Rr]\)/ OR data_win_eventdata_description:/[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Ss][Hh][Ii][Ee][Ll][Dd] \([Rr]\) [Ss][Ee][Tt][Uu][Pp] [Ee][Nn][Gg][Ii][Nn][Ee]/ OR data_win_eventdata_company:/[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Ss][Hh][Ii][Ee][Ll][Dd] [Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee] [Cc][Oo][Rr][Pp][Oo][Rr][Aa][Tt][Ii][Oo][Nn]/)

correlation:
  # Authored by the correlation engine for review.
  enrichment_searches:
  # NEW ad-hoc searches the engine runs around an alert from this rule, scoped to
  # the alert's host/user/IP within the window (not existing CoPilot Searches).
    - name: "Sysmon activity on this host in the window"
      query: 'data_win_system_channel:"Microsoft-Windows-Sysmon/Operational"'
      pivot_on: [host]
      window: 1h
    - name: "Process creation on this host"
      query: 'data_win_system_eventID:"1"'
      pivot_on: [host]
      window: 1h
    - name: "Network connections from this host"
      query: 'data_win_system_eventID:"3"'
      pivot_on: [host]
      window: 1h
    - name: "High-severity alerts on this host"
      query: 'rule_level:>=10'
      pivot_on: [host]
      window: 1h
