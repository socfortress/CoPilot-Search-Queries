name: HackTool - PurpleSharp Execution
id: ff23ffbc-3378-435e-992f-0624dcf93ab4
version: 1
schema_version: "1.0"
date: "2023-02-05"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: ff23ffbc-3378-435e-992f-0624dcf93ab4
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of the PurpleSharp adversary simulation tool. MITRE
  ATT&CK: T1587.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\purplesharp*"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "PurpleSharp.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*xyz123456.exe*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*PurpleSharp*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\purplesharp*'; data_win_eventdata_originalFileName equals
  'PurpleSharp.exe'; data_win_eventdata_commandLine matches '*xyz123456.exe*',
  among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/mvelazc0/PurpleSharp
  - https://attack.mitre.org/techniques/T1587/

response:
  message: >
    HackTool - PurpleSharp Execution detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1587
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1587
  custom_tags:
    - hacktool
    - purplesharp
    - process_creation
    - sysmon
    - resource_development
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Pp][Uu][Rr][Pp][Ll][Ee][Ss][Hh][Aa][Rr][Pp].*/ OR data_win_eventdata_originalFileName:/[Pp][Uu][Rr][Pp][Ll][Ee][Ss][Hh][Aa][Rr][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Xx][Yy][Zz]123456\.[Ee][Xx][Ee].*/ OR data_win_eventdata_commandLine:/.*[Pp][Uu][Rr][Pp][Ll][Ee][Ss][Hh][Aa][Rr][Pp].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: f376c8a7-a2d0-4ddc-aa0c-16c17236d962
    name: HackTool - Bloodhound/Sharphound Execution
    reason: PurpleSharp simulates AD enumeration like SharpHound; both appear in the same test or intrusion.
  - id: 7ec2c172-dceb-4c10-92c9-87c1881b7e18
    name: HackTool - Rubeus Execution
    reason: PurpleSharp simulates Kerberos attacks (kerberoasting, AS-REP) that Rubeus also performs.
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: Simulated credential access techniques overlap with Mimikatz.
  - id: 055fb54c-a8f4-4aee-bd44-f74cf30a0d9d
    name: HackTool - SharpMove Tool Execution
    reason: Simulates lateral movement techniques.
  - id: 730fc21b-eaff-474b-ad23-90fd265d4988
    name: Psexec Execution
    reason: Remote execution simulation or real activity follows.
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: LSASS dump is a PurpleSharp credential access simulation.
  - id: 17a1be64-8d88-40bf-b5ff-a4f7a50ebcc8
    name: Suspicious New Service Creation
    reason: Persistence simulation creates services.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: LSASS access
    query: data_win_system_eventID:10 AND data_win_eventdata_targetImage:/.*lsass\.exe/
    pivot_on: host
    window: 6h
  - name: Persistence via scheduled tasks and services
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*schtasks.*\/[Cc]reate.*/ OR /.*sc(\.exe)?\s+create.*/)
    pivot_on: host
    window: 6h
  - name: AD discovery commands
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Nn]ltest.*/ OR /.*net1?\s+group.*/ OR /.*[Dd]squery.*/ OR /.*[Gg]et-[Aa][Dd].*/)
    pivot_on: host
    window: 6h
  - name: Registry Run key persistence
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*CurrentVersion.Run.*/
    pivot_on: host
    window: 6h
  - name: Outbound SMB, RPC or WinRM connections
    query: data_win_system_eventID:3 AND data_win_eventdata_destinationPort:(445 OR 135 OR 5985)
    pivot_on: host
    window: 2h
