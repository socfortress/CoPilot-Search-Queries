name: Windows ESX Admins Group Creation via Net
id: windows-esx-admins-group-creation-net-001
version: 1
schema_version: "1.0"
date: "2026-02-23"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects creation of "ESX Admins" group via net.exe or net1.exe, indicating 
  potential exploitation of CVE-2024-37085 (VMware ESXi AD Integration 
  Authentication Bypass). Ransomware operators exploit this to gain unauthorized 
  access to ESXi hosts for mass encryption.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - wildcard:
            data_win_eventdata_commandLine: "*ESX Admins*"
        - wildcard:
            data_win_eventdata_commandLine: "*/add*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-23 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-23 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Windows endpoints with Sysmon 
  installed and configured to log process creation events (EventID 1) with full 
  command-line arguments.

known_false_positives: >
  Legitimate administrators may create an ESX Admins group. Verify authorization 
  and context. Extremely suspicious on non-domain controller hosts.

references:
  - https://support.broadcom.com/web/ecx/support-content-notification/-/external/content/SecurityAdvisories/0/24505
  - https://www.microsoft.com/en-us/security/blog/2024/07/29/ransomware-operators-exploit-esxi-hypervisor-vulnerability-for-mass-encryption/

response:
  message: >
    ESX Admins group creation on $agent_name$. 
    Command: $data_win_eventdata_commandLine$. 
    Process: $data_win_eventdata_image$. 
    User: $data_win_eventdata_user$. 
    CVE-2024-37085 exploitation. MITRE ATT&CK: T1136.001
  risk_score: 72
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 72
  threat_objects: []

tags:
  analytic_story:
    - VMware ESXi AD Integration Authentication Bypass CVE-2024-37085
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1136.001
    - T1136.002
  cve:
    - CVE-2024-37085
  custom_tags:
    - esx_admins
    - vmware
    - esxi_bypass
    - ransomware
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*ESX Admins.*/ AND data_win_eventdata_commandLine:/.*\/add.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c408acfe-2870-41df-8d2f-9f4daa4555ed
    name: Potential Exploitation of CVE-2024-37085 - Suspicious Creation Of ESX Admins Group
    reason: Companion detection of the same CVE-2024-37085 ESX Admins creation.
  - id: d95de845-b83c-4a9a-8a6a-4fc802ebf6c0
    name: Suspicious Group And Account Reconnaissance Activity Using Net.EXE
    reason: Group and account recon via net.exe precedes targeted group creation.
  - id: cd219ff3-fa99-45d4-8380-a7d15116c6dc
    name: New User Created Via Net.EXE
    reason: Attacker typically also creates a domain user to place into ESX Admins.
  - id: 5b768e71-86f2-4879-b448-81061cbae951
    name: Suspicious Manipulation Of Default Accounts Via Net.EXE
    reason: Net.exe account manipulation in the same privilege-staging step.
  - id: d4498716-1d52-438f-8084-4a603157d131
    name: Password Provided In Command Line Of Net.EXE
    reason: Passwords in net.exe command lines accompany user creation.
  - id: 999e8307-a775-4d5f-addc-4855632335be
    name: Potential BlackByte Ransomware Activity
    reason: BlackByte exploited ESX Admins to mass-encrypt ESXi; the impact stage.
  - id: 639c9081-f482-47d3-a0bd-ddee3d4ecd76
    name: All Backups Deleted Via Wbadmin.EXE
    reason: Backup deletion is a standard pre-encryption follow-on.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Adding users to the ESX Admins group
    query: data_win_eventdata_image:/.*\\net1?\.exe/ AND data_win_eventdata_commandLine:/.*[Ee][Ss][Xx] [Aa]dmins.*/ AND (data_win_eventdata_commandLine:*add* OR data_win_eventdata_commandLine:*domain*)
    pivot_on: host
    window: 24h
  - name: AD group membership change events
    query: data_win_system_eventID:(4728 OR 4732 OR 4756 OR 4727 OR 4731) AND data_win_eventdata_targetUserName:/.*[Ee][Ss][Xx].*/
    pivot_on: host
    window: 24h
  - name: Domain account creation and privileged group changes
    query: data_win_eventdata_image:/.*\\net1?\.exe/ AND data_win_eventdata_commandLine:/.*(user|group|localgroup).*(add|domain).*/
    pivot_on: host
    window: 24h
  - name: Connections to ESXi management and SSH
    query: data_win_system_eventID:3 AND (data_win_eventdata_destinationPort:22 OR data_win_eventdata_destinationPort:443 OR data_win_eventdata_destinationPort:902)
    pivot_on: host
    window: 24h
  - name: Pre-encryption recovery inhibition
    query: data_win_eventdata_commandLine:/.*(vssadmin|wbadmin|bcdedit).*(delete|recoveryenabled|shadows).*/
    pivot_on: host
    window: 24h
