name: Diamond Sleet APT Process Activity Indicators
id: b5495d8d-24ad-4a44-8caf-ceae9a07a5c2
version: 1
schema_version: "1.0"
date: "2023-10-24"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: b5495d8d-24ad-4a44-8caf-ceae9a07a5c2
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects process creation activity indicators related to Diamond Sleet APT.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* uTYNkfKxHiZrx3KJ*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches '*
  uTYNkfKxHiZrx3KJ*'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.microsoft.com/en-us/security/blog/2023/10/18/multiple-north-korean-threat-actors-exploiting-the-teamcity-cve-2023-42793-vulnerability/

response:
  message: >
    Diamond Sleet APT Process Activity Indicators detected on host $agent_name$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - diamond
    - sleet
    - indicators
    - process_creation
    - sysmon
    - execution
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.* [Uu][Tt][Yy][Nn][Kk][Ff][Kk][Xx][Hh][Ii][Zz][Rr][Xx]3[Kk][Jj].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e1212b32-55ff-4dfb-a595-62b572248056
    name: Diamond Sleet APT File Creation Indicators
    reason: Same campaign drops clip.exe, wsmprovhost.exe, Version.dll and DSROLE.dll in ProgramData before execution.
  - id: d1b65d98-37d7-4ff6-b139-2d87c1af3042
    name: Diamond Sleet APT DLL Sideloading Indicators
    reason: The dropped executables sideload Version.dll/DSROLE.dll, following the process indicator.
  - id: 9f9f92ba-5300-43a4-b435-87d1ee571688
    name: Diamond Sleet APT Scheduled Task Creation - Registry
    reason: Diamond Sleet persists through scheduled tasks after the loader runs.
  - id: 3b8e5084-4de9-449a-a40d-0e11014f2e2d
    name: Diamond Sleet APT Scheduled Task Creation
    reason: Security-log view of the same task persistence step.
  - id: fba38e0f-4607-4344-bb8f-a4b50cdeef7f
    name: Diamond Sleet APT DNS Communication Indicators
    reason: Loader beacons to campaign C2 domains after launch.
  - id: 24c4d154-05a4-4b99-b57d-9b977472443a
    name: Lazarus Group Activity
    reason: Diamond Sleet is a Lazarus cluster; credential-dump and recon commands overlap.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Executables run from ProgramData
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*ProgramData.[^\\]+\.exe/
    pivot_on: host
    window: 24h
  - name: Known campaign file names created
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*ProgramData.(Forest64|DSROLE|wsmprovhost|clip|Version)\.(exe|dll)/
    pivot_on: host
    window: 24h
  - name: Scheduled task creation for persistence
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*schtasks\.exe/ AND data_win_eventdata_commandLine:/.*\/[Cc]reate.*/
    pivot_on: host
    window: 24h
  - name: Credential dumping and hive saves
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(reg(\.exe)? save hklm.*(sam|system|security)|comsvcs.*MiniDump|procdump.*lsass|ntdsutil).*/
    pivot_on: host
    window: 24h
  - name: Reconnaissance and lateral movement commands
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(netstat -aon|net (view|group|user).*\/domain|nltest|wmic.*\/node|PsExec).*/
    pivot_on: host
    window: 24h
