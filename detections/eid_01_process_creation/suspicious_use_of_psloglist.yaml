name: Suspicious Use of PsLogList
id: aae1243f-d8af-40d8-ab20-33fc6d0c55bc
version: 1
schema_version: "1.0"
date: "2026-06-29"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: aae1243f-d8af-40d8-ab20-33fc6d0c55bc
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects usage of the PsLogList utility to dump event log in order to extract
  admin accounts and perform account discovery or delete events logs. MITRE
  ATT&CK: T1087, T1087.001, T1087.002.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - term:
                  data_win_eventdata_originalFileName:
                    value: "psloglist.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\psloglist.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\psloglist64.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\psloglist64a.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* security*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* application*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* system*"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -d*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /d*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* –d*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* —d*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* ―d*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -x*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /x*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* –x*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* —x*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* ―x*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -s*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /s*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* –s*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* —s*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* ―s*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -c*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /c*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* –c*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* —c*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* ―c*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -g*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /g*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* –g*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* —g*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* ―g*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_originalFileName
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_originalFileName equals
  'psloglist.exe'; data_win_eventdata_image matches '*\psloglist.exe';
  data_win_eventdata_image matches '*\psloglist64.exe', among other conditions.

known_false_positives: >
  Another tool that uses the command line switches of PsLogList. Legitimate use
  of PsLogList by an administrator. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://research.nccgroup.com/2021/01/12/abusing-cloud-services-to-fly-under-the-radar/
  - https://www.cybereason.com/blog/deadringer-exposing-chinese-threat-actors-targeting-major-telcos
  - https://github.com/3CORESec/MAL-CL/tree/master/Descriptors/Sysinternals/PsLogList
  - https://twitter.com/EricaZelic/status/1614075109827874817
  - https://attack.mitre.org/techniques/T1087/
  - https://attack.mitre.org/techniques/T1087/001/
  - https://attack.mitre.org/techniques/T1087/002/

response:
  message: >
    Suspicious Use of PsLogList detected on host $agent_name$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1087, T1087.001, T1087.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_originalFileName
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1087
    - T1087.001
    - T1087.002
  custom_tags:
    - psloglist
    - process_creation
    - sysmon
    - discovery
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_originalFileName:/[Pp][Ss][Ll][Oo][Gg][Ll][Ii][Ss][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ss][Ll][Oo][Gg][Ll][Ii][Ss][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ss][Ll][Oo][Gg][Ll][Ii][Ss][Tt]64\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ss][Ll][Oo][Gg][Ll][Ii][Ss][Tt]64[Aa]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.* [Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy].*/ OR data_win_eventdata_commandLine:/.* [Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.* [Ss][Yy][Ss][Tt][Ee][Mm].*/) AND (data_win_eventdata_commandLine:/.* -[Dd].*/ OR data_win_eventdata_commandLine:/.* \/[Dd].*/ OR data_win_eventdata_commandLine:/.* –[Dd].*/ OR data_win_eventdata_commandLine:/.* —[Dd].*/ OR data_win_eventdata_commandLine:/.* ―[Dd].*/ OR data_win_eventdata_commandLine:/.* -[Xx].*/ OR data_win_eventdata_commandLine:/.* \/[Xx].*/ OR data_win_eventdata_commandLine:/.* –[Xx].*/ OR data_win_eventdata_commandLine:/.* —[Xx].*/ OR data_win_eventdata_commandLine:/.* ―[Xx].*/ OR data_win_eventdata_commandLine:/.* -[Ss].*/ OR data_win_eventdata_commandLine:/.* \/[Ss].*/ OR data_win_eventdata_commandLine:/.* –[Ss].*/ OR data_win_eventdata_commandLine:/.* —[Ss].*/ OR data_win_eventdata_commandLine:/.* ―[Ss].*/ OR data_win_eventdata_commandLine:/.* -[Cc].*/ OR data_win_eventdata_commandLine:/.* \/[Cc].*/ OR data_win_eventdata_commandLine:/.* –[Cc].*/ OR data_win_eventdata_commandLine:/.* —[Cc].*/ OR data_win_eventdata_commandLine:/.* ―[Cc].*/ OR data_win_eventdata_commandLine:/.* -[Gg].*/ OR data_win_eventdata_commandLine:/.* \/[Gg].*/ OR data_win_eventdata_commandLine:/.* –[Gg].*/ OR data_win_eventdata_commandLine:/.* —[Gg].*/ OR data_win_eventdata_commandLine:/.* ―[Gg].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: beaa66d6-aa1b-4e3c-80f5-e0145369bfaf
    name: Potentially Suspicious EventLog Recon Activity Using Log Query Utilities
    reason: Same goal, mining event logs for accounts, using wevtutil/Get-WinEvent; actors swap tools.
  - id: caf201a9-c2ce-4a26-9c3a-2b9525413711
    name: Potentially Suspicious Call To Win32_NTEventlogFile Class
    reason: WMI-based event log access, another route to the same log harvesting.
  - id: cc36992a-4671-4f21-a91d-6c2b72a2edf5
    name: Suspicious Eventlog Clearing or Configuration Change Activity
    reason: After reading logs for accounts, operators often clear them to cover tracks.
  - id: 236e7c8e-c9d9-11eb-a824-acde48001122
    name: Disable Logs Using WevtUtil
    reason: Log tampering that commonly follows event log reconnaissance.
  - id: 730fc21b-eaff-474b-ad23-90fd265d4988
    name: Psexec Execution
    reason: PsLogList is a Sysinternals tool often dropped together with PsExec for remote hosts.
  - id: c248c896-e412-4279-8c15-1c558067b6fa
    name: Enumerate All Information With Whoami.EXE
    reason: Account/privilege discovery in the same hands-on-keyboard recon burst.
  - id: e6313acd-208c-44fc-a0ff-db85d572e90e
    name: Network Reconnaissance Activity
    reason: Broader discovery commands usually run in the same session.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other Sysinternals tools executed
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Pp][Ss][Ee][Xx][Ee][Cc]|[Pp][Ss][Ll][Oo][Gg][Ll][Ii][Ss][Tt]|[Pp][Ss][Ll][Oo][Gg][Gg][Ee][Dd][Oo][Nn]|[Pp][Ss][Gg][Ee][Tt][Ss][Ii][Dd]|[Pp][Ss][Ii][Nn][Ff][Oo]|[Pp][Ss][Ff][Ii][Ll][Ee]|[Pp][Ss][Ll][Ii][Ss][Tt]|[Pp][Ss][Ss][Hh][Uu][Tt][Dd][Oo][Ww][Nn]|[Pp][Ss][Kk][Ii][Ll][Ll])\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 6h
  - name: Account and logon discovery commands
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:(/.*[Nn][Ee][Tt]1? ([Uu][Ss][Ee][Rr]|[Gg][Rr][Oo][Uu][Pp]|[Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp]).*/ OR /.*[Ww][Hh][Oo][Aa][Mm][Ii].*/ OR /.*[Nn][Ll][Tt][Ee][Ss][Tt].*/ OR /.*[Qq][Uu][Ss][Ee][Rr].*/)
    pivot_on: host
    window: 4h
  - name: Event log query and clearing tools
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:(/.*[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll].* ([Cc][Ll]|[Qq][Ee]|[Ee][Pp][Ll]).*/ OR /.*[Cc][Ll][Ee][Aa][Rr]-[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg].*/ OR /.*[Gg][Ee][Tt]-[Ww][Ii][Nn][Ee][Vv][Ee][Nn][Tt].*/)
    pivot_on: host
    window: 6h
  - name: Remote admin share execution
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:(/.*[Aa][Cc][Cc][Ee][Pp][Tt][Ee][Uu][Ll][Aa].*/ OR /.*\\\\[A-Za-z0-9._-]+\\([Aa][Dd][Mm][Ii][Nn]|[Cc])\$.*/)
    pivot_on: host
    window: 4h
