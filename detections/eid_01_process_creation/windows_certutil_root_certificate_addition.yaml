name: Windows Certutil Root Certificate Addition
id: windows-certutil-root-certificate-addition-001
version: 1
schema_version: "1.0"
date: "2026-02-23"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects certutil.exe adding certificates to the Root certificate store from 
  suspicious locations (Temp, ProgramData, Public, PerfLogs). Adversaries install 
  malicious root certificates to intercept HTTPS traffic, impersonate trusted 
  entities, or bypass security controls. Associated with Secret Blizzard AiTM 
  campaigns and banking trojans.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - wildcard:
            data_win_eventdata_commandLine: "*certutil*"
        - wildcard:
            data_win_eventdata_commandLine: "*-addstore*"
        - wildcard:
            data_win_eventdata_commandLine: "*root*"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine: "*\\\\Temp\\\\*"
              - wildcard:
                  data_win_eventdata_commandLine: "*\\\\ProgramData\\\\*"
              - wildcard:
                  data_win_eventdata_commandLine: "*\\\\Users\\\\Public\\\\*"
              - wildcard:
                  data_win_eventdata_commandLine: "*\\\\PerfLogs\\\\*"
              - wildcard:
                  data_win_eventdata_commandLine: "*\\\\Windows\\\\Temp\\\\*"
              - wildcard:
                  data_win_eventdata_commandLine: "*%Temp%*"
              - wildcard:
                  data_win_eventdata_commandLine: "*%AppData%*"
              - wildcard:
                  data_win_eventdata_commandLine: "*.tmp*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-23 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-23 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Windows endpoints with Sysmon 
  installed and configured to log process creation events (EventID 1) with full 
  command-line arguments.

known_false_positives: >
  Administrators or third-party utilities may use certutil to add root 
  certificates. Filter by user context and verify the certificate source path 
  is from an approved location.

references:
  - https://attack.mitre.org/techniques/T1587/003/
  - https://www.microsoft.com/en-us/security/blog/2025/07/31/frozen-in-transit-secret-blizzards-aitm-campaign-against-diplomats/

response:
  message: >
    Certutil root certificate addition from suspicious path on $agent_name$. 
    Command: $data_win_eventdata_commandLine$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1587.003
  risk_score: 72
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 72
  threat_objects: []

tags:
  analytic_story:
    - Secret Blizzard
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1587.003
  custom_tags:
    - certutil
    - certificate
    - root_store
    - aitm
    - lolbin
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*certutil.*/ AND data_win_eventdata_commandLine:/.*-addstore.*/ AND data_win_eventdata_commandLine:/.*root.*/ AND (data_win_eventdata_commandLine:/.*Temp.*/ OR data_win_eventdata_commandLine:/.*ProgramData.*/ OR data_win_eventdata_commandLine:/.*Users.*Public.*/ OR data_win_eventdata_commandLine:/.*PerfLogs.*/ OR data_win_eventdata_commandLine:/.*Windows.*Temp.*/ OR data_win_eventdata_commandLine:/.*%Temp%.*/ OR data_win_eventdata_commandLine:/.*%AppData%.*/ OR data_win_eventdata_commandLine:/.*\.tmp.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d2125259-ddea-4c1c-9c22-977eb5b29cf0
    name: New Root Certificate Installed Via Certutil.EXE
    reason: Generic root certificate install via certutil; corroborates the same action.
  - id: ff992eac-6449-4c60-8c1d-91c9722a1d48
    name: New Root Certificate Installed Via CertMgr.EXE
    reason: CertMgr is the alternative tool to install a rogue root certificate.
  - id: cc9cbe82-7bc0-4ef5-bc23-bbfb83947be7
    name: File Decoded From Base64/Hex Via Certutil.EXE
    reason: Certutil decode unpacks a certificate payload before addstore.
  - id: 82a6714f-4899-4f16-9c1e-9a333544d4c3
    name: File In Suspicious Location Encoded To Base64 Via Certutil.EXE
    reason: Certutil encoding in suspicious paths shows payload handling by the same binary.
  - id: 3ffd6f51-e6c1-47b7-94b4-c1e61d4117c5
    name: Certificate Exported Via Certutil.EXE
    reason: Certificate export via certutil can steal keys or supply the certificate.
  - id: 70ad0861-d1fe-491c-a45f-fa48148a300d
    name: File Download via CertOC.EXE
    reason: CertOC download is an alternative path to fetch the certificate or payload.
  - id: d059842b-6b9d-4ed1-b5c3-5b89143c6ede
    name: File Download Via Bitsadmin
    reason: Bitsadmin download frequently delivers the certificate file.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Certutil download or decode of a payload
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll].*/) AND (data_win_eventdata_commandLine:/.*-[Uu][Rr][Ll][Cc][Aa][Cc][Hh][Ee].*/ OR data_win_eventdata_commandLine:/.*-[Dd][Ee][Cc][Oo][Dd][Ee].*/ OR data_win_eventdata_commandLine:/.*-[Dd][Ee][Cc][Oo][Dd][Ee][Hh][Ee][Xx].*/ OR data_win_eventdata_commandLine:/.*-[Vv][Ee][Rr][Ii][Ff][Yy][Cc][Tt][Ll].*/)
    pivot_on: host
    window: 6h
  - name: Certificate files dropped in staging paths
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\.[Cc][Ee][Rr]/ OR data_win_eventdata_targetFilename:/.*\.[Cc][Rr][Tt]/ OR data_win_eventdata_targetFilename:/.*\.[Pp][Ff][Xx]/ OR data_win_eventdata_targetFilename:/.*\.[Dd][Ee][Rr]/ OR data_win_eventdata_targetFilename:/.*\.[Pp]7[Bb]/) AND (data_win_eventdata_targetFilename:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss]\\.*/)
    pivot_on: host
    window: 6h
  - name: Root certificate store registry writes
    query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Ee][Rr][Tt][Ii][Ff][Ii][Cc][Aa][Tt][Ee][Ss]\\[Rr][Oo][Oo][Tt]\\[Cc][Ee][Rr][Tt][Ii][Ff][Ii][Cc][Aa][Tt][Ee][Ss].*/ OR data_win_eventdata_targetObject:/.*[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Ee][Rr][Tt][Ii][Ff][Ii][Cc][Aa][Tt][Ee][Ss]\\[Aa][Uu][Tt][Hh][Rr][Oo][Oo][Tt].*/ OR data_win_eventdata_targetObject:/.*[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Ee][Rr][Tt][Ii][Ff][Ii][Cc][Aa][Tt][Ee][Ss]\\[Rr][Oo][Oo][Tt]\\[Pp][Rr][Oo][Tt][Ee][Cc][Tt][Ee][Dd][Rr][Oo][Oo][Tt][Ss].*/)
    pivot_on: host
    window: 6h
  - name: Proxy configuration changes enabling interception
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Nn][Ee][Tt][Ss][Hh] [Ww][Ii][Nn][Hh][Tt][Tt][Pp] [Ss][Ee][Tt] [Pp][Rr][Oo][Xx][Yy].*/ OR data_win_eventdata_commandLine:/.*[Pp][Rr][Oo][Xx][Yy][Ss][Ee][Rr][Vv][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Pp][Rr][Oo][Xx][Yy][Ee][Nn][Aa][Bb][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Aa][Uu][Tt][Oo][Cc][Oo][Nn][Ff][Ii][Gg][Uu][Rr][Ll].*/)
    pivot_on: host
    window: 6h
  - name: Hosts file modification for traffic redirection
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\[Dd][Rr][Ii][Vv][Ee][Rr][Ss]\\[Ee][Tt][Cc]\\[Hh][Oo][Ss][Tt][Ss].*/)
    pivot_on: host
    window: 6h
