name: AgentExecutor PowerShell Execution
id: 7efd2c8d-8b18-45b7-947d-adfe9ed04f61
version: 1
schema_version: "1.0"
date: "2024-08-07"
author: Nasreddine Bencherchali (Nextron Systems), memory-shards
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 7efd2c8d-8b18-45b7-947d-adfe9ed04f61
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of the AgentExecutor.exe binary. Which can be abused as a
  LOLBIN to execute powershell scripts with the ExecutionPolicy "Bypass" or any
  binary named "powershell.exe" located in the path provided by 6th positional
  argument. MITRE ATT&CK: T1218.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - term:
                  data_win_eventdata_image:
                    value: "\\AgentExecutor.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "AgentExecutor.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -powershell*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -remediationScript*"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_parentImage"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\Microsoft.Management.Services.IntuneWindowsAgent.exe"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image equals
  '\AgentExecutor.exe'; data_win_eventdata_originalFileName equals
  'AgentExecutor.exe'; data_win_eventdata_commandLine matches '* -powershell*',
  among other conditions.

known_false_positives: >
  Legitimate use via Intune management. You exclude script paths and names to
  reduce FP rate. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/lefterispan/status/1286259016436514816
  - https://lolbas-project.github.io/lolbas/OtherMSBinaries/Agentexecutor/
  - https://learn.microsoft.com/en-us/mem/intune/apps/intune-management-extension
  - https://twitter.com/jseerden/status/1247985304667066373/photo/1
  - https://attack.mitre.org/techniques/T1218/

response:
  message: >
    AgentExecutor PowerShell Execution detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1218
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218
  custom_tags:
    - agentexecutor
    - powershell
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/\\[Aa][Gg][Ee][Nn][Tt][Ee][Xx][Ee][Cc][Uu][Tt][Oo][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Aa][Gg][Ee][Nn][Tt][Ee][Xx][Ee][Cc][Uu][Tt][Oo][Rr]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.* -[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.* -[Rr][Ee][Mm][Ee][Dd][Ii][Aa][Tt][Ii][Oo][Nn][Ss][Cc][Rr][Ii][Pp][Tt].*/) AND _exists_:data_win_eventdata_parentImage AND NOT (data_win_eventdata_parentImage:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\.[Mm][Aa][Nn][Aa][Gg][Ee][Mm][Ee][Nn][Tt]\.[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\.[Ii][Nn][Tt][Uu][Nn][Ee][Ww][Ii][Nn][Dd][Oo][Ww][Ss][Aa][Gg][Ee][Nn][Tt]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 9be56c82-b1cc-4318-87eb-d138afaaca39
    name: Malicious PowerShell Process - Execution Policy Bypass
    reason: AgentExecutor runs scripts with ExecutionPolicy Bypass; the spawned powershell shows the same bypass.
  - id: cf2e938e-9a3e-4fe8-a347-411642b28a9f
    name: Potential PowerShell Execution Policy Tampering - ProcCreation
    reason: Policy tampering on the same host commonly accompanies LOLBin-proxied PowerShell.
  - id: d4ca7c59-e9e4-42d8-bf57-91a776efcb87
    name: LOLBIN Execution From Abnormal Drive
    reason: Other LOLBin abuse on the host indicates an operator chaining proxy-execution binaries.
  - id: c4db14d9-7909-48b4-a054-aa14d89dbb19
    name: Malicious PowerShell Process - Encoded Command
    reason: The script AgentExecutor launches is often an encoded payload.
  - id: a6a39bdb-935c-4f0a-ab77-35f4bbf44d33
    name: Potentially Suspicious Powershell Script Execution From Temp Folder
    reason: The abused script path is frequently in Temp/user-writable folders.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: PowerShell with bypass, hidden or encoded flags
    query: data_win_system_eventID:1 AND data_win_eventdata_image:(/.*\\[Pp]ower[Ss]hell\.exe/ OR /.*\\pwsh\.exe/) AND data_win_eventdata_commandLine:(/.*[Bb]ypass.*/ OR /.*[Hh]idden.*/ OR /.*-[Ee]nc.*/)
    pivot_on: host
    window: 4h
  - name: Processes spawned by powershell or AgentExecutor
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:(/.*\\[Pp]ower[Ss]hell\.exe/ OR /.*\\AgentExecutor\.exe/)
    pivot_on: host
    window: 2h
  - name: PowerShell download cradles
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ii]nvoke-[Ww]eb[Rr]equest.*/ OR /.*[Dd]ownload[Ss]tring.*/ OR /.*[Ii][Ee][Xx] .*/ OR /.*[Bb]its[Tt]ransfer.*/)
    pivot_on: host
    window: 4h
  - name: Outbound connections from powershell
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*\\[Pp]ower[Ss]hell\.exe/
    pivot_on: host
    window: 4h
