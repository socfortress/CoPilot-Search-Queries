parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_hashes matches
  '*IMPHASH=BCCA3C247B619DCD13C8CDFF5F123932*'; data_win_eventdata_hashes
  matches '*IMPHASH=3A19059BD7688CB88E70005F18EFC439*';
  data_win_eventdata_hashes matches
  '*IMPHASH=bf6223a49e45d99094406777eb6004ba*', among other conditions.

known_false_positives: >
  Legitimate use of one of these tools. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - Internal Research
  - https://attack.mitre.org/techniques/T1588/002/
  - https://attack.mitre.org/techniques/T1003/

response:
  message: >
    Hacktool Execution - Imphash detected on host $agent_name$. Matched
    data_win_eventdata_hashes: $data_win_eventdata_hashes$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1588.002, T1003
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_hashes
      type: file_hash
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1588.002
    - T1003
  custom_tags:
    - hacktool
    - imphash
    - process_creation
    - sysmon
    - credential_access
    - resource_development
  product:
    - Wazuh
  security_domain: endpoint

