name: PUA - Memory Dump Mount Via MemProcFS
id: 8a1b2c3d-4e5f-6789-abcd-ef1234567890
version: 1
schema_version: "1.0"
date: "2026-04-27"
author: Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 8a1b2c3d-4e5f-6789-abcd-ef1234567890
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of MemProcFS a memory forensics tool with the '-device'
  parameter. MemProcFS mounts physical memory as a virtual file system, allowing
  direct access to process memory and system structures. Threat actors were seen
  abusing this utility to mount memory dumps and then extract sensitive
  information from processes like LSASS or extract registry hives to obtain
  credentials, LSA secrets, SAM data, and cached domain credentials. MemProcFS
  usage that is not part of authorized forensic analysis should be treated as
  suspicious and warrants further investigation. MITRE ATT&CK: T1003, T1003.001,
  T1003.004, T1003.002.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\MemProcFS.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "MemProcFS.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_description:
                    value: "MemProcFS"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*-device*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_description
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\MemProcFS.exe'; data_win_eventdata_originalFileName equals 'MemProcFS.exe';
  data_win_eventdata_description equals 'MemProcFS', among other conditions.

known_false_positives: >
  Legitimate use during memory forensics; if not part of authorized analysis,
  warrants urgent investigation. Baseline expected activity in your environment
  and tune this detection before relying on it for automated response.

references:
  - https://github.com/ufrisk/MemProcFS
  - https://0xdf.gitlab.io/2024/10/05/htb-freelancer.html#
  - https://www.huntress.com/blog/curling-for-data-a-dive-into-a-threat-actors-malicious-ttps
  - https://attack.mitre.org/techniques/T1003/
  - https://attack.mitre.org/techniques/T1003/001/
  - https://attack.mitre.org/techniques/T1003/004/
  - https://attack.mitre.org/techniques/T1003/002/

response:
  message: >
    PUA - Memory Dump Mount Via MemProcFS detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1003, T1003.001, T1003.004, T1003.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003
    - T1003.001
    - T1003.004
    - T1003.002
  custom_tags:
    - memory
    - mount
    - memprocfs
    - process_creation
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Mm][Ee][Mm][Pp][Rr][Oo][Cc][Ff][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Mm][Ee][Mm][Pp][Rr][Oo][Cc][Ff][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_description:/[Mm][Ee][Mm][Pp][Rr][Oo][Cc][Ff][Ss]/) AND data_win_eventdata_commandLine:/.*-[Dd][Ee][Vv][Ii][Cc][Ee].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: Memory image is typically produced by a prior LSASS/process dump.
  - id: 5afee48e-67dd-4e03-a783-f74259dcf998
    name: Potential LSASS Process Dump Via Procdump
    reason: Common dump producer whose output is later mounted or parsed.
  - id: c7746f1c-47d3-43d6-8c45-cd1e54b6b0a2
    name: Kernel Memory Dump Via LiveKD
    reason: Full memory acquisition can feed MemProcFS -device.
  - id: fd877b94-9bb5-4191-bb25-d79cbd93c167
    name: Dumping of Sensitive Hives Via Reg.EXE
    reason: Hive extraction is the parallel credential path MemProcFS enables.
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: Credential extraction from a dump often finishes with mimikatz.
  - id: a29808fd-ef50-49ff-9c7a-59a9b040b404
    name: HackTool - Pypykatz Credentials Dumping Activity
    reason: Offline parsing of dumped credentials is the next step.
  - id: 7ec2c172-dceb-4c10-92c9-87c1881b7e18
    name: HackTool - Rubeus Execution
    reason: Recovered hashes/tickets are replayed with Rubeus.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: LSASS access or dump-file creation
    query: data_win_system_eventID:(10 OR 11) AND (data_win_eventdata_targetImage:/.*[Ll]sass\.exe/ OR data_win_eventdata_targetFilename:(/.*\.dmp/ OR /.*[Ll]sass.*/ OR /.*\.raw/ OR /.*\.vmem/))
    pivot_on: host
    window: 6h
  - name: Dump tooling and memory acquisition
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Pp]rocdump.*/ OR /.*comsvcs.*[Mm]ini[Dd]ump.*/ OR /.*[Ww]inpmem.*/ OR /.*[Dd]umpit.*/ OR /.*[Ll]ive[Kk][Dd].*/)
    pivot_on: host
    window: 6h
  - name: Registry hive saves
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*reg.* save .*[Ss][Aa][Mm].*/ OR /.*reg.* save .*[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy].*/ OR /.*reg.* save .*[Ss][Yy][Ss][Tt][Ee][Mm].*/)
    pivot_on: host
    window: 6h
  - name: Credential reuse after extraction
    query: data_win_system_eventID:4624 AND data_win_eventdata_logonType:(3 OR 9 OR 10)
    pivot_on: user
    window: 6h
  - name: Archiving dumps for exfil
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*7z.* a .*/ OR /.*[Rr]ar.* a .*/ OR /.*[Cc]ompress-[Aa]rchive.*/) AND data_win_eventdata_commandLine:(/.*\.dmp.*/ OR /.*[Dd]ump.*/)
    pivot_on: host
    window: 6h
