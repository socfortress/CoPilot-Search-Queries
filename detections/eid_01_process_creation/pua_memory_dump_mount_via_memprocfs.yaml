name: PUA - Memory Dump Mount Via MemProcFS
id: 8a1b2c3d-4e5f-6789-abcd-ef1234567890
version: 1
schema_version: "1.0"
date: "2026-04-27"
author: Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 8a1b2c3d-4e5f-6789-abcd-ef1234567890
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of MemProcFS a memory forensics tool with the '-device'
  parameter. MemProcFS mounts physical memory as a virtual file system, allowing
  direct access to process memory and system structures. Threat actors were seen
  abusing this utility to mount memory dumps and then extract sensitive
  information from processes like LSASS or extract registry hives to obtain
  credentials, LSA secrets, SAM data, and cached domain credentials. MemProcFS
  usage that is not part of authorized forensic analysis should be treated as
  suspicious and warrants further investigation. MITRE ATT&CK: T1003, T1003.001,
  T1003.004, T1003.002.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\MemProcFS.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "MemProcFS.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_description:
                    value: "MemProcFS"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*-device*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_description
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\MemProcFS.exe'; data_win_eventdata_originalFileName equals 'MemProcFS.exe';
  data_win_eventdata_description equals 'MemProcFS', among other conditions.

known_false_positives: >
  Legitimate use during memory forensics; if not part of authorized analysis,
  warrants urgent investigation. Baseline expected activity in your environment
  and tune this detection before relying on it for automated response.

references:
  - https://github.com/ufrisk/MemProcFS
  - https://0xdf.gitlab.io/2024/10/05/htb-freelancer.html#
  - https://www.huntress.com/blog/curling-for-data-a-dive-into-a-threat-actors-malicious-ttps
  - https://attack.mitre.org/techniques/T1003/
  - https://attack.mitre.org/techniques/T1003/001/
  - https://attack.mitre.org/techniques/T1003/004/
  - https://attack.mitre.org/techniques/T1003/002/

response:
  message: >
    PUA - Memory Dump Mount Via MemProcFS detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1003, T1003.001, T1003.004, T1003.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003
    - T1003.001
    - T1003.004
    - T1003.002
  custom_tags:
    - memory
    - mount
    - memprocfs
    - process_creation
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Mm][Ee][Mm][Pp][Rr][Oo][Cc][Ff][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Mm][Ee][Mm][Pp][Rr][Oo][Cc][Ff][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_description:/[Mm][Ee][Mm][Pp][Rr][Oo][Cc][Ff][Ss]/) AND data_win_eventdata_commandLine:/.*-[Dd][Ee][Vv][Ii][Cc][Ee].*/

