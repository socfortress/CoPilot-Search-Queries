name: Windows Odbcconf Load Response File
id: Windows-Odbcconf-Load-Response-File
version: 8
schema_version: 1
date: '2025-05-02'
author: SOCFortress LLC
status: production
type: TTP
description: >
  Detects odbcconf.exe executing with the /F or -F flag to load a response file
  (.rsp). Response files can contain REGSVR commands or other instructions to
  load malicious DLLs, allowing attackers to proxy code execution through a
  trusted Windows binary while hiding the actual payload in an external file.
  This is the response-file variant of the odbcconf LOLBAS abuse pattern.
  Associated with Living Off The Land tradecraft.
  MITRE ATT&CK: T1218.008 (System Binary Proxy Execution: Odbcconf).

data_source:
  - Sysmon EventID 1 (ProcessCreate)

search:
  query:
    bool:
      must:
        - term:
            agent_name: "AGENT_NAME"
        - term:
            agent_labels_customer: "CUSTOMER_CODE"
        - term:
            data_win_system_eventID: "1"
        - wildcard:
            data_win_eventdata_image: "*\\odbcconf.exe"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine: "*-f *"
              - wildcard:
                  data_win_eventdata_commandLine: "*/f *"
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine: "*.rsp*"
        - range:
            timestamp:
              gte: "START_TIME"
              lte: "END_TIME"

parameters:
  - name: AGENT_NAME
    default: "DESKTOP-AM0HLGE"
  - name: CUSTOMER_CODE
    default: "lab"
  - name: START_TIME
    default: "now-24h"
  - name: END_TIME
    default: "now"

how_to_implement: >
  Requires Sysmon EventID 1 (ProcessCreate) flowing to the Wazuh Indexer.
  Fields data_win_eventdata_image and data_win_eventdata_commandLine are
  confirmed working across all EventID 1 detections in this environment.
  Field-validated based on established EventID 1 detection patterns.

known_false_positives: >
  False positives may be present based on legitimate ODBC configuration
  using response files. Filter based on known approved software or paths
  as needed.

references:
  - https://strontic.github.io/xcyclopedia/library/odbcconf.exe-07FBA12552331355C103999806627314.html
  - https://twitter.com/redcanary/status/1541838407894171650
  - https://attack.mitre.org/techniques/T1218/008/

response:
  message: >
    odbcconf.exe loading response file (.rsp) detected on $agent_name$ by $data_win_eventdata_user$.
    Parent: $data_win_eventdata_parentImage$.
    Command: $data_win_eventdata_commandLine$.
    MITRE ATT&CK: T1218.008
  risk_score: 42
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 42
    - field: data_win_eventdata_user
      type: user
      score: 42
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: parent_process_name
    - field: data_win_eventdata_image
      type: process_name

tags:
  analytic_story:
    - Living Off The Land
  asset_type: Endpoint
  mitre_attack_id:
    - T1218.008
  custom_tags:
    - odbcconf
    - response_file
    - rsp
    - lolbas
    - proxy_execution
    - defense_evasion
  product:
    - Wazuh
  security_domain: endpoint

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: Windows-Odbcconf-Hunting
    name: Windows Odbcconf Hunting
    reason: Broad odbcconf execution bracketing this response-file hit.
  - id: Windows-Odbcconf-Load-DLL
    name: Windows Odbcconf Load DLL
    reason: Inline /A REGSVR variant; the .rsp typically holds the same REGSVR action.
  - id: 5f03babb-12db-4eec-8c82-7b4cb5580868
    name: Response File Execution Via Odbcconf.EXE
    reason: Sigma detection of the same response-file activity.
  - id: 2d32dd6f-3196-4093-b9eb-1ad8ab088ca5
    name: Suspicious Response File Execution Via Odbcconf.EXE
    reason: Response file in a suspicious location raises confidence of malicious use.
  - id: ba4cfc11-d0fa-4d94-bf20-7c332c412e76
    name: Potentially Suspicious DLL Registered Via Odbcconf.EXE
    reason: The DLL registration the response file carries out.
  - id: 8e3c7994-131e-4ba5-b6ea-804d49113a26
    name: Uncommon Child Process Spawned By Odbcconf.EXE
    reason: Shows the payload executing after the response file ran.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Response (.rsp) and DLL files created before odbcconf ran
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.([Rr][Ss][Pp]|[Dd][Ll][Ll])/
    pivot_on: host
    window: 1h
  - name: Proxy execution through other signed binaries (regsvr32/rundll32/mshta)
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]|\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Cc][Ss]\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Aa][Ss][Mm]\.[Ee][Xx][Ee]|\\[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|\\[Mm][Ss][Bb][Uu][Ii][Ll][Dd]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 1h
  - name: Child processes spawned by odbcconf
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*(\\[Oo][Dd][Bb][Cc][Cc][Oo][Nn][Ff]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 1h
  - name: Outbound connections by odbcconf or DLL proxy binaries
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*(\\[Oo][Dd][Bb][Cc][Cc][Oo][Nn][Ff]\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]|\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 1h
  - name: DLLs loaded by odbcconf from user-writable paths
    query: data_win_system_eventID:"7" AND data_win_eventdata_image:/.*(\\[Oo][Dd][Bb][Cc][Cc][Oo][Nn][Ff]\.[Ee][Xx][Ee])/ AND data_win_eventdata_imageLoaded:/.*(\\[Uu][Ss][Ee][Rr][Ss]\\|\\[Tt][Ee][Mm][Pp]\\|\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\|\\[Pp][Uu][Bb][Ll][Ii][Cc]\\).*\.[Dd][Ll][Ll]/
    pivot_on: host
    window: 1h
