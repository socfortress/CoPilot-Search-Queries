name: Launch-VsDevShell.PS1 Proxy Execution
id: 45d3a03d-f441-458c-8883-df101a3bb146
version: 1
schema_version: "1.0"
date: "2022-08-19"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 45d3a03d-f441-458c-8883-df101a3bb146
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the use of the 'Launch-VsDevShell.ps1' Microsoft signed script to
  execute commands. MITRE ATT&CK: T1216.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*Launch-VsDevShell.ps1*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*VsWherePath *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*VsInstallationPath *"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*Launch-VsDevShell.ps1*'; data_win_eventdata_commandLine matches
  '*VsWherePath *'; data_win_eventdata_commandLine matches '*VsInstallationPath
  *'.

known_false_positives: >
  Legitimate usage of the script by a developer. Baseline expected activity in
  your environment and tune this detection before relying on it for automated
  response.

references:
  - https://twitter.com/nas_bench/status/1535981653239255040
  - https://attack.mitre.org/techniques/T1216/001/

response:
  message: >
    Launch-VsDevShell.PS1 Proxy Execution detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1216.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1216.001
  custom_tags:
    - launch
    - vsdevshell
    - proxy
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Ll][Aa][Uu][Nn][Cc][Hh]-[Vv][Ss][Dd][Ee][Vv][Ss][Hh][Ee][Ll][Ll]\.[Pp][Ss]1.*/ AND (data_win_eventdata_commandLine:/.*[Vv][Ss][Ww][Hh][Ee][Rr][Ee][Pp][Aa][Tt][Hh] .*/ OR data_win_eventdata_commandLine:/.*[Vv][Ss][Ii][Nn][Ss][Tt][Aa][Ll][Ll][Aa][Tt][Ii][Oo][Nn][Pp][Aa][Tt][Hh] .*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: ac1c92b4-ac81-405a-9978-4604d78cc47e
    name: Potential Binary Proxy Execution Via VSDiagnostics.EXE
    reason: Sibling Visual Studio-shipped signed-binary proxy; an actor abusing VS tooling to dodge detection often tries several of these on the same host.
  - id: b5c7395f-e501-4a08-94d4-57fe7a9da9d2
    name: Potential Binary Proxy Execution Via Cdb.EXE
    reason: Debugger-based proxy execution is the same dev-tooling LOLBin family; co-occurrence indicates deliberate evasion.
  - id: 1e0e1a81-e79b-44bc-935b-ddb9c8006b3d
    name: Potential Script Proxy Execution Via CL_Mutexverifiers.ps1
    reason: Another signed-script proxy executor; attackers chain signed-script LOLBins when the first is blocked or noisy.
  - id: e593cf51-88db-4ee1-b920-37e89012a3c9
    name: Potentially Suspicious Rundll32 Activity
    reason: A payload launched via the proxied shell commonly follows with rundll32 loading of a dropped DLL.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Child processes of PowerShell with dev-shell or encoded arguments
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Pp]ower[Ss]hell.*/ AND data_win_eventdata_commandLine:(/.*[Vv]s[Dd]ev[Ss]hell.*/ OR /.*[Vv]s[Ww]here[Pp]ath.*/ OR /.*[Ee]ncoded[Cc]ommand.*/ OR /.* -[Ee]nc .*/)
    pivot_on: host
    window: 2h
  - name: LOLBin proxy executors on host
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*\\(cdb|vsdiagnostics|msbuild|mshta|regsvr32|rundll32|installutil)\.exe/
    pivot_on: host
    window: 4h
  - name: Download cradles from script hosts
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ii]nvoke-[Ww]eb[Rr]equest.*/ OR /.*[Dd]ownload[Ss]tring.*/ OR /.*[Cc]ertutil.*urlcache.*/ OR /.*[Bb]its[Aa]dmin.*transfer.*/)
    pivot_on: host
    window: 4h
  - name: Outbound connections from PowerShell
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND data_win_eventdata_initiated:true
    pivot_on: host
    window: 2h
