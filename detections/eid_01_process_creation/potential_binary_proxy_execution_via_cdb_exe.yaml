name: Potential Binary Proxy Execution Via Cdb.EXE
id: b5c7395f-e501-4a08-94d4-57fe7a9da9d2
version: 1
schema_version: "1.0"
date: "2024-04-22"
author: Beyu Denis, oscd.community, Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: b5c7395f-e501-4a08-94d4-57fe7a9da9d2
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects usage of "cdb.exe" to launch arbitrary processes or commands from a
  debugger script file. MITRE ATT&CK: T1106, T1218, T1127.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\cdb.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "CDB.Exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -c *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -cf *"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches '*\cdb.exe';
  data_win_eventdata_originalFileName equals 'CDB.Exe';
  data_win_eventdata_commandLine matches '* -c *', among other conditions.

known_false_positives: >
  Legitimate use of debugging tools. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://lolbas-project.github.io/lolbas/OtherMSBinaries/Cdb/
  - https://web.archive.org/web/20170715043507/http://www.exploit-monday.com/2016/08/windbg-cdb-shellcode-runner.html
  - https://twitter.com/nas_bench/status/1534957360032120833
  - https://attack.mitre.org/techniques/T1106/
  - https://attack.mitre.org/techniques/T1218/
  - https://attack.mitre.org/techniques/T1127/

response:
  message: >
    Potential Binary Proxy Execution Via Cdb.EXE detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1106, T1218, T1127
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1106
    - T1218
    - T1127
  custom_tags:
    - binary
    - proxy
    - process_creation
    - sysmon
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Cc][Dd][Bb]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Cc][Dd][Bb]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.* -[Cc] .*/ OR data_win_eventdata_commandLine:/.* -[Cc][Ff] .*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: ac1c92b4-ac81-405a-9978-4604d78cc47e
    name: Potential Binary Proxy Execution Via VSDiagnostics.EXE
    reason: VSDiagnostics is a sibling signed-developer-tool proxy; operators who know one often try the other on the same host
  - id: 15c7904e-6ad1-4a45-9b46-5fb25df37fd2
    name: Malicious PE Execution by Microsoft Visual Studio Debugger
    reason: another debugger-based proxy launch (vsjitdebugger) executing a payload through a signed binary
  - id: 9257c05b-4a4a-48e5-a670-b7b073cf401b
    name: Binary Proxy Execution Via Dotnet-Trace.EXE
    reason: dotnet-trace child-process launch is the same developer-tool proxy technique
  - id: 45d3a03d-f441-458c-8883-df101a3bb146
    name: Launch-VsDevShell.PS1 Proxy Execution
    reason: Launch-VsDevShell.ps1 is a signed Microsoft script abused to run commands, same signed-dev-tool evasion family
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Child processes spawned by cdb
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*(\\[Cc][Dd][Bb]\.[Ee][Xx][Ee]|\\[Ww][Ii][Nn][Dd][Bb][Gg]\.[Ee][Xx][Ee]|\\[Nn][Tt][Ss][Dd]\.[Ee][Xx][Ee]).*/
    pivot_on: host
    window: 2h
  - name: cdb shell escape or script file commands
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Cc][Dd][Bb]\.[Ee][Xx][Ee].*/ AND data_win_eventdata_commandLine:/.*(\.[Ss][Hh][Ee][Ll][Ll]|\$\$><|\.[Ww][Dd][Ss]| -[Cc][Ff] ).*/
    pivot_on: host
    window: 2h
  - name: cdb or debug script dropped to disk
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(\\[Cc][Dd][Bb]\.[Ee][Xx][Ee]|\\[Nn][Tt][Ss][Dd]\.[Ee][Xx][Ee]|\.[Ww][Dd][Ss]).*/
    pivot_on: host
    window: 6h
  - name: Interpreters launched from debugger tools
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*(\\[Cc][Dd][Bb]\.[Ee][Xx][Ee]|\\[Ww][Ii][Nn][Dd][Bb][Gg]\.[Ee][Xx][Ee]|\\[Nn][Tt][Ss][Dd]\.[Ee][Xx][Ee]|\\[Vv][Ss][Dd][Ii][Aa][Gg][Nn][Oo][Ss][Tt][Ii][Cc][Ss]\.[Ee][Xx][Ee]|\\[Vv][Ss][Jj][Ii][Tt][Dd][Ee][Bb][Uu][Gg][Gg][Ee][Rr]\.[Ee][Xx][Ee]).*/ AND data_win_eventdata_image:/.*(\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]|\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]).*/
    pivot_on: host
    window: 2h
