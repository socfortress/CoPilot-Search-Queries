name: DarkSide Ransomware Pattern
id: 965fff6c-1d7e-4e25-91fd-cdccd75f7d2c
version: 1
schema_version: "1.0"
date: "2021-05-14"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 965fff6c-1d7e-4e25-91fd-cdccd75f7d2c
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects DarkSide Ransomware and helpers. MITRE ATT&CK: T1204.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*=[char][byte]('0x'+*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -work worker0 -path *"
                    case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_parentCommandLine:
                          value: "*DllHost.exe /Processid:{3E5FC7F9-9A51-4367-9063-A120244FBEC7}*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\AppData\\\\Local\\\\Temp\\\\*"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentCommandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*=[char][byte]('0x'+*'; data_win_eventdata_commandLine matches '* -work
  worker0 -path *'; data_win_eventdata_parentCommandLine matches '*DllHost.exe
  /Processid:{3E5FC7F9-9A51-4367-9063-A120244FBEC7}*', among other conditions.

known_false_positives: >
  Unknown. UAC bypass method used by other malware. Baseline expected activity
  in your environment and tune this detection before relying on it for automated
  response.

references:
  - https://www.fireeye.com/blog/threat-research/2021/05/shining-a-light-on-darkside-ransomware-operations.html
  - https://app.any.run/tasks/8b9a571b-bcc1-4783-ba32-df4ba623b9c0/
  - https://www.joesandbox.com/analysis/411752/0/html#7048BB9A06B8F2DD9D24C77F389D7B2B58D2
  - https://attack.mitre.org/techniques/T1204/

response:
  message: >
    DarkSide Ransomware Pattern detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_parentCommandLine:
    $data_win_eventdata_parentCommandLine$. MITRE ATT&CK: T1204
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_parentCommandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1204
  custom_tags:
    - darkside
    - ransomware
    - pattern
    - process_creation
    - sysmon
    - execution
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*=\[[Cc][Hh][Aa][Rr]\]\[[Bb][Yy][Tt][Ee]\]\('0[Xx]'\+.*/ OR data_win_eventdata_commandLine:/.* -[Ww][Oo][Rr][Kk] [Ww][Oo][Rr][Kk][Ee][Rr]0 -[Pp][Aa][Tt][Hh] .*/ OR (data_win_eventdata_parentCommandLine:/.*[Dd][Ll][Ll][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee] \/[Pp][Rr][Oo][Cc][Ee][Ss][Ss][Ii][Dd]:\{3[Ee]5[Ff][Cc]7[Ff]9-9[Aa]51-4367-9063-[Aa]120244[Ff][Bb][Ee][Cc]7\}.*/ AND data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\.*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: DarkSide deletes shadow copies before encrypting to prevent recovery.
  - id: 639c9081-f482-47d3-a0bd-ddee3d4ecd76
    name: All Backups Deleted Via Wbadmin.EXE
    reason: 'Ransomware pre-encryption step: destroys Windows backup catalog.'
  - id: 1444443e-6757-43e4-9ea4-c8fc705f79a2
    name: Boot Configuration Tampering Via Bcdedit.EXE
    reason: Recovery disablement commonly paired with shadow deletion before encryption.
  - id: c9fbe8e9-119d-40a6-9b59-dd58a5d84429
    name: Potential Ransomware or Unauthorized MBR Tampering Via Bcdedit.EXE
    reason: Same ransomware preparation phase on the same host.
  - id: 21ff4ca9-f13a-41ad-b828-0077b2af2e40
    name: Deletion of Volume Shadow Copies via WMI with PowerShell
    reason: DarkSide's PowerShell wipes shadow copies via WMI (Win32_Shadowcopy).
  - id: 2f47f1fd-0901-466e-a770-3b7092834a1b
    name: Potential Conti Ransomware Database Dumping Activity Via SQLCmd
    reason: Double-extortion data staging from SQL servers before encryption; similar operator tradecraft.
  - id: d95de845-b83c-4a9a-8a6a-4fc802ebf6c0
    name: Suspicious Group And Account Reconnaissance Activity Using Net.EXE
    reason: Operator reconnaissance typically preceding ransomware deployment.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Backup and recovery destruction commands
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*vssadmin.*delete.*shadows.*/ OR data_win_eventdata_commandLine:/.*wbadmin.*delete.*/ OR data_win_eventdata_commandLine:/.*bcdedit.*(recoveryenabled|ignoreallfailures).*/ OR data_win_eventdata_commandLine:/.*[Ss]hadowcopy.*[Dd]elete.*/)
    pivot_on: host
    window: 4h
  - name: Services and security tools stopped
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*(net|sc)(\.exe)? +(stop|config).*/ OR data_win_eventdata_commandLine:/.*taskkill.*\/f.*/ OR data_win_eventdata_commandLine:/.*Set-MpPreference.*Disable.*/)
    pivot_on: host
    window: 4h
  - name: Ransom note file creation
    query: data_win_system_eventID:11 AND (data_win_eventdata_targetFilename:/.*README.*\.txt/ OR data_win_eventdata_targetFilename:/.*[Rr]estore.*[Ff]iles.*/)
    pivot_on: host
    window: 4h
  - name: Executables launched from AppData Temp
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*\\[Aa]pp[Dd]ata\\[Ll]ocal\\[Tt]emp\\.*/
    pivot_on: host
    window: 4h
  - name: Lateral spread via admin shares or PsExec
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*[Pp]s[Ee]xec.*/ OR data_win_eventdata_commandLine:/.*\\\\.*\\(admin|c)\$.*/)
    pivot_on: host
    window: 4h
