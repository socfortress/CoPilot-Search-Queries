name: Dropping Of Password Filter DLL
id: b7966f4a-b333-455b-8370-8ca53c229762
version: 1
schema_version: "1.0"
date: "2022-10-09"
author: Sreeman
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: b7966f4a-b333-455b-8370-8ca53c229762
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects dropping of dll files in system32 that may be used to retrieve user
  credentials from LSASS. MITRE ATT&CK: T1556.002.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*HKLM\\\\SYSTEM\\\\CurrentControlSet\\\\Control\\\\Lsa*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*scecli\\\\0*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*reg add*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*HKLM\SYSTEM\CurrentControlSet\Control\Lsa*'; data_win_eventdata_commandLine
  matches '*scecli\0*'; data_win_eventdata_commandLine matches '*reg add*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://pentestlab.blog/2020/02/10/credential-access-password-filter-dll/
  - https://github.com/3gstudent/PasswordFilter/tree/master/PasswordFilter
  - https://attack.mitre.org/techniques/T1556/002/

response:
  message: >
    Dropping Of Password Filter DLL detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1556.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1556.002
  custom_tags:
    - dropping
    - password
    - filter
    - process_creation
    - sysmon
    - persistence
    - credential_access
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Hh][Kk][Ll][Mm]\\[Ss][Yy][Ss][Tt][Ee][Mm]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt]\\[Cc][Oo][Nn][Tt][Rr][Oo][Ll]\\[Ll][Ss][Aa].*/ AND data_win_eventdata_commandLine:/.*[Ss][Cc][Ee][Cc][Ll][Ii]\\0.*/ AND data_win_eventdata_commandLine:/.*[Rr][Ee][Gg] [Aa][Dd][Dd].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 8c0eca51-0f88-4db2-9183-fdfb10c703f9
    name: LSA PPL Protection Setting Modification via CommandLine
    reason: Same Lsa registry hive; disabling LSA protection often precedes or accompanies loading a rogue notification package.
  - id: b7e2a8d4-74bb-4b78-adc9-3f92af2d4829
    name: Reg Add Suspicious Paths
    reason: Same reg add technique used to register the DLL.
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: Alternative credential theft from LSASS used when the filter plan fails or in parallel.
  - id: ffa6861c-4461-4f59-8a41-578c39f3f23e
    name: LSASS Dump Keyword In CommandLine
    reason: Co-occurring LSASS credential access on the same host.
  - id: aa92fd02-09f2-48b0-8a93-864813fb8f41
    name: Conti NTDS Exfiltration Command
    reason: Domain controller credential theft; a password filter on a DC captures all password changes.
  - id: 2afafd61-6aae-4df4-baed-139fa1f4c345
    name: Invocation of Active Directory Diagnostic Tool (ntdsutil.exe)
    reason: Attacker on a DC pairing password filter persistence with NTDS extraction.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Lsa registry modifications
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:(/.*Control\\Lsa.*Notification Packages.*/ OR /.*Control\\Lsa.*Security Packages.*/ OR /.*Control\\Lsa.*RunAsPPL.*/)
    pivot_on: host
    window: 6h
  - name: DLL written to System32
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*[Ss]ystem32\\.*\.dll/
    pivot_on: host
    window: 6h
  - name: Reg and copy commands touching Lsa
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Rr]eg.*[Cc]ontrol\\[Ll]sa.*/ OR /.*[Cc]opy.*system32.*\.dll.*/)
    pivot_on: host
    window: 6h
  - name: LSASS image load or access
    query: (data_win_system_eventID:7 OR data_win_system_eventID:10) AND data_win_eventdata_targetImage:/.*[Ll]sass\.exe/
    pivot_on: host
    window: 6h
