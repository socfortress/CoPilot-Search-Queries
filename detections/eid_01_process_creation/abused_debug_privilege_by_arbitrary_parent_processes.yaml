name: Abused Debug Privilege by Arbitrary Parent Processes
id: d522eca2-2973-4391-a3e0-ef0374321dae
version: 1
schema_version: "1.0"
date: "2022-11-11"
author: Semanur Guneysu @semanurtg, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: d522eca2-2973-4391-a3e0-ef0374321dae
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detection of unusual child processes by different system processes. MITRE
  ATT&CK: T1548.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\winlogon.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\services.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\lsass.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\csrss.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\smss.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\wininit.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\spoolsv.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\searchindexer.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_user:
                    value: "*AUTHORI*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_user:
                    value: "*AUTORI*"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\powershell.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\pwsh.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\cmd.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "PowerShell.EXE"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "pwsh.dll"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "Cmd.Exe"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_commandLine"
        - bool:
            must_not:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* route *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* ADD *"
                          case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_user
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\winlogon.exe'; data_win_eventdata_parentImage matches '*\services.exe';
  data_win_eventdata_parentImage matches '*\lsass.exe', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://image.slidesharecdn.com/kheirkhabarovoffzonefinal-181117201458/95/hunting-for-privilege-escalation-in-windows-environment-74-638.jpg
  - https://attack.mitre.org/techniques/T1548/

response:
  message: >
    Abused Debug Privilege by Arbitrary Parent Processes detected on host
    $agent_name$. Matched data_win_eventdata_parentImage:
    $data_win_eventdata_parentImage$. Matched data_win_eventdata_user:
    $data_win_eventdata_user$. MITRE ATT&CK: T1548
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_user
      type: user

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1548
  custom_tags:
    - abused
    - debug
    - privilege
    - process_creation
    - sysmon
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Cc][Ss][Rr][Ss][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ss][Mm][Ss][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ww][Ii][Nn][Ii][Nn][Ii][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ss][Pp][Oo][Oo][Ll][Ss][Vv]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ss][Ee][Aa][Rr][Cc][Hh][Ii][Nn][Dd][Ee][Xx][Ee][Rr]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_user:/.*[Aa][Uu][Tt][Hh][Oo][Rr][Ii].*/ OR data_win_eventdata_user:/.*[Aa][Uu][Tt][Oo][Rr][Ii].*/) AND (data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Pp][Ww][Ss][Hh]\.[Dd][Ll][Ll]/ OR data_win_eventdata_originalFileName:/[Cc][Mm][Dd]\.[Ee][Xx][Ee]/) AND _exists_:data_win_eventdata_commandLine AND NOT (data_win_eventdata_commandLine:/.* [Rr][Oo][Uu][Tt][Ee] .*/ AND data_win_eventdata_commandLine:/.* [Aa][Dd][Dd] .*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7c0dcd3d-acf8-4f71-9570-f448b0034f94
    name: PsExec Service Child Process Execution as LOCAL SYSTEM
    reason: PsExec/service-spawned SYSTEM shells are the commonest source of SYSTEM cmd/powershell under services.exe.
  - id: 178e615d-e666-498b-9630-9ed363038101
    name: Elevated System Shell Spawned From Uncommon Parent Location
    reason: Same outcome (SYSTEM shell) from a suspicious parent, corroborating token/privilege abuse.
  - id: 9bd04a79-dabe-4f1f-a5ff-92430265c96b
    name: Privilege Escalation via Named Pipe Impersonation
    reason: Named-pipe impersonation is a standard way to obtain a SYSTEM shell.
  - id: 52ff7941-8211-46f9-84f8-9903efb7077d
    name: HackTool - PPID Spoofing SelectMyParent Tool Execution
    reason: Parent spoofing with SeDebugPrivilege explains a shell appearing under lsass/winlogon.
  - id: cbb9e3d1-2386-4e59-912e-62f1484f7a89
    name: Conhost Spawned By Uncommon Parent Process
    reason: Console host under an unusual parent shows the same spawned-shell anomaly.
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: privilege::debug and token elevation precede credential theft from SYSTEM context.
  - id: d937b75f-a665-4480-88a5-2f20e9f9b22a
    name: Possible Privilege Escalation via Weak Service Permissions
    reason: Service permission abuse is an alternate path to a SYSTEM child of services.exe.
  - id: windows-access-token-winlogon-duplicate-handle-001
    name: Windows Access Token Manipulation Winlogon Duplicate Token Handle
    reason: Duplicating winlogon's token is the mechanism that yields SYSTEM shells near winlogon.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Process access against winlogon/lsass by non-core processes (token or handle theft)
    query: data_win_system_eventID:"10" AND (data_win_eventdata_targetImage:/.*\\[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) AND NOT data_win_eventdata_sourceImage:/.*\\(?:[Ww][Ii][Nn][Ii][Nn][Ii][Tt]|[Cc][Ss][Rr][Ss][Ss]|[Ss][Vv][Cc][Hh][Oo][Ss][Tt]|[Mm][Ss][Mm][Pp][Ee][Nn][Gg]|[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: 'Privilege-escalation tooling: PsExec -s, potato tools, getsystem'
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\[Pp][Ss][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ss][Ee][Xx][Ee][Cc]64\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Aa][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Jj][Uu][Ii][Cc][Yy][Pp][Oo][Tt][Aa][Tt][Oo]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Ii][Nn][Tt][Ss][Pp][Oo][Oo][Ff][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Gg][Oo][Dd][Pp][Oo][Tt][Aa][Tt][Oo]\.[Ee][Xx][Ee]/) OR (data_win_eventdata_commandLine:/.*[Gg][Ee][Tt][Ss][Yy][Ss][Tt][Ee][Mm].*/ OR data_win_eventdata_commandLine:/.*[Ii][Mm][Pp][Ee][Rr][Ss][Oo][Nn][Aa][Tt].*/ OR data_win_eventdata_commandLine:/.*[Pp][Rr][Ii][Vv][Ii][Ll][Ee][Gg][Ee]::[Dd][Ee][Bb][Uu][Gg].*/ OR data_win_eventdata_commandLine:/.*[Pp][Rr][Ii][Nn][Tt][Ss][Pp][Oo][Oo][Ff][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Rr][Oo][Gg][Uu][Ee][Pp][Oo][Tt][Aa][Tt][Oo].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Dd][Ee][Bb][Uu][Gg][Pp][Rr][Ii][Vv][Ii][Ll][Ee][Gg][Ee].*/))
    pivot_on:
    - host
    window: 2h
  - name: Reconnaissance run in the elevated shell
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ww][Hh][Oo][Aa][Mm][Ii] /[Pp][Rr][Ii][Vv].*/ OR data_win_eventdata_commandLine:/.*[Ww][Hh][Oo][Aa][Mm][Ii] /[Aa][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt] [Uu][Ss][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt] [Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ll][Tt][Ee][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Qq][Uu][Ee][Rr][Yy] [Uu][Ss][Ee][Rr].*/)
    pivot_on:
    - host
    window: 2h
  - name: Credential dumping following SYSTEM access
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Rr][Ee][Gg] [Ss][Aa][Vv][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Ss][Ss].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll].*/)
    pivot_on:
    - host
    window: 4h
  - name: Persistence created from the elevated context
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Cc] [Cc][Rr][Ee][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss] /[Cc][Rr][Ee][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt] [Uu][Ss][Ee][Rr] /[Aa][Dd][Dd].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt] [Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp] [Aa][Dd][Mm][Ii][Nn][Ii][Ss][Tt][Rr][Aa][Tt][Oo][Rr][Ss].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Ww]-[Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/)
    pivot_on:
    - host
    window: 4h
