name: Lummac Stealer Activity - Execution Of More.com And Vbc.exe
id: 19b3806e-46f2-4b4c-9337-e3d8653245ea
version: 1
schema_version: "1.0"
date: "2024-12-19"
author: Joseliyo Sanchez, @Joseliyo_Jstnk
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 19b3806e-46f2-4b4c-9337-e3d8653245ea
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of more.com and vbc.exe in the process tree. This
  behavior was observed by a set of samples related to Lummac Stealer. The
  Lummac payload is injected into the vbc.exe process. MITRE ATT&CK: T1055.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_parentImage:
              value: "*\\\\more.com"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\vbc.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "vbc.exe"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\more.com'; data_win_eventdata_image matches '*\vbc.exe';
  data_win_eventdata_originalFileName equals 'vbc.exe'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.virustotal.com/gui/search/behaviour_processes%253A%2522C%253A%255C%255CWindows%255C%255CSysWOW64%255C%255Cmore.com%2522%2520behaviour_processes%253A%2522C%253A%255C%255CWindows%255C%255CMicrosoft.NET%255C%255CFramework%255C%255Cv4.0.30319%255C%255Cvbc.exe%2522/files
  - https://www.virustotal.com/gui/file/14d886517fff2cc8955844b252c985ab59f2f95b2849002778f03a8f07eb8aef
  - https://strontic.github.io/xcyclopedia/library/more.com-EDB3046610020EE614B5B81B0439895E.html
  - https://strontic.github.io/xcyclopedia/library/vbc.exe-A731372E6F6978CE25617AE01B143351.html
  - https://attack.mitre.org/techniques/T1055/

response:
  message: >
    Lummac Stealer Activity - Execution Of More.com And Vbc.exe detected on host
    $agent_name$. Matched data_win_eventdata_parentImage:
    $data_win_eventdata_parentImage$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1055
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1055
  custom_tags:
    - lummac
    - stealer
    - process_creation
    - sysmon
    - privilege_escalation
    - stealth
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Mm][Oo][Rr][Ee]\.[Cc][Oo][Mm]/ AND (data_win_eventdata_image:/.*\\[Vv][Bb][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Vv][Bb][Cc]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d8937fe7-42d5-4b4d-8178-e089c908f63f
    name: Potential Pikabot Hollowing Activity
    reason: Process hollowing into a legit binary is the same injection pattern (Lumma payload injected into vbc.exe).
  - id: 5cdbc2e8-86dd-43df-9a1a-200d4745fba5
    name: Rhadamanthys Stealer Module Launch Via Rundll32.EXE
    reason: Another stealer loader chain (Rhadamanthys) that commonly appears with Lumma-class stealer infections.
  - id: 5e6a80c8-2d45-4633-9ef4-fa2671a39c5c
    name: Suspicious Parent Double Extension File Execution
    reason: Double-extension execution is a typical Lumma delivery precursor from a downloaded archive/lure.
  - id: e6c54d94-498c-4562-a37c-b469d8e9a275
    name: Suspicious PowerShell Download and Execute Pattern
    reason: PowerShell download-and-execute is a common initial stage delivering the Lumma loader.
  - id: 47147b5b-9e17-4d76-b8d2-7bac24c5ce1b
    name: Potential Browser Data Stealing
    reason: Browser data theft is Lumma's core goal after injection.
  - id: 5a6e1e16-07de-48d8-8aae-faa766c05e88
    name: Potential Cookies Session Hijacking
    reason: Cookie/session theft is a stealer outcome following injection.
  - id: b9d9cc83-380b-4ba3-8d8f-60c0e7e2930c
    name: Suspicious PowerShell Encoded Command Patterns
    reason: Encoded PowerShell is frequently used to stage Lumma.
  - id: aa3a6f94-890e-4e22-b634-ffdfd54792cc
    name: Suspicious Binary In User Directory Spawned From Office Application
    reason: Binary in user directory spawned from Office/lure is a typical entry vector.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Injected vbc.exe network activity
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*\\vbc\.exe/
    pivot_on: host
    window: 4h
  - name: Browser credential store access
    query: data_win_system_eventID:11 AND (data_win_eventdata_targetFilename:/.*Login [Dd]ata.*/ OR data_win_eventdata_targetFilename:/.*[Cc]ookies.*/ OR data_win_eventdata_targetFilename:/.*Web [Dd]ata.*/ OR data_win_eventdata_targetFilename:/.*key[34]\.db.*/)
    pivot_on: host
    window: 4h
  - name: Cryptocurrency wallet and extension data access
    query: data_win_system_eventID:11 AND (data_win_eventdata_targetFilename:/.*[Ee]xodus.*/ OR data_win_eventdata_targetFilename:/.*wallet\.dat.*/ OR data_win_eventdata_targetFilename:/.*[Mm]eta[Mm]ask.*/)
    pivot_on: host
    window: 4h
  - name: Delivery lures executed from user dirs
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*\\(Downloads|Temp|AppData).*\.exe/ OR data_win_eventdata_parentImage:/.*\\(Downloads|Temp)\\.*/) AND (data_win_eventdata_commandLine:/.*[Mm]ore\.com.*/ OR data_win_eventdata_commandLine:/.*\.(zip|rar|7z|iso).*/)
    pivot_on: host
    window: 6h
  - name: Remote thread or process access into vbc.exe
    query: (data_win_system_eventID:8 OR data_win_system_eventID:10) AND (data_win_eventdata_targetImage:/.*\\vbc\.exe/)
    pivot_on: host
    window: 2h
