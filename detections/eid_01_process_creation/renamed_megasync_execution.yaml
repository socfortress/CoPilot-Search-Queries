name: Renamed MegaSync Execution
id: 643bdcac-8b82-49f4-9fd9-25a90b929f3b
version: 1
schema_version: "1.0"
date: "2023-02-03"
author: Sittikorn S
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 643bdcac-8b82-49f4-9fd9-25a90b929f3b
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of a renamed MegaSync.exe as seen used by ransomware
  families like Nefilim, Sodinokibi, Pysa, and Conti. MITRE ATT&CK: T1218.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - term:
            data_win_eventdata_originalFileName:
              value: "megasync.exe"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\megasync.exe"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_originalFileName
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_originalFileName equals
  'megasync.exe'; data_win_eventdata_image matches '*\megasync.exe'.

known_false_positives: >
  Software that illegally integrates MegaSync in a renamed form. Administrators
  that have renamed MegaSync. Baseline expected activity in your environment and
  tune this detection before relying on it for automated response.

references:
  - https://redcanary.com/blog/rclone-mega-extortion/
  - https://attack.mitre.org/techniques/T1218/

response:
  message: >
    Renamed MegaSync Execution detected on host $agent_name$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1218
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_originalFileName
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218
  custom_tags:
    - renamed
    - megasync
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_originalFileName:/[Mm][Ee][Gg][Aa][Ss][Yy][Nn][Cc]\.[Ee][Xx][Ee]/ AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/.*\\[Mm][Ee][Gg][Aa][Ss][Yy][Nn][Cc]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e37db05d-d1f9-49c8-b464-cee1a4b11638
    name: PUA - Rclone Execution
    reason: Alternate cloud-sync exfil tool; actors often try several
  - id: 6dca1124-b3ec-11eb-9328-acde48001122
    name: Detect Renamed RClone
    reason: Same hiding of cloud-sync tooling by rename
  - id: 7d1aaf3d-4304-425c-b7c3-162055e0b3ab
    name: Potential Data Exfiltration Activity Via CommandLine Tools
    reason: Command-line exfil techniques accompanying cloud sync
  - id: 9fbf5927-5261-4284-a71d-f681029ea574
    name: Compress Data and Lock With Password for Exfiltration With 7-ZIP
    reason: 'Precursor: data archived before upload to MEGA'
  - id: 4057291a-b8cf-11eb-95fe-acde48001122
    name: Detect Renamed 7-Zip
    reason: 'Precursor: renamed archiver staging data'
  - id: 0ba1da6d-b6ce-4366-828c-18826c9de23e
    name: Potential Defense Evasion Via Rename Of Highly Relevant Binaries
    reason: Same rename-to-evade pattern
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Password-protected archive creation
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Rr]ar|7z|[Zz]ip).* (a|-a) .*/ AND data_win_eventdata_commandLine:/.*( -[Pp]| -hp).*/
    pivot_on: host
    window: 24h
  - name: Connections to MEGA domains
    query: (data_win_system_eventID:"22" AND data_win_eventdata_queryName:/.*mega\.(nz|io).*/) OR (data_win_system_eventID:"3" AND data_win_eventdata_destinationHostname:/.*mega\.(nz|io).*/)
    pivot_on: host
    window: 24h
  - name: Archives staged in shared folders
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(\\Users\\Public\\|\\ProgramData\\|\\Temp\\).*\.(7z|zip|rar)/
    pivot_on: host
    window: 24h
  - name: Share and file enumeration
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Nn]et (view|use|share)|[Rr]obocopy).*/
    pivot_on: host
    window: 24h
