name: Rar Usage with Password and Compression Level
id: faa48cae-6b25-4f00-a094-08947fef582f
version: 1
schema_version: "1.0"
date: "2022-03-16"
author: "@ROxPinTeddy"
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: faa48cae-6b25-4f00-a094-08947fef582f
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the use of rar.exe, on the command line, to create an archive with
  password protection or with a specific compression level. This is pretty
  indicative of malicious actions. MITRE ATT&CK: T1560.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* -hp*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -m*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* a *"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches '*
  -hp*'; data_win_eventdata_commandLine matches '* -m*';
  data_win_eventdata_commandLine matches '* a *'.

known_false_positives: >
  Legitimate use of Winrar command line version. Other command line tools, that
  use these flags. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://labs.sentinelone.com/the-anatomy-of-an-apt-attack-and-cobaltstrike-beacons-encoded-configuration/
  - https://ss64.com/bash/rar.html
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1560.001/T1560.001.md
  - https://attack.mitre.org/techniques/T1560/001/

response:
  message: >
    Rar Usage with Password and Compression Level detected on host $agent_name$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1560.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1560.001
  custom_tags:
    - password
    - compression
    - level
    - process_creation
    - sysmon
    - collection
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.* -[Hh][Pp].*/ AND (data_win_eventdata_commandLine:/.* -[Mm].*/ OR data_win_eventdata_commandLine:/.* [Aa] .*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 9fbf5927-5261-4284-a71d-f681029ea574
    name: Compress Data and Lock With Password for Exfiltration With 7-ZIP
    reason: Same password-protected staging with a different archiver; attackers switch tools, so both on one host confirm collection.
  - id: e2e80da2-8c66-4e00-ae3c-2eebd29f6b6d
    name: Compress Data and Lock With Password for Exfiltration With WINZIP
    reason: Another archiver variant of password-locked staging on the same host.
  - id: ec570e53-4c76-45a9-804d-dc3f355ff7a7
    name: 7Zip Compressing Dump Files
    reason: Archiving of credential/memory dumps is a common content of the encrypted archive.
  - id: 1b7bfb2c-b8e6-11eb-99ac-acde48001122
    name: Detect Renamed WinRAR
    reason: Attackers rename rar.exe to dodge command-line rules; a renamed copy extends the archive activity.
  - id: 32e0baea-b3f1-11eb-a2ce-acde48001122
    name: Detect RClone Command-Line Usage
    reason: The encrypted archive is typically exfiltrated next; rclone is a common upload tool.
  - id: fd877b94-9bb5-4191-bb25-d79cbd93c167
    name: Dumping of Sensitive Hives Via Reg.EXE
    reason: Dumped SAM/SYSTEM hives are often what gets compressed and password-locked.
  - id: da63bc76-61ae-11eb-ae93-0242ac130002
    name: Ntdsutil Export NTDS
    reason: NTDS exports are large high-value files commonly rar'd before exfiltration.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other archiver executions (7z, winzip, tar, Compress-Archive)
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*7[Zz].*/ OR data_win_eventdata_commandLine:/.*[Ww]in[Zz]ip.*/ OR data_win_eventdata_commandLine:/.*[Cc]ompress-[Aa]rchive.*/)
    pivot_on: host
    window: 4h
  - name: Archive files created (rar/7z/zip)
    query: data_win_system_eventID:11 AND (data_win_eventdata_targetFilename:/.*\.[Rr][Aa][Rr]/ OR data_win_eventdata_targetFilename:/.*\.7[Zz]/ OR data_win_eventdata_targetFilename:/.*\.[Zz][Ii][Pp]/)
    pivot_on: host
    window: 4h
  - name: Exfiltration or upload tooling
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*[Rr]clone.*/ OR data_win_eventdata_commandLine:/.*[Ww]in[Ss][Cc][Pp].*/ OR data_win_eventdata_commandLine:/.*[Mm]egasync.*/ OR data_win_eventdata_image:/.*\\[Ff][Tt][Pp]\.[Ee][Xx][Ee]/)
    pivot_on: host
    window: 6h
  - name: Credential and hive harvesting before staging
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*[Nn]tdsutil.*/ OR data_win_eventdata_commandLine:/.*[Rr]eg.* save.*/ OR data_win_eventdata_commandLine:/.*comsvcs.*[Mm]ini[Dd]ump.*/)
    pivot_on: host
    window: 4h
