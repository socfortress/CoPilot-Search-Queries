name: Invocation of Active Directory Diagnostic Tool (ntdsutil.exe)
id: 2afafd61-6aae-4df4-baed-139fa1f4c345
version: 1
schema_version: "1.0"
date: "2022-03-11"
author: Thomas Patzke
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 2afafd61-6aae-4df4-baed-139fa1f4c345
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of ntdsutil.exe, which can be used for various attacks
  against the NTDS database (NTDS.DIT). MITRE ATT&CK: T1003.003.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\ntdsutil.exe"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\ntdsutil.exe'.

known_false_positives: >
  NTDS maintenance. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://jpcertcc.github.io/ToolAnalysisResultSheet/details/ntdsutil.htm
  - https://attack.mitre.org/techniques/T1003/003/

response:
  message: >
    Invocation of Active Directory Diagnostic Tool (ntdsutil.exe) detected on
    host $agent_name$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. Matched data_win_eventdata_commandLine:
    $data_win_eventdata_commandLine$. MITRE ATT&CK: T1003.003
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.003
  custom_tags:
    - invocation
    - active
    - directory
    - process_creation
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: da63bc76-61ae-11eb-ae93-0242ac130002
    name: Ntdsutil Export NTDS
    reason: Specific ntdsutil IFM/ifm create sub-command that exports NTDS.dit; the confirming step of the generic invocation.
  - id: aa92fd02-09f2-48b0-8a93-864813fb8f41
    name: Conti NTDS Exfiltration Command
    reason: Ransomware tradecraft staging NTDS data for exfiltration after dumping.
  - id: c73124a7-3e89-44a3-bdc1-25fe4df754b1
    name: Copy From VolumeShadowCopy Via Cmd.EXE
    reason: Alternative NTDS.dit acquisition via shadow copy; used when ntdsutil is blocked or alongside it.
  - id: fd877b94-9bb5-4191-bb25-d79cbd93c167
    name: Dumping of Sensitive Hives Via Reg.EXE
    reason: SYSTEM/SAM hives are saved with NTDS.dit to decrypt the password hashes.
  - id: fa1a7e52-3d02-435b-81b8-00da14dd66c1
    name: Diskshadow Script Mode - Execution From Potential Suspicious Location
    reason: Diskshadow is another way to expose a locked NTDS.dit through shadow copies.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Ntdsutil snapshot/IFM arguments
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*([Ii][Ff][Mm]|[Ss][Nn][Aa][Pp][Ss][Hh][Oo][Tt]|[Aa][Cc][Tt][Ii][Vv][Aa][Tt][Ee]|[Cc][Rr][Ee][Aa][Tt][Ee]).*/
    pivot_on: host
    window: 6h
  - name: Shadow copy creation or listing
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\[Dd][Ii][Ss][Kk][Ss][Hh][Aa][Dd][Oo][Ww]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*([Ss][Hh][Aa][Dd][Oo][Ww]|[Ss][Cc][Rr][Ii][Pp][Tt]).*/
    pivot_on: host
    window: 6h
  - name: Registry hive saves (SYSTEM/SAM/SECURITY)
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\[Rr][Ee][Gg]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*([Ss][Aa][Vv][Ee]|[Ee][Xx][Pp][Oo][Rr][Tt]).*(HKLM\[Ss][Yy][Ss][Tt][Ee][Mm]|HKLM\[Ss][Aa][Mm]|HKLM\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]).*/
    pivot_on: host
    window: 6h
  - name: Archive or copy staging of dumped data
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\([Rr][Aa][Rr]|7[Zz]|[Rr][Oo][Bb][Oo][Cc][Oo][Pp][Yy]|[Xx][Cc][Oo][Pp][Yy])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]-[Aa][Rr][Cc][Hh][Ii][Vv][Ee].*/)
    pivot_on: host
    window: 6h
  - name: Other logons and tooling by same user
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\([Pp][Ss][Ee][Xx][Ee][Cc]|[Ww][Mm][Ii][Cc]|[Ww][Ii][Nn][Rr][Ss])\.[Ee][Xx][Ee]/
    pivot_on: user
    window: 6h
