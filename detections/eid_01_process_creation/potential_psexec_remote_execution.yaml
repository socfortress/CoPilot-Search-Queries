name: Potential PsExec Remote Execution
id: ea011323-7045-460b-b2d7-0f7442ea6b38
version: 1
schema_version: "1.0"
date: "2025-09-01"
author: Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: ea011323-7045-460b-b2d7-0f7442ea6b38
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential psexec command that initiate execution on a remote systems
  via common commandline flags used by the utility. MITRE ATT&CK: T1587.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*accepteula*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* -u *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* -p *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine: "* \\\\\\\\*"
        - exists:
            field: "data_win_eventdata_commandLine"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*\\\\\\\\localhost*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine: "*\\\\\\\\127.*"
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*accepteula*'; data_win_eventdata_commandLine matches '* -u *';
  data_win_eventdata_commandLine matches '* -p *', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://learn.microsoft.com/en-us/sysinternals/downloads/psexec
  - https://www.poweradmin.com/paexec/
  - https://www.fireeye.com/blog/threat-research/2020/10/kegtap-and-singlemalt-with-a-ransomware-chaser.html
  - https://attack.mitre.org/techniques/T1587/001/

response:
  message: >
    Potential PsExec Remote Execution detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1587.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1587.001
  custom_tags:
    - psexec
    - process_creation
    - sysmon
    - resource_development
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Aa][Cc][Cc][Ee][Pp][Tt][Ee][Uu][Ll][Aa].*/ AND data_win_eventdata_commandLine:/.* -[Uu] .*/ AND data_win_eventdata_commandLine:/.* -[Pp] .*/ AND data_win_eventdata_commandLine:/.* \\\\.*/ AND _exists_:data_win_eventdata_commandLine AND NOT (data_win_eventdata_commandLine:/.*\\\\[Ll][Oo][Cc][Aa][Ll][Hh][Oo][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*\\\\127\..*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 27c3a83d-cada-47c6-9042-67baf19d2574
    name: Detect PsExec With accepteula Flag
    reason: Same tool invocation with -accepteula; confirms the PsExec binary ran on this host (the source side) rather than a lookalike.
  - id: 683e6196-b8e8-11eb-9a79-acde48001122
    name: Detect Renamed PSExec
    reason: Attackers rename psexec.exe to dodge name-based matching; a renamed hit on the same host is the same operator.
  - id: c4e49831-1496-40cf-8ce1-b53f942b02f9
    name: Renamed PAExec Execution
    reason: PAExec is the PsExec clone used when PsExec is blocked; same remote -u/-p execution pattern.
  - id: 304afd73-55a5-4bb9-8c21-0b1fc84ea9e4
    name: PSEXEC Remote Execution File Artefact
    reason: 'Destination-side artefact of PsExec: the PSEXESVC file dropped on the target after this command ran.'
  - id: fdfcbd78-48f1-4a4b-90ac-d82241e368c5
    name: PsExec Service Execution
    reason: Target-side PSEXESVC service process started by the remote execution this command line initiates.
  - id: 7c0dcd3d-acf8-4f71-9570-f448b0034f94
    name: PsExec Service Child Process Execution as LOCAL SYSTEM
    reason: 'Follow-on: commands the operator runs as SYSTEM through the PsExec service on the target.'
  - id: 41504465-5e3a-4a5b-a5b4-2a0baadd4463
    name: PsExec Tool Execution From Suspicious Locations - PipeName
    reason: PsExec run from an odd path creates its PSEXESVC named pipe; corroborates the tool staging location.
  - id: 855bc8b5-2ae8-402e-a9ed-b889e6df1900
    name: Copy From Or To Admin Share Or Sysvol Folder
    reason: PsExec usually follows copying payloads to ADMIN$/C$ shares of the same target.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Admin-share copies and payload staging
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(*[Aa][Dd][Mm][Ii][Nn]$* OR *[Cc]$*) AND data_win_eventdata_commandLine:(*copy* OR *xcopy* OR *robocopy* OR *move*)
    pivot_on: host
    window: 2h
  - name: Net use / share mapping before remote exec
    query: data_win_system_eventID:1 AND data_win_eventdata_image:*[Nn]et*.exe AND data_win_eventdata_commandLine:(*[Uu]se* OR *[Vv]iew*)
    pivot_on: host
    window: 2h
  - name: PsExec-family pipe artefacts
    query: data_win_system_eventID:(17 OR 18) AND data_win_eventdata_pipeName:(*[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]* OR *[Pp][Aa][Ee][Xx][Ee][Cc]* OR *[Rr][Ee][Mm][Cc][Oo][Mm]* OR *[Cc][Ss][Ee][Xx][Ee][Cc]*)
    pivot_on: host
    window: 4h
  - name: Recon commands run on the host
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(*whoami* OR *ipconfig* OR *nltest* OR *systeminfo* OR *tasklist* OR *net*group*)
    pivot_on: host
    window: 4h
  - name: Credential material accessed or dumped
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(*lsass* OR *procdump* OR *comsvcs* OR *sekurlsa* OR *ntds* OR *reg*save*)
    pivot_on: host
    window: 6h
