name: Renamed Gpg.EXE Execution
id: ec0722a3-eb5c-4a56-8ab2-bf6f20708592
version: 1
schema_version: "1.0"
date: "2023-08-09"
author: Nasreddine Bencherchali (Nextron Systems), frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: ec0722a3-eb5c-4a56-8ab2-bf6f20708592
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of a renamed "gpg.exe". Often used by ransomware and
  loaders to decrypt/encrypt data. MITRE ATT&CK: T1486.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - term:
            data_win_eventdata_originalFileName:
              value: "gpg.exe"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\gpg.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\gpg2.exe"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_originalFileName
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_originalFileName equals
  'gpg.exe'; data_win_eventdata_image matches '*\gpg.exe';
  data_win_eventdata_image matches '*\gpg2.exe'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://securelist.com/locked-out/68960/
  - https://attack.mitre.org/techniques/T1486/

response:
  message: >
    Renamed Gpg.EXE Execution detected on host $agent_name$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1486
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_originalFileName
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1486
  custom_tags:
    - renamed
    - process_creation
    - sysmon
    - impact
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_originalFileName:/[Gg][Pp][Gg]\.[Ee][Xx][Ee]/ AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/.*\\[Gg][Pp][Gg]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Gg][Pp][Gg]2\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 550bbb84-ce5d-4e61-84ad-e590f0024dcd
    name: File Encryption Using Gpg4win
    reason: Same binary encrypting files under its real name; ransomware/exfil protection use.
  - id: 037dcd71-33a8-4392-bb01-293c94663e5a
    name: File Decryption Using Gpg4win
    reason: Decrypting loader payloads is the other known abuse of renamed gpg.
  - id: e1e0b7d7-e10b-4ee4-ac49-a4bda05d320d
    name: File Encryption/Decryption Via Gpg4win From Suspicious Locations
    reason: Gpg run from temp/user paths indicates malicious use.
  - id: 77df53a5-1d78-4f32-bc5a-0e7465bd8f41
    name: Portable Gpg.EXE Execution
    reason: Portable gpg dropped on the host is the delivery precursor.
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: Ransomware deletes recovery points around encryption.
  - id: c9fbe8e9-119d-40a6-9b59-dd58a5d84429
    name: Potential Ransomware or Unauthorized MBR Tampering Via Bcdedit.EXE
    reason: Recovery disabling accompanies ransomware encryption stages.
  - id: 9fbf5927-5261-4284-a71d-f681029ea574
    name: Compress Data and Lock With Password for Exfiltration With 7-ZIP
    reason: Staging/encrypting data before exfiltration.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: gpg encrypt/decrypt arguments
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(--batch|--passphrase|--decrypt|--symmetric|--encrypt|--recipient).*/
    pivot_on: host
    window: 4h
  - name: Encrypted-extension files written
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\.(gpg|pgp|asc|locked|encrypted|enc)$/
    pivot_on: host
    window: 4h
  - name: Recovery inhibition commands
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(vssadmin.*delete|wmic.*shadowcopy.*delete|bcdedit.*recoveryenabled|wbadmin.*delete|cipher.*\/w).*/
    pivot_on: host
    window: 4h
  - name: Ransom note files created
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*([Rr]ead[Mm]e|[Dd]ecrypt|[Rr]ecover|[Rr]ansom).*\.(txt|html|hta)$/
    pivot_on: host
    window: 6h
  - name: Outbound transfers after encryption
    query: data_win_system_eventID:3 AND data_win_eventdata_initiated:true AND NOT data_win_eventdata_destinationIp:(10.* OR 192.168.* OR 127.*)
    pivot_on: host
    window: 6h
