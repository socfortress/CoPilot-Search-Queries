name: WinRAR Execution in Non-Standard Folder
id: 4ede543c-e098-43d9-a28f-dd784a13132f
version: 1
schema_version: "1.0"
date: "2025-07-16"
author: Florian Roth (Nextron Systems), Tigzy
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 4ede543c-e098-43d9-a28f-dd784a13132f
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a suspicious WinRAR execution in a folder which is not the default
  installation folder. MITRE ATT&CK: T1560.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\rar.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\winrar.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_description:
                    value: "Command line RAR"
                    case_insensitive: true
              - term:
                  data_win_eventdata_description:
                    value: "WinRAR"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\UnRAR.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*:\\\\Program Files (x86)\\\\WinRAR\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*:\\\\Program Files\\\\WinRAR\\\\*"
                          case_insensitive: true
                  minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*:\\\\Windows\\\\Temp\\\\*"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_description
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches '*\rar.exe';
  data_win_eventdata_image matches '*\winrar.exe';
  data_win_eventdata_description equals 'Command line RAR', among other
  conditions.

known_false_positives: >
  Legitimate use of WinRAR in a folder of a software that bundles WinRAR.
  Baseline expected activity in your environment and tune this detection before
  relying on it for automated response.

references:
  - https://twitter.com/cyb3rops/status/1460978167628406785
  - https://attack.mitre.org/techniques/T1560/001/

response:
  message: >
    WinRAR Execution in Non-Standard Folder detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_description: $data_win_eventdata_description$. MITRE
    ATT&CK: T1560.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_description
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1560.001
  custom_tags:
    - winrar
    - standard
    - folder
    - process_creation
    - sysmon
    - collection
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Rr][Aa][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Rr][Aa][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_description:/[Cc][Oo][Mm][Mm][Aa][Nn][Dd] [Ll][Ii][Nn][Ee] [Rr][Aa][Rr]/ OR data_win_eventdata_description:/[Ww][Ii][Nn][Rr][Aa][Rr]/) AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/.*\\[Uu][Nn][Rr][Aa][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Ww][Ii][Nn][Rr][Aa][Rr]\\.*/ OR data_win_eventdata_image:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Ww][Ii][Nn][Rr][Aa][Rr]\\.*/) AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 1b7bfb2c-b8e6-11eb-99ac-acde48001122
    name: Detect Renamed WinRAR
    reason: A rar binary in an odd folder is often also renamed; same portable-archiver evasion.
  - id: fcdf69e5-a3d3-452a-9724-26f2308bf2b1
    name: Phishing Pattern ISO in Archive
    reason: Archive-based phishing delivery is a common source of an out-of-place portable WinRAR.
  - id: 2ddef153-167b-4e89-86b6-757a9e65dcac
    name: File Download Via Bitsadmin To A Suspicious Target Folder
    reason: 'Precursor: portable rar.exe is often downloaded to temp/public folders by bitsadmin.'
  - id: 19b08b1c-861d-4e75-a1ef-ea0c1baf202b
    name: Suspicious Download Via Certutil.EXE
    reason: 'Precursor: certutil downloads of rar.exe into non-standard paths.'
  - id: 9fbf5927-5261-4284-a71d-f681029ea574
    name: Compress Data and Lock With Password for Exfiltration With 7-ZIP
    reason: 'Parallel behaviour: password-protected staging archive with an alternative archiver.'
  - id: windows-archive-collected-data-via-rar-001
    name: Windows Archive Collected Data via Rar
    reason: 'Co-occurring: the out-of-place rar is archiving collected data for staging.'
  - id: 1ac14d38-3dfc-4635-92c7-e3fd1c5f5bfc
    name: Winrar Compressing Dump Files
    reason: 'Escalation: if the rar archives .dmp files this is credential-dump exfiltration.'
  - id: e37db05d-d1f9-49c8-b464-cee1a4b11638
    name: PUA - Rclone Execution
    reason: 'Follow-on: the staged archive is then uploaded with rclone.'
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Archives created by rar/WinRAR
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*\\([Rr][Aa][Rr]|[Ww][Ii][Nn][Rr][Aa][Rr])\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 6h
  - name: rar with password or recursive flags
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Rr][Aa][Rr]|[Ww][Ii][Nn][Rr][Aa][Rr])\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*( -[Hh][Pp]| a .* -[Rr]).*/
    pivot_on: host
    window: 6h
  - name: Downloads of archiver binaries
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Rr][Aa][Rr]|[Ww][Ii][Nn][Rr][Aa][Rr])\.[Ee][Xx][Ee].*/ AND data_win_eventdata_image:/.*\\([Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]|[Cc][Uu][Rr][Ll]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll])\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 6h
  - name: Bulk copy / collection commands
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Xx][Cc][Oo][Pp][Yy]|[Rr][Oo][Bb][Oo][Cc][Oo][Pp][Yy])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Rr] .*\/[Ss].*/)
    pivot_on: host
    window: 6h
  - name: Exfil tooling after archiving
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Rr][Cc][Ll][Oo][Nn][Ee]|[Ww][Ii][Nn][Ss][Cc][Pp]|[Pp][Ss][Cc][Pp]|[Mm][Ee][Gg][Aa][Cc][Mm][Dd]|[Cc][Uu][Rr][Ll])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Ii][Nn][Vv][Oo][Kk][Ee]-[Rr][Ee][Ss][Tt][Mm][Ee][Tt][Hh][Oo][Dd]|[Ss][Tt][Aa][Rr][Tt]-[Bb][Ii][Tt][Ss][Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr]|[Pp][Aa][Ss][Tt][Ee][Bb][Ii][Nn]|[Mm][Ee][Gg][Aa]\.[Nn][Zz]).*/)
    pivot_on: host
    window: 6h
