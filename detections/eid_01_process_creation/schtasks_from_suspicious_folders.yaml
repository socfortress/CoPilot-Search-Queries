name: Schtasks From Suspicious Folders
id: 8a8379b8-780b-4dbf-b1e9-31c8d112fefb
version: 1
schema_version: "1.0"
date: "2022-11-18"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 8a8379b8-780b-4dbf-b1e9-31c8d112fefb
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects scheduled task creations that have suspicious action command and
  folder combinations. MITRE ATT&CK: T1053.005.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\schtasks.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "schtasks.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* /create *"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*powershell*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*pwsh*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*cmd /c *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*cmd /k *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*cmd /r *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*cmd.exe /c *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*cmd.exe /k *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*cmd.exe /r *"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*C:\\\\ProgramData\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*%ProgramData%*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\schtasks.exe'; data_win_eventdata_originalFileName equals 'schtasks.exe';
  data_win_eventdata_commandLine matches '* /create *', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://symantec-enterprise-blogs.security.com/blogs/threat-intelligence/lazarus-dream-job-chemical
  - https://attack.mitre.org/techniques/T1053/005/

response:
  message: >
    Schtasks From Suspicious Folders detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1053.005
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1053.005
  custom_tags:
    - schtasks
    - folders
    - process_creation
    - sysmon
    - privilege_escalation
    - persistence
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.* \/[Cc][Rr][Ee][Aa][Tt][Ee] .*/ AND (data_win_eventdata_commandLine:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Pp][Ww][Ss][Hh].*/ OR data_win_eventdata_commandLine:/.*[Cc][Mm][Dd] \/[Cc] .*/ OR data_win_eventdata_commandLine:/.*[Cc][Mm][Dd] \/[Kk] .*/ OR data_win_eventdata_commandLine:/.*[Cc][Mm][Dd] \/[Rr] .*/ OR data_win_eventdata_commandLine:/.*[Cc][Mm][Dd]\.[Ee][Xx][Ee] \/[Cc] .*/ OR data_win_eventdata_commandLine:/.*[Cc][Mm][Dd]\.[Ee][Xx][Ee] \/[Kk] .*/ OR data_win_eventdata_commandLine:/.*[Cc][Mm][Dd]\.[Ee][Xx][Ee] \/[Rr] .*/) AND (data_win_eventdata_commandLine:/.*[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_commandLine:/.*%[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]%.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 81325ce1-be01-4250-944f-b4789644556f
    name: Schedule Task Creation From Env Variable Or Potentially Suspicious Path Via Schtasks.EXE
    reason: Overlapping suspicious-path task creation; corroborates
  - id: c5c00f49-b3f9-45a6-997e-cfdecc6e1967
    name: Suspicious Schtasks Execution AppData Folder
    reason: Variant with AppData path actions
  - id: 39019a4e-317f-4ce3-ae63-309a8c6b53c5
    name: Suspicious Scheduled Task Creation Involving Temp Folder
    reason: Variant with Temp path actions
  - id: f2c64357-b1d2-41b7-849f-34d2682c0fad
    name: Suspicious Command Patterns In Scheduled Task Creation
    reason: Suspicious shell patterns in task action
  - id: 89ca78fd-b37c-4310-b3d3-81a023f83936
    name: Schtasks Creation Or Modification With SYSTEM Privileges
    reason: Task also runs as SYSTEM raises impact
  - id: 80e1f67a-4596-4351-98f5-a9c3efabac95
    name: Suspicious Scheduled Task Write to System32 Tasks
    reason: Task file written, confirming creation
  - id: 424273ea-7cf8-43a6-b712-375f925e481f
    name: Scheduled Task Executed From A Suspicious Location
    reason: 'Follow-on: task executes from the suspicious folder'
  - id: 2aa0a6b4-a865-495b-ab51-c28249537b75
    name: Startup Folder File Write
    reason: Alternate persistence often dropped alongside the task
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: schtasks create with shell or script action
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss]chtasks\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*\/[Cc]reate.*/ AND (data_win_eventdata_commandLine:/.*[Pp]ower[Ss]hell.*/ OR data_win_eventdata_commandLine:/.*[Cc]md.*/ OR data_win_eventdata_commandLine:/.*[Ww]script.*/ OR data_win_eventdata_commandLine:/.*[Mm]shta.*/)
    pivot_on: host
    window: 6h
  - name: Executables or scripts written to ProgramData/Public/Temp
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\[Pp]rogram[Dd]ata\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Uu]sers\\[Pp]ublic\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Tt]emp\\.*/) AND data_win_eventdata_targetFilename:/.*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Pp][Ss]1|[Bb][Aa][Tt]|[Vv][Bb][Ss]|[Jj][Ss])/
    pivot_on: host
    window: 2h
  - name: Task Scheduler launching processes from user-writable folders
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ss]vchost\.[Ee][Xx][Ee]|.*\\[Tt]askeng\.[Ee][Xx][Ee]/ AND (data_win_eventdata_image:/.*\\[Pp]rogram[Dd]ata\\.*/ OR data_win_eventdata_image:/.*\\[Aa]pp[Dd]ata\\.*/ OR data_win_eventdata_image:/.*\\[Tt]emp\\.*/)
    pivot_on: host
    window: 24h
  - name: Hidden or encoded PowerShell launches
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND (data_win_eventdata_commandLine:/.*-[Ee]nc.*/ OR data_win_eventdata_commandLine:/.*-[Ww]indow[Ss]tyle [Hh]idden.*/ OR data_win_eventdata_commandLine:/.*-[Ww] [Hh]idden.*/)
    pivot_on: host
    window: 6h
