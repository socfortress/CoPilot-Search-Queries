name: Windows Archive Collected Data via Rar
id: windows-archive-collected-data-via-rar-001
version: 1
schema_version: "1.0"
date: "2026-03-03"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  Detects execution of Rar.exe with specific archiving flags (-ep1, -r, -y, 
  -v5m, -m1) used for data collection and staging. DarkGate, Salt Typhoon, 
  and APT37 use RAR to compress and exfiltrate collected data from 
  compromised hosts to C2 servers.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image: "*\\Rar.exe"
              - term:
                  data_win_eventdata_originalFileName: "Rar.exe"
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine: "* a *"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine: "*-ep1*"
              - wildcard:
                  data_win_eventdata_commandLine: "*-r*"
              - wildcard:
                  data_win_eventdata_commandLine: "*-y*"
            minimum_should_match: 2
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    type: string
    required: true
    example: "lab"
  START_TIME:
    type: datetime
    default: "now-24h"
  END_TIME:
    type: datetime
    default: "now"

how_to_implement: >
  Requires Sysmon EventID 1 with full command-line logging.

known_false_positives: >
  Users and administrators may use Rar.exe for legitimate archiving. 
  Investigate context — bulk archiving from sensitive directories is suspicious.

references:
  - https://malpedia.caad.fkie.fraunhofer.de/details/win.darkgate
  - https://attack.mitre.org/techniques/T1560/001/

response:
  message: >
    RAR archiving detected on $agent_name$. 
    Command: $data_win_eventdata_commandLine$. 
    Parent: $data_win_eventdata_parentImage$. 
    User: $data_win_eventdata_user$. 
    Possible data exfiltration staging. MITRE ATT&CK: T1560.001
  risk_score: 49
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 49
  threat_objects: []

tags:
  analytic_story:
    - DarkGate Malware
    - Salt Typhoon
    - APT37 Rustonotto and FadeStealer
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1560.001
  custom_tags:
    - rar_archiving
    - data_collection
    - exfiltration_staging
    - collection
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\\\Rar\.exe/ OR data_win_eventdata_originalFileName:"Rar.exe") AND data_win_eventdata_commandLine:/.* a .*/ AND (data_win_eventdata_commandLine:/.*-ep1.*/ OR data_win_eventdata_commandLine:/.*-r.*/ OR data_win_eventdata_commandLine:/.*-y.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: faa48cae-6b25-4f00-a094-08947fef582f
    name: Rar Usage with Password and Compression Level
    reason: Same RAR staging tradecraft; password-protected archives indicate deliberate exfil prep.
  - id: 1b7bfb2c-b8e6-11eb-99ac-acde48001122
    name: Detect Renamed WinRAR
    reason: Attackers rename rar.exe to dodge image-name rules; a renamed copy on the same host confirms staging.
  - id: 9fbf5927-5261-4284-a71d-f681029ea574
    name: Compress Data and Lock With Password for Exfiltration With 7-ZIP
    reason: Alternate archiver for the same collect-then-compress stage.
  - id: 7d1aaf3d-4304-425c-b7c3-162055e0b3ab
    name: Potential Data Exfiltration Activity Via CommandLine Tools
    reason: Exfil follows archiving; this catches transfer of the staged archive.
  - id: 32e0baea-b3f1-11eb-a2ce-acde48001122
    name: Detect RClone Command-Line Usage
    reason: Rclone is a common tool to ship the archive to cloud storage after staging.
  - id: e328cc73-f92a-42fb-b3fa-7c2cffda981a
    name: Curl File Upload To File Sharing Websites
    reason: Upload of the produced archive to a sharing site is the next exfil step.
  - id: f576a613-2392-4067-9d1a-9345fb58d8d1
    name: Automated Collection Command Prompt
    reason: Scripted file collection typically precedes archiving of the gathered data.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other archiver executions
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*[Ww]inrar.*/ OR data_win_eventdata_commandLine:/.*7z[a]?\.exe.*/ OR data_win_eventdata_commandLine:/.*[Cc]ompress-[Aa]rchive.*/ OR data_win_eventdata_commandLine:/.*[Ww]inzip.*/)
    pivot_on: host
    window: 6h
  - name: Bulk file collection before archiving
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*([Rr]obocopy|[Xx]copy|findstr).*/ OR data_win_eventdata_commandLine:/.*[Cc]opy\s.*(docx|xlsx|pdf|pst).*/)
    pivot_on: host
    window: 6h
  - name: Exfil tooling and uploads
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:*\\rclone.exe OR data_win_eventdata_image:*\\curl.exe OR data_win_eventdata_image:*\\pscp.exe OR data_win_eventdata_image:*\\winscp.com OR data_win_eventdata_commandLine:/.*([Ii]nvoke-[Ww]eb[Rr]equest|[Ss]tart-[Bb]its[Tt]ransfer).*/)
    pivot_on: host
    window: 6h
  - name: Outbound connections by archive or exfil processes
    query: data_win_system_eventID:3 AND (data_win_eventdata_image:*\\rclone.exe OR data_win_eventdata_image:*\\curl.exe OR data_win_eventdata_image:*\\rar.exe OR data_win_eventdata_image:*\\7z.exe)
    pivot_on: host
    window: 6h
