name: Network Reconnaissance Activity
id: e6313acd-208c-44fc-a0ff-db85d572e90e
version: 1
schema_version: "1.0"
date: "2022-02-07"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: e6313acd-208c-44fc-a0ff-db85d572e90e
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a set of suspicious network related commands often used in recon
  stages. MITRE ATT&CK: T1087, T1082.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*nslookup*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*_ldap._tcp.dc._msdcs.*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*nslookup*'; data_win_eventdata_commandLine matches
  '*_ldap._tcp.dc._msdcs.*'.

known_false_positives: >
  False positives depend on scripts and administrative tools used in the
  monitored environment. Baseline expected activity in your environment and tune
  this detection before relying on it for automated response.

references:
  - https://thedfirreport.com/2022/02/07/qbot-likes-to-move-it-move-it/
  - https://attack.mitre.org/techniques/T1087/
  - https://attack.mitre.org/techniques/T1082/

response:
  message: >
    Network Reconnaissance Activity detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1087,
    T1082
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1087
    - T1082
  custom_tags:
    - network
    - reconnaissance
    - process_creation
    - sysmon
    - discovery
    - car_2016_03_001
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Nn][Ss][Ll][Oo][Oo][Kk][Uu][Pp].*/ AND data_win_eventdata_commandLine:/.*_[Ll][Dd][Aa][Pp]\._[Tt][Cc][Pp]\.[Dd][Cc]\._[Mm][Ss][Dd][Cc][Ss]\..*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 41243735-89a7-4c83-bcdd-570aa78f00a1
    name: Domain Controller Discovery with Nltest
    reason: nslookup of _ldap._tcp.dc._msdcs is DC discovery; nltest /dclist is the sibling method.
  - id: c3e05466-5f22-11eb-ae93-0242ac130002
    name: NLTest Domain Trust Discovery
    reason: Follows DC location with trust enumeration to find other domains.
  - id: cc316032-924a-11eb-91a2-acde48001122
    name: DSQuery Domain Discovery
    reason: Once the DC is known, the attacker queries AD directly.
  - id: d95de845-b83c-4a9a-8a6a-4fc802ebf6c0
    name: Suspicious Group And Account Reconnaissance Activity Using Net.EXE
    reason: Account/group enumeration commonly follows DC discovery.
  - id: a0bdd2f6-c2ff-11eb-b918-acde48001122
    name: Detect SharpHound Command-Line Arguments
    reason: DC lookup is the first step before BloodHound/SharpHound collection.
  - id: 2cf5cc25-f39a-436d-a790-4857e5995ede
    name: Network Connection Discovery With Netstat
    reason: Local connection mapping runs in the same recon batch.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: DC discovery via nltest, dsquery or net group
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Nn][Ll][Tt][Ee][Ss][Tt].*(dclist|dsgetdc|domain_trusts).*/ OR data_win_eventdata_image:/.*\\[Dd][Ss][Qq][Uu][Ee][Rr][Yy]\.exe/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt]1? +group.*[Dd]omain.*/)
    pivot_on: host
    window: 4h
  - name: BloodHound/SharpHound AD collection
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ss]harp[Hh]ound.*/ OR data_win_eventdata_commandLine:/.*([Ss]harp[Hh]ound|[Bb]lood[Hh]ound|[Cc]ollection[Mm]ethod).*/)
    pivot_on: host
    window: 6h
  - name: Local host and network discovery batch
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ii][Pp][Cc][Oo][Nn][Ff][Ii][Gg].*/ OR data_win_eventdata_commandLine:/.*[Ss][Yy][Ss][Tt][Ee][Mm][Ii][Nn][Ff][Oo].*/ OR data_win_eventdata_commandLine:/.*[Ww][Hh][Oo][Aa][Mm][Ii].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ll][Tt][Ee][Ss][Tt].*/)
    pivot_on: host
    window: 2h
  - name: PowerShell AD cmdlets (Get-ADComputer/User/Group)
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Gg][Ee][Tt]-[Aa][Dd]([Cc]omputer|[Uu]ser|[Gg]roup).*/
    pivot_on: user
    window: 6h
  - name: Lateral movement tooling to discovered hosts
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Pp][Ss][Ee][Xx][Ee][Cc].*\.exe/ OR data_win_eventdata_commandLine:/.*[Ww][Mm][Ii][Cc].*\/node:.*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss].*\/[Ss] .*/)
    pivot_on: host
    window: 6h
