name: CreateDump Process Dump
id: 515c8be5-e5df-4c5e-8f6d-a4a2f05e4b48
version: 1
schema_version: "1.0"
date: "2022-08-19"
author: Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 515c8be5-e5df-4c5e-8f6d-a4a2f05e4b48
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects uses of the createdump.exe LOLOBIN utility to dump process memory.
  MITRE ATT&CK: T1036, T1003.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\createdump.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "FX_VER_INTERNALNAME_STR"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -u *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* --full *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -f *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* --name *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.dmp *"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\createdump.exe'; data_win_eventdata_originalFileName equals
  'FX_VER_INTERNALNAME_STR'; data_win_eventdata_commandLine matches '* -u *',
  among other conditions.

known_false_positives: >
  Command lines that use the same flags. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://www.crowdstrike.com/blog/overwatch-exposes-aquatic-panda-in-possession-of-log-4-shell-exploit-tools/
  - https://twitter.com/bopin2020/status/1366400799199272960
  - https://attack.mitre.org/techniques/T1036/
  - https://attack.mitre.org/techniques/T1003/001/

response:
  message: >
    CreateDump Process Dump detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1036, T1003.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1036
    - T1003.001
  custom_tags:
    - createdump
    - process_creation
    - sysmon
    - stealth
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Cc][Rr][Ee][Aa][Tt][Ee][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ff][Xx]_[Vv][Ee][Rr]_[Ii][Nn][Tt][Ee][Rr][Nn][Aa][Ll][Nn][Aa][Mm][Ee]_[Ss][Tt][Rr]/) AND (data_win_eventdata_commandLine:/.* -[Uu] .*/ OR data_win_eventdata_commandLine:/.* --[Ff][Uu][Ll][Ll] .*/ OR data_win_eventdata_commandLine:/.* -[Ff] .*/ OR data_win_eventdata_commandLine:/.* --[Nn][Aa][Mm][Ee] .*/ OR data_win_eventdata_commandLine:/.*\.[Dd][Mm][Pp] .*/)

