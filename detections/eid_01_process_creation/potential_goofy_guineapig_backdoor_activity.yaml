name: Potential Goofy Guineapig Backdoor Activity
id: 477a5ed3-a374-4282-9f3b-ed94e159a108
version: 1
schema_version: "1.0"
date: "2023-05-14"
author: X__Junior (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 477a5ed3-a374-4282-9f3b-ed94e159a108
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a specific broken command that was used by Goofy-Guineapig as
  described by the NCSC report.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*choice /t %d /d y /n >nul*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*choice /t %d /d y /n >nul*'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.ncsc.gov.uk/static-assets/documents/malware-analysis-reports/goofy-guineapig/NCSC-MAR-Goofy-Guineapig.pdf

response:
  message: >
    Potential Goofy Guineapig Backdoor Activity detected on host $agent_name$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - goofy
    - guineapig
    - backdoor
    - process_creation
    - sysmon
    - execution
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Cc][Hh][Oo][Ii][Cc][Ee] \/[Tt] %[Dd] \/[Dd] [Yy] \/[Nn] \>[Nn][Uu][Ll].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: bdbab15a-3826-48fa-a1b7-723cd8f32fcc
    name: Potential Goofy Guineapig GoolgeUpdate Process Anomaly
    reason: 'Same backdoor: GoogleUpdate.exe relaunching itself from an unusual path is the loader stage around this self-delete command.'
  - id: 84b1ecf9-6eff-4004-bafb-bae5c0e251b2
    name: Potentially Suspicious GoogleUpdate Child Process
    reason: The backdoor masquerades as GoogleUpdate; suspicious children confirm the hijacked updater.
  - id: 54786ddc-5b8a-11ed-9b6a-0242ac120002
    name: Suspicious Ping/Del Command Combination
    reason: Same delay-then-delete self-removal pattern malware uses to erase its dropper.
  - id: windows-process-deleting-its-process-file-path-001
    name: Windows Process Deleting Its Process File Path
    reason: Confirms the implant removed its own binary, matching the self-delete command.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: GoogleUpdate executions outside Google paths
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Gg]oogle[Uu]pdate\.[Ee][Xx][Ee]/ AND NOT data_win_eventdata_image:/[Cc]:\\[Pp]rogram [Ff]iles.*\\[Gg]oogle.*/
    pivot_on: host
    window: 24h
  - name: Self-delete via choice/ping then del
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Hh][Oo][Ii][Cc][Ee] \/[Tt].*[Dd][Ee][Ll].*/ OR data_win_eventdata_commandLine:/.*[Pp][Ii][Nn][Gg].*[Nn][Uu][Ll].*[Dd][Ee][Ll].*/)
    pivot_on: host
    window: 6h
  - name: Files created in AppData Google Update path
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\[Aa]pp[Dd]ata\\[Ll]ocal\\[Gg]oogle\\[Uu]pdate.*/
    pivot_on: host
    window: 24h
  - name: Scheduled task persistence creation
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss].*\/[Cc][Rr][Ee][Aa][Tt][Ee].*/
    pivot_on: host
    window: 24h
