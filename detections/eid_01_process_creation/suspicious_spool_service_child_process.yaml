name: Suspicious Spool Service Child Process
id: dcdbc940-0bff-46b2-95f3-2d73f848e33b
version: 1
schema_version: "1.0"
date: "2024-12-01"
author: Justin C. (@endisphotic), @dreadphones (detection), Thomas Patzke (Sigma rule)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: dcdbc940-0bff-46b2-95f3-2d73f848e33b
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious print spool service (spoolsv.exe) child processes. MITRE
  ATT&CK: T1203, T1068.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_parentImage:
              value: "*\\\\spoolsv.exe"
              case_insensitive: true
        - bool:
            should:
              - term:
                  data_win_eventdata_integrityLevel:
                    value: "System"
                    case_insensitive: true
              - term:
                  data_win_eventdata_integrityLevel:
                    value: "S-1-16-16384"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\gpupdate.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\whoami.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\nltest.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\taskkill.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\wmic.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\taskmgr.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\sc.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\findstr.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\curl.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\wget.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\certutil.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\bitsadmin.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\accesschk.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\wevtutil.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\bcdedit.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\fsutil.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\cipher.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\schtasks.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\write.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\wuauclt.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\systeminfo.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\reg.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\query.exe"
                    case_insensitive: true
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\net.exe"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\net1.exe"
                                case_insensitive: true
                        minimum_should_match: 1
                    - exists:
                        field: "data_win_eventdata_commandLine"
                    - bool:
                        must_not:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*start*"
                                case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\cmd.exe"
                          case_insensitive: true
                    - exists:
                        field: "data_win_eventdata_commandLine"
                    - bool:
                        must_not:
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_commandLine:
                                      value: "*.spl*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_commandLine:
                                      value: "*route add*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_commandLine:
                                      value: "*program files*"
                                      case_insensitive: true
                              minimum_should_match: 1
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\netsh.exe"
                          case_insensitive: true
                    - exists:
                        field: "data_win_eventdata_commandLine"
                    - bool:
                        must_not:
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_commandLine:
                                      value: "*add portopening*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_commandLine:
                                      value: "*rule name*"
                                      case_insensitive: true
                              minimum_should_match: 1
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\powershell.exe"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\pwsh.exe"
                                case_insensitive: true
                        minimum_should_match: 1
                    - exists:
                        field: "data_win_eventdata_commandLine"
                    - bool:
                        must_not:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*.spl*"
                                case_insensitive: true
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\rundll32.exe"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_originalFileName:
                                value: "RUNDLL32.EXE"
                                case_insensitive: true
                        minimum_should_match: 1
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*rundll32.exe"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_integrityLevel
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_originalFileName
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\spoolsv.exe'; data_win_eventdata_integrityLevel equals 'System';
  data_win_eventdata_integrityLevel equals 'S-1-16-16384', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/microsoft/Microsoft-365-Defender-Hunting-Queries/blob/efa17a600b43c897b4b7463cc8541daa1987eeb4/Exploits/Print%20Spooler%20RCE/Suspicious%20Spoolsv%20Child%20Process.md
  - https://attack.mitre.org/techniques/T1203/
  - https://attack.mitre.org/techniques/T1068/

response:
  message: >
    Suspicious Spool Service Child Process detected on host $agent_name$.
    Matched data_win_eventdata_parentImage: $data_win_eventdata_parentImage$.
    Matched data_win_eventdata_integrityLevel:
    $data_win_eventdata_integrityLevel$. MITRE ATT&CK: T1203, T1068
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_integrityLevel
      type: other

