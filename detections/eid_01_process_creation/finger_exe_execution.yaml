name: Finger.EXE Execution
id: af491bca-e752-4b44-9c86-df5680533dbc
version: 1
schema_version: "1.0"
date: "2024-06-27"
author: Florian Roth (Nextron Systems), omkar72, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: af491bca-e752-4b44-9c86-df5680533dbc
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of the "finger.exe" utility. Finger.EXE or "TCPIP Finger
  Command" is an old utility that is still present on modern Windows
  installation. It Displays information about users on a specified remote
  computer (typically a UNIX computer) that is running the finger service or
  daemon. Due to the old nature of this utility and the rareness of machines
  having the finger service. Any execution of "finger.exe" can be considered
  "suspicious" and worth investigating. MITRE ATT&CK: T1105.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - term:
                  data_win_eventdata_originalFileName:
                    value: "finger.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\finger.exe"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_originalFileName
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_originalFileName equals
  'finger.exe'; data_win_eventdata_image matches '*\finger.exe'.

known_false_positives: >
  Admin activity (unclear what they do nowadays with finger.exe). Baseline
  expected activity in your environment and tune this detection before relying
  on it for automated response.

references:
  - https://twitter.com/bigmacjpg/status/1349727699863011328?s=12
  - https://app.any.run/tasks/40115012-a919-4208-bfed-41e82cb3dadf/
  - http://hyp3rlinx.altervista.org/advisories/Windows_TCPIP_Finger_Command_C2_Channel_and_Bypassing_Security_Software.txt
  - https://attack.mitre.org/techniques/T1105/

response:
  message: >
    Finger.EXE Execution detected on host $agent_name$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1105
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_originalFileName
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1105
  custom_tags:
    - finger
    - process_creation
    - sysmon
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_originalFileName:/[Ff][Ii][Nn][Gg][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ff][Ii][Nn][Gg][Ee][Rr]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 21dd6d38-2b18-4453-9404-a0fe4a0cc288
    name: Curl Download And Execute Combination
    reason: Finger output is often piped to cmd for payload fetch; curl download-and-exec is the sibling LOLBin abuse.
  - id: d059842b-6b9d-4ed1-b5c3-5b89143c6ede
    name: File Download Via Bitsadmin
    reason: Alternative LOLBin file transfer (bitsadmin) used by the same operators to stage tooling.
  - id: 8e0bb260-d4b2-4fff-bb8d-3f82118e6892
    name: Potentially Suspicious CMD Shell Output Redirect
    reason: Finger payload retrieval is typically piped/redirected through cmd; suspicious shell redirection corroborates.
  - id: de587dce-915e-4218-aac4-835ca6af6f70
    name: Potential Persistence Attempt Via Run Keys Using Reg.EXE
    reason: Persistence set by the retrieved payload follows the finger-based download.
  - id: 2452e632-9e0d-11eb-bacd-acde48001122
    name: DNS Exfiltration Using Nslookup App
    reason: Finger and nslookup are both abused as covert data channels for retrieval/exfiltration.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Finger piped into a shell or interpreter
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*[Ff]inger.*\|.*(cmd|powershell|sh).*/
    pivot_on: host
    window: 2h
  - name: Finger to remote host over TCP/79
    query: data_win_system_eventID:3 AND data_win_eventdata_destinationPort:79
    pivot_on: host
    window: 2h
  - name: Child processes spawned by finger.exe
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*\\finger\.exe/
    pivot_on: host
    window: 2h
  - name: Other LOLBin download tools
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(certutil.*urlcache|bitsadmin.*transfer|curl.*http|Invoke-WebRequest|DownloadString).*/
    pivot_on: host
    window: 4h
  - name: Executables created in user-writable paths
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Bb][Aa][Tt]|[Pp][Ss]1)/ AND data_win_eventdata_targetFilename:/.*(Temp|Public|ProgramData|AppData).*/
    pivot_on: host
    window: 4h
