name: Copy .DMP/.DUMP Files From Remote Share Via Cmd.EXE
id: 044ba588-dff4-4918-9808-3f95e8160606
version: 1
schema_version: "1.0"
date: "2023-09-12"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 044ba588-dff4-4918-9808-3f95e8160606
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects usage of the copy builtin cmd command to copy files with the
  ".dmp"/".dump" extension from a remote share.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\cmd.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "Cmd.Exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*copy *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine: "* \\\\\\\\*"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.dmp*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.dump*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.hdmp*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches '*\cmd.exe';
  data_win_eventdata_originalFileName equals 'Cmd.Exe';
  data_win_eventdata_commandLine matches '*copy *', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://thedfirreport.com/2022/09/26/bumblebee-round-two/

response:
  message: >
    Copy .DMP/.DUMP Files From Remote Share Via Cmd.EXE detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  custom_tags:
    - share
    - process_creation
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Cc][Mm][Dd]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Cc][Oo][Pp][Yy] .*/ AND data_win_eventdata_commandLine:/.* \\\\.*/ AND (data_win_eventdata_commandLine:/.*\.[Dd][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*\.[Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*\.[Hh][Dd][Mm][Pp].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 2e65275c-8288-4ab4-aeb7-6274f58b6b20
    name: Procdump Execution
    reason: Procdump produces the .dmp files that are later staged/copied over the share
  - id: 646ea171-dded-4578-8a4d-65e9822892e3
    name: Process Memory Dump Via Comsvcs.DLL
    reason: comsvcs MiniDump creates process dumps that are then copied off the host
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: LSASS dump via comsvcs is the precursor producing the dump now copied from a share
  - id: 5afee48e-67dd-4e03-a783-f74259dcf998
    name: Potential LSASS Process Dump Via Procdump
    reason: Procdump against LSASS yields the dump file being collected
  - id: ec570e53-4c76-45a9-804d-dc3f355ff7a7
    name: 7Zip Compressing Dump Files
    reason: Dump files are often compressed with 7-Zip right after copying for exfiltration
  - id: 855bc8b5-2ae8-402e-a9ed-b889e6df1900
    name: Copy From Or To Admin Share Or Sysvol Folder
    reason: Admin-share copy activity is the same collection channel used for dumps
  - id: ea011323-7045-460b-b2d7-0f7442ea6b38
    name: Potential PsExec Remote Execution
    reason: PsExec remote execution commonly creates the dump on the remote host before collection
  - id: a29808fd-ef50-49ff-9c7a-59a9b040b404
    name: HackTool - Pypykatz Credentials Dumping Activity
    reason: Pypykatz parses collected LSASS dumps offline, the credential-theft follow-on
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Dump tool execution creating memory dumps
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]|[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]64\.[Ee][Xx][Ee]|[Ss][Qq][Ll][Dd][Uu][Mm][Pp][Ee][Rr]\.[Ee][Xx][Ee]|[Cc][Rr][Ee][Aa][Tt][Ee][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]|[Dd][Uu][Mm][Pp][Ee][Rr][Tt]\.[Ee][Xx][Ee]|[Nn][Aa][Nn][Oo][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee])/ OR data_win_eventdata_commandLine:/.*([Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll]|[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp]|[Ll][Ss][Aa][Ss][Ss]\.[Dd][Mm][Pp]).*/)
    pivot_on: host
    window: 6h
  - name: LSASS process access
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 6h
  - name: Dump file creation on disk
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.([Dd][Mm][Pp]|[Dd][Uu][Mm][Pp]|[Hh][Dd][Mm][Pp])/
    pivot_on: host
    window: 6h
  - name: Archiving or exfil tooling after collection
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\(7[Zz]\.[Ee][Xx][Ee]|7[Zz][Aa]\.[Ee][Xx][Ee]|[Rr][Aa][Rr]\.[Ee][Xx][Ee]|[Ww][Ii][Nn][Rr][Aa][Rr]\.[Ee][Xx][Ee]|[Tt][Aa][Rr]\.[Ee][Xx][Ee]|[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]|[Rr][Cc][Ll][Oo][Nn][Ee]\.[Ee][Xx][Ee])/ OR data_win_eventdata_commandLine:/.*([Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]-[Aa][Rr][Cc][Hh][Ii][Vv][Ee]).*/)
    pivot_on: host
    window: 6h
  - name: Offline credential extraction tools
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Pp][Yy][Pp][Yy][Kk][Aa][Tt][Zz]|[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz]|[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa]|[Ll][Ss][Aa][Ss][Ss][Yy]).*/
    pivot_on: host
    window: 24h
