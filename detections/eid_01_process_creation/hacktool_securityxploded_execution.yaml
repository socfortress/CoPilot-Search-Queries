name: HackTool - SecurityXploded Execution
id: 7679d464-4f74-45e2-9e01-ac66c5eb041a
version: 1
schema_version: "1.0"
date: "2023-02-04"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 7679d464-4f74-45e2-9e01-ac66c5eb041a
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: production
type: TTP

description: >
  Detects the execution of SecurityXploded Tools. MITRE ATT&CK: T1555.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - term:
                  data_win_eventdata_company:
                    value: "SecurityXploded"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*PasswordDump.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_originalFileName:
                    value: "*PasswordDump.exe"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_company
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_company equals
  'SecurityXploded'; data_win_eventdata_image matches '*PasswordDump.exe';
  data_win_eventdata_originalFileName matches '*PasswordDump.exe'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://securityxploded.com/
  - https://web.archive.org/web/20200601000524/https://cyberx-labs.com/blog/gangnam-industrial-style-apt-campaign-targets-korean-industrial-companies/
  - https://attack.mitre.org/techniques/T1555/

response:
  message: >
    HackTool - SecurityXploded Execution detected on host $agent_name$. Matched
    data_win_eventdata_company: $data_win_eventdata_company$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1555
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_company
      type: other
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1555
  custom_tags:
    - hacktool
    - securityxploded
    - process_creation
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_company:/[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy][Xx][Pp][Ll][Oo][Dd][Ee][Dd]/ OR data_win_eventdata_image:/.*[Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/.*[Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c2b86e67-b880-4eec-b045-50bc98ef4844
    name: HackTool - LaZagne Execution
    reason: LaZagne is the other mass password-recovery tool; both sweep browsers, mail, Wi-Fi and stored creds
  - id: 0685b176-c816-4837-8e7b-1216f346636b
    name: HackTool - Quarks PwDump Execution
    reason: Quarks PwDump extracts local hashes; commonly paired with application password recovery
  - id: fd877b94-9bb5-4191-bb25-d79cbd93c167
    name: Dumping of Sensitive Hives Via Reg.EXE
    reason: Registry hive saves are the offline route to the same local credential material
  - id: 6a69f62d-ce75-4b57-8dce-6351eb55b362
    name: Esentutl Steals Browser Information
    reason: Esentutl copy of browser stores is a native-binary alternative to SecurityXploded browser password recovery
  - id: fc028194-969d-4122-8abe-0470d5b8f12f
    name: Access to Browser Login Data
    reason: Direct access to browser Login Data is what the SecurityXploded browser recovery tools do
  - id: 42b1a5b8-353f-4f10-b256-39de4467faff
    name: Harvesting Of Wifi Credentials Via Netsh.EXE
    reason: Wi-Fi key harvesting via netsh is another stored-secret theft the SecurityXploded suite automates
  - id: 07f8bdc2-c9b3-472a-9817-5a670b872f53
    name: Potential Reconnaissance For Cached Credentials Via Cmdkey.EXE
    reason: Cached credential reconnaissance via cmdkey, the Credential Manager side of the same theft
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: Escalation to memory credential theft when stored-secret recovery is not enough
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Browser credential store access via command line
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ll][Oo][Gg][Ii][Nn] [Dd][Aa][Tt][Aa]|[Ll][Oo][Gg][Ii][Nn][Ss]\.[Jj][Ss][Oo][Nn]|[Kk][Ee][Yy]4\.[Dd][Bb]|[Ww][Ee][Bb] [Dd][Aa][Tt][Aa]|[Ll][Oo][Cc][Aa][Ll] [Ss][Tt][Aa][Tt][Ee]).*/
    pivot_on:
    - host
    window: 2h
  - name: Windows stored-secret enumeration (Wi-Fi keys, Credential Manager, Vault)
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ww][Ll][Aa][Nn] [Ss][Hh][Oo][Ww] [Pp][Rr][Oo][Ff][Ii][Ll][Ee].*[Kk][Ee][Yy]=[Cc][Ll][Ee][Aa][Rr]|[Cc][Mm][Dd][Kk][Ee][Yy] \/[Ll][Ii][Ss][Tt]|[Vv][Aa][Uu][Ll][Tt][Cc][Mm][Dd]).*/
    pivot_on:
    - host
    window: 2h
  - name: Registry hive saved for offline cracking
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Rr][Ee][Gg].* [Ss][Aa][Vv][Ee] .*([Ss][Aa][Mm]|[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]|[Ss][Yy][Ss][Tt][Ee][Mm]).*/
    pivot_on:
    - host
    window: 2h
  - name: Credential report files dropped by recovery tools
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*([Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd]|[Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll]).*\.([Tt][Xx][Tt]|[Cc][Ss][Vv]|[Xx][Mm][Ll]|[Hh][Tt][Mm][Ll]|[Hh][Tt][Mm])/
    pivot_on:
    - host
    window: 2h
  - name: Network and remote-interactive logons by this account
    query: data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"10")
    pivot_on:
    - user
    window: 6h
