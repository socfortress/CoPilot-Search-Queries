name: Execute Code with Pester.bat
id: 59e938ff-0d6d-4dc3-b13f-36cc28734d4e
version: 1
schema_version: "1.0"
date: "2023-11-09"
author: Julia Fomina, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 59e938ff-0d6d-4dc3-b13f-36cc28734d4e
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects code execution via Pester.bat (Pester - Powershell Modulte for
  testing). MITRE ATT&CK: T1059.001, T1216.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\powershell.exe"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\pwsh.exe"
                                case_insensitive: true
                        minimum_should_match: 1
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*Pester*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*Get-Help*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\cmd.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*pester*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine: "*;*"
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*help*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine: "*\\?*"
                        minimum_should_match: 1
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\powershell.exe'; data_win_eventdata_image matches '*\pwsh.exe';
  data_win_eventdata_commandLine matches '*Pester*', among other conditions.

known_false_positives: >
  Legitimate use of Pester for writing tests for Powershell scripts and modules.
  Baseline expected activity in your environment and tune this detection before
  relying on it for automated response.

references:
  - https://twitter.com/Oddvarmoe/status/993383596244258816
  - https://github.com/api0cradle/LOLBAS/blob/d148d278f5f205ce67cfaf49afdfb68071c7252a/OSScripts/pester.md
  - https://attack.mitre.org/techniques/T1059/001/
  - https://attack.mitre.org/techniques/T1216/

response:
  message: >
    Execute Code with Pester.bat detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1059.001, T1216
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
    - T1216
  custom_tags:
    - execute
    - pester
    - process_creation
    - sysmon
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (((data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Pp][Ee][Ss][Tt][Ee][Rr].*/ AND data_win_eventdata_commandLine:/.*[Gg][Ee][Tt]-[Hh][Ee][Ll][Pp].*/) OR (data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Pp][Ee][Ss][Tt][Ee][Rr].*/ AND data_win_eventdata_commandLine:/.*;.*/ AND (data_win_eventdata_commandLine:/.*[Hh][Ee][Ll][Pp].*/ OR data_win_eventdata_commandLine:/.*\?.*/)))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 18988e1b-9087-4f8a-82fe-0414dce49878
    name: Execute Code with Pester.bat as Parent
    reason: 'Same Pester proxy-execution seen from the child side: the payload spawned by the Pester-hosting PowerShell.'
  - id: fbd7c32d-db2a-4418-b92c-566eb8911133
    name: SyncAppvPublishingServer Execute Arbitrary PowerShell Code
    reason: Another signed-script proxy execution used to run PowerShell while evading command-line detections.
  - id: 1e0e1a81-e79b-44bc-935b-ddb9c8006b3d
    name: Potential Script Proxy Execution Via CL_Mutexverifiers.ps1
    reason: Sibling signed diagnostic-script proxy technique, often tried in the same session.
  - id: 9be56c82-b1cc-4318-87eb-d138afaaca39
    name: Malicious PowerShell Process - Execution Policy Bypass
    reason: Attackers abusing Pester commonly bypass policy for the payload they launch.
  - id: e6c54d94-498c-4562-a37c-b469d8e9a275
    name: Suspicious PowerShell Download and Execute Pattern
    reason: Code run via Pester is frequently a download cradle fetching the next stage.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Children of Pester-hosting PowerShell
    query: data_win_system_eventID:1 AND data_win_eventdata_parentCommandLine:/.*([Pp]ester|[Gg]et-[Hh]elp).*/ AND data_win_eventdata_image:/.*(cmd|powershell|pwsh|calc|rundll32|mshta|wscript|cscript)\.exe/
    pivot_on: host
    window: 2h
  - name: Pester.bat invocation via cmd
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*[Pp]ester\.bat.*/
    pivot_on: host
    window: 2h
  - name: PowerShell download cradles
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*(powershell|pwsh)\.exe/ AND data_win_eventdata_commandLine:/.*([Ii][Ee][Xx]|[Ii]nvoke-[Ww]eb[Rr]equest|[Dd]ownload[Ss]tring|[Ss]tart-[Bb]its[Tt]ransfer).*/
    pivot_on: host
    window: 2h
  - name: Dropped executables/scripts in user-writable paths
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*([Tt]emp|[Pp]ublic|[Aa]pp[Dd]ata).*\.(exe|dll|ps1|bat|vbs)/
    pivot_on: host
    window: 2h
