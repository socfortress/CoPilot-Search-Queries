name: Windows DNS Gather Network Info
id: windows-dns-gather-network-info-001
version: 1
schema_version: "1.0"
date: "2026-02-23"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  Detects dnscmd.exe with /enumrecords flag used to enumerate DNS records for 
  network reconnaissance. Used by Volt Typhoon and Sandworm APT groups to map 
  network infrastructure before lateral movement.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - wildcard:
            data_win_eventdata_commandLine: "*dnscmd*"
        - wildcard:
            data_win_eventdata_commandLine: "*enumrecords*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-23 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-23 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Windows endpoints with Sysmon 
  installed and configured to log process creation events (EventID 1) with full 
  command-line arguments.

known_false_positives: >
  Network administrators may use dnscmd.exe for legitimate DNS management. 
  Filter by authorized admin accounts and expected hosts.

references:
  - https://attack.mitre.org/techniques/T1590/002/
  - https://media.defense.gov/2023/May/24/2003229517/-1/-1/0/CSA_Living_off_the_Land.PDF

response:
  message: >
    DNS record enumeration via dnscmd on $agent_name$. 
    Command: $data_win_eventdata_commandLine$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1590.002
  risk_score: 36
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 36
  threat_objects: []

tags:
  analytic_story:
    - Sandworm Tools
    - Volt Typhoon
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1590.002
  custom_tags:
    - dnscmd
    - dns_enumeration
    - reconnaissance
    - network_discovery
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*dnscmd.*/ AND data_win_eventdata_commandLine:/.*enumrecords.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b6457d63-d2a2-4e29-859d-4e7affc153d1
    name: Potential Discovery Activity Via Dnscmd.EXE
    reason: Broader dnscmd discovery detection on the same tool.
  - id: f63b56ee-3f79-4b8a-97fb-5c48007e8573
    name: New DNS ServerLevelPluginDll Installed Via Dnscmd.EXE
    reason: dnscmd ServerLevelPluginDll is the code-execution escalation on DNS servers.
  - id: 41243735-89a7-4c83-bcdd-570aa78f00a1
    name: Domain Controller Discovery with Nltest
    reason: DC discovery with nltest is a sibling AD recon step.
  - id: c3e05466-5f22-11eb-ae93-0242ac130002
    name: NLTest Domain Trust Discovery
    reason: Trust discovery commonly accompanies DNS zone enumeration.
  - id: 5cc90652-4cbd-4241-aa3b-4b462fa5a248
    name: Potential Recon Activity Via Nltest.EXE
    reason: nltest recon activity in the same discovery burst.
  - id: e6313acd-208c-44fc-a0ff-db85d572e90e
    name: Network Reconnaissance Activity
    reason: Generic network recon cluster around DNS enumeration.
  - id: d95de845-b83c-4a9a-8a6a-4fc802ebf6c0
    name: Suspicious Group And Account Reconnaissance Activity Using Net.EXE
    reason: Net.exe group/account recon typically follows network mapping.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other DNS server enumeration
    query: data_win_eventdata_commandLine:/.*dnscmd.*/ OR data_win_eventdata_commandLine:/.*[Gg]et-[Dd]ns[Ss]erver[Zz]one.*/ OR data_win_eventdata_commandLine:/.*[Gg]et-[Dd]ns[Ss]erver[Rr]esource[Rr]ecord.*/ OR data_win_eventdata_commandLine:/.*nslookup.*(-type=any|ls -d).*/
    pivot_on: host
    window: 24h
  - name: AD and domain discovery burst
    query: data_win_eventdata_commandLine:/.*(nltest|dsquery|adfind|[Gg]et-AD(Computer|Domain)).*/ OR data_win_eventdata_commandLine:/.*net1? +(group|view|accounts).*domain.*/
    pivot_on: host
    window: 24h
  - name: Network scanning or share enumeration
    query: data_win_eventdata_commandLine:/.*(arp +-a|netstat|nbtstat|net1? +view|[Tt]est-[Nn]et[Cc]onnection).*/
    pivot_on: host
    window: 6h
  - name: Lateral movement tooling after mapping
    query: data_win_eventdata_commandLine:/.*(psexec|wmic +.node|winrs|[Ee]nter-[Pp][Ss][Ss]ession).*/
    pivot_on: host
    window: 24h
