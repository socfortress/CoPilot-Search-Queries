correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 3215aa19-f060-4332-86d5-5602511f3ca8
    name: Suspicious LNK Double Extension File Created
    reason: Creation of the double-extension LNK (invoice.pdf.lnk) precedes its execution by a user.
  - id: 1cdd9a09-06c9-4769-99ff-626e2b3991b8
    name: Suspicious Double Extension File Execution
    reason: Direct-image form of the same masquerade execution, often firing alongside the parent form.
  - id: 1f32d820-1d5c-43fe-8fe2-feef0c952eb7
    name: Emotet Loader Execution Via .LNK File
    reason: Classic family using document-named LNKs to launch cmd/powershell loaders.
  - id: 1412aa78-a24c-4abd-83df-767dfb2c5bbe
    name: Potentially Suspicious WebDAV LNK Execution
    reason: LNK launched via explorer that points to a WebDAV payload share.
  - id: f0507c0f-a3a2-40f5-acc6-7f543c334993
    name: Suspicious File Execution From Internet Hosted WebDav Share
    reason: The LNK commonly pulls and runs the next stage from a remote WebDAV share.
  - id: b6676963-0353-4f88-90f5-36c20d443c6a
    name: Cscript/Wscript Potentially Suspicious Child Process
    reason: LNK droppers often chain through wscript/cscript to run script payloads.
  - id: 1228c958-e64e-4e71-92ad-7d429f4138ba
    name: Script Interpreter Execution From Suspicious Folder
    reason: Follow-on interpreter run from user-writable folders where the lure unpacks.
  - id: c4db14d9-7909-48b4-a054-aa14d89dbb19
    name: Malicious PowerShell Process - Encoded Command
    reason: The LNK's child is frequently an encoded PowerShell command.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Interpreters launched by a shortcut parent
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\.[Ll][Nn][Kk]/ AND (data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]/)
    pivot_on: host
    window: 4h
  - name: Payload download via LOLBins
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Uu][Rr][Ll][Cc][Aa][Cc][Hh][Ee].*/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn].*/ OR data_win_eventdata_commandLine:/.*\/[Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]\-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Cc][Uu][Rr][Ll] .*/)
    pivot_on: host
    window: 4h
  - name: Double-extension LNK and ISO/IMG file creation
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\.[Pp][Dd][Ff]\.[Ll][Nn][Kk]/ OR data_win_eventdata_targetFilename:/.*\.[Dd][Oo][Cc]\.[Ll][Nn][Kk]/ OR data_win_eventdata_targetFilename:/.*\.[Dd][Oo][Cc][Xx]\.[Ll][Nn][Kk]/ OR data_win_eventdata_targetFilename:/.*\.[Xx][Ll][Ss]\.[Ll][Nn][Kk]/ OR data_win_eventdata_targetFilename:/.*\.[Xx][Ll][Ss][Xx]\.[Ll][Nn][Kk]/ OR data_win_eventdata_targetFilename:/.*\.[Ii][Ss][Oo]/ OR data_win_eventdata_targetFilename:/.*\.[Ii][Mm][Gg]/)
    pivot_on: host
    window: 6h
  - name: Outbound connections from interpreters
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:/[Tt][Rr][Uu][Ee]/ AND (data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]/)
    pivot_on: host
    window: 4h
  - name: Persistence after LNK execution
    query: data_win_system_eventID:"1" AND (((data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*\/[Cc][Rr][Ee][Aa][Tt][Ee].*/) OR ((data_win_eventdata_image:/.*\\[Rr][Ee][Gg]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/) OR ((data_win_eventdata_image:/.*\\[Ss][Cc]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee].*/))
    pivot_on: host
    window: 6h
