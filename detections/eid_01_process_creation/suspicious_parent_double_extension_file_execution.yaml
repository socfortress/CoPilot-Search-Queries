description: >
  Detect execution of suspicious double extension files in ParentCommandLine.
  MITRE ATT&CK: T1036.007.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*.doc.lnk"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*.docx.lnk"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*.xls.lnk"
                    case_insensitive: true
              - wildcard:
