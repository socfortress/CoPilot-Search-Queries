name: HackTool - SharpLdapWhoami Execution
id: d9367cbb-c2e0-47ce-bdc0-128cb6da898d
version: 1
schema_version: "1.0"
date: "2023-02-04"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: d9367cbb-c2e0-47ce-bdc0-128cb6da898d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects SharpLdapWhoami, a whoami alternative that queries the LDAP service on
  a domain controller. MITRE ATT&CK: T1033.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\SharpLdapWhoami.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_originalFileName:
                    value: "*SharpLdapWhoami*"
                    case_insensitive: true
              - term:
                  data_win_eventdata_product:
                    value: "SharpLdapWhoami"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /method:ntlm"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /method:kerb"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /method:nego"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /m:nego"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /m:ntlm"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /m:kerb"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_product
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\SharpLdapWhoami.exe'; data_win_eventdata_originalFileName matches
  '*SharpLdapWhoami*'; data_win_eventdata_product equals 'SharpLdapWhoami',
  among other conditions.

known_false_positives: >
  Programs that use the same command line flags. Baseline expected activity in
  your environment and tune this detection before relying on it for automated
  response.

references:
  - https://github.com/bugch3ck/SharpLdapWhoami
  - https://attack.mitre.org/techniques/T1033/

response:
  message: >
    HackTool - SharpLdapWhoami Execution detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1033
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1033
  custom_tags:
    - hacktool
    - sharpldapwhoami
    - process_creation
    - sysmon
    - discovery
    - car_2016_03_001
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ss][Hh][Aa][Rr][Pp][Ll][Dd][Aa][Pp][Ww][Hh][Oo][Aa][Mm][Ii]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/.*[Ss][Hh][Aa][Rr][Pp][Ll][Dd][Aa][Pp][Ww][Hh][Oo][Aa][Mm][Ii].*/ OR data_win_eventdata_product:/[Ss][Hh][Aa][Rr][Pp][Ll][Dd][Aa][Pp][Ww][Hh][Oo][Aa][Mm][Ii]/ OR data_win_eventdata_commandLine:/.* \/[Mm][Ee][Tt][Hh][Oo][Dd]:[Nn][Tt][Ll][Mm]/ OR data_win_eventdata_commandLine:/.* \/[Mm][Ee][Tt][Hh][Oo][Dd]:[Kk][Ee][Rr][Bb]/ OR data_win_eventdata_commandLine:/.* \/[Mm][Ee][Tt][Hh][Oo][Dd]:[Nn][Ee][Gg][Oo]/ OR data_win_eventdata_commandLine:/.* \/[Mm]:[Nn][Ee][Gg][Oo]/ OR data_win_eventdata_commandLine:/.* \/[Mm]:[Nn][Tt][Ll][Mm]/ OR data_win_eventdata_commandLine:/.* \/[Mm]:[Kk][Ee][Rr][Bb]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 9f8fc146-1d1a-4dbf-b8fd-dfae15e08541
    name: HackTool - SharpLDAPmonitor Execution
    reason: SharpLDAPmonitor is the sibling tool from the same SharpLDAP family, used after confirming LDAP identity.
  - id: f376c8a7-a2d0-4ddc-aa0c-16c17236d962
    name: HackTool - Bloodhound/Sharphound Execution
    reason: BloodHound/SharpHound collection is the typical next step once the operator knows who they are in the domain.
  - id: 455b9d50-15a1-4b99-853f-8d37655a4c1b
    name: PUA - Suspicious ActiveDirectory Enumeration Via AdFind.EXE
    reason: AdFind enumeration follows an LDAP whoami to map users, groups and computers.
  - id: 41243735-89a7-4c83-bcdd-570aa78f00a1
    name: Domain Controller Discovery with Nltest
    reason: 'Nltest DC discovery is the usual companion step: find the DC, then query LDAP on it.'
  - id: 8de1cbe8-d6f5-496d-8237-5f44a721c7a0
    name: Whoami.EXE Execution Anomaly
    reason: Native whoami anomalies on the host show the operator also used built-in identity discovery around the same time.
  - id: c248c896-e412-4279-8c15-1c558067b6fa
    name: Enumerate All Information With Whoami.EXE
    reason: Whoami /all enumerates identity, groups and privileges, the native equivalent of this LDAP-side identity check.
  - id: bd8b828d-0dca-48e1-8a63-8a58ecf2644f
    name: Group Membership Reconnaissance Via Whoami.EXE
    reason: Group membership recon via whoami is the same user-context discovery intent.
  - id: 1eeed653-dbc8-4187-ad0c-eeebb20e6599
    name: Potential SPN Enumeration Via Setspn.EXE
    reason: Setspn SPN enumeration is an early AD recon step that commonly follows identity confirmation.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Native identity and privilege discovery
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Ww][Hh][Oo][Aa][Mm][Ii].* \/([Aa][Ll][Ll]|[Pp][Rr][Ii][Vv]|[Gg][Rr][Oo][Uu][Pp][Ss]|[Ff][Oo]).*/
    pivot_on: host
    window: 2h
  - name: Domain controller and trust discovery
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Nn][Ll][Tt][Ee][Ss][Tt]|[Dd][Ss][Gg][Ee][Tt][Dd][Cc]|[Dd][Oo][Mm][Aa][Ii][Nn]_[Tt][Rr][Uu][Ss][Tt][Ss]|[Dd][Cc][Ll][Ii][Ss][Tt]).*/
    pivot_on: host
    window: 4h
  - name: LDAP connections from non-system processes
    query: data_win_system_eventID:"3" AND data_win_eventdata_destinationPort:("389" OR "636" OR "3268" OR "3269") AND NOT data_win_eventdata_image:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Kerberos ticket manipulation tooling
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.* ([Aa][Ss][Kk][Tt][Gg][Tt]|[Aa][Ss][Kk][Tt][Gg][Ss]|[Kk][Ee][Rr][Bb][Ee][Rr][Oo][Aa][Ss][Tt]|[Aa][Ss][Rr][Ee][Pp][Rr][Oo][Aa][Ss][Tt]|[Ss]4[Uu]|[Pp][Tt][Tt]) .*/
    pivot_on: host
    window: 6h
  - name: Other Sharp* offensive tools executed
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ss][Hh][Aa][Rr][Pp][A-Za-z0-9_-]+\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ss][Hh][Aa][Rr][Pp][A-Za-z0-9_-]+\.[Ee][Xx][Ee]/)
    pivot_on: host
    window: 6h
