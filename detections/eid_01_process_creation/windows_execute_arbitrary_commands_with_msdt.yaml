name: Windows Execute Arbitrary Commands with MSDT
id: e1d5145f-38fe-42b9-a5d5-457796715f97
version: 1
schema_version: "1.0"
date: "2026-04-07"
author: SOCFortress LLC
status: production
type: TTP

description: >
  The following analytic detects arbitrary command execution using Windows msdt.exe, a Diagnostics
  Troubleshooting Wizard. It leverages Sysmon EventID 1 to identify instances where msdt.exe is
  invoked with suspicious parameters like /id PCWDiagnostic, /af (answer file), IT_BrowseForFile,
  or IT_RebrowseForFile. This activity is significant as it can indicate an exploitation attempt
  leveraging msdt.exe (CVE-2022-30190 - Follina) to execute arbitrary commands and retrieve remote
  payloads. If confirmed malicious, this could allow an attacker to execute arbitrary code, escalate
  privileges, or persist within the environment, posing a severe security risk.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - wildcard:
            data_win_eventdata_image: "*msdt.exe"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine: "*PCWDiagnostic*"
              - wildcard:
                  data_win_eventdata_commandLine: "*IT_BrowseForFile*"
              - wildcard:
                  data_win_eventdata_commandLine: "*IT_RebrowseForFile*"
              - wildcard:
                  data_win_eventdata_commandLine: "*.xml*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_parentProcessId
    - data_win_eventdata_user
    - agent_name

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "YYYY-MM-DD 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "YYYY-MM-DD 23:59:59.999"

how_to_implement: >
  To successfully implement this search, you need to be ingesting logs with process execution data
  from your endpoints. Sysmon EventID 1 captures process creation events. Ensure that Sysmon is
  configured to log all process creation events and that these logs are properly ingested into
  Elasticsearch with complete command-line information. The detection specifically looks for msdt.exe
  invocations with parameters like /id PCWDiagnostic, /af (answer file), IT_BrowseForFile, or
  IT_RebrowseForFile, which are indicators of exploitation attempts leveraging CVE-2022-30190 (Follina).

known_false_positives: >
  False positives may occur if legitimate administrative tasks use msdt.exe with these parameters.
  However, msdt.exe is typically executed through the GUI and rarely invoked with command-line
  parameters from scripts or command shells. Investigate all instances of msdt.exe with these
  suspicious parameters immediately.

references:
  - https://isc.sans.edu/diary/rss/28694
  - https://doublepulsar.com/follina-a-microsoft-office-code-execution-vulnerability-1a47fce5629e
  - https://twitter.com/nao_sec/status/1530196847679401984?s=20&t=ZiXYI4dQuA-0_dzQzSUb3A
  - https://app.any.run/tasks/713f05d2-fe78-4b9d-a744-f7c133e3fafb/
  - https://strontic.github.io/xcyclopedia/library/msdt.exe-152D4C9F63EFB332CCB134C6953C0104.html

response:
  message: >
    msdt.exe was executed with suspicious parameters on $agent_name$. Process: $data_win_eventdata_image$
    CommandLine: $data_win_eventdata_commandLine$ Parent Process: $data_win_eventdata_parentImage$
    User: $data_win_eventdata_user$. This is indicative of CVE-2022-30190 (Follina) exploitation attempts.
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
    - field: data_win_eventdata_user
      type: user
      score: 80
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_parentImage
      type: process

tags:
  analytic_story:
    - Compromised Windows Host
    - Microsoft Support Diagnostic Tool Vulnerability CVE-2022-30190
    - Follina
  asset_type: Endpoint
  cve:
    - CVE-2022-30190
  mitre_attack_id:
    - T1218
  custom_tags:
    - msdt
    - follina
    - diagnostic_tool_abuse
    - command_execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:"C:\\\\Windows\\\\System32\\\\msdt.exe" AND data_win_eventdata_commandLine:/.*PCWDiagnostic.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 258fc8ce-8352-443a-9120-8a11e4857fa5
    name: Potential Arbitrary Command Execution Using Msdt.EXE
    reason: Sibling msdt detection; corroborates abuse of PCWDiagnostic/IT_BrowseForFile parameters.
  - id: 9c8c7000-3065-44a8-a555-79bcba5d9955
    name: MSDT Execution Via Answer File
    reason: The /af answer-file variant of the same msdt abuse; seen together in exploit chains.
  - id: 6004abd0-afa4-4557-ba90-49d172e0a299
    name: Execute Pcwrun.EXE To Leverage Follina
    reason: Pcwrun is an alternate launcher for the same Follina (CVE-2022-30190) primitive.
  - id: bd1c6866-65fc-44b2-be51-5588fcff82b9
    name: Renamed Msdt.EXE Execution
    reason: Attackers rename msdt.exe to dodge image-name detection of the same technique.
  - id: 9386d78a-7207-4048-9c9f-a93a7c2d1c05
    name: Code Execution via Pcwutl.dll
    reason: Pcwutl.dll LaunchApplication via rundll32 is a sibling PCW-based proxy-execution path.
  - id: Windows-Office-Product-Spawned-Child-Process-For-Download
    name: Windows Office Product Spawned Child Process For Download
    reason: Follina is delivered by Office documents; Office child processes precede msdt launch.
  - id: e32d4572-9826-4738-b651-95fa63747e8a
    name: Base64 Encoded PowerShell Command Detected
    reason: The msdt payload commonly decodes to an encoded PowerShell stager.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Office or browser spawning msdt or pcwrun
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Mm][Ss][Dd][Tt]|[Pp][Cc][Ww][Rr][Uu][Nn]|[Ss][Dd][Ii][Aa][Gg][Nn][Hh][Oo][Ss][Tt])\.[Ee][Xx][Ee]/ AND data_win_eventdata_parentImage:/.*\\([Ww][Ii][Nn][Ww][Oo][Rr][Dd]|[Ee][Xx][Cc][Ee][Ll]|[Pp][Oo][Ww][Ee][Rr][Pp][Nn][Tt]|[Oo][Uu][Tt][Ll][Oo][Oo][Kk]|[Mm][Ss][Ee][Dd][Gg][Ee]|[Cc][Hh][Rr][Oo][Mm][Ee]|[Ff][Ii][Rr][Ee][Ff][Oo][Xx]|[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr])\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Children of sdiagnhost (msdt payload)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ss][Dd][Ii][Aa][Gg][Nn][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Encoded PowerShell or download cradle
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh])\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*-[Ee][Nn][Cc].*/ OR data_win_eventdata_commandLine:/.*[Ff][Rr][Oo][Mm][Bb][Aa][Ss][Ee]64[Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ii][Ee][Xx].*/)
    pivot_on: host
    window: 2h
  - name: Network connections from scripting hosts
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]|[Cc][Mm][Dd]|[Mm][Ss][Hh][Tt][Aa]|[Rr][Uu][Nn][Dd][Ll][Ll]32|[Ss][Dd][Ii][Aa][Gg][Nn][Hh][Oo][Ss][Tt]|[Mm][Ss][Dd][Tt])\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Payload files dropped in user-writable paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\([Tt][Ee][Mm][Pp]|[Aa][Pp][Pp][Dd][Aa][Tt][Aa]|[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]|[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss])\\.*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Pp][Ss]1|[Bb][Aa][Tt]|[Vv][Bb][Ss]|[Hh][Tt][Aa])/
    pivot_on: host
    window: 2h
