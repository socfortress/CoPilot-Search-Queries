name: Remote Access Tool - UltraViewer Execution
id: 88656cec-6c3b-487c-82c0-f73ebb805503
version: 1
schema_version: "1.0"
date: "2024-03-14"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 88656cec-6c3b-487c-82c0-f73ebb805503
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  An adversary may use legitimate desktop support and remote access software,
  such as Team Viewer, Go2Assist, LogMein, AmmyyAdmin, etc, to establish an
  interactive command and control channel to target systems within networks.
  These services are commonly used as legitimate technical support software, and
  may be allowed by application control within a target environment. Remote
  access tools like VNC, Ammyy, and Teamviewer are used frequently when compared
  with other legitimate software commonly used by adversaries. (Citation:
  Symantec Living off the Land). MITRE ATT&CK: T1219.002.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - term:
                  data_win_eventdata_product:
                    value: "UltraViewer"
                    case_insensitive: true
              - term:
                  data_win_eventdata_company:
                    value: "DucFabulous Co,ltd"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "UltraViewer_Desktop.exe"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_product
    - data_win_eventdata_company
    - data_win_eventdata_originalFileName
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_product equals
  'UltraViewer'; data_win_eventdata_company equals 'DucFabulous Co,ltd';
  data_win_eventdata_originalFileName equals 'UltraViewer_Desktop.exe'.

known_false_positives: >
  Legitimate use. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1219/T1219.md
  - https://attack.mitre.org/techniques/T1219/002/

response:
  message: >
    Remote Access Tool - UltraViewer Execution detected on host $agent_name$.
    Matched data_win_eventdata_product: $data_win_eventdata_product$. Matched
    data_win_eventdata_company: $data_win_eventdata_company$. MITRE ATT&CK:
    T1219.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_product
      type: other
    - field: data_win_eventdata_company
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1219.002
  custom_tags:
    - ultraviewer
    - process_creation
    - sysmon
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_product:/[Uu][Ll][Tt][Rr][Aa][Vv][Ii][Ee][Ww][Ee][Rr]/ OR data_win_eventdata_company:/[Dd][Uu][Cc][Ff][Aa][Bb][Uu][Ll][Oo][Uu][Ss] [Cc][Oo],[Ll][Tt][Dd]/ OR data_win_eventdata_originalFileName:/[Uu][Ll][Tt][Rr][Aa][Vv][Ii][Ee][Ww][Ee][Rr]_[Dd][Ee][Ss][Kk][Tt][Oo][Pp]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b52e84a3-029e-4529-b09b-71d19dd27e94
    name: Remote Access Tool - AnyDesk Execution
    reason: Attackers install several remote-desktop tools for redundancy; AnyDesk on the same host suggests multi-tool access.
  - id: 758ff488-18d5-4cbe-8ec4-02b6285a434f
    name: Remote Access Tool - NetSupport Execution
    reason: Another commonly abused remote-control tool seen in the same intrusions.
  - id: 57bff678-25d1-4d6c-8211-8ca106d12053
    name: Remote Access Tool - ScreenConnect Execution
    reason: Parallel remote tooling suggests persistent hands-on-keyboard access rather than helpdesk use.
  - id: 8a3038e8-9c9d-46f8-b184-66234a160f6f
    name: Potential Remote Desktop Tunneling
    reason: 'Follow-on: operators tunnel RDP to widen access when remote tools are limited.'
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: UltraViewer binaries launched
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Uu]ltra[Vv]iewer.*/
    pivot_on: host
    window: 4h
  - name: UltraViewer files dropped or persistence set
    query: data_win_system_eventID:("11" OR "13") AND (data_win_eventdata_targetFilename:/.*[Uu]ltra[Vv]iewer.*/ OR data_win_eventdata_targetObject:/.*[Uu]ltra[Vv]iewer.*/)
    pivot_on: host
    window: 4h
  - name: UltraViewer network relay connections and DNS
    query: data_win_system_eventID:("3" OR "22") AND (data_win_eventdata_image:/.*[Uu]ltra[Vv]iewer.*/ OR data_win_eventdata_queryName:/.*[Uu]ltraviewer.*/)
    pivot_on: host
    window: 4h
  - name: Other remote access tools on host
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:(/.*[Aa]ny[Dd]esk.*/ OR /.*[Tt]eam[Vv]iewer.*/ OR /.*[Ss]creen[Cc]onnect.*/ OR /.*[Nn]et[Ss]upport.*/ OR /.*[Rr]ust[Dd]esk.*/)
    pivot_on: host
    window: 6h
  - name: Commands spawned from an UltraViewer session
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Uu]ltra[Vv]iewer.*/
    pivot_on: host
    window: 4h
