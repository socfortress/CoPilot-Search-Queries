name: Remote Access Tool - NetSupport Execution
id: 758ff488-18d5-4cbe-8ec4-02b6285a434f
version: 1
schema_version: "1.0"
date: "2023-03-06"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 758ff488-18d5-4cbe-8ec4-02b6285a434f
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  An adversary may use legitimate desktop support and remote access software,
  such as Team Viewer, Go2Assist, LogMein, AmmyyAdmin, etc, to establish an
  interactive command and control channel to target systems within networks.
  These services are commonly used as legitimate technical support software, and
  may be allowed by application control within a target environment. Remote
  access tools like VNC, Ammyy, and Teamviewer are used frequently when compared
  with other legitimate software commonly used by adversaries. (Citation:
  Symantec Living off the Land). MITRE ATT&CK: T1219.002.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - term:
                  data_win_eventdata_description:
                    value: "NetSupport Client Configurator"
                    case_insensitive: true
              - term:
                  data_win_eventdata_product:
                    value: "NetSupport Remote Control"
                    case_insensitive: true
              - term:
                  data_win_eventdata_company:
                    value: "NetSupport Ltd"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "PCICFGUI.EXE"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_description
    - data_win_eventdata_product
    - data_win_eventdata_company
    - data_win_eventdata_originalFileName
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_description equals
  'NetSupport Client Configurator'; data_win_eventdata_product equals
  'NetSupport Remote Control'; data_win_eventdata_company equals 'NetSupport
  Ltd', among other conditions.

known_false_positives: >
  Legitimate use. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1219/T1219.md
  - https://attack.mitre.org/techniques/T1219/002/

response:
  message: >
    Remote Access Tool - NetSupport Execution detected on host $agent_name$.
    Matched data_win_eventdata_description: $data_win_eventdata_description$.
    Matched data_win_eventdata_product: $data_win_eventdata_product$. MITRE
    ATT&CK: T1219.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_description
      type: other
    - field: data_win_eventdata_product
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1219.002
  custom_tags:
    - netsupport
    - process_creation
    - sysmon
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_description:/[Nn][Ee][Tt][Ss][Uu][Pp][Pp][Oo][Rr][Tt] [Cc][Ll][Ii][Ee][Nn][Tt] [Cc][Oo][Nn][Ff][Ii][Gg][Uu][Rr][Aa][Tt][Oo][Rr]/ OR data_win_eventdata_product:/[Nn][Ee][Tt][Ss][Uu][Pp][Pp][Oo][Rr][Tt] [Rr][Ee][Mm][Oo][Tt][Ee] [Cc][Oo][Nn][Tt][Rr][Oo][Ll]/ OR data_win_eventdata_company:/[Nn][Ee][Tt][Ss][Uu][Pp][Pp][Oo][Rr][Tt] [Ll][Tt][Dd]/ OR data_win_eventdata_originalFileName:/[Pp][Cc][Ii][Cc][Ff][Gg][Uu][Ii]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 0afbd410-de03-4078-8491-f132303cb67d
    name: Renamed NetSupport RAT Execution
    reason: Same NetSupport client; renaming client32.exe shows deliberate evasion rather than IT use.
  - id: 37e8d358-6408-4853-82f4-98333fca7014
    name: Remote Access Tool - NetSupport Execution From Unusual Location
    reason: Fires when the same client runs outside Program Files, the usual sign of a dropped NetSupport RAT.
  - id: de587dce-915e-4218-aac4-835ca6af6f70
    name: Potential Persistence Attempt Via Run Keys Using Reg.EXE
    reason: NetSupport RAT campaigns persist client32 via a Run key; shows the foothold surviving reboot.
  - id: 81325ce1-be01-4250-944f-b4789644556f
    name: Schedule Task Creation From Env Variable Or Potentially Suspicious Path Via Schtasks.EXE
    reason: Scheduled task is the other common way a dropped NetSupport client is made persistent.
  - id: 6860a62c-9203-11eb-9e05-acde48001122
    name: Disabling Firewall with Netsh
    reason: Operators open or disable the firewall so the RAT's outbound control channel works.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: 'Delivery: script/Office/shell parent spawning interpreter (fake-update JS or macro)'
    query: (data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\([Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|[Ww][Ii][Nn][Ww][Oo][Rr][Dd]\.[Ee][Xx][Ee]|[Ee][Xx][Cc][Ee][Ll]\.[Ee][Xx][Ee]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|[Cc][Mm][Dd]\.[Ee][Xx][Ee])/ AND data_win_eventdata_image:/.*\\([Cc][Mm][Dd]\.[Ee][Xx][Ee]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|[Mm][Ss][Ii][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee])/)
    pivot_on: host
    window: 2h
  - name: Download of the NetSupport package via certutil/bitsadmin/curl/PowerShell
    query: (data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ss][Tt][Aa][Rr][Tt]-[Bb][Ii][Tt][Ss][Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr].*/)) OR data_win_eventdata_image:/.*\\([Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]|[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]|[Ww][Gg][Ee][Tt]\.[Ee][Xx][Ee])/))
    pivot_on: host
    window: 2h
  - name: Persistence created for the client (Run key, schtasks, service)
    query: (data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\([Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*/[Cc][Rr][Ee][Aa][Tt][Ee].*/)) OR (data_win_eventdata_image:/.*\\([Ss][Cc]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee].*/)) OR (data_win_eventdata_image:/.*\\([Rr][Ee][Gg]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/))))
    pivot_on: host
    window: 6h
  - name: Outbound connections made by client32
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\[Cc][Ll][Ii][Ee][Nn][Tt]32\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 6h
  - name: Post-access recon and local account changes
    query: ((data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Nn][Ll][Tt][Ee][Ss][Tt]\.[Ee][Xx][Ee]|[Ww][Hh][Oo][Aa][Mm][Ii]\.[Ee][Xx][Ee]|[Ss][Yy][Ss][Tt][Ee][Mm][Ii][Nn][Ff][Oo]\.[Ee][Xx][Ee]|[Qq][Uu][Ss][Ee][Rr]\.[Ee][Xx][Ee]|[Qq][Ww][Ii][Nn][Ss][Tt][Aa]\.[Ee][Xx][Ee]|[Aa][Rr][Pp]\.[Ee][Xx][Ee])/ OR (data_win_eventdata_image:/.*\\([Nn][Ee][Tt]\.[Ee][Xx][Ee]|[Nn][Ee][Tt]1\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*[Vv][Ii][Ee][Ww].*/ OR data_win_eventdata_commandLine:/.*[Gg][Rr][Oo][Uu][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp].*/)))) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Nn][Ee][Tt]\.[Ee][Xx][Ee]|[Nn][Ee][Tt]1\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*[Uu][Ss][Ee][Rr] .*/ OR data_win_eventdata_commandLine:/.*[Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp].*/) AND (data_win_eventdata_commandLine:/.*/[Aa][Dd][Dd].*/)))
    pivot_on: host
    window: 6h
