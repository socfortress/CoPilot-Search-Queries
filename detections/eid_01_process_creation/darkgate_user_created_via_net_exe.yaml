name: DarkGate - User Created Via Net.EXE
id: bf906d7b-7070-4642-8383-e404cf26eba5
version: 1
schema_version: "1.0"
date: "2023-10-15"
author: X__Junior (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: bf906d7b-7070-4642-8383-e404cf26eba5
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects creation of local users via the net.exe command with the name of
  "DarkGate". MITRE ATT&CK: T1136.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\net.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\net1.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*user*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*add*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*DarkGate*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*SafeMode*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches '*\net.exe';
  data_win_eventdata_image matches '*\net1.exe'; data_win_eventdata_commandLine
  matches '*user*', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - Internal Research
  - https://attack.mitre.org/techniques/T1136/001/

response:
  message: >
    DarkGate - User Created Via Net.EXE detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1136.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1136.001
  custom_tags:
    - darkgate
    - process_creation
    - sysmon
    - persistence
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Nn][Ee][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Nn][Ee][Tt]1\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Uu][Ss][Ee][Rr].*/ AND data_win_eventdata_commandLine:/.*[Aa][Dd][Dd].*/ AND data_win_eventdata_commandLine:/.*[Dd][Aa][Rr][Kk][Gg][Aa][Tt][Ee].*/ AND data_win_eventdata_commandLine:/.*[Ss][Aa][Ff][Ee][Mm][Oo][Dd][Ee].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: cd219ff3-fa99-45d4-8380-a7d15116c6dc
    name: New User Created Via Net.EXE
    reason: Generic version of the same net user /add action; confirms account creation regardless of name.
  - id: b9f0e6f5-09b4-4358-bae4-08408705bd5c
    name: New User Created Via Net.EXE With Never Expire Option
    reason: DarkGate-style persistence accounts are often set to never expire.
  - id: f8e9aa1c-14f2-4dbd-aa59-b98968ed650d
    name: DarkGate - Autoit3.EXE Execution Parameters
    reason: 'Likely precursor: the AutoIt3 loader that ran the net.exe command.'
  - id: df49c691-8026-48dd-94d3-4ba6a79102a8
    name: DarkGate - Drop DarkGate Loader In C:\Temp Directory
    reason: 'Precursor: DarkGate payload staging on the same host.'
  - id: d4498716-1d52-438f-8084-4a603157d131
    name: Password Provided In Command Line Of Net.EXE
    reason: net user /add carries a plaintext password on the command line, an additional exposure signal.
  - id: Windows_User_Account_Created
    name: Windows User Account Created
    reason: Security log 4720 corroborates the account actually got created.
  - id: 7b449a5e-1db5-4dd0-a2dc-4e3a67282538
    name: Hidden Local User Creation
    reason: Backdoor accounts may be hidden ($ suffix) to evade enumeration.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Local group membership changes (admin / RDP)
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*localgroup.*(administrators|remote desktop users).*/
    pivot_on: host
    window: 6h
  - name: Account created or added to group (Security log)
    query: (data_win_system_eventID:4720 OR data_win_system_eventID:4732 OR data_win_system_eventID:4722)
    pivot_on: host
    window: 6h
  - name: RDP enablement or firewall opening
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*fDenyTSConnections.*/ OR data_win_eventdata_commandLine:/.*netsh.*firewall.*3389.*/)
    pivot_on: host
    window: 6h
  - name: Logons by newly created account
    query: (data_win_system_eventID:4624 OR data_win_system_eventID:4625) AND data_win_eventdata_targetUserName:/.*[Dd]ark[Gg]ate.*/
    pivot_on: host
    window: 24h
  - name: AutoIt3 execution on host
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Aa]utoit3\.exe/
    pivot_on: host
    window: 6h
