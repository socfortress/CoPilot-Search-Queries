name: Mustang Panda Dropper
id: 2d87d610-d760-45ee-a7e6-7a6f2a65de00
version: 1
schema_version: "1.0"
date: "2021-11-27"
author: Florian Roth (Nextron Systems), oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 2d87d610-d760-45ee-a7e6-7a6f2a65de00
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects specific process parameters as used by Mustang Panda droppers. MITRE
  ATT&CK: T1587.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Temp\\\\wtask.exe /create*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*%windir:~-3,1%%PUBLIC:~-9,1%*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*/tn \"Security Script *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*%windir:~-1,1%*"
                    case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*/E:vbscript*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*C:\\\\Users\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*.txt*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*/F*"
                          case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*Temp\\\\winwsh.exe"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*Temp\wtask.exe /create*'; data_win_eventdata_commandLine matches
  '*%windir:~-3,1%%PUBLIC:~-9,1%*'; data_win_eventdata_commandLine matches '*/tn
  "Security Script *', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://app.any.run/tasks/7ca5661d-a67b-43ec-98c1-dd7a8103c256/
  - https://app.any.run/tasks/b12cccf3-1c22-4e28-9d3e-c7a6062f3914/
  - https://www.anomali.com/blog/china-based-apt-mustang-panda-targets-minority-groups-public-and-private-sector-organizations
  - https://attack.mitre.org/techniques/T1587/001/

response:
  message: >
    Mustang Panda Dropper detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1587.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1587.001
  custom_tags:
    - mustang
    - panda
    - dropper
    - process_creation
    - sysmon
    - resource_development
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Tt][Ee][Mm][Pp]\\[Ww][Tt][Aa][Ss][Kk]\.[Ee][Xx][Ee] \/[Cc][Rr][Ee][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*%[Ww][Ii][Nn][Dd][Ii][Rr]:\~-3,1%%[Pp][Uu][Bb][Ll][Ii][Cc]:\~-9,1%.*/ OR data_win_eventdata_commandLine:/.*\/[Tt][Nn] \"[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy] [Ss][Cc][Rr][Ii][Pp][Tt] .*/ OR data_win_eventdata_commandLine:/.*%[Ww][Ii][Nn][Dd][Ii][Rr]:\~-1,1%.*/ OR (data_win_eventdata_commandLine:/.*\/[Ee]:[Vv][Bb][Ss][Cc][Rr][Ii][Pp][Tt].*/ AND data_win_eventdata_commandLine:/.*[Cc]:\\[Uu][Ss][Ee][Rr][Ss]\\.*/ AND data_win_eventdata_commandLine:/.*\.[Tt][Xx][Tt].*/ AND data_win_eventdata_commandLine:/.*\/[Ff].*/) OR data_win_eventdata_image:/.*[Tt][Ee][Mm][Pp]\\[Ww][Ii][Nn][Ww][Ss][Hh]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: aeab5ec5-be14-471a-80e8-e344418305c2
    name: Potential PlugX Activity
    reason: PlugX is the Mustang Panda payload these droppers deliver
  - id: 7806bb49-f653-48d3-a915-5115c1a85234
    name: Potential APT Mustang Panda Activity Against Australian Gov
    reason: Same actor's other command-line tradecraft; supports attribution
  - id: 99b7460d-c9f1-40d7-a316-1f36f61d52ee
    name: Cscript/Wscript Uncommon Script Extension Execution
    reason: Dropper runs cscript /e:vbscript on a .txt file
  - id: cea72823-df4d-4567-950c-0b579eaf0846
    name: Potential Dropper Script Execution Via WScript/CScript/MSHTA
    reason: Generic script-dropper stage of the same chain
  - id: 8a8379b8-780b-4dbf-b1e9-31c8d112fefb
    name: Schtasks From Suspicious Folders
    reason: Dropper persists with scheduled tasks running from user-writable folders
  - id: 81325ce1-be01-4250-944f-b4789644556f
    name: Schedule Task Creation From Env Variable Or Potentially Suspicious Path Via Schtasks.EXE
    reason: Env-variable obfuscated task creation matches the %windir:~..% tricks
  - id: 39019a4e-317f-4ce3-ae63-309a8c6b53c5
    name: Suspicious Scheduled Task Creation Involving Temp Folder
    reason: Task pointing at a Temp payload such as wtask/winwsh
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Scheduled task creation from user paths or 'Security Script' names
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*\/[Cc][Rr][Ee][Aa][Tt][Ee].*/ AND (data_win_eventdata_commandLine:/.*[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy] [Ss][Cc][Rr][Ii][Pp][Tt].*/ OR data_win_eventdata_commandLine:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_commandLine:/.*[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc].*/ OR data_win_eventdata_commandLine:/.*[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_commandLine:/.*[Aa][Pp][Pp][Dd][Aa][Tt][Aa].*/)
    pivot_on: host
    window: 4h
  - name: wscript/cscript running scripts from user paths
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*\\([Uu][Ss][Ee][Rr][Ss]|[Tt][Ee][Mm][Pp]|[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa])\\.*/ AND data_win_eventdata_commandLine:/.*\.([Vv][Bb][Ss]|[Vv][Bb][Ee]|[Tt][Xx][Tt]|[Jj][Ss])/
    pivot_on: host
    window: 2h
  - name: Executables and scripts dropped in staging directories
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\([Tt][Ee][Mm][Pp]|[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]|[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa])\\.*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Vv][Bb][Ss]|[Ll][Nn][Kk]|[Dd][Aa][Tt])/
    pivot_on: host
    window: 2h
  - name: Network connections from binaries in staging directories
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:"true" AND data_win_eventdata_image:/.*\\([Tt][Ee][Mm][Pp]|[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]|[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa])\\.*\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 4h
  - name: Run-key persistence
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/
    pivot_on: host
    window: 4h
