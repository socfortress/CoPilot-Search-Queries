name: Windows Ngrok Reverse Proxy Usage
id: Windows-Ngrok-Reverse-Proxy-Usage
version: 9
schema_version: 1
date: '2025-05-02'
author: SOCFortress LLC
status: production
type: Anomaly
description: >
  Detects execution of ngrok.exe with tunnel-related arguments (start, --config,
  http, authtoken, tcp). While ngrok is a legitimate tunneling tool, adversaries
  increasingly abuse it to bypass network defenses, establish reverse proxies,
  exfiltrate data, and maintain persistence. Associated with Iranian APT activity
  (CISA AA22-320A, AA24-241A) and Reverse Network Proxy tradecraft.
  MITRE ATT&CK: T1572 (Protocol Tunneling), T1090 (Proxy), T1102 (Web Service).

data_source:
  - Sysmon EventID 1 (ProcessCreate)

search:
  query:
    bool:
      must:
        - term:
            agent_name: "AGENT_NAME"
        - term:
            agent_labels_customer: "CUSTOMER_CODE"
        - term:
            data_win_system_eventID: "1"
        - wildcard:
            data_win_eventdata_image: "*\\ngrok.exe"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine: "*start*"
              - wildcard:
                  data_win_eventdata_commandLine: "*--config*"
              - wildcard:
                  data_win_eventdata_commandLine: "*http*"
              - wildcard:
                  data_win_eventdata_commandLine: "*authtoken*"
              - wildcard:
                  data_win_eventdata_commandLine: "*tcp*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "START_TIME"
              lte: "END_TIME"

parameters:
  - name: AGENT_NAME
    default: "DESKTOP-AM0HLGE"
  - name: CUSTOMER_CODE
    default: "lab"
  - name: START_TIME
    default: "now-24h"
  - name: END_TIME
    default: "now"

how_to_implement: >
  Requires Sysmon EventID 1 (ProcessCreate) flowing to the Wazuh Indexer.
  Fields data_win_eventdata_image and data_win_eventdata_commandLine are
  confirmed working across all EventID 1 detections in this environment.
  Field-validated based on established EventID 1 detection patterns.

known_false_positives: >
  False positives will be present in organizations that permit the use of
  ngrok for legitimate development or remote access purposes. Filter by
  known approved users or machines as needed.

references:
  - https://www.cisa.gov/uscert/sites/default/files/publications/aa22-320a_joint_csa_iranian_government-sponsored_apt_actors_compromise_federal%20network_deploy_crypto%20miner_credential_harvester.pdf
  - https://attack.mitre.org/techniques/T1572/
  - https://attack.mitre.org/techniques/T1090/

response:
  message: >
    Ngrok reverse proxy execution detected on $agent_name$ by $data_win_eventdata_user$.
    Parent: $data_win_eventdata_parentImage$.
    Command: $data_win_eventdata_commandLine$.
    MITRE ATT&CK: T1572, T1090, T1102
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
    - field: data_win_eventdata_user
      type: user
      score: 50
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: parent_process_name
    - field: data_win_eventdata_image
      type: process_name

tags:
  analytic_story:
    - Reverse Network Proxy
    - CISA AA22-320A
    - CISA AA24-241A
  asset_type: Endpoint
  mitre_attack_id:
    - T1572
    - T1090
    - T1102
  custom_tags:
    - ngrok
    - reverse_proxy
    - tunneling
    - defense_evasion
    - exfiltration
  product:
    - Wazuh
  security_domain: endpoint

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: Windows_ngrok_Usage_Observed
    name: Windows ngrok Usage Observed
    reason: Broader ngrok execution detection including renamed binaries via OriginalFileName.
  - id: ee37eb7c-a4e7-4cd5-8fa4-efa27f1c3f31
    name: PUA - Ngrok Execution
    reason: Alternate ngrok command-line coverage on the same host.
  - id: 1d08ac94-400d-4469-a82f-daee9a908849
    name: Communication To Ngrok Tunneling Service Initiated
    reason: Network confirmation that the tunnel connected to ngrok infrastructure.
  - id: 8a3038e8-9c9d-46f8-b184-66234a160f6f
    name: Potential Remote Desktop Tunneling
    reason: ngrok tcp 3389 is a common way to expose RDP.
  - id: 32410e29-5f94-4568-b6a3-d91a8adad863
    name: PUA - Fast Reverse Proxy (FRP) Execution
    reason: Attackers using ngrok often stage other tunnelers as fallback.
  - id: 8b0e12da-d3c3-49db-bb4f-256703f380e5
    name: PUA - Chisel Tunneling Tool Execution
    reason: Alternative tunneling tool used in the same intrusions.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Ngrok process executions
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*[Nn]grok.*/ OR data_win_eventdata_originalFileName:/.*[Nn]grok.*/ OR data_win_eventdata_commandLine:/.*[Nn]grok.*/)
    pivot_on: host
    window: 6h
  - name: Connections to ngrok domains
    query: data_win_system_eventID:3 AND data_win_eventdata_destinationHostname:/.*ngrok.*/
    pivot_on: host
    window: 6h
  - name: DNS lookups of tunnel services
    query: data_win_system_eventID:22 AND data_win_eventdata_queryName:/.*(ngrok|trycloudflare|localtonet|serveo).*/
    pivot_on: host
    window: 6h
  - name: Ngrok binary or config written
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*([Nn]grok\.exe|[Nn]grok\.yml|[Nn]grok.*\.zip).*/
    pivot_on: host
    window: 6h
  - name: Tunnel exposing RDP SMB SSH WinRM
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*([Nn]grok|[Tt]unnel).*(3389|445|22|5985).*/
    pivot_on: host
    window: 6h
