name: New Root Certificate Installed Via Certutil.EXE
id: d2125259-ddea-4c1c-9c22-977eb5b29cf0
version: 1
schema_version: "1.0"
date: "2024-03-05"
author: oscd.community, @redcanary, Zach Stanford @svch0st
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: d2125259-ddea-4c1c-9c22-977eb5b29cf0
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of "certutil" with the "addstore" flag in order to install a
  new certificate on the system. Adversaries may install a root certificate on a
  compromised system to avoid warnings when connecting to adversary controlled
  web servers. MITRE ATT&CK: T1553.004.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\certutil.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "CertUtil.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-addstore*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*/addstore*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*–addstore*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*—addstore*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*―addstore*"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*root*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\certutil.exe'; data_win_eventdata_originalFileName equals 'CertUtil.exe';
  data_win_eventdata_commandLine matches '*-addstore*', among other conditions.

known_false_positives: >
  Help Desk or IT may need to manually add a corporate Root CA on occasion. Need
  to test if GPO push doesn't trigger FP. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1553.004/T1553.004.md
  - https://attack.mitre.org/techniques/T1553/004/

response:
  message: >
    New Root Certificate Installed Via Certutil.EXE detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1553.004
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1553.004
  custom_tags:
    - certificate
    - installed
    - certutil
    - process_creation
    - sysmon
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*-[Aa][Dd][Dd][Ss][Tt][Oo][Rr][Ee].*/ OR data_win_eventdata_commandLine:/.*\/[Aa][Dd][Dd][Ss][Tt][Oo][Rr][Ee].*/ OR data_win_eventdata_commandLine:/.*–[Aa][Dd][Dd][Ss][Tt][Oo][Rr][Ee].*/ OR data_win_eventdata_commandLine:/.*—[Aa][Dd][Dd][Ss][Tt][Oo][Rr][Ee].*/ OR data_win_eventdata_commandLine:/.*―[Aa][Dd][Dd][Ss][Tt][Oo][Rr][Ee].*/) AND data_win_eventdata_commandLine:/.*[Rr][Oo][Oo][Tt].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d223b46b-5621-4037-88fe-fda32eead684
    name: New Root or CA or AuthRoot Certificate to Store
    reason: Registry-level confirmation that the cert actually landed in the trusted store after the command ran
  - id: 5f6a601c-2ecb-498b-9c33-660362323afa
    name: Root Certificate Installed From Susp Locations
    reason: Same behaviour with the cert sourced from temp/user-writable paths, raising confidence it is attacker-staged
  - id: 42821614-9264-4761-acfc-5772c3286f76
    name: Root Certificate Installed - PowerShell
    reason: Alternate tooling for the same trust-store tampering on the same host
  - id: 19b08b1c-861d-4e75-a1ef-ea0c1baf202b
    name: Suspicious Download Via Certutil.EXE
    reason: Certutil is also a download LOLBin; the cert file may have been fetched by it first
  - id: 3ffd6f51-e6c1-47b7-94b4-c1e61d4117c5
    name: Certificate Exported Via Certutil.EXE
    reason: Certificate export on the same host suggests key theft alongside trust manipulation
  - id: ff992eac-6449-4c60-8c1d-91c9722a1d48
    name: New Root Certificate Installed Via CertMgr.EXE
    reason: Alternate native binary for the same trust-store tampering
  - id: windows-certutil-root-certificate-addition-001
    name: Windows Certutil Root Certificate Addition
    reason: Duplicate/co-firing certutil root addition detection
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Registry writes to Root/AuthRoot/CA certificate stores
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Ss][Yy][Ss][Tt][Ee][Mm][Cc][Ee][Rr][Tt][Ii][Ff][Ii][Cc][Aa][Tt][Ee][Ss].*/ AND (data_win_eventdata_targetObject:/.*\\[Rr][Oo][Oo][Tt]\\.*/ OR data_win_eventdata_targetObject:/.*\\[Aa][Uu][Tt][Hh][Rr][Oo][Oo][Tt]\\.*/ OR data_win_eventdata_targetObject:/.*\\[Cc][Aa]\\.*/)
    pivot_on: host
    window: 2h
  - name: Other certificate import tooling (PowerShell, importpfx, addstore)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ii][Mm][Pp][Oo][Rr][Tt]-[Cc][Ee][Rr][Tt][Ii][Ff][Ii][Cc][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Aa][Dd][Dd][Ss][Tt][Oo][Rr][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ii][Mm][Pp][Oo][Rr][Tt][Pp][Ff][Xx].*/ OR data_win_eventdata_commandLine:/.*[Ii][Mm][Pp][Oo][Rr][Tt]-[Pp][Ff][Xx][Cc][Ee][Rr][Tt][Ii][Ff][Ii][Cc][Aa][Tt][Ee].*/)
    pivot_on: host
    window: 4h
  - name: Proxy or hosts-file changes that could redirect traffic to attacker infrastructure
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Pp][Rr][Oo][Xx][Yy].*/ OR data_win_eventdata_commandLine:/.*[Dd][Rr][Ii][Vv][Ee][Rr][Ss]\\[Ee][Tt][Cc]\\[Hh][Oo][Ss][Tt][Ss].*/)
    pivot_on: host
    window: 4h
  - name: Download tooling run before the certificate install
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Uu][Rr][Ll][Cc][Aa][Cc][Hh][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn].*/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee].*/)
    pivot_on: host
    window: 2h
