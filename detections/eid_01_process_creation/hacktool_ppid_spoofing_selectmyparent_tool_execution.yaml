status: experimental
type: TTP

description: >
  Detects the use of parent process ID spoofing tools like Didier Stevens tool
  SelectMyParent. MITRE ATT&CK: T1134.004.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\SelectMyParent.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*PPID-spoof*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*ppid_spoof*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*spoof-ppid*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*spoof_ppid*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*ppidspoof*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*spoofppid*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*spoofedppid*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -spawnto *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_originalFileName:
                    value: "*PPID-spoof*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_originalFileName:
                    value: "*ppid_spoof*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_originalFileName:
                    value: "*spoof-ppid*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_originalFileName:
                    value: "*spoof_ppid*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_originalFileName:
                    value: "*ppidspoof*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_originalFileName:
                    value: "*spoofppid*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_originalFileName:
                    value: "*spoofedppid*"
                    case_insensitive: true
              - term:
                  data_win_eventdata_description:
                    value: "SelectMyParent"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=04D974875BD225F00902B4CAD9AF3FBC*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=A782AF154C9E743DDF3F3EB2B8F3D16E*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=89059503D7FBF470E68F7E63313DA3AD*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=CA28337632625C8281AB8A130B3D6BAD*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_originalFileName
    - data_win_eventdata_description
    - data_win_eventdata_hashes
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\SelectMyParent.exe'; data_win_eventdata_commandLine matches '*PPID-spoof*';
  data_win_eventdata_commandLine matches '*ppid_spoof*', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://pentestlab.blog/2020/02/24/parent-pid-spoofing/
  - https://www.picussecurity.com/resource/blog/how-to-detect-parent-pid-ppid-spoofing-attacks
  - https://www.ired.team/offensive-security/defense-evasion/parent-process-id-ppid-spoofing
  - https://www.virustotal.com/gui/search/filename%253A*spoof*%2520filename%253A*ppid*/files
  - https://attack.mitre.org/techniques/T1134/004/

response:
  message: >
    HackTool - PPID Spoofing SelectMyParent Tool Execution detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
    MITRE ATT&CK: T1134.004
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

