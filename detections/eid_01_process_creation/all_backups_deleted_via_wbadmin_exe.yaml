name: All Backups Deleted Via Wbadmin.EXE
id: 639c9081-f482-47d3-a0bd-ddee3d4ecd76
version: 1
schema_version: "1.0"
date: "2024-05-10"
author: frack113, Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 639c9081-f482-47d3-a0bd-ddee3d4ecd76
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the deletion of all backups or system state backups via "wbadmin.exe".
  This technique is used by numerous ransomware families and actors. This may
  only be successful on server platforms that have Windows Backup enabled. MITRE
  ATT&CK: T1490.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\wbadmin.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "WBADMIN.EXE"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*delete*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*backup*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*keepVersions:0*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\wbadmin.exe'; data_win_eventdata_originalFileName equals 'WBADMIN.EXE';
  data_win_eventdata_commandLine matches '*delete*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1490/T1490.md#atomic-test-5---windows---delete-volume-shadow-copies-via-wmi-with-powershell
  - https://github.com/albertzsigovits/malware-notes/blob/558898932c1579ff589290092a2c8febefc3a4c9/Ransomware/Lockbit.md
  - https://www.sentinelone.com/labs/ranzy-ransomware-better-encryption-among-new-features-of-thunderx-derivative/
  - https://www.trendmicro.com/vinfo/us/security/news/cybercrime-and-digital-threats/ransomware-report-avaddon-and-new-techniques-emerge-industrial-sector-targeted
  - https://www.trendmicro.com/content/dam/trendmicro/global/en/research/24/b/lockbit-attempts-to-stay-afloat-with-a-new-version/technical-appendix-lockbit-ng-dev-analysis.pdf
  - https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/wbadmin-delete-systemstatebackup
  - https://attack.mitre.org/techniques/T1490/

response:
  message: >
    All Backups Deleted Via Wbadmin.EXE detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1490
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1490
  custom_tags:
    - backups
    - deleted
    - wbadmin
    - process_creation
    - sysmon
    - impact
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ww][Bb][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ww][Bb][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Dd][Ee][Ll][Ee][Tt][Ee].*/ AND data_win_eventdata_commandLine:/.*[Bb][Aa][Cc][Kk][Uu][Pp].*/ AND data_win_eventdata_commandLine:/.*[Kk][Ee][Ee][Pp][Vv][Ee][Rr][Ss][Ii][Oo][Nn][Ss]:0.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 21ff4ca9-f13a-41ad-b828-0077b2af2e40
    name: Deletion of Volume Shadow Copies via WMI with PowerShell
    reason: Ransomware removes shadow copies alongside backups to block recovery.
  - id: c9fbe8e9-119d-40a6-9b59-dd58a5d84429
    name: Potential Ransomware or Unauthorized MBR Tampering Via Bcdedit.EXE
    reason: bcdedit recoveryenabled no is paired with wbadmin delete in ransomware pre-encryption.
  - id: 1444443e-6757-43e4-9ea4-c8fc705f79a2
    name: Boot Configuration Tampering Via Bcdedit.EXE
    reason: Disabling recovery/boot options is a sibling inhibit-recovery step.
  - id: 9703792d-fd9a-456d-a672-ff92efe4806a
    name: Backup Catalog Deleted
    reason: Event-log confirmation that the backup catalog was actually deleted on the host.
  - id: 236e7c8e-c9d9-11eb-a824-acde48001122
    name: Disable Logs Using WevtUtil
    reason: Operators clear or disable logs around impact to hinder forensics.
  - id: a7ee1722-c3c5-aeff-3212-c777e4733217
    name: Disable Windows Defender AV Security Monitoring
    reason: Defender is typically disabled shortly before encryption begins.
  - id: 689308fc-cfba-4f72-9897-796c1dc61487
    name: Potential Conti Ransomware Activity
    reason: Specific ransomware family pattern that includes backup and shadow deletion.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Shadow copy deletion via vssadmin/wmic/diskshadow
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ss]hadow.*[Dd]elete.*/ OR /.*[Dd]elete.*[Ss]hadows.*/ OR /.*[Rr]esize [Ss]hadow[Ss]torage.*/)
    pivot_on: host
    window: 2h
  - name: Boot recovery disabled via bcdedit
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Bb]cdedit.*[Rr]ecoveryenabled.*/ OR /.*[Bb]cdedit.*[Bb]ootstatuspolicy.*[Ii]gnoreallfailures.*/)
    pivot_on: host
    window: 2h
  - name: Backup, database and AV services stopped
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*(net|sc)(\.exe)? +stop.*(sql|veeam|backup|vss|sophos|defend).*/)
    pivot_on: host
    window: 2h
  - name: Ransom note or encrypted-extension files created
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(/.*\.[Ll]ocked/ OR /.*\.[Ee]ncrypted/ OR /.*[Rr]ead[Mm]e.*\.txt/ OR /.*[Dd]ecrypt.*\.txt/)
    pivot_on: host
    window: 2h
  - name: Event log clearing
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ww]evtutil.*( cl | clear-log).*/ OR /.*[Cc]lear-[Ee]vent[Ll]og.*/)
    pivot_on: host
    window: 2h
