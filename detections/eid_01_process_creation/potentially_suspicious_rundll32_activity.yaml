][Kk]\.[Dd][Ll][Ll].*/ AND data_win_eventdata_commandLine:/.*[Rr][Ee][Gg][Ii][Ss][Tt][Ee][Rr][Oo][Cc][Xx].*/) OR (data_win_eventdata_commandLine:/.*[Ii][Ee][Ff][Rr][Aa][Mm][Ee]\.[Dd][Ll][Ll].*/ AND data_win_eventdata_commandLine:/.*[Oo][Pp][Ee][Nn][Uu][Rr][Ll].*/) OR (data_win_eventdata_commandLine:/.*[Ss][Hh][Dd][Oo][Cc][Vv][Ww]\.[Dd][Ll][Ll].*/ AND data_win_eventdata_commandLine:/.*[Oo][Pp][Ee][Nn][Uu][Rr][Ll].*/) OR (data_win_eventdata_commandLine:/.*[Ss][Yy][Ss][Ss][Ee][Tt][Uu][Pp]\.[Dd][Ll][Ll].*/ AND data_win_eventdata_commandLine:/.*[Ss][Ee][Tt][Uu][Pp][Ii][Nn][Ff][Oo][Bb][Jj][Ee][Cc][Tt][Ii][Nn][Ss][Tt][Aa][Ll][Ll][Aa][Cc][Tt][Ii][Oo][Nn].*/) OR (data_win_eventdata_commandLine:/.*[Ss][Ee][Tt][Uu][Pp][Aa][Pp][Ii]\.[Dd][Ll][Ll].*/ AND data_win_eventdata_commandLine:/.*[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Hh][Ii][Nn][Ff][Ss][Ee][Cc][Tt][Ii][Oo][Nn].*/) OR (data_win_eventdata_commandLine:/.*[Pp][Cc][Ww][Uu][Tt][Ll]\.[Dd][Ll][Ll].*/ AND data_win_eventdata_commandLine:/.*[Ll][Aa][Uu][Nn][Cc][Hh][Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn].*/) OR (data_win_eventdata_commandLine:/.*[Dd][Ff][Ss][Hh][Ii][Mm]\.[Dd][Ll][Ll].*/ AND data_win_eventdata_commandLine:/.*[Ss][Hh][Oo][Pp][Ee][Nn][Vv][Ee][Rr][Bb][Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn].*/) OR (data_win_eventdata_commandLine:/.*[Dd][Ff][Ss][Hh][Ii][Mm]\.[Dd][Ll][Ll].*/ AND data_win_eventdata_commandLine:/.*[Ss][Hh][Oo][Pp][Ee][Nn][Vv][Ee][Rr][Bb][Ss][Hh][Oo][Rr][Tt][Cc][Uu][Tt].*/) OR (data_win_eventdata_commandLine:/.*[Ss][Cc][Rr][Oo][Bb][Jj]\.[Dd][Ll][Ll].*/ AND data_win_eventdata_commandLine:/.*[Gg][Ee][Nn][Ee][Rr][Aa][Tt][Ee][Tt][Yy][Pp][Ee][Ll][Ii][Bb].*/ AND data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp].*/) OR (data_win_eventdata_commandLine:/.*[Ss][Hh][Ii][Mm][Gg][Vv][Ww]\.[Dd][Ll][Ll].*/ AND data_win_eventdata_commandLine:/.*[Ii][Mm][Aa][Gg][Ee][Vv][Ii][Ee][Ww]_[Ff][Uu][Ll][Ll][Ss][Cc][Rr][Ee][Ee][Nn].*/ AND data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp].*/) OR (data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll].*/ AND data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/)) AND _exists_:data_win_eventdata_commandLine AND _exists_:data_win_eventdata_parentImage AND _exists_:data_win_eventdata_parentCommandLine AND NOT (data_win_eventdata_commandLine:/.*[Ss][Hh][Ee][Ll][Ll]32\.[Dd][Ll][Ll],[Cc][Oo][Nn][Tt][Rr][Oo][Ll]_[Rr][Uu][Nn][Dd][Ll][Ll] [Dd][Ee][Ss][Kk]\.[Cc][Pp][Ll],[Ss][Cc][Rr][Ee][Ee][Nn][Ss][Aa][Vv][Ee][Rr],\@[Ss][Cc][Rr][Ee][Ee][Nn][Ss][Aa][Vv][Ee][Rr].*/ OR (data_win_eventdata_parentImage:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Cc][Oo][Nn][Tt][Rr][Oo][Ll]\.[Ee][Xx][Ee]/ AND data_win_eventdata_parentCommandLine:/.*\.[Cc][Pp][Ll].*/ AND data_win_eventdata_commandLine:/.*[Ss][Hh][Ee][Ll][Ll]32\.[Dd][Ll][Ll].*/ AND data_win_eventdata_commandLine:/.*[Cc][Oo][Nn][Tt][Rr][Oo][Ll]_[Rr][Uu][Nn][Dd][Ll][Ll].*/ AND data_win_eventdata_commandLine:/.*\.[Cc][Pp][Ll].*/) OR (data_win_eventdata_parentImage:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Cc][Oo][Nn][Tt][Rr][Oo][Ll]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/\"[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]\" [Ss][Hh][Ee][Ll][Ll]32\.[Dd][Ll][Ll],[Cc][Oo][Nn][Tt][Rr][Oo][Ll]_[Rr][Uu][Nn][Dd][Ll][Ll] \"[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\.*/ AND data_win_eventdata_commandLine:/.*\.[Cc][Pp][Ll]\",/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 4aa6040b-3f28-44e3-a769-9208e5feb5ec
    name: Suspicious Rundll32 Execution With Image Extension
    reason: 'Other rundll32 LOLBin abuse: loading a payload disguised with an image extension.'
  - id: c3a99af4-35a9-4668-879e-c09aeb4f2bdf
    name: Rundll32 Execution With Uncommon DLL Extension
    reason: rundll32 loading non-DLL extensions, common packed-loader behaviour.
  - id: 1cc50f3f-1fc8-4acf-b2e9-6f172e1fdebd
    name: Suspicious Rundll32 Invoking Inline VBScript
    reason: 'Inline script execution via rundll32 javascript/vbscript: same LOLBin family.'
  - id: a1473adb-5338-4a20-b4c3-126763e2d3d3
    name: Suspicious Advpack Call Via Rundll32.EXE
    reason: advpack.dll abuse is also matched by this rule; dedicated advpack variant.
  - id: 982e9f2d-1a85-4d5b-aea4-31f5e97c6555
    name: Suspicious WebDav Client Execution Via Rundll32.EXE
    reason: rundll32 pulling content via WebDAV, remote payload delivery.
  - id: 43fa5350-db63-4b8f-9a01-789a427074e1
    name: Potential Obfuscated Ordinal Call Via Rundll32
    reason: Obfuscated ordinal calls to evade command-line detection.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: rundll32 child processes
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*rundll32\.exe/
    pivot_on: host
    window: 2h
  - name: rundll32 network activity
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*rundll32\.exe/
    pivot_on: host
    window: 2h
  - name: rundll32 launched by office or script hosts
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*rundll32\.exe/ AND data_win_eventdata_parentImage:/.*(winword|excel|outlook|mshta|wscript|cscript|powershell|cmd)\.exe/
    pivot_on: host
    window: 4h
  - name: DLLs dropped in user-writable paths
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\\(Users|ProgramData|Temp)\\.*\.dll/
    pivot_on: host
    window: 4h
