][Kk]\.[Dd][Ll][Ll].*/ AND data_win_eventdata_commandLine:/.*[Rr][Ee][Gg][Ii][Ss][Tt][Ee][Rr][Oo][Cc][Xx].*/) OR (data_win_eventdata_commandLine:/.*[Ii][Ee][Ff][Rr][Aa][Mm][Ee]\.[Dd][Ll][Ll].*/ AND data_win_eventdata_commandLine:/.*[Oo][Pp][Ee][Nn][Uu][Rr][Ll].*/) OR (data_win_eventdata_commandLine:/.*[Ss][Hh][Dd][Oo][Cc][Vv][Ww]\.[Dd][Ll][Ll].*/ AND data_win_eventdata_commandLine:/.*[Oo][Pp][Ee][Nn][Uu][Rr][Ll].*/) OR (data_win_eventdata_commandLine:/.*[Ss][Yy][Ss][Ss][Ee][Tt][Uu][Pp]\.[Dd][Ll][Ll].*/ AND data_win_eventdata_commandLine:/.*[Ss][Ee][Tt][Uu][Pp][Ii][Nn][Ff][Oo][Bb][Jj][Ee][Cc][Tt][Ii][Nn][Ss][Tt][Aa][Ll][Ll][Aa][Cc][Tt][Ii][Oo][Nn].*/) OR (data_win_eventdata_commandLine:/.*[Ss][Ee][Tt][Uu][Pp][Aa][Pp][Ii]\.[Dd][Ll][Ll].*/ AND data_win_eventdata_commandLine:/.*[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Hh][Ii][Nn][Ff][Ss][Ee][Cc][Tt][Ii][Oo][Nn].*/) OR (data_win_eventdata_commandLine:/.*[Pp][Cc][Ww][Uu][Tt][Ll]\.[Dd][Ll][Ll].*/ AND data_win_eventdata_commandLine:/.*[Ll][Aa][Uu][Nn][Cc][Hh][Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn].*/) OR (data_win_eventdata_commandLine:/.*[Dd][Ff][Ss][Hh][Ii][Mm]\.[Dd][Ll][Ll].*/ AND data_win_eventdata_commandLine:/.*[Ss][Hh][Oo][Pp][Ee][Nn][Vv][Ee][Rr][Bb][Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn].*/) OR (data_win_eventdata_commandLine:/.*[Dd][Ff][Ss][Hh][Ii][Mm]\.[Dd][Ll][Ll].*/ AND data_win_eventdata_commandLine:/.*[Ss][Hh][Oo][Pp][Ee][Nn][Vv][Ee][Rr][Bb][Ss][Hh][Oo][Rr][Tt][Cc][Uu][Tt].*/) OR (data_win_eventdata_commandLine:/.*[Ss][Cc][Rr][Oo][Bb][Jj]\.[Dd][Ll][Ll].*/ AND data_win_eventdata_commandLine:/.*[Gg][Ee][Nn][Ee][Rr][Aa][Tt][Ee][Tt][Yy][Pp][Ee][Ll][Ii][Bb].*/ AND data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp].*/) OR (data_win_eventdata_commandLine:/.*[Ss][Hh][Ii][Mm][Gg][Vv][Ww]\.[Dd][Ll][Ll].*/ AND data_win_eventdata_commandLine:/.*[Ii][Mm][Aa][Gg][Ee][Vv][Ii][Ee][Ww]_[Ff][Uu][Ll][Ll][Ss][Cc][Rr][Ee][Ee][Nn].*/ AND data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp].*/) OR (data_win_eventdata_commandLine:/.*[Cc]