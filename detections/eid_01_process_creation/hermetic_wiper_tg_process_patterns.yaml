name: Hermetic Wiper TG Process Patterns
id: 2f974656-6d83-4059-bbdf-68ac5403422f
version: 1
schema_version: "1.0"
date: "2022-09-09"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 2f974656-6d83-4059-bbdf-68ac5403422f
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects process execution patterns found in intrusions related to the Hermetic
  Wiper malware attacks against Ukraine in February 2022. MITRE ATT&CK:
  T1021.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\policydefinitions\\\\postgresql.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*CSIDL_SYSTEM_DRIVE\\\\temp\\\\sys.tmp*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* 1> \\\\\\\\127.0.0.1\\\\ADMIN$\\\\__16*"
                    case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*powershell -c *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*\\\\comsvcs.dll MiniDump *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*\\\\winupd.log full*"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\policydefinitions\postgresql.exe'; data_win_eventdata_commandLine matches
  '*CSIDL_SYSTEM_DRIVE\temp\sys.tmp*'; data_win_eventdata_commandLine matches '*
  1> \\127.0.0.1\ADMIN$\__16*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://symantec-enterprise-blogs.security.com/blogs/threat-intelligence/ukraine-wiper-malware-russia
  - https://attack.mitre.org/techniques/T1021/001/

response:
  message: >
    Hermetic Wiper TG Process Patterns detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1021.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1021.001
  custom_tags:
    - hermetic
    - wiper
    - patterns
    - process_creation
    - sysmon
    - execution
    - lateral_movement
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Pp][Oo][Ll][Ii][Cc][Yy][Dd][Ee][Ff][Ii][Nn][Ii][Tt][Ii][Oo][Nn][Ss]\\[Pp][Oo][Ss][Tt][Gg][Rr][Ee][Ss][Qq][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Cc][Ss][Ii][Dd][Ll]_[Ss][Yy][Ss][Tt][Ee][Mm]_[Dd][Rr][Ii][Vv][Ee]\\[Tt][Ee][Mm][Pp]\\[Ss][Yy][Ss]\.[Tt][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.* 1\> \\\\127\.0\.0\.1\\[Aa][Dd][Mm][Ii][Nn]\$\\__16.*/ OR (data_win_eventdata_commandLine:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll] -[Cc] .*/ AND data_win_eventdata_commandLine:/.*\\[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll] [Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp] .*/ AND data_win_eventdata_commandLine:/.*\\[Ww][Ii][Nn][Uu][Pp][Dd]\.[Ll][Oo][Gg] [Ff][Uu][Ll][Ll].*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: HermeticWiper intrusions used comsvcs.dll MiniDump (winupd.log) to steal credentials before spreading; same technique as this rule's PowerShell branch.
  - id: 646ea171-dded-4578-8a4d-65e9822892e3
    name: Process Memory Dump Via Comsvcs.DLL
    reason: Generic comsvcs MiniDump variant that catches different output names in the same pre-wipe credential theft step.
  - id: fdfcbd78-48f1-4a4b-90ac-d82241e368c5
    name: PsExec Service Execution
    reason: The ADMIN$ redirected output pattern (__16) indicates PsExec or Impacket-style lateral execution used to push the wiper.
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: Wiper campaigns remove shadow copies so data cannot be recovered after destruction.
  - id: 639c9081-f482-47d3-a0bd-ddee3d4ecd76
    name: All Backups Deleted Via Wbadmin.EXE
    reason: Backup catalog deletion precedes disk wiping in destructive attacks.
  - id: 1444443e-6757-43e4-9ea4-c8fc705f79a2
    name: Boot Configuration Tampering Via Bcdedit.EXE
    reason: Disabling boot recovery prevents the victim from repairing a wiped system.
  - id: 236e7c8e-c9d9-11eb-a824-acde48001122
    name: Disable Logs Using WevtUtil
    reason: Log tampering to hinder forensics during destructive operations.
  - id: fdb829a8-db84-4832-b64b-3e964cd44f01
    name: Windows Eventlog Cleared Via Wevtutil
    reason: Event log clearing accompanies or follows wiper execution.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Remote execution tools and ADMIN$ output redirection
    query: (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Pp][Ss][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]|\\[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]\.[Ee][Xx][Ee]|\\[Pp][Aa][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]|\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee])/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Aa][Dd][Mm][Ii][Nn]\$.*/ OR data_win_eventdata_commandLine:/.*[Ww][Mm][Ii][Cc] /[Nn][Oo][Dd][Ee].*/))
    pivot_on: host
    window: 4h
  - name: Backup, shadow copy and recovery destruction
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn] [Dd][Ee][Ll][Ee][Tt][Ee] [Ss][Hh][Aa][Dd][Oo][Ww][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ww][Bb][Aa][Dd][Mm][Ii][Nn] [Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Bb][Cc][Dd][Ee][Dd][Ii][Tt] /[Ss][Ee][Tt].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Cc][Oo][Vv][Ee][Rr][Yy][Ee][Nn][Aa][Bb][Ll][Ee][Dd] [Nn][Oo].*/ OR data_win_eventdata_commandLine:/.*[Ss][Hh][Aa][Dd][Oo][Ww][Cc][Oo][Pp][Yy] [Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Ss][Ii][Zz][Ee] [Ss][Hh][Aa][Dd][Oo][Ww][Ss][Tt][Oo][Rr][Aa][Gg][Ee].*/)
    pivot_on: host
    window: 4h
  - name: LSASS access and credential dump commands
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/))
    pivot_on: host
    window: 4h
  - name: Driver loads and new system-path driver files
    query: data_win_system_eventID:"6" OR (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\[Dd][Rr][Ii][Vv][Ee][Rr][Ss]\\.*\.[Ss][Yy][Ss]/)
    pivot_on: host
    window: 4h
  - name: Log clearing and security tool tampering
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll] [Cc][Ll].*/ OR data_win_eventdata_commandLine:/.*[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll] [Cc][Ll][Ee][Aa][Rr]\-[Ll][Oo][Gg].*/ OR data_win_eventdata_commandLine:/.*[Cc][Ll][Ee][Aa][Rr]\-[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]\-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee][Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg].*/)
    pivot_on: host
    window: 4h
