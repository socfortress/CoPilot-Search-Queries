name: Suspicious Windows Defender Folder Exclusion Added Via Reg.EXE
id: 48917adc-a28e-4f5d-b729-11e75da8941f
version: 1
schema_version: "1.0"
date: "2023-02-04"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 48917adc-a28e-4f5d-b729-11e75da8941f
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the usage of "reg.exe" to add Defender folder exclusions. Qbot has
  been seen using this technique to add exclusions for folders within AppData
  and ProgramData. MITRE ATT&CK: T1685.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\reg.exe"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*SOFTWARE\\\\Microsoft\\\\Windows Defender\\\\Exclusions\\\\Paths*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*SOFTWARE\\\\Microsoft\\\\Microsoft Antimalware\\\\Exclusions\\\\Paths*"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*ADD *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*/t *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*REG_DWORD *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*/v *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*/d *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine: "*0*"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches '*\reg.exe';
  data_win_eventdata_commandLine matches '*SOFTWARE\Microsoft\Windows
  Defender\Exclusions\Paths*'; data_win_eventdata_commandLine matches
  '*SOFTWARE\Microsoft\Microsoft Antimalware\Exclusions\Paths*', among other
  conditions.

known_false_positives: >
  Legitimate use. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://thedfirreport.com/2022/02/07/qbot-likes-to-move-it-move-it/
  - https://redcanary.com/threat-detection-report/threats/qbot/
  - https://attack.mitre.org/techniques/T1685/

response:
  message: >
    Suspicious Windows Defender Folder Exclusion Added Via Reg.EXE detected on
    host $agent_name$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. Matched data_win_eventdata_commandLine:
    $data_win_eventdata_commandLine$. MITRE ATT&CK: T1685
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685
  custom_tags:
    - defender
    - folder
    - exclusion
    - process_creation
    - sysmon
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Rr][Ee][Gg]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr]\\[Ee][Xx][Cc][Ll][Uu][Ss][Ii][Oo][Nn][Ss]\\[Pp][Aa][Tt][Hh][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt] [Aa][Nn][Tt][Ii][Mm][Aa][Ll][Ww][Aa][Rr][Ee]\\[Ee][Xx][Cc][Ll][Uu][Ss][Ii][Oo][Nn][Ss]\\[Pp][Aa][Tt][Hh][Ss].*/) AND data_win_eventdata_commandLine:/.*[Aa][Dd][Dd] .*/ AND data_win_eventdata_commandLine:/.*\/[Tt] .*/ AND data_win_eventdata_commandLine:/.*[Rr][Ee][Gg]_[Dd][Ww][Oo][Rr][Dd] .*/ AND data_win_eventdata_commandLine:/.*\/[Vv] .*/ AND data_win_eventdata_commandLine:/.*\/[Dd] .*/ AND data_win_eventdata_commandLine:/.*0.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a982fc9c-6333-4ffb-a51d-addb04e8b529
    name: Windows Defender Exclusions Added - Registry
    reason: Registry-set view of the reg.exe add; confirms the exclusion actually landed in the Exclusions\Paths key.
  - id: 1321dc4e-a1fe-481d-a016-52c45f0c8b4f
    name: Windows Defender Exclusions Added
    reason: Defender's own operational exclusion-added event corroborates the exclusion took effect.
  - id: c1344fa2-323b-4d2e-9176-84b4d4821c88
    name: Windows Defender Exclusions Added - PowerShell
    reason: Same exclusion goal via Add-MpPreference; operators swap between PowerShell and reg.exe.
  - id: 452bce90-6fb0-43cc-97a5-affc283139b3
    name: Suspicious Windows Defender Registry Key Tampering Via Reg.EXE
    reason: Companion reg.exe tampering of other Defender keys in the same hands-on session.
  - id: 0eb46774-f1ab-4a74-8238-1155855f2263
    name: Disable Windows Defender Functionalities Via Registry Keys
    reason: Registry-level disable of Defender functions often accompanies a folder exclusion.
  - id: 93d298a1-d28f-47f1-a468-d971e7796679
    name: Disable Tamper Protection on Windows Defender
    reason: Disabling Tamper Protection is the usual precondition for registry edits to Defender to stick.
  - id: b28e58e4-2a72-4fae-bdee-0fbe904db642
    name: Windows Defender Real-time Protection Disabled
    reason: Real-time protection disabled is the escalation once exclusions are staged for the payload.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other Defender exclusion or config tampering
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Aa]dd-[Mm]p[Pp]reference.*/ OR /.*[Ss]et-[Mm]p[Pp]reference.*/ OR /.*[Ee]xclusion.*/ OR /.*[Dd]isable[Rr]ealtime.*/)
    pivot_on: host
    window: 6h
  - name: Payload staging in AppData/ProgramData
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(/.*\\AppData\\.*\.(exe|dll|ps1|bat|js|vbs)/ OR /.*\\ProgramData\\.*\.(exe|dll|ps1|bat|js|vbs)/)
    pivot_on: host
    window: 6h
  - name: Execution from AppData/ProgramData
    query: data_win_system_eventID:1 AND data_win_eventdata_image:(/.*\\AppData\\.*\.exe/ OR /.*\\ProgramData\\.*\.exe/)
    pivot_on: host
    window: 6h
  - name: Defender service stop or disable
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ww]in[Dd]efend.*/ OR /.*[Ww]d[Ff]ilter.*/ OR /.*[Ss]ense.*/) AND data_win_eventdata_commandLine:(/.*(stop|disabled|delete).*/)
    pivot_on: host
    window: 6h
  - name: Shell that launched the reg.exe call
    query: data_win_system_eventID:1 AND data_win_eventdata_image:(/.*\\(cmd|powershell|pwsh|wscript|cscript|mshta)\.exe/) AND data_win_eventdata_commandLine:(/.*[Ee]xclusions.*/)
    pivot_on: host
    window: 2h
