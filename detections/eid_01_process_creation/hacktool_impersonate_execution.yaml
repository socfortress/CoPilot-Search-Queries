name: HackTool - Impersonate Execution
id: cf0c254b-22f1-4b2b-8221-e137b3c0af94
version: 1
schema_version: "1.0"
date: "2024-11-23"
author: Sai Prashanth Pulisetti @pulisettis
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: cf0c254b-22f1-4b2b-8221-e137b3c0af94
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of the Impersonate tool. Which can be used to manipulate
  tokens on a Windows computers remotely (PsExec/WmiExec) or interactively.
  MITRE ATT&CK: T1134.001, T1134.003.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*impersonate.exe*"
                          case_insensitive: true
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* list *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* exec *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* adduser *"
                                case_insensitive: true
                        minimum_should_match: 1
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*MD5=9520714AB576B0ED01D1513691377D01*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*SHA256=E81CC96E2118DC4FBFE5BAD1604E0AC7681960143E2101E1A024D52264BB0A8A*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=0A358FFC1697B7A07D0E817AC740DF62*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_hashes
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*impersonate.exe*'; data_win_eventdata_commandLine matches '* list *';
  data_win_eventdata_commandLine matches '* exec *', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://sensepost.com/blog/2022/abusing-windows-tokens-to-compromise-active-directory-without-touching-lsass/
  - https://github.com/sensepost/impersonate
  - https://attack.mitre.org/techniques/T1134/001/
  - https://attack.mitre.org/techniques/T1134/003/

response:
  message: >
    HackTool - Impersonate Execution detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_hashes: $data_win_eventdata_hashes$. MITRE ATT&CK:
    T1134.001, T1134.003
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_hashes
      type: file_hash

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1134.001
    - T1134.003
  custom_tags:
    - hacktool
    - impersonate
    - process_creation
    - sysmon
    - privilege_escalation
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND ((data_win_eventdata_commandLine:/.*[Ii][Mm][Pp][Ee][Rr][Ss][Oo][Nn][Aa][Tt][Ee]\.[Ee][Xx][Ee].*/ AND (data_win_eventdata_commandLine:/.* [Ll][Ii][Ss][Tt] .*/ OR data_win_eventdata_commandLine:/.* [Ee][Xx][Ee][Cc] .*/ OR data_win_eventdata_commandLine:/.* [Aa][Dd][Dd][Uu][Ss][Ee][Rr] .*/)) OR data_win_eventdata_hashes:/.*[Mm][Dd]5=9520714[Aa][Bb]576[Bb]0[Ee][Dd]01[Dd]1513691377[Dd]01.*/ OR data_win_eventdata_hashes:/.*[Ss][Hh][Aa]256=[Ee]81[Cc][Cc]96[Ee]2118[Dd][Cc]4[Ff][Bb][Ff][Ee]5[Bb][Aa][Dd]1604[Ee]0[Aa][Cc]7681960143[Ee]2101[Ee]1[Aa]024[Dd]52264[Bb][Bb]0[Aa]8[Aa].*/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=0[Aa]358[Ff][Ff][Cc]1697[Bb]7[Aa]07[Dd]0[Ee]817[Aa][Cc]740[Dd][Ff]62.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: f89b08d0-77ad-4728-817b-9b16c5a69c7a
    name: HackTool - SharpImpersonation Execution
    reason: Same token-impersonation objective with a sibling tool; operators swap tools if one is blocked.
  - id: 6bd75993-9888-4f91-9404-e1e4e4e34b77
    name: HackTool - LocalPotato Execution
    reason: Potato-style local privilege escalation to SYSTEM commonly precedes token manipulation tooling.
  - id: e8d34729-86a4-4140-adfd-0a29c2106307
    name: HackTool - CoercedPotato Execution
    reason: Obtains a SYSTEM token via coercion; Impersonate then reuses tokens to run commands or add users.
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: Token elevation and credential theft run together; an impersonated high-priv context enables credential dumping.
  - id: 10c14723-61c7-4c75-92ca-9af245723ad2
    name: HackTool - Potential Impacket Lateral Movement Activity
    reason: Impersonate is usable remotely via PsExec/WmiExec; Impacket exec spawns the same remote command chain.
  - id: 27c3a83d-cada-47c6-9042-67baf19d2574
    name: Detect PsExec With accepteula Flag
    reason: PsExec is the remote delivery path named for running Impersonate on another host.
  - id: 683e6196-b8e8-11eb-9a79-acde48001122
    name: Detect Renamed PSExec
    reason: Evasive PsExec use for remote execution of the token tool.
  - id: 022eaba8-f0bf-4dd9-9217-4604b0bb3bb0
    name: HackTool - Wmiexec Default Powershell Command
    reason: WmiExec is the other remote delivery path; shows a semi-interactive remote shell on the same host.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Account creation or admin group changes after token impersonation
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Nn][Ee][Tt] [Uu][Ss][Ee][Rr]|[Nn][Ee][Tt]1 [Uu][Ss][Ee][Rr]|[Nn][Ee][Tt] [Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp]|[Nn][Ee][Tt]1 [Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp]).*/ AND data_win_eventdata_commandLine:/.*( /[Aa][Dd][Dd]|[Aa][Dd][Mm][Ii][Nn][Ii][Ss][Tt][Rr][Aa][Tt][Oo][Rr][Ss]).*/
    pivot_on: host
    window: 2h
  - name: Remote service or PsExec-style execution on host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*([Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]|[Pp][Ss][Ee][Xx][Ee][Cc]|[Pp][Aa][Ee][Xx][Ee][Cc]|[Rr][Ee][Mm][Cc][Oo][Mm]).*/ OR data_win_eventdata_parentImage:/.*([Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]|[Pp][Aa][Ee][Xx][Ee][Cc]|[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee]).*/)
    pivot_on: host
    window: 4h
  - name: Token or credential access tooling commands
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa]|[Tt][Oo][Kk][Ee][Nn]::[Ee][Ll][Ee][Vv][Aa][Tt][Ee]|[Pp][Rr][Ii][Vv][Ii][Ll][Ee][Gg][Ee]::[Dd][Ee][Bb][Uu][Gg]|[Ll][Ss][Aa][Ss][Ss]|[Ww][Hh][Oo][Aa][Mm][Ii] /[Pp][Rr][Ii][Vv]|[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]).*/
    pivot_on: host
    window: 4h
  - name: Impersonate binary written to disk
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*([Ii][Mm][Pp][Ee][Rr][Ss][Oo][Nn][Aa][Tt][Ee].[Ee][Xx][Ee]).*/
    pivot_on: host
    window: 24h
  - name: Network or explicit-credential logons by the same user
    query: (data_win_system_eventID:"4648" OR (data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"9")))
    pivot_on: user
    window: 4h
