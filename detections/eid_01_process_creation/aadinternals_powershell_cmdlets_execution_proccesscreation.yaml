name: AADInternals PowerShell Cmdlets Execution - ProccessCreation
id: c86500e9-a645-4680-98d7-f882c70c1ea3
version: 1
schema_version: "1.0"
date: "2025-02-06"
author: Austin Songer (@austinsonger), Nasreddine Bencherchali (Nextron Systems), Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: c86500e9-a645-4680-98d7-f882c70c1ea3
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects ADDInternals Cmdlet execution. A tool for administering Azure AD and
  Office 365. Which can be abused by threat actors to attack Azure AD or Office
  365.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\powershell.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\powershell_ise.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\pwsh.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "PowerShell.Exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "pwsh.dll"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Add-AADInt*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*ConvertTo-AADInt*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Disable-AADInt*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Enable-AADInt*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Export-AADInt*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Find-AADInt*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Get-AADInt*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Grant-AADInt*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Initialize-AADInt*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Install-AADInt*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Invoke-AADInt*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Join-AADInt*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*New-AADInt*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Open-AADInt*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Read-AADInt*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Register-AADInt*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Remove-AADInt*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Reset-AADInt*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Resolve-AADInt*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Restore-AADInt*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Save-AADInt*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Search-AADInt*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Send-AADInt*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Set-AADInt*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Start-AADInt*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Unprotect-AADInt*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Update-AADInt*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\powershell.exe'; data_win_eventdata_image matches '*\powershell_ise.exe';
  data_win_eventdata_image matches '*\pwsh.exe', among other conditions.

known_false_positives: >
  Legitimate use of the library for administrative activity. Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://o365blog.com/aadinternals/
  - https://github.com/Gerenios/AADInternals

response:
  message: >
    AADInternals PowerShell Cmdlets Execution - ProccessCreation detected on
    host $agent_name$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  custom_tags:
    - aadinternals
    - powershell
    - cmdlets
    - process_creation
    - sysmon
    - execution
    - reconnaissance
    - discovery
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]_[Ii][Ss][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Pp][Ww][Ss][Hh]\.[Dd][Ll][Ll]/) AND (data_win_eventdata_commandLine:/.*[Aa][Dd][Dd]-[Aa][Aa][Dd][Ii][Nn][Tt].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Nn][Vv][Ee][Rr][Tt][Tt][Oo]-[Aa][Aa][Dd][Ii][Nn][Tt].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee]-[Aa][Aa][Dd][Ii][Nn][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ee][Nn][Aa][Bb][Ll][Ee]-[Aa][Aa][Dd][Ii][Nn][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ee][Xx][Pp][Oo][Rr][Tt]-[Aa][Aa][Dd][Ii][Nn][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ff][Ii][Nn][Dd]-[Aa][Aa][Dd][Ii][Nn][Tt].*/ OR data_win_eventdata_commandLine:/.*[Gg][Ee][Tt]-[Aa][Aa][Dd][Ii][Nn][Tt].*/ OR data_win_eventdata_commandLine:/.*[Gg][Rr][Aa][Nn][Tt]-[Aa][Aa][Dd][Ii][Nn][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Ii][Tt][Ii][Aa][Ll][Ii][Zz][Ee]-[Aa][Aa][Dd][Ii][Nn][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Ss][Tt][Aa][Ll][Ll]-[Aa][Aa][Dd][Ii][Nn][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Aa][Aa][Dd][Ii][Nn][Tt].*/ OR data_win_eventdata_commandLine:/.*[Jj][Oo][Ii][Nn]-[Aa][Aa][Dd][Ii][Nn][Tt].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Ww]-[Aa][Aa][Dd][Ii][Nn][Tt].*/ OR data_win_eventdata_commandLine:/.*[Oo][Pp][Ee][Nn]-[Aa][Aa][Dd][Ii][Nn][Tt].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Aa][Dd]-[Aa][Aa][Dd][Ii][Nn][Tt].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Gg][Ii][Ss][Tt][Ee][Rr]-[Aa][Aa][Dd][Ii][Nn][Tt].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Mm][Oo][Vv][Ee]-[Aa][Aa][Dd][Ii][Nn][Tt].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Ss][Ee][Tt]-[Aa][Aa][Dd][Ii][Nn][Tt].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Ss][Oo][Ll][Vv][Ee]-[Aa][Aa][Dd][Ii][Nn][Tt].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Ss][Tt][Oo][Rr][Ee]-[Aa][Aa][Dd][Ii][Nn][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ss][Aa][Vv][Ee]-[Aa][Aa][Dd][Ii][Nn][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Aa][Rr][Cc][Hh]-[Aa][Aa][Dd][Ii][Nn][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Nn][Dd]-[Aa][Aa][Dd][Ii][Nn][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Aa][Aa][Dd][Ii][Nn][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ss][Tt][Aa][Rr][Tt]-[Aa][Aa][Dd][Ii][Nn][Tt].*/ OR data_win_eventdata_commandLine:/.*[Uu][Nn][Pp][Rr][Oo][Tt][Ee][Cc][Tt]-[Aa][Aa][Dd][Ii][Nn][Tt].*/ OR data_win_eventdata_commandLine:/.*[Uu][Pp][Dd][Aa][Tt][Ee]-[Aa][Aa][Dd][Ii][Nn][Tt].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c4db14d9-7909-48b4-a054-aa14d89dbb19
    name: Malicious PowerShell Process - Encoded Command
    reason: AADInternals is often loaded via encoded or staged PowerShell; shows how the session started.
  - id: 9be56c82-b1cc-4318-87eb-d138afaaca39
    name: Malicious PowerShell Process - Execution Policy Bypass
    reason: Policy bypass typically precedes Import-Module of an unsigned AADInternals module.
  - id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
    name: PowerShell Download and Execution Cradles
    reason: AADInternals is commonly pulled from GitHub/PSGallery via a cradle just before use.
  - id: c31364f7-8be6-4b77-8483-dd2b5a7b69a3
    name: Import PowerShell Modules From Suspicious Directories - ProcCreation
    reason: Importing the tool's module from a temp or user path precedes cmdlet execution.
  - id: e8a52bbd-bced-459f-bd93-64db45ce7657
    name: Potential Suspicious PowerShell Module File Created
    reason: Module files dropped to disk are the staging step for the AADInternals cmdlets.
  - id: 6d3a3952-6530-44a3-8554-cf17c116c615
    name: Potentially Suspicious JWT Token Search Via CLI
    reason: Token hunting on the endpoint feeds Azure AD token abuse with AADInternals.
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: Credential/PRT theft with Mimikatz often supplies the secrets AADInternals then uses against Azure AD.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Module download or install of AADInternals (PSGallery, GitHub)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ii][Nn][Ss][Tt][Aa][Ll][Ll]-[Mm][Oo][Dd][Uu][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ii][Mm][Pp][Oo][Rr][Tt]-[Mm][Oo][Dd][Uu][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Gg][Ee][Rr][Ee][Nn][Ii][Oo][Ss].*/ OR data_win_eventdata_commandLine:/.*[Aa][Aa][Dd][Ii][Nn][Tt][Ee][Rr][Nn][Aa][Ll][Ss].*/)
    pivot_on:
    - host
    window: 6h
  - name: AAD token, PRT and ADFS secret theft commands
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Gg][Ee][Tt]-[Aa][Aa][Dd][Ii][Nn][Tt][Aa][Cc][Cc][Ee][Ss][Ss][Tt][Oo][Kk][Ee][Nn].*/ OR data_win_eventdata_commandLine:/.*[Gg][Ee][Tt]-[Aa][Aa][Dd][Ii][Nn][Tt][Uu][Ss][Ee][Rr][Pp][Rr][Tt][Tt][Oo][Kk][Ee][Nn].*/ OR data_win_eventdata_commandLine:/.*[Gg][Ee][Tt]-[Aa][Aa][Dd][Ii][Nn][Tt][Ll][Oo][Gg][Ii][Nn][Ii][Nn][Ff][Oo][Rr][Mm][Aa][Tt][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*[Gg][Ee][Tt]-[Aa][Aa][Dd][Ii][Nn][Tt][Ss][Yy][Nn][Cc][Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ee][Xx][Pp][Oo][Rr][Tt]-[Aa][Aa][Dd][Ii][Nn][Tt][Aa][Dd][Ff][Ss][Ss][Ii][Gg][Nn][Ii][Nn][Gg][Cc][Ee][Rr][Tt][Ii][Ff][Ii][Cc][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Pp][Rr][Tt][Tt][Oo][Kk][Ee][Nn].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ss][Rr][Ee][Gg][Cc][Mm][Dd].*/)
    pivot_on:
    - host
    window: 6h
  - name: Azure AD / M365 admin cmdlets (federation changes, Graph/MSOnline connects)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Nn][Nn][Ee][Cc][Tt]-[Mm][Gg][Gg][Rr][Aa][Pp][Hh].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Nn][Nn][Ee][Cc][Tt]-[Aa][Zz][Uu][Rr][Ee][Aa][Dd].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Nn][Nn][Ee][Cc][Tt]-[Mm][Ss][Oo][Ll][Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Nn][Nn][Ee][Cc][Tt]-[Aa][Zz][Aa][Cc][Cc][Oo][Uu][Nn][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Mm][Ss][Oo][Ll][Dd][Oo][Mm][Aa][Ii][Nn][Aa][Uu][Tt][Hh][Ee][Nn][Tt][Ii][Cc][Aa][Tt][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Ww]-[Mm][Ss][Oo][Ll][Ff][Ee][Dd][Ee][Rr][Aa][Tt][Ee][Dd][Dd][Oo][Mm][Aa][Ii][Nn].*/)
    pivot_on:
    - user
    window: 6h
  - name: 'Credential access on the host: LSASS, DPAPI, vault'
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Dd][Pp][Aa][Pp][Ii].*/ OR data_win_eventdata_commandLine:/.*[Vv][Aa][Uu][Ll][Tt][Cc][Mm][Dd].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/)
    pivot_on:
    - host
    window: 6h
