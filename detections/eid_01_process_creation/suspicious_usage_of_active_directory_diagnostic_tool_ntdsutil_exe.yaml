name: Suspicious Usage Of Active Directory Diagnostic Tool (ntdsutil.exe)
id: a58353df-af43-4753-bad0-cd83ef35eef5
version: 1
schema_version: "1.0"
date: "2022-09-14"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: a58353df-af43-4753-bad0-cd83ef35eef5
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of ntdsutil.exe to perform different actions such as
  restoring snapshots...etc. MITRE ATT&CK: T1003.003.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\ntdsutil.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "ntdsutil.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*snapshot*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*mount *"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*ac*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* i*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* ntds*"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\ntdsutil.exe'; data_win_eventdata_originalFileName equals 'ntdsutil.exe';
  data_win_eventdata_commandLine matches '*snapshot*', among other conditions.

known_false_positives: >
  Legitimate usage to restore snapshots. Legitimate admin activity. Baseline
  expected activity in your environment and tune this detection before relying
  on it for automated response.

references:
  - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2012-r2-and-2012/cc731620(v=ws.11)
  - https://symantec-enterprise-blogs.security.com/blogs/threat-intelligence/espionage-asia-governments
  - https://attack.mitre.org/techniques/T1003/003/

response:
  message: >
    Suspicious Usage Of Active Directory Diagnostic Tool (ntdsutil.exe) detected
    on host $agent_name$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1003.003
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.003
  custom_tags:
    - active
    - directory
    - diagnostic
    - process_creation
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/) AND ((data_win_eventdata_commandLine:/.*[Ss][Nn][Aa][Pp][Ss][Hh][Oo][Tt].*/ AND data_win_eventdata_commandLine:/.*[Mm][Oo][Uu][Nn][Tt] .*/) OR (data_win_eventdata_commandLine:/.*[Aa][Cc].*/ AND data_win_eventdata_commandLine:/.* [Ii].*/ AND data_win_eventdata_commandLine:/.* [Nn][Tt][Dd][Ss].*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: da63bc76-61ae-11eb-ae93-0242ac130002
    name: Ntdsutil Export NTDS
    reason: IFM/snapshot activity usually ends in exporting ntds.dit.
  - id: 2afafd61-6aae-4df4-baed-139fa1f4c345
    name: Invocation of Active Directory Diagnostic Tool (ntdsutil.exe)
    reason: Same tool invocation seen by a broader rule; confirms scope of use.
  - id: 8bc64091-6875-4881-aaf9-7bd25b5dda08
    name: Suspicious Process Patterns NTDS.DIT Exfil
    reason: Process patterns typical of copying ntds.dit after a snapshot mount.
  - id: aa92fd02-09f2-48b0-8a93-864813fb8f41
    name: Conti NTDS Exfiltration Command
    reason: Ransomware playbook using ntdsutil snapshots then exfiltration.
  - id: 4e7050dd-e548-483f-b7d6-527ab4fa784d
    name: NTDS.DIT Creation By Uncommon Parent Process
    reason: Resulting ntds.dit copy written to disk.
  - id: 3a8da4e0-36c1-40d2-8b29-b3e890d5172a
    name: NTDS Exfiltration Filename Patterns
    reason: Dumped files named per known exfil patterns.
  - id: c73124a7-3e89-44a3-bdc1-25fe4df754b1
    name: Copy From VolumeShadowCopy Via Cmd.EXE
    reason: Alternative route to ntds.dit through a shadow copy.
  - id: d372f928-ce4f-11eb-a762-acde48001122
    name: Esentutl SAM Copy
    reason: Companion credential database copy often used with the NTDS dump.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: ntdsutil activity commands
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*\\[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll]\.exe/ OR data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll].*/)
    pivot_on: host
    window: 4h
  - name: NTDS and SYSTEM hive copying
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Nn][Tt][Dd][Ss]\.dit.*/ OR /.*reg(\.exe)? .*save.*[Hh][Kk][Ll][Mm]\\[Ss][Yy][Ss][Tt][Ee][Mm].*/)
    pivot_on: host
    window: 4h
  - name: Shadow copy and snapshot tooling
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*vssadmin.*create.*shadow.*/ OR /.*[Dd]isk[Ss]hadow.*/ OR /.*[Ww]mic.*shadowcopy.*call create.*/ OR /.*[Gg]lobalroot.*/)
    pivot_on: host
    window: 4h
  - name: Archiving of dumped data
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*7z.* a .*/ OR /.*rar.* a .*/ OR /.*[Cc]ompress-[Aa]rchive.*/) AND data_win_eventdata_commandLine:(/.*[Nn][Tt][Dd][Ss].*/ OR /.*[Ss][Yy][Ss][Tt][Ee][Mm].*/)
    pivot_on: host
    window: 6h
  - name: Credential tool follow-up
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ss]ecretsdump.*/ OR /.*[Mm]imikatz.*/ OR /.*[Ll]sadump.*/ OR /.*[Dd][Cc][Ss]ync.*/)
    pivot_on: host
    window: 6h
