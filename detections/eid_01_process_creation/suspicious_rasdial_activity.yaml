name: Suspicious RASdial Activity
id: 6bba49bf-7f8c-47d6-a1bb-6b4dece4640e
version: 1
schema_version: "1.0"
date: "2021-11-27"
author: juju4
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 6bba49bf-7f8c-47d6-a1bb-6b4dece4640e
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious process related to rasdial.exe. MITRE ATT&CK: T1059.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*rasdial.exe"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*rasdial.exe'.

known_false_positives: >
  False positives depend on scripts and administrative tools used in the
  monitored environment. Baseline expected activity in your environment and tune
  this detection before relying on it for automated response.

references:
  - https://twitter.com/subTee/status/891298217907830785
  - https://attack.mitre.org/techniques/T1059/

response:
  message: >
    Suspicious RASdial Activity detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1059
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059
  custom_tags:
    - rasdial
    - process_creation
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Rr][Aa][Ss][Dd][Ii][Aa][Ll]\.[Ee][Xx][Ee]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: cd3d1298-eb3b-476c-ac67-12847de55813
    name: DLL Execution via Rasautou.exe
    reason: Rasautou is the sibling RAS binary abused for DLL proxy execution; same toolchain family as rasdial misuse.
  - id: 99793437-3e16-439b-be0f-078782cf953d
    name: Tap Installer Execution
    reason: Installing a TAP/VPN adapter commonly accompanies setting up an attacker-controlled VPN dial-up.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: rasdial with phonebook, disconnect or credentials
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Rr][Aa][Ss][Dd][Ii][Aa][Ll])\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*([Pp][Hh][Oo][Nn][Ee][Bb][Oo][Oo][Kk]|\.[Pp][Bb][Kk]|\/[Dd][Ii][Ss][Cc][Oo][Nn][Nn][Ee][Cc][Tt]|[Pp][Aa][Ss][Ss]).*/
    pivot_on: host
    window: 4h
  - name: Shells invoking rasdial
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Cc][Mm][Dd]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt])\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*([Rr][Aa][Ss][Dd][Ii][Aa][Ll]).*/
    pivot_on: host
    window: 4h
  - name: Phonebook file creation
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.[Pp][Bb][Kk]/
    pivot_on: host
    window: 4h
  - name: Outbound VPN-port connections
    query: data_win_system_eventID:"3" AND (data_win_eventdata_destinationPort:"1723" OR data_win_eventdata_destinationPort:"500" OR data_win_eventdata_destinationPort:"4500" OR data_win_eventdata_destinationPort:"1701")
    pivot_on: host
    window: 4h
