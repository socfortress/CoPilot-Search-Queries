name: Php Inline Command Execution
id: d81871ef-5738-47ab-9797-7a9c90cd4bfb
version: 1
schema_version: "1.0"
date: "2023-01-02"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: d81871ef-5738-47ab-9797-7a9c90cd4bfb
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of php using the "-r" flag. This is could be used as a way
  to launch a reverse shell or execute live php code. MITRE ATT&CK: T1059.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\php.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "php.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* -r*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches '*\php.exe';
  data_win_eventdata_originalFileName equals 'php.exe';
  data_win_eventdata_commandLine matches '* -r*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.php.net/manual/en/features.commandline.php
  - https://www.revshells.com/
  - https://pentestmonkey.net/cheat-sheet/shells/reverse-shell-cheat-sheet
  - https://attack.mitre.org/techniques/T1059/

response:
  message: >
    Php Inline Command Execution detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1059
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059
  custom_tags:
    - inline
    - process_creation
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Pp][Hh][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Pp][Hh][Pp]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.* -[Rr].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e31033fc-33f0-4020-9a16-faf9b31cbf08
    name: PUA - Netcat Suspicious Execution
    reason: php -r often runs a socket reverse shell; netcat is the alternative shell tool.
  - id: fa3c117a-bc0d-416e-a31b-0c0e80653efb
    name: Chopper Webshell Process Pattern
    reason: Web server compromise that could precede php -r invocation.
  - id: bed2a484-9348-4143-8a8a-b801c979301c
    name: Webshell Detection With Command Line Keywords
    reason: Webshell-driven command execution on the same host is the likely origin.
  - id: 4ebc877f-4612-45cb-b3a5-8e3834db36c9
    name: Webshell Hacking Activity Patterns
    reason: Post-exploitation recon following a PHP foothold.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: PHP reverse-shell primitives
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(*fsockopen* OR *proc_open* OR *socket_create* OR *shell_exec* OR *passthru*)
    pivot_on: host
    window: 2h
  - name: Web server/PHP parents spawning shells
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:(*\\php.exe OR *\\php-cgi.exe OR *\\httpd.exe OR *\\w3wp.exe OR *\\nginx.exe) AND data_win_eventdata_image:(*\\cmd.exe OR *\\powershell.exe)
    pivot_on: host
    window: 2h
  - name: Recon commands after execution
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(*whoami* OR *net\ user* OR *ipconfig* OR *systeminfo*)
    pivot_on: host
    window: 2h
  - name: Tool download via certutil/bitsadmin/curl
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(*certutil*urlcache* OR *bitsadmin*transfer* OR *curl*http* OR *Invoke-WebRequest*)
    pivot_on: host
    window: 2h
