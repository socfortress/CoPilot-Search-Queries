name: Suspicious Ping/Del Command Combination
id: 54786ddc-5b8a-11ed-9b6a-0242ac120002
version: 1
schema_version: "1.0"
date: "2024-03-05"
author: Ilya Krestinichev
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 54786ddc-5b8a-11ed-9b6a-0242ac120002
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a method often used by ransomware. Which combines the "ping" to wait a
  couple of seconds and then "del" to delete the file in question. Its used to
  hide the file responsible for the initial infection for example. MITRE ATT&CK:
  T1070.004.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -n *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /n *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* –n *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* —n *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* ―n *"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*Nul*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -f *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /f *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* –f *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* —f *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* ―f *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -q *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /q *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* –q *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* —q *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* ―q *"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*ping*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*del *"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches '* -n
  *'; data_win_eventdata_commandLine matches '* /n *';
  data_win_eventdata_commandLine matches '* –n *', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://blog.sygnia.co/kaseya-ransomware-supply-chain-attack
  - https://media.kasperskycontenthub.com/wp-content/uploads/sites/43/2022/06/23093553/Common-TTPs-of-the-modern-ransomware_low-res.pdf
  - https://www.acronis.com/en-us/blog/posts/lockbit-ransomware/
  - https://symantec-enterprise-blogs.security.com/blogs/threat-intelligence/blackbyte-exbyte-ransomware
  - https://attack.mitre.org/techniques/T1070/004/

response:
  message: >
    Suspicious Ping/Del Command Combination detected on host $agent_name$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1070.004
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1070.004
  custom_tags:
    - combination
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.* -[Nn] .*/ OR data_win_eventdata_commandLine:/.* \/[Nn] .*/ OR data_win_eventdata_commandLine:/.* –[Nn] .*/ OR data_win_eventdata_commandLine:/.* —[Nn] .*/ OR data_win_eventdata_commandLine:/.* ―[Nn] .*/) AND data_win_eventdata_commandLine:/.*[Nn][Uu][Ll].*/ AND (data_win_eventdata_commandLine:/.* -[Ff] .*/ OR data_win_eventdata_commandLine:/.* \/[Ff] .*/ OR data_win_eventdata_commandLine:/.* –[Ff] .*/ OR data_win_eventdata_commandLine:/.* —[Ff] .*/ OR data_win_eventdata_commandLine:/.* ―[Ff] .*/ OR data_win_eventdata_commandLine:/.* -[Qq] .*/ OR data_win_eventdata_commandLine:/.* \/[Qq] .*/ OR data_win_eventdata_commandLine:/.* –[Qq] .*/ OR data_win_eventdata_commandLine:/.* —[Qq] .*/ OR data_win_eventdata_commandLine:/.* ―[Qq] .*/) AND data_win_eventdata_commandLine:/.*[Pp][Ii][Nn][Gg].*/ AND data_win_eventdata_commandLine:/.*[Dd][Ee][Ll] .*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: ded2b07a-d12f-4284-9b76-653e37b6c8b0
    name: Potentially Suspicious Ping/Copy Command Combination
    reason: Sibling pattern, ping delay then copy; same dropper idiom to relocate or replace the payload
  - id: ce058d6c-79f2-11ec-b476-acde48001122
    name: Ping Sleep Batch Command
    reason: Ping used as a sleep in batch scripts; the delay half of the ping and del self-delete idiom
  - id: 204b17ae-4007-471b-917b-b917b315c5db
    name: Greedy File Deletion Using Del
    reason: Greedy file deletion with del often accompanies cleanup after payload execution
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: Ransomware using the self-delete idiom typically deletes shadow copies just before
  - id: 639c9081-f482-47d3-a0bd-ddee3d4ecd76
    name: All Backups Deleted Via Wbadmin.EXE
    reason: Backup deletion via wbadmin is a common precursor in the ransomware chain this idiom hides the dropper for
  - id: a4824fca-976f-4964-b334-0621379e84c4
    name: Potential File Overwrite Via Sysinternals SDelete
    reason: Secure overwrite anti-forensics (SDelete) often follows or replaces plain del cleanup
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Shadow copy and backup destruction
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*[Dd][Ee][Ll][Ee][Tt][Ee].*[Ss][Hh][Aa][Dd][Oo][Ww].*/ OR /.*[Ww][Bb][Aa][Dd][Mm][Ii][Nn].*[Dd][Ee][Ll][Ee][Tt][Ee].*/ OR /.*[Bb][Cc][Dd][Ee][Dd][Ii][Tt].*[Rr][Ee][Cc][Oo][Vv][Ee][Rr][Yy][Ee][Nn][Aa][Bb][Ll][Ee][Dd].*/)
    pivot_on: host
    window: 2h
  - name: cmd.exe launched from user-writable parents
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:(/.*[Aa]pp[Dd]ata.*/ OR /.*[Dd]ownloads.*/ OR /.*[Tt]emp.*/ OR /.*[Pp]ublic.*/) AND data_win_eventdata_image:/.*[Cc][Mm][Dd]\.exe/
    pivot_on: host
    window: 1h
  - name: Quiet forced file deletions via cmd
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Dd][Ee][Ll] .*\/[FfQq].*/ OR /.*[Ee][Rr][Aa][Ss][Ee] .*\/[FfQq].*/)
    pivot_on: host
    window: 2h
  - name: Ransom notes written to disk
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(/.*[Rr][Ee][Aa][Dd].?[Mm][Ee].*\.txt/ OR /.*[Dd][Ee][Cc][Rr][Yy][Pp][Tt].*/ OR /.*[Rr][Ee][Cc][Oo][Vv][Ee][Rr].*[Ff][Ii][Ll][Ee][Ss].*/)
    pivot_on: host
    window: 4h
  - name: New executables in user-writable dirs
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\.(exe|dll|scr)/ AND data_win_eventdata_targetFilename:(/.*[Aa]pp[Dd]ata.*/ OR /.*[Dd]ownloads.*/ OR /.*[Tt]emp.*/)
    pivot_on: host
    window: 2h
