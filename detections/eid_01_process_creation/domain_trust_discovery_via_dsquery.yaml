name: Domain Trust Discovery Via Dsquery
id: 3bad990e-4848-4a78-9530-b427d854aac0
version: 1
schema_version: "1.0"
date: "2023-02-02"
author: E.M. Anhaus, Tony Lambert, oscd.community, omkar72
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 3bad990e-4848-4a78-9530-b427d854aac0
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of "dsquery.exe" for domain trust discovery. MITRE ATT&CK:
  T1482.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\dsquery.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "dsquery.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*trustedDomain*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\dsquery.exe'; data_win_eventdata_originalFileName equals 'dsquery.exe';
  data_win_eventdata_commandLine matches '*trustedDomain*'.

known_false_positives: >
  Legitimate use of the utilities by legitimate user for legitimate reason.
  Baseline expected activity in your environment and tune this detection before
  relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1482/T1482.md
  - https://posts.specterops.io/an-introduction-to-manual-active-directory-querying-with-dsquery-and-ldapsearch-84943c13d7eb?gi=41b97a644843
  - https://attack.mitre.org/techniques/T1482/

response:
  message: >
    Domain Trust Discovery Via Dsquery detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1482
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1482
  custom_tags:
    - domain
    - trust
    - dsquery
    - process_creation
    - sysmon
    - discovery
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Dd][Ss][Qq][Uu][Ee][Rr][Yy]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Dd][Ss][Qq][Uu][Ee][Rr][Yy]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Tt][Rr][Uu][Ss][Tt][Ee][Dd][Dd][Oo][Mm][Aa][Ii][Nn].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c3e05466-5f22-11eb-ae93-0242ac130002
    name: NLTest Domain Trust Discovery
    reason: Trust enumeration usually follows locating DCs and groups
  - id: 4fa7f846-054a-11ec-a836-acde48001122
    name: Get-DomainTrust with PowerShell
    reason: PowerView trust enumeration, same objective
  - id: 584f4884-0bf1-11ec-a5ec-acde48001122
    name: Get-ForestTrust with PowerShell
    reason: Forest trust enumeration, same objective
  - id: cc316032-924a-11eb-91a2-acde48001122
    name: DSQuery Domain Discovery
    reason: dsquery-based AD discovery in the same toolkit sequence
  - id: f0c9d62f-a232-4edd-b17e-bc409fb133d4
    name: Domain Group Discovery With Dsquery
    reason: Same group enumeration via dsquery instead of WMI
  - id: 41243735-89a7-4c83-bcdd-570aa78f00a1
    name: Domain Controller Discovery with Nltest
    reason: Same DC-location goal via nltest /dclist; operators chain wmic, nltest and dsquery interchangeably
  - id: 5cc90652-4cbd-4241-aa3b-4b462fa5a248
    name: Potential Recon Activity Via Nltest.EXE
    reason: nltest domain/DC/trust recon in the same discovery burst
  - id: f376c8a7-a2d0-4ddc-aa0c-16c17236d962
    name: HackTool - Bloodhound/Sharphound Execution
    reason: Manual LOLBin discovery is often followed or replaced by BloodHound collection to map attack paths
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: nltest trust and DC queries
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Nn][Ll][Tt][Ee][Ss][Tt].*[Dd][Oo][Mm][Aa][Ii][Nn]_[Tt][Rr][Uu][Ss][Tt][Ss].*/ OR /.*[Nn][Ll][Tt][Ee][Ss][Tt].*[Dd][Cc][Ll][Ii][Ss][Tt].*/ OR /.*[Nn][Ll][Tt][Ee][Ss][Tt].*[Tt][Rr][Uu][Ss][Tt].*/)
    pivot_on: host
    window: 4h
  - name: Other AD discovery tooling on host
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Nn][Ll][Tt][Ee][Ss][Tt].*/ OR /.*[Dd][Ss][Qq][Uu][Ee][Rr][Yy].*/ OR /.*[Aa][Dd][Ff][Ii][Nn][Dd].*/ OR /.*[Gg]et-[Aa][Dd].*/ OR /.*[Gg]et-[Dd]omain.*/)
    pivot_on: host
    window: 2h
  - name: LDAP/Kerberos/SMB connections to domain controllers
    query: data_win_system_eventID:3 AND data_win_eventdata_destinationPort:(389 OR 636 OR 3268 OR 88 OR 445)
    pivot_on: host
    window: 2h
  - name: Cross-domain abuse indicators
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ss][Ii][Dd][Hh]istory.*/ OR /.*[Tt]rust[Aa]ccount.*/ OR /.*[Kk]rbtgt.*/ OR /.*[Ii]nter-?[Rr]ealm.*/)
    pivot_on: host
    window: 6h
  - name: Credential-theft tooling after discovery
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Kk]erberoast.*/ OR /.*[Rr]ubeus.*/ OR /.*[Mm]imikatz.*/ OR /.*[Ss]ekurlsa.*/ OR /.*[Dd][Cc][Ss]ync.*/ OR /.*[Ll]sadump.*/)
    pivot_on: host
    window: 6h
