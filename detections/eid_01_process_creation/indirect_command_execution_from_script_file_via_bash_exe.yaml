name: Indirect Command Execution From Script File Via Bash.EXE
id: 2d22a514-e024-4428-9dba-41505bd63a5b
version: 1
schema_version: "1.0"
date: "2023-08-15"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 2d22a514-e024-4428-9dba-41505bd63a5b
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of Microsoft bash launcher without any flags to execute the
  content of a bash script directly. This can be used to potentially bypass
  defenses and execute Linux or Windows-based binaries directly via bash. MITRE
  ATT&CK: T1202.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*:\\\\Windows\\\\System32\\\\bash.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*:\\\\Windows\\\\SysWOW64\\\\bash.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "Bash.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*bash.exe -*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*bash -*"
                          case_insensitive: true
                    - bool:
                        must_not:
                          - exists:
                              field: "data_win_eventdata_commandLine"
                    - term:
                        data_win_eventdata_commandLine: ""
                    - term:
                        data_win_eventdata_commandLine:
                          value: "bash.exe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_commandLine:
                          value: "bash"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*:\Windows\System32\bash.exe'; data_win_eventdata_image matches
  '*:\Windows\SysWOW64\bash.exe'; data_win_eventdata_originalFileName equals
  'Bash.exe', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://lolbas-project.github.io/lolbas/Binaries/Bash/
  - https://linux.die.net/man/1/bash
  - Internal Research
  - https://attack.mitre.org/techniques/T1202/

response:
  message: >
    Indirect Command Execution From Script File Via Bash.EXE detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1202
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1202
  custom_tags:
    - indirect
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Bb][Aa][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Ww][Oo][Ww]64\\[Bb][Aa][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Bb][Aa][Ss][Hh]\.[Ee][Xx][Ee]/) AND NOT (data_win_eventdata_commandLine:/.*[Bb][Aa][Ss][Hh]\.[Ee][Xx][Ee] -.*/ OR data_win_eventdata_commandLine:/.*[Bb][Aa][Ss][Hh] -.*/ OR NOT _exists_:data_win_eventdata_commandLine OR data_win_eventdata_commandLine:"" OR data_win_eventdata_commandLine:/[Bb][Aa][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/[Bb][Aa][Ss][Hh]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 5edc2273-c26f-406c-83f3-f4d948e740dd
    name: Indirect Inline Command Execution Via Bash.EXE
    reason: Inline bash -c is the sibling WSL proxy-execution form; attackers switch between script and inline
  - id: eca8ae39-5c3c-4321-b538-9e64fe25822e
    name: Installation of WSL Kali-Linux
    reason: WSL distro installation is a precursor that enables bash.exe abuse
  - id: 762bb580-79b4-40f4-8b9e-9349ce1710f4
    name: Indirect Command Execution via SFTP ProxyCommand
    reason: Another trusted-binary indirect command execution (T1202) that may be chained on the same host
  - id: 7d6d30b8-5b91-4b90-a891-46cccaf29598
    name: Program Executed Using Proxy/Local Command Via SSH.EXE
    reason: ssh.exe proxy/local command execution is the same LOLBin proxy-execution family
  - id: dfa03a09-8b92-4d83-8e74-f72839b1c407
    name: Potentially Suspicious Child Processes Spawned by ConHost
    reason: Child processes spawned through console hosts show what the proxied command then did
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Bash/WSL launcher activity
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*(bash|wsl|wslhost)\.exe/
    pivot_on: host
    window: 4h
  - name: Children of WSL/bash executing Windows binaries
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*(bash|wsl|wslhost)\.exe/
    pivot_on: host
    window: 2h
  - name: Download or staging of the bash script file
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\.(sh|bash).*/
    pivot_on: host
    window: 6h
  - name: Network-fetch tools invoked on the host
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(curl|wget|Invoke-WebRequest|certutil.*urlcache|bitsadmin).*/
    pivot_on: host
    window: 2h
