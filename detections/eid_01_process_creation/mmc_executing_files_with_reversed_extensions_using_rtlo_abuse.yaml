name: MMC Executing Files with Reversed Extensions Using RTLO Abuse
id: 9cfe4b27-1e56-48b4-b7a8-d46851c91a44
version: 1
schema_version: "1.0"
date: "2025-02-05"
author: Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 9cfe4b27-1e56-48b4-b7a8-d46851c91a44
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects malicious behavior where the MMC utility (`mmc.exe`) executes files
  with reversed extensions caused by Right-to-Left Override (RLO) abuse,
  disguising them as document formats. MITRE ATT&CK: T1204.002, T1218.014,
  T1036.002.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\mmc.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "MMC.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*cod.msc*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*fdp.msc*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*ftr.msc*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*lmth.msc*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*slx.msc*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*tdo.msc*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*xcod.msc*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*xslx.msc*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*xtpp.msc*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches '*\mmc.exe';
  data_win_eventdata_originalFileName equals 'MMC.exe';
  data_win_eventdata_commandLine matches '*cod.msc*', among other conditions.

known_false_positives: >
  Legitimate administrative actions using MMC to execute misnamed `.msc` files..
  Unconventional but non-malicious usage of RLO or reversed extensions. Baseline
  expected activity in your environment and tune this detection before relying
  on it for automated response.

references:
  - https://www.unicode.org/versions/Unicode5.2.0/ch02.pdf
  - https://en.wikipedia.org/wiki/Right-to-left_override
  - https://tria.ge/241015-l98snsyeje/behavioral2
  - https://attack.mitre.org/techniques/T1204/002/
  - https://attack.mitre.org/techniques/T1218/014/
  - https://attack.mitre.org/techniques/T1036/002/

response:
  message: >
    MMC Executing Files with Reversed Extensions Using RTLO Abuse detected on
    host $agent_name$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1204.002, T1218.014,
    T1036.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1204.002
    - T1218.014
    - T1036.002
  custom_tags:
    - executing
    - reversed
    - extensions
    - process_creation
    - sysmon
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Mm][Mm][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Mm][Mm][Cc]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Dd]\.[Mm][Ss][Cc].*/ OR data_win_eventdata_commandLine:/.*[Ff][Dd][Pp]\.[Mm][Ss][Cc].*/ OR data_win_eventdata_commandLine:/.*[Ff][Tt][Rr]\.[Mm][Ss][Cc].*/ OR data_win_eventdata_commandLine:/.*[Ll][Mm][Tt][Hh]\.[Mm][Ss][Cc].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ll][Xx]\.[Mm][Ss][Cc].*/ OR data_win_eventdata_commandLine:/.*[Tt][Dd][Oo]\.[Mm][Ss][Cc].*/ OR data_win_eventdata_commandLine:/.*[Xx][Cc][Oo][Dd]\.[Mm][Ss][Cc].*/ OR data_win_eventdata_commandLine:/.*[Xx][Ss][Ll][Xx]\.[Mm][Ss][Cc].*/ OR data_win_eventdata_commandLine:/.*[Xx][Tt][Pp][Pp]\.[Mm][Ss][Cc].*/)

