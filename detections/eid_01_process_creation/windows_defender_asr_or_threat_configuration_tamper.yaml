      name: "Dump LSASS via comsvcs DLL"
      reason: "same analytic story: Compromised Windows Host"
    - id: 26f86252-1549-45e1-a212-eb26840e86bc
      name: "File Download or Read to Pipe Execution"
      reason: "same analytic story: Compromised Windows Host"
    - id: 9a8f63a8-43ac-11ec-904c-acde48001122
      name: "Firewall Allowed Program Enable"
      reason: "same analytic story: Windows Defense Evasion Tactics"
    - id: 909f8fd8-7ac8-11eb-a1f3-acde48001122
      name: "FodHelper UAC Bypass"
      reason: "same analytic story: Windows Defense Evasion Tactics"
  window: 1h
  enrichment_searches:
  # NEW ad-hoc searches the engine runs around an alert from this rule, scoped to
  # the alert's host/user/IP within the window (not existing CoPilot Searches).
    - name: "Sysmon activity on this host in the window"
      query: 'data_win_system_channel:"Microsoft-Windows-Sysmon/Operational"'
      pivot_on: [host]
      window: 1h
    - name: "Process creation on this host"
      query: 'data_win_system_eventID:"1"'
      pivot_on: [host]
      window: 1h
    - name: "Network connections from this host"
      query: 'data_win_system_eventID:"3"'
      pivot_on: [host]
      window: 1h
    - name: "High-severity alerts on this host"
      query: 'rule_level:>=10'
      pivot_on: [host]
      window: 1h
