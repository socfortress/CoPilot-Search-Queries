name: Windows Defender ASR or Threat Configuration Tamper
id: windows-defender-asr-threat-tamper-001
version: 1
schema_version: "1.0"
date: "2026-02-23"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects commands to disable Attack Surface Reduction (ASR) rules or change 
  threat default actions in Windows Defender via Add-MpPreference or 
  Set-MpPreference. Adversaries use this to bypass Defender protections, 
  allowing malicious code to execute undetected.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine: "*Add-MpPreference*"
              - wildcard:
                  data_win_eventdata_commandLine: "*Set-MpPreference*"
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine: "*AttackSurfaceReductionRules_Actions*"
              - wildcard:
                  data_win_eventdata_commandLine: "*ThreatIDDefaultAction_Actions*"
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine: "*Allow*"
              - wildcard:
                  data_win_eventdata_commandLine: "*NoAction*"
              - wildcard:
                  data_win_eventdata_commandLine: "*Disabled*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-23 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-23 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Windows endpoints with Sysmon 
  installed and configured to log process creation events (EventID 1) with full 
  command-line arguments.

known_false_positives: >
  Administrative tasks may require ASR rule modifications due to false positives 
  in specific environments. Investigate all attempts and filter by authorized 
  admin accounts.

references:
  - https://attack.mitre.org/techniques/T1562/001/
  - https://learn.microsoft.com/en-us/powershell/module/defender/set-mppreference

response:
  message: >
    Defender ASR/Threat configuration tampered on $agent_name$. 
    Command: $data_win_eventdata_commandLine$. 
    Process: $data_win_eventdata_image$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1562.001
  risk_score: 64
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 64
  threat_objects: []

tags:
  analytic_story:
    - Windows Defense Evasion Tactics
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1562.001
  custom_tags:
    - defender_tamper
    - asr_rules
    - defense_evasion
    - threat_actions
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*Add-MpPreference.*/ OR data_win_eventdata_commandLine:/.*Set-MpPreference.*/) AND (data_win_eventdata_commandLine:/.*AttackSurfaceReductionRules_Actions.*/ OR data_win_eventdata_commandLine:/.*ThreatIDDefaultAction_Actions.*/) AND (data_win_eventdata_commandLine:/.*Allow.*/ OR data_win_eventdata_commandLine:/.*NoAction.*/ OR data_win_eventdata_commandLine:/.*Disabled.*/)

correlation:
  # Authored by the correlation engine for review. Related CoPilot Searches to run
  # around an alert from this rule, scoped to the same host/user/IP within the window.
  related_rules:
    - id: 2452e632-9e0d-11eb-bacd-acde48001122
      name: "DNS Exfiltration Using Nslookup App"
      reason: "same analytic story: Compromised Windows Host"
    - id: cc316032-924a-11eb-91a2-acde48001122
      name: "DSQuery Domain Discovery"
      reason: "same analytic story: Compromised Windows Host"
    - id: 9b3af1e6-5b68-11eb-ae93-0242ac130002
      name: "Detect MSHTA Url in Command Line"
      reason: "same analytic story: Compromised Windows Host"
    - id: 72170ec5-f7d2-42f5-aefb-2b8be6aad15f
      name: "Detect Regasm Spawning a Process"
      reason: "same analytic story: Compromised Windows Host"
    - id: bc477b57-5c21-4ab6-9c33-668772e7f114
      name: "Detect Regsvcs Spawning a Process"
      reason: "same analytic story: Compromised Windows Host"
    - id: 070e9b80-6252-11eb-ae93-0242ac130002
      name: "Detect Regsvr32 Application Control Bypass"
      reason: "same analytic story: Compromised Windows Host"
    - id: a0873b32-5b68-11eb-ae93-0242ac130002
      name: "Detect mshta inline hta execution"
      reason: "same analytic story: Compromised Windows Host"
    - id: 6860a62c-9203-11eb-9e05-acde48001122
      name: "Disabling Firewall with Netsh"
      reason: "same analytic story: Windows Defense Evasion Tactics"
    - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
      name: "Dump LSASS via comsvcs DLL"
      reason: "same analytic story: Compromised Windows Host"
    - id: 26f86252-1549-45e1-a212-eb26840e86bc
      name: "File Download or Read to Pipe Execution"
      reason: "same analytic story: Compromised Windows Host"
    - id: 9a8f63a8-43ac-11ec-904c-acde48001122
      name: "Firewall Allowed Program Enable"
      reason: "same analytic story: Windows Defense Evasion Tactics"
    - id: 909f8fd8-7ac8-11eb-a1f3-acde48001122
      name: "FodHelper UAC Bypass"
      reason: "same analytic story: Windows Defense Evasion Tactics"
  window: 1h
  enrichment_searches:
  # Rule-specific telemetry pivots the engine runs around an alert from this rule,
  # scoped to the alert's host/user/IP within the window (behaviour-targeted, not a sweep).
    - name: "Security-tool / Defender tampering on this host"
      query: 'data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee][Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Aa][Nn][Tt][Ii][Ss][Pp][Yy][Ww][Aa][Rr][Ee].*/ OR data_win_eventdata_commandLine:/.*[Aa][Dd][Dd]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee] -[Ee][Xx][Cc][Ll][Uu][Ss][Ii][Oo][Nn][Pp][Aa][Tt][Hh].*/ OR data_win_eventdata_commandLine:/.*[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll].*/ OR data_win_eventdata_commandLine:/.*[Cc][Ll][Ee][Aa][Rr]-[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg].*/ OR data_win_eventdata_commandLine:/.*[Ff][Ss][Uu][Tt][Ii][Ll] [Uu][Ss][Nn] [Dd][Ee][Ll][Ee][Tt][Ee][Jj][Oo][Uu][Rr][Nn][Aa][Ll].*/ OR data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ss][Tt][Oo][Pp]-[Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc] [Ss][Tt][Oo][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc] [Cc][Oo][Nn][Ff][Ii][Gg].*/)'
      pivot_on: [host]
      window: 2h
    - name: "Follow-on LOLBin / signed-binary-proxy execution on this host"
      query: 'data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|\\[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Aa][Ss][Mm]\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Cc][Ss]\.[Ee][Xx][Ee]|\\[Mm][Ss][Bb][Uu][Ii][Ll][Dd]\.[Ee][Xx][Ee]|\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]|\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]|\\[Cc][Mm][Ss][Tt][Pp]\.[Ee][Xx][Ee]|\\[Oo][Dd][Bb][Cc][Cc][Oo][Nn][Ff]\.[Ee][Xx][Ee]|\\[Ff][Oo][Rr][Ff][Ii][Ll][Ee][Ss]\.[Ee][Xx][Ee]|\\[Pp][Cc][Aa][Ll][Uu][Aa]\.[Ee][Xx][Ee]|\\[Mm][Aa][Vv][Ii][Nn][Jj][Ee][Cc][Tt]\.[Ee][Xx][Ee]|\\[Ss][Cc][Rr][Ii][Pp][Tt][Rr][Uu][Nn][Nn][Ee][Rr]\.[Ee][Xx][Ee])/'
      pivot_on: [host]
      window: 1h
    - name: "Outbound connections by script interpreters on this host"
      query: 'data_win_system_eventID:"3" AND data_win_eventdata_image:/.*(\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]|\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]_[Ii][Ss][Ee]\.[Ee][Xx][Ee]|\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]|\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee])/'
      pivot_on: [host]
      window: 1h
