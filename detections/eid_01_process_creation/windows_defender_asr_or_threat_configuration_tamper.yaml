name: Windows Defender ASR or Threat Configuration Tamper
id: windows-defender-asr-threat-tamper-001
version: 1
schema_version: "1.0"
date: "2026-02-23"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects commands to disable Attack Surface Reduction (ASR) rules or change 
  threat default actions in Windows Defender via Add-MpPreference or 
  Set-MpPreference. Adversaries use this to bypass Defender protections, 
  allowing malicious code to execute undetected.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine: "*Add-MpPreference*"
              - wildcard:
                  data_win_eventdata_commandLine: "*Set-MpPreference*"
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine: "*AttackSurfaceReductionRules_Actions*"
              - wildcard:
                  data_win_eventdata_commandLine: "*ThreatIDDefaultAction_Actions*"
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine: "*Allow*"
              - wildcard:
                  data_win_eventdata_commandLine: "*NoAction*"
              - wildcard:
                  data_win_eventdata_commandLine: "*Disabled*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-23 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-23 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Windows endpoints with Sysmon 
  installed and configured to log process creation events (EventID 1) with full 
  command-line arguments.

known_false_positives: >
  Administrative tasks may require ASR rule modifications due to false positives 
  in specific environments. Investigate all attempts and filter by authorized 
  admin accounts.

references:
  - https://attack.mitre.org/techniques/T1562/001/
  - https://learn.microsoft.com/en-us/powershell/module/defender/set-mppreference

response:
  message: >
    Defender ASR/Threat configuration tampered on $agent_name$. 
    Command: $data_win_eventdata_commandLine$. 
    Process: $data_win_eventdata_image$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1562.001
  risk_score: 64
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 64
  threat_objects: []

tags:
  analytic_story:
    - Windows Defense Evasion Tactics
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1562.001
  custom_tags:
    - defender_tamper
    - asr_rules
    - defense_evasion
    - threat_actions
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*Add-MpPreference.*/ OR data_win_eventdata_commandLine:/.*Set-MpPreference.*/) AND (data_win_eventdata_commandLine:/.*AttackSurfaceReductionRules_Actions.*/ OR data_win_eventdata_commandLine:/.*ThreatIDDefaultAction_Actions.*/) AND (data_win_eventdata_commandLine:/.*Allow.*/ OR data_win_eventdata_commandLine:/.*NoAction.*/ OR data_win_eventdata_commandLine:/.*Disabled.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 1e8a9b4d-3c2a-4f9b-8d1e-7c6a5b4f3d2e
    name: PowerShell Defender Threat Severity Default Action Set to 'Allow' or 'NoAction'
    reason: Same ThreatIDDefaultAction tamper seen from the PowerShell side; confirms Defender remediation was neutered so detected threats are not quarantined.
  - id: 5a9e1b2c-8f7d-4a1e-9b3c-0f6d7e5a4b1f
    name: Windows Defender Threat Severity Default Action Modified
    reason: Registry-level result (Sysmon 13) of the Set-MpPreference threat-action change, proving the setting persisted.
  - id: 17769c90-230e-488b-a463-e05c08e9d48f
    name: Powershell Defender Exclusion
    reason: Actors weakening ASR/threat actions typically add path or process exclusions in the same Set-MpPreference session.
  - id: c6fb44c6-71f5-49e6-9462-1425d328aee3
    name: Powershell Base64 Encoded MpPreference Cmdlet
    reason: Same tampering cmdlets hidden behind -enc to evade command-line matching.
  - id: 07e3cb2c-0608-410d-be4b-1511cb1a0448
    name: Tamper Windows Defender Remove-MpPreference
    reason: Companion cmdlet used to strip existing ASR rules and exclusions in the same evasion step.
  - id: a3ab73f1-bd46-4319-8f06-4b20d0617886
    name: Windows Defender Exploit Guard Tamper
    reason: Defender operational log confirms the ASR/Exploit Guard configuration actually changed.
  - id: 801bd44f-ceed-4eb6-887c-11544633c0aa
    name: Windows Defender Configuration Changes
    reason: Defender-side confirmation of the configuration change made by the logged command.
  - id: b28e58e4-2a72-4fae-bdee-0fbe904db642
    name: Windows Defender Real-time Protection Disabled
    reason: 'Frequent next step once ASR rules are relaxed: real-time protection turned off before payload staging.'
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other Defender preference changes on host
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*[Mm]p[Pp]reference.*/
    pivot_on: host
    window: 4h
  - name: Defender exclusions or disable switches
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*[Ee]xclusion(Path|Process|Extension).*/ OR data_win_eventdata_commandLine:/.*Disable(RealtimeMonitoring|IOAVProtection|BehaviorMonitoring|ScriptScanning).*/)
    pivot_on: host
    window: 4h
  - name: Defender configuration changes in operational log
    query: data_win_system_eventID:(5007 OR 5001 OR 5004 OR 5010 OR 5012)
    pivot_on: host
    window: 2h
  - name: PowerShell download cradles or encoded commands
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*([Ii]nvoke-[Ww]eb[Rr]equest|[Dd]ownload(String|File)|[Ee]ncodedcommand|-[Ee]nc ).*/
    pivot_on: host
    window: 2h
