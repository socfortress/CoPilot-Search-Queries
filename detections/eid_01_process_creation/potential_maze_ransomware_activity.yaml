name: Potential Maze Ransomware Activity
id: 29fd07fc-9cfd-4331-b7fd-cc18dfa21052
version: 1
schema_version: "1.0"
date: "2023-02-13"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 29fd07fc-9cfd-4331-b7fd-cc18dfa21052
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects specific process characteristics of Maze ransomware word document
  droppers. MITRE ATT&CK: T1204.002, T1047, T1490.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_parentImage:
                          value: "*\\\\WINWORD.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*.tmp"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\wmic.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_parentImage:
                          value: "*\\\\Temp\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*shadowcopy delete"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*shadowcopy delete"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*\\\\..\\\\..\\\\system32*"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\WINWORD.exe'; data_win_eventdata_image matches '*.tmp';
  data_win_eventdata_image matches '*\wmic.exe', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.fireeye.com/blog/threat-research/2020/05/tactics-techniques-procedures-associated-with-maze-ransomware-incidents.html
  - https://app.any.run/tasks/51e7185c-52d7-4efb-ac0d-e86340053473/
  - https://app.any.run/tasks/65a79440-373a-4725-8d74-77db9f2abda4/
  - https://attack.mitre.org/techniques/T1204/002/
  - https://attack.mitre.org/techniques/T1047/
  - https://attack.mitre.org/techniques/T1490/

response:
  message: >
    Potential Maze Ransomware Activity detected on host $agent_name$. Matched
    data_win_eventdata_parentImage: $data_win_eventdata_parentImage$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1204.002, T1047, T1490
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1204.002
    - T1047
    - T1490
  custom_tags:
    - ransomware
    - process_creation
    - sysmon
    - execution
    - impact
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND ((data_win_eventdata_parentImage:/.*\\[Ww][Ii][Nn][Ww][Oo][Rr][Dd]\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\.[Tt][Mm][Pp]/) OR (data_win_eventdata_image:/.*\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_parentImage:/.*\\[Tt][Ee][Mm][Pp]\\.*/ AND data_win_eventdata_commandLine:/.*[Ss][Hh][Aa][Dd][Oo][Ww][Cc][Oo][Pp][Yy] [Dd][Ee][Ll][Ee][Tt][Ee]/) OR (data_win_eventdata_commandLine:/.*[Ss][Hh][Aa][Dd][Oo][Ww][Cc][Oo][Pp][Yy] [Dd][Ee][Ll][Ee][Tt][Ee]/ AND data_win_eventdata_commandLine:/.*\\\.\.\\\.\.\\[Ss][Yy][Ss][Tt][Ee][Mm]32.*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: f99abdf0-6283-4e71-bd2b-b5c048a94743
    name: Potentially Suspicious Office Document Executed From Trusted Location
    reason: Maze arrives as a Word dropper; document execution from user paths is the delivery step before WINWORD spawns the .tmp payload.
  - id: 868955d9-697e-45d4-a3da-360cefd7c216
    name: Potential Exploitation Attempt From Office Application
    reason: Office spawning abnormal children is the same dropper mechanism as WINWORD launching a .tmp executable.
  - id: aa3a6f94-890e-4e22-b634-ffdfd54792cc
    name: Suspicious Binary In User Directory Spawned From Office Application
    reason: 'Overlapping stage: Office launching a binary dropped in a user directory.'
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: Maze runs wmic shadowcopy delete (T1490) to destroy recovery; this is the immediate follow-on.
  - id: 21ff4ca9-f13a-41ad-b828-0077b2af2e40
    name: Deletion of Volume Shadow Copies via WMI with PowerShell
    reason: Alternate shadow copy destruction path seen in ransomware pre-encryption steps.
  - id: 1444443e-6757-43e4-9ea4-c8fc705f79a2
    name: Boot Configuration Tampering Via Bcdedit.EXE
    reason: Ransomware disables recovery via bcdedit alongside shadow copy deletion.
  - id: c9fbe8e9-119d-40a6-9b59-dd58a5d84429
    name: Potential Ransomware or Unauthorized MBR Tampering Via Bcdedit.EXE
    reason: Pre-encryption recovery inhibition commonly seen right after the dropper stage.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Office spawning children
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Ww][Ii][Nn][Ww][Oo][Rr][Dd]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Shadow copy and recovery inhibition
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ss]hadowcopy.*[Dd]elete.*/ OR /.*[Vv]ssadmin.*[Dd]elete.*/ OR /.*[Bb]cdedit.*[Rr]ecovery[Ee]nabled.*/ OR /.*[Ww]badmin.*[Dd]elete.*/)
    pivot_on: host
    window: 6h
  - name: Executables dropped as .tmp in Temp
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*[Tt]emp.*\.[Tt][Mm][Pp]/
    pivot_on: host
    window: 2h
  - name: WMIC launched from Temp parents
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_parentImage:/.*[Tt]emp.*/
    pivot_on: host
    window: 4h
  - name: Ransom note creation
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(/.*DECRYPT.*/ OR /.*[Rr]ecover.*[Ff]iles.*/)
    pivot_on: host
    window: 6h
