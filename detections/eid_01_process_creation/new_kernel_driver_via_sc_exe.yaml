name: New Kernel Driver Via SC.EXE
id: 431a1fdb-4799-4f3b-91c3-a683b003fc49
version: 1
schema_version: "1.0"
date: "2025-10-07"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 431a1fdb-4799-4f3b-91c3-a683b003fc49
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects creation of a new service (kernel driver) with the type "kernel".
  MITRE ATT&CK: T1543.003.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\sc.exe"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*create*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*config*"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*binPath*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*type*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*kernel*"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_commandLine"
        - bool:
            must_not:
              - bool:
                  should:
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*create netprotection_network_filter*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*type= kernel start= *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*binPath= System32\\\\drivers\\\\netprotection_network_filter*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*DisplayName= netprotection_network_filter*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*group= PNP_TDI tag= yes*"
                                case_insensitive: true
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*create avelam binpath=C:\\\\Windows\\\\system32\\\\drivers\\\\avelam.sys*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*type=kernel start=boot error=critical group=Early-Launch*"
                                case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches '*\sc.exe';
  data_win_eventdata_commandLine matches '*create*';
  data_win_eventdata_commandLine matches '*config*', among other conditions.

known_false_positives: >
  Rare legitimate installation of kernel drivers via sc.exe. Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://www.aon.com/cyber-solutions/aon_cyber_labs/yours-truly-signed-av-driver-weaponizing-an-antivirus-driver/
  - https://attack.mitre.org/techniques/T1543/003/

response:
  message: >
    New Kernel Driver Via SC.EXE detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1543.003
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1543.003
  custom_tags:
    - kernel
    - driver
    - process_creation
    - sysmon
    - persistence
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss][Cc]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Nn][Ff][Ii][Gg].*/) AND data_win_eventdata_commandLine:/.*[Bb][Ii][Nn][Pp][Aa][Tt][Hh].*/ AND data_win_eventdata_commandLine:/.*[Tt][Yy][Pp][Ee].*/ AND data_win_eventdata_commandLine:/.*[Kk][Ee][Rr][Nn][Ee][Ll].*/ AND _exists_:data_win_eventdata_commandLine AND NOT ((data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee] [Nn][Ee][Tt][Pp][Rr][Oo][Tt][Ee][Cc][Tt][Ii][Oo][Nn]_[Nn][Ee][Tt][Ww][Oo][Rr][Kk]_[Ff][Ii][Ll][Tt][Ee][Rr].*/ AND data_win_eventdata_commandLine:/.*[Tt][Yy][Pp][Ee]= [Kk][Ee][Rr][Nn][Ee][Ll] [Ss][Tt][Aa][Rr][Tt]= .*/ AND data_win_eventdata_commandLine:/.*[Bb][Ii][Nn][Pp][Aa][Tt][Hh]= [Ss][Yy][Ss][Tt][Ee][Mm]32\\[Dd][Rr][Ii][Vv][Ee][Rr][Ss]\\[Nn][Ee][Tt][Pp][Rr][Oo][Tt][Ee][Cc][Tt][Ii][Oo][Nn]_[Nn][Ee][Tt][Ww][Oo][Rr][Kk]_[Ff][Ii][Ll][Tt][Ee][Rr].*/ AND data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Pp][Ll][Aa][Yy][Nn][Aa][Mm][Ee]= [Nn][Ee][Tt][Pp][Rr][Oo][Tt][Ee][Cc][Tt][Ii][Oo][Nn]_[Nn][Ee][Tt][Ww][Oo][Rr][Kk]_[Ff][Ii][Ll][Tt][Ee][Rr].*/ AND data_win_eventdata_commandLine:/.*[Gg][Rr][Oo][Uu][Pp]= [Pp][Nn][Pp]_[Tt][Dd][Ii] [Tt][Aa][Gg]= [Yy][Ee][Ss].*/) OR (data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee] [Aa][Vv][Ee][Ll][Aa][Mm] [Bb][Ii][Nn][Pp][Aa][Tt][Hh]=[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Dd][Rr][Ii][Vv][Ee][Rr][Ss]\\[Aa][Vv][Ee][Ll][Aa][Mm]\.[Ss][Yy][Ss].*/ AND data_win_eventdata_commandLine:/.*[Tt][Yy][Pp][Ee]=[Kk][Ee][Rr][Nn][Ee][Ll] [Ss][Tt][Aa][Rr][Tt]=[Bb][Oo][Oo][Tt] [Ee][Rr][Rr][Oo][Rr]=[Cc][Rr][Ii][Tt][Ii][Cc][Aa][Ll] [Gg][Rr][Oo][Uu][Pp]=[Ee][Aa][Rr][Ll][Yy]-[Ll][Aa][Uu][Nn][Cc][Hh].*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a2ea3ae7-d3d0-40a0-a55c-25a45c87cac1
    name: Suspicious Driver Install by pnputil.exe
    reason: alternate driver installation route used by the same actor
  - id: 2c4523d5-d481-4ed0-8ec3-7fbf0cb41a75
    name: Driver Load From A Temporary Directory
    reason: a kernel driver registered via sc binPath then loads from a writable path
  - id: 39b64854-5497-4b57-a448-40977b8c9679
    name: Malicious Driver Load By Name
    reason: the created driver loading under a known-bad name confirms BYOVD
  - id: e76ca062-4de0-4d79-8d90-160a0d335eca
    name: PUA - Kernel Driver Utility (KDU) Execution
    reason: KDU loads vulnerable drivers, typically registered as kernel services
  - id: 1a42dfa6-6cb2-4df9-9b48-295be477e835
    name: Vulnerable WinRing0 Driver Load
    reason: vulnerable driver abuse commonly follows driver service creation
  - id: 38879043-7e1e-47a9-8d46-6bec88e201df
    name: Potential Persistence Attempt Via Existing Service Tampering
    reason: companion service-persistence technique through sc.exe
  - id: 4931188c-178e-4ee7-a348-39e8a7a56821
    name: Filter Driver Unloaded Via Fltmc.EXE
    reason: EDR/Sysmon filter drivers are often unloaded once kernel capability is gained
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: sc.exe service control actions
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Ss][Cc]\.exe/ AND data_win_eventdata_commandLine:/.*(create|start|config).*/
    pivot_on: host
    window: 2h
  - name: Driver loaded events (Sysmon EID 6)
    query: data_win_system_eventID:6
    pivot_on: host
    window: 2h
  - name: New kernel driver service installed (7045)
    query: data_win_system_eventID:7045 AND data_win_eventdata_serviceType:*[Kk]ernel*
    pivot_on: host
    window: 6h
  - name: Driver files written to disk
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\.sys/
    pivot_on: host
    window: 2h
  - name: Security tooling tampering
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(*fltmc*unload* OR *sc*stop*Sysmon* OR *sc*stop*WinDefend* OR *sc*delete*)
    pivot_on: host
    window: 2h
