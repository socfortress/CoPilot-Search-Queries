name: ManageEngine Endpoint Central Dctask64.EXE Potential Abuse
id: 6345b048-8441-43a7-9bed-541133633d7a
version: 1
schema_version: "1.0"
date: "2025-01-22"
author: Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 6345b048-8441-43a7-9bed-541133633d7a
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of "dctask64.exe", a signed binary by ZOHO Corporation
  part of ManageEngine Endpoint Central. This binary can be abused for DLL
  injection, arbitrary command and process execution. MITRE ATT&CK: T1055.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\dctask64.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=6834B1B94E49701D77CCB3C0895E1AFD*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=1BB6F93B129F398C7C4A76BB97450BBA*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=FAA2AC19875FADE461C8D89DCF2710A3*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=F1039CED4B91572AB7847D26032E6BBF*"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* executecmd64 *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* invokeexe *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* injectDll *"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_hashes
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\dctask64.exe'; data_win_eventdata_hashes matches
  '*IMPHASH=6834B1B94E49701D77CCB3C0895E1AFD*'; data_win_eventdata_hashes
  matches '*IMPHASH=1BB6F93B129F398C7C4A76BB97450BBA*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/gN3mes1s/status/1222088214581825540
  - https://twitter.com/gN3mes1s/status/1222095963789111296
  - https://twitter.com/gN3mes1s/status/1222095371175911424
  - https://attack.mitre.org/techniques/T1055/001/

response:
  message: >
    ManageEngine Endpoint Central Dctask64.EXE Potential Abuse detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_hashes: $data_win_eventdata_hashes$. MITRE
    ATT&CK: T1055.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_hashes
      type: file_hash

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1055.001
  custom_tags:
    - manageengine
    - endpoint
    - central
    - process_creation
    - sysmon
    - privilege_escalation
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Dd][Cc][Tt][Aa][Ss][Kk]64\.[Ee][Xx][Ee]/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=6834[Bb]1[Bb]94[Ee]49701[Dd]77[Cc][Cc][Bb]3[Cc]0895[Ee]1[Aa][Ff][Dd].*/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=1[Bb][Bb]6[Ff]93[Bb]129[Ff]398[Cc]7[Cc]4[Aa]76[Bb][Bb]97450[Bb][Bb][Aa].*/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=[Ff][Aa][Aa]2[Aa][Cc]19875[Ff][Aa][Dd][Ee]461[Cc]8[Dd]89[Dd][Cc][Ff]2710[Aa]3.*/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=[Ff]1039[Cc][Ee][Dd]4[Bb]91572[Aa][Bb]7847[Dd]26032[Ee]6[Bb][Bb][Ff].*/) AND (data_win_eventdata_commandLine:/.* [Ee][Xx][Ee][Cc][Uu][Tt][Ee][Cc][Mm][Dd]64 .*/ OR data_win_eventdata_commandLine:/.* [Ii][Nn][Vv][Oo][Kk][Ee][Ee][Xx][Ee] .*/ OR data_win_eventdata_commandLine:/.* [Ii][Nn][Jj][Ee][Cc][Tt][Dd][Ll][Ll] .*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 340a090b-c4e9-412e-bb36-b4b16fe96f9b
    name: Renamed ZOHO Dctask64 Execution
    reason: Attackers rename the signed dctask64 to dodge image-name matching; same abuse primitive.
  - id: 58d8341a-5849-44cd-8ac8-8b020413a31b
    name: Mint Sandstorm - ManageEngine Suspicious Process Execution
    reason: Mint Sandstorm exploits ManageEngine then abuses its processes; the exploitation stage preceding dctask64 use.
  - id: 846b866e-2a57-46ee-8e16-85fa92759be7
    name: Exploited CVE-2020-10189 Zoho ManageEngine
    reason: Desktop Central exploit spawns command shells; initial access preceding dctask64 abuse.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Child processes spawned by dctask64
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Dd][Cc][Tt][Aa][Ss][Kk]64\.exe/
    pivot_on: host
    window: 2h
  - name: DLLs loaded by dctask64 from unusual paths
    query: data_win_system_eventID:7 AND data_win_eventdata_image:/.*[Dd][Cc][Tt][Aa][Ss][Kk]64\.exe/ AND NOT data_win_eventdata_imageLoaded:/.*(\\Windows\\|\\ManageEngine\\|\\DesktopCentral).*/
    pivot_on: host
    window: 2h
  - name: Remote threads or process access from dctask64 (injectDll)
    query: (data_win_system_eventID:8 OR data_win_system_eventID:10) AND data_win_eventdata_sourceImage:/.*[Dd][Cc][Tt][Aa][Ss][Kk]64\.exe/
    pivot_on: host
    window: 2h
  - name: Network connections by dctask64 or ManageEngine processes
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*([Dd][Cc][Tt][Aa][Ss][Kk]64|[Dd]esktop[Cc]entral|[Mm]anage[Ee]ngine).*/
    pivot_on: host
    window: 4h
  - name: Credential theft or recon after abuse
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(lsass|procdump|comsvcs|sekurlsa|ntds|[Ww]hoami|net (user|group|localgroup)|nltest|reg save).*/
    pivot_on: host
    window: 4h
