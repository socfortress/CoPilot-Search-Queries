name: Potential APT FIN7 Reconnaissance/POWERTRASH Related Activity
id: 911389c7-5ae3-43ea-bab3-a947ebdeb85e
version: 1
schema_version: "1.0"
date: "2023-05-04"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 911389c7-5ae3-43ea-bab3-a947ebdeb85e
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects specific command line execution used by FIN7 as reported by
  WithSecureLabs for reconnaissance and POWERTRASH execution.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*-noni -nop -exe bypass -f \\\\\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*ADMIN$*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*-ex bypass -noprof -nolog -nonint -f*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*C:\\\\Windows\\\\Temp\\\\*"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*-noni -nop -exe bypass -f \\*'; data_win_eventdata_commandLine matches
  '*ADMIN$*'; data_win_eventdata_commandLine matches '*-ex bypass -noprof -nolog
  -nonint -f*', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://labs.withsecure.com/publications/fin7-target-veeam-servers
  - https://labs.withsecure.com/publications/fin7-target-veeam-servers/jcr:content/root/responsivegrid/responsivegrid/responsivegrid/image_253944286.img.png/1682500394900.png
  - https://github.com/WithSecureLabs/iocs/blob/344203de742bb7e68bd56618f66d34be95a9f9fc/FIN7VEEAM/iocs.csv

response:
  message: >
    Potential APT FIN7 Reconnaissance/POWERTRASH Related Activity detected on
    host $agent_name$. Matched data_win_eventdata_commandLine:
    $data_win_eventdata_commandLine$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - reconnaissance
    - powertrash
    - related
    - process_creation
    - sysmon
    - execution
    - g0046
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND ((data_win_eventdata_commandLine:/.*-[Nn][Oo][Nn][Ii] -[Nn][Oo][Pp] -[Ee][Xx][Ee] [Bb][Yy][Pp][Aa][Ss][Ss] -[Ff] \\\\.*/ AND data_win_eventdata_commandLine:/.*[Aa][Dd][Mm][Ii][Nn]\$.*/) OR (data_win_eventdata_commandLine:/.*-[Ee][Xx] [Bb][Yy][Pp][Aa][Ss][Ss] -[Nn][Oo][Pp][Rr][Oo][Ff] -[Nn][Oo][Ll][Oo][Gg] -[Nn][Oo][Nn][Ii][Nn][Tt] -[Ff].*/ AND data_win_eventdata_commandLine:/.*[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 6676896b-2cce-422d-82af-5a1abe65e241
    name: Potential APT FIN7 Exploitation Activity
    reason: 'Same FIN7 intrusion set: Notepad++/rdpinit abuse chain that precedes or accompanies the POWERTRASH recon script execution.'
  - id: a88d9f45-ec8a-4b0e-85ee-c9f6a65e9128
    name: Potential APT FIN7 Related PowerShell Script Created
    reason: FIN7 drops host_ip.ps1 / *_64refl.ps1 PowerShell scripts to disk; their creation is the file-side twin of this command-line execution.
  - id: d55b793d-f847-4eea-b59a-5ab09908ac90
    name: Suspicious Child Process Of Veeam Dabatase
    reason: FIN7 targeted Veeam servers; a shell spawned by the Veeam SQL instance is the likely initial foothold before these scripts run.
  - id: b57ba453-b384-4ab9-9f40-1038086b4e53
    name: VeeamBackup Database Credentials Dump Via Sqlcmd.EXE
    reason: Credential theft from the VeeamBackup DB is the FIN7 objective on these hosts and follows the recon stage.
  - id: 696bfb54-227e-4602-ac5b-30d9d2053312
    name: Veeam Backup Database Suspicious Query
    reason: Companion query-based access to Veeam stored credentials seen in the same FIN7 Veeam campaign.
  - id: a6a39bdb-935c-4f0a-ab77-35f4bbf44d33
    name: Potentially Suspicious Powershell Script Execution From Temp Folder
    reason: The C:\Windows\Temp variant of this rule executes a staged script; it fires on the same staging path.
  - id: cf2e938e-9a3e-4fe8-a347-411642b28a9f
    name: Potential PowerShell Execution Policy Tampering - ProcCreation
    reason: -ex bypass is the policy-evasion flag; other bypass invocations on the host reveal additional staged scripts.
  - id: fdfcbd78-48f1-4a4b-90ac-d82241e368c5
    name: PsExec Service Execution
    reason: The ADMIN$ variant runs a script from a remote share, which usually means PsExec-style lateral movement from the operator.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: PowerShell scripts written to Windows Temp or ProgramData (FIN7 staging)
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.[Pp][Ss]1.*/ AND (data_win_eventdata_targetFilename:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/)
    pivot_on:
    - host
    window: 4h
  - name: Veeam database / credential access commands
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Vv][Ee][Ee][Aa][Mm].*/ AND (data_win_eventdata_image:/.*\\([Ss][Qq][Ll][Cc][Mm][Dd]\.[Ee][Xx][Ee]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|[Cc][Mm][Dd]\.[Ee][Xx][Ee])/ OR data_win_eventdata_parentImage:/.*\\([Ss][Qq][Ll][Ss][Ee][Rr][Vv][Rr]\.[Ee][Xx][Ee])/)
    pivot_on:
    - host
    window: 4h
  - name: Host and domain reconnaissance utilities
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Ww][Hh][Oo][Aa][Mm][Ii]\.[Ee][Xx][Ee]|[Nn][Ee][Tt]\.[Ee][Xx][Ee]|[Nn][Ee][Tt]1\.[Ee][Xx][Ee]|[Nn][Ll][Tt][Ee][Ss][Tt]\.[Ee][Xx][Ee]|[Ss][Yy][Ss][Tt][Ee][Mm][Ii][Nn][Ff][Oo]\.[Ee][Xx][Ee]|[Ii][Pp][Cc][Oo][Nn][Ff][Ii][Gg]\.[Ee][Xx][Ee]|[Qq][Uu][Ss][Ee][Rr]\.[Ee][Xx][Ee]|[Nn][Bb][Tt][Ss][Tt][Aa][Tt]\.[Ee][Xx][Ee]|[Aa][Rr][Pp]\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 1h
  - name: Outbound network connections from PowerShell
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 2h
  - name: PsExec service or ADMIN$ share driven execution
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]\.[Ee][Xx][Ee])/ OR data_win_eventdata_parentImage:/.*\\([Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]\.[Ee][Xx][Ee])/ OR data_win_eventdata_commandLine:/.*[Aa][Dd][Mm][Ii][Nn]\$.*/)
    pivot_on:
    - host
    window: 2h
