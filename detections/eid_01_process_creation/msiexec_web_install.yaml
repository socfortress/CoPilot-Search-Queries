name: MsiExec Web Install
id: f7b5f842-a6af-4da5-9e95-e32478f3cd2f
version: 1
schema_version: "1.0"
date: "2022-01-07"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: f7b5f842-a6af-4da5-9e95-e32478f3cd2f
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious msiexec process starts with web addresses as parameter.
  MITRE ATT&CK: T1218.007, T1105.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* msiexec*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine: "*://*"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches '*
  msiexec*'; data_win_eventdata_commandLine matches '*://*'.

known_false_positives: >
  False positives depend on scripts and administrative tools used in the
  monitored environment. Baseline expected activity in your environment and tune
  this detection before relying on it for automated response.

references:
  - https://blog.trendmicro.com/trendlabs-security-intelligence/attack-using-windows-installer-msiexec-exe-leads-lokibot/
  - https://attack.mitre.org/techniques/T1218/007/
  - https://attack.mitre.org/techniques/T1105/

response:
  message: >
    MsiExec Web Install detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1218.007, T1105
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218.007
    - T1105
  custom_tags:
    - msiexec
    - install
    - process_creation
    - sysmon
    - stealth
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.* [Mm][Ss][Ii][Ee][Xx][Ee][Cc].*/ AND data_win_eventdata_commandLine:/.*:\/\/.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 8150732a-0c9d-4a99-82b9-9efb9b90c40c
    name: Suspicious Msiexec Quiet Install From Remote Location
    reason: Same remote-MSI fetch run silently (/q); confirms the install was meant to be hands-off
  - id: b0fd38c7-f71a-43a2-870e-f3ca06bcdd99
    name: Windows HTTP Network Communication From MSIExec
    reason: Network-level proof msiexec actually reached out to the URL and downloaded the package
  - id: 6f4191bb-912b-48a8-9ce7-682769541e6d
    name: Suspicious Msiexec Execute Arbitrary DLL
    reason: Sibling msiexec proxy-execution technique (/y,/z) from the same operator
  - id: 4a2a2c3e-209f-4d01-b513-4155a540b469
    name: Suspicious MsiExec Embedding Parent
    reason: The downloaded MSI's custom action spawns child processes via the msiexec -Embedding server
  - id: 1e53dd56-8d83-4eb4-a43e-b790a05510aa
    name: Always Install Elevated MSI Spawned Cmd And Powershell
    reason: Downloaded MSI running as SYSTEM and dropping a shell is the privilege-escalation payoff
  - id: 79a87aa6-e4bd-42fc-a5bb-5e6fbdcd62f5
    name: Msiexec Quiet Installation
    reason: Silent install of the fetched package on the same host
  - id: e22a6eb2-f8a5-44b5-8b44-a2dbd47b1144
    name: Potential MsiExec Masquerading
    reason: Attacker may rename or relocate msiexec to dodge exactly this rule
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: msiexec spawning shells or LOLBins
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Mm][Ss][Ii][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/)
    pivot_on: host
    window: 2h
  - name: msiexec outbound network connection
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*\\[Mm][Ss][Ii][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]/) AND data_win_eventdata_initiated:"true"
    pivot_on: host
    window: 1h
  - name: msiexec DNS lookups
    query: data_win_system_eventID:"22" AND (data_win_eventdata_image:/.*\\[Mm][Ss][Ii][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]/)
    pivot_on: host
    window: 1h
  - name: Files written by msiexec to user-writable paths
    query: data_win_system_eventID:"11" AND (data_win_eventdata_image:/.*\\[Mm][Ss][Ii][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]/) AND data_win_eventdata_targetFilename:/.*\\([Tt][Ee][Mm][Pp]|[Aa][Pp][Pp][Dd][Aa][Tt][Aa]|[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]|[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc])\\.*/
    pivot_on: host
    window: 2h
  - name: Persistence created after MSI install
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss].*\/[Cc][Rr][Ee][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*[Aa][Dd][Dd].*/)
    pivot_on: host
    window: 4h
