name: Fsutil Zeroing File
id: 4e5e024e-fabb-11eb-8b8f-acde48001122
version: 1
schema_version: "1.0"
date: "2026-04-27"
author: SOCFortress LLC
status: production
type: TTP

description: >
  This analytic detects the execution of fsutil.exe with the
  "setzerodata" subcommand, which writes zeros over the contents of a
  target file - effectively wiping its data while preserving the file
  metadata and structure. Sysmon EventID 1 is used to match process
  creation events where the image or OriginalFileName is fsutil.exe and
  the command line contains "setzerodata". This activity is significant
  because it is a known anti-forensic technique used by ransomware
  operators (notably LockBit) to destroy malware artifacts after
  encryption is complete - by zeroing out the ransomware binary itself,
  attackers ensure that responders cannot recover the executable for
  reverse engineering even if file recovery from filesystem journaling
  succeeds. fsutil setzerodata is a standard Windows administrative
  utility, but its legitimate use is rare outside of disk testing and
  forensic preparation contexts. If confirmed malicious, this action
  could hinder forensic investigations, prevent ransomware sample
  retrieval for IR analysis, and allow attackers to cover their tracks,
  significantly complicating incident response efforts and recovery
  planning.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image: "*fsutil.exe"
              - term:
                  data_win_eventdata_originalFileName: "fsutil.exe"
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine: "*setzerodata*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_parentCommandLine
    - data_win_eventdata_user
    - data_win_eventdata_processId
    - data_win_eventdata_processGuid
    - data_win_eventdata_parentProcessId
    - data_win_eventdata_parentProcessGuid
    - data_win_eventdata_hashes
    - data_win_eventdata_integrityLevel
    - data_win_eventdata_currentDirectory

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-27 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-27 23:59:59.999"

how_to_implement: >
  This detection requires Sysmon EventID 1 (Process Creation) logs to be forwarded
  from Windows endpoints to Wazuh Indexer. Ensure Sysmon is deployed with a
  configuration that captures Image, OriginalFileName, and CommandLine fields
  (SwiftOnSecurity or Olaf Hartong Sysmon modular config recommended). The
  detection matches fsutil.exe either by Image path or PE OriginalFileName,
  combined with "setzerodata" in the command line. The Graylog equivalent
  uses character classes for case-insensitive matching.

known_false_positives: >
  No benign false positives have been identified at this time.
  Legitimate use of fsutil setzerodata is extremely rare outside of
  authorized disk benchmarking, secure-erase preparation, or forensic
  testing contexts. Any occurrence should be treated as a high-priority
  security incident pending investigation of the parent process, user
  context, and the specific file being zeroed.

references:
  - https://attack.mitre.org/techniques/T1070/
  - https://attack.mitre.org/techniques/T1070/004/
  - https://app.any.run/tasks/e0ac072d-58c9-4f53-8a3b-3e491c7ac5db/
  - https://news.sophos.com/en-us/2020/04/24/lockbit-ransomware-borrows-tricks-to-keep-up-with-revil-and-maze/
  - https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/fsutil-file

response:
  message: >
    Possible file data destruction via fsutil setzerodata was detected
    on endpoint $agent_name$ by user $data_win_eventdata_user$. Process
    image: $data_win_eventdata_image$. Parent process:
    $data_win_eventdata_parentImage$. Command line:
    $data_win_eventdata_commandLine$. This is a high-confidence
    indicator of anti-forensic activity commonly observed post-ransomware
    encryption; investigate immediately, identify which file(s) were
    zeroed, attempt sample preservation from filesystem journals or
    volume shadow copies, and isolate the host.
  risk_score: 80
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 70
    - field: data_win_eventdata_user
      type: user
      score: 70
  threat_objects:
    - field: data_win_eventdata_image
      type: process_name
    - field: data_win_eventdata_parentImage
      type: parent_process_name
    - field: data_win_eventdata_commandLine
      type: command_line

tags:
  analytic_story:
    - Ransomware
    - LockBit Ransomware
    - Defense Evasion
    - Anti-Forensics
    - Indicator Removal
  asset_type: Endpoint
  mitre_attack_id:
    - T1070
    - T1070.004
  custom_tags:
    - fsutil
    - setzerodata
    - file_wiping
    - anti_forensics
    - indicator_removal
    - ransomware_post_encryption
    - lolbin
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Ff][Ss][Uu][Tt][Ii][Ll]\.exe.*/ OR data_win_eventdata_originalFileName:"fsutil.exe") AND data_win_eventdata_commandLine:/.*[Ss][Ee][Tt][Zz][Ee][Rr][Oo][Dd][Aa][Tt][Aa].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: add64136-62e5-48ea-807e-88638d02df1e
    name: Fsutil Suspicious Invocation
    reason: Broader fsutil abuse (deletejournal) frequently runs in the same ransomware cleanup phase.
  - id: 74db3488-fd28-480a-95aa-b7af626de068
    name: LockerGoga Ransomware Activity
    reason: 'LockerGoga ransomware activity: encryption stage preceding binary wiping.'
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: Shadow copy deletion typically occurs before encryption in the same intrusion.
  - id: 639c9081-f482-47d3-a0bd-ddee3d4ecd76
    name: All Backups Deleted Via Wbadmin.EXE
    reason: 'Backup deletion via wbadmin: recovery inhibition ahead of the encryptor.'
  - id: cc36992a-4671-4f21-a91d-6c2b72a2edf5
    name: Suspicious Eventlog Clearing or Configuration Change Activity
    reason: Event log clearing is part of the same post-encryption anti-forensic sweep.
  - id: a4824fca-976f-4964-b334-0621379e84c4
    name: Potential File Overwrite Via Sysinternals SDelete
    reason: SDelete overwrites files to defeat recovery, same objective as zeroing the binary.
  - id: 4b046706-5789-4673-b111-66f25fe99534
    name: Deleted Data Overwritten Via Cipher.EXE
    reason: Cipher /w wipes free space, a related data-destruction step.
  - id: 2f974656-6d83-4059-bbdf-68ac5403422f
    name: Hermetic Wiper TG Process Patterns
    reason: 'Wiper process patterns: destructive endgame overlapping with zeroing.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Recovery inhibition before encryption
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn] [Dd][Ee][Ll][Ee][Tt][Ee] [Ss][Hh][Aa][Dd][Oo][Ww][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ww][Bb][Aa][Dd][Mm][Ii][Nn] [Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Bb][Cc][Dd][Ee][Dd][Ii][Tt] \/[Ss][Ee][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ww][Mm][Ii][Cc] [Ss][Hh][Aa][Dd][Oo][Ww][Cc][Oo][Pp][Yy] [Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Ss][Ii][Zz][Ee] [Ss][Hh][Aa][Dd][Oo][Ww][Ss][Tt][Oo][Rr][Aa][Gg][Ee].*/)
    pivot_on: host
    window: 4h
  - name: Ransom note creation
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*([Rr][Ee][Aa][Dd][Mm][Ee]|[Rr][Ee][Ss][Tt][Oo][Rr][Ee]|[Dd][Ee][Cc][Rr][Yy][Pp][Tt]|[Rr][Aa][Nn][Ss][Oo][Mm]).*\.([Tt][Xx][Tt]|[Hh][Tt][Aa]|[Hh][Tt][Mm][Ll]?)/
    pivot_on: host
    window: 4h
  - name: Defense impairment and service kills
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll] [Cc][Ll].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee][Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc] [Ss][Tt][Oo][Pp].*/ OR data_win_eventdata_commandLine:/.*[Tt][Aa][Ss][Kk][Kk][Ii][Ll][Ll] \/[Ff].*/)
    pivot_on: host
    window: 4h
  - name: Executable written to temp or public paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(\\[Tt][Ee][Mm][Pp]\\|\\[Pp][Uu][Bb][Ll][Ii][Cc]\\|\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\).*\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 4h
  - name: Lateral movement tooling
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Pp][Ss][Ee][Xx][Ee][Cc].*/ OR data_win_eventdata_commandLine:/.*[Ww][Mm][Ii][Cc] \/[Nn][Oo][Dd][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Cc][Oo][Mm][Mm][Aa][Nn][Dd].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss] \/[Ss].*/)
    pivot_on: host
    window: 4h
