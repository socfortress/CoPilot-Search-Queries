name: Audit Policy Tampering Via Auditpol
id: 0a13e132-651d-11eb-ae93-0242ac130002
version: 1
schema_version: "1.0"
date: "2023-02-22"
author: Janantha Marasinghe (https://github.com/blueteam0ps)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 0a13e132-651d-11eb-ae93-0242ac130002
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Threat actors can use auditpol binary to change audit policy configuration to
  impair detection capability. This can be carried out by selectively
  disabling/removing certain audit policies as well as restoring a custom policy
  owned by the threat actor. MITRE ATT&CK: T1685.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\auditpol.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "AUDITPOL.EXE"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*disable*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*clear*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*remove*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*restore*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\auditpol.exe'; data_win_eventdata_originalFileName equals 'AUDITPOL.EXE';
  data_win_eventdata_commandLine matches '*disable*', among other conditions.

known_false_positives: >
  Administrator or administrator scripts might leverage the flags mentioned in
  the detection section. Either way, it should always be monitored. Baseline
  expected activity in your environment and tune this detection before relying
  on it for automated response.

references:
  - https://www.microsoft.com/security/blog/2021/01/20/deep-dive-into-the-solorigate-second-stage-activation-from-sunburst-to-teardrop-and-raindrop/
  - https://attack.mitre.org/techniques/T1685/001/

response:
  message: >
    Audit Policy Tampering Via Auditpol detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1685.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685.001
  custom_tags:
    - audit
    - policy
    - tampering
    - process_creation
    - sysmon
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Aa][Uu][Dd][Ii][Tt][Pp][Oo][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Aa][Uu][Dd][Ii][Tt][Pp][Oo][Ll]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Cc][Ll][Ee][Aa][Rr].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Mm][Oo][Vv][Ee].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Ss][Tt][Oo][Rr][Ee].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c6c56ada-612b-42d1-9a29-adad3c5c2c1e
    name: Audit Policy Tampering Via NT Resource Kit Auditpol
    reason: Legacy auditpol variant of the same impairment; the actor may try both.
  - id: windows-audit-policy-cleared-via-auditpol-001
    name: Windows Audit Policy Cleared via Auditpol
    reason: Overlapping auditpol clear/remove behaviour confirming policy wipe.
  - id: windows-audit-policy-subcategory-disabled-via-auditpol-001
    name: Windows Audit Policy Subcategory Disabled via Auditpol
    reason: Selective disabling of subcategories, the stealthier form of the same tampering.
  - id: windows-audit-policy-disabled-legacy-auditpol-001
    name: Windows Audit Policy Disabled via Legacy Auditpol
    reason: Legacy-syntax disabling in the same family.
  - id: 802a0930-0a4a-4451-bf6c-6366c6b6d9e7
    name: Windows Global Object Access Audit List Cleared Via Auditpol
    reason: Clearing global SACLs, another auditpol blinding step.
  - id: fdb829a8-db84-4832-b64b-3e964cd44f01
    name: Windows Eventlog Cleared Via Wevtutil
    reason: Log clearing typically accompanies audit-policy impairment to erase already-written evidence.
  - id: 236e7c8e-c9d9-11eb-a824-acde48001122
    name: Disable Logs Using WevtUtil
    reason: Disables event channels, same defense-evasion goal.
  - id: cc36992a-4671-4f21-a91d-6c2b72a2edf5
    name: Suspicious Eventlog Clearing or Configuration Change Activity
    reason: Broader log tampering by the same actor.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Any auditpol execution on host
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*[Aa]udit[Pp]ol.*/
    pivot_on: host
    window: 6h
  - name: Event log clearing or channel disabling
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ww]evtutil.*/ OR /.*[Cc]lear-[Ee]vent[Ll]og.*/ OR /.*[Rr]emove-[Ee]vent[Ll]og.*/)
    pivot_on: host
    window: 6h
  - name: Audit policy change and log cleared security events
    query: data_win_system_eventID:(4719 OR 1102 OR 4907)
    pivot_on: host
    window: 6h
  - name: Security tool or Defender tampering
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ss]et-[Mm]p[Pp]reference.*/ OR /.*[Ss]c.* (stop|config) .*/ OR /.*[Nn]et.* stop .*/)
    pivot_on: host
    window: 6h
  - name: Credential access or lateral tooling around the change
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ll]sass.*/ OR /.*[Mm]imikatz.*/ OR /.*[Pp]sexec.*/)
    pivot_on: host
    window: 4h
