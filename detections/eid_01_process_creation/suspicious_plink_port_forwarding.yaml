name: Suspicious Plink Port Forwarding
id: 48a61b29-389f-4032-b317-b30de6b95314
version: 1
schema_version: "1.0"
date: "2022-10-09"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 48a61b29-389f-4032-b317-b30de6b95314
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious Plink tunnel port forwarding to a local port. MITRE ATT&CK:
  T1572, T1021.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - term:
            data_win_eventdata_description:
              value: "Command-line SSH, Telnet, and Rlogin client"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* -R *"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_description
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_description equals
  'Command-line SSH, Telnet, and Rlogin client'; data_win_eventdata_commandLine
  matches '* -R *'.

known_false_positives: >
  Administrative activity using a remote port forwarding to a local port.
  Baseline expected activity in your environment and tune this detection before
  relying on it for automated response.

references:
  - https://www.real-sec.com/2019/04/bypassing-network-restrictions-through-rdp-tunneling/
  - https://medium.com/@informationsecurity/remote-ssh-tunneling-with-plink-exe-7831072b3d7d
  - https://attack.mitre.org/techniques/T1572/
  - https://attack.mitre.org/techniques/T1021/001/

response:
  message: >
    Suspicious Plink Port Forwarding detected on host $agent_name$. Matched
    data_win_eventdata_description: $data_win_eventdata_description$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1572, T1021.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_description
      type: other
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1572
    - T1021.001
  custom_tags:
    - plink
    - forwarding
    - process_creation
    - sysmon
    - command_and_control
    - lateral_movement
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_description:/[Cc][Oo][Mm][Mm][Aa][Nn][Dd]-[Ll][Ii][Nn][Ee] [Ss][Ss][Hh], [Tt][Ee][Ll][Nn][Ee][Tt], [Aa][Nn][Dd] [Rr][Ll][Oo][Gg][Ii][Nn] [Cc][Ll][Ii][Ee][Nn][Tt]/ AND data_win_eventdata_commandLine:/.* -[Rr] .*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: f38ce0b9-5e97-4b47-a211-7dc8d8b871da
    name: Potential RDP Tunneling Via Plink
    reason: Plink reverse forward to port 3389 is the RDP-tunnel specialisation of this behaviour
  - id: 1c12727d-02bf-45ff-a9f3-d49806a3cf43
    name: Renamed Plink Execution
    reason: Renamed plink; attackers rename the binary to dodge exactly this rule
  - id: 2daa93a0-a5fb-41c5-8cd8-3c11294bfd1f
    name: Potential SSH Tunnel Persistence Install Using A Scheduled Task
    reason: SSH tunnel kept alive via a scheduled task is the persistence follow-on
  - id: 782d6f3e-4c5d-4b8c-92a3-1d05fed72e63
    name: RDP Port Forwarding Rule Added Via Netsh.EXE
    reason: Netsh portproxy for RDP is the local complement of a tunnel exposing RDP
  - id: 0d5675be-bc88-4172-86d3-1e96a4476536
    name: Potential Tampering With RDP Related Registry Keys Via Reg.EXE
    reason: Enabling RDP via registry commonly precedes tunnelling it out
  - id: 8a3038e8-9c9d-46f8-b184-66234a160f6f
    name: Potential Remote Desktop Tunneling
    reason: Generic remote desktop tunneling detection co-occurs with plink -R
  - id: 8b0e12da-d3c3-49db-bb4f-256703f380e5
    name: PUA - Chisel Tunneling Tool Execution
    reason: Chisel is an alternative tunnelling tool seen alongside or instead of plink
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: RDP enablement, firewall opening and portproxy
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ff][Dd][Dd][Ee][Nn][Yy][Tt][Ss][Cc][Oo][Nn][Nn][Ee][Cc][Tt][Ii][Oo][Nn][Ss].*/ OR /.*[Nn][Ee][Tt][Ss][Hh].*[Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll].*3389.*/ OR /.*[Pp][Oo][Rr][Tt][Pp][Rr][Oo][Xx][Yy].*/)
    pivot_on: host
    window: 6h
  - name: Outbound connections from plink and putty family
    query: data_win_system_eventID:3 AND data_win_eventdata_image:(/.*[Pp][Ll][Ii][Nn][Kk].*/ OR /.*[Pp][Uu][Tt][Tt][Yy].*/ OR /.*[Pp][Ss][Cc][Pp].*/)
    pivot_on: host
    window: 6h
  - name: Plink with credential or batch flags
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Pp][Ll][Ii][Nn][Kk].* -[Pp][Ww] .*/ OR /.*[Pp][Ll][Ii][Nn][Kk].* -[Bb][Aa][Tt][Cc][Hh].*/ OR /.*[Pp][Ll][Ii][Nn][Kk].* -[Ll] .*/)
    pivot_on: host
    window: 24h
  - name: Plink dropped to disk
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*[Pp][Ll][Ii][Nn][Kk].*\.exe/
    pivot_on: host
    window: 24h
  - name: Scheduled task or service persisting a tunnel
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss].*[Pp][Ll][Ii][Nn][Kk].*/ OR /.*[Ss][Cc].*[Cc][Rr][Ee][Aa][Tt][Ee].*[Pp][Ll][Ii][Nn][Kk].*/)
    pivot_on: host
    window: 24h
