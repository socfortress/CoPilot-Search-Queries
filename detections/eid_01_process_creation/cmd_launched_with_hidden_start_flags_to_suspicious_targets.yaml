  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Cc][Mm][Dd]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*[Ss][Tt][Aa][Rr][Tt] .*/ OR data_win_eventdata_commandLine:/.*[Ss][Tt][Aa][Rr][Tt]\/[Bb].*/ OR data_win_eventdata_commandLine:/.*[Ss][Tt][Aa][Rr][Tt]\/[Mm][Ii][Nn].*/) AND (data_win_eventdata_commandLine:/.*-[Bb] .*/ OR data_win_eventdata_commandLine:/.*\/[Bb] .*/ OR data_win_eventdata_commandLine:/.*–[Bb] .*/ OR data_win_eventdata_commandLine:/.*—[Bb] .*/ OR data_win_eventdata_commandLine:/.*―[Bb] .*/ OR data_win_eventdata_commandLine:/.*-[Bb]\".*/ OR data_win_eventdata_commandLine:/.*\/[Bb]\".*/ OR data_win_eventdata_commandLine:/.*–[Bb]\".*/ OR data_win_eventdata_commandLine:/.*—[Bb]\".*/ OR data_win_eventdata_commandLine:/.*―[Bb]\".*/ OR data_win_eventdata_commandLine:/.*-[Mm][Ii][Nn] .*/ OR data_win_eventdata_commandLine:/.*\/[Mm][Ii][Nn] .*/ OR data_win_eventdata_commandLine:/.*–[Mm][Ii][Nn] .*/ OR data_win_eventdata_commandLine:/.*—[Mm][Ii][Nn] .*/ OR data_win_eventdata_commandLine:/.*―[Mm][Ii][Nn] .*/ OR data_win_eventdata_commandLine:/.*-[Mm][Ii][Nn]\".*/ OR data_win_eventdata_commandLine:/.*\/[Mm][Ii][Nn]\".*/ OR data_win_eventdata_commandLine:/.*–[Mm][Ii][Nn]\".*/ OR data_win_eventdata_commandLine:/.*—[Mm][Ii][Nn]\".*/ OR data_win_eventdata_commandLine:/.*―[Mm][Ii][Nn]\".*/) AND (data_win_eventdata_commandLine:/.*:\\[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss]\\.*/ OR data_win_eventdata_commandLine:/.*:\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_commandLine:/.*:\\[Uu][Ss][Ee][Rr][Ss]\\[Dd][Ee][Ff][Aa][Uu][Ll][Tt]\\.*/ OR data_win_eventdata_commandLine:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Rr][Oo][Aa][Mm][Ii][Nn][Gg]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Cc][Oo][Nn][Tt][Aa][Cc][Tt][Ss]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Dd][Oo][Cc][Uu][Mm][Ee][Nn][Tt][Ss]\\