name: PUA - Radmin Viewer Utility Execution
id: 5817e76f-4804-41e6-8f1d-5fa0b3ecae2d
version: 1
schema_version: "1.0"
date: "2023-12-11"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 5817e76f-4804-41e6-8f1d-5fa0b3ecae2d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of Radmin which can be abused by an adversary to
  remotely control Windows machines. MITRE ATT&CK: T1072.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - term:
                  data_win_eventdata_description:
                    value: "Radmin Viewer"
                    case_insensitive: true
              - term:
                  data_win_eventdata_product:
                    value: "Radmin Viewer"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "Radmin.exe"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_description
    - data_win_eventdata_product
    - data_win_eventdata_originalFileName
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_description equals 'Radmin
  Viewer'; data_win_eventdata_product equals 'Radmin Viewer';
  data_win_eventdata_originalFileName equals 'Radmin.exe'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1072/T1072.md
  - https://www.radmin.fr/
  - https://attack.mitre.org/techniques/T1072/

response:
  message: >
    PUA - Radmin Viewer Utility Execution detected on host $agent_name$. Matched
    data_win_eventdata_description: $data_win_eventdata_description$. Matched
    data_win_eventdata_product: $data_win_eventdata_product$. MITRE ATT&CK:
    T1072
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_description
      type: other
    - field: data_win_eventdata_product
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1072
  custom_tags:
    - radmin
    - viewer
    - utility
    - process_creation
    - sysmon
    - execution
    - lateral_movement
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_description:/[Rr][Aa][Dd][Mm][Ii][Nn] [Vv][Ii][Ee][Ww][Ee][Rr]/ OR data_win_eventdata_product:/[Rr][Aa][Dd][Mm][Ii][Nn] [Vv][Ii][Ee][Ww][Ee][Rr]/ OR data_win_eventdata_originalFileName:/[Rr][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: ccad96d7-a48c-4f13-8b9c-9f6a31cba454
    name: Detect Remote Access Software Usage FileInfo
    reason: Radmin is one of several remote-access tools attackers stack for persistent access.
  - id: b52e84a3-029e-4529-b09b-71d19dd27e94
    name: Remote Access Tool - AnyDesk Execution
    reason: Common co-deployed alternative remote-access tool.
  - id: 758ff488-18d5-4cbe-8ec4-02b6285a434f
    name: Remote Access Tool - NetSupport Execution
    reason: Redundant RAT installed for persistence alongside Radmin.
  - id: 145322e4-0fd3-486b-81ca-9addc75736d8
    name: Use of UltraVNC Remote Access Software
    reason: Another VNC-style remote control tool frequently dropped with Radmin.
  - id: 57bff678-25d1-4d6c-8211-8ca106d12053
    name: Remote Access Tool - ScreenConnect Execution
    reason: Attackers chain multiple remote-management tools.
  - id: 01aeb693-138d-49d2-9403-c4f52d7d3d62
    name: RDP Connection Allowed Via Netsh.EXE
    reason: Firewall opening for remote access, precursor to exposing a Radmin port.
  - id: 0d5675be-bc88-4172-86d3-1e96a4476536
    name: Potential Tampering With RDP Related Registry Keys Via Reg.EXE
    reason: Remote-access enablement groundwork on the same host.
  - id: 17a1be64-8d88-40bf-b5ff-a4f7a50ebcc8
    name: Suspicious New Service Creation
    reason: Radmin Server installs as a service for persistence.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Firewall rules opening remote access ports
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Nn]etsh.*([Aa]dv[Ff]irewall|[Ff]irewall).*[Aa]dd.*(4899|3389|5900|[Rr]admin).*/
    pivot_on: host
    window: 6h
  - name: Radmin server install or service
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Rr]admin.*([Ii]nstall|silent|[Ss]c +create|r_server).*/ OR data_win_eventdata_image:/.*\\[Rr]_[Ss]erver\.[Ee][Xx][Ee]/)
    pivot_on: host
    window: 6h
  - name: Connections on Radmin port 4899
    query: data_win_system_eventID:"3" AND data_win_eventdata_destinationPort:"4899"
    pivot_on: host
    window: 6h
  - name: Other remote access tools executed
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Aa]ny[Dd]esk|[Tt]eam[Vv]iewer|[Ss]creen[Cc]onnect|[Cc]lient32|[Ww]in[Vv][Nn][Cc]|[Tt]vnserver|[Uu]ltra[Vv]iewer|[Ss]plashtop|[Rr]utserv|[Mm]esh[Aa]gent)[^\\]*\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 24h
  - name: Network and remote interactive logons
    query: data_win_system_eventID:"4624" AND data_win_eventdata_logonType:("3" OR "10")
    pivot_on: user
    window: 6h
