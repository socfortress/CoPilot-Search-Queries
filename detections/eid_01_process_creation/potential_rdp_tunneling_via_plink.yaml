name: Potential RDP Tunneling Via Plink
id: f38ce0b9-5e97-4b47-a211-7dc8d8b871da
version: 1
schema_version: "1.0"
date: "2023-01-27"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: f38ce0b9-5e97-4b47-a211-7dc8d8b871da
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Execution of plink to perform data exfiltration and tunneling. MITRE ATT&CK:
  T1572.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\plink.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine: "*:127.0.0.1:3389*"
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\plink.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine: "*:3389*"
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* -P 443*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* -P 22*"
                                case_insensitive: true
                        minimum_should_match: 1
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\plink.exe'; data_win_eventdata_commandLine matches '*:127.0.0.1:3389*';
  data_win_eventdata_image matches '*\plink.exe', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.microsoft.com/security/blog/2022/07/26/malicious-iis-extensions-quietly-open-persistent-backdoors-into-servers/
  - https://attack.mitre.org/techniques/T1572/

response:
  message: >
    Potential RDP Tunneling Via Plink detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1572
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1572
  custom_tags:
    - tunneling
    - plink
    - process_creation
    - sysmon
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\[Pp][Ll][Ii][Nn][Kk]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*:127\.0\.0\.1:3389.*/) OR (data_win_eventdata_image:/.*\\[Pp][Ll][Ii][Nn][Kk]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*:3389.*/ AND (data_win_eventdata_commandLine:/.* -[Pp] 443.*/ OR data_win_eventdata_commandLine:/.* -[Pp] 22.*/)))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 48a61b29-389f-4032-b317-b30de6b95314
    name: Suspicious Plink Port Forwarding
    reason: Generic plink -R/-L forwarding; the same tool producing the tunnel.
  - id: 8a3038e8-9c9d-46f8-b184-66234a160f6f
    name: Potential Remote Desktop Tunneling
    reason: Broader RDP tunneling detection for other tools used alongside plink.
  - id: 782d6f3e-4c5d-4b8c-92a3-1d05fed72e63
    name: RDP Port Forwarding Rule Added Via Netsh.EXE
    reason: Alternative or additional local RDP forward through netsh portproxy.
  - id: 01aeb693-138d-49d2-9403-c4f52d7d3d62
    name: RDP Connection Allowed Via Netsh.EXE
    reason: Firewall opened for RDP typically precedes tunneled RDP.
  - id: 0d5675be-bc88-4172-86d3-1e96a4476536
    name: Potential Tampering With RDP Related Registry Keys Via Reg.EXE
    reason: RDP enabled via registry before exposing it through the tunnel.
  - id: 954f0af7-62dd-418f-b3df-a84bc2c7a774
    name: New Remote Desktop Connection Initiated Via Mstsc.EXE
    reason: Attacker connects mstsc to localhost over the tunnel afterwards.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: mstsc connecting to loopback
    query: data_win_system_eventID:1 AND data_win_eventdata_image:*mstsc.exe AND data_win_eventdata_commandLine:/.*(127\.0\.0\.1|[Ll]ocalhost).*/
    pivot_on: host
    window: 6h
  - name: Netsh portproxy / RDP firewall changes
    query: data_win_system_eventID:1 AND data_win_eventdata_image:*netsh.exe AND (data_win_eventdata_commandLine:/.*[Pp]ortproxy.*/ OR data_win_eventdata_commandLine:/.*3389.*/)
    pivot_on: host
    window: 6h
  - name: Plink/putty-family tool dropped
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*([Pp]link|[Pp]utty|[Pp]scp)\.exe/
    pivot_on: host
    window: 24h
  - name: Outbound connection from plink
    query: data_win_system_eventID:3 AND data_win_eventdata_image:*plink.exe
    pivot_on: host
    window: 6h
  - name: RDP logons arriving from loopback
    query: data_win_system_eventID:4624 AND data_win_eventdata_logonType:10 AND data_win_eventdata_ipAddress:(127.0.0.1 OR \:\:1)
    pivot_on: host
    window: 6h
