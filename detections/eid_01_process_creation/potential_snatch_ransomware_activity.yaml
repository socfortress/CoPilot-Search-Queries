name: Potential Snatch Ransomware Activity
id: 5325945e-f1f0-406e-97b8-65104d393fff
version: 1
schema_version: "1.0"
date: "2025-10-19"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 5325945e-f1f0-406e-97b8-65104d393fff
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: production
type: TTP

description: >
  Detects specific process characteristics of Snatch ransomware word document
  droppers. MITRE ATT&CK: T1204.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - regexp:
                  data_win_eventdata_commandLine: ".*(shutdown[ ]+/r /f /t 00).*"
              - regexp:
                  data_win_eventdata_commandLine: ".*(net[ ]+stop SuperBackupMan).*"
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches the
  regex /.*(shutdown[ ]+/r /f /t 00).*/; data_win_eventdata_commandLine matches
  the regex /.*(net[ ]+stop SuperBackupMan).*/.

known_false_positives: >
  Scripts that shutdown the system immediately and reboot them in safe mode are
  unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://news.sophos.com/en-us/2019/12/09/snatch-ransomware-reboots-pcs-into-safe-mode-to-bypass-protection/
  - https://attack.mitre.org/techniques/T1204/

response:
  message: >
    Potential Snatch Ransomware Activity detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1204
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1204
  custom_tags:
    - snatch
    - ransomware
    - process_creation
    - sysmon
    - execution
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*(shutdown[ ]+\/r \/f \/t 00).*/ OR data_win_eventdata_commandLine:/.*(net[ ]+stop SuperBackupMan).*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: Ransomware wipes shadow copies around the same time as the Snatch safe-mode reboot.
  - id: 1444443e-6757-43e4-9ea4-c8fc705f79a2
    name: Boot Configuration Tampering Via Bcdedit.EXE
    reason: Snatch forces safe mode via bcdedit before the forced reboot.
  - id: c9fbe8e9-119d-40a6-9b59-dd58a5d84429
    name: Potential Ransomware or Unauthorized MBR Tampering Via Bcdedit.EXE
    reason: Boot-recovery disabling precedes encryption.
  - id: 639c9081-f482-47d3-a0bd-ddee3d4ecd76
    name: All Backups Deleted Via Wbadmin.EXE
    reason: Backup destruction is a pre-encryption step.
  - id: 34ebb878-1b15-4895-b352-ca2eeb99b274
    name: Suspicious Execution of Shutdown
    reason: The forced immediate reboot is the same shutdown behaviour.
  - id: 5e95028c-5229-4214-afae-d653d573d0ec
    name: Security Service Disabled Via Reg.EXE
    reason: Security tooling is disabled to allow encryption.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Safe mode boot configuration
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*[Bb]cdedit.*[Ss]afeboot.*/
    pivot_on: host
    window: 6h
  - name: Backup and shadow copy destruction
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*[Vv]ssadmin.*[Dd]elete.*/ OR data_win_eventdata_commandLine:/.*[Ww]badmin.*[Dd]elete.*/)
    pivot_on: host
    window: 6h
  - name: Service stops via net or sc
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(net|sc)(\.exe)? +stop.*/
    pivot_on: host
    window: 6h
  - name: Safe-mode registry changes
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*[Ss]afe[Bb]oot.*/
    pivot_on: host
    window: 6h
  - name: Ransom-style file extensions created
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\.(snatch|[Ee]ncrypted|[Ll]ocked).*/
    pivot_on: host
    window: 6h
