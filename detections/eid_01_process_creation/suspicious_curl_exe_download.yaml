name: Suspicious Curl.EXE Download
id: e218595b-bbe7-4ee5-8a96-f32a24ad3468
version: 1
schema_version: "1.0"
date: "2023-02-21"
author: Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: e218595b-bbe7-4ee5-8a96-f32a24ad3468
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a suspicious curl process start on Windows and outputs the requested
  document to a local file. MITRE ATT&CK: T1105.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\curl.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_product:
                    value: "The curl executable"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*%AppData%*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*%Public%*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*%Temp%*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*%tmp%*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\AppData\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Desktop\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Temp\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Users\\\\Public\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*C:\\\\PerfLogs\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*C:\\\\ProgramData\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*C:\\\\Windows\\\\Temp\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.gif"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.jpeg"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.jpg"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.png"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.temp"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.tmp"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.txt"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.vbe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.vbs"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_parentImage"
        - exists:
            field: "data_win_eventdata_image"
        - exists:
            field: "data_win_eventdata_commandLine"
        - bool:
            must_not:
              - bool:
                  must:
                    - term:
                        data_win_eventdata_parentImage:
                          value: "C:\\Program Files\\Git\\usr\\bin\\sh.exe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_image:
                          value: "C:\\Program Files\\Git\\mingw64\\bin\\curl.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*--silent --show-error --output *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*gfw-httpget-*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*AppData*"
                          case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_product
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\curl.exe'; data_win_eventdata_product equals 'The curl executable';
  data_win_eventdata_commandLine matches '*%AppData%*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/max_mal_/status/1542461200797163522
  - https://web.archive.org/web/20200128160046/https://twitter.com/reegun21/status/1222093798009790464
  - https://github.com/pr0xylife/Qakbot/blob/4f0795d79dabee5bc9dd69f17a626b48852e7869/Qakbot_AA_23.06.2022.txt
  - https://www.volexity.com/blog/2022/07/28/sharptongue-deploys-clever-mail-stealing-browser-extension-sharpext/
  - https://github.com/redcanaryco/atomic-red-team/blob/0f229c0e42bfe7ca736a14023836d65baa941ed2/atomics/T1105/T1105.md#atomic-test-18---curl-download-file
  - https://attack.mitre.org/techniques/T1105/

response:
  message: >
    Suspicious Curl.EXE Download detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_product: $data_win_eventdata_product$. MITRE ATT&CK:
    T1105
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_product
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1105
  custom_tags:
    - download
    - process_creation
    - sysmon
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_product:/[Tt][Hh][Ee] [Cc][Uu][Rr][Ll] [Ee][Xx][Ee][Cc][Uu][Tt][Aa][Bb][Ll][Ee]/) AND (data_win_eventdata_commandLine:/.*%[Aa][Pp][Pp][Dd][Aa][Tt][Aa]%.*/ OR data_win_eventdata_commandLine:/.*%[Pp][Uu][Bb][Ll][Ii][Cc]%.*/ OR data_win_eventdata_commandLine:/.*%[Tt][Ee][Mm][Pp]%.*/ OR data_win_eventdata_commandLine:/.*%[Tt][Mm][Pp]%.*/ OR data_win_eventdata_commandLine:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Dd][Ee][Ss][Kk][Tt][Oo][Pp]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_commandLine:/.*[Cc]:\\[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss]\\.*/ OR data_win_eventdata_commandLine:/.*[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_commandLine:/.*[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_commandLine:/.*\.[Dd][Ll][Ll]/ OR data_win_eventdata_commandLine:/.*\.[Gg][Ii][Ff]/ OR data_win_eventdata_commandLine:/.*\.[Jj][Pp][Ee][Gg]/ OR data_win_eventdata_commandLine:/.*\.[Jj][Pp][Gg]/ OR data_win_eventdata_commandLine:/.*\.[Pp][Nn][Gg]/ OR data_win_eventdata_commandLine:/.*\.[Tt][Ee][Mm][Pp]/ OR data_win_eventdata_commandLine:/.*\.[Tt][Mm][Pp]/ OR data_win_eventdata_commandLine:/.*\.[Tt][Xx][Tt]/ OR data_win_eventdata_commandLine:/.*\.[Vv][Bb][Ee]/ OR data_win_eventdata_commandLine:/.*\.[Vv][Bb][Ss]/) AND _exists_:data_win_eventdata_parentImage AND _exists_:data_win_eventdata_image AND _exists_:data_win_eventdata_commandLine AND NOT (data_win_eventdata_parentImage:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Gg][Ii][Tt]\\[Uu][Ss][Rr]\\[Bb][Ii][Nn]\\[Ss][Hh]\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Gg][Ii][Tt]\\[Mm][Ii][Nn][Gg][Ww]64\\[Bb][Ii][Nn]\\[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*--[Ss][Ii][Ll][Ee][Nn][Tt] --[Ss][Hh][Oo][Ww]-[Ee][Rr][Rr][Oo][Rr] --[Oo][Uu][Tt][Pp][Uu][Tt] .*/ AND data_win_eventdata_commandLine:/.*[Gg][Ff][Ww]-[Hh][Tt][Tt][Pp][Gg][Ee][Tt]-.*/ AND data_win_eventdata_commandLine:/.*[Aa][Pp][Pp][Dd][Aa][Tt][Aa].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 21dd6d38-2b18-4453-9404-a0fe4a0cc288
    name: Curl Download And Execute Combination
    reason: 'Direct follow-on: the downloaded file is executed in the same command chain.'
  - id: 9cc85849-3b02-4cb5-b371-3a1ff54f2218
    name: File Download From IP URL Via Curl.EXE
    reason: Same tool pulling from a raw IP is the typical C2/staging variant of this download.
  - id: 56454143-524f-49fb-b1c6-3fb8b1ad41fb
    name: Suspicious File Download From File Sharing Domain Via Curl.EXE
    reason: Alternate hosting source for the same curl ingress-tool-transfer behaviour.
  - id: 85de1f22-d189-44e4-8239-dc276b45379b
    name: Curl Web Request With Potential Custom User-Agent
    reason: Custom UA on curl indicates scripted malware staging rather than admin use.
  - id: 7530cd3d-7671-43e3-b209-976966f6ea48
    name: Renamed CURL.EXE Execution
    reason: Attackers rename curl to evade; same download intent seen via product metadata.
  - id: 1d174d38-8fda-4081-a9b6-56d9763c0cd8
    name: Scheduled Task Creation with Curl and PowerShell Execution Combo
    reason: Persistence commonly follows a curl-staged payload.
  - id: d059842b-6b9d-4ed1-b5c3-5b89143c6ede
    name: File Download Via Bitsadmin
    reason: Fallback download LOLBin that often alternates with curl in the same intrusion.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Curl invocations writing output to disk
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*\\curl\.exe/ AND (data_win_eventdata_commandLine:/.* -o .*/ OR data_win_eventdata_commandLine:/.*--output.*/ OR data_win_eventdata_commandLine:/.* -O .*/)
    pivot_on: host
    window: 4h
  - name: Executables or scripts created in user-writable paths
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\\(AppData|Users\\Public|ProgramData|Temp)\\.*\.(exe|dll|ps1|bat|vbs|js|msi|hta)/
    pivot_on: host
    window: 4h
  - name: Execution from curl staging paths
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*\\(AppData|Users\\Public|ProgramData)\\.*\.exe/
    pivot_on: host
    window: 4h
  - name: Outbound connections by curl
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*\\curl\.exe/
    pivot_on: host
    window: 2h
  - name: Persistence created after download
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*\\schtasks\.exe/ OR data_win_eventdata_commandLine:/.*CurrentVersion\\Run.*/)
    pivot_on: host
    window: 4h
