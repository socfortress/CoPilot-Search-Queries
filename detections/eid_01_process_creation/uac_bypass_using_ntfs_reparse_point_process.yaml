name: UAC Bypass Using NTFS Reparse Point - Process
id: 39ed3c80-e6a1-431b-9df3-911ac53d08a7
version: 1
schema_version: "1.0"
date: "2024-12-01"
author: Christian Burkard (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 39ed3c80-e6a1-431b-9df3-911ac53d08a7
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the pattern of UAC Bypass using NTFS reparse point and wusa.exe DLL
  hijacking (UACMe 36). MITRE ATT&CK: T1548.002.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "\"C:\\\\Windows\\\\system32\\\\wusa.exe\"  /quiet C:\\\\Users\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*\\\\AppData\\\\Local\\\\Temp\\\\update.msu"
                          case_insensitive: true
                    - bool:
                        should:
                          - term:
                              data_win_eventdata_integrityLevel:
                                value: "High"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_integrityLevel:
                                value: "System"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_integrityLevel:
                                value: "S-1-16-16384"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_integrityLevel:
                                value: "S-1-16-12288"
                                case_insensitive: true
                        minimum_should_match: 1
              - bool:
                  must:
                    - term:
                        data_win_eventdata_parentCommandLine:
                          value: "\"C:\\Windows\\system32\\dism.exe\" /online /quiet /norestart /add-package /packagepath:\"C:\\Windows\\system32\\pe386\" /ignorecheck"
                          case_insensitive: true
                    - bool:
                        should:
                          - term:
                              data_win_eventdata_integrityLevel:
                                value: "High"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_integrityLevel:
                                value: "System"
                                case_insensitive: true
                        minimum_should_match: 1
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*C:\\\\Users\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*\\\\AppData\\\\Local\\\\Temp\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*\\\\dismhost.exe {*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\DismHost.exe"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_integrityLevel
    - data_win_eventdata_parentCommandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '"C:\Windows\system32\wusa.exe" /quiet C:\Users\*';
  data_win_eventdata_commandLine matches '*\AppData\Local\Temp\update.msu';
  data_win_eventdata_integrityLevel equals 'High', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/hfiref0x/UACME
  - https://attack.mitre.org/techniques/T1548/002/

response:
  message: >
    UAC Bypass Using NTFS Reparse Point - Process detected on host $agent_name$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
    Matched data_win_eventdata_integrityLevel:
    $data_win_eventdata_integrityLevel$. MITRE ATT&CK: T1548.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_integrityLevel
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1548.002
  custom_tags:
    - bypass
    - reparse
    - point
    - process_creation
    - sysmon
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND ((data_win_eventdata_commandLine:/\"[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ww][Uu][Ss][Aa]\.[Ee][Xx][Ee]\"  \/[Qq][Uu][Ii][Ee][Tt] [Cc]:\\[Uu][Ss][Ee][Rr][Ss]\\.*/ AND data_win_eventdata_commandLine:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\[Uu][Pp][Dd][Aa][Tt][Ee]\.[Mm][Ss][Uu]/ AND (data_win_eventdata_integrityLevel:/[Hh][Ii][Gg][Hh]/ OR data_win_eventdata_integrityLevel:/[Ss][Yy][Ss][Tt][Ee][Mm]/ OR data_win_eventdata_integrityLevel:/[Ss]-1-16-16384/ OR data_win_eventdata_integrityLevel:/[Ss]-1-16-12288/)) OR (data_win_eventdata_parentCommandLine:/\"[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Dd][Ii][Ss][Mm]\.[Ee][Xx][Ee]\" \/[Oo][Nn][Ll][Ii][Nn][Ee] \/[Qq][Uu][Ii][Ee][Tt] \/[Nn][Oo][Rr][Ee][Ss][Tt][Aa][Rr][Tt] \/[Aa][Dd][Dd]-[Pp][Aa][Cc][Kk][Aa][Gg][Ee] \/[Pp][Aa][Cc][Kk][Aa][Gg][Ee][Pp][Aa][Tt][Hh]:\"[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Pp][Ee]386\" \/[Ii][Gg][Nn][Oo][Rr][Ee][Cc][Hh][Ee][Cc][Kk]/ AND (data_win_eventdata_integrityLevel:/[Hh][Ii][Gg][Hh]/ OR data_win_eventdata_integrityLevel:/[Ss][Yy][Ss][Tt][Ee][Mm]/) AND data_win_eventdata_commandLine:/.*[Cc]:\\[Uu][Ss][Ee][Rr][Ss]\\.*/ AND data_win_eventdata_commandLine:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\.*/ AND data_win_eventdata_commandLine:/.*\\[Dd][Ii][Ss][Mm][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee] \{.*/ AND data_win_eventdata_image:/.*\\[Dd][Ii][Ss][Mm][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c74c0390-3e20-41fd-a69a-128f0275a5ea
    name: Cab File Extraction Via Wusa.EXE From Potentially Suspicious Paths
    reason: 'Same wusa.exe abuse from the staging side: msu/cab extraction from a user-writable path just before the elevated wusa/dism step.'
  - id: ef64fc9c-a45e-43cc-8fd8-7d75d73b4c99
    name: Wusa.EXE Executed By Parent Process Located In Suspicious Location
    reason: The unprivileged dropper that launches wusa.exe (UACMe 36 precursor) usually runs from a user-writable folder.
  - id: 853e74f9-9392-4935-ad3b-2e8c040dae86
    name: UAC Bypass Using DismHost
    reason: Matches the DismHost-from-Temp half of the same dism DLL-hijack; often fires together.
  - id: d38d2fa4-98e6-4a24-aff1-410b0c9ad177
    name: HackTool - UACMe Akagi Execution
    reason: UACMe method 36 ships in Akagi, the likely launcher of the wusa chain.
  - id: 178e615d-e666-498b-9630-9ed363038101
    name: Elevated System Shell Spawned From Uncommon Parent Location
    reason: 'Follow-on: the hijacked DLL yields an elevated/SYSTEM shell.'
  - id: 17769c90-230e-488b-a463-e05c08e9d48f
    name: Powershell Defender Exclusion
    reason: 'Typical first action with fresh admin rights: exclude the payload folder from Defender.'
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: wusa.exe or dism.exe launched with quiet/package switches
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*\\[Ww][Uu][Ss][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Dd][Ii][Ss][Mm]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Dd][Ii][Ss][Mm][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:(/.*\/[Qq]uiet.*/ OR /.*[Aa]dd-[Pp]ackage.*/ OR /.*\.[Mm][Ss][Uu].*/)
    pivot_on: host
    window: 2h
  - name: Elevated shell spawned by wusa/dism/DismHost
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:(/.*\\[Ww][Uu][Ss][Aa]\.[Ee][Xx][Ee]/ OR /.*\\[Dd][Ii][Ss][Mm]\.[Ee][Xx][Ee]/ OR /.*\\[Dd][Ii][Ss][Mm][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/) AND data_win_eventdata_image:(/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR /.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR /.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/) AND data_win_eventdata_integrityLevel:(High OR System)
    pivot_on: host
    window: 2h
  - name: DLL or MSU dropped into Temp
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\\[Tt]emp\\.*\.([Dd][Ll][Ll]|[Mm][Ss][Uu]|[Cc][Aa][Bb])/
    pivot_on: host
    window: 2h
  - name: Defender exclusion or tamper commands
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Aa]dd-[Mm]p[Pp]reference.*[Ee]xclusion.*/ OR /.*[Ss]et-[Mm]p[Pp]reference.*([Dd]isable|[Ee]xclusion).*/ OR /.*[Dd]efender\\[Ee]xclusions.*/)
    pivot_on: host
    window: 4h
  - name: Persistence creation after elevation
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ss][Cc]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:(/.*[Cc]reate.*/ OR /.*[Ss]tart=.*/)
    pivot_on: host
    window: 6h
