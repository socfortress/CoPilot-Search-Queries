name: TrustedPath UAC Bypass Pattern
id: 4ac47ed3-44c2-4b1f-9d51-bf46e8914126
version: 1
schema_version: "1.0"
date: "2025-06-17"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 4ac47ed3-44c2-4b1f-9d51-bf46e8914126
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects indicators of a UAC bypass method by mocking directories. MITRE
  ATT&CK: T1548.002.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*C:\\\\Windows \\\\System32\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*C:\\\\Windows \\\\SysWOW64\\\\*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches '*C:\Windows
  \System32\*'; data_win_eventdata_image matches '*C:\Windows \SysWOW64\*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://medium.com/tenable-techblog/uac-bypass-by-mocking-trusted-directories-24a96675f6e
  - https://www.wietzebeukema.nl/blog/hijacking-dlls-in-windows
  - https://github.com/netero1010/TrustedPath-UACBypass-BOF
  - https://x.com/Wietze/status/1933495426952421843
  - https://attack.mitre.org/techniques/T1548/002/

response:
  message: >
    TrustedPath UAC Bypass Pattern detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1548.002
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1548.002
  custom_tags:
    - trustedpath
    - bypass
    - pattern
    - process_creation
    - sysmon
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] \\[Ss][Yy][Ss][Tt][Ee][Mm]32\\.*/ OR data_win_eventdata_image:/.*[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] \\[Ss][Yy][Ss][Ww][Oo][Ww]64\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d38d2fa4-98e6-4a24-aff1-410b0c9ad177
    name: HackTool - UACMe Akagi Execution
    reason: The mock-directory trick is a UACMe method; Akagi execution is the tool that commonly drives it.
  - id: 178e615d-e666-498b-9630-9ed363038101
    name: Elevated System Shell Spawned From Uncommon Parent Location
    reason: A successful bypass yields an elevated shell spawned from an unusual parent path.
  - id: 1ca6bd18-0ba0-44ca-851c-92ed89a61085
    name: UAC Bypass Using Consent and Comctl32 - Process
    reason: Sibling DLL-hijack UAC bypass in the same family; attackers try several UACMe methods in sequence.
  - id: 7a01183d-71a2-46ad-ad5c-acd989ac1793
    name: UAC Bypass Abusing Winsat Path Parsing - Process
    reason: Another path-trickery UAC bypass (UACMe 52) often tried alongside the trailing-space directory method.
  - id: 89ca78fd-b37c-4310-b3d3-81a023f83936
    name: Schtasks Creation Or Modification With SYSTEM Privileges
    reason: Once elevated, attackers commonly persist via SYSTEM scheduled tasks.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Processes from fake trailing-space Windows directory
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*[Ww]indows [\\\/].*/ OR data_win_eventdata_parentImage:/.*[Ww]indows [\\\/].*/)
    pivot_on: host
    window: 2h
  - name: File drops into a trailing-space Windows directory
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*[Ww]indows [\\\/].*/
    pivot_on: host
    window: 2h
  - name: High-integrity processes from user-writable paths
    query: data_win_system_eventID:1 AND data_win_eventdata_integrityLevel:(High OR System) AND data_win_eventdata_parentImage:(/.*[Tt]emp.*/ OR /.*[Aa]pp[Dd]ata.*/ OR /.*[Pp]ublic.*/)
    pivot_on: host
    window: 2h
  - name: Defender tampering after elevation
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ss]et-[Mm]p[Pp]reference.*/ OR /.*[Aa]dd-[Mm]p[Pp]reference.*/ OR /.*DisableRealtimeMonitoring.*/)
    pivot_on: host
    window: 2h
