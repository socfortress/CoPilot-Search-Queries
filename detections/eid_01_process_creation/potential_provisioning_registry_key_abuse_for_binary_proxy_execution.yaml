name: Potential Provisioning Registry Key Abuse For Binary Proxy Execution
id: 2a4b3e61-9d22-4e4a-b60f-6e8f0cde6f25
version: 1
schema_version: "1.0"
date: "2023-08-08"
author: Nasreddine Bencherchali (Nextron Systems), Swachchhanda Shrawan Poudel
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 2a4b3e61-9d22-4e4a-b60f-6e8f0cde6f25
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential abuse of the provisioning registry key for indirect command
  execution through "Provlaunch.exe". MITRE ATT&CK: T1218.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*SOFTWARE\\\\Microsoft\\\\Provisioning\\\\Commands\\\\*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*SOFTWARE\Microsoft\Provisioning\Commands\*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://lolbas-project.github.io/lolbas/Binaries/Provlaunch/
  - https://twitter.com/0gtweet/status/1674399582162153472
  - https://attack.mitre.org/techniques/T1218/

response:
  message: >
    Potential Provisioning Registry Key Abuse For Binary Proxy Execution
    detected on host $agent_name$. Matched data_win_eventdata_commandLine:
    $data_win_eventdata_commandLine$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1218
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218
  custom_tags:
    - provisioning
    - registry
    - abuse
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Pp][Rr][Oo][Vv][Ii][Ss][Ii][Oo][Nn][Ii][Nn][Gg]\\[Cc][Oo][Mm][Mm][Aa][Nn][Dd][Ss]\\.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7021255e-5db3-4946-a8b9-0ba7a4644a69
    name: Potential Provisioning Registry Key Abuse For Binary Proxy Execution - REG
    reason: 'Registry-write view of the same key: the step that sets the command Provlaunch runs'
  - id: 7f5d1c9a-3e83-48df-95a7-2b98aae6c13c
    name: Potential Provlaunch.EXE Binary Proxy Execution Abuse
    reason: Provlaunch.exe spawning children is the execution result of this key abuse
  - id: f9999590-1f94-4a34-a91e-951e47bedefd
    name: Suspicious Provlaunch.EXE Child Process
    reason: Payload child process launched by provlaunch after the key was set
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Provisioning registry writes
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*Provisioning.*Commands.*/
    pivot_on: host
    window: 2h
  - name: Provlaunch execution
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*[Pp]rov[Ll]aunch\.exe/ OR data_win_eventdata_parentImage:/.*[Pp]rov[Ll]aunch\.exe/)
    pivot_on: host
    window: 2h
  - name: Registry edit tools touching provisioning
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*([Rr]eg(\.exe)? +add|[Ss]et-[Ii]tem[Pp]roperty|New-ItemProperty).*Provisioning.*/
    pivot_on: host
    window: 2h
  - name: LOLBin proxy execution neighbours
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*[Mm]shta\.exe/ OR data_win_eventdata_image:/.*[Rr]egsvr32\.exe/ OR data_win_eventdata_image:/.*[Rr]undll32\.exe/ OR data_win_eventdata_image:/.*[Pp]ower[Ss]hell\.exe/)
    pivot_on: host
    window: 1h
