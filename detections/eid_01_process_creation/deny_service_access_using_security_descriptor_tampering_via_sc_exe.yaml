name: Deny Service Access Using Security Descriptor Tampering Via Sc.EXE
id: 99cf1e02-00fb-4c0d-8375-563f978dfd37
version: 1
schema_version: "1.0"
date: "2023-02-28"
author: Jonhnathan Ribeiro, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 99cf1e02-00fb-4c0d-8375-563f978dfd37
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious DACL modifications to deny access to a service that affects
  critical trustees. This can be used to hide services or make them unstoppable.
  MITRE ATT&CK: T1543.003.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\sc.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "sc.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*sdset*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*D;*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*;IU*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*;SU*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*;BA*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*;SY*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*;WD*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches '*\sc.exe';
  data_win_eventdata_originalFileName equals 'sc.exe';
  data_win_eventdata_commandLine matches '*sdset*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.sans.org/blog/red-team-tactics-hiding-windows-services/
  - https://itconnect.uw.edu/tools-services-support/it-systems-infrastructure/msinf/other-help/understanding-sddl-syntax/
  - https://learn.microsoft.com/en-us/windows/win32/secauthz/sid-strings
  - https://attack.mitre.org/techniques/T1543/003/

response:
  message: >
    Deny Service Access Using Security Descriptor Tampering Via Sc.EXE detected
    on host $agent_name$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1543.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1543.003
  custom_tags:
    - service
    - security
    - descriptor
    - process_creation
    - sysmon
    - privilege_escalation
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ss][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ss][Cc]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Ss][Dd][Ss][Ee][Tt].*/ AND data_win_eventdata_commandLine:/.*[Dd];.*/ AND (data_win_eventdata_commandLine:/.*;[Ii][Uu].*/ OR data_win_eventdata_commandLine:/.*;[Ss][Uu].*/ OR data_win_eventdata_commandLine:/.*;[Bb][Aa].*/ OR data_win_eventdata_commandLine:/.*;[Ss][Yy].*/ OR data_win_eventdata_commandLine:/.*;[Ww][Dd].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a537cfc3-4297-4789-92b5-345bfd845ad0
    name: Service DACL Abuse To Hide Services Via Sc.EXE
    reason: Closely related sdset abuse to hide a service; same persistence/defense-evasion intent.
  - id: 514e4c3a-c77d-4cde-a00f-046425e2301e
    name: Abuse of Service Permissions to Hide Services Via Set-Service
    reason: PowerShell equivalent of hiding services via DACL.
  - id: 6c8fbee5-dee8-49bc-851d-c3142d02aa47
    name: Allow Service Access Using Security Descriptor Tampering Via Sc.EXE
    reason: Allow-side sdset counterpart used to grant access to an attacker service.
  - id: 431a1fdb-4799-4f3b-91c3-a683b003fc49
    name: New Kernel Driver Via SC.EXE
    reason: A new service/driver is often installed just before it is hidden.
  - id: 38879043-7e1e-47a9-8d46-6bec88e201df
    name: Potential Persistence Attempt Via Existing Service Tampering
    reason: Service tampering used for persistence in the same chain.
  - id: 5e95028c-5229-4214-afae-d653d573d0ec
    name: Security Service Disabled Via Reg.EXE
    reason: Denying access to a security service pairs with disabling it.
  - id: 8470d755-0c13-45b3-bd63-387a373c10cf
    name: Reg exe Manipulating Windows Services Registry Keys
    reason: Registry route to the same service tampering.
  - id: fdfcbd78-48f1-4a4b-90ac-d82241e368c5
    name: PsExec Service Execution
    reason: Remote service creation commonly precedes locking the service down.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Service creation and config via sc
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Ss]c\.exe/ AND data_win_eventdata_commandLine:/.*(create|config|sdset|start|failure).*/
    pivot_on: host
    window: 24h
  - name: Service registry changes via reg
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Rr]eg\.exe/ AND data_win_eventdata_commandLine:/.*CurrentControlSet\\[Ss]ervices.*/
    pivot_on: host
    window: 6h
  - name: PowerShell service manipulation
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*([Nn]ew-[Ss]ervice|[Ss]et-[Ss]ervice|[Ss]et-[Ss]ecurity[Dd]escriptor|[Ss]d[Ss]et).*/
    pivot_on: host
    window: 6h
  - name: Service installation events
    query: data_win_system_eventID:7045
    pivot_on: host
    window: 6h
  - name: Remote execution tools
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*([Pp]s[Ee]xec|[Ww]mic.*\/node|[Ss]chtasks.*\/s ).*/
    pivot_on: host
    window: 6h
