name: Private Keys Reconnaissance Via CommandLine Tools
id: 213d6a77-3d55-4ce8-ba74-fcfef741974e
version: 1
schema_version: "1.0"
date: "2023-03-06"
author: frack113, Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 213d6a77-3d55-4ce8-ba74-fcfef741974e
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Adversaries may search for private key certificate files on compromised
  systems for insecurely stored credential. MITRE ATT&CK: T1552.004.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.key*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.pgp*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.gpg*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.ppk*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.p12*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.pem*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.pfx*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.cer*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.p7b*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.asc*"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\cmd.exe"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_originalFileName:
                                value: "Cmd.Exe"
                                case_insensitive: true
                        minimum_should_match: 1
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*dir *"
                          case_insensitive: true
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\powershell.exe"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\pwsh.exe"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_originalFileName:
                                value: "PowerShell.EXE"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_originalFileName:
                                value: "pwsh.dll"
                                case_insensitive: true
                        minimum_should_match: 1
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*Get-ChildItem *"
                          case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\findstr.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "FINDSTR.EXE"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*.key*'; data_win_eventdata_commandLine matches '*.pgp*';
  data_win_eventdata_commandLine matches '*.gpg*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1552.004/T1552.004.md
  - https://attack.mitre.org/techniques/T1552/004/

response:
  message: >
    Private Keys Reconnaissance Via CommandLine Tools detected on host
    $agent_name$. Matched data_win_eventdata_commandLine:
    $data_win_eventdata_commandLine$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1552.004
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1552.004
  custom_tags:
    - private
    - reconnaissance
    - tools
    - process_creation
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*\.[Kk][Ee][Yy].*/ OR data_win_eventdata_commandLine:/.*\.[Pp][Gg][Pp].*/ OR data_win_eventdata_commandLine:/.*\.[Gg][Pp][Gg].*/ OR data_win_eventdata_commandLine:/.*\.[Pp][Pp][Kk].*/ OR data_win_eventdata_commandLine:/.*\.[Pp]12.*/ OR data_win_eventdata_commandLine:/.*\.[Pp][Ee][Mm].*/ OR data_win_eventdata_commandLine:/.*\.[Pp][Ff][Xx].*/ OR data_win_eventdata_commandLine:/.*\.[Cc][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*\.[Pp]7[Bb].*/ OR data_win_eventdata_commandLine:/.*\.[Aa][Ss][Cc].*/) AND (((data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Cc][Mm][Dd]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Dd][Ii][Rr] .*/) OR ((data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Pp][Ww][Ss][Hh]\.[Dd][Ll][Ll]/) AND data_win_eventdata_commandLine:/.*[Gg][Ee][Tt]-[Cc][Hh][Ii][Ll][Dd][Ii][Tt][Ee][Mm] .*/) OR data_win_eventdata_image:/.*\\[Ff][Ii][Nn][Dd][Ss][Tt][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ff][Ii][Nn][Dd][Ss][Tt][Rr]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7b30e0a7-c675-4b24-8a46-82fa67e2433d
    name: Conti Volume Shadow Listing
    reason: Credential-hunting operators commonly pair key/cert file searches with shadow copy and secret-store enumeration on the same host.
  - id: e0b0c2ab-3d52-46d9-8cb7-049dc775fbd1
    name: Enumeration for Credentials in Registry
    reason: 'Parallel credential-hunting step: registry query for stored passwords/keys alongside file-based key hunting.'
  - id: 3ffd6f51-e6c1-47b7-94b4-c1e61d4117c5
    name: Certificate Exported Via Certutil.EXE
    reason: 'Follow-on: once key/cert files are located, certutil is used to export or encode them for theft.'
  - id: 9e716b33-63b2-46da-86a4-bd3c3b9b5dfb
    name: Certificate Exported Via PowerShell
    reason: Alternative export of private key material from the cert store after reconnaissance.
  - id: e7be6119-fc37-43f0-ad4f-1f3f99be2f9f
    name: Copying Sensitive Files with Credential Data
    reason: Next step is copying discovered credential files to a staging location.
  - id: fd877b94-9bb5-4191-bb25-d79cbd93c167
    name: Dumping of Sensitive Hives Via Reg.EXE
    reason: 'Same credential-access hunting phase: SAM/SECURITY/SYSTEM hive dumps on the same host.'
  - id: ccb5742c-c248-4982-8c5c-5571b9275ad3
    name: Recon Command Output Piped To Findstr.EXE
    reason: Hands-on-keyboard discovery is typically intermixed with key searches via dir/findstr.
  - id: 9fbf5927-5261-4284-a71d-f681029ea574
    name: Compress Data and Lock With Password for Exfiltration With 7-ZIP
    reason: Located keys are often archived with a password before exfiltration.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Key file search via dir/findstr/where
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*(dir|findstr|where|Get-ChildItem|gci).*(\.pem|\.pfx|\.ppk|\.key|\.p12|id_rsa).*/)
    pivot_on: host
    window: 4h
  - name: Copy or archive of key material
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*(copy|xcopy|robocopy|Compress-Archive|7z|rar|tar).*(\.pem|\.pfx|\.ppk|\.p12|id_rsa|\.key).*/)
    pivot_on: host
    window: 4h
  - name: Certificate export / encode tooling
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*(certutil|Export-PfxCertificate|Export-Certificate|certmgr).*(-exportpfx|-encode|Export-Pfx|-p12|\.pfx).*/)
    pivot_on: host
    window: 4h
  - name: Outbound transfer tools after hunting
    query: data_win_system_eventID:1 AND data_win_eventdata_image:(/.*\\(curl|scp|sftp|ftp|rclone|bitsadmin)\.exe/)
    pivot_on: host
    window: 6h
  - name: Same user other credential-access commands
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*(cmdkey \/list|vaultcmd|reg query.*(password|putty)|mimikatz|lsass).*/)
    pivot_on: user
    window: 6h
