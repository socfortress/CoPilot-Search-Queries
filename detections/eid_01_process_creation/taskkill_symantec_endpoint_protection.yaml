name: Taskkill Symantec Endpoint Protection
id: 4a6713f6-3331-11ed-a261-0242ac120002
version: 1
schema_version: "1.0"
date: "2022-09-13"
author: Ilya Krestinichev, Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 4a6713f6-3331-11ed-a261-0242ac120002
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects one of the possible scenarios for disabling Symantec Endpoint
  Protection. Symantec Endpoint Protection antivirus software services
  incorrectly implement the protected service mechanism. As a result, the NT
  AUTHORITY/SYSTEM user can execute the taskkill /im command several times
  ccSvcHst.exe /f, thereby killing the process belonging to the service, and
  thus shutting down the service. MITRE ATT&CK: T1685.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*taskkill*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* /F *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* /IM *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*ccSvcHst.exe*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*taskkill*'; data_win_eventdata_commandLine matches '* /F *';
  data_win_eventdata_commandLine matches '* /IM *', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.exploit-db.com/exploits/37525
  - https://community.spiceworks.com/topic/2195015-batch-script-to-uninstall-symantec-endpoint-protection
  - https://community.broadcom.com/symantecenterprise/communities/community-home/digestviewer/viewthread?MessageKey=6ce94b67-74e1-4333-b16f-000b7fd874f0&CommunityKey=1ecf5f55-9545-44d6-b0f4-4e4a7f5f5e68&tab=digestviewer
  - https://attack.mitre.org/techniques/T1685/

response:
  message: >
    Taskkill Symantec Endpoint Protection detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1685
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685
  custom_tags:
    - taskkill
    - symantec
    - endpoint
    - process_creation
    - sysmon
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Tt][Aa][Ss][Kk][Kk][Ii][Ll][Ll].*/ AND data_win_eventdata_commandLine:/.* \/[Ff] .*/ AND data_win_eventdata_commandLine:/.* \/[Ii][Mm] .*/ AND data_win_eventdata_commandLine:/.*[Cc][Cc][Ss][Vv][Cc][Hh][Ss][Tt]\.[Ee][Xx][Ee].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 5ffaa42c-acdb-11eb-9ad3-acde48001122
    name: Process Kill Base On File Path
    reason: Generic process killing used to take down security tooling.
  - id: a7ee1722-c3c5-aeff-3212-c777e4733217
    name: Disable Windows Defender AV Security Monitoring
    reason: Same defence-evasion intent aimed at Defender; actors hit every AV present.
  - id: 07e3cb2c-0608-410d-be4b-1511cb1a0448
    name: Tamper Windows Defender Remove-MpPreference
    reason: Parallel AV weakening on the host.
  - id: 17769c90-230e-488b-a463-e05c08e9d48f
    name: Powershell Defender Exclusion
    reason: Exclusion setting alongside killing the other AV.
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: Ransomware kills AV then deletes backups.
  - id: c9fbe8e9-119d-40a6-9b59-dd58a5d84429
    name: Potential Ransomware or Unauthorized MBR Tampering Via Bcdedit.EXE
    reason: Recovery disabling follows AV kill in ransomware chains.
  - id: 847d5ff3-8a31-4737-a970-aeae8fe21765
    name: Potential Tampering With Security Products Via WMIC
    reason: Alternate method for uninstalling/disabling security products.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Taskkill and service stop against security products
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Tt]askkill.*/ OR data_win_eventdata_commandLine:/.*(net|sc)(\.exe)? +stop.*/) AND data_win_eventdata_commandLine:/.*([Ss]ymantec|[Cc]c[Ss]vc|[Mm]cafee|[Ss]ophos|[Cc]rowd[Ss]trike|[Dd]efender|[Ss]ense|[Cc]arbon).*/
    pivot_on: host
    window: 2h
  - name: SYSTEM-context shells and utilities
    query: data_win_system_eventID:"1" AND data_win_eventdata_user:/.*(AUTHORITY|AUTORIT).*SYSTEM/ AND data_win_eventdata_image:/.*\\(cmd|powershell|taskkill|sc|net)\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Backup and recovery destruction
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Vv]ssadmin.*[Dd]elete.*/ OR data_win_eventdata_commandLine:/.*[Ww]badmin.*[Dd]elete.*/ OR data_win_eventdata_commandLine:/.*[Bb]cdedit.*(ignoreallfailures|recoveryenabled).*/)
    pivot_on: host
    window: 4h
  - name: Service disable or delete via sc
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*sc.*config.*start= *disabled.*/ OR data_win_eventdata_commandLine:/.*sc.*delete.*/)
    pivot_on: host
    window: 2h
  - name: Shell parents of taskkill
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\(cmd|powershell|wscript|PSEXESVC)\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Tt]askkill.*/
    pivot_on: host
    window: 1h
