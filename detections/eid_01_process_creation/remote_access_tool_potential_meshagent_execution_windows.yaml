name: Remote Access Tool - Potential MeshAgent Execution - Windows
id: 2fbbe9ff-0afc-470b-bdc0-592198339968
version: 1
schema_version: "1.0"
date: "2025-05-19"
author: Norbert Jaśniewicz (AlphaSOC)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 2fbbe9ff-0afc-470b-bdc0-592198339968
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential execution of MeshAgent which is a tool used for remote
  access. Historical data shows that threat actors rename MeshAgent binary to
  evade detection. Matching command lines with the '--meshServiceName' argument
  can indicate that the MeshAgent is being used for remote access. MITRE ATT&CK:
  T1219.002.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*--meshServiceName*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*--meshServiceName*'.

known_false_positives: >
  Environments that legitimately use MeshAgent. Baseline expected activity in
  your environment and tune this detection before relying on it for automated
  response.

references:
  - https://www.huntress.com/blog/know-thy-enemy-a-novel-november-case-on-persistent-remote-access
  - https://thecyberexpress.com/ukraine-hit-by-meshagent-malware-campaign/
  - https://wazuh.com/blog/how-to-detect-meshagent-with-wazuh/
  - https://www.security.com/threat-intelligence/medusa-ransomware-attacks
  - https://attack.mitre.org/techniques/T1219/002/

response:
  message: >
    Remote Access Tool - Potential MeshAgent Execution - Windows detected on
    host $agent_name$. Matched data_win_eventdata_commandLine:
    $data_win_eventdata_commandLine$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1219.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1219.002
  custom_tags:
    - meshagent
    - process_creation
    - sysmon
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*--[Mm][Ee][Ss][Hh][Ss][Ee][Rr][Vv][Ii][Cc][Ee][Nn][Aa][Mm][Ee].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b471f462-eb0d-4832-be35-28d94bdb4780
    name: Remote Access Tool - Renamed MeshAgent Execution - Windows
    reason: Same --meshServiceName agent; fires when the binary was renamed, indicating evasion.
  - id: 74a2b202-73e0-4693-9a3a-9d36146d0775
    name: Remote Access Tool - MeshAgent Command Execution via MeshCentral
    reason: 'Direct follow-on: operator commands run through the MeshCentral console on this agent.'
  - id: de587dce-915e-4218-aac4-835ca6af6f70
    name: Potential Persistence Attempt Via Run Keys Using Reg.EXE
    reason: Extra Run-key persistence beyond the agent's own service points to attacker intent.
  - id: 6860a62c-9203-11eb-9e05-acde48001122
    name: Disabling Firewall with Netsh
    reason: Operators loosen the firewall so the agent's WebSocket channel is not blocked.
  - id: d059842b-6b9d-4ed1-b5c3-5b89143c6ede
    name: File Download Via Bitsadmin
    reason: The agent installer is often pulled down with bitsadmin before execution.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Mesh agent installer download
    query: (data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ss][Tt][Aa][Rr][Tt]-[Bb][Ii][Tt][Ss][Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr].*/)) OR data_win_eventdata_image:/.*\\([Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]|[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]|[Ww][Gg][Ee][Tt]\.[Ee][Xx][Ee])/))
    pivot_on: host
    window: 2h
  - name: MeshAgent binary or config written to disk
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*([Mm][Ee][Ss][Hh][Aa][Gg][Ee][Nn][Tt]|[Mm][Ee][Ss][Hh][Cc][Ee][Nn][Tt][Rr][Aa][Ll]).*/
    pivot_on: host
    window: 2h
  - name: Service/task/Run-key persistence
    query: (data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\([Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*/[Cc][Rr][Ee][Aa][Tt][Ee].*/)) OR (data_win_eventdata_image:/.*\\([Ss][Cc]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee].*/)) OR (data_win_eventdata_image:/.*\\([Rr][Ee][Gg]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/))))
    pivot_on: host
    window: 6h
  - name: Shells and tooling spawned by the agent
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Mm][Ee][Ss][Hh][Aa][Gg][Ee][Nn][Tt].*/
    pivot_on: host
    window: 6h
  - name: Exfil or tunneling tools after remote access
    query: ((data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Rr][Cc][Ll][Oo][Nn][Ee]\.[Ee][Xx][Ee]|[Ww][Ii][Nn][Ss][Cc][Pp]\.[Ee][Xx][Ee]|[Pp][Ss][Cc][Pp]\.[Ee][Xx][Ee]|[Mm][Ee][Gg][Aa][Cc][Mm][Dd]\.[Ee][Xx][Ee])/ OR (data_win_eventdata_image:/.*\\(7[Zz]\.[Ee][Xx][Ee]|7[Zz][Aa]\.[Ee][Xx][Ee]|[Rr][Aa][Rr]\.[Ee][Xx][Ee]|[Ww][Ii][Nn][Rr][Aa][Rr]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.* [Aa] .*/ OR data_win_eventdata_commandLine:/.*-[Hh][Pp].*/)))) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Nn][Gg][Rr][Oo][Kk]\.[Ee][Xx][Ee]|[Pp][Ll][Ii][Nn][Kk]\.[Ee][Xx][Ee]|[Cc][Ll][Oo][Uu][Dd][Ff][Ll][Aa][Rr][Ee][Dd]\.[Ee][Xx][Ee]|[Cc][Hh][Ii][Ss][Ee][Ll]\.[Ee][Xx][Ee]|[Ff][Rr][Pp][Cc]\.[Ee][Xx][Ee])/))
    pivot_on: host
    window: 24h
