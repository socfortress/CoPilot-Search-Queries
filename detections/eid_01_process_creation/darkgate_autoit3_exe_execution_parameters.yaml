name: DarkGate - Autoit3.EXE Execution Parameters
id: f8e9aa1c-14f2-4dbd-aa59-b98968ed650d
version: 1
schema_version: "1.0"
date: "2023-10-15"
author: Micah Babinski
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: f8e9aa1c-14f2-4dbd-aa59-b98968ed650d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of the legitimate Autoit3 utility from a suspicious parent
  process. AutoIt3.exe is used within the DarkGate infection chain to execute
  shellcode that performs process injection and connects to the DarkGate
  command-and-control server. MITRE ATT&CK: T1059.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\Autoit3.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "AutoIt3.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\cmd.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\KeyScramblerLogon.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\msiexec.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*:\\\\Program Files (x86)\\\\AutoIt3\\\\AutoIt3.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*:\\\\Program Files\\\\AutoIt3\\\\AutoIt3.exe"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_parentImage
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\Autoit3.exe'; data_win_eventdata_originalFileName equals 'AutoIt3.exe';
  data_win_eventdata_parentImage matches '*\cmd.exe', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.security.telekom.com/2023/08/darkgate-loader.html
  - https://www.kroll.com/en/insights/publications/cyber/microsoft-teams-used-as-initial-access-for-darkgate-malware
  - https://github.com/pr0xylife/DarkGate/tree/main
  - https://attack.mitre.org/techniques/T1059/

response:
  message: >
    DarkGate - Autoit3.EXE Execution Parameters detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1059
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059
  custom_tags:
    - darkgate
    - autoit3
    - parameters
    - process_creation
    - sysmon
    - execution
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Aa][Uu][Tt][Oo][Ii][Tt]3\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Aa][Uu][Tt][Oo][Ii][Tt]3\.[Ee][Xx][Ee]/) AND (data_win_eventdata_parentImage:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Kk][Ee][Yy][Ss][Cc][Rr][Aa][Mm][Bb][Ll][Ee][Rr][Ll][Oo][Gg][Oo][Nn]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Mm][Ss][Ii][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]/) AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Aa][Uu][Tt][Oo][Ii][Tt]3\\[Aa][Uu][Tt][Oo][Ii][Tt]3\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Aa][Uu][Tt][Oo][Ii][Tt]3\\[Aa][Uu][Tt][Oo][Ii][Tt]3\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: windows-autoit3-execution-001
    name: Windows AutoIt3 Execution
    reason: Same binary; confirms AutoIt3 ran on the host and from where, broadening the DarkGate loader execution evidence.
  - id: f4264e47-f522-4c38-a420-04525d5b880f
    name: Renamed AutoIt Execution
    reason: DarkGate often renames AutoIt3.exe; originalFileName match catches the same loader under another image name.
  - id: 1a433e1d-03d2-47a6-8063-ece992cf4e73
    name: DarkGate - Autoit3.EXE File Creation By Uncommon Process
    reason: 'Precursor: msiexec/cmd dropping Autoit3.exe to disk immediately before it is launched.'
  - id: df49c691-8026-48dd-94d3-4ba6a79102a8
    name: DarkGate - Drop DarkGate Loader In C:\Temp Directory
    reason: 'Precursor: DarkGate loader/script payload staged in C:\Temp, executed by the AutoIt interpreter.'
  - id: bf906d7b-7070-4642-8383-e404cf26eba5
    name: DarkGate - User Created Via Net.EXE
    reason: 'Known follow-on in the DarkGate chain: a local account named DarkGate is created for persistence/RDP.'
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Files written by AutoIt or script payloads in staging dirs
    query: data_win_system_eventID:11 AND (data_win_eventdata_targetFilename:/.*[Aa]utoit3.*/ OR data_win_eventdata_targetFilename:/.*[Cc]:\\[Tt]emp\\.*/ OR data_win_eventdata_targetFilename:/.*\.au3/)
    pivot_on: host
    window: 6h
  - name: Children spawned by AutoIt3
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Aa]utoit3\.exe/
    pivot_on: host
    window: 2h
  - name: Network connections from AutoIt3 (C2)
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*[Aa]utoit3\.exe/
    pivot_on: host
    window: 4h
  - name: Remote thread / process injection by AutoIt3
    query: data_win_system_eventID:8 AND data_win_eventdata_sourceImage:/.*[Aa]utoit3\.exe/
    pivot_on: host
    window: 2h
  - name: Run key or scheduled-task persistence after loader
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*[Ss]chtasks\.exe/ OR data_win_eventdata_commandLine:/.*CurrentVersion\\[Rr]un.*/)
    pivot_on: host
    window: 6h
