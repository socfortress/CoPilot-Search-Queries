name: PsExec Service Execution
id: fdfcbd78-48f1-4a4b-90ac-d82241e368c5
version: 1
schema_version: "1.0"
date: "2023-02-28"
author: Thomas Patzke, Romaissa Adjailia, Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: fdfcbd78-48f1-4a4b-90ac-d82241e368c5
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects launch of the PSEXESVC service, which means that this system was the
  target of a psexec remote execution.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - term:
                  data_win_eventdata_image:
                    value: "C:\\Windows\\PSEXESVC.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "psexesvc.exe"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image equals
  'C:\Windows\PSEXESVC.exe'; data_win_eventdata_originalFileName equals
  'psexesvc.exe'.

known_false_positives: >
  Legitimate administrative tasks. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://learn.microsoft.com/en-us/sysinternals/downloads/psexec
  - https://www.youtube.com/watch?v=ro2QuZTIMBM

response:
  message: >
    PsExec Service Execution detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  custom_tags:
    - psexec
    - service
    - process_creation
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7c0dcd3d-acf8-4f71-9570-f448b0034f94
    name: PsExec Service Child Process Execution as LOCAL SYSTEM
    reason: 'Escalation of this event: the service spawned a SYSTEM child, i.e. commands actually ran.'
  - id: 51ae86a2-e2e1-4097-ad85-c46cb6851de4
    name: Renamed PsExec Service Execution
    reason: Same service executed under a renamed binary; covers evasion of the name match.
  - id: ea011323-7045-460b-b2d7-0f7442ea6b38
    name: Potential PsExec Remote Execution
    reason: Operator-side command line that triggered this service on the target.
  - id: 730fc21b-eaff-474b-ad23-90fd265d4988
    name: Psexec Execution
    reason: Origin host launching psexec.exe toward this target.
  - id: 27c3a83d-cada-47c6-9042-67baf19d2574
    name: Detect PsExec With accepteula Flag
    reason: Typical first-run flag on the originating host just before this service starts.
  - id: 683e6196-b8e8-11eb-9a79-acde48001122
    name: Detect Renamed PSExec
    reason: Renamed client on the origin that delivered this service.
  - id: 692f0bec-83ba-4d04-af7e-e884a96059b6
    name: Potential WMI Lateral Movement WmiPrvSE Spawned PowerShell
    reason: Alternate lateral-movement path used in the same intrusion phase.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: PSEXESVC service creation
    query: data_win_system_eventID:(7045 OR 4697) AND /.*[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc].*/
    pivot_on: host
    window: 2h
  - name: ADMIN$ share write and PSEXESVC file drop
    query: (data_win_system_eventID:5145 AND /.*[Aa][Dd][Mm][Ii][Nn]\$.*/) OR (data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc].*/)
    pivot_on: host
    window: 2h
  - name: Remote network logon
    query: data_win_system_eventID:4624 AND data_win_eventdata_logonType:3
    pivot_on: host
    window: 1h
  - name: Children of PSEXESVC
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]\.exe/
    pivot_on: host
    window: 4h
  - name: Named pipe activity of PsExec
    query: data_win_system_eventID:(17 OR 18) AND data_win_eventdata_pipeName:/.*[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc].*/
    pivot_on: host
    window: 2h
