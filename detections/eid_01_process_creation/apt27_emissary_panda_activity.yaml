name: APT27 - Emissary Panda Activity
id: 9aa01d62-7667-4d3b-acb8-8cb5103e2014
version: 1
schema_version: "1.0"
date: "2023-03-09"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 9aa01d62-7667-4d3b-acb8-8cb5103e2014
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of DLL side-loading malware used by threat group
  Emissary Panda aka APT27. MITRE ATT&CK: T1574.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_parentImage:
                          value: "*\\\\sllauncher.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\svchost.exe"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_parentImage:
                          value: "*\\\\AppData\\\\Roaming\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\svchost.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*-k*"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\sllauncher.exe'; data_win_eventdata_image matches '*\svchost.exe';
  data_win_eventdata_parentImage matches '*\AppData\Roaming\*', among other
  conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://app.any.run/tasks/579e7587-f09d-4aae-8b07-472833262965
  - https://twitter.com/cyb3rops/status/1168863899531132929
  - https://research.nccgroup.com/2018/05/18/emissary-panda-a-potential-new-malicious-tool/
  - https://attack.mitre.org/techniques/T1574/001/

response:
  message: >
    APT27 - Emissary Panda Activity detected on host $agent_name$. Matched
    data_win_eventdata_parentImage: $data_win_eventdata_parentImage$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1574.001
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.001
  custom_tags:
    - apt27
    - emissary
    - panda
    - process_creation
    - sysmon
    - privilege_escalation
    - persistence
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND ((data_win_eventdata_parentImage:/.*\\[Ss][Ll][Ll][Aa][Uu][Nn][Cc][Hh][Ee][Rr]\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/) OR (data_win_eventdata_parentImage:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Rr][Oo][Aa][Mm][Ii][Nn][Gg]\\.*/ AND data_win_eventdata_image:/.*\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*-[Kk].*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 16c37b52-b141-42a5-a3ea-bbe098444397
    name: Suspect Svchost Activity
    reason: A rogue svchost.exe launched outside services.exe is the same masquerading pattern.
  - id: ebea773c-a8f1-42ad-a856-00cb221966e8
    name: DLL Sideloading by VMware Xfer Utility
    reason: Same DLL sideloading technique via a signed binary; expect similar loader staging.
  - id: 7002aa10-b8d4-47ae-b5ba-51ab07e228b9
    name: Potential Mpclient.DLL Sideloading Via Defender Binaries
    reason: Sideloading through trusted AV binaries is a sister loader technique.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Svchost not started by services.exe
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Ss]vchost\.exe/ AND NOT data_win_eventdata_parentImage:/.*[Ss]ervices\.exe/
    pivot_on: host
    window: 6h
  - name: Binaries or DLLs dropped in Roaming profile
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*[Aa]pp[Dd]ata\\[Rr]oaming\\.*\.(exe|dll|dat)/
    pivot_on: host
    window: 24h
  - name: DLL loads from AppData Roaming
    query: data_win_system_eventID:7 AND data_win_eventdata_imageLoaded:/.*[Aa]pp[Dd]ata\\[Rr]oaming\\.*\.[Dd][Ll][Ll]/
    pivot_on: host
    window: 6h
  - name: Outbound connections by svchost
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*[Ss]vchost\.exe/ AND data_win_eventdata_initiated:true
    pivot_on: host
    window: 6h
  - name: Persistence via Run key or scheduled task
    query: (data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*CurrentVersion\\[Rr]un.*/) OR (data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Ss]chtasks\.exe/)
    pivot_on: host
    window: 24h
