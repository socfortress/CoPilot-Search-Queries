name: PowerShell Get-Clipboard Cmdlet Via CLI
id: b9aeac14-2ffd-4ad3-b967-1354a4e628c3
version: 1
schema_version: "1.0"
date: "2022-12-25"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: b9aeac14-2ffd-4ad3-b967-1354a4e628c3
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects usage of the 'Get-Clipboard' cmdlet via CLI. MITRE ATT&CK: T1115.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*Get-Clipboard*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*Get-Clipboard*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/OTRF/detection-hackathon-apt29/issues/16
  - https://github.com/OTRF/ThreatHunter-Playbook/blob/2d4257f630f4c9770f78d0c1df059f891ffc3fec/docs/evals/apt29/detections/3.B.2_C36B49B5-DF58-4A34-9FE9-56189B9DEFEA.md
  - https://attack.mitre.org/techniques/T1115/

response:
  message: >
    PowerShell Get-Clipboard Cmdlet Via CLI detected on host $agent_name$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1115
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1115
  custom_tags:
    - powershell
    - clipboard
    - cmdlet
    - process_creation
    - sysmon
    - collection
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Gg][Ee][Tt]-[Cc][Ll][Ii][Pp][Bb][Oo][Aa][Rr][Dd].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 09576804-7a05-458e-a817-eb718ca91f54
    name: Suspicious PowerShell IEX Execution Patterns
    reason: Clipboard harvesting is often run from an in-memory IEX stager; same-host PowerShell staging explains who launched it.
  - id: ee18ed37-0802-4268-9435-b3b91aaa18db
    name: PowerShell - Connect To Internet With Hidden Window
    reason: Hidden-window PowerShell reaching the internet is the typical exfil leg after clipboard contents are read.
  - id: 3b6ab547-8ec2-4991-b9d2-2b06702a48d7
    name: PowerShell Download Pattern
    reason: Download of a clipboard-stealer or monitor script is the usual precursor to Get-Clipboard use.
  - id: 2158f96f-43c2-43cb-952a-ab4580f32382
    name: Screen Capture Activity Via Psr.EXE
    reason: Clipboard theft often accompanies screen capture in the same collection phase.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other clipboard or input-capture reads
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Gg]et-[Cc]lipboard.*/ OR /.*[Cc]lipboard.*[Gg]et[Tt]ext.*/ OR /.*GetAsyncKeyState.*/)
    pivot_on: host
    window: 2h
  - name: PowerShell download or in-memory staging
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Dd]ownload[Ss]tring.*/ OR /.*[Ii]nvoke-[Ww]eb[Rr]equest.*/ OR /.*[Ii]nvoke-[Ee]xpression.*/ OR /.*[Nn]et\.[Ww]eb[Cc]lient.*/)
    pivot_on: host
    window: 4h
  - name: Encoding, archiving or sending collected data
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ii]nvoke-[Rr]est[Mm]ethod.*/ OR /.*[Cc]ompress-[Aa]rchive.*/ OR /.*ToBase64String.*/ OR /.*[Oo]ut-[Ff]ile.*/)
    pivot_on: host
    window: 2h
  - name: Screen capture or credential-theft tooling
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*CopyFromScreen.*/ OR /.*[Ss]creen[Cc]apture.*/ OR /.*[Kk]eylog.*/ OR /.*[Mm]imikatz.*/)
    pivot_on: host
    window: 4h
  - name: Same user other PowerShell executions
    query: data_win_system_eventID:1 AND data_win_eventdata_image:(/.*[Pp]ower[Ss]hell\.exe/ OR /.*pwsh\.exe/)
    pivot_on: user
    window: 4h
