name: Potential DLL Sideloading Via DeviceEnroller.EXE
id: e173ad47-4388-4012-ae62-bd13f71c18a8
version: 1
schema_version: "1.0"
date: "2023-02-04"
author: "@gott_cyber"
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: e173ad47-4388-4012-ae62-bd13f71c18a8
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the use of the PhoneDeepLink parameter to potentially sideload a DLL
  file that does not exist. This non-existent DLL file is named
  "ShellChromeAPI.dll". Adversaries can drop their own renamed DLL and execute
  it via DeviceEnroller.exe using this parameter. MITRE ATT&CK: T1574.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\deviceenroller.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "deviceenroller.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*/PhoneDeepLink*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\deviceenroller.exe'; data_win_eventdata_originalFileName equals
  'deviceenroller.exe'; data_win_eventdata_commandLine matches
  '*/PhoneDeepLink*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://mobile.twitter.com/0gtweet/status/1564131230941122561
  - https://strontic.github.io/xcyclopedia/library/DeviceEnroller.exe-24BEF0D6B0ECED36BB41831759FDE18D.html
  - https://attack.mitre.org/techniques/T1574/001/

response:
  message: >
    Potential DLL Sideloading Via DeviceEnroller.EXE detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1574.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.001
  custom_tags:
    - sideloading
    - deviceenroller
    - process_creation
    - sysmon
    - privilege_escalation
    - persistence
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Dd][Ee][Vv][Ii][Cc][Ee][Ee][Nn][Rr][Oo][Ll][Ll][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Dd][Ee][Vv][Ii][Cc][Ee][Ee][Nn][Rr][Oo][Ll][Ll][Ee][Rr]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*\/[Pp][Hh][Oo][Nn][Ee][Dd][Ee][Ee][Pp][Ll][Ii][Nn][Kk].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: ebea773c-a8f1-42ad-a856-00cb221966e8
    name: DLL Sideloading by VMware Xfer Utility
    reason: 'Same technique class: signed binary run from a writable dir loading a planted DLL.'
  - id: 7002aa10-b8d4-47ae-b5ba-51ab07e228b9
    name: Potential Mpclient.DLL Sideloading Via Defender Binaries
    reason: Parallel sideloading of a signed Microsoft binary; commonly used interchangeably by the same actors.
  - id: 02b18447-ea83-4b1b-8805-714a8a34546a
    name: Potential Mpclient.DLL Sideloading Via OfflineScannerShell.EXE Execution
    reason: Another Microsoft-binary sideload; indicates a broader sideloading campaign on the host.
  - id: de587dce-915e-4218-aac4-835ca6af6f70
    name: Potential Persistence Attempt Via Run Keys Using Reg.EXE
    reason: Sideloaded payload commonly establishes persistence next.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: DeviceEnroller executions
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Dd][Ee][Vv][Ii][Cc][Ee][Ee][Nn][Rr][Oo][Ll][Ll][Ee][Rr]\.[Ee][Xx][Ee])/)
    pivot_on: host
    window: 24h
  - name: DeviceEnroller image loads outside Windows dir
    query: data_win_system_eventID:"7" AND data_win_eventdata_image:/.*\\([Dd][Ee][Vv][Ii][Cc][Ee][Ee][Nn][Rr][Oo][Ll][Ll][Ee][Rr]\.[Ee][Xx][Ee])/ AND NOT data_win_eventdata_imageLoaded:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\.*/
    pivot_on: host
    window: 2h
  - name: Children spawned by DeviceEnroller
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Dd][Ee][Vv][Ii][Cc][Ee][Ee][Nn][Rr][Oo][Ll][Ll][Ee][Rr]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Network connections from DeviceEnroller
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Dd][Ee][Vv][Ii][Cc][Ee][Ee][Nn][Rr][Oo][Ll][Ll][Ee][Rr]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 4h
  - name: mdmregistration.dll written to disk
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Mm][Dd][Mm][Rr][Ee][Gg][Ii][Ss][Tt][Rr][Aa][Tt][Ii][Oo][Nn]\.[Dd][Ll][Ll]/
    pivot_on: host
    window: 2h
