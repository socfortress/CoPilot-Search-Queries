name: Chromium Browser Instance Executed With Custom Extension
id: 88d6e60c-759d-4ac1-a447-c0f1466c2d21
version: 1
schema_version: "1.0"
date: "2023-11-28"
author: Aedan Russell, frack113, X__Junior (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 88d6e60c-759d-4ac1-a447-c0f1466c2d21
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a Chromium based browser process with the 'load-extension' flag to
  start a instance with a custom extension. MITRE ATT&CK: T1176.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\brave.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\chrome.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\msedge.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\opera.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\vivaldi.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*--load-extension=*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\brave.exe'; data_win_eventdata_image matches '*\chrome.exe';
  data_win_eventdata_image matches '*\msedge.exe', among other conditions.

known_false_positives: >
  Usage of Chrome Extensions in testing tools such as BurpSuite will trigger
  this alert. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://redcanary.com/blog/chromeloader/
  - https://emkc.org/s/RJjuLa
  - https://www.mandiant.com/resources/blog/lnk-between-browsers
  - https://attack.mitre.org/techniques/T1176/001/

response:
  message: >
    Chromium Browser Instance Executed With Custom Extension detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
    MITRE ATT&CK: T1176.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1176.001
  custom_tags:
    - chromium
    - browser
    - instance
    - process_creation
    - sysmon
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Bb][Rr][Aa][Vv][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Hh][Rr][Oo][Mm][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Ee][Dd][Gg][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Oo][Pp][Ee][Rr][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Vv][Ii][Vv][Aa][Ll][Dd][Ii]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*--[Ll][Oo][Aa][Dd]-[Ee][Xx][Tt][Ee][Nn][Ss][Ii][Oo][Nn]=.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 27ba3207-dd30-4812-abbf-5d20c57d474e
    name: Suspicious Chromium Browser Instance Executed With Custom Extension
    reason: Stricter variant of the same launch; elevates suspicion of the extension path.
  - id: da355155-1d23-48f9-bf95-e534ae273ab0
    name: Windows Chrome Enable Extension Loading via Command-Line
    reason: Companion flags used to allow side-loaded extensions.
  - id: 0a74c5a9-1b71-4475-9af2-7829d320d5c2
    name: ChromeLoader Malware Execution
    reason: Known malware family using this exact technique.
  - id: 4f546cf4-15aa-4368-80f7-940e92bc551e
    name: Windows Chromium Browser with Custom User Data Directory
    reason: Attackers pair custom extensions with an isolated profile.
  - id: 841e2abc-0442-4e7f-b445-b22680632a08
    name: Windows Browser Process Launched with Unusual Flags
    reason: Other abnormal flags in the same launch.
  - id: b3d34dc5-2efd-4ae3-845f-8ec14921f449
    name: Browser Started with Remote Debugging
    reason: Malicious extension or actor may use remote debugging to steal sessions.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Browser launched with unusual flags
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*(chrome|msedge|brave|opera|vivaldi)\.exe/ AND data_win_eventdata_commandLine:/.*(--load-extension|--disable-extensions-except|--user-data-dir|--remote-debugging|--no-sandbox).*/
    pivot_on: host
    window: 24h
  - name: Parent of browser launch
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*(cmd|powershell|wscript|cscript|mshta|rundll32|explorer)\.exe/ AND data_win_eventdata_commandLine:/.*--load-extension.*/
    pivot_on: host
    window: 24h
  - name: Extension files written to disk
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*(manifest\.json|\.crx).*/
    pivot_on: host
    window: 24h
  - name: Persistence via scheduled task
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*schtasks\.exe/ AND data_win_eventdata_commandLine:/.*(chrome|msedge|--load-extension).*/
    pivot_on: host
    window: 24h
