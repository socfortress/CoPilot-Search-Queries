name: Remote Access Tool - TacticalRMM Agent Registration to Potentially Attacker-Controlled Server
id: 2db93a3f-3249-4f73-9e68-0e77a0f8ae7e
version: 1
schema_version: "1.0"
date: "2025-05-29"
author: Ahmed Nosir (@egycondor)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 2db93a3f-3249-4f73-9e68-0e77a0f8ae7e
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects TacticalRMM agent installations where the --api, --auth, and related
  flags are used on the command line. These parameters configure the agent to
  connect to a specific RMM server with authentication, client ID, and site ID.
  This technique could indicate a threat actor attempting to register the agent
  with an attacker-controlled RMM infrastructure silently. MITRE ATT&CK: T1219,
  T1105.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\TacticalAgent\\\\tacticalrmm.exe*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*--api*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*--auth*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*--client-id*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*--site-id*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*--agent-type*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\TacticalAgent\tacticalrmm.exe*'; data_win_eventdata_commandLine matches
  '*--api*'; data_win_eventdata_commandLine matches '*--auth*', among other
  conditions.

known_false_positives: >
  Legitimate system administrator deploying TacticalRMM. Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://github.com/amidaware/tacticalrmm
  - https://apophis133.medium.com/powershell-script-tactical-rmm-installation-45afb639eff3
  - https://attack.mitre.org/techniques/T1219/
  - https://attack.mitre.org/techniques/T1105/

response:
  message: >
    Remote Access Tool - TacticalRMM Agent Registration to Potentially
    Attacker-Controlled Server detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1219, T1105
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1219
    - T1105
  custom_tags:
    - tacticalrmm
    - agent
    - registration
    - process_creation
    - sysmon
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Tt][Aa][Cc][Tt][Ii][Cc][Aa][Ll][Aa][Gg][Ee][Nn][Tt]\\[Tt][Aa][Cc][Tt][Ii][Cc][Aa][Ll][Rr][Mm][Mm]\.[Ee][Xx][Ee].*/ AND data_win_eventdata_commandLine:/.*--[Aa][Pp][Ii].*/ AND data_win_eventdata_commandLine:/.*--[Aa][Uu][Tt][Hh].*/ AND data_win_eventdata_commandLine:/.*--[Cc][Ll][Ii][Ee][Nn][Tt]-[Ii][Dd].*/ AND data_win_eventdata_commandLine:/.*--[Ss][Ii][Tt][Ee]-[Ii][Dd].*/ AND data_win_eventdata_commandLine:/.*--[Aa][Gg][Ee][Nn][Tt]-[Tt][Yy][Pp][Ee].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 87261fb2-69d0-42fe-b9de-88c6b5f65a43
    name: Atera Agent Installation
    reason: Same RMM-as-implant tradecraft; attackers often stage several RMM agents for redundant persistence on one host.
  - id: 2fbbe9ff-0afc-470b-bdc0-592198339968
    name: Remote Access Tool - Potential MeshAgent Execution - Windows
    reason: TacticalRMM deployments bundle MeshAgent for remote control; its execution confirms interactive access was established.
  - id: 57bff678-25d1-4d6c-8211-8ca106d12053
    name: Remote Access Tool - ScreenConnect Execution
    reason: Another RMM commonly dropped alongside TacticalRMM as a fallback access channel.
  - id: 79a87aa6-e4bd-42fc-a5bb-5e6fbdcd62f5
    name: Msiexec Quiet Installation
    reason: Agent installers are run silently; a quiet install precedes the registration command.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Silent installer or setup launching an RMM agent
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:(/.*[Tt][Aa][Cc][Tt][Ii][Cc][Aa][Ll].*/ OR /.*[Vv][Ee][Rr][Yy][Ss][Ii][Ll][Ee][Nn][Tt].*/ OR /.*[Ss][Ii][Ll][Ee][Nn][Tt].*[Aa][Gg][Ee][Nn][Tt].*/)
    pivot_on: host
    window: 2h
  - name: Agent files or service created under TacticalAgent/Mesh paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:(/.*[Tt]actical[Aa]gent.*/ OR /.*[Mm]esh[Aa]gent.*/ OR /.*[Tt]acticalrmm.*/)
    pivot_on: host
    window: 4h
  - name: DNS lookups by RMM agent processes
    query: data_win_system_eventID:"22" AND data_win_eventdata_image:(/.*[Tt]acticalrmm\.exe/ OR /.*[Mm]eshagent.*\.exe/)
    pivot_on: host
    window: 4h
  - name: Outbound connections from RMM agent binaries
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:(/.*[Tt]acticalrmm\.exe/ OR /.*[Mm]eshagent.*\.exe/)
    pivot_on: host
    window: 4h
  - name: Shell or script children of the RMM agent (remote tasking)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:(/.*[Tt]acticalrmm\.exe/ OR /.*[Mm]eshagent.*\.exe/)
    pivot_on: host
    window: 6h
