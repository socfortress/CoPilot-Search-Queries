name: Hardware Model Reconnaissance Via Wmic.EXE
id: 3e3ceccd-6c06-48b8-b5ff-ab1d25db8c1d
version: 1
schema_version: "1.0"
date: "2023-02-14"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 3e3ceccd-6c06-48b8-b5ff-ab1d25db8c1d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of WMIC with the "csproduct" which is used to obtain
  information such as hardware models and vendor information. MITRE ATT&CK:
  T1047.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\wmic.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "wmic.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*csproduct*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\wmic.exe'; data_win_eventdata_originalFileName equals 'wmic.exe';
  data_win_eventdata_commandLine matches '*csproduct*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://jonconwayuk.wordpress.com/2014/01/31/wmic-csproduct-using-wmi-to-identify-make-and-model-of-hardware/
  - https://www.uptycs.com/blog/kuraystealer-a-bandit-using-discord-webhooks
  - https://attack.mitre.org/techniques/T1047/

response:
  message: >
    Hardware Model Reconnaissance Via Wmic.EXE detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1047
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1047
  custom_tags:
    - hardware
    - model
    - reconnaissance
    - process_creation
    - sysmon
    - execution
    - car_2016_03_002
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Cc][Ss][Pp][Rr][Oo][Dd][Uu][Cc][Tt].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 9d5a1274-922a-49d0-87f3-8c653483b909
    name: Uncommon System Information Discovery Via Wmic.EXE
    reason: Same discovery burst typically queries additional system info with wmic.
  - id: 9d7ca793-f6bd-471c-8d0f-11e68b2f0d2f
    name: Computer System Reconnaissance Via Wmic.EXE
    reason: Companion wmic computersystem queries used with csproduct to fingerprint a machine or detect VMs.
  - id: c79da740-5030-45ec-a2e0-479e824a562c
    name: System Disk And Volume Reconnaissance Via Wmic.EXE
    reason: Malware sandbox/VM checks and host profiling often chain disk and hardware queries.
  - id: e568650b-5dcd-4658-8f34-ded0b1e13992
    name: Potential Product Class Reconnaissance Via Wmic.EXE
    reason: Security product enumeration commonly follows host hardware profiling.
  - id: af688c76-4ce4-4309-bfdd-e896f01acf27
    name: Grixba Malware Reconnaissance Activity
    reason: Known malware recon routine that bundles host profiling commands.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other wmic queries on host
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Ww]mic\.exe/
    pivot_on: host
    window: 2h
  - name: Discovery commands from same session
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*(systeminfo|whoami|ipconfig|net|net1|nltest|tasklist|hostname)\.exe/
    pivot_on: host
    window: 2h
  - name: Encoded or scripted PowerShell
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*(powershell|pwsh)\.exe/ AND data_win_eventdata_commandLine:/.*(-[Ee]nc|-[Ee]ncodedcommand|[Ii]ex|[Dd]ownload).*/
    pivot_on: host
    window: 2h
  - name: Outbound tooling downloads
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(certutil|bitsadmin|curl|Invoke-WebRequest).*/ AND data_win_eventdata_commandLine:/.*http.*/
    pivot_on: host
    window: 2h
