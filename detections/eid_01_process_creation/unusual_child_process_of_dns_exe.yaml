name: Unusual Child Process of dns.exe
id: a4e3d776-f12e-42c2-8510-9e6ed1f43ec3
version: 1
schema_version: "1.0"
date: "2023-02-05"
author: Tim Rauch, Elastic (idea)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: a4e3d776-f12e-42c2-8510-9e6ed1f43ec3
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects an unexpected process spawning from dns.exe which may indicate
  activity related to remote code execution or other forms of exploitation as
  seen in CVE-2020-1350 (SigRed). MITRE ATT&CK: T1133.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_parentImage:
              value: "*\\\\dns.exe"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\conhost.exe"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\dns.exe'; data_win_eventdata_image matches '*\conhost.exe'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.elastic.co/guide/en/security/current/unusual-child-process-of-dns-exe.html
  - https://attack.mitre.org/techniques/T1133/

response:
  message: >
    Unusual Child Process of dns.exe detected on host $agent_name$. Matched
    data_win_eventdata_parentImage: $data_win_eventdata_parentImage$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1133
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1133
  custom_tags:
    - unusual
    - child
    - process_creation
    - sysmon
    - persistence
    - initial_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Dd][Nn][Ss]\.[Ee][Xx][Ee]/ AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/.*\\[Cc][Oo][Nn][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b5281f31-f9cc-4d0d-95d0-45b91c45b487
    name: DNS RCE CVE-2020-1350
    reason: 'Same SigRed (CVE-2020-1350) exploitation family: the dns.exe child is the post-exploit payload of that RCE'
  - id: 8f0b1fb1-9bd4-4e74-8cdf-a8de4d2adfd0
    name: Unusual File Deletion by Dns.exe
    reason: Unusual file deletion by dns.exe is the cleanup step after a hijacked DNS service runs code
  - id: e61e8a88-59a9-451c-874e-70fcc9740d67
    name: New DNS ServerLevelPluginDll Installed
    reason: 'ServerLevelPluginDll registry change makes dns.exe load an attacker DLL: alternative route to code execution inside dns.exe'
  - id: f63b56ee-3f79-4b8a-97fb-5c48007e8573
    name: New DNS ServerLevelPluginDll Installed Via Dnscmd.EXE
    reason: dnscmd serverlevelplugindll config precursor that would cause dns.exe to run attacker code
  - id: b6457d63-d2a2-4e29-859d-4e7affc153d1
    name: Potential Discovery Activity Via Dnscmd.EXE
    reason: dnscmd discovery of DNS zones/config often precedes abuse of the DNS service on the same DC
  - id: c4db14d9-7909-48b4-a054-aa14d89dbb19
    name: Malicious PowerShell Process - Encoded Command
    reason: Encoded PowerShell is a common stager launched from a shell spawned by dns.exe
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Interpreters or recon tools spawned by dns.exe
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\([Dd][Nn][Ss]\.[Ee][Xx][Ee])/ AND data_win_eventdata_image:/.*\\([Cc][Mm][Dd]\.[Ee][Xx][Ee]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]|[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]|[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|[Ww][Hh][Oo][Aa][Mm][Ii]\.[Ee][Xx][Ee]|[Nn][Ee][Tt]\.[Ee][Xx][Ee]|[Nn][Ee][Tt]1\.[Ee][Xx][Ee]|[Nn][Ll][Tt][Ee][Ss][Tt]\.[Ee][Xx][Ee]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 2h
  - name: Domain/host recon run after DNS service compromise
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Ww][Hh][Oo][Aa][Mm][Ii]\.[Ee][Xx][Ee]|[Nn][Ll][Tt][Ee][Ss][Tt]\.[Ee][Xx][Ee]|[Nn][Ee][Tt]\.[Ee][Xx][Ee]|[Nn][Ee][Tt]1\.[Ee][Xx][Ee]|[Ii][Pp][Cc][Oo][Nn][Ff][Ii][Gg]\.[Ee][Xx][Ee]|[Ss][Yy][Ss][Tt][Ee][Mm][Ii][Nn][Ff][Oo]\.[Ee][Xx][Ee]|[Dd][Ss][Qq][Uu][Ee][Rr][Yy]\.[Ee][Xx][Ee]|[Aa][Dd][Ff][Ii][Nn][Dd]\.[Ee][Xx][Ee]|[Ss][Ee][Tt][Ss][Pp][Nn]\.[Ee][Xx][Ee]|[Qq][Uu][Ss][Ee][Rr]\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 1h
  - name: DNS server plugin DLL configuration or dnscmd use
    query: (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*([Ss][Ee][Rr][Vv][Ee][Rr][Ll][Ee][Vv][Ee][Ll][Pp][Ll][Uu][Gg][Ii][Nn][Dd][Ll][Ll]).*/) OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ss][Ee][Rr][Vv][Ee][Rr][Ll][Ee][Vv][Ee][Ll][Pp][Ll][Uu][Gg][Ii][Nn][Dd][Ll][Ll]).*/)
    pivot_on:
    - host
    window: 4h
  - name: Files written by dns.exe
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*\\([Dd][Nn][Ss]\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 2h
  - name: Credential theft tooling on the DNS host
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll]|[Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt]|[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa]|[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll]|[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]|[Ll][Ss][Aa][Ss][Ss]|[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz]).*/
    pivot_on:
    - host
    window: 4h
