name: UAC Bypass Using MSConfig Token Modification - Process
id: ad92e3f9-7eb6-460e-96b1-582b0ccbb980
version: 1
schema_version: "1.0"
date: "2024-12-01"
author: Christian Burkard (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: ad92e3f9-7eb6-460e-96b1-582b0ccbb980
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the pattern of UAC Bypass using a msconfig GUI hack (UACMe 55). MITRE
  ATT&CK: T1548.002.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - term:
                  data_win_eventdata_integrityLevel:
                    value: "High"
                    case_insensitive: true
              - term:
                  data_win_eventdata_integrityLevel:
                    value: "System"
                    case_insensitive: true
              - term:
                  data_win_eventdata_integrityLevel:
                    value: "S-1-16-16384"
                    case_insensitive: true
              - term:
                  data_win_eventdata_integrityLevel:
                    value: "S-1-16-12288"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_parentImage:
              value: "*\\\\AppData\\\\Local\\\\Temp\\\\pkgmgr.exe"
              case_insensitive: true
        - term:
            data_win_eventdata_commandLine:
              value: "\"C:\\Windows\\system32\\msconfig.exe\" -5"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_integrityLevel
    - data_win_eventdata_parentImage
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_integrityLevel equals
  'High'; data_win_eventdata_integrityLevel equals 'System';
  data_win_eventdata_integrityLevel equals 'S-1-16-16384', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/hfiref0x/UACME
  - https://attack.mitre.org/techniques/T1548/002/

response:
  message: >
    UAC Bypass Using MSConfig Token Modification - Process detected on host
    $agent_name$. Matched data_win_eventdata_integrityLevel:
    $data_win_eventdata_integrityLevel$. Matched data_win_eventdata_parentImage:
    $data_win_eventdata_parentImage$. MITRE ATT&CK: T1548.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_integrityLevel
      type: other
    - field: data_win_eventdata_parentImage
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1548.002
  custom_tags:
    - bypass
    - msconfig
    - token
    - process_creation
    - sysmon
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_integrityLevel:/[Hh][Ii][Gg][Hh]/ OR data_win_eventdata_integrityLevel:/[Ss][Yy][Ss][Tt][Ee][Mm]/ OR data_win_eventdata_integrityLevel:/[Ss]-1-16-16384/ OR data_win_eventdata_integrityLevel:/[Ss]-1-16-12288/) AND data_win_eventdata_parentImage:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\[Pp][Kk][Gg][Mm][Gg][Rr]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/\"[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Mm][Ss][Cc][Oo][Nn][Ff][Ii][Gg]\.[Ee][Xx][Ee]\" -5/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 41bb431f-56d8-4691-bb56-ed34e390906f
    name: UAC Bypass Using MSConfig Token Modification - File
    reason: 'File-drop half: pkgmgr.exe planted in user Temp for msconfig -5.'
  - id: cce58e2c-988a-4319-9390-0daa9eefa3cd
    name: Windows Bypass UAC via Pkgmgr Tool
    reason: PkgMgr UAC bypass abuses the same binary-name hijack.
  - id: a743ceba-c771-4d75-97eb-8a90f7f4844c
    name: UAC Bypass Using PkgMgr and DISM
    reason: PkgMgr/DISM bypass shares the pkgmgr hijack primitive.
  - id: d38d2fa4-98e6-4a24-aff1-410b0c9ad177
    name: HackTool - UACMe Akagi Execution
    reason: UACMe 55 is this method.
  - id: 178e615d-e666-498b-9630-9ed363038101
    name: Elevated System Shell Spawned From Uncommon Parent Location
    reason: Elevated shell after bypass.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: msconfig launched with -5
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Mm]s[Cc]onfig\.exe/ AND data_win_eventdata_commandLine:/.*-5.*/
    pivot_on: host
    window: 2h
  - name: pkgmgr.exe executing from user Temp
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*\\AppData\\Local\\Temp\\[Pp]kg[Mm]gr\.exe/
    pivot_on: host
    window: 2h
  - name: pkgmgr.exe written to user profile
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\\Users\\.*\\AppData\\Local\\Temp\\[Pp]kg[Mm]gr\.exe/
    pivot_on: host
    window: 2h
  - name: Elevated execution from Temp parents
    query: data_win_system_eventID:1 AND data_win_eventdata_integrityLevel:(High OR System) AND data_win_eventdata_parentImage:(/.*\\Temp\\.*/)
    pivot_on: host
    window: 4h
