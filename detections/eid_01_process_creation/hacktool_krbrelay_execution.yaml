name: HackTool - KrbRelay Execution
id: e96253b8-6b3b-4f90-9e59-3b24b99cf9b4
version: 1
schema_version: "1.0"
date: "2023-02-04"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: e96253b8-6b3b-4f90-9e59-3b24b99cf9b4
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the use of KrbRelay, a Kerberos relaying tool. MITRE ATT&CK:
  T1558.003.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\KrbRelay.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "KrbRelay.exe"
                    case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* -spn *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* -clsid *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* -rbcd *"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*shadowcred*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*clsid*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*spn*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*spn *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*session *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*clsid *"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\KrbRelay.exe'; data_win_eventdata_originalFileName equals 'KrbRelay.exe';
  data_win_eventdata_commandLine matches '* -spn *', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/cube0x0/KrbRelay
  - https://attack.mitre.org/techniques/T1558/003/

response:
  message: >
    HackTool - KrbRelay Execution detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1558.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1558.003
  custom_tags:
    - hacktool
    - krbrelay
    - process_creation
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Kk][Rr][Bb][Rr][Ee][Ll][Aa][Yy]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Kk][Rr][Bb][Rr][Ee][Ll][Aa][Yy]\.[Ee][Xx][Ee]/ OR (data_win_eventdata_commandLine:/.* -[Ss][Pp][Nn] .*/ AND data_win_eventdata_commandLine:/.* -[Cc][Ll][Ss][Ii][Dd] .*/ AND data_win_eventdata_commandLine:/.* -[Rr][Bb][Cc][Dd] .*/) OR (data_win_eventdata_commandLine:/.*[Ss][Hh][Aa][Dd][Oo][Ww][Cc][Rr][Ee][Dd].*/ AND data_win_eventdata_commandLine:/.*[Cc][Ll][Ss][Ii][Dd].*/ AND data_win_eventdata_commandLine:/.*[Ss][Pp][Nn].*/) OR (data_win_eventdata_commandLine:/.*[Ss][Pp][Nn] .*/ AND data_win_eventdata_commandLine:/.*[Ss][Ee][Ss][Ss][Ii][Oo][Nn] .*/ AND data_win_eventdata_commandLine:/.*[Cc][Ll][Ss][Ii][Dd] .*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 12827a56-61a4-476a-a9cb-f3068f191073
    name: HackTool - KrbRelayUp Execution
    reason: KrbRelayUp wraps KrbRelay-style relaying for local privilege escalation; same toolchain.
  - id: a7664b14-75fb-4a50-a223-cb9bc0afbacf
    name: HackTool - RemoteKrbRelay Execution
    reason: Sibling remote Kerberos relay tool, often tried when one variant fails.
  - id: 0ed99dda-6a35-11ef-8c99-0242ac120002
    name: Attempts of Kerberos Coercion Via DNS SPN Spoofing
    reason: Marshalled-SPN DNS records coerce the Kerberos auth that KrbRelay then relays.
  - id: 7ec2c172-dceb-4c10-92c9-87c1881b7e18
    name: HackTool - Rubeus Execution
    reason: Relayed access leads to Rubeus ticket requests (S4U, ptt) for the compromised account.
  - id: 13bbd574-83ac-11ec-99d4-acde48001122
    name: Mimikatz PassTheTicket CommandLine Parameters
    reason: Ticket reuse after relay-based compromise.
  - id: 6bd75993-9888-4f91-9404-e1e4e4e34b77
    name: HackTool - LocalPotato Execution
    reason: Alternative local auth-reflection privilege escalation toward the same SYSTEM outcome.
  - id: e8d34729-86a4-4140-adfd-0a29c2106307
    name: HackTool - CoercedPotato Execution
    reason: Coerced-auth SYSTEM escalation, an alternate path to the same outcome.
  - id: 6c6d9280-e6d0-4b9d-80ac-254701b64916
    name: Potential NTLM Coercion Via Certutil.EXE
    reason: Coercion technique that can force authentication to the relay host.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: KrbRelay binary dropped or renamed
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*([Kk][Rr][Bb][Rr][Ee][Ll][Aa][Yy]).*/
    pivot_on: host
    window: 24h
  - name: Shadow credentials, RBCD or computer-account abuse tooling
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ss][Hh][Aa][Dd][Oo][Ww][Cc][Rr][Ee][Dd]|-[Rr][Bb][Cc][Dd]|[Mm][Ss][Dd][Ss]-[Kk][Ee][Yy][Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll][Ll][Ii][Nn][Kk]|[Aa][Ll][Ll][Oo][Ww][Ee][Dd][Tt][Oo][Aa][Cc][Tt][Oo][Nn][Bb][Ee][Hh][Aa][Ll][Ff]|[Aa][Dd][Dd][Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr]|[Kk][Rr][Bb][Rr][Ee][Ll][Aa][Yy][Uu][Pp]|[Ww][Hh][Ii][Ss][Kk][Ee][Rr]|[Pp][Oo][Ww][Ee][Rr][Mm][Aa][Dd]).*/
    pivot_on: host
    window: 4h
  - name: Kerberos ticket requests for machine accounts
    query: (data_win_system_eventID:"4769" OR data_win_system_eventID:"4768") AND data_win_eventdata_targetUserName:/.*\$/
    pivot_on: host
    window: 4h
  - name: New services installed after relay
    query: (data_win_system_eventID:"7045" OR data_win_system_eventID:"4697")
    pivot_on: host
    window: 2h
  - name: Additions to local administrators or privileged domain groups
    query: (data_win_system_eventID:"4732" OR data_win_system_eventID:"4728" OR data_win_system_eventID:"4756") AND data_win_eventdata_targetUserName:/.*([Aa][Dd][Mm][Ii][Nn][Ii][Ss][Tt][Rr][Aa][Tt][Oo][Rr][Ss]|[Dd][Oo][Mm][Aa][Ii][Nn] [Aa][Dd][Mm][Ii][Nn][Ss]|[Ee][Nn][Tt][Ee][Rr][Pp][Rr][Ii][Ss][Ee] [Aa][Dd][Mm][Ii][Nn][Ss]).*/
    pivot_on: host
    window: 4h
