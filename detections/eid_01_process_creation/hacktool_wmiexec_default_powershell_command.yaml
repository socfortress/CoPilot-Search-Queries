name: HackTool - Wmiexec Default Powershell Command
id: 022eaba8-f0bf-4dd9-9217-4604b0bb3bb0
version: 1
schema_version: "1.0"
date: "2023-03-08"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 022eaba8-f0bf-4dd9-9217-4604b0bb3bb0
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of PowerShell with a specific flag sequence that is used
  by the Wmiexec script.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*-NoP -NoL -sta -NonI -W Hidden -Exec Bypass -Enc*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches '*-NoP
  -NoL -sta -NonI -W Hidden -Exec Bypass -Enc*'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/fortra/impacket/blob/f4b848fa27654ca95bc0f4c73dbba8b9c2c9f30a/examples/wmiexec.py

response:
  message: >
    HackTool - Wmiexec Default Powershell Command detected on host $agent_name$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - hacktool
    - wmiexec
    - default
    - process_creation
    - sysmon
    - lateral_movement
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*-[Nn][Oo][Pp] -[Nn][Oo][Ll] -[Ss][Tt][Aa] -[Nn][Oo][Nn][Ii] -[Ww] [Hh][Ii][Dd][Dd][Ee][Nn] -[Ee][Xx][Ee][Cc] [Bb][Yy][Pp][Aa][Ss][Ss] -[Ee][Nn][Cc].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d6e464e4-5c6a-474e-82d2-aed616a3a492
    name: Impacket Lateral Movement WMIExec Commandline Parameters
    reason: Impacket wmiexec cmd.exe command line pattern on the same target
  - id: 10c14723-61c7-4c75-92ca-9af245723ad2
    name: HackTool - Potential Impacket Lateral Movement Activity
    reason: General Impacket lateral movement activity from the same source
  - id: 4627c6ae-6899-46e2-aa0c-6ebcb1becd19
    name: HackTool - Impacket Tools Execution
    reason: Impacket tool execution on the attacker-controlled host
  - id: c4db14d9-7909-48b4-a054-aa14d89dbb19
    name: Malicious PowerShell Process - Encoded Command
    reason: The payload is an encoded PowerShell command
  - id: e32d4572-9826-4738-b651-95fa63747e8a
    name: Base64 Encoded PowerShell Command Detected
    reason: Base64 encoded PowerShell detection corroborates the -Enc payload
  - id: 9be56c82-b1cc-4318-87eb-d138afaaca39
    name: Malicious PowerShell Process - Execution Policy Bypass
    reason: Flags include -Exec Bypass execution policy bypass
  - id: 42a993dd-bb3e-48c8-b372-4d6684c4106c
    name: HackTool - CrackMapExec Execution
    reason: CrackMapExec uses the same WMI exec technique
  - id: 7638e5fe-600c-4289-a968-f49dd537ec7d
    name: HackTool - NetExec Execution
    reason: NetExec WMI execution is a sibling
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Processes spawned by WMI provider host
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*\\[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee]\.[Ee][Xx][Ee].*/
    pivot_on: host
    window: 2h
  - name: Network logons (type 3) preceding remote exec
    query: data_win_system_eventID:4624 AND data_win_eventdata_logonType:3
    pivot_on: user
    window: 1h
  - name: Encoded PowerShell payloads
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*-[Ee][Nn][Cc].*/ OR /.*-[Ee][Nn][Cc][Oo][Dd][Ee][Dd][Cc][Oo][Mm][Mm][Aa][Nn][Dd].*/ OR /.*[Ff][Rr][Oo][Mm][Bb][Aa][Ss][Ee]64[Ss][Tt][Rr][Ii][Nn][Gg].*/)
    pivot_on: host
    window: 4h
  - name: Credential access after remote exec
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR /.*[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp].*/ OR /.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss].*/ OR /.*[Rr][Ee][Gg] [Ss][Aa][Vv][Ee].*/)
    pivot_on: host
    window: 4h
  - name: Output staging via ADMIN$ redirect
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*\\\\127\.0\.0\.1\\[Aa][Dd][Mm][Ii][Nn]\$.*/
    pivot_on: host
    window: 2h
