name: HackTool - SharpEvtMute Execution
id: bedfc8ad-d1c7-4e37-a20e-e2b0dbee759c
version: 1
schema_version: "1.0"
date: "2023-02-14"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: bedfc8ad-d1c7-4e37-a20e-e2b0dbee759c
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the use of SharpEvtHook, a tool that tampers with the Windows event
  logs. MITRE ATT&CK: T1685.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\SharpEvtMute.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_description:
                    value: "SharpEvtMute"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*--Filter \"rule *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*--Encoded --Filter \\\\\"*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_description
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\SharpEvtMute.exe'; data_win_eventdata_description equals 'SharpEvtMute';
  data_win_eventdata_commandLine matches '*--Filter "rule *', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/bats3c/EvtMute
  - https://attack.mitre.org/techniques/T1685/001/

response:
  message: >
    HackTool - SharpEvtMute Execution detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_description: $data_win_eventdata_description$. MITRE
    ATT&CK: T1685.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_description
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685.001
  custom_tags:
    - hacktool
    - sharpevtmute
    - process_creation
    - sysmon
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ss][Hh][Aa][Rr][Pp][Ee][Vv][Tt][Mm][Uu][Tt][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_description:/[Ss][Hh][Aa][Rr][Pp][Ee][Vv][Tt][Mm][Uu][Tt][Ee]/ OR data_win_eventdata_commandLine:/.*--[Ff][Ii][Ll][Tt][Ee][Rr] \"[Rr][Uu][Ll][Ee] .*/ OR data_win_eventdata_commandLine:/.*--[Ee][Nn][Cc][Oo][Dd][Ee][Dd] --[Ff][Ii][Ll][Tt][Ee][Rr] \\\".*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 49329257-089d-46e6-af37-4afce4290685
    name: HackTool - SharpEvtMute DLL Load
    reason: 'The tool''s hooking DLL (matched by imphash) loading into a process is the other half of the mute: same tool, same host, usually just before or after the process creation.'
  - id: 236e7c8e-c9d9-11eb-a824-acde48001122
    name: Disable Logs Using WevtUtil
    reason: Attackers pair selective event muting with wevtutil to disable or clear whole channels; both aim to blind the same logging.
  - id: 0a13e132-651d-11eb-ae93-0242ac130002
    name: Audit Policy Tampering Via Auditpol
    reason: Auditpol changes turn off the audit subcategories whose events SharpEvtMute would otherwise have to filter individually.
  - id: 100ef69e-3327-481c-8e5c-6d80d9507556
    name: Important Windows Eventlog Cleared
    reason: A cleared Security/System log on the same host shows the blinding escalated from filtering to destruction.
  - id: 41421f44-58f9-455d-838a-c398859841d4
    name: ETW Logging Tamper In .NET Processes Via CommandLine
    reason: ETW tampering in .NET processes is the sibling log-evasion technique for the same C# tooling.
  - id: 4d7cda18-1b12-4e52-b45c-d28653210df8
    name: Sysmon Driver Unloaded Via Fltmc.EXE
    reason: Unloading the Sysmon driver via fltmc blinds the very telemetry that caught this; an attacker who muted logs often kills the sensor too.
  - id: 18beca67-ab3e-4ee3-ba7a-a46ca8d7d0cc
    name: Sysmon Channel Reference Deletion
    reason: Deleting the Sysmon channel reference is another way to silence logging on the host, often chained with this tool.
  - id: 2f78da12-f7c7-430b-8b19-a28f269b77a3
    name: Disable Windows Event Logging Via Registry
    reason: Disabling event logging via registry is a persistent alternative to in-memory muting and signals the same intent.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Event log clearing or disabling commands
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll].* ([Cc][Ll]|[Ss][Ll]|[Cc][Ll][Ee][Aa][Rr]-[Ll][Oo][Gg]).*/ OR data_win_eventdata_commandLine:/.*[Cc][Ll][Ee][Aa][Rr]-[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Mm][Oo][Vv][Ee]-[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg].*/)
    pivot_on: host
    window: 4h
  - name: Audit policy and Sysmon sensor tampering
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Aa][Uu][Dd][Ii][Tt][Pp][Oo][Ll].* \/([Cc][Ll][Ee][Aa][Rr]|[Rr][Ee][Mm][Oo][Vv][Ee]|[Ss][Ee][Tt]).*/ OR data_win_eventdata_commandLine:/.*[Ff][Ll][Tt][Mm][Cc].*[Uu][Nn][Ll][Oo][Aa][Dd].*/ OR data_win_eventdata_commandLine:/.*[Ss][Yy][Ss][Mm][Oo][Nn] .*-[Uu].*/)
    pivot_on: host
    window: 4h
  - name: EventLog service and channel registry changes
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\\[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg]\\.*/ AND NOT data_win_eventdata_image:/.*\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 4h
  - name: .NET hacktool runtime load from user-writable paths
    query: data_win_system_eventID:"7" AND data_win_eventdata_imageLoaded:/.*\\[Cc][Ll][Rr]\.[Dd][Ll][Ll]/ AND data_win_eventdata_image:/.*\\([Uu][Ss][Ee][Rr][Ss]|[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]|[Tt][Ee][Mm][Pp]|[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss])\\.*/
    pivot_on: host
    window: 2h
  - name: LSASS access that follows logging blindness
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ AND NOT data_win_eventdata_sourceImage:/.*\\([Ss][Vv][Cc][Hh][Oo][Ss][Tt]|[Cc][Ss][Rr][Ss][Ss]|[Ww][Ii][Nn][Ii][Nn][Ii][Tt]|[Mm][Ss][Mm][Pp][Ee][Nn][Gg])\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 4h
