name: Suspicious Child Process Created as System
id: 590a5f4c-6c8c-4f10-8307-89afe9453a9d
version: 1
schema_version: "1.0"
date: "2024-12-01"
author: Teymur Kheirkhabarov, Roberto Rodriguez (@Cyb3rWard0g), Open Threat Research (OTR)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 590a5f4c-6c8c-4f10-8307-89afe9453a9d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detection of child processes spawned with SYSTEM privileges by parents with
  LOCAL SERVICE or NETWORK SERVICE accounts. MITRE ATT&CK: T1134.002.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_parentUser:
                    value: "*AUTHORI*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentUser:
                    value: "*AUTORI*"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_parentUser:
                    value: "*\\\\NETWORK SERVICE"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentUser:
                    value: "*\\\\LOCAL SERVICE"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_user:
                    value: "*AUTHORI*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_user:
                    value: "*AUTORI*"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_user:
                    value: "*\\\\SYSTEM"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_user:
                    value: "*\\\\Système"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_user:
                    value: "*\\\\СИСТЕМА"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - term:
                  data_win_eventdata_integrityLevel:
                    value: "System"
                    case_insensitive: true
              - term:
                  data_win_eventdata_integrityLevel:
                    value: "S-1-16-16384"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_image"
        - exists:
            field: "data_win_eventdata_commandLine"
        - bool:
            must_not:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\rundll32.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*DavSetCookie*"
                          case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentUser
    - data_win_eventdata_user
    - data_win_eventdata_integrityLevel
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentUser matches
  '*AUTHORI*'; data_win_eventdata_parentUser matches '*AUTORI*';
  data_win_eventdata_parentUser matches '*\NETWORK SERVICE', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://speakerdeck.com/heirhabarov/hunting-for-privilege-escalation-in-windows-environment
  - https://foxglovesecurity.com/2016/09/26/rotten-potato-privilege-escalation-from-service-accounts-to-system/
  - https://github.com/antonioCoco/RogueWinRM
  - https://twitter.com/Cyb3rWard0g/status/1453123054243024897
  - https://attack.mitre.org/techniques/T1134/002/

response:
  message: >
    Suspicious Child Process Created as System detected on host $agent_name$.
    Matched data_win_eventdata_parentUser: $data_win_eventdata_parentUser$.
    Matched data_win_eventdata_user: $data_win_eventdata_user$. MITRE ATT&CK:
    T1134.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_parentUser
      type: user
    - field: data_win_eventdata_user
      type: user

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1134.002
  custom_tags:
    - child
    - system
    - process_creation
    - sysmon
    - privilege_escalation
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_parentUser:/.*[Aa][Uu][Tt][Hh][Oo][Rr][Ii].*/ OR data_win_eventdata_parentUser:/.*[Aa][Uu][Tt][Oo][Rr][Ii].*/) AND (data_win_eventdata_parentUser:/.*\\[Nn][Ee][Tt][Ww][Oo][Rr][Kk] [Ss][Ee][Rr][Vv][Ii][Cc][Ee]/ OR data_win_eventdata_parentUser:/.*\\[Ll][Oo][Cc][Aa][Ll] [Ss][Ee][Rr][Vv][Ii][Cc][Ee]/) AND (data_win_eventdata_user:/.*[Aa][Uu][Tt][Hh][Oo][Rr][Ii].*/ OR data_win_eventdata_user:/.*[Aa][Uu][Tt][Oo][Rr][Ii].*/) AND (data_win_eventdata_user:/.*\\[Ss][Yy][Ss][Tt][Ee][Mm]/ OR data_win_eventdata_user:/.*\\[Ss][Yy][Ss][Tt][Èè][Mm][Ee]/ OR data_win_eventdata_user:/.*\\[Сс][Ии][Сс][Тт][Ее][Мм][Аа]/) AND (data_win_eventdata_integrityLevel:/[Ss][Yy][Ss][Tt][Ee][Mm]/ OR data_win_eventdata_integrityLevel:/[Ss]-1-16-16384/) AND _exists_:data_win_eventdata_image AND _exists_:data_win_eventdata_commandLine AND NOT (data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Dd][Aa][Vv][Ss][Ee][Tt][Cc][Oo][Oo][Kk][Ii][Ee].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 9bd04a79-dabe-4f1f-a5ff-92430265c96b
    name: Privilege Escalation via Named Pipe Impersonation
    reason: Named-pipe impersonation is the classic way a service-account process (LOCAL/NETWORK SERVICE) obtains SYSTEM; likely mechanism behind the SYSTEM child.
  - id: e8d34729-86a4-4140-adfd-0a29c2106307
    name: HackTool - CoercedPotato Execution
    reason: Potato-family tooling run from a service-account context yields exactly this service-account-to-SYSTEM child process.
  - id: 6bd75993-9888-4f91-9404-e1e4e4e34b77
    name: HackTool - LocalPotato Execution
    reason: Another potato-style token-impersonation tool producing a SYSTEM child from a low-privileged service context.
  - id: 178e615d-e666-498b-9630-9ed363038101
    name: Elevated System Shell Spawned From Uncommon Parent Location
    reason: A SYSTEM shell from an odd parent is the same outcome seen from the shell side; confirms the escalated shell.
  - id: c248c896-e412-4279-8c15-1c558067b6fa
    name: Enumerate All Information With Whoami.EXE
    reason: whoami /all (checking SeImpersonate/SYSTEM) typically precedes or follows a successful token elevation.
  - id: 17a1be64-8d88-40bf-b5ff-a4f7a50ebcc8
    name: Suspicious New Service Creation
    reason: With SYSTEM obtained, attackers commonly install a service for persistence.
  - id: cd219ff3-fa99-45d4-8380-a7d15116c6dc
    name: New User Created Via Net.EXE
    reason: SYSTEM-level post-exploitation often adds a local backdoor account.
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: SYSTEM rights enable LSASS dumping, the usual credential-access follow-on.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Privilege/impersonation recon (whoami /priv, /all) on host
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Ww][Hh][Oo][Aa][Mm][Ii]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*/[Pp][Rr][Ii][Vv].*/ OR data_win_eventdata_commandLine:/.*/[Aa][Ll][Ll].*/)
    pivot_on: host
    window: 2h
  - name: Potato / token-impersonation tooling by name or argument
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*(\\[Jj][Uu][Ii][Cc][Yy][Pp][Oo][Tt][Aa][Tt][Oo]\.[Ee][Xx][Ee]|\\[Rr][Oo][Gg][Uu][Ee][Pp][Oo][Tt][Aa][Tt][Oo]\.[Ee][Xx][Ee]|\\[Pp][Rr][Ii][Nn][Tt][Ss][Pp][Oo][Oo][Ff][Ee][Rr]\.[Ee][Xx][Ee]|\\[Ss][Ww][Ee][Ee][Tt][Pp][Oo][Tt][Aa][Tt][Oo]\.[Ee][Xx][Ee]|\\[Gg][Oo][Dd][Pp][Oo][Tt][Aa][Tt][Oo]\.[Ee][Xx][Ee]|\\[Rr][Oo][Gg][Uu][Ee][Ww][Ii][Nn][Rr][Mm]\.[Ee][Xx][Ee]|\\[Cc][Oo][Ee][Rr][Cc][Ee][Dd][Pp][Oo][Tt][Aa][Tt][Oo]\.[Ee][Xx][Ee]|\\[Ll][Oo][Cc][Aa][Ll][Pp][Oo][Tt][Aa][Tt][Oo]\.[Ee][Xx][Ee])/ OR (data_win_eventdata_commandLine:/.*[Pp][Rr][Ii][Nn][Tt][Ss][Pp][Oo][Oo][Ff][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Gg][Oo][Dd][Pp][Oo][Tt][Aa][Tt][Oo].*/ OR data_win_eventdata_commandLine:/.*[Jj][Uu][Ii][Cc][Yy][Pp][Oo][Tt][Aa][Tt][Oo].*/ OR data_win_eventdata_commandLine:/.*[Rr][Oo][Gg][Uu][Ee][Pp][Oo][Tt][Aa][Tt][Oo].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ww][Ee][Ee][Tt][Pp][Oo][Tt][Aa][Tt][Oo].*/ OR data_win_eventdata_commandLine:/.*[Rr][Oo][Gg][Uu][Ee][Ww][Ii][Nn][Rr][Mm].*/))
    pivot_on: host
    window: 2h
  - name: Local account creation or admin-group changes after SYSTEM
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Nn][Ee][Tt]\.[Ee][Xx][Ee]|\\[Nn][Ee][Tt]1\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.* [Uu][Ss][Ee][Rr] .*/ OR data_win_eventdata_commandLine:/.* [Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp] .*/) AND (data_win_eventdata_commandLine:/.*/[Aa][Dd][Dd].*/)
    pivot_on: host
    window: 4h
  - name: Service installation or modification (sc create / config)
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Ss][Cc]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.* [Cc][Rr][Ee][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.* [Cc][Oo][Nn][Ff][Ii][Gg].*/ OR data_win_eventdata_commandLine:/.*[Bb][Ii][Nn][Pp][Aa][Tt][Hh].*/)
    pivot_on: host
    window: 4h
  - name: Process access to LSASS (credential access)
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
