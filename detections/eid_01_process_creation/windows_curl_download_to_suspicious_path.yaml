name: Windows Curl Download to Suspicious Path
id: windows-curl-download-suspicious-path-001
version: 1
schema_version: "1.0"
date: "2026-02-23"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects curl.exe downloading files to suspicious locations including AppData, 
  ProgramData, Public, Temp, and PerfLogs directories. This technique is used by 
  IcedID, Black Basta, APT37, Forest Blizzard, and Salt Typhoon for initial 
  payload staging and ingress tool transfer.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - wildcard:
            data_win_eventdata_image: "*\\\\curl.exe"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine: "*-O *"
              - wildcard:
                  data_win_eventdata_commandLine: "*--output*"
              - wildcard:
                  data_win_eventdata_commandLine: "*-o *"
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine: "*\\\\AppData\\\\*"
              - wildcard:
                  data_win_eventdata_commandLine: "*\\\\ProgramData\\\\*"
              - wildcard:
                  data_win_eventdata_commandLine: "*\\\\Users\\\\Public\\\\*"
              - wildcard:
                  data_win_eventdata_commandLine: "*\\\\Temp\\\\*"
              - wildcard:
                  data_win_eventdata_commandLine: "*\\\\PerfLogs\\\\*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-23 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-23 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Windows endpoints with Sysmon 
  installed and configured to log process creation events (EventID 1) with full 
  command-line arguments.

known_false_positives: >
  Administrators may use curl.exe for legitimate downloads. Filter by user 
  context and destination URL. Validate the downloaded file and parent process.

references:
  - https://attack.mitre.org/techniques/T1105/
  - https://thedfirreport.com/2021/10/18/icedid-to-xinglocker-ransomware-in-24-hours/

response:
  message: >
    Curl download to suspicious path on $agent_name$. 
    Command: $data_win_eventdata_commandLine$. 
    Parent: $data_win_eventdata_parentImage$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1105
  risk_score: 72
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 72
  threat_objects: []

tags:
  analytic_story:
    - IcedID
    - Black Basta Ransomware
    - APT37 Rustonotto and FadeStealer
    - Forest Blizzard
    - Salt Typhoon
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1105
  custom_tags:
    - curl
    - download
    - ingress_tool_transfer
    - suspicious_path
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\\\curl\.exe/ AND (data_win_eventdata_commandLine:/.*-O .*/ OR data_win_eventdata_commandLine:/.*--output.*/ OR data_win_eventdata_commandLine:/.*-o .*/) AND (data_win_eventdata_commandLine:/.*\\\\AppData\\\\.*/ OR data_win_eventdata_commandLine:/.*\\\\ProgramData\\\\.*/ OR data_win_eventdata_commandLine:/.*\\\\Users\\\\Public\\\\.*/ OR data_win_eventdata_commandLine:/.*\\\\Temp\\\\.*/ OR data_win_eventdata_commandLine:/.*\\\\PerfLogs\\\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 21dd6d38-2b18-4453-9404-a0fe4a0cc288
    name: Curl Download And Execute Combination
    reason: 'Direct follow-on: the dropped payload is launched in the same command chain after the curl download.'
  - id: 9cc85849-3b02-4cb5-b371-3a1ff54f2218
    name: File Download From IP URL Via Curl.EXE
    reason: Same staging step when the payload host is a bare IP, a stronger infrastructure indicator.
  - id: 85de1f22-d189-44e4-8239-dc276b45379b
    name: Curl Web Request With Potential Custom User-Agent
    reason: Custom User-Agent on curl often accompanies the same loader download to evade proxy filtering.
  - id: cb9cc1d1-e84e-4bdc-b7ad-c31b1b7908ec
    name: Insecure Transfer Via Curl.EXE
    reason: Plain-HTTP curl transfer indicates the same untrusted payload retrieval.
  - id: 1d174d38-8fda-4081-a9b6-56d9763c0cd8
    name: Scheduled Task Creation with Curl and PowerShell Execution Combo
    reason: 'Persistence follow-on: scheduled task re-launching the curl-fetched payload.'
  - id: 2ddef153-167b-4e89-86b6-757a9e65dcac
    name: File Download Via Bitsadmin To A Suspicious Target Folder
    reason: Alternate downloader (bitsadmin) to the same suspicious folders, used as redundancy when curl is blocked.
  - id: 81325ce1-be01-4250-944f-b4789644556f
    name: Schedule Task Creation From Env Variable Or Potentially Suspicious Path Via Schtasks.EXE
    reason: Schtasks pointing at AppData/Temp/ProgramData paths persists the downloaded binary.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Execution from the download staging directories
    query: data_win_system_eventID:1 AND data_win_eventdata_image:(/.*[Aa]pp[Dd]ata.*/ OR /.*[Pp]rogram[Dd]ata.*/ OR /.*[Uu]sers.[Pp]ublic.*/ OR /.*[Tt]emp.*/ OR /.*[Pp]erf[Ll]ogs.*/) AND NOT data_win_eventdata_image:/.*curl.exe/
    pivot_on: host
    window: 2h
  - name: Files created by curl in staging dirs
    query: data_win_system_eventID:11 AND data_win_eventdata_image:/.*curl.exe/
    pivot_on: host
    window: 1h
  - name: Outbound connections from curl
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*curl.exe/
    pivot_on: host
    window: 1h
  - name: Persistence set up after payload staging
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss].*[Cc][Rr][Ee][Aa][Tt][Ee].*/ OR /.*CurrentVersion.Run.*/)
    pivot_on: host
    window: 4h
  - name: Other ingress-tool downloaders
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn].*transfer.*/ OR /.*[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll].*urlcache.*/ OR /.*[Ii]nvoke-[Ww]eb[Rr]equest.*/ OR /.*DownloadFile.*/)
    pivot_on: host
    window: 4h
