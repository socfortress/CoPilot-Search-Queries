name: HackTool - Default PowerSploit/Empire Scheduled Task Creation
id: 56c217c3-2de2-479b-990f-5c109ba8458f
version: 1
schema_version: "1.0"
date: "2023-03-03"
author: Markus Neis, @Karneades
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 56c217c3-2de2-479b-990f-5c109ba8458f
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the creation of a schtask via PowerSploit or Empire Default
  Configuration. MITRE ATT&CK: T1053.005, T1059.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\powershell.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\pwsh.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\schtasks.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*/Create*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*powershell.exe -NonI*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*/TN Updater /TR*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*/SC ONLOGON*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*/SC DAILY /ST*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*/SC ONIDLE*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*/SC HOURLY*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\powershell.exe'; data_win_eventdata_parentImage matches '*\pwsh.exe';
  data_win_eventdata_image matches '*\schtasks.exe', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/0xdeadbeefJERKY/PowerSploit/blob/8690399ef70d2cad10213575ac67e8fa90ddf7c3/Persistence/Persistence.psm1
  - https://github.com/EmpireProject/Empire/blob/08cbd274bef78243d7a8ed6443b8364acd1fc48b/lib/modules/powershell/persistence/userland/schtasks.py
  - https://attack.mitre.org/techniques/T1053/005/
  - https://attack.mitre.org/techniques/T1059/001/

response:
  message: >
    HackTool - Default PowerSploit/Empire Scheduled Task Creation detected on
    host $agent_name$. Matched data_win_eventdata_parentImage:
    $data_win_eventdata_parentImage$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1053.005, T1059.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1053.005
    - T1059.001
  custom_tags:
    - hacktool
    - default
    - powersploit
    - process_creation
    - sysmon
    - execution
    - persistence
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/) AND data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*\/[Cc][Rr][Ee][Aa][Tt][Ee].*/ AND data_win_eventdata_commandLine:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee] -[Nn][Oo][Nn][Ii].*/ AND data_win_eventdata_commandLine:/.*\/[Tt][Nn] [Uu][Pp][Dd][Aa][Tt][Ee][Rr] \/[Tt][Rr].*/ AND (data_win_eventdata_commandLine:/.*\/[Ss][Cc] [Oo][Nn][Ll][Oo][Gg][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*\/[Ss][Cc] [Dd][Aa][Ii][Ll][Yy] \/[Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*\/[Ss][Cc] [Oo][Nn][Ii][Dd][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*\/[Ss][Cc] [Hh][Oo][Uu][Rr][Ll][Yy].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 79f4ede3-402e-41c8-bc3e-ebbf5f162581
    name: HackTool - Empire PowerShell Launch Parameters
    reason: Empire's launcher uses the same -NonI/hidden flags; the task relaunches that stager.
  - id: 3268b746-88d8-4cd3-bffc-30077d02c787
    name: HackTool - Empire PowerShell UAC Bypass
    reason: Empire persistence is often paired with its UAC bypass for elevated tasks.
  - id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
    name: PowerShell Download and Execution Cradles
    reason: The initial stager download cradle precedes the persistence step.
  - id: f2c64357-b1d2-41b7-849f-34d2682c0fad
    name: Suspicious Command Patterns In Scheduled Task Creation
    reason: Same schtasks /create persistence from a generic command-pattern angle.
  - id: 89ca78fd-b37c-4310-b3d3-81a023f83936
    name: Schtasks Creation Or Modification With SYSTEM Privileges
    reason: Empire tasks are commonly created as SYSTEM for privileged persistence.
  - id: c4eeeeae-89f4-43a7-8b48-8d1bdfa66c78
    name: Scheduled Task Executing Encoded Payload from Registry
    reason: Empire often stores its payload in a registry key the task executes.
  - id: 86588b36-c6d3-465f-9cee-8f9093e07798
    name: Scheduled Task Executing Payload from Registry
    reason: Registry-stored payload variant of the same persistence mechanism.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Encoded or hidden PowerShell launches
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Pp]ower[Ss]hell\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*(-[Ee]nc|-[Ee]ncodedcommand|-[Ww] +[Hh]idden|-[Nn]on[Ii]).*/
    pivot_on: host
    window: 4h
  - name: Schtasks create/run/change activity
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss]chtasks\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*\/([Cc]reate|[Rr]un|[Cc]hange).*/
    pivot_on: host
    window: 24h
  - name: Large registry value writes (payload storage)
    query: data_win_system_eventID:"13" AND data_win_eventdata_details:/.{200,}/
    pivot_on: host
    window: 4h
  - name: Outbound connections from PowerShell
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\[Pp]ower[Ss]hell\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 6h
