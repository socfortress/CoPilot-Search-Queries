name: HackTool - SysmonEOP Execution
id: 8a7e90c5-fe6e-45dc-889e-057fe4378bd9
version: 1
schema_version: "1.0"
date: "2024-11-23"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 8a7e90c5-fe6e-45dc-889e-057fe4378bd9
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of the PoC that can be used to exploit Sysmon
  CVE-2022-41120. MITRE ATT&CK: T1068.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\SysmonEOP.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=22F4089EB8ABA31E1BB162C6D9BF72E5*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=5123FA4C4384D431CD0D893EEB49BBEC*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_hashes
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\SysmonEOP.exe'; data_win_eventdata_hashes matches
  '*IMPHASH=22F4089EB8ABA31E1BB162C6D9BF72E5*'; data_win_eventdata_hashes
  matches '*IMPHASH=5123FA4C4384D431CD0D893EEB49BBEC*'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/Wh04m1001/SysmonEoP
  - https://attack.mitre.org/techniques/T1068/

response:
  message: >
    HackTool - SysmonEOP Execution detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_hashes: $data_win_eventdata_hashes$. MITRE ATT&CK: T1068
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_hashes
      type: file_hash

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1068
  custom_tags:
    - hacktool
    - sysmoneop
    - process_creation
    - sysmon
    - privilege_escalation
    - cve_2022_41120
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ss][Yy][Ss][Mm][Oo][Nn][Ee][Oo][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=22[Ff]4089[Ee][Bb]8[Aa][Bb][Aa]31[Ee]1[Bb][Bb]162[Cc]6[Dd]9[Bb][Ff]72[Ee]5.*/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=5123[Ff][Aa]4[Cc]4384[Dd]431[Cc][Dd]0[Dd]893[Ee][Ee][Bb]49[Bb][Bb][Ee][Cc].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 6d1058a4-407e-4f3a-a144-1968c11dc5c3
    name: Suspicious Sysmon as Execution Parent
    reason: The exploit yields a SYSTEM shell spawned via Sysmon; Sysmon as execution parent confirms success.
  - id: 87911521-7098-470b-a459-9a57fc80bdfd
    name: Sysmon Configuration Update
    reason: Sysmon configuration update is the neighbouring action against the same agent.
  - id: 4d7cda18-1b12-4e52-b45c-d28653210df8
    name: Sysmon Driver Unloaded Via Fltmc.EXE
    reason: Unloading the Sysmon driver is the defence-evasion follow-on once SYSTEM is obtained.
  - id: 37db85d1-b089-490a-a59a-c7b6f984f480
    name: Sysmon Discovery Via Default Driver Altitude Using Findstr.EXE
    reason: Sysmon discovery via driver altitude is the recon that precedes Sysmon-targeted attacks.
  - id: d522eca2-2973-4391-a3e0-ef0374321dae
    name: Abused Debug Privilege by Arbitrary Parent Processes
    reason: Debug privilege abuse is a common privilege-use step after elevation.
  - id: 5afee48e-67dd-4e03-a783-f74259dcf998
    name: Potential LSASS Process Dump Via Procdump
    reason: With SYSTEM, LSASS dumping via procdump is the typical credential theft follow-on.
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: LSASS dump via comsvcs is the alternate post-elevation credential theft.
  - id: 17a1be64-8d88-40bf-b5ff-a4f7a50ebcc8
    name: Suspicious New Service Creation
    reason: New service creation is common SYSTEM persistence after local privilege escalation.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Processes spawned with Sysmon as parent
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\([Ss][Yy][Ss][Mm][Oo][Nn]\.[Ee][Xx][Ee]|[Ss][Yy][Ss][Mm][Oo][Nn]64\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 2h
  - name: Sysmon service or driver tampering
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Yy][Ss][Mm][Oo][Nn] \-[Cc].*/ OR data_win_eventdata_commandLine:/.*[Ss][Yy][Ss][Mm][Oo][Nn]64 \-[Cc].*/ OR data_win_eventdata_commandLine:/.*[Ss][Yy][Ss][Mm][Oo][Nn] \-[Uu].*/ OR data_win_eventdata_commandLine:/.*[Ss][Yy][Ss][Mm][Oo][Nn]64 \-[Uu].*/ OR data_win_eventdata_commandLine:/.*[Ff][Ll][Tt][Mm][Cc] [Uu][Nn][Ll][Oo][Aa][Dd].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc] [Ss][Tt][Oo][Pp] [Ss][Yy][Ss][Mm][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc] [Dd][Ee][Ll][Ee][Tt][Ee] [Ss][Yy][Ss][Mm][Oo][Nn].*/)
    pivot_on: host
    window: 2h
  - name: Sysmon configuration change or service state events
    query: (data_win_system_eventID:"16" OR data_win_system_eventID:"4")
    pivot_on: host
    window: 2h
  - name: SYSTEM post-exploitation commands
    query: data_win_system_eventID:"1" AND data_win_eventdata_user:/.*(SYSTEM).*/ AND (data_win_eventdata_commandLine:/.*[Nn][Ee][Tt] [Uu][Ss][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt] [Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp] [Aa][Dd][Mm][Ii][Nn][Ii][Ss][Tt][Rr][Aa][Tt][Oo][Rr][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc] [Cc][Rr][Ee][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Gg] [Ss][Aa][Vv][Ee].*/)
    pivot_on: host
    window: 2h
  - name: Exploit binary written to disk
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Ss][Yy][Ss][Mm][Oo][Nn][Ee][Oo][Pp].*/)
    pivot_on: host
    window: 2h
