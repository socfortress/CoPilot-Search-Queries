name: Privilege Escalation via Named Pipe Impersonation
id: 9bd04a79-dabe-4f1f-a5ff-92430265c96b
version: 1
schema_version: "1.0"
date: "2022-12-30"
author: Tim Rauch, Elastic (idea)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 9bd04a79-dabe-4f1f-a5ff-92430265c96b
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a remote file copy attempt to a hidden network share. This may
  indicate lateral movement or data staging activity. MITRE ATT&CK: T1021.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\cmd.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\powershell.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "Cmd.Exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "PowerShell.EXE"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*echo*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine: "*>*"
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*\\\\\\\\.\\\\pipe\\\\*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches '*\cmd.exe';
  data_win_eventdata_image matches '*\powershell.exe';
  data_win_eventdata_originalFileName equals 'Cmd.Exe', among other conditions.

known_false_positives: >
  Other programs that cause these patterns (please report). Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://www.elastic.co/guide/en/security/current/privilege-escalation-via-named-pipe-impersonation.html
  - https://attack.mitre.org/techniques/T1021/

response:
  message: >
    Privilege Escalation via Named Pipe Impersonation detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1021
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1021
  custom_tags:
    - privilege
    - escalation
    - named
    - process_creation
    - sysmon
    - lateral_movement
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Ee][Cc][Hh][Oo].*/ AND data_win_eventdata_commandLine:/.*\>.*/ AND data_win_eventdata_commandLine:/.*\\\\\.\\[Pp][Ii][Pp][Ee]\\.*/

