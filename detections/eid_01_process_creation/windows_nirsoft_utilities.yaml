name: Windows NirSoft Utilities
id: Windows-NirSoft-Utilities
version: 9
schema_version: 1
date: '2025-12-13'
author: SOCFortress LLC
status: production
type: Hunting
description: >
  Detects execution of commonly abused NirSoft utilities on Windows systems.
  While legitimate tools, NirSoft utilities are frequently abused by adversaries
  for credential theft, password dumping, system reconnaissance, and data
  exfiltration. Associated with WhisperGate destructive malware and CISA TA18-201A.
  MITRE ATT&CK: T1588.002 (Obtain Capabilities: Tool).

data_source:
  - Sysmon EventID 1 (ProcessCreate)

search:
  query:
    bool:
      must:
        - term:
            agent_name: "AGENT_NAME"
        - term:
            agent_labels_customer: "CUSTOMER_CODE"
        - term:
            data_win_system_eventID: "1"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image: "*\\advancedrun.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\browserpasview.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\credentialsfileview.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\dialupass.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\iepv.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\mailpv.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\messengpass.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\netpass.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\networkpasswordrecovery.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\nirsoft.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\outlook passview.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\passwordfox.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\pspv.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\rdpv.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\routerpassview.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\sniffpass.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\vpnpass.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\webbrowserpassview.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\wirelesskeyview.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\wnetwatcher.exe"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "START_TIME"
              lte: "END_TIME"

parameters:
  - name: AGENT_NAME
    default: "DESKTOP-AM0HLGE"
  - name: CUSTOMER_CODE
    default: "lab"
  - name: START_TIME
    default: "now-24h"
  - name: END_TIME
    default: "now"

how_to_implement: >
  Requires Sysmon EventID 1 (ProcessCreate) flowing to the Wazuh Indexer.
  Field data_win_eventdata_image is confirmed working across all EventID 1
  detections in this environment. Field-validated based on established EventID 1
  detection patterns. Note: The original Splunk detection uses a lookup table
  (is_nirsoft_software) containing the full NirSoft binary list. This detection
  hardcodes the most commonly abused utilities. Expand the should clause with
  additional NirSoft binaries from http://www.nirsoft.net/ as needed.

known_false_positives: >
  False positives may be present in environments where NirSoft utilities are
  used legitimately by administrators. Filter by known approved paths or users
  as needed.

references:
  - https://www.cisa.gov/uscert/ncas/alerts/TA18-201A
  - http://www.nirsoft.net/
  - https://www.microsoft.com/security/blog/2022/01/15/destructive-malware-targeting-ukrainian-organizations/
  - https://attack.mitre.org/techniques/T1588/002/

response:
  message: >
    NirSoft utility execution detected on $agent_name$ by $data_win_eventdata_user$.
    Binary: $data_win_eventdata_image$.
    Parent: $data_win_eventdata_parentImage$.
    Command: $data_win_eventdata_commandLine$.
    MITRE ATT&CK: T1588.002
  risk_score: 40
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 40
    - field: data_win_eventdata_user
      type: user
      score: 40
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: parent_process_name
    - field: data_win_eventdata_image
      type: process_name

tags:
  analytic_story:
    - Data Destruction
    - WhisperGate
  asset_type: Endpoint
  mitre_attack_id:
    - T1588.002
  custom_tags:
    - nirsoft
    - credential_theft
    - password_dumping
    - reconnaissance
    - tool_abuse
  product:
    - Wazuh
  security_domain: endpoint

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: Windows-NirSoft-AdvancedRun
    name: Windows NirSoft AdvancedRun
    reason: AdvancedRun is the NirSoft launcher used to run payloads as SYSTEM/TrustedInstaller or with defenses off; alongside password tools it shows the toolkit being staged for privileged use.
  - id: detection-of-tools-built-by-nirsoft-001
    name: Detection of Tools Built by NirSoft
    reason: Broader NirSoft binary detection on the same host; confirms a wider NirSoft toolkit drop beyond the hardcoded list.
  - id: d0dae994-26c6-4d2d-83b5-b3c8b79ae513
    name: PUA - WebBrowserPassView Execution
    reason: WebBrowserPassView is the most abused tool in this list; a hit confirms browser credential harvesting.
  - id: 8ba484e8-4b97-11ec-b19a-acde48001122
    name: Possible Browser Pass View Parameter
    reason: Export switches (/stext, /scomma) used to dump recovered browser passwords to files for exfiltration.
  - id: 42b1a5b8-353f-4f10-b256-39de4467faff
    name: Harvesting Of Wifi Credentials Via Netsh.EXE
    reason: WirelessKeyView-style Wi-Fi key theft is commonly paired with native netsh harvesting on the same host.
  - id: 47147b5b-9e17-4d76-b8d2-7bac24c5ce1b
    name: Potential Browser Data Stealing
    reason: Direct copying of browser credential stores is a parallel path to the NirSoft browser tools.
  - id: 58f50261-c53b-4c88-bd12-1d71f12eda4c
    name: Windows Credential Manager Access via VaultCmd
    reason: Vault harvesting complements NirSoft tools such as CredentialsFileView and NetPass.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Password-export output files written by recovery tools
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*([Pp][Aa][Ss][Ss]|[Cc][Rr][Ee][Dd]|[Ww][Ii][Ff][Ii]|[Dd][Uu][Mm][Pp]).*\.([Tt][Xx][Tt]|[Cc][Ss][Vv]|[Hh][Tt][Mm][Ll]|[Xx][Mm][Ll]|[Jj][Ss][Oo][Nn])/
    pivot_on: host
    window: 2h
  - name: Password-recovery export switches in command lines
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*\/[Ss][Tt][Ee][Xx][Tt].*/ OR data_win_eventdata_commandLine:/.*\/[Ss][Cc][Oo][Mm][Mm][Aa].*/ OR data_win_eventdata_commandLine:/.*\/[Ss][Hh][Tt][Mm][Ll].*/ OR data_win_eventdata_commandLine:/.*\/[Ss][Xx][Mm][Ll].*/ OR data_win_eventdata_commandLine:/.*\/[Ss][Tt][Aa][Bb].*/ OR data_win_eventdata_commandLine:/.*\/[Ss][Aa][Vv][Ee][Dd][Ii][Rr][Ee][Cc][Tt].*/)
    pivot_on: host
    window: 2h
  - name: Archiving or staging of harvested data
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*(\\7[Zz]\.[Ee][Xx][Ee]|\\7[Zz][Aa]\.[Ee][Xx][Ee]|\\[Rr][Aa][Rr]\.[Ee][Xx][Ee]|\\[Ww][Ii][Nn][Rr][Aa][Rr]\.[Ee][Xx][Ee])/ OR (data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]\-[Aa][Rr][Cc][Hh][Ii][Vv][Ee].*/ OR data_win_eventdata_commandLine:/.*[Mm][Aa][Kk][Ee][Cc][Aa][Bb].*/))
    pivot_on: host
    window: 4h
  - name: Downloader tooling that could have staged the NirSoft binary
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*(\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]|\\[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee])/ OR (data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]\-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/))
    pivot_on: host
    window: 4h
  - name: Executables launched from user-writable staging paths
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Tt][Ee][Mm][Pp]\\|\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\|\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\|\\[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]\\).*\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
