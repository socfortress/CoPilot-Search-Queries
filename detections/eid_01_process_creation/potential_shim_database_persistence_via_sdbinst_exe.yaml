name: Potential Shim Database Persistence via Sdbinst.EXE
id: 517490a7-115a-48c6-8862-1a481504d5a8
version: 1
schema_version: "1.0"
date: "2023-12-06"
author: Markus Neis
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 517490a7-115a-48c6-8862-1a481504d5a8
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects installation of a new shim using sdbinst.exe. Adversaries may
  establish persistence and/or elevate privileges by executing malicious content
  triggered by application shims. MITRE ATT&CK: T1546.011.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\sdbinst.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "sdbinst.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*.sdb*"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_parentImage"
        - exists:
            field: "data_win_eventdata_commandLine"
        - bool:
            must_not:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_parentImage:
                          value: "*\\\\msiexec.exe"
                          case_insensitive: true
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*:\\\\Program Files (x86)\\\\IIS Express\\\\iisexpressshim.sdb*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*:\\\\Program Files\\\\IIS Express\\\\iisexpressshim.sdb*"
                                case_insensitive: true
                        minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\sdbinst.exe'; data_win_eventdata_originalFileName equals 'sdbinst.exe';
  data_win_eventdata_commandLine matches '*.sdb*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.mandiant.com/resources/blog/fin7-shim-databases-persistence
  - https://attack.mitre.org/techniques/T1546/011/

response:
  message: >
    Potential Shim Database Persistence via Sdbinst.EXE detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1546.011
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1546.011
  custom_tags:
    - database
    - persistence
    - sdbinst
    - process_creation
    - sysmon
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ss][Dd][Bb][Ii][Nn][Ss][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ss][Dd][Bb][Ii][Nn][Ss][Tt]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*\.[Ss][Dd][Bb].*/ AND _exists_:data_win_eventdata_parentImage AND _exists_:data_win_eventdata_commandLine AND NOT (data_win_eventdata_parentImage:/.*\\[Mm][Ss][Ii][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Ii][Ii][Ss] [Ee][Xx][Pp][Rr][Ee][Ss][Ss]\\[Ii][Ii][Ss][Ee][Xx][Pp][Rr][Ee][Ss][Ss][Ss][Hh][Ii][Mm]\.[Ss][Dd][Bb].*/ OR data_win_eventdata_commandLine:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Ii][Ii][Ss] [Ee][Xx][Pp][Rr][Ee][Ss][Ss]\\[Ii][Ii][Ss][Ee][Xx][Pp][Rr][Ee][Ss][Ss][Ss][Hh][Ii][Mm]\.[Ss][Dd][Bb].*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: ee63c85c-6d51-4d12-ad09-04e25877a947
    name: New Custom Shim Database Created
    reason: The .sdb file must be dropped to disk before sdbinst installs it; identifies the staging process and path.
  - id: 18ee686c-38a3-4f65-9f44-48a077141f42
    name: Uncommon Extension Shim Database Installation Via Sdbinst.EXE
    reason: Same sdbinst install technique with a disguised extension; co-occurs when the attacker evades .sdb filtering.
  - id: dfb5b4e8-91d0-4291-b40a-e3b0d3942c45
    name: Potential Persistence Via Shim Database Modification
    reason: Successful sdbinst install writes the custom shim registration keys; confirms the shim took effect.
  - id: 6b6976a3-b0e6-4723-ac24-ae38a737af41
    name: Potential Persistence Via Shim Database In Uncommon Location
    reason: Registry confirmation that the installed shim database sits in a non-standard path.
  - id: bf344fea-d947-4ef4-9192-34d008315d3a
    name: Suspicious Shim Database Patching Activity
    reason: Shim patching of a target application follows installation and shows the injection target.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Shim database file creation
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*[Ss][Dd][Bb]/
    pivot_on: host
    window: 4h
  - name: AppCompat custom shim registry writes
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*[Aa]pp[Cc]ompat[Ff]lags.*(Custom|InstalledSDB).*/
    pivot_on: host
    window: 4h
  - name: Download or shell activity referencing sdb
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*(powershell|cmd|certutil|bitsadmin|curl)\.exe/ AND data_win_eventdata_commandLine:/.*(http|\.sdb).*/
    pivot_on: host
    window: 2h
  - name: Repeat sdbinst use
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Ss]dbinst\.exe/
    pivot_on: host
    window: 24h
