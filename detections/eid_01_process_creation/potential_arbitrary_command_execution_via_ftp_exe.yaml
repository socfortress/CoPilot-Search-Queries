name: Potential Arbitrary Command Execution Via FTP.EXE
id: 06b401f4-107c-4ff9-947f-9ec1e7649f1e
version: 1
schema_version: "1.0"
date: "2024-04-23"
author: Victor Sergeev, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 06b401f4-107c-4ff9-947f-9ec1e7649f1e
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of "ftp.exe" script with the "-s" or "/s" flag and any child
  processes ran by "ftp.exe". MITRE ATT&CK: T1059, T1202.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\ftp.exe"
                    case_insensitive: true
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\ftp.exe"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_originalFileName:
                                value: "ftp.exe"
                                case_insensitive: true
                        minimum_should_match: 1
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*-s:*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*/s:*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*–s:*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*—s:*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*―s:*"
                                case_insensitive: true
                        minimum_should_match: 1
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\ftp.exe'; data_win_eventdata_image matches '*\ftp.exe';
  data_win_eventdata_originalFileName equals 'ftp.exe', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://lolbas-project.github.io/lolbas/Binaries/Ftp/
  - https://attack.mitre.org/techniques/T1059/
  - https://attack.mitre.org/techniques/T1202/

response:
  message: >
    Potential Arbitrary Command Execution Via FTP.EXE detected on host
    $agent_name$. Matched data_win_eventdata_parentImage:
    $data_win_eventdata_parentImage$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1059, T1202
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059
    - T1202
  custom_tags:
    - arbitrary
    - process_creation
    - sysmon
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Ff][Tt][Pp]\.[Ee][Xx][Ee]/ OR ((data_win_eventdata_image:/.*\\[Ff][Tt][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ff][Tt][Pp]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*-[Ss]:.*/ OR data_win_eventdata_commandLine:/.*\/[Ss]:.*/ OR data_win_eventdata_commandLine:/.*–[Ss]:.*/ OR data_win_eventdata_commandLine:/.*—[Ss]:.*/ OR data_win_eventdata_commandLine:/.*―[Ss]:.*/)))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 277a4393-446c-449a-b0ed-7fdc7795244c
    name: Renamed FTP.EXE Execution
    reason: Renamed ftp.exe is the evasion form of the same LOLBin abuse; evidence of deliberate masquerade.
  - id: a85ffc3a-e8fd-4040-93bf-78aff284d801
    name: Use Of The SFTP.EXE Binary As A LOLBIN
    reason: Sister OpenSSH-client LOLBin for proxied command execution, often substituted when ftp.exe is blocked.
  - id: d059842b-6b9d-4ed1-b5c3-5b89143c6ede
    name: File Download Via Bitsadmin
    reason: Alternative native downloader used to fetch the same staged payload.
  - id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
    name: PowerShell Download and Execution Cradles
    reason: ftp -s scripts commonly download a payload that is then run via PowerShell cradles.
  - id: de587dce-915e-4218-aac4-835ca6af6f70
    name: Potential Persistence Attempt Via Run Keys Using Reg.EXE
    reason: Persistence typically follows once the ftp-delivered payload executes.
  - id: 81325ce1-be01-4250-944f-b4789644556f
    name: Schedule Task Creation From Env Variable Or Potentially Suspicious Path Via Schtasks.EXE
    reason: Scheduled task persistence for the dropped payload.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Child processes spawned by ftp.exe
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\([Ff][Tt][Pp]\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 1h
  - name: Network connections made by ftp.exe
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Ff][Tt][Pp]\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    - ip
    window: 1h
  - name: FTP command script built with echo
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Ee][Cc][Hh][Oo].*/ AND data_win_eventdata_commandLine:/.*([Oo][Pp][Ee][Nn]|[Bb][Yy][Ee]|[Gg][Ee][Tt] ).*/ AND data_win_eventdata_commandLine:/.*[Ff][Tt][Pp].*/
    pivot_on:
    - host
    window: 1h
  - name: Files written to disk by ftp.exe
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*\\([Ff][Tt][Pp]\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 2h
  - name: Executables launched from user-writable staging paths
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\(Users\\Public|ProgramData|Windows\\Temp|AppData\\Local\\Temp)\\.*\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
