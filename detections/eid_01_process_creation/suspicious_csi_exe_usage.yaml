name: Suspicious Csi.exe Usage
id: 40b95d31-1afc-469e-8d34-9a3a667d058e
version: 1
schema_version: "1.0"
date: "2022-07-11"
author: Konstantin Grishchenko, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 40b95d31-1afc-469e-8d34-9a3a667d058e
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Csi.exe is a signed binary from Microsoft that comes with Visual Studio and
  provides C# interactive capabilities. It can be used to run C# code from a
  file passed as a parameter in command line. Early version of this utility
  provided with Microsoft “Roslyn” Community Technology Preview was named
  'rcsi.exe'. MITRE ATT&CK: T1072, T1218.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\csi.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\rcsi.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "csi.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "rcsi.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - term:
            data_win_eventdata_company:
              value: "Microsoft Corporation"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_company
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches '*\csi.exe';
  data_win_eventdata_image matches '*\rcsi.exe';
  data_win_eventdata_originalFileName equals 'csi.exe', among other conditions.

known_false_positives: >
  Legitimate usage by software developers. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://lolbas-project.github.io/lolbas/OtherMSBinaries/Csi/
  - https://lolbas-project.github.io/lolbas/OtherMSBinaries/Rcsi/
  - https://enigma0x3.net/2016/11/21/bypassing-application-whitelisting-by-using-rcsi-exe/
  - https://twitter.com/Z3Jpa29z/status/1317545798981324801
  - https://attack.mitre.org/techniques/T1072/
  - https://attack.mitre.org/techniques/T1218/

response:
  message: >
    Suspicious Csi.exe Usage detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1072, T1218
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1072
    - T1218
  custom_tags:
    - process_creation
    - sysmon
    - lateral_movement
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Cc][Ss][Ii]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Cc][Ss][Ii]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Cc][Ss][Ii]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Rr][Cc][Ss][Ii]\.[Ee][Xx][Ee]/) AND data_win_eventdata_company:/[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt] [Cc][Oo][Rr][Pp][Oo][Rr][Aa][Tt][Ii][Oo][Nn]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d80d5c81-04ba-45b4-84e4-92eba40e0ad3
    name: Arbitrary DLL or Csproj Code Execution Via Dotnet.EXE
    reason: Another signed .NET toolchain binary used to proxy-execute attacker C# code; interchangeable with csi.exe.
  - id: 213b3148-24ea-11ec-93a2-acde48001122
    name: MSBuild Suspicious Spawned By Script Process
    reason: MSBuild inline tasks are the sibling Roslyn/.NET compile-and-run LOLBin technique.
  - id: 39ac1fb0-07f1-474b-b97e-c5c0eace0d79
    name: Potential MOVEit Transfer CVE-2023-34362 Exploitation - Dynamic Compilation Via Csc.EXE
    reason: Dynamic C# compilation via csc.exe is the same on-host compile-to-evade behaviour.
  - id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
    name: PowerShell Download and Execution Cradles
    reason: The .csx script passed to csi.exe is frequently fetched by a prior download cradle.
  - id: e218595b-bbe7-4ee5-8a96-f32a24ad3468
    name: Suspicious Curl.EXE Download
    reason: Script or payload staged via curl before being run by csi.exe.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: csi launches with script arguments
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*\\r?csi\.exe/
    pivot_on: host
    window: 4h
  - name: C# script or source files created
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\.(csx|cs|csproj)/
    pivot_on: host
    window: 4h
  - name: Shell or Office parents launching csi
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*\\(cmd|powershell|pwsh|wscript|cscript|mshta|winword|excel)\.exe/ AND data_win_eventdata_commandLine:/.*[Cc]si.*/
    pivot_on: host
    window: 2h
  - name: Network connections by csi
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*\\r?csi\.exe/
    pivot_on: host
    window: 2h
  - name: Child processes of csi
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*\\r?csi\.exe/
    pivot_on: host
    window: 2h
