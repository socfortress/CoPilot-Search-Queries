name: VolumeShadowCopy Symlink Creation Via Mklink
id: 40b19fa6-d835-400c-b301-41f3a2baacaf
version: 1
schema_version: "1.0"
date: "2023-03-06"
author: Teymur Kheirkhabarov, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 40b19fa6-d835-400c-b301-41f3a2baacaf
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: production
type: TTP

description: >
  Shadow Copies storage symbolic link creation using operating systems
  utilities. MITRE ATT&CK: T1003.002, T1003.003.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*mklink*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*HarddiskVolumeShadowCopy*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*mklink*'; data_win_eventdata_commandLine matches
  '*HarddiskVolumeShadowCopy*'.

known_false_positives: >
  Legitimate administrator working with shadow copies, access for backup
  purposes. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.slideshare.net/heirhabarov/hunting-for-credentials-dumping-in-windows-environment
  - https://attack.mitre.org/techniques/T1003/002/
  - https://attack.mitre.org/techniques/T1003/003/

response:
  message: >
    VolumeShadowCopy Symlink Creation Via Mklink detected on host $agent_name$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1003.002, T1003.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.002
    - T1003.003
  custom_tags:
    - volumeshadowcopy
    - symlink
    - mklink
    - process_creation
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Mm][Kk][Ll][Ii][Nn][Kk].*/ AND data_win_eventdata_commandLine:/.*[Hh][Aa][Rr][Dd][Dd][Ii][Ss][Kk][Vv][Oo][Ll][Uu][Mm][Ee][Ss][Hh][Aa][Dd][Oo][Ww][Cc][Oo][Pp][Yy].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b17ea6f7-6e90-447e-a799-e6c0a493d6ce
    name: Shadow Copies Creation Using Operating Systems Utilities
    reason: A shadow copy must be created before it can be symlinked; direct precursor.
  - id: f57f8d16-1f39-4dcb-a604-6c73d9b54b3d
    name: Sensitive File Access Via Volume Shadow Copy Backup
    reason: 'Next step: reading SAM/SYSTEM/NTDS through the exposed shadow path.'
  - id: c73124a7-3e89-44a3-bdc1-25fe4df754b1
    name: Copy From VolumeShadowCopy Via Cmd.EXE
    reason: Copying files out of the linked shadow copy is the immediate follow-on.
  - id: e7be6119-fc37-43f0-ad4f-1f3f99be2f9f
    name: Copying Sensitive Files with Credential Data
    reason: Confirms credential-store files were harvested.
  - id: da63bc76-61ae-11eb-ae93-0242ac130002
    name: Ntdsutil Export NTDS
    reason: Alternative NTDS theft path on domain controllers; co-occurs in credential dumping.
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: Cleanup of shadow copies after use, or ransomware impact phase.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Shadow copy creation commands
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*[Cc][Rr][Ee][Aa][Tt][Ee].*[Ss][Hh][Aa][Dd][Oo][Ww].*/ OR data_win_eventdata_commandLine:/.*[Ss][Hh][Aa][Dd][Oo][Ww][Cc][Oo][Pp][Yy].*[Cc][Aa][Ll][Ll].*[Cc][Rr][Ee][Aa][Tt][Ee].*/)
    pivot_on: host
    window: 2h
  - name: Credential hive/NTDS copy commands
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ss][Aa][Mm]|[Ss][Yy][Ss][Tt][Ee][Mm]|[Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt]|[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]).*/ AND data_win_eventdata_commandLine:/.*([Cc][Oo][Pp][Yy]|[Xx][Cc][Oo][Pp][Yy]|[Rr][Oo][Bb][Oo][Cc][Oo][Pp][Yy]|[Ee][Ss][Ee][Nn][Tt][Uu][Tt][Ll]).*/
    pivot_on: host
    window: 2h
  - name: Registry hive save
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\reg\.exe/ AND data_win_eventdata_commandLine:/.*[Ss][Aa][Vv][Ee].*(SAM|SYSTEM|SECURITY).*/
    pivot_on: host
    window: 2h
  - name: Archiving/staging of dumped files
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\(7z|rar|winrar)\.exe/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]-[Aa][Rr][Cc][Hh][Ii][Vv][Ee].*/)
    pivot_on: host
    window: 4h
