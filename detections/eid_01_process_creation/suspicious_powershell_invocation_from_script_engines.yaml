name: Suspicious PowerShell Invocation From Script Engines
id: 95eadcb2-92e4-4ed1-9031-92547773a6db
version: 1
schema_version: "1.0"
date: "2023-01-05"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 95eadcb2-92e4-4ed1-9031-92547773a6db
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious powershell invocations from interpreters or unusual
  programs. MITRE ATT&CK: T1059.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\wscript.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\cscript.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\powershell.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\pwsh.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_currentDirectory"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_currentDirectory:
                    value: "*\\\\Health Service State\\\\*"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_image
    - data_win_eventdata_currentDirectory
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\wscript.exe'; data_win_eventdata_parentImage matches '*\cscript.exe';
  data_win_eventdata_image matches '*\powershell.exe', among other conditions.

known_false_positives: >
  Microsoft Operations Manager (MOM). Other scripts. Baseline expected activity
  in your environment and tune this detection before relying on it for automated
  response.

references:
  - https://www.securitynewspaper.com/2017/03/20/attackers-leverage-excel-powershell-dns-latest-non-malware-attack/
  - https://attack.mitre.org/techniques/T1059/001/

response:
  message: >
    Suspicious PowerShell Invocation From Script Engines detected on host
    $agent_name$. Matched data_win_eventdata_parentImage:
    $data_win_eventdata_parentImage$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1059.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
  custom_tags:
    - powershell
    - invocation
    - engines
    - process_creation
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/) AND _exists_:data_win_eventdata_currentDirectory AND NOT (data_win_eventdata_currentDirectory:/.*\\[Hh][Ee][Aa][Ll][Tt][Hh] [Ss][Ee][Rr][Vv][Ii][Cc][Ee] [Ss][Tt][Aa][Tt][Ee]\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b6676963-0353-4f88-90f5-36c20d443c6a
    name: Cscript/Wscript Potentially Suspicious Child Process
    reason: 'Other suspicious children of the same wscript/cscript host: the script is spawning more than PowerShell.'
  - id: cea72823-df4d-4567-950c-0b579eaf0846
    name: Potential Dropper Script Execution Via WScript/CScript/MSHTA
    reason: 'Dropper script executed via WScript/CScript/MSHTA: the script that launched this PowerShell.'
  - id: 99b7460d-c9f1-40d7-a316-1f36f61d52ee
    name: Cscript/Wscript Uncommon Script Extension Execution
    reason: 'Script engine run with a disguised extension: evasion in how the loader was started.'
  - id: 754ed792-634f-40ae-b3bc-e0448d33f695
    name: Suspicious PowerShell Parent Process
    reason: Same unusual-parent theme; confirms PowerShell was launched outside normal interactive use.
  - id: 208748f7-881d-47ac-a29c-07ea84bf691d
    name: Suspicious Outlook Child Process
    reason: Outlook spawning script hosts is a common phishing delivery preceding this.
  - id: 438025f9-5856-4663-83f7-52f878a70a50
    name: Suspicious Microsoft Office Child Process
    reason: Office macros dropping a script host that then calls PowerShell.
  - id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
    name: PowerShell Download and Execution Cradles
    reason: The PowerShell launched by the script usually downloads and runs the next stage.
  - id: 39019a4e-317f-4ce3-ae63-309a8c6b53c5
    name: Suspicious Scheduled Task Creation Involving Temp Folder
    reason: Scheduled task from a temp folder is the typical persistence for such script loaders.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other children of wscript/cscript
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\([Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt])\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Cc][Mm][Dd]|[Mm][Ss][Hh][Tt][Aa]|[Rr][Uu][Nn][Dd][Ll][Ll]32|[Rr][Ee][Gg][Ss][Vv][Rr]32|[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]|[Cc][Uu][Rr][Ll]|[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss])\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 4h
  - name: Script files written to user-writable paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\([Dd]ownloads|[Tt]emp|[Aa]pp[Dd]ata|[Pp]rogram[Dd]ata)\\.*\.([Jj][Ss][Ee]?|[Vv][Bb][Ss]|[Vv][Bb][Ee]|[Ww][Ss][Ff])/
    pivot_on: host
    window: 24h
  - name: Network connections from script hosts
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt])\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 4h
  - name: DNS lookups from script hosts
    query: data_win_system_eventID:"22" AND data_win_eventdata_image:/.*\\([Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt])\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 4h
  - name: Script host launched from mail or archive paths
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt])\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*([Cc]ontent\.[Oo]utlook|[Dd]ownloads|[Tt]emp\\[Rr]ar|7[Zz]ip).*/
    pivot_on: host
    window: 24h
