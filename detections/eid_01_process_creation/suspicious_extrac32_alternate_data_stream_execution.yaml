name: Suspicious Extrac32 Alternate Data Stream Execution
id: 4b13db67-0c45-40f1-aba8-66a1a7198a1e
version: 1
schema_version: "1.0"
date: "2022-12-30"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 4b13db67-0c45-40f1-aba8-66a1a7198a1e
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Extract data from cab file and hide it in an alternate data stream. MITRE
  ATT&CK: T1564.004.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*extrac32.exe*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*.cab*"
              case_insensitive: true
        - regexp:
            data_win_eventdata_commandLine: ".*(:[^\\\\]).*"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*extrac32.exe*'; data_win_eventdata_commandLine matches '*.cab*';
  data_win_eventdata_commandLine matches the regex /.*(:[^\\]).*/.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://lolbas-project.github.io/lolbas/Binaries/Extrac32/
  - https://attack.mitre.org/techniques/T1564/004/

response:
  message: >
    Suspicious Extrac32 Alternate Data Stream Execution detected on host
    $agent_name$. Matched data_win_eventdata_commandLine:
    $data_win_eventdata_commandLine$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1564.004
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1564.004
  custom_tags:
    - extrac32
    - alternate
    - stream
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Ee][Xx][Tt][Rr][Aa][Cc]32\.[Ee][Xx][Ee].*/ AND data_win_eventdata_commandLine:/.*\.[Cc][Aa][Bb].*/ AND data_win_eventdata_commandLine:/.*(:[^\\]).*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7f43c430-5001-4f8b-aaa9-c3b88f18fa5c
    name: Execute From Alternate Data Streams
    reason: The hidden stream written by extrac32 is later executed
  - id: windows-alternate-datastream-process-execution-001
    name: Windows Alternate DataStream - Process Execution
    reason: Process launched from an ADS follows the hiding step
  - id: 45a594aa-1fbd-4972-a809-ff5a99dd81b8
    name: Run PowerShell Script from ADS
    reason: Common payload type hidden in ADS
  - id: 6b369ced-4b1d-48f1-b427-fdc0de0790bd
    name: Suspicious Diantz Alternate Data Stream Execution
    reason: Sibling cabinet-tool ADS hiding technique
  - id: aa8e035d-7be4-48d3-a944-102aec04400d
    name: Suspicious Extrac32 Execution
    reason: Same binary used earlier to download or copy the cab
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Execution referencing alternate data streams
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[A-Za-z0-9]:[A-Za-z0-9_.-]+\.(exe|dll|ps1|js|vbs|hta|bat).*/
    pivot_on: host
    window: 4h
  - name: Stream hash events
    query: data_win_system_eventID:"15"
    pivot_on: host
    window: 4h
  - name: Cabinet and expand tools used on host
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Ee]xtrac32|[Ee]xpand|[Dd]iantz|[Mm]akecab)\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 4h
  - name: Interpreters or LOLBins making connections
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Pp]ower[Ss]hell|[Ww]script|[Cc]script|[Mm]shta|[Rr]undll32)\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 4h
