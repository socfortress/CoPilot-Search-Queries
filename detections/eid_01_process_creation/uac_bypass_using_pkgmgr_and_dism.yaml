name: UAC Bypass Using PkgMgr and DISM
id: a743ceba-c771-4d75-97eb-8a90f7f4844c
version: 1
schema_version: "1.0"
date: "2024-12-01"
author: Christian Burkard (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: a743ceba-c771-4d75-97eb-8a90f7f4844c
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the pattern of UAC Bypass using pkgmgr.exe and dism.exe (UACMe 23).
  MITRE ATT&CK: T1548.002.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_parentImage:
              value: "*\\\\pkgmgr.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\dism.exe"
              case_insensitive: true
        - bool:
            should:
              - term:
                  data_win_eventdata_integrityLevel:
                    value: "High"
                    case_insensitive: true
              - term:
                  data_win_eventdata_integrityLevel:
                    value: "System"
                    case_insensitive: true
              - term:
                  data_win_eventdata_integrityLevel:
                    value: "S-1-16-16384"
                    case_insensitive: true
              - term:
                  data_win_eventdata_integrityLevel:
                    value: "S-1-16-12288"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_image
    - data_win_eventdata_integrityLevel
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\pkgmgr.exe'; data_win_eventdata_image matches '*\dism.exe';
  data_win_eventdata_integrityLevel equals 'High', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/hfiref0x/UACME
  - https://attack.mitre.org/techniques/T1548/002/

response:
  message: >
    UAC Bypass Using PkgMgr and DISM detected on host $agent_name$. Matched
    data_win_eventdata_parentImage: $data_win_eventdata_parentImage$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1548.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1548.002
  custom_tags:
    - bypass
    - pkgmgr
    - process_creation
    - sysmon
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Pp][Kk][Gg][Mm][Gg][Rr]\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\[Dd][Ii][Ss][Mm]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_integrityLevel:/[Hh][Ii][Gg][Hh]/ OR data_win_eventdata_integrityLevel:/[Ss][Yy][Ss][Tt][Ee][Mm]/ OR data_win_eventdata_integrityLevel:/[Ss]-1-16-16384/ OR data_win_eventdata_integrityLevel:/[Ss]-1-16-12288/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: cce58e2c-988a-4319-9390-0daa9eefa3cd
    name: Windows Bypass UAC via Pkgmgr Tool
    reason: Same pkgmgr.exe bypass family; a different command-line variant fires alongside.
  - id: 853e74f9-9392-4935-ad3b-2e8c040dae86
    name: UAC Bypass Using DismHost
    reason: DismHost.exe from Temp is the DLL-hijack side of the pkgmgr/dism trick (UACMe 23).
  - id: 39ed3c80-e6a1-431b-9df3-911ac53d08a7
    name: UAC Bypass Using NTFS Reparse Point - Process
    reason: Another UACMe dism-hijack variant; attackers cycle methods when one fails.
  - id: d38d2fa4-98e6-4a24-aff1-410b0c9ad177
    name: HackTool - UACMe Akagi Execution
    reason: Akagi bundles UACMe 23 and is the usual launcher.
  - id: 178e615d-e666-498b-9630-9ed363038101
    name: Elevated System Shell Spawned From Uncommon Parent Location
    reason: Follow-on elevated shell once the bypass succeeds.
  - id: 43e32da2-fdd0-4156-90de-50dfd62636f9
    name: Dism Remove Online Package
    reason: Elevated dism abuse often continues with package removal such as security features.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: pkgmgr.exe or dism.exe execution with package arguments
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*\\[Pp][Kk][Gg][Mm][Gg][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Dd][Ii][Ss][Mm]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Dd][Ii][Ss][Mm][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:(/.*[Pp][Ee]386.*/ OR /.*[Ii]gnore[Cc]heck.*/ OR /.*[Aa]dd-[Pp]ackage.*/ OR /.*[Uu]nattend.*/)
    pivot_on: host
    window: 2h
  - name: Elevated shell spawned by pkgmgr/dism/DismHost
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:(/.*\\[Pp][Kk][Gg][Mm][Gg][Rr]\.[Ee][Xx][Ee]/ OR /.*\\[Dd][Ii][Ss][Mm]\.[Ee][Xx][Ee]/ OR /.*\\[Dd][Ii][Ss][Mm][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/) AND data_win_eventdata_image:(/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR /.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR /.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/) AND data_win_eventdata_integrityLevel:(High OR System)
    pivot_on: host
    window: 2h
  - name: DLL written to System32 or Temp (hijack payload)
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(/.*\\[Ss]ystem32\\.*\.[Dd][Ll][Ll]/ OR /.*\\[Tt]emp\\.*\.[Dd][Ll][Ll]/)
    pivot_on: host
    window: 2h
  - name: Defender exclusion or tamper commands
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Aa]dd-[Mm]p[Pp]reference.*[Ee]xclusion.*/ OR /.*[Ss]et-[Mm]p[Pp]reference.*([Dd]isable|[Ee]xclusion).*/ OR /.*[Dd]efender\\[Ee]xclusions.*/)
    pivot_on: host
    window: 4h
  - name: Credential dumping from elevated process
    query: data_win_system_eventID:1 AND data_win_eventdata_integrityLevel:(High OR System) AND data_win_eventdata_commandLine:(/.*[Ll][Ss][Aa][Ss][Ss].*/ OR /.*[Ss]ekurlsa.*/ OR /.*[Rr]eg.* save .*([Ss][Aa][Mm]|[Ss][Yy][Ss][Tt][Ee][Mm]).*/)
    pivot_on: host
    window: 6h
