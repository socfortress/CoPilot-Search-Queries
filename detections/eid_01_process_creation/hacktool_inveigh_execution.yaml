name: HackTool - Inveigh Execution
id: b99a1518-1ad5-4f65-bc95-1ffff97a8fd0
version: 1
schema_version: "1.0"
date: "2023-02-04"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: b99a1518-1ad5-4f65-bc95-1ffff97a8fd0
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the use of Inveigh a cross-platform .NET IPv4/IPv6
  machine-in-the-middle tool. MITRE ATT&CK: T1003.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\Inveigh.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "\\Inveigh.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "\\Inveigh.dll"
                    case_insensitive: true
              - term:
                  data_win_eventdata_description:
                    value: "Inveigh"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -SpooferIP*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -ReplyToIPs *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -ReplyToDomains *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -ReplyToMACs *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -SnifferIP*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_description
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\Inveigh.exe'; data_win_eventdata_originalFileName equals '\Inveigh.exe';
  data_win_eventdata_originalFileName equals '\Inveigh.dll', among other
  conditions.

known_false_positives: >
  Very unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/Kevin-Robertson/Inveigh
  - https://thedfirreport.com/2020/11/23/pysa-mespinoza-ransomware/
  - https://attack.mitre.org/techniques/T1003/001/

response:
  message: >
    HackTool - Inveigh Execution detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1003.001
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.001
  custom_tags:
    - hacktool
    - inveigh
    - process_creation
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ii][Nn][Vv][Ee][Ii][Gg][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/\\[Ii][Nn][Vv][Ee][Ii][Gg][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/\\[Ii][Nn][Vv][Ee][Ii][Gg][Hh]\.[Dd][Ll][Ll]/ OR data_win_eventdata_description:/[Ii][Nn][Vv][Ee][Ii][Gg][Hh]/ OR data_win_eventdata_commandLine:/.* -[Ss][Pp][Oo][Oo][Ff][Ee][Rr][Ii][Pp].*/ OR data_win_eventdata_commandLine:/.* -[Rr][Ee][Pp][Ll][Yy][Tt][Oo][Ii][Pp][Ss] .*/ OR data_win_eventdata_commandLine:/.* -[Rr][Ee][Pp][Ll][Yy][Tt][Oo][Dd][Oo][Mm][Aa][Ii][Nn][Ss] .*/ OR data_win_eventdata_commandLine:/.* -[Rr][Ee][Pp][Ll][Yy][Tt][Oo][Mm][Aa][Cc][Ss] .*/ OR data_win_eventdata_commandLine:/.* -[Ss][Nn][Ii][Ff][Ff][Ee][Rr][Ii][Pp].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e96253b8-6b3b-4f90-9e59-3b24b99cf9b4
    name: HackTool - KrbRelay Execution
    reason: Attackers pivot from LLMNR/NBNS spoofing to Kerberos relay when NTLM capture or cracking fails.
  - id: 12827a56-61a4-476a-a9cb-f3068f191073
    name: HackTool - KrbRelayUp Execution
    reason: Common follow-on privilege escalation via relay once machine-account authentication is captured.
  - id: a7664b14-75fb-4a50-a223-cb9bc0afbacf
    name: HackTool - RemoteKrbRelay Execution
    reason: Remote relay variant used with captured or coerced authentications.
  - id: 6c6d9280-e6d0-4b9d-80ac-254701b64916
    name: Potential NTLM Coercion Via Certutil.EXE
    reason: Coercion forces authentication toward the attacker host that Inveigh is poisoning or listening on.
  - id: 93671f99-04eb-4ab4-a161-70d446a84003
    name: Capture Credentials with Rpcping.exe
    reason: Another way to trigger NTLM auth toward an attacker listener to capture hashes.
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: Hash capture is commonly followed by credential tooling on the same box.
  - id: 7ec2c172-dceb-4c10-92c9-87c1881b7e18
    name: HackTool - Rubeus Execution
    reason: Captured credentials are turned into Kerberos tickets with Rubeus.
  - id: 8ce07472-496f-11ec-ab3b-3e22fbd008af
    name: Impacket Lateral Movement Commandline Parameters
    reason: Cracked or relayed credentials are typically used for remote execution next.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: 'Poisoner traffic: LLMNR, NBNS or mDNS ports by script/.NET hosts'
    query: data_win_system_eventID:"3" AND (data_win_eventdata_destinationPort:"5355" OR data_win_eventdata_destinationPort:"137" OR data_win_eventdata_destinationPort:"5353" OR data_win_eventdata_sourcePort:"5355" OR data_win_eventdata_sourcePort:"137") AND data_win_eventdata_image:/.*([Ii][Nn][Vv][Ee][Ii][Gg][Hh]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]|[Dd][Oo][Tt][Nn][Ee][Tt]).*/
    pivot_on: host
    window: 2h
  - name: Inveigh payload or output files written
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*([Ii][Nn][Vv][Ee][Ii][Gg][Hh]|[Nn][Tt][Ll][Mm][Vv]2|[Nn][Tt][Ll][Mm][Vv]1|[Cc][Ll][Ee][Aa][Rr][Tt][Ee][Xx][Tt]).*/
    pivot_on: host
    window: 4h
  - name: PowerShell loading or running Invoke-Inveigh
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ii][Nn][Vv][Oo][Kk][Ee]-[Ii][Nn][Vv][Ee][Ii][Gg][Hh]|[Ii][Nn][Vv][Ee][Ii][Gg][Hh].[Pp][Ss]1|-[Ss][Pp][Oo][Oo][Ff][Ee][Rr][Ii][Pp]|-[Ll][Ll][Mm][Nn][Rr]|-[Nn][Bb][Nn][Ss]|-[Mm][Dd][Nn][Ss]).*/
    pivot_on: host
    window: 2h
  - name: NTLM network logons possibly using captured credentials
    query: data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"9") AND data_win_eventdata_authenticationPackageName:"NTLM"
    pivot_on: user
    window: 4h
  - name: Credential access or relay tooling follow-on
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa]|[Kk][Rr][Bb][Rr][Ee][Ll][Aa][Yy]|[Rr][Uu][Bb][Ee][Uu][Ss]|[Nn][Tt][Ll][Mm][Rr][Ee][Ll][Aa][Yy][Xx]|[Hh][Aa][Ss][Hh][Cc][Aa][Tt]|[Ll][Ss][Aa][Ss][Ss]).*/
    pivot_on: host
    window: 6h
