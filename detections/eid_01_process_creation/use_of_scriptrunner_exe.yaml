name: Use of Scriptrunner.exe
id: 64760eef-87f7-4ed3-93fd-655668ea9420
version: 1
schema_version: "1.0"
date: "2022-07-01"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 64760eef-87f7-4ed3-93fd-655668ea9420
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  The "ScriptRunner.exe" binary can be abused to proxy execution through it and
  bypass possible whitelisting. MITRE ATT&CK: T1218.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\ScriptRunner.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "ScriptRunner.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* -appvscript *"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\ScriptRunner.exe'; data_win_eventdata_originalFileName equals
  'ScriptRunner.exe'; data_win_eventdata_commandLine matches '* -appvscript *'.

known_false_positives: >
  Legitimate use when App-v is deployed. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://lolbas-project.github.io/lolbas/Binaries/Scriptrunner/
  - https://attack.mitre.org/techniques/T1218/

response:
  message: >
    Use of Scriptrunner.exe detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1218
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218
  custom_tags:
    - scriptrunner
    - process_creation
    - sysmon
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ss][Cc][Rr][Ii][Pp][Tt][Rr][Uu][Nn][Nn][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ss][Cc][Rr][Ii][Pp][Tt][Rr][Uu][Nn][Nn][Ee][Rr]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.* -[Aa][Pp][Pp][Vv][Ss][Cc][Rr][Ii][Pp][Tt] .*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c363385c-f75d-4753-a108-c1a8e28bdbda
    name: Potential Manage-bde.wsf Abuse To Proxy Execution
    reason: Manage-bde.wsf proxy execution is another signed script-host LOLBin used to bypass allowlisting.
  - id: a0459f02-ac51-4c09-b511-b8c9203fc429
    name: Potential Process Execution Proxy Via CL_Invocation.ps1
    reason: CL_Invocation.ps1 proxy execution is a signed-script proxy of the same family.
  - id: 1e0e1a81-e79b-44bc-935b-ddb9c8006b3d
    name: Potential Script Proxy Execution Via CL_Mutexverifiers.ps1
    reason: CL_Mutexverifiers.ps1 proxy execution is a sibling signed-script launcher tried when one path is blocked.
  - id: 1fb76ab8-fa60-4b01-bddd-71e89bf555da
    name: Pubprn.vbs Proxy Execution
    reason: Pubprn.vbs proxy execution is a signed-script proxy often tested together for whitelist bypass.
  - id: 1c8774a0-44d4-4db0-91f8-e792359c70bd
    name: REGISTER_APP.VBS Proxy Execution
    reason: REGISTER_APP.VBS proxy execution is another signed-script proxy for allowlist bypass.
  - id: 45d3a03d-f441-458c-8883-df101a3bb146
    name: Launch-VsDevShell.PS1 Proxy Execution
    reason: Launch-VsDevShell.PS1 proxy execution is a signed PowerShell proxy used the same way.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Children of ScriptRunner.exe
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*([Ss][Cc][Rr][Ii][Pp][Tt][Rr][Uu][Nn][Nn][Ee][Rr]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 2h
  - name: Script hosts with policy bypass, hidden window or encoded command
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee])/ AND data_win_eventdata_commandLine:/.*(-[Ee][Pp]? ?[Bb][Yy][Pp][Aa][Ss][Ss]|-[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Tt][Yy][Ll][Ee].*[Hh][Ii][Dd][Dd][Ee][Nn]|-[Ee][Nn][Cc]).*/
    pivot_on: host
    window: 2h
  - name: Other signed-script proxy LOLBins
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Pp][Uu][Bb][Pp][Rr][Nn]|[Mm][Aa][Nn][Aa][Gg][Ee]-[Bb][Dd][Ee]|[Cc][Ll]_[Ii][Nn][Vv][Oo][Cc][Aa][Tt][Ii][Oo][Nn]|[Cc][Ll]_[Mm][Uu][Tt][Ee][Xx][Vv][Ee][Rr][Ii][Ff][Ii][Ee][Rr][Ss]|[Rr][Ee][Gg][Ii][Ss][Tt][Ee][Rr]_[Aa][Pp][Pp]|[Ss][Yy][Nn][Cc][Aa][Pp][Pp][Vv][Pp][Uu][Bb][Ll][Ii][Ss][Hh][Ii][Nn][Gg][Ss][Ee][Rr][Vv][Ee][Rr]).*/
    pivot_on: host
    window: 4h
  - name: Script payload files written to disk
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.([Pp][Ss]1|[Vv][Bb][Ss]|[Jj][Ss]|[Bb][Aa][Tt]|[Cc][Mm][Dd]|[Hh][Tt][Aa])/
    pivot_on: host
    window: 2h
