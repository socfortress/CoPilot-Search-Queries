name: Script Interpreter Spawning Credential Scanner - Windows
id: 0f60b28c-64dd-4e2c-9a63-5334d3e3a6e6
version: 1
schema_version: "1.0"
date: "2025-11-25"
author: Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 0f60b28c-64dd-4e2c-9a63-5334d3e3a6e6
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a script interpreter process (like node.js or bun) spawning a known
  credential scanning tool (e.g., trufflehog, gitleaks). This behavior is
  indicative of an attempt to find and steal secrets, as seen in the
  "Shai-Hulud: The Second Coming" campaign. MITRE ATT&CK: T1552, T1005,
  T1059.007.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\node.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\bun.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*trufflehog.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*gitleaks.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*trufflehog*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*gitleaks*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\node.exe'; data_win_eventdata_parentImage matches '*\bun.exe';
  data_win_eventdata_image matches '*trufflehog.exe', among other conditions.

known_false_positives: >
  Legitimate pre-commit hooks or CI/CD pipeline jobs that use a script to run a
  credential scanner as part of a security check. Baseline expected activity in
  your environment and tune this detection before relying on it for automated
  response.

references:
  - https://github.com/asyncapi/cli/blob/2efa4dff59bc3d3cecdf897ccf178f99b115d63d/bun_environment.js
  - https://www.stepsecurity.io/blog/sha1-hulud-the-second-coming-zapier-ens-domains-and-other-prominent-npm-packages-compromised
  - https://www.endorlabs.com/learn/shai-hulud-2-malware-campaign-targets-github-and-cloud-credentials-using-bun-runtime
  - https://semgrep.dev/blog/2025/digging-for-secrets-sha1-hulud-the-second-coming-of-the-npm-worm/
  - https://attack.mitre.org/techniques/T1552/
  - https://attack.mitre.org/techniques/T1005/
  - https://attack.mitre.org/techniques/T1059/007/

response:
  message: >
    Script Interpreter Spawning Credential Scanner - Windows detected on host
    $agent_name$. Matched data_win_eventdata_parentImage:
    $data_win_eventdata_parentImage$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1552, T1005, T1059.007
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1552
    - T1005
    - T1059.007
  custom_tags:
    - interpreter
    - spawning
    - credential
    - process_creation
    - sysmon
    - credential_access
    - collection
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Nn][Oo][Dd][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Bb][Uu][Nn]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_image:/.*[Tt][Rr][Uu][Ff][Ff][Ll][Ee][Hh][Oo][Gg]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Gg][Ii][Tt][Ll][Ee][Aa][Kk][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Tt][Rr][Uu][Ff][Ff][Ll][Ee][Hh][Oo][Gg].*/ OR data_win_eventdata_commandLine:/.*[Gg][Ii][Tt][Ll][Ee][Aa][Kk][Ss].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 5299fadf-f228-4526-8274-251db1960be9
    name: Shai-Hulud Malicious Bun Execution
    reason: The Shai-Hulud worm runs bun_environment.js, which launches TruffleHog; direct precursor in the same chain.
  - id: 540703fb-a874-4385-a9d6-7cd1bfab268c
    name: Shai-Hulud Malware Indicators - Windows
    reason: Worm artifacts on the same host confirm the scanner run is part of the npm worm.
  - id: 44030449-b0df-4c94-aae1-502359ab28ee
    name: PUA - TruffleHog Execution
    reason: TruffleHog execution under any parent corroborates secret harvesting.
  - id: 6640f31c-01ad-49b5-beb5-83498a5cd8bd
    name: Potential Arbitrary Code Execution Via Node.EXE
    reason: node.exe running inline code is the typical malicious npm postinstall entry point preceding the scanner.
  - id: afa71271-6a97-4e47-810f-83120fb1a4ce
    name: New Agent Skills Installation Attempt Via Node.EXE
    reason: Another node.exe-driven supply-chain technique that can appear on the same compromised host.
  - id: f6c27ecc-d890-4452-80e6-2e274a10e097
    name: Axios NPM Compromise Indicators - Windows
    reason: A distinct npm supply-chain compromise whose payload also runs from node.exe.
  - id: 5bac7a56-da88-4c27-922e-c81e113b20cb
    name: Github Self-Hosted Runner Execution
    reason: Shai-Hulud registers a self-hosted runner for persistence after stealing GitHub tokens.
  - id: e328cc73-f92a-42fb-b3fa-7c2cffda981a
    name: Curl File Upload To File Sharing Websites
    reason: Stolen secrets can be exfiltrated via curl uploads after the scan.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Credential scanner binaries or invocations
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*([Tt][Rr][Uu][Ff][Ff][Ll][Ee][Hh][Oo][Gg]|[Gg][Ii][Tt][Ll][Ee][Aa][Kk][Ss]).*/ OR data_win_eventdata_commandLine:/.*([Tt][Rr][Uu][Ff][Ff][Ll][Ee][Hh][Oo][Gg]|[Gg][Ii][Tt][Ll][Ee][Aa][Kk][Ss]).*/)
    pivot_on: host
    window: 24h
  - name: Children of node.exe and bun.exe
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Nn][Oo][Dd][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Bb][Uu][Nn]\.[Ee][Xx][Ee]/)
    pivot_on: host
    window: 4h
  - name: Outbound connections from node and bun
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*\\[Nn][Oo][Dd][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Bb][Uu][Nn]\.[Ee][Xx][Ee]/)
    pivot_on: host
    window: 4h
  - name: Shai-Hulud style artifacts in command lines
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Bb][Uu][Nn]_[Ee][Nn][Vv][Ii][Rr][Oo][Nn][Mm][Ee][Nn][Tt]|[Ss][Ee][Tt][Uu][Pp]_[Bb][Uu][Nn]|[Aa][Cc][Tt][Ii][Oo][Nn][Ss]-[Rr][Uu][Nn][Nn][Ee][Rr]).*/
    pivot_on: host
    window: 24h
  - name: Cloud and package credential file access
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*(\\.[Aa][Ww][Ss]\\[Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll][Ss]|\\.[Nn][Pp][Mm][Rr][Cc]|.[Gg][Ii][Tt]-[Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll][Ss]).*/
    pivot_on: host
    window: 6h
