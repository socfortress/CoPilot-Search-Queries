name: Suspicious Cabinet File Execution Via Msdt.EXE
id: dc4576d4-7467-424f-9eee-fd2b02855fe0
version: 1
schema_version: "1.0"
date: "2024-03-13"
author: Nasreddine Bencherchali (Nextron Systems), GossiTheDog, frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: dc4576d4-7467-424f-9eee-fd2b02855fe0
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of msdt.exe using the "cab" flag which could indicates
  suspicious diagcab files with embedded answer files leveraging CVE-2022-30190.
  MITRE ATT&CK: T1202.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\msdt.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "msdt.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -cab *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /cab *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* –cab *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* —cab *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* ―cab *"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\msdt.exe'; data_win_eventdata_originalFileName equals 'msdt.exe';
  data_win_eventdata_commandLine matches '* -cab *', among other conditions.

known_false_positives: >
  Legitimate usage of ".diagcab" files. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://twitter.com/nas_bench/status/1537896324837781506
  - https://github.com/GossiTheDog/ThreatHunting/blob/e85884abbf05d5b41efc809ea6532b10b45bd05c/AdvancedHuntingQueries/DogWalk-DiagCab
  - https://github.com/elastic/protections-artifacts/commit/746086721fd385d9f5c6647cada1788db4aea95f#diff-9015912909545e72ed42cbac4d1e96295e8964579c406d23fd9c47a8091576a0
  - https://irsl.medium.com/the-trouble-with-microsofts-troubleshooters-6e32fc80b8bd
  - https://attack.mitre.org/techniques/T1202/

response:
  message: >
    Suspicious Cabinet File Execution Via Msdt.EXE detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1202
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1202
  custom_tags:
    - cabinet
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Mm][Ss][Dd][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Mm][Ss][Dd][Tt]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.* -[Cc][Aa][Bb] .*/ OR data_win_eventdata_commandLine:/.* \/[Cc][Aa][Bb] .*/ OR data_win_eventdata_commandLine:/.* –[Cc][Aa][Bb] .*/ OR data_win_eventdata_commandLine:/.* —[Cc][Aa][Bb] .*/ OR data_win_eventdata_commandLine:/.* ―[Cc][Aa][Bb] .*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 258fc8ce-8352-443a-9120-8a11e4857fa5
    name: Potential Arbitrary Command Execution Using Msdt.EXE
    reason: Same msdt abuse family (Follina/answer file) executing arbitrary commands.
  - id: 9c8c7000-3065-44a8-a555-79bcba5d9955
    name: MSDT Execution Via Answer File
    reason: Companion msdt variant using answer file; same CVE-2022-30190 chain.
  - id: ec8c4047-fad9-416a-8c81-0f479353d7f6
    name: Diagnostic Library Sdiageng.DLL Loaded By Msdt.EXE
    reason: Confirms the diagnostic engine loaded and ran the cab content.
  - id: 318557a5-150c-4c8d-b70e-a9910e199857
    name: File Creation In Suspicious Directory By Msdt.EXE
    reason: msdt dropping payload files after cab execution.
  - id: bd1c6866-65fc-44b2-be51-5588fcff82b9
    name: Renamed Msdt.EXE Execution
    reason: Evasion variant of the same msdt invocation.
  - id: 2d9403d5-7927-46b7-8216-37ab7c9ec5e3
    name: Suspicious Set Value of MSDT in Registry (CVE-2022-30190)
    reason: Registry side of the msdt protocol abuse.
  - id: 868955d9-697e-45d4-a3da-360cefd7c216
    name: Potential Exploitation Attempt From Office Application
    reason: Office parent typically delivers the msdt call.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Children of msdt and sdiagnhost
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:(/.*\\(msdt|sdiagnhost)\.[Ee][Xx][Ee]/)
    pivot_on: host
    window: 2h
  - name: Cab and diagcab files created
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(/.*\.([Cc][Aa][Bb]|[Dd][Ii][Aa][Gg][Cc][Aa][Bb])/)
    pivot_on: host
    window: 4h
  - name: Office or browser launching msdt
    query: data_win_system_eventID:1 AND data_win_eventdata_image:(/.*\\msdt\.[Ee][Xx][Ee]/) AND data_win_eventdata_parentImage:(/.*\\(WINWORD|EXCEL|OUTLOOK|chrome|msedge|firefox|explorer)\.[Ee][Xx][Ee]/)
    pivot_on: host
    window: 2h
  - name: Network connections after msdt
    query: data_win_system_eventID:3 AND data_win_eventdata_image:(/.*\\(msdt|sdiagnhost|powershell|cmd)\.[Ee][Xx][Ee]/) AND data_win_eventdata_initiated:true
    pivot_on: host
    window: 2h
