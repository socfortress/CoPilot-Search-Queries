name: Suspicious Remote Child Process From Outlook
id: e212d415-0e93-435f-9e1a-f29005bb4723
version: 1
schema_version: "1.0"
date: "2023-02-09"
author: Markus Neis, Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: e212d415-0e93-435f-9e1a-f29005bb4723
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a suspicious child process spawning from Outlook where the image is
  located in a remote location (SMB/WebDav shares). MITRE ATT&CK: T1059, T1202.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_parentImage:
              value: "*\\\\outlook.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_image: "\\\\\\\\*"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\outlook.exe'; data_win_eventdata_image matches '\\*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/sensepost/ruler
  - https://www.fireeye.com/blog/threat-research/2018/12/overruled-containing-a-potentially-destructive-adversary.html
  - https://speakerdeck.com/heirhabarov/hunting-for-persistence-via-microsoft-exchange-server-or-outlook?slide=49
  - https://attack.mitre.org/techniques/T1059/
  - https://attack.mitre.org/techniques/T1202/

response:
  message: >
    Suspicious Remote Child Process From Outlook detected on host $agent_name$.
    Matched data_win_eventdata_parentImage: $data_win_eventdata_parentImage$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1059, T1202
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059
    - T1202
  custom_tags:
    - child
    - outlook
    - process_creation
    - sysmon
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Oo][Uu][Tt][Ll][Oo][Oo][Kk]\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/\\\\.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 208748f7-881d-47ac-a29c-07ea84bf691d
    name: Suspicious Outlook Child Process
    reason: Generic suspicious Outlook children often fire alongside a remote-image child from a phishing attachment.
  - id: a018fdc3-46a3-44e5-9afb-2cd4af1d4b39
    name: Suspicious Execution From Outlook Temporary Folder
    reason: Attachment opened from Outlook temp precedes launch of payload from a share.
  - id: fabb0e80-030c-4e3e-a104-d09676991ac3
    name: Suspicious File Created in Outlook Temporary Directory
    reason: 'Precursor: risky attachment written to the Outlook temp directory.'
  - id: 1412aa78-a24c-4abd-83df-767dfb2c5bbe
    name: Potentially Suspicious WebDAV LNK Execution
    reason: LNK/WebDAV is a typical email-delivered way to run an image from a remote share.
  - id: f0507c0f-a3a2-40f5-acc6-7f543c334993
    name: Suspicious File Execution From Internet Hosted WebDav Share
    reason: Same remote-hosted execution path seen on the endpoint.
  - id: 5cdb711b-5740-4fb2-ba88-f7945027afac
    name: Rundll32 UNC Path Execution
    reason: Follow-on staging of DLLs from the same UNC infrastructure.
  - id: 88a87a10-384b-4ad7-8871-2f9bf9259ce5
    name: Suspicious Regsvr32 Execution From Remote Share
    reason: Second-stage proxy execution from the remote share after the initial child.
  - id: 3f5491e2-8db8-496b-9e95-1029fce852d4
    name: Driver/DLL Installation Via Odbcconf.EXE
    reason: Alternate LOLBin for loading DLLs fetched from the attacker share.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Outlook descendants
    query: (data_win_eventdata_parentImage:/.*[Oo]utlook\.exe/) AND (data_win_eventdata_image:/.*(cmd|powershell|pwsh|wscript|cscript|mshta|rundll32|regsvr32)\.exe/)
    pivot_on: host
    window: 2h
  - name: Files created in Outlook temp
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*([Oo]utlook|INetCache).*/
    pivot_on: host
    window: 2h
  - name: Remote image / UNC executions
    query: data_win_system_eventID:1 AND data_win_eventdata_image:\\\\*
    pivot_on: host
    window: 4h
  - name: Outbound connections by dropped payload
    query: data_win_system_eventID:3 AND data_win_eventdata_initiated:true AND data_win_eventdata_image:/.*(Temp|AppData|ProgramData).*/
    pivot_on: host
    window: 2h
  - name: Persistence after execution
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*(CurrentVersion.Run|Outlook).*/
    pivot_on: host
    window: 4h
