name: PUA - NSudo Execution
id: 771d1eb5-9587-4568-95fb-9ec44153a012
version: 1
schema_version: "1.0"
date: "2023-02-13"
author: Florian Roth (Nextron Systems), Nasreddine Bencherchali
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 771d1eb5-9587-4568-95fb-9ec44153a012
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the use of NSudo tool for command execution. MITRE ATT&CK: T1569.002.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\NSudo.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\NSudoLC.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\NSudoLG.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "NSudo.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "NSudoLC.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "NSudoLG.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-U:S *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-U:T *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-U:E *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-P:E *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-M:S *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-M:H *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-U=S *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-U=T *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-U=E *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-P=E *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-M=S *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-M=H *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-ShowWindowMode:Hide*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\NSudo.exe'; data_win_eventdata_image matches '*\NSudoLC.exe';
  data_win_eventdata_image matches '*\NSudoLG.exe', among other conditions.

known_false_positives: >
  Legitimate use by administrators. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://web.archive.org/web/20221019044836/https://nsudo.m2team.org/en-us/
  - https://www.winhelponline.com/blog/run-program-as-system-localsystem-account-windows/
  - https://attack.mitre.org/techniques/T1569/002/

response:
  message: >
    PUA - NSudo Execution detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1569.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1569.002
  custom_tags:
    - nsudo
    - process_creation
    - sysmon
    - execution
    - s0029
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Nn][Ss][Uu][Dd][Oo]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Nn][Ss][Uu][Dd][Oo][Ll][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Nn][Ss][Uu][Dd][Oo][Ll][Gg]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Nn][Ss][Uu][Dd][Oo]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Nn][Ss][Uu][Dd][Oo][Ll][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Nn][Ss][Uu][Dd][Oo][Ll][Gg]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*-[Uu]:[Ss] .*/ OR data_win_eventdata_commandLine:/.*-[Uu]:[Tt] .*/ OR data_win_eventdata_commandLine:/.*-[Uu]:[Ee] .*/ OR data_win_eventdata_commandLine:/.*-[Pp]:[Ee] .*/ OR data_win_eventdata_commandLine:/.*-[Mm]:[Ss] .*/ OR data_win_eventdata_commandLine:/.*-[Mm]:[Hh] .*/ OR data_win_eventdata_commandLine:/.*-[Uu]=[Ss] .*/ OR data_win_eventdata_commandLine:/.*-[Uu]=[Tt] .*/ OR data_win_eventdata_commandLine:/.*-[Uu]=[Ee] .*/ OR data_win_eventdata_commandLine:/.*-[Pp]=[Ee] .*/ OR data_win_eventdata_commandLine:/.*-[Mm]=[Ss] .*/ OR data_win_eventdata_commandLine:/.*-[Mm]=[Hh] .*/ OR data_win_eventdata_commandLine:/.*-[Ss][Hh][Oo][Ww][Ww][Ii][Nn][Dd][Oo][Ww][Mm][Oo][Dd][Ee]:[Hh][Ii][Dd][Ee].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d9047477-0359-48c9-b8c7-792cedcdc9c4
    name: PUA - NirCmd Execution As LOCAL SYSTEM
    reason: Alternative SYSTEM-execution utility with the same escalation intent.
  - id: 7c0dcd3d-acf8-4f71-9570-f448b0034f94
    name: PsExec Service Child Process Execution as LOCAL SYSTEM
    reason: Another SYSTEM-context route.
  - id: 17769c90-230e-488b-a463-e05c08e9d48f
    name: Powershell Defender Exclusion
    reason: NSudo tokens are used to defeat Defender protections; exclusions follow.
  - id: b28e58e4-2a72-4fae-bdee-0fbe904db642
    name: Windows Defender Real-time Protection Disabled
    reason: NSudo -U:T/-U:S is a common way to disable tamper-protected Defender settings.
  - id: 1321dc4e-a1fe-481d-a016-52c45f0c8b4f
    name: Windows Defender Exclusions Added
    reason: Resulting exclusions confirm defense-evasion intent.
  - id: 85c312b7-f44d-4a51-a024-d671c40b49fc
    name: Service StartupType Change Via Sc.EXE
    reason: Elevated tokens used to disable security services.
  - id: d522eca2-2973-4391-a3e0-ef0374321dae
    name: Abused Debug Privilege by Arbitrary Parent Processes
    reason: Privilege abuse that accompanies token-impersonation tooling.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Processes spawned by NSudo
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Nn][Ss][Uu][Dd][Oo].*/
    pivot_on: host
    window: 2h
  - name: Defender and security service tampering
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR /.*[Aa][Dd][Dd]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR /.*[Ww][Ii][Nn][Dd][Ee][Ff][Ee][Nn][Dd].*/ OR /.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Aa][Nn][Tt][Ii][Ss][Pp][Yy][Ww][Aa][Rr][Ee].*/)
    pivot_on: host
    window: 2h
  - name: Registry edits to Defender keys
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr].*/
    pivot_on: host
    window: 2h
  - name: Service creation or stop
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ss][Cc] [Cc][Oo][Nn][Ff][Ii][Gg].*/ OR /.*[Ss][Cc] [Cc][Rr][Ee][Aa][Tt][Ee].*/ OR /.*[Ss][Cc] [Ss][Tt][Oo][Pp].*/ OR /.*[Nn][Ee][Tt] [Ss][Tt][Oo][Pp].*/)
    pivot_on: host
    window: 4h
  - name: NSudo binaries incl. renamed copies
    query: data_win_system_eventID:1 AND data_win_eventdata_originalFileName:/.*[Nn][Ss][Uu][Dd][Oo].*/
    pivot_on: host
    window: 24h
