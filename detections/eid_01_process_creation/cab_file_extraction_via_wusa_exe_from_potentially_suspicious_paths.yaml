name: Cab File Extraction Via Wusa.EXE From Potentially Suspicious Paths
id: c74c0390-3e20-41fd-a69a-128f0275a5ea
version: 1
schema_version: "1.0"
date: "2023-11-28"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: c74c0390-3e20-41fd-a69a-128f0275a5ea
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of the "wusa.exe" (Windows Update Standalone Installer)
  utility to extract ".cab" files using the "/extract" argument from potentially
  suspicious paths.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\wusa.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*/extract:*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*:\\\\PerfLogs\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*:\\\\Users\\\\Public\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*:\\\\Windows\\\\Temp\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Appdata\\\\Local\\\\Temp\\\\*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\wusa.exe'; data_win_eventdata_commandLine matches '*/extract:*';
  data_win_eventdata_commandLine matches '*:\PerfLogs\*', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://web.archive.org/web/20180331144337/https://www.fireeye.com/blog/threat-research/2018/03/sanny-malware-delivery-method-updated-in-recently-observed-attacks.html
  - https://www.echotrail.io/insights/search/wusa.exe/

response:
  message: >
    Cab File Extraction Via Wusa.EXE From Potentially Suspicious Paths detected
    on host $agent_name$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. Matched data_win_eventdata_commandLine:
    $data_win_eventdata_commandLine$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - extraction
    - paths
    - process_creation
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ww][Uu][Ss][Aa]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*\/[Ee][Xx][Tt][Rr][Aa][Cc][Tt]:.*/ AND (data_win_eventdata_commandLine:/.*:\\[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss]\\.*/ OR data_win_eventdata_commandLine:/.*:\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_commandLine:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: ef64fc9c-a45e-43cc-8fd8-7d75d73b4c99
    name: Wusa.EXE Executed By Parent Process Located In Suspicious Location
    reason: Wusa launched from a suspicious parent is the same abuse, often the other half of the staging chain.
  - id: 9f107a84-532c-41af-b005-8d12a607639f
    name: Potentially Suspicious Cabinet File Expansion
    reason: expand.exe is the alternate CAB extractor attackers use when wusa is blocked.
  - id: windows-cabinet-file-extraction-expand-001
    name: Windows Cabinet File Extraction Via Expand
    reason: Same cab-extraction primitive via expand.exe; indicates the payload staging path.
  - id: aa8e035d-7be4-48d3-a944-102aec04400d
    name: Suspicious Extrac32 Execution
    reason: Extrac32 is another built-in cab extractor used to unpack payloads to the same paths.
  - id: 185d7418-f250-42d0-b72e-0c8b70661e93
    name: Suspicious Diantz Download and Compress Into a CAB File
    reason: The cab being extracted may have been built or exfil-packed with diantz/makecab.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Files extracted to staging directories
    query: data_win_system_eventID:11 AND data_win_eventdata_image:/.*[Ww]usa\.exe/
    pivot_on: host
    window: 2h
  - name: Execution from PerfLogs, Public and Windows Temp
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*[Pp]erf[Ll]ogs.*/ OR data_win_eventdata_image:/.*[Uu]sers.[Pp]ublic.*/ OR data_win_eventdata_image:/.*[Ww]indows.[Tt]emp.*/)
    pivot_on: host
    window: 2h
  - name: CAB files dropped in writable paths
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\.[Cc][Aa][Bb]/ AND (data_win_eventdata_targetFilename:/.*[Tt]emp.*/ OR data_win_eventdata_targetFilename:/.*[Pp]ublic.*/ OR data_win_eventdata_targetFilename:/.*[Pp]erf[Ll]ogs.*/ OR data_win_eventdata_targetFilename:/.*[Dd]ownloads.*/)
    pivot_on: host
    window: 4h
  - name: Download tools preceding extraction
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*[Cc]url\.exe/ OR data_win_eventdata_image:/.*[Bb]its[Aa]dmin\.exe/ OR data_win_eventdata_image:/.*[Cc]ertutil\.exe/ OR data_win_eventdata_commandLine:/.*([Ii]nvoke-[Ww]eb[Rr]equest|[Dd]ownload[Ff]ile|[Ss]tart-[Bb]its[Tt]ransfer).*/)
    pivot_on: host
    window: 2h
