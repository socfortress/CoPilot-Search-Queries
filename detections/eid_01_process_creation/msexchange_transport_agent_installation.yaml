name: MSExchange Transport Agent Installation
id: 83809e84-4475-4b69-bc3e-4aad8568612f
version: 1
schema_version: "1.0"
date: "2022-10-09"
author: Tobias Michalski (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 83809e84-4475-4b69-bc3e-4aad8568612f
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the Installation of a Exchange Transport Agent. MITRE ATT&CK:
  T1505.002.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*Install-TransportAgent*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*Install-TransportAgent*'.

known_false_positives: >
  Legitimate installations of exchange TransportAgents. AssemblyPath is a good
  indicator for this. Baseline expected activity in your environment and tune
  this detection before relying on it for automated response.

references:
  - https://speakerdeck.com/heirhabarov/hunting-for-persistence-via-microsoft-exchange-server-or-outlook?slide=7
  - https://attack.mitre.org/techniques/T1505/002/

response:
  message: >
    MSExchange Transport Agent Installation detected on host $agent_name$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1505.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1505.002
  custom_tags:
    - msexchange
    - transport
    - agent
    - process_creation
    - sysmon
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Ii][Nn][Ss][Tt][Aa][Ll][Ll]-[Tt][Rr][Aa][Nn][Ss][Pp][Oo][Rr][Tt][Aa][Gg][Ee][Nn][Tt].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 25676e10-2121-446e-80a4-71ff8506af47
    name: Exchange PowerShell Snap-Ins Usage
    reason: Install-TransportAgent runs inside an Exchange Management Shell session loading the Exchange snap-in; same actor/session on the same Exchange server.
  - id: bbb2dedd-a0e3-46ab-ba6c-6c82ae7a9aa7
    name: HAFNIUM Exchange Exploitation Activity
    reason: Exchange server compromise (ProxyLogon) commonly precedes backdoor transport-agent persistence.
  - id: fa3c117a-bc0d-416e-a31b-0c0e80653efb
    name: Chopper Webshell Process Pattern
    reason: A webshell on the Exchange host is the usual way the attacker obtains rights to register a transport agent.
  - id: bed2a484-9348-4143-8a8a-b801c979301c
    name: Webshell Detection With Command Line Keywords
    reason: Webshell-driven command execution on the same server is the likely precursor.
  - id: 0649be4a-aeb0-45b0-b89e-7f1668f6d9c0
    name: IIS WebServer Log Deletion via CommandLine Utilities
    reason: Post-compromise log wiping on the IIS/Exchange host following persistence installation.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Transport agent cmdlets and Exchange management assemblies
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ee][Nn][Aa][Bb][Ll][Ee]-[Tt][Rr][Aa][Nn][Ss][Pp][Oo][Rr][Tt][Aa][Gg][Ee][Nn][Tt].*/ OR data_win_eventdata_commandLine:/.*[Gg][Ee][Tt]-[Tt][Rr][Aa][Nn][Ss][Pp][Oo][Rr][Tt][Aa][Gg][Ee][Nn][Tt].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt].[Ee][Xx][Cc][Hh][Aa][Nn][Gg][Ee].[Mm][Aa][Nn][Aa][Gg][Ee][Mm][Ee][Nn][Tt].*/)
    pivot_on: host
    window: 24h
  - name: IIS/Exchange worker spawning shells
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*([Ww]3[Ww][Pp]|[Uu][Mm][Ww][Oo][Rr][Kk][Ee][Rr][Pp][Rr][Oo][Cc][Ee][Ss][Ss])\.exe/ AND (data_win_eventdata_image:/.*[Cc][Mm][Dd].[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].[Ee][Xx][Ee]/)
    pivot_on: host
    window: 24h
  - name: Credential dumping tooling on host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss].*/ OR data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll].*/ OR data_win_eventdata_commandLine:/.*[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp].*/)
    pivot_on: host
    window: 24h
  - name: Mailbox export and mail forwarding rules
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Nn][Ee][Ww]-[Mm][Aa][Ii][Ll][Bb][Oo][Xx][Ee][Xx][Pp][Oo][Rr][Tt][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Ww]-[Ii][Nn][Bb][Oo][Xx][Rr][Uu][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ff][Oo][Rr][Ww][Aa][Rr][Dd][Ii][Nn][Gg][Ss][Mm][Tt][Pp][Aa][Dd][Dd][Rr][Ee][Ss][Ss].*/)
    pivot_on: host
    window: 24h
