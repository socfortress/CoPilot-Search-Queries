name: Potential Suspicious Windows Feature Enabled - ProcCreation
id: c740d4cf-a1e9-41de-bb16-8a46a4f57918
version: 1
schema_version: "1.0"
date: "2022-12-29"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: c740d4cf-a1e9-41de-bb16-8a46a4f57918
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects usage of the built-in PowerShell cmdlet
  "Enable-WindowsOptionalFeature" used as a Deployment Image Servicing and
  Management tool. Similar to DISM.exe, this cmdlet is used to enumerate,
  install, uninstall, configure, and update features and packages in Windows
  images.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*Enable-WindowsOptionalFeature*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*-Online*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*-FeatureName*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*TelnetServer*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Internet-Explorer-Optional-amd64*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*TFTP*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*SMB1Protocol*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Client-ProjFS*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Microsoft-Windows-Subsystem-Linux*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*Enable-WindowsOptionalFeature*'; data_win_eventdata_commandLine matches
  '*-Online*'; data_win_eventdata_commandLine matches '*-FeatureName*', among
  other conditions.

known_false_positives: >
  Legitimate usage of the features listed in the rule. Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://learn.microsoft.com/en-us/powershell/module/dism/enable-windowsoptionalfeature?view=windowsserver2022-ps
  - https://learn.microsoft.com/en-us/windows/win32/projfs/enabling-windows-projected-file-system
  - https://learn.microsoft.com/en-us/windows/wsl/install-on-server

response:
  message: >
    Potential Suspicious Windows Feature Enabled - ProcCreation detected on host
    $agent_name$. Matched data_win_eventdata_commandLine:
    $data_win_eventdata_commandLine$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - feature
    - proccreation
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Ee][Nn][Aa][Bb][Ll][Ee]-[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Oo][Pp][Tt][Ii][Oo][Nn][Aa][Ll][Ff][Ee][Aa][Tt][Uu][Rr][Ee].*/ AND data_win_eventdata_commandLine:/.*-[Oo][Nn][Ll][Ii][Nn][Ee].*/ AND data_win_eventdata_commandLine:/.*-[Ff][Ee][Aa][Tt][Uu][Rr][Ee][Nn][Aa][Mm][Ee].*/ AND (data_win_eventdata_commandLine:/.*[Tt][Ee][Ll][Nn][Ee][Tt][Ss][Ee][Rr][Vv][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Tt][Ee][Rr][Nn][Ee][Tt]-[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]-[Oo][Pp][Tt][Ii][Oo][Nn][Aa][Ll]-[Aa][Mm][Dd]64.*/ OR data_win_eventdata_commandLine:/.*[Tt][Ff][Tt][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ss][Mm][Bb]1[Pp][Rr][Oo][Tt][Oo][Cc][Oo][Ll].*/ OR data_win_eventdata_commandLine:/.*[Cc][Ll][Ii][Ee][Nn][Tt]-[Pp][Rr][Oo][Jj][Ff][Ss].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]-[Ww][Ii][Nn][Dd][Oo][Ww][Ss]-[Ss][Uu][Bb][Ss][Yy][Ss][Tt][Ee][Mm]-[Ll][Ii][Nn][Uu][Xx].*/)

correlation:
  # Authored by the correlation engine for review.
  enrichment_searches:
  # NEW ad-hoc searches the engine runs around an alert from this rule, scoped to
  # the alert's host/user/IP within the window (not existing CoPilot Searches).
    - name: "Sysmon activity on this host in the window"
      query: 'data_win_system_channel:"Microsoft-Windows-Sysmon/Operational"'
      pivot_on: [host]
      window: 1h
    - name: "Process creation on this host"
      query: 'data_win_system_eventID:"1"'
      pivot_on: [host]
      window: 1h
    - name: "Network connections from this host"
      query: 'data_win_system_eventID:"3"'
      pivot_on: [host]
      window: 1h
    - name: "High-severity alerts on this host"
      query: 'rule_level:>=10'
      pivot_on: [host]
      window: 1h
