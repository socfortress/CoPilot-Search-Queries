name: Potential Suspicious Windows Feature Enabled - ProcCreation
id: c740d4cf-a1e9-41de-bb16-8a46a4f57918
version: 1
schema_version: "1.0"
date: "2022-12-29"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: c740d4cf-a1e9-41de-bb16-8a46a4f57918
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects usage of the built-in PowerShell cmdlet
  "Enable-WindowsOptionalFeature" used as a Deployment Image Servicing and
  Management tool. Similar to DISM.exe, this cmdlet is used to enumerate,
  install, uninstall, configure, and update features and packages in Windows
  images.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*Enable-WindowsOptionalFeature*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*-Online*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*-FeatureName*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*TelnetServer*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Internet-Explorer-Optional-amd64*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*TFTP*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*SMB1Protocol*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Client-ProjFS*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Microsoft-Windows-Subsystem-Linux*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*Enable-WindowsOptionalFeature*'; data_win_eventdata_commandLine matches
  '*-Online*'; data_win_eventdata_commandLine matches '*-FeatureName*', among
  other conditions.

known_false_positives: >
  Legitimate usage of the features listed in the rule. Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://learn.microsoft.com/en-us/powershell/module/dism/enable-windowsoptionalfeature?view=windowsserver2022-ps
  - https://learn.microsoft.com/en-us/windows/win32/projfs/enabling-windows-projected-file-system
  - https://learn.microsoft.com/en-us/windows/wsl/install-on-server

response:
  message: >
    Potential Suspicious Windows Feature Enabled - ProcCreation detected on host
    $agent_name$. Matched data_win_eventdata_commandLine:
    $data_win_eventdata_commandLine$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - feature
    - proccreation
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Ee][Nn][Aa][Bb][Ll][Ee]-[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Oo][Pp][Tt][Ii][Oo][Nn][Aa][Ll][Ff][Ee][Aa][Tt][Uu][Rr][Ee].*/ AND data_win_eventdata_commandLine:/.*-[Oo][Nn][Ll][Ii][Nn][Ee].*/ AND data_win_eventdata_commandLine:/.*-[Ff][Ee][Aa][Tt][Uu][Rr][Ee][Nn][Aa][Mm][Ee].*/ AND (data_win_eventdata_commandLine:/.*[Tt][Ee][Ll][Nn][Ee][Tt][Ss][Ee][Rr][Vv][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Tt][Ee][Rr][Nn][Ee][Tt]-[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]-[Oo][Pp][Tt][Ii][Oo][Nn][Aa][Ll]-[Aa][Mm][Dd]64.*/ OR data_win_eventdata_commandLine:/.*[Tt][Ff][Tt][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ss][Mm][Bb]1[Pp][Rr][Oo][Tt][Oo][Cc][Oo][Ll].*/ OR data_win_eventdata_commandLine:/.*[Cc][Ll][Ii][Ee][Nn][Tt]-[Pp][Rr][Oo][Jj][Ff][Ss].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]-[Ww][Ii][Nn][Dd][Oo][Ww][Ss]-[Ss][Uu][Bb][Ss][Yy][Ss][Tt][Ee][Mm]-[Ll][Ii][Nn][Uu][Xx].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7e8f2d3b-9c1a-4f67-b9e8-8d9006e0e51f
    name: PowerShell Web Access Feature Enabled Via DISM
    reason: 'Same pattern: enabling an optional Windows feature to open remote access.'
  - id: windows-dism-install-pswa-001
    name: Windows DISM Install PowerShell Web Access
    reason: Companion detection for PSWA installation as a remote foothold.
  - id: eca8ae39-5c3c-4321-b538-9e64fe25822e
    name: Installation of WSL Kali-Linux
    reason: If WSL was the enabled feature, a Linux distro install commonly follows.
  - id: ed825c86-c009-4014-b413-b76003e33d35
    name: Windows Binary Executed From WSL
    reason: 'Follow-on: WSL used to run tooling that evades Windows monitoring.'
  - id: 57c4bf16-227f-4394-8ec7-1b745ee061c3
    name: Firewall Disabled via Netsh.EXE
    reason: Enabling Telnet/TFTP/SMB1 is often paired with opening the firewall.
  - id: cd5cfd80-aa5f-44c0-9c20-108c4ae12e3c
    name: New Firewall Rule Added Via Netsh.EXE
    reason: New inbound rules expose the newly enabled legacy service.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Firewall changes exposing legacy services
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Nn][Ee][Tt][Ss][Hh]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*[Aa][Dd][Vv][Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Pp][Oo][Rr][Tt][Pp][Rr][Oo][Xx][Yy].*/)
    pivot_on: host
    window: 4h
  - name: DISM and feature enablement commands
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Mm].*/ OR data_win_eventdata_commandLine:/.*[Ee][Nn][Aa][Bb][Ll][Ee]-[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Oo][Pp][Tt][Ii][Oo][Nn][Aa][Ll][Ff][Ee][Aa][Tt][Uu][Rr][Ee].*/ OR data_win_eventdata_commandLine:/.*[Aa][Dd][Dd]-[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Cc][Aa][Pp][Aa][Bb][Ii][Ll][Ii][Tt][Yy].*/ OR data_win_eventdata_commandLine:/.*[Ww][Ss][Ll] --[Ii][Nn][Ss][Tt][Aa][Ll][Ll].*/)
    pivot_on: host
    window: 4h
  - name: Inbound connections to legacy service ports
    query: data_win_system_eventID:"3" AND data_win_eventdata_destinationPort:(23 OR 69 OR 445) AND data_win_eventdata_initiated:"false"
    pivot_on: host
    window: 6h
  - name: Telnet, TFTP and WSL binaries executed
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Tt][Ee][Ll][Nn][Ee][Tt]\.[Ee][Xx][Ee]|[Tt][Ff][Tt][Pp]\.[Ee][Xx][Ee]|[Tt][Ll][Nn][Tt][Ss][Vv][Rr]\.[Ee][Xx][Ee]|[Ww][Ss][Ll]\.[Ee][Xx][Ee]|[Bb][Aa][Ss][Hh]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 6h
  - name: Account, service and RDP changes after enablement
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Nn][Ee][Tt] [Uu][Ss][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt] [Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc] [Cc][Rr][Ee][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc] [Cc][Oo][Nn][Ff][Ii][Gg].*/ OR data_win_eventdata_commandLine:/.*[Ff][Dd][Ee][Nn][Yy][Tt][Ss][Cc][Oo][Nn][Nn][Ee][Cc][Tt][Ii][Oo][Nn][Ss].*/)
    pivot_on: host
    window: 6h
