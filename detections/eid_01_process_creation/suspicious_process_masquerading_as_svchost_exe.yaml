name: Suspicious Process Masquerading As SvcHost.EXE
id: be58d2e2-06c8-4f58-b666-b99f6dc3b6cd
version: 1
schema_version: "1.0"
date: "2024-08-07"
author: Swachchhanda Shrawan Poudel
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: be58d2e2-06c8-4f58-b666-b99f6dc3b6cd
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a suspicious process that is masquerading as the legitimate
  "svchost.exe" by naming its binary "svchost.exe" and executing from an
  uncommon location. Adversaries often disguise their malicious binaries by
  naming them after legitimate system processes like "svchost.exe" to evade
  detection. MITRE ATT&CK: T1036.005.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\svchost.exe"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_image"
        - exists:
            field: "data_win_eventdata_originalFileName"
        - bool:
            must_not:
              - bool:
                  should:
                    - term:
                        data_win_eventdata_image:
                          value: "C:\\Windows\\System32\\svchost.exe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_image:
                          value: "C:\\Windows\\SysWOW64\\svchost.exe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_originalFileName:
                          value: "svchost.exe"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\svchost.exe'; data_win_eventdata_image equals
  'C:\Windows\System32\svchost.exe'; data_win_eventdata_image equals
  'C:\Windows\SysWOW64\svchost.exe', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://tria.ge/240731-jh4crsycnb/behavioral2
  - https://redcanary.com/blog/threat-detection/process-masquerading/
  - https://attack.mitre.org/techniques/T1036/005/

response:
  message: >
    Suspicious Process Masquerading As SvcHost.EXE detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1036.005
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1036.005
  custom_tags:
    - masquerading
    - svchost
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ AND _exists_:data_win_eventdata_image AND _exists_:data_win_eventdata_originalFileName AND NOT (data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Ww][Oo][Ww]64\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 16c37b52-b141-42a5-a3ea-bbe098444397
    name: Suspect Svchost Activity
    reason: Complementary svchost anomaly (wrong parent/args); a fake svchost often trips both.
  - id: 3f7f5b0b-5b16-476c-a85f-ab477f6dd24b
    name: Lazarus System Binary Masquerading
    reason: Same system-binary masquerading tradecraft from unusual paths.
  - id: 3dfd06d2-eaf4-4532-9555-68aca59f57c4
    name: Process Execution From A Potentially Suspicious Folder
    reason: The fake svchost runs from a user-writable/uncommon folder, which this also flags.
  - id: 36480ae1-a1cb-4eaa-a0d6-29801d7e9142
    name: Potential Defense Evasion Via Binary Rename
    reason: A renamed binary is how svchost.exe impersonation is typically produced.
  - id: 9f8573c9-22b4-40e3-89c1-72bc2b8d49ab
    name: Scheduled Task Creation Masquerading as System Processes
    reason: Persistence for a fake svchost frequently uses tasks with system-process names.
  - id: c248c896-e412-4279-8c15-1c558067b6fa
    name: Enumerate All Information With Whoami.EXE
    reason: Hands-on-keyboard recon often follows the implant starting.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Children spawned by the fake svchost
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Ss][Vv][Cc][Hh][Oo][Ss][Tt][.][Ee][Xx][Ee]/ AND NOT data_win_eventdata_parentImage:/[Cc]:.[Ww]indows.[Ss]ystem32.*/ AND NOT data_win_eventdata_parentImage:/[Cc]:.[Ww]indows.[Ss]ys[Ww][Oo][Ww]64.*/
    pivot_on: host
    window: 4h
  - name: Network connections by svchost outside System32
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*[Ss][Vv][Cc][Hh][Oo][Ss][Tt][.][Ee][Xx][Ee]/ AND NOT data_win_eventdata_image:/[Cc]:.[Ww]indows.[Ss]ystem32.*/ AND NOT data_win_eventdata_image:/[Cc]:.[Ww]indows.[Ss]ys[Ww][Oo][Ww]64.*/
    pivot_on: host
    window: 4h
  - name: File creation of svchost.exe copies
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*[Ss][Vv][Cc][Hh][Oo][Ss][Tt][.][Ee][Xx][Ee]/ AND NOT data_win_eventdata_targetFilename:/[Cc]:.[Ww]indows.*/
    pivot_on: host
    window: 6h
  - name: Persistence registering svchost-named payload
    query: (data_win_system_eventID:13 AND data_win_eventdata_details:/.*[Ss][Vv][Cc][Hh][Oo][Ss][Tt][.][Ee][Xx][Ee].*/) OR (data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(schtasks|reg).*[Ss][Vv][Cc][Hh][Oo][Ss][Tt][.][Ee][Xx][Ee].*/)
    pivot_on: host
    window: 24h
