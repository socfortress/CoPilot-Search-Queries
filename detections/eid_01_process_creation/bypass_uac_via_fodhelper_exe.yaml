name: Bypass UAC via Fodhelper.exe
id: 7f741dcf-fc22-4759-87b4-9ae8376676a2
version: 1
schema_version: "1.0"
date: "2021-11-27"
author: E.M. Anhaus (originally from Atomic Blue Detections, Tony Lambert), oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 7f741dcf-fc22-4759-87b4-9ae8376676a2
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Identifies use of Fodhelper.exe to bypass User Account Control. Adversaries
  use this technique to execute privileged processes. MITRE ATT&CK: T1548.002.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_parentImage:
              value: "*\\\\fodhelper.exe"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\fodhelper.exe'.

known_false_positives: >
  Legitimate use of fodhelper.exe utility by legitimate user. Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://eqllib.readthedocs.io/en/latest/analytics/e491ce22-792f-11e9-8f5c-d46d6d62a49e.html
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1548.002/T1548.002.md
  - https://attack.mitre.org/techniques/T1548/002/

response:
  message: >
    Bypass UAC via Fodhelper.exe detected on host $agent_name$. Matched
    data_win_eventdata_parentImage: $data_win_eventdata_parentImage$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1548.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1548.002
  custom_tags:
    - bypass
    - fodhelper
    - process_creation
    - sysmon
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ff][Oo][Dd][Hh][Ee][Ll][Pp][Ee][Rr]\.[Ee][Xx][Ee]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 909f8fd8-7ac8-11eb-a1f3-acde48001122
    name: FodHelper UAC Bypass
    reason: Same technique detected from the fodhelper child-process side; corroborates the hijack.
  - id: dd3ee8cc-f751-41c9-ba53-5a32ed47e563
    name: Registry Modification of MS-settings Protocol Handler
    reason: Fodhelper is hijacked by writing HKCU ms-settings\shell\open\command beforehand; this is the precursor.
  - id: 3c05e90d-7eba-4324-9972-5d7f711a60a8
    name: UAC Bypass Tools Using ComputerDefaults
    reason: ComputerDefaults abuses the identical ms-settings hijack; attackers rotate between the two.
  - id: d38d2fa4-98e6-4a24-aff1-410b0c9ad177
    name: HackTool - UACMe Akagi Execution
    reason: UACMe implements the fodhelper method, so its presence explains the bypass.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: ms-settings command hijack registry writes
    query: (data_win_system_eventID:13 OR data_win_system_eventID:12 OR data_win_system_eventID:14) AND data_win_eventdata_targetObject:/.*[Mm][Ss]-[Ss]ettings.*[Ss]hell.*[Oo]pen.*[Cc]ommand.*/
    pivot_on: host
    window: 1h
  - name: DelegateExecute value set under ms-settings
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*[Dd]elegate[Ee]xecute.*/
    pivot_on: host
    window: 1h
  - name: Shells and LOLBins spawned by fodhelper
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Ff]odhelper\.exe/ AND (data_win_eventdata_image:/.*[Cc][Mm][Dd]\.exe/ OR data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ OR data_win_eventdata_image:/.*[Mm][Ss][Hh][Tt][Aa]\.exe/ OR data_win_eventdata_image:/.*[Rr]egsvr32\.exe/)
    pivot_on: host
    window: 1h
  - name: Defender tampering after elevation
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*[Ss]et-[Mm]p[Pp]reference.*/ OR data_win_eventdata_commandLine:/.*[Aa]dd-[Mm]p[Pp]reference.*[Ee]xclusion.*/)
    pivot_on: host
    window: 2h
