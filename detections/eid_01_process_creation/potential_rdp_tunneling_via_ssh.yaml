name: Potential RDP Tunneling Via SSH
id: f7d7ebd5-a016-46e2-9c54-f9932f2d386d
version: 1
schema_version: "1.0"
date: "2023-01-25"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: f7d7ebd5-a016-46e2-9c54-f9932f2d386d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Execution of ssh.exe to perform data exfiltration and tunneling through RDP.
  MITRE ATT&CK: T1572.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\ssh.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine: "*:3389*"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches '*\ssh.exe';
  data_win_eventdata_commandLine matches '*:3389*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.absolomb.com/2018-01-26-Windows-Privilege-Escalation-Guide/
  - https://attack.mitre.org/techniques/T1572/

response:
  message: >
    Potential RDP Tunneling Via SSH detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1572
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1572
  custom_tags:
    - tunneling
    - process_creation
    - sysmon
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss][Ss][Hh]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*:3389.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 327f48c1-a6db-4eb8-875a-f6981f1b0183
    name: Port Forwarding Activity Via SSH.EXE
    reason: Generic ssh -L/-R forwarding; the same binary behaviour underlying this tunnel.
  - id: 8a3038e8-9c9d-46f8-b184-66234a160f6f
    name: Potential Remote Desktop Tunneling
    reason: Overlapping RDP tunneling detection via other methods.
  - id: 2daa93a0-a5fb-41c5-8cd8-3c11294bfd1f
    name: Potential SSH Tunnel Persistence Install Using A Scheduled Task
    reason: Attackers persist the SSH tunnel via a scheduled task.
  - id: 782d6f3e-4c5d-4b8c-92a3-1d05fed72e63
    name: RDP Port Forwarding Rule Added Via Netsh.EXE
    reason: Netsh portproxy often used alongside an ssh forward for RDP.
  - id: 01aeb693-138d-49d2-9403-c4f52d7d3d62
    name: RDP Connection Allowed Via Netsh.EXE
    reason: Firewall opened for RDP before tunneling.
  - id: 7d6d30b8-5b91-4b90-a891-46cccaf29598
    name: Program Executed Using Proxy/Local Command Via SSH.EXE
    reason: Same ssh.exe abused for command execution.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: ssh.exe with forwarding flags
    query: data_win_system_eventID:1 AND data_win_eventdata_image:*ssh.exe AND (data_win_eventdata_commandLine:/.* -[RLD] .*/ OR data_win_eventdata_commandLine:/.* -N .*/)
    pivot_on: host
    window: 6h
  - name: Outbound connection from ssh.exe
    query: data_win_system_eventID:3 AND data_win_eventdata_image:*ssh.exe
    pivot_on: host
    window: 6h
  - name: mstsc connecting to loopback
    query: data_win_system_eventID:1 AND data_win_eventdata_image:*mstsc.exe AND data_win_eventdata_commandLine:/.*(127\.0\.0\.1|[Ll]ocalhost).*/
    pivot_on: host
    window: 6h
  - name: Loopback-sourced RDP logons
    query: data_win_system_eventID:4624 AND data_win_eventdata_logonType:10 AND data_win_eventdata_ipAddress:(127.0.0.1 OR \:\:1)
    pivot_on: host
    window: 6h
  - name: Scheduled task creation referencing ssh
    query: data_win_system_eventID:1 AND data_win_eventdata_image:*schtasks.exe AND data_win_eventdata_commandLine:/.*[Ss][Ss][Hh].*/
    pivot_on: host
    window: 24h
