name: HackTool - Windows Credential Editor (WCE) Execution
id: 7aa7009a-28b9-4344-8c1f-159489a390df
version: 1
schema_version: "1.0"
date: "2025-10-21"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 7aa7009a-28b9-4344-8c1f-159489a390df
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the use of Windows Credential Editor (WCE), a popular
  post-exploitation tool used to extract plaintext passwords, hash, PIN code and
  Kerberos tickets from memory. It is often used by threat actors for credential
  dumping and lateral movement within compromised networks. MITRE ATT&CK:
  T1003.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\WCE.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\WCE64.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=136F0A8572C058A96436C82E541E4C41*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=589657C64DDE88533186C39F82FA1F50*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=6BFE09EFCB4FFDE061EBDBAFC4DB84CF*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=7D490037BF450877E6D0287BDCFF8D2E*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=8AB93B061287C79F3088C5BC7E7D97ED*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=A53A02B997935FD8EEDCB5F7ABAB9B9F*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=BA434A7A729EEC20E136CA4C32D6C740*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=BD1D1547DA13C0FCB6C15E86217D5EB8*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=E96A73C7BF33A464C510EDE582318BF2*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_hashes
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches '*\WCE.exe';
  data_win_eventdata_image matches '*\WCE64.exe'; data_win_eventdata_hashes
  matches '*IMPHASH=136F0A8572C058A96436C82E541E4C41*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.ampliasecurity.com/research/windows-credentials-editor/
  - https://attack.mitre.org/techniques/T1003/001/

response:
  message: >
    HackTool - Windows Credential Editor (WCE) Execution detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_hashes: $data_win_eventdata_hashes$. MITRE
    ATT&CK: T1003.001
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_hashes
      type: file_hash

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.001
  custom_tags:
    - hacktool
    - credential
    - editor
    - process_creation
    - sysmon
    - credential_access
    - s0005
  product:
    - Wazuh
  security_domain: endpoint

