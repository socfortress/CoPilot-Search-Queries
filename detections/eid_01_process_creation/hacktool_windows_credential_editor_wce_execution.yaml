name: HackTool - Windows Credential Editor (WCE) Execution
id: 7aa7009a-28b9-4344-8c1f-159489a390df
version: 1
schema_version: "1.0"
date: "2025-10-21"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 7aa7009a-28b9-4344-8c1f-159489a390df
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the use of Windows Credential Editor (WCE), a popular
  post-exploitation tool used to extract plaintext passwords, hash, PIN code and
  Kerberos tickets from memory. It is often used by threat actors for credential
  dumping and lateral movement within compromised networks. MITRE ATT&CK:
  T1003.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\WCE.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\WCE64.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=136F0A8572C058A96436C82E541E4C41*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=589657C64DDE88533186C39F82FA1F50*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=6BFE09EFCB4FFDE061EBDBAFC4DB84CF*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=7D490037BF450877E6D0287BDCFF8D2E*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=8AB93B061287C79F3088C5BC7E7D97ED*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=A53A02B997935FD8EEDCB5F7ABAB9B9F*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=BA434A7A729EEC20E136CA4C32D6C740*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=BD1D1547DA13C0FCB6C15E86217D5EB8*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=E96A73C7BF33A464C510EDE582318BF2*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_hashes
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches '*\WCE.exe';
  data_win_eventdata_image matches '*\WCE64.exe'; data_win_eventdata_hashes
  matches '*IMPHASH=136F0A8572C058A96436C82E541E4C41*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.ampliasecurity.com/research/windows-credentials-editor/
  - https://attack.mitre.org/techniques/T1003/001/

response:
  message: >
    HackTool - Windows Credential Editor (WCE) Execution detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_hashes: $data_win_eventdata_hashes$. MITRE
    ATT&CK: T1003.001
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_hashes
      type: file_hash

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.001
  custom_tags:
    - hacktool
    - credential
    - editor
    - process_creation
    - sysmon
    - credential_access
    - s0005
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ww][Cc][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Cc][Ee]64\.[Ee][Xx][Ee]/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=136[Ff]0[Aa]8572[Cc]058[Aa]96436[Cc]82[Ee]541[Ee]4[Cc]41.*/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=589657[Cc]64[Dd][Dd][Ee]88533186[Cc]39[Ff]82[Ff][Aa]1[Ff]50.*/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=6[Bb][Ff][Ee]09[Ee][Ff][Cc][Bb]4[Ff][Ff][Dd][Ee]061[Ee][Bb][Dd][Bb][Aa][Ff][Cc]4[Dd][Bb]84[Cc][Ff].*/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=7[Dd]490037[Bb][Ff]450877[Ee]6[Dd]0287[Bb][Dd][Cc][Ff][Ff]8[Dd]2[Ee].*/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=8[Aa][Bb]93[Bb]061287[Cc]79[Ff]3088[Cc]5[Bb][Cc]7[Ee]7[Dd]97[Ee][Dd].*/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=[Aa]53[Aa]02[Bb]997935[Ff][Dd]8[Ee][Ee][Dd][Cc][Bb]5[Ff]7[Aa][Bb][Aa][Bb]9[Bb]9[Ff].*/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=[Bb][Aa]434[Aa]7[Aa]729[Ee][Ee][Cc]20[Ee]136[Cc][Aa]4[Cc]32[Dd]6[Cc]740.*/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=[Bb][Dd]1[Dd]1547[Dd][Aa]13[Cc]0[Ff][Cc][Bb]6[Cc]15[Ee]86217[Dd]5[Ee][Bb]8.*/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=[Ee]96[Aa]73[Cc]7[Bb][Ff]33[Aa]464[Cc]510[Ee][Dd][Ee]582318[Bb][Ff]2.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: Mimikatz is the usual companion or substitute for WCE; both extract hashes/tickets from LSASS on the same host
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: If WCE is blocked or flagged by AV, operators fall back to comsvcs MiniDump of LSASS
  - id: 5afee48e-67dd-4e03-a783-f74259dcf998
    name: Potential LSASS Process Dump Via Procdump
    reason: Procdump on LSASS is another credential-extraction fallback in the same intrusion phase
  - id: ffa6861c-4461-4f59-8a41-578c39f3f23e
    name: LSASS Dump Keyword In CommandLine
    reason: Command lines mentioning LSASS dumping show broader credential-theft attempts around WCE
  - id: fd877b94-9bb5-4191-bb25-d79cbd93c167
    name: Dumping of Sensitive Hives Via Reg.EXE
    reason: Offline SAM/SYSTEM/SECURITY hive dumping is complementary local credential harvesting
  - id: 13bbd574-83ac-11ec-99d4-acde48001122
    name: Mimikatz PassTheTicket CommandLine Parameters
    reason: WCE exports Kerberos tickets; pass-the-ticket use is the follow-on that spends them
  - id: ea011323-7045-460b-b2d7-0f7442ea6b38
    name: Potential PsExec Remote Execution
    reason: Extracted hashes/credentials are typically spent on PsExec lateral movement
  - id: 0685b176-c816-4837-8e7b-1216f346636b
    name: HackTool - Quarks PwDump Execution
    reason: PwDump-family hash dumping co-occurs when attackers cycle tools for hash extraction
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: LSASS process access (Sysmon 10)
    query: data_win_system_eventID:10 AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee].*/
    pivot_on: host
    window: 2h
  - name: Credential extraction command lines
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR /.*[Ll][Ss][Aa][Dd][Uu][Mm][Pp].*/ OR /.*[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp].*/ OR /.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss].*/)
    pivot_on: host
    window: 4h
  - name: SAM/SYSTEM/SECURITY hive saves
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*[Rr][Ee][Gg].*[Ss][Aa][Vv][Ee].*([Ss][Aa][Mm]|[Ss][Yy][Ss][Tt][Ee][Mm]|[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]).*/
    pivot_on: host
    window: 4h
  - name: Remote execution tooling after credential theft
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Pp][Ss][Ee][Xx][Ee][Cc].*/ OR /.*[Ww][Ii][Nn][Rr][Ss].*/ OR /.*[Ww][Mm][Ii][Cc].*/)
    pivot_on: host
    window: 6h
  - name: NewCredentials logon (type 9, WCE/runas netonly)
    query: data_win_system_eventID:4624 AND data_win_eventdata_logonType:9
    pivot_on: user
    window: 2h
