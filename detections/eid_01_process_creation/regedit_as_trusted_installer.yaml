name: Regedit as Trusted Installer
id: 883835a7-df45-43e4-bf1d-4268768afda4
version: 1
schema_version: "1.0"
date: "2022-10-09"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 883835a7-df45-43e4-bf1d-4268768afda4
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a regedit started with TrustedInstaller privileges or by
  ProcessHacker.exe. MITRE ATT&CK: T1548.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\regedit.exe"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\TrustedInstaller.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\ProcessHacker.exe"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\regedit.exe'; data_win_eventdata_parentImage matches
  '*\TrustedInstaller.exe'; data_win_eventdata_parentImage matches
  '*\ProcessHacker.exe'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/1kwpeter/status/1397816101455765504
  - https://attack.mitre.org/techniques/T1548/

response:
  message: >
    Regedit as Trusted Installer detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_parentImage: $data_win_eventdata_parentImage$. MITRE
    ATT&CK: T1548
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_parentImage
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1548
  custom_tags:
    - regedit
    - trusted
    - installer
    - process_creation
    - sysmon
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Rr][Ee][Gg][Ee][Dd][Ii][Tt]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_parentImage:/.*\\[Tt][Rr][Uu][Ss][Tt][Ee][Dd][Ii][Nn][Ss][Tt][Aa][Ll][Ll][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Pp][Rr][Oo][Cc][Ee][Ss][Ss][Hh][Aa][Cc][Kk][Ee][Rr]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 811e0002-b13b-4a15-9d00-a613fce66e42
    name: PUA - Process Hacker Execution
    reason: Process Hacker is the usual tool to launch regedit as TrustedInstaller; its presence explains the token.
  - id: 67add051-9ee7-4ad3-93ba-42935615ae8d
    name: PUA - Process Hacker Driver Load
    reason: Process Hacker loads its kernel driver to obtain elevated tokens just before this event.
  - id: 5722dff1-4bdd-4949-86ab-fbaf707e767a
    name: PUA - System Informer Execution
    reason: System Informer is the successor to Process Hacker with the same service-impersonation capability.
  - id: 452bce90-6fb0-43cc-97a5-affc283139b3
    name: Suspicious Windows Defender Registry Key Tampering Via Reg.EXE
    reason: TrustedInstaller registry access is commonly used to edit protected Defender keys.
  - id: 5e95028c-5229-4214-afae-d653d573d0ec
    name: Security Service Disabled Via Reg.EXE
    reason: Protected security service Start values need TrustedInstaller rights; natural follow-on to disable them.
  - id: 8470d755-0c13-45b3-bd63-387a373c10cf
    name: Reg exe Manipulating Windows Services Registry Keys
    reason: Editing protected Services keys is a typical goal of the elevated regedit session.
  - id: 9bd04a79-dabe-4f1f-a5ff-92430265c96b
    name: Privilege Escalation via Named Pipe Impersonation
    reason: Alternative way of obtaining SYSTEM or TI tokens that would precede such a session.
  - id: 07e3cb2c-0608-410d-be4b-1511cb1a0448
    name: Tamper Windows Defender Remove-MpPreference
    reason: Defender tampering through PowerShell is the sibling step when the actor disables AV after elevating.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Regedit writes to protected Defender and service keys
    query: data_win_system_eventID:13 AND data_win_eventdata_image:/.*\\regedit\.exe/ AND data_win_eventdata_targetObject:(/.*(Windows Defender|CurrentControlSet\\Services|SecurityProviders|Policies).*/)
    pivot_on: host
    window: 4h
  - name: Process Hacker or System Informer activity
    query: data_win_system_eventID:(1 OR 6 OR 7) AND (data_win_eventdata_image:(/.*([Pp]rocess[Hh]acker|[Ss]ystem[Ii]nformer).*/) OR data_win_eventdata_imageLoaded:(/.*([Pp]rocess[Hh]acker|[Kk]ProcessHacker|[Ss]ystem[Ii]nformer).*/))
    pivot_on: host
    window: 4h
  - name: Processes spawned by TrustedInstaller
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*\\[Tt]rusted[Ii]nstaller\.exe/ AND NOT data_win_eventdata_image:/.*\\TiWorker\.exe/
    pivot_on: host
    window: 4h
  - name: Defender disable and exclusion commands
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*([Ss]et-[Mm]p[Pp]reference|[Dd]isable[Aa]nti[Ss]pyware|[Dd]isable[Rr]ealtime|[Ee]xclusion).*/)
    pivot_on: host
    window: 4h
