name: Potential DLL File Download Via PowerShell Invoke-WebRequest
id: 0f0450f3-8b47-441e-a31b-15a91dc243e2
version: 1
schema_version: "1.0"
date: "2025-07-18"
author: Florian Roth (Nextron Systems), Hieu Tran
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 0f0450f3-8b47-441e-a31b-15a91dc243e2
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential DLL files being downloaded using the PowerShell
  Invoke-WebRequest or Invoke-RestMethod cmdlets. MITRE ATT&CK: T1059.001,
  T1105.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Invoke-RestMethod *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Invoke-WebRequest *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*IRM *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*IWR *"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*http*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*OutFile*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*.dll*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*Invoke-RestMethod *'; data_win_eventdata_commandLine matches
  '*Invoke-WebRequest *'; data_win_eventdata_commandLine matches '*IRM *', among
  other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.zscaler.com/blogs/security-research/onenote-growing-threat-malware-distribution
  - https://attack.mitre.org/techniques/T1059/001/
  - https://attack.mitre.org/techniques/T1105/

response:
  message: >
    Potential DLL File Download Via PowerShell Invoke-WebRequest detected on
    host $agent_name$. Matched data_win_eventdata_commandLine:
    $data_win_eventdata_commandLine$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1059.001, T1105
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
    - T1105
  custom_tags:
    - download
    - powershell
    - invoke
    - process_creation
    - sysmon
    - command_and_control
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Rr][Ee][Ss][Tt][Mm][Ee][Tt][Hh][Oo][Dd] .*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt] .*/ OR data_win_eventdata_commandLine:/.*[Ii][Rr][Mm] .*/ OR data_win_eventdata_commandLine:/.*[Ii][Ww][Rr] .*/) AND data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp].*/ AND data_win_eventdata_commandLine:/.*[Oo][Uu][Tt][Ff][Ii][Ll][Ee].*/ AND data_win_eventdata_commandLine:/.*\.[Dd][Ll][Ll].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 5e3cc4d8-3e68-43db-8656-eaaeefdec9cc
    name: Suspicious Invoke-WebRequest Execution
    reason: Same cmdlet abuse with suspicious parameters; overlapping download stage.
  - id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
    name: PowerShell Download and Execution Cradles
    reason: Download cradles that chain fetch with execution of the payload.
  - id: 089fc3d2-71e8-4763-a8a5-c97fbb0a403e
    name: Regsvr32 DLL Execution With Suspicious File Extension
    reason: A downloaded DLL is commonly loaded via regsvr32.
  - id: ae9c6a7c-9521-42a6-915e-5aaa8689d529
    name: CobaltStrike Load by Rundll32
    reason: A downloaded DLL run by rundll32 is a common Cobalt Strike delivery.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: DLL loaded via rundll32 or regsvr32 from user paths
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*\\(rundll32|regsvr32)\.exe/ AND data_win_eventdata_commandLine:/.*(Temp|AppData|Public|Downloads|ProgramData).*\.dll.*/
    pivot_on: host
    window: 2h
  - name: DLL files created in user-writable paths
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\\(Temp|AppData|Public|Downloads|ProgramData)\\.*\.dll/
    pivot_on: host
    window: 2h
  - name: Other PowerShell download activity
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*\\(powershell|pwsh)\.exe/ AND data_win_eventdata_commandLine:/.*(DownloadFile|DownloadString|Net\.WebClient|Start-BitsTransfer|iex).*/
    pivot_on: host
    window: 4h
  - name: PowerShell outbound network connections
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*\\(powershell|pwsh)\.exe/
    pivot_on: host
    window: 2h
