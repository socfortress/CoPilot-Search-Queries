name: HackTool - CrackMapExec Process Patterns
id: f26307d8-14cd-47e3-a26b-4b4769f24af6
version: 1
schema_version: "1.0"
date: "2023-02-13"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: f26307d8-14cd-47e3-a26b-4b4769f24af6
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious process patterns found in logs when CrackMapExec is used.
  MITRE ATT&CK: T1003.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*tasklist /fi *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*Imagename eq lsass.exe*"
                          case_insensitive: true
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*cmd.exe /c *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*cmd.exe /r *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*cmd.exe /k *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*cmd /c *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*cmd /r *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*cmd /k *"
                                case_insensitive: true
                        minimum_should_match: 1
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_user:
                                value: "*AUTHORI*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_user:
                                value: "*AUTORI*"
                                case_insensitive: true
                        minimum_should_match: 1
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*do rundll32.exe C:\\\\windows\\\\System32\\\\comsvcs.dll, MiniDump*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*\\\\Windows\\\\Temp\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* full*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*%%B*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*tasklist /v /fo csv*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*findstr /i \"lsass\"*"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_user
    - data_win_eventdata_image
    - data_win_eventdata_parentImage

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*tasklist /fi *'; data_win_eventdata_commandLine matches '*Imagename eq
  lsass.exe*'; data_win_eventdata_commandLine matches '*cmd.exe /c *', among
  other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://mpgn.gitbook.io/crackmapexec/smb-protocol/obtaining-credentials/dump-lsass
  - https://attack.mitre.org/techniques/T1003/001/

response:
  message: >
    HackTool - CrackMapExec Process Patterns detected on host $agent_name$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
    Matched data_win_eventdata_user: $data_win_eventdata_user$. MITRE ATT&CK:
    T1003.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_user
      type: user

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.001
  custom_tags:
    - hacktool
    - crackmapexec
    - patterns
    - process_creation
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND ((data_win_eventdata_commandLine:/.*[Tt][Aa][Ss][Kk][Ll][Ii][Ss][Tt] \/[Ff][Ii] .*/ AND data_win_eventdata_commandLine:/.*[Ii][Mm][Aa][Gg][Ee][Nn][Aa][Mm][Ee] [Ee][Qq] [Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee].*/ AND (data_win_eventdata_commandLine:/.*[Cc][Mm][Dd]\.[Ee][Xx][Ee] \/[Cc] .*/ OR data_win_eventdata_commandLine:/.*[Cc][Mm][Dd]\.[Ee][Xx][Ee] \/[Rr] .*/ OR data_win_eventdata_commandLine:/.*[Cc][Mm][Dd]\.[Ee][Xx][Ee] \/[Kk] .*/ OR data_win_eventdata_commandLine:/.*[Cc][Mm][Dd] \/[Cc] .*/ OR data_win_eventdata_commandLine:/.*[Cc][Mm][Dd] \/[Rr] .*/ OR data_win_eventdata_commandLine:/.*[Cc][Mm][Dd] \/[Kk] .*/) AND (data_win_eventdata_user:/.*[Aa][Uu][Tt][Hh][Oo][Rr][Ii].*/ OR data_win_eventdata_user:/.*[Aa][Uu][Tt][Oo][Rr][Ii].*/)) OR (data_win_eventdata_commandLine:/.*[Dd][Oo] [Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee] [Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll], [Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ AND data_win_eventdata_commandLine:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/ AND data_win_eventdata_commandLine:/.* [Ff][Uu][Ll][Ll].*/ AND data_win_eventdata_commandLine:/.*%%[Bb].*/) OR (data_win_eventdata_commandLine:/.*[Tt][Aa][Ss][Kk][Ll][Ii][Ss][Tt] \/[Vv] \/[Ff][Oo] [Cc][Ss][Vv].*/ AND data_win_eventdata_commandLine:/.*[Ff][Ii][Nn][Dd][Ss][Tt][Rr] \/[Ii] \"[Ll][Ss][Aa][Ss][Ss]\".*/))

