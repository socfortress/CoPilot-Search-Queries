name: Suspicious Windows Trace ETW Session Tamper Via Logman.EXE
id: cd1f961e-0b96-436b-b7c6-38da4583ec00
version: 1
schema_version: "1.0"
date: "2023-02-21"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: cd1f961e-0b96-436b-b7c6-38da4583ec00
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of "logman" utility in order to disable or delete
  Windows trace sessions. MITRE ATT&CK: T1685, T1685.005.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\logman.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "Logman.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*stop *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*delete *"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Circular Kernel Context Logger*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*EventLog-*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*SYSMON TRACE*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*SysmonDnsEtwSession*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\logman.exe'; data_win_eventdata_originalFileName equals 'Logman.exe';
  data_win_eventdata_commandLine matches '*stop *', among other conditions.

known_false_positives: >
  Legitimate deactivation by administrative staff. Installer tools that disable
  services, e.g. before log collection agent installation. Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://twitter.com/0gtweet/status/1359039665232306183?s=21
  - https://ss64.com/nt/logman.html
  - https://attack.mitre.org/techniques/T1685/
  - https://attack.mitre.org/techniques/T1685/005/

response:
  message: >
    Suspicious Windows Trace ETW Session Tamper Via Logman.EXE detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1685, T1685.005
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685
    - T1685.005
  custom_tags:
    - trace
    - session
    - tamper
    - process_creation
    - sysmon
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ll][Oo][Gg][Mm][Aa][Nn]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ll][Oo][Gg][Mm][Aa][Nn]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*[Ss][Tt][Oo][Pp] .*/ OR data_win_eventdata_commandLine:/.*[Dd][Ee][Ll][Ee][Tt][Ee] .*/) AND (data_win_eventdata_commandLine:/.*[Cc][Ii][Rr][Cc][Uu][Ll][Aa][Rr] [Kk][Ee][Rr][Nn][Ee][Ll] [Cc][Oo][Nn][Tt][Ee][Xx][Tt] [Ll][Oo][Gg][Gg][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg]-.*/ OR data_win_eventdata_commandLine:/.*[Ss][Yy][Ss][Mm][Oo][Nn] [Tt][Rr][Aa][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Yy][Ss][Mm][Oo][Nn][Dd][Nn][Ss][Ee][Tt][Ww][Ss][Ee][Ss][Ss][Ii][Oo][Nn].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: f37b4bce-49d0-4087-9f5b-58bffda77316
    name: Potential AutoLogger Sessions Tampering
    reason: AutoLogger registry tampering is the persistent counterpart to stopping live ETW sessions.
  - id: d7b81144-b866-48a4-9bcc-275dc69d870e
    name: Windows EventLog Autologger Session Registry Modification Via CommandLine
    reason: EventLog Autologger session edits via command line, same ETW-blinding goal.
  - id: a1b2c3d4-e5f6-a7b8-c9d0-e1f2a3b4c5d6
    name: Disabling Windows Defender WMI Autologger Session via Reg.exe
    reason: Disabling the Defender WMI autologger session is a common target of logman stop/delete.
  - id: a238b5d0-ce2d-4414-a676-7a531b3d13d6
    name: ETW Trace Evasion Activity
    reason: Other ETW trace evasion via command line, same technique cluster.
  - id: 236e7c8e-c9d9-11eb-a824-acde48001122
    name: Disable Logs Using WevtUtil
    reason: wevtutil log disabling is the paired channel-level telemetry kill.
  - id: fdb829a8-db84-4832-b64b-3e964cd44f01
    name: Windows Eventlog Cleared Via Wevtutil
    reason: Event log clearing typically follows once tracing is blinded.
  - id: 115fdba9-f017-42e6-84cf-d5573bf2ddf8
    name: Disable of ETW Trace - Powershell
    reason: PowerShell-based ETW disable, an alternate method on the same host.
  - id: 0a13e132-651d-11eb-ae93-0242ac130002
    name: Audit Policy Tampering Via Auditpol
    reason: Audit policy tampering is another telemetry-reduction step used with ETW stops.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Registry edits to AutoLogger/ETW providers
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:(/.*[Aa]uto[Ll]ogger.*/ OR /.*\\Control\\WMI\\.*/)
    pivot_on: host
    window: 6h
  - name: Event log disable or clear commands
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*wevtutil.* cl .*/ OR /.*wevtutil.*enabled:false.*/ OR /.*[Cc]lear-[Ee]vent[Ll]og.*/ OR /.*auditpol.*(clear|remove).*/)
    pivot_on: host
    window: 6h
  - name: Defender tamper nearby
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ss]et-[Mm]p[Pp]reference.*/ OR /.*[Ww]in[Dd]efend.*/)
    pivot_on: host
    window: 6h
  - name: Sysmon driver or service tampering
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ff]ltmc.*unload.*/ OR /.*[Ss]ysmon.*(stop|delete).*/ OR /.*SysmonDrv.*/)
    pivot_on: host
    window: 6h
  - name: All logman invocations
    query: data_win_system_eventID:1 AND data_win_eventdata_image:(/.*\\logman\.exe/)
    pivot_on: host
    window: 24h
