name: Potential Meterpreter/CobaltStrike Activity
id: 15619216-e993-4721-b590-4c520615a67d
version: 1
schema_version: "1.0"
date: "2023-02-05"
author: Teymur Kheirkhabarov, Ecco, Florian Roth
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 15619216-e993-4721-b590-4c520615a67d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the use of getsystem Meterpreter/Cobalt Strike command by detecting a
  specific service starting. MITRE ATT&CK: T1134.001, T1134.002.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_parentImage:
              value: "*\\\\services.exe"
              case_insensitive: true
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*/c*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*echo*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*\\\\pipe\\\\*"
                          case_insensitive: true
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*cmd*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*%COMSPEC%*"
                                case_insensitive: true
                        minimum_should_match: 1
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*rundll32*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*.dll,a*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*/p:*"
                          case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_commandLine"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*MpCmdRun*"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\services.exe'; data_win_eventdata_commandLine matches '*/c*';
  data_win_eventdata_commandLine matches '*echo*', among other conditions.

known_false_positives: >
  Commandlines containing components like cmd accidentally. Jobs and services
  started with cmd. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://speakerdeck.com/heirhabarov/hunting-for-privilege-escalation-in-windows-environment
  - https://blog.cobaltstrike.com/2014/04/02/what-happens-when-i-type-getsystem/
  - https://attack.mitre.org/techniques/T1134/001/
  - https://attack.mitre.org/techniques/T1134/002/

response:
  message: >
    Potential Meterpreter/CobaltStrike Activity detected on host $agent_name$.
    Matched data_win_eventdata_parentImage: $data_win_eventdata_parentImage$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
    MITRE ATT&CK: T1134.001, T1134.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1134.001
    - T1134.002
  custom_tags:
    - meterpreter
    - cobaltstrike
    - process_creation
    - sysmon
    - privilege_escalation
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\.[Ee][Xx][Ee]/ AND ((data_win_eventdata_commandLine:/.*\/[Cc].*/ AND data_win_eventdata_commandLine:/.*[Ee][Cc][Hh][Oo].*/ AND data_win_eventdata_commandLine:/.*\\[Pp][Ii][Pp][Ee]\\.*/ AND (data_win_eventdata_commandLine:/.*[Cc][Mm][Dd].*/ OR data_win_eventdata_commandLine:/.*%[Cc][Oo][Mm][Ss][Pp][Ee][Cc]%.*/)) OR (data_win_eventdata_commandLine:/.*[Rr][Uu][Nn][Dd][Ll][Ll]32.*/ AND data_win_eventdata_commandLine:/.*\.[Dd][Ll][Ll],[Aa].*/ AND data_win_eventdata_commandLine:/.*\/[Pp]:.*/)) AND _exists_:data_win_eventdata_commandLine AND NOT (data_win_eventdata_commandLine:/.*[Mm][Pp][Cc][Mm][Dd][Rr][Uu][Nn].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 9bd04a79-dabe-4f1f-a5ff-92430265c96b
    name: Privilege Escalation via Named Pipe Impersonation
    reason: Same named-pipe impersonation technique family; alternate variant of getsystem.
  - id: f35c5d71-b489-4e22-a115-f003df287317
    name: Potential CobaltStrike Process Patterns
    reason: Other Cobalt Strike process patterns confirm an active beacon behind the getsystem.
  - id: 647c7b9e-d784-4fda-b9a0-45c565a7b729
    name: Operator Bloopers Cobalt Strike Commands
    reason: Operator mistakes in CS commands corroborate a hands-on-keyboard C2 session.
  - id: ae9c6a7c-9521-42a6-915e-5aaa8689d529
    name: CobaltStrike Load by Rundll32
    reason: Beacon DLL loading via rundll32 is a typical precursor to the beacon running getsystem.
  - id: 590a5f4c-6c8c-4f10-8307-89afe9453a9d
    name: Suspicious Child Process Created as System
    reason: After getsystem succeeds, SYSTEM-level children appear; catches post-escalation activity.
  - id: fdfcbd78-48f1-4a4b-90ac-d82241e368c5
    name: PsExec Service Execution
    reason: PsExec-style service execution is a parallel route to SYSTEM and lateral movement.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Services.exe spawning shells or rundll32
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Ss]ervices\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:(/.*[Cc]md.*/ OR /.*[Rr]und[Ll][Ll]32.*/ OR /.*[Pp]ower[Ss]hell.*/)
    pivot_on: host
    window: 2h
  - name: Suspicious named pipes
    query: data_win_system_eventID:(17 OR 18) AND data_win_eventdata_pipeName:(/.*[Mm]sagent_.*/ OR /.*[Pp]ostex_.*/ OR /.*[Mm]ojo.*/ OR /.*[Ss]tatus_.*/)
    pivot_on: host
    window: 2h
  - name: Service creation commands
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*sc.*create.*/ OR /.*sc.*config.*binpath.*/ OR /.*[Nn]et start.*/)
    pivot_on: host
    window: 4h
  - name: Beacon-like outbound from host processes
    query: data_win_system_eventID:3 AND data_win_eventdata_initiated:true AND data_win_eventdata_image:(/.*[Rr]und[Ll][Ll]32\.[Ee][Xx][Ee]/ OR /.*[Dd][Ll][Ll][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/)
    pivot_on: host
    window: 6h
  - name: SYSTEM credential access follow-on
    query: data_win_system_eventID:1 AND data_win_eventdata_user:/.*SYSTEM/ AND data_win_eventdata_commandLine:(/.*[Ll]sass.*/ OR /.*[Rr]eg.*save.*/ OR /.*[Nn]et user.*/)
    pivot_on: host
    window: 4h
