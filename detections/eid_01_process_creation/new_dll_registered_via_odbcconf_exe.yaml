name: New DLL Registered Via Odbcconf.EXE
id: 9f0a8bf3-a65b-440a-8c1e-5cb1547c8e70
version: 1
schema_version: "1.0"
date: "2023-05-22"
author: Kirill Kiryanov, Beyu Denis, Daniil Yugoslavskiy, oscd.community, Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 9f0a8bf3-a65b-440a-8c1e-5cb1547c8e70
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of "odbcconf" with "REGSVR" in order to register a new DLL
  (equivalent to running regsvr32). Attackers abuse this to install and run
  malicious DLLs. MITRE ATT&CK: T1218.008.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\odbcconf.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "odbcconf.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*REGSVR *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*.dll*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\odbcconf.exe'; data_win_eventdata_originalFileName equals 'odbcconf.exe';
  data_win_eventdata_commandLine matches '*REGSVR *', among other conditions.

known_false_positives: >
  Legitimate DLLs being registered via "odbcconf" will generate false positives.
  Investigate the path of the DLL and its content to determine if the action is
  authorized. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://learn.microsoft.com/en-us/sql/odbc/odbcconf-exe?view=sql-server-ver16
  - https://lolbas-project.github.io/lolbas/Binaries/Odbcconf/
  - https://redcanary.com/blog/raspberry-robin/
  - https://web.archive.org/web/20191023232753/https://twitter.com/Hexacorn/status/1187143326673330176
  - https://www.hexacorn.com/blog/2020/08/23/odbcconf-lolbin-trifecta/
  - https://www.trendmicro.com/en_us/research/17/h/backdoor-carrying-emails-set-sights-on-russian-speaking-businesses.html
  - https://attack.mitre.org/techniques/T1218/008/

response:
  message: >
    New DLL Registered Via Odbcconf.EXE detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1218.008
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218.008
  custom_tags:
    - registered
    - odbcconf
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Oo][Dd][Bb][Cc][Cc][Oo][Nn][Ff]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Oo][Dd][Bb][Cc][Cc][Oo][Nn][Ff]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Rr][Ee][Gg][Ss][Vv][Rr] .*/ AND data_win_eventdata_commandLine:/.*\.[Dd][Ll][Ll].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: ba4cfc11-d0fa-4d94-bf20-7c332c412e76
    name: Potentially Suspicious DLL Registered Via Odbcconf.EXE
    reason: Same odbcconf REGSVR abuse but with a suspicious DLL path/extension; confirms the registered DLL is attacker-staged.
  - id: 6b65c28e-11f3-46cb-902a-68f2cafaf474
    name: Odbcconf.EXE Suspicious DLL Location
    reason: Odbcconf loading a DLL from an unusual location corroborates malicious payload staging.
  - id: 3f5491e2-8db8-496b-9e95-1029fce852d4
    name: Driver/DLL Installation Via Odbcconf.EXE
    reason: Odbcconf driver/DLL install variant; attackers retry alternate odbcconf switches if one is blocked.
  - id: 070e9b80-6252-11eb-ae93-0242ac130002
    name: Detect Regsvr32 Application Control Bypass
    reason: Regsvr32 is the classic equivalent; odbcconf REGSVR is used as the evasion alternative to it.
  - id: 6f0947a4-1c5e-4e0d-8ac7-53159b8f23ca
    name: Potentially Suspicious Child Process Of Regsvr32
    reason: Child processes of the registration helper indicate the DLL executed a payload.
  - id: 0f0450f3-8b47-441e-a31b-15a91dc243e2
    name: Potential DLL File Download Via PowerShell Invoke-WebRequest
    reason: A DLL downloaded via PowerShell immediately before registration is the typical precursor.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: DLL loaded by odbcconf
    query: data_win_system_eventID:7 AND data_win_eventdata_image:*[Oo][Dd][Bb][Cc][Cc][Oo][Nn][Ff].exe AND data_win_eventdata_imageLoaded:*.dll
    pivot_on: host
    window: 2h
  - name: Children of odbcconf
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:*[Oo][Dd][Bb][Cc][Cc][Oo][Nn][Ff].exe
    pivot_on: host
    window: 2h
  - name: DLL files created in user-writable paths
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:*.dll AND (data_win_eventdata_targetFilename:*\Users\* OR data_win_eventdata_targetFilename:*\Temp\* OR data_win_eventdata_targetFilename:*\ProgramData\*)
    pivot_on: host
    window: 4h
  - name: Odbcconf response-file or config usage
    query: data_win_system_eventID:1 AND data_win_eventdata_image:*[Oo][Dd][Bb][Cc][Cc][Oo][Nn][Ff].exe AND (data_win_eventdata_commandLine:*[Rr][Ss][Pp]* OR data_win_eventdata_commandLine:*[Cc][Oo][Nn][Ff][Ii][Gg][Ss][Cc][Oo][Pp][Ee]*)
    pivot_on: host
    window: 4h
  - name: Outbound connections by odbcconf
    query: data_win_system_eventID:3 AND data_win_eventdata_image:*[Oo][Dd][Bb][Cc][Cc][Oo][Nn][Ff].exe
    pivot_on: host
    window: 2h
