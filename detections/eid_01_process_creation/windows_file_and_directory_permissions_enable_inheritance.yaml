name: Windows File and Directory Permissions Enable Inheritance
id: windows-file-directory-enable-inheritance-001
version: 1
schema_version: "1.0"
date: "2026-02-23"
author: SOCFortress LLC
status: production
type: Hunting

description: >
  Detects icacls.exe, cacls.exe, or xcacls.exe used with /inheritance:e flag 
  to restore inherited permissions from parent directories. Adversaries use this 
  to override restrictive custom permissions, exposing sensitive files to 
  unauthorized access. Used by crypto stealers and NetSupport RAT.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image: "*\\\\icacls.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\\\cacls.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\\\xcacls.exe"
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine: "*/inheritance:e*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-23 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-23 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Windows endpoints with Sysmon 
  installed and configured to log process creation events (EventID 1) with full 
  command-line arguments.

known_false_positives: >
  Administrators or scripts may use icacls for legitimate permission management. 
  Filter by user context and target path.

references:
  - https://attack.mitre.org/techniques/T1222/001/
  - https://www.splunk.com/en_us/blog/security/-applocker-rules-as-defense-evasion-complete-analysis.html

response:
  message: >
    Permission inheritance enabled on $agent_name$. 
    Command: $data_win_eventdata_commandLine$. 
    Process: $data_win_eventdata_image$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1222.001
  risk_score: 36
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 36
  threat_objects: []

tags:
  analytic_story:
    - Crypto Stealer
    - NetSupport RMM Tool Abuse
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1222.001
  custom_tags:
    - icacls
    - inheritance
    - permissions
    - hunting
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*icacls\.exe/ OR data_win_eventdata_image:/.*cacls\.exe/ OR data_win_eventdata_image:/.*xcacls\.exe/) AND data_win_eventdata_commandLine:/.*\/inheritance:e.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: windows-file-directory-remove-inheritance-001
    name: Windows File and Directory Permissions Remove Inheritance
    reason: Remove/enable inheritance are used in sequence by the same malware on dropped folders.
  - id: windows-files-dirs-access-rights-icacls-001
    name: Windows Files and Dirs Access Rights Modification Via Icacls
    reason: Explicit grants alongside inheritance reset indicate ACL manipulation of payload paths.
  - id: windows-modify-acl-permission-to-files-or-folder-001
    name: Windows Modify ACL Permission To Files Or Folder
    reason: Same behaviour class; confirms broader permission tampering.
  - id: b1b1e316-accc-11eb-a9b4-acde48001122
    name: ICACLS Grant Command
    reason: Grants to Everyone after resetting inheritance expose files for RAT/stealer operation.
  - id: 758ff488-18d5-4cbe-8ec4-02b6285a434f
    name: Remote Access Tool - NetSupport Execution
    reason: NetSupport RAT is a cited user of this technique; its execution confirms the incident.
  - id: 37e8d358-6408-4853-82f4-98333fca7014
    name: Remote Access Tool - NetSupport Execution From Unusual Location
    reason: NetSupport running from a user-writable path after permission reset points to a RAT drop.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: icacls/cacls ACL changes
    query: data_win_system_eventID:1 AND data_win_eventdata_image:(*\\icacls.exe OR *\\cacls.exe OR *\\xcacls.exe OR *\\takeown.exe)
    pivot_on: host
    window: 2h
  - name: Script host launching permission change
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:(*\\cmd.exe OR *\\powershell.exe OR *\\wscript.exe OR *\\mshta.exe) AND data_win_eventdata_commandLine:(*icacls* OR *cacls*)
    pivot_on: host
    window: 2h
  - name: File hiding via attrib
    query: data_win_system_eventID:1 AND data_win_eventdata_image:*\\attrib.exe AND data_win_eventdata_commandLine:(*+h* OR *+s*)
    pivot_on: host
    window: 4h
  - name: Persistence after ACL change
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(*schtasks* OR *CurrentVersion\\Run* OR *\\AppData\\*)
    pivot_on: host
    window: 4h
  - name: Executables dropped in user-writable paths
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\\(AppData|ProgramData|Temp)\\.*\.(exe|dll|bat|ps1|vbs)/
    pivot_on: host
    window: 2h
