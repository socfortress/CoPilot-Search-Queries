name: HackTool - Stracciatella Execution
id: 7a4d9232-92fc-404d-8ce1-4c92e7caf539
version: 1
schema_version: "1.0"
date: "2024-11-23"
author: pH-T (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 7a4d9232-92fc-404d-8ce1-4c92e7caf539
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects Stracciatella which executes a Powershell runspace from within C# (aka
  SharpPick technique) with AMSI, ETW and Script Block Logging disabled based on
  PE metadata characteristics. MITRE ATT&CK: T1059, T1685.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\Stracciatella.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "Stracciatella.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_description:
                    value: "Stracciatella"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*SHA256=9d25e61ec1527e2a69d7c2a4e3fe2fe15890710c198a66a9f25d99fdf6c7b956*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*SHA256=fd16609bd9830c63b9413671678bb159b89c357d21942ddbb6b93add808d121a*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_description
    - data_win_eventdata_hashes
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\Stracciatella.exe'; data_win_eventdata_originalFileName equals
  'Stracciatella.exe'; data_win_eventdata_description equals 'Stracciatella',
  among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/mgeeky/Stracciatella
  - https://attack.mitre.org/techniques/T1059/
  - https://attack.mitre.org/techniques/T1685/

response:
  message: >
    HackTool - Stracciatella Execution detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1059, T1685
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059
    - T1685
  custom_tags:
    - hacktool
    - stracciatella
    - process_creation
    - sysmon
    - execution
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ss][Tt][Rr][Aa][Cc][Cc][Ii][Aa][Tt][Ee][Ll][Ll][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ss][Tt][Rr][Aa][Cc][Cc][Ii][Aa][Tt][Ee][Ll][Ll][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_description:/[Ss][Tt][Rr][Aa][Cc][Cc][Ii][Aa][Tt][Ee][Ll][Ll][Aa]/ OR data_win_eventdata_hashes:/.*[Ss][Hh][Aa]256=9[Dd]25[Ee]61[Ee][Cc]1527[Ee]2[Aa]69[Dd]7[Cc]2[Aa]4[Ee]3[Ff][Ee]2[Ff][Ee]15890710[Cc]198[Aa]66[Aa]9[Ff]25[Dd]99[Ff][Dd][Ff]6[Cc]7[Bb]956.*/ OR data_win_eventdata_hashes:/.*[Ss][Hh][Aa]256=[Ff][Dd]16609[Bb][Dd]9830[Cc]63[Bb]9413671678[Bb][Bb]159[Bb]89[Cc]357[Dd]21942[Dd][Dd][Bb][Bb]6[Bb]93[Aa][Dd][Dd]808[Dd]121[Aa].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: ea9bf0fa-edec-4fb8-8b78-b119f2528186
    name: Windows Defender AMSI Trigger Detected
    reason: Stracciatella disables AMSI; AMSI triggers on the host show the payloads being scanned or an earlier failed attempt.
  - id: 41421f44-58f9-455d-838a-c398859841d4
    name: ETW Logging Tamper In .NET Processes Via CommandLine
    reason: ETW tampering in .NET processes is the same logging-blinding behaviour the tool implements.
  - id: a238b5d0-ce2d-4414-a676-7a531b3d13d6
    name: ETW Trace Evasion Activity
    reason: ETW trace evasion is the defence-evasion class the tool automates.
  - id: 30edb182-aa75-42c0-b0a9-e998bb29067c
    name: Potential AMSI Bypass Via .NET Reflection
    reason: AMSI bypass via .NET reflection is the same technique used by other loaders.
  - id: 92a974db-ab84-457f-9ec0-55db83d7a825
    name: Potential AMSI Bypass Using NULL Bits
    reason: Another AMSI bypass variant used by operators running PowerShell payloads in-process.
  - id: c4db14d9-7909-48b4-a054-aa14d89dbb19
    name: Malicious PowerShell Process - Encoded Command
    reason: Encoded PowerShell is a common payload form hosted by the runspace.
  - id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
    name: PowerShell Download and Execution Cradles
    reason: Download cradles often deliver the script that the runspace then runs.
  - id: 62b7ccc9-23b4-471e-aa15-6da3663c4d59
    name: PowerShell Base64 Encoded Reflective Assembly Load
    reason: Reflective .NET assembly loading is the neighbouring in-memory execution technique.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Network connections from the Stracciatella process
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Ss][Tt][Rr][Aa][Cc][Cc][Ii][Aa][Tt][Ee][Ll][Ll][Aa].*/
    pivot_on: host
    window: 2h
  - name: AMSI/ETW tamper strings in command lines
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Aa][Mm][Ss][Ii][Ii][Nn][Ii][Tt][Ff][Aa][Ii][Ll][Ee][Dd].*/ OR data_win_eventdata_commandLine:/.*[Aa][Mm][Ss][Ii][Ss][Cc][Aa][Nn][Bb][Uu][Ff][Ff][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Ee][Tt][Ww][Ee][Vv][Ee][Nn][Tt][Ww][Rr][Ii][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Aa][Mm][Ss][Ii]\.[Dd][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc][Rr][Ii][Pp][Tt][Bb][Ll][Oo][Cc][Kk][Ll][Oo][Gg][Gg][Ii][Nn][Gg].*/)
    pivot_on: host
    window: 4h
  - name: Script block logging showing runspace payloads
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Rr][Uu][Nn][Ss][Pp][Aa][Cc][Ee].*/ OR data_win_eventdata_scriptBlockText:/.*[Ii][Nn][Vv][Oo][Kk][Ee]\-[Ee][Xx][Pp][Rr][Ee][Ss][Ss][Ii][Oo][Nn].*/ OR data_win_eventdata_scriptBlockText:/.*[Ff][Rr][Oo][Mm][Bb][Aa][Ss][Ee]64[Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_scriptBlockText:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/)
    pivot_on: host
    window: 4h
  - name: Autorun and service persistence keys written
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND (data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/ OR data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt]\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss].*/ OR data_win_eventdata_targetObject:/.*[Ii][Mm][Aa][Gg][Ee] [Ff][Ii][Ll][Ee] [Ee][Xx][Ee][Cc][Uu][Tt][Ii][Oo][Nn] [Oo][Pp][Tt][Ii][Oo][Nn][Ss].*/ OR data_win_eventdata_targetObject:/.*[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]\\[Ss][Hh][Ee][Ll][Ll].*/)
    pivot_on: host
    window: 4h
  - name: Files dropped by the Stracciatella process
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*[Ss][Tt][Rr][Aa][Cc][Cc][Ii][Aa][Tt][Ee][Ll][Ll][Aa].*/
    pivot_on: host
    window: 2h
