                    value: "*Dell Threat Defense*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*DLP Endpoint*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Endpoint Detection*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
