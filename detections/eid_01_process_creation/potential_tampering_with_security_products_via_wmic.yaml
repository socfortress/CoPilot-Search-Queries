  query: data_win_system_eventID:"1" AND ((data_win_eventdata_commandLine:/.*[Ww][Mm][Ii][Cc].*/ AND data_win_eventdata_commandLine:/.*[Pp][Rr][Oo][Dd][Uu][Cc][Tt] .*/ AND data_win_eventdata_commandLine:/.*[Uu][Nn][Ii][Nn][Ss][Tt][Aa][Ll][Ll].*/ AND (data_win_eventdata_commandLine:/.*-[Nn][Oo][Ii][Nn][Tt][Ee][Rr][Aa][Cc][Tt][Ii][Vv][Ee].*/ OR data_win_eventdata_commandLine:/.*\/[Nn][Oo][Ii][Nn][Tt][Ee][Rr][Aa][Cc][Tt][Ii][Vv][Ee].*/ OR data_win_eventdata_commandLine:/.*–[Nn][Oo][Ii][Nn][Tt][Ee][Rr][Aa][Cc][Tt][Ii][Vv][Ee].*/ OR data_win_eventdata_commandLine:/.*—[Nn][Oo][Ii][Nn][Tt][Ee][Rr][Aa][Cc][Tt][Ii][Vv][Ee].*/ OR data_win_eventdata_commandLine:/.*―[Nn][Oo][Ii][Nn][Tt][Ee][Rr][Aa][Cc][Tt][Ii][Vv][Ee].*/)) OR (data_win_eventdata_commandLine:/.*[Ww][Mm][Ii][Cc].*/ AND data_win_eventdata_commandLine:/.*[Cc][Aa][Pp][Tt][Ii][Oo][Nn] [Ll][Ii][Kk][Ee] .*/ AND (data_win_eventdata_commandLine:/.*[Cc][Aa][Ll][Ll] [Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Cc][Aa][Ll][Ll] [Tt][Ee][Rr][Mm][Ii][Nn][Aa][Tt][Ee].*/)) OR (data_win_eventdata_commandLine:/.*[Pp][Rr][Oo][Cc][Ee][Ss][Ss] .*/ AND data_win_eventdata_commandLine:/.*[Ww][Hh][Ee][Rr][Ee] .*/ AND data_win_eventdata_commandLine:/.*[Dd][Ee][Ll][Ee][Tt][Ee].*/)) AND (data_win_eventdata_commandLine:/.*%[Cc][Aa][Rr][Bb][Oo][Nn]%.*/ OR data_win_eventdata_commandLine:/.*%[Cc][Yy][Ll][Aa][Nn][Cc][Ee]%.*/ OR data_win_eventdata_commandLine:/.*%[Ee][Nn][Dd][Pp][Oo][Ii][Nn][Tt]%.*/ OR data_win_eventdata_commandLine:/.*%[Ee][Ss][Ee][Tt]%.*/ OR data_win_eventdata_commandLine:/.*%[Mm][Aa][Ll][Ww][Aa][Rr][Ee]%.*/ OR data_win_eventdata_commandLine:/.*%[Ss][Oo][Pp][Hh][Oo][Ss]%.*/ OR data_win_eventdata_commandLine:/.*%[Ss][Yy][Mm][Aa][Nn][Tt][Ee][Cc]%.*/ OR data_win_eventdata_commandLine:/.*[Aa][Nn][Tt][Ii][Vv][Ii][Rr][Uu][Ss].*/ OR data_win_eventdata_commandLine:/.*[Aa][Vv][Gg] .*/ OR data_win_eventdata_commandLine:/.*[Cc][Aa][Rr][Bb][Oo][Nn] [Bb][Ll][Aa][Cc][Kk].*/ OR data_win_eventdata_commandLine:/.*[Cc][Aa][Rr][Bb][Oo][Nn][Bb][Ll][Aa][Cc][Kk].*/ OR data_win_eventdata_commandLine:/.*[Cc][Bb] [Dd][Ee][Ff][Ee][Nn][Ss][Ee] [Ss][Ee][Nn][Ss][Oo][Rr] 64-[Bb][Ii][Tt].*/ OR data_win_eventdata_commandLine:/.*[Cc][Rr][Oo][Ww][Dd][Ss][Tt][Rr][Ii][Kk][Ee] [Ss][Ee][Nn][Ss][Oo][Rr].*/ OR data_win_eventdata_commandLine:/.*[Cc][Yy][Ll][Aa][Nn][Cc][Ee] .*/ OR data_win_eventdata_commandLine:/.*[Dd][Ee][Ll][Ll] [Tt][Hh][Rr][Ee][Aa][Tt] [Dd][Ee][Ff][Ee][Nn][Ss][Ee].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ll][Pp] [Ee][Nn][Dd][Pp][Oo][Ii][Nn][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ee][Nn][Dd][Pp][Oo][Ii][Nn][Tt] [Dd][Ee][Tt][Ee][Cc][Tt][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ee][Nn][Dd][Pp][Oo][Ii][Nn][Tt] [Pp][Rr][Oo][Tt][Ee][Cc][Tt][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ee][Nn][Dd][Pp][Oo][Ii][Nn][Tt] [Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy].*/ OR data_win_eventdata_commandLine:/.*[Ee][Nn][Dd][Pp][Oo][Ii][Nn][Tt] [Ss][Ee][Nn][Ss][Oo][Rr].*/ OR data_win_eventdata_commandLine:/.*[Ee][Ss][Ee][Tt] [Ff][Ii][Ll][Ee] [Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy].*/ OR data_win_eventdata_commandLine:/.*[Ll][Oo][Gg][Rr][Hh][Yy][Tt][Hh][Mm] [Ss][Yy][Ss][Tt][Ee][Mm] [Mm][Oo][Nn][Ii][Tt][Oo][Rr] [Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Mm][Aa][Ll][Ww][Aa][Rr][Ee][Bb][Yy][Tt][Ee][Ss].*/ OR data_win_eventdata_commandLine:/.*[Mm][Cc][Aa][Ff][Ee][Ee] [Aa][Gg][Ee][Nn][Tt].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt] [Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy] [Cc][Ll][Ii][Ee][Nn][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ss][Oo][Pp][Hh][Oo][Ss] [Aa][Nn][Tt][Ii]-[Vv][Ii][Rr][Uu][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ss][Oo][Pp][Hh][Oo][Ss] [Aa][Uu][Tt][Oo][Uu][Pp][Dd][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Oo][Pp][Hh][Oo][Ss] [Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll] [Ss][Tt][Oo][Rr][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Oo][Pp][Hh][Oo][Ss] [Mm][Aa][Nn][Aa][Gg][Ee][Mm][Ee][Nn][Tt] [Cc][Oo][Nn][Ss][Oo][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Oo][Pp][Hh][Oo][Ss] [Mm][Aa][Nn][Aa][Gg][Ee][Mm][Ee][Nn][Tt] [Dd][Aa][Tt][Aa][Bb][Aa][Ss][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Oo][Pp][Hh][Oo][Ss] [Mm][Aa][Nn][Aa][Gg][Ee][Mm][Ee][Nn][Tt] [Ss][Ee][Rr][Vv][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Ss][Oo][Pp][Hh][Oo][Ss] [Rr][Ee][Mm][Oo][Tt][Ee] [Mm][Aa][Nn][Aa][Gg][Ee][Mm][Ee][Nn][Tt] [Ss][Yy][Ss][Tt][Ee][Mm].*/ OR data_win_eventdata_commandLine:/.*[Ss][Oo][Pp][Hh][Oo][Ss] [Uu][Pp][Dd][Aa][Tt][Ee] [Mm][Aa][Nn][Aa][Gg][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Tt][Hh][Rr][Ee][Aa][Tt] [Pp][Rr][Oo][Tt][Ee][Cc][Tt][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*[Vv][Ii][Rr][Uu][Ss][Ss][Cc][Aa][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ww][Ee][Bb][Rr][Oo][Oo][Tt] [Ss][Ee][Cc][Uu][Rr][Ee][Aa][Nn][Yy][Ww][Hh][Ee][Rr][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 51cbac1e-eee3-4a90-b1b7-358efb81fa0a
    name: Potential Windows Defender Tampering Via Wmic.EXE
    reason: same wmic abuse aimed specifically at Defender
  - id: b53317a0-8acf-4fd1-8de8-a5401e776b96
    name: Application Removed Via Wmic.EXE
    reason: wmic product uninstall of security software
  - id: 49d9671b-0a0a-4c09-8280-d215bfd30662
    name: Application Termination Attempt via Wmic.EXE
    reason: wmic process terminate against AV/EDR processes
  - id: 0b7163dc-7eee-4960-af17-c0cd517f92da
    name: Service Started/Stopped Via Wmic.EXE
    reason: wmic used to stop security services
  - id: 5e95028c-5229-4214-afae-d653d573d0ec
    name: Security Service Disabled Via Reg.EXE
    reason: parallel registry disablement of security services
  - id: 17769c90-230e-488b-a463-e05c08e9d48f
    name: Powershell Defender Exclusion
    reason: other defence-evasion path used alongside
  - id: 1444443e-6757-43e4-9ea4-c8fc705f79a2
    name: Boot Configuration Tampering Via Bcdedit.EXE
    reason: ransomware prep that follows disabling defences
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other security-product tampering commands
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Cc] +(stop|config|delete).*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt] +[Ss][Tt][Oo][Pp].*/ OR data_win_eventdata_commandLine:/.*[Tt][Aa][Ss][Kk][Kk][Ii][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Ss]et\-[Mm][Pp][Pp]reference.*/)
    pivot_on: host
    window: 4h
  - name: Defender / security service registry changes
    query: data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*[Ww]indows [Dd]efender.*/ OR data_win_eventdata_targetObject:/.*[Ss]ervices\\(Sense|WinDefend|WdFilter).*/)
    pivot_on: host
    window: 4h
  - name: 'Ransomware precursors: shadow copies and recovery'
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*[Dd]elete.*/ OR data_win_eventdata_commandLine:/.*[Bb][Cc][Dd][Ee][Dd][Ii][Tt].*[Rr]ecovery.*/ OR data_win_eventdata_commandLine:/.*[Ww][Mm][Ii][Cc].*[Ss]hadowcopy.*/)
    pivot_on: host
    window: 6h
  - name: Remote wmic execution
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Ww][Mm][Ii][Cc].*\/[Nn][Oo][Dd][Ee]:.*/
    pivot_on: host
    window: 4h
