name: PUA - Chisel Tunneling Tool Execution
id: 8b0e12da-d3c3-49db-bb4f-256703f380e5
version: 1
schema_version: "1.0"
date: "2023-02-13"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 8b0e12da-d3c3-49db-bb4f-256703f380e5
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects usage of the Chisel tunneling tool via the commandline arguments.
  MITRE ATT&CK: T1090.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\chisel.exe"
                    case_insensitive: true
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*exe client *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*exe server *"
                                case_insensitive: true
                        minimum_should_match: 1
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*-socks5*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*-reverse*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* r:*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine: "*:127.0.0.1:*"
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*-tls-skip-verify *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*:socks*"
                                case_insensitive: true
                        minimum_should_match: 1
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\chisel.exe'; data_win_eventdata_commandLine matches '*exe client *';
  data_win_eventdata_commandLine matches '*exe server *', among other
  conditions.

known_false_positives: >
  Some false positives may occur with other tools with similar commandlines.
  Baseline expected activity in your environment and tune this detection before
  relying on it for automated response.

references:
  - https://github.com/jpillora/chisel/
  - https://arcticwolf.com/resources/blog/lorenz-ransomware-chiseling-in/
  - https://blog.sekoia.io/lucky-mouse-incident-response-to-detection-engineering/
  - https://attack.mitre.org/techniques/T1090/001/

response:
  message: >
    PUA - Chisel Tunneling Tool Execution detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1090.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1090.001
  custom_tags:
    - chisel
    - tunneling
    - process_creation
    - sysmon
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Cc][Hh][Ii][Ss][Ee][Ll]\.[Ee][Xx][Ee]/ OR ((data_win_eventdata_commandLine:/.*[Ee][Xx][Ee] [Cc][Ll][Ii][Ee][Nn][Tt] .*/ OR data_win_eventdata_commandLine:/.*[Ee][Xx][Ee] [Ss][Ee][Rr][Vv][Ee][Rr] .*/) AND (data_win_eventdata_commandLine:/.*-[Ss][Oo][Cc][Kk][Ss]5.*/ OR data_win_eventdata_commandLine:/.*-[Rr][Ee][Vv][Ee][Rr][Ss][Ee].*/ OR data_win_eventdata_commandLine:/.* [Rr]:.*/ OR data_win_eventdata_commandLine:/.*:127\.0\.0\.1:.*/ OR data_win_eventdata_commandLine:/.*-[Tt][Ll][Ss]-[Ss][Kk][Ii][Pp]-[Vv][Ee][Rr][Ii][Ff][Yy] .*/ OR data_win_eventdata_commandLine:/.*:[Ss][Oo][Cc][Kk][Ss].*/)))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: cf93e05e-d798-4d9e-b522-b0248dc61eaf
    name: HackTool - SharpChisel Execution
    reason: The .NET Chisel port; same tunnelling intent, check for either variant.
  - id: 32410e29-5f94-4568-b6a3-d91a8adad863
    name: PUA - Fast Reverse Proxy (FRP) Execution
    reason: Alternative reverse proxy; operators often keep a fallback tunnel.
  - id: d7654f02-e04b-4934-9838-65c46f187ebc
    name: PUA- IOX Tunneling Tool Execution
    reason: Another tunnelling/proxy tool commonly staged alongside Chisel.
  - id: ee37eb7c-a4e7-4cd5-8fa4-efa27f1c3f31
    name: PUA - Ngrok Execution
    reason: Parallel tunnelling channel for persistent access.
  - id: 322ed9ec-fcab-4f67-9a34-e7c6aef43614
    name: New Port Forwarding Rule Added Via Netsh.EXE
    reason: Port forwarding complements Chisel to expose internal services.
  - id: 8a3038e8-9c9d-46f8-b184-66234a160f6f
    name: Potential Remote Desktop Tunneling
    reason: Chisel is frequently used to tunnel RDP to the attacker.
  - id: 54773c5f-f1cc-4703-9126-2f797d96a69d
    name: PUA - Advanced Port Scanner Execution
    reason: Scanning precedes tunnelling to reach discovered internal services.
  - id: 730fc21b-eaff-474b-ad23-90fd265d4988
    name: Psexec Execution
    reason: Lateral movement through the SOCKS tunnel.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other tunnelling and proxy tools
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*frpc?(\.exe)?.*/ OR data_win_eventdata_commandLine:/.*[Nn]grok.*/ OR data_win_eventdata_commandLine:/.*[Ii]ox.*/ OR data_win_eventdata_commandLine:/.*[Pp]link.* -[LRD] .*/ OR data_win_eventdata_commandLine:/.*[Ll]igolo.*/ OR data_win_eventdata_commandLine:/.*[Cc]loudflared.*/)
    pivot_on: host
    window: 6h
  - name: Port forwarding and firewall opening
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*netsh.*portproxy.*/ OR data_win_eventdata_commandLine:/.*netsh.*advfirewall.*(add|set).*/ OR data_win_eventdata_commandLine:/.*New-NetFirewallRule.*/)
    pivot_on: host
    window: 4h
  - name: Download of the tunnel binary
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*(curl|wget|certutil|bitsadmin|Invoke-WebRequest|iwr).*chisel.*/ OR data_win_eventdata_commandLine:/.*(curl|wget|certutil|Invoke-WebRequest).*\.(exe|zip|gz).*/)
    pivot_on: host
    window: 4h
  - name: Lateral movement and RDP enablement
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*mstsc.*/ OR data_win_eventdata_commandLine:/.*[Pp]s[Ee]xec.*/ OR data_win_eventdata_commandLine:/.*fDenyTSConnections.*/ OR data_win_eventdata_commandLine:/.*net +user.*\/add.*/)
    pivot_on: host
    window: 6h
  - name: Persistence for the tunnel
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*schtasks.*\/create.*/ OR data_win_eventdata_commandLine:/.*sc +create.*/ OR data_win_eventdata_commandLine:/.*CurrentVersion\\Run.*/)
    pivot_on: host
    window: 6h
