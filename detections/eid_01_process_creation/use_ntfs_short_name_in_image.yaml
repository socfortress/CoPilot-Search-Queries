name: Use NTFS Short Name in Image
id: 3ef5605c-9eb9-47b0-9a71-b727e6aa5c3b
version: 1
schema_version: "1.0"
date: "2023-07-20"
author: frack113, Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 3ef5605c-9eb9-47b0-9a71-b727e6aa5c3b
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detect use of the Windows 8.3 short name. Which could be used as a method to
  avoid Image based detection. MITRE ATT&CK: T1564.004.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*~1.bat*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*~1.dll*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*~1.exe*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*~1.hta*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*~1.js*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*~1.msi*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*~1.ps1*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*~1.tmp*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*~1.vbe*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*~1.vbs*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*~2.bat*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*~2.dll*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*~2.exe*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*~2.hta*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*~2.js*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*~2.msi*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*~2.ps1*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*~2.tmp*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*~2.vbe*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*~2.vbs*"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_parentImage"
        - bool:
            must_not:
              - term:
                  data_win_eventdata_parentImage:
                    value: "C:\\Windows\\explorer.exe"
                    case_insensitive: true
        - exists:
            field: "data_win_eventdata_parentImage"
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_parentImage:
                          value: "*\\\\WebEx\\\\WebexHost.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_parentImage:
                          value: "*\\\\thor\\\\thor64.exe"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_image:
                          value: "C:\\PROGRA~1\\WinZip\\WZPREL~1.EXE"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\VCREDI~1.EXE"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches '*~1.bat*';
  data_win_eventdata_image matches '*~1.dll*'; data_win_eventdata_image matches
  '*~1.exe*', among other conditions.

known_false_positives: >
  Software Installers. Baseline expected activity in your environment and tune
  this detection before relying on it for automated response.

references:
  - https://www.acunetix.com/blog/articles/windows-short-8-3-filenames-web-security-problem/
  - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-2000-server/cc959352(v=technet.10)
  - https://twitter.com/jonasLyk/status/1555914501802921984
  - https://attack.mitre.org/techniques/T1564/004/

response:
  message: >
    Use NTFS Short Name in Image detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_parentImage: $data_win_eventdata_parentImage$. MITRE
    ATT&CK: T1564.004
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_parentImage
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1564.004
  custom_tags:
    - short
    - image
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\~1\.[Bb][Aa][Tt].*/ OR data_win_eventdata_image:/.*\~1\.[Dd][Ll][Ll].*/ OR data_win_eventdata_image:/.*\~1\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\~1\.[Hh][Tt][Aa].*/ OR data_win_eventdata_image:/.*\~1\.[Jj][Ss].*/ OR data_win_eventdata_image:/.*\~1\.[Mm][Ss][Ii].*/ OR data_win_eventdata_image:/.*\~1\.[Pp][Ss]1.*/ OR data_win_eventdata_image:/.*\~1\.[Tt][Mm][Pp].*/ OR data_win_eventdata_image:/.*\~1\.[Vv][Bb][Ee].*/ OR data_win_eventdata_image:/.*\~1\.[Vv][Bb][Ss].*/ OR data_win_eventdata_image:/.*\~2\.[Bb][Aa][Tt].*/ OR data_win_eventdata_image:/.*\~2\.[Dd][Ll][Ll].*/ OR data_win_eventdata_image:/.*\~2\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\~2\.[Hh][Tt][Aa].*/ OR data_win_eventdata_image:/.*\~2\.[Jj][Ss].*/ OR data_win_eventdata_image:/.*\~2\.[Mm][Ss][Ii].*/ OR data_win_eventdata_image:/.*\~2\.[Pp][Ss]1.*/ OR data_win_eventdata_image:/.*\~2\.[Tt][Mm][Pp].*/ OR data_win_eventdata_image:/.*\~2\.[Vv][Bb][Ee].*/ OR data_win_eventdata_image:/.*\~2\.[Vv][Bb][Ss].*/) AND _exists_:data_win_eventdata_parentImage AND NOT (data_win_eventdata_parentImage:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\.[Ee][Xx][Ee]/) AND _exists_:data_win_eventdata_parentImage AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_parentImage:/.*\\[Ww][Ee][Bb][Ee][Xx]\\[Ww][Ee][Bb][Ee][Xx][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Tt][Hh][Oo][Rr]\\[Tt][Hh][Oo][Rr]64\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa]\~1\\[Ww][Ii][Nn][Zz][Ii][Pp]\\[Ww][Zz][Pp][Rr][Ee][Ll]\~1\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Vv][Cc][Rr][Ee][Dd][Ii]\~1\.[Ee][Xx][Ee]/)

correlation:
  # Authored by the correlation engine for review.
  enrichment_searches:
  # NEW ad-hoc searches the engine runs around an alert from this rule, scoped to
  # the alert's host/user/IP within the window (not existing CoPilot Searches).
    - name: "Sysmon activity on this host in the window"
      query: 'data_win_system_channel:"Microsoft-Windows-Sysmon/Operational"'
      pivot_on: [host]
      window: 1h
    - name: "Process creation on this host"
      query: 'data_win_system_eventID:"1"'
      pivot_on: [host]
      window: 1h
    - name: "Network connections from this host"
      query: 'data_win_system_eventID:"3"'
      pivot_on: [host]
      window: 1h
    - name: "High-severity alerts on this host"
      query: 'rule_level:>=10'
      pivot_on: [host]
      window: 1h
