name: Hypervisor-protected Code Integrity (HVCI) Related Registry Tampering Via CommandLine
id: 6225c53a-a96e-4235-b28f-8d7997cd96eb
version: 1
schema_version: "1.0"
date: "2026-01-26"
author: Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 6225c53a-a96e-4235-b28f-8d7997cd96eb
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the tampering of Hypervisor-protected Code Integrity (HVCI) related
  registry values via command line tool reg.exe. HVCI uses virtualization-based
  security to protect code integrity by ensuring that only trusted code can run
  in kernel mode. Adversaries may tamper with HVCI to load malicious or unsigned
  drivers, which can be used to escalate privileges, maintain persistence, or
  evade security mechanisms. MITRE ATT&CK: T1685.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\powershell.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\pwsh.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\reg.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "PowerShell.EXE"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "pwsh.dll"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "reg.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*add *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*New-ItemProperty *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Set-ItemProperty *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*si *"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*\\\\DeviceGuard*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*EnableVirtualizationBasedSecurity*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*HypervisorEnforcedCodeIntegrity*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\powershell.exe'; data_win_eventdata_image matches '*\pwsh.exe';
  data_win_eventdata_image matches '*\reg.exe', among other conditions.

known_false_positives: >
  Legitimate system administration tasks that require disabling HVCI for
  troubleshooting purposes when certain drivers or applications are incompatible
  with it. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.sophos.com/en-us/blog/sharpening-the-knife-gold-blades-strategic-evolution
  - https://learn.microsoft.com/en-us/windows/security/hardware-security/enable-virtualization-based-protection-of-code-integrity
  - https://attack.mitre.org/techniques/T1685/

response:
  message: >
    Hypervisor-protected Code Integrity (HVCI) Related Registry Tampering Via
    CommandLine detected on host $agent_name$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1685
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685
  custom_tags:
    - hypervisor
    - protected
    - integrity
    - process_creation
    - sysmon
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Ee][Gg]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Pp][Ww][Ss][Hh]\.[Dd][Ll][Ll]/ OR data_win_eventdata_originalFileName:/[Rr][Ee][Gg]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*[Aa][Dd][Dd] .*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Ww]-[Ii][Tt][Ee][Mm][Pp][Rr][Oo][Pp][Ee][Rr][Tt][Yy] .*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Ii][Tt][Ee][Mm][Pp][Rr][Oo][Pp][Ee][Rr][Tt][Yy] .*/ OR data_win_eventdata_commandLine:/.*[Ss][Ii] .*/) AND data_win_eventdata_commandLine:/.*\\[Dd][Ee][Vv][Ii][Cc][Ee][Gg][Uu][Aa][Rr][Dd].*/ AND (data_win_eventdata_commandLine:/.*[Ee][Nn][Aa][Bb][Ll][Ee][Vv][Ii][Rr][Tt][Uu][Aa][Ll][Ii][Zz][Aa][Tt][Ii][Oo][Nn][Bb][Aa][Ss][Ee][Dd][Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy].*/ OR data_win_eventdata_commandLine:/.*[Hh][Yy][Pp][Ee][Rr][Vv][Ii][Ss][Oo][Rr][Ee][Nn][Ff][Oo][Rr][Cc][Ee][Dd][Cc][Oo][Dd][Ee][Ii][Nn][Tt][Ee][Gg][Rr][Ii][Tt][Yy].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: fd877b94-9bb5-4191-bb25-d79cbd93c167
    name: Dumping of Sensitive Hives Via Reg.EXE
    reason: Same reg.exe operator hands often disable VBS/HVCI and then dump SAM/SECURITY hives once kernel-level protections are down.
  - id: 431a1fdb-4799-4f3b-91c3-a683b003fc49
    name: New Kernel Driver Via SC.EXE
    reason: HVCI is disabled to allow unsigned or vulnerable drivers; a driver service created via sc.exe is the direct follow-on.
  - id: e76ca062-4de0-4d79-8d90-160a0d335eca
    name: PUA - Kernel Driver Utility (KDU) Execution
    reason: KDU loads vulnerable signed drivers (BYOVD), a step that needs HVCI off first.
  - id: 1444443e-6757-43e4-9ea4-c8fc705f79a2
    name: Boot Configuration Tampering Via Bcdedit.EXE
    reason: bcdedit changes (testsigning, hypervisorlaunchtype off) are the companion way to weaken code integrity.
  - id: a1b2c3d4-e5f6-a7b8-c9d0-e1f2a3b4c5d6
    name: Disabling Windows Defender WMI Autologger Session via Reg.exe
    reason: Another reg.exe defense-evasion step that typically sits in the same tampering burst.
  - id: 8470d755-0c13-45b3-bd63-387a373c10cf
    name: Reg exe Manipulating Windows Services Registry Keys
    reason: Registering or altering a driver service key via reg.exe follows HVCI disabling when loading a malicious driver.
  - id: 4931188c-178e-4ee7-a348-39e8a7a56821
    name: Filter Driver Unloaded Via Fltmc.EXE
    reason: Unloading security minifilter drivers is a parallel defense-evasion action once code integrity is relaxed.
  - id: 17769c90-230e-488b-a463-e05c08e9d48f
    name: Powershell Defender Exclusion
    reason: Defender exclusions are commonly added alongside HVCI tampering before dropping the payload driver or tool.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Registry changes to DeviceGuard / HVCI / LSA protection keys
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*([Dd][Ee][Vv][Ii][Cc][Ee][Gg][Uu][Aa][Rr][Dd]|[Hh][Yy][Pp][Ee][Rr][Vv][Ii][Ss][Oo][Rr][Ee][Nn][Ff][Oo][Rr][Cc][Ee][Dd][Cc][Oo][Dd][Ee][Ii][Nn][Tt][Ee][Gg][Rr][Ii][Tt][Yy]|[Ll][Ss][Aa][Cc][Ff][Gg][Ff][Ll][Aa][Gg][Ss]).*/
    pivot_on:
    - host
    window: 4h
  - name: Kernel driver service creation
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Ss][Cc](.[Ee][Xx][Ee])? +[Cc][Rr][Ee][Aa][Tt][Ee].*[Tt][Yy][Pp][Ee]= *[Kk][Ee][Rr][Nn][Ee][Ll].*/
    pivot_on:
    - host
    window: 4h
  - name: Driver file (.sys) written to disk
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.[Ss][Yy][Ss]/
    pivot_on:
    - host
    window: 4h
  - name: Boot configuration weakening via bcdedit
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Bb][Cc][Dd][Ee][Dd][Ii][Tt])\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*([Tt][Ee][Ss][Tt][Ss][Ii][Gg][Nn][Ii][Nn][Gg]|[Hh][Yy][Pp][Ee][Rr][Vv][Ii][Ss][Oo][Rr][Ll][Aa][Uu][Nn][Cc][Hh][Tt][Yy][Pp][Ee]|[Nn][Oo][Ii][Nn][Tt][Ee][Gg][Rr][Ii][Tt][Yy][Cc][Hh][Ee][Cc][Kk][Ss]|[Ll][Oo][Aa][Dd][Oo][Pp][Tt][Ii][Oo][Nn][Ss]).*/
    pivot_on:
    - host
    window: 4h
  - name: Credential store access after protections lowered (hive save, comsvcs MiniDump)
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Rr][Ee][Gg] +([Ss][Aa][Vv][Ee]|[Ee][Xx][Pp][Oo][Rr][Tt]).*[Hh][Kk][Ll][Mm]\\([Ss][Aa][Mm]|[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]|[Ss][Yy][Ss][Tt][Ee][Mm])|[Cc][Oo][Mm][Ss][Vv][Cc][Ss].*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp]).*/
    pivot_on:
    - host
    window: 6h
