name: Potential Remote Desktop Tunneling
id: 8a3038e8-9c9d-46f8-b184-66234a160f6f
version: 1
schema_version: "1.0"
date: "2022-09-27"
author: Tim Rauch, Elastic (idea)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 8a3038e8-9c9d-46f8-b184-66234a160f6f
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential use of an SSH utility to establish RDP over a reverse SSH
  Tunnel. This can be used by attackers to enable routing of network packets
  that would otherwise not reach their intended destination. MITRE ATT&CK:
  T1021.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine: "*:3389*"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -L *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -P *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -R *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -pw *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -ssh *"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*:3389*'; data_win_eventdata_commandLine matches '* -L *';
  data_win_eventdata_commandLine matches '* -P *', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.elastic.co/guide/en/security/current/potential-remote-desktop-tunneling-detected.html
  - https://attack.mitre.org/techniques/T1021/

response:
  message: >
    Potential Remote Desktop Tunneling detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1021
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1021
  custom_tags:
    - desktop
    - tunneling
    - process_creation
    - sysmon
    - lateral_movement
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*:3389.*/ AND (data_win_eventdata_commandLine:/.* -[Ll] .*/ OR data_win_eventdata_commandLine:/.* -[Pp] .*/ OR data_win_eventdata_commandLine:/.* -[Rr] .*/ OR data_win_eventdata_commandLine:/.* -[Pp][Ww] .*/ OR data_win_eventdata_commandLine:/.* -[Ss][Ss][Hh] .*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: f38ce0b9-5e97-4b47-a211-7dc8d8b871da
    name: Potential RDP Tunneling Via Plink
    reason: Plink is the most common binary behind -L/-R 3389 forwards; same tunnel via a named tool.
  - id: 1c12727d-02bf-45ff-a9f3-d49806a3cf43
    name: Renamed Plink Execution
    reason: Attackers rename plink to dodge image-name checks on this exact tunnel.
  - id: f7d7ebd5-a016-46e2-9c54-f9932f2d386d
    name: Potential RDP Tunneling Via SSH
    reason: Native ssh.exe -L/-R 3389 is the living-off-the-land variant of the same tunnel.
  - id: 782d6f3e-4c5d-4b8c-92a3-1d05fed72e63
    name: RDP Port Forwarding Rule Added Via Netsh.EXE
    reason: 'Alternative pivot: netsh portproxy to 3389 on the same host.'
  - id: 01aeb693-138d-49d2-9403-c4f52d7d3d62
    name: RDP Connection Allowed Via Netsh.EXE
    reason: Firewall opened for RDP is the usual precursor to a tunnel being reachable.
  - id: 0d5675be-bc88-4172-86d3-1e96a4476536
    name: Potential Tampering With RDP Related Registry Keys Via Reg.EXE
    reason: RDP enablement (fDenyTSConnections) precedes tunneling to the host.
  - id: 954f0af7-62dd-418f-b3df-a84bc2c7a774
    name: New Remote Desktop Connection Initiated Via Mstsc.EXE
    reason: 'Follow-on: mstsc to localhost or the tunnel endpoint is the attacker using the tunnel.'
  - id: ed74fe75-7594-4b4b-ae38-e38e3fd2eb23
    name: Outbound RDP Connections Over Non-Standard Tools
    reason: Non-mstsc RDP traffic confirms tunnel or pivot use.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Tunneling client executions
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Pp][Ll][Ii][Nn][Kk]|[Ss][Ss][Hh]|[Cc][Hh][Ii][Ss][Ee][Ll]|[Nn][Gg][Rr][Oo][Kk]|[Ii][Oo][Xx])\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Pp].?[Ll][Ii][Nn][Kk].*/)
    pivot_on: host
    window: 4h
  - name: Netsh portproxy or RDP firewall changes
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Nn][Ee][Tt][Ss][Hh]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*[Pp][Oo][Rr][Tt][Pp][Rr][Oo][Xx][Yy].*/ OR data_win_eventdata_commandLine:/.*3389.*/)
    pivot_on: host
    window: 4h
  - name: RDP enablement in registry
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND data_win_eventdata_targetObject:/.*([Ff][Dd][Ee][Nn][Yy][Tt][Ss][Cc][Oo][Nn][Nn][Ee][Cc][Tt][Ii][Oo][Nn][Ss]|[Tt]erminal [Ss]erver).*/
    pivot_on: host
    window: 6h
  - name: Connections involving port 3389
    query: data_win_system_eventID:"3" AND (data_win_eventdata_destinationPort:"3389" OR data_win_eventdata_sourcePort:"3389")
    pivot_on: host
    window: 4h
  - name: RDP logons (type 10)
    query: data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"10"
    pivot_on: host
    window: 6h
