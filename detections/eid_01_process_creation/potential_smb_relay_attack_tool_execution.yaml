name: Potential SMB Relay Attack Tool Execution
id: 5589ab4f-a767-433c-961d-c91f3f704db1
version: 1
schema_version: "1.0"
date: "2023-02-14"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 5589ab4f-a767-433c-961d-c91f3f704db1
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects different hacktools used for relay attacks on Windows for privilege
  escalation. MITRE ATT&CK: T1557.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*PetitPotam*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*RottenPotato*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*HotPotato*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*JuicyPotato*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\just_dce_*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*Juicy Potato*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\temp\\\\rot.exe*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\Potato.exe*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\SpoolSample.exe*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\Responder.exe*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\smbrelayx*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\ntlmrelayx*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\LocalPotato*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Invoke-Tater*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* smbrelay*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* ntlmrelay*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*cme smb *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /ntlm:NTLMhash *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Invoke-PetitPotam*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.exe -t * -p *"
                    case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*.exe -c \"{*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*}\" -z"
                          case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*HotPotatoes6*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*HotPotatoes7*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*HotPotatoes *"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*PetitPotam*'; data_win_eventdata_image matches '*RottenPotato*';
  data_win_eventdata_image matches '*HotPotato*', among other conditions.

known_false_positives: >
  Legitimate files with these rare hacktool names. Baseline expected activity in
  your environment and tune this detection before relying on it for automated
  response.

references:
  - https://foxglovesecurity.com/2016/09/26/rotten-potato-privilege-escalation-from-service-accounts-to-system/
  - https://pentestlab.blog/2017/04/13/hot-potato/
  - https://github.com/ohpe/juicy-potato
  - https://hunter2.gitbook.io/darthsidious/other/war-stories/domain-admin-in-30-minutes
  - https://hunter2.gitbook.io/darthsidious/execution/responder-with-ntlm-relay-and-empire
  - https://www.localpotato.com/
  - https://attack.mitre.org/techniques/T1557/001/

response:
  message: >
    Potential SMB Relay Attack Tool Execution detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1557.001
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1557.001
  custom_tags:
    - relay
    - attack
    - process_creation
    - sysmon
    - collection
    - execution
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Pp][Ee][Tt][Ii][Tt][Pp][Oo][Tt][Aa][Mm].*/ OR data_win_eventdata_image:/.*[Rr][Oo][Tt][Tt][Ee][Nn][Pp][Oo][Tt][Aa][Tt][Oo].*/ OR data_win_eventdata_image:/.*[Hh][Oo][Tt][Pp][Oo][Tt][Aa][Tt][Oo].*/ OR data_win_eventdata_image:/.*[Jj][Uu][Ii][Cc][Yy][Pp][Oo][Tt][Aa][Tt][Oo].*/ OR data_win_eventdata_image:/.*\\[Jj][Uu][Ss][Tt]_[Dd][Cc][Ee]_.*/ OR data_win_eventdata_image:/.*[Jj][Uu][Ii][Cc][Yy] [Pp][Oo][Tt][Aa][Tt][Oo].*/ OR data_win_eventdata_image:/.*\\[Tt][Ee][Mm][Pp]\\[Rr][Oo][Tt]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Tt][Aa][Tt][Oo]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Ss][Pp][Oo][Oo][Ll][Ss][Aa][Mm][Pp][Ll][Ee]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Rr][Ee][Ss][Pp][Oo][Nn][Dd][Ee][Rr]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Ss][Mm][Bb][Rr][Ee][Ll][Aa][Yy][Xx].*/ OR data_win_eventdata_image:/.*\\[Nn][Tt][Ll][Mm][Rr][Ee][Ll][Aa][Yy][Xx].*/ OR data_win_eventdata_image:/.*\\[Ll][Oo][Cc][Aa][Ll][Pp][Oo][Tt][Aa][Tt][Oo].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Tt][Aa][Tt][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.* [Ss][Mm][Bb][Rr][Ee][Ll][Aa][Yy].*/ OR data_win_eventdata_commandLine:/.* [Nn][Tt][Ll][Mm][Rr][Ee][Ll][Aa][Yy].*/ OR data_win_eventdata_commandLine:/.*[Cc][Mm][Ee] [Ss][Mm][Bb] .*/ OR data_win_eventdata_commandLine:/.* \/[Nn][Tt][Ll][Mm]:[Nn][Tt][Ll][Mm][Hh][Aa][Ss][Hh] .*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Pp][Ee][Tt][Ii][Tt][Pp][Oo][Tt][Aa][Mm].*/ OR data_win_eventdata_commandLine:/.*\.[Ee][Xx][Ee] -[Tt] .* -[Pp] .*/ OR (data_win_eventdata_commandLine:/.*\.[Ee][Xx][Ee] -[Cc] \"\{.*/ AND data_win_eventdata_commandLine:/.*\}\" -[Zz]/)) AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/.*[Hh][Oo][Tt][Pp][Oo][Tt][Aa][Tt][Oo][Ee][Ss]6.*/ OR data_win_eventdata_image:/.*[Hh][Oo][Tt][Pp][Oo][Tt][Aa][Tt][Oo][Ee][Ss]7.*/ OR data_win_eventdata_image:/.*[Hh][Oo][Tt][Pp][Oo][Tt][Aa][Tt][Oo][Ee][Ss] .*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e8d34729-86a4-4140-adfd-0a29c2106307
    name: HackTool - CoercedPotato Execution
    reason: Sibling potato-family privilege escalation tool; operators often try several in sequence.
  - id: 6bd75993-9888-4f91-9404-e1e4e4e34b77
    name: HackTool - LocalPotato Execution
    reason: Another NTLM reflection local privilege escalation tool tried when the first fails.
  - id: b99a1518-1ad5-4f65-bc95-1ffff97a8fd0
    name: HackTool - Inveigh Execution
    reason: Inveigh poisons name resolution to capture and relay NTLM; same relay attack chain.
  - id: 12827a56-61a4-476a-a9cb-f3068f191073
    name: HackTool - KrbRelayUp Execution
    reason: Relay-based local privilege escalation alternative on domain-joined hosts.
  - id: e96253b8-6b3b-4f90-9e59-3b24b99cf9b4
    name: HackTool - KrbRelay Execution
    reason: Kerberos relay tooling used for the same escalation goal.
  - id: 6c6d9280-e6d0-4b9d-80ac-254701b64916
    name: Potential NTLM Coercion Via Certutil.EXE
    reason: Authentication coercion primitive that feeds relay tools.
  - id: bb76d96b-821c-47cf-944b-7ce377864492
    name: Suspicious NTLM Authentication on the Printer Spooler Service
    reason: Spooler coercion is a common trigger for the relayed authentication.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: SYSTEM-context child processes
    query: data_win_system_eventID:1 AND data_win_eventdata_user:/.*(SYSTEM|System).*/ AND data_win_eventdata_image:/.*(cmd|powershell|whoami|net)\.exe/
    pivot_on: host
    window: 2h
  - name: Other relay and coercion tooling
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*([Rr]esponder|[Ii]nveigh|[Nn]tlmrelay|[Pp]rinter[Bb]ug|[Pp]etit[Pp]otam|[Ee]fs[Pp]otato|[Pp]otato).*/
    pivot_on: host
    window: 4h
  - name: Tool file drops
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*([Pp]otato|[Pp]etit|just_dce|[Rr]elay).*/
    pivot_on: host
    window: 4h
  - name: Account or group changes after escalation
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(net +(user|localgroup)|[Aa]dd-[Ll]ocal[Gg]roup[Mm]ember).*/
    pivot_on: host
    window: 2h
