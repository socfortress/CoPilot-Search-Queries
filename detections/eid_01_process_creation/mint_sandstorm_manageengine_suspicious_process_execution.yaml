s][Tt][Rr][Aa][Tt][Oo][Rr][Ss].*/ OR data_win_eventdata_commandLine:/.*[Oo]365[Aa][Cc][Cc][Oo][Uu][Nn][Tt][Cc][Oo][Nn][Ff][Ii][Gg][Uu][Rr][Aa][Tt][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ss][Aa][Mm][Aa][Cc][Cc][Oo][Uu][Nn][Tt][Nn][Aa][Mm][Ee]=.*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Vv][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Yy][Ss][Tt][Ee][Mm]\.[Ii][Oo]\.[Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ss][Yy][Ss][Tt][Ee][Mm]\.[Ii][Oo]\.[Mm][Ee][Mm][Oo][Rr][Yy][Ss][Tt][Rr][Ee][Aa][Mm].*/ OR data_win_eventdata_commandLine:/.*[Uu][Ss][Oo][Pp][Rr][Ii][Vv][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Uu][Ss][Oo][Ss][Hh][Aa][Rr][Ee][Dd].*/ OR data_win_eventdata_commandLine:/.*[Ww][Hh][Oo][Aa][Mm][Ii].*/ OR data_win_eventdata_commandLine:/.*([-\/–][Ee^]{1,2}[ncodema^]*[ ][A-Za-z0-9+\/=]{15,}).*/ OR data_win_eventdata_commandLine:/.*(net[ ]+user).*/ OR data_win_eventdata_commandLine:/.*(net[ ]+group).*/ OR data_win_eventdata_commandLine:/.*(query[ ]session).*/)) OR (data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Ss][Ss].*/ AND (data_win_eventdata_commandLine:/.*[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Tt][Aa][Ss][Kk][Ll][Ii][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ff][Ii][Nn][Dd][Ss][Tt][Rr].*/)) OR (data_win_eventdata_image:/.*\\[Ww][Gg][Ee][Tt]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp].*/) OR (data_win_eventdata_image:/.*\\[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp].*/) OR data_win_eventdata_commandLine:/.*[Ee]:[Jj][Ss][Cc][Rr][Ii][Pp][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ee]:[Vv][Bb][Ss][Cc][Rr][Ii][Pp][Tt].*/ OR (data_win_eventdata_commandLine:/.*[Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp] [Aa][Dd][Mm][Ii][Nn][Ii][Ss][Tt][Rr][Aa][Tt][Oo][Rr][Ss].*/ AND data_win_eventdata_commandLine:/.*\/[Aa][Dd][Dd].*/) OR (data_win_eventdata_commandLine:/.*[Nn][Ee][Tt].*/ AND data_win_eventdata_commandLine:/.*[Uu][Ss][Ee][Rr].*/ AND data_win_eventdata_commandLine:/.*\/[Aa][Dd][Dd].*/) OR (data_win_eventdata_commandLine:/.*[Rr][Ee][Gg] [Aa][Dd][Dd].*/ AND data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Aa][Nn][Tt][Ii][Ss][Pp][Yy][Ww][Aa][Rr][Ee].*/ AND data_win_eventdata_commandLine:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr].*/) OR (data_win_eventdata_commandLine:/.*[Rr][Ee][Gg] [Aa][Dd][Dd].*/ AND data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Ss][Tt][Rr][Ii][Cc][Tt][Ee][Dd][Aa][Dd][Mm][Ii][Nn].*/ AND data_win_eventdata_commandLine:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt]\\[Cc][Oo][Nn][Tt][Rr][Oo][Ll]\\[Ll][Ss][Aa].*/) OR (data_win_eventdata_commandLine:/.*[Ww][Mm][Ii][Cc].*/ AND data_win_eventdata_commandLine:/.*[Pp][Rr][Oo][Cc][Ee][Ss][Ss] [Cc][Aa][Ll][Ll] [Cc][Rr][Ee][Aa][Tt][Ee].*/) OR (data_win_eventdata_commandLine:/.*[Ww][Mm][Ii][Cc].*/ AND data_win_eventdata_commandLine:/.*[Dd][Ee][Ll][Ee][Tt][Ee].*/ AND data_win_eventdata_commandLine:/.*[Ss][Hh][Aa][Dd][Oo][Ww][Cc][Oo][Pp][Yy].*/) OR (data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*/ AND data_win_eventdata_commandLine:/.*[Dd][Ee][Ll][Ee][Tt][Ee].*/ AND data_win_eventdata_commandLine:/.*[Ss][Hh][Aa][Dd][Oo][Ww][Ss].*/) OR (data_win_eventdata_commandLine:/.*[Ww][Bb][Aa][Dd][Mm][Ii][Nn].*/ AND data_win_eventdata_commandLine:/.*[Dd][Ee][Ll][Ee][Tt][Ee].*/ AND data_win_eventdata_commandLine:/.*[Cc][Aa][Tt][Aa][Ll][Oo][Gg].*/)) AND _exists_:data_win_eventdata_commandLine AND NOT (data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd]\.[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\.[Cc][Oo][Mm].*/ AND data_win_eventdata_commandLine:/.*[Mm][Aa][Nn][Aa][Gg][Ee][Ee][Nn][Gg][Ii][Nn][Ee]\.[Cc][Oo][Mm].*/ AND data_win_eventdata_commandLine:/.*[Mm][Ss][Ii][Ee][Xx][Ee][Cc].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 846b866e-2a57-46ee-8e16-85fa92759be7
    name: Exploited CVE-2020-10189 Zoho ManageEngine
    reason: Same product family; ManageEngine RCE exploitation spawning shells from the Java service.
  - id: 6345b048-8441-43a7-9bed-541133633d7a
    name: ManageEngine Endpoint Central Dctask64.EXE Potential Abuse
    reason: Another ManageEngine abuse path used by actors who gain control of the platform.
  - id: 4ebc877f-4612-45cb-b3a5-8e3834db36c9
    name: Webshell Hacking Activity Patterns
    reason: Webshell-style recon commands follow RCE on the ManageEngine web service.
  - id: dcfd6b40-42f9-469d-a433-2e53f7486664
    name: Detect Prohibited Applications Spawning cmd exe
    reason: Generic server-app-spawns-shell form of this alert.
  - id: 19b08b1c-861d-4e75-a1ef-ea0c1baf202b
    name: Suspicious Download Via Certutil.EXE
    reason: certutil is a keyword in this rule; payload download is the next stage.
  - id: 17769c90-230e-488b-a463-e05c08e9d48f
    name: Powershell Defender Exclusion
    reason: Defender preference tampering is a listed keyword and a standard follow-up.
  - id: b1a8ce04-04c2-11ec-bea7-acde48001122
    name: Domain Account Discovery with Dsquery
    reason: dsquery/samaccountname keywords show AD recon, the typical next step toward domain compromise.
  - id: ad720b90-25ad-43ff-9b5e-5c841facc8e5
    name: User Added to Local Administrators Group
    reason: 'localgroup administrators keyword: privilege persistence following the foothold.'
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: All children of ManageEngine/ServiceDesk Java
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*([Mm]anage[Ee]ngine|[Ss]ervice[Dd]esk).*/
    pivot_on: host
    window: 6h
  - name: Payload download and encoded PowerShell
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Dd]ownload([Ff]ile|[Ss]tring)|[Ff]rom[Bb]ase64[Ss]tring|[Ii]nvoke-([Ee]xpression|[Ww]eb[Rr]equest)|[Cc]ertutil.*urlcache|[Bb]itsadmin.*transfer).*/
    pivot_on: host
    window: 6h
  - name: AD reconnaissance commands
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Dd]squery|[Nn]ltest|[Aa]dfind|samaccountname=|[Nn]et +group +.*\/domain).*/
    pivot_on: host
    window: 6h
  - name: Defender tampering
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ss]et|[Aa]dd)-[Mm]p[Pp]reference.*/
    pivot_on: host
    window: 4h
  - name: Credential dump tooling
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*(-[Dd]umpmode|comsvcs.*MiniDump|[Pp]rocdump.*[Ll]sass|ntdsutil).*/
    pivot_on: host
    window: 6h
