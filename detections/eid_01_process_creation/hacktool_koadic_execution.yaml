name: HackTool - Koadic Execution
id: 5cddf373-ef00-4112-ad72-960ac29bac34
version: 1
schema_version: "1.0"
date: "2023-02-11"
author: wagga, Jonhnathan Ribeiro, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 5cddf373-ef00-4112-ad72-960ac29bac34
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects command line parameters used by Koadic hack tool. MITRE ATT&CK:
  T1059.003, T1059.005, T1059.007.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\cmd.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "Cmd.Exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*/q*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*/c*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*chcp*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches '*\cmd.exe';
  data_win_eventdata_originalFileName equals 'Cmd.Exe';
  data_win_eventdata_commandLine matches '*/q*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://unit42.paloaltonetworks.com/unit42-sofacy-groups-parallel-attacks/
  - https://github.com/offsecginger/koadic/blob/457f9a3ff394c989cdb4c599ab90eb34fb2c762c/data/stager/js/stdlib.js
  - https://blog.f-secure.com/hunting-for-koadic-a-com-based-rootkit/
  - https://attack.mitre.org/techniques/T1059/003/
  - https://attack.mitre.org/techniques/T1059/005/
  - https://attack.mitre.org/techniques/T1059/007/

response:
  message: >
    HackTool - Koadic Execution detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1059.003, T1059.005, T1059.007
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.003
    - T1059.005
    - T1059.007
  custom_tags:
    - hacktool
    - koadic
    - process_creation
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Cc][Mm][Dd]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*\/[Qq].*/ AND data_win_eventdata_commandLine:/.*\/[Cc].*/ AND data_win_eventdata_commandLine:/.*[Cc][Hh][Cc][Pp].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a0873b32-5b68-11eb-ae93-0242ac130002
    name: Detect mshta inline hta execution
    reason: Koadic stagers are commonly delivered through mshta, preceding the cmd /q /c chcp command.
  - id: 9b3af1e6-5b68-11eb-ae93-0242ac130002
    name: Detect MSHTA Url in Command Line
    reason: Remote HTA stager fetch is a typical Koadic entry vector.
  - id: 070e9b80-6252-11eb-ae93-0242ac130002
    name: Detect Regsvr32 Application Control Bypass
    reason: Koadic supports regsvr32 (squiblydoo) stagers to reach the zombie.
  - id: 91c79f14-5b41-11eb-ae93-0242ac130002
    name: Detect Rundll32 Inline HTA Execution
    reason: Alternate stager delivery path for the Koadic JScript/HTA implant.
  - id: b6676963-0353-4f88-90f5-36c20d443c6a
    name: Cscript/Wscript Potentially Suspicious Child Process
    reason: Koadic stagers run through WSH JScript, which then spawns cmd.
  - id: 002f1e24-146e-11ec-a470-acde48001122
    name: Jscript Execution Using Cscript App
    reason: Koadic's JS stdlib is executed by cscript in some stagers.
  - id: 4aa5d062-e893-11eb-9eb2-acde48001122
    name: Mshta spawning Rundll32 OR Regsvr32 Process
    reason: Follow-on staging behaviour from an mshta-hosted implant.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Script host or LOLBin stager spawning child processes
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*([Mm][Ss][Hh][Tt][Aa].[Ee][Xx][Ee]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt].[Ee][Xx][Ee]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt].[Ee][Xx][Ee]|[Rr][Ee][Gg][Ss][Vv][Rr]32.[Ee][Xx][Ee]|[Rr][Uu][Nn][Dd][Ll][Ll]32.[Ee][Xx][Ee]).*/
    pivot_on: host
    window: 2h
  - name: Script hosts and LOLBins making outbound connections (C2 beacon)
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:"true" AND data_win_eventdata_image:/.*([Mm][Ss][Hh][Tt][Aa].[Ee][Xx][Ee]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt].[Ee][Xx][Ee]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt].[Ee][Xx][Ee]|[Rr][Ee][Gg][Ss][Vv][Rr]32.[Ee][Xx][Ee]).*/
    pivot_on: host
    window: 2h
  - name: Post-exploitation recon commands typical of a new C2 session
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Cc][Hh][Cc][Pp] 437|[Ww][Hh][Oo][Aa][Mm][Ii] /[Aa][Ll][Ll]|[Nn][Ee][Tt] [Uu][Ss][Ee][Rr] /[Dd][Oo][Mm][Aa][Ii][Nn]|[Ss][Yy][Ss][Tt][Ee][Mm][Ii][Nn][Ff][Oo]|[Dd][Oo][Mm][Aa][Ii][Nn] [Aa][Dd][Mm][Ii][Nn][Ss]|[Qq][Uu][Ss][Ee][Rr]).*/
    pivot_on: host
    window: 2h
  - name: Registry persistence or COM hijack by script hosts
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND data_win_eventdata_image:/.*([Mm][Ss][Hh][Tt][Aa].[Ee][Xx][Ee]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt].[Ee][Xx][Ee]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt].[Ee][Xx][Ee]|[Rr][Ee][Gg][Ss][Vv][Rr]32.[Ee][Xx][Ee]).*/ AND data_win_eventdata_targetObject:/.*([Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]|[Ii][Nn][Pp][Rr][Oo][Cc][Ss][Ee][Rr][Vv][Ee][Rr]32).*/
    pivot_on: host
    window: 4h
  - name: Credential theft and lateral movement tooling after the zombie
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz]|[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa]|[Ll][Ss][Aa][Ss][Ss]|[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]|[Pp][Ss][Ee][Xx][Ee][Cc]|[Ww][Mm][Ii][Cc] /[Nn][Oo][Dd][Ee]|[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss] /[Cc][Rr][Ee][Aa][Tt][Ee] /[Ss]).*/
    pivot_on: host
    window: 6h
