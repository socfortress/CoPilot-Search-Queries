name: Potential COM Objects Download Cradles Usage - Process Creation
id: 02b64f1b-3f33-4e67-aede-ef3b0a5a8fcf
version: 1
schema_version: "1.0"
date: "2022-12-25"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 02b64f1b-3f33-4e67-aede-ef3b0a5a8fcf
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects usage of COM objects that can be abused to download files in
  PowerShell by CLSID. MITRE ATT&CK: T1105.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*[Type]::GetTypeFromCLSID(*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*0002DF01-0000-0000-C000-000000000046*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*F6D90F16-9C73-11D3-B32E-00C04F990BB4*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*F5078F35-C551-11D3-89B9-0000F81FE221*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*88d96a0a-f192-11d4-a65f-0040963251e5*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*AFBA6B42-5692-48EA-8141-DC517DCF0EF1*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*AFB40FFD-B609-40A3-9828-F88BBE11E4E3*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*88d96a0b-f192-11d4-a65f-0040963251e5*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*2087c2f4-2cef-4953-a8ab-66779b670495*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*000209FF-0000-0000-C000-000000000046*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*00024500-0000-0000-C000-000000000046*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*[Type]::GetTypeFromCLSID(*'; data_win_eventdata_commandLine matches
  '*0002DF01-0000-0000-C000-000000000046*'; data_win_eventdata_commandLine
  matches '*F6D90F16-9C73-11D3-B32E-00C04F990BB4*', among other conditions.

known_false_positives: >
  Legitimate use of the library. Baseline expected activity in your environment
  and tune this detection before relying on it for automated response.

references:
  - https://learn.microsoft.com/en-us/dotnet/api/system.type.gettypefromclsid?view=net-7.0
  - https://speakerdeck.com/heirhabarov/hunting-for-powershell-abuse?slide=57
  - https://attack.mitre.org/techniques/T1105/

response:
  message: >
    Potential COM Objects Download Cradles Usage - Process Creation detected on
    host $agent_name$. Matched data_win_eventdata_commandLine:
    $data_win_eventdata_commandLine$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1105
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1105
  custom_tags:
    - objects
    - download
    - cradles
    - process_creation
    - sysmon
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*\[[Tt][Yy][Pp][Ee]\]::[Gg][Ee][Tt][Tt][Yy][Pp][Ee][Ff][Rr][Oo][Mm][Cc][Ll][Ss][Ii][Dd]\(.*/ AND (data_win_eventdata_commandLine:/.*0002[Dd][Ff]01-0000-0000-[Cc]000-000000000046.*/ OR data_win_eventdata_commandLine:/.*[Ff]6[Dd]90[Ff]16-9[Cc]73-11[Dd]3-[Bb]32[Ee]-00[Cc]04[Ff]990[Bb][Bb]4.*/ OR data_win_eventdata_commandLine:/.*[Ff]5078[Ff]35-[Cc]551-11[Dd]3-89[Bb]9-0000[Ff]81[Ff][Ee]221.*/ OR data_win_eventdata_commandLine:/.*88[Dd]96[Aa]0[Aa]-[Ff]192-11[Dd]4-[Aa]65[Ff]-0040963251[Ee]5.*/ OR data_win_eventdata_commandLine:/.*[Aa][Ff][Bb][Aa]6[Bb]42-5692-48[Ee][Aa]-8141-[Dd][Cc]517[Dd][Cc][Ff]0[Ee][Ff]1.*/ OR data_win_eventdata_commandLine:/.*[Aa][Ff][Bb]40[Ff][Ff][Dd]-[Bb]609-40[Aa]3-9828-[Ff]88[Bb][Bb][Ee]11[Ee]4[Ee]3.*/ OR data_win_eventdata_commandLine:/.*88[Dd]96[Aa]0[Bb]-[Ff]192-11[Dd]4-[Aa]65[Ff]-0040963251[Ee]5.*/ OR data_win_eventdata_commandLine:/.*2087[Cc]2[Ff]4-2[Cc][Ee][Ff]-4953-[Aa]8[Aa][Bb]-66779[Bb]670495.*/ OR data_win_eventdata_commandLine:/.*000209[Ff][Ff]-0000-0000-[Cc]000-000000000046.*/ OR data_win_eventdata_commandLine:/.*00024500-0000-0000-[Cc]000-000000000046.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 3c7d1587-3b13-439f-9941-7d14313dbdfe
    name: Potential COM Objects Download Cradles Usage - PS Script
    reason: Same CLSID COM download cradle observed in script block logging; gives the full script body.
  - id: 78aa1347-1517-4454-9982-b338d6df8343
    name: Powershell MsXml COM Object
    reason: MsXml COM object download variant used by the same cradle family.
  - id: 403c2cc0-7f6b-4925-9423-bfa573bed7eb
    name: Suspicious PowerShell Download - Powershell Script
    reason: Generic PowerShell download in script block, often the same cradle with the URL visible.
  - id: 3b6ab547-8ec2-4991-b9d2-2b06702a48d7
    name: PowerShell Download Pattern
    reason: PowerShell download pattern on the command line - the WebClient form of the same intent.
  - id: 8bc063d5-3a3a-4f01-a140-bc15e55e8437
    name: Suspicious GetTypeFromCLSID ShellExecute
    reason: 'GetTypeFromCLSID ShellExecute: the same COM-by-CLSID tradecraft executing the downloaded payload.'
  - id: ca2092a1-c273-4878-9b4b-0d60115bf5ea
    name: Suspicious Encoded PowerShell Command Line
    reason: Encoded PowerShell is the common wrapper around such cradles.
  - id: 1b3b01c7-84e9-4072-86e5-fc285a41ff23
    name: Nslookup PowerShell Download Cradle - ProcessCreation
    reason: Another PowerShell download cradle family with the same follow-on staging.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: PowerShell script blocks fetching via COM/XMLHTTP
    query: data_win_system_eventID:4104 AND data_win_eventdata_scriptBlockText:(/.*GetTypeFromCLSID.*/ OR /.*[Xx][Mm][Ll][Hh][Tt][Tt][Pp].*/ OR /.*[Ww]in[Hh]ttp.*/)
    pivot_on: host
    window: 2h
  - name: Network connections by powershell shortly after
    query: data_win_system_eventID:3 AND data_win_eventdata_image:(/.*[Pp]ower[Ss]hell.*/ OR /.*[Pp]wsh\.exe/) AND data_win_eventdata_initiated:true
    pivot_on: host
    window: 2h
  - name: DNS lookups from PowerShell
    query: data_win_system_eventID:22 AND data_win_eventdata_image:(/.*[Pp]ower[Ss]hell.*/ OR /.*[Pp]wsh\.exe/)
    pivot_on: host
    window: 2h
  - name: Executable/script files dropped by PowerShell
    query: data_win_system_eventID:11 AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND data_win_eventdata_targetFilename:(/.*\.exe/ OR /.*\.dll/ OR /.*\.ps1/ OR /.*\.bat/ OR /.*\.vbs/)
    pivot_on: host
    window: 2h
  - name: Children of PowerShell run from user-writable paths
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Pp]ower[Ss]hell.*/ AND data_win_eventdata_image:(/.*\\Users\\.*/ OR /.*\\Temp\\.*/ OR /.*\\ProgramData\\.*/)
    pivot_on: host
    window: 2h
