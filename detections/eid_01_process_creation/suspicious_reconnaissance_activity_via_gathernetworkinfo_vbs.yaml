name: Suspicious Reconnaissance Activity Via GatherNetworkInfo.VBS
id: 07aa184a-870d-413d-893a-157f317f6f58
version: 1
schema_version: "1.0"
date: "2023-02-08"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 07aa184a-870d-413d-893a-157f317f6f58
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of the built-in script located in
  "C:\Windows\System32\gatherNetworkInfo.vbs". Which can be used to gather
  information about the target machine. MITRE ATT&CK: T1615, T1059.005.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*gatherNetworkInfo.vbs*"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\cscript.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\wscript.exe"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*gatherNetworkInfo.vbs*'; data_win_eventdata_image matches '*\cscript.exe';
  data_win_eventdata_image matches '*\wscript.exe'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://posts.slayerlabs.com/living-off-the-land/#gathernetworkinfovbs
  - https://www.mandiant.com/resources/blog/trojanized-windows-installers-ukrainian-government
  - https://attack.mitre.org/techniques/T1615/
  - https://attack.mitre.org/techniques/T1059/005/

response:
  message: >
    Suspicious Reconnaissance Activity Via GatherNetworkInfo.VBS detected on
    host $agent_name$. Matched data_win_eventdata_commandLine:
    $data_win_eventdata_commandLine$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1615, T1059.005
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1615
    - T1059.005
  custom_tags:
    - reconnaissance
    - gathernetworkinfo
    - process_creation
    - sysmon
    - discovery
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Gg][Aa][Tt][Hh][Ee][Rr][Nn][Ee][Tt][Ww][Oo][Rr][Kk][Ii][Nn][Ff][Oo]\.[Vv][Bb][Ss].*/ AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/.*\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 575dce0c-8139-4e30-9295-1ee75969f7fe
    name: Potential Reconnaissance Activity Via GatherNetworkInfo.VBS
    reason: Sibling detection of the same built-in script launched via cscript/wscript; together they cover both launch paths.
  - id: e6313acd-208c-44fc-a0ff-db85d572e90e
    name: Network Reconnaissance Activity
    reason: Operators running gatherNetworkInfo.vbs typically continue with manual network enumeration on the same host.
  - id: 5cc90652-4cbd-4241-aa3b-4b462fa5a248
    name: Potential Recon Activity Via Nltest.EXE
    reason: Domain and trust discovery commonly follows host network profiling as the actor maps the environment.
  - id: b6676963-0353-4f88-90f5-36c20d443c6a
    name: Cscript/Wscript Potentially Suspicious Child Process
    reason: The VBS runs under Windows Script Host; suspicious script-host children show the chain around it.
  - id: bd8b828d-0dca-48e1-8a63-8a58ecf2644f
    name: Group Membership Reconnaissance Via Whoami.EXE
    reason: Identity and privilege checks are routinely paired with system recon in early hands-on-keyboard discovery.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: gatherNetworkInfo.vbs referenced anywhere
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*[Gg]ather[Nn]etwork[Ii]nfo.*/
    pivot_on: host
    window: 4h
  - name: Network discovery utilities on the host
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*\\(ipconfig|netstat|arp|route|nslookup|nltest|systeminfo)\.exe/
    pivot_on: host
    window: 2h
  - name: Non-script-host process launching a VBS
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*\\(cmd|powershell|mshta|explorer)\.exe/ AND data_win_eventdata_commandLine:/.*\.vbs.*/
    pivot_on: host
    window: 2h
  - name: Recon output files staged or archived
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*[Nn]etwork.*\.(txt|zip|7z|rar|cab|html)/
    pivot_on: host
    window: 2h
