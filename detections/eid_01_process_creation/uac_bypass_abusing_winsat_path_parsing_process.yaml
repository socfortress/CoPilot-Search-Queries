name: UAC Bypass Abusing Winsat Path Parsing - Process
id: 7a01183d-71a2-46ad-ad5c-acd989ac1793
version: 1
schema_version: "1.0"
date: "2024-12-01"
author: Christian Burkard (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 7a01183d-71a2-46ad-ad5c-acd989ac1793
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the pattern of UAC Bypass using a path parsing issue in winsat.exe
  (UACMe 52). MITRE ATT&CK: T1548.002.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - term:
                  data_win_eventdata_integrityLevel:
                    value: "High"
                    case_insensitive: true
              - term:
                  data_win_eventdata_integrityLevel:
                    value: "System"
                    case_insensitive: true
              - term:
                  data_win_eventdata_integrityLevel:
                    value: "S-1-16-16384"
                    case_insensitive: true
              - term:
                  data_win_eventdata_integrityLevel:
                    value: "S-1-16-12288"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_parentImage:
              value: "*\\\\AppData\\\\Local\\\\Temp\\\\system32\\\\winsat.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_parentCommandLine:
              value: "*C:\\\\Windows \\\\system32\\\\winsat.exe*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_integrityLevel
    - data_win_eventdata_parentImage
    - data_win_eventdata_parentCommandLine
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_integrityLevel equals
  'High'; data_win_eventdata_integrityLevel equals 'System';
  data_win_eventdata_integrityLevel equals 'S-1-16-16384', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/hfiref0x/UACME
  - https://attack.mitre.org/techniques/T1548/002/

response:
  message: >
    UAC Bypass Abusing Winsat Path Parsing - Process detected on host
    $agent_name$. Matched data_win_eventdata_integrityLevel:
    $data_win_eventdata_integrityLevel$. Matched data_win_eventdata_parentImage:
    $data_win_eventdata_parentImage$. MITRE ATT&CK: T1548.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_integrityLevel
      type: other
    - field: data_win_eventdata_parentImage
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1548.002
  custom_tags:
    - bypass
    - abusing
    - winsat
    - process_creation
    - sysmon
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_integrityLevel:/[Hh][Ii][Gg][Hh]/ OR data_win_eventdata_integrityLevel:/[Ss][Yy][Ss][Tt][Ee][Mm]/ OR data_win_eventdata_integrityLevel:/[Ss]-1-16-16384/ OR data_win_eventdata_integrityLevel:/[Ss]-1-16-12288/) AND data_win_eventdata_parentImage:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ww][Ii][Nn][Ss][Aa][Tt]\.[Ee][Xx][Ee]/ AND data_win_eventdata_parentCommandLine:/.*[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] \\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ww][Ii][Nn][Ss][Aa][Tt]\.[Ee][Xx][Ee].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d38d2fa4-98e6-4a24-aff1-410b0c9ad177
    name: HackTool - UACMe Akagi Execution
    reason: Winsat path parsing is UACMe method 52; Akagi is the tool that launches it.
  - id: 4ac47ed3-44c2-4b1f-9d51-bf46e8914126
    name: TrustedPath UAC Bypass Pattern
    reason: Same path-mocking class of UAC bypass; attackers rotate between these methods on one host.
  - id: 178e615d-e666-498b-9630-9ed363038101
    name: Elevated System Shell Spawned From Uncommon Parent Location
    reason: The bypass ends in an elevated process from a non-standard parent, which this rule flags.
  - id: 1ca6bd18-0ba0-44ca-851c-92ed89a61085
    name: UAC Bypass Using Consent and Comctl32 - Process
    reason: Another DLL/path hijack UAC bypass likely attempted in the same session.
  - id: 89ca78fd-b37c-4310-b3d3-81a023f83936
    name: Schtasks Creation Or Modification With SYSTEM Privileges
    reason: With elevation gained, SYSTEM scheduled tasks are a common persistence follow-on.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Winsat executed from a non-system location
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Ww]insat\.exe/ AND NOT data_win_eventdata_image:/.*[Ww]indows.[Ss]ystem32.*/
    pivot_on: host
    window: 2h
  - name: Fake system32 directory created under Temp
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*[Tt]emp.[Ss]ystem32.*/
    pivot_on: host
    window: 2h
  - name: High-integrity children of Temp-based parents
    query: data_win_system_eventID:1 AND data_win_eventdata_integrityLevel:(High OR System) AND data_win_eventdata_parentImage:(/.*[Tt]emp.*/ OR /.*[Aa]pp[Dd]ata.*/)
    pivot_on: host
    window: 2h
  - name: Post-elevation defence evasion and persistence
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ss]et-[Mm]p[Pp]reference.*/ OR /.*[Ss]chtasks.*\/[Cc]reate.*/ OR /.*[Rr]eg.*[Aa]dd.*[Rr]un.*/)
    pivot_on: host
    window: 2h
