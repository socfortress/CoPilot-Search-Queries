name: Uncommon Child Process Of Defaultpack.EXE
id: b2309017-4235-44fe-b5af-b15363011957
version: 1
schema_version: "1.0"
date: "2024-04-22"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: b2309017-4235-44fe-b5af-b15363011957
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects uncommon child processes of "DefaultPack.EXE" binary as a proxy to
  launch other programs. MITRE ATT&CK: T1218.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_parentImage:
              value: "*\\\\DefaultPack.exe"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\DefaultPack.exe'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://lolbas-project.github.io/lolbas/OtherMSBinaries/DefaultPack/
  - https://www.echotrail.io/insights/search/defaultpack.exe
  - https://attack.mitre.org/techniques/T1218/

response:
  message: >
    Uncommon Child Process Of Defaultpack.EXE detected on host $agent_name$.
    Matched data_win_eventdata_parentImage: $data_win_eventdata_parentImage$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1218
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218
  custom_tags:
    - uncommon
    - child
    - defaultpack
    - process_creation
    - sysmon
    - stealth
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Dd][Ee][Ff][Aa][Uu][Ll][Tt][Pp][Aa][Cc][Kk]\.[Ee][Xx][Ee]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d4ca7c59-e9e4-42d8-bf57-91a776efcb87
    name: LOLBIN Execution From Abnormal Drive
    reason: DefaultPack.exe is a signed binary abused to proxy execution; copies staged and run from removable or abnormal drives often precede it.
  - id: cbec226f-63d9-4eca-9f52-dfb6652f24df
    name: Suspicious Process Parents
    reason: Confirms whether the payload child chains into further abnormal parent-child relationships after the proxy launch.
  - id: e593cf51-88db-4ee1-b920-37e89012a3c9
    name: Potentially Suspicious Rundll32 Activity
    reason: A common second-stage child of LOLBIN proxies is rundll32 loading an attacker DLL.
  - id: b5c7395f-e501-4a08-94d4-57fe7a9da9d2
    name: Potential Binary Proxy Execution Via Cdb.EXE
    reason: Sibling T1218 proxy-execution LOLBIN; attackers rotate between such binaries, so co-occurrence on a host suggests hunting for a working proxy.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Processes launched by DefaultPack with command lines
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Dd][Ee][Ff][Aa][Uu][Ll][Tt][Pp][Aa][Cc][Kk]\.[Ee][Xx][Ee]/ AND _exists_:data_win_eventdata_commandLine
    pivot_on: host
    window: 2h
  - name: DefaultPack.exe executed outside Program Files
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Dd][Ee][Ff][Aa][Uu][Ll][Tt][Pp][Aa][Cc][Kk]\.[Ee][Xx][Ee]/ AND NOT data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss].*/
    pivot_on: host
    window: 6h
  - name: Script engines or LOLBins running from user-writable paths
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:(/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR /.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR /.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR /.*\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/ OR /.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:(/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR /.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR /.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR /.*\\[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]\\.*/)
    pivot_on: host
    window: 2h
  - name: Outbound connections initiated after proxy launch
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:"true" AND NOT (data_win_eventdata_destinationIp:/10\..*/ OR data_win_eventdata_destinationIp:/192\.168\..*/)
    pivot_on: host
    window: 1h
