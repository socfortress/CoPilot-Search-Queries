name: HackTool - SharpWSUS/WSUSpendu Execution
id: b0ce780f-10bd-496d-9067-066d23dc3aa5
version: 1
schema_version: "1.0"
date: "2024-08-23"
author: "@Kostastsale, Nasreddine Bencherchali (Nextron Systems)"
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: b0ce780f-10bd-496d-9067-066d23dc3aa5
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of SharpWSUS or WSUSpendu, utilities that allow for
  lateral movement through WSUS. Windows Server Update Services (WSUS) is a
  critical component of Windows systems and is frequently configured in a way
  that allows an attacker to circumvent internal networking limitations. MITRE
  ATT&CK: T1210.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* -Inject *"
                          case_insensitive: true
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* -PayloadArgs *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* -PayloadFile *"
                                case_insensitive: true
                        minimum_should_match: 1
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* approve *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* create *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* check *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* delete *"
                                case_insensitive: true
                        minimum_should_match: 1
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* /payload:*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* /payload=*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* /updateid:*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* /updateid=*"
                                case_insensitive: true
                        minimum_should_match: 1
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches '*
  -Inject *'; data_win_eventdata_commandLine matches '* -PayloadArgs *';
  data_win_eventdata_commandLine matches '* -PayloadFile *', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://labs.nettitude.com/blog/introducing-sharpwsus/
  - https://github.com/nettitude/SharpWSUS
  - https://web.archive.org/web/20210512154016/https://github.com/AlsidOfficial/WSUSpendu/blob/master/WSUSpendu.ps1
  - https://attack.mitre.org/techniques/T1210/

response:
  message: >
    HackTool - SharpWSUS/WSUSpendu Execution detected on host $agent_name$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1210
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1210
  custom_tags:
    - hacktool
    - sharpwsus
    - wsuspendu
    - process_creation
    - sysmon
    - execution
    - lateral_movement
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND ((data_win_eventdata_commandLine:/.* -[Ii][Nn][Jj][Ee][Cc][Tt] .*/ AND (data_win_eventdata_commandLine:/.* -[Pp][Aa][Yy][Ll][Oo][Aa][Dd][Aa][Rr][Gg][Ss] .*/ OR data_win_eventdata_commandLine:/.* -[Pp][Aa][Yy][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee] .*/)) OR ((data_win_eventdata_commandLine:/.* [Aa][Pp][Pp][Rr][Oo][Vv][Ee] .*/ OR data_win_eventdata_commandLine:/.* [Cc][Rr][Ee][Aa][Tt][Ee] .*/ OR data_win_eventdata_commandLine:/.* [Cc][Hh][Ee][Cc][Kk] .*/ OR data_win_eventdata_commandLine:/.* [Dd][Ee][Ll][Ee][Tt][Ee] .*/) AND (data_win_eventdata_commandLine:/.* \/[Pp][Aa][Yy][Ll][Oo][Aa][Dd]:.*/ OR data_win_eventdata_commandLine:/.* \/[Pp][Aa][Yy][Ll][Oo][Aa][Dd]=.*/ OR data_win_eventdata_commandLine:/.* \/[Uu][Pp][Dd][Aa][Tt][Ee][Ii][Dd]:.*/ OR data_win_eventdata_commandLine:/.* \/[Uu][Pp][Dd][Aa][Tt][Ee][Ii][Dd]=.*/)))

