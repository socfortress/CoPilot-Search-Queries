name: Powershell Defender Exclusion
id: 17769c90-230e-488b-a463-e05c08e9d48f
version: 1
schema_version: "1.0"
date: "2022-05-12"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 17769c90-230e-488b-a463-e05c08e9d48f
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects requests to exclude files, folders or processes from Antivirus
  scanning using PowerShell cmdlets. MITRE ATT&CK: T1685.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Add-MpPreference *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Set-MpPreference *"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -ExclusionPath *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -ExclusionExtension *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -ExclusionProcess *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -ExclusionIpAddress *"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*Add-MpPreference *'; data_win_eventdata_commandLine matches
  '*Set-MpPreference *'; data_win_eventdata_commandLine matches '*
  -ExclusionPath *', among other conditions.

known_false_positives: >
  Possible Admin Activity. Other Cmdlets that may use the same parameters.
  Baseline expected activity in your environment and tune this detection before
  relying on it for automated response.

references:
  - https://learn.microsoft.com/en-us/defender-endpoint/configure-process-opened-file-exclusions-microsoft-defender-antivirus
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1562.001/T1562.001.md
  - https://twitter.com/AdamTheAnalyst/status/1483497517119590403
  - https://attack.mitre.org/techniques/T1685/

response:
  message: >
    Powershell Defender Exclusion detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1685
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685
  custom_tags:
    - powershell
    - defender
    - exclusion
    - process_creation
    - sysmon
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Aa][Dd][Dd]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee] .*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee] .*/) AND (data_win_eventdata_commandLine:/.* -[Ee][Xx][Cc][Ll][Uu][Ss][Ii][Oo][Nn][Pp][Aa][Tt][Hh] .*/ OR data_win_eventdata_commandLine:/.* -[Ee][Xx][Cc][Ll][Uu][Ss][Ii][Oo][Nn][Ee][Xx][Tt][Ee][Nn][Ss][Ii][Oo][Nn] .*/ OR data_win_eventdata_commandLine:/.* -[Ee][Xx][Cc][Ll][Uu][Ss][Ii][Oo][Nn][Pp][Rr][Oo][Cc][Ee][Ss][Ss] .*/ OR data_win_eventdata_commandLine:/.* -[Ee][Xx][Cc][Ll][Uu][Ss][Ii][Oo][Nn][Ii][Pp][Aa][Dd][Dd][Rr][Ee][Ss][Ss] .*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 1321dc4e-a1fe-481d-a016-52c45f0c8b4f
    name: Windows Defender Exclusions Added
    reason: Defender operational-log confirmation that the exclusion was applied on the same host.
  - id: 801bd44f-ceed-4eb6-887c-11544633c0aa
    name: Windows Defender Configuration Changes
    reason: Generic config-change event recording the same Set/Add-MpPreference effect.
  - id: c148a894-dd93-11eb-bf2a-acde48001122
    name: Powershell Disable Security Monitoring
    reason: Attackers usually pair exclusions with disabling real-time monitoring.
  - id: 1e8a9b4d-3c2a-4f9b-8d1e-7c6a5b4f3d2e
    name: PowerShell Defender Threat Severity Default Action Set to 'Allow' or 'NoAction'
    reason: Sibling Defender-impairment step in the same tampering sequence.
  - id: c6fb44c6-71f5-49e6-9462-1425d328aee3
    name: Powershell Base64 Encoded MpPreference Cmdlet
    reason: Same tampering hidden inside an encoded command, often run just before or after.
  - id: 49e5bc24-8b86-49f1-b743-535f332c2856
    name: Microsoft Defender Tamper Protection Trigger
    reason: Shows whether Tamper Protection blocked the change.
  - id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
    name: PowerShell Download and Execution Cradles
    reason: Exclusion is typically followed by downloading the payload into the excluded path.
  - id: 51cbac1e-eee3-4a90-b1b7-358efb81fa0a
    name: Potential Windows Defender Tampering Via Wmic.EXE
    reason: Alternative CLI route to the same Defender impairment.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Defender preference changes (any cmdlet)
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ss]et|[Aa]dd|[Rr]emove)-[Mm]p[Pp]reference.*/
    pivot_on: host
    window: 4h
  - name: Defender exclusion registry writes
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*Windows [Dd]efender.Exclusions.*/
    pivot_on: host
    window: 4h
  - name: Defender operational config-change events
    query: (data_win_system_eventID:"5007" OR data_win_system_eventID:"5001" OR data_win_system_eventID:"5004") AND (data_win_eventdata_newValue:/.*Exclusions.*/ OR data_win_eventdata_newValue:/.*DisableRealtimeMonitoring.*/ OR data_win_eventdata_newValue:/.*ThreatSeverityDefaultAction.*/ OR data_win_eventdata_newValue:/.*DisableBehaviorMonitoring.*/)
    pivot_on: host
    window: 4h
  - name: Files dropped to user-writable paths (likely excluded location)
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(AppData|ProgramData|Temp|Users.Public).*\.(exe|dll|ps1|bat|vbs|js)/
    pivot_on: host
    window: 4h
  - name: PowerShell outbound connections
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ OR data_win_eventdata_image:/.*[Pp]wsh.*/) AND data_win_eventdata_initiated:"true"
    pivot_on: host
    window: 4h
