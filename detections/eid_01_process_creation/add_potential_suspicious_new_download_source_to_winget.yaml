name: Add Potential Suspicious New Download Source To Winget
id: c15a46a0-07d4-4c87-b4b6-89207835a83b
version: 1
schema_version: "1.0"
date: "2023-12-04"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: c15a46a0-07d4-4c87-b4b6-89207835a83b
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects usage of winget to add new potentially suspicious download sources.
  MITRE ATT&CK: T1059.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\winget.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "winget.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*source *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*add *"
              case_insensitive: true
        - regexp:
            data_win_eventdata_commandLine: ".*(://[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}).*"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\winget.exe'; data_win_eventdata_originalFileName equals 'winget.exe';
  data_win_eventdata_commandLine matches '*source *', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://learn.microsoft.com/en-us/windows/package-manager/winget/source
  - https://github.com/nasbench/Misc-Research/tree/b9596e8109dcdb16ec353f316678927e507a5b8d/LOLBINs/Winget
  - https://attack.mitre.org/techniques/T1059/

response:
  message: >
    Add Potential Suspicious New Download Source To Winget detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1059
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059
  custom_tags:
    - download
    - source
    - winget
    - process_creation
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Gg][Ee][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ww][Ii][Nn][Gg][Ee][Tt]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Ss][Oo][Uu][Rr][Cc][Ee] .*/ AND data_win_eventdata_commandLine:/.*[Aa][Dd][Dd] .*/ AND data_win_eventdata_commandLine:/.*(:\/\/[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}).*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 05ebafc8-7aa2-4bcd-a269-2aec93f9e842
    name: Add New Download Source To Winget
    reason: Broader generic form of the same source-add; fires alongside and confirms the action.
  - id: 81a0ecb5-0a41-4ba1-b2ba-c944eb92bfa2
    name: Add Insecure Download Source To Winget
    reason: Raw-IP sources are commonly plain http; the insecure-source rule confirms an unauthenticated attacker feed.
  - id: fa277e82-9b78-42dd-b05c-05555c7b6015
    name: Enable Local Manifest Installation With Winget
    reason: Companion setup step permitting install of unsigned local/rogue manifests.
  - id: 313d6012-51a0-4d93-8dfc-de8553239e25
    name: Install New Package Via Winget Local Manifest
    reason: Follow-on payload install from the IP-hosted source.
  - id: a3f5c081-e75b-43a0-9f5b-51f26fe5dba2
    name: Potential Suspicious Winget Package Installation
    reason: 'Follow-on: downloaded installer artifacts written by winget.'
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Winget install/upgrade from added source
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Ww]inget\.exe/ AND data_win_eventdata_commandLine:(/.*[Ii]nstall.*/ OR /.*[Uu]pgrade.*/ OR /.*--source.*/)
    pivot_on: host
    window: 4h
  - name: Winget with raw IP URL on command line
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Ww]inget\.exe/ AND data_win_eventdata_commandLine:/.*[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}.*/
    pivot_on: host
    window: 24h
  - name: Network connections by winget/AppInstaller
    query: data_win_system_eventID:3 AND data_win_eventdata_image:(/.*[Ww]inget\.exe/ OR /.*[Aa]pp[Ii]nstallerCLI\.exe/ OR /.*[Ww]indowsPackageManagerServer\.exe/)
    pivot_on: host
    window: 4h
  - name: Children of winget (installed payload execution)
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:(/.*[Ww]inget\.exe/ OR /.*[Aa]pp[Ii]nstallerCLI\.exe/)
    pivot_on: host
    window: 2h
