name: GetCurrent User with PowerShell
id: 7eb9c3d5-c98c-4088-acc5-8240bad15379
version: 1
schema_version: "1.0"
date: "2026-04-27"
author: SOCFortress LLC
status: production
type: Hunting

description: >
  This analytic detects the execution of powershell.exe or pwsh.exe with
  command-line arguments invoking the GetCurrent() method of the
  System.Security.Principal.WindowsIdentity .NET class. Sysmon EventID
  1 is used to match process creation events where the image or
  OriginalFileName is one of the PowerShell binaries AND the command
  line contains either "System.Security.Principal.WindowsIdentity" or
  "GetCurrent()". This .NET API call returns information about the
  current Windows identity (user account, SID, authentication type,
  group memberships) running the PowerShell session, providing a
  programmatic alternative to whoami.exe or $env:USERNAME. This
  activity is significant as adversaries may use this method to
  identify the logged-in user on a compromised endpoint while avoiding
  command-line tools that may be more heavily monitored. This is a
  known T1033 (System Owner/User Discovery) technique commonly used in
  early reconnaissance phases. If confirmed malicious, this could
  allow attackers to gain insights into user context (privilege level,
  group membership), determine whether they have administrative
  rights, and plan further exploitation including privilege escalation
  attempts and lateral movement decisions based on the discovered
  user identity.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image: "*powershell*.exe"
              - wildcard:
                  data_win_eventdata_image: "*pwsh.exe"
              - term:
                  data_win_eventdata_originalFileName: "PowerShell.EXE"
              - term:
                  data_win_eventdata_originalFileName: "pwsh.dll"
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*System.Security.Principal.WindowsIdentity*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*GetCurrent()*"
                    case_insensitive: true
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_parentCommandLine
    - data_win_eventdata_user
    - data_win_eventdata_processId
    - data_win_eventdata_processGuid
    - data_win_eventdata_parentProcessId
    - data_win_eventdata_parentProcessGuid
    - data_win_eventdata_hashes
    - data_win_eventdata_integrityLevel
    - data_win_eventdata_currentDirectory

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-27 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-27 23:59:59.999"

how_to_implement: >
  This detection requires Sysmon EventID 1 (Process Creation) logs to be forwarded
  from Windows endpoints to Wazuh Indexer. Ensure Sysmon is deployed with a
  configuration that captures Image, OriginalFileName, and CommandLine fields
  (SwiftOnSecurity or Olaf Hartong Sysmon modular config recommended). The
  detection matches PowerShell binaries (powershell.exe or pwsh.exe) by
  Image path or PE OriginalFileName, combined with either
  System.Security.Principal.WindowsIdentity (the .NET class name) or
  GetCurrent() (the static method invocation). Case-insensitive matching
  is used on the .NET strings to handle PowerShell's flexible casing.
  The ES DSL uses case_insensitive wildcard option (OpenSearch 2.x /
  Elasticsearch 7.10+); Graylog equivalent uses character classes with
  escaped dots and parentheses. For deeper coverage, also enable
  PowerShell Script Block Logging (EventID 4104) and correlate against
  the same .NET API patterns in script blocks.

known_false_positives: >
  System administrators, developers, or security tools may
  legitimately use the WindowsIdentity .NET class for permission
  checks, identity-aware logging, or privilege validation. Many
  legitimate PowerShell scripts include a privilege check via
  [System.Security.Principal.WindowsPrincipal]::IsInRole() which
  internally calls GetCurrent(). Review the parent process lineage,
  user context, and surrounding command-line content (full script
  vs. one-liner identity check) to distinguish legitimate use from
  reconnaissance. Concurrent execution of multiple discovery commands
  on a single host within a short window should be treated as
  high-priority regardless of context.

references:
  - https://attack.mitre.org/techniques/T1033/
  - https://learn.microsoft.com/en-us/dotnet/api/system.security.principal.windowsidentity.getcurrent

response:
  message: >
    PowerShell System.Security.Principal.WindowsIdentity GetCurrent()
    user-context discovery was identified on endpoint $agent_name$ by
    user $data_win_eventdata_user$. Process image:
    $data_win_eventdata_image$. Parent process:
    $data_win_eventdata_parentImage$. Command line:
    $data_win_eventdata_commandLine$. This is consistent with current-user
    discovery via .NET reflection commonly preceding privilege checks
    or lateral movement decisions; investigate parent process lineage
    and concurrent discovery activity.
  risk_score: 40
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 30
    - field: data_win_eventdata_user
      type: user
      score: 30
  threat_objects:
    - field: data_win_eventdata_image
      type: process_name
    - field: data_win_eventdata_parentImage
      type: parent_process_name
    - field: data_win_eventdata_commandLine
      type: command_line

tags:
  analytic_story:
    - Active Directory Discovery
    - System Owner User Discovery
    - PowerShell Reconnaissance
  asset_type: Endpoint
  mitre_attack_id:
    - T1033
  custom_tags:
    - powershell
    - dotnet
    - windowsidentity
    - getcurrent
    - user_discovery
    - reconnaissance
    - system_owner_discovery
    - privilege_check
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*\.exe.*/ OR data_win_eventdata_image:/.*[Pp][Ww][Ss][Hh]\.exe.*/ OR data_win_eventdata_originalFileName:"PowerShell.EXE" OR data_win_eventdata_originalFileName:"pwsh.dll") AND (data_win_eventdata_commandLine:/.*[Ss][Yy][Ss][Tt][Ee][Mm]\.[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]\.[Pp][Rr][Ii][Nn][Cc][Ii][Pp][Aa][Ll]\.[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Ii][Dd][Ee][Nn][Tt][Ii][Tt][Yy].*/ OR data_win_eventdata_commandLine:/.*[Gg][Ee][Tt][Cc][Uu][Rr][Rr][Ee][Nn][Tt]\(\).*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c248c896-e412-4279-8c15-1c558067b6fa
    name: Enumerate All Information With Whoami.EXE
    reason: whoami /all enumerates the same identity, groups and privileges natively
  - id: bd8b828d-0dca-48e1-8a63-8a58ecf2644f
    name: Group Membership Reconnaissance Via Whoami.EXE
    reason: whoami /groups group recon shares the intent of learning privilege context
  - id: 97a80ec7-0e2f-4d05-9ef4-65760e634f6b
    name: Security Privileges Enumeration Via Whoami.EXE
    reason: whoami /priv privilege enumeration commonly accompanies identity checks
  - id: 8de1cbe8-d6f5-496d-8237-5f44a721c7a0
    name: Whoami.EXE Execution Anomaly
    reason: Whoami anomaly on the same host indicates scripted owner discovery
  - id: e9142d84-fbe0-401d-ac50-3e519fb00c89
    name: WhoAmI as Parameter
    reason: whoami launched as a parameter or from scripts, same user-discovery step
  - id: 79ce34ca-af29-4d0e-b832-fc1b377020db
    name: Whoami.EXE Execution From Privileged Process
    reason: whoami from a privileged parent suggests elevation checking after exploitation
  - id: 70bc5215-526f-4477-963c-a47a5c9ebd12
    name: Potential Active Directory Enumeration Using AD Module - ProcCreation
    reason: Next step after identity check is commonly AD enumeration via the AD module
  - id: 93c94be3-bead-4a60-860f-77ca3fe59903
    name: GetDomainGroup with PowerShell
    reason: PowerView group discovery often follows once the current identity is known
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Native identity and privilege discovery
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Ww][Hh][Oo][Aa][Mm][Ii]\.exe.*/ OR data_win_eventdata_commandLine:/.*([Ww]hoami|[Ee]nv:[Uu][Ss][Ee][Rr][Nn][Aa][Mm][Ee]|[Qq]user).*/)
    pivot_on: host
    window: 2h
  - name: Admin role check via WindowsPrincipal
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ww]indows[Pp]rincipal|IsInRole|[Ww]indows[Bb]uilt[Ii]n[Rr]ole|S\-1\-5\-32\-544).*/
    pivot_on: host
    window: 2h
  - name: Domain and host discovery commands
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Nn]ltest|[Gg]et\-[Aa][Dd]|[Gg]et\-[Dd]omain|net1? +(view|group|localgroup)|[Ss]ysteminfo).*/
    pivot_on: host
    window: 4h
  - name: PowerShell download cradle or tool import
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Dd]ownload[Ss]tring|[Ii]nvoke\-[Ww]eb[Rr]equest|[Nn]et\.[Ww]eb[Cc]lient|[Ff]rom[Bb]ase64[Ss]tring|[Ee]xecution[Pp]olicy +[Bb]ypass|[Ww]indow[Ss]tyle +[Hh]idden|-[Ee]nc).*/
    pivot_on: host
    window: 2h
  - name: Privilege escalation or credential access follow-up
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ss]ekurlsa|[Ll]sass|[Pp]rocdump|[Ff]odhelper|[Ee]ventvwr|[Ii]nvoke\-[Mm]imikatz).*/
    pivot_on: host
    window: 4h
