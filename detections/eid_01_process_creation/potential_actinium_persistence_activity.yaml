name: Potential ACTINIUM Persistence Activity
id: e1118a8f-82f5-44b3-bb6b-8a284e5df602
version: 1
schema_version: "1.0"
date: "2023-03-18"
author: Andreas Hunkeler (@Karneades)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: e1118a8f-82f5-44b3-bb6b-8a284e5df602
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects specific process parameters as used by ACTINIUM scheduled task
  persistence creation. MITRE ATT&CK: T1053, T1053.005.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*schtasks*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*create*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*wscript*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* /e:vbscript*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*schtasks*'; data_win_eventdata_commandLine matches '*create*';
  data_win_eventdata_commandLine matches '*wscript*', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.microsoft.com/security/blog/2022/02/04/actinium-targets-ukrainian-organizations
  - https://attack.mitre.org/techniques/T1053/
  - https://attack.mitre.org/techniques/T1053/005/

response:
  message: >
    Potential ACTINIUM Persistence Activity detected on host $agent_name$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1053, T1053.005
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1053
    - T1053.005
  custom_tags:
    - actinium
    - persistence
    - process_creation
    - sysmon
    - privilege_escalation
    - execution
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss].*/ AND data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee].*/ AND data_win_eventdata_commandLine:/.*[Ww][Ss][Cc][Rr][Ii][Pp][Tt].*/ AND data_win_eventdata_commandLine:/.* \/[Ee]:[Vv][Bb][Ss][Cc][Rr][Ii][Pp][Tt].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: cea72823-df4d-4567-950c-0b579eaf0846
    name: Potential Dropper Script Execution Via WScript/CScript/MSHTA
    reason: The VBScript dropper that planted or is run by the ACTINIUM task executes via wscript/cscript from user-writable paths.
  - id: b6676963-0353-4f88-90f5-36c20d443c6a
    name: Cscript/Wscript Potentially Suspicious Child Process
    reason: Once the scheduled wscript job runs, its payload typically spawns shells or LOLBins as children.
  - id: 99b7460d-c9f1-40d7-a316-1f36f61d52ee
    name: Cscript/Wscript Uncommon Script Extension Execution
    reason: ACTINIUM-style /e:vbscript runs scripts with non-.vbs extensions to evade, a direct sibling of this task command line.
  - id: 81325ce1-be01-4250-944f-b4789644556f
    name: Schedule Task Creation From Env Variable Or Potentially Suspicious Path Via Schtasks.EXE
    reason: Same schtasks /create persistence step; fires when the task points at user-writable paths.
  - id: c5c00f49-b3f9-45a6-997e-cfdecc6e1967
    name: Suspicious Schtasks Execution AppData Folder
    reason: Task payloads staged in AppData are a common companion of this persistence.
  - id: f2c64357-b1d2-41b7-849f-34d2682c0fad
    name: Suspicious Command Patterns In Scheduled Task Creation
    reason: Corroborates the same task creation with suspicious interpreter patterns.
  - id: 20c3f09d-c53d-4e85-8b74-6aa50e2f1b61
    name: Suspicious VBScript UN2452 Pattern
    reason: Another VBScript-driven intrusion pattern following the same wscript execution chain.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Scheduled task creation on host
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss].*[Cc][Rr][Ee][Aa][Tt][Ee].*/
    pivot_on: host
    window: 4h
  - name: wscript/cscript executions
    query: data_win_system_eventID:1 AND data_win_eventdata_image:(*\\wscript.exe OR *\\cscript.exe)
    pivot_on: host
    window: 4h
  - name: Children of wscript/cscript
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:(*\\wscript.exe OR *\\cscript.exe)
    pivot_on: host
    window: 2h
  - name: Script files written to disk
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\.([Vv][Bb][Ss]|[Vv][Bb][Ee]|[Jj][Ss]|[Ww][Ss][Ff]).*/
    pivot_on: host
    window: 4h
  - name: Outbound connections by script hosts
    query: data_win_system_eventID:3 AND data_win_eventdata_image:(*\\wscript.exe OR *\\cscript.exe)
    pivot_on: host
    window: 4h
