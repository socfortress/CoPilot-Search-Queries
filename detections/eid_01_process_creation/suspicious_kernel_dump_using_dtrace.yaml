name: Suspicious Kernel Dump Using Dtrace
id: 7124aebe-4cd7-4ccb-8df0-6d6b93c96795
version: 1
schema_version: "1.0"
date: "2021-12-28"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 7124aebe-4cd7-4ccb-8df0-6d6b93c96795
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious way to dump the kernel on Windows systems using dtrace.exe,
  which is available on Windows systems since Windows 10 19H1. MITRE ATT&CK:
  T1082.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\dtrace.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*lkd(0)*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*syscall:::return*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*lkd(*"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\dtrace.exe'; data_win_eventdata_commandLine matches '*lkd(0)*';
  data_win_eventdata_commandLine matches '*syscall:::return*', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/0gtweet/status/1474899714290208777?s=12
  - https://learn.microsoft.com/en-us/windows-hardware/drivers/devtest/dtrace
  - https://attack.mitre.org/techniques/T1082/

response:
  message: >
    Suspicious Kernel Dump Using Dtrace detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1082
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1082
  custom_tags:
    - kernel
    - dtrace
    - process_creation
    - sysmon
    - discovery
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\[Dd][Tt][Rr][Aa][Cc][Ee]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Ll][Kk][Dd]\(0\).*/) OR (data_win_eventdata_commandLine:/.*[Ss][Yy][Ss][Cc][Aa][Ll][Ll]:::[Rr][Ee][Tt][Uu][Rr][Nn].*/ AND data_win_eventdata_commandLine:/.*[Ll][Kk][Dd]\(.*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c7746f1c-47d3-43d6-8c45-cd1e54b6b0a2
    name: Kernel Memory Dump Via LiveKD
    reason: Same objective, kernel memory capture, via a different tool; operators switch tools if one fails
  - id: a85f7765-698a-4088-afa0-ecfbf8d01fa4
    name: Potential Memory Dumping Activity Via LiveKD
    reason: Alternate kernel memory dumping tool on the same host
  - id: 27ee9438-90dc-4bef-904b-d3ef927f5e7e
    name: Windows Kernel Debugger Execution
    reason: Kernel debugger use is the other route to read kernel memory
  - id: 5afee48e-67dd-4e03-a783-f74259dcf998
    name: Potential LSASS Process Dump Via Procdump
    reason: User-mode credential dump commonly accompanies kernel dump attempts
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: Another memory-harvesting method for credentials
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: Kernel memory is a source for the same secrets Mimikatz extracts
  - id: e76ca062-4de0-4d79-8d90-160a0d335eca
    name: PUA - Kernel Driver Utility (KDU) Execution
    reason: Kernel access tooling used to obtain privilege needed for kernel reading
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Dtrace and kernel debug tool use
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Dd]trace\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Ll]ive[Kk][Dd].*/ OR data_win_eventdata_image:/.*[Ww]in[Dd]bg.*/)
    pivot_on: host
    window: 4h
  - name: Memory dump utilities
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Pp]rocdump.*/ OR data_win_eventdata_commandLine:/.*[Mm]ini[Dd]ump.*/ OR data_win_eventdata_commandLine:/.*[Cc]omsvcs.*/)
    pivot_on: host
    window: 4h
  - name: Dump file staging and archiving
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*\.[Dd][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*\.[Dd][Uu][Mm][Pp].*/) AND (data_win_eventdata_commandLine:/.*[Rr]ar.*/ OR data_win_eventdata_commandLine:/.*7z.*/ OR data_win_eventdata_commandLine:/.*[Cc]url.*/ OR data_win_eventdata_commandLine:/.*[Cc]opy.*/)
    pivot_on: host
    window: 6h
  - name: Driver or debug setup for kernel access
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Pp]np[Uu]til.*/ OR data_win_eventdata_commandLine:/.*[Bb]cdedit.*[Dd]ebug.*/ OR data_win_eventdata_commandLine:/.*[Ss]c.*[Cc]reate.*[Kk]ernel.*/)
    pivot_on: host
    window: 6h
