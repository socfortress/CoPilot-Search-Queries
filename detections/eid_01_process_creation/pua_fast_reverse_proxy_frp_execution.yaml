name: PUA - Fast Reverse Proxy (FRP) Execution
id: 32410e29-5f94-4568-b6a3-d91a8adad863
version: 1
schema_version: "1.0"
date: "2024-11-23"
author: frack113, Florian Roth
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 32410e29-5f94-4568-b6a3-d91a8adad863
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the use of Fast Reverse Proxy. frp is a fast reverse proxy to help you
  expose a local server behind a NAT or firewall to the Internet. MITRE ATT&CK:
  T1090.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\frpc.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\frps.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\frpc.ini*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*MD5=7D9C233B8C9E3F0EA290D2B84593C842*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*SHA1=06DDC9280E1F1810677935A2477012960905942F*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*SHA256=57B0936B8D336D8E981C169466A15A5FD21A7D5A2C7DAF62D5E142EE860E387C*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_hashes
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\frpc.exe'; data_win_eventdata_image matches '*\frps.exe';
  data_win_eventdata_commandLine matches '*\frpc.ini*', among other conditions.

known_false_positives: >
  Legitimate use. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://asec.ahnlab.com/en/38156/
  - https://github.com/fatedier/frp
  - https://attack.mitre.org/techniques/T1090/

response:
  message: >
    PUA - Fast Reverse Proxy (FRP) Execution detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1090
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1090
  custom_tags:
    - reverse
    - proxy
    - process_creation
    - sysmon
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ff][Rr][Pp][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ff][Rr][Pp][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*\\[Ff][Rr][Pp][Cc]\.[Ii][Nn][Ii].*/ OR data_win_eventdata_hashes:/.*[Mm][Dd]5=7[Dd]9[Cc]233[Bb]8[Cc]9[Ee]3[Ff]0[Ee][Aa]290[Dd]2[Bb]84593[Cc]842.*/ OR data_win_eventdata_hashes:/.*[Ss][Hh][Aa]1=06[Dd][Dd][Cc]9280[Ee]1[Ff]1810677935[Aa]2477012960905942[Ff].*/ OR data_win_eventdata_hashes:/.*[Ss][Hh][Aa]256=57[Bb]0936[Bb]8[Dd]336[Dd]8[Ee]981[Cc]169466[Aa]15[Aa]5[Ff][Dd]21[Aa]7[Dd]5[Aa]2[Cc]7[Dd][Aa][Ff]62[Dd]5[Ee]142[Ee][Ee]860[Ee]387[Cc].*/)

