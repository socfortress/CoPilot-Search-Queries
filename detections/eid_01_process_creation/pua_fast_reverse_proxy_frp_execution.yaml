name: PUA - Fast Reverse Proxy (FRP) Execution
id: 32410e29-5f94-4568-b6a3-d91a8adad863
version: 1
schema_version: "1.0"
date: "2024-11-23"
author: frack113, Florian Roth
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 32410e29-5f94-4568-b6a3-d91a8adad863
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the use of Fast Reverse Proxy. frp is a fast reverse proxy to help you
  expose a local server behind a NAT or firewall to the Internet. MITRE ATT&CK:
  T1090.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\frpc.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\frps.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\frpc.ini*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*MD5=7D9C233B8C9E3F0EA290D2B84593C842*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*SHA1=06DDC9280E1F1810677935A2477012960905942F*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*SHA256=57B0936B8D336D8E981C169466A15A5FD21A7D5A2C7DAF62D5E142EE860E387C*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_hashes
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\frpc.exe'; data_win_eventdata_image matches '*\frps.exe';
  data_win_eventdata_commandLine matches '*\frpc.ini*', among other conditions.

known_false_positives: >
  Legitimate use. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://asec.ahnlab.com/en/38156/
  - https://github.com/fatedier/frp
  - https://attack.mitre.org/techniques/T1090/

response:
  message: >
    PUA - Fast Reverse Proxy (FRP) Execution detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1090
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1090
  custom_tags:
    - reverse
    - proxy
    - process_creation
    - sysmon
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ff][Rr][Pp][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ff][Rr][Pp][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*\\[Ff][Rr][Pp][Cc]\.[Ii][Nn][Ii].*/ OR data_win_eventdata_hashes:/.*[Mm][Dd]5=7[Dd]9[Cc]233[Bb]8[Cc]9[Ee]3[Ff]0[Ee][Aa]290[Dd]2[Bb]84593[Cc]842.*/ OR data_win_eventdata_hashes:/.*[Ss][Hh][Aa]1=06[Dd][Dd][Cc]9280[Ee]1[Ff]1810677935[Aa]2477012960905942[Ff].*/ OR data_win_eventdata_hashes:/.*[Ss][Hh][Aa]256=57[Bb]0936[Bb]8[Dd]336[Dd]8[Ee]981[Cc]169466[Aa]15[Aa]5[Ff][Dd]21[Aa]7[Dd]5[Aa]2[Cc]7[Dd][Aa][Ff]62[Dd]5[Ee]142[Ee][Ee]860[Ee]387[Cc].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: ee37eb7c-a4e7-4cd5-8fa4-efa27f1c3f31
    name: PUA - Ngrok Execution
    reason: Alternative tunneling tool; operators often stage several tunnels on one foothold for redundancy.
  - id: 8b0e12da-d3c3-49db-bb4f-256703f380e5
    name: PUA - Chisel Tunneling Tool Execution
    reason: Co-deployed reverse-tunnel/SOCKS tool; same pivoting objective as FRP.
  - id: 322ed9ec-fcab-4f67-9a34-e7c6aef43614
    name: New Port Forwarding Rule Added Via Netsh.EXE
    reason: Native portproxy used alongside or instead of FRP to expose internal services.
  - id: cd5cfd80-aa5f-44c0-9c20-108c4ae12e3c
    name: New Firewall Rule Added Via Netsh.EXE
    reason: FRP server/client ports often need an inbound allow rule opened first.
  - id: f38ce0b9-5e97-4b47-a211-7dc8d8b871da
    name: Potential RDP Tunneling Via Plink
    reason: 'Follow-on: RDP carried through a tunnel for interactive lateral movement.'
  - id: 782d6f3e-4c5d-4b8c-92a3-1d05fed72e63
    name: RDP Port Forwarding Rule Added Via Netsh.EXE
    reason: Exposing 3389 via forwarding is the usual use of a reverse-proxy foothold.
  - id: 85c312b7-f44d-4a51-a024-d671c40b49fc
    name: Service StartupType Change Via Sc.EXE
    reason: frpc is commonly persisted as an auto-start service after first run.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: frp binary or config referenced
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ff]rpc.*/ OR /.*[Ff]rps.*/)
    pivot_on: host
    window: 6h
  - name: Persistence of tunnel via service or scheduled task
    query: data_win_system_eventID:1 AND data_win_eventdata_image:(/.*[Ss]c\.exe/ OR /.*[Ss]chtasks\.exe/) AND data_win_eventdata_commandLine:/.*[Cc]reate.*/
    pivot_on: host
    window: 6h
  - name: Firewall or portproxy changes opening listeners
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Nn]etsh\.exe/ AND data_win_eventdata_commandLine:(/.*[Ff]irewall.*/ OR /.*portproxy.*/)
    pivot_on: host
    window: 4h
  - name: Outbound connections from user-writable paths
    query: data_win_system_eventID:3 AND data_win_eventdata_initiated:true AND data_win_eventdata_image:(/.*[Tt]emp.*/ OR /.*[Pp]ublic.*/ OR /.*[Pp]rogram[Dd]ata.*/ OR /.*[Aa]pp[Dd]ata.*/)
    pivot_on: host
    window: 4h
  - name: Network or RDP logons after tunnel start
    query: data_win_system_eventID:4624 AND data_win_eventdata_logonType:(3 OR 10)
    pivot_on: host
    window: 6h
