correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: fdb62a13-9a81-4e5c-a38f-ea93a16f6d7c
    name: PowerShell Base64 Encoded FromBase64String Cmdlet
    reason: Decode step that usually feeds the encoded IEX in the same stager
  - id: 6385697e-9f1b-40bd-8817-f4a91f40508e
    name: PowerShell Base64 Encoded Invoke Keyword
    reason: Sibling encoded Invoke-* keyword in same payload
  - id: 09576804-7a05-458e-a817-eb718ca91f54
    name: Suspicious PowerShell IEX Execution Patterns
    reason: Plain-text IEX variants of the same execution primitive on the host
  - id: ca2092a1-c273-4878-9b4b-0d60115bf5ea
    name: Suspicious Encoded PowerShell Command Line
    reason: Outer -enc wrapper carrying the IEX
  - id: ee18ed37-0802-4268-9435-b3b91aaa18db
    name: PowerShell - Connect To Internet With Hidden Window
    reason: Hidden-window download that supplies the IEX content
  - id: 02b64f1b-3f33-4e67-aede-ef3b0a5a8fcf
    name: Potential COM Objects Download Cradles Usage - Process Creation
    reason: Alternative download cradle feeding IEX
  - id: c6fb44c6-71f5-49e6-9462-1425d328aee3
    name: Powershell Base64 Encoded MpPreference Cmdlet
    reason: Defense evasion commonly bundled with encoded IEX stagers
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Download cradles feeding IEX
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Dd]ownload(String|File).*/ OR data_win_eventdata_commandLine:/.*[Ii]nvoke-[Ww]eb[Rr]equest.*/ OR data_win_eventdata_commandLine:/.*[Nn]et\.[Ww]eb[Cc]lient.*/ OR data_win_eventdata_commandLine:/.*[Ii]wr .*/ OR data_win_eventdata_commandLine:/.*[Xx][Mm][Ll][Hh][Tt][Tt][Pp].*/ OR data_win_eventdata_commandLine:/.*[Bb]its[Aa]dmin.*\/[Tt]ransfer.*/)
    pivot_on: host
    window: 2h
  - name: Reflective load and injection primitives
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Rr]eflection\.[Aa]ssembly.*/ OR data_win_eventdata_commandLine:/.*[Vv]irtual[Aa]lloc.*/ OR data_win_eventdata_commandLine:/.*[Cc]reate[Tt]hread.*/ OR data_win_eventdata_commandLine:/.*[Aa]ssembly\]::[Ll]oad.*/)
    pivot_on: host
    window: 2h
  - name: Defender tampering
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss]et-[Mm]p[Pp]reference.*/ OR data_win_eventdata_commandLine:/.*[Aa]dd-[Mm]p[Pp]reference.*/ OR data_win_eventdata_commandLine:/.*[Dd]isable[Rr]ealtime[Mm]onitoring.*/)
    pivot_on: host
    window: 4h
  - name: Office or script hosts spawning PowerShell
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\(powershell|pwsh)\.exe/ AND data_win_eventdata_parentImage:/.*\\(winword|excel|outlook|mshta|wscript|cscript|wmiprvse)\.exe/
    pivot_on: host
    window: 2h
  - name: Persistence and discovery after execution
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss].*\/[Cc][Rr][Ee][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Rr]eg .*[Aa]dd.*[Rr]un.*/ OR data_win_eventdata_commandLine:/.*[Ww]hoami.*/ OR data_win_eventdata_commandLine:/.*[Nn]et1? [Gg]roup.*/)
    pivot_on: host
    window: 6h
