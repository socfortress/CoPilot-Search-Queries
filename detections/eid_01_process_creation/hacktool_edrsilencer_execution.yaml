name: HackTool - EDRSilencer Execution
id: eb2d07d4-49cb-4523-801a-da002df36602
version: 1
schema_version: "1.0"
date: "2024-01-02"
author: "@gott_cyber"
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: eb2d07d4-49cb-4523-801a-da002df36602
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of EDRSilencer, a tool that leverages Windows Filtering
  Platform (WFP) to block Endpoint Detection and Response (EDR) agents from
  reporting security events to the server based on PE metadata information.
  MITRE ATT&CK: T1685.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\EDRSilencer.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "EDRSilencer.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_description:
                    value: "*EDRSilencer*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_description
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\EDRSilencer.exe'; data_win_eventdata_originalFileName equals
  'EDRSilencer.exe'; data_win_eventdata_description matches '*EDRSilencer*'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/netero1010/EDRSilencer
  - https://attack.mitre.org/techniques/T1685/

response:
  message: >
    HackTool - EDRSilencer Execution detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1685
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685
  custom_tags:
    - hacktool
    - edrsilencer
    - process_creation
    - sysmon
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ee][Dd][Rr][Ss][Ii][Ll][Ee][Nn][Cc][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ee][Dd][Rr][Ss][Ii][Ll][Ee][Nn][Cc][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_description:/.*[Ee][Dd][Rr][Ss][Ii][Ll][Ee][Nn][Cc][Ee][Rr].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c598cc0c-9e70-4852-b9eb-8921af79f598
    name: Hacktool - EDR-Freeze Execution
    reason: Sibling EDR-blinding tool; operators stack techniques to cut agent telemetry.
  - id: cd5cfd80-aa5f-44c0-9c20-108c4ae12e3c
    name: New Firewall Rule Added Via Netsh.EXE
    reason: If EDRSilencer fails, attackers fall back to firewall block rules against agent binaries.
  - id: 57c4bf16-227f-4394-8ec7-1b745ee061c3
    name: Firewall Disabled via Netsh.EXE
    reason: Firewall manipulation is a common companion network-defense-evasion step.
  - id: windows-attempt-stop-security-service-001
    name: Windows Attempt To Stop Security Service
    reason: Parallel attempts to stop agent services accompany network blocking of the agent.
  - id: windows-powershell-disable-security-monitoring-001
    name: Windows PowerShell Disable Security Monitoring
    reason: Defender tampering is typically combined with EDR network blocking.
  - id: 39b64854-5497-4b57-a448-40977b8c9679
    name: Malicious Driver Load By Name
    reason: BYOVD driver loads are an alternate EDR-kill method used alongside such tools.
  - id: 679085d5-f427-4484-9f58-1dc30a7c426d
    name: WinDivert Driver Load
    reason: WinDivert is another packet-filter driver used to drop EDR traffic.
  - id: 4931188c-178e-4ee7-a348-39e8a7a56821
    name: Filter Driver Unloaded Via Fltmc.EXE
    reason: Unloading EDR minifilters complements network blocking.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: EDRSilencer command verbs (block/unblock agents)
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Bb][Ll][Oo][Cc][Kk][Ee][Dd][Rr]|[Uu][Nn][Bb][Ll][Oo][Cc][Kk][Aa][Ll][Ll]|[Uu][Nn][Bb][Ll][Oo][Cc][Kk] ).*/
    pivot_on: host
    window: 4h
  - name: Windows Filtering Platform filter changes
    query: (data_win_system_eventID:"5441" OR data_win_system_eventID:"5446" OR data_win_system_eventID:"5447" OR data_win_system_eventID:"5448" OR data_win_system_eventID:"5449")
    pivot_on: host
    window: 4h
  - name: Firewall block rules via netsh or PowerShell
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Nn][Ee][Tt][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*([Aa][Dd][Dd] [Rr][Uu][Ll][Ee]|[Nn][Ee][Ww]-[Nn][Ee][Tt][Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll][Rr][Uu][Ll][Ee]).*/ AND data_win_eventdata_commandLine:/.*([Bb][Ll][Oo][Cc][Kk]).*/
    pivot_on: host
    window: 4h
  - name: Security tool stop/tamper alongside the block
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ss][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Nn][Ee][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Tt][Aa][Ss][Kk][Kk][Ii][Ll][Ll]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*([Ss][Tt][Oo][Pp]|\/[Ii][Mm]|[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Dd]).*([Ww][Ii][Nn][Dd][Ee][Ff][Ee][Nn][Dd]|[Mm][Ss][Mm][Pp][Ee][Nn][Gg]|[Ss][Ee][Nn][Ss][Ee]|[Ww][Aa][Zz][Uu][Hh]|[Cc][Ss][Aa][Gg][Ee][Nn][Tt]|[Ss][Ee][Nn][Tt][Ii][Nn][Ee][Ll]|[Ss][Oo][Pp][Hh][Oo][Ss]|[Cc][Bb][Dd][Ee][Ff][Ee][Nn][Ss][Ee]).*/
    pivot_on: host
    window: 4h
  - name: EDRSilencer binary dropped or renamed on disk
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*([Ee][Dd][Rr][Ss][Ii][Ll][Ee][Nn][Cc][Ee][Rr]).*/
    pivot_on: host
    window: 24h
