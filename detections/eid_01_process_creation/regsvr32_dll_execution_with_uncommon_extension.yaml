name: Regsvr32 DLL Execution With Uncommon Extension
id: 50919691-7302-437f-8e10-1fe088afa145
version: 1
schema_version: "1.0"
date: "2023-05-24"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 50919691-7302-437f-8e10-1fe088afa145
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a "regsvr32" execution where the DLL doesn't contain a common file
  extension. MITRE ATT&CK: T1574.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\regsvr32.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "REGSVR32.EXE"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*.ax*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*.cpl*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*.dll*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*.ocx*"
                          case_insensitive: true
                    - bool:
                        must_not:
                          - exists:
                              field: "data_win_eventdata_commandLine"
                    - term:
                        data_win_eventdata_commandLine: ""
                  minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_commandLine"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*.ppl*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*.bav*"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\regsvr32.exe'; data_win_eventdata_originalFileName equals 'REGSVR32.EXE';
  data_win_eventdata_commandLine matches '*.ax*', among other conditions.

known_false_positives: >
  Other legitimate extensions currently not in the list either from third party
  or specific Windows components. Baseline expected activity in your environment
  and tune this detection before relying on it for automated response.

references:
  - https://app.any.run/tasks/34221348-072d-4b70-93f3-aa71f6ebecad/
  - https://attack.mitre.org/techniques/T1574/

response:
  message: >
    Regsvr32 DLL Execution With Uncommon Extension detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1574
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574
  custom_tags:
    - regsvr32
    - uncommon
    - extension
    - process_creation
    - sysmon
    - privilege_escalation
    - persistence
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee]/) AND NOT (data_win_eventdata_commandLine:/.*\.[Aa][Xx].*/ OR data_win_eventdata_commandLine:/.*\.[Cc][Pp][Ll].*/ OR data_win_eventdata_commandLine:/.*\.[Dd][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*\.[Oo][Cc][Xx].*/ OR NOT _exists_:data_win_eventdata_commandLine OR data_win_eventdata_commandLine:"") AND _exists_:data_win_eventdata_commandLine AND NOT (data_win_eventdata_commandLine:/.*\.[Pp][Pp][Ll].*/ OR data_win_eventdata_commandLine:/.*\.[Bb][Aa][Vv].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 089fc3d2-71e8-4763-a8a5-c97fbb0a403e
    name: Regsvr32 DLL Execution With Suspicious File Extension
    reason: DLL disguised as image/text/data file loaded by regsvr32 - masquerade variant of the same behaviour
  - id: 327ff235-94eb-4f06-b9de-aaee571324be
    name: Regsvr32 Execution From Highly Suspicious Location
    reason: Same regsvr32 execution with the DLL staged in a more explicitly malicious path, raising confidence
  - id: 9525dc73-0327-438c-8c04-13c0e037e9da
    name: Regsvr32 Execution From Potential Suspicious Location
    reason: Same regsvr32 execution with the DLL in user-writable staging paths (Temp/AppData/ProgramData)
  - id: ab37a6ec-6068-432b-a64e-2c7bf95b1d22
    name: Scripting/CommandLine Process Spawned Regsvr32
    reason: Identifies the parent (script host/cmd/PowerShell) that launched this regsvr32, the delivery chain behind the DLL load
  - id: 6f0947a4-1c5e-4e0d-8ac7-53159b8f23ca
    name: Potentially Suspicious Child Process Of Regsvr32
    reason: Regsvr32 spawning cmd/PowerShell indicates the loaded DLL executed a payload; the next step after this alert
  - id: f421c250-24e7-11ec-bc43-acde48001122
    name: Regsvr32 Silent and Install Param Dll Loading
    reason: Silent /s /i flags are the usual regsvr32 loader invocation accompanying a malicious DLL
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Regsvr32 child processes
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Rr]egsvr32\.exe/
    pivot_on: host
    window: 2h
  - name: Regsvr32 network connections
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*[Rr]egsvr32\.exe/
    pivot_on: host
    window: 2h
  - name: Regsvr32 image loads from user-writable paths
    query: data_win_system_eventID:7 AND data_win_eventdata_image:/.*[Rr]egsvr32\.exe/ AND data_win_eventdata_imageLoaded:(/.*[Tt]emp.*/ OR /.*[Aa]pp[Dd]ata.*/ OR /.*[Pp]rogram[Dd]ata.*/ OR /.*[Uu]sers.[Pp]ublic.*/)
    pivot_on: host
    window: 2h
  - name: Recently dropped DLL/payload files
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(/.*\.[Dd][Ll][Ll]/ OR /.*\.[Oo][Cc][Xx]/ OR /.*\.[Dd][Aa][Tt]/ OR /.*\.[Bb][Ii][Nn]/ OR /.*\.[Tt][Mm][Pp]/) AND data_win_eventdata_targetFilename:(/.*[Tt]emp.*/ OR /.*[Aa]pp[Dd]ata.*/ OR /.*[Pp]rogram[Dd]ata.*/ OR /.*[Pp]erf[Ll]ogs.*/)
    pivot_on: host
    window: 1h
  - name: Script/office parents launching regsvr32
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Rr]egsvr32\.exe/ AND data_win_eventdata_parentImage:(/.*[Ww]ord\.exe/ OR /.*[Ee]xcel\.exe/ OR /.*[Mm]shta\.exe/ OR /.*[Ww]script\.exe/ OR /.*[Cc]script\.exe/ OR /.*[Pp]ower[Ss]hell\.exe/ OR /.*[Cc]md\.exe/)
    pivot_on: host
    window: 2h
