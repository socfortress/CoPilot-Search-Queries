name: Defrag Deactivation
id: 958d81aa-8566-4cea-a565-59ccd4df27b0
version: 1
schema_version: "1.0"
date: "2022-10-09"
author: Florian Roth (Nextron Systems), Bartlomiej Czyz (@bczyz1)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 958d81aa-8566-4cea-a565-59ccd4df27b0
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the deactivation and disabling of the Scheduled defragmentation task
  as seen by Slingshot APT group. MITRE ATT&CK: T1053.005.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\schtasks.exe"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*/delete*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*/change*"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*/TN*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*\\\\Microsoft\\\\Windows\\\\Defrag\\\\ScheduledDefrag*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\schtasks.exe'; data_win_eventdata_commandLine matches '*/delete*';
  data_win_eventdata_commandLine matches '*/change*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://securelist.com/apt-slingshot/84312/
  - https://attack.mitre.org/techniques/T1053/005/

response:
  message: >
    Defrag Deactivation detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1053.005
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1053.005
  custom_tags:
    - defrag
    - deactivation
    - process_creation
    - sysmon
    - privilege_escalation
    - execution
    - persistence
    - s0111
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*\/[Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*\/[Cc][Hh][Aa][Nn][Gg][Ee].*/) AND data_win_eventdata_commandLine:/.*\/[Tt][Nn].*/ AND data_win_eventdata_commandLine:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Dd][Ee][Ff][Rr][Aa][Gg]\\[Ss][Cc][Hh][Ee][Dd][Uu][Ll][Ee][Dd][Dd][Ee][Ff][Rr][Aa][Gg].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c5a178bf-9cfb-4340-b584-e4df39b6a3e7
    name: Defrag Deactivation - Security
    reason: Same defrag task tampering seen in the Security log (4699/4702); corroborates the schtasks action.
  - id: dbc1f800-0fe0-4bc0-9c66-292c2abe3f78
    name: Delete Important Scheduled Task
    reason: 'Same behaviour class: deleting system maintenance tasks to impair defenses.'
  - id: 9ac94dc8-9042-493c-ba45-3b5e7c86b980
    name: Disable Important Scheduled Task
    reason: Sibling schtasks /change /disable against other important tasks by the same actor.
  - id: 9e3cb244-bdb8-4632-8c90-6079c8f4f16d
    name: Important Scheduled Task Deleted or Disabled
    reason: Task Scheduler operational log confirmation of the task change.
  - id: 220457c1-1c9f-4c2e-afe6-9598926222c1
    name: Delete All Scheduled Tasks
    reason: Broader schtasks wiping that may accompany this tampering.
  - id: 1c0e41cd-21bb-4433-9acc-4a2cd6367b9b
    name: Suspicious Modification Of Scheduled Tasks
    reason: Attacker-created or altered tasks used in the same intrusion for persistence.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other schtasks delete or disable actions
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*schtasks\.exe/ AND (data_win_eventdata_commandLine:/.*\/[Dd]elete.*/ OR data_win_eventdata_commandLine:/.*\/[Cc]hange.*\/[Dd]isable.*/)
    pivot_on: host
    window: 6h
  - name: New scheduled task creation for persistence
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*schtasks\.exe/ AND data_win_eventdata_commandLine:/.*\/[Cc]reate.*/
    pivot_on: host
    window: 6h
  - name: Task Scheduler changes in Security log
    query: (data_win_system_eventID:4698 OR data_win_system_eventID:4699 OR data_win_system_eventID:4702)
    pivot_on: host
    window: 6h
  - name: Shell parents invoking schtasks
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*(cmd|powershell|wscript|cscript)\.exe/ AND data_win_eventdata_commandLine:/.*schtasks.*/
    pivot_on: host
    window: 2h
  - name: 'Defense evasion: Defender or log tampering'
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*Set-MpPreference.*/ OR data_win_eventdata_commandLine:/.*wevtutil.*(cl|clear-log).*/)
    pivot_on: host
    window: 6h
