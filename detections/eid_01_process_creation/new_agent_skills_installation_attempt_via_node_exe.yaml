name: New Agent Skills Installation Attempt Via Node.EXE
id: afa71271-6a97-4e47-810f-83120fb1a4ce
version: 1
schema_version: "1.0"
date: "2026-02-03"
author: Marco Pedrinazzi (@pedrinazziM) (InTheCyber)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: afa71271-6a97-4e47-810f-83120fb1a4ce
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the attempt to install new skills for AI agents using the "npx skills"
  command. Agent skills enhance AI agents with new capabilities, but attackers
  may abuse this mechanism to inject malicious commands executed by the agent on
  behalf of the user. The "npx skills" command can install skills for various
  agents (e.g., Claude Code, Cursor, and others). Analysts should review any
  installed skills to verify their legitimacy. Note: Tune this rule based on
  whether AI agent tooling is allowed in your environment. In environments where
  such tooling is authorized, this detection may reflect normal activity and the
  alert level should be adjusted accordingly. In environments where AI agent
  tooling is not permitted, this activity is likely suspicious and may require
  immediate investigation. MITRE ATT&CK: T1059.007.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\node.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "node.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*npx-cli.js*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*skills *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* add *"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\node.exe'; data_win_eventdata_originalFileName equals 'node.exe';
  data_win_eventdata_commandLine matches '*npx-cli.js*', among other conditions.

known_false_positives: >
  This rule will be triggered when a new agent skill is installed regardless if
  it is benign or malicious.. High false positive rate expected in environments
  where AI agent tooling is authorized and commonly used. Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://blog.lukaszolejnik.com/supply-chain-risk-of-agentic-ai-infecting-infrastructures-via-skill-worms/
  - https://github.com/vercel-labs/skills/blob/1f7fbc8d0e49c4e0601d364696bd1bdd15e80967/README.md
  - https://opensourcemalware.com/blog/clawdbot-skills-ganked-your-crypto
  - https://promptintel.novahunting.ai/molt
  - https://attack.mitre.org/techniques/T1059/007/

response:
  message: >
    New Agent Skills Installation Attempt Via Node.EXE detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1059.007
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.007
  custom_tags:
    - agent
    - skills
    - installation
    - process_creation
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Nn][Oo][Dd][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Nn][Oo][Dd][Ee]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Nn][Pp][Xx]-[Cc][Ll][Ii]\.[Jj][Ss].*/ AND data_win_eventdata_commandLine:/.*[Ss][Kk][Ii][Ll][Ll][Ss] .*/ AND data_win_eventdata_commandLine:/.* [Aa][Dd][Dd] .*/

