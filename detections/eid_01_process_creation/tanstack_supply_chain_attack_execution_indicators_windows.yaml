name: TanStack Supply-Chain Attack Execution Indicators - Windows
id: 9b4f3d2e-6e8c-5fab-c7d9-2a3b4e5f6a7b
version: 1
schema_version: "1.0"
date: "2026-05-12"
author: Leonardo Gasparini
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 9b4f3d2e-6e8c-5fab-c7d9-2a3b4e5f6a7b
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects process execution indicators associated with the Mini Shai-Hulud
  supply-chain campaign targeting TanStack npm packages and others such as
  mistralai, uipath reported on early May 2026. MITRE ATT&CK: T1059.007,
  T1204.002.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\bun.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*run*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*tanstack_runner.js*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches '*\bun.exe';
  data_win_eventdata_commandLine matches '*run*'; data_win_eventdata_commandLine
  matches '*tanstack_runner.js*'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://socket.dev/blog/tanstack-npm-packages-compromised-mini-shai-hulud-supply-chain-attack
  - https://socket.dev/supply-chain-attacks/mini-shai-hulud
  - https://safedep.io/mass-npm-supply-chain-attack-tanstack-mistral/
  - https://attack.mitre.org/techniques/T1059/007/
  - https://attack.mitre.org/techniques/T1204/002/

response:
  message: >
    TanStack Supply-Chain Attack Execution Indicators - Windows detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
    MITRE ATT&CK: T1059.007, T1204.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.007
    - T1204.002
  custom_tags:
    - tanstack
    - supply
    - chain
    - process_creation
    - sysmon
    - execution
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Bb][Uu][Nn]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Rr][Uu][Nn].*/ AND data_win_eventdata_commandLine:/.*[Tt][Aa][Nn][Ss][Tt][Aa][Cc][Kk]_[Rr][Uu][Nn][Nn][Ee][Rr]\.[Jj][Ss].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 5299fadf-f228-4526-8274-251db1960be9
    name: Shai-Hulud Malicious Bun Execution
    reason: 'Same Mini Shai-Hulud family: bun spawned by node running the malicious payload.'
  - id: 540703fb-a874-4385-a9d6-7cd1bfab268c
    name: Shai-Hulud Malware Indicators - Windows
    reason: Companion indicators of the same npm worm campaign.
  - id: df1f26d3-bea7-4700-9ea2-ad3e990cf90e
    name: Node Process Executions
    reason: npm install hook launching node is the precursor to the bun runner.
  - id: 44030449-b0df-4c94-aae1-502359ab28ee
    name: PUA - TruffleHog Execution
    reason: The campaign harvests secrets with TruffleHog after execution.
  - id: 8537c866-072e-460d-bfff-aaf39cbd73d3
    name: Potentially Suspicious Inline JavaScript Execution via NodeJS Binary
    reason: Inline JS execution through node in the same infection chain.
  - id: 6640f31c-01ad-49b5-beb5-83498a5cd8bd
    name: Potential Arbitrary Code Execution Via Node.EXE
    reason: Arbitrary code via node as the install-time dropper.
  - id: f6c27ecc-d890-4452-80e6-2e274a10e097
    name: Axios NPM Compromise Indicators - Windows
    reason: Sibling npm supply-chain compromise with the same developer-host exposure.
  - id: 5bac7a56-da88-4c27-922e-c81e113b20cb
    name: Github Self-Hosted Runner Execution
    reason: Shai-Hulud variants register rogue self-hosted GitHub runners for persistence.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Node/npm package install activity
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\(node|npm|npx|pnpm|yarn)\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*(npm|pnpm|yarn).*install.*/)
    pivot_on: host
    window: 6h
  - name: Bun runtime and setup scripts
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Bb][Uu][Nn]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*setup_bun.*/ OR data_win_eventdata_commandLine:/.*bun_environment.*/)
    pivot_on: host
    window: 6h
  - name: Secret harvesting tools
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Tt]ruffle[Hh]og.*/ OR data_win_eventdata_commandLine:/.*[Gg]h.*auth.*token.*/ OR data_win_eventdata_commandLine:/.*[Nn]pm.*[Tt]oken.*/)
    pivot_on: host
    window: 6h
  - name: GitHub runner download or registration
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*actions\/runner.*/ OR data_win_eventdata_commandLine:/.*config\.cmd.*--url.*/)
    pivot_on: host
    window: 6h
  - name: Outbound download tools by the same user
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc]url.*[Hh]ttp.*/ OR data_win_eventdata_commandLine:/.*[Ii]nvoke-[Ww]eb[Rr]equest.*/ OR data_win_eventdata_commandLine:/.*[Ww]get.*/)
    pivot_on: user
    window: 4h
