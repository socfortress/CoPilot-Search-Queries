name: New Firewall Rule Added Via Netsh.EXE
id: cd5cfd80-aa5f-44c0-9c20-108c4ae12e3c
version: 1
schema_version: "1.0"
date: "2023-02-10"
author: Markus Neis, Sander Wiebing
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: cd5cfd80-aa5f-44c0-9c20-108c4ae12e3c
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the addition of a new rule to the Windows firewall via netsh. MITRE
  ATT&CK: T1686.003.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\netsh.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "netsh.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* firewall *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* add *"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_commandLine"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*advfirewall firewall add rule name=Dropbox dir=in action=allow \"program=?:\\\\Program Files (x86)\\\\Dropbox\\\\Client\\\\Dropbox.exe\" enable=yes profile=Any*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*advfirewall firewall add rule name=Dropbox dir=in action=allow \"program=?:\\\\Program Files\\\\Dropbox\\\\Client\\\\Dropbox.exe\" enable=yes profile=Any*"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\netsh.exe'; data_win_eventdata_originalFileName equals 'netsh.exe';
  data_win_eventdata_commandLine matches '* firewall *', among other conditions.

known_false_positives: >
  Legitimate administration activity. Software installations. Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://web.archive.org/web/20190508165435/https://www.operationblockbuster.com/wp-content/uploads/2016/02/Operation-Blockbuster-RAT-and-Staging-Report.pdf
  - https://attack.mitre.org/techniques/T1686/003/

response:
  message: >
    New Firewall Rule Added Via Netsh.EXE detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1686.003
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1686.003
  custom_tags:
    - firewall
    - added
    - netsh
    - process_creation
    - sysmon
    - defense_impairment
    - s0246
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Nn][Ee][Tt][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Nn][Ee][Tt][Ss][Hh]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.* [Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll] .*/ AND data_win_eventdata_commandLine:/.* [Aa][Dd][Dd] .*/ AND _exists_:data_win_eventdata_commandLine AND NOT (data_win_eventdata_commandLine:/.*[Aa][Dd][Vv][Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll] [Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll] [Aa][Dd][Dd] [Rr][Uu][Ll][Ee] [Nn][Aa][Mm][Ee]=[Dd][Rr][Oo][Pp][Bb][Oo][Xx] [Dd][Ii][Rr]=[Ii][Nn] [Aa][Cc][Tt][Ii][Oo][Nn]=[Aa][Ll][Ll][Oo][Ww] \"[Pp][Rr][Oo][Gg][Rr][Aa][Mm]=.:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Dd][Rr][Oo][Pp][Bb][Oo][Xx]\\[Cc][Ll][Ii][Ee][Nn][Tt]\\[Dd][Rr][Oo][Pp][Bb][Oo][Xx]\.[Ee][Xx][Ee]\" [Ee][Nn][Aa][Bb][Ll][Ee]=[Yy][Ee][Ss] [Pp][Rr][Oo][Ff][Ii][Ll][Ee]=[Aa][Nn][Yy].*/ OR data_win_eventdata_commandLine:/.*[Aa][Dd][Vv][Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll] [Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll] [Aa][Dd][Dd] [Rr][Uu][Ll][Ee] [Nn][Aa][Mm][Ee]=[Dd][Rr][Oo][Pp][Bb][Oo][Xx] [Dd][Ii][Rr]=[Ii][Nn] [Aa][Cc][Tt][Ii][Oo][Nn]=[Aa][Ll][Ll][Oo][Ww] \"[Pp][Rr][Oo][Gg][Rr][Aa][Mm]=.:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Dd][Rr][Oo][Pp][Bb][Oo][Xx]\\[Cc][Ll][Ii][Ee][Nn][Tt]\\[Dd][Rr][Oo][Pp][Bb][Oo][Xx]\.[Ee][Xx][Ee]\" [Ee][Nn][Aa][Bb][Ll][Ee]=[Yy][Ee][Ss] [Pp][Rr][Oo][Ff][Ii][Ll][Ee]=[Aa][Nn][Yy].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 322ed9ec-fcab-4f67-9a34-e7c6aef43614
    name: New Port Forwarding Rule Added Via Netsh.EXE
    reason: Port-forwarding rules are commonly set up together with an allow rule for pivoting.
  - id: 01aeb693-138d-49d2-9403-c4f52d7d3d62
    name: RDP Connection Allowed Via Netsh.EXE
    reason: Allow rules for RDP are a frequent purpose of added firewall rules before lateral movement.
  - id: 782d6f3e-4c5d-4b8c-92a3-1d05fed72e63
    name: RDP Port Forwarding Rule Added Via Netsh.EXE
    reason: RDP port forwarding combined with a new allow rule exposes RDP externally.
  - id: a70dcb37-3bee-453a-99df-d0c683151be6
    name: Firewall Rule Update Via Netsh.EXE
    reason: Rule modification on the same host shows continued firewall tampering.
  - id: 57c4bf16-227f-4394-8ec7-1b745ee061c3
    name: Firewall Disabled via Netsh.EXE
    reason: Disabling the firewall is the blunt alternative or companion to adding rules.
  - id: 6860a62c-9203-11eb-9e05-acde48001122
    name: Disabling Firewall with Netsh
    reason: Another netsh firewall-disable variant with the same defense-evasion intent.
  - id: 1a5fefe6-734f-452e-a07d-fc1c35bce4b2
    name: Firewall Rule Deleted Via Netsh.EXE
    reason: Deleting existing rules alongside adding new ones indicates deliberate firewall reshaping.
  - id: d3c3861d-c504-4c77-ba55-224ba82d0118
    name: New Network Trace Capture Started Via Netsh.EXE
    reason: Netsh trace capture on the same host suggests traffic sniffing after opening access.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other netsh firewall and portproxy changes
    query: data_win_system_eventID:1 AND data_win_eventdata_image:*[Nn][Ee][Tt][Ss][Hh].exe AND (data_win_eventdata_commandLine:*[Ff]irewall* OR data_win_eventdata_commandLine:*[Pp]ortproxy*)
    pivot_on: host
    window: 4h
  - name: Firewall rule changes in Windows logs
    query: (data_win_system_eventID:4946 OR data_win_system_eventID:4947 OR data_win_system_eventID:4948 OR data_win_system_eventID:2004)
    pivot_on: host
    window: 4h
  - name: PowerShell firewall cmdlets
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:*[Nn]ew-[Nn]et[Ff]irewall[Rr]ule* OR data_win_eventdata_commandLine:*[Ss]et-[Nn]et[Ff]irewall*)
    pivot_on: host
    window: 4h
  - name: Persistence or remote-access setup nearby
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:*[Ss]chtasks*/[Cc]reate* OR data_win_eventdata_commandLine:*[Ss]c*[Cc]reate* OR data_win_eventdata_commandLine:*[Ll]ocalgroup*[Rr]emote*)
    pivot_on: host
    window: 4h
  - name: Inbound connections after rule creation
    query: data_win_system_eventID:3 AND data_win_eventdata_initiated:false
    pivot_on: host
    window: 4h
