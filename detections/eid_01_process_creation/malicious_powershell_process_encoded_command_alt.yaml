name: Windows Malicious PowerShell Process - Encoded Command
id: windows-malicious-powershell-process-encoded-command-001
version: 1
schema_version: "1.0"
date: "2026-02-12"
author: SOCFortress LLC
status: production
type: Hunting

description: >
  Detects PowerShell processes launched with the EncodedCommand parameter or its 
  shortened variants (-enc, -ec, -enco). Adversaries frequently use encoded commands 
  to obfuscate malicious scripts, making detection harder. This technique is widely 
  used by malware families including Qakbot, Volt Typhoon, Hermetic Wiper, DarkCrystal RAT, 
  and Lumma Stealer.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image: "*powershell*"
              - wildcard:
                  data_win_eventdata_image: "*pwsh*"
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine: "*-enc *"
              - wildcard:
                  data_win_eventdata_commandLine: "*-ec *"
              - wildcard:
                  data_win_eventdata_commandLine: "*-EncodedCommand*"
              - wildcard:
                  data_win_eventdata_commandLine: "*-enco*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-12 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-12 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Windows endpoints with Sysmon 
  installed and configured to log process creation events (EventID 1) with full 
  command-line arguments. The index pattern should match your Wazuh index naming 
  convention.

known_false_positives: >
  System administrators may occasionally use encoded commands for legitimate automation 
  scripts. Review the decoded base64 content and parent process context to determine 
  legitimacy. Tune based on known administrative scripts and authorized automation tools.

references:
  - https://attack.mitre.org/techniques/T1027/
  - https://regexr.com/662ov
  - https://ss64.com/ps/powershell.html
  - https://www.microsoft.com/en-us/security/blog/2023/05/24/volt-typhoon-targets-us-critical-infrastructure-with-living-off-the-land-techniques/

response:
  message: >
    PowerShell encoded command execution detected on $agent_name$. 
    Command line: $data_win_eventdata_commandLine$. 
    Parent process: $data_win_eventdata_parentImage$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1027
  risk_score: 40
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 40
  threat_objects: []

tags:
  analytic_story:
    - Malicious PowerShell
    - Volt Typhoon
    - Hermetic Wiper
    - Qakbot
    - DarkCrystal RAT
    - Lumma Stealer
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1027
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*powershell.*/ OR data_win_eventdata_image:/.*pwsh.*/) AND (data_win_eventdata_commandLine:/.*\-enc\s.*/ OR data_win_eventdata_commandLine:/.*\-ec\s.*/ OR data_win_eventdata_commandLine:/.*\-EncodedCommand.*/ OR data_win_eventdata_commandLine:/.*\-enco.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e32d4572-9826-4738-b651-95fa63747e8a
    name: Base64 Encoded PowerShell Command Detected
    reason: Same encoded-launcher behaviour seen from the content side; confirms the payload is real base64 script rather than a lookalike flag.
  - id: ca2092a1-c273-4878-9b4b-0d60115bf5ea
    name: Suspicious Encoded PowerShell Command Line
    reason: Co-fires when the encoded blob is long or paired with hidden/noprofile switches, raising confidence beyond an admin script.
  - id: 88f680b8-070e-402c-ae11-d2914f2257f1
    name: PowerShell Base64 Encoded IEX Cmdlet
    reason: Decoded payload contains IEX, indicating a download-and-execute stage follows the encoded launch.
  - id: 62b7ccc9-23b4-471e-aa15-6da3663c4d59
    name: PowerShell Base64 Encoded Reflective Assembly Load
    reason: Encoded stagers commonly reflectively load .NET assemblies in memory as the next step.
  - id: c6fb44c6-71f5-49e6-9462-1425d328aee3
    name: Powershell Base64 Encoded MpPreference Cmdlet
    reason: Encoded commands frequently first disable Defender via Set-MpPreference before dropping payloads.
  - id: ee18ed37-0802-4268-9435-b3b91aaa18db
    name: PowerShell - Connect To Internet With Hidden Window
    reason: Encoded hidden PowerShell that reaches out is the typical stager callback.
  - id: 754ed792-634f-40ae-b3bc-e0448d33f695
    name: Suspicious PowerShell Parent Process
    reason: Parent (Office, script engine, WMI, browser) establishes how the encoded command was delivered.
  - id: 692f0bec-83ba-4d04-af7e-e884a96059b6
    name: Potential WMI Lateral Movement WmiPrvSE Spawned PowerShell
    reason: Encoded PowerShell spawned by WmiPrvSE indicates remote WMI execution arriving from another host.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Child processes launched by PowerShell
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*([Pp]ower[Ss]hell|[Pp]wsh).*/ AND data_win_eventdata_image:/.*(cmd|rundll32|regsvr32|mshta|certutil|bitsadmin|whoami|net1?|nltest|schtasks|wmic)\.exe/
    pivot_on: host
    window: 2h
  - name: Outbound connections initiated by PowerShell
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*([Pp]ower[Ss]hell|[Pp]wsh).*/ AND data_win_eventdata_initiated:true
    pivot_on: host
    window: 2h
  - name: Files dropped by PowerShell in staging paths
    query: data_win_system_eventID:11 AND data_win_eventdata_image:/.*([Pp]ower[Ss]hell|[Pp]wsh).*/ AND data_win_eventdata_targetFilename:/.*(\\Temp\\|\\AppData\\|\\ProgramData\\|\\Users\\Public\\).*\.(exe|dll|ps1|bat|vbs|js|hta)/
    pivot_on: host
    window: 4h
  - name: Persistence set by PowerShell (Run keys, tasks)
    query: (data_win_system_eventID:13 AND data_win_eventdata_image:/.*([Pp]ower[Ss]hell|[Pp]wsh).*/ AND data_win_eventdata_targetObject:/.*(CurrentVersion\\Run|Winlogon|Image File Execution).*/) OR (data_win_system_eventID:1 AND data_win_eventdata_image:/.*schtasks\.exe/ AND data_win_eventdata_commandLine:/.*[Cc]reate.*/)
    pivot_on: host
    window: 4h
  - name: Other encoded PowerShell launches by same user
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*([Pp]ower[Ss]hell|[Pp]wsh).*/ AND data_win_eventdata_commandLine:/.*( -[Ee][Nn][Cc]| -[Ee][Cc] | -[Ee]ncodedcommand).*/
    pivot_on: user
    window: 24h
