correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e32d4572-9826-4738-b651-95fa63747e8a
    name: Base64 Encoded PowerShell Command Detected
    reason: Encoded PowerShell wrapper hiding the WMI class calls.
  - id: 21ff4ca9-f13a-41ad-b828-0077b2af2e40
    name: Deletion of Volume Shadow Copies via WMI with PowerShell
    reason: Win32_ShadowCopy deletion via WMI is the ransomware use of the encoded class.
  - id: c1337eb8-921a-4b59-855b-4ba188ddcc42
    name: Deletion of Volume Shadow Copies via WMI with PowerShell - PS Script
    reason: Script block form of the shadow copy deletion exposes decoded WMI calls.
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: Shadow copy deletion via utilities is the parallel destructive step.
  - id: 692f0bec-83ba-4d04-af7e-e884a96059b6
    name: Potential WMI Lateral Movement WmiPrvSE Spawned PowerShell
    reason: WmiPrvSE spawning PowerShell indicates remote WMI execution of this command.
  - id: caf201a9-c2ce-4a26-9c3a-2b9525413711
    name: Potentially Suspicious Call To Win32_NTEventlogFile Class
    reason: Win32_NTEventlogFile calls are WMI-based log tampering seen with the same classes.
  - id: 1444443e-6757-43e4-9ea4-c8fc705f79a2
    name: Boot Configuration Tampering Via Bcdedit.EXE
    reason: Boot config tampering accompanies WMI shadow deletion in ransomware preparation.
  - id: b44f6ac6-0429-11ec-87e9-acde48001122
    name: GetWmiObject User Account with PowerShell
    reason: WMI user account enumeration is the discovery-side use of the same classes.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Shadow copy and backup destruction
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ee][Ll][Ee][Tt][Ee] [Ss][Hh][Aa][Dd][Oo][Ww][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ww][Bb][Aa][Dd][Mm][Ii][Nn] [Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ww][Ii][Nn]32_[Ss][Hh][Aa][Dd][Oo][Ww][Cc][Oo][Pp][Yy].*/ OR data_win_eventdata_commandLine:/.*[Bb][Cc][Dd][Ee][Dd][Ii][Tt].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Ss][Ii][Zz][Ee] [Ss][Hh][Aa][Dd][Oo][Ww][Ss][Tt][Oo][Rr][Aa][Gg][Ee].*/)
    pivot_on:
    - host
    window: 6h
  - name: WMI persistence or remote WMI execution
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ww][Ii][Nn]32_[Pp][Rr][Oo][Cc][Ee][Ss][Ss].*/ OR data_win_eventdata_commandLine:/.*__[Ee][Vv][Ee][Nn][Tt][Ff][Ii][Ll][Tt][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Mm][Aa][Nn][Dd][Ll][Ii][Nn][Ee][Ee][Vv][Ee][Nn][Tt][Cc][Oo][Nn][Ss][Uu][Mm][Ee][Rr].*/)
    pivot_on:
    - host
    window: 6h
  - name: Scheduled job created via WMI or schtasks
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ww][Ii][Nn]32_[Ss][Cc][Hh][Ee][Dd][Uu][Ll][Ee][Dd][Jj][Oo][Bb].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Ww]-[Ss][Cc][Hh][Ee][Dd][Uu][Ll][Ee][Dd][Tt][Aa][Ss][Kk].*/)
    pivot_on:
    - host
    window: 6h
  - name: Process and security product discovery via WMI
