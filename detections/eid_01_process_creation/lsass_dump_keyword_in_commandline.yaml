name: LSASS Dump Keyword In CommandLine
id: ffa6861c-4461-4f59-8a41-578c39f3f23e
version: 1
schema_version: "1.0"
date: "2023-08-29"
author: E.M. Anhaus, Tony Lambert, oscd.community, Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: ffa6861c-4461-4f59-8a41-578c39f3f23e
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the presence of the keywords "lsass" and ".dmp" in the commandline,
  which could indicate a potential attempt to dump or create a dump of the lsass
  process. MITRE ATT&CK: T1003.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*lsass.dmp*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*lsass.zip*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*lsass.rar*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Andrew.dmp*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Coredump.dmp*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*NotLSASS.zip*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*lsass_2*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*lsassdump*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*lsassdmp*"
                    case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*lsass*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*.dmp*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*SQLDmpr*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*.mdmp*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*nanodump*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*.dmp*"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*lsass.dmp*'; data_win_eventdata_commandLine matches '*lsass.zip*';
  data_win_eventdata_commandLine matches '*lsass.rar*', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/Hackndo/lsassy
  - https://medium.com/@markmotig/some-ways-to-dump-lsass-exe-c4a75fdc49bf
  - https://github.com/elastic/detection-rules/blob/c76a39796972ecde44cb1da6df47f1b6562c9770/rules/windows/credential_access_lsass_memdump_file_created.toml
  - https://www.whiteoaksecurity.com/blog/attacks-defenses-dumping-lsass-no-mimikatz/
  - https://github.com/helpsystems/nanodump
  - https://github.com/CCob/MirrorDump
  - https://attack.mitre.org/techniques/T1003/001/

response:
  message: >
    LSASS Dump Keyword In CommandLine detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1003.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.001
  custom_tags:
    - lsass
    - keyword
    - process_creation
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Ss][Ss]\.[Dd][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Ss][Ss]\.[Zz][Ii][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Ss][Ss]\.[Rr][Aa][Rr].*/ OR data_win_eventdata_commandLine:/.*[Aa][Nn][Dd][Rr][Ee][Ww]\.[Dd][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Rr][Ee][Dd][Uu][Mm][Pp]\.[Dd][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Nn][Oo][Tt][Ll][Ss][Aa][Ss][Ss]\.[Zz][Ii][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Ss][Ss]_2.*/ OR data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Ss][Ss][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Ss][Ss][Dd][Mm][Pp].*/ OR (data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Ss][Ss].*/ AND data_win_eventdata_commandLine:/.*\.[Dd][Mm][Pp].*/) OR (data_win_eventdata_commandLine:/.*[Ss][Qq][Ll][Dd][Mm][Pp][Rr].*/ AND data_win_eventdata_commandLine:/.*\.[Mm][Dd][Mm][Pp].*/) OR (data_win_eventdata_commandLine:/.*[Nn][Aa][Nn][Oo][Dd][Uu][Mm][Pp].*/ AND data_win_eventdata_commandLine:/.*\.[Dd][Mm][Pp].*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: Most common LOLBIN method that writes an lsass.dmp named in the command line.
  - id: 5afee48e-67dd-4e03-a783-f74259dcf998
    name: Potential LSASS Process Dump Via Procdump
    reason: Procdump with -ma lsass is the other usual source of the keyword.
  - id: 9bd012ee-0dff-44d7-84a0-aa698cfd87a3
    name: LSASS Memory Access by Tool With Dump Keyword In Name
    reason: Process-access view of the same dump tool touching LSASS.
  - id: 5ef9853e-4d0e-4a70-846f-a9ca37d876da
    name: Potential Credential Dumping Activity Via LSASS
    reason: Generic LSASS access that confirms the dump actually read memory.
  - id: a18dd26b-6450-46de-8c91-9659150cf088
    name: Potentially Suspicious GrantedAccess Flags On LSASS
    reason: Access mask used by dump tools, corroborates a successful handle.
  - id: a5a2d357-1ab8-4675-a967-ef9990a59391
    name: LSASS Process Memory Dump Files
    reason: File-creation evidence that the dump landed on disk.
  - id: c8da0dfd-4ed0-4b68-962d-13c9c884384e
    name: Potential Credential Dumping Via LSASS Process Clone
    reason: Snapshot-clone variant that also names dump files.
  - id: 69ca12af-119d-44ed-b50f-a47af0ebc364
    name: LSASS Process Memory Dump Creation Via Taskmgr.EXE
    reason: GUI route to the same dump artefact.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Access to LSASS memory
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss].[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Dump files written to disk
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.([Dd][Mm][Pp]|[Mm][Dd][Mm][Pp])/
    pivot_on: host
    window: 2h
  - name: Dump compressed or staged for exfiltration
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*.[Dd][Mm][Pp].*/) AND (data_win_eventdata_commandLine:/.*7[Zz].*/ OR data_win_eventdata_commandLine:/.*[Rr][Aa][Rr].*/ OR data_win_eventdata_commandLine:/.*[Tt][Aa][Rr].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]-[Aa][Rr][Cc][Hh][Ii][Vv][Ee].*/ OR data_win_eventdata_commandLine:/.*[Cc][Uu][Rr][Ll].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ff][Tt][Pp].*/ OR data_win_eventdata_commandLine:/.*[Rr][Cc][Ll][Oo][Nn][Ee].*/ OR data_win_eventdata_commandLine:/.*[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll].*/ OR data_win_eventdata_commandLine:/.*[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn].*/)
    pivot_on: host
    window: 4h
  - name: Credential-dump tools and techniques
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss].[Dd][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Nn][Aa][Nn][Oo][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ss][Qq][Ll][Dd][Uu][Mm][Pp][Ee][Rr].*/)
    pivot_on: host
    window: 4h
  - name: Network logons after the dump
    query: data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"9")
    pivot_on: user
    window: 24h
