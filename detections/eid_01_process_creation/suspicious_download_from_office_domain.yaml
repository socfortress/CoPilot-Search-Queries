name: Suspicious Download from Office Domain
id: 00d49ed5-4491-4271-a8db-650a4ef6f8c1
version: 1
schema_version: "1.0"
date: "2022-08-02"
author: Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 00d49ed5-4491-4271-a8db-650a4ef6f8c1
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious ways to download files from Microsoft domains that are used
  to store attachments in Emails or OneNote documents. MITRE ATT&CK: T1105,
  T1608.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\curl.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\wget.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Invoke-WebRequest*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*iwr *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*curl *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*wget *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Start-BitsTransfer*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.DownloadFile(*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.DownloadString(*"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*https://attachment.outlook.live.net/owa/*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*https://onenoteonlinesync.onenote.com/onenoteonlinesync/*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\curl.exe'; data_win_eventdata_image matches '*\wget.exe';
  data_win_eventdata_commandLine matches '*Invoke-WebRequest*', among other
  conditions.

known_false_positives: >
  Scripts or tools that download attachments from these domains (OneNote,
  Outlook 365). Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/an0n_r0/status/1474698356635193346?s=12
  - https://twitter.com/mrd0x/status/1475085452784844803?s=12
  - https://attack.mitre.org/techniques/T1105/
  - https://attack.mitre.org/techniques/T1608/

response:
  message: >
    Suspicious Download from Office Domain detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1105, T1608
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1105
    - T1608
  custom_tags:
    - download
    - office
    - domain
    - process_creation
    - sysmon
    - command_and_control
    - resource_development
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Gg][Ee][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ii][Ww][Rr] .*/ OR data_win_eventdata_commandLine:/.*[Cc][Uu][Rr][Ll] .*/ OR data_win_eventdata_commandLine:/.*[Ww][Gg][Ee][Tt] .*/ OR data_win_eventdata_commandLine:/.*[Ss][Tt][Aa][Rr][Tt]-[Bb][Ii][Tt][Ss][Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*\.[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee]\(.*/ OR data_win_eventdata_commandLine:/.*\.[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg]\(.*/) AND (data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp][Ss]:\/\/[Aa][Tt][Tt][Aa][Cc][Hh][Mm][Ee][Nn][Tt]\.[Oo][Uu][Tt][Ll][Oo][Oo][Kk]\.[Ll][Ii][Vv][Ee]\.[Nn][Ee][Tt]\/[Oo][Ww][Aa]\/.*/ OR data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp][Ss]:\/\/[Oo][Nn][Ee][Nn][Oo][Tt][Ee][Oo][Nn][Ll][Ii][Nn][Ee][Ss][Yy][Nn][Cc]\.[Oo][Nn][Ee][Nn][Oo][Tt][Ee]\.[Cc][Oo][Mm]\/[Oo][Nn][Ee][Nn][Oo][Tt][Ee][Oo][Nn][Ll][Ii][Nn][Ee][Ss][Yy][Nn][Cc]\/.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 84b1706c-932a-44c4-ae28-892b28a25b94
    name: OneNote.EXE Execution of Malicious Embedded Scripts
    reason: OneNote lure is the usual origin of downloads from onenote sync/attachment domains
  - id: 7fd164ba-126a-4d9c-9392-0d4f7c243df0
    name: OneNote Attachment File Dropped In Suspicious Location
    reason: Embedded attachment dropped by the OneNote lure that triggers this download
  - id: 21dd6d38-2b18-4453-9404-a0fe4a0cc288
    name: Curl Download And Execute Combination
    reason: Curl download chained with execution, the follow-on when the attachment is a payload
  - id: b6e04788-29e1-4557-bb14-77f761848ab8
    name: Potentially Suspicious File Download From File Sharing Domain Via PowerShell.EXE
    reason: Same PowerShell download method against other hosting
  - id: c09dad97-1c78-4f71-b127-7edb2b8e491a
    name: Execution of Suspicious File Type Extension
    reason: Downloaded attachment executed with a risky extension
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Executables, scripts, shortcuts or OneNote files written to staging or Downloads
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Pp][Ss]1|[Bb][Aa][Tt]|[Vv][Bb][Ss]|[Jj][Ss]|[Ll][Nn][Kk]|[Hh][Tt][Aa]|[Oo][Nn][Ee])/ AND data_win_eventdata_targetFilename:/.*\\([Tt]emp|[Pp]ublic|[Dd]ownloads|[Aa]pp[Dd]ata)\\.*/
    pivot_on:
    - host
    - user
    window: 1h
  - name: Execution from staging paths launched by a shell or script host
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\([Pp]ower[Ss]hell|[Cc]md|[Ww]script|[Cc]script|[Mm]shta)\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Tt]emp|[Pp]ublic|[Pp]rogram[Dd]ata|[Aa]pp[Dd]ata)\\.*\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Script engines or LOLBins spawned by Office/OneNote
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\([Oo][Nn][Ee][Nn][Oo][Tt][Ee]|[Ww][Ii][Nn][Ww][Oo][Rr][Dd]|[Ee][Xx][Cc][Ee][Ll]|[Oo][Uu][Tt][Ll][Oo][Oo][Kk]|[Pp][Oo][Ww][Ee][Rr][Pp][Nn][Tt])\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Pp]ower[Ss]hell|[Cc]md|[Ww]script|[Cc]script|[Mm]shta|[Cc]url|[Cc]ertutil)\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    - user
    window: 2h
  - name: DNS lookups by download tools
    query: data_win_system_eventID:"22" AND data_win_eventdata_image:/.*\\([Bb]itsadmin|[Cc]ertutil|[Cc]url|[Pp]ower[Ss]hell)\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: Persistence via Run key or scheduled task
    query: (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*\\[Cc]urrent[Vv]ersion\\[Rr]un.*/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Gg] [Aa][Dd][Dd].*\\[Rr][Uu][Nn].*/))
    pivot_on:
    - host
    window: 4h
