name: RestrictedAdminMode Registry Value Tampering - ProcCreation
id: 28ac00d6-22d9-4a3c-927f-bbd770104573
version: 1
schema_version: "1.0"
date: "2025-08-28"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 28ac00d6-22d9-4a3c-927f-bbd770104573
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects changes to the "DisableRestrictedAdmin" registry value in order to
  disable or enable RestrictedAdmin mode. RestrictedAdmin mode prevents the
  transmission of reusable credentials to the remote system to which you connect
  using Remote Desktop. This prevents your credentials from being harvested
  during the initial connection process if the remote server has been
  compromise. MITRE ATT&CK: T1112.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*\\\\System\\\\CurrentControlSet\\\\Control\\\\Lsa*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*DisableRestrictedAdmin*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*\System\CurrentControlSet\Control\Lsa*'; data_win_eventdata_commandLine
  matches '*DisableRestrictedAdmin*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/a8e3cf63e97b973a25903d3df9fd55da6252e564/atomics/T1112/T1112.md
  - https://social.technet.microsoft.com/wiki/contents/articles/32905.remote-desktop-services-enable-restricted-admin-mode.aspx
  - https://thedfirreport.com/2022/05/09/seo-poisoning-a-gootloader-story/
  - https://attack.mitre.org/techniques/T1112/

response:
  message: >
    RestrictedAdminMode Registry Value Tampering - ProcCreation detected on host
    $agent_name$. Matched data_win_eventdata_commandLine:
    $data_win_eventdata_commandLine$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1112
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
  custom_tags:
    - restrictedadminmode
    - registry
    - value
    - process_creation
    - sysmon
    - persistence
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*\\[Ss][Yy][Ss][Tt][Ee][Mm]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt]\\[Cc][Oo][Nn][Tt][Rr][Oo][Ll]\\[Ll][Ss][Aa].*/ AND data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Ss][Tt][Rr][Ii][Cc][Tt][Ee][Dd][Aa][Dd][Mm][Ii][Nn].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 0d5675be-bc88-4172-86d3-1e96a4476536
    name: Potential Tampering With RDP Related Registry Keys Via Reg.EXE
    reason: Tampering with other RDP registry keys via reg.exe, same preparation for RDP movement
  - id: 954f0af7-62dd-418f-b3df-a84bc2c7a774
    name: New Remote Desktop Connection Initiated Via Mstsc.EXE
    reason: New mstsc connection; RestrictedAdmin enables pass-the-hash RDP just before it
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: Mimikatz sekurlsa::pth supplies the hash used with RestrictedAdmin RDP
  - id: 8c0eca51-0f88-4db2-9183-fdfb10c703f9
    name: LSA PPL Protection Setting Modification via CommandLine
    reason: LSA protection modification, adjacent credential-protection weakening
  - id: 01aeb693-138d-49d2-9403-c4f52d7d3d62
    name: RDP Connection Allowed Via Netsh.EXE
    reason: Netsh opening RDP in firewall, companion step for enabling RDP
  - id: 4b8f6d3a-9c5e-4f2a-a7d8-6b9c3e5f2a8d
    name: RDP Enable or Disable via Win32_TerminalServiceSetting WMI Class
    reason: Enabling RDP via WMI, alternate RDP enablement
  - id: ea011323-7045-460b-b2d7-0f7442ea6b38
    name: Potential PsExec Remote Execution
    reason: PsExec remote execution is a typical way to push the registry change remotely
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: RDP-related registry and firewall changes
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*fDenyTSConnections.*/ OR /.*[Tt]erminal[ ]+[Ss]erver.*/ OR /.*portproxy.*/ OR /.*[Rr]emote[ ]+[Dd]esktop.*/)
    pivot_on: host
    window: 6h
  - name: Lsa and WDigest registry value changes
    query: data_win_system_eventID:(12 OR 13) AND data_win_eventdata_targetObject:(/.*\\Control\\Lsa\\.*/ OR /.*WDigest.*UseLogonCredential.*/)
    pivot_on: host
    window: 6h
  - name: Pass-the-hash and credential tooling
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*sekurlsa.*/ OR /.*[Mm]imikatz.*/ OR /.*[Ll]sass.*[Dd]ump.*/)
    pivot_on: host
    window: 6h
  - name: Outbound RDP connections
    query: data_win_system_eventID:3 AND data_win_eventdata_destinationPort:3389 AND data_win_eventdata_initiated:true
    pivot_on: host
    window: 6h
  - name: Remote interactive and network logons
    query: data_win_system_eventID:4624 AND data_win_eventdata_logonType:(10 OR 3 OR 9)
    pivot_on: user
    window: 6h
