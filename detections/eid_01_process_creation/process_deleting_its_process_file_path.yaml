name: Windows Process Deleting Its Process File Path
id: windows-process-deleting-its-process-file-path-001
version: 1
schema_version: "1.0"
date: "2026-02-16"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects cmd.exe executing a delete command via /c flag, a behavior associated 
  with malware self-deletion for defense evasion. Used by Clop ransomware, 
  WhisperGate, and Remcos RAT to remove their executable after execution to 
  avoid forensic analysis.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - wildcard:
            data_win_eventdata_image: "*\\\\cmd.exe"
        - wildcard:
            data_win_eventdata_commandLine: "*/c *del*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_parentCommandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-16 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-16 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Windows endpoints with Sysmon 
  installed and configured to log process creation events (EventID 1) with full 
  command-line arguments. Analysts should review the parent process and the file 
  being deleted to determine if the process is deleting its own executable.

known_false_positives: >
  Some legitimate installers or update processes may use cmd.exe /c del to clean 
  up temporary files. Filter based on parent process image and the specific file 
  being deleted. Focus on cases where the deleted file matches the parent process 
  executable path.

references:
  - https://attack.mitre.org/techniques/T1070/
  - https://www.mandiant.com/resources/fin11-email-campaigns-precursor-for-ransomware-data-theft
  - https://www.microsoft.com/security/blog/2022/01/15/destructive-malware-targeting-ukrainian-organizations/

response:
  message: >
    Process self-deletion detected on $agent_name$. 
    Command: $data_win_eventdata_commandLine$. 
    Parent: $data_win_eventdata_parentImage$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1070
  risk_score: 50
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects: []

tags:
  analytic_story:
    - Clop Ransomware
    - Data Destruction
    - WhisperGate
    - Remcos
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1070
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*cmd\.exe/ AND data_win_eventdata_commandLine:/.*\/c .*del.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 204b17ae-4007-471b-917b-b917b315c5db
    name: Greedy File Deletion Using Del
    reason: Greedy del usage is the same delete-via-cmd tradecraft used for wiping dropped payloads and cleanup.
  - id: 4b046706-5789-4673-b111-66f25fe99534
    name: Deleted Data Overwritten Via Cipher.EXE
    reason: Cipher /w overwriting deleted data hardens the self-delete against recovery of the removed binary.
  - id: a4824fca-976f-4964-b334-0621379e84c4
    name: Potential File Overwrite Via Sysinternals SDelete
    reason: SDelete overwrite is an anti-forensic follow-on that completes removal of the dropped executable.
  - id: 74db3488-fd28-480a-95aa-b7af626de068
    name: LockerGoga Ransomware Activity
    reason: LockerGoga-style ransomware drops, runs and deletes its own binary, matching this behaviour.
  - id: 69bd9b97-2be2-41b6-9816-fb08757a4d1a
    name: Potentially Suspicious Execution From Parent Process In Public Folder
    reason: Execution from a Public folder parent is a typical drop location for payloads later self-deleted.
  - id: a6a39bdb-935c-4f0a-ab77-35f4bbf44d33
    name: Potentially Suspicious Powershell Script Execution From Temp Folder
    reason: Temp-folder PowerShell staging precedes the dropped payload that deletes itself.
  - id: 3dfd06d2-eaf4-4532-9555-68aca59f57c4
    name: Process Execution From A Potentially Suspicious Folder
    reason: Execution from an uncommon folder identifies the payload that is then removed by cmd /c del.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Self-delete with ping or timeout delay trick
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Pp][Ii][Nn][Gg] 127\.0\.0\.1.*/ OR data_win_eventdata_commandLine:/.*[Pp][Ii][Nn][Gg] -[Nn].*/ OR data_win_eventdata_commandLine:/.*[Tt][Ii][Mm][Ee][Oo][Uu][Tt] \/[Tt].*/ OR data_win_eventdata_commandLine:/.*[Cc][Hh][Oo][Ii][Cc][Ee] \/[Cc].*/) AND (data_win_eventdata_commandLine:/.*[Dd][Ee][Ll] .*/ OR data_win_eventdata_commandLine:/.*[Ee][Rr][Aa][Ss][Ee] .*/)
    pivot_on: host
    window: 1h
  - name: Executables created in user-writable staging folders
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss]\\.*/) AND data_win_eventdata_targetFilename:/.*\.(exe|dll|scr|bat)/
    pivot_on: host
    window: 2h
  - name: Process execution from user-writable staging folders
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/)
    pivot_on: host
    window: 2h
  - name: Outbound connections from processes in staging folders
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/)
    pivot_on: host
    window: 2h
  - name: Log clearing and shadow copy deletion anti-forensics
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll] [Cc][Ll].*/ OR data_win_eventdata_commandLine:/.*[Cc][Ll][Ee][Aa][Rr]-[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg].*/ OR data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn] [Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ww][Bb][Aa][Dd][Mm][Ii][Nn] [Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Bb][Cc][Dd][Ee][Dd][Ii][Tt].*/)
    pivot_on: host
    window: 4h
