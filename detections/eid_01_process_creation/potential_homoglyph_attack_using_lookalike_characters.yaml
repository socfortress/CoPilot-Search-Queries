correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 584bca0f-3608-4402-80fd-4075ff6072e3
    name: Potential CommandLine Obfuscation Using Unicode Characters From Suspicious Image
    reason: Same family of Unicode command-line obfuscation; confirms deliberate evasion by a script host.
  - id: 22ac27b4-7189-4a4f-9375-b9017c9620d7
    name: Detect RTLO In Process
    reason: RTLO is the other Unicode masquerade trick for disguising names; often paired with homoglyphs.
  - id: ad691d92-15f2-4181-9aa4-723c74f9ddc3
    name: Potential Defense Evasion Via Right-to-Left Override
    reason: Same deception goal via bidi characters in the command line.
  - id: 1cdd9a09-06c9-4769-99ff-626e2b3991b8
    name: Suspicious Double Extension File Execution
    reason: Lure-file masquerading commonly combined with lookalike names to trick users.
  - id: e4a6b256-3e47-40fc-89d2-7a477edd6915
    name: System File Execution Location Anomaly
    reason: A homoglyph process mimicking a system binary will usually also run from the wrong location.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Processes launched by lookalike-named parent
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentCommandLine:/.*[Ѐ-ӿͰ-Ͽ].*/
    pivot_on: host
    window: 4h
  - name: Files created with non-ASCII lookalike names
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Ѐ-ӿͰ-Ͽ].*/
    pivot_on: host
    window: 4h
  - name: Network connections from non-ASCII named binaries
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Ѐ-ӿͰ-Ͽ].*/
    pivot_on: host
    window: 4h
  - name: LOLBin activity carrying lookalike characters
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\(powershell|cmd|mshta|wscript|cscript|rundll32|regsvr32)\.exe/ AND data_win_eventdata_commandLine:/.*[Ѐ-ӿͰ-Ͽ].*/
    pivot_on: host
    window: 2h
