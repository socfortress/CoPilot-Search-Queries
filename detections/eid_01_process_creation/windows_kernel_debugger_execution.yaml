name: Windows Kernel Debugger Execution
id: 27ee9438-90dc-4bef-904b-d3ef927f5e7e
version: 1
schema_version: "1.0"
date: "2024-04-24"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 27ee9438-90dc-4bef-904b-d3ef927f5e7e
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of the Windows Kernel Debugger "kd.exe".

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\kd.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "kd.exe"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches '*\kd.exe';
  data_win_eventdata_originalFileName equals 'kd.exe'.

known_false_positives: >
  Rare occasions of legitimate cases where kernel debugging is necessary in
  production. Investigation is required. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - Internal Research

response:
  message: >
    Windows Kernel Debugger Execution detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  custom_tags:
    - kernel
    - debugger
    - process_creation
    - sysmon
    - privilege_escalation
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Kk][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Kk][Dd]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: windows-debugger-tool-execution-001
    name: Windows Debugger Tool Execution
    reason: Sibling detection for other debugger binaries; shows whether additional debugging tools were run.
  - id: c7746f1c-47d3-43d6-8c45-cd1e54b6b0a2
    name: Kernel Memory Dump Via LiveKD
    reason: kd.exe is commonly used with LiveKD for live kernel dumps of the same host.
  - id: a85f7765-698a-4088-afa0-ecfbf8d01fa4
    name: Potential Memory Dumping Activity Via LiveKD
    reason: Kernel memory acquisition alongside kd.exe indicates credential or secret extraction.
  - id: b5c7395f-e501-4a08-94d4-57fe7a9da9d2
    name: Potential Binary Proxy Execution Via Cdb.EXE
    reason: cdb.exe is the user-mode sibling of kd.exe used to proxy-execute code.
  - id: 0b4ae027-2a2d-4b93-8c7e-962caaba5b2a
    name: Time Travel Debugging Utility Usage
    reason: WinDbg TTD tools from the same package can capture process memory including secrets.
  - id: 1444443e-6757-43e4-9ea4-c8fc705f79a2
    name: Boot Configuration Tampering Via Bcdedit.EXE
    reason: Kernel debugging needs bcdedit /debug; enabling it alongside kd.exe shows deliberate setup.
  - id: 431a1fdb-4799-4f3b-91c3-a683b003fc49
    name: New Kernel Driver Via SC.EXE
    reason: Kernel-level tooling is often preceded by loading a driver to gain kernel access.
  - id: e76ca062-4de0-4d79-8d90-160a0d335eca
    name: PUA - Kernel Driver Utility (KDU) Execution
    reason: Kernel manipulation via vulnerable drivers (BYOVD) is an attacker alternative to kd.exe.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Debugger toolchain executions
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*[Kk][Dd]\.exe/ OR data_win_eventdata_image:/.*[Ww]in[Dd]bg.*/ OR data_win_eventdata_image:/.*[Cc][Dd][Bb]\.exe/ OR data_win_eventdata_image:/.*[Nn][Tt][Ss][Dd]\.exe/ OR data_win_eventdata_image:/.*[Ll]ive[Kk][Dd].*/)
    pivot_on: host
    window: 4h
  - name: bcdedit debug / test-signing changes
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Bb]cdedit.*/ AND (data_win_eventdata_commandLine:/.*[Dd]ebug.*/ OR data_win_eventdata_commandLine:/.*[Tt]estsigning.*/)
    pivot_on: host
    window: 6h
  - name: Driver loads and service creation
    query: data_win_system_eventID:6 OR data_win_system_eventID:7045 OR (data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Ss]c\.exe/ AND data_win_eventdata_commandLine:/.*[Kk]ernel.*/)
    pivot_on: host
    window: 6h
  - name: Dump files created
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\.[Dd][Mm][Pp]/
    pivot_on: host
    window: 4h
  - name: LSASS process access
    query: data_win_system_eventID:10 AND data_win_eventdata_targetImage:/.*[Ll]sass\.exe/
    pivot_on: host
    window: 4h
