name: HackTool - winPEAS Execution
id: 98b53e78-ebaf-46f8-be06-421aafd176d9
version: 1
schema_version: "1.0"
date: "2023-03-23"
author: Georg Lauenstein (sure[secure])
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 98b53e78-ebaf-46f8-be06-421aafd176d9
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  WinPEAS is a script that search for possible paths to escalate privileges on
  Windows hosts. The checks are explained on book.hacktricks.xyz. MITRE ATT&CK:
  T1082, T1087, T1046.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - term:
                  data_win_eventdata_originalFileName:
                    value: "winPEAS.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\winPEASany_ofs.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\winPEASany.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\winPEASx64_ofs.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\winPEASx64.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\winPEASx86_ofs.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\winPEASx86.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* applicationsinfo*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* browserinfo*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* eventsinfo*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* fileanalysis*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* filesinfo*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* processinfo*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* servicesinfo*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* windowscreds*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*https://github.com/carlospolop/PEASS-ng/releases/latest/download/*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentCommandLine:
                    value: "* -linpeas"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -linpeas"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_originalFileName
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentCommandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_originalFileName equals
  'winPEAS.exe'; data_win_eventdata_image matches '*\winPEASany_ofs.exe';
  data_win_eventdata_image matches '*\winPEASany.exe', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/carlospolop/PEASS-ng
  - https://book.hacktricks.xyz/windows-hardening/windows-local-privilege-escalation
  - https://attack.mitre.org/techniques/T1082/
  - https://attack.mitre.org/techniques/T1087/
  - https://attack.mitre.org/techniques/T1046/

response:
  message: >
    HackTool - winPEAS Execution detected on host $agent_name$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1082, T1087, T1046
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_originalFileName
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1082
    - T1087
    - T1046
  custom_tags:
    - hacktool
    - winpeas
    - process_creation
    - sysmon
    - privilege_escalation
    - discovery
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_originalFileName:/[Ww][Ii][Nn][Pp][Ee][Aa][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Pp][Ee][Aa][Ss][Aa][Nn][Yy]_[Oo][Ff][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Pp][Ee][Aa][Ss][Aa][Nn][Yy]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Pp][Ee][Aa][Ss][Xx]64_[Oo][Ff][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Pp][Ee][Aa][Ss][Xx]64\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Pp][Ee][Aa][Ss][Xx]86_[Oo][Ff][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Pp][Ee][Aa][Ss][Xx]86\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.* [Aa][Pp][Pp][Ll][Ii][Cc][Aa][Tt][Ii][Oo][Nn][Ss][Ii][Nn][Ff][Oo].*/ OR data_win_eventdata_commandLine:/.* [Bb][Rr][Oo][Ww][Ss][Ee][Rr][Ii][Nn][Ff][Oo].*/ OR data_win_eventdata_commandLine:/.* [Ee][Vv][Ee][Nn][Tt][Ss][Ii][Nn][Ff][Oo].*/ OR data_win_eventdata_commandLine:/.* [Ff][Ii][Ll][Ee][Aa][Nn][Aa][Ll][Yy][Ss][Ii][Ss].*/ OR data_win_eventdata_commandLine:/.* [Ff][Ii][Ll][Ee][Ss][Ii][Nn][Ff][Oo].*/ OR data_win_eventdata_commandLine:/.* [Pp][Rr][Oo][Cc][Ee][Ss][Ss][Ii][Nn][Ff][Oo].*/ OR data_win_eventdata_commandLine:/.* [Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss][Ii][Nn][Ff][Oo].*/ OR data_win_eventdata_commandLine:/.* [Ww][Ii][Nn][Dd][Oo][Ww][Ss][Cc][Rr][Ee][Dd][Ss].*/ OR data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp][Ss]:\/\/[Gg][Ii][Tt][Hh][Uu][Bb]\.[Cc][Oo][Mm]\/[Cc][Aa][Rr][Ll][Oo][Ss][Pp][Oo][Ll][Oo][Pp]\/[Pp][Ee][Aa][Ss][Ss]-[Nn][Gg]\/[Rr][Ee][Ll][Ee][Aa][Ss][Ee][Ss]\/[Ll][Aa][Tt][Ee][Ss][Tt]\/[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd]\/.*/ OR data_win_eventdata_parentCommandLine:/.* -[Ll][Ii][Nn][Pp][Ee][Aa][Ss]/ OR data_win_eventdata_commandLine:/.* -[Ll][Ii][Nn][Pp][Ee][Aa][Ss]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c248c896-e412-4279-8c15-1c558067b6fa
    name: Enumerate All Information With Whoami.EXE
    reason: whoami /all is a core privilege-enumeration step run alongside winPEAS
  - id: bd8b828d-0dca-48e1-8a63-8a58ecf2644f
    name: Group Membership Reconnaissance Via Whoami.EXE
    reason: Group membership recon via whoami accompanies privilege-escalation enumeration
  - id: e6313acd-208c-44fc-a0ff-db85d572e90e
    name: Network Reconnaissance Activity
    reason: winPEAS network checks overlap with manual network recon commands
  - id: 87a476dc-0079-4583-a985-dee7a20a03de
    name: Enumeration for 3rd Party Creds From CLI
    reason: winPEAS searches for third-party stored credentials; the same hunt done by hand
  - id: e0b0c2ab-3d52-46d9-8cb7-049dc775fbd1
    name: Enumeration for Credentials in Registry
    reason: Registry credential hunting is part of winPEAS checks
  - id: 91a2c315-9ee6-4052-a853-6f6a8238f90d
    name: Findstr GPP Passwords
    reason: Hunting GPP passwords in SYSVOL is a typical follow-up privesc check
  - id: 47e4bab7-c626-47dc-967b-255608c9a920
    name: Permission Misconfiguration Reconnaissance Via Findstr.EXE
    reason: Permission misconfiguration recon via findstr is manual privesc discovery
  - id: 07f8bdc2-c9b3-472a-9817-5a670b872f53
    name: Potential Reconnaissance For Cached Credentials Via Cmdkey.EXE
    reason: Cached credential listing via cmdkey is another winPEAS-equivalent check
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Local privilege enumeration commands
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ww][Hh][Oo][Aa][Mm][Ii] /[Pp][Rr][Ii][Vv].*/ OR /.*[Ww][Hh][Oo][Aa][Mm][Ii] /[Aa][Ll][Ll].*/ OR /.*[Nn][Ee][Tt] [Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp].*/ OR /.*[Ss][Yy][Ss][Tt][Ee][Mm][Ii][Nn][Ff][Oo].*/)
    pivot_on: host
    window: 2h
  - name: Credential hunting in registry and files
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Rr][Ee][Gg] [Qq][Uu][Ee][Rr][Yy].*/ OR /.*[Cc][Mm][Dd][Kk][Ee][Yy] /[Ll][Ii][Ss][Tt].*/ OR /.*[Ff][Ii][Nn][Dd][Ss][Tt][Rr] /[Ss][Ii] [Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd].*/ OR /.*[Uu][Nn][Aa][Tt][Tt][Ee][Nn][Dd]\.[Xx][Mm][Ll].*/)
    pivot_on: host
    window: 4h
  - name: Service and scheduled task weakness checks
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ss][Cc] [Qq][Cc].*/ OR /.*[Ii][Cc][Aa][Cc][Ll][Ss].*/ OR /.*[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss] /[Qq][Uu][Ee][Rr][Yy].*/ OR /.*[Aa][Cc][Cc][Ee][Ss][Ss][Cc][Hh][Kk].*/)
    pivot_on: host
    window: 2h
  - name: Privilege escalation tooling or token abuse
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Pp][Oo][Tt][Aa][Tt][Oo].*/ OR /.*[Pp][Rr][Ii][Nn][Tt][Ss][Pp][Oo][Oo][Ff][Ee][Rr].*/ OR /.*[Jj][Uu][Ii][Cc][Yy].*/ OR /.*[Uu][Aa][Cc][Mm][Ee].*/)
    pivot_on: host
    window: 6h
  - name: PEAS tool file written to disk
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*[Pp][Ee][Aa][Ss].*/
    pivot_on: host
    window: 2h
