name: Suspicious Driver/DLL Installation Via Odbcconf.EXE
id: cb0fe7c5-f3a3-484d-aa25-d350a7912729
version: 1
schema_version: "1.0"
date: "2023-05-23"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: cb0fe7c5-f3a3-484d-aa25-d350a7912729
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of "odbcconf" with the "INSTALLDRIVER" action where the
  driver doesn't contain a ".dll" extension. This is often used as a defense
  evasion method. MITRE ATT&CK: T1218.008.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\odbcconf.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "odbcconf.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*INSTALLDRIVER *"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_commandLine"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.dll*"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\odbcconf.exe'; data_win_eventdata_originalFileName equals 'odbcconf.exe';
  data_win_eventdata_commandLine matches '*INSTALLDRIVER *', among other
  conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://lolbas-project.github.io/lolbas/Binaries/Odbcconf/
  - https://web.archive.org/web/20191023232753/https://twitter.com/Hexacorn/status/1187143326673330176
  - https://www.hexacorn.com/blog/2020/08/23/odbcconf-lolbin-trifecta/
  - https://attack.mitre.org/techniques/T1218/008/

response:
  message: >
    Suspicious Driver/DLL Installation Via Odbcconf.EXE detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1218.008
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218.008
  custom_tags:
    - driver
    - installation
    - odbcconf
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Oo][Dd][Bb][Cc][Cc][Oo][Nn][Ff]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Oo][Dd][Bb][Cc][Cc][Oo][Nn][Ff]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Dd][Rr][Ii][Vv][Ee][Rr] .*/ AND _exists_:data_win_eventdata_commandLine AND NOT (data_win_eventdata_commandLine:/.*\.[Dd][Ll][Ll].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 3f5491e2-8db8-496b-9e95-1029fce852d4
    name: Driver/DLL Installation Via Odbcconf.EXE
    reason: Broader odbcconf INSTALLDRIVER coverage; same abuse with a dll-named driver
  - id: 9f0a8bf3-a65b-440a-8c1e-5cb1547c8e70
    name: New DLL Registered Via Odbcconf.EXE
    reason: REGSVR action on odbcconf, the sibling proxy-execution form
  - id: ba4cfc11-d0fa-4d94-bf20-7c332c412e76
    name: Potentially Suspicious DLL Registered Via Odbcconf.EXE
    reason: Odbcconf loading a DLL with unusual extension or path
  - id: 6b65c28e-11f3-46cb-902a-68f2cafaf474
    name: Odbcconf.EXE Suspicious DLL Location
    reason: Payload DLL staged in a user-writable path before odbcconf loads it
  - id: windows-dll-loaded-temp-dir-001
    name: Windows DLL Module Loaded in Temp Dir
    reason: The payload DLL being loaded into a process from Temp
  - id: 74babdd6-a758-4549-9632-26535279e654
    name: Suspicious Executable File Creation
    reason: Payload file creation preceding the odbcconf call
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other odbcconf invocations (any action)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Oo][Dd][Bb][Cc][Cc][Oo][Nn][Ff]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Oo][Dd][Bb][Cc][Cc][Oo][Nn][Ff]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 4h
  - name: DLL or driver-like file created in staging paths (payload placement)
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\([Tt]emp|[Pp]ublic|[Pp]rogram[Dd]ata|[Aa]pp[Dd]ata)\\.*\.([Dd][Ll][Ll]|[Dd][Rr][Vv]|[Oo][Cc][Xx]|[Tt][Mm][Pp]|[Dd][Aa][Tt])/
    pivot_on:
    - host
    window: 1h
  - name: DLL loaded from staging paths by odbcconf, rundll32 or regsvr32
    query: data_win_system_eventID:"7" AND data_win_eventdata_imageLoaded:/.*\\([Tt]emp|[Pp]ublic|[Pp]rogram[Dd]ata|[Aa]pp[Dd]ata)\\.*/ AND data_win_eventdata_image:/.*\\([Oo]dbcconf|[Rr]undll32|[Rr]egsvr32)\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: Child processes spawned by odbcconf
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Oo][Dd][Bb][Cc][Cc][Oo][Nn][Ff]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: Outbound connections initiated by odbcconf
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\[Oo][Dd][Bb][Cc][Cc][Oo][Nn][Ff]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
