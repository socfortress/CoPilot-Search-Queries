name: Pingback Backdoor Activity
id: b2400ffb-7680-47c0-b08a-098a7de7e7a9
version: 1
schema_version: "1.0"
date: "2023-02-17"
author: Bhabesh Raj
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: b2400ffb-7680-47c0-b08a-098a7de7e7a9
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the use of Pingback backdoor that creates ICMP tunnel for C2 as
  described in the trustwave report. MITRE ATT&CK: T1574.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_parentImage:
              value: "*\\\\updata.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*config*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*msdtc*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*start*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*auto*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\updata.exe'; data_win_eventdata_commandLine matches '*config*';
  data_win_eventdata_commandLine matches '*msdtc*', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.trustwave.com/en-us/resources/blogs/spiderlabs-blog/backdoor-at-the-end-of-the-icmp-tunnel
  - https://app.any.run/tasks/4a54c651-b70b-4b72-84d7-f34d301d6406
  - https://attack.mitre.org/techniques/T1574/001/

response:
  message: >
    Pingback Backdoor Activity detected on host $agent_name$. Matched
    data_win_eventdata_parentImage: $data_win_eventdata_parentImage$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1574.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1574.001
  custom_tags:
    - pingback
    - backdoor
    - process_creation
    - sysmon
    - privilege_escalation
    - persistence
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Uu][Pp][Dd][Aa][Tt][Aa]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Cc][Oo][Nn][Ff][Ii][Gg].*/ AND data_win_eventdata_commandLine:/.*[Mm][Ss][Dd][Tt][Cc].*/ AND data_win_eventdata_commandLine:/.*[Ss][Tt][Aa][Rr][Tt].*/ AND data_win_eventdata_commandLine:/.*[Aa][Uu][Tt][Oo].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 35a7dc42-bc6f-46e0-9f83-81f8e56c8d4b
    name: Pingback Backdoor DLL Loading Activity
    reason: msdtc loading the sideloaded oci.dll precedes updata.exe setting msdtc to auto-start
  - id: 2bd63d53-84d4-4210-80ff-bf0658f1bf78
    name: Pingback Backdoor File Indicators
    reason: updata.exe / oci.dll dropped to disk before this service config command
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Pingback payload files dropped
    query: data_win_system_eventID:11 AND (data_win_eventdata_targetFilename:/.*[Uu]pdata\.exe/ OR data_win_eventdata_targetFilename:/.*[Oo]ci\.dll/)
    pivot_on: host
    window: 24h
  - name: MSDTC service tampering
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[\\](sc|net|net1|cmd|powershell)\.exe/ AND data_win_eventdata_commandLine:/.*[Mm][Ss][Dd][Tt][Cc].*/
    pivot_on: host
    window: 24h
  - name: msdtc loading oci.dll
    query: data_win_system_eventID:7 AND data_win_eventdata_image:/.*[\\]msdtc\.exe/ AND data_win_eventdata_imageLoaded:/.*[Oo]ci\.dll/
    pivot_on: host
    window: 24h
  - name: ICMP network activity
    query: data_win_system_eventID:3 AND data_win_eventdata_protocol:icmp
    pivot_on: host
    window: 24h
