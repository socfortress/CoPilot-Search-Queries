name: Base64 Encoded PowerShell Command Detected
id: e32d4572-9826-4738-b651-95fa63747e8a
version: 1
schema_version: "1.0"
date: "2023-01-26"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: e32d4572-9826-4738-b651-95fa63747e8a
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects usage of the "FromBase64String" function in the commandline which is
  used to decode a base64 encoded string. MITRE ATT&CK: T1027, T1140, T1059.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*::FromBase64String(*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*::FromBase64String(*'.

known_false_positives: >
  Administrative script libraries. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://gist.github.com/Neo23x0/6af876ee72b51676c82a2db8d2cd3639
  - https://attack.mitre.org/techniques/T1027/
  - https://attack.mitre.org/techniques/T1140/
  - https://attack.mitre.org/techniques/T1059/001/

response:
  message: >
    Base64 Encoded PowerShell Command Detected detected on host $agent_name$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1027, T1140, T1059.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1027
    - T1140
    - T1059.001
  custom_tags:
    - base64
    - encoded
    - powershell
    - process_creation
    - sysmon
    - stealth
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*::[Ff][Rr][Oo][Mm][Bb][Aa][Ss][Ee]64[Ss][Tt][Rr][Ii][Nn][Gg]\(.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c4db14d9-7909-48b4-a054-aa14d89dbb19
    name: Malicious PowerShell Process - Encoded Command
    reason: -enc launches often accompany in-script FromBase64String decoding in the same loader.
  - id: f26c6093-6f14-4b12-800f-0fcb46f5ffd0
    name: Malicious Base64 Encoded PowerShell Keywords in Command Lines
    reason: Decoded content hits known malicious keywords, confirming the payload.
  - id: 9be56c82-b1cc-4318-87eb-d138afaaca39
    name: Malicious PowerShell Process - Execution Policy Bypass
    reason: Loaders pair base64 decoding with policy bypass flags.
  - id: 44e24481-6202-4c62-9127-5a0ae8e3fe3d
    name: Obfuscated PowerShell OneLiner Execution
    reason: Obfuscated one-liners are the usual carrier of FromBase64String.
  - id: 02b64f1b-3f33-4e67-aede-ef3b0a5a8fcf
    name: Potential COM Objects Download Cradles Usage - Process Creation
    reason: Download cradles that fetch the base64 blob.
  - id: 30e92f50-bb5a-4884-98b5-d20aa80f3d7a
    name: Hidden Powershell in Link File Pattern
    reason: A common delivery vehicle (LNK) for the encoded PowerShell.
  - id: b6e04788-29e1-4557-bb14-77f761848ab8
    name: Potentially Suspicious File Download From File Sharing Domain Via PowerShell.EXE
    reason: Staged payload download that follows or precedes decoding.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: PowerShell parent chain and launchers
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*\\(winword|excel|outlook|mshta|wscript|cscript|wmiprvse|cmd)\.exe/ AND data_win_eventdata_image:/.*\\(powershell|pwsh)\.exe/
    pivot_on: host
    window: 2h
  - name: Reflection and in-memory loading
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*([Rr]eflection\.[Aa]ssembly|[Ll]oad\(|VirtualAlloc|[Ii]nvoke-[Ee]xpression|IEX).*/
    pivot_on: host
    window: 4h
  - name: Download cradles
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*([Dd]ownload(String|File)|[Nn]et\.[Ww]eb[Cc]lient|[Ii]nvoke-[Ww]eb[Rr]equest|[Ii]wr ).*/
    pivot_on: host
    window: 4h
  - name: PowerShell network connections
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*\\(powershell|pwsh)\.exe/
    pivot_on: host
    window: 4h
  - name: Persistence after PowerShell
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*schtasks.*\/create.*/ OR data_win_eventdata_commandLine:/.*CurrentVersion\\Run.*/ OR data_win_eventdata_commandLine:/.*sc(\.exe)? create.*/)
    pivot_on: host
    window: 6h
