name: Windows Network Connection Discovery With Arp
id: windows-network-connection-discovery-with-arp-001
version: 1
schema_version: "1.0"
date: "2026-02-12"
author: SOCFortress LLC
status: production
type: Hunting

description: >
  Detects the execution of arp.exe with the -a flag, used to list network connections 
  and ARP cache entries on a system. Both Red Teams and adversaries use arp.exe for 
  situational awareness and network discovery. Used by Volt Typhoon, Qakbot, IcedID, 
  and Prestige/Interlock ransomware for network reconnaissance prior to lateral movement.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - wildcard:
            data_win_eventdata_image: "*arp.exe"
        - wildcard:
            data_win_eventdata_commandLine: "*-a*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-12 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-12 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Windows endpoints with Sysmon 
  installed and configured to log process creation events (EventID 1) with full 
  command-line arguments. Ensure the Sysmon configuration does not exclude arp.exe 
  from logging. The index pattern should match your Wazuh index naming convention. 
  Note: This detection was not validated with a live simulation as the Sysmon config 
  in the lab environment excludes arp.exe. Query logic and field mappings are validated 
  from previous detections.

known_false_positives: >
  Administrators or power users may use arp -a for legitimate network troubleshooting. 
  Filter based on parent process context and frequency. Multiple arp executions in 
  a short time window increases confidence of malicious activity.

references:
  - https://attack.mitre.org/techniques/T1049/
  - https://www.microsoft.com/en-us/security/blog/2023/05/24/volt-typhoon-targets-us-critical-infrastructure-with-living-off-the-land-techniques/
  - https://thedfirreport.com/2023/05/22/icedid-macro-ends-in-nokoyawa-ransomware/

response:
  message: >
    Network connection discovery via arp.exe detected on $agent_name$. 
    Command line: $data_win_eventdata_commandLine$. 
    Parent process: $data_win_eventdata_parentImage$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1049
  risk_score: 25
  severity: low
  risk_objects:
    - field: agent_name
      type: system
      score: 25
  threat_objects: []

tags:
  analytic_story:
    - Active Directory Discovery
    - Qakbot
    - Windows Post-Exploitation
    - Volt Typhoon
    - IcedID
    - Interlock Ransomware
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1049
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*-a.*/ AND data_win_eventdata_image:C\:\\\\Windows\\\\System32\\\\ARP.EXE

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 2cf5cc25-f39a-436d-a790-4857e5995ede
    name: Network Connection Discovery With Netstat
    reason: netstat -ano runs in the same discovery burst to map live connections and owning processes.
  - id: dd83407e-439f-11ec-ab8e-acde48001122
    name: Network Discovery Using Route Windows App
    reason: route print completes the host-network triad (neighbours, connections, routes) run together by Qakbot/Volt Typhoon style tooling.
  - id: c3e05466-5f22-11eb-ae93-0242ac130002
    name: NLTest Domain Trust Discovery
    reason: Local network discovery is typically paired with or followed by domain trust enumeration.
  - id: d95de845-b83c-4a9a-8a6a-4fc802ebf6c0
    name: Suspicious Group And Account Reconnaissance Activity Using Net.EXE
    reason: net.exe account/group enumeration commonly runs in the same post-exploitation recon batch.
  - id: c248c896-e412-4279-8c15-1c558067b6fa
    name: Enumerate All Information With Whoami.EXE
    reason: whoami /all establishes privileges immediately before or after network discovery.
  - id: f6ecd1cf-19b8-4488-97f6-00f0924991a3
    name: PUA - Nmap/Zenmap Execution
    reason: Passive host recon often escalates to active scanning of the discovered subnets.
  - id: bef37fa2-f205-4a7b-b484-0759bfd5f86f
    name: PUA - Advanced IP Scanner Execution
    reason: Ransomware affiliates move from arp/route recon to Advanced IP Scanner subnet sweeps.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Host and identity discovery commands
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ii][Pp][Cc][Oo][Nn][Ff][Ii][Gg].*/ OR data_win_eventdata_commandLine:/.*[Ss][Yy][Ss][Tt][Ee][Mm][Ii][Nn][Ff][Oo].*/ OR data_win_eventdata_commandLine:/.*[Ww][Hh][Oo][Aa][Mm][Ii].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ll][Tt][Ee][Ss][Tt].*/)
    pivot_on: host
    window: 2h
  - name: net.exe and nltest domain/share discovery
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Nn][Ee][Tt]1? +(view|group|user|localgroup|share|accounts|use|session).*/ OR data_win_eventdata_commandLine:/.*[Nn][Ll][Tt][Ee][Ss][Tt].*(dclist|domain_trusts|dsgetdc).*/)
    pivot_on: host
    window: 4h
  - name: Network scanners or Test-NetConnection sweeps
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Nn][Mm][Aa][Pp]|[Zz][Ee][Nn][Mm][Aa][Pp]|[Aa][Dd][Vv][Aa][Nn][Cc][Ee][Dd]_[Ii][Pp]_[Ss][Cc][Aa][Nn][Nn][Ee][Rr]|[Aa][Dd][Vv][Aa][Nn][Cc][Ee][Dd]_[Pp][Oo][Rr][Tt]_[Ss][Cc][Aa][Nn][Nn][Ee][Rr]).*\.exe/ OR data_win_eventdata_commandLine:/.*[Tt][Ee][Ss][Tt]-[Nn][Ee][Tt][Cc][Oo][Nn][Nn][Ee][Cc][Tt][Ii][Oo][Nn].*/)
    pivot_on: host
    window: 6h
  - name: Lateral movement tooling (PsExec, WMIC /node, remote schtasks)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Pp][Ss][Ee][Xx][Ee][Cc].*\.exe/ OR data_win_eventdata_commandLine:/.*[Ww][Mm][Ii][Cc].*\/node:.*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss].*\/[Ss] .*/)
    pivot_on: host
    window: 6h
  - name: Outbound network connections (Sysmon EID 3) after recon
    query: data_win_system_eventID:"3"
    pivot_on: host
    window: 2h
