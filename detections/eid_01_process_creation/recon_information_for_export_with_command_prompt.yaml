name: Recon Information for Export with Command Prompt
id: aa2efee7-34dd-446e-8a37-40790a66efd7
version: 1
schema_version: "1.0"
date: "2022-09-13"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: aa2efee7-34dd-446e-8a37-40790a66efd7
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Once established within a system or network, an adversary may use automated
  techniques for collecting internal data. MITRE ATT&CK: T1119.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\tree.com"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\WMIC.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\doskey.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\sc.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "wmic.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "DOSKEY.EXE"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "sc.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_parentCommandLine:
                    value: "* > %TEMP%\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentCommandLine:
                    value: "* > %TMP%\\\\*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_parentCommandLine
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\tree.com'; data_win_eventdata_image matches '*\WMIC.exe';
  data_win_eventdata_image matches '*\doskey.exe', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1119/T1119.md
  - https://attack.mitre.org/techniques/T1119/

response:
  message: >
    Recon Information for Export with Command Prompt detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1119
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1119
  custom_tags:
    - recon
    - information
    - export
    - process_creation
    - sysmon
    - collection
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Tt][Rr][Ee][Ee]\.[Cc][Oo][Mm]/ OR data_win_eventdata_image:/.*\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Dd][Oo][Ss][Kk][Ee][Yy]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ss][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Dd][Oo][Ss][Kk][Ee][Yy]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ss][Cc]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_parentCommandLine:/.* \> %[Tt][Ee][Mm][Pp]%\\.*/ OR data_win_eventdata_parentCommandLine:/.* \> %[Tt][Mm][Pp]%\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 9d7ca793-f6bd-471c-8d0f-11e68b2f0d2f
    name: Computer System Reconnaissance Via Wmic.EXE
    reason: Wmic recon output redirected to temp is exactly this collection pattern.
  - id: 8e0bb260-d4b2-4fff-bb8d-3f82118e6892
    name: Potentially Suspicious CMD Shell Output Redirect
    reason: Redirecting command output to files is the staging mechanism shared with this rule.
  - id: 383572e0-04c5-11ec-bdcc-acde48001122
    name: Domain Account Discovery with Wmic
    reason: Scripted collection often includes domain account enumeration.
  - id: 4902d7aa-0134-11ec-9d65-acde48001122
    name: Local Account Discovery With Wmic
    reason: Same wmic collection batch frequently enumerates local accounts.
  - id: 9fbf5927-5261-4284-a71d-f681029ea574
    name: Compress Data and Lock With Password for Exfiltration With 7-ZIP
    reason: Collected recon files in temp are then archived for exfiltration.
  - id: 85a8e5ba-bd03-4bfb-bbfa-a4409a8f8b98
    name: Folder Compress To Potentially Suspicious Output Via Compress-Archive Cmdlet
    reason: Compress-Archive packaging of collected output is the next step.
  - id: af688c76-4ce4-4309-bfdd-e896f01acf27
    name: Grixba Malware Reconnaissance Activity
    reason: Automated recon tooling producing output files of the same shape.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Output redirected into temp
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:*\>*%TEMP%* OR data_win_eventdata_commandLine:*\>*%TMP%* OR data_win_eventdata_commandLine:*\>*\\Temp\\*)
    pivot_on: host
    window: 4h
  - name: Recon output files created in temp
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:*\\Temp\\* AND data_win_eventdata_targetFilename:/.*\.(txt|csv|log|dat)/
    pivot_on: host
    window: 4h
  - name: Archiving of collected data
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*\\(7z|7za|rar|winrar|tar)\.exe/ OR data_win_eventdata_commandLine:*[Cc]ompress-[Aa]rchive*)
    pivot_on: host
    window: 6h
  - name: Exfil or transfer utilities
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*\\(curl|bitsadmin|certutil|ftp|rclone|scp)\.exe/ OR data_win_eventdata_commandLine:*[Ii]nvoke-[Ww]eb[Rr]equest*)
    pivot_on: host
    window: 6h
  - name: Wmic, sc, tree and doskey enumeration
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*\\(wmic|sc|tree|doskey)\.(exe|com)/
    pivot_on: host
    window: 4h
