name: Renamed Office Binary Execution
id: 0b0cd537-fc77-4e6e-a973-e53495c1083d
version: 1
schema_version: "1.0"
date: "2025-12-09"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 0b0cd537-fc77-4e6e-a973-e53495c1083d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of a renamed office binary. MITRE ATT&CK: T1036.003.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - term:
                  data_win_eventdata_originalFileName:
                    value: "Excel.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "MSACCESS.EXE"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "MSPUB.EXE"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "OneNote.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "OneNoteM.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "OUTLOOK.EXE"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "POWERPNT.EXE"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "WinWord.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "Olk.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_description:
                    value: "Microsoft Access"
                    case_insensitive: true
              - term:
                  data_win_eventdata_description:
                    value: "Microsoft Excel"
                    case_insensitive: true
              - term:
                  data_win_eventdata_description:
                    value: "Microsoft OneNote"
                    case_insensitive: true
              - term:
                  data_win_eventdata_description:
                    value: "Microsoft Outlook"
                    case_insensitive: true
              - term:
                  data_win_eventdata_description:
                    value: "Microsoft PowerPoint"
                    case_insensitive: true
              - term:
                  data_win_eventdata_description:
                    value: "Microsoft Publisher"
                    case_insensitive: true
              - term:
                  data_win_eventdata_description:
                    value: "Microsoft Word"
                    case_insensitive: true
              - term:
                  data_win_eventdata_description:
                    value: "Sent to OneNote Tool"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\EXCEL.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\excelcnv.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\MSACCESS.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\MSPUB.EXE"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\ONENOTE.EXE"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\ONENOTEM.EXE"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\OUTLOOK.EXE"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\POWERPNT.EXE"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\WINWORD.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\OLK.EXE"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_originalFileName
    - data_win_eventdata_description
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_originalFileName equals
  'Excel.exe'; data_win_eventdata_originalFileName equals 'MSACCESS.EXE';
  data_win_eventdata_originalFileName equals 'MSPUB.EXE', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://infosec.exchange/@sbousseaden/109542254124022664
  - https://attack.mitre.org/techniques/T1036/003/

response:
  message: >
    Renamed Office Binary Execution detected on host $agent_name$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    Matched data_win_eventdata_description: $data_win_eventdata_description$.
    MITRE ATT&CK: T1036.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_originalFileName
      type: file_name
    - field: data_win_eventdata_description
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1036.003
  custom_tags:
    - renamed
    - office
    - binary
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_originalFileName:/[Ee][Xx][Cc][Ee][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Mm][Ss][Aa][Cc][Cc][Ee][Ss][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Mm][Ss][Pp][Uu][Bb]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Oo][Nn][Ee][Nn][Oo][Tt][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Oo][Nn][Ee][Nn][Oo][Tt][Ee][Mm]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Oo][Uu][Tt][Ll][Oo][Oo][Kk]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Pp][Oo][Ww][Ee][Rr][Pp][Nn][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ww][Ii][Nn][Ww][Oo][Rr][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Oo][Ll][Kk]\.[Ee][Xx][Ee]/ OR data_win_eventdata_description:/[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt] [Aa][Cc][Cc][Ee][Ss][Ss]/ OR data_win_eventdata_description:/[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt] [Ee][Xx][Cc][Ee][Ll]/ OR data_win_eventdata_description:/[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt] [Oo][Nn][Ee][Nn][Oo][Tt][Ee]/ OR data_win_eventdata_description:/[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt] [Oo][Uu][Tt][Ll][Oo][Oo][Kk]/ OR data_win_eventdata_description:/[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt] [Pp][Oo][Ww][Ee][Rr][Pp][Oo][Ii][Nn][Tt]/ OR data_win_eventdata_description:/[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt] [Pp][Uu][Bb][Ll][Ii][Ss][Hh][Ee][Rr]/ OR data_win_eventdata_description:/[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt] [Ww][Oo][Rr][Dd]/ OR data_win_eventdata_description:/[Ss][Ee][Nn][Tt] [Tt][Oo] [Oo][Nn][Ee][Nn][Oo][Tt][Ee] [Tt][Oo][Oo][Ll]/) AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/.*\\[Ee][Xx][Cc][Ee][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ee][Xx][Cc][Ee][Ll][Cc][Nn][Vv]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Aa][Cc][Cc][Ee][Ss][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Pp][Uu][Bb]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Oo][Nn][Ee][Nn][Oo][Tt][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Oo][Nn][Ee][Nn][Oo][Tt][Ee][Mm]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Oo][Uu][Tt][Ll][Oo][Oo][Kk]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Pp][Nn][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Ww][Oo][Rr][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Oo][Ll][Kk]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 438025f9-5856-4663-83f7-52f878a70a50
    name: Suspicious Microsoft Office Child Process
    reason: If the renamed Office binary runs a payload, its children (cmd, PowerShell) trip this rule.
  - id: f7375e28-5c14-432f-b8d1-1db26c832df3
    name: Potential Arbitrary DLL Load Using Winword
    reason: Renamed Winword is a known way to load arbitrary DLLs via /l; same abuse family.
  - id: 4ae3e30b-b03f-43aa-87e3-b622f4048eed
    name: Potential Arbitrary File Download Using Office Application
    reason: Office binaries invoked directly with a URL can download payloads, a likely use of a renamed copy.
  - id: 551d9c1f-816c-445b-a7a6-7a3864720d60
    name: Potential Excel.EXE DCOM Lateral Movement Via ActivateMicrosoftApp
    reason: Excel abuse for lateral movement has Excel launching foreign apps; co-occurs when Excel is the renamed binary.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Office-binary command lines with abuse switches
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*\s\/[Ll]\s.*\.dll.*/ OR /.*[Hh][Tt][Tt][Pp][Ss]?:\/\/.*/ OR /.*\.(xll|wll)\b.*/ OR /.*-[Ee]mbedding.*/)
    pivot_on: host
    window: 4h
  - name: Shells and LOLBins launched by Office parents
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*\\(WINWORD|EXCEL|POWERPNT|OUTLOOK|MSPUB|MSACCESS|ONENOTE)\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\(cmd|powershell|wscript|cscript|mshta|rundll32|regsvr32)\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 4h
  - name: Office add-ins and macro files written
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(/.*\.(xll|wll|xlam|docm|xlsm|pptm|dotm)/ OR /.*\\[Mm]icrosoft\\(Word|Excel)\\STARTUP\\.*/)
    pivot_on: host
    window: 4h
  - name: Executables written to user-writable paths
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(/.*\\(Temp|Public|ProgramData)\\.*\.exe/ OR /.*\\[Dd]ownloads\\.*\.exe/)
    pivot_on: host
    window: 4h
  - name: Outbound connections from user-writable binaries
    query: data_win_system_eventID:3 AND data_win_eventdata_initiated:true AND data_win_eventdata_image:/.*\\(Temp|Public|ProgramData|AppData)\\.*/
    pivot_on: host
    window: 4h
