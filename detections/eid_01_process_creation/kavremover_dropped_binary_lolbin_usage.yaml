name: Kavremover Dropped Binary LOLBIN Usage
id: d047726b-c71c-4048-a99b-2e2f50dc107d
version: 1
schema_version: "1.0"
date: "2022-11-01"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: d047726b-c71c-4048-a99b-2e2f50dc107d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of a signed binary dropped by Kaspersky Lab Products
  Remover (kavremover) which can be abused as a LOLBIN to execute arbitrary
  commands and binaries. MITRE ATT&CK: T1127.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* run run-cmd *"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_parentImage"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_parentImage:
                          value: "*\\\\cleanapi.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_parentImage:
                          value: "*\\\\kavremover.exe"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches '* run
  run-cmd *'; data_win_eventdata_parentImage matches '*\cleanapi.exe';
  data_win_eventdata_parentImage matches '*\kavremover.exe'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://nasbench.medium.com/lolbined-using-kaspersky-endpoint-security-kes-installer-to-execute-arbitrary-commands-1c999f1b7fea
  - https://attack.mitre.org/techniques/T1127/

response:
  message: >
    Kavremover Dropped Binary LOLBIN Usage detected on host $agent_name$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
    Matched data_win_eventdata_parentImage: $data_win_eventdata_parentImage$.
    MITRE ATT&CK: T1127
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_parentImage
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1127
  custom_tags:
    - kavremover
    - dropped
    - binary
    - process_creation
    - sysmon
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.* [Rr][Uu][Nn] [Rr][Uu][Nn]-[Cc][Mm][Dd] .*/ AND _exists_:data_win_eventdata_parentImage AND NOT (data_win_eventdata_parentImage:/.*\\[Cc][Ll][Ee][Aa][Nn][Aa][Pp][Ii]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Kk][Aa][Vv][Rr][Ee][Mm][Oo][Vv][Ee][Rr]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d4ca7c59-e9e4-42d8-bf57-91a776efcb87
    name: LOLBIN Execution From Abnormal Drive
    reason: Dropped signed utility often runs from temp or non-system paths, same LOLBIN proxy theme
  - id: e593cf51-88db-4ee1-b920-37e89012a3c9
    name: Potentially Suspicious Rundll32 Activity
    reason: Commands proxied through kavremover run-cmd commonly end up as rundll32 or other signed binaries
  - id: dcfd6b40-42f9-469d-a433-2e53f7486664
    name: Detect Prohibited Applications Spawning cmd exe
    reason: run-cmd launches arbitrary commands, frequently cmd.exe, from an unexpected parent
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: cleanapi/kavremover process executions
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Cc][Ll][Ee][Aa][Nn][Aa][Pp][Ii]|\\[Kk][Aa][Vv][Rr][Ee][Mm][Oo][Vv][Ee][Rr])\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 6h
  - name: Children of cleanapi/kavremover (proxied commands)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*(\\[Cc][Ll][Ee][Aa][Nn][Aa][Pp][Ii]|\\[Kk][Aa][Vv][Rr][Ee][Mm][Oo][Vv][Ee][Rr])\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 6h
  - name: File creation of cleanapi/kavremover (dropped binary)
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(\\[Cc][Ll][Ee][Aa][Nn][Aa][Pp][Ii]|\\[Kk][Aa][Vv][Rr][Ee][Mm][Oo][Vv][Ee][Rr])\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 6h
  - name: Shells making network connections after LOLBIN proxy
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Cc][Mm][Dd])\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
