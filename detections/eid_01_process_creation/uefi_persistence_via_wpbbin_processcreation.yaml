name: UEFI Persistence Via Wpbbin - ProcessCreation
id: 4abc0ec4-db5a-412f-9632-26659cddf145
version: 1
schema_version: "1.0"
date: "2022-07-18"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 4abc0ec4-db5a-412f-9632-26659cddf145
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of the binary "wpbbin" which is used as part of the UEFI
  based persistence method described in the reference section. MITRE ATT&CK:
  T1542.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - term:
            data_win_eventdata_image:
              value: "C:\\Windows\\System32\\wpbbin.exe"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image equals
  'C:\Windows\System32\wpbbin.exe'.

known_false_positives: >
  Legitimate usage of the file by hardware manufacturer such as lenovo (Thanks
  @0gtweet for the tip). Baseline expected activity in your environment and tune
  this detection before relying on it for automated response.

references:
  - https://grzegorztworek.medium.com/using-uefi-to-inject-executable-files-into-bitlocker-protected-drives-8ff4ca59c94c
  - https://persistence-info.github.io/Data/wpbbin.html
  - https://attack.mitre.org/techniques/T1542/001/

response:
  message: >
    UEFI Persistence Via Wpbbin - ProcessCreation detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1542.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1542.001
  custom_tags:
    - persistence
    - wpbbin
    - processcreation
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ww][Pp][Bb][Bb][Ii][Nn]\.[Ee][Xx][Ee]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e94b9ddc-eec5-4bb8-8a58-b9dc5f4e185f
    name: UEFI Persistence Via Wpbbin - FileCreation
    reason: The wpbbin.exe written into System32 is the precursor; file write and boot-time execution describe the same implant.
  - id: 046218bd-e0d8-4113-a3c3-895a12b2b298
    name: Session Manager Autorun Keys Modification
    reason: Firmware-planted binaries ride the Session Manager boot-time execution path; check for related key changes.
  - id: 1444443e-6757-43e4-9ea4-c8fc705f79a2
    name: Boot Configuration Tampering Via Bcdedit.EXE
    reason: Boot-level persistence is often paired with BCD changes weakening boot protections.
  - id: 4eec988f-7bf0-49f1-8675-1e6a510b3a2a
    name: Potential PendingFileRenameOperations Tampering
    reason: Boot-time file replacement is a mechanism an attacker may use to stage binaries in System32 before reboot.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: wpbbin.exe file writes
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[wW][pP][bB][bB][iI][nN].*/
    pivot_on: host
    window: 6h
  - name: Session Manager BootExecute or PendingFileRename changes
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Ss]ession [Mm]anager.([Bb]oot[Ee]xecute|[Pp]ending[Ff]ile[Rr]ename[Oo]perations|[Ss]etup[Ee]xecute).*/
    pivot_on: host
    window: 6h
  - name: Boot configuration and secure boot changes
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([bB][cC][dD][eE][dD][iI][tT]\.[eE][xX][eE]|[bB][oO][oO][tT][sS][eE][cC][tT]\.[eE][xX][eE]|[mM][oO][uU][nN][tT][vV][oO][lL]\.[eE][xX][eE])/ OR data_win_eventdata_commandLine:/.*[sS][eE][cC][uU][rR][eE][bB][oO][oO][tT][uU][eE][fF][iI].*/)
    pivot_on: host
    window: 6h
  - name: Network connections by wpbbin.exe
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([wW][pP][bB][bB][iI][nN]\.[eE][xX][eE])/
    pivot_on: host
    window: 6h
  - name: Children of wpbbin.exe
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\([wW][pP][bB][bB][iI][nN]\.[eE][xX][eE])/
    pivot_on: host
    window: 6h
