name: Ie4uinit Lolbin Use From Invalid Path
id: d3bf399f-b0cf-4250-8bb4-dfc192ab81dc
version: 1
schema_version: "1.0"
date: "2022-05-16"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: d3bf399f-b0cf-4250-8bb4-dfc192ab81dc
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detect use of ie4uinit.exe to execute commands from a specially prepared
  ie4uinit.inf file from a directory other than the usual directories. MITRE
  ATT&CK: T1218.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\ie4uinit.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "IE4UINIT.EXE"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            must_not:
              - bool:
                  should:
                    - term:
                        data_win_eventdata_currentDirectory:
                          value: "c:\\windows\\system32\\"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_currentDirectory:
                          value: "c:\\windows\\sysWOW64\\"
                          case_insensitive: true
                    - bool:
                        must_not:
                          - exists:
                              field: "data_win_eventdata_currentDirectory"
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_currentDirectory
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\ie4uinit.exe'; data_win_eventdata_originalFileName equals 'IE4UINIT.EXE';
  data_win_eventdata_currentDirectory equals 'c:\windows\system32\', among other
  conditions.

known_false_positives: >
  ViberPC updater calls this binary with the following commandline "ie4uinit.exe
  -ClearIconCache". Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://lolbas-project.github.io/lolbas/Binaries/Ie4uinit/
  - https://bohops.com/2018/03/10/leveraging-inf-sct-fetch-execute-techniques-for-bypass-evasion-persistence-part-2/
  - https://attack.mitre.org/techniques/T1218/

response:
  message: >
    Ie4uinit Lolbin Use From Invalid Path detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1218
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218
  custom_tags:
    - ie4uinit
    - lolbin
    - invalid
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ii][Ee]4[Uu][Ii][Nn][Ii][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ii][Ee]4[Uu][Ii][Nn][Ii][Tt]\.[Ee][Xx][Ee]/) AND NOT (data_win_eventdata_currentDirectory:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32[\\]/ OR data_win_eventdata_currentDirectory:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Ww][Oo][Ww]64[\\]/ OR NOT _exists_:data_win_eventdata_currentDirectory)

correlation:
  # Authored by the correlation engine for review.
  enrichment_searches:
  # NEW ad-hoc searches the engine runs around an alert from this rule, scoped to
  # the alert's host/user/IP within the window (not existing CoPilot Searches).
    - name: "Sysmon activity on this host in the window"
      query: 'data_win_system_channel:"Microsoft-Windows-Sysmon/Operational"'
      pivot_on: [host]
      window: 1h
    - name: "Process creation on this host"
      query: 'data_win_system_eventID:"1"'
      pivot_on: [host]
      window: 1h
    - name: "Network connections from this host"
      query: 'data_win_system_eventID:"3"'
      pivot_on: [host]
      window: 1h
    - name: "High-severity alerts on this host"
      query: 'rule_level:>=10'
      pivot_on: [host]
      window: 1h
