name: Windows Explorer Spawning PowerShell or Cmd
id: windows-explorer-spawning-powershell-cmd-001
version: 1
schema_version: "1.0"
date: "2026-02-23"
author: SOCFortress LLC
status: production
type: Hunting

description: >
  Detects Windows Explorer.exe spawning PowerShell or cmd.exe, associated with 
  ZDI-CAN-25373 Windows shortcut zero-day vulnerability. Specially crafted LNK 
  files trigger malicious code execution through cmd.exe or powershell.exe. 
  Actively exploited by multiple APT groups via HTTP and SMB delivery.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - wildcard:
            data_win_eventdata_parentImage: "*\\\\explorer.exe"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image: "*\\\\powershell.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\\\cmd.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\\\pwsh.exe"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-23 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-23 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Windows endpoints with Sysmon 
  installed and configured to log process creation events (EventID 1) with full 
  command-line arguments. Hunting detection — expect false positives.

known_false_positives: >
  Users opening PowerShell or cmd from Start menu, right-click context menus, or 
  running scripts from Explorer. Filter by command-line content to reduce noise. 
  Focus on encoded commands, unusual scripts, or execution policy bypasses.

references:
  - https://www.zerodayinitiative.com/advisories/ZDI-CAN-25373/
  - https://www.trendmicro.com/en_us/research/25/c/windows-shortcut-zero-day-exploit.html

response:
  message: >
    Explorer.exe spawned shell process on $agent_name$. 
    Child: $data_win_eventdata_image$. 
    Command: $data_win_eventdata_commandLine$. 
    User: $data_win_eventdata_user$. 
    Possible LNK exploit. MITRE ATT&CK: T1059.001
  risk_score: 25
  severity: low
  risk_objects:
    - field: agent_name
      type: system
      score: 25
  threat_objects: []

tags:
  analytic_story:
    - ZDI-CAN-25373 Windows Shortcut Exploit Abused as Zero-Day
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
    - T1204.002
  custom_tags:
    - explorer
    - lnk_exploit
    - hunting
    - shell_spawn
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*explorer\.exe/ AND (data_win_eventdata_image:/.*powershell\.exe/ OR data_win_eventdata_image:/.*cmd\.exe/ OR data_win_eventdata_image:/.*pwsh\.exe/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 30e92f50-bb5a-4884-98b5-d20aa80f3d7a
    name: Hidden Powershell in Link File Pattern
    reason: Malicious LNKs launching hidden PowerShell are the exact explorer-to-shell mechanism (ZDI-CAN-25373).
  - id: 1412aa78-a24c-4abd-83df-767dfb2c5bbe
    name: Potentially Suspicious WebDAV LNK Execution
    reason: LNK delivered over WebDAV/SMB is the stated delivery vector.
  - id: windows-process-creating-lnk-suspicious-location-001
    name: Windows Process Creating LNK File in Suspicious Location
    reason: Shows the shortcut being dropped before explorer launched it.
  - id: e32d4572-9826-4738-b651-95fa63747e8a
    name: Base64 Encoded PowerShell Command Detected
    reason: Shortcut payloads usually carry encoded PowerShell.
  - id: 1f32d820-1d5c-43fe-8fe2-feef0c952eb7
    name: Emotet Loader Execution Via .LNK File
    reason: Known family using the LNK-to-shell chain.
  - id: 33339be3-148b-4e16-af56-ad16ec6c7e7b
    name: Findstr Launching .lnk File
    reason: Loaders that locate and run the LNK via findstr then spawn shells.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Shell children with encoded or download commands
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]|[Cc][Mm][Dd])\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*-[Ee][Nn][Cc].*/ OR data_win_eventdata_commandLine:/.*-[Ww] [Hh][Ii][Dd][Dd][Ee][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Tt][Yy][Ll][Ee] [Hh][Ii][Dd][Dd][Ee][Nn].*/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Cc][Uu][Rr][Ll].*/ OR data_win_eventdata_commandLine:/.*[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll].*/)
    pivot_on: host
    window: 2h
  - name: LNK or archive dropped
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.([Ll][Nn][Kk]|[Zz][Ii][Pp]|[Ii][Ss][Oo]|[Ii][Mm][Gg])/
    pivot_on: host
    window: 4h
  - name: Shell network connections
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]|[Cc][Mm][Dd])\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Persistence after shell launch
    query: (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss])\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*\/[Cc][Rr][Ee][Aa][Tt][Ee].*/))
    pivot_on: host
    window: 4h
  - name: Discovery commands from shells
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ww][Hh][Oo][Aa][Mm][Ii].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt] [Gg][Rr][Oo][Uu][Pp].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ll][Tt][Ee][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ii][Pp][Cc][Oo][Nn][Ff][Ii][Gg] \/[Aa][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Ss][Yy][Ss][Tt][Ee][Mm][Ii][Nn][Ff][Oo].*/)
    pivot_on: host
    window: 4h
