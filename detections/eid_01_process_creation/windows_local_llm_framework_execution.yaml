name: Windows Local LLM Framework Execution
id: windows-local-llm-framework-execution-001
version: 1
schema_version: "1.0"
date: "2026-02-25"
author: SOCFortress LLC
status: production
type: Hunting

description: >
  Detects execution of unauthorized local LLM frameworks including Ollama, 
  LM Studio, GPT4All, Jan, llama.cpp, KoboldCPP, Oobabooga, NutStudio, and 
  Python-based AI/ML libraries (HuggingFace, LangChain). Identifies shadow AI 
  deployments and potential data exfiltration through local AI systems.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image: "*\\\\ollama.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\\\lmstudio.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\\\gpt4all.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\\\jan.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\\\koboldcpp.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\\\kobold.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\\\llama-run.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\\\llama.cpp.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\\\nutstudio.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\\\oobabooga.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\\\text-generation-webui.exe"
              - wildcard:
                  data_win_eventdata_commandLine: "*huggingface*"
              - wildcard:
                  data_win_eventdata_commandLine: "*langchain*"
              - wildcard:
                  data_win_eventdata_commandLine: "*transformers*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-25 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-25 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Windows endpoints with Sysmon 
  installed and configured to log process creation events (EventID 1) with full 
  command-line arguments.

known_false_positives: >
  Authorized developers, data scientists, or AI/ML engineers using local LLM 
  frameworks. Baseline approved frameworks by role/department. Exclude sanctioned 
  dev/lab systems.

references:
  - https://www.ibm.com/think/topics/shadow-ai
  - https://blogs.cisco.com/security/detecting-exposed-llm-servers-shodan-case-study-on-ollama

response:
  message: >
    Local LLM framework execution on $agent_name$. 
    Process: $data_win_eventdata_image$. 
    Command: $data_win_eventdata_commandLine$. 
    User: $data_win_eventdata_user$. 
    Shadow AI detection. MITRE ATT&CK: T1543
  risk_score: 36
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 36
  threat_objects: []

tags:
  analytic_story:
    - Suspicious Local LLM Frameworks
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1543
  custom_tags:
    - ollama
    - llm_detection
    - shadow_ai
    - hunting
    - ai_governance
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*ollama\.exe/ OR data_win_eventdata_image:/.*lmstudio\.exe/ OR data_win_eventdata_image:/.*gpt4all\.exe/ OR data_win_eventdata_image:/.*jan\.exe/ OR data_win_eventdata_image:/.*koboldcpp\.exe/ OR data_win_eventdata_image:/.*kobold\.exe/ OR data_win_eventdata_image:/.*llama-run\.exe/ OR data_win_eventdata_image:/.*llama\.cpp\.exe/ OR data_win_eventdata_image:/.*nutstudio\.exe/ OR data_win_eventdata_image:/.*oobabooga\.exe/ OR data_win_eventdata_image:/.*text-generation-webui\.exe/ OR data_win_eventdata_commandLine:/.*huggingface.*/ OR data_win_eventdata_commandLine:/.*langchain.*/ OR data_win_eventdata_commandLine:/.*transformers.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: afa71271-6a97-4e47-810f-83120fb1a4ce
    name: New Agent Skills Installation Attempt Via Node.EXE
    reason: Local AI agent tooling installed on the same host indicates shadow-AI/agent deployment.
  - id: 1321dc4e-a1fe-481d-a016-52c45f0c8b4f
    name: Windows Defender Exclusions Added
    reason: Model runners and weights are sometimes excluded from AV, a sign of deliberate setup.
  - id: cd5cfd80-aa5f-44c0-9c20-108c4ae12e3c
    name: New Firewall Rule Added Via Netsh.EXE
    reason: An inbound rule for the model server port exposes the LLM beyond localhost.
  - id: 57c4bf16-227f-4394-8ec7-1b745ee061c3
    name: Firewall Disabled via Netsh.EXE
    reason: Hosting a local LLM API may be accompanied by firewall changes to expose its port.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Model file downloads
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:*.gguf OR data_win_eventdata_targetFilename:*.safetensors OR data_win_eventdata_targetFilename:*.ggml OR data_win_eventdata_targetFilename:*\\.ollama\\*)
    pivot_on: host
    window: 24h
  - name: DNS to model hubs
    query: data_win_system_eventID:"22" AND (data_win_eventdata_queryName:*huggingface.co* OR data_win_eventdata_queryName:*ollama.com* OR data_win_eventdata_queryName:*lmstudio.ai* OR data_win_eventdata_queryName:*gpt4all.io*)
    pivot_on: host
    window: 24h
  - name: ML package installs and ollama serve
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Pp][Ii][Pp].*[Ii][Nn][Ss][Tt][Aa][Ll][Ll].*(torch|transformers|langchain|llama).*/ OR data_win_eventdata_commandLine:*11434* OR data_win_eventdata_commandLine:/.*[Oo][Ll][Ll][Aa][Mm][Aa] (serve|run|pull).*/)
    pivot_on: host
    window: 24h
  - name: Data staging and upload tooling
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:*\\rclone.exe OR data_win_eventdata_image:*\\curl.exe OR data_win_eventdata_image:*\\7z.exe OR data_win_eventdata_image:*\\megasync.exe)
    pivot_on: host
    window: 24h
