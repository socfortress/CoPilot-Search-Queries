name: Windows Chromium Browser with Custom User Data Directory
id: 4f546cf4-15aa-4368-80f7-940e92bc551e
version: 3
schema_version: 1
date: '2025-12-16'
author: SOCFortress LLC
status: production
type: Anomaly
description: >
  Detects Chromium-based browsers (Chrome, Edge, Brave, Opera, Vivaldi) launched
  with both --user-data-dir and --disable-gpu or --disable-3d-apis flags. While
  --user-data-dir alone is legitimate for multi-profile support, the combination
  with GPU-disabling flags indicates a headless-like stealth execution pattern
  used by infostealers. StealC, LokiBot, and Malicious Inno Setup loaders abuse
  this pattern to run Chrome in an isolated environment for credential harvesting,
  phishing delivery, or evasion of user session artifacts.
  MITRE ATT&CK: T1497 (Virtualization/Sandbox Evasion).

data_source:
  - Sysmon EventID 1 (ProcessCreate)

search:
  query:
    bool:
      must:
        - term:
            agent_name: "AGENT_NAME"
        - term:
            agent_labels_customer: "CUSTOMER_CODE"
        - term:
            data_win_system_eventID: "1"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image: "*\\chrome.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\msedge.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\brave.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\opera.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\vivaldi.exe"
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine: "*--user-data-dir*"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine: "*--disable-gpu*"
              - wildcard:
                  data_win_eventdata_commandLine: "*--disable-3d-apis*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "START_TIME"
              lte: "END_TIME"

parameters:
  - name: AGENT_NAME
    default: "DESKTOP-AM0HLGE"
  - name: CUSTOMER_CODE
    default: "lab"
  - name: START_TIME
    default: "now-24h"
  - name: END_TIME
    default: "now"

how_to_implement: >
  Requires Sysmon EventID 1 (ProcessCreate) flowing to the Wazuh Indexer.
  Validated on DESKTOP-AM0HLGE with Chrome launched via PowerShell using
  --user-data-dir=C:\Windows\Temp\fake_profile --disable-gpu. Chrome
  self-spawns child processes inheriting the same flags — filter on
  data_win_eventdata_parentImage to focus on non-browser parent launches.
  Confirmed field names: data_win_eventdata_image, data_win_eventdata_commandLine,
  data_win_eventdata_parentImage, data_win_eventdata_user.

known_false_positives: >
  Automated testing frameworks (Selenium, Playwright) and some IT admin
  scripts may use this flag combination legitimately. Chrome also self-spawns
  child processes with the same flags generating multiple hits per launch.
  Filter on data_win_eventdata_parentImage for known automation tool paths.
  Executions from powershell.exe, cmd.exe, or unknown binaries pointing to
  non-standard user-data-dir paths (temp, appdata) should be prioritized.

references:
  - https://chromium.googlesource.com/chromium/src/+/main/docs/user_data_dir.md
  - https://attack.mitre.org/techniques/T1497/

response:
  message: >
    Chromium browser launched with custom user data directory and GPU-disabling
    flags on $agent_name$.
    Command line: $data_win_eventdata_commandLine$.
    Parent process: $data_win_eventdata_parentImage$.
    User: $data_win_eventdata_user$.
    Possible infostealer (StealC, LokiBot) abusing Chrome for stealth credential
    harvesting. MITRE ATT&CK: T1497
  risk_score: 40
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 40
    - field: data_win_eventdata_user
      type: user
      score: 40
  threat_objects:
    - field: data_win_eventdata_image
      type: process_name
    - field: data_win_eventdata_parentImage
      type: parent_process_name

tags:
  analytic_story:
    - StealC Stealer
    - Malicious Inno Setup Loader
    - Lokibot
  asset_type: Endpoint
  mitre_attack_id:
    - T1497
  custom_tags:
    - chrome
    - user_data_dir
    - disable_gpu
    - infostealer
    - stealc
    - lokibot
    - sandbox_evasion
  product:
    - Wazuh
  security_domain: endpoint

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 869ba261-c272-47d7-affe-5c0aa85c93d6
    name: Headless Browser Usage
    reason: Stealth Chromium launches commonly share headless flags with this pattern.
  - id: 88d6e60c-759d-4ac1-a447-c0f1466c2d21
    name: Chromium Browser Instance Executed With Custom Extension
    reason: Custom-profile Chromium runs often load malicious extensions for credential theft.
  - id: b3d34dc5-2efd-4ae3-845f-8ec14921f449
    name: Browser Started with Remote Debugging
    reason: Remote debugging on a custom profile enables cookie and session extraction.
  - id: 47147b5b-9e17-4d76-b8d2-7bac24c5ce1b
    name: Potential Browser Data Stealing
    reason: 'Direct follow-on: harvesting Login Data/Cookies from browser profiles.'
  - id: 6a69f62d-ce75-4b57-8dce-6351eb55b362
    name: Esentutl Steals Browser Information
    reason: Alternate collection of browser data when the browser locks files.
  - id: 5a6e1e16-07de-48d8-8aae-faa766c05e88
    name: Potential Cookies Session Hijacking
    reason: Stolen cookies are the objective of infostealers like StealC.
  - id: d0dae994-26c6-4d2d-83b5-b3c8b79ae513
    name: PUA - WebBrowserPassView Execution
    reason: Password-recovery tooling used alongside or instead of the stealth browser.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Browser launches with unusual flags
    query: data_win_system_eventID:1 AND data_win_eventdata_image:(*\\chrome.exe OR *\\msedge.exe OR *\\brave.exe OR *\\opera.exe OR *\\vivaldi.exe) AND data_win_eventdata_commandLine:(*--headless* OR *--remote-debugging* OR *--load-extension* OR *--no-sandbox*)
    pivot_on: host
    window: 4h
  - name: Browser launched from script or unusual parent
    query: data_win_system_eventID:1 AND data_win_eventdata_image:(*\\chrome.exe OR *\\msedge.exe) AND data_win_eventdata_parentImage:(*\\cmd.exe OR *\\powershell.exe OR *\\wscript.exe OR *\\mshta.exe)
    pivot_on: host
    window: 4h
  - name: Non-browser access to browser credential files
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(*Login*Data* OR *Cookies* OR *Web*Data*) AND NOT data_win_eventdata_image:(*\\chrome.exe OR *\\msedge.exe)
    pivot_on: host
    window: 4h
  - name: Archive or exfil of collected data
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(*7z* OR *rar* OR *Compress-Archive* OR *curl* OR *Invoke-WebRequest*)
    pivot_on: host
    window: 4h
  - name: Installer-dropped binaries from Temp or Downloads
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:(*\\Temp\\* OR *\\Downloads\\*)
    pivot_on: host
    window: 2h
