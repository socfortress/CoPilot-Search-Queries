name: Windows Chromium Browser with Custom User Data Directory
id: 4f546cf4-15aa-4368-80f7-940e92bc551e
version: 3
schema_version: 1
date: '2025-12-16'
author: SOCFortress LLC
status: production
type: Anomaly
description: >
  Detects Chromium-based browsers (Chrome, Edge, Brave, Opera, Vivaldi) launched
  with both --user-data-dir and --disable-gpu or --disable-3d-apis flags. While
  --user-data-dir alone is legitimate for multi-profile support, the combination
  with GPU-disabling flags indicates a headless-like stealth execution pattern
  used by infostealers. StealC, LokiBot, and Malicious Inno Setup loaders abuse
  this pattern to run Chrome in an isolated environment for credential harvesting,
  phishing delivery, or evasion of user session artifacts.
  MITRE ATT&CK: T1497 (Virtualization/Sandbox Evasion).

data_source:
  - Sysmon EventID 1 (ProcessCreate)

search:
  query:
    bool:
      must:
        - term:
            agent_name: "AGENT_NAME"
        - term:
            agent_labels_customer: "CUSTOMER_CODE"
        - term:
            data_win_system_eventID: "1"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image: "*\\chrome.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\msedge.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\brave.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\opera.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\vivaldi.exe"
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine: "*--user-data-dir*"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine: "*--disable-gpu*"
              - wildcard:
                  data_win_eventdata_commandLine: "*--disable-3d-apis*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "START_TIME"
              lte: "END_TIME"

parameters:
  - name: AGENT_NAME
    default: "DESKTOP-AM0HLGE"
  - name: CUSTOMER_CODE
    default: "lab"
  - name: START_TIME
    default: "now-24h"
  - name: END_TIME
    default: "now"

how_to_implement: >
  Requires Sysmon EventID 1 (ProcessCreate) flowing to the Wazuh Indexer.
  Validated on DESKTOP-AM0HLGE with Chrome launched via PowerShell using
  --user-data-dir=C:\Windows\Temp\fake_profile --disable-gpu. Chrome
  self-spawns child processes inheriting the same flags — filter on
  data_win_eventdata_parentImage to focus on non-browser parent launches.
  Confirmed field names: data_win_eventdata_image, data_win_eventdata_commandLine,
  data_win_eventdata_parentImage, data_win_eventdata_user.

known_false_positives: >
  Automated testing frameworks (Selenium, Playwright) and some IT admin
  scripts may use this flag combination legitimately. Chrome also self-spawns
  child processes with the same flags generating multiple hits per launch.
  Filter on data_win_eventdata_parentImage for known automation tool paths.
  Executions from powershell.exe, cmd.exe, or unknown binaries pointing to
  non-standard user-data-dir paths (temp, appdata) should be prioritized.

references:
  - https://chromium.googlesource.com/chromium/src/+/main/docs/user_data_dir.md
  - https://attack.mitre.org/techniques/T1497/

response:
  message: >
    Chromium browser launched with custom user data directory and GPU-disabling
    flags on $agent_name$.
    Command line: $data_win_eventdata_commandLine$.
    Parent process: $data_win_eventdata_parentImage$.
    User: $data_win_eventdata_user$.
    Possible infostealer (StealC, LokiBot) abusing Chrome for stealth credential
    harvesting. MITRE ATT&CK: T1497
  risk_score: 40
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 40
    - field: data_win_eventdata_user
      type: user
      score: 40
  threat_objects:
    - field: data_win_eventdata_image
      type: process_name
    - field: data_win_eventdata_parentImage
      type: parent_process_name

tags:
  analytic_story:
    - StealC Stealer
    - Malicious Inno Setup Loader
    - Lokibot
  asset_type: Endpoint
  mitre_attack_id:
    - T1497
  custom_tags:
    - chrome
    - user_data_dir
    - disable_gpu
    - infostealer
    - stealc
    - lokibot
    - sandbox_evasion
  product:
    - Wazuh
  security_domain: endpoint

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 841e2abc-0442-4e7f-b445-b22680632a08
    name: Windows Browser Process Launched with Unusual Flags
    reason: 'Same abuse family: stealer loaders launch Chromium with atypical flag sets; a hit alongside confirms scripted browser launch.'
  - id: 314cb263-7eeb-4d45-b693-bb21699c73d2
    name: Windows Chromium Browser No Security Sandbox Process
    reason: --no-sandbox is routinely paired with --user-data-dir/--disable-gpu in stealer-driven headless Chrome.
  - id: 869ba261-c272-47d7-affe-5c0aa85c93d6
    name: Headless Browser Usage
    reason: Headless operation is the next stage of the same stealth browser pattern.
  - id: b3d34dc5-2efd-4ae3-845f-8ec14921f449
    name: Browser Started with Remote Debugging
    reason: Remote debugging port lets malware drive the isolated browser and pull cookies/tokens.
  - id: 3e8207c5-fcd2-4ea6-9418-15d45b4890e4
    name: Potential Data Stealing Via Chromium Headless Debugging
    reason: Direct credential/cookie theft through headless debugging of the profile this rule just saw.
  - id: 47147b5b-9e17-4d76-b8d2-7bac24c5ce1b
    name: Potential Browser Data Stealing
    reason: Access to Login Data/Cookies files is the payoff of the stealth browser launch.
  - id: 88d6e60c-759d-4ac1-a447-c0f1466c2d21
    name: Chromium Browser Instance Executed With Custom Extension
    reason: Loader may side-load a malicious extension into the same custom profile.
  - id: 0e8cfe08-02c9-4815-a2f8-0d157b7ed33e
    name: File Download with Headless Browser
    reason: Headless Chrome used as a downloader for the next-stage payload.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Browser launched by script host or LOLBin parent
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Cc][Hh][Rr][Oo][Mm][Ee]\.[Ee][Xx][Ee]|\\[Mm][Ss][Ee][Dd][Gg][Ee]\.[Ee][Xx][Ee]|\\[Bb][Rr][Aa][Vv][Ee]\.[Ee][Xx][Ee]|\\[Oo][Pp][Ee][Rr][Aa]\.[Ee][Xx][Ee]|\\[Vv][Ii][Vv][Aa][Ll][Dd][Ii]\.[Ee][Xx][Ee])/ AND data_win_eventdata_parentImage:/.*(\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]|\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]|\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|\\[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 1h
  - name: Browser credential and cookie store access
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ll][Oo][Gg][Ii][Nn] [Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_commandLine:/.*[Ww][Ee][Bb] [Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Oo][Kk][Ii][Ee][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ll][Oo][Cc][Aa][Ll] [Ss][Tt][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ll][Oo][Gg][Ii][Nn][Ss].[Jj][Ss][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*[Kk][Ee][Yy]4.[Dd][Bb].*/ OR data_win_eventdata_commandLine:/.*[Cc][Hh][Rr][Oo][Mm][Ee]\\[Uu][Ss][Ee][Rr] [Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_commandLine:/.*[Ee][Dd][Gg][Ee]\\[Uu][Ss][Ee][Rr] [Dd][Aa][Tt][Aa].*/)
    pivot_on:
    - host
    window: 1h
  - name: Outbound connections from non-browser processes in user-writable paths
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*(\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\|\\[Tt][Ee][Mm][Pp]\\|\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\|\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\).*/ AND NOT data_win_eventdata_image:/.*(\\[Cc][Hh][Rr][Oo][Mm][Ee]\.[Ee][Xx][Ee]|\\[Mm][Ss][Ee][Dd][Gg][Ee]\.[Ee][Xx][Ee]|\\[Bb][Rr][Aa][Vv][Ee]\.[Ee][Xx][Ee]|\\[Oo][Pp][Ee][Rr][Aa]\.[Ee][Xx][Ee]|\\[Vv][Ii][Vv][Aa][Ll][Dd][Ii]\.[Ee][Xx][Ee]|\\[Ff][Ii][Rr][Ee][Ff][Oo][Xx]\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 1h
  - name: Archive staging and webhook exfil tooling
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*(\\7[Zz]\.[Ee][Xx][Ee]|\\[Rr][Aa][Rr]\.[Ee][Xx][Ee]|\\[Ww][Ii][Nn][Rr][Aa][Rr]\.[Ee][Xx][Ee]|\\[Tt][Aa][Rr]\.[Ee][Xx][Ee]|\\[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee])/ OR (data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]-[Aa][Rr][Cc][Hh][Ii][Vv][Ee].*/ OR data_win_eventdata_commandLine:/.*[Aa][Pp][Ii].[Tt][Ee][Ll][Ee][Gg][Rr][Aa][Mm].[Oo][Rr][Gg].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Cc][Oo][Rr][Dd].[Cc][Oo][Mm]/[Aa][Pp][Ii]/[Ww][Ee][Bb][Hh][Oo][Oo][Kk][Ss].*/ OR data_win_eventdata_commandLine:/.*[Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr].[Ss][Hh].*/ OR data_win_eventdata_commandLine:/.*[Aa][Nn][Oo][Nn][Ff][Ii][Ll][Ee][Ss].*/))
    pivot_on:
    - host
    window: 2h
