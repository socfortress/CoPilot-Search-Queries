name: Windows Chromium Browser with Custom User Data Directory
id: 4f546cf4-15aa-4368-80f7-940e92bc551e
version: 3
schema_version: 1
date: '2025-12-16'
author: SOCFortress LLC
status: production
type: Anomaly
description: >
  Detects Chromium-based browsers (Chrome, Edge, Brave, Opera, Vivaldi) launched
  with both --user-data-dir and --disable-gpu or --disable-3d-apis flags. While
  --user-data-dir alone is legitimate for multi-profile support, the combination
  with GPU-disabling flags indicates a headless-like stealth execution pattern
  used by infostealers. StealC, LokiBot, and Malicious Inno Setup loaders abuse
  this pattern to run Chrome in an isolated environment for credential harvesting,
  phishing delivery, or evasion of user session artifacts.
  MITRE ATT&CK: T1497 (Virtualization/Sandbox Evasion).

data_source:
  - Sysmon EventID 1 (ProcessCreate)

search:
  query:
    bool:
      must:
        - term:
            agent_name: "AGENT_NAME"
        - term:
            agent_labels_customer: "CUSTOMER_CODE"
        - term:
            data_win_system_eventID: "1"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image: "*\\chrome.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\msedge.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\brave.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\opera.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\vivaldi.exe"
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine: "*--user-data-dir*"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine: "*--disable-gpu*"
              - wildcard:
                  data_win_eventdata_commandLine: "*--disable-3d-apis*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "START_TIME"
              lte: "END_TIME"

parameters:
  - name: AGENT_NAME
    default: "DESKTOP-AM0HLGE"
  - name: CUSTOMER_CODE
    default: "lab"
  - name: START_TIME
    default: "now-24h"
  - name: END_TIME
    default: "now"

how_to_implement: >
  Requires Sysmon EventID 1 (ProcessCreate) flowing to the Wazuh Indexer.
  Validated on DESKTOP-AM0HLGE with Chrome launched via PowerShell using
  --user-data-dir=C:\Windows\Temp\fake_profile --disable-gpu. Chrome
  self-spawns child processes inheriting the same flags — filter on
  data_win_eventdata_parentImage to focus on non-browser parent launches.
  Confirmed field names: data_win_eventdata_image, data_win_eventdata_commandLine,
  data_win_eventdata_parentImage, data_win_eventdata_user.

known_false_positives: >
  Automated testing frameworks (Selenium, Playwright) and some IT admin
  scripts may use this flag combination legitimately. Chrome also self-spawns
  child processes with the same flags generating multiple hits per launch.
  Filter on data_win_eventdata_parentImage for known automation tool paths.
  Executions from powershell.exe, cmd.exe, or unknown binaries pointing to
  non-standard user-data-dir paths (temp, appdata) should be prioritized.

references:
  - https://chromium.googlesource.com/chromium/src/+/main/docs/user_data_dir.md
  - https://attack.mitre.org/techniques/T1497/

response:
  message: >
    Chromium browser launched with custom user data directory and GPU-disabling
    flags on $agent_name$.
    Command line: $data_win_eventdata_commandLine$.
    Parent process: $data_win_eventdata_parentImage$.
    User: $data_win_eventdata_user$.
    Possible infostealer (StealC, LokiBot) abusing Chrome for stealth credential
    harvesting. MITRE ATT&CK: T1497
  risk_score: 40
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 40
    - field: data_win_eventdata_user
      type: user
      score: 40
  threat_objects:
    - field: data_win_eventdata_image
      type: process_name
    - field: data_win_eventdata_parentImage
      type: parent_process_name

tags:
  analytic_story:
    - StealC Stealer
    - Malicious Inno Setup Loader
    - Lokibot
  asset_type: Endpoint
  mitre_attack_id:
    - T1497
  custom_tags:
    - chrome
    - user_data_dir
    - disable_gpu
    - infostealer
    - stealc
    - lokibot
    - sandbox_evasion
  product:
    - Wazuh
  security_domain: endpoint

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b3d34dc5-2efd-4ae3-845f-8ec14921f449
    name: Browser Started with Remote Debugging
    reason: Stealth Chromium launches often add --remote-debugging-port so the attacker can drive the browser or extract cookies.
  - id: 3e8207c5-fcd2-4ea6-9418-15d45b4890e4
    name: Potential Data Stealing Via Chromium Headless Debugging
    reason: Headless debugging is the typical credential and cookie theft step that follows a stealth Chromium start.
  - id: 869ba261-c272-47d7-affe-5c0aa85c93d6
    name: Headless Browser Usage
    reason: Headless mode is the other common way malware hides Chromium from the user.
  - id: 1c526788-0abe-4713-862f-b520da5e5316
    name: Chromium Browser Headless Execution To Mockbin Like Site
    reason: Headless Chromium fetching from mockbin-style hosts is how stealer loaders pull config or payloads.
  - id: 0e8cfe08-02c9-4815-a2f8-0d157b7ed33e
    name: File Download with Headless Browser
    reason: Hidden browser instances are used to download files without a visible window.
  - id: 47147b5b-9e17-4d76-b8d2-7bac24c5ce1b
    name: Potential Browser Data Stealing
    reason: Credential store access by non-browser processes follows isolated browser launches used for harvesting.
  - id: 5a6e1e16-07de-48d8-8aae-faa766c05e88
    name: Potential Cookies Session Hijacking
    reason: Cookie theft is the usual goal of an off-profile hidden browser.
  - id: 1193d960-2369-499f-a158-7b50a31df682
    name: Potential Suspicious Browser Launch From Document Reader Process
    reason: A browser spawned by a document reader indicates a malicious PDF or lure as the entry point.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Chromium launches with stealth switches
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Cc][Hh][Rr][Oo][Mm][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Ee][Dd][Gg][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Bb][Rr][Aa][Vv][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Oo][Pp][Ee][Rr][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Vv][Ii][Vv][Aa][Ll][Dd][Ii]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*--user-data-dir.*/ OR data_win_eventdata_commandLine:/.*--no-sandbox.*/ OR data_win_eventdata_commandLine:/.*--window-size.*/ OR data_win_eventdata_commandLine:/.*--load-extension.*/ OR data_win_eventdata_commandLine:/.*--headless.*/ OR data_win_eventdata_commandLine:/.*--disable-gpu.*/)
    pivot_on: host
    window: 4h
  - name: User data dir pointed at temp, AppData or public folders
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Cc][Hh][Rr][Oo][Mm][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Ee][Dd][Gg][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Bb][Rr][Aa][Vv][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Oo][Pp][Ee][Rr][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Vv][Ii][Vv][Aa][Ll][Dd][Ii]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*--user-data-dir[= ]+"?[A-Za-z]:\\.*([Tt][Ee][Mm][Pp]|[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]|[Pp][Uu][Bb][Ll][Ii][Cc]|[Aa][Pp][Pp][Dd][Aa][Tt][Aa]).*/)
    pivot_on: host
    window: 4h
  - name: Who launched the browser (script engines and LOLBins)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Cc][Hh][Rr][Oo][Mm][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Ee][Dd][Gg][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Bb][Rr][Aa][Vv][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Oo][Pp][Ee][Rr][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Vv][Ii][Vv][Aa][Ll][Dd][Ii]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_parentImage:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/)
    pivot_on: host
    window: 2h
  - name: Browser profile credential and cookie file writes
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Ll][Oo][Gg][Ii][Nn] [Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_targetFilename:/.*[Ww][Ee][Bb] [Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_targetFilename:/.*\\[Cc][Oo][Oo][Kk][Ii][Ee][Ss].*/ OR data_win_eventdata_targetFilename:/.*[Ll][Oo][Cc][Aa][Ll] [Ss][Tt][Aa][Tt][Ee].*/)
    pivot_on: host
    window: 4h
  - name: Browser outbound connections
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*\\[Cc][Hh][Rr][Oo][Mm][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ss][Ee][Dd][Gg][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Bb][Rr][Aa][Vv][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Oo][Pp][Ee][Rr][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Vv][Ii][Vv][Aa][Ll][Dd][Ii]\.[Ee][Xx][Ee]/) AND data_win_eventdata_initiated:/[Tt][Rr][Uu][Ee]/
    pivot_on: host
    window: 4h
