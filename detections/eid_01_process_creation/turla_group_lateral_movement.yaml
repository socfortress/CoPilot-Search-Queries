name: Turla Group Lateral Movement
id: c601f20d-570a-4cde-a7d6-e17f99cb8e7f
version: 1
schema_version: "1.0"
date: "2022-10-09"
author: Markus Neis
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: c601f20d-570a-4cde-a7d6-e17f99cb8e7f
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects automated lateral movement by Turla group. MITRE ATT&CK: T1059,
  T1021.002, T1083, T1135.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "net use \\\\\\\\%DomainController%\\\\C$ \"P@ssw0rd\" *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "dir c:\\\\*.doc* /s"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "dir %TEMP%\\\\*.exe"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches 'net
  use \\%DomainController%\C$ "P@ssw0rd" *'; data_win_eventdata_commandLine
  matches 'dir c:\*.doc* /s'; data_win_eventdata_commandLine matches 'dir
  %TEMP%\*.exe'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://securelist.com/the-epic-turla-operation/65545/
  - https://attack.mitre.org/techniques/T1059/
  - https://attack.mitre.org/techniques/T1021/002/
  - https://attack.mitre.org/techniques/T1083/
  - https://attack.mitre.org/techniques/T1135/

response:
  message: >
    Turla Group Lateral Movement detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1059,
    T1021.002, T1083, T1135
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059
    - T1021.002
    - T1083
    - T1135
  custom_tags:
    - turla
    - group
    - lateral
    - process_creation
    - sysmon
    - g0010
    - execution
    - lateral_movement
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/[Nn][Ee][Tt] [Uu][Ss][Ee] \\\\%[Dd][Oo][Mm][Aa][Ii][Nn][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ll][Ee][Rr]%\\[Cc]\$ \"[Pp]\@[Ss][Ss][Ww]0[Rr][Dd]\" .*/ OR data_win_eventdata_commandLine:/[Dd][Ii][Rr] [Cc]:\\.*\.[Dd][Oo][Cc].* \/[Ss]/ OR data_win_eventdata_commandLine:/[Dd][Ii][Rr] %[Tt][Ee][Mm][Pp]%\\.*\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 3abd6094-7027-475f-9630-8ab9be7b9725
    name: Windows Admin Share Mount Via Net.EXE
    reason: The rule's net use to a C$ share is the admin-share mount; this is the same step caught generically.
  - id: d4498716-1d52-438f-8084-4a603157d131
    name: Password Provided In Command Line Of Net.EXE
    reason: net use with an inline password is the credentialed share connection used for automated movement.
  - id: 855bc8b5-2ae8-402e-a9ed-b889e6df1900
    name: Copy From Or To Admin Share Or Sysvol Folder
    reason: After mounting the share, tooling is copied to or data pulled from the admin share.
  - id: ea011323-7045-460b-b2d7-0f7442ea6b38
    name: Potential PsExec Remote Execution
    reason: Following share access, remote execution via PsExec is the typical way to run the copied payload.
  - id: 9e2e51c5-c699-4794-ba5a-29f5da40ac0c
    name: Turla Group Commands May 2020
    reason: 'Same actor toolset: the PowerShell backdoor commands appear on hosts reached by this movement.'
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: net use and admin share access
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*net[1]?[ ]+use.*/ OR /.*\\\\.*\$.*/)
    pivot_on: host
    window: 6h
  - name: Document and executable hunting via dir
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*dir[ ].*\*\.(doc|xls|pdf|exe).*/ OR /.*dir[ ].*\/[Ss].*/)
    pivot_on: host
    window: 6h
  - name: Remote execution tooling
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Pp]s[Ee]xec.*/ OR /.*[Ww]mic.*\/[Nn]ode.*/ OR /.*[Ss]chtasks.*\/[Ss][ ].*/)
    pivot_on: host
    window: 6h
  - name: Credential and account discovery
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Nn]et[ ]+(group|user|accounts).*[Dd]omain.*/ OR /.*[Nn]ltest.*/ OR /.*[Ww]hoami.*/)
    pivot_on: user
    window: 6h
