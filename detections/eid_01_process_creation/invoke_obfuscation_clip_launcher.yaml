name: Invoke-Obfuscation CLIP+ Launcher
id: b222df08-0e07-11eb-adc1-0242ac120002
version: 1
schema_version: "1.0"
date: "2022-11-17"
author: Jonathan Cheong, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: b222df08-0e07-11eb-adc1-0242ac120002
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects Obfuscated use of Clip.exe to execute PowerShell. MITRE ATT&CK: T1027,
  T1059.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*cmd*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine: "*&&*"
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*clipboard]::*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*-f*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*/c*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*/r*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*cmd*'; data_win_eventdata_commandLine matches '*&&*';
  data_win_eventdata_commandLine matches '*clipboard]::*', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/SigmaHQ/sigma/issues/1009
  - https://attack.mitre.org/techniques/T1027/
  - https://attack.mitre.org/techniques/T1059/001/

response:
  message: >
    Invoke-Obfuscation CLIP+ Launcher detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1027,
    T1059.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1027
    - T1059.001
  custom_tags:
    - invoke
    - obfuscation
    - launcher
    - process_creation
    - sysmon
    - stealth
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Cc][Mm][Dd].*/ AND data_win_eventdata_commandLine:/.*\&\&.*/ AND data_win_eventdata_commandLine:/.*[Cc][Ll][Ii][Pp][Bb][Oo][Aa][Rr][Dd]\]::.*/ AND data_win_eventdata_commandLine:/.*-[Ff].*/ AND (data_win_eventdata_commandLine:/.*\/[Cc].*/ OR data_win_eventdata_commandLine:/.*\/[Rr].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d7bcd677-645d-4691-a8d4-7a5602b780d1
    name: Potential PowerShell Command Line Obfuscation
    reason: 'Same operator technique family: generic PowerShell obfuscation tokens appear in the same launcher.'
  - id: 44e24481-6202-4c62-9127-5a0ae8e3fe3d
    name: Obfuscated PowerShell OneLiner Execution
    reason: Obfuscated one-liners deliver the decoded payload; often fires on the child powershell.exe spawned by the cmd launcher.
  - id: c4db14d9-7909-48b4-a054-aa14d89dbb19
    name: Malicious PowerShell Process - Encoded Command
    reason: Attackers alternate between Invoke-Obfuscation launchers and -EncodedCommand for the same payload stages.
  - id: e32d4572-9826-4738-b651-95fa63747e8a
    name: Base64 Encoded PowerShell Command Detected
    reason: Decoded stage frequently carries base64 content next to the obfuscated launcher.
  - id: 6f8b3439-a203-45dc-a88b-abf57ea15ccf
    name: HackTool - CrackMapExec PowerShell Obfuscation
    reason: CrackMapExec remote execution uses similar cmd/PowerShell obfuscated launchers during lateral movement.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Clipboard-based PowerShell staging
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Cc][Ll][Ii][Pp][Bb][Oo][Aa][Rr][Dd]|[Gg][Ee][Tt]-[Cc][Ll][Ii][Pp]|[Ss][Ee][Tt]-[Cc][Ll][Ii][Pp]|[Ss][Ee][Tt]-[Cc][Ll][Ii][Pp][Bb][Oo][Aa][Rr][Dd]).*/
    pivot_on: host
    window: 2h
  - name: clip.exe feeding cmd launchers
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Cc][Ll][Ii][Pp]\.[Ee][Xx][Ee].*/ AND data_win_eventdata_image:/.*\([Cc][Mm][Dd]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll])\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: PowerShell download cradles and IEX
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*([Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg]|[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee]|[Ii][Ee][Xx]|[Ii][Nn][Vv][Oo][Kk][Ee]-[Ee][Xx][Pp][Rr][Ee][Ss][Ss][Ii][Oo][Nn]|[Nn][Ee][Tt]\.[Ww][Ee][Bb][Cc][Ll][Ii][Ee][Nn][Tt]).*/
    pivot_on: host
    window: 2h
  - name: Hidden or bypass PowerShell launches
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*(-[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Tt][Yy][Ll][Ee] +[Hh]|-[Ww] +[Hh][Ii][Dd]|-[Nn][Oo][Pp]|-[Ee][Xx][Ee][Cc][Uu][Tt][Ii][Oo][Nn][Pp][Oo][Ll][Ii][Cc][Yy] +[Bb][Yy][Pp][Aa][Ss][Ss]).*/
    pivot_on: host
    window: 2h
