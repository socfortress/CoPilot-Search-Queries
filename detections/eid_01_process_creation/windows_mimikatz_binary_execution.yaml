name: Windows Mimikatz Binary Execution
id: windows-mimikatz-binary-execution-001
version: 1
schema_version: "1.0"
date: "2026-02-25"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects execution of mimikatz.exe by process name or command line. Mimikatz 
  is the most widely used credential extraction tool. Used by Sandworm, Volt 
  Typhoon, Flax Typhoon, Scattered Spider, and referenced in multiple CISA 
  advisories (AA22-320A, AA23-347A).

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image: "*\\\\mimikatz.exe"
              - wildcard:
                  data_win_eventdata_commandLine: "*mimikatz*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-25 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-25 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Windows endpoints with Sysmon 
  installed and configured to log process creation events (EventID 1) with full 
  command-line arguments.

known_false_positives: >
  Very limited. Direct mimikatz execution is almost always malicious. Legitimate 
  penetration testing should be pre-approved and documented.

references:
  - https://attack.mitre.org/techniques/T1003/
  - https://www.varonis.com/blog/what-is-mimikatz
  - https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-347a

response:
  message: >
    CRITICAL: Mimikatz execution on $agent_name$. 
    Process: $data_win_eventdata_image$. 
    Command: $data_win_eventdata_commandLine$. 
    User: $data_win_eventdata_user$. 
    Credential dumping tool. MITRE ATT&CK: T1003
  risk_score: 100
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 100
  threat_objects: []

tags:
  analytic_story:
    - Credential Dumping
    - Sandworm Tools
    - Volt Typhoon
    - Flax Typhoon
    - Scattered Spider
    - CISA AA22-320A
    - CISA AA23-347A
  asset_type: Endpoint
  mitre_attack_id:
    - T1003
  custom_tags:
    - mimikatz
    - credential_dumping
    - critical_alert
    - apt_tool
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*mimikatz\.exe/ OR data_win_eventdata_commandLine:/.*mimikatz.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: Sibling Mimikatz command-line detection confirming module usage (sekurlsa, lsadump).
  - id: 13bbd574-83ac-11ec-99d4-acde48001122
    name: Mimikatz PassTheTicket CommandLine Parameters
    reason: Follow-on use of dumped Kerberos tickets via kerberos::ptt.
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: Alternate LSASS dump path used when mimikatz is blocked or alongside it.
  - id: 5afee48e-67dd-4e03-a783-f74259dcf998
    name: Potential LSASS Process Dump Via Procdump
    reason: 'Offline mimikatz workflow: dump LSASS with procdump, parse later.'
  - id: fd877b94-9bb5-4191-bb25-d79cbd93c167
    name: Dumping of Sensitive Hives Via Reg.EXE
    reason: SAM/SYSTEM/SECURITY hive dumping complements LSASS credential theft.
  - id: d372f928-ce4f-11eb-a762-acde48001122
    name: Esentutl SAM Copy
    reason: SAM copy for lsadump::sam style offline extraction.
  - id: da63bc76-61ae-11eb-ae93-0242ac130002
    name: Ntdsutil Export NTDS
    reason: Domain credential theft escalation if the host is or reaches a DC.
  - id: 1321dc4e-a1fe-481d-a016-52c45f0c8b4f
    name: Windows Defender Exclusions Added
    reason: Attackers add exclusions before dropping the mimikatz binary.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Processes accessing LSASS
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:*\\lsass.exe
    pivot_on: host
    window: 6h
  - name: Mimikatz module syntax anywhere
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:*sekurlsa* OR data_win_eventdata_commandLine:*lsadump* OR data_win_eventdata_commandLine:*kerberos\:\:* OR data_win_eventdata_commandLine:*privilege\:\:debug*)
    pivot_on: host
    window: 6h
  - name: Dump and ticket file creation
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:*.dmp OR data_win_eventdata_targetFilename:*.kirbi OR data_win_eventdata_targetFilename:*lsass*)
    pivot_on: host
    window: 6h
  - name: Lateral movement tooling
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:*\\psexec*.exe OR data_win_eventdata_commandLine:/.*[Ww][Mm][Ii][Cc].*[Nn][Oo][Dd][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss].*\/[Ss].*/)
    pivot_on: host
    window: 6h
  - name: Network and NewCredentials logons
    query: data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"9")
    pivot_on: user
    window: 6h
