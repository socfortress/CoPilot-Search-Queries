name: Windows Disable or Modify Tools Via Taskkill
id: windows-disable-modify-tools-taskkill-001
version: 1
schema_version: "1.0"
date: "2026-02-23"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  Detects taskkill.exe used to forcibly terminate processes with /f (force) and 
  /im or /pid flags. Malware like NjRAT, PXA Stealer, and crypto stealers use 
  taskkill to disable security tools, AV processes, and competing malware before 
  executing payloads.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - wildcard:
            data_win_eventdata_image: "*\\\\taskkill.exe"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine: "*/f*"
              - wildcard:
                  data_win_eventdata_commandLine: "*/t*"
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine: "*/im*"
              - wildcard:
                  data_win_eventdata_commandLine: "*/pid*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-23 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-23 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Windows endpoints with Sysmon 
  installed and configured to log process creation events (EventID 1) with full 
  command-line arguments.

known_false_positives: >
  Network administrators may use taskkill during audits or investigations. 
  Filter by user context and target process name.

references:
  - https://attack.mitre.org/techniques/T1562/001/
  - https://malpedia.caad.fkie.fraunhofer.de/details/win.njrat

response:
  message: >
    Taskkill force terminate on $agent_name$. 
    Command: $data_win_eventdata_commandLine$. 
    Parent: $data_win_eventdata_parentImage$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1562.001
  risk_score: 36
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 36
  threat_objects: []

tags:
  analytic_story:
    - NjRAT
    - PXA Stealer
    - Crypto Stealer
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1562.001
  custom_tags:
    - taskkill
    - process_termination
    - defense_evasion
    - security_tool_disable
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*taskkill\.exe/ AND (data_win_eventdata_commandLine:/.*\/f.*/ OR data_win_eventdata_commandLine:/.*\/t.*/) AND (data_win_eventdata_commandLine:/.*\/im.*/ OR data_win_eventdata_commandLine:/.*\/pid.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 4a6713f6-3331-11ed-a261-0242ac120002
    name: Taskkill Symantec Endpoint Protection
    reason: Same taskkill-against-AV technique aimed at a specific EDR; confirms the force-kill targeted security tooling.
  - id: windows-attempt-stop-security-service-001
    name: Windows Attempt To Stop Security Service
    reason: Attackers pair process kills with service stops to keep security agents down.
  - id: b28e58e4-2a72-4fae-bdee-0fbe904db642
    name: Windows Defender Real-time Protection Disabled
    reason: If Defender was the target, its protection-off event follows the kill.
  - id: a7ee1722-c3c5-aeff-3212-c777e4733217
    name: Disable Windows Defender AV Security Monitoring
    reason: Defense-evasion companion to killing AV processes.
  - id: 5e95028c-5229-4214-afae-d653d573d0ec
    name: Security Service Disabled Via Reg.EXE
    reason: Persistent disabling of security services via registry often accompanies the one-off kill.
  - id: 5ffaa42c-acdb-11eb-9ad3-acde48001122
    name: Process Kill Base On File Path
    reason: Another process-termination technique used by malware clearing AV and competitors.
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: Ransomware kills tools, then deletes shadow copies before encrypting.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other taskkill force-kills
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Tt]askkill\.exe/ AND data_win_eventdata_commandLine:/.*\/[Ff].*/
    pivot_on: host
    window: 2h
  - name: Security product names in kill or stop commands
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Mm]sMpEng|[Ss]ense|[Cc]arbon|[Cc]rowd[Ss]trike|[Ss]ophos|[Ss]ymantec|[Mm]c[Aa]fee|[Ee]set|[Tt]rend|[Ss]entinel).*/
    pivot_on: host
    window: 4h
  - name: Service stop or disable commands
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*(net1? +stop|sc(\.exe)? +(stop|config)).*/
    pivot_on: host
    window: 2h
  - name: Shadow copy and backup destruction
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Vv]ssadmin|[Ww]badmin|[Bb]cdedit).*(delete|recoveryenabled).*/
    pivot_on: host
    window: 4h
  - name: Shell spawned from user-writable parent
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(cmd|powershell)\.exe/ AND data_win_eventdata_parentImage:/.*(\\Temp\\|\\AppData\\|\\Users\\Public\\).*/
    pivot_on: host
    window: 2h
