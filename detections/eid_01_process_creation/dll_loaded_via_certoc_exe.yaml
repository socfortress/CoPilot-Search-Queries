name: DLL Loaded via CertOC.EXE
id: 242301bc-f92f-4476-8718-78004a6efd9f
version: 1
schema_version: "1.0"
date: "2024-03-05"
author: Austin Songer @austinsonger
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 242301bc-f92f-4476-8718-78004a6efd9f
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects when a user installs certificates by using CertOC.exe to loads the
  target DLL file. MITRE ATT&CK: T1218.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\certoc.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "CertOC.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -LoadDLL *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /LoadDLL *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* –LoadDLL *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* —LoadDLL *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* ―LoadDLL *"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\certoc.exe'; data_win_eventdata_originalFileName equals 'CertOC.exe';
  data_win_eventdata_commandLine matches '* -LoadDLL *', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/sblmsrsn/status/1445758411803480072?s=20
  - https://github.com/elastic/protections-artifacts/commit/746086721fd385d9f5c6647cada1788db4aea95f#diff-fe98e74189873d6df72a15df2eaa0315c59ba9cdaca93ecd68afc4ea09194ef2
  - https://lolbas-project.github.io/lolbas/Binaries/Certoc/
  - https://attack.mitre.org/techniques/T1218/

response:
  message: >
    DLL Loaded via CertOC.EXE detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1218
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218
  custom_tags:
    - certoc
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Cc][Ee][Rr][Tt][Oo][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Cc][Ee][Rr][Tt][Oo][Cc]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.* -[Ll][Oo][Aa][Dd][Dd][Ll][Ll] .*/ OR data_win_eventdata_commandLine:/.* \/[Ll][Oo][Aa][Dd][Dd][Ll][Ll] .*/ OR data_win_eventdata_commandLine:/.* –[Ll][Oo][Aa][Dd][Dd][Ll][Ll] .*/ OR data_win_eventdata_commandLine:/.* —[Ll][Oo][Aa][Dd][Dd][Ll][Ll] .*/ OR data_win_eventdata_commandLine:/.* ―[Ll][Oo][Aa][Dd][Dd][Ll][Ll] .*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 84232095-ecca-4015-b0d7-7726507ee793
    name: Suspicious DLL Loaded via CertOC.EXE
    reason: Same CertOC -LoadDLL abuse with a suspicious path/extension; confirms the loaded DLL is a payload not a cert helper.
  - id: 70ad0861-d1fe-491c-a45f-fa48148a300d
    name: File Download via CertOC.EXE
    reason: CertOC download is the common precursor that stages the DLL before -LoadDLL.
  - id: b86f6dea-0b2f-41f5-bdcc-a057bd19cd6a
    name: File Download From IP Based URL Via CertOC.EXE
    reason: CertOC fetching from a raw IP URL is the staging step for the DLL it then loads.
  - id: 6f4191bb-912b-48a8-9ce7-682769541e6d
    name: Suspicious Msiexec Execute Arbitrary DLL
    reason: Sibling signed-binary DLL proxy-exec (msiexec); attackers rotate LOLBins when one is blocked.
  - id: e593cf51-88db-4ee1-b920-37e89012a3c9
    name: Potentially Suspicious Rundll32 Activity
    reason: Rundll32 DLL loading is the interchangeable alternate path for the same payload.
  - id: 0f0450f3-8b47-441e-a31b-15a91dc243e2
    name: Potential DLL File Download Via PowerShell Invoke-WebRequest
    reason: PowerShell downloading a .dll is a typical way the loaded DLL arrived on disk.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: DLL or payload files created in user-writable paths
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\.(dll|ocx|cpl)/ AND data_win_eventdata_targetFilename:/.*([Tt]emp|[Pp]rogramData|[Uu]sers|[Pp]ublic).*/
    pivot_on: host
    window: 2h
  - name: Image loads of DLLs from user-writable paths
    query: data_win_system_eventID:7 AND data_win_eventdata_imageLoaded:/.*([Tt]emp|[Pp]rogramData|[Pp]ublic|[Aa]pp[Dd]ata).*\.dll/
    pivot_on: host
    window: 2h
  - name: Network connections from the CertOC process
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*[Cc]ert[Oo][Cc]\.exe/
    pivot_on: host
    window: 2h
  - name: Rundll32/Regsvr32/Msiexec DLL proxy execution
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*(rundll32|regsvr32|msiexec)\.exe/ AND data_win_eventdata_commandLine:/.*\.dll.*/
    pivot_on: host
    window: 4h
  - name: Child processes spawned by CertOC
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Cc]ert[Oo][Cc]\.exe/
    pivot_on: host
    window: 2h
