name: HackTool - WinPwn Execution
id: d557dc06-62e8-4468-a8e8-7984124908ce
version: 1
schema_version: "1.0"
date: "2023-12-04"
author: Swachchhanda Shrawan Poudel
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: d557dc06-62e8-4468-a8e8-7984124908ce
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects commandline keywords indicative of potential usge of the tool WinPwn.
  A tool for Windows and Active Directory reconnaissance and exploitation. MITRE
  ATT&CK: T1046, T1082, T1106, T1518, T1548.002, T1552.001, T1555, T1555.003.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Offline_Winpwn*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*WinPwn *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*WinPwn.exe*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*WinPwn.ps1*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*Offline_Winpwn*'; data_win_eventdata_commandLine matches '*WinPwn *';
  data_win_eventdata_commandLine matches '*WinPwn.exe*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/S3cur3Th1sSh1t/WinPwn
  - https://www.publicnow.com/view/EB87DB49C654D9B63995FAD4C9DE3D3CC4F6C3ED?1671634841
  - https://reconshell.com/winpwn-tool-for-internal-windows-pentesting-and-ad-security/
  - https://github.com/redcanaryco/atomic-red-team/blob/4d6c4e8e23d465af7a2388620cfe3f8c76e16cf0/atomics/T1082/T1082.md
  - https://grep.app/search?q=winpwn&filter[repo][0]=redcanaryco/atomic-red-team
  - https://attack.mitre.org/techniques/T1046/
  - https://attack.mitre.org/techniques/T1082/
  - https://attack.mitre.org/techniques/T1106/
  - https://attack.mitre.org/techniques/T1518/
  - https://attack.mitre.org/techniques/T1548/002/
  - https://attack.mitre.org/techniques/T1552/001/
  - https://attack.mitre.org/techniques/T1555/
  - https://attack.mitre.org/techniques/T1555/003/

response:
  message: >
    HackTool - WinPwn Execution detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1046,
    T1082, T1106, T1518, T1548.002, T1552.001, T1555, T1555.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1046
    - T1082
    - T1106
    - T1518
    - T1548.002
    - T1552.001
    - T1555
    - T1555.003
  custom_tags:
    - hacktool
    - winpwn
    - process_creation
    - sysmon
    - credential_access
    - discovery
    - execution
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Oo][Ff][Ff][Ll][Ii][Nn][Ee]_[Ww][Ii][Nn][Pp][Ww][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ww][Ii][Nn][Pp][Ww][Nn] .*/ OR data_win_eventdata_commandLine:/.*[Ww][Ii][Nn][Pp][Ww][Nn]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ww][Ii][Nn][Pp][Ww][Nn]\.[Pp][Ss]1.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c2b86e67-b880-4eec-b045-50bc98ef4844
    name: HackTool - LaZagne Execution
    reason: WinPwn wraps LaZagne-style password recovery modules
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: WinPwn invokes Mimikatz modules for credential dumping
  - id: f376c8a7-a2d0-4ddc-aa0c-16c17236d962
    name: HackTool - Bloodhound/Sharphound Execution
    reason: WinPwn launches BloodHound/SharpHound for AD reconnaissance
  - id: 87a476dc-0079-4583-a985-dee7a20a03de
    name: Enumeration for 3rd Party Creds From CLI
    reason: WinPwn searches for stored third-party credentials
  - id: e6313acd-208c-44fc-a0ff-db85d572e90e
    name: Network Reconnaissance Activity
    reason: WinPwn includes network and host discovery modules
  - id: 9be56c82-b1cc-4318-87eb-d138afaaca39
    name: Malicious PowerShell Process - Execution Policy Bypass
    reason: WinPwn is a PowerShell script usually launched with execution policy bypass
  - id: 30edb182-aa75-42c0-b0a9-e998bb29067c
    name: Potential AMSI Bypass Via .NET Reflection
    reason: WinPwn disables AMSI via reflection before loading offensive scripts
  - id: 02b64f1b-3f33-4e67-aede-ef3b0a5a8fcf
    name: Potential COM Objects Download Cradles Usage - Process Creation
    reason: WinPwn is typically loaded via a PowerShell download cradle from GitHub
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: PowerShell download cradle fetching scripts
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR /.*[Ii][Ee][Xx].*/ OR /.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR /.*[Nn][Ee][Tt]\.[Ww][Ee][Bb][Cc][Ll][Ii][Ee][Nn][Tt].*/)
    pivot_on: host
    window: 2h
  - name: Credential tool strings in command lines
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz].*/ OR /.*[Ll][Aa][Zz][Aa][Gg][Nn][Ee].*/ OR /.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR /.*[Ss][Hh][Aa][Rr][Pp][Dd][Pp][Aa][Pp][Ii].*/)
    pivot_on: host
    window: 6h
  - name: AD recon tools
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ss][Hh][Aa][Rr][Pp][Hh][Oo][Uu][Nn][Dd].*/ OR /.*[Bb][Ll][Oo][Oo][Dd][Hh][Oo][Uu][Nn][Dd].*/ OR /.*[Aa][Dd][Rr][Ee][Cc][Oo][Nn].*/)
    pivot_on: host
    window: 6h
  - name: AMSI and Defender tampering
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Aa][Mm][Ss][Ii][Uu][Tt][Ii][Ll][Ss].*/ OR /.*[Aa][Mm][Ss][Ii][Ii][Nn][Ii][Tt][Ff][Aa][Ii][Ll][Ee][Dd].*/ OR /.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR /.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee][Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg].*/)
    pivot_on: host
    window: 2h
  - name: LSASS access (Sysmon 10)
    query: data_win_system_eventID:10 AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee].*/
    pivot_on: host
    window: 4h
