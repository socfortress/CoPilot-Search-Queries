name: UAC Bypass WSReset
id: 89a9a0e0-f61a-42e5-8957-b1479565a658
version: 1
schema_version: "1.0"
date: "2024-12-01"
author: Christian Burkard (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 89a9a0e0-f61a-42e5-8957-b1479565a658
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the pattern of UAC Bypass via WSReset usable by default sysmon-config.
  MITRE ATT&CK: T1548.002.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\wsreset.exe"
              case_insensitive: true
        - bool:
            should:
              - term:
                  data_win_eventdata_integrityLevel:
                    value: "High"
                    case_insensitive: true
              - term:
                  data_win_eventdata_integrityLevel:
                    value: "System"
                    case_insensitive: true
              - term:
                  data_win_eventdata_integrityLevel:
                    value: "S-1-16-16384"
                    case_insensitive: true
              - term:
                  data_win_eventdata_integrityLevel:
                    value: "S-1-16-12288"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_integrityLevel
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\wsreset.exe'; data_win_eventdata_integrityLevel equals 'High';
  data_win_eventdata_integrityLevel equals 'System', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://lolbas-project.github.io/lolbas/Binaries/Wsreset/
  - https://github.com/hfiref0x/UACME
  - https://medium.com/falconforce/falconfriday-detecting-uac-bypasses-0xff16-86c2a9107abf
  - https://attack.mitre.org/techniques/T1548/002/

response:
  message: >
    UAC Bypass WSReset detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_integrityLevel: $data_win_eventdata_integrityLevel$.
    MITRE ATT&CK: T1548.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_integrityLevel
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1548.002
  custom_tags:
    - bypass
    - wsreset
    - process_creation
    - sysmon
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ww][Ss][Rr][Ee][Ss][Ee][Tt]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_integrityLevel:/[Hh][Ii][Gg][Hh]/ OR data_win_eventdata_integrityLevel:/[Ss][Yy][Ss][Tt][Ee][Mm]/ OR data_win_eventdata_integrityLevel:/[Ss]-1-16-16384/ OR data_win_eventdata_integrityLevel:/[Ss]-1-16-12288/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d797268e-28a9-49a7-b9a8-2f5039011c5c
    name: Bypass UAC via WSReset.exe
    reason: Sibling detection of the same wsreset.exe auto-elevation abuse; co-firing confirms the hijacked AppX shell open command was triggered.
  - id: 152f3630-77c1-4284-bcc0-4cc68ab2f6e7
    name: Shell Open Registry Keys Manipulation
    reason: The wsreset bypass needs a HKCU Classes shell\open\command value written beforehand; this is the precursor registry write.
  - id: 7f741dcf-fc22-4759-87b4-9ae8376676a2
    name: Bypass UAC via Fodhelper.exe
    reason: Operators and UACMe-style tooling try several auto-elevating binaries in sequence; fodhelper is the most common alternate.
  - id: d38d2fa4-98e6-4a24-aff1-410b0c9ad177
    name: HackTool - UACMe Akagi Execution
    reason: UACMe Akagi includes a wsreset method; its execution just before would explain the elevation.
  - id: 178e615d-e666-498b-9630-9ed363038101
    name: Elevated System Shell Spawned From Uncommon Parent Location
    reason: A successful bypass yields a High/System integrity shell from the hijacked wsreset chain.
  - id: de587dce-915e-4218-aac4-835ca6af6f70
    name: Potential Persistence Attempt Via Run Keys Using Reg.EXE
    reason: Once elevated, operators commonly establish persistence with reg.exe Run keys.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Hijacked shell open command or DelegateExecute registry writes
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND data_win_eventdata_targetObject:/.*([Cc]lasses.*[Ss]hell.[Oo]pen.[Cc]ommand|[Aa]pp[Xx]82[Aa]6|[Dd]elegate[Ee]xecute).*/
    pivot_on: host
    window: 1h
  - name: Children spawned by wsreset.exe
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\([wW][sS][rR][eE][sS][eE][tT]\.[eE][xX][eE])/
    pivot_on: host
    window: 1h
  - name: Shells and script hosts at High or System integrity
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([cC][mM][dD]\.[eE][xX][eE]|[pP][oO][wW][eE][rR][sS][hH][eE][lL][lL]\.[eE][xX][eE]|[pP][wW][sS][hH]\.[eE][xX][eE]|[wW][sS][cC][rR][iI][pP][tT]\.[eE][xX][eE]|[cC][sS][cC][rR][iI][pP][tT]\.[eE][xX][eE]|[mM][sS][hH][tT][aA]\.[eE][xX][eE]|[rR][uU][nN][dD][lL][lL]32\.[eE][xX][eE]|[rR][eE][gG][sS][vV][rR]32\.[eE][xX][eE])/ AND (data_win_eventdata_integrityLevel:/[Hh]igh/ OR data_win_eventdata_integrityLevel:/[Ss]ystem/)
    pivot_on: host
    window: 2h
  - name: Defender tampering or exclusions after elevation
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[sS][eE][tT]-[mM][pP][pP][rR][eE][fF][eE][rR][eE][nN][cC][eE].*[dD][iI][sS][aA][bB][lL][eE].*/ OR data_win_eventdata_commandLine:/.*[aA][dD][dD]-[mM][pP][pP][rR][eE][fF][eE][rR][eE][nN][cC][eE].*[eE][xX][cC][lL][uU][sS][iI][oO][nN].*/ OR data_win_eventdata_commandLine:/.*[dD][iI][sS][aA][bB][lL][eE][aA][nN][tT][iI][sS][pP][yY][wW][aA][rR][eE].*/)
    pivot_on: host
    window: 2h
  - name: Autostart persistence written after elevation
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*([Cc]urrent[Vv]ersion.[Rr]un|[Cc]ontrol[Ss]et.*[Ss]ervices).*/
    pivot_on: host
    window: 4h
