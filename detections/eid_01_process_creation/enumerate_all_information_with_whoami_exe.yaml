name: Enumerate All Information With Whoami.EXE
id: c248c896-e412-4279-8c15-1c558067b6fa
version: 1
schema_version: "1.0"
date: "2024-03-05"
author: Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: c248c896-e412-4279-8c15-1c558067b6fa
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of "whoami.exe" with the "/all" flag. MITRE ATT&CK:
  T1033.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\whoami.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "whoami.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -all*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /all*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* –all*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* —all*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* ―all*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\whoami.exe'; data_win_eventdata_originalFileName equals 'whoami.exe';
  data_win_eventdata_commandLine matches '* -all*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://brica.de/alerts/alert/public/1247926/agent-tesla-keylogger-delivered-inside-a-power-iso-daa-archive/
  - https://app.any.run/tasks/7eaba74e-c1ea-400f-9c17-5e30eee89906/
  - https://www.youtube.com/watch?v=DsJ9ByX84o4&t=6s
  - https://attack.mitre.org/techniques/T1033/

response:
  message: >
    Enumerate All Information With Whoami.EXE detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1033
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1033
  custom_tags:
    - enumerate
    - information
    - whoami
    - process_creation
    - sysmon
    - discovery
    - car_2016_03_001
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ww][Hh][Oo][Aa][Mm][Ii]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ww][Hh][Oo][Aa][Mm][Ii]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.* -[Aa][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.* \/[Aa][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.* –[Aa][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.* —[Aa][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.* ―[Aa][Ll][Ll].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: bd8b828d-0dca-48e1-8a63-8a58ecf2644f
    name: Group Membership Reconnaissance Via Whoami.EXE
    reason: 'Same tool in /groups mode: the operator is mapping group membership right after the full /all dump.'
  - id: 97a80ec7-0e2f-4d05-9ef4-65760e634f6b
    name: Security Privileges Enumeration Via Whoami.EXE
    reason: Whoami /priv checks which abusable privileges (SeDebug, SeImpersonate) the token holds, the usual step before escalation.
  - id: 8de1cbe8-d6f5-496d-8237-5f44a721c7a0
    name: Whoami.EXE Execution Anomaly
    reason: Anomalous whoami execution from an unusual parent shows the recon is launched by a script, implant or remote shell.
  - id: 79ce34ca-af29-4d0e-b832-fc1b377020db
    name: Whoami.EXE Execution From Privileged Process
    reason: Whoami spawned from a privileged process suggests a post-exploitation shell running as SYSTEM or a service.
  - id: c30fb093-1109-4dc8-88a8-b30d11c95a5d
    name: Whoami.EXE Execution With Output Option
    reason: Whoami output redirected to a file indicates recon results are being staged for exfiltration or operator review.
  - id: f1086bf7-a0c4-4a37-9102-01e573caf4a0
    name: Renamed Whoami Execution
    reason: A renamed whoami binary means the operator is evading name-based detection of the same enumeration.
  - id: d95de845-b83c-4a9a-8a6a-4fc802ebf6c0
    name: Suspicious Group And Account Reconnaissance Activity Using Net.EXE
    reason: Net.exe group/account recon typically follows whoami /all in the same hands-on-keyboard discovery burst.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other identity and host discovery commands
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:(/.*[Ww]hoami.*/ OR /.*[Nn]et1? +(user|group|localgroup|accounts).*/ OR /.*[Ss]ysteminfo.*/ OR /.*[Qq]uery +user.*/ OR /.*[Nn]ltest.*/)
    pivot_on: host
    window: 1h
  - name: Credential access tooling after recon
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:(/.*[Ll]sass.*/ OR /.*[Mm]imikatz.*/ OR /.*[Ss]ekurlsa.*/ OR /.*[Rr]eg +save +hk.*/ OR /.*[Cc]omsvcs.*[Mm]ini[Dd]ump.*/ OR /.*[Ee]sentutl.*/ OR /.*[Nn]tdsutil.*/)
    pivot_on: host
    window: 4h
  - name: Privilege escalation and remote execution tooling
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:(/.*[Pp]otato.*/ OR /.*[Pp]rint[Ss]poofer.*/ OR /.*[Ss]c +(create|config).*/ OR /.*[Pp]s[Ee]xec.*/)
    pivot_on: host
    window: 2h
  - name: Script or service parent running enumeration
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:(/.*\\(wscript|cscript|mshta|wmiprvse|w3wp|winword|excel|sqlservr)\.exe/) AND data_win_eventdata_commandLine:(/.*[Ww]hoami.*/ OR /.*[Nn]et +(user|group).*/ OR /.*[Ii]pconfig +\/all.*/)
    pivot_on: host
    window: 2h
  - name: Discovery output staged to file
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:(/.*(whoami|systeminfo|ipconfig|net +user|net +group).*>.*/)
    pivot_on: host
    window: 1h
