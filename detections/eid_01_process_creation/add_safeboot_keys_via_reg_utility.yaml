name: Add SafeBoot Keys Via Reg Utility
id: d7662ff6-9e97-4596-a61d-9839e32dee8d
version: 1
schema_version: "1.0"
date: "2024-03-19"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: d7662ff6-9e97-4596-a61d-9839e32dee8d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of "reg.exe" commands with the "add" or "copy" flags on safe
  boot registry keys. Often used by attacker to allow the ransomware to work in
  safe mode as some security products do not. MITRE ATT&CK: T1685.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\reg.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "reg.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*\\\\SYSTEM\\\\CurrentControlSet\\\\Control\\\\SafeBoot*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* copy *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* add *"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches '*\reg.exe';
  data_win_eventdata_originalFileName equals 'reg.exe';
  data_win_eventdata_commandLine matches
  '*\SYSTEM\CurrentControlSet\Control\SafeBoot*', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://redacted.com/blog/bianlian-ransomware-gang-gives-it-a-go/
  - https://attack.mitre.org/techniques/T1685/

response:
  message: >
    Add SafeBoot Keys Via Reg Utility detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1685
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685
  custom_tags:
    - safeboot
    - utility
    - process_creation
    - sysmon
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Rr][Ee][Gg]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Rr][Ee][Gg]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*\\[Ss][Yy][Ss][Tt][Ee][Mm]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Cc][Oo][Nn][Tt][Rr][Oo][Ll][Ss][Ee][Tt]\\[Cc][Oo][Nn][Tt][Rr][Oo][Ll]\\[Ss][Aa][Ff][Ee][Bb][Oo][Oo][Tt].*/ AND (data_win_eventdata_commandLine:/.* [Cc][Oo][Pp][Yy] .*/ OR data_win_eventdata_commandLine:/.* [Aa][Dd][Dd] .*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 1444443e-6757-43e4-9ea4-c8fc705f79a2
    name: Boot Configuration Tampering Via Bcdedit.EXE
    reason: Ransomware prepares a safe-mode reboot with bcdedit alongside SafeBoot registry additions.
  - id: c9fbe8e9-119d-40a6-9b59-dd58a5d84429
    name: Potential Ransomware or Unauthorized MBR Tampering Via Bcdedit.EXE
    reason: Disabling boot recovery is a companion ransomware preparation step.
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: Backup destruction typically accompanies safe-boot persistence before encryption.
  - id: fc0e89b5-adb0-43c1-b749-c12a10ec37de
    name: SafeBoot Registry Key Deleted Via Reg.EXE
    reason: Opposite manipulation of the same SafeBoot key by the same tool; cleanup or alternate tradecraft.
  - id: 8b9606c9-28be-4a38-b146-0e313cc232c1
    name: Potential Ransomware Activity Using LegalNotice Message
    reason: Ransom message shown at logon, set during the same pre-encryption staging.
  - id: 83314318-052a-4c90-a1ad-660ece38d276
    name: Blackbyte Ransomware Registry
    reason: BlackByte registry tweaks occur in the same pre-encryption staging window.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: SafeBoot registry writes
    query: data_win_system_eventID:(12 OR 13 OR 14) AND data_win_eventdata_targetObject:/.*[Cc]ontrol.[Ss]afe[Bb]oot.*/
    pivot_on: host
    window: 6h
  - name: Bcdedit safeboot/recovery and forced reboot
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*[Bb]cdedit.*([Ss]afeboot|[Rr]ecoveryenabled|[Bb]ootstatuspolicy).*/ OR data_win_eventdata_commandLine:/.*[Ss]hutdown.*\/r.*/)
    pivot_on: host
    window: 6h
  - name: Backup and shadow copy destruction
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Vv]ssadmin.*[Dd]elete.*/ OR /.*[Ww]mic.*[Ss]hadowcopy.*[Dd]elete.*/ OR /.*[Ww]badmin.*[Dd]elete.*/ OR /.*[Dd]iskshadow.*/)
    pivot_on: host
    window: 6h
  - name: Security service stops and AV tampering
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ss]c(\.exe)? +(stop|config).*/ OR /.*[Nn]et(\.exe)? +stop.*/ OR /.*[Ss]et-[Mm]p[Pp]reference.*[Dd]isable.*/ OR /.*[Tt]askkill.*\/[Ff].*/)
    pivot_on: host
    window: 6h
  - name: Reg.exe add/copy/delete activity by same actor
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Rr]eg\.exe/ AND data_win_eventdata_commandLine:(/.* [Aa]dd .*/ OR /.* [Cc]opy .*/ OR /.* [Dd]elete .*/)
    pivot_on: host
    window: 2h
