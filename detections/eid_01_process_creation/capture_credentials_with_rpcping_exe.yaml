name: Capture Credentials with Rpcping.exe
id: 93671f99-04eb-4ab4-a161-70d446a84003
version: 1
schema_version: "1.0"
date: "2025-10-31"
author: Julia Fomina, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 93671f99-04eb-4ab4-a161-70d446a84003
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects using Rpcping.exe to send a RPC test connection to the target server
  (-s) and force the NTLM hash to be sent in the process. MITRE ATT&CK: T1003.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\RpcPing.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "\\RpcPing.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-s*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*/s*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*–s*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*—s*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*―s*"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*-u*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*/u*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*–u*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*—u*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*―u*"
                                case_insensitive: true
                        minimum_should_match: 1
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*NTLM*"
                          case_insensitive: true
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*-t*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*/t*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*–t*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*—t*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*―t*"
                                case_insensitive: true
                        minimum_should_match: 1
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*ncacn_np*"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\RpcPing.exe'; data_win_eventdata_originalFileName equals '\RpcPing.exe';
  data_win_eventdata_commandLine matches '*-s*', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://lolbas-project.github.io/lolbas/Binaries/Rpcping/
  - https://twitter.com/vysecurity/status/974806438316072960
  - https://twitter.com/vysecurity/status/873181705024266241
  - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2012-r2-and-2012/hh875578(v=ws.11)
  - https://attack.mitre.org/techniques/T1003/

response:
  message: >
    Capture Credentials with Rpcping.exe detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1003
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003
  custom_tags:
    - capture
    - credentials
    - rpcping
    - process_creation
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Rr][Pp][Cc][Pp][Ii][Nn][Gg]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/\\[Rr][Pp][Cc][Pp][Ii][Nn][Gg]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*-[Ss].*/ OR data_win_eventdata_commandLine:/.*\/[Ss].*/ OR data_win_eventdata_commandLine:/.*–[Ss].*/ OR data_win_eventdata_commandLine:/.*—[Ss].*/ OR data_win_eventdata_commandLine:/.*―[Ss].*/) AND (((data_win_eventdata_commandLine:/.*-[Uu].*/ OR data_win_eventdata_commandLine:/.*\/[Uu].*/ OR data_win_eventdata_commandLine:/.*–[Uu].*/ OR data_win_eventdata_commandLine:/.*—[Uu].*/ OR data_win_eventdata_commandLine:/.*―[Uu].*/) AND data_win_eventdata_commandLine:/.*[Nn][Tt][Ll][Mm].*/) OR ((data_win_eventdata_commandLine:/.*-[Tt].*/ OR data_win_eventdata_commandLine:/.*\/[Tt].*/ OR data_win_eventdata_commandLine:/.*–[Tt].*/ OR data_win_eventdata_commandLine:/.*—[Tt].*/ OR data_win_eventdata_commandLine:/.*―[Tt].*/) AND data_win_eventdata_commandLine:/.*[Nn][Cc][Aa][Cc][Nn]_[Nn][Pp].*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 6c6d9280-e6d0-4b9d-80ac-254701b64916
    name: Potential NTLM Coercion Via Certutil.EXE
    reason: Another forced-outbound NTLM authentication primitive (certutil to UNC/WebDAV); attackers rotate coercion LOLBins on the same host.
  - id: bb76d96b-821c-47cf-944b-7ce377864492
    name: Suspicious NTLM Authentication on the Printer Spooler Service
    reason: Print-spooler NTLM authentication is a sibling coercion technique harvesting the same machine/user hash.
  - id: 12827a56-61a4-476a-a9cb-f3068f191073
    name: HackTool - KrbRelayUp Execution
    reason: KrbRelayUp relays coerced authentication to escalate; captured auth feeds relay tooling.
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: Mimikatz is the usual companion once credential harvesting is underway on the host.
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: LSASS dump via comsvcs is the parallel local credential-theft route.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: RpcPing and other coercion tool runs
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Rr][Pp][Cc][Pp][Ii][Nn][Gg]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Rr][Pp][Cc][Pp][Ii][Nn][Gg]|[Pp][Rr][Ii][Nn][Tt][Ee][Rr][Bb][Uu][Gg]|[Pp][Ee][Tt][Ii][Tt][Pp][Oo][Tt][Aa][Mm]|[Cc][Oo][Ee][Rr][Cc][Ee][Rr]).*/)
    pivot_on: host
    window: 2h
  - name: Outbound SMB/RPC connections
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:"true" AND data_win_eventdata_destinationPort:(445 OR 135 OR 139 OR 593)
    pivot_on: host
    window: 2h
  - name: Credential access tooling
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa]|[Ll][Ss][Aa][Dd][Uu][Mm][Pp]|[Cc][Oo][Mm][Ss][Vv][Cc][Ss]|[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp]|[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]).*/
    pivot_on: host
    window: 4h
  - name: Hash-based lateral movement
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa]::[Pp][Tt][Hh]|[Pp][Ss][Ee][Xx][Ee][Cc]|[Ww][Mm][Ii][Ee][Xx][Ee][Cc]|[Ss][Mm][Bb][Ee][Xx][Ee][Cc]|[Pp][Aa][Ss][Ss]-[Tt][Hh][Ee]-[Hh][Aa][Ss][Hh]).*/
    pivot_on: host
    window: 6h
