name: Arbitrary Binary Execution Using GUP Utility
id: d65aee4d-2292-4cea-b832-83accd6cfa43
version: 1
schema_version: "1.0"
date: "2023-03-02"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: d65aee4d-2292-4cea-b832-83accd6cfa43
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of the Notepad++ updater (gup) to launch other commands or
  executables.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_parentImage:
              value: "*\\\\gup.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\explorer.exe"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_image"
        - exists:
            field: "data_win_eventdata_parentImage"
        - bool:
            must_not:
              - bool:
                  should:
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\explorer.exe"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*\\\\Notepad++\\\\notepad++.exe*"
                                case_insensitive: true
                    - wildcard:
                        data_win_eventdata_parentImage:
                          value: "*\\\\Notepad++\\\\updater\\\\*"
                          case_insensitive: true
                    - bool:
                        must_not:
                          - exists:
                              field: "data_win_eventdata_commandLine"
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\gup.exe'; data_win_eventdata_image matches '*\explorer.exe';
  data_win_eventdata_image matches '*\explorer.exe', among other conditions.

known_false_positives: >
  Other parent binaries using GUP not currently identified. Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://twitter.com/nas_bench/status/1535322445439180803

response:
  message: >
    Arbitrary Binary Execution Using GUP Utility detected on host $agent_name$.
    Matched data_win_eventdata_parentImage: $data_win_eventdata_parentImage$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - arbitrary
    - binary
    - utility
    - process_creation
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Gg][Uu][Pp]\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\.[Ee][Xx][Ee]/ AND _exists_:data_win_eventdata_image AND _exists_:data_win_eventdata_parentImage AND NOT ((data_win_eventdata_image:/.*\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*\\[Nn][Oo][Tt][Ee][Pp][Aa][Dd]\+\+\\[Nn][Oo][Tt][Ee][Pp][Aa][Dd]\+\+\.[Ee][Xx][Ee].*/) OR data_win_eventdata_parentImage:/.*\\[Nn][Oo][Tt][Ee][Pp][Aa][Dd]\+\+\\[Uu][Pp][Dd][Aa][Tt][Ee][Rr]\\.*/ OR NOT _exists_:data_win_eventdata_commandLine)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: bb0e87ce-c89f-4857-84fa-095e4483e9cb
    name: Suspicious Child Process of Notepad++ Updater - GUP.Exe
    reason: Same gup.exe parent abuse; any other child it spawns shows the updater being used as a proxy.
  - id: 0a4f6091-223b-41f6-8743-f322ec84930b
    name: Suspicious GUP Usage
    reason: gup.exe run outside its normal Notepad++ path/context is the typical copied-binary precursor to proxy execution.
  - id: 44143844-0631-49ab-97a0-96387d6b2d7c
    name: File Download Using Notepad++ GUP Utility
    reason: gup.exe download of the payload that is then executed.
  - id: e49b5745-1064-4ac1-9a2e-f687bc2dd37e
    name: Potential DLL Sideloading Of Libcurl.DLL Via GUP.EXE
    reason: A planted libcurl.dll loaded by gup.exe is the alternative code-execution route with the same binary.
  - id: 3b8f4c92-6a51-4d7e-9c3a-8e2d1f5a7b09
    name: Uncommon File Created by Notepad++ Updater Gup.EXE
    reason: Files dropped by gup.exe reveal what payload it fetched and what ran afterwards.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: All gup.exe process activity
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Gg][Uu][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Gg][Uu][Pp]\.[Ee][Xx][Ee]/)
    pivot_on: host
    window: 6h
  - name: Files created by gup.exe
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*\\[Gg][Uu][Pp]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 6h
  - name: Network connections from gup.exe
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\[Gg][Uu][Pp]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 6h
  - name: Shells launched by explorer
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/)
    pivot_on: host
    window: 2h
