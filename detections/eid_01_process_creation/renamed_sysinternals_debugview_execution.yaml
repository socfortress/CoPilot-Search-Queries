name: Renamed SysInternals DebugView Execution
id: cd764533-2e07-40d6-a718-cfeec7f2da7f
version: 1
schema_version: "1.0"
date: "2023-02-14"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: cd764533-2e07-40d6-a718-cfeec7f2da7f
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious renamed SysInternals DebugView execution. MITRE ATT&CK:
  T1588.002.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - term:
            data_win_eventdata_product:
              value: "Sysinternals DebugView"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_originalFileName"
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  must:
                    - term:
                        data_win_eventdata_originalFileName:
                          value: "Dbgview.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\Dbgview.exe"
                          case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_product
    - data_win_eventdata_originalFileName
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_product equals
  'Sysinternals DebugView'; data_win_eventdata_originalFileName equals
  'Dbgview.exe'; data_win_eventdata_image matches '*\Dbgview.exe'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.epicturla.com/blog/sysinturla
  - https://attack.mitre.org/techniques/T1588/002/

response:
  message: >
    Renamed SysInternals DebugView Execution detected on host $agent_name$.
    Matched data_win_eventdata_product: $data_win_eventdata_product$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1588.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_product
      type: other
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1588.002
  custom_tags:
    - renamed
    - sysinternals
    - debugview
    - process_creation
    - sysmon
    - resource_development
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_product:/[Ss][Yy][Ss][Ii][Nn][Tt][Ee][Rr][Nn][Aa][Ll][Ss] [Dd][Ee][Bb][Uu][Gg][Vv][Ii][Ee][Ww]/ AND _exists_:data_win_eventdata_originalFileName AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_originalFileName:/[Dd][Bb][Gg][Vv][Ii][Ee][Ww]\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\[Dd][Bb][Gg][Vv][Ii][Ee][Ww]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 36480ae1-a1cb-4eaa-a0d6-29801d7e9142
    name: Potential Defense Evasion Via Binary Rename
    reason: Generic rename-to-evade; the renamed Dbgview was placed on disk by such a rename/copy.
  - id: 0ba1da6d-b6ce-4366-828c-18826c9de23e
    name: Potential Defense Evasion Via Rename Of Highly Relevant Binaries
    reason: Same masquerading tradecraft; several tools are often renamed in one operator session.
  - id: 79b06761-465f-4f88-9ef2-150e24d3d737
    name: Potential SysInternals ProcDump Evasion
    reason: Another Sysinternals tool abused with evasion; co-occurs when an operator stages the Sysinternals toolkit.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other Sysinternals tools executed
    query: data_win_system_eventID:"1" AND data_win_eventdata_company:/[Ss][Yy][Ss][Ii][Nn][Tt][Ee][Rr][Nn][Aa][Ll][Ss].*/
    pivot_on: host
    window: 4h
  - name: Kernel driver loaded (DebugView kernel capture / BYOVD)
    query: data_win_system_eventID:"6"
    pivot_on: host
    window: 2h
  - name: Executables written to user-writable dirs
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*([Uu]sers|[Pp]rogram[Dd]ata|[Tt]emp|[Pp]ublic).*\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Credential or remote-exec tooling
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Aa]ccepteula|[Ll]sass|[Pp]rocdump|[Mm]imikatz).*/
    pivot_on: host
    window: 4h
