name: Node Process Executions
id: df1f26d3-bea7-4700-9ea2-ad3e990cf90e
version: 1
schema_version: "1.0"
date: "2022-04-06"
author: Max Altgelt (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: df1f26d3-bea7-4700-9ea2-ad3e990cf90e
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of other scripts using the Node executable packaged with
  Adobe Creative Cloud. MITRE ATT&CK: T1127, T1059.007.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\Adobe Creative Cloud Experience\\\\libs\\\\node.exe"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_commandLine"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Adobe Creative Cloud Experience\\\\js*"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches '*\Adobe
  Creative Cloud Experience\libs\node.exe'; data_win_eventdata_commandLine
  matches '*Adobe Creative Cloud Experience\js*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/mttaggart/status/1511804863293784064
  - https://attack.mitre.org/techniques/T1127/
  - https://attack.mitre.org/techniques/T1059/007/

response:
  message: >
    Node Process Executions detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1127, T1059.007
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1127
    - T1059.007
  custom_tags:
    - executions
    - process_creation
    - sysmon
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Aa][Dd][Oo][Bb][Ee] [Cc][Rr][Ee][Aa][Tt][Ii][Vv][Ee] [Cc][Ll][Oo][Uu][Dd] [Ee][Xx][Pp][Ee][Rr][Ii][Ee][Nn][Cc][Ee]\\[Ll][Ii][Bb][Ss]\\[Nn][Oo][Dd][Ee]\.[Ee][Xx][Ee]/ AND _exists_:data_win_eventdata_commandLine AND NOT (data_win_eventdata_commandLine:/.*[Aa][Dd][Oo][Bb][Ee] [Cc][Rr][Ee][Aa][Tt][Ii][Vv][Ee] [Cc][Ll][Oo][Uu][Dd] [Ee][Xx][Pp][Ee][Rr][Ii][Ee][Nn][Cc][Ee]\\[Jj][Ss].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 6640f31c-01ad-49b5-beb5-83498a5cd8bd
    name: Potential Arbitrary Code Execution Via Node.EXE
    reason: Generic node.exe code-execution abuse; same proxy-execution idea outside the Adobe path
  - id: 8537c866-072e-460d-bfff-aaf39cbd73d3
    name: Potentially Suspicious Inline JavaScript Execution via NodeJS Binary
    reason: Inline -e JavaScript via node is the usual payload form of this abuse
  - id: 271de298-cc0e-4842-acd8-079a0a99ea65
    name: Windows Suspicious Child Process from Node.js - React2Shell
    reason: Shell/LOLBin children of node mean the script reached command execution
  - id: e5f5c693-52d7-4de5-88ae-afbfbce85595
    name: Unsigned .node File Loaded
    reason: Native addon loaded into node can carry the real payload
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Child processes spawned by node.exe
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Nn][Oo][Dd][Ee]\.[Ee][Xx][Ee].*/
    pivot_on:
    - host
    window: 2h
  - name: Network connections made by the Adobe node.exe
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\[Aa][Dd][Oo][Bb][Ee] [Cc][Rr][Ee][Aa][Tt][Ii][Vv][Ee] [Cc][Ll][Oo][Uu][Dd] [Ee][Xx][Pp][Ee][Rr][Ii][Ee][Nn][Cc][Ee]\\[Ll][Ii][Bb][Ss]\\[Nn][Oo][Dd][Ee]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Executables and scripts written by node.exe
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*\\[Nn][Oo][Dd][Ee]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_targetFilename:/.*\.[Ee][Xx][Ee].*/ OR data_win_eventdata_targetFilename:/.*\.[Dd][Ll][Ll].*/ OR data_win_eventdata_targetFilename:/.*\.[Pp][Ss]1.*/ OR data_win_eventdata_targetFilename:/.*\.[Bb][Aa][Tt].*/ OR data_win_eventdata_targetFilename:/.*\.[Vv][Bb][Ss].*/)
    pivot_on:
    - host
    window: 2h
  - name: Native .node addons loaded by node.exe
    query: data_win_system_eventID:"7" AND data_win_eventdata_image:/.*\\[Nn][Oo][Dd][Ee]\.[Ee][Xx][Ee]/ AND data_win_eventdata_imageLoaded:/.*\.[Nn][Oo][Dd][Ee].*/
    pivot_on:
    - host
    window: 2h
  - name: Autostart registry writes by node.exe
    query: data_win_system_eventID:"13" AND data_win_eventdata_image:/.*\\[Nn][Oo][Dd][Ee]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 4h
