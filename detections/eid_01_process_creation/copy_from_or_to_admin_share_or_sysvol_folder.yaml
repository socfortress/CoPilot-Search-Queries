name: Copy From Or To Admin Share Or Sysvol Folder
id: 855bc8b5-2ae8-402e-a9ed-b889e6df1900
version: 1
schema_version: "1.0"
date: "2025-10-22"
author: Florian Roth (Nextron Systems), oscd.community, Teymur Kheirkhabarov @HeirhabarovT, Zach Stanford @svch0st, Nasreddine Bencherchali
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 855bc8b5-2ae8-402e-a9ed-b889e6df1900
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a copy command or a copy utility execution to or from an Admin share
  or remote. MITRE ATT&CK: T1039, T1048, T1021.002.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine: "*\\\\\\\\*\\\\*$*"
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Sysvol\\\\*"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\robocopy.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\xcopy.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "robocopy.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "XCOPY.EXE"
                    case_insensitive: true
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\cmd.exe"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_originalFileName:
                                value: "Cmd.Exe"
                                case_insensitive: true
                        minimum_should_match: 1
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*copy*"
                          case_insensitive: true
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\powershell_ise.exe*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\powershell.exe*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\pwsh.exe*"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_originalFileName:
                                value: "powershell_ise.exe"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_originalFileName:
                                value: "PowerShell.EXE"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_originalFileName:
                                value: "pwsh.dll"
                                case_insensitive: true
                        minimum_should_match: 1
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*copy-item*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*copy *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*cpi *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* cp *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*move *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* move-item*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* mi *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* mv *"
                                case_insensitive: true
                        minimum_should_match: 1
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*\\*\*$*'; data_win_eventdata_commandLine matches '*\Sysvol\*';
  data_win_eventdata_image matches '*\robocopy.exe', among other conditions.

known_false_positives: >
  Administrative scripts. Baseline expected activity in your environment and
  tune this detection before relying on it for automated response.

references:
  - https://twitter.com/SBousseaden/status/1211636381086339073
  - https://drive.google.com/file/d/1lKya3_mLnR3UQuCoiYruO3qgu052_iS_/view
  - https://www.elastic.co/guide/en/security/current/remote-file-copy-to-a-hidden-share.html
  - https://www.microsoft.com/en-us/security/blog/2022/10/18/defenders-beware-a-case-for-post-ransomware-investigations/
  - https://attack.mitre.org/techniques/T1039/
  - https://attack.mitre.org/techniques/T1048/
  - https://attack.mitre.org/techniques/T1021/002/

response:
  message: >
    Copy From Or To Admin Share Or Sysvol Folder detected on host $agent_name$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1039, T1048, T1021.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1039
    - T1048
    - T1021.002
  custom_tags:
    - admin
    - share
    - sysvol
    - process_creation
    - sysmon
    - lateral_movement
    - collection
    - exfiltration
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*\\\\.*\\.*\$.*/ OR data_win_eventdata_commandLine:/.*\\[Ss][Yy][Ss][Vv][Oo][Ll]\\.*/) AND (data_win_eventdata_image:/.*\\[Rr][Oo][Bb][Oo][Cc][Oo][Pp][Yy]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Xx][Cc][Oo][Pp][Yy]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Rr][Oo][Bb][Oo][Cc][Oo][Pp][Yy]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Xx][Cc][Oo][Pp][Yy]\.[Ee][Xx][Ee]/ OR ((data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Cc][Mm][Dd]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Cc][Oo][Pp][Yy].*/) OR ((data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]_[Ii][Ss][Ee]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_originalFileName:/[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]_[Ii][Ss][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Pp][Ww][Ss][Hh]\.[Dd][Ll][Ll]/) AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Pp][Yy]-[Ii][Tt][Ee][Mm].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Pp][Yy] .*/ OR data_win_eventdata_commandLine:/.*[Cc][Pp][Ii] .*/ OR data_win_eventdata_commandLine:/.* [Cc][Pp] .*/ OR data_win_eventdata_commandLine:/.*[Mm][Oo][Vv][Ee] .*/ OR data_win_eventdata_commandLine:/.* [Mm][Oo][Vv][Ee]-[Ii][Tt][Ee][Mm].*/ OR data_win_eventdata_commandLine:/.* [Mm][Ii] .*/ OR data_win_eventdata_commandLine:/.* [Mm][Vv] .*/)))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: ea011323-7045-460b-b2d7-0f7442ea6b38
    name: Potential PsExec Remote Execution
    reason: PsExec copies its service binary to ADMIN$; same share used for lateral tooling
  - id: fdfcbd78-48f1-4a4b-90ac-d82241e368c5
    name: PsExec Service Execution
    reason: PsExec service execution on the target is what runs after a payload lands on ADMIN$
  - id: 730fc21b-eaff-474b-ad23-90fd265d4988
    name: Psexec Execution
    reason: Psexec execution is the usual launcher for binaries just copied over admin shares
  - id: d6e464e4-5c6a-474e-82d2-aed616a3a492
    name: Impacket Lateral Movement WMIExec Commandline Parameters
    reason: Impacket wmiexec lateral movement frequently follows file staging over admin shares
  - id: bb3c1bac-6bdf-4aa0-8dc9-068b8b712a76
    name: Impacket Lateral Movement smbexec CommandLine Parameters
    reason: Impacket smbexec uses admin share access and service creation after copy
  - id: 044ba588-dff4-4918-9808-3f95e8160606
    name: Copy .DMP/.DUMP Files From Remote Share Via Cmd.EXE
    reason: Copying dump files from a remote share is the credential-theft collection variant of this behaviour
  - id: ec570e53-4c76-45a9-804d-dc3f355ff7a7
    name: 7Zip Compressing Dump Files
    reason: Data staged from shares is commonly compressed before exfiltration
  - id: fd877b94-9bb5-4191-bb25-d79cbd93c167
    name: Dumping of Sensitive Hives Via Reg.EXE
    reason: Registry hive dumps are often copied to shares for offline cracking
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Remote execution tooling after share copy
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Pp][Ss][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]|[Pp][Ss][Ee][Xx][Ee][Ss][Vv][Cc]\.[Ee][Xx][Ee]|[Pp][Aa][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee])/ OR data_win_eventdata_commandLine:/.*([Ww][Mm][Ii][Ee][Xx][Ee][Cc]|[Ss][Mm][Bb][Ee][Xx][Ee][Cc]|[Ii][Nn][Vv][Oo][Kk][Ee]-[Cc][Oo][Mm][Mm][Aa][Nn][Dd]|[Nn][Ee][Ww]-[Pp][Ss][Ss][Ee][Ss][Ss][Ii][Oo][Nn]).*/)
    pivot_on: host
    window: 4h
  - name: Share mapping and enumeration
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Nn][Ee][Tt]\.[Ee][Xx][Ee]|[Nn][Ee][Tt]1\.[Ee][Xx][Ee]|[Cc][Mm][Dd]\.[Ee][Xx][Ee]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee])/ AND data_win_eventdata_commandLine:/.*([Nn][Ee][Tt] [Uu][Ss][Ee]|[Nn][Ee][Tt] [Vv][Ii][Ee][Ww]|[Nn][Ee][Ww]-[Pp][Ss][Dd][Rr][Ii][Vv][Ee]).*/
    pivot_on: host
    window: 4h
  - name: Remote service or scheduled task creation
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Ss][Cc]\.[Ee][Xx][Ee]|[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee])/ AND data_win_eventdata_commandLine:/.*([Cc][Rr][Ee][Aa][Tt][Ee]|\\\\\\\\).*/
    pivot_on: host
    window: 4h
  - name: Archive and exfiltration tooling on staged data
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\(7[Zz]\.[Ee][Xx][Ee]|[Rr][Aa][Rr]\.[Ee][Xx][Ee]|[Ww][Ii][Nn][Rr][Aa][Rr]\.[Ee][Xx][Ee]|[Rr][Cc][Ll][Oo][Nn][Ee]\.[Ee][Xx][Ee]|[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]|[Tt][Aa][Rr]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 6h
  - name: Sensitive hive or NTDS handling
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt]|[Ss][Aa][Vv][Ee] [Hh][Kk][Ll][Mm]\\[Ss][Aa][Mm]|[Ss][Aa][Vv][Ee] [Hh][Kk][Ll][Mm]\\[Ss][Yy][Ss][Tt][Ee][Mm]|[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn]|[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll]).*/
    pivot_on: host
    window: 6h
