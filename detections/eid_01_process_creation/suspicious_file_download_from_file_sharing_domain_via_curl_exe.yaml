entdata_commandLine:/.*[Pp][Ii][Xx][Ee][Ll][Dd][Rr][Aa][Ii][Nn]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_commandLine:/.*[Pp][Rr][Ii][Vv][Aa][Tt][Ll][Aa][Bb]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_commandLine:/.*[Pp][Rr][Ii][Vv][Aa][Tt][Ll][Aa][Bb]\.[Nn][Ee][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Nn][Dd]\.[Ee][Xx][Pp][Ll][Oo][Ii][Tt]\.[Ii][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Nn][Dd][Ss][Pp][Aa][Cc][Ee]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_commandLine:/.*[Ss][Tt][Oo][Rr][Aa][Gg][Ee]\.[Gg][Oo][Oo][Gg][Ll][Ee][Aa][Pp][Ii][Ss]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_commandLine:/.*[Ss][Tt][Oo][Rr][Jj][Ss][Hh][Aa][Rr][Ee]\.[Ii][Oo].*/ OR data_win_eventdata_commandLine:/.*[Ss][Uu][Pp][Aa][Bb][Aa][Ss][Ee]\.[Cc][Oo].*/ OR data_win_eventdata_commandLine:/.*[Tt][Ee][Mm][Pp]\.[Ss][Hh].*/ OR data_win_eventdata_commandLine:/.*[Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr]\.[Ss][Hh].*/ OR data_win_eventdata_commandLine:/.*[Tt][Rr][Yy][Cc][Ll][Oo][Uu][Dd][Ff][Ll][Aa][Rr][Ee]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_commandLine:/.*[Uu][Ff][Ii][Ll][Ee]\.[Ii][Oo].*/ OR data_win_eventdata_commandLine:/.*[Ww]3[Ss][Pp][Aa][Cc][Ee][Ss]\.[Cc][Oo][Mm].*/ OR data_win_eventdata_commandLine:/.*[Ww][Oo][Rr][Kk][Ee][Rr][Ss]\.[Dd][Ee][Vv].*/ OR data_win_eventdata_commandLine:/.*[Xx]0\.[Aa][Tt].*/) AND data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp].*/ AND (data_win_eventdata_commandLine:/.* -[Oo].*/ OR data_win_eventdata_commandLine:/.*--[Rr][Ee][Mm][Oo][Tt][Ee]-[Nn][Aa][Mm][Ee].*/ OR data_win_eventdata_commandLine:/.*--[Oo][Uu][Tt][Pp][Uu][Tt].*/) AND (data_win_eventdata_commandLine:/.*\.[Pp][Ss]1/ OR data_win_eventdata_commandLine:/.*\.[Pp][Ss]1'/ OR data_win_eventdata_commandLine:/.*\.[Pp][Ss]1\"/ OR data_win_eventdata_commandLine:/.*\.[Dd][Aa][Tt]/ OR data_win_eventdata_commandLine:/.*\.[Dd][Aa][Tt]'/ OR data_win_eventdata_commandLine:/.*\.[Dd][Aa][Tt]\"/ OR data_win_eventdata_commandLine:/.*\.[Mm][Ss][Ii]/ OR data_win_eventdata_commandLine:/.*\.[Mm][Ss][Ii]'/ OR data_win_eventdata_commandLine:/.*\.[Mm][Ss][Ii]\"/ OR data_win_eventdata_commandLine:/.*\.[Bb][Aa][Tt]/ OR data_win_eventdata_commandLine:/.*\.[Bb][Aa][Tt]'/ OR data_win_eventdata_commandLine:/.*\.[Bb][Aa][Tt]\"/ OR data_win_eventdata_commandLine:/.*\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*\.[Ee][Xx][Ee]'/ OR data_win_eventdata_commandLine:/.*\.[Ee][Xx][Ee]\"/ OR data_win_eventdata_commandLine:/.*\.[Vv][Bb][Ss]/ OR data_win_eventdata_commandLine:/.*\.[Vv][Bb][Ss]'/ OR data_win_eventdata_commandLine:/.*\.[Vv][Bb][Ss]\"/ OR data_win_eventdata_commandLine:/.*\.[Vv][Bb][Ee]/ OR data_win_eventdata_commandLine:/.*\.[Vv][Bb][Ee]'/ OR data_win_eventdata_commandLine:/.*\.[Vv][Bb][Ee]\"/ OR data_win_eventdata_commandLine:/.*\.[Hh][Tt][Aa]/ OR data_win_eventdata_commandLine:/.*\.[Hh][Tt][Aa]'/ OR data_win_eventdata_commandLine:/.*\.[Hh][Tt][Aa]\"/ OR data_win_eventdata_commandLine:/.*\.[Dd][Ll][Ll]/ OR data_win_eventdata_commandLine:/.*\.[Dd][Ll][Ll]'/ OR data_win_eventdata_commandLine:/.*\.[Dd][Ll][Ll]\"/ OR data_win_eventdata_commandLine:/.*\.[Pp][Ss][Mm]1/ OR data_win_eventdata_commandLine:/.*\.[Pp][Ss][Mm]1'/ OR data_win_eventdata_commandLine:/.*\.[Pp][Ss][Mm]1\"/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 21dd6d38-2b18-4453-9404-a0fe4a0cc288
    name: Curl Download And Execute Combination
    reason: Same curl use chained directly into execution of the fetched file
  - id: e218595b-bbe7-4ee5-8a96-f32a24ad3468
    name: Suspicious Curl.EXE Download
    reason: Sibling download detection for the same transfer pattern; co-fires when URL and output path both look malicious
  - id: a6a39bdb-935c-4f0a-ab77-35f4bbf44d33
    name: Potentially Suspicious Powershell Script Execution From Temp Folder
    reason: Downloaded .ps1 payloads are typically executed from Temp next
  - id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
    name: PowerShell Download and Execution Cradles
    reason: Parallel or follow-on download-and-execute stage using PowerShell
  - id: de587dce-915e-4218-aac4-835ca6af6f70
    name: Potential Persistence Attempt Via Run Keys Using Reg.EXE
    reason: Downloaded payload commonly persists via a Run key
  - id: 8a8379b8-780b-4dbf-b1e9-31c8d112fefb
    name: Schtasks From Suspicious Folders
    reason: Scheduled task pointing at the downloaded file
  - id: 17769c90-230e-488b-a463-e05c08e9d48f
    name: Powershell Defender Exclusion
    reason: Attackers exclude the drop folder before running the download
  - id: 69bd9b97-2be2-41b6-9816-fb08757a4d1a
    name: Potentially Suspicious Execution From Parent Process In Public Folder
    reason: Downloaded binary run from the Public folder spawns children
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: All curl executions on this host (other URLs and outputs)
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: DNS lookups by curl (file-sharing domain resolution)
    query: data_win_system_eventID:"22" AND data_win_eventdata_image:/.*\\[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 2h
  - name: Executables and scripts created in user-writable paths (downloaded file landing)
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\([Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]|[Tt][Ee][Mm][Pp]|[Pp][Uu][Bb][Ll][Ii][Cc]|[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]|[Aa][Pp][Pp][Dd][Aa][Tt][Aa])\\.*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Pp][Ss]1|[Bb][Aa][Tt]|[Vv][Bb][Ss]|[Hh][Tt][Aa]|[Mm][Ss][Ii])/
    pivot_on:
    - host
    window: 2h
  - name: Execution of binaries from staging paths (downloaded payload running)
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]|[Tt][Ee][Mm][Pp]|[Pp][Uu][Bb][Ll][Ii][Cc]|[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]|[Aa][Pp][Pp][Dd][Aa][Tt][Aa])\\.*\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 4h
  - name: Persistence written after the download (Run keys, services)
