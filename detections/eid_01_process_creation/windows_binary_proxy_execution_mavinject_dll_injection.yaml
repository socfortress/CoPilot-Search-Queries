name: Windows Binary Proxy Execution Mavinject DLL Injection
id: Windows-Binary-Proxy-Execution-Mavinject-DLL-Injection
version: 9
schema_version: 1
date: '2025-05-02'
author: SOCFortress LLC
status: production
type: TTP
description: >
  Detects the execution of mavinject.exe with DLL injection arguments such as
  /INJECTRUNNING or /HMODULE. Mavinject.exe is a signed Microsoft binary (LOLBAS)
  that can inject arbitrary DLLs into running processes, making it a common tool
  for malware deployment, defense evasion, and persistence. Abused by threat actors
  to execute unsigned code under the cover of a trusted Windows binary.
  MITRE ATT&CK: T1218.013 (System Binary Proxy Execution: Mavinject).

data_source:
  - Sysmon EventID 1 (ProcessCreate)

search:
  query:
    bool:
      must:
        - term:
            agent_name: "AGENT_NAME"
        - term:
            agent_labels_customer: "CUSTOMER_CODE"
        - term:
            data_win_system_eventID: "1"
        - wildcard:
            data_win_eventdata_image: "*\\mavinject.exe"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine: "*injectrunning*"
              - wildcard:
                  data_win_eventdata_commandLine: "*hmodule=0x*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "START_TIME"
              lte: "END_TIME"

parameters:
  - name: AGENT_NAME
    default: "DESKTOP-AM0HLGE"
  - name: CUSTOMER_CODE
    default: "lab"
  - name: START_TIME
    default: "now-24h"
  - name: END_TIME
    default: "now"

how_to_implement: >
  Requires Sysmon EventID 1 (ProcessCreate) flowing to the Wazuh Indexer.
  Validated on DESKTOP-AM0HLGE with mavinject.exe called with /INJECTRUNNING
  from PowerShell. Confirmed field names: data_win_eventdata_image,
  data_win_eventdata_commandLine, data_win_eventdata_parentImage,
  data_win_eventdata_user.

known_false_positives: >
  Legitimate use of mavinject.exe is rare outside of specific Microsoft tooling
  scenarios. Filter on data_win_eventdata_parentImage or DLL path if noise is
  observed. Any use with /INJECTRUNNING or /HMODULE pointing to non-system DLL
  paths should be treated as high priority.

references:
  - https://attack.mitre.org/techniques/T1218/013/
  - https://posts.specterops.io/mavinject-exe-functionality-deconstructed-c29ab2cf5c0e
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1218/T1218.md#atomic-test-1---mavinject---inject-dll-into-running-process

response:
  message: >
    mavinject.exe executed with DLL injection arguments on $agent_name$.
    Command line: $data_win_eventdata_commandLine$.
    Parent process: $data_win_eventdata_parentImage$.
    User: $data_win_eventdata_user$.
    Possible DLL injection into a running process. MITRE ATT&CK: T1218.013
  risk_score: 49
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 49
    - field: data_win_eventdata_user
      type: user
      score: 49
  threat_objects:
    - field: data_win_eventdata_image
      type: process_name

tags:
  analytic_story:
    - Living Off The Land
    - Defense Evasion
    - Process Injection
  asset_type: Endpoint
  mitre_attack_id:
    - T1218.013
  custom_tags:
    - mavinject
    - dll_injection
    - lolbas
    - process_injection
  product:
    - Wazuh
  security_domain: endpoint

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 4f73421b-5a0b-4bbf-a892-5a7fb99bea66
    name: Mavinject Inject DLL Into Running Process
    reason: Sigma sibling for the same /INJECTRUNNING behavior; corroborates the injection from a differently-scoped rule
  - id: e6474a1b-5390-49cd-ab41-8d88655f7394
    name: Renamed Mavinject.EXE Execution
    reason: Attackers rename mavinject.exe to evade name-based rules; renamed use means injection here may be wider
  - id: 744a188b-0415-4792-896f-11ddb0588dbc
    name: Potential Process Injection Via Msra.EXE
    reason: Alternative signed-binary injection an operator may try if mavinject is blocked
  - id: 148431ce-4b70-403d-8525-fcc2993f29ea
    name: Potential DLL Injection Or Execution Using Tracker.exe
    reason: Another LOLBin DLL injection primitive used for the same purpose
  - id: 0f6da907-5854-4be6-859a-e9958747b0aa
    name: Potential DLL Injection Via AccCheckConsole
    reason: Another LOLBin DLL injection primitive from the same family
  - id: b27077d6-23e6-45d2-81a0-e2b356eea5fd
    name: Use of TTDInject.exe
    reason: Another signed Microsoft injector; co-occurring use shows an injection toolkit being tried
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Remote thread or process access from mavinject
    query: (data_win_system_eventID:"8" OR data_win_system_eventID:"10") AND data_win_eventdata_sourceImage:/.*([Mm][Aa][Vv][Ii][Nn][Jj][Ee][Cc][Tt]).*/
    pivot_on: host
    window: 2h
  - name: Mavinject executed under any name or argument
    query: data_win_system_eventID:"1" AND (data_win_eventdata_originalFileName:/.*([Mm][Aa][Vv][Ii][Nn][Jj][Ee][Cc][Tt]).*/ OR data_win_eventdata_commandLine:/.*([Mm][Aa][Vv][Ii][Nn][Jj][Ee][Cc][Tt]|[Ii][Nn][Jj][Ee][Cc][Tt][Rr][Uu][Nn][Nn][Ii][Nn][Gg]|[Hh][Mm][Oo][Dd][Uu][Ll][Ee]=0[Xx]).*/)
    pivot_on: host
    window: 2h
  - name: DLL dropped into user-writable path
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(\\[Tt][Ee][Mm][Pp]\\|\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\|\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\|\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\|\\[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]\\).*/ AND data_win_eventdata_targetFilename:/.*(\.[Dd][Ll][Ll]).*/
    pivot_on: host
    window: 2h
  - name: Unsigned DLL loaded from user-writable path
    query: data_win_system_eventID:"7" AND data_win_eventdata_signed:"false" AND data_win_eventdata_imageLoaded:/.*(\\[Tt][Ee][Mm][Pp]\\|\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\|\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\|\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\).*/
    pivot_on: host
    window: 2h
  - name: LSASS access following injection
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\([Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]).*/
    pivot_on: host
    window: 2h
