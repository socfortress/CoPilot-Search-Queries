name: File Recovery From Backup Via Wbadmin.EXE
id: 6fe4aa1e-0531-4510-8be2-782154b73b48
version: 1
schema_version: "1.0"
date: "2024-05-10"
author: Nasreddine Bencherchali (Nextron Systems), frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 6fe4aa1e-0531-4510-8be2-782154b73b48
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the recovery of files from backups via "wbadmin.exe". Attackers can
  restore sensitive files such as NTDS.DIT or Registry Hives from backups in
  order to potentially extract credentials. MITRE ATT&CK: T1490.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\wbadmin.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "WBADMIN.EXE"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* recovery*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*recoveryTarget*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*itemtype:File*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\wbadmin.exe'; data_win_eventdata_originalFileName equals 'WBADMIN.EXE';
  data_win_eventdata_commandLine matches '* recovery*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/wbadmin-start-recovery
  - https://lolbas-project.github.io/lolbas/Binaries/Wbadmin/
  - https://attack.mitre.org/techniques/T1490/

response:
  message: >
    File Recovery From Backup Via Wbadmin.EXE detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1490
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1490
  custom_tags:
    - recovery
    - backup
    - wbadmin
    - process_creation
    - sysmon
    - impact
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ww][Bb][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ww][Bb][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.* [Rr][Ee][Cc][Oo][Vv][Ee][Rr][Yy].*/ AND data_win_eventdata_commandLine:/.*[Rr][Ee][Cc][Oo][Vv][Ee][Rr][Yy][Tt][Aa][Rr][Gg][Ee][Tt].*/ AND data_win_eventdata_commandLine:/.*[Ii][Tt][Ee][Mm][Tt][Yy][Pp][Ee]:[Ff][Ii][Ll][Ee].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 84972c80-251c-4c3a-9079-4f00aad93938
    name: Sensitive File Recovery From Backup Via Wbadmin.EXE
    reason: 'Narrower sibling: recovery of NTDS.dit, SAM or registry hives, which confirms credential-theft intent.'
  - id: 8b93a509-1cb8-42e1-97aa-ee24224cdc15
    name: Sensitive File Dump Via Wbadmin.EXE
    reason: 'Same backup-abuse family: wbadmin used to dump sensitive files rather than restore them.'
  - id: da63bc76-61ae-11eb-ae93-0242ac130002
    name: Ntdsutil Export NTDS
    reason: Alternative route to the same NTDS credential database if wbadmin restore is blocked or incomplete.
  - id: 8bc64091-6875-4881-aaf9-7bd25b5dda08
    name: Suspicious Process Patterns NTDS.DIT Exfil
    reason: Restored NTDS.dit is typically copied or staged with these process patterns next.
  - id: 4e7050dd-e548-483f-b7d6-527ab4fa784d
    name: NTDS.DIT Creation By Uncommon Parent Process
    reason: A recovered ntds.dit appears as a file creation by an unusual process.
  - id: 89f75308-5b1b-4390-b2d8-d6b2340efaf8
    name: Windows Backup Deleted Via Wbadmin.EXE
    reason: Wbadmin is also used by ransomware; the same host may show backup tampering before or after.
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: Attackers who recover data from backups often delete shadow copies afterwards to cover tracks or impair recovery.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Wbadmin invocations on host
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Ww]badmin\.exe/
    pivot_on: host
    window: 6h
  - name: Credential database files created
    query: data_win_system_eventID:11 AND (data_win_eventdata_targetFilename:/.*[Nn][Tt][Dd][Ss]\.dit/ OR data_win_eventdata_targetFilename:/.*\\(SAM|SYSTEM|SECURITY)/)
    pivot_on: host
    window: 6h
  - name: Registry hive save or credential dump commands
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*reg.* save .*(sam|system|security).*/ OR data_win_eventdata_commandLine:/.*[Nn]tdsutil.*/ OR data_win_eventdata_commandLine:/.*[Ss]ecretsdump.*/)
    pivot_on: host
    window: 6h
  - name: Archive and exfil staging
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.* [Aa] .*\.(zip|7z|rar).*/ OR data_win_eventdata_image:/.*\\(curl|rclone|winscp)\.exe/)
    pivot_on: host
    window: 4h
