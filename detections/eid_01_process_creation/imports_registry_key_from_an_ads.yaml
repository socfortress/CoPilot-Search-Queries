name: Imports Registry Key From an ADS
id: 0b80ade5-6997-4b1d-99a1-71701778ea61
version: 1
schema_version: "1.0"
date: "2024-03-13"
author: Oddvar Moe, Sander Wiebing, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 0b80ade5-6997-4b1d-99a1-71701778ea61
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the import of a alternate datastream to the registry with regedit.exe.
  MITRE ATT&CK: T1112.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\regedit.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "REGEDIT.EXE"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* /i *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.reg*"
                    case_insensitive: true
            minimum_should_match: 1
        - regexp:
            data_win_eventdata_commandLine: ".*(:[^ \\\\]).*"
        - exists:
            field: "data_win_eventdata_commandLine"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* -e *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* /e *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* –e *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* —e *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* ―e *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* -a *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* /a *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* –a *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* —a *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* ―a *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* -c *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* /c *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* –c *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* —c *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* ―c *"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\regedit.exe'; data_win_eventdata_originalFileName equals 'REGEDIT.EXE';
  data_win_eventdata_commandLine matches '* /i *', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://lolbas-project.github.io/lolbas/Binaries/Regedit/
  - https://gist.github.com/api0cradle/cdd2d0d0ec9abb686f0e89306e277b8f
  - https://attack.mitre.org/techniques/T1112/

response:
  message: >
    Imports Registry Key From an ADS detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1112
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1112
  custom_tags:
    - imports
    - registry
    - process_creation
    - sysmon
    - persistence
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Rr][Ee][Gg][Ee][Dd][Ii][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Rr][Ee][Gg][Ee][Dd][Ii][Tt]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.* \/[Ii] .*/ OR data_win_eventdata_commandLine:/.*\.[Rr][Ee][Gg].*/) AND data_win_eventdata_commandLine:/.*(:[^ \\]).*/ AND _exists_:data_win_eventdata_commandLine AND NOT (data_win_eventdata_commandLine:/.* -[Ee] .*/ OR data_win_eventdata_commandLine:/.* \/[Ee] .*/ OR data_win_eventdata_commandLine:/.* –[Ee] .*/ OR data_win_eventdata_commandLine:/.* —[Ee] .*/ OR data_win_eventdata_commandLine:/.* ―[Ee] .*/ OR data_win_eventdata_commandLine:/.* -[Aa] .*/ OR data_win_eventdata_commandLine:/.* \/[Aa] .*/ OR data_win_eventdata_commandLine:/.* –[Aa] .*/ OR data_win_eventdata_commandLine:/.* —[Aa] .*/ OR data_win_eventdata_commandLine:/.* ―[Aa] .*/ OR data_win_eventdata_commandLine:/.* -[Cc] .*/ OR data_win_eventdata_commandLine:/.* \/[Cc] .*/ OR data_win_eventdata_commandLine:/.* –[Cc] .*/ OR data_win_eventdata_commandLine:/.* —[Cc] .*/ OR data_win_eventdata_commandLine:/.* ―[Cc] .*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7f43c430-5001-4f8b-aaa9-c3b88f18fa5c
    name: Execute From Alternate Data Streams
    reason: ADS payload staging commonly precedes execution straight from the stream on the same host
  - id: 77946e79-97f1-45a2-84b4-f37b5c0d8682
    name: Suspicious Registry Modification From ADS Via Regini.EXE
    reason: Same registry-import-from-ADS technique via regini.exe; attacker may fall back to it if regedit is blocked
  - id: 73bba97f-a82d-42ce-b315-9182e76c57b1
    name: Imports Registry Key From a File
    reason: Plain regedit import from a file is the non-ADS variant of the same persistence/config tampering
  - id: 62e0298b-e994-4189-bc87-bc699aa62d97
    name: Potential Suspicious Registry File Imported Via Reg.EXE
    reason: Suspicious .reg file import via reg.exe is the sibling path to loading attacker registry content
  - id: de587dce-915e-4218-aac4-835ca6af6f70
    name: Potential Persistence Attempt Via Run Keys Using Reg.EXE
    reason: Imported keys are often Run keys; Run-key persistence via reg.exe confirms the goal
  - id: 45a594aa-1fbd-4972-a809-ff5a99dd81b8
    name: Run PowerShell Script from ADS
    reason: PowerShell run from an ADS indicates the stream-hiding tradecraft is in use on the host
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Regedit/reg import activity
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Rr]eg(edit|ini)?\.exe/ AND (data_win_eventdata_commandLine:/.*[Ii]mport.*/ OR data_win_eventdata_commandLine:/.*\.[Rr][Ee][Gg].*/ OR data_win_eventdata_commandLine:/.* \/[Ii] .*/)
    pivot_on: host
    window: 2h
  - name: Commands referencing alternate data streams
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*[A-Za-z0-9_]:[A-Za-z0-9_$]+.*/ AND data_win_eventdata_commandLine:/.*\.(txt|log|dat|reg|ini).*/
    pivot_on: host
    window: 6h
  - name: File creation of .reg files
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\.[Rr][Ee][Gg].*/
    pivot_on: host
    window: 4h
  - name: Registry Run key / autorun value set
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*(CurrentVersion\\Run|Winlogon|Image File Execution).*/
    pivot_on: host
    window: 4h
  - name: Script/LOLBin execution from user-writable paths
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*(powershell|wscript|cscript|mshta|cmd)\.exe/ AND data_win_eventdata_commandLine:/.*(AppData|Temp|ProgramData|Public).*/
    pivot_on: host
    window: 2h
