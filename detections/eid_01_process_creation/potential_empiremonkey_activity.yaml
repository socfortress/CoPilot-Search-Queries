name: Potential EmpireMonkey Activity
id: 10152a7b-b566-438f-a33c-390b607d1c8d
version: 1
schema_version: "1.0"
date: "2023-03-09"
author: Markus Neis, Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 10152a7b-b566-438f-a33c-390b607d1c8d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects potential EmpireMonkey APT activity. MITRE ATT&CK: T1218.010.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*/e:jscript*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*\\\\Local\\\\Temp\\\\Errors.bat*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*/e:jscript*'; data_win_eventdata_commandLine matches
  '*\Local\Temp\Errors.bat*'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://securelist.com/fin7-5-the-infamous-cybercrime-rig-fin7-continues-its-activities/90703/
  - https://malpedia.caad.fkie.fraunhofer.de/actor/anthropoid_spider
  - https://attack.mitre.org/techniques/T1218/010/

response:
  message: >
    Potential EmpireMonkey Activity detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1218.010
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218.010
  custom_tags:
    - empiremonkey
    - process_creation
    - sysmon
    - stealth
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*\/[Ee]:[Jj][Ss][Cc][Rr][Ii][Pp][Tt].*/ AND data_win_eventdata_commandLine:/.*\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\[Ee][Rr][Rr][Oo][Rr][Ss]\.[Bb][Aa][Tt].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 002f1e24-146e-11ec-a470-acde48001122
    name: Jscript Execution Using Cscript App
    reason: 'Co-occurring: cscript executing JScript is the engine EmpireMonkey invokes with /e:jscript'
  - id: 99b7460d-c9f1-40d7-a316-1f36f61d52ee
    name: Cscript/Wscript Uncommon Script Extension Execution
    reason: 'Co-occurring: cscript/wscript running scripts with uncommon extensions'
  - id: b6676963-0353-4f88-90f5-36c20d443c6a
    name: Cscript/Wscript Potentially Suspicious Child Process
    reason: 'Follow-on: scripts spawn suspicious children after the JScript stage'
  - id: cea72823-df4d-4567-950c-0b579eaf0846
    name: Potential Dropper Script Execution Via WScript/CScript/MSHTA
    reason: 'Co-occurring: script host executing files from Temp directories'
  - id: b89919ed-fe5f-492c-b139-95dbb162039e
    name: Detect Use of cmd exe to Launch Script Interpreters
    reason: 'Precursor: cmd launching script interpreters leads to the cscript call'
  - id: dc64d064-d346-11eb-8588-acde48001122
    name: Execute Javascript With Jscript COM CLSID
    reason: 'Related technique: JScript execution through COM CLSID as alternate engine path'
  - id: de587dce-915e-4218-aac4-835ca6af6f70
    name: Potential Persistence Attempt Via Run Keys Using Reg.EXE
    reason: 'Follow-on: persistence via Run key after the implant stage'
  - id: c248c896-e412-4279-8c15-1c558067b6fa
    name: Enumerate All Information With Whoami.EXE
    reason: 'Follow-on: operators profile host and user right after initial JScript execution'
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Errors.bat creation and execution
    query: (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Ee][Rr][Rr][Oo][Rr][Ss].[Bb][Aa][Tt].*/) OR (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Ee][Rr][Rr][Oo][Rr][Ss].[Bb][Aa][Tt]/)
    pivot_on: host
    window: 2h
  - name: Script hosts spawning shell or LOLBins
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\([Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt])\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Cc][Mm][Dd]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Rr][Uu][Nn][Dd][Ll][Ll]32|[Mm][Ss][Hh][Tt][Aa]|[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll])\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Cscript or wscript outbound connections
    query: data_win_system_eventID:"3" AND data_win_eventdata_initiated:"true" AND data_win_eventdata_image:/.*\\([Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt])\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 4h
  - name: Files dropped in Temp by script hosts
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*\\([Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt])\.[Ee][Xx][Ee]/ AND data_win_eventdata_targetFilename:/.*\\[Tt][Ee][Mm][Pp]\\.*/
    pivot_on: host
    window: 2h
  - name: Host discovery commands from cmd
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\([Cc][Mm][Dd])\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Ww][Hh][Oo][Aa][Mm][Ii]|[Ss][Yy][Ss][Tt][Ee][Mm][Ii][Nn][Ff][Oo]|[Nn][Ee][Tt]|[Nn][Ee][Tt]1|[Ii][Pp][Cc][Oo][Nn][Ff][Ii][Gg]|[Nn][Ll][Tt][Ee][Ss][Tt])\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 4h
