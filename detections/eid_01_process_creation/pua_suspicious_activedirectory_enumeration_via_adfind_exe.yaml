name: PUA - Suspicious ActiveDirectory Enumeration Via AdFind.EXE
id: 455b9d50-15a1-4b99-853f-8d37655a4c1b
version: 1
schema_version: "1.0"
date: "2023-03-05"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 455b9d50-15a1-4b99-853f-8d37655a4c1b
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects active directory enumeration activity using known AdFind CLI flags.
  MITRE ATT&CK: T1087.002.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*lockoutduration*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*lockoutthreshold*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*lockoutobservationwindow*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*maxpwdage*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*minpwdage*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*minpwdlength*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*pwdhistorylength*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*pwdproperties*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-sc admincountdmp*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-sc exchaddresses*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*lockoutduration*'; data_win_eventdata_commandLine matches
  '*lockoutthreshold*'; data_win_eventdata_commandLine matches
  '*lockoutobservationwindow*', among other conditions.

known_false_positives: >
  Authorized administrative activity. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://www.joeware.net/freetools/tools/adfind/
  - https://social.technet.microsoft.com/wiki/contents/articles/7535.adfind-command-examples.aspx
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1087.002/T1087.002.md
  - https://attack.mitre.org/techniques/T1087/002/

response:
  message: >
    PUA - Suspicious ActiveDirectory Enumeration Via AdFind.EXE detected on host
    $agent_name$. Matched data_win_eventdata_commandLine:
    $data_win_eventdata_commandLine$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1087.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1087.002
  custom_tags:
    - activedirectory
    - enumeration
    - adfind
    - process_creation
    - sysmon
    - discovery
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ll][Oo][Cc][Kk][Oo][Uu][Tt][Dd][Uu][Rr][Aa][Tt][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ll][Oo][Cc][Kk][Oo][Uu][Tt][Tt][Hh][Rr][Ee][Ss][Hh][Oo][Ll][Dd].*/ OR data_win_eventdata_commandLine:/.*[Ll][Oo][Cc][Kk][Oo][Uu][Tt][Oo][Bb][Ss][Ee][Rr][Vv][Aa][Tt][Ii][Oo][Nn][Ww][Ii][Nn][Dd][Oo][Ww].*/ OR data_win_eventdata_commandLine:/.*[Mm][Aa][Xx][Pp][Ww][Dd][Aa][Gg][Ee].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Pp][Ww][Dd][Aa][Gg][Ee].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Pp][Ww][Dd][Ll][Ee][Nn][Gg][Tt][Hh].*/ OR data_win_eventdata_commandLine:/.*[Pp][Ww][Dd][Hh][Ii][Ss][Tt][Oo][Rr][Yy][Ll][Ee][Nn][Gg][Tt][Hh].*/ OR data_win_eventdata_commandLine:/.*[Pp][Ww][Dd][Pp][Rr][Oo][Pp][Ee][Rr][Tt][Ii][Ee][Ss].*/ OR data_win_eventdata_commandLine:/.*-[Ss][Cc] [Aa][Dd][Mm][Ii][Nn][Cc][Oo][Uu][Nn][Tt][Dd][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*-[Ss][Cc] [Ee][Xx][Cc][Hh][Aa][Dd][Dd][Rr][Ee][Ss][Ss][Ee][Ss].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 514e7e3e-b3b4-4a67-af60-be20f139198b
    name: PUA - AdFind.EXE Execution
    reason: 'Same tool: image-based detection corroborates the flag-based hit.'
  - id: 9a132afa-654e-11eb-ae93-0242ac130002
    name: PUA - AdFind Suspicious Execution
    reason: Other AdFind abuse patterns on the same host.
  - id: f376c8a7-a2d0-4ddc-aa0c-16c17236d962
    name: HackTool - Bloodhound/Sharphound Execution
    reason: AD attack-path mapping is typically run alongside AdFind.
  - id: 5cc90652-4cbd-4241-aa3b-4b462fa5a248
    name: Potential Recon Activity Via Nltest.EXE
    reason: Domain controller and trust enumeration usually in the same recon burst.
  - id: 1eeed653-dbc8-4187-ad0c-eeebb20e6599
    name: Potential SPN Enumeration Via Setspn.EXE
    reason: Kerberoasting target discovery follows AD enumeration.
  - id: ca387a8e-1c84-4da3-9993-028b45342d30
    name: PUA - SoftPerfect Netscan Execution
    reason: Network scanning pairs with AD recon in ransomware preparation.
  - id: 7ec2c172-dceb-4c10-92c9-87c1881b7e18
    name: HackTool - Rubeus Execution
    reason: Kerberoast/ticket attacks follow once targets and policy are known.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other AD enumeration tooling
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*[Nn]ltest.*(dclist|domain_trusts|dsgetdc).*/ OR data_win_eventdata_commandLine:/.*[Dd]squery.*/ OR data_win_eventdata_commandLine:/.*[Ss]etspn.*/ OR data_win_eventdata_commandLine:/.*[Gg]et-AD(User|Computer|Group|Domain).*/ OR data_win_eventdata_commandLine:/.*[Ss]harp[Hh]ound.*/)
    pivot_on: host
    window: 6h
  - name: Kerberoasting and ticket abuse
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*\\[Rr]ubeus\.exe/ OR data_win_eventdata_commandLine:/.*([Kk]erberoast|asktgs|asreproast|[Rr]equest-[Ss][Pp][Nn][Tt]icket).*/)
    pivot_on: host
    window: 6h
  - name: AdFind output redirected or archived
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*[Aa]dfind.*>.*/ OR data_win_eventdata_image:/.*\\(7z|rar|winrar)\.exe/)
    pivot_on: host
    window: 6h
  - name: Remote execution following recon
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*\\(PsExec|PsExec64|PAExec)\.exe/ OR data_win_eventdata_parentImage:/.*\\(wmiprvse|psexesvc)\.exe/ OR data_win_eventdata_commandLine:/.*[Ww]inrs.*/)
    pivot_on: host
    window: 6h
  - name: Privileged group additions
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*[Nn]et1? +(group|localgroup).*(Domain Admins|Administrators|Enterprise Admins).*\/add.*/
    pivot_on: host
    window: 6h
