                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*account*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*anti-bot*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*botcheck*"
                    case_insensitive: true
