  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Bb][Rr][Aa][Vv][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Cc][Hh][Rr][Oo][Mm][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ff][Ii][Rr][Ee][Ff][Oo][Xx]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Mm][Ss][Ee][Dd][Gg][Ee]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*\#.*/ AND (data_win_eventdata_commandLine:/.*%[Cc][Oo][Mm][Ss][Pp][Ee][Cc]%.*/ OR data_win_eventdata_commandLine:/.*[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn].*/ OR data_win_eventdata_commandLine:/.*[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll].*/ OR data_win_eventdata_commandLine:/.*[Cc][Mm][Dd].*/ OR data_win_eventdata_commandLine:/.*[Cc][Ss][Cc][Rr][Ii][Pp][Tt].*/ OR data_win_eventdata_commandLine:/.*[Cc][Uu][Rr][Ll].*/ OR data_win_eventdata_commandLine:/.*[Ff][Ii][Nn][Gg][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ss][Hh][Tt][Aa].*/ OR data_win_eventdata_commandLine:/.*[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Pp][Ww][Ss][Hh].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Gg][Ss][Vv][Rr]32.*/ OR data_win_eventdata_commandLine:/.*[Rr][Uu][Nn][Dd][Ll][Ll]32.*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ww][Gg][Ee][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ww][Ss][Cc][Rr][Ii][Pp][Tt].*/ OR data_win_eventdata_commandLine:/.*[Aa][Cc][Cc][Oo][Uu][Nn][Tt].*/ OR data_win_eventdata_commandLine:/.*[Aa][Nn][Tt][Ii]-[Bb][Oo][Tt].*/ OR data_win_eventdata_commandLine:/.*[Bb][Oo][Tt][Cc][Hh][Ee][Cc][Kk].*/ OR data_win_eventdata_commandLine:/.*[Cc][Aa][Pp][Tt][Cc][Hh][Aa].*/ OR data_win_eventdata_commandLine:/.*[Cc][Hh][Aa][Ll][Ll][Ee][Nn][Gg][Ee].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Nn][Ff][Ii][Rr][Mm][Aa][Tt][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ff][Rr][Aa][Uu][Dd].*/ OR data_win_eventdata_commandLine:/.*[Hh][Uu][Mm][Aa][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ii][Dd][Ee][Nn][Tt][Ii][Ff][Ii][Cc][Aa][Tt][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ii][Dd][Ee][Nn][Tt][Ii][Ff][Ii][Cc][Aa][Tt][Oo][Rr].*/ OR data_win_eventdata_commandLine:/.*[Ii][Dd][Ee][Nn][Tt][Ii][Tt][Yy].*/ OR data_win_eventdata_commandLine:/.*[Rr][Oo][Bb][Oo][Tt].*/ OR data_win_eventdata_commandLine:/.*[Vv][Aa][Ll][Ii][Dd][Aa][Tt][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*[Vv][Ee][Rr][Ii][Ff][Ii][Cc][Aa][Tt][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*[Vv][Ee][Rr][Ii][Ff][Yy].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d487ed4a-fd24-436d-a0b2-f4e95f7b2635
    name: Suspicious ClickFix/FileFix Execution Pattern
    reason: Sibling ClickFix/FileFix detection; the same lure often fires both.
  - id: 3ae9974a-eb09-4044-8e70-8980a50c12c8
    name: Suspicious Explorer Process with Whitespace Padding - ClickFix/FileFix
    reason: Whitespace-padded explorer command line is the FileFix trick that hides the payload.
  - id: 4fee3d51-8069-4a4c-a0f7-924fcaff2c70
    name: FileFix - Command Evidence in TypedPaths
    reason: TypedPaths registry evidence records the pasted command before the shell spawns.
  - id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
    name: PowerShell Download and Execution Cradles
    reason: The pasted command typically turns into a PowerShell download cradle.
  - id: e6c54d94-498c-4562-a37c-b469d8e9a275
    name: Suspicious PowerShell Download and Execute Pattern
    reason: Follow-on download-and-execute stage of the FileFix payload.
  - id: b9d9cc83-380b-4ba3-8d8f-60c0e7e2930c
    name: Suspicious PowerShell Encoded Command Patterns
    reason: Encoded PowerShell is a frequent form of the pasted payload.
  - id: 9c5037d1-c568-49b3-88c7-9846a5bdc2be
    name: Suspicious Run Key from Download
    reason: Run-key persistence set by a freshly downloaded stager.
  - id: ee18ed37-0802-4268-9435-b3b91aaa18db
    name: PowerShell - Connect To Internet With Hidden Window
    reason: Hidden-window PowerShell that connects out is the usual second stage.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Shell interpreters spawned by browsers
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*(\\[Cc][Hh][Rr][Oo][Mm][Ee].[Ee][Xx][Ee]|\\[Mm][Ss][Ee][Dd][Gg][Ee].[Ee][Xx][Ee]|\\[Ff][Ii][Rr][Ee][Ff][Oo][Xx].[Ee][Xx][Ee]|\\[Bb][Rr][Aa][Vv][Ee].[Ee][Xx][Ee])/ AND data_win_eventdata_image:/.*(\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]|\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 1h
  - name: Download cradles in command lines
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ii][Ww][Rr] .*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt].[Ww][Ee][Bb][Cc][Ll][Ii][Ee][Nn][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ss][Tt][Aa][Rr][Tt]-[Bb][Ii][Tt][Ss][Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr].*/ OR data_win_eventdata_commandLine:/.*[Cc][Uu][Rr][Ll] .*/ OR data_win_eventdata_commandLine:/.*[Ww][Gg][Ee][Tt] .*/ OR data_win_eventdata_commandLine:/.*[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn].*/ OR data_win_eventdata_commandLine:/.*[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll].*/)
    pivot_on: host
    window: 2h
  - name: Executables or scripts written to user-writable dirs
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\|\[Tt][Ee][Mm][Pp]\|\[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]\).*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Pp][Ss]1|[Jj][Ss]|[Hh][Tt][Aa]|[Bb][Aa][Tt])/
    pivot_on: host
    window: 2h
  - name: Run-key autostart registry writes
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\[Rr][Uu][Nn].*/
    pivot_on: host
    window: 4h
  - name: Outbound connections from script interpreters
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*(\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]|\\[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|\\[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 1h
