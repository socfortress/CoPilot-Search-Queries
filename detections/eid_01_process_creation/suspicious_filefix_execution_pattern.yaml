type: TTP

description: >
  Detects suspicious FileFix execution patterns where users are tricked into
  running malicious commands through browser file upload dialog manipulation.
  This attack typically begins when users visit malicious websites impersonating
  legitimate services or news platforms, which may display fake CAPTCHA
  challenges or direct instructions to open file explorer and paste clipboard
  content. The clipboard content usually contains commands that download and
  execute malware, such as information stealing tools. MITRE ATT&CK: T1204.004.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\brave.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\chrome.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\firefox.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\msedge.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine: "*#*"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*%comspec%*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*bitsadmin*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*certutil*"
                    case_insensitive: true
              - wildcard:
