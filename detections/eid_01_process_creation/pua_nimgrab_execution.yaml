name: PUA - Nimgrab Execution
id: 74a12f18-505c-4114-8d0b-8448dd5485c6
version: 1
schema_version: "1.0"
date: "2024-11-23"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 74a12f18-505c-4114-8d0b-8448dd5485c6
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the usage of nimgrab, a tool bundled with the Nim programming
  framework and used for downloading files. MITRE ATT&CK: T1105.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\nimgrab.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*MD5=2DD44C3C29D667F5C0EF5F9D7C7FFB8B*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*SHA256=F266609E91985F0FE3E31C5E8FAEEEC4FFA5E0322D8B6F15FE69F4C5165B9559*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=C07FDDD21D123EA9B3A08EEF44AAAC45*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_hashes
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\nimgrab.exe'; data_win_eventdata_hashes matches
  '*MD5=2DD44C3C29D667F5C0EF5F9D7C7FFB8B*'; data_win_eventdata_hashes matches
  '*SHA256=F266609E91985F0FE3E31C5E8FAEEEC4FFA5E0322D8B6F15FE69F4C5165B9559*',
  among other conditions.

known_false_positives: >
  Legitimate use of Nim on a developer systems. Baseline expected activity in
  your environment and tune this detection before relying on it for automated
  response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/28d190330fe44de6ff4767fc400cc10fa7cd6540/atomics/T1105/T1105.md
  - https://attack.mitre.org/techniques/T1105/

response:
  message: >
    PUA - Nimgrab Execution detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_hashes: $data_win_eventdata_hashes$. MITRE ATT&CK: T1105
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_hashes
      type: file_hash

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1105
  custom_tags:
    - nimgrab
    - process_creation
    - sysmon
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Nn][Ii][Mm][Gg][Rr][Aa][Bb]\.[Ee][Xx][Ee]/ OR data_win_eventdata_hashes:/.*[Mm][Dd]5=2[Dd][Dd]44[Cc]3[Cc]29[Dd]667[Ff]5[Cc]0[Ee][Ff]5[Ff]9[Dd]7[Cc]7[Ff][Ff][Bb]8[Bb].*/ OR data_win_eventdata_hashes:/.*[Ss][Hh][Aa]256=[Ff]266609[Ee]91985[Ff]0[Ff][Ee]3[Ee]31[Cc]5[Ee]8[Ff][Aa][Ee][Ee][Ee][Cc]4[Ff][Ff][Aa]5[Ee]0322[Dd]8[Bb]6[Ff]15[Ff][Ee]69[Ff]4[Cc]5165[Bb]9559.*/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=[Cc]07[Ff][Dd][Dd][Dd]21[Dd]123[Ee][Aa]9[Bb]3[Aa]08[Ee][Ee][Ff]44[Aa][Aa][Aa][Cc]45.*/)

