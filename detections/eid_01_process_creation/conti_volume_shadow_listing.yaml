name: Conti Volume Shadow Listing
id: 7b30e0a7-c675-4b24-8a46-82fa67e2433d
version: 1
schema_version: "1.0"
date: "2021-08-09"
author: Max Altgelt (Nextron Systems), Tobias Michalski (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 7b30e0a7-c675-4b24-8a46-82fa67e2433d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a command used by conti to find volume shadow backups. MITRE ATT&CK:
  T1587.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*vssadmin list shadows*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*log.txt*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*vssadmin list shadows*'; data_win_eventdata_commandLine matches '*log.txt*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/vxunderground/status/1423336151860002816?s=20
  - https://www.virustotal.com/gui/file/03e9b8c2e86d6db450e5eceec057d7e369ee2389b9daecaf06331a95410aa5f8/detection
  - https://attack.mitre.org/techniques/T1587/001/

response:
  message: >
    Conti Volume Shadow Listing detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1587.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1587.001
  custom_tags:
    - conti
    - volume
    - shadow
    - process_creation
    - sysmon
    - resource_development
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn] [Ll][Ii][Ss][Tt] [Ss][Hh][Aa][Dd][Oo][Ww][Ss].*/ AND data_win_eventdata_commandLine:/.*[Ll][Oo][Gg]\.[Tt][Xx][Tt].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 689308fc-cfba-4f72-9897-796c1dc61487
    name: Potential Conti Ransomware Activity
    reason: Same Conti playbook; shadow listing precedes deployment.
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: 'Direct follow-on: after listing backups, ransomware actors delete them.'
  - id: f57f8d16-1f39-4dcb-a604-6c73d9b54b3d
    name: Sensitive File Access Via Volume Shadow Copy Backup
    reason: Listing shadows may precede reading SAM/NTDS from the snapshot.
  - id: c73124a7-3e89-44a3-bdc1-25fe4df754b1
    name: Copy From VolumeShadowCopy Via Cmd.EXE
    reason: Copying files out of the listed shadow is the credential-theft use.
  - id: aa92fd02-09f2-48b0-8a93-864813fb8f41
    name: Conti NTDS Exfiltration Command
    reason: Companion Conti command from the same operator toolkit.
  - id: 2f47f1fd-0901-466e-a770-3b7092834a1b
    name: Potential Conti Ransomware Database Dumping Activity Via SQLCmd
    reason: Conti also dumps databases before encryption.
  - id: 21ff4ca9-f13a-41ad-b828-0077b2af2e40
    name: Deletion of Volume Shadow Copies via WMI with PowerShell
    reason: Alternative backup-destruction method.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Shadow copy enumeration and deletion
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:(/.*[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn].*/ OR /.*[Ss][Hh][Aa][Dd][Oo][Ww][Cc][Oo][Pp][Yy].*/ OR /.*[Ww][Mm][Ii][Cc] [Ss][Hh][Aa][Dd][Oo][Ww][Cc][Oo][Pp][Yy].*/)
    pivot_on: host
    window: 24h
  - name: Recovery inhibition
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:(/.*[Bb][Cc][Dd][Ee][Dd][Ii][Tt].*/ OR /.*[Ww][Bb][Aa][Dd][Mm][Ii][Nn] [Dd][Ee][Ll][Ee][Tt][Ee].*/)
    pivot_on: host
    window: 24h
  - name: Output redirected to log.txt
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*>.*[Ll][Oo][Gg]\.[Tt][Xx][Tt].*/
    pivot_on: host
    window: 6h
  - name: Credential access from snapshots
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:(/.*[Hh][Aa][Rr][Dd][Dd][Ii][Ss][Kk][Vv][Oo][Ll][Uu][Mm][Ee][Ss][Hh][Aa][Dd][Oo][Ww][Cc][Oo][Pp][Yy].*/ OR /.*[Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt].*/ OR /.*[Rr][Ee][Gg] [Ss][Aa][Vv][Ee].*/)
    pivot_on: host
    window: 24h
