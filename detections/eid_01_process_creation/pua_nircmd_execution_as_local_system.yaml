name: PUA - NirCmd Execution As LOCAL SYSTEM
id: d9047477-0359-48c9-b8c7-792cedcdc9c4
version: 1
schema_version: "1.0"
date: "2023-02-13"
author: Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: d9047477-0359-48c9-b8c7-792cedcdc9c4
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the use of NirCmd tool for command execution as SYSTEM user. MITRE
  ATT&CK: T1569.002.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* runassystem *"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches '*
  runassystem *'.

known_false_positives: >
  Legitimate use by administrators. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://www.nirsoft.net/utils/nircmd.html
  - https://www.winhelponline.com/blog/run-program-as-system-localsystem-account-windows/
  - https://www.nirsoft.net/utils/nircmd2.html#using
  - https://attack.mitre.org/techniques/T1569/002/

response:
  message: >
    PUA - NirCmd Execution As LOCAL SYSTEM detected on host $agent_name$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1569.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1569.002
  custom_tags:
    - nircmd
    - local
    - system
    - process_creation
    - sysmon
    - execution
    - s0029
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.* [Rr][Uu][Nn][Aa][Ss][Ss][Yy][Ss][Tt][Ee][Mm] .*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 4e2ed651-1906-4a59-a78a-18220fca1b22
    name: PUA - NirCmd Execution
    reason: Generic NirCmd launches on the same host show the other NirCmd actions (process kill, service control, file ops) around the runassystem use.
  - id: 771d1eb5-9587-4568-95fb-9ec44153a012
    name: PUA - NSudo Execution
    reason: Alternative SYSTEM/TrustedInstaller elevation utility; operators swap tools when one is blocked.
  - id: 7c0dcd3d-acf8-4f71-9570-f448b0034f94
    name: PsExec Service Child Process Execution as LOCAL SYSTEM
    reason: Another route to SYSTEM-context command execution with the same goal.
  - id: 17769c90-230e-488b-a463-e05c08e9d48f
    name: Powershell Defender Exclusion
    reason: 'Typical follow-on: SYSTEM context used to add Defender exclusions before staging payloads.'
  - id: b28e58e4-2a72-4fae-bdee-0fbe904db642
    name: Windows Defender Real-time Protection Disabled
    reason: SYSTEM execution is commonly used to tamper with protected Defender settings.
  - id: 85c312b7-f44d-4a51-a024-d671c40b49fc
    name: Service StartupType Change Via Sc.EXE
    reason: A SYSTEM shell is used to disable or alter security services.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Children spawned via NirCmd runassystem
    query: data_win_system_eventID:1 AND data_win_eventdata_parentCommandLine:/.*[Rr][Uu][Nn][Aa][Ss][Ss][Yy][Ss][Tt][Ee][Mm].*/
    pivot_on: host
    window: 2h
  - name: Defender and security tooling tampering
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR /.*[Aa][Dd][Dd]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR /.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee][Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg].*/ OR /.*[Ss][Cc] [Ss][Tt][Oo][Pp] [Ww][Ii][Nn][Dd][Ee][Ff][Ee][Nn][Dd].*/)
    pivot_on: host
    window: 2h
  - name: NirCmd binary executions on host
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*[Nn][Ii][Rr][Cc][Mm][Dd].*/ OR data_win_eventdata_originalFileName:/.*[Nn][Ii][Rr][Cc][Mm][Dd].*/)
    pivot_on: host
    window: 24h
  - name: New services or scheduled tasks created
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ss][Cc].[Ee][Xx][Ee] [Cc][Rr][Ee][Aa][Tt][Ee].*/ OR /.*[Ss][Cc] [Cc][Rr][Ee][Aa][Tt][Ee].*/ OR /.*[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss] \/[Cc][Rr][Ee][Aa][Tt][Ee].*/ OR /.*[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss].[Ee][Xx][Ee] \/[Cc][Rr][Ee][Aa][Tt][Ee].*/)
    pivot_on: host
    window: 4h
  - name: Files written by NirCmd process
    query: data_win_system_eventID:11 AND data_win_eventdata_image:/.*[Nn][Ii][Rr][Cc][Mm][Dd].*/
    pivot_on: host
    window: 4h
