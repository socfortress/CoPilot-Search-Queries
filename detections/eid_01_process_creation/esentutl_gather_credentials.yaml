name: Esentutl Gather Credentials
id: 7df1713a-1a5b-4a4b-a071-dc83b144a101
version: 1
schema_version: "1.0"
date: "2022-10-09"
author: sam0x90
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 7df1713a-1a5b-4a4b-a071-dc83b144a101
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Conti recommendation to its affiliates to use esentutl to access NTDS dumped
  file. Trickbot also uses this utilities to get MSEdge info via its module
  pwgrab. MITRE ATT&CK: T1003, T1003.003.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*esentutl*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* /p*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*esentutl*'; data_win_eventdata_commandLine matches '* /p*'.

known_false_positives: >
  To be determined. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/vxunderground/status/1423336151860002816
  - https://thedfirreport.com/2021/08/01/bazarcall-to-conti-ransomware-via-trickbot-and-cobalt-strike/
  - https://attack.mitre.org/techniques/T1003/
  - https://attack.mitre.org/techniques/T1003/003/

response:
  message: >
    Esentutl Gather Credentials detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1003,
    T1003.003
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003
    - T1003.003
  custom_tags:
    - esentutl
    - gather
    - credentials
    - process_creation
    - sysmon
    - credential_access
    - s0404
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Ee][Ss][Ee][Nn][Tt][Uu][Tt][Ll].*/ AND data_win_eventdata_commandLine:/.* \/[Pp].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d372f928-ce4f-11eb-a762-acde48001122
    name: Esentutl SAM Copy
    reason: Esentutl copying the SAM is the account-database variant of ESE abuse for credentials.
  - id: 6a69f62d-ce75-4b57-8dce-6351eb55b362
    name: Esentutl Steals Browser Information
    reason: Esentutl against browser databases steals saved credentials with the same binary.
  - id: da63bc76-61ae-11eb-ae93-0242ac130002
    name: Ntdsutil Export NTDS
    reason: Ntdsutil export of NTDS is the alternate route to the same Active Directory credential database.
  - id: 2afafd61-6aae-4df4-baed-139fa1f4c345
    name: Invocation of Active Directory Diagnostic Tool (ntdsutil.exe)
    reason: Ntdsutil invocation indicates the attacker preparing an IFM/NTDS snapshot on a domain controller.
  - id: 8bc64091-6875-4881-aaf9-7bd25b5dda08
    name: Suspicious Process Patterns NTDS.DIT Exfil
    reason: Process patterns of NTDS.dit exfiltration capture the copy and staging of the database.
  - id: 4e7050dd-e548-483f-b7d6-527ab4fa784d
    name: NTDS.DIT Creation By Uncommon Parent Process
    reason: NTDS.dit file creation by an uncommon parent is the file-level result of an esentutl or ntdsutil copy.
  - id: 3a8da4e0-36c1-40d2-8b29-b3e890d5172a
    name: NTDS Exfiltration Filename Patterns
    reason: NTDS exfiltration filename patterns reveal the staged dump output.
  - id: ec570e53-4c76-45a9-804d-dc3f355ff7a7
    name: 7Zip Compressing Dump Files
    reason: Compressing dump files with 7-zip is the staging step before exfiltrating the harvested database.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other ESE and NTDS database access
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:(/.*[Nn]tds\.dit.*/ OR /.*[Nn]tdsutil.*/ OR /.*[Ee]sentutl.* \/[YyMmDd] .*/ OR /.*[Vv]ssadmin.*[Cc]reate.*[Ss]hadow.*/ OR /.*[Dd]iskshadow.*/)
    pivot_on: host
    window: 6h
  - name: Shadow copy or backup based file copy
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:(/.*[Hh]arddisk[Vv]olume[Ss]hadow[Cc]opy.*/ OR /.*[Ww]badmin.*(recovery|start +backup).*/ OR /.*[Ww]mic.*[Ss]hadow[Cc]opy.*/ OR /.*config.*(SAM|SYSTEM|SECURITY).*/)
    pivot_on: host
    window: 6h
  - name: Dump files created on disk
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:(/.*(ntds\.dit|\.dmp|[Ss][Aa][Mm]\.(save|hive)|[Ss]ystem\.(save|hive)|WebCacheV01\.dat).*/)
    pivot_on: host
    window: 6h
  - name: Compression or exfil of staged output
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:(/.*(7z|7za|rar|zip|tar|Compress-Archive).*(ntds|sam|system|dump|dit).*/ OR /.*(curl|bitsadmin|certutil|scp|rclone).*(ntds|sam|dump).*/)
    pivot_on: host
    window: 6h
  - name: Offline credential extraction tools
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:(/.*[Ss]ecretsdump.*/ OR /.*[Mm]imikatz.*/ OR /.*[Ll]sadump.*/ OR /.*[Dd]sinternals.*/ OR /.*[Gg]et-[Bb]oot[Kk]ey.*/ OR /.*[Pp]ypykatz.*/)
    pivot_on: host
    window: 6h
