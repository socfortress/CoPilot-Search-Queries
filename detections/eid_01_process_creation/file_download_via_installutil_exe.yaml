name: File Download Via InstallUtil.EXE
id: 75edd216-1939-4c73-8d61-7f3a0d85b5cc
version: 1
schema_version: "1.0"
date: "2023-11-09"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 75edd216-1939-4c73-8d61-7f3a0d85b5cc
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects use of .NET InstallUtil.exe in order to download arbitrary files. The
  files will be written to "%LOCALAPPDATA%\Microsoft\Windows\INetCache\IE\".
  MITRE ATT&CK: T1218.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\InstallUtil.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "InstallUtil.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*ftp://*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*http://*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*https://*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\InstallUtil.exe'; data_win_eventdata_originalFileName equals
  'InstallUtil.exe'; data_win_eventdata_commandLine matches '*ftp://*', among
  other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/LOLBAS-Project/LOLBAS/pull/239
  - https://attack.mitre.org/techniques/T1218/

response:
  message: >
    File Download Via InstallUtil.EXE detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1218
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218
  custom_tags:
    - download
    - installutil
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*[Ff][Tt][Pp]:\/\/.*/ OR data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp]:\/\/.*/ OR data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp][Ss]:\/\/.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 19b08b1c-861d-4e75-a1ef-ea0c1baf202b
    name: Suspicious Download Via Certutil.EXE
    reason: Interchangeable LOLBin downloader often tried on the same host when another is blocked.
  - id: d059842b-6b9d-4ed1-b5c3-5b89143c6ede
    name: File Download Via Bitsadmin
    reason: Generic sibling firing on the same command; confirms the transfer and its URL.
  - id: 46123129-1024-423e-9fae-43af4a0fa9a5
    name: File Download Via Windows Defender MpCmpRun.EXE
    reason: Peer signed-binary downloader.
  - id: 74babdd6-a758-4549-9632-26535279e654
    name: Suspicious Executable File Creation
    reason: The downloaded payload landing on disk as an executable in a staging location.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: All InstallUtil executions
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 4h
  - name: InstallUtil running assemblies (/U or /logfile)
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*\/([Uu]|[Ll][Oo][Gg][Ff][Ii][Ll][Ee]|[Ll][Oo][Gg][Tt][Oo][Cc][Oo][Nn][Ss][Oo][Ll][Ee]).*/
    pivot_on: host
    window: 4h
  - name: Files created in IE INetCache
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Ii][Nn][Ee][Tt][Cc][Aa][Cc][Hh][Ee]\\[Ii][Ee]\\.*/
    pivot_on: host
    window: 2h
  - name: Other LOLBin downloaders
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Pp][Cc][Mm][Dd][Rr][Uu][Nn]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp].*/
    pivot_on: host
    window: 4h
  - name: Execution from user-writable paths
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\([Cc][Mm][Dd]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Mm][Ss][Hh][Tt][Aa])\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Tt]emp|[Pp]ublic|[Pp]rogram[Dd]ata|[Aa]pp[Dd]ata)\\.*/
    pivot_on: host
    window: 2h
