name: Replace.exe Usage
id: 9292293b-8496-4715-9db6-37028dcda4b3
version: 1
schema_version: "1.0"
date: "2024-03-13"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 9292293b-8496-4715-9db6-37028dcda4b3
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the use of Replace.exe which can be used to replace file with another
  file. MITRE ATT&CK: T1105.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\replace.exe"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-a*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*/a*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*–a*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*—a*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*―a*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\replace.exe'; data_win_eventdata_commandLine matches '*-a*';
  data_win_eventdata_commandLine matches '*/a*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://lolbas-project.github.io/lolbas/Binaries/Replace/
  - https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/replace
  - https://attack.mitre.org/techniques/T1105/

response:
  message: >
    Replace.exe Usage detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1105
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1105
  custom_tags:
    - replace
    - process_creation
    - sysmon
    - command_and_control
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Rr][Ee][Pp][Ll][Aa][Cc][Ee]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*-[Aa].*/ OR data_win_eventdata_commandLine:/.*\/[Aa].*/ OR data_win_eventdata_commandLine:/.*–[Aa].*/ OR data_win_eventdata_commandLine:/.*—[Aa].*/ OR data_win_eventdata_commandLine:/.*―[Aa].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d059842b-6b9d-4ed1-b5c3-5b89143c6ede
    name: File Download Via Bitsadmin
    reason: Other LOLBin file transfer into the host, same ingress-tool-transfer intent
  - id: e7be6119-fc37-43f0-ad4f-1f3f99be2f9f
    name: Copying Sensitive Files with Credential Data
    reason: Copying sensitive files is the exfil-side use of file-moving LOLBins
  - id: 36480ae1-a1cb-4eaa-a0d6-29801d7e9142
    name: Potential Defense Evasion Via Binary Rename
    reason: Rename evasion often accompanies LOLBin file staging
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other LOLBin file transfer
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Cc]ertutil.*(urlcache|verifyctl).*/ OR /.*[Bb]itsadmin.*(transfer|addfile).*/ OR /.*[Ee]xpand[ ].*/ OR /.*[Ee]xtrac32.*/ OR /.*[Ee]sentutl.*/)
    pivot_on: host
    window: 2h
  - name: Executable files written to sensitive locations
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(/.*\.(exe|dll|ps1|bat|vbs|hta)/) AND data_win_eventdata_targetFilename:(/.*\\(Temp|ProgramData|Users\\Public|System32)\\.*/)
    pivot_on: host
    window: 2h
  - name: Outbound SMB connections
    query: data_win_system_eventID:3 AND data_win_eventdata_destinationPort:(445 OR 139)
    pivot_on: host
    window: 2h
  - name: Commands referencing UNC paths
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*\\\\[A-Za-z0-9.-]+\\.*/)
    pivot_on: host
    window: 2h
