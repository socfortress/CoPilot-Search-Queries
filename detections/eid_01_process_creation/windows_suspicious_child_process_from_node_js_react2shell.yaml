name: Windows Suspicious Child Process from Node.js - React2Shell
id: 271de298-cc0e-4842-acd8-079a0a99ea65
version: 1
schema_version: "1.0"
date: "2025-12-05"
author: Swachchhanda Shrawan Poudel (Nextron Systems), Nasreddine Bencherchali
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 271de298-cc0e-4842-acd8-079a0a99ea65
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious child processes started by Node.js server processes on
  Windows, which may indicate exploitation of vulnerabilities like
  CVE-2025-55182 (React2Shell). Attackers can abuse the Node.js 'child_process'
  module to run system commands or scripts using methods such as spawn(),
  exec(), execFile(), fork(), or execSync(). If execSync() or exec() is used in
  the exploit, the command line often shows a shell (e.g., cmd.exe /d /s /c ...)
  running a suspicious command unless other shells are explicitly invoked. For
  other methods, the spawned process appears directly in the Image field unless
  a shell is explicitly used. MITRE ATT&CK: T1059, T1190.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_parentImage:
              value: "*\\\\node.exe"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_parentCommandLine:
                    value: "*--experimental-https*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentCommandLine:
                    value: "*--experimental-next-config-strip-types*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentCommandLine:
