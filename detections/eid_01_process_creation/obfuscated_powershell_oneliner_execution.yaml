name: Obfuscated PowerShell OneLiner Execution
id: 44e24481-6202-4c62-9127-5a0ae8e3fe3d
version: 1
schema_version: "1.0"
date: "2025-04-16"
author: "@Kostastsale, TheDFIRReport"
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 44e24481-6202-4c62-9127-5a0ae8e3fe3d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of a specific OneLiner to download and execute
  powershell modules in memory. MITRE ATT&CK: T1059.001, T1685.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\powershell.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*http://127.0.0.1*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*%{(IRM $_)}*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*Invoke*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\powershell.exe'; data_win_eventdata_commandLine matches
  '*http://127.0.0.1*'; data_win_eventdata_commandLine matches '*%{(IRM $_)}*',
  among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://thedfirreport.com/2022/05/09/seo-poisoning-a-gootloader-story/
  - https://gist.github.com/mgeeky/3b11169ab77a7de354f4111aa2f0df38
  - https://attack.mitre.org/techniques/T1059/001/
  - https://attack.mitre.org/techniques/T1685/

response:
  message: >
    Obfuscated PowerShell OneLiner Execution detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1059.001, T1685
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
    - T1685
  custom_tags:
    - obfuscated
    - powershell
    - oneliner
    - process_creation
    - sysmon
    - execution
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp]:\/\/127\.0\.0\.1.*/ AND data_win_eventdata_commandLine:/.*%\{\([Ii][Rr][Mm] \$_\)\}.*/ AND data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
    name: PowerShell Download and Execution Cradles
    reason: Same in-memory download-and-execute cradle family; other variants on the host show the staging chain beyond this one-liner.
  - id: 3b6ab547-8ec2-4991-b9d2-2b06702a48d7
    name: PowerShell Download Pattern
    reason: Generic PowerShell download pattern that often co-fires when the IRM loop pulls modules.
  - id: d7bcd677-645d-4691-a8d4-7a5602b780d1
    name: Potential PowerShell Command Line Obfuscation
    reason: Command-line obfuscation on the same host indicates the operator's launcher, not an admin script.
  - id: c4db14d9-7909-48b4-a054-aa14d89dbb19
    name: Malicious PowerShell Process - Encoded Command
    reason: Encoded-command PowerShell is the usual delivery wrapper for this loopback one-liner.
  - id: ee18ed37-0802-4268-9435-b3b91aaa18db
    name: PowerShell - Connect To Internet With Hidden Window
    reason: Hidden-window PowerShell reaching the internet is a typical sibling stage of the same loader.
  - id: 17769c90-230e-488b-a463-e05c08e9d48f
    name: Powershell Defender Exclusion
    reason: Defender exclusions are commonly added right after in-memory modules are loaded.
  - id: c148a894-dd93-11eb-bf2a-acde48001122
    name: Powershell Disable Security Monitoring
    reason: Security monitoring disablement follows once the downloaded module has run.
  - id: 327f48c1-a6db-4eb8-875a-f6981f1b0183
    name: Port Forwarding Activity Via SSH.EXE
    reason: The 127.0.0.1 URL implies a tunnel or port-forward serving the payload; SSH forwarding is a common way to build it.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: PowerShell download cradles on host
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND data_win_eventdata_commandLine:/.*([Ii][Rr][Mm]|[Ii]nvoke-[Ww]eb[Rr]equest|[Ii][Ww][Rr]|[Dd]ownload[Ss]tring|[Nn]et\.[Ww]eb[Cc]lient|[Ss]tart-[Bb]its[Tt]ransfer).*/
    pivot_on: host
    window: 2h
  - name: Tunnel / port-forward tooling serving loopback
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*([Pp]link|[Cc]hisel|[Nn]etsh.*[Pp]ort[Pp]roxy|ssh.* -[RrLl] ?[0-9]+:|[Ss]ocat|[Nn]grok).*/
    pivot_on: host
    window: 4h
  - name: Defender tampering via PowerShell
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*([Ss]et|[Aa]dd)-[Mm]p[Pp]reference.*/
    pivot_on: host
    window: 2h
  - name: PowerShell outbound network connections
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND NOT data_win_eventdata_destinationIp:127.0.0.1
    pivot_on: host
    window: 2h
  - name: Persistence set by PowerShell children
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Pp]ower[Ss]hell.*/ AND data_win_eventdata_commandLine:/.*([Ss]chtasks.*\/[Cc]reate|[Rr]eg.*[Aa]dd.*[Rr]un|[Ss][Cc].*[Cc]reate).*/
    pivot_on: host
    window: 4h
