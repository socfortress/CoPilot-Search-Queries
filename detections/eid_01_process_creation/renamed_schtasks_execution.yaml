/ OR data_win_eventdata_commandLine:/.* \/[Tt][Nn] .*/ OR data_win_eventdata_commandLine:/.* –[Tt][Nn] .*/ OR data_win_eventdata_commandLine:/.* —[Tt][Nn] .*/ OR data_win_eventdata_commandLine:/.* ―[Tt][Nn] .*/ OR data_win_eventdata_commandLine:/.* -[Tt][Rr] .*/ OR data_win_eventdata_commandLine:/.* \/[Tt][Rr] .*/ OR data_win_eventdata_commandLine:/.* –[Tt][Rr] .*/ OR data_win_eventdata_commandLine:/.* —[Tt][Rr] .*/ OR data_win_eventdata_commandLine:/.* ―[Tt][Rr] .*/ OR data_win_eventdata_commandLine:/.* -[Ss][Cc] .*/ OR data_win_eventdata_commandLine:/.* \/[Ss][Cc] .*/ OR data_win_eventdata_commandLine:/.* –[Ss][Cc] .*/ OR data_win_eventdata_commandLine:/.* —[Ss][Cc] .*/ OR data_win_eventdata_commandLine:/.* ―[Ss][Cc] .*/ OR data_win_eventdata_commandLine:/.* -[Ss][Tt] .*/ OR data_win_eventdata_commandLine:/.* \/[Ss][Tt] .*/ OR data_win_eventdata_commandLine:/.* –[Ss][Tt] .*/ OR data_win_eventdata_commandLine:/.* —[Ss][Tt] .*/ OR data_win_eventdata_commandLine:/.* ―[Ss][Tt] .*/ OR data_win_eventdata_commandLine:/.* -[Rr][Uu] .*/ OR data_win_eventdata_commandLine:/.* \/[Rr][Uu] .*/ OR data_win_eventdata_commandLine:/.* –[Rr][Uu] .*/ OR data_win_eventdata_commandLine:/.* —[Rr][Uu] .*/ OR data_win_eventdata_commandLine:/.* ―[Rr][Uu] .*/ OR data_win_eventdata_commandLine:/.* -[Ff][Oo] .*/ OR data_win_eventdata_commandLine:/.* \/[Ff][Oo] .*/ OR data_win_eventdata_commandLine:/.* –[Ff][Oo] .*/ OR data_win_eventdata_commandLine:/.* —[Ff][Oo] .*/ OR data_win_eventdata_commandLine:/.* ―[Ff][Oo] .*/) AND _exists_:data_win_eventdata_commandLine AND NOT (data_win_eventdata_commandLine:/.*[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss].*/)) OR (data_win_eventdata_originalFileName:/[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/)))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 89ca78fd-b37c-4310-b3d3-81a023f83936
    name: Schtasks Creation Or Modification With SYSTEM Privileges
    reason: Renamed schtasks is evasion for scheduling a task; a SYSTEM-privileged task from the standard binary on the same host shows the persistence goal.
  - id: 8a8379b8-780b-4dbf-b1e9-31c8d112fefb
    name: Schtasks From Suspicious Folders
    reason: Task creation whose payload sits in user-writable paths is the typical payload the renamed schtasks is registering.
  - id: f2c64357-b1d2-41b7-849f-34d2682c0fad
    name: Suspicious Command Patterns In Scheduled Task Creation
    reason: Shows the malicious command line embedded in the task the renamed binary created.
  - id: 1c0e41cd-21bb-4433-9acc-4a2cd6367b9b
    name: Suspicious Modification Of Scheduled Tasks
    reason: Follow-on tampering of existing tasks once the attacker can schedule.
  - id: 9f8573c9-22b4-40e3-89c1-72bc2b8d49ab
    name: Scheduled Task Creation Masquerading as System Processes
    reason: Same masquerading intent applied to the task name, often paired with a renamed binary.
  - id: 36480ae1-a1cb-4eaa-a0d6-29801d7e9142
    name: Potential Defense Evasion Via Binary Rename
    reason: The rename/copy of a system binary that produced the renamed schtasks usually precedes it.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Scheduled task registered (4698) or updated (4702)
    query: data_win_system_eventID:("4698" OR "4702")
    pivot_on: host
    window: 4h
  - name: Standard schtasks.exe create/change activity
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 4h
  - name: Executable dropped in user-writable path (rename staging)
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*([Uu]sers|[Pp]rogram[Dd]ata|[Tt]emp|[Pp]ublic).*\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Task payload launched from user-writable path
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentCommandLine:/.*[Ss][Cc][Hh][Ee][Dd][Uu][Ll][Ee].*/ AND data_win_eventdata_image:/.*\\([Uu]sers|[Pp]rogram[Dd]ata|[Tt]emp|[Pp]ublic)\\.*/
    pivot_on: host
    window: 24h
