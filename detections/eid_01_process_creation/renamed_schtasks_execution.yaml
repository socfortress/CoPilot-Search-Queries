status: experimental
type: TTP

description: >
  Detects the execution of renamed schtasks.exe binary, which is a legitimate
  Windows utility used for scheduling tasks. One of the very common persistence
  techniques is schedule malicious tasks using schtasks.exe. Since, it is
  heavily abused, it is also heavily monitored by security products. To evade
  detection, threat actors may rename the schtasks.exe binary to schedule their
  malicious tasks. MITRE ATT&CK: T1036.003, T1053.005.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
