name: Logged-On User Password Change Via Ksetup.EXE
id: c9783e20-4793-4164-ba96-d9ee483992c4
version: 1
schema_version: "1.0"
date: "2023-04-06"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: c9783e20-4793-4164-ba96-d9ee483992c4
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects password change for the logged-on user's via "ksetup.exe".

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\ksetup.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "ksetup.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* /ChangePassword *"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\ksetup.exe'; data_win_eventdata_originalFileName equals 'ksetup.exe';
  data_win_eventdata_commandLine matches '* /ChangePassword *'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://learn.microsoft.com/en-gb/windows-server/administration/windows-commands/ksetup

response:
  message: >
    Logged-On User Password Change Via Ksetup.EXE detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  custom_tags:
    - logged
    - password
    - change
    - process_creation
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Kk][Ss][Ee][Tt][Uu][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Kk][Ss][Ee][Tt][Uu][Pp]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.* \/[Cc][Hh][Aa][Nn][Gg][Ee][Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd] .*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: de16d92c-c446-4d53-8938-10aeef41c8b6
    name: Computer Password Change Via Ksetup.EXE
    reason: Sibling ksetup abuse (machine account password) by the same actor widens Kerberos realm tampering.
  - id: d4498716-1d52-438f-8084-4a603157d131
    name: Password Provided In Command Line Of Net.EXE
    reason: Other credential manipulation via CLI on the same account/host points to account takeover.
  - id: cd219ff3-fa99-45d4-8380-a7d15116c6dc
    name: New User Created Via Net.EXE
    reason: Persistence via new accounts commonly accompanies a forced password change.
  - id: b9f0e6f5-09b4-4358-bae4-08408705bd5c
    name: New User Created Via Net.EXE With Never Expire Option
    reason: Persistent backdoor account creation following credential control.
  - id: 7864a175-3654-4824-9f0d-f0da18ab27c0
    name: Password Set to Never Expire via WMI
    reason: Password-policy tampering to keep a taken-over account usable.
  - id: e6e88853-5f20-4c4a-8d26-cd469fd8d31f
    name: Ntdsutil Abuse
    reason: Credential-store access on domain controllers is a likely adjacent step for the same operator.
  - id: c248c896-e412-4279-8c15-1c558067b6fa
    name: Enumerate All Information With Whoami.EXE
    reason: Situational awareness of the logged-on user typically precedes changing its password.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Ksetup usage of any kind
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*[Kk]setup\.exe/ OR data_win_eventdata_originalFileName:/[Kk]setup\.exe/)
    pivot_on: host
    window: 4h
  - name: Password and account changes via CLI
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(net +user|net1 +user|Set-ADAccountPassword|dsmod|ChangePassword).*/
    pivot_on: user
    window: 4h
  - name: Account management audit events
    query: data_win_system_eventID:(4723 OR 4724 OR 4738 OR 4720 OR 4728 OR 4732)
    pivot_on: user
    window: 4h
  - name: Credential access tooling
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(mimikatz|sekurlsa|lsass|procdump|comsvcs.*MiniDump|ntds).*/
    pivot_on: host
    window: 4h
  - name: Recon from the same user
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(whoami|nltest|net +group|net +accounts|klist).*/
    pivot_on: user
    window: 2h
