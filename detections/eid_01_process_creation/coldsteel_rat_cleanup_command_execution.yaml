name: COLDSTEEL RAT Cleanup Command Execution
id: 88516f06-ebe0-47ad-858e-ae9fd060ddea
version: 1
schema_version: "1.0"
date: "2023-04-30"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 88516f06-ebe0-47ad-858e-ae9fd060ddea
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the creation of a "rundll32" process from the ColdSteel persistence
  service to initiate the cleanup command by calling one of its own exports.
  This functionality is not present in "MileStone2017" and some "MileStone2016"
  samples.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_parentImage:
              value: "*\\\\svchost.exe"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_parentCommandLine:
                    value: "* -k msupdate*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentCommandLine:
                    value: "* -k msupdate2*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentCommandLine:
                    value: "* -k alg*"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\rundll32.exe"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*UpdateDriverForPlugAndPlayDevicesW*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*ServiceMain*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*DiUninstallDevice*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_parentCommandLine
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\svchost.exe'; data_win_eventdata_parentCommandLine matches '* -k
  msupdate*'; data_win_eventdata_parentCommandLine matches '* -k msupdate2*',
  among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.ncsc.gov.uk/static-assets/documents/malware-analysis-reports/cold-steel/NCSC-MAR-Cold-Steel.pdf

response:
  message: >
    COLDSTEEL RAT Cleanup Command Execution detected on host $agent_name$.
    Matched data_win_eventdata_parentImage: $data_win_eventdata_parentImage$.
    Matched data_win_eventdata_parentCommandLine:
    $data_win_eventdata_parentCommandLine$.
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_parentCommandLine
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - coldsteel
    - cleanup
    - process_creation
    - sysmon
    - persistence
    - stealth
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_parentCommandLine:/.* -[Kk] [Mm][Ss][Uu][Pp][Dd][Aa][Tt][Ee].*/ OR data_win_eventdata_parentCommandLine:/.* -[Kk] [Mm][Ss][Uu][Pp][Dd][Aa][Tt][Ee]2.*/ OR data_win_eventdata_parentCommandLine:/.* -[Kk] [Aa][Ll][Gg].*/) AND data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*[Uu][Pp][Dd][Aa][Tt][Ee][Dd][Rr][Ii][Vv][Ee][Rr][Ff][Oo][Rr][Pp][Ll][Uu][Gg][Aa][Nn][Dd][Pp][Ll][Aa][Yy][Dd][Ee][Vv][Ii][Cc][Ee][Ss][Ww].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Mm][Aa][Ii][Nn].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Uu][Nn][Ii][Nn][Ss][Tt][Aa][Ll][Ll][Dd][Ee][Vv][Ii][Cc][Ee].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 9f9cd389-cea0-4142-bf1a-a3fd424abedd
    name: COLDSTEEL RAT Service Persistence Execution
    reason: The svchost -k msupdate service is the parent of this cleanup; it precedes it and shows how long the implant ran.
  - id: e01b6eb5-1eb4-4465-a165-85d40d874add
    name: COLDSTEEL RAT Anonymous User Process Execution
    reason: Operator activity under ANONYMOUS during the implant lifetime before cleanup.
  - id: e593cf51-88db-4ee1-b920-37e89012a3c9
    name: Potentially Suspicious Rundll32 Activity
    reason: Generic rundll32 abuse that overlaps with the cleanup export call.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Svchost persistence service starts
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*svchost\.exe/ AND data_win_eventdata_commandLine:/.*-k (msupdate|msupdate2|alg).*/
    pivot_on: host
    window: 24h
  - name: Service installation events
    query: data_win_system_eventID:7045
    pivot_on: host
    window: 24h
  - name: DLL drops and file deletions in System32
    query: data_win_system_eventID:23 OR (data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\\Windows\\System32\\.*\.dll/)
    pivot_on: host
    window: 24h
  - name: Outbound network from svchost
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*svchost\.exe/
    pivot_on: host
    window: 24h
