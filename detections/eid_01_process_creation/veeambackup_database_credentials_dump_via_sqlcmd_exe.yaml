name: VeeamBackup Database Credentials Dump Via Sqlcmd.EXE
id: b57ba453-b384-4ab9-9f40-1038086b4e53
version: 1
schema_version: "1.0"
date: "2023-02-13"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: b57ba453-b384-4ab9-9f40-1038086b4e53
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects dump of credentials in VeeamBackup dbo. MITRE ATT&CK: T1005.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\sqlcmd.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*SELECT*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*TOP*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*[VeeamBackup].[dbo].[Credentials]*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\sqlcmd.exe'; data_win_eventdata_commandLine matches '*SELECT*';
  data_win_eventdata_commandLine matches '*TOP*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://thedfirreport.com/2021/12/13/diavol-ransomware/
  - https://forums.veeam.com/veeam-backup-replication-f2/recover-esxi-password-in-veeam-t34630.html
  - https://attack.mitre.org/techniques/T1005/

response:
  message: >
    VeeamBackup Database Credentials Dump Via Sqlcmd.EXE detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
    MITRE ATT&CK: T1005
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1005
  custom_tags:
    - veeambackup
    - database
    - credentials
    - process_creation
    - sysmon
    - collection
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss][Qq][Ll][Cc][Mm][Dd]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Ss][Ee][Ll][Ee][Cc][Tt].*/ AND data_win_eventdata_commandLine:/.*[Tt][Oo][Pp].*/ AND data_win_eventdata_commandLine:/.*\[[Vv][Ee][Ee][Aa][Mm][Bb][Aa][Cc][Kk][Uu][Pp]\]\.\[[Dd][Bb][Oo]\]\.\[[Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll][Ss]\].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d55b793d-f847-4eea-b59a-5ab09908ac90
    name: Suspicious Child Process Of Veeam Dabatase
    reason: Same Veeam SQL instance abused; shells spawned from the Veeam DB are the execution counterpart of this data theft.
  - id: 2f47f1fd-0901-466e-a770-3b7092834a1b
    name: Potential Conti Ransomware Database Dumping Activity Via SQLCmd
    reason: Same sqlcmd-based database dumping tradecraft used by ransomware crews ahead of encryption.
  - id: c615d676-f655-46b9-b913-78729021e5d7
    name: Data Export From MSSQL Table Via BCP.EXE
    reason: Alternative bulk export of the same database if sqlcmd is blocked or monitored.
  - id: 9fbf5927-5261-4284-a71d-f681029ea574
    name: Compress Data and Lock With Password for Exfiltration With 7-ZIP
    reason: Dumped credential/backup data is typically archived with a password before exfiltration.
  - id: 32e0baea-b3f1-11eb-a2ce-acde48001122
    name: Detect RClone Command-Line Usage
    reason: Rclone is the usual exfil channel after Veeam data is collected.
  - id: 639c9081-f482-47d3-a0bd-ddee3d4ecd76
    name: All Backups Deleted Via Wbadmin.EXE
    reason: Veeam credentials give access to backups; destroying them is the follow-on impact step.
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: Recovery inhibition that commonly follows backup-infrastructure compromise before ransomware.
  - id: 7f103213-a04e-4d59-8261-213dddf22314
    name: MSSQL XPCmdshell Suspicious Execution
    reason: Alternative code-execution route on the same SQL server hosting the Veeam database.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: All sqlcmd executions
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Ss][Qq][Ll][Cc][Mm][Dd]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 4h
  - name: Veeam DB references in command lines
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Vv][Ee][Ee][Aa][Mm][Bb][Aa][Cc][Kk][Uu][Pp].*/
    pivot_on: host
    window: 6h
  - name: Archiving tools staging data
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\(7[Zz]\.[Ee][Xx][Ee]|7[Zz][Aa]\.[Ee][Xx][Ee]|[Rr][Aa][Rr]\.[Ee][Xx][Ee]|[Ww][Ii][Nn][Rr][Aa][Rr]\.[Ee][Xx][Ee])/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]-[Aa][Rr][Cc][Hh][Ii][Vv][Ee].*/)
    pivot_on: host
    window: 6h
  - name: Exfil tool use
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Rr][Cc][Ll][Oo][Nn][Ee]\.[Ee][Xx][Ee]|[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]|[Ww][Gg][Ee][Tt]\.[Ee][Xx][Ee]|[Ww][Ii][Nn][Ss][Cc][Pp]\.[Ee][Xx][Ee]|[Pp][Ss][Cc][Pp]\.[Ee][Xx][Ee]|[Mm][Ee][Gg][Aa][Cc][Mm][Dd]\.[Ee][Xx][Ee])/ OR data_win_eventdata_commandLine:/.*[Ss][Tt][Aa][Rr][Tt]-[Bb][Ii][Tt][Ss][Tt][Rr][Aa][Nn][Ss][Ff][Ee][Rr].*/)
    pivot_on: host
    window: 6h
  - name: Veeam credential decryption tooling
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Vv][Ee][Ee][Aa][Mm]-[Gg][Ee][Tt]-[Cc][Rr][Ee][Dd][Ss].*/ OR (data_win_eventdata_commandLine:/.*[Vv][Ee][Ee][Aa][Mm].*/ AND data_win_eventdata_commandLine:/.*[Uu][Nn][Pp][Rr][Oo][Tt][Ee][Cc][Tt].*/) OR (data_win_eventdata_commandLine:/.*[Vv][Ee][Ee][Aa][Mm].*/ AND data_win_eventdata_commandLine:/.*[Dd][Pp][Aa][Pp][Ii].*/))
    pivot_on: host
    window: 6h
