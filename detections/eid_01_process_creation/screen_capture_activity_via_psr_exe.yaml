name: Screen Capture Activity Via Psr.EXE
id: 2158f96f-43c2-43cb-952a-ab4580f32382
version: 1
schema_version: "1.0"
date: "2024-01-04"
author: Beyu Denis, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 2158f96f-43c2-43cb-952a-ab4580f32382
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of Windows Problem Steps Recorder (psr.exe), a utility used
  to record the user screen and clicks. MITRE ATT&CK: T1113.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\Psr.exe"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*/start*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*-start*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches '*\Psr.exe';
  data_win_eventdata_commandLine matches '*/start*';
  data_win_eventdata_commandLine matches '*-start*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://lolbas-project.github.io/lolbas/Binaries/Psr/
  - https://web.archive.org/web/20200229201156/https://www.sans.org/cyber-security-summit/archives/file/summit-archive-1493861893.pdf
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1560.001/T1560.001.md
  - https://attack.mitre.org/techniques/T1113/

response:
  message: >
    Screen Capture Activity Via Psr.EXE detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1113
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1113
  custom_tags:
    - screen
    - capture
    - process_creation
    - sysmon
    - collection
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Pp][Ss][Rr]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*\/[Ss][Tt][Aa][Rr][Tt].*/ OR data_win_eventdata_commandLine:/.*-[Ss][Tt][Aa][Rr][Tt].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 5e0b1936-8f99-4399-8ee2-9edc5b32e170
    name: Windows Screen Capture Via Powershell
    reason: Alternate screen capture method by same actor
  - id: d4a11f63-2390-411c-9adf-d791fd152830
    name: Windows Screen Capture with CopyFromScreen
    reason: Scripted screenshot capture often used alongside psr
  - id: 83865853-59aa-449e-9600-74b9d89a6d6e
    name: Audio Capture via SoundRecorder
    reason: 'Companion collection: audio capture accompanies screen recording'
  - id: 932fb0d8-692b-4b0f-a26e-5643a50fe7d6
    name: Audio Capture via PowerShell
    reason: Companion input-capture collection by PowerShell
  - id: b9aeac14-2ffd-4ad3-b967-1354a4e628c3
    name: PowerShell Get-Clipboard Cmdlet Via CLI
    reason: Clipboard theft is commonly paired with screen capture
  - id: 34f90d3c-c297-49e9-b26d-911b05a4866c
    name: Powershell Keylogging
    reason: Input capture alongside screen recording
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: psr output zip written
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*\\[Pp][Ss][Rr]\.[Ee][Xx][Ee]/ AND data_win_eventdata_targetFilename:/.*\.[Zz][Ii][Pp]/
    pivot_on: host
    window: 2h
  - name: Archiving tools following capture
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\7z.*\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww]in[Rr][Aa][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Cc]ompress-[Aa]rchive.*/)
    pivot_on: host
    window: 2h
  - name: psr launches by same user
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Pp][Ss][Rr]\.[Ee][Xx][Ee]/
    pivot_on: user
    window: 24h
  - name: Outbound transfer tools after capture
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Cc]url\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Bb]its[Aa]dmin\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Ii]nvoke-[Ww]eb[Rr]equest.*/ OR data_win_eventdata_commandLine:/.*[Ss]tart-[Bb]its[Tt]ransfer.*/)
    pivot_on: host
    window: 4h
