name: Rhadamanthys Stealer Module Launch Via Rundll32.EXE
id: 5cdbc2e8-86dd-43df-9a1a-200d4745fba5
version: 1
schema_version: "1.0"
date: "2023-02-05"
author: TropChaud
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 5cdbc2e8-86dd-43df-9a1a-200d4745fba5
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the use of Rundll32 to launch an NSIS module that serves as the main
  stealer capability of Rhadamanthys infostealer, as observed in reports and
  samples in early 2023. MITRE ATT&CK: T1218.011.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - term:
                  data_win_eventdata_originalFileName:
                    value: "RUNDLL32.EXE"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\rundll32.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*nsis_uns*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*PrintUIEntry*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_originalFileName
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_originalFileName equals
  'RUNDLL32.EXE'; data_win_eventdata_image matches '*\rundll32.exe';
  data_win_eventdata_commandLine matches '*nsis_uns*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://elis531989.medium.com/dancing-with-shellcodes-analyzing-rhadamanthys-stealer-3c4986966a88
  - https://blog.cyble.com/2023/01/12/rhadamanthys-new-stealer-spreading-through-google-ads/
  - https://www.joesandbox.com/analysis/790122/0/html
  - https://twitter.com/anfam17/status/1607477672057208835
  - https://attack.mitre.org/techniques/T1218/011/

response:
  message: >
    Rhadamanthys Stealer Module Launch Via Rundll32.EXE detected on host
    $agent_name$. Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1218.011
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_originalFileName
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218.011
  custom_tags:
    - rhadamanthys
    - stealer
    - module
    - process_creation
    - sysmon
    - stealth
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_originalFileName:/[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Nn][Ss][Ii][Ss]_[Uu][Nn][Ss].*/ AND data_win_eventdata_commandLine:/.*[Pp][Rr][Ii][Nn][Tt][Uu][Ii][Ee][Nn][Tt][Rr][Yy].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e593cf51-88db-4ee1-b920-37e89012a3c9
    name: Potentially Suspicious Rundll32 Activity
    reason: Rhadamanthys loads its module via rundll32 with unusual arguments; generic suspicious rundll32 usage co-occurs.
  - id: 5bb68627-3198-40ca-b458-49f973db8752
    name: Rundll32 Execution Without Parameters
    reason: The stealer injects into or spawns rundll32 with no parameters later in the chain.
  - id: c3a99af4-35a9-4668-879e-c09aeb4f2bdf
    name: Rundll32 Execution With Uncommon DLL Extension
    reason: Loader stages invoke rundll32 on DLLs with non-.dll extensions.
  - id: 2569ed8c-1147-498a-9b8c-2ad3656b10ed
    name: Potential Renamed Rundll32 Execution
    reason: Renamed rundll32 is a common variation in the same loader chains.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Rundll32 launched from user-writable paths
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]\\.*/)
    pivot_on: host
    window: 2h
  - name: NSIS installer parent chain
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentCommandLine:/.*[Nn][Ss][Ii][Ss].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ss][Ii][Ss]_[Uu][Nn][Ss].*/)
    pivot_on: host
    window: 2h
  - name: Browser credential store access via commandline
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ll][Oo][Gg][Ii][Nn] [Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_commandLine:/.*[Ll][Oo][Cc][Aa][Ll] [Ss][Tt][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Oo][Kk][Ii][Ee][Ss]\.[Ss][Qq][Ll][Ii][Tt][Ee].*/)
    pivot_on: host
    window: 4h
  - name: Outbound connections by rundll32
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 4h
  - name: Archive staging for exfil
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]-[Aa][Rr][Cc][Hh][Ii][Vv][Ee].*/ OR data_win_eventdata_commandLine:/.*[Aa] -[Tt][Zz][Ii][Pp].*/ OR data_win_eventdata_commandLine:/.*[Tt][Aa][Rr] -[Cc].*/)
    pivot_on: host
    window: 4h
