name: Import LDAP Data Interchange Format File Via Ldifde.EXE
id: 6f535e01-ca1f-40be-ab8d-45b19c0c8b7f
version: 1
schema_version: "1.0"
date: "2023-03-14"
author: "@gott_cyber"
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 6f535e01-ca1f-40be-ab8d-45b19c0c8b7f
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of "Ldifde.exe" with the import flag "-i". The can be
  abused to include HTTP-based arguments which will allow the arbitrary download
  of files from a remote server. MITRE ATT&CK: T1218, T1105.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\ldifde.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "ldifde.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*-i*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*-f*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\ldifde.exe'; data_win_eventdata_originalFileName equals 'ldifde.exe';
  data_win_eventdata_commandLine matches '*-i*', among other conditions.

known_false_positives: >
  Since the content of the files are unknown, false positives are expected.
  Baseline expected activity in your environment and tune this detection before
  relying on it for automated response.

references:
  - https://twitter.com/0gtweet/status/1564968845726580736
  - https://strontic.github.io/xcyclopedia/library/ldifde.exe-979DE101F5059CEC1D2C56967CA2BAC0.html
  - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2012-r2-and-2012/cc731033(v=ws.11)
  - https://attack.mitre.org/techniques/T1218/
  - https://attack.mitre.org/techniques/T1105/

response:
  message: >
    Import LDAP Data Interchange Format File Via Ldifde.EXE detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1218, T1105
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218
    - T1105
  custom_tags:
    - import
    - interchange
    - format
    - process_creation
    - sysmon
    - command_and_control
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ll][Dd][Ii][Ff][Dd][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ll][Dd][Ii][Ff][Dd][Ee]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*-[Ii].*/ AND data_win_eventdata_commandLine:/.*-[Ff].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 4f7a6757-ff79-46db-9687-66501a02d9ec
    name: Active Directory Structure Export Via Ldifde.EXE
    reason: Export of AD structure is the typical recon precursor to an LDIF import that modifies it.
  - id: e5d36acd-acb4-4c6f-a13f-9eb203d50099
    name: Active Directory Structure Export Via Csvde.EXE
    reason: Sister tool used for the same AD dump/edit workflow.
  - id: 514e7e3e-b3b4-4a67-af60-be20f139198b
    name: PUA - AdFind.EXE Execution
    reason: AdFind enumeration commonly precedes directory modification by the same operator.
  - id: f376c8a7-a2d0-4ddc-aa0c-16c17236d962
    name: HackTool - Bloodhound/Sharphound Execution
    reason: Attack-path mapping identifies the objects an LDIF import then abuses.
  - id: 70bc5215-526f-4477-963c-a47a5c9ebd12
    name: Potential Active Directory Enumeration Using AD Module - ProcCreation
    reason: AD-module enumeration on the same host as the import.
  - id: cd219ff3-fa99-45d4-8380-a7d15116c6dc
    name: New User Created Via Net.EXE
    reason: Account creation through another channel is an outcome an LDIF import can also produce.
  - id: 5b768e71-86f2-4879-b448-81061cbae951
    name: Suspicious Manipulation Of Default Accounts Via Net.EXE
    reason: Tampering with built-in accounts is a common objective of directory changes.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Directory object changes (user/group/ACL)
    query: (data_win_system_eventID:"4720" OR data_win_system_eventID:"4728" OR data_win_system_eventID:"4732" OR data_win_system_eventID:"4756" OR data_win_system_eventID:"4738" OR data_win_system_eventID:"4724" OR data_win_system_eventID:"5136")
    pivot_on: host
    window: 2h
  - name: LDIF/LDF files written to disk
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.([Ll][Dd][Ii][Ff]|[Ll][Dd][Ff])/
    pivot_on: host
    window: 4h
  - name: AD recon tooling before the import
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Ll][Dd][Ii][Ff][Dd][Ee]|[Cc][Ss][Vv][Dd][Ee]|[Aa][Dd][Ff][Ii][Nn][Dd]|[Dd][Ss][Qq][Uu][Ee][Rr][Yy]|[Nn][Ll][Tt][Ee][Ss][Tt])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Ss][Hh][Aa][Rr][Pp][Hh][Oo][Uu][Nn][Dd]|[Bb][Ll][Oo][Oo][Dd][Hh][Oo][Uu][Nn][Dd]|[Aa][Dd][Ff][Ii][Nn][Dd]).*/)
    pivot_on: host
    window: 4h
  - name: Privileged group and account manipulation by command line
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Nn][Ee][Tt]1? +([Uu][Ss][Ee][Rr]|[Gg][Rr][Oo][Uu][Pp]|[Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp]).*(\/[Aa][Dd][Dd]|([Dd][Oo][Mm][Aa][Ii][Nn] [Aa][Dd][Mm][Ii][Nn][Ss]|[Ee][Nn][Tt][Ee][Rr][Pp][Rr][Ii][Ss][Ee] [Aa][Dd][Mm][Ii][Nn][Ss]|[Aa][Dd][Mm][Ii][Nn][Ii][Ss][Tt][Rr][Aa][Tt][Oo][Rr][Ss])).*/
    pivot_on: user
    window: 2h
  - name: Domain credential theft follow-on
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll]|[Ll][Ss][Aa][Dd][Uu][Mm][Pp]|[Dd][Cc][Ss][Yy][Nn][Cc]|[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn])|[Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt].*/
    pivot_on: host
    window: 4h
