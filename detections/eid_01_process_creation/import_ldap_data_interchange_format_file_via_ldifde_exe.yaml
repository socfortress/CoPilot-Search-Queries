name: Import LDAP Data Interchange Format File Via Ldifde.EXE
id: 6f535e01-ca1f-40be-ab8d-45b19c0c8b7f
version: 1
schema_version: "1.0"
date: "2023-03-14"
author: "@gott_cyber"
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 6f535e01-ca1f-40be-ab8d-45b19c0c8b7f
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of "Ldifde.exe" with the import flag "-i". The can be
  abused to include HTTP-based arguments which will allow the arbitrary download
  of files from a remote server. MITRE ATT&CK: T1218, T1105.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\ldifde.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "ldifde.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*-i*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*-f*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\ldifde.exe'; data_win_eventdata_originalFileName equals 'ldifde.exe';
  data_win_eventdata_commandLine matches '*-i*', among other conditions.

known_false_positives: >
  Since the content of the files are unknown, false positives are expected.
  Baseline expected activity in your environment and tune this detection before
  relying on it for automated response.

references:
  - https://twitter.com/0gtweet/status/1564968845726580736
  - https://strontic.github.io/xcyclopedia/library/ldifde.exe-979DE101F5059CEC1D2C56967CA2BAC0.html
  - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2012-r2-and-2012/cc731033(v=ws.11)
  - https://attack.mitre.org/techniques/T1218/
  - https://attack.mitre.org/techniques/T1105/

response:
  message: >
    Import LDAP Data Interchange Format File Via Ldifde.EXE detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1218, T1105
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218
    - T1105
  custom_tags:
    - import
    - interchange
    - format
    - process_creation
    - sysmon
    - command_and_control
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ll][Dd][Ii][Ff][Dd][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ll][Dd][Ii][Ff][Dd][Ee]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*-[Ii].*/ AND data_win_eventdata_commandLine:/.*-[Ff].*/

