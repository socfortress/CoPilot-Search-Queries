name: Potential Arbitrary Code Execution Via Node.EXE
id: 6640f31c-01ad-49b5-beb5-83498a5cd8bd
version: 1
schema_version: "1.0"
date: "2023-02-03"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 6640f31c-01ad-49b5-beb5-83498a5cd8bd
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution node.exe which is shipped with multiple software such as
  VMware, Adobe...etc. In order to execute arbitrary code. For example to
  establish reverse shell as seen in Log4j attacks...etc. MITRE ATT&CK: T1127.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\node.exe"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -e *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* --eval *"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*.exec(*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*net.socket*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*.connect*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*child_process*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\node.exe'; data_win_eventdata_commandLine matches '* -e *';
  data_win_eventdata_commandLine matches '* --eval *', among other conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - http://blog.talosintelligence.com/2022/09/lazarus-three-rats.html
  - https://www.sprocketsecurity.com/resources/crossing-the-log4j-horizon-a-vulnerability-with-no-return
  - https://www.rapid7.com/blog/post/2022/01/18/active-exploitation-of-vmware-horizon-servers/
  - https://nodejs.org/api/cli.html
  - https://attack.mitre.org/techniques/T1127/

response:
  message: >
    Potential Arbitrary Code Execution Via Node.EXE detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
    MITRE ATT&CK: T1127
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1127
  custom_tags:
    - arbitrary
    - process_creation
    - sysmon
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Nn][Oo][Dd][Ee]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.* -[Ee] .*/ OR data_win_eventdata_commandLine:/.* --[Ee][Vv][Aa][Ll] .*/) AND data_win_eventdata_commandLine:/.*\.[Ee][Xx][Ee][Cc]\(.*/ AND data_win_eventdata_commandLine:/.*[Nn][Ee][Tt]\.[Ss][Oo][Cc][Kk][Ee][Tt].*/ AND data_win_eventdata_commandLine:/.*\.[Cc][Oo][Nn][Nn][Ee][Cc][Tt].*/ AND data_win_eventdata_commandLine:/.*[Cc][Hh][Ii][Ll][Dd]_[Pp][Rr][Oo][Cc][Ee][Ss][Ss].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 3eb91f0a-0060-424a-a676-59f5fdd75610
    name: Potential CVE-2021-44228 Exploitation Attempt - VMware Horizon
    reason: Log4Shell on Horizon is the cited origin of node.exe reverse shells; the Tomcat service child is the exploited entry point.
  - id: 7c97c625-0350-4f0a-8943-f6cadc88125e
    name: Mint Sandstorm - Log4J Wstomcat Process Execution
    reason: Same wstomcat Log4j exploitation path that launches shell tooling like node.exe.
  - id: 8537c866-072e-460d-bfff-aaf39cbd73d3
    name: Potentially Suspicious Inline JavaScript Execution via NodeJS Binary
    reason: Alternative inline-JS node.exe abuse (download/execSync) with the same operator tradecraft.
  - id: 271de298-cc0e-4842-acd8-079a0a99ea65
    name: Windows Suspicious Child Process from Node.js - React2Shell
    reason: Web-app RCE through Node.js producing shell children; a different route to the same node.exe code execution.
  - id: edc2f8ae-2412-4dfd-b9d5-0c57727e70be
    name: Potential Powershell ReverseShell Connection
    reason: Fallback or parallel reverse shell if the node socket shell is blocked.
  - id: e5f5c693-52d7-4de5-88ae-afbfbce85595
    name: Unsigned .node File Loaded
    reason: A native node add-on loaded by node.exe is another way the runtime is weaponised for code execution.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Shells and tools spawned by node.exe
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\([Nn][Oo][Dd][Ee]\.[Ee][Xx][Ee])/ AND data_win_eventdata_image:/.*\\([Cc][Mm][Dd]\.[Ee][Xx][Ee]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]|[Ww][Hh][Oo][Aa][Mm][Ii]\.[Ee][Xx][Ee]|[Nn][Ee][Tt]\.[Ee][Xx][Ee]|[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]|[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|[Bb][Ii][Tt][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 1h
  - name: Outbound connections from node.exe
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Nn][Oo][Dd][Ee]\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    - ip
    window: 1h
  - name: node.exe running from a non-standard install path
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Nn][Oo][Dd][Ee]\.[Ee][Xx][Ee])/ AND NOT data_win_eventdata_image:/[Cc]:\\[Pp]rogram [Ff]iles.*/
    pivot_on:
    - host
    window: 2h
  - name: Children of VMware Horizon Tomcat service
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\([Ww][Ss]_[Tt][Oo][Mm][Cc][Aa][Tt][Ss][Ee][Rr][Vv][Ii][Cc][Ee]\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 2h
  - name: Post-exploitation discovery commands
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Ww][Hh][Oo][Aa][Mm][Ii]\.[Ee][Xx][Ee]|[Ss][Yy][Ss][Tt][Ee][Mm][Ii][Nn][Ff][Oo]\.[Ee][Xx][Ee]|[Nn][Ll][Tt][Ee][Ss][Tt]\.[Ee][Xx][Ee]|[Ii][Pp][Cc][Oo][Nn][Ff][Ii][Gg]\.[Ee][Xx][Ee]|[Qq][Uu][Ss][Ee][Rr]\.[Ee][Xx][Ee]|[Nn][Ee][Tt]1\.[Ee][Xx][Ee])/
    pivot_on:
    - host
    window: 1h
