name: Permission Misconfiguration Reconnaissance Via Findstr.EXE
id: 47e4bab7-c626-47dc-967b-255608c9a920
version: 1
schema_version: "1.0"
date: "2023-11-11"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 47e4bab7-c626-47dc-967b-255608c9a920
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects usage of findstr with the "EVERYONE" or "BUILTIN" keywords. This was
  seen being used in combination with "icacls" and other utilities to spot
  misconfigured files or folders permissions. MITRE ATT&CK: T1552.006.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\find.exe"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\findstr.exe"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_originalFileName:
                                value: "FIND.EXE"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_originalFileName:
                                value: "FINDSTR.EXE"
                                case_insensitive: true
                        minimum_should_match: 1
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*\"Everyone\"*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*'Everyone'*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*\"BUILTIN\\\\\"*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*'BUILTIN\\\\'*"
                                case_insensitive: true
                        minimum_should_match: 1
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*icacls *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*findstr *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*Everyone*"
                          case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\find.exe'; data_win_eventdata_image matches '*\findstr.exe';
  data_win_eventdata_originalFileName equals 'FIND.EXE', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.absolomb.com/2018-01-26-Windows-Privilege-Escalation-Guide/
  - https://attack.mitre.org/techniques/T1552/006/

response:
  message: >
    Permission Misconfiguration Reconnaissance Via Findstr.EXE detected on host
    $agent_name$. Matched data_win_eventdata_image: $data_win_eventdata_image$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1552.006
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1552.006
  custom_tags:
    - permission
    - misconfiguration
    - reconnaissance
    - process_creation
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (((data_win_eventdata_image:/.*\\[Ff][Ii][Nn][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ff][Ii][Nn][Dd][Ss][Tt][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ff][Ii][Nn][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ff][Ii][Nn][Dd][Ss][Tt][Rr]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*\"[Ee][Vv][Ee][Rr][Yy][Oo][Nn][Ee]\".*/ OR data_win_eventdata_commandLine:/.*'[Ee][Vv][Ee][Rr][Yy][Oo][Nn][Ee]'.*/ OR data_win_eventdata_commandLine:/.*\"[Bb][Uu][Ii][Ll][Tt][Ii][Nn]\\\".*/ OR data_win_eventdata_commandLine:/.*'[Bb][Uu][Ii][Ll][Tt][Ii][Nn]\\'.*/)) OR (data_win_eventdata_commandLine:/.*[Ii][Cc][Aa][Cc][Ll][Ss] .*/ AND data_win_eventdata_commandLine:/.*[Ff][Ii][Nn][Dd][Ss][Tt][Rr] .*/ AND data_win_eventdata_commandLine:/.*[Ee][Vv][Ee][Rr][Yy][Oo][Nn][Ee].*/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c625d754-6a3d-4f65-9c9a-536aea960d37
    name: Permission Check Via Accesschk.EXE
    reason: Accesschk is the alternative permission-weakness enumeration tool
  - id: cf8d753e-a8fe-11eb-8f58-acde48001122
    name: Icacls Deny Command
    reason: Found weak ACLs are changed or locked with icacls deny
  - id: b1b1e316-accc-11eb-a9b4-acde48001122
    name: ICACLS Grant Command
    reason: Operator grants themselves access after finding Everyone-writable paths
  - id: fa7ca5c6-c9d8-11eb-bce9-acde48001122
    name: Permission Modification using Takeown App
    reason: Takeown is the other ownership and permission tampering step
  - id: c248c896-e412-4279-8c15-1c558067b6fa
    name: Enumerate All Information With Whoami.EXE
    reason: Whoami /all accompanies privesc enumeration
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: icacls recursive enumeration
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ii]cacls.*\/[Tt].*/ OR /.*[Ii]cacls.*\/[Ss].*/)
    pivot_on: host
    window: 4h
  - name: ACL and ownership changes
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ii]cacls.*\/(grant|deny|setowner).*/ OR /.*[Tt]akeown.*/ OR /.*[Cc]acls.*\/[EeGg].*/)
    pivot_on: host
    window: 4h
  - name: Service binary path tampering
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*sc(\.exe)? +(config|create).*[Bb]in[Pp]ath.*/)
    pivot_on: host
    window: 4h
  - name: Executables dropped in program directories
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(/.*\\Program Files.*\.(exe|dll)/ OR /.*\\Windows\\System32\\.*\.(exe|dll)/)
    pivot_on: host
    window: 4h
