name: Suspicious Velociraptor Child Process
id: 4bc90587-e6ca-4b41-be0b-ed4d04e4ed0c
version: 1
schema_version: "1.0"
date: "2025-08-29"
author: Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 4bc90587-e6ca-4b41-be0b-ed4d04e4ed0c
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the suspicious use of the Velociraptor DFIR tool to execute other
  tools or download additional payloads, as seen in a campaign where it was
  abused for remote access and to stage further attacks. MITRE ATT&CK: T1219.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_parentImage:
              value: "*\\\\Velociraptor.exe"
              case_insensitive: true
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*code.exe*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*tunnel*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*--accept-server-license-terms*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*msiexec*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*/i*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*http*"
                          case_insensitive: true
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\powershell.exe"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\powershell_ise.exe"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\pwsh.exe"
                                case_insensitive: true
                        minimum_should_match: 1
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*Invoke-WebRequest *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*IWR *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*.DownloadFile*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*.DownloadString*"
                                case_insensitive: true
                        minimum_should_match: 1
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\Velociraptor.exe'; data_win_eventdata_commandLine matches '*code.exe*';
  data_win_eventdata_commandLine matches '*tunnel*', among other conditions.

known_false_positives: >
  Legitimate administrators or incident responders might use Velociraptor to
  execute scripts or tools. However, the combination of Velociraptor spawning
  these specific processes with these command lines is suspicious. Tuning may be
  required to exclude known administrative actions or specific scripts. Baseline
  expected activity in your environment and tune this detection before relying
  on it for automated response.

references:
  - https://news.sophos.com/en-us/2025/08/26/velociraptor-incident-response-tool-abused-for-remote-access/
  - https://attack.mitre.org/techniques/T1219/

response:
  message: >
    Suspicious Velociraptor Child Process detected on host $agent_name$. Matched
    data_win_eventdata_parentImage: $data_win_eventdata_parentImage$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1219
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1219
  custom_tags:
    - velociraptor
    - child
    - process_creation
    - sysmon
    - command_and_control
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Vv][Ee][Ll][Oo][Cc][Ii][Rr][Aa][Pp][Tt][Oo][Rr]\.[Ee][Xx][Ee]/ AND ((data_win_eventdata_commandLine:/.*[Cc][Oo][Dd][Ee]\.[Ee][Xx][Ee].*/ AND data_win_eventdata_commandLine:/.*[Tt][Uu][Nn][Nn][Ee][Ll].*/ AND data_win_eventdata_commandLine:/.*--[Aa][Cc][Cc][Ee][Pp][Tt]-[Ss][Ee][Rr][Vv][Ee][Rr]-[Ll][Ii][Cc][Ee][Nn][Ss][Ee]-[Tt][Ee][Rr][Mm][Ss].*/) OR (data_win_eventdata_commandLine:/.*[Mm][Ss][Ii][Ee][Xx][Ee][Cc].*/ AND data_win_eventdata_commandLine:/.*\/[Ii].*/ AND data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp].*/) OR ((data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]_[Ii][Ss][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Ww][Ee][Bb][Rr][Ee][Qq][Uu][Ee][Ss][Tt] .*/ OR data_win_eventdata_commandLine:/.*[Ii][Ww][Rr] .*/ OR data_win_eventdata_commandLine:/.*\.[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ff][Ii][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*\.[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/)))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 90d6bd71-dffb-4989-8d86-a827fedd6624
    name: Visual Studio Code Tunnel Execution
    reason: VS Code tunnel launched by Velociraptor is the exact abuse seen in this campaign
  - id: 30bf1789-379d-4fdc-900f-55cd0a90a801
    name: Visual Studio Code Tunnel Service Installation
    reason: Tunnel installed as a service for persistent remote access after the Velociraptor stage
  - id: 4b657234-038e-4ad5-997c-4be42340bce4
    name: Network Connection Initiated To Visual Studio Code Tunnels Domain
    reason: Network connection to VS Code tunnel domains confirms the tunnel is live
  - id: b3e6418f-7c7a-4fad-993a-93b65027a9f1
    name: DNS Query To Visual Studio Code Tunnels Domain
    reason: DNS lookup of VS Code tunnel domain precedes the connection
  - id: f7b5f842-a6af-4da5-9e95-e32478f3cd2f
    name: MsiExec Web Install
    reason: Msiexec web install is the other payload-delivery child this rule flags
  - id: 5594e67a-7f92-4a04-b65d-1a42fd824a60
    name: MSI Installation From Web
    reason: MSI installed from a web location, the result of the msiexec /i http child
  - id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
    name: PowerShell Download and Execution Cradles
    reason: PowerShell download-and-execute cradle by the Velociraptor-spawned shell
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Tunnel or remote-access tool launches
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Tt][Uu][Nn][Nn][Ee][Ll].*/ OR data_win_eventdata_image:/.*[Cc][Ll][Oo][Uu][Dd][Ff][Ll][Aa][Rr][Ee][Dd].*/ OR data_win_eventdata_image:/.*[Ss][Cc][Rr][Ee][Ee][Nn][Cc][Oo][Nn][Nn][Ee][Cc][Tt].*/ OR data_win_eventdata_image:/.*[Aa][Nn][Yy][Dd][Ee][Ss][Kk].*/)
    pivot_on: host
    window: 4h
  - name: Velociraptor binary or command activity
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Vv][Ee][Ll][Oo][Cc][Ii][Rr][Aa][Pp][Tt][Oo][Rr].*/ OR data_win_eventdata_image:/.*[Vv][Ee][Ll][Oo][Cc][Ii][Rr][Aa][Pp][Tt][Oo][Rr].*/)
    pivot_on: host
    window: 24h
  - name: Msiexec with remote package
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Mm][Ss][Ii][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp].*/
    pivot_on: host
    window: 4h
  - name: DNS to tunnel domains
    query: data_win_system_eventID:"22" AND data_win_eventdata_queryName:/.*([Tt][Uu][Nn][Nn][Ee][Ll][Ss]\.[Aa][Pp][Ii]\.[Vv][Ii][Ss][Uu][Aa][Ll][Ss][Tt][Uu][Dd][Ii][Oo]|[Tt][Rr][Yy][Cc][Ll][Oo][Uu][Dd][Ff][Ll][Aa][Rr][Ee]|[Dd][Ee][Vv][Tt][Uu][Nn][Nn][Ee][Ll][Ss]|[Nn][Gg][Rr][Oo][Kk]).*/
    pivot_on: host
    window: 4h
  - name: New services created
    query: (data_win_system_eventID:"7045" OR data_win_system_eventID:"4697")
    pivot_on: host
    window: 4h
