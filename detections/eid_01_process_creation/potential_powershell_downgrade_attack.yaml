name: Potential PowerShell Downgrade Attack
id: b3512211-c67e-4707-bedc-66efc7848863
version: 1
schema_version: "1.0"
date: "2023-01-04"
author: Harish Segar (rule)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: b3512211-c67e-4707-bedc-66efc7848863
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects PowerShell downgrade attack by comparing the host versions with the
  actually used engine version 2.0. MITRE ATT&CK: T1059.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\powershell.exe"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -version 2 *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -versio 2 *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -versi 2 *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -vers 2 *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -ver 2 *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -ve 2 *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -v 2 *"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\powershell.exe'; data_win_eventdata_commandLine matches '* -version 2 *';
  data_win_eventdata_commandLine matches '* -versio 2 *', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - http://www.leeholmes.com/blog/2017/03/17/detecting-and-preventing-powershell-downgrade-attacks/
  - https://github.com/r00t-3xp10it/hacking-material-books/blob/43cb1e1932c16ff1f58b755bc9ab6b096046853f/obfuscation/simple_obfuscation.md#bypass-or-avoid-amsi-by-version-downgrade-
  - https://attack.mitre.org/techniques/T1059/001/

response:
  message: >
    Potential PowerShell Downgrade Attack detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1059.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
  custom_tags:
    - powershell
    - downgrade
    - attack
    - process_creation
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.* -[Vv][Ee][Rr][Ss][Ii][Oo][Nn] 2 .*/ OR data_win_eventdata_commandLine:/.* -[Vv][Ee][Rr][Ss][Ii][Oo] 2 .*/ OR data_win_eventdata_commandLine:/.* -[Vv][Ee][Rr][Ss][Ii] 2 .*/ OR data_win_eventdata_commandLine:/.* -[Vv][Ee][Rr][Ss] 2 .*/ OR data_win_eventdata_commandLine:/.* -[Vv][Ee][Rr] 2 .*/ OR data_win_eventdata_commandLine:/.* -[Vv][Ee] 2 .*/ OR data_win_eventdata_commandLine:/.* -[Vv] 2 .*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: fecfd1a1-cc78-4313-a1ea-2ee2e8ec27a7
    name: PowerShell Logging Disabled Via Registry Key Tampering
    reason: Downgrade to v2 and disabling script-block/module logging are twin ways of blinding PowerShell telemetry; one often accompanies the other.
  - id: ca2092a1-c273-4878-9b4b-0d60115bf5ea
    name: Suspicious Encoded PowerShell Command Line
    reason: Encoded payloads are run under engine 2.0 to escape AMSI and 4104 logging; the encoded command is what the downgrade protects.
  - id: e6c54d94-498c-4562-a37c-b469d8e9a275
    name: Suspicious PowerShell Download and Execute Pattern
    reason: Download-and-execute cradles are the usual payload launched in the v2 session.
  - id: 754ed792-634f-40ae-b3bc-e0448d33f695
    name: Suspicious PowerShell Parent Process
    reason: Identifies the unusual parent (Office, script host, LOLBin) that launched the downgraded PowerShell.
  - id: 9be56c82-b1cc-4318-87eb-d138afaaca39
    name: Malicious PowerShell Process - Execution Policy Bypass
    reason: Downgrade is commonly combined with -ExecutionPolicy Bypass in the same launch line.
  - id: 115fdba9-f017-42e6-84cf-d5573bf2ddf8
    name: Disable of ETW Trace - Powershell
    reason: 'Follow-on defense evasion: after losing AMSI via v2, actors also kill ETW tracing.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: PowerShell launches with encoded or hidden parameters
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND (data_win_eventdata_commandLine:/.*[ -][Ee]nc.*/ OR data_win_eventdata_commandLine:/.*[Ww]indow[Ss]tyle.*[Hh]idden.*/ OR data_win_eventdata_commandLine:/.*-[Ww] +[Hh]id.*/)
    pivot_on: host
    window: 2h
  - name: Download cradles in command lines
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Dd]ownload[Ss]tring.*/ OR /.*[Ii]nvoke-[Ww]eb[Rr]equest.*/ OR /.*[Nn]et\.[Ww]eb[Cc]lient.*/ OR /.*[Ss]tart-[Bb]its[Tt]ransfer.*/)
    pivot_on: host
    window: 2h
  - name: Script blocks with execution primitives
    query: data_win_system_eventID:4104 AND data_win_eventdata_scriptBlockText:(/.*[Ii]nvoke-[Ee]xpression.*/ OR /.*[Ff]rom[Bb]ase64[Ss]tring.*/)
    pivot_on: host
    window: 2h
  - name: Outbound network connections made by PowerShell
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND data_win_eventdata_initiated:true
    pivot_on: host
    window: 2h
  - name: LOLBin children spawned by PowerShell
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Pp]ower[Ss]hell.*/ AND data_win_eventdata_image:/.*\\(cmd|rundll32|regsvr32|mshta|certutil|bitsadmin|wscript|cscript)\.exe/
    pivot_on: host
    window: 2h
