name: HackTool - XORDump Execution
id: 66e563f9-1cbd-4a22-a957-d8b7c0f44372
version: 1
schema_version: "1.0"
date: "2023-02-08"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 66e563f9-1cbd-4a22-a957-d8b7c0f44372
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious use of XORDump process memory dumping utility. MITRE
  ATT&CK: T1036, T1003.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\xordump.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -process lsass.exe *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -m comsvcs *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -m dbghelp *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -m dbgcore *"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\xordump.exe'; data_win_eventdata_commandLine matches '* -process lsass.exe
  *'; data_win_eventdata_commandLine matches '* -m comsvcs *', among other
  conditions.

known_false_positives: >
  Another tool that uses the command line switches of XORdump. Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://github.com/audibleblink/xordump
  - https://attack.mitre.org/techniques/T1036/
  - https://attack.mitre.org/techniques/T1003/001/

response:
  message: >
    HackTool - XORDump Execution detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1036, T1003.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1036
    - T1003.001
  custom_tags:
    - hacktool
    - xordump
    - process_creation
    - sysmon
    - stealth
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Xx][Oo][Rr][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.* -[Pp][Rr][Oo][Cc][Ee][Ss][Ss] [Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee] .*/ OR data_win_eventdata_commandLine:/.* -[Mm] [Cc][Oo][Mm][Ss][Vv][Cc][Ss] .*/ OR data_win_eventdata_commandLine:/.* -[Mm] [Dd][Bb][Gg][Hh][Ee][Ll][Pp] .*/ OR data_win_eventdata_commandLine:/.* -[Mm] [Dd][Bb][Gg][Cc][Oo][Rr][Ee] .*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: XORDump is invoked with -m comsvcs; the same host may use the native comsvcs MiniDump path as an alternate or fallback LSASS dump method.
  - id: ffa6861c-4461-4f59-8a41-578c39f3f23e
    name: LSASS Dump Keyword In CommandLine
    reason: Other LSASS-dump command lines on the host show the operator trying several dumpers in sequence.
  - id: c8da0dfd-4ed0-4b68-962d-13c9c884384e
    name: Potential Credential Dumping Via LSASS Process Clone
    reason: A cloned-LSASS dump is a common alternative once a dumper is blocked or detected.
  - id: ec570e53-4c76-45a9-804d-dc3f355ff7a7
    name: 7Zip Compressing Dump Files
    reason: A produced memory dump is typically compressed right after for exfiltration.
  - id: a29808fd-ef50-49ff-9c7a-59a9b040b404
    name: HackTool - Pypykatz Credentials Dumping Activity
    reason: Dump files are parsed offline or on-host with pypykatz to extract credentials.
  - id: c2b86e67-b880-4eec-b045-50bc98ef4844
    name: HackTool - LaZagne Execution
    reason: Credential-harvesting tools commonly run together with an LSASS dumper.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other LSASS/credential dump tooling on host
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*[Ll]sass.*/ OR data_win_eventdata_commandLine:/.*[Mm]ini[Dd]ump.*/ OR data_win_eventdata_commandLine:/.*[Pp]rocdump.*/ OR data_win_eventdata_commandLine:/.*comsvcs.*/)
    pivot_on: host
    window: 4h
  - name: Dump file compression or staging
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*\.dmp.*/ OR data_win_eventdata_commandLine:/.*\.dump.*/) AND data_win_eventdata_commandLine:/.*(7z|rar|zip|makecab|compress).*/
    pivot_on: host
    window: 4h
  - name: Process access to LSASS
    query: data_win_system_eventID:10 AND data_win_eventdata_targetImage:/.*[Ll]sass\.exe/
    pivot_on: host
    window: 2h
  - name: Dump file created on disk
    query: data_win_system_eventID:11 AND (data_win_eventdata_targetFilename:/.*\.dmp/ OR data_win_eventdata_targetFilename:/.*\.dump/)
    pivot_on: host
    window: 2h
