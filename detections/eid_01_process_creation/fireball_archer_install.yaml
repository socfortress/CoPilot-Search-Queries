name: Fireball Archer Install
id: 3d4aebe0-6d29-45b2-a8a4-3dfde586a26d
version: 1
schema_version: "1.0"
date: "2021-11-27"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 3d4aebe0-6d29-45b2-a8a4-3dfde586a26d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects Archer malware invocation via rundll32. MITRE ATT&CK: T1218.011.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*rundll32.exe*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*InstallArcherSvc*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*rundll32.exe*'; data_win_eventdata_commandLine matches '*InstallArcherSvc*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.virustotal.com/en/file/9b4971349ae85aa09c0a69852ed3e626c954954a3927b3d1b6646f139b930022/analysis/
  - https://www.hybrid-analysis.com/sample/9b4971349ae85aa09c0a69852ed3e626c954954a3927b3d1b6646f139b930022?environmentId=100
  - https://attack.mitre.org/techniques/T1218/011/

response:
  message: >
    Fireball Archer Install detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1218.011
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218.011
  custom_tags:
    - fireball
    - archer
    - install
    - process_creation
    - sysmon
    - execution
    - stealth
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee].*/ AND data_win_eventdata_commandLine:/.*[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Aa][Rr][Cc][Hh][Ee][Rr][Ss][Vv][Cc].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e593cf51-88db-4ee1-b920-37e89012a3c9
    name: Potentially Suspicious Rundll32 Activity
    reason: Same rundll32 proxy-execution technique; generic rundll32 anomalies around the Archer install.
  - id: 2569ed8c-1147-498a-9b8c-2ad3656b10ed
    name: Potential Renamed Rundll32 Execution
    reason: Renamed rundll32 is a common evasion by adware/malware loaders like Fireball.
  - id: 43fa5350-db63-4b8f-9a01-789a427074e1
    name: Potential Obfuscated Ordinal Call Via Rundll32
    reason: Obfuscated ordinal calls to rundll32 are another loader pattern to hunt alongside.
  - id: de587dce-915e-4218-aac4-835ca6af6f70
    name: Potential Persistence Attempt Via Run Keys Using Reg.EXE
    reason: Archer installs persistence; Run-key changes are the likely companion.
  - id: 431a1fdb-4799-4f3b-91c3-a683b003fc49
    name: New Kernel Driver Via SC.EXE
    reason: InstallArcherSvc registers a service; new service/driver creation via sc would confirm install.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Rundll32 loading DLL from user-writable path
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*\\rundll32\.exe/ AND data_win_eventdata_commandLine:/.*(Temp|AppData|ProgramData|Public|Downloads).*/
    pivot_on: host
    window: 24h
  - name: New service installed (7045) from unusual path
    query: data_win_system_eventID:7045 AND data_win_eventdata_imagePath:/.*(Temp|AppData|ProgramData|rundll32).*/
    pivot_on: host
    window: 24h
  - name: Rundll32 external network connections
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*\\rundll32\.exe/ AND data_win_eventdata_initiated:true
    pivot_on: host
    window: 6h
  - name: DLL dropped in user-writable paths
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\.[Dd][Ll][Ll]/ AND data_win_eventdata_targetFilename:/.*(Temp|AppData|ProgramData|Public).*/
    pivot_on: host
    window: 24h
  - name: Browser settings or Run key persistence writes
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*(CurrentVersion\\Run|SearchScopes|Internet Settings).*/
    pivot_on: host
    window: 24h
