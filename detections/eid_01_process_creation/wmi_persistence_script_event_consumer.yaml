name: WMI Persistence - Script Event Consumer
id: ec1d5e28-8f3b-4188-a6f8-6e8df81dc28e
version: 1
schema_version: "1.0"
date: "2022-10-11"
author: Thomas Patzke
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: ec1d5e28-8f3b-4188-a6f8-6e8df81dc28e
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of a script event consumer. When scrcons.exe launches,
  it does so in response to the creation of an ActiveScriptEventConsumer
  instance and will execute registered JScript or VBScript code as a result.
  Script event consumers are a built-in Windows Management Instrumentation (WMI)
  class that automatically executes a predefined script (in VBScript or JScript)
  whenever a specific system event occurs. Adversaries often abuse script event
  consumers to maintain persistence on a compromised host by executing a
  malicious script whenever a specific event occurs. MITRE ATT&CK: T1546.003.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - term:
            data_win_eventdata_image:
              value: "C:\\WINDOWS\\system32\\wbem\\scrcons.exe"
              case_insensitive: true
        - term:
            data_win_eventdata_parentImage:
              value: "C:\\Windows\\System32\\svchost.exe"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image equals
  'C:\WINDOWS\system32\wbem\scrcons.exe'; data_win_eventdata_parentImage equals
  'C:\Windows\System32\svchost.exe'.

known_false_positives: >
  Legitimate event consumers. Dell computers on some versions register an event
  consumer that is known to cause false positives when brightness is changed by
  the corresponding keyboard button. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://redcanary.com/blog/threat-detection/child-processes/
  - https://www.eideon.com/2018-03-02-THL03-WMIBackdoors/
  - https://attack.mitre.org/techniques/T1546/003/

response:
  message: >
    WMI Persistence - Script Event Consumer detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_parentImage: $data_win_eventdata_parentImage$. MITRE
    ATT&CK: T1546.003
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_parentImage
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1546.003
  custom_tags:
    - persistence
    - consumer
    - process_creation
    - sysmon
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ww][Bb][Ee][Mm]\\[Ss][Cc][Rr][Cc][Oo][Nn][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_parentImage:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 0f06a3a5-6a09-413f-8743-e6cf35561297
    name: WMI Event Subscription
    reason: 'Direct precursor: the filter/consumer/binding subscription that causes scrcons.exe to launch.'
  - id: windows-wmi-permanent-event-subscription-001
    name: Windows WMI Permanent Event Subscription
    reason: Permanent subscription creation is what arms the ActiveScriptEventConsumer.
  - id: fe21810c-2a8c-478f-8dd3-5a287fb2a0e0
    name: Suspicious Scripting in a WMI Consumer
    reason: Shows the VBScript/JScript payload content inside the consumer that scrcons now executes.
  - id: 83844185-1c5b-45bc-bcf3-b5bf3084ca5b
    name: Suspicious Encoded Scripts in a WMI Consumer
    reason: Encoded script bodies in the consumer explain what this scrcons run executes.
  - id: ebef4391-1a81-4761-a40a-1db446c0e625
    name: NewActiveScriptEventConsumer Creation Attempt via Wmic.EXE
    reason: Command-line creation of the consumer that precedes scrcons execution.
  - id: b439f47d-ef52-4b29-9a2f-57d8a96cb6b8
    name: WMI ActiveScriptEventConsumers Activity Via Scrcons.EXE DLL Load
    reason: Same scrcons execution seen at image-load level, confirming script engines loaded.
  - id: 33f41cdd-35ac-4ba8-814b-c6a4244a1ad4
    name: WMI Persistence - Script Event Consumer File Write
    reason: scrcons writing files indicates payload drop by the consumer script.
  - id: 9e07f6e7-83aa-45c6-998e-0af26efd0a85
    name: Powershell WMI Persistence
    reason: PowerShell is the usual way the subscription was created.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: scrcons.exe child processes
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Ss]crcons\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 6h
  - name: WMI subscription objects created
    query: data_win_system_eventID:(19 OR 20 OR 21)
    pivot_on: host
    window: 24h
  - name: Subscription creation via mofcomp/PowerShell/wmic
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Aa]ctive[Ss]cript[Ee]vent[Cc]onsumer.*/ OR /.*[Ee]vent[Ff]ilter.*/ OR /.*[Ff]ilter[Tt]o[Cc]onsumer[Bb]inding.*/ OR /.*[Mm]ofcomp.*/)
    pivot_on: host
    window: 24h
  - name: Script and MOF files written
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(/.*\.vbs/ OR /.*\.js/ OR /.*\.mof/ OR /.*\.ps1/)
    pivot_on: host
    window: 24h
