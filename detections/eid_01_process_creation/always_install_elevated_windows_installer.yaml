name: Always Install Elevated Windows Installer
id: cd951fdc-4b2f-47f5-ba99-a33bf61e3770
version: 1
schema_version: "1.0"
date: "2024-12-01"
author: Teymur Kheirkhabarov (idea), Mangatas Tondang (rule), oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: cd951fdc-4b2f-47f5-ba99-a33bf61e3770
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects Windows Installer service (msiexec.exe) trying to install MSI packages
  with SYSTEM privilege. MITRE ATT&CK: T1548.002.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\Windows\\\\Installer\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*msi*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*tmp"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\msiexec.exe"
                          case_insensitive: true
                    - bool:
                        should:
                          - term:
                              data_win_eventdata_integrityLevel:
                                value: "System"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_integrityLevel:
                                value: "S-1-16-16384"
                                case_insensitive: true
                        minimum_should_match: 1
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_user:
                    value: "*AUTHORI*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_user:
                    value: "*AUTORI*"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_parentImage"
        - exists:
            field: "data_win_eventdata_commandLine"
        - exists:
            field: "data_win_eventdata_parentCommandLine"
        - bool:
            must_not:
              - bool:
                  should:
                    - term:
                        data_win_eventdata_parentImage:
                          value: "C:\\Windows\\System32\\services.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*\\\\system32\\\\msiexec.exe /V"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_parentCommandLine:
                          value: "*\\\\system32\\\\msiexec.exe /V"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_parentImage:
                          value: "C:\\\\ProgramData\\\\Sophos\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_parentImage:
                          value: "C:\\\\ProgramData\\\\Avira\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_parentImage:
                          value: "C:\\\\Program Files\\\\Avast Software\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_parentImage:
                          value: "C:\\\\Program Files (x86)\\\\Avast Software\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_parentImage:
                          value: "C:\\\\Program Files\\\\Google\\\\Update\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_parentImage:
                          value: "C:\\\\Program Files (x86)\\\\Google\\\\Update\\\\*"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_integrityLevel
    - data_win_eventdata_user
    - data_win_eventdata_parentImage
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentCommandLine

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\Windows\Installer\*'; data_win_eventdata_image matches '*msi*';
  data_win_eventdata_image matches '*tmp', among other conditions.

known_false_positives: >
  System administrator usage. Anti virus products. WindowsApps located in
  "C:\Program Files\WindowsApps\". Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://image.slidesharecdn.com/kheirkhabarovoffzonefinal-181117201458/95/hunting-for-privilege-escalation-in-windows-environment-48-638.jpg
  - https://attack.mitre.org/techniques/T1548/002/

response:
  message: >
    Always Install Elevated Windows Installer detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_integrityLevel: $data_win_eventdata_integrityLevel$.
    MITRE ATT&CK: T1548.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_integrityLevel
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1548.002
  custom_tags:
    - always
    - install
    - elevated
    - process_creation
    - sysmon
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Ee][Rr]\\.*/ AND data_win_eventdata_image:/.*[Mm][Ss][Ii].*/ AND data_win_eventdata_image:/.*[Tt][Mm][Pp]/) OR (data_win_eventdata_image:/.*\\[Mm][Ss][Ii][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_integrityLevel:/[Ss][Yy][Ss][Tt][Ee][Mm]/ OR data_win_eventdata_integrityLevel:/[Ss]-1-16-16384/))) AND (data_win_eventdata_user:/.*[Aa][Uu][Tt][Hh][Oo][Rr][Ii].*/ OR data_win_eventdata_user:/.*[Aa][Uu][Tt][Oo][Rr][Ii].*/) AND _exists_:data_win_eventdata_parentImage AND _exists_:data_win_eventdata_commandLine AND _exists_:data_win_eventdata_parentCommandLine AND NOT (data_win_eventdata_parentImage:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Mm][Ss][Ii][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee] \/[Vv]/ OR data_win_eventdata_parentCommandLine:/.*\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Mm][Ss][Ii][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee] \/[Vv]/ OR data_win_eventdata_parentImage:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\[Ss][Oo][Pp][Hh][Oo][Ss]\\.*/ OR data_win_eventdata_parentImage:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\[Aa][Vv][Ii][Rr][Aa]\\.*/ OR data_win_eventdata_parentImage:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Aa][Vv][Aa][Ss][Tt] [Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\.*/ OR data_win_eventdata_parentImage:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Aa][Vv][Aa][Ss][Tt] [Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\.*/ OR data_win_eventdata_parentImage:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Gg][Oo][Oo][Gg][Ll][Ee]\\[Uu][Pp][Dd][Aa][Tt][Ee]\\.*/ OR data_win_eventdata_parentImage:/[Cc]:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\[Gg][Oo][Oo][Gg][Ll][Ee]\\[Uu][Pp][Dd][Aa][Tt][Ee]\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 1e53dd56-8d83-4eb4-a43e-b790a05510aa
    name: Always Install Elevated MSI Spawned Cmd And Powershell
    reason: 'Direct follow-on: an MSI running as SYSTEM that spawns cmd/powershell is the privilege-escalation payoff.'
  - id: f7b5f842-a6af-4da5-9e95-e32478f3cd2f
    name: MsiExec Web Install
    reason: The elevated MSI is often fetched remotely by msiexec before it runs as SYSTEM.
  - id: 79a87aa6-e4bd-42fc-a5bb-5e6fbdcd62f5
    name: Msiexec Quiet Installation
    reason: Silent msiexec installs accompany unattended install of a malicious package.
  - id: e22a6eb2-f8a5-44b5-8b44-a2dbd47b1144
    name: Potential MsiExec Masquerading
    reason: A fake msiexec.exe outside system32 is an alternative way to satisfy the same image match.
  - id: c7c8aa1c-5aff-408e-828b-998e3620b341
    name: MSI Installation From Suspicious Locations
    reason: Application-log record of the MSI install from a temp/user-writable path, confirming the package source.
  - id: 590a5f4c-6c8c-4f10-8307-89afe9453a9d
    name: Suspicious Child Process Created as System
    reason: Confirms SYSTEM-level children after the elevation succeeded.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Children spawned by msiexec
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Mm]siexec\.exe/ AND data_win_eventdata_image:(/.*[Cc]md\.exe/ OR /.*[Pp]ower[Ss]hell.*/ OR /.*[Pp]wsh\.exe/ OR /.*[Ww]script\.exe/ OR /.*[Rr]undll32\.exe/)
    pivot_on: host
    window: 2h
  - name: AlwaysInstallElevated policy key change
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*[Aa]lways[Ii]nstall[Ee]levated.*/
    pivot_on: host
    window: 24h
  - name: MSI or installer temp files created
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(/.*\.[Mm][Ss][Ii]/ OR /.*[Ww]indows\\[Ii]nstaller\\.*\.[Tt][Mm][Pp]/)
    pivot_on: host
    window: 2h
  - name: Account or group changes after elevation
    query: data_win_system_eventID:(4720 OR 4732 OR 4728)
    pivot_on: host
    window: 4h
  - name: Network connections by msiexec
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*[Mm]siexec\.exe/
    pivot_on: host
    window: 2h
