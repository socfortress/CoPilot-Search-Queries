name: Hacktool Execution - PE Metadata
id: 37c1333a-a0db-48be-b64b-7393b2386e3b
version: 1
schema_version: "1.0"
date: "2024-01-15"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 37c1333a-a0db-48be-b64b-7393b2386e3b
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of different Windows based hacktools via PE metadata
  (company, product, etc.) even if the files have been renamed. MITRE ATT&CK:
  T1588.002, T1003.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - term:
            data_win_eventdata_company:
              value: "Cube0x0"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_company
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_company equals 'Cube0x0'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/cube0x0
  - https://www.virustotal.com/gui/search/metadata%253ACube0x0/files
  - https://attack.mitre.org/techniques/T1588/002/
  - https://attack.mitre.org/techniques/T1003/

response:
  message: >
    Hacktool Execution - PE Metadata detected on host $agent_name$. Matched
    data_win_eventdata_company: $data_win_eventdata_company$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1588.002, T1003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_company
      type: other
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1588.002
    - T1003
  custom_tags:
    - hacktool
    - metadata
    - process_creation
    - sysmon
    - credential_access
    - resource_development
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_company:/[Cc][Uu][Bb][Ee]0[Xx]0/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 24e3e58a-646b-4b50-adef-02ef935b9fc8
    name: Hacktool Execution - Imphash
    reason: 'Sibling rule: same hacktool detected by imphash; both firing strengthens attribution even when the file is renamed.'
  - id: 7ec2c172-dceb-4c10-92c9-87c1881b7e18
    name: HackTool - Rubeus Execution
    reason: PE-metadata match covers offensive .NET tools like Rubeus; Kerberos abuse is a natural follow-on.
  - id: f376c8a7-a2d0-4ddc-aa0c-16c17236d962
    name: HackTool - Bloodhound/Sharphound Execution
    reason: Offensive tooling run during AD reconnaissance in the same intrusion.
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: Credential theft tooling commonly run next to other hacktools.
  - id: c484e533-ee16-4a93-b6ac-f0ea4868b2f1
    name: HackTool - SharpUp PrivEsc Tool Execution
    reason: Privilege-escalation recon tool in the same tradecraft set.
  - id: 5ef9853e-4d0e-4a70-846f-a9ca37d876da
    name: Potential Credential Dumping Activity Via LSASS
    reason: Credential-access consequence when the matched hacktool is a dumper.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Executables run from user-writable locations
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Tt]emp\\.*\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp]ublic\\.*\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp]rogram[Dd]ata\\.*\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Dd]ownloads\\.*\.[Ee][Xx][Ee]/)
    pivot_on: host
    window: 4h
  - name: LSASS process access on the host
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_grantedAccess:"0x1FFFFF" OR data_win_eventdata_grantedAccess:"0x1F3FFF" OR data_win_eventdata_grantedAccess:"0x1410" OR data_win_eventdata_grantedAccess:"0x1010" OR data_win_eventdata_grantedAccess:"0x1438")
    pivot_on: host
    window: 1h
  - name: Executables written before execution
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.[Ee][Xx][Ee]/ AND (data_win_eventdata_targetFilename:/.*\\[Tt]emp\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Pp]ublic\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Dd]ownloads\\.*/ OR data_win_eventdata_targetFilename:/.*\\[Pp]rogram[Dd]ata\\.*/)
    pivot_on: host
    window: 4h
  - name: Kerberos and AD recon command lines
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Aa]sktgt.*/ OR data_win_eventdata_commandLine:/.*[Aa]sktgs.*/ OR data_win_eventdata_commandLine:/.*[Kk]erberoast.*/ OR data_win_eventdata_commandLine:/.*[Dd]csync.*/ OR data_win_eventdata_commandLine:/.*[Cc]ollection[Mm]ethod.*/)
    pivot_on: host
    window: 4h
  - name: Defender or security tooling disabled or excluded
    query: (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Ww]indows [Dd]efender.*/ AND (data_win_eventdata_targetObject:/.*[Ee]xclusions.*/ OR data_win_eventdata_targetObject:/.*[Dd]isable.*/ OR data_win_eventdata_targetObject:/.*[Tt]amper.*/)) OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Ss]et-[Mm]p[Pp]reference.*/ AND (data_win_eventdata_commandLine:/.*[Ee]xclusion.*/ OR data_win_eventdata_commandLine:/.*[Dd]isable.*/))
    pivot_on: host
    window: 6h
