name: COLDSTEEL RAT Service Persistence Execution
id: 9f9cd389-cea0-4142-bf1a-a3fd424abedd
version: 1
schema_version: "1.0"
date: "2023-04-30"
author: X__Junior (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 9f9cd389-cea0-4142-bf1a-a3fd424abedd
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the creation of an "svchost" process with specific command line flags,
  that were seen present and used by ColdSteel RAT.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\svchost.exe"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -k msupdate"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -k msupdate2"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* -k alg"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\svchost.exe'; data_win_eventdata_commandLine matches '* -k msupdate';
  data_win_eventdata_commandLine matches '* -k msupdate2', among other
  conditions.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.ncsc.gov.uk/static-assets/documents/malware-analysis-reports/cold-steel/NCSC-MAR-Cold-Steel.pdf

response:
  message: >
    COLDSTEEL RAT Service Persistence Execution detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
  risk_score: 90
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 90
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - coldsteel
    - service
    - persistence
    - process_creation
    - sysmon
    - stealth
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.* -[Kk] [Mm][Ss][Uu][Pp][Dd][Aa][Tt][Ee]/ OR data_win_eventdata_commandLine:/.* -[Kk] [Mm][Ss][Uu][Pp][Dd][Aa][Tt][Ee]2/ OR data_win_eventdata_commandLine:/.* -[Kk] [Aa][Ll][Gg]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e01b6eb5-1eb4-4465-a165-85d40d874add
    name: COLDSTEEL RAT Anonymous User Process Execution
    reason: MileStone2016 children run as ANONYMOUS after the service starts.
  - id: 88516f06-ebe0-47ad-858e-ae9fd060ddea
    name: COLDSTEEL RAT Cleanup Command Execution
    reason: 'Follow-on: the service spawns rundll32 to run its own cleanup export.'
  - id: 16c37b52-b141-42a5-a3ea-bbe098444397
    name: Suspect Svchost Activity
    reason: Anomalous svchost command line corroborates a hijacked service host.
  - id: 01d2e2a1-5f09-44f7-9fc1-24faa7479b6d
    name: Uncommon Svchost Parent Process
    reason: An installer or dropper may launch svchost from an unusual parent.
  - id: 17a1be64-8d88-40bf-b5ff-a4f7a50ebcc8
    name: Suspicious New Service Creation
    reason: The persistence service has to be created first via sc or registry.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: New service installed (7045)
    query: data_win_system_eventID:7045
    pivot_on: host
    window: 24h
  - name: Service registry key creation for msupdate or alg
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*\\Services\\.*(msupdate|alg).*/
    pivot_on: host
    window: 24h
  - name: Rundll32 service-style export calls
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*[Rr]undll32.*(ServiceMain|UpdateDriverForPlugAndPlayDevicesW|DiUninstallDevice).*/
    pivot_on: host
    window: 24h
  - name: Outbound connections from svchost
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*svchost\.exe/
    pivot_on: host
    window: 6h
  - name: ANONYMOUS user processes
    query: data_win_system_eventID:1 AND data_win_eventdata_user:/.*ANONYMOUS.*/
    pivot_on: host
    window: 24h
