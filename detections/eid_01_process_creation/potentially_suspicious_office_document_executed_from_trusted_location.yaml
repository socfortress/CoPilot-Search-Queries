name: Potentially Suspicious Office Document Executed From Trusted Location
id: f99abdf0-6283-4e71-bd2b-b5c048a94743
version: 1
schema_version: "1.0"
date: "2023-10-18"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: f99abdf0-6283-4e71-bd2b-b5c048a94743
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of an Office application that points to a document that
  is located in a trusted location. Attackers often used this to avoid macro
  security and execute their malicious code. MITRE ATT&CK: T1202.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\explorer.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\dopus.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\EXCEL.EXE"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\POWERPNT.EXE"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\WINWORD.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "Excel.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "POWERPNT.EXE"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "WinWord.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\AppData\\\\Roaming\\\\Microsoft\\\\Templates*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\AppData\\\\Roaming\\\\Microsoft\\\\Word\\\\Startup\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Microsoft Office\\\\root\\\\Templates\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Microsoft Office\\\\Templates\\\\*"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_commandLine"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*.dotx"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*.xltx"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*.potx"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\explorer.exe'; data_win_eventdata_parentImage matches '*\dopus.exe';
  data_win_eventdata_image matches '*\EXCEL.EXE', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - Internal Research
  - https://twitter.com/Max_Mal_/status/1633863678909874176
  - https://techcommunity.microsoft.com/t5/microsoft-365-blog/new-security-hardening-policies-for-trusted-documents/ba-p/3023465
  - https://twitter.com/_JohnHammond/status/1588155401752788994
  - https://attack.mitre.org/techniques/T1202/

response:
  message: >
    Potentially Suspicious Office Document Executed From Trusted Location
    detected on host $agent_name$. Matched data_win_eventdata_parentImage:
    $data_win_eventdata_parentImage$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1202
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1202
  custom_tags:
    - office
    - document
    - executed
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Dd][Oo][Pp][Uu][Ss]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_image:/.*\\[Ee][Xx][Cc][Ee][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Pp][Nn][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Ww][Oo][Rr][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ee][Xx][Cc][Ee][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Pp][Oo][Ww][Ee][Rr][Pp][Nn][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ww][Ii][Nn][Ww][Oo][Rr][Dd]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Rr][Oo][Aa][Mm][Ii][Nn][Gg]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Tt][Ee][Mm][Pp][Ll][Aa][Tt][Ee][Ss].*/ OR data_win_eventdata_commandLine:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Rr][Oo][Aa][Mm][Ii][Nn][Gg]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Oo][Rr][Dd]\\[Ss][Tt][Aa][Rr][Tt][Uu][Pp]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt] [Oo][Ff][Ff][Ii][Cc][Ee]\\[Rr][Oo][Oo][Tt]\\[Tt][Ee][Mm][Pp][Ll][Aa][Tt][Ee][Ss]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt] [Oo][Ff][Ff][Ii][Cc][Ee]\\[Tt][Ee][Mm][Pp][Ll][Aa][Tt][Ee][Ss]\\.*/) AND _exists_:data_win_eventdata_commandLine AND NOT (data_win_eventdata_commandLine:/.*\.[Dd][Oo][Tt][Xx]/ OR data_win_eventdata_commandLine:/.*\.[Xx][Ll][Tt][Xx]/ OR data_win_eventdata_commandLine:/.*\.[Pp][Oo][Tt][Xx]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 438025f9-5856-4663-83f7-52f878a70a50
    name: Suspicious Microsoft Office Child Process
    reason: A trusted-location document runs macros without prompts; Office spawning shells or script hosts is the payload stage.
  - id: aa3a6f94-890e-4e22-b634-ffdfd54792cc
    name: Suspicious Binary In User Directory Spawned From Office Application
    reason: 'Macro dropper pattern: Office launches a binary dropped in a user directory.'
  - id: 868955d9-697e-45d4-a3da-360cefd7c216
    name: Potential Exploitation Attempt From Office Application
    reason: Office loading unusual code after opening the document points to exploitation or macro payload.
  - id: 4ae3e30b-b03f-43aa-87e3-b622f4048eed
    name: Potential Arbitrary File Download Using Office Application
    reason: Office downloading a remote file is a variant of the same document-driven delivery.
  - id: af4c4609-5755-42fe-8075-4effb49f5d44
    name: Microsoft Excel Add-In Loaded From Uncommon Location
    reason: Malicious XLL/add-ins are an alternative code-exec route from the same Excel launch.
  - id: e1693bc8-7168-4eab-8718-cdcaa68a1738
    name: Suspicious WMIC Execution Via Office Process
    reason: Macro-launched WMIC is a common follow-on for execution and discovery.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Shell and LOLBin children of Excel or PowerPoint
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\([Ee][Xx][Cc][Ee][Ll]|[Pp][Oo][Ww][Ee][Rr][Pp][Nn][Tt])\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Cc][Mm][Dd]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Mm][Ss][Hh][Tt][Aa]|[Rr][Uu][Nn][Dd][Ll][Ll]32|[Rr][Ee][Gg][Ss][Vv][Rr]32|[Ww][Mm][Ii][Cc])\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Executable and script files created by Office
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*\\([Ee][Xx][Cc][Ee][Ll]|[Pp][Oo][Ww][Ee][Rr][Pp][Nn][Tt])\.[Ee][Xx][Ee]/ AND data_win_eventdata_targetFilename:/.*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Pp][Ss]1|[Vv][Bb][Ss]|[Jj][Ss]|[Bb][Aa][Tt]|[Xx][Ll][Ll]|[Hh][Tt][Aa])/
    pivot_on: host
    window: 2h
  - name: Network connections initiated by Office apps
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Ee][Xx][Cc][Ee][Ll]|[Pp][Oo][Ww][Ee][Rr][Pp][Nn][Tt])\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Trusted location and macro warning registry changes
    query: data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*([Ss]ecurity\\[Tt]rusted [Ll]ocations|[Vv][Bb][Aa][Ww]arnings|[Aa]ccess[Vv][Bb][Oo][Mm]).*/
    pivot_on: host
    window: 24h
