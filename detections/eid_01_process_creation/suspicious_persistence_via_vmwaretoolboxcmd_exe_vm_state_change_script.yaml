name: Suspicious Persistence Via VMwareToolBoxCmd.EXE VM State Change Script
id: 236d8e89-ed95-4789-a982-36f4643738ba
version: 1
schema_version: "1.0"
date: "2023-06-14"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 236d8e89-ed95-4789-a982-36f4643738ba
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of the "VMwareToolBoxCmd.exe" with the "script" and "set"
  flag to setup a specific script that's located in a potentially suspicious
  location to run for a specific VM state. MITRE ATT&CK: T1059.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\VMwareToolBoxCmd.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "toolbox-cmd.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* script *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* set *"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*:\\\\PerfLogs\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*:\\\\Temp\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*:\\\\Windows\\\\System32\\\\Tasks\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*:\\\\Windows\\\\Tasks\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*:\\\\Windows\\\\Temp\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\AppData\\\\Local\\\\Temp*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\VMwareToolBoxCmd.exe'; data_win_eventdata_originalFileName equals
  'toolbox-cmd.exe'; data_win_eventdata_commandLine matches '* script *', among
  other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://bohops.com/2021/10/08/analyzing-and-detecting-a-vmtools-persistence-technique/
  - https://attack.mitre.org/techniques/T1059/

response:
  message: >
    Suspicious Persistence Via VMwareToolBoxCmd.EXE VM State Change Script
    detected on host $agent_name$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1059
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059
  custom_tags:
    - persistence
    - vmwaretoolboxcmd
    - state
    - process_creation
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Vv][Mm][Ww][Aa][Rr][Ee][Tt][Oo][Oo][Ll][Bb][Oo][Xx][Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Tt][Oo][Oo][Ll][Bb][Oo][Xx]-[Cc][Mm][Dd]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.* [Ss][Cc][Rr][Ii][Pp][Tt] .*/ AND data_win_eventdata_commandLine:/.* [Ss][Ee][Tt] .*/ AND (data_win_eventdata_commandLine:/.*:\\[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss]\\.*/ OR data_win_eventdata_commandLine:/.*:\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_commandLine:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Tt][Aa][Ss][Kk][Ss]\\.*/ OR data_win_eventdata_commandLine:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Aa][Ss][Kk][Ss]\\.*/ OR data_win_eventdata_commandLine:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7aa4e81a-a65c-4e10-9f81-b200eb229d7d
    name: Potential Persistence Via VMwareToolBoxCmd.EXE VM State Change Script
    reason: Sibling rule for the same technique without the suspicious-path filter; firing together confirms a script bound to a VM power or state event
  - id: 5687f942-867b-4578-ade7-1e341c46e99a
    name: VMToolsd Suspicious Child Process
    reason: The registered state-change script runs as a child of vmtoolsd.exe; suspicious VMToolsd children show the persistence actually firing
  - id: 39019a4e-317f-4ce3-ae63-309a8c6b53c5
    name: Suspicious Scheduled Task Creation Involving Temp Folder
    reason: Same writable staging directories (Temp, PerfLogs) are used for scheduled-task persistence; actors often plant several mechanisms
  - id: 85f520e7-6f5e-43ca-874c-222e5bf9c0de
    name: Devcon Execution Disabling VMware VMCI Device
    reason: Another VMware tooling abuse (disabling VMCI) on the same host indicates tampering with guest tools
  - id: ebea773c-a8f1-42ad-a856-00cb221966e8
    name: DLL Sideloading by VMware Xfer Utility
    reason: VMware Xfer DLL sideloading is a co-occurring VMware-tools abuse for execution or persistence
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Executables and scripts created in the staging dirs the script lives in
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(/.*[Pp]erf[Ll]ogs.*/ OR /.*[Ww]indows.[Tt]emp.*/ OR /.*[Ww]indows.[Tt]asks.*/ OR /.*[Aa]pp[Dd]ata.[Ll]ocal.[Tt]emp.*/) AND data_win_eventdata_targetFilename:/.*\.(bat|cmd|ps1|vbs|exe|dll)/
    pivot_on: host
    window: 2h
  - name: vmtoolsd.exe spawning shells or script hosts
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Vv][Mm][Tt][Oo][Oo][Ll][Ss][Dd]\.exe/ AND data_win_eventdata_image:(/.*[Cc][Mm][Dd]\.exe/ OR /.*[Pp]ower[Ss]hell.*/ OR /.*[Ww][Ss]cript\.exe/ OR /.*[Cc][Ss]cript\.exe/)
    pivot_on: host
    window: 24h
  - name: 'Other persistence: scheduled tasks and Run keys'
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss].*\/[Cc][Rr][Ee][Aa][Tt][Ee].*/ OR /.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn].[Rr][Uu][Nn].*/)
    pivot_on: host
    window: 6h
  - name: Other VMwareToolBoxCmd invocations
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Vv][Mm][Ww][Aa][Rr][Ee][Tt][Oo][Oo][Ll][Bb][Oo][Xx][Cc][Mm][Dd]\.exe/
    pivot_on: host
    window: 24h
  - name: Discovery commands after VM-tools tampering
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ww][Hh][Oo][Aa][Mm][Ii].*/ OR /.*[Nn][Ee][Tt].[Gg][Rr][Oo][Uu][Pp].*/ OR /.*[Nn][Ll][Tt][Ee][Ss][Tt].*/)
    pivot_on: host
    window: 4h
