name: Wab/Wabmig Unusual Parent Or Child Processes
id: 63d1ccc0-2a43-4f4b-9289-361b308991ff
version: 1
schema_version: "1.0"
date: "2022-09-27"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 63d1ccc0-2a43-4f4b-9289-361b308991ff
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects unusual parent or children of the wab.exe (Windows Contacts) and
  Wabmig.exe (Microsoft Address Book Import Tool) processes as seen being used
  with bumblebee activity.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_parentImage:
                                value: "*\\\\WmiPrvSE.exe"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_parentImage:
                                value: "*\\\\svchost.exe"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_parentImage:
                                value: "*\\\\dllhost.exe"
                                case_insensitive: true
                        minimum_should_match: 1
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\wab.exe"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_image:
                                value: "*\\\\wabmig.exe"
                                case_insensitive: true
                        minimum_should_match: 1
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\wab.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\wabmig.exe"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\WmiPrvSE.exe'; data_win_eventdata_parentImage matches '*\svchost.exe';
  data_win_eventdata_parentImage matches '*\dllhost.exe', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://thedfirreport.com/2022/08/08/bumblebee-roasts-its-way-to-domain-admin/
  - https://symantec-enterprise-blogs.security.com/blogs/threat-intelligence/bumblebee-loader-cybercrime
  - https://thedfirreport.com/2022/09/26/bumblebee-round-two/

response:
  message: >
    Wab/Wabmig Unusual Parent Or Child Processes detected on host $agent_name$.
    Matched data_win_eventdata_parentImage: $data_win_eventdata_parentImage$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - wabmig
    - unusual
    - parent
    - process_creation
    - sysmon
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (((data_win_eventdata_parentImage:/.*\\[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Dd][Ll][Ll][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_image:/.*\\[Ww][Aa][Bb]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Aa][Bb][Mm][Ii][Gg]\.[Ee][Xx][Ee]/)) OR data_win_eventdata_parentImage:/.*\\[Ww][Aa][Bb]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ww][Aa][Bb][Mm][Ii][Gg]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 395907ee-96e5-4666-af2e-2ca91688e151
    name: Wab Execution From Non Default Location
    reason: Bumblebee loaders also run a copied or renamed wab.exe from user-writable paths; same host confirms the wab abuse chain.
  - id: fc014922-5def-4da9-a0fc-28c973f41bfb
    name: Execution DLL of Choice Using WAB.EXE
    reason: Registry hijack of the WAB DLL path makes wab.exe load the attacker DLL, preceding the unusual wab child or parent.
  - id: 994cac2b-92c2-44bf-8853-14f6ca39fbda
    name: Potential Bumblebee Remote Thread Creation
    reason: Bumblebee injects into wab.exe or wabmig.exe via remote threads right after the loader runs; direct co-occurring follow-on.
  - id: 8de1cbe8-d6f5-496d-8237-5f44a721c7a0
    name: Whoami.EXE Execution Anomaly
    reason: Bumblebee first hands-on step after injection is whoami and recon spawned from the injected process.
  - id: e593cf51-88db-4ee1-b920-37e89012a3c9
    name: Potentially Suspicious Rundll32 Activity
    reason: Bumblebee is commonly delivered as a DLL via rundll32 (often from ISO or LNK) before it hijacks wab.exe.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Bumblebee-style recon commands
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*[Ww]hoami.*/ OR data_win_eventdata_commandLine:/.*[Nn]et[1]?.exe.*(user|group|view).*/ OR data_win_eventdata_commandLine:/.*[Nn]ltest.*/ OR data_win_eventdata_commandLine:/.*[Aa]dfind.*/)
    pivot_on: host
    window: 2h
  - name: Network connections from wab/wabmig
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*[Ww]ab(mig)?\.exe/
    pivot_on: host
    window: 2h
  - name: Rundll32 DLL loader activity
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Rr]undll32\.exe/ AND data_win_eventdata_commandLine:/.*\.(dll|iso|lnk).*/
    pivot_on: host
    window: 4h
  - name: Persistence or encoded PowerShell after wab
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*[Ss]chtasks.*\/[Cc]reate.*/ OR data_win_eventdata_commandLine:/.*[Rr]eg.*[Aa]dd.*[Rr]un.*/ OR data_win_eventdata_commandLine:/.*[Pp]owershell.*-[Ee]nc.*/)
    pivot_on: host
    window: 4h
