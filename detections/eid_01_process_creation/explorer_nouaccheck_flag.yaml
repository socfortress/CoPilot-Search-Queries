name: Explorer NOUACCHECK Flag
id: 534f2ef7-e8a2-4433-816d-c91bccde289b
version: 1
schema_version: "1.0"
date: "2022-04-21"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 534f2ef7-e8a2-4433-816d-c91bccde289b
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious starts of explorer.exe that use the /NOUACCHECK flag that
  allows to run all sub processes of that newly started explorer.exe without any
  UAC checks. MITRE ATT&CK: T1548.002.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\explorer.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*/NOUACCHECK*"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_parentCommandLine"
        - exists:
            field: "data_win_eventdata_parentImage"
        - bool:
            must_not:
              - bool:
                  should:
                    - term:
                        data_win_eventdata_parentCommandLine:
                          value: "C:\\Windows\\system32\\svchost.exe -k netsvcs -p -s Schedule"
                          case_insensitive: true
                    - term:
                        data_win_eventdata_parentImage:
                          value: "C:\\Windows\\System32\\svchost.exe"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentCommandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\explorer.exe'; data_win_eventdata_commandLine matches '*/NOUACCHECK*';
  data_win_eventdata_parentCommandLine equals 'C:\Windows\system32\svchost.exe
  -k netsvcs -p -s Schedule', among other conditions.

known_false_positives: >
  Domain Controller User Logon. Unknown how many legitimate software products
  use that method. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/ORCA6665/status/1496478087244095491
  - https://attack.mitre.org/techniques/T1548/002/

response:
  message: >
    Explorer NOUACCHECK Flag detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1548.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1548.002
  custom_tags:
    - explorer
    - nouaccheck
    - process_creation
    - sysmon
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*\/[Nn][Oo][Uu][Aa][Cc][Cc][Hh][Ee][Cc][Kk].*/ AND _exists_:data_win_eventdata_parentCommandLine AND _exists_:data_win_eventdata_parentImage AND NOT (data_win_eventdata_parentCommandLine:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee] -[Kk] [Nn][Ee][Tt][Ss][Vv][Cc][Ss] -[Pp] -[Ss] [Ss][Cc][Hh][Ee][Dd][Uu][Ll][Ee]/ OR data_win_eventdata_parentImage:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 7f741dcf-fc22-4759-87b4-9ae8376676a2
    name: Bypass UAC via Fodhelper.exe
    reason: Alternative UAC bypass; paired use shows an attacker iterating UAC bypass techniques.
  - id: 909f8fd8-7ac8-11eb-a1f3-acde48001122
    name: FodHelper UAC Bypass
    reason: Registry-based UAC bypass seen alongside explorer /NOUACCHECK as sibling elevation attempts.
  - id: d38d2fa4-98e6-4a24-aff1-410b0c9ad177
    name: HackTool - UACMe Akagi Execution
    reason: UACMe tooling can launch explorer with this flag to get elevated children.
  - id: 949f1ffb-6e85-4f00-ae1e-c3c5b190d605
    name: Explorer Process Tree Break
    reason: Another explorer.exe abuse to relaunch commands under a detached parent.
  - id: 3268b746-88d8-4cd3-bffc-30077d02c787
    name: HackTool - Empire PowerShell UAC Bypass
    reason: 'Prior stage: PowerShell implant bypassing UAC before relaunching explorer.'
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Children of the NOUACCHECK explorer
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Ee]xplorer\.exe/ AND data_win_eventdata_image:(/.*[Cc]md\.exe/ OR /.*[Pp]ower[Ss]hell.*/ OR /.*[Mm]shta.*/ OR /.*[Rr]undll32.*/)
    pivot_on: host
    window: 2h
  - name: Other UAC bypass registry hijacks
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:(/.*ms-settings.*[Cc]ommand.*/ OR /.*[Ee]nvironment.*windir.*/ OR /.*mscfile.*/)
    pivot_on: host
    window: 4h
  - name: UAC policy tampering
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:(/.*EnableLUA.*/ OR /.*ConsentPromptBehaviorAdmin.*/ OR /.*LocalAccountTokenFilterPolicy.*/)
    pivot_on: host
    window: 6h
  - name: Explorer launched with unusual switches
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Ee]xplorer\.exe/ AND data_win_eventdata_commandLine:(*NOUACCHECK* OR */factory*)
    pivot_on: host
    window: 4h
