name: Potential Script Proxy Execution Via CL_Mutexverifiers.ps1
id: 1e0e1a81-e79b-44bc-935b-ddb9c8006b3d
version: 1
schema_version: "1.0"
date: "2023-08-17"
author: Nasreddine Bencherchali (Nextron Systems), oscd.community, Natalia Shornikova, frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 1e0e1a81-e79b-44bc-935b-ddb9c8006b3d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the use of the Microsoft signed script "CL_mutexverifiers" to proxy
  the execution of additional PowerShell script commands. MITRE ATT&CK: T1216.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\powershell.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\pwsh.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\powershell.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* -nologo -windowstyle minimized -file *"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\AppData\\\\Local\\\\Temp\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Windows\\\\Temp\\\\*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\powershell.exe'; data_win_eventdata_parentImage matches '*\pwsh.exe';
  data_win_eventdata_image matches '*\powershell.exe', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://lolbas-project.github.io/lolbas/Scripts/CL_mutexverifiers/
  - https://attack.mitre.org/techniques/T1216/

response:
  message: >
    Potential Script Proxy Execution Via CL_Mutexverifiers.ps1 detected on host
    $agent_name$. Matched data_win_eventdata_parentImage:
    $data_win_eventdata_parentImage$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1216
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1216
  custom_tags:
    - proxy
    - mutexverifiers
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/) AND data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.* -[Nn][Oo][Ll][Oo][Gg][Oo] -[Ww][Ii][Nn][Dd][Oo][Ww][Ss][Tt][Yy][Ll][Ee] [Mm][Ii][Nn][Ii][Mm][Ii][Zz][Ee][Dd] -[Ff][Ii][Ll][Ee] .*/ AND (data_win_eventdata_commandLine:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a0459f02-ac51-4c09-b511-b8c9203fc429
    name: Potential Process Execution Proxy Via CL_Invocation.ps1
    reason: Sibling Windows diagnostic-script proxy (same PowerShell-wrapped technique).
  - id: c57872c7-614f-4d7f-a40d-b78c8df2d30d
    name: Assembly Loading Via CL_LoadAssembly.ps1
    reason: Sibling signed diagnostic script abused to load attacker assemblies.
  - id: 45d3a03d-f441-458c-8883-df101a3bb146
    name: Launch-VsDevShell.PS1 Proxy Execution
    reason: Same class of Microsoft-signed script PowerShell proxying.
  - id: 0403d67d-6227-4ea8-8145-4e72db7da120
    name: UtilityFunctions.ps1 Proxy Dll
    reason: Another signed-script proxy; attackers try several in sequence.
  - id: fbd7c32d-db2a-4418-b92c-566eb8911133
    name: SyncAppvPublishingServer Execute Arbitrary PowerShell Code
    reason: Alternative PowerShell proxy used when script proxies are blocked.
  - id: c4db14d9-7909-48b4-a054-aa14d89dbb19
    name: Malicious PowerShell Process - Encoded Command
    reason: The proxied payload is typically an encoded PowerShell command.
  - id: cea72823-df4d-4567-950c-0b579eaf0846
    name: Potential Dropper Script Execution Via WScript/CScript/MSHTA
    reason: Likely upstream delivery of the script staged in Temp.
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Hidden-window PowerShell running scripts from Temp or AppData
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Pp]ower[Ss]hell\.exe/ AND data_win_eventdata_commandLine:/.*(-[Ww]indow[Ss]tyle|-[Ww]) +([Hh]idden|[Mm]inimized).*/ AND data_win_eventdata_commandLine:/.*([Tt]emp|[Aa]pp[Dd]ata).*/
    pivot_on:
    - host
    window: 1h
  - name: Script and executable files created in Temp
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*([Tt]emp|[Aa]pp[Dd]ata\\[Ll]ocal)\\.*\.(ps1|dll|exe|bat|vbs|js)/
    pivot_on:
    - host
    window: 1h
  - name: PowerShell network connections
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Pp]ower[Ss]hell|[Pp]wsh)\.exe/
    pivot_on:
    - host
    window: 1h
  - name: Follow-on LOLBin proxy execution
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Rr]undll32|[Rr]egsvr32|[Mm]shta|[Mm]sbuild|[Cc]ertutil|[Bb]itsadmin|[Ww]script|[Cc]script)\.exe/
    pivot_on:
    - host
    window: 1h
  - name: LSASS access and credential dumping
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll]sass\.exe/
    pivot_on:
    - host
    window: 1h
