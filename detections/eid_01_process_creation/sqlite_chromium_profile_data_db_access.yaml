name: SQLite Chromium Profile Data DB Access
id: 24c77512-782b-448a-8950-eddb0785fc71
version: 1
schema_version: "1.0"
date: "2023-01-19"
author: TropChaud
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 24c77512-782b-448a-8950-eddb0785fc71
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detect usage of the "sqlite" binary to query databases in Chromium-based
  browsers for potential data stealing. MITRE ATT&CK: T1539, T1555.003, T1005.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - term:
                  data_win_eventdata_product:
                    value: "SQLite"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\sqlite.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\sqlite3.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\User Data\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Opera Software\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\ChromiumViewer\\\\*"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Login Data*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Cookies*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Web Data*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*History*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*Bookmarks*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_product
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_product equals 'SQLite';
  data_win_eventdata_image matches '*\sqlite.exe'; data_win_eventdata_image
  matches '*\sqlite3.exe', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/84d9edaaaa2c5511144521b0e4af726d1c7276ce/atomics/T1539/T1539.md#atomic-test-2---steal-chrome-cookies-windows
  - https://blog.cyble.com/2022/04/21/prynt-stealer-a-new-info-stealer-performing-clipper-and-keylogger-activities/
  - https://attack.mitre.org/techniques/T1539/
  - https://attack.mitre.org/techniques/T1555/003/
  - https://attack.mitre.org/techniques/T1005/

response:
  message: >
    SQLite Chromium Profile Data DB Access detected on host $agent_name$.
    Matched data_win_eventdata_product: $data_win_eventdata_product$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK: T1539,
    T1555.003, T1005
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_product
      type: other
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1539
    - T1555.003
    - T1005
  custom_tags:
    - sqlite
    - chromium
    - profile
    - process_creation
    - sysmon
    - credential_access
    - collection
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_product:/[Ss][Qq][Ll][Ii][Tt][Ee]/ OR data_win_eventdata_image:/.*\\[Ss][Qq][Ll][Ii][Tt][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ss][Qq][Ll][Ii][Tt][Ee]3\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*\\[Uu][Ss][Ee][Rr] [Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Oo][Pp][Ee][Rr][Aa] [Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\.*/ OR data_win_eventdata_commandLine:/.*\\[Cc][Hh][Rr][Oo][Mm][Ii][Uu][Mm][Vv][Ii][Ee][Ww][Ee][Rr]\\.*/) AND (data_win_eventdata_commandLine:/.*[Ll][Oo][Gg][Ii][Nn] [Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Oo][Kk][Ii][Ee][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ww][Ee][Bb] [Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_commandLine:/.*[Hh][Ii][Ss][Tt][Oo][Rr][Yy].*/ OR data_win_eventdata_commandLine:/.*[Bb][Oo][Oo][Kk][Mm][Aa][Rr][Kk][Ss].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 4833155a-4053-4c9c-a997-777fcea0baa7
    name: SQLite Firefox Profile Data DB Access
    reason: Same sqlite technique aimed at Firefox profiles; infostealers sweep every browser on the host.
  - id: 47147b5b-9e17-4d76-b8d2-7bac24c5ce1b
    name: Potential Browser Data Stealing
    reason: Other command-line access to browser data stores indicates the same credential/cookie theft sweep.
  - id: 6a69f62d-ce75-4b57-8dce-6351eb55b362
    name: Esentutl Steals Browser Information
    reason: esentutl copying browser files is an alternative way to lift the same Chromium databases.
  - id: 8ba484e8-4b97-11ec-b19a-acde48001122
    name: Possible Browser Pass View Parameter
    reason: Browser password viewer parameters extract the same Login Data content.
  - id: d0dae994-26c6-4d2d-83b5-b3c8b79ae513
    name: PUA - WebBrowserPassView Execution
    reason: WebBrowserPassView is a common tool for decrypting what sqlite reads from Chromium.
  - id: 3e8207c5-fcd2-4ea6-9418-15d45b4890e4
    name: Potential Data Stealing Via Chromium Headless Debugging
    reason: Headless/debugging Chromium is another route to steal cookies and sessions on the same host.
  - id: 5a6e1e16-07de-48d8-8aae-faa766c05e88
    name: Potential Cookies Session Hijacking
    reason: Cookie session hijacking is the use of the stolen browser data.
  - id: 9fbf5927-5261-4284-a71d-f681029ea574
    name: Compress Data and Lock With Password for Exfiltration With 7-ZIP
    reason: Password-protected archiving is the typical staging step before exfiltrating stolen browser data.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other tools reading Chromium Login Data, Cookies or Web Data
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*(\\[Uu][Ss][Ee][Rr] [Dd][Aa][Tt][Aa]\\|\\[Oo][Pp][Ee][Rr][Aa] [Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\).*/ AND data_win_eventdata_commandLine:/.*([Ll][Oo][Gg][Ii][Nn] [Dd][Aa][Tt][Aa]|[Cc][Oo][Oo][Kk][Ii][Ee][Ss]|[Ww][Ee][Bb] [Dd][Aa][Tt][Aa]).*/ AND data_win_eventdata_image:/.*\\([Cc][Mm][Dd]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Ee][Ss][Ee][Nn][Tt][Uu][Tt][Ll]|[Xx][Cc][Oo][Pp][Yy]|[Rr][Oo][Bb][Oo][Cc][Oo][Pp][Yy]|[Cc][Oo][Pp][Yy]|[Pp][Yy][Tt][Hh][Oo][Nn]|7[Zz])\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Browser credential stealer and DPAPI tools
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Ww][Ee][Bb][Bb][Rr][Oo][Ww][Ss][Ee][Rr][Pp][Aa][Ss][Ss][Vv][Ii][Ee][Ww]|[Cc][Hh][Rr][Oo][Mm][Ee][Pp][Aa][Ss][Ss]|[Hh][Aa][Cc][Kk][Bb][Rr][Oo][Ww][Ss][Ee][Rr][Dd][Aa][Tt][Aa]|[Ss][Hh][Aa][Rr][Pp][Cc][Hh][Rr][Oo][Mm][Ee]|[Ss][Hh][Aa][Rr][Pp][Dd][Pp][Aa][Pp][Ii]|[Ll][Aa][Zz][Aa][Gg][Nn][Ee]|[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*([Dd][Pp][Aa][Pp][Ii]::[Cc][Hh][Rr][Oo][Mm][Ee]|\\[Ll][Oo][Cc][Aa][Ll] [Ss][Tt][Aa][Tt][Ee]).*/)
    pivot_on: host
    window: 2h
  - name: Archiving or uploading collected data
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\(7[Zz]|[Rr][Aa][Rr]|[Ww][Ii][Nn][Rr][Aa][Rr]|[Tt][Aa][Rr])\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*(\.[Zz][Ii][Pp]|\.7[Zz]|\.[Rr][Aa][Rr]|\.[Tt][Aa][Rr]).*/) OR (data_win_eventdata_image:/.*\\[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*(--[Uu][Pp][Ll][Oo][Aa][Dd]-[Ff][Ii][Ll][Ee]|-[Tt] |--[Dd][Aa][Tt][Aa]-[Bb][Ii][Nn][Aa][Rr][Yy]|-[Ff] ).*/))
    pivot_on: host
    window: 2h
  - name: Headless or remote-debugging browser launches
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*(--[Rr][Ee][Mm][Oo][Tt][Ee]-[Dd][Ee][Bb][Uu][Gg][Gg][Ii][Nn][Gg]-[Pp][Oo][Rr][Tt]|--[Hh][Ee][Aa][Dd][Ll][Ee][Ss][Ss]|--[Uu][Ss][Ee][Rr]-[Dd][Aa][Tt][Aa]-[Dd][Ii][Rr]).*/
    pivot_on: host
    window: 2h
