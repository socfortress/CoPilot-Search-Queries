name: Windows File Download Via Certutil
id: windows-file-download-certutil-001
version: 1
schema_version: "1.0"
date: "2026-02-23"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects certutil.exe used to download files from remote URLs via -urlcache,
  -URL, /URL, or verifyctl flags. Certutil is a living-off-the-land binary
  commonly abused by adversaries for ingress tool transfer and payload staging.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - wildcard:
            data_win_eventdata_image: "*\\\\certutil.exe"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine: "*-urlcache*"
              - wildcard:
                  data_win_eventdata_commandLine: "*-URL *"
              - wildcard:
                  data_win_eventdata_commandLine: "*/URL *"
              - wildcard:
                  data_win_eventdata_commandLine: "*verifyctl*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-23 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-23 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Windows endpoints with Sysmon
  installed and configured to log process creation events (EventID 1) with full
  command-line arguments.

known_false_positives: >
  Administrators may use certutil for legitimate certificate operations.
  The -urlcache and verifyctl flags are rarely used for legitimate purposes.

references:
  - https://attack.mitre.org/techniques/T1105/
  - https://lolbas-project.github.io/lolbas/Binaries/Certutil/

response:
  message: >
    Certutil file download on $agent_name$.
    Command: $data_win_eventdata_commandLine$.
    Parent: $data_win_eventdata_parentImage$.
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1105
  risk_score: 64
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 64
  threat_objects: []

tags:
  analytic_story:
    - Ingress Tool Transfer
    - Living Off The Land
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1105
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*certutil\.exe/ AND (data_win_eventdata_commandLine:/.*-urlcache.*/ OR data_win_eventdata_commandLine:/.*-URL .*/ OR data_win_eventdata_commandLine:/.*\/URL .*/ OR data_win_eventdata_commandLine:/.*verifyctl.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: cc9cbe82-7bc0-4ef5-bc23-bbfb83947be7
    name: File Decoded From Base64/Hex Via Certutil.EXE
    reason: Certutil is commonly used to decode a downloaded base64/hex-wrapped payload into an executable right after the urlcache fetch.
  - id: d059842b-6b9d-4ed1-b5c3-5b89143c6ede
    name: File Download Via Bitsadmin
    reason: Attackers fall back to bitsadmin when certutil download is blocked or to stage further tooling from the same host.
  - id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
    name: PowerShell Download and Execution Cradles
    reason: Alternate ingress channel that often runs alongside or after certutil to execute the retrieved payload.
  - id: d2125259-ddea-4c1c-9c22-977eb5b29cf0
    name: New Root Certificate Installed Via Certutil.EXE
    reason: Same binary abused for trust manipulation; reveals broader certutil abuse on the host.
  - id: 070e9b80-6252-11eb-ae93-0242ac130002
    name: Detect Regsvr32 Application Control Bypass
    reason: Downloaded DLL/SCT payloads are frequently launched via regsvr32 as the execution step.
  - id: 9c5037d1-c568-49b3-88c7-9846a5bdc2be
    name: Suspicious Run Key from Download
    reason: A downloaded payload being made persistent through a Run key is a direct follow-on to ingress transfer.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Executable or script files written to user-writable paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*(\\[Tt][Ee][Mm][Pp]|\\[Pp][Uu][Bb][Ll][Ii][Cc]|\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]|\\[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss]).*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Pp][Ss]1|[Bb][Aa][Tt]|[Vv][Bb][Ss]|[Jj][Ss]|[Hh][Tt][Aa]|[Ss][Cc][Tt])/
    pivot_on: host
    window: 2h
  - name: Certutil outbound network connection
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/ AND data_win_eventdata_initiated:"true"
    pivot_on: host
    window: 2h
  - name: Certutil decode or encode of staged files
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*-[Dd][Ee][Cc][Oo][Dd][Ee].*/ OR data_win_eventdata_commandLine:/.*-[Ee][Nn][Cc][Oo][Dd][Ee].*/)
    pivot_on: host
    window: 2h
  - name: Processes launched from temp, public or appdata paths
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*(\\[Tt][Ee][Mm][Pp]|\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]|\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]|\\[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss])\\.*\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Persistence set via Run keys or scheduled tasks
    query: (data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Cc][Uu][Rr][Rr][Ee][Nn][Tt][Vv][Ee][Rr][Ss][Ii][Oo][Nn]\\[Rr][Uu][Nn].*/) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*\/[Cc][Rr][Ee][Aa][Tt][Ee].*/)
    pivot_on: host
    window: 4h
