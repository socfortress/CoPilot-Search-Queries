name: File Download Using ProtocolHandler.exe
id: 104cdb48-a7a8-4ca7-a453-32942c6e5dcb
version: 1
schema_version: "1.0"
date: "2023-11-09"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 104cdb48-a7a8-4ca7-a453-32942c6e5dcb
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects usage of "ProtocolHandler" to download files. Downloaded files will be
  located in the cache folder (for example -
  %LOCALAPPDATA%\Microsoft\Windows\INetCache\IE). MITRE ATT&CK: T1218.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\protocolhandler.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "ProtocolHandler.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*ftp://*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*http://*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*https://*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\protocolhandler.exe'; data_win_eventdata_originalFileName equals
  'ProtocolHandler.exe'; data_win_eventdata_commandLine matches '*ftp://*',
  among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1218/T1218.md
  - https://lolbas-project.github.io/lolbas/OtherMSBinaries/ProtocolHandler/
  - https://attack.mitre.org/techniques/T1218/

response:
  message: >
    File Download Using ProtocolHandler.exe detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1218
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218
  custom_tags:
    - download
    - protocolhandler
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Tt][Oo][Cc][Oo][Ll][Hh][Aa][Nn][Dd][Ll][Ee][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Pp][Rr][Oo][Tt][Oo][Cc][Oo][Ll][Hh][Aa][Nn][Dd][Ll][Ee][Rr]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*[Ff][Tt][Pp]:\/\/.*/ OR data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp]:\/\/.*/ OR data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp][Ss]:\/\/.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 4ae3e30b-b03f-43aa-87e3-b622f4048eed
    name: Potential Arbitrary File Download Using Office Application
    reason: ProtocolHandler.exe is an Office binary; same Office-binary download abuse family.
  - id: 438025f9-5856-4663-83f7-52f878a70a50
    name: Suspicious Microsoft Office Child Process
    reason: Office-parented launch of ProtocolHandler or a downloaded payload shows document-driven delivery.
  - id: 3b3c7f55-f771-4dd6-8a6e-08d057a17caf
    name: Arbitrary File Download Via MSPUB.EXE
    reason: Sibling Office LOLBin downloader operators swap between.
  - id: 459f2f98-397b-4a4a-9f47-6a5ec2f1c69d
    name: Arbitrary File Download Via MSOHTMED.EXE
    reason: Sibling Office LOLBin downloader operators swap between.
  - id: d059842b-6b9d-4ed1-b5c3-5b89143c6ede
    name: File Download Via Bitsadmin
    reason: Alternate native downloader in the same staging phase.
  - id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
    name: PowerShell Download and Execution Cradles
    reason: Common executor of the cached file after download.
  - id: fb9d3ff7-7348-46ab-af8c-b55f5fbf39b4
    name: Execution of Powershell Script in Public Folder
    reason: Downloaded scripts are often moved to and run from writable folders.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: ProtocolHandler executions with remote URLs
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*\\[Pp]rotocol[Hh]andler\.exe/ OR data_win_eventdata_originalFileName:/[Pp]rotocol[Hh]andler\.exe/) AND data_win_eventdata_commandLine:(*http* OR *ftp*)
    pivot_on: host
    window: 2h
  - name: Files written to INetCache
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\\INetCache\\.*/
    pivot_on: host
    window: 2h
  - name: Execution from INetCache
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*\\INetCache\\.*/
    pivot_on: host
    window: 4h
  - name: Network connections by ProtocolHandler
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*\\[Pp]rotocol[Hh]andler\.exe/
    pivot_on: host
    window: 2h
  - name: Office apps spawning script or LOLBin children
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*\\(winword|excel|powerpnt|outlook|mspub)\.exe/ AND data_win_eventdata_image:/.*\\(cmd|powershell|wscript|cscript|mshta|rundll32|regsvr32)\.exe/
    pivot_on: host
    window: 4h
