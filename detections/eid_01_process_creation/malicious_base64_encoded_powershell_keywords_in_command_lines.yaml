correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e32d4572-9826-4738-b651-95fa63747e8a
    name: Base64 Encoded PowerShell Command Detected
    reason: Generic base64-encoded PowerShell on the same host confirms the encoded-payload chain.
  - id: c4db14d9-7909-48b4-a054-aa14d89dbb19
    name: Malicious PowerShell Process - Encoded Command
    reason: The -EncodedCommand switch is the usual vehicle for these base64 keywords.
  - id: b9d9cc83-380b-4ba3-8d8f-60c0e7e2930c
    name: Suspicious PowerShell Encoded Command Patterns
    reason: Encoded PowerShell patterns commonly co-occur with hidden-window launches.
  - id: ee18ed37-0802-4268-9435-b3b91aaa18db
    name: PowerShell - Connect To Internet With Hidden Window
    reason: Hidden-window PowerShell that connects out is the typical payload behaviour.
  - id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
    name: PowerShell Download and Execution Cradles
    reason: Download cradles are what the decoded payload typically contains.
  - id: 9be56c82-b1cc-4318-87eb-d138afaaca39
    name: Malicious PowerShell Process - Execution Policy Bypass
    reason: Execution policy bypass flags are usually combined with hidden encoded launches.
  - id: 44e24481-6202-4c62-9127-5a0ae8e3fe3d
    name: Obfuscated PowerShell OneLiner Execution
    reason: Obfuscated one-liners are a sibling evasion in the same operator toolkit.
  - id: 30e92f50-bb5a-4884-98b5-d20aa80f3d7a
    name: Hidden Powershell in Link File Pattern
    reason: Hidden PowerShell from link files is a common delivery precursor.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: PowerShell network connections
    query: data_win_system_eventID:3 AND data_win_eventdata_initiated:true AND (data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ OR data_win_eventdata_image:/.*[Pp]wsh.*/)
    pivot_on: host
    window: 2h
  - name: Scripts and payloads dropped by PowerShell
    query: data_win_system_eventID:11 AND (data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ OR data_win_eventdata_image:/.*[Pp]wsh.*/) AND (data_win_eventdata_targetFilename:/.*\.(exe|dll|ps1|bat|vbs|js)/)
    pivot_on: host
    window: 2h
  - name: Persistence set via PowerShell/schtasks/reg
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*schtasks.*\/create.*/ OR data_win_eventdata_commandLine:/.*CurrentVersion\\Run.*/ OR data_win_eventdata_commandLine:/.*New-ScheduledTask.*/)
    pivot_on: host
    window: 6h
  - name: PowerShell parent of discovery/transfer tools
    query: data_win_system_eventID:1 AND (data_win_eventdata_parentImage:/.*[Pp]ower[Ss]hell.*/) AND (data_win_eventdata_image:/.*(bitsadmin|certutil|whoami|net1?|nltest)\.exe/)
    pivot_on: host
    window: 4h
  - name: Office or script-host parent of PowerShell
    query: data_win_system_eventID:1 AND (data_win_eventdata_parentImage:/.*(winword|excel|outlook|wscript|cscript|mshta)\.exe/) AND (data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ OR data_win_eventdata_image:/.*[Pp]wsh.*/)
    pivot_on: host
    window: 4h
