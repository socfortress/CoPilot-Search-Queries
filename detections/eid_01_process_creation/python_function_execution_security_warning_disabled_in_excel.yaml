name: Python Function Execution Security Warning Disabled In Excel
id: 023c654f-8f16-44d9-bb2b-00ff36a62af9
version: 1
schema_version: "1.0"
date: "2023-08-22"
author: "@Kostastsale"
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 023c654f-8f16-44d9-bb2b-00ff36a62af9
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects changes to the registry value "PythonFunctionWarnings" that would
  prevent any warnings or alerts from showing when Python functions are about to
  be executed. Threat actors could run malicious code through the new Microsoft
  Excel feature that allows Python to run within the spreadsheet. MITRE ATT&CK:
  T1685.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*\\\\Microsoft\\\\Office\\\\*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*\\\\Excel\\\\Security*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*PythonFunctionWarnings*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine: "* 0*"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*\Microsoft\Office\*'; data_win_eventdata_commandLine matches
  '*\Excel\Security*'; data_win_eventdata_commandLine matches
  '*PythonFunctionWarnings*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://support.microsoft.com/en-us/office/data-security-and-python-in-excel-33cc88a4-4a87-485e-9ff9-f35958278327
  - https://attack.mitre.org/techniques/T1685/

response:
  message: >
    Python Function Execution Security Warning Disabled In Excel detected on
    host $agent_name$. Matched data_win_eventdata_commandLine:
    $data_win_eventdata_commandLine$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1685
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685
  custom_tags:
    - python
    - function
    - security
    - process_creation
    - sysmon
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Oo][Ff][Ff][Ii][Cc][Ee]\\.*/ AND data_win_eventdata_commandLine:/.*\\[Ee][Xx][Cc][Ee][Ll]\\[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy].*/ AND data_win_eventdata_commandLine:/.*[Pp][Yy][Tt][Hh][Oo][Nn][Ff][Uu][Nn][Cc][Tt][Ii][Oo][Nn][Ww][Aa][Rr][Nn][Ii][Nn][Gg][Ss].*/ AND data_win_eventdata_commandLine:/.* 0.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 438025f9-5856-4663-83f7-52f878a70a50
    name: Suspicious Microsoft Office Child Process
    reason: Once Excel's Python warning is suppressed, abuse typically surfaces as Office spawning shells or script hosts.
  - id: aa3a6f94-890e-4e22-b634-ffdfd54792cc
    name: Suspicious Binary In User Directory Spawned From Office Application
    reason: A payload dropped in a user profile and launched by Excel follows the weakened guardrail.
  - id: 4ae3e30b-b03f-43aa-87e3-b622f4048eed
    name: Potential Arbitrary File Download Using Office Application
    reason: Excel-driven code is commonly used to pull a second stage.
  - id: Windows-Office-Product-Spawned-Child-Process-For-Download
    name: Windows Office Product Spawned Child Process For Download
    reason: Office child process fetching content is the typical follow-on to macro or Python-in-Excel abuse.
  - id: 899133d5-4d7c-4a7f-94ee-27355c879d90
    name: Python Inline Command Execution
    reason: The same actor may drive python.exe -c directly after tampering with Excel's Python settings.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Excel or Office registry security-setting changes
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:/.*[Oo]ffice.*[Ee]xcel.*[Ss]ecurity.*/
    pivot_on: host
    window: 4h
  - name: Child processes spawned by Excel
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Ee][Xx][Cc][Ee][Ll]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 4h
  - name: Outbound connections from Excel
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*[Ee][Xx][Cc][Ee][Ll]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 4h
  - name: Reg.exe or PowerShell writing Office policy keys
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*[Mm]icrosoft.[Oo]ffice.*/ AND data_win_eventdata_commandLine:/.*([Rr]eg|[Ss]et-[Ii]tem[Pp]roperty|[Nn]ew-[Ii]tem[Pp]roperty).*/
    pivot_on: user
    window: 4h
