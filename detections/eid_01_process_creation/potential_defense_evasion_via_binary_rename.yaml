name: Potential Defense Evasion Via Binary Rename
id: 36480ae1-a1cb-4eaa-a0d6-29801d7e9142
version: 1
schema_version: "1.0"
date: "2026-06-05"
author: Matthew Green @mgreen27, Ecco, James Pemberton @4A616D6573, oscd.community, Andreas Hunkeler (@Karneades)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 36480ae1-a1cb-4eaa-a0d6-29801d7e9142
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of a renamed binary often used by attackers or malware
  leveraging new Sysmon OriginalFileName datapoint. MITRE ATT&CK: T1036.003.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - term:
                  data_win_eventdata_originalFileName:
                    value: "Cmd.Exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "CONHOST.EXE"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "7z.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "7za.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "7zr.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "WinRAR.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "wevtutil.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "net.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "net1.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "netsh.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "InstallUtil.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\cmd.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\conhost.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\7z.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\7za.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\7zr.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\WinRAR.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\wevtutil.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\net.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\net1.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\netsh.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_image:
                          value: "*\\\\InstallUtil.exe"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_originalFileName
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_originalFileName equals
  'Cmd.Exe'; data_win_eventdata_originalFileName equals 'CONHOST.EXE';
  data_win_eventdata_originalFileName equals '7z.exe', among other conditions.

known_false_positives: >
  Custom applications use renamed binaries adding slight change to binary name.
  Typically this is easy to spot and add to whitelist. Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://mgreen27.github.io/posts/2019/05/12/BinaryRename.html
  - https://mgreen27.github.io/posts/2019/05/29/BinaryRename2.html
  - https://github.com/redcanaryco/atomic-red-team/blob/0f229c0e42bfe7ca736a14023836d65baa941ed2/atomics/T1036.003/T1036.003.md#atomic-test-1---masquerading-as-windows-lsass-process
  - https://www.splunk.com/en_us/blog/security/inno-setup-malware-redline-stealer-campaign.html
  - https://attack.mitre.org/techniques/T1036/003/

response:
  message: >
    Potential Defense Evasion Via Binary Rename detected on host $agent_name$.
    Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1036.003
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_originalFileName
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1036.003
  custom_tags:
    - defense
    - evasion
    - binary
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_originalFileName:/[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Cc][Oo][Nn][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/7[Zz]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/7[Zz][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/7[Zz][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ww][Ii][Nn][Rr][Aa][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Nn][Ee][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Nn][Ee][Tt]1\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Nn][Ee][Tt][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/) AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/.*\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Oo][Nn][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\7[Zz]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\7[Zz][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\7[Zz][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Rr][Aa][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Nn][Ee][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Nn][Ee][Tt]1\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Nn][Ee][Tt][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 4057291a-b8cf-11eb-95fe-acde48001122
    name: Detect Renamed 7-Zip
    reason: Renamed 7-Zip is one of the exact binaries covered, signalling hidden archiving for exfil.
  - id: 1b7bfb2c-b8e6-11eb-99ac-acde48001122
    name: Detect Renamed WinRAR
    reason: Renamed WinRAR indicates concealed archiving of collected data.
  - id: 236e7c8e-c9d9-11eb-a824-acde48001122
    name: Disable Logs Using WevtUtil
    reason: Wevtutil log disabling commonly follows renamed wevtutil use.
  - id: windows-eventlog-cleared-wevtutil-001
    name: Windows Eventlog Cleared Via Wevtutil
    reason: Eventlog clearing via wevtutil is the likely objective when wevtutil.exe is renamed.
  - id: d95de845-b83c-4a9a-8a6a-4fc802ebf6c0
    name: Suspicious Group And Account Reconnaissance Activity Using Net.EXE
    reason: Net.exe account and group recon is a common payload of a renamed net.exe.
  - id: cd219ff3-fa99-45d4-8380-a7d15116c6dc
    name: New User Created Via Net.EXE
    reason: New user via net.exe is persistence a renamed net.exe would perform.
  - id: 3abd6094-7027-475f-9630-8ab9be7b9725
    name: Windows Admin Share Mount Via Net.EXE
    reason: Admin share mount via net.exe indicates lateral movement with a renamed net.exe.
  - id: 0ba1da6d-b6ce-4366-828c-18826c9de23e
    name: Potential Defense Evasion Via Rename Of Highly Relevant Binaries
    reason: Sibling rule covering renamed attacker-favoured LOLBins on the same host.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Image name differs from original file name for core utilities
    query: data_win_system_eventID:"1" AND (data_win_eventdata_originalFileName:/[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Nn][Ee][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Nn][Ee][Tt]1\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Nn][Ee][Tt][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/7[Zz]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ww][Ii][Nn][Rr][Aa][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]/) AND NOT data_win_eventdata_image:/.*\\([Cc][Mm][Dd]\.[Ee][Xx][Ee]|[Nn][Ee][Tt]\.[Ee][Xx][Ee]|[Nn][Ee][Tt]1\.[Ee][Xx][Ee]|[Nn][Ee][Tt][Ss][Hh]\.[Ee][Xx][Ee]|[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|7[Zz]\.[Ee][Xx][Ee]|[Ww][Ii][Nn][Rr][Aa][Rr]\.[Ee][Xx][Ee]|[Ii][Nn][Ss][Tt][Aa][Ll][Ll][Uu][Tt][Ii][Ll]\.[Ee][Xx][Ee]|[Cc][Oo][Nn][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]|7[Zz][Aa]\.[Ee][Xx][Ee]|7[Zz][Rr]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 4h
  - name: Binaries executed from user-writable paths
    query: data_win_system_eventID:"1" AND data_win_eventdata_originalFileName:* AND (data_win_eventdata_image:/.*\\[Uu][Ss][Ee][Rr][Ss]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Tt][Ee][Mm][Pp]\\.*/)
    pivot_on: host
    window: 4h
  - name: Log clearing or audit tampering commands
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll] [Cc][Ll].*/ OR data_win_eventdata_commandLine:/.*[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll] [Cc][Ll][Ee][Aa][Rr]\-[Ll][Oo][Gg].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ll] /[Ee]:[Ff][Aa][Ll][Ss][Ee].*/ OR data_win_eventdata_commandLine:/.*[Aa][Uu][Dd][Ii][Tt][Pp][Oo][Ll] /[Cc][Ll][Ee][Aa][Rr].*/)
    pivot_on: host
    window: 4h
  - name: Archive creation with password or header encryption
    query: data_win_system_eventID:"1" AND (data_win_eventdata_originalFileName:/7[Zz]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ww][Ii][Nn][Rr][Aa][Rr]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.* [Aa] \-[Pp].*/ OR data_win_eventdata_commandLine:/.* [Aa] \-[Hh][Pp].*/ OR data_win_eventdata_commandLine:/.*\-[Mm][Hh][Ee].*/)
    pivot_on: host
    window: 4h
  - name: Net/Netsh account, share or firewall changes
    query: data_win_system_eventID:"1" AND (data_win_eventdata_originalFileName:/[Nn][Ee][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Nn][Ee][Tt]1\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Nn][Ee][Tt][Ss][Hh]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*[Uu][Ss][Ee][Rr] .*/ OR data_win_eventdata_commandLine:/.*[Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ss][Hh][Aa][Rr][Ee].*/ OR data_win_eventdata_commandLine:/.*[Aa][Dd][Vv][Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Pp][Oo][Rr][Tt][Pp][Rr][Oo][Xx][Yy].*/)
    pivot_on: host
    window: 6h
