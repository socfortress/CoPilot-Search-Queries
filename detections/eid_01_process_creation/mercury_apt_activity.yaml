name: MERCURY APT Activity
id: a62298a3-1fe0-422f-9a68-ffbcbc5a123d
version: 1
schema_version: "1.0"
date: "2023-03-10"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: a62298a3-1fe0-422f-9a68-ffbcbc5a123d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious command line patterns seen being used by MERCURY APT. MITRE
  ATT&CK: T1059.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*-exec bypass -w 1 -enc*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*UwB0AGEAcgB0AC0ASgBvAGIAIAAtAFMAYwByAGkAcAB0AEIAbABvAGMAawAgAHsAKABzAGEAcABzACAAKAAiAHAA*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*-exec bypass -w 1 -enc*'; data_win_eventdata_commandLine matches
  '*UwB0AGEAcgB0AC0ASgBvAGIAIAAtAFMAYwByAGkAcAB0AEIAbABvAGMAawAgAHsAKABzAGEAcABzACAAKAAiAHAA*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.microsoft.com/security/blog/2022/08/25/mercury-leveraging-log4j-2-vulnerabilities-in-unpatched-systems-to-target-israeli-organizations/
  - https://attack.mitre.org/techniques/T1059/001/

response:
  message: >
    MERCURY APT Activity detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1059.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
  custom_tags:
    - mercury
    - process_creation
    - sysmon
    - execution
    - g0069
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*-[Ee][Xx][Ee][Cc] [Bb][Yy][Pp][Aa][Ss][Ss] -[Ww] 1 -[Ee][Nn][Cc].*/ AND data_win_eventdata_commandLine:/.*[Uu][Ww][Bb]0[Aa][Gg][Ee][Aa][Cc][Gg][Bb]0[Aa][Cc]0[Aa][Ss][Gg][Bb][Vv][Aa][Gg][Ii][Aa][Ii][Aa][Aa][Tt][Aa][Ff][Mm][Aa][Yy][Ww][Bb][Yy][Aa][Gg][Kk][Aa][Cc][Aa][Bb]0[Aa][Ee][Ii][Aa][Bb][Aa][Bb][Vv][Aa][Gg][Mm][Aa][Aa][Ww][Aa][Gg][Aa][Hh][Ss][Aa][Kk][Aa][Bb][Zz][Aa][Gg][Ee][Aa][Cc][Aa][Bb][Zz][Aa][Cc][Aa][Aa][Kk][Aa][Aa][Ii][Aa][Hh][Aa][Aa].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: e32d4572-9826-4738-b651-95fa63747e8a
    name: Base64 Encoded PowerShell Command Detected
    reason: MERCURY runs a -enc PowerShell Start-Job launcher; generic encoded-command hits on the same host are the same stage.
  - id: 9be56c82-b1cc-4318-87eb-d138afaaca39
    name: Malicious PowerShell Process - Execution Policy Bypass
    reason: The MERCURY command line uses -exec bypass; this fires on the same bypass flag combination.
  - id: 85b0b087-eddf-4a2b-b033-d771fa2b9775
    name: PowerShell Download and Execution Cradles
    reason: The decoded Start-Job payload typically fetches follow-on tooling via a download cradle.
  - id: 8202070f-edeb-4d31-a010-a26c72ac5600
    name: Suspicious Process By Web Server Process
    reason: MERCURY gains access by exploiting internet-facing apps (Log4j, Exchange), so the PowerShell is often a webserver child.
  - id: 646ea171-dded-4578-8a4d-65e9822892e3
    name: Process Memory Dump Via Comsvcs.DLL
    reason: MERCURY post-exploitation includes LSASS dumping via comsvcs MiniDump.
  - id: da63bc76-61ae-11eb-ae93-0242ac130002
    name: Ntdsutil Export NTDS
    reason: MERCURY has been observed dumping NTDS.dit with ntdsutil after foothold.
  - id: 4627c6ae-6899-46e2-aa0c-6ebcb1becd19
    name: HackTool - Impacket Tools Execution
    reason: MERCURY uses Impacket for lateral movement after credential theft.
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: Credential harvesting with Mimikatz is a documented MERCURY follow-on.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other encoded PowerShell launches
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*[Pp]ower[Ss]hell.*\s-[Ee][Nn][Cc].*/
    pivot_on: host
    window: 24h
  - name: Webserver or Java parent spawning shells
    query: data_win_system_eventID:1 AND (data_win_eventdata_parentImage:/.*[Ww]3wp\.exe/ OR data_win_eventdata_parentImage:/.*[Jj]ava\.exe/ OR data_win_eventdata_parentImage:/.*[Tt]omcat.*/ OR data_win_eventdata_parentImage:/.*[Uu]mworkerprocess\.exe/) AND (data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ OR data_win_eventdata_image:/.*cmd\.exe/)
    pivot_on: host
    window: 24h
  - name: Credential dumping tooling and LSASS access
    query: (data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*[Cc]omsvcs.*[Mm]ini[Dd]ump.*/ OR data_win_eventdata_commandLine:/.*[Nn]tdsutil.*/ OR data_win_eventdata_commandLine:/.*[Ss]ekurlsa.*/)) OR (data_win_system_eventID:10 AND data_win_eventdata_targetImage:/.*[Ll]sass\.exe/)
    pivot_on: host
    window: 24h
  - name: Remote execution and lateral movement tooling
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*[Pp]s[Ee]xec.*/ OR data_win_eventdata_commandLine:/.*[Ww]mic.*\/node.*[Pp]rocess.*[Cc]all.*/ OR data_win_eventdata_commandLine:/.*\\\\127\.0\.0\.1\\[Aa][Dd][Mm][Ii][Nn]\$.*/)
    pivot_on: host
    window: 24h
  - name: Outbound connections from PowerShell
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ AND data_win_eventdata_initiated:true
    pivot_on: host
    window: 6h
