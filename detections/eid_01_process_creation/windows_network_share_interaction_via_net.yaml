name: Windows Network Share Interaction Via Net
id: Windows-Network-Share-Interaction-Via-Net
version: 3
schema_version: 1
date: '2025-05-02'
author: SOCFortress LLC
status: production
type: Anomaly
description: >
  Detects network share discovery and collection activities using net.exe with
  "use" or "view" arguments. Attackers use these commands to identify accessible
  shared resources within a network as a precursor to privilege escalation or
  data exfiltration. Associated with Active Directory Discovery, Active Directory
  Privilege Escalation, and Network Discovery tradecraft.
  MITRE ATT&CK: T1135 (Network Share Discovery), T1039 (Data from Network Shared Drive).

data_source:
  - Sysmon EventID 1 (ProcessCreate)

search:
  query:
    bool:
      must:
        - term:
            agent_name: "AGENT_NAME"
        - term:
            agent_labels_customer: "CUSTOMER_CODE"
        - term:
            data_win_system_eventID: "1"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image: "*\\net.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\net1.exe"
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine: "*use *"
              - wildcard:
                  data_win_eventdata_commandLine: "*view*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "START_TIME"
              lte: "END_TIME"

parameters:
  - name: AGENT_NAME
    default: "DESKTOP-AM0HLGE"
  - name: CUSTOMER_CODE
    default: "lab"
  - name: START_TIME
    default: "now-24h"
  - name: END_TIME
    default: "now"

how_to_implement: >
  Requires Sysmon EventID 1 (ProcessCreate) flowing to the Wazuh Indexer.
  Fields data_win_eventdata_image and data_win_eventdata_commandLine are
  confirmed working across all EventID 1 detections in this environment.
  Field-validated based on established EventID 1 detection patterns.

known_false_positives: >
  Administrators or power users may use net use or net view for legitimate
  network share management. Filter by parent process or user context as needed.

references:
  - https://attack.mitre.org/techniques/T1135/
  - https://attack.mitre.org/techniques/T1039/

response:
  message: >
    Network share interaction via net.exe detected on $agent_name$ by $data_win_eventdata_user$.
    Parent: $data_win_eventdata_parentImage$.
    Command: $data_win_eventdata_commandLine$.
    MITRE ATT&CK: T1135, T1039
  risk_score: 20
  severity: low
  risk_objects:
    - field: agent_name
      type: system
      score: 20
    - field: data_win_eventdata_user
      type: user
      score: 20
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: parent_process_name
    - field: data_win_eventdata_image
      type: process_name

tags:
  analytic_story:
    - Active Directory Discovery
    - Active Directory Privilege Escalation
    - Network Discovery
  asset_type: Endpoint
  mitre_attack_id:
    - T1135
    - T1039
  custom_tags:
    - net_use
    - net_view
    - network_share
    - reconnaissance
    - living_off_the_land
  product:
    - Wazuh
  security_domain: endpoint

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 3abd6094-7027-475f-9630-8ab9be7b9725
    name: Windows Admin Share Mount Via Net.EXE
    reason: Mounting an admin share is the escalation of share interaction toward lateral movement.
  - id: 855bc8b5-2ae8-402e-a9ed-b889e6df1900
    name: Copy From Or To Admin Share Or Sysvol Folder
    reason: Data copy or payload staging over the shares discovered.
  - id: ab9e3b40-0c85-4ba1-aede-455d226fd124
    name: Suspicious Redirection to Local Admin Share
    reason: Output staged onto admin shares after enumeration.
  - id: 044ba588-dff4-4918-9808-3f95e8160606
    name: Copy .DMP/.DUMP Files From Remote Share Via Cmd.EXE
    reason: Collection of dumps from remote shares after mapping them.
  - id: Windows-Network-Connection-Discovery-Via-Net
    name: Windows Network Connection Discovery Via Net
    reason: Same net.exe use/view family, often fires together.
  - id: d4498716-1d52-438f-8084-4a603157d131
    name: Password Provided In Command Line Of Net.EXE
    reason: net use with explicit credentials to the share.
  - id: 7e6237fe-3ddb-438f-9381-9bf9de5af8d0
    name: Windows Internet Hosted WebDav Share Mount Via Net.EXE
    reason: Share mapping to an external WebDav server instead of internal.
  - id: ea011323-7045-460b-b2d7-0f7442ea6b38
    name: Potential PsExec Remote Execution
    reason: PsExec over ADMIN$ is the usual execution step after share access.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: net use/view commands
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:*\\net.exe OR data_win_eventdata_image:*\\net1.exe) AND (data_win_eventdata_commandLine:*[Uu]se* OR data_win_eventdata_commandLine:*[Vv]iew*)
    pivot_on: host
    window: 4h
  - name: File copies to or from admin shares
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:*\\cmd.exe OR data_win_eventdata_image:*\\xcopy.exe OR data_win_eventdata_image:*\\robocopy.exe) AND (data_win_eventdata_commandLine:*ADMIN* OR data_win_eventdata_commandLine:*C$* OR data_win_eventdata_commandLine:*SYSVOL*)
    pivot_on: host
    window: 4h
  - name: SMB egress connections
    query: data_win_system_eventID:3 AND data_win_eventdata_destinationPort:445
    pivot_on: host
    window: 4h
  - name: Remote execution tooling
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:*[Pp]s[Ee]xec* OR data_win_eventdata_commandLine:*[Ss]chtasks*)
    pivot_on: host
    window: 6h
