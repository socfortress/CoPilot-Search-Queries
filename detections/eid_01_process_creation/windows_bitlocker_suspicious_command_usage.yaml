name: Windows BitLocker Suspicious Command Usage
id: Windows-BitLocker-Suspicious-Command-Usage
version: 3
schema_version: 1
date: '2025-05-02'
author: SOCFortress LLC
status: production
type: TTP
description: >
  Detects execution of manage-bde.exe with arguments used to disable or tamper
  with BitLocker protectors, force recovery mode, or lock drives. These commands
  are associated with ShrinkLocker ransomware, which abuses the built-in BitLocker
  utility to encrypt victim drives, disable TPM protectors, and prevent recovery.
  Specific arguments monitored: -protectors -disable, -protectors -delete,
  -forcerecovery, and -lock. MITRE ATT&CK: T1486 (Data Encrypted for Impact),
  T1490 (Inhibit System Recovery).

data_source:
  - Sysmon EventID 1 (ProcessCreate)

search:
  query:
    bool:
      must:
        - term:
            agent_name: "AGENT_NAME"
        - term:
            agent_labels_customer: "CUSTOMER_CODE"
        - term:
            data_win_system_eventID: "1"
        - wildcard:
            data_win_eventdata_image: "*\\manage-bde.exe"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine: "*-protectors -disable*"
              - wildcard:
                  data_win_eventdata_commandLine: "*-protectors -delete*"
              - wildcard:
                  data_win_eventdata_commandLine: "*-forcerecovery*"
              - wildcard:
                  data_win_eventdata_commandLine: "*-lock *"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "START_TIME"
              lte: "END_TIME"

parameters:
  - name: AGENT_NAME
    default: "DESKTOP-AM0HLGE"
  - name: CUSTOMER_CODE
    default: "lab"
  - name: START_TIME
    default: "now-24h"
  - name: END_TIME
    default: "now"

how_to_implement: >
  Requires Sysmon EventID 1 (ProcessCreate) flowing to the Wazuh Indexer.
  Validated on DESKTOP-AM0HLGE with manage-bde.exe -protectors -disable C:
  executed from PowerShell. Confirmed field names: data_win_eventdata_image,
  data_win_eventdata_commandLine, data_win_eventdata_parentImage,
  data_win_eventdata_user.

known_false_positives: >
  Administrators may legitimately use manage-bde.exe to manage BitLocker
  encryption in enterprise environments. Filter on data_win_eventdata_user
  or data_win_eventdata_parentImage for known admin activity. The -lock
  argument alone may appear during scheduled maintenance — correlate with
  other ransomware indicators for higher confidence.

references:
  - https://attack.mitre.org/techniques/T1486/
  - https://attack.mitre.org/techniques/T1490/
  - https://www.nccgroup.com/us/research-blog/nameless-and-shameless-ransomware-encryption-via-bitlocker/
  - https://www.bitdefender.com/en-us/blog/businessinsights/shrinklocker-decryptor-from-friend-to-foe-and-back-again
  - https://www.bleepingcomputer.com/news/security/new-shrinklocker-ransomware-uses-bitlocker-to-encrypt-your-files/

response:
  message: >
    Suspicious BitLocker command executed on $agent_name$.
    Command line: $data_win_eventdata_commandLine$.
    Parent process: $data_win_eventdata_parentImage$.
    User: $data_win_eventdata_user$.
    Possible ransomware (ShrinkLocker) or deliberate encryption sabotage.
    MITRE ATT&CK: T1486, T1490
  risk_score: 60
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 60
    - field: data_win_eventdata_user
      type: user
      score: 60
  threat_objects:
    - field: data_win_eventdata_image
      type: process_name

tags:
  analytic_story:
    - ShrinkLocker
    - Ransomware
    - Inhibit System Recovery
  asset_type: Endpoint
  mitre_attack_id:
    - T1486
    - T1490
  custom_tags:
    - bitlocker
    - manage-bde
    - ransomware
    - shrinklocker
    - encryption_abuse
  product:
    - Wazuh
  security_domain: endpoint

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 0e0255bf-2548-47b8-9582-c0955c9283f5
    name: Suspicious Reg Add BitLocker
    reason: ShrinkLocker changes BitLocker FVE policy registry values before encrypting; same ransomware chain
  - id: c363385c-f75d-4753-a108-c1a8e28bdbda
    name: Potential Manage-bde.wsf Abuse To Proxy Execution
    reason: Another manage-bde abuse path; shows BitLocker tooling being weaponized on the host
  - id: 9f38c1db-e2ae-40bf-81d0-5b68f73fb512
    name: Suspicious BitLocker Access Agent Update Utility Execution
    reason: Another BitLocker utility abused as a LOLBin on the same host
  - id: c947b146-0abc-4c87-9c64-b17e9d7274a2
    name: Shadow Copies Deletion Using Operating Systems Utilities
    reason: BitLocker ransomware removes shadow copies so recovery is impossible
  - id: 639c9081-f482-47d3-a0bd-ddee3d4ecd76
    name: All Backups Deleted Via Wbadmin.EXE
    reason: Backup deletion is paired with drive locking to block restore
  - id: c9fbe8e9-119d-40a6-9b59-dd58a5d84429
    name: Potential Ransomware or Unauthorized MBR Tampering Via Bcdedit.EXE
    reason: Boot configuration tampering accompanies BitLocker-based disk locking
  - id: 4b046706-5789-4673-b111-66f25fe99534
    name: Deleted Data Overwritten Via Cipher.EXE
    reason: Wiping free space after encryption prevents recovery of plaintext
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: BitLocker FVE policy registry changes
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND data_win_eventdata_targetObject:/.*(\\[Pp][Oo][Ll][Ii][Cc][Ii][Ee][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ff][Vv][Ee]).*/
    pivot_on: host
    window: 4h
  - name: manage-bde enabling encryption or adding protectors
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Mm][Aa][Nn][Aa][Gg][Ee]\-[Bb][Dd][Ee]\.[Ee][Xx][Ee]).*/ OR data_win_eventdata_originalFileName:/.*([Mm][Aa][Nn][Aa][Gg][Ee]\-[Bb][Dd][Ee]).*/) AND data_win_eventdata_commandLine:/.*( \-[Oo][Nn]| \-[Pp][Rr][Oo][Tt][Ee][Cc][Tt][Oo][Rr][Ss]| \-[Rr][Ee][Cc][Oo][Vv][Ee][Rr][Yy][Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd]|\-[Ff][Oo][Rr][Cc][Ee][Rr][Ee][Cc][Oo][Vv][Ee][Rr][Yy]|\-[Ll][Oo][Cc][Kk]| \-[Oo][Ff][Ff]|\-[Ww][Ii][Pp][Ee][Ff][Rr][Ee][Ee][Ss][Pp][Aa][Cc][Ee]).*/
    pivot_on: host
    window: 4h
  - name: Disk repartitioning with diskpart or shrink
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Dd][Ii][Ss][Kk][Pp][Aa][Rr][Tt]\.[Ee][Xx][Ee]).*/ OR data_win_eventdata_commandLine:/.*([Ss][Hh][Rr][Ii][Nn][Kk] [Dd][Ee][Ss][Ii][Rr][Ee][Dd]|[Dd][Ii][Ss][Kk][Pp][Aa][Rr][Tt]).*/)
    pivot_on: host
    window: 4h
  - name: Script host launching VBScript
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]).*/ AND data_win_eventdata_commandLine:/.*(\.[Vv][Bb][Ss]|\.[Vv][Bb][Ee]).*/
    pivot_on: host
    window: 4h
  - name: Backup and boot recovery destruction
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_commandLine:/.*([Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn]).*/ AND data_win_eventdata_commandLine:/.*([Dd][Ee][Ll][Ee][Tt][Ee]).*/) OR (data_win_eventdata_commandLine:/.*([Ww][Bb][Aa][Dd][Mm][Ii][Nn]).*/ AND data_win_eventdata_commandLine:/.*([Dd][Ee][Ll][Ee][Tt][Ee]).*/) OR (data_win_eventdata_commandLine:/.*([Bb][Cc][Dd][Ee][Dd][Ii][Tt]).*/ AND data_win_eventdata_commandLine:/.*([Rr][Ee][Cc][Oo][Vv][Ee][Rr][Yy][Ee][Nn][Aa][Bb][Ll][Ee][Dd]|[Bb][Oo][Oo][Tt][Ss][Tt][Aa][Tt][Uu][Ss][Pp][Oo][Ll][Ii][Cc][Yy]).*/))
    pivot_on: host
    window: 2h
