name: HackTool - CreateMiniDump Execution
id: 36d88494-1d43-4dc0-b3fa-35c8fea0ca9d
version: 1
schema_version: "1.0"
date: "2024-11-23"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 36d88494-1d43-4dc0-b3fa-35c8fea0ca9d
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the use of CreateMiniDump hack tool used to dump the LSASS process
  memory for credential extraction on the attacker's machine. MITRE ATT&CK:
  T1003.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\CreateMiniDump.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_hashes:
                    value: "*IMPHASH=4a07f944a83e8a7c2525efa35dd30e2f*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_hashes
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\CreateMiniDump.exe'; data_win_eventdata_hashes matches
  '*IMPHASH=4a07f944a83e8a7c2525efa35dd30e2f*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://ired.team/offensive-security/credential-access-and-credential-dumping/dumping-lsass-passwords-without-mimikatz-minidumpwritedump-av-signature-bypass
  - https://attack.mitre.org/techniques/T1003/001/

response:
  message: >
    HackTool - CreateMiniDump Execution detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_hashes: $data_win_eventdata_hashes$. MITRE ATT&CK:
    T1003.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_hashes
      type: file_hash

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.001
  custom_tags:
    - hacktool
    - createminidump
    - process_creation
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Cc][Rr][Ee][Aa][Tt][Ee][Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_hashes:/.*[Ii][Mm][Pp][Hh][Aa][Ss][Hh]=4[Aa]07[Ff]944[Aa]83[Ee]8[Aa]7[Cc]2525[Ee][Ff][Aa]35[Dd][Dd]30[Ee]2[Ff].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 5ef9853e-4d0e-4a70-846f-a9ca37d876da
    name: Potential Credential Dumping Activity Via LSASS
    reason: CreateMiniDump opens LSASS with dump-capable access; this is the direct runtime evidence.
  - id: a18dd26b-6450-46de-8c91-9659150cf088
    name: Potentially Suspicious GrantedAccess Flags On LSASS
    reason: Dumpers request VM_READ style masks on LSASS right after launch.
  - id: a5a2d357-1ab8-4675-a967-ef9990a59391
    name: LSASS Process Memory Dump Files
    reason: The tool writes the minidump to disk; file creation confirms success.
  - id: 9bd012ee-0dff-44d7-84a0-aa698cfd87a3
    name: LSASS Memory Access by Tool With Dump Keyword In Name
    reason: The binary name contains 'Dump', matching this process-access detection.
  - id: ffa6861c-4461-4f59-8a41-578c39f3f23e
    name: LSASS Dump Keyword In CommandLine
    reason: Operators commonly pass lsass/dump keywords to the tool.
  - id: 962fe167-e48d-4fd6-9974-11e5b9a5d6d1
    name: LSASS Access From Non System Account
    reason: Security-log view of the same LSASS handle request by a non-SYSTEM account.
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: The dump is parsed with Mimikatz, or Mimikatz is the alternative tooling on the host.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Process access to LSASS
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 1h
  - name: Dump file creation
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.([Dd][Mm][Pp]|[Bb][Ii][Nn]|[Dd][Aa][Tt])/
    pivot_on: host
    window: 1h
  - name: Staging and exfil of dump
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Cc]ompress-[Aa]rchive|[Cc]url.*(-T|--upload)|[Cc]opy .*\\\\|[Ss]cp ).*/
    pivot_on: host
    window: 4h
  - name: Shells spawned by remote-exec parents
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\([Ww]mi[Pp]rv[Ss][Ee]|[Ss]ervices|[Ww]sm[Pp]rovhost)\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
