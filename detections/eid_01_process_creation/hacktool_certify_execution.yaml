name: HackTool - Certify Execution
id: 762f2482-ff21-4970-8939-0aa317a886bb
version: 1
schema_version: "1.0"
date: "2023-04-25"
author: pH-T (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 762f2482-ff21-4970-8939-0aa317a886bb
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects Certify a tool for Active Directory certificate abuse based on PE
  metadata characteristics and common command line arguments. MITRE ATT&CK:
  T1649.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\Certify.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "Certify.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_description:
                    value: "*Certify*"
                    case_insensitive: true
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*.exe cas *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*.exe find *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*.exe pkiobjects *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*.exe request *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "*.exe download *"
                                case_insensitive: true
                        minimum_should_match: 1
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* /vulnerable*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* /template:*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* /altname:*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* /domain:*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* /path:*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* /ca:*"
                                case_insensitive: true
                        minimum_should_match: 1
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_description
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\Certify.exe'; data_win_eventdata_originalFileName equals 'Certify.exe';
  data_win_eventdata_description matches '*Certify*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/GhostPack/Certify
  - https://attack.mitre.org/techniques/T1649/

response:
  message: >
    HackTool - Certify Execution detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1649
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1649
  custom_tags:
    - hacktool
    - certify
    - process_creation
    - sysmon
    - discovery
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Cc][Ee][Rr][Tt][Ii][Ff][Yy]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Cc][Ee][Rr][Tt][Ii][Ff][Yy]\.[Ee][Xx][Ee]/ OR data_win_eventdata_description:/.*[Cc][Ee][Rr][Tt][Ii][Ff][Yy].*/ OR ((data_win_eventdata_commandLine:/.*\.[Ee][Xx][Ee] [Cc][Aa][Ss] .*/ OR data_win_eventdata_commandLine:/.*\.[Ee][Xx][Ee] [Ff][Ii][Nn][Dd] .*/ OR data_win_eventdata_commandLine:/.*\.[Ee][Xx][Ee] [Pp][Kk][Ii][Oo][Bb][Jj][Ee][Cc][Tt][Ss] .*/ OR data_win_eventdata_commandLine:/.*\.[Ee][Xx][Ee] [Rr][Ee][Qq][Uu][Ee][Ss][Tt] .*/ OR data_win_eventdata_commandLine:/.*\.[Ee][Xx][Ee] [Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd] .*/) AND (data_win_eventdata_commandLine:/.* \/[Vv][Uu][Ll][Nn][Ee][Rr][Aa][Bb][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.* \/[Tt][Ee][Mm][Pp][Ll][Aa][Tt][Ee]:.*/ OR data_win_eventdata_commandLine:/.* \/[Aa][Ll][Tt][Nn][Aa][Mm][Ee]:.*/ OR data_win_eventdata_commandLine:/.* \/[Dd][Oo][Mm][Aa][Ii][Nn]:.*/ OR data_win_eventdata_commandLine:/.* \/[Pp][Aa][Tt][Hh]:.*/ OR data_win_eventdata_commandLine:/.* \/[Cc][Aa]:.*/)))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 6938366d-8954-4ddc-baff-c830b3ba8fcd
    name: HackTool - Certipy Execution
    reason: Equivalent AD CS enumeration/abuse tool; operators switch between them.
  - id: cd8c163e-a19b-402e-bdd5-419ff5859f12
    name: HackTool - ADCSPwn Execution
    reason: ESC8 relay exploitation of the same AD CS weaknesses Certify finds.
  - id: f376c8a7-a2d0-4ddc-aa0c-16c17236d962
    name: HackTool - Bloodhound/Sharphound Execution
    reason: Parallel AD enumeration; BloodHound also models AD CS escalation edges.
  - id: 7ec2c172-dceb-4c10-92c9-87c1881b7e18
    name: HackTool - Rubeus Execution
    reason: 'Follow-on: Certify-requested certificates are used with Rubeus asktgt /certificate.'
  - id: 3ffd6f51-e6c1-47b7-94b4-c1e61d4117c5
    name: Certificate Exported Via Certutil.EXE
    reason: 'Follow-on: exporting the issued certificate/key to a PFX for reuse.'
  - id: 9e716b33-63b2-46da-86a4-bd3c3b9b5dfb
    name: Certificate Exported Via PowerShell
    reason: Alternative export of the obtained certificate and private key.
  - id: c248c896-e412-4279-8c15-1c558067b6fa
    name: Enumerate All Information With Whoami.EXE
    reason: Early host/user triage typical before AD CS enumeration.
  - id: 41243735-89a7-4c83-bcdd-570aa78f00a1
    name: Domain Controller Discovery with Nltest
    reason: Domain discovery precursor to locating the CA.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Certificate export or PFX handling
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Ee][Rr][Tt][Uu][Tt][Ii][Ll].*-[Ee][Xx][Pp][Oo][Rr][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ee]xport-[Pp]fx[Cc]ertificate.*/ OR data_win_eventdata_commandLine:/.*\.[Pp][Ff][Xx].*/)
    pivot_on: host
    window: 6h
  - name: PFX or certificate files written
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\.[Pp][Ff][Xx]/ OR data_win_eventdata_targetFilename:/.*\.[Pp]12/ OR data_win_eventdata_targetFilename:/.*\.[Cc][Ee][Rr]/)
    pivot_on: host
    window: 6h
  - name: Certificate-based Kerberos auth tooling
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Aa][Ss][Kk][Tt][Gg][Tt].*\/[Cc][Ee][Rr][Tt][Ii][Ff][Ii][Cc][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Pp][Kk][Ii][Nn][Ii][Tt].*/ OR data_win_eventdata_commandLine:/.*[Gg]et[Tt][Gg][Tt][Pp][Kk][Ii][Nn][Ii][Tt].*/)
    pivot_on: host
    window: 24h
  - name: AD CS issuance events on CA (requested/issued)
    query: data_win_system_eventID:(4886 OR 4887 OR 4898)
    pivot_on: user
    window: 6h
  - name: Connections to CA RPC or web enrollment from tool
    query: data_win_system_eventID:"3" AND (data_win_eventdata_destinationPort:"135" OR data_win_eventdata_destinationPort:"443" OR data_win_eventdata_destinationPort:"80") AND (data_win_eventdata_image:/.*[Cc]ertify.*/ OR data_win_eventdata_image:/.*\\[Tt]emp\\.*/)
    pivot_on: host
    window: 2h
