name: PowerShell Script Change Permission Via Set-Acl
id: bdeb2cff-af74-4094-8426-724dc937f20a
version: 1
schema_version: "1.0"
date: "2022-10-18"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: bdeb2cff-af74-4094-8426-724dc937f20a
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects PowerShell execution to set the ACL of a file or a folder.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - term:
                  data_win_eventdata_originalFileName:
                    value: "PowerShell.EXE"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "pwsh.dll"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\powershell.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\pwsh.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*Set-Acl *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*-AclObject *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*-Path *"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_originalFileName
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_originalFileName equals
  'PowerShell.EXE'; data_win_eventdata_originalFileName equals 'pwsh.dll';
  data_win_eventdata_image matches '*\powershell.exe', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.security/set-acl?view=powershell-5.1
  - https://github.com/redcanaryco/atomic-red-team/blob/74438b0237d141ee9c99747976447dc884cb1a39/atomics/T1505.005/T1505.005.md

response:
  message: >
    PowerShell Script Change Permission Via Set-Acl detected on host
    $agent_name$. Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_originalFileName
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - powershell
    - change
    - permission
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_originalFileName:/[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Pp][Ww][Ss][Hh]\.[Dd][Ll][Ll]/ OR data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Aa][Cc][Ll] .*/ AND data_win_eventdata_commandLine:/.*-[Aa][Cc][Ll][Oo][Bb][Jj][Ee][Cc][Tt] .*/ AND data_win_eventdata_commandLine:/.*-[Pp][Aa][Tt][Hh] .*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 0944e002-e3f6-4eb5-bf69-3a3067b53d73
    name: PowerShell Set-Acl On Windows Folder
    reason: 'Narrower sibling: Set-Acl on Windows folders granting full control, the higher-risk form.'
  - id: b1b1e316-accc-11eb-a9b4-acde48001122
    name: ICACLS Grant Command
    reason: icacls /grant is the cmd equivalent of the permission grant.
  - id: c76b796c-27e1-4520-91c4-4a58695c749e
    name: Windows Files and Dirs Access Rights Modification Via Icacls
    reason: 'Icacls rights modification: same objective with a different tool.'
  - id: fa7ca5c6-c9d8-11eb-bce9-acde48001122
    name: Permission Modification using Takeown App
    reason: takeown typically precedes an ACL rewrite when the actor lacks ownership.
  - id: 554601fb-9b71-4bcc-abf4-21a611be4fde
    name: Suspicious Recursive Takeown
    reason: Recursive takeown, a bulk ownership grab preceding wide ACL change.
  - id: cf8d753e-a8fe-11eb-8f58-acde48001122
    name: Icacls Deny Command
    reason: icacls /deny used to lock out defenders or users of a file.
  - id: 4ae81040-fc1c-4249-bfa3-938d260214d9
    name: Use Icacls to Hide File to Everyone
    reason: Hiding a file from everyone via icacls, an ACL change for concealment.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: takeown / icacls / cacls usage
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Tt][Aa][Kk][Ee][Oo][Ww][Nn]\.[Ee][Xx][Ee]|[Ii][Cc][Aa][Cc][Ll][Ss]\.[Ee][Xx][Ee]|[Cc][Aa][Cc][Ll][Ss]\.[Ee][Xx][Ee]|[Xx][Cc][Aa][Cc][Ll][Ss]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 4h
  - name: Accessibility binary tampering
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Ee][Tt][Hh][Cc]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_commandLine:/.*[Uu][Tt][Ii][Ll][Mm][Aa][Nn]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_commandLine:/.*[Oo][Ss][Kk]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_commandLine:/.*[Nn][Aa][Rr][Rr][Aa][Tt][Oo][Rr]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_commandLine:/.*[Mm][Aa][Gg][Nn][Ii][Ff][Yy]\.[Ee][Xx][Ee].*/)
    pivot_on: host
    window: 24h
  - name: Executables written to System32 or Program Files by PowerShell
    query: data_win_system_eventID:"11" AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee])/ AND data_win_eventdata_targetFilename:/.*(\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\|\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]).*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Ss][Yy][Ss])/
    pivot_on: host
    window: 4h
  - name: Shadow copy or boot recovery tampering (ransomware prep)
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\([Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*[Dd][Ee][Ll][Ee][Tt][Ee] [Ss][Hh][Aa][Dd][Oo][Ww][Ss].*/)) OR (data_win_eventdata_image:/.*\\([Bb][Cc][Dd][Ee][Dd][Ii][Tt]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.*[Rr][Ee][Cc][Oo][Vv][Ee][Rr][Yy][Ee][Nn][Aa][Bb][Ll][Ee][Dd].*/)))
    pivot_on: host
    window: 4h
  - name: Service creation or modification
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Ss][Cc]\.[Ee][Xx][Ee])/ AND (data_win_eventdata_commandLine:/.* [Cc][Rr][Ee][Aa][Tt][Ee] .*/ OR data_win_eventdata_commandLine:/.* [Cc][Oo][Nn][Ff][Ii][Gg] .*/)
    pivot_on: host
    window: 4h
