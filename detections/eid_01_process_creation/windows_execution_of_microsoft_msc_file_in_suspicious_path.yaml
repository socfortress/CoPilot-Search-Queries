name: Windows Execution of Microsoft MSC File In Suspicious Path
id: ac30858b-7c25-4f0a-a7fa-bef036e49dc3
version: 1
schema_version: "1.0"
date: "2026-04-07"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  The following analytic detects when a Microsoft Management Console (MMC) process executes an .msc
  file in a suspicious path on a Windows system. While .msc files are legitimate components used for
  system administration, unexpected execution of these files from unusual locations like Temp, Downloads,
  PerfLogs, Recycle.bin, or Windows subdirectories (Prefetch, Cursors, INF, debug, fonts, Media, repair,
  servicing) can indicate malicious activity such as living-off-the-land attacks, persistence mechanisms,
  or automated administrative abuse. This detection monitors process creation events, command-line arguments,
  and execution paths to help distinguish normal administrative usage from potential threats.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - wildcard:
            data_win_eventdata_image: "*mmc.exe"
        - wildcard:
            data_win_eventdata_commandLine: "*.msc*"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine: "*\\PerfLogs\\*"
              - wildcard:
                  data_win_eventdata_commandLine: "*\\programdata\\*"
              - wildcard:
                  data_win_eventdata_commandLine: "*Recycle.bin*"
              - wildcard:
                  data_win_eventdata_commandLine: "*\\Download*"
              - wildcard:
                  data_win_eventdata_commandLine: "*\\temp\\*"
              - wildcard:
                  data_win_eventdata_commandLine: "*\\Users\\Administrator\\Music\\*"
              - wildcard:
                  data_win_eventdata_commandLine: "*\\Users\\Default\\*"
              - wildcard:
                  data_win_eventdata_commandLine: "*\\Users\\Public\\*"
              - wildcard:
                  data_win_eventdata_commandLine: "*:\\Windows\\Prefetch\\*"
              - wildcard:
                  data_win_eventdata_commandLine: "*:\\Windows\\Cursors\\*"
              - wildcard:
                  data_win_eventdata_commandLine: "*:\\Windows\\INF\\*"
              - wildcard:
                  data_win_eventdata_commandLine: "*:\\Windows\\debug\\*"
              - wildcard:
                  data_win_eventdata_commandLine: "*:\\Windows\\fonts\\*"
              - wildcard:
                  data_win_eventdata_commandLine: "*:\\Windows\\Media\\*"
              - wildcard:
                  data_win_eventdata_commandLine: "*:\\Windows\\repair\\*"
              - wildcard:
                  data_win_eventdata_commandLine: "*:\\Windows\\servicing\\*"
            minimum_should_match: 1
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_commandLine: "*C:\\Windows\\System32\\eventvwr.msc*"
              - wildcard:
                  data_win_eventdata_commandLine: "*C:\\Windows\\System32\\certmgr.msc*"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_parentProcessId
    - data_win_eventdata_user
    - agent_name

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "YYYY-MM-DD 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "YYYY-MM-DD 23:59:59.999"

how_to_implement: >
  To successfully implement this search, you need to be ingesting logs with process execution data
  from your endpoints. Sysmon EventID 1 captures process creation events. Ensure that Sysmon is
  configured to log all process creation events and that these logs are properly ingested into
  Elasticsearch with complete command-line information. The detection specifically looks for mmc.exe
  executing .msc files from suspicious paths including Temp, Downloads, PerfLogs, Recycle.bin, and
  various Windows system subdirectories.

known_false_positives: >
  A possible false positive for the execution of .msc files is legitimate administrative activity,
  since .msc files are standard Microsoft Management Console snap-ins used for system administration.
  However, legitimate administrative tasks typically execute .msc files from C:\Windows\System32,
  not from Temp, Downloads, or other suspicious paths. Investigate all instances where mmc.exe
  executes .msc files from unusual locations.

references:
  - https://www.securonix.com/blog/analyzing-fluxconsole-using-tax-themed-lures-threat-actors-exploit-windows-management-console-to-deliver-backdoor-payloads/
  - https://research.checkpoint.com/2019/microsoft-management-console-mmc-vulnerabilities/

response:
  message: >
    Microsoft Management Console (mmc.exe) executed an .msc file from a suspicious path on $agent_name$.
    Process: $data_win_eventdata_image$ CommandLine: $data_win_eventdata_commandLine$
    Parent Process: $data_win_eventdata_parentImage$ User: $data_win_eventdata_user$.
    This may indicate malicious activity or living-off-the-land abuse.
  risk_score: 70
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 70
    - field: data_win_eventdata_user
      type: user
      score: 60
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_parentImage
      type: process

tags:
  analytic_story:
    - XML Runner Loader
    - Suspicious Windows MMC Execution
  asset_type: Endpoint
  mitre_attack_id:
    - T1218.014
  custom_tags:
    - mmc
    - msc_file
    - suspicious_path
    - living_off_the_land
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:"C:\\\\Windows\\\\System32\\\\mmc.exe" AND data_win_eventdata_commandLine:/.*\.msc.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 05a2ab7e-ce11-4b63-86db-ab32e763e11d
    name: MMC Spawning Windows Shell
    reason: A malicious .msc can launch cmd or PowerShell through console tasks; an mmc child shell confirms execution.
  - id: windows-mmc-lolbas-execution-process-spawn-001
    name: Windows Mmc LOLBAS Execution Process Spawn
    reason: mmc spawning LOLBAS binaries is the payload stage of a weaponized .msc.
  - id: 9cfe4b27-1e56-48b4-b7a8-d46851c91a44
    name: MMC Executing Files with Reversed Extensions Using RTLO Abuse
    reason: Another mmc lure technique delivering disguised .msc files from user-writable paths.
  - id: windows-process-creating-lnk-suspicious-location-001
    name: Windows Process Creating LNK File in Suspicious Location
    reason: Phishing chains drop shortcuts and .msc files from archives in Temp/Downloads before mmc opens them.
  - id: e32d4572-9826-4738-b651-95fa63747e8a
    name: Base64 Encoded PowerShell Command Detected
    reason: Weaponized msc files commonly run an encoded PowerShell stager via an embedded task.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Children of mmc.exe
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Mm][Mm][Cc]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
  - name: Lure files dropped in staging paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.([Mm][Ss][Cc]|[Ll][Nn][Kk]|[Ii][Ss][Oo]|[Zz][Ii][Pp]|[Rr][Aa][Rr]|7[Zz])/ AND data_win_eventdata_targetFilename:/.*\\([Tt][Ee][Mm][Pp]|[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]|[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss]|[Aa][Pp][Pp][Dd][Aa][Tt][Aa])\\.*/
    pivot_on: host
    window: 4h
  - name: Scripting or LOLBin execution with download behavior
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Mm][Ss][Hh][Tt][Aa]|[Rr][Uu][Nn][Dd][Ll][Ll]32|[Rr][Ee][Gg][Ss][Vv][Rr]32|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt])\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*[Hh][Tt][Tt][Pp].*/ OR data_win_eventdata_commandLine:/.*-[Ee][Nn][Cc].*/ OR data_win_eventdata_commandLine:/.*[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss][Tt][Rr][Ii][Nn][Gg].*/)
    pivot_on: host
    window: 2h
  - name: Outbound connections from mmc or shells
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*\\([Mm][Mm][Cc]|[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Cc][Mm][Dd]|[Mm][Ss][Hh][Tt][Aa])\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 2h
