name: Windows Modify ACL Permission To Files Or Folder
id: windows-modify-acl-permission-to-files-or-folder-001
version: 1
schema_version: "1.0"
date: "2026-02-12"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  Detects the modification of ACL permissions using icacls.exe, cacls.exe, or xcacls.exe 
  to grant access to Everyone, SYSTEM, or the well-known SID S-1-1-0. This activity 
  may indicate an adversary attempting to evade ACLs or access protected files. Commonly 
  used by crypto miners (XMRig) and for defense evasion.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image: "*icacls.exe"
              - wildcard:
                  data_win_eventdata_image: "*cacls.exe"
              - wildcard:
                  data_win_eventdata_image: "*xcacls.exe"
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine: "*/grant*"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine: "*Everyone:*"
              - wildcard:
                  data_win_eventdata_commandLine: "*SYSTEM:*"
              - wildcard:
                  data_win_eventdata_commandLine: "*S-1-1-0:*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-12 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-12 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Windows endpoints with Sysmon 
  installed and configured to log process creation events (EventID 1) with full 
  command-line arguments. The index pattern should match your Wazuh index naming 
  convention.

known_false_positives: >
  Administrators may legitimately use icacls to modify permissions during software 
  installation or system configuration. Filter based on parent process context and 
  target paths.

references:
  - https://attack.mitre.org/techniques/T1222/
  - https://thedfirreport.com/2020/04/20/sqlserver-or-the-miner-in-the-basement/

response:
  message: >
    Suspicious ACL permission modification detected on $agent_name$. 
    Command line: $data_win_eventdata_commandLine$. 
    Parent process: $data_win_eventdata_parentImage$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1222
  risk_score: 32
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 32
  threat_objects: []

tags:
  analytic_story:
    - Crypto Stealer
    - XMRig
    - Defense Evasion or Unauthorized Access Via SDDL Tampering
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1222
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*icacls\.exe/ OR data_win_eventdata_image:/.*cacls\.exe/ OR data_win_eventdata_image:/.*xcacls\.exe/) AND data_win_eventdata_commandLine:/.*\/grant.*/ AND (data_win_eventdata_commandLine:/.*Everyone:.*/ OR data_win_eventdata_commandLine:/.*SYSTEM:.*/ OR data_win_eventdata_commandLine:/.*S-1-1-0:.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 554601fb-9b71-4bcc-abf4-21a611be4fde
    name: Suspicious Recursive Takeown
    reason: takeown typically precedes icacls grant to seize protected files.
  - id: fa7ca5c6-c9d8-11eb-bce9-acde48001122
    name: Permission Modification using Takeown App
    reason: Ownership change that enables the ACL grant.
  - id: b1b1e316-accc-11eb-a9b4-acde48001122
    name: ICACLS Grant Command
    reason: Overlapping icacls grant detection corroborating the same action.
  - id: 4ae81040-fc1c-4249-bfa3-938d260214d9
    name: Use Icacls to Hide File to Everyone
    reason: Related ACL abuse to hide artifacts of the same intrusion.
  - id: efec536f-72e8-4656-8960-5e85d091345b
    name: Set Suspicious Files as System Files Using Attrib.EXE
    reason: Companion hiding step often paired with permission changes.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: takeown and ACL tools
    query: data_win_system_eventID:1 AND data_win_eventdata_image:(/.*[Tt]akeown\.exe/ OR /.*[Ii]cacls\.exe/ OR /.*[Cc]acls\.exe/)
    pivot_on: host
    window: 2h
  - name: Miner or tool execution from staging paths
    query: data_win_system_eventID:1 AND data_win_eventdata_image:(/.*\\[Tt]emp\\.*/ OR /.*\\[Pp]rogram[Dd]ata\\.*/ OR /.*[Xx][Mm][Rr]ig.*/)
    pivot_on: host
    window: 4h
  - name: Security tooling tampering
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ss]et-[Mm]p[Pp]reference.*/ OR /.*[Ss]top-[Ss]ervice.*/ OR /.*sc\s+(stop|config).*/ OR /.*[Nn]etsh.*[Ff]irewall.*/)
    pivot_on: host
    window: 4h
  - name: Persistence creation
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ss]chtasks.*\/[Cc]reate.*/ OR /.*[Rr]eg\s+add.*[Rr]un.*/)
    pivot_on: host
    window: 4h
