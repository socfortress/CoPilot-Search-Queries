name: Disabling Windows Defender WMI Autologger Session via Reg.exe
id: a1b2c3d4-e5f6-a7b8-c9d0-e1f2a3b4c5d6
version: 1
schema_version: "1.0"
date: "2025-07-09"
author: Matt Anderson (Huntress)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: a1b2c3d4-e5f6-a7b8-c9d0-e1f2a3b4c5d6
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the use of reg.exe to disable the Event Tracing for Windows (ETW)
  Autologger session for Windows Defender API and Audit events. By setting the
  'Start' value to '0' for the 'DefenderApiLogger' or 'DefenderAuditLogger'
  session, an attacker can prevent these critical security events from being
  logged, effectively blinding monitoring tools that rely on this data. This is
  a powerful defense evasion technique. MITRE ATT&CK: T1685.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\reg.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "reg.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Control\\\\WMI\\\\Autologger\\\\DefenderApiLogger\\\\Start*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*\\\\Control\\\\WMI\\\\Autologger\\\\DefenderAuditLogger\\\\Start*"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*add*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine: "*0*"
        - exists:
            field: "data_win_eventdata_commandLine"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*0x00000001*"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches '*\reg.exe';
  data_win_eventdata_originalFileName equals 'reg.exe';
  data_win_eventdata_commandLine matches
  '*\Control\WMI\Autologger\DefenderApiLogger\Start*', among other conditions.

known_false_positives: >
  Highly unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://research.splunk.com/endpoint/76406a0f-f5e0-4167-8e1f-337fdc0f1b0c/
  - https://docs.microsoft.com/en-us/windows/win32/etw/configuring-and-starting-an-autologger-session
  - https://thedfirreport.com/2021/10/18/icedid-to-xinglocker-ransomware-in-24-hours/
  - https://blog.malwarebytes.com/malwarebytes-news/2021/02/lazyscripter-from-empire-to-double-rat/
  - https://www.binarly.io/blog/design-issues-of-modern-edrs-bypassing-etw-based-solutions
  - https://attack.mitre.org/techniques/T1685/

response:
  message: >
    Disabling Windows Defender WMI Autologger Session via Reg.exe detected on
    host $agent_name$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. Matched data_win_eventdata_originalFileName:
    $data_win_eventdata_originalFileName$. MITRE ATT&CK: T1685
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685
  custom_tags:
    - disabling
    - defender
    - autologger
    - process_creation
    - sysmon
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Rr][Ee][Gg]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Rr][Ee][Gg]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*\\[Cc][Oo][Nn][Tt][Rr][Oo][Ll]\\[Ww][Mm][Ii]\\[Aa][Uu][Tt][Oo][Ll][Oo][Gg][Gg][Ee][Rr]\\[Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr][Aa][Pp][Ii][Ll][Oo][Gg][Gg][Ee][Rr]\\[Ss][Tt][Aa][Rr][Tt].*/ OR data_win_eventdata_commandLine:/.*\\[Cc][Oo][Nn][Tt][Rr][Oo][Ll]\\[Ww][Mm][Ii]\\[Aa][Uu][Tt][Oo][Ll][Oo][Gg][Gg][Ee][Rr]\\[Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr][Aa][Uu][Dd][Ii][Tt][Ll][Oo][Gg][Gg][Ee][Rr]\\[Ss][Tt][Aa][Rr][Tt].*/) AND data_win_eventdata_commandLine:/.*[Aa][Dd][Dd].*/ AND data_win_eventdata_commandLine:/.*0.*/ AND _exists_:data_win_eventdata_commandLine AND NOT (data_win_eventdata_commandLine:/.*0[Xx]00000001.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 452bce90-6fb0-43cc-97a5-affc283139b3
    name: Suspicious Windows Defender Registry Key Tampering Via Reg.EXE
    reason: Defender registry tampering via reg.exe is the same technique family against Defender policy keys.
  - id: 48917adc-a28e-4f5d-b729-11e75da8941f
    name: Suspicious Windows Defender Folder Exclusion Added Via Reg.EXE
    reason: Exclusion added via reg.exe commonly accompanies blinding Defender telemetry.
  - id: a238b5d0-ce2d-4414-a676-7a531b3d13d6
    name: ETW Trace Evasion Activity
    reason: 'ETW trace evasion is the same goal: silencing security event providers.'
  - id: cd1f961e-0b96-436b-b7c6-38da4583ec00
    name: Suspicious Windows Trace ETW Session Tamper Via Logman.EXE
    reason: Logman ETW session tampering is the sibling method to stop the same sessions.
  - id: a7ee1722-c3c5-aeff-3212-c777e4733217
    name: Disable Windows Defender AV Security Monitoring
    reason: Disabling Defender AV security monitoring is the broader tamper this session change supports.
  - id: 49e5bc24-8b86-49f1-b743-535f332c2856
    name: Microsoft Defender Tamper Protection Trigger
    reason: Tamper Protection trigger shows Defender resisting these registry changes.
  - id: b28e58e4-2a72-4fae-bdee-0fbe904db642
    name: Windows Defender Real-time Protection Disabled
    reason: Real-time protection disabled event is the direct visible outcome of this blinding.
  - id: 17769c90-230e-488b-a463-e05c08e9d48f
    name: Powershell Defender Exclusion
    reason: PowerShell exclusions are commonly set alongside to allow payload execution.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other Defender tampering via reg or PowerShell
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*Windows Defender.*/ OR /.*DisableAntiSpyware.*/ OR /.*DisableRealtimeMonitoring.*/ OR /.*[Aa]dd-[Mm]p[Pp]reference.*/ OR /.*[Ss]et-[Mm]p[Pp]reference.*/)
    pivot_on: host
    window: 4h
  - name: Registry modifications to Defender or Autologger keys
    query: data_win_system_eventID:13 AND data_win_eventdata_targetObject:(/.*Control.WMI.Autologger.*/ OR /.*Windows Defender.*(Exclusions|DisableAntiSpyware|Real-Time).*/)
    pivot_on: host
    window: 4h
  - name: Defender protection state change events
    query: data_win_system_eventID:(5001 OR 5007 OR 5010 OR 5012)
    pivot_on: host
    window: 4h
  - name: Services/drivers stopped or Sysmon tampering
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*(sc|net)(\.exe)? +(stop|config).*(WinDefend|Sense|Sysmon|wuauserv).*/ OR /.*fltmc.*unload.*/ OR /.*sysmon.* -u.*/)
    pivot_on: host
    window: 4h
  - name: Credential dumping or ingress tools after blinding
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*procdump.*lsass.*/ OR /.*comsvcs.*MiniDump.*/ OR /.*sekurlsa.*/ OR /.*ntdsutil.*/)
    pivot_on: host
    window: 6h
