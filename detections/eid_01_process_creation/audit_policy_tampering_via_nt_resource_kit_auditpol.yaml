name: Audit Policy Tampering Via NT Resource Kit Auditpol
id: c6c56ada-612b-42d1-9a29-adad3c5c2c1e
version: 1
schema_version: "1.0"
date: "2023-02-21"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: c6c56ada-612b-42d1-9a29-adad3c5c2c1e
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Threat actors can use an older version of the auditpol binary available inside
  the NT resource kit to change audit policy configuration to impair detection
  capability. This can be carried out by selectively disabling/removing certain
  audit policies as well as restoring a custom policy owned by the threat actor.
  MITRE ATT&CK: T1685.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*/logon:none*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*/system:none*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*/sam:none*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*/privilege:none*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*/object:none*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*/process:none*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*/policy:none*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*/logon:none*'; data_win_eventdata_commandLine matches '*/system:none*';
  data_win_eventdata_commandLine matches '*/sam:none*', among other conditions.

known_false_positives: >
  The old auditpol utility isn't available by default on recent versions of
  Windows as it was replaced by a newer version. The FP rate should be very low
  except for tools that use a similar flag structure. Baseline expected activity
  in your environment and tune this detection before relying on it for automated
  response.

references:
  - https://github.com/3CORESec/MAL-CL/tree/master/Descriptors/Windows%202000%20Resource%20Kit%20Tools/AuditPol
  - https://attack.mitre.org/techniques/T1685/001/

response:
  message: >
    Audit Policy Tampering Via NT Resource Kit Auditpol detected on host
    $agent_name$. Matched data_win_eventdata_commandLine:
    $data_win_eventdata_commandLine$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1685.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685.001
  custom_tags:
    - audit
    - policy
    - tampering
    - process_creation
    - sysmon
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*\/[Ll][Oo][Gg][Oo][Nn]:[Nn][Oo][Nn][Ee].*/ OR data_win_eventdata_commandLine:/.*\/[Ss][Yy][Ss][Tt][Ee][Mm]:[Nn][Oo][Nn][Ee].*/ OR data_win_eventdata_commandLine:/.*\/[Ss][Aa][Mm]:[Nn][Oo][Nn][Ee].*/ OR data_win_eventdata_commandLine:/.*\/[Pp][Rr][Ii][Vv][Ii][Ll][Ee][Gg][Ee]:[Nn][Oo][Nn][Ee].*/ OR data_win_eventdata_commandLine:/.*\/[Oo][Bb][Jj][Ee][Cc][Tt]:[Nn][Oo][Nn][Ee].*/ OR data_win_eventdata_commandLine:/.*\/[Pp][Rr][Oo][Cc][Ee][Ss][Ss]:[Nn][Oo][Nn][Ee].*/ OR data_win_eventdata_commandLine:/.*\/[Pp][Oo][Ll][Ii][Cc][Yy]:[Nn][Oo][Nn][Ee].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 0a13e132-651d-11eb-ae93-0242ac130002
    name: Audit Policy Tampering Via Auditpol
    reason: Modern auditpol variant of the same impairment; the actor may try both.
  - id: windows-audit-policy-cleared-via-auditpol-001
    name: Windows Audit Policy Cleared via Auditpol
    reason: Overlapping auditpol clear/remove behaviour confirming policy wipe.
  - id: windows-audit-policy-subcategory-disabled-via-auditpol-001
    name: Windows Audit Policy Subcategory Disabled via Auditpol
    reason: Selective disabling of subcategories, the stealthier form of the same tampering.
  - id: windows-audit-policy-disabled-legacy-auditpol-001
    name: Windows Audit Policy Disabled via Legacy Auditpol
    reason: Legacy-syntax disabling in the same family.
  - id: 802a0930-0a4a-4451-bf6c-6366c6b6d9e7
    name: Windows Global Object Access Audit List Cleared Via Auditpol
    reason: Clearing global SACLs, another auditpol blinding step.
  - id: fdb829a8-db84-4832-b64b-3e964cd44f01
    name: Windows Eventlog Cleared Via Wevtutil
    reason: Log clearing typically accompanies audit-policy impairment to erase already-written evidence.
  - id: 236e7c8e-c9d9-11eb-a824-acde48001122
    name: Disable Logs Using WevtUtil
    reason: Disables event channels, same defense-evasion goal.
  - id: cc36992a-4671-4f21-a91d-6c2b72a2edf5
    name: Suspicious Eventlog Clearing or Configuration Change Activity
    reason: Broader log tampering by the same actor.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Any auditpol execution on host
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*[Aa]udit[Pp]ol.*/
    pivot_on: host
    window: 6h
  - name: Event log clearing or channel disabling
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ww]evtutil.*/ OR /.*[Cc]lear-[Ee]vent[Ll]og.*/ OR /.*[Rr]emove-[Ee]vent[Ll]og.*/)
    pivot_on: host
    window: 6h
  - name: Audit policy change and log cleared security events
    query: data_win_system_eventID:(4719 OR 1102 OR 4907)
    pivot_on: host
    window: 6h
  - name: Security tool or Defender tampering
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ss]et-[Mm]p[Pp]reference.*/ OR /.*[Ss]c.* (stop|config) .*/ OR /.*[Nn]et.* stop .*/)
    pivot_on: host
    window: 6h
  - name: Credential access or lateral tooling around the change
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Ll]sass.*/ OR /.*[Mm]imikatz.*/ OR /.*[Pp]sexec.*/)
    pivot_on: host
    window: 4h
