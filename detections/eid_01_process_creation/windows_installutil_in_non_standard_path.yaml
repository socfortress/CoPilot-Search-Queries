name: Windows InstallUtil in Non Standard Path
id: windows-installutil-non-standard-path-001
version: 1
schema_version: "1.0"
date: "2026-02-23"
author: SOCFortress LLC
status: production
type: TTP

description: >
  Detects InstallUtil.exe executed from non-standard paths (outside System32, 
  SysWOW64, Microsoft.NET, WinSxS, ADWS). Attackers copy InstallUtil to 
  unusual locations for LOLBIN proxy execution. Used by WhisperGate, 
  ransomware, and signed binary proxy execution campaigns.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - wildcard:
            data_win_eventdata_image: "*\\\\InstallUtil.exe"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - wildcard:
            data_win_eventdata_image: "*\\\\Windows\\\\System32\\\\*"
        - wildcard:
            data_win_eventdata_image: "*\\\\Windows\\\\SysWOW64\\\\*"
        - wildcard:
            data_win_eventdata_image: "*\\\\Windows\\\\Microsoft.NET\\\\*"
        - wildcard:
            data_win_eventdata_image: "*\\\\Windows\\\\WinSxS\\\\*"
        - wildcard:
            data_win_eventdata_image: "*\\\\Windows\\\\ADWS\\\\*"
        - wildcard:
            data_win_eventdata_image: "*\\\\Windows\\\\NetworkController\\\\*"
        - wildcard:
            data_win_eventdata_image: "*\\\\Windows\\\\SystemApps\\\\*"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-23 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-23 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Windows endpoints with Sysmon 
  installed and configured to log process creation events (EventID 1) with full 
  command-line arguments.

known_false_positives: >
  Third-party applications may include InstallUtil in non-standard paths. 
  Filter by known application directories.

references:
  - https://attack.mitre.org/techniques/T1218/004/
  - https://attack.mitre.org/techniques/T1036/003/

response:
  message: >
    InstallUtil.exe from non-standard path on $agent_name$. 
    Path: $data_win_eventdata_image$. 
    Command: $data_win_eventdata_commandLine$. 
    User: $data_win_eventdata_user$. MITRE ATT&CK: T1218.004
  risk_score: 49
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 49
  threat_objects: []

tags:
  analytic_story:
    - Masquerading - Rename System Utilities
    - Signed Binary Proxy Execution InstallUtil
    - WhisperGate
    - Living Off The Land
  asset_type: Endpoint
  mitre_attack_id:
    - T1036.003
    - T1218.004
  custom_tags:
    - installutil
    - lolbin
    - non_standard_path
    - proxy_execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*InstallUtil\.exe/ AND NOT data_win_eventdata_image:/.*Windows.*System32.*/ AND NOT data_win_eventdata_image:/.*Windows.*SysWOW64.*/ AND NOT data_win_eventdata_image:/.*Windows.*Microsoft\.NET.*/ AND NOT data_win_eventdata_image:/.*Windows.*WinSxS.*/ AND NOT data_win_eventdata_image:/.*Windows.*ADWS.*/ AND NOT data_win_eventdata_image:/.*Windows.*NetworkController.*/ AND NOT data_win_eventdata_image:/.*Windows.*SystemApps.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: cfa7b9ac-43f0-11ec-9b48-acde48001122
    name: Windows InstallUtil Uninstall Option
    reason: The /u option executes the assembly Uninstall method, the usual proxy-execution trigger for a copied InstallUtil.
  - id: d042284c-a296-4988-9be5-f424fadcc28c
    name: Suspicious Execution of InstallUtil Without Log
    reason: Attackers add /logfile= /LogToConsole=false to hide output; common companion to a relocated InstallUtil.
  - id: 4fbf9270-43da-11ec-9486-acde48001122
    name: Windows InstallUtil Remote Network Connection
    reason: Confirms the proxied payload reached out to the network after InstallUtil ran.
  - id: 75edd216-1939-4c73-8d61-7f3a0d85b5cc
    name: File Download Via InstallUtil.EXE
    reason: InstallUtil fetching a remote file is a payload-staging variant of the same abuse.
  - id: windows-installutil-url-commandline-001
    name: Windows InstallUtil URL in Command Line
    reason: A URL argument means the assembly was pulled remotely rather than copied locally.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: All InstallUtil executions
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Ii]nstall[Uu]til\.exe/
    pivot_on: host
    window: 4h
  - name: Children of InstallUtil
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Ii]nstall[Uu]til\.exe/
    pivot_on: host
    window: 4h
  - name: Compiler or copy staging an InstallUtil payload
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*\\[Cc]sc\.exe/ OR (data_win_eventdata_commandLine:/.*[Ii]nstall[Uu]til.*/ AND data_win_eventdata_image:(/.*[Cc]md\.exe/ OR /.*[Pp]ower[Ss]hell.*/ OR /.*[Xx]copy\.exe/)))
    pivot_on: host
    window: 4h
  - name: Download tools staging payloads
    query: data_win_system_eventID:1 AND data_win_eventdata_image:(/.*[Cc]ertutil\.exe/ OR /.*[Bb]itsadmin\.exe/ OR /.*[Cc]url\.exe/) AND data_win_eventdata_commandLine:/.*([Hh]ttps?:\/\/|urlcache|transfer).*/
    pivot_on: host
    window: 4h
