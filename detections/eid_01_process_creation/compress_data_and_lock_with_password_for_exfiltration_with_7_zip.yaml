name: Compress Data and Lock With Password for Exfiltration With 7-ZIP
id: 9fbf5927-5261-4284-a71d-f681029ea574
version: 1
schema_version: "1.0"
date: "2026-06-05"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 9fbf5927-5261-4284-a71d-f681029ea574
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  An adversary may compress or encrypt data that is collected prior to
  exfiltration using 3rd party utilities. MITRE ATT&CK: T1560.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_description:
                    value: "*7-Zip*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\7z.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\7zr.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\7za.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "7z.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "7za.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "7zr.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* -p*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* a *"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "* u *"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_description
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_description matches
  '*7-Zip*'; data_win_eventdata_image matches '*\7z.exe';
  data_win_eventdata_image matches '*\7zr.exe', among other conditions.

known_false_positives: >
  Legitimate activity is expected since compressing files with a password is
  common. Baseline expected activity in your environment and tune this detection
  before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1560.001/T1560.001.md
  - https://attack.mitre.org/techniques/T1560/001/

response:
  message: >
    Compress Data and Lock With Password for Exfiltration With 7-ZIP detected on
    host $agent_name$. Matched data_win_eventdata_description:
    $data_win_eventdata_description$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1560.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_description
      type: other
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1560.001
  custom_tags:
    - compress
    - password
    - exfiltration
    - process_creation
    - sysmon
    - collection
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_description:/.*7-[Zz][Ii][Pp].*/ OR data_win_eventdata_image:/.*\\7[Zz]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\7[Zz][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\7[Zz][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/7[Zz]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/7[Zz][Aa]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/7[Zz][Rr]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.* -[Pp].*/ AND (data_win_eventdata_commandLine:/.* [Aa] .*/ OR data_win_eventdata_commandLine:/.* [Uu] .*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: ec570e53-4c76-45a9-804d-dc3f355ff7a7
    name: 7Zip Compressing Dump Files
    reason: Password-protected 7z may be packaging credential dumps; same tool, higher-impact payload.
  - id: 4057291a-b8cf-11eb-95fe-acde48001122
    name: Detect Renamed 7-Zip
    reason: Renamed 7z binary is the evasion variant of the same archiving activity on this host.
  - id: faa48cae-6b25-4f00-a094-08947fef582f
    name: Rar Usage with Password and Compression Level
    reason: Same staging behaviour with an alternate archiver; actors often swap tools.
  - id: afe52666-401e-4a02-b4ff-5d128990b8cb
    name: Suspicious Greedy Compression Using Rar.EXE
    reason: Parallel archiver staging of collected data before exfiltration.
  - id: e2e80da2-8c66-4e00-ae3c-2eebd29f6b6d
    name: Compress Data and Lock With Password for Exfiltration With WINZIP
    reason: Sibling staging rule using WinZip; alternate tool for the same exfil prep.
  - id: 32e0baea-b3f1-11eb-a2ce-acde48001122
    name: Detect RClone Command-Line Usage
    reason: 'Rclone is the typical next step: shipping the encrypted archive to cloud storage.'
  - id: 7d1aaf3d-4304-425c-b7c3-162055e0b3ab
    name: Potential Data Exfiltration Activity Via CommandLine Tools
    reason: Follow-on upload of the archive via command line tools.
  - id: e328cc73-f92a-42fb-b3fa-7c2cffda981a
    name: Curl File Upload To File Sharing Websites
    reason: Archive uploaded to a file-sharing site right after staging.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other archivers with password switch
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*[Rr]ar.*/ OR data_win_eventdata_commandLine:/.*[Zz]ip.*/) AND data_win_eventdata_commandLine:/.* -[pP].*/
    pivot_on: host
    window: 6h
  - name: Exfil and sync tool launches
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*[Rr]clone.*/ OR data_win_eventdata_image:/.*[Cc]url\.exe/ OR data_win_eventdata_image:/.*[Mm]ega.*/ OR data_win_eventdata_image:/.*[Ww]inscp.*/)
    pivot_on: host
    window: 6h
  - name: Archive file creation
    query: data_win_system_eventID:11 AND (data_win_eventdata_targetFilename:/.*\.7z/ OR data_win_eventdata_targetFilename:/.*\.zip/ OR data_win_eventdata_targetFilename:/.*\.rar/)
    pivot_on: host
    window: 6h
  - name: Bulk copy staging of user data
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*[Rr]obocopy.*/ OR data_win_eventdata_image:/.*[Xx]copy.*/ OR data_win_eventdata_commandLine:/.*[Cc]opy .*/) AND data_win_eventdata_commandLine:/.*(Documents|Desktop|Users).*/
    pivot_on: host
    window: 4h
  - name: Outbound network connections
    query: data_win_system_eventID:3 AND data_win_eventdata_initiated:true AND data_win_eventdata_destinationPort:(443 OR 21 OR 22 OR 8080)
    pivot_on: host
    window: 2h
