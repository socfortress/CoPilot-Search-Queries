name: Password Set to Never Expire via WMI
id: 7864a175-3654-4824-9f0d-f0da18ab27c0
version: 1
schema_version: "1.0"
date: "2025-07-30"
author: Daniel Koifman (KoifSec)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 7864a175-3654-4824-9f0d-f0da18ab27c0
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the use of wmic.exe to modify user account settings and explicitly
  disable password expiration. MITRE ATT&CK: T1047, T1098.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\wmic.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "wmic.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*useraccount*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* set *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*passwordexpires*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*false*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\wmic.exe'; data_win_eventdata_originalFileName equals 'wmic.exe';
  data_win_eventdata_commandLine matches '*useraccount*', among other
  conditions.

known_false_positives: >
  Legitimate administrative activity. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://www.huntress.com/blog/the-unwanted-guest
  - https://attack.mitre.org/techniques/T1047/
  - https://attack.mitre.org/techniques/T1098/

response:
  message: >
    Password Set to Never Expire via WMI detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1047, T1098
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1047
    - T1098
  custom_tags:
    - password
    - never
    - expire
    - process_creation
    - sysmon
    - privilege_escalation
    - execution
    - persistence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Uu][Ss][Ee][Rr][Aa][Cc][Cc][Oo][Uu][Nn][Tt].*/ AND data_win_eventdata_commandLine:/.* [Ss][Ee][Tt] .*/ AND data_win_eventdata_commandLine:/.*[Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd][Ee][Xx][Pp][Ii][Rr][Ee][Ss].*/ AND data_win_eventdata_commandLine:/.*[Ff][Aa][Ll][Ss][Ee].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: cd219ff3-fa99-45d4-8380-a7d15116c6dc
    name: New User Created Via Net.EXE
    reason: Backdoor account usually created just before its password is pinned.
  - id: b9f0e6f5-09b4-4358-bae4-08408705bd5c
    name: New User Created Via Net.EXE With Never Expire Option
    reason: Same persistence goal via a different command.
  - id: bf906d7b-7070-4642-8383-e404cf26eba5
    name: DarkGate - User Created Via Net.EXE
    reason: Malware-created accounts get never-expire to stay usable.
  - id: 9ec9fb1b-e059-4489-9642-f270c207923d
    name: Hiding User Account Via SpecialAccounts Registry Key - CommandLine
    reason: Hiding the new account from the logon screen follows.
  - id: 0d5675be-bc88-4172-86d3-1e96a4476536
    name: Potential Tampering With RDP Related Registry Keys Via Reg.EXE
    reason: Actor enables RDP to use the persisted account (Huntress Unwanted Guest).
  - id: 4b8f6d3a-9c5e-4f2a-a7d8-6b9c3e5f2a8d
    name: RDP Enable or Disable via Win32_TerminalServiceSetting WMI Class
    reason: WMI-based RDP enablement fits the same WMI-centric operator.
  - id: 4902d7aa-0134-11ec-9d65-acde48001122
    name: Local Account Discovery With Wmic
    reason: Enumerating UserAccount via wmic is the preceding discovery.
  window: 24h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Local account create/modify/group-add events
    query: (data_win_system_eventID:"4720" OR data_win_system_eventID:"4722" OR data_win_system_eventID:"4738" OR data_win_system_eventID:"4732")
    pivot_on: host
    window: 24h
  - name: Account management commands (net, wmic, PowerShell)
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Nn][Ee][Tt] [Uu][Ss][Ee][Rr]|[Nn][Ee][Tt]1 [Uu][Ss][Ee][Rr]|[Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp] [Aa][Dd][Mm][Ii][Nn][Ii][Ss][Tt][Rr][Aa][Tt][Oo][Rr][Ss]|[Uu][Ss][Ee][Rr][Aa][Cc][Cc][Oo][Uu][Nn][Tt]|[Nn][Ee][Ww]\-[Ll][Oo][Cc][Aa][Ll][Uu][Ss][Ee][Rr]|[Aa][Dd][Dd]\-[Ll][Oo][Cc][Aa][Ll][Gg][Rr][Oo][Uu][Pp][Mm][Ee][Mm][Bb][Ee][Rr]).*/
    pivot_on: host
    window: 24h
  - name: RDP enablement and firewall opening
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ff][Dd][Ee][Nn][Yy][Tt][Ss][Cc][Oo][Nn][Nn][Ee][Cc][Tt][Ii][Oo][Nn][Ss]|[Ee][Nn][Aa][Bb][Ll][Ee]\-[Nn][Ee][Tt][Ff][Ii][Rr][Ee][Ww][Aa][Ll][Ll][Rr][Uu][Ll][Ee]|[Pp][Oo][Rr][Tt][Oo][Pp][Ee][Nn][Ii][Nn][Gg] 3389|[Rr][Ee][Mm][Oo][Tt][Ee] [Dd][Ee][Ss][Kk][Tt][Oo][Pp]).*/
    pivot_on: host
    window: 24h
  - name: Registry hiding of accounts or RDP changes
    query: (data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND data_win_eventdata_targetObject:/.*([Ss][Pp][Ee][Cc][Ii][Aa][Ll][Aa][Cc][Cc][Oo][Uu][Nn][Tt][Ss]\\[Uu][Ss][Ee][Rr][Ll][Ii][Ss][Tt]|[Ff][Dd][Ee][Nn][Yy][Tt][Ss][Cc][Oo][Nn][Nn][Ee][Cc][Tt][Ii][Oo][Nn][Ss]|[Tt][Ee][Rr][Mm][Ii][Nn][Aa][Ll] [Ss][Ee][Rr][Vv][Ee][Rr]).*/
    pivot_on: host
    window: 24h
  - name: Network and remote interactive logons to the host
    query: data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"10" OR data_win_eventdata_logonType:"3")
    pivot_on: host
    window: 24h
