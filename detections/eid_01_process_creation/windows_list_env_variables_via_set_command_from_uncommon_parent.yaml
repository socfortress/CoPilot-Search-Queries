name: Windows List ENV Variables Via SET From Uncommon Parent
id: windows-env-variables-set-uncommon-parent-001
version: 1
schema_version: "1.0"
date: "2026-02-23"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  Detects cmd.exe /c set executed with a non-shell parent process (not cmd.exe, 
  explorer.exe, powershell.exe, pwsh.exe). Malware like Qakbot uses this to 
  enumerate environment variables for system reconnaissance from a compromised 
  parent process.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - wildcard:
            data_win_eventdata_image: "*\\\\cmd.exe"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine: "*/c set"
              - wildcard:
                  data_win_eventdata_commandLine: "*/c \"set"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
      must_not:
        - wildcard:
            data_win_eventdata_parentImage: "*\\\\cmd.exe"
        - wildcard:
            data_win_eventdata_parentImage: "*\\\\explorer.exe"
        - wildcard:
            data_win_eventdata_parentImage: "*\\\\powershell.exe"
        - wildcard:
            data_win_eventdata_parentImage: "*\\\\pwsh.exe"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-02-23 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-02-23 23:59:59.999"

how_to_implement: >
  This detection requires Wazuh agents deployed on Windows endpoints with Sysmon 
  installed and configured to log process creation events (EventID 1) with full 
  command-line arguments and parent process information.

known_false_positives: >
  Non-shell parent processes not in the exclusion list may trigger false 
  positives. Add legitimate automation tools to exclusions as needed.

references:
  - https://attack.mitre.org/techniques/T1055/
  - https://twitter.com/pr0xylife/status/1585612370441031680

response:
  message: >
    ENV variable enumeration via SET from uncommon parent on $agent_name$. 
    Parent: $data_win_eventdata_parentImage$. 
    Command: $data_win_eventdata_commandLine$. 
    Possible Qakbot. MITRE ATT&CK: T1055
  risk_score: 56
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 56
  threat_objects: []

tags:
  analytic_story:
    - Qakbot
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1055
  custom_tags:
    - env_enumeration
    - uncommon_parent
    - qakbot
    - reconnaissance
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*cmd\.exe/ AND (data_win_eventdata_commandLine:/.*\/c set/ OR data_win_eventdata_commandLine:/.*\/c "set/) AND NOT data_win_eventdata_parentImage:/.*cmd\.exe/ AND NOT data_win_eventdata_parentImage:/.*explorer\.exe/ AND NOT data_win_eventdata_parentImage:/.*powershell\.exe/ AND NOT data_win_eventdata_parentImage:/.*pwsh\.exe/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: cf879ffb-793a-4753-9a14-bc8f37cc90df
    name: Potential Qakbot Rundll32 Execution
    reason: Qakbot is the named user of this recon; the same implant host commonly shows rundll32 loader execution.
  - id: 698d4431-514f-4c82-af4d-cf573872a9f5
    name: Potential Pikabot Discovery Activity
    reason: Pikabot-style loaders run a burst of discovery commands from the same injected parent right after env enumeration.
  - id: 9d7ca793-f6bd-471c-8d0f-11e68b2f0d2f
    name: Computer System Reconnaissance Via Wmic.EXE
    reason: Further host profiling by the same malware parent follows the set enumeration.
  - id: e6313acd-208c-44fc-a0ff-db85d572e90e
    name: Network Reconnaissance Activity
    reason: Env recon is typically followed by network and domain discovery from the same implant.
  - id: 41243735-89a7-4c83-bcdd-570aa78f00a1
    name: Domain Controller Discovery with Nltest
    reason: 'Next stage of Qakbot-style discovery: locating domain controllers.'
  - id: 69bd9b97-2be2-41b6-9816-fb08757a4d1a
    name: Potentially Suspicious Execution From Parent Process In Public Folder
    reason: The uncommon parent is often a payload dropped in a public/user-writable folder.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Discovery commands spawned by cmd
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ww][Hh][Oo][Aa][Mm][Ii].*/ OR data_win_eventdata_commandLine:/.*[Ii][Pp][Cc][Oo][Nn][Ff][Ii][Gg].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Tt][Ss][Tt][Aa][Tt].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ll][Tt][Ee][Ss][Tt].*/ OR data_win_eventdata_commandLine:/.*[Ss][Yy][Ss][Tt][Ee][Mm][Ii][Nn][Ff][Oo].*/ OR data_win_eventdata_commandLine:/.*[Tt][Aa][Ss][Kk][Ll][Ii][Ss][Tt].*/)
    pivot_on: host
    window: 2h
  - name: Execution from user-writable paths
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:*\\Users\\Public\\* OR data_win_eventdata_image:*\\AppData\\* OR data_win_eventdata_image:*\\Windows\\Temp\\* OR data_win_eventdata_image:*\\ProgramData\\*)
    pivot_on: host
    window: 4h
  - name: Rundll32/regsvr32 and script host launches
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:*\\rundll32.exe OR data_win_eventdata_image:*\\regsvr32.exe OR data_win_eventdata_image:*\\wscript.exe OR data_win_eventdata_image:*\\mshta.exe)
    pivot_on: host
    window: 4h
  - name: Outbound connections by LOLBins
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:*\\rundll32.exe OR data_win_eventdata_image:*\\cmd.exe OR data_win_eventdata_image:*\\wermgr.exe OR data_win_eventdata_image:*\\regsvr32.exe)
    pivot_on: host
    window: 4h
