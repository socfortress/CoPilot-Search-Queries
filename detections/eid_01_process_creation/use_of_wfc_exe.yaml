name: Use of Wfc.exe
id: 49be8799-7b4d-4fda-ad23-cafbefdebbc5
version: 1
schema_version: "1.0"
date: "2022-06-01"
author: Christopher Peacock @SecurePeacock, SCYTHE @scythe_io
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 49be8799-7b4d-4fda-ad23-cafbefdebbc5
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  The Workflow Command-line Compiler can be used for AWL bypass and is listed in
  Microsoft's recommended block rules. MITRE ATT&CK: T1127.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\wfc.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "wfc.exe"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches '*\wfc.exe';
  data_win_eventdata_originalFileName equals 'wfc.exe'.

known_false_positives: >
  Legitimate use by a software developer. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://lolbas-project.github.io/lolbas/OtherMSBinaries/Wfc/
  - https://learn.microsoft.com/en-us/windows/security/application-security/application-control/windows-defender-application-control/design/applications-that-can-bypass-wdac
  - https://attack.mitre.org/techniques/T1127/

response:
  message: >
    Use of Wfc.exe detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1127
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1127
  custom_tags:
    - process_creation
    - sysmon
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Ww][Ff][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Ww][Ff][Cc]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a01b8329-5953-4f73-ae2d-aa01e1f35f00
    name: AspNetCompiler Execution
    reason: Another .NET framework compiler abused for AWL bypass on the same host.
  - id: 850d55f9-6eeb-4492-ad69-a72338f65ba4
    name: C# IL Code Compilation Via Ilasm.EXE
    reason: Framework build tool compiling attacker code; same compile-and-run pattern.
  - id: d80d5c81-04ba-45b4-84e4-92eba40e0ad3
    name: Arbitrary DLL or Csproj Code Execution Via Dotnet.EXE
    reason: Parallel signed .NET tool for arbitrary code execution.
  - id: 40b95d31-1afc-469e-8d34-9a3a667d058e
    name: Suspicious Csi.exe Usage
    reason: Roslyn scripting tool used the same way.
  - id: 213b3148-24ea-11ec-93a2-acde48001122
    name: MSBuild Suspicious Spawned By Script Process
    reason: MSBuild is the most common companion compiler LOLBin in the same chains.
  - id: b6676963-0353-4f88-90f5-36c20d443c6a
    name: Cscript/Wscript Potentially Suspicious Child Process
    reason: Typical delivery stage that launches wfc.exe.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Children of wfc.exe
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*\\wfc\.exe/
    pivot_on: host
    window: 2h
  - name: Framework compilers invoked
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*\\(csc|vbc|msbuild|jsc|aspnet_compiler|ilasm)\.exe/
    pivot_on: host
    window: 2h
  - name: Compiled assemblies and workflow files in user-writable paths
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\\(AppData|Temp|ProgramData|Users\\Public)\\.*\.(exe|dll|xoml)/
    pivot_on: host
    window: 4h
  - name: Script hosts and Office parents preceding
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*\\(wscript|cscript|mshta|winword|excel)\.exe/
    pivot_on: host
    window: 4h
  - name: Outbound network from compiler binaries
    query: data_win_system_eventID:3 AND data_win_eventdata_initiated:true AND data_win_eventdata_image:/.*\\(wfc|csc|msbuild)\.exe/
    pivot_on: host
    window: 2h
