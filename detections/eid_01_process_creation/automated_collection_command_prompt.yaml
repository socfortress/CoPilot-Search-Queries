name: Automated Collection Command Prompt
id: f576a613-2392-4067-9d1a-9345fb58d8d1
version: 1
schema_version: "1.0"
date: "2022-11-11"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: f576a613-2392-4067-9d1a-9345fb58d8d1
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Once established within a system or network, an adversary may use automated
  techniques for collecting internal data. MITRE ATT&CK: T1119, T1552.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.doc*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.docx*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.xls*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.xlsx*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.ppt*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.pptx*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.rtf*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.pdf*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*.txt*"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*dir *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* /b *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "* /s *"
                          case_insensitive: true
              - bool:
                  must:
                    - term:
                        data_win_eventdata_originalFileName:
                          value: "FINDSTR.EXE"
                          case_insensitive: true
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* /e *"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_commandLine:
                                value: "* /si *"
                                case_insensitive: true
                        minimum_should_match: 1
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_originalFileName
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*.doc*'; data_win_eventdata_commandLine matches '*.docx*';
  data_win_eventdata_commandLine matches '*.xls*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1119/T1119.md
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1552.001/T1552.001.md
  - https://attack.mitre.org/techniques/T1119/
  - https://attack.mitre.org/techniques/T1552/001/

response:
  message: >
    Automated Collection Command Prompt detected on host $agent_name$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1119, T1552.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1119
    - T1552.001
  custom_tags:
    - automated
    - collection
    - prompt
    - process_creation
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*\.[Dd][Oo][Cc].*/ OR data_win_eventdata_commandLine:/.*\.[Dd][Oo][Cc][Xx].*/ OR data_win_eventdata_commandLine:/.*\.[Xx][Ll][Ss].*/ OR data_win_eventdata_commandLine:/.*\.[Xx][Ll][Ss][Xx].*/ OR data_win_eventdata_commandLine:/.*\.[Pp][Pp][Tt].*/ OR data_win_eventdata_commandLine:/.*\.[Pp][Pp][Tt][Xx].*/ OR data_win_eventdata_commandLine:/.*\.[Rr][Tt][Ff].*/ OR data_win_eventdata_commandLine:/.*\.[Pp][Dd][Ff].*/ OR data_win_eventdata_commandLine:/.*\.[Tt][Xx][Tt].*/) AND ((data_win_eventdata_commandLine:/.*[Dd][Ii][Rr] .*/ AND data_win_eventdata_commandLine:/.* \/[Bb] .*/ AND data_win_eventdata_commandLine:/.* \/[Ss] .*/) OR (data_win_eventdata_originalFileName:/[Ff][Ii][Nn][Dd][Ss][Tt][Rr]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.* \/[Ee] .*/ OR data_win_eventdata_commandLine:/.* \/[Ss][Ii] .*/)))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 91a2c315-9ee6-4052-a853-6f6a8238f90d
    name: Findstr GPP Passwords
    reason: Same dir/findstr sweep tradecraft aimed at credentials; shows the collection was credential hunting, not just documents.
  - id: 47e4bab7-c626-47dc-967b-255608c9a920
    name: Permission Misconfiguration Reconnaissance Via Findstr.EXE
    reason: Findstr-based recon on the same host often precedes or accompanies the file sweep.
  - id: ec570e53-4c76-45a9-804d-dc3f355ff7a7
    name: 7Zip Compressing Dump Files
    reason: Collected files are typically archived next; 7-Zip use on the host is the staging step.
  - id: 9fbf5927-5261-4284-a71d-f681029ea574
    name: Compress Data and Lock With Password for Exfiltration With 7-ZIP
    reason: Password-protected archiving directly follows document collection in exfiltration chains.
  - id: 85a8e5ba-bd03-4bfb-bbfa-a4409a8f8b98
    name: Folder Compress To Potentially Suspicious Output Via Compress-Archive Cmdlet
    reason: PowerShell alternative staging of the collected files into an archive.
  - id: e7be6119-fc37-43f0-ad4f-1f3f99be2f9f
    name: Copying Sensitive Files with Credential Data
    reason: Parallel collection of credential stores alongside the document sweep.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Archive tools staging collected data
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*[Rr]ar.* [aA] .*/ OR data_win_eventdata_commandLine:/.*7z.* a .*/ OR data_win_eventdata_commandLine:/.*[Cc]ompress-[Aa]rchive.*/ OR data_win_eventdata_commandLine:/.*tar.* -c.*/)
    pivot_on: host
    window: 4h
  - name: Archive or staging files created
    query: data_win_system_eventID:11 AND (data_win_eventdata_targetFilename:/.*\.(zip|rar|7z|tar|gz)/ OR data_win_eventdata_targetFilename:/.*[Tt]emp.*\.(txt|dat|tmp)/)
    pivot_on: host
    window: 4h
  - name: Other discovery/enumeration commands
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*tree .*/ OR data_win_eventdata_commandLine:/.*where \/r.*/ OR data_win_eventdata_commandLine:/.*[Gg]et-[Cc]hild[Ii]tem.*-[Rr]ecurse.*/ OR data_win_eventdata_commandLine:/.*findstr.* \/s.*/)
    pivot_on: host
    window: 2h
  - name: Outbound transfer tools after collection
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:/.*\\curl\.exe/ OR data_win_eventdata_commandLine:/.*[Ii]nvoke-[Ww]eb[Rr]equest.*-[Mm]ethod [Pp]ost.*/ OR data_win_eventdata_commandLine:/.*bitsadmin.*\/upload.*/ OR data_win_eventdata_commandLine:/.*(rclone|megacmd|winscp).*/)
    pivot_on: host
    window: 6h
