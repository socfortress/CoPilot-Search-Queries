name: Windows Net System Service Discovery
id: Windows-Net-System-Service-Discovery
version: 1
schema_version: 1
date: '2025-08-25'
author: SOCFortress LLC
status: production
type: Anomaly
description: >
  Detects enumeration of Windows services using the net start command. Adversaries
  use this built-in utility during early reconnaissance to gain situational awareness
  of running services, identify security software, and discover opportunities for
  privilege escalation or lateral movement. Associated with LAMEHUG malware tradecraft.
  MITRE ATT&CK: T1007 (System Service Discovery).

data_source:
  - Sysmon EventID 1 (ProcessCreate)

search:
  query:
    bool:
      must:
        - term:
            agent_name: "AGENT_NAME"
        - term:
            agent_labels_customer: "CUSTOMER_CODE"
        - term:
            data_win_system_eventID: "1"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image: "*\\net.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\net1.exe"
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine: "* start*"
        - range:
            timestamp:
              gte: "START_TIME"
              lte: "END_TIME"

parameters:
  - name: AGENT_NAME
    default: "DESKTOP-AM0HLGE"
  - name: CUSTOMER_CODE
    default: "lab"
  - name: START_TIME
    default: "now-24h"
  - name: END_TIME
    default: "now"

how_to_implement: >
  Requires Sysmon EventID 1 (ProcessCreate) flowing to the Wazuh Indexer.
  Fields data_win_eventdata_image and data_win_eventdata_commandLine are
  confirmed working across all EventID 1 detections in this environment.
  Field-validated based on established EventID 1 detection patterns.

known_false_positives: >
  Administrators or power users may use net start for legitimate troubleshooting
  or service management. Filter by parent process or user context as needed.

references:
  - https://cert.gov.ua/article/6284730
  - https://attack.mitre.org/techniques/T1007/

response:
  message: >
    Service enumeration via net start detected on $agent_name$ by $data_win_eventdata_user$.
    Parent: $data_win_eventdata_parentImage$.
    Command: $data_win_eventdata_commandLine$.
    MITRE ATT&CK: T1007
  risk_score: 3
  severity: low
  risk_objects:
    - field: agent_name
      type: system
      score: 3
    - field: data_win_eventdata_user
      type: user
      score: 3
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: parent_process_name
    - field: data_win_eventdata_image
      type: process_name

tags:
  analytic_story:
    - LAMEHUG
  asset_type: Endpoint
  mitre_attack_id:
    - T1007
  custom_tags:
    - net_start
    - service_discovery
    - reconnaissance
    - living_off_the_land
  product:
    - Wazuh
  security_domain: endpoint

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 76f55eaa-d27f-4213-9d45-7b0e4b60bbae
    name: Service Reconnaissance Via Wmic.EXE
    reason: Alternate service enumeration often run in the same recon burst.
  - id: windows-group-discovery-net-001
    name: Windows Group Discovery Via Net
    reason: Net-based group enumeration typically follows or precedes net start in the discovery script.
  - id: d95de845-b83c-4a9a-8a6a-4fc802ebf6c0
    name: Suspicious Group And Account Reconnaissance Activity Using Net.EXE
    reason: Account recon from the same net.exe burst.
  - id: 698d4431-514f-4c82-af4d-cf573872a9f5
    name: Potential Pikabot Discovery Activity
    reason: Malware discovery chains combine net start with other enumeration.
  - id: 970007b7-ce32-49d0-a4a4-fbef016950bd
    name: Potential Configuration And Service Reconnaissance Via Reg.EXE
    reason: Registry-based service recon complements net start.
  - id: 17a1be64-8d88-40bf-b5ff-a4f7a50ebcc8
    name: Suspicious New Service Creation
    reason: Service discovery to find security tools precedes creating or tampering with services.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: net.exe recon commands
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:*\\net.exe OR data_win_eventdata_image:*\\net1.exe) AND (data_win_eventdata_commandLine:*start* OR data_win_eventdata_commandLine:*[Gg]roup* OR data_win_eventdata_commandLine:*[Uu]ser* OR data_win_eventdata_commandLine:*[Vv]iew* OR data_win_eventdata_commandLine:*[Uu]se*)
    pivot_on: host
    window: 2h
  - name: Other discovery utilities
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:*\\tasklist.exe OR data_win_eventdata_image:*\\systeminfo.exe OR data_win_eventdata_image:*\\ipconfig.exe OR data_win_eventdata_image:*\\whoami.exe OR data_win_eventdata_image:*\\nltest.exe)
    pivot_on: host
    window: 2h
  - name: Service control manipulation
    query: data_win_system_eventID:1 AND data_win_eventdata_image:*\\sc.exe AND (data_win_eventdata_commandLine:*[Ss]top* OR data_win_eventdata_commandLine:*[Cc]onfig* OR data_win_eventdata_commandLine:*[Cc]reate* OR data_win_eventdata_commandLine:*[Dd]elete*)
    pivot_on: host
    window: 4h
  - name: Script or shell parent launching net.exe
    query: data_win_system_eventID:1 AND (data_win_eventdata_image:*\\net.exe OR data_win_eventdata_image:*\\net1.exe) AND (data_win_eventdata_parentImage:*cmd.exe OR data_win_eventdata_parentImage:*powershell.exe OR data_win_eventdata_parentImage:*wscript.exe OR data_win_eventdata_parentImage:*mshta.exe)
    pivot_on: host
    window: 2h
