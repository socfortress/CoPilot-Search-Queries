name: Windows Defender Definition Files Removed
id: 9719a8aa-401c-41af-8108-ced7ec9cd75c
version: 1
schema_version: "1.0"
date: "2023-07-18"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 9719a8aa-401c-41af-8108-ced7ec9cd75c
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Adversaries may disable security tools to avoid possible detection of their
  tools and activities by removing Windows Defender Definition Files. MITRE
  ATT&CK: T1685.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\MpCmdRun.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "MpCmdRun.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* -RemoveDefinitions*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* -All*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\MpCmdRun.exe'; data_win_eventdata_originalFileName equals 'MpCmdRun.exe';
  data_win_eventdata_commandLine matches '* -RemoveDefinitions*', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1562.001/T1562.001.md
  - https://unit42.paloaltonetworks.com/unit42-gorgon-group-slithering-nation-state-cybercrime/
  - https://attack.mitre.org/techniques/T1685/

response:
  message: >
    Windows Defender Definition Files Removed detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1685
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685
  custom_tags:
    - defender
    - definition
    - removed
    - process_creation
    - sysmon
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Mm][Pp][Cc][Mm][Dd][Rr][Uu][Nn]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Mm][Pp][Cc][Mm][Dd][Rr][Uu][Nn]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.* -[Rr][Ee][Mm][Oo][Vv][Ee][Dd][Ee][Ff][Ii][Nn][Ii][Tt][Ii][Oo][Nn][Ss].*/ AND data_win_eventdata_commandLine:/.* -[Aa][Ll][Ll].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 46123129-1024-423e-9fae-43af4a0fa9a5
    name: File Download Via Windows Defender MpCmpRun.EXE
    reason: Same MpCmdRun.exe binary abused as a LOLBin; attacker control of it suggests download-and-execute in the same session.
  - id: b28e58e4-2a72-4fae-bdee-0fbe904db642
    name: Windows Defender Real-time Protection Disabled
    reason: Signature removal is typically followed or accompanied by real-time protection being turned off.
  - id: bc275be9-0bec-4d77-8c8f-281a2df6710f
    name: Windows Defender Malware And PUA Scanning Disabled
    reason: Scanning disabled events are the operational consequence of definition removal and tampering.
  - id: 49e5bc24-8b86-49f1-b743-535f332c2856
    name: Microsoft Defender Tamper Protection Trigger
    reason: Tamper Protection may block this action; its trigger shows the attempt was challenged.
  - id: 1321dc4e-a1fe-481d-a016-52c45f0c8b4f
    name: Windows Defender Exclusions Added
    reason: Exclusions are commonly added together with definition removal so tooling can run.
  - id: 17769c90-230e-488b-a463-e05c08e9d48f
    name: Powershell Defender Exclusion
    reason: Command-line exclusion addition by the same actor.
  - id: 7002aa10-b8d4-47ae-b5ba-51ab07e228b9
    name: Potential Mpclient.DLL Sideloading Via Defender Binaries
    reason: Another Defender-binary abuse path used to evade or run code via MpCmdRun.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: MpCmdRun invocations
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Mm]p[Cc]md[Rr]un.exe/
    pivot_on: host
    window: 4h
  - name: Defender signature or engine failures
    query: data_win_system_eventID:(2001 OR 2003 OR 2004 OR 5001 OR 5010 OR 5012)
    pivot_on: host
    window: 4h
  - name: Defender tamper cmdlets and exclusions
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*[Mm]p[Pp]reference.*/ OR data_win_eventdata_commandLine:/.*[Ee]xclusion.*/)
    pivot_on: host
    window: 4h
  - name: Executables started from user-writable paths
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*\\([Tt]emp|[Pp]ublic|[Aa]pp[Dd]ata|[Pp]rogram[Dd]ata)\\.*/
    pivot_on: host
    window: 2h
