    - id: 32e0baea-b3f1-11eb-a2ce-acde48001122
      name: "Detect RClone Command-Line Usage"
      reason: "same analytic story: Cactus Ransomware"
    - id: 72170ec5-f7d2-42f5-aefb-2b8be6aad15f
