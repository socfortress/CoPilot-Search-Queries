name: Windows Apache Benchmark Binary
id: windows-apache-benchmark-binary-001
version: 1
schema_version: "1.0"
date: "2026-03-03"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  Detects execution of the Apache Benchmark binary (ab.exe), commonly used 
  as a default MetaSploit payload. The original filename ab.exe is a strong 
  indicator of MetaSploit activity when found outside of legitimate Apache 
  installations.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - bool:
            should:
              - term:
                  data_win_eventdata_originalFileName: "ab.exe"
              - wildcard:
                  data_win_eventdata_image: "*\\ab.exe"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_parentImage
    - data_win_eventdata_user
    - data_win_eventdata_hashes

parameters:
  AGENT_NAME:
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    type: string
    required: true
    example: "lab"
  START_TIME:
    type: datetime
    default: "now-24h"
  END_TIME:
    type: datetime
    default: "now"

how_to_implement: >
  Requires Sysmon EventID 1 with original filename logging enabled.

known_false_positives: >
  Legitimate Apache HTTP Server installations include ab.exe. Verify 
  process path is not within Apache installation directory.

references:
  - https://seclists.org/metasploit/2013/q3/13
  - https://attack.mitre.org/techniques/T1059/

response:
  message: >
    MetaSploit Apache Benchmark payload detected on $agent_name$. 
    Process: $data_win_eventdata_image$. 
    Parent: $data_win_eventdata_parentImage$. 
    User: $data_win_eventdata_user$. 
    HIGH CONFIDENCE malware indicator. MITRE ATT&CK: T1059
  risk_score: 100
  severity: critical
  risk_objects:
    - field: agent_name
      type: system
      score: 100
  threat_objects: []

tags:
  analytic_story:
    - MetaSploit
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1059
  custom_tags:
    - metasploit
    - apache_benchmark
    - malware_ioc
    - high_confidence
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_originalFileName:"ab.exe"

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 15619216-e993-4721-b590-4c520615a67d
    name: Potential Meterpreter/CobaltStrike Activity
    reason: ab.exe is a Metasploit default payload name; this covers typical Meterpreter process behaviour.
  - id: 730fc21b-eaff-474b-ad23-90fd265d4988
    name: Psexec Execution
    reason: Metasploit psexec modules drop service executables like ab.exe during lateral movement.
  - id: fdfcbd78-48f1-4a4b-90ac-d82241e368c5
    name: PsExec Service Execution
    reason: Service-based remote execution commonly delivering the dropped payload binary.
  - id: 7b434893-c57d-4f41-908d-6a17bf1ae98f
    name: Network Connection Initiated From Process Located In Potentially Suspicious Or Uncommon Location
    reason: A rogue ab.exe typically beacons out from a non-Apache path.
  - id: d4ca7c59-e9e4-42d8-bf57-91a776efcb87
    name: LOLBIN Execution From Abnormal Drive
    reason: Staged payload execution from odd locations accompanies dropped binaries.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Network connections by ab.exe
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*\\ab\.exe/
    pivot_on: host
    window: 2h
  - name: Children spawned by ab.exe
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*\\ab\.exe/
    pivot_on: host
    window: 2h
  - name: ab.exe file creation
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\\ab\.exe/
    pivot_on: host
    window: 6h
  - name: Remote service install or exec tooling
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(PSEXESVC|sc.*create|ADMIN\$|cmd /c echo).*/
    pivot_on: host
    window: 4h
