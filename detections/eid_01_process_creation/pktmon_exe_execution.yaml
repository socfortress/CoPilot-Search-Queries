name: PktMon.EXE Execution
id: f956c7c1-0f60-4bc5-b7d7-b39ab3c08908
version: 1
schema_version: "1.0"
date: "2023-06-23"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: f956c7c1-0f60-4bc5-b7d7-b39ab3c08908
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of PktMon, a tool that captures network packets. MITRE
  ATT&CK: T1040.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\pktmon.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "PktMon.exe"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\pktmon.exe'; data_win_eventdata_originalFileName equals 'PktMon.exe'.

known_false_positives: >
  Legitimate use. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://lolbas-project.github.io/lolbas/Binaries/Pktmon/
  - https://attack.mitre.org/techniques/T1040/

response:
  message: >
    PktMon.EXE Execution detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1040
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1040
  custom_tags:
    - pktmon
    - process_creation
    - sysmon
    - discovery
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Pp][Kk][Tt][Mm][Oo][Nn]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Pp][Kk][Tt][Mm][Oo][Nn]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: ba1f7802-adc7-48b4-9ecb-81e227fddfd5
    name: Potential Network Sniffing Activity Using Network Tools
    reason: Other sniffers on the same host indicate deliberate traffic capture
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other packet capture tooling
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[\\](tshark|dumpcap|windump|tcpdump|wireshark|rawcap)\.exe/
    pivot_on: host
    window: 4h
  - name: Capture output files
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:/.*\.(etl|pcap|pcapng|cap)/
    pivot_on: host
    window: 4h
  - name: Credential access tooling near capture
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(sekurlsa|lsass|procdump|ntdsutil|mimikatz|comsvcs).*/
    pivot_on: host
    window: 4h
  - name: Staging of capture output
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(Compress-Archive|7z|rar|makecab).*(etl|pcap|cap).*/
    pivot_on: host
    window: 4h
