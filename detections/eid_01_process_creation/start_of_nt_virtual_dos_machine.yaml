name: Start of NT Virtual DOS Machine
id: 16905e21-66ee-42fe-b256-1318ada2d770
version: 1
schema_version: "1.0"
date: "2022-07-16"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 16905e21-66ee-42fe-b256-1318ada2d770
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Ntvdm.exe allows the execution of 16-bit Windows applications on 32-bit
  Windows operating systems, as well as the execution of both 16-bit and 32-bit
  DOS applications.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\ntvdm.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\csrstub.exe"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\ntvdm.exe'; data_win_eventdata_image matches '*\csrstub.exe'.

known_false_positives: >
  Legitimate use. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://learn.microsoft.com/en-us/windows/compatibility/ntvdm-and-16-bit-app-support
  - https://support.microsoft.com/fr-fr/topic/an-ms-dos-based-program-that-uses-the-ms-dos-protected-mode-interface-crashes-on-a-computer-that-is-running-windows-7-5dc739ea-987b-b458-15e4-d28d5cca63c7
  - https://app.any.run/tasks/93fe92fa-8b2b-4d92-8c09-a841aed2e793/
  - https://app.any.run/tasks/214094a7-0abc-4a7b-a564-1b757faed79d/

response:
  message: >
    Start of NT Virtual DOS Machine detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - start
    - virtual
    - machine
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Nn][Tt][Vv][Dd][Mm]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Ss][Rr][Ss][Tt][Uu][Bb]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a77c1610-fc73-4019-8e29-0f51efc04a51
    name: Potential Dosfuscation Activity
    reason: Legacy DOS-style command obfuscation commonly appears alongside unusual legacy-subsystem execution.
  - id: 3f7f5b0b-5b16-476c-a85f-ab477f6dd24b
    name: Lazarus System Binary Masquerading
    reason: Both indicate an operator abusing old or system binaries to blend in.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Script interpreters that may have launched NTVDM
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*\\(cmd|powershell|wscript|cscript|mshta)\.exe/
    pivot_on: host
    window: 1h
  - name: Children of ntvdm or csrstub
    query: data_win_system_eventID:1 AND (data_win_eventdata_parentImage:/.*\\ntvdm\.exe/ OR data_win_eventdata_parentImage:/.*\\csrstub\.exe/)
    pivot_on: host
    window: 2h
  - name: DOS and 16-bit executables written to disk
    query: data_win_system_eventID:11 AND (data_win_eventdata_targetFilename:/.*\.(com|pif|scr)/ OR data_win_eventdata_targetFilename:/.*\.(bat|cmd)/)
    pivot_on: host
    window: 2h
  - name: NTVDM exploit or LPE tooling
    query: data_win_system_eventID:1 AND (data_win_eventdata_commandLine:/.*[Vv]dm[Ss]ploit.*/ OR data_win_eventdata_commandLine:/.*[Nn]tvdm.*/)
    pivot_on: host
    window: 2h
