name: SyncAppvPublishingServer VBS Execute Arbitrary PowerShell Code
id: 36475a7d-0f6d-4dce-9b01-6aeb473bbaf1
version: 1
schema_version: "1.0"
date: "2022-06-22"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 36475a7d-0f6d-4dce-9b01-6aeb473bbaf1
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Executes arbitrary PowerShell code using SyncAppvPublishingServer.vbs. MITRE
  ATT&CK: T1218, T1216.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*\\\\SyncAppvPublishingServer.vbs*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine: "*;*"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_commandLine
    - data_win_eventdata_image
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_commandLine matches
  '*\SyncAppvPublishingServer.vbs*'; data_win_eventdata_commandLine matches
  '*;*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1216/T1216.md
  - https://lolbas-project.github.io/lolbas/Binaries/Syncappvpublishingserver/
  - https://attack.mitre.org/techniques/T1218/
  - https://attack.mitre.org/techniques/T1216/

response:
  message: >
    SyncAppvPublishingServer VBS Execute Arbitrary PowerShell Code detected on
    host $agent_name$. Matched data_win_eventdata_commandLine:
    $data_win_eventdata_commandLine$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1218, T1216
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218
    - T1216
  custom_tags:
    - syncappvpublishingserver
    - execute
    - arbitrary
    - process_creation
    - sysmon
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*\\[Ss][Yy][Nn][Cc][Aa][Pp][Pp][Vv][Pp][Uu][Bb][Ll][Ii][Ss][Hh][Ii][Nn][Gg][Ss][Ee][Rr][Vv][Ee][Rr]\.[Vv][Bb][Ss].*/ AND data_win_eventdata_commandLine:/.*;.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: fbd7c32d-db2a-4418-b92c-566eb8911133
    name: SyncAppvPublishingServer Execute Arbitrary PowerShell Code
    reason: Executable variant of the same App-V proxy execution; seeing both means the actor is probing evasion options.
  - id: b6676963-0353-4f88-90f5-36c20d443c6a
    name: Cscript/Wscript Potentially Suspicious Child Process
    reason: The .vbs runs under wscript/cscript; suspicious children of those hosts are the immediate payload stage.
  - id: 99b7460d-c9f1-40d7-a316-1f36f61d52ee
    name: Cscript/Wscript Uncommon Script Extension Execution
    reason: Cscript/wscript running unusual script types is the usual delivery sibling of a VBS LOLScript.
  - id: cea72823-df4d-4567-950c-0b579eaf0846
    name: Potential Dropper Script Execution Via WScript/CScript/MSHTA
    reason: Dropper script via WScript/CScript/MSHTA is the likely precursor delivering the command.
  - id: e32d4572-9826-4738-b651-95fa63747e8a
    name: Base64 Encoded PowerShell Command Detected
    reason: Embedded PowerShell payload is often base64-encoded; follow-on detection.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: PowerShell spawned from App-V or script-host parents
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee])/ AND data_win_eventdata_parentImage:/.*([Ss][Yy][Nn][Cc][Aa][Pp][Pp][Vv]|[Aa][Pp][Pp][Vv][Ll][Pp]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]).*/
    pivot_on: host
    window: 1h
  - name: WScript/CScript launching unexpected children
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*([Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee])/ AND data_win_eventdata_image:/.*([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|[Cc][Mm][Dd]\.[Ee][Xx][Ee]|[Mm][Ss][Hh][Tt][Aa]\.[Ee][Xx][Ee]|[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]|[Rr][Ee][Gg][Ss][Vv][Rr]32\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 1h
  - name: WScript/CScript running scripts from user-writable paths
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*([Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee])/ AND data_win_eventdata_commandLine:/.*([Tt][Ee][Mm][Pp]|[Aa][Pp][Pp][Dd][Aa][Tt][Aa]|[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]|[Pp][Uu][Bb][Ll][Ii][Cc]).*\.([Vv][Bb][Ss]|[Vv][Bb][Ee]|[Jj][Ss]|[Ww][Ss][Ff]).*/
    pivot_on: host
    window: 4h
  - name: Script host outbound connections
    query: data_win_system_eventID:"3" AND data_win_eventdata_image:/.*([Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.[Ee][Xx][Ee])/
    pivot_on: host
    window: 2h
  - name: PowerShell download cradles and encoded commands
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee])/ AND data_win_eventdata_commandLine:/.*([Ff][Rr][Oo][Mm][Bb][Aa][Ss][Ee]64|-[Ee][Nn][Cc]|[Ii][Ee][Xx]|[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd]|[Nn][Ee][Tt]\.[Ww][Ee][Bb][Cc][Ll][Ii][Ee][Nn][Tt]|[Hh][Ii][Dd][Dd][Ee][Nn]).*/
    pivot_on: host
    window: 2h
