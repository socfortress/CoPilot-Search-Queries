name: Harvesting Of Wifi Credentials Via Netsh.EXE
id: 42b1a5b8-353f-4f10-b256-39de4467faff
version: 1
schema_version: "1.0"
date: "2023-02-13"
author: Andreas Hunkeler (@Karneades), oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 42b1a5b8-353f-4f10-b256-39de4467faff
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detect the harvesting of wifi credentials using netsh.exe. MITRE ATT&CK:
  T1040.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\netsh.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "netsh.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*wlan*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* s*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* p*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* k*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*=clear*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\netsh.exe'; data_win_eventdata_originalFileName equals 'netsh.exe';
  data_win_eventdata_commandLine matches '*wlan*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://blog.malwarebytes.com/threat-analysis/2020/04/new-agenttesla-variant-steals-wifi-credentials/
  - https://attack.mitre.org/techniques/T1040/

response:
  message: >
    Harvesting Of Wifi Credentials Via Netsh.EXE detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1040
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1040
  custom_tags:
    - harvesting
    - credentials
    - netsh
    - process_creation
    - sysmon
    - discovery
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Nn][Ee][Tt][Ss][Hh]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Nn][Ee][Tt][Ss][Hh]\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Ww][Ll][Aa][Nn].*/ AND data_win_eventdata_commandLine:/.* [Ss].*/ AND data_win_eventdata_commandLine:/.* [Pp].*/ AND data_win_eventdata_commandLine:/.* [Kk].*/ AND data_win_eventdata_commandLine:/.*=[Cc][Ll][Ee][Aa][Rr].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c2b86e67-b880-4eec-b045-50bc98ef4844
    name: HackTool - LaZagne Execution
    reason: LaZagne harvests Wi-Fi keys together with browser and system credentials.
  - id: 07f8bdc2-c9b3-472a-9817-5a670b872f53
    name: Potential Reconnaissance For Cached Credentials Via Cmdkey.EXE
    reason: Credential Manager enumeration commonly runs in the same credential-harvest pass.
  - id: e0b0c2ab-3d52-46d9-8cb7-049dc775fbd1
    name: Enumeration for Credentials in Registry
    reason: Registry credential searches accompany Wi-Fi key extraction in stealer scripts.
  - id: e7be6119-fc37-43f0-ad4f-1f3f99be2f9f
    name: Copying Sensitive Files with Credential Data
    reason: Broader credential file collection by the same actor.
  - id: e6313acd-208c-44fc-a0ff-db85d572e90e
    name: Network Reconnaissance Activity
    reason: Wi-Fi profile dumping is often part of local network discovery.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other netsh wlan/profile commands
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*[Nn]etsh\.exe/ AND data_win_eventdata_commandLine:/.*(wlan|profile).*/
    pivot_on: host
    window: 4h
  - name: Credential store enumeration
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*(cmdkey|vaultcmd|[Ll]a[Zz]agne|[Ss]ecretsdump).*/
    pivot_on: host
    window: 4h
  - name: Wi-Fi key output redirected to files
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:/.*wlan.*key=clear.*(>|Out-File|\.txt).*/
    pivot_on: host
    window: 4h
  - name: Script interpreters spawning netsh
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*(powershell|cmd|wscript|cscript|mshta)\.exe/ AND data_win_eventdata_image:/.*[Nn]etsh\.exe/
    pivot_on: host
    window: 4h
