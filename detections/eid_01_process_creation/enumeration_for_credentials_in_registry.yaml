name: Enumeration for Credentials in Registry
id: e0b0c2ab-3d52-46d9-8cb7-049dc775fbd1
version: 1
schema_version: "1.0"
date: "2022-12-25"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: e0b0c2ab-3d52-46d9-8cb7-049dc775fbd1
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Adversaries may search the Registry on compromised systems for insecurely
  stored credentials. The Windows Registry stores configuration information that
  can be used by the system or other programs. Adversaries may query the
  Registry looking for credentials and passwords that have been stored for use
  by other programs or services. MITRE ATT&CK: T1552.002.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_image:
              value: "*\\\\reg.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "* query *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*/t *"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*REG_SZ*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*/s*"
              case_insensitive: true
        - bool:
            should:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*/f *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*HKLM*"
                          case_insensitive: true
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*/f *"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_commandLine:
                          value: "*HKCU*"
                          case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*HKCU\\\\Software\\\\SimonTatham\\\\PuTTY\\\\Sessions*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches '*\reg.exe';
  data_win_eventdata_commandLine matches '* query *';
  data_win_eventdata_commandLine matches '*/t *', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1552.002/T1552.002.md
  - https://attack.mitre.org/techniques/T1552/002/

response:
  message: >
    Enumeration for Credentials in Registry detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_commandLine: $data_win_eventdata_commandLine$. MITRE
    ATT&CK: T1552.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_commandLine
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1552.002
  custom_tags:
    - enumeration
    - credentials
    - registry
    - process_creation
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Rr][Ee][Gg]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.* [Qq][Uu][Ee][Rr][Yy] .*/ AND data_win_eventdata_commandLine:/.*\/[Tt] .*/ AND data_win_eventdata_commandLine:/.*[Rr][Ee][Gg]_[Ss][Zz].*/ AND data_win_eventdata_commandLine:/.*\/[Ss].*/ AND ((data_win_eventdata_commandLine:/.*\/[Ff] .*/ AND data_win_eventdata_commandLine:/.*[Hh][Kk][Ll][Mm].*/) OR (data_win_eventdata_commandLine:/.*\/[Ff] .*/ AND data_win_eventdata_commandLine:/.*[Hh][Kk][Cc][Uu].*/) OR data_win_eventdata_commandLine:/.*[Hh][Kk][Cc][Uu]\\[Ss][Oo][Ff][Tt][Ww][Aa][Rr][Ee]\\[Ss][Ii][Mm][Oo][Nn][Tt][Aa][Tt][Hh][Aa][Mm]\\[Pp][Uu][Tt][Tt][Yy]\\[Ss][Ee][Ss][Ss][Ii][Oo][Nn][Ss].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 87a476dc-0079-4583-a985-dee7a20a03de
    name: Enumeration for 3rd Party Creds From CLI
    reason: Targeted queries for third-party app credential keys complement the generic registry password sweep.
  - id: cc1abf27-78a3-4ac5-a51c-f3070b1d8e40
    name: Registry Export of Third-Party Credentials
    reason: Exporting the credential keys follows a successful registry password query.
  - id: fd877b94-9bb5-4191-bb25-d79cbd93c167
    name: Dumping of Sensitive Hives Via Reg.EXE
    reason: Saving SAM/SYSTEM/SECURITY hives is the heavier registry credential theft that follows light enumeration.
  - id: 07f8bdc2-c9b3-472a-9817-5a670b872f53
    name: Potential Reconnaissance For Cached Credentials Via Cmdkey.EXE
    reason: Cmdkey listing of cached credentials is the parallel Windows credential store recon.
  - id: c2b86e67-b880-4eec-b045-50bc98ef4844
    name: HackTool - LaZagne Execution
    reason: LaZagne automates the same registry and file credential search with broader coverage.
  - id: 91a2c315-9ee6-4052-a853-6f6a8238f90d
    name: Findstr GPP Passwords
    reason: Findstr hunting for GPP cpassword is the file-based counterpart of registry password hunting.
  - id: 0f60b28c-64dd-4e2c-9a63-5334d3e3a6e6
    name: Script Interpreter Spawning Credential Scanner - Windows
    reason: Scripted credential scanning shows the sweep is automated by an interpreter.
  - id: 82880171-b475-4201-b811-e9c826cd5eaa
    name: Exports Critical Registry Keys To a File
    reason: Exporting registry keys to a file stages found credentials for collection.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Registry hive save or export
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:(/.*[Rr]eg +(save|export).*/)
    pivot_on: host
    window: 4h
  - name: File and share password sweeps
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:(/.*[Ff]indstr.*(password|cpassword|pwd).*/ OR /.*dir .*(pass|cred|secret).*/ OR /.*[Gg]et-[Cc]hild[Ii]tem.*(pass|cred).*/)
    pivot_on: host
    window: 4h
  - name: Cached credential and vault recon
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:(/.*[Cc]mdkey +\/list.*/ OR /.*[Vv]aultcmd.*/ OR /.*[Kk]eymgr.*/ OR /.*wlan +show +profile.*key=clear.*/)
    pivot_on: host
    window: 4h
  - name: Credential dumping follow-on
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:(/.*[Ll]sass.*/ OR /.*[Mm]imikatz.*/ OR /.*[Ss]ekurlsa.*/ OR /.*[Nn]tdsutil.*/ OR /.*[Ee]sentutl.*/ OR /.*[Pp]rocdump.*/)
    pivot_on: host
    window: 6h
  - name: Reg.exe launched from scripting or LOLBin parents
    query: data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\reg\.exe/ AND data_win_eventdata_parentImage:(/.*\\(wscript|cscript|mshta|rundll32|powershell)\.exe/)
    pivot_on: user
    window: 2h
