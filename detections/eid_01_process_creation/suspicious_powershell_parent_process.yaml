name: Suspicious PowerShell Parent Process
id: 754ed792-634f-40ae-b3bc-e0448d33f695
version: 1
schema_version: "1.0"
date: "2023-02-04"
author: Teymur Kheirkhabarov, Harish Segar
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 754ed792-634f-40ae-b3bc-e0448d33f695
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a suspicious or uncommon parent processes of PowerShell. MITRE ATT&CK:
  T1059.001.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*tomcat*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\amigo.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\browser.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\chrome.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\firefox.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\httpd.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\iexplore.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\jbosssvc.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\microsoftedge.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\microsoftedgecp.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\MicrosoftEdgeSH.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\mshta.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\nginx.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\outlook.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\php-cgi.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\regsvr32.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\rundll32.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\safari.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\services.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\sqlagent.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\sqlserver.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\sqlservr.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\vivaldi.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\w3wp.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\powershell.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\pwsh.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*/c powershell*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*/c pwsh*"
                    case_insensitive: true
              - term:
                  data_win_eventdata_description:
                    value: "Windows PowerShell"
                    case_insensitive: true
              - term:
                  data_win_eventdata_product:
                    value: "PowerShell Core 6"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "PowerShell.EXE"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "pwsh.dll"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_description
    - data_win_eventdata_product
    - data_win_eventdata_originalFileName
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*tomcat*'; data_win_eventdata_parentImage matches '*\amigo.exe';
  data_win_eventdata_parentImage matches '*\browser.exe', among other
  conditions.

known_false_positives: >
  Other scripts. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://speakerdeck.com/heirhabarov/hunting-for-powershell-abuse?slide=26
  - https://attack.mitre.org/techniques/T1059/001/

response:
  message: >
    Suspicious PowerShell Parent Process detected on host $agent_name$. Matched
    data_win_eventdata_parentImage: $data_win_eventdata_parentImage$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1059.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1059.001
  custom_tags:
    - powershell
    - parent
    - process_creation
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

