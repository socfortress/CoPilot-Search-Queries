name: Renamed BrowserCore.EXE Execution
id: 8a4519e8-e64a-40b6-ae85-ba8ad2177559
version: 1
schema_version: "1.0"
date: "2023-02-03"
author: Max Altgelt (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 8a4519e8-e64a-40b6-ae85-ba8ad2177559
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects process creation with a renamed BrowserCore.exe (used to extract Azure
  tokens). MITRE ATT&CK: T1528, T1036.003.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - term:
            data_win_eventdata_originalFileName:
              value: "BrowserCore.exe"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\BrowserCore.exe"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_originalFileName
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_originalFileName equals
  'BrowserCore.exe'; data_win_eventdata_image matches '*\BrowserCore.exe'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/mariuszbit/status/1531631015139102720
  - https://attack.mitre.org/techniques/T1528/
  - https://attack.mitre.org/techniques/T1036/003/

response:
  message: >
    Renamed BrowserCore.EXE Execution detected on host $agent_name$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. MITRE ATT&CK:
    T1528, T1036.003
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_originalFileName
      type: file_name
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1528
    - T1036.003
  custom_tags:
    - renamed
    - browsercore
    - process_creation
    - sysmon
    - credential_access
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_originalFileName:/[Bb][Rr][Oo][Ww][Ss][Ee][Rr][Cc][Oo][Rr][Ee]\.[Ee][Xx][Ee]/ AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/.*\\[Bb][Rr][Oo][Ww][Ss][Ee][Rr][Cc][Oo][Rr][Ee]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: c86500e9-a645-4680-98d7-f882c70c1ea3
    name: AADInternals PowerShell Cmdlets Execution - ProccessCreation
    reason: Azure token/PRT abuse toolkit commonly used alongside BrowserCore token theft.
  - id: 6d3a3952-6530-44a3-8554-cf17c116c615
    name: Potentially Suspicious JWT Token Search Via CLI
    reason: Token hunting on the host precedes or accompanies Azure token extraction.
  - id: 36480ae1-a1cb-4eaa-a0d6-29801d7e9142
    name: Potential Defense Evasion Via Binary Rename
    reason: Generic rename evasion on same host.
  - id: 5c80b618-0dbb-46e6-acbb-03d90bcb6d83
    name: Network Connection Initiated To AzureWebsites.NET By Non-Browser Process
    reason: Stolen token replay or C2 via Azure endpoints from a non-browser process.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Azure token tooling on host
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Rr]oadtx.*/ OR /.*[Rr]oadrecon.*/ OR /.*[Aa][Aa][Dd][Ii]nternals.*/ OR /.*[Gg]et-[Aa]ad[Ii]nt.*/ OR /.*[Mm]imikatz.*/ OR /.*[Aa][Aa][Dd][Jj]oin.*/)
    pivot_on: host
    window: 6h
  - name: LSASS access
    query: data_win_system_eventID:10 AND data_win_eventdata_targetImage:/.*\\[Ll]sass\.exe/
    pivot_on: host
    window: 6h
  - name: Microsoft login DNS from non-browsers
    query: data_win_system_eventID:22 AND data_win_eventdata_queryName:(/.*login\.microsoftonline\.com/ OR /.*login\.windows\.net/ OR /.*graph\.microsoft\.com/) AND NOT data_win_eventdata_image:/.*\\(msedge|chrome|firefox|brave)\.exe/
    pivot_on: host
    window: 6h
  - name: Cloud sign-ins by user
    query: data_office365_Operation:(UserLoggedIn OR UserLoginFailed) AND data_office365_ClientIP:*
    pivot_on: user
    window: 24h
  - name: Mailbox rules and app consent by user
    query: data_office365_Operation:(New-InboxRule OR Set-InboxRule OR "Consent to application" OR "Add service principal.")
    pivot_on: user
    window: 24h
