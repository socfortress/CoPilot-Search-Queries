name: Domain Group Discovery With Wmic
id: a87736a6-95cd-4728-8689-3c64d5026b3e
version: 1
schema_version: "1.0"
date: "2026-04-21"
author: SOCFortress LLC
status: production
type: Hunting

description: >
  This analytic identifies the execution of wmic.exe with the specific
  command-line arguments used to query the WMI LDAP namespace
  (\\root\directory\ldap) for domain group objects (ds_group) and
  retrieve the ds_samaccountname attribute via a GET operation. Sysmon
  EventID 1 is used to match process creation events where the image or
  OriginalFileName is wmic.exe AND the command line contains all three
  indicators: the /NAMESPACE flag pointing to the LDAP WMI namespace,
  "ds_group" object reference, and "GET ds_samaccountname" clause. This
  highly specific pattern indicates deliberate Active Directory group
  enumeration via WMI, a technique used by adversaries for situational
  awareness while avoiding traditional AD query telemetry. If confirmed
  malicious, this behavior could allow attackers to enumerate domain
  groups (particularly privileged groups like Domain Admins, Enterprise
  Admins, Schema Admins) and identify high-value targets for subsequent
  credential theft, Kerberoasting, or lateral movement.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*wmic.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName: "wmic.exe"
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*/NAMESPACE:*root*directory*ldap*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*ds_group*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*GET*ds_samaccountname*"
              case_insensitive: true
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_parentCommandLine
    - data_win_eventdata_user
    - data_win_eventdata_processId
    - data_win_eventdata_processGuid
    - data_win_eventdata_parentProcessId
    - data_win_eventdata_parentProcessGuid
    - data_win_eventdata_hashes
    - data_win_eventdata_integrityLevel
    - data_win_eventdata_currentDirectory

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-21 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-21 23:59:59.999"

how_to_implement: >
  This detection requires Sysmon EventID 1 (Process Creation) logs to be forwarded
  from Windows endpoints to Wazuh Indexer. Ensure Sysmon is deployed with a
  configuration that captures Image, OriginalFileName, and CommandLine fields
  (SwiftOnSecurity or Olaf Hartong Sysmon modular config recommended). The
  detection matches wmic.exe either by Image path (case-insensitive) or by
  PE OriginalFileName, combined with all three required command-line
  indicators (NAMESPACE, ds_group, GET ds_samaccountname). The NAMESPACE
  pattern uses wildcards between path components (root, directory, ldap)
  to handle different backslash escaping between event channels.
  Case-insensitive matching is used throughout. The ES DSL uses
  case_insensitive wildcard option (OpenSearch 2.x / Elasticsearch 7.10+);
  Graylog equivalent uses character classes.

known_false_positives: >
  System administrators or power users may legitimately use this wmic
  query pattern for group membership auditing or troubleshooting, but
  such usage is rare compared to standard tools like dsquery or Get-ADGroup.
  Review parent process lineage, user context (admin vs. non-admin
  account), and timing to distinguish authorized administrative activity
  from reconnaissance. Given the specificity of this command pattern
  (/NAMESPACE:\\root\directory\ldap with ds_group GET ds_samaccountname),
  false positive rate should be very low and any occurrence warrants
  investigation.

references:
  - https://attack.mitre.org/techniques/T1069/002/
  - https://attack.mitre.org/techniques/T1047/
  - https://learn.microsoft.com/en-us/windows/win32/wmisdk/wmic

response:
  message: >
    wmic.exe was used to enumerate domain groups via the WMI LDAP
    namespace on endpoint $agent_name$ by user $data_win_eventdata_user$.
    Process image: $data_win_eventdata_image$. Parent process:
    $data_win_eventdata_parentImage$. Command line:
    $data_win_eventdata_commandLine$. This is a high-confidence indicator
    of Active Directory reconnaissance commonly preceding credential
    theft or lateral movement; investigate immediately and review
    concurrent discovery activity.
  risk_score: 72
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 60
    - field: data_win_eventdata_user
      type: user
      score: 60
  threat_objects:
    - field: data_win_eventdata_image
      type: process_name
    - field: data_win_eventdata_parentImage
      type: parent_process_name
    - field: data_win_eventdata_commandLine
      type: command_line

tags:
  analytic_story:
    - Active Directory Discovery
    - Active Directory Reconnaissance
  asset_type: Endpoint
  mitre_attack_id:
    - T1069.002
    - T1047
  custom_tags:
    - wmic
    - wmi
    - ad_enumeration
    - active_directory
    - reconnaissance
    - domain_group_discovery
    - lolbin
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Ww][Mm][Ii][Cc]\.exe.*/ OR data_win_eventdata_originalFileName:"wmic.exe") AND data_win_eventdata_commandLine:/.*\/[Nn][Aa][Mm][Ee][Ss][Pp][Aa][Cc][Ee]:.*[Rr][Oo][Oo][Tt].*[Dd][Ii][Rr][Ee][Cc][Tt][Oo][Rr][Yy].*[Ll][Dd][Aa][Pp].*/ AND data_win_eventdata_commandLine:/.*[Dd][Ss]_[Gg][Rr][Oo][Uu][Pp].*/ AND data_win_eventdata_commandLine:/.*[Gg][Ee][Tt].*[Dd][Ss]_[Ss][Aa][Mm][Aa][Cc][Cc][Oo][Uu][Nn][Tt][Nn][Aa][Mm][Ee].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: f0c9d62f-a232-4edd-b17e-bc409fb133d4
    name: Domain Group Discovery With Dsquery
    reason: Same group enumeration via dsquery instead of WMI
  - id: 383572e0-04c5-11ec-bdcc-acde48001122
    name: Domain Account Discovery with Wmic
    reason: Same WMI ds_ namespace used for user enumeration after group/DC mapping
  - id: 3f6bbf22-093e-4cb4-9641-83f47b8444b6
    name: Elevated Group Discovery With Wmic
    reason: Targeted privileged-group lookup, the natural next step after listing groups
  - id: 5434f670-155d-11ec-8cca-acde48001122
    name: Get WMIObject Group Discovery
    reason: PowerShell variant of WMI group enumeration
  - id: 93c94be3-bead-4a60-860f-77ca3fe59903
    name: GetDomainGroup with PowerShell
    reason: PowerView-style group enumeration, same objective
  - id: 64c7adaa-48ee-483c-b0d6-7175bc65e6cc
    name: Domain Controller Discovery with Wmic
    reason: DC address lookup that typically precedes group/trust queries
  - id: 4902d7aa-0134-11ec-9d65-acde48001122
    name: Local Account Discovery With Wmic
    reason: Same wmic tool used for account recon on the host
  - id: f376c8a7-a2d0-4ddc-aa0c-16c17236d962
    name: HackTool - Bloodhound/Sharphound Execution
    reason: Manual LOLBin discovery is often followed or replaced by BloodHound collection to map attack paths
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: WMI LDAP namespace (ds_*) queries
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Rr]oot.*[Dd]irectory.*[Ll][Dd][Aa][Pp].*/ OR /.*[Dd][Ss]_[Gg][Rr][Oo][Uu][Pp].*/ OR /.*[Dd][Ss]_[Uu][Ss][Ee][Rr].*/ OR /.*[Dd][Ss]_[Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr].*/ OR /.*[Dd][Ss]_[Dd][Cc].*/)
    pivot_on: host
    window: 2h
  - name: Other AD discovery tooling on host
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Nn][Ll][Tt][Ee][Ss][Tt].*/ OR /.*[Dd][Ss][Qq][Uu][Ee][Rr][Yy].*/ OR /.*[Aa][Dd][Ff][Ii][Nn][Dd].*/ OR /.*[Gg]et-[Aa][Dd].*/ OR /.*[Gg]et-[Dd]omain.*/)
    pivot_on: host
    window: 2h
  - name: Shell/script parents launching discovery tools
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:(/.*[Cc][Mm][Dd]\.exe/ OR /.*[Pp]ower[Ss]hell.*/ OR /.*[Ww][Ss][Cc][Rr][Ii][Pp][Tt]\.exe/ OR /.*[Cc][Ss][Cc][Rr][Ii][Pp][Tt]\.exe/ OR /.*[Mm][Ss][Hh][Tt][Aa]\.exe/)
    pivot_on: host
    window: 1h
  - name: LDAP/Kerberos/SMB connections to domain controllers
    query: data_win_system_eventID:3 AND data_win_eventdata_destinationPort:(389 OR 636 OR 3268 OR 88 OR 445)
    pivot_on: host
    window: 2h
  - name: Credential-theft tooling after discovery
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(/.*[Kk]erberoast.*/ OR /.*[Rr]ubeus.*/ OR /.*[Mm]imikatz.*/ OR /.*[Ss]ekurlsa.*/ OR /.*[Dd][Cc][Ss]ync.*/ OR /.*[Ll]sadump.*/)
    pivot_on: host
    window: 6h
