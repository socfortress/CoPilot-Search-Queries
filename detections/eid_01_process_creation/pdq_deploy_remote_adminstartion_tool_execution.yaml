name: PDQ Deploy Remote Adminstartion Tool Execution
id: d679950c-abb7-43a6-80fb-2a480c4fc450
version: 1
schema_version: "1.0"
date: "2023-01-30"
author: frack113
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: d679950c-abb7-43a6-80fb-2a480c4fc450
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detect use of PDQ Deploy remote admin tool. MITRE ATT&CK: T1072.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - term:
                  data_win_eventdata_description:
                    value: "PDQ Deploy Console"
                    case_insensitive: true
              - term:
                  data_win_eventdata_product:
                    value: "PDQ Deploy"
                    case_insensitive: true
              - term:
                  data_win_eventdata_company:
                    value: "PDQ.com"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "PDQDeployConsole.exe"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_description
    - data_win_eventdata_product
    - data_win_eventdata_company
    - data_win_eventdata_originalFileName
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_description equals 'PDQ
  Deploy Console'; data_win_eventdata_product equals 'PDQ Deploy';
  data_win_eventdata_company equals 'PDQ.com', among other conditions.

known_false_positives: >
  Legitimate use. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/redcanaryco/atomic-red-team/blob/9e5b12c4912c07562aec7500447b11fa3e17e254/atomics/T1072/T1072.md
  - https://www.pdq.com/pdq-deploy/
  - https://attack.mitre.org/techniques/T1072/

response:
  message: >
    PDQ Deploy Remote Adminstartion Tool Execution detected on host
    $agent_name$. Matched data_win_eventdata_description:
    $data_win_eventdata_description$. Matched data_win_eventdata_product:
    $data_win_eventdata_product$. MITRE ATT&CK: T1072
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_description
      type: other
    - field: data_win_eventdata_product
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1072
  custom_tags:
    - deploy
    - adminstartion
    - process_creation
    - sysmon
    - execution
    - lateral_movement
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_description:/[Pp][Dd][Qq] [Dd][Ee][Pp][Ll][Oo][Yy] [Cc][Oo][Nn][Ss][Oo][Ll][Ee]/ OR data_win_eventdata_product:/[Pp][Dd][Qq] [Dd][Ee][Pp][Ll][Oo][Yy]/ OR data_win_eventdata_company:/[Pp][Dd][Qq]\.[Cc][Oo][Mm]/ OR data_win_eventdata_originalFileName:/[Pp][Dd][Qq][Dd][Ee][Pp][Ll][Oo][Yy][Cc][Oo][Nn][Ss][Oo][Ll][Ee]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 12b8e9f5-96b2-41e1-9a42-8c6779a5c184
    name: Potentially Suspicious Execution Of PDQDeployRunner
    reason: Runner child processes show what PDQ actually pushed to endpoints.
  - id: ea011323-7045-460b-b2d7-0f7442ea6b38
    name: Potential PsExec Remote Execution
    reason: Attackers pair PDQ with PsExec for mass remote execution.
  - id: fdfcbd78-48f1-4a4b-90ac-d82241e368c5
    name: PsExec Service Execution
    reason: Alternative remote-exec channel on the same targets.
  - id: 79a87aa6-e4bd-42fc-a5bb-5e6fbdcd62f5
    name: Msiexec Quiet Installation
    reason: PDQ packages are usually silent MSI installs.
  - id: 87261fb2-69d0-42fe-b9de-88c6b5f65a43
    name: Atera Agent Installation
    reason: RMM agents are a frequent PDQ-delivered payload.
  - id: a7ee1722-c3c5-aeff-3212-c777e4733217
    name: Disable Windows Defender AV Security Monitoring
    reason: Ransomware staging disables AV before mass deployment.
  - id: 855bc8b5-2ae8-402e-a9ed-b889e6df1900
    name: Copy From Or To Admin Share Or Sysvol Folder
    reason: Payload staging to admin shares complements PDQ pushes.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: PDQ components and child processes
    query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*(\\[Pp][Dd][Qq][Dd][Ee][Pp][Ll][Oo][Yy]|\\[Pp][Dd][Qq]).*/ OR data_win_eventdata_image:/.*(\\[Pp][Dd][Qq][Dd][Ee][Pp][Ll][Oo][Yy]|\\[Pp][Dd][Qq]).*/)
    pivot_on: host
    window: 6h
  - name: Silent installs or script execution
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*(\\[Mm][Ss][Ii][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]|\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]).*/) AND data_win_eventdata_commandLine:/.*(\/[Qq][Nn]|\/[Qq][Uu][Ii][Ee][Tt]|\-[Ee][Xx][Ee][Cc][Uu][Tt][Ii][Oo][Nn][Pp][Oo][Ll][Ii][Cc][Yy] [Bb][Yy][Pp][Aa][Ss][Ss]|\-[Ee][Nn][Cc]|\.[Bb][Aa][Tt]|\.[Pp][Ss]1).*/
    pivot_on: host
    window: 6h
  - name: Defender or backup tampering
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Ss][Ee][Tt]\-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee]|[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee][Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg]|[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn] [Dd][Ee][Ll][Ee][Tt][Ee]|[Ww][Bb][Aa][Dd][Mm][Ii][Nn] [Dd][Ee][Ll][Ee][Tt][Ee]|[Bb][Cc][Dd][Ee][Dd][Ii][Tt]).*/
    pivot_on: host
    window: 6h
  - name: New services installed (PDQ runner, PsExec)
    query: data_win_system_eventID:"7045"
    pivot_on: host
    window: 6h
  - name: Inbound SMB connections to host
    query: data_win_system_eventID:"3" AND data_win_eventdata_destinationPort:"445"
    pivot_on: host
    window: 2h
