name: Potential Raspberry Robin CPL Execution Activity
id: 92020b88-9caf-464f-bad8-cd0fb0aa2a81
version: 1
schema_version: "1.0"
date: "2024-03-07"
author: Swachchhanda Shrawan Poudel
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 92020b88-9caf-464f-bad8-cd0fb0aa2a81
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the execution of a ".CPL" file located in the user temp directory via
  the Shell32 DLL "Control_RunDLL" export function. This behavior was observed
  in multiple Raspberry-Robin variants. MITRE ATT&CK: T1218.011.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\rundll32.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_parentImage:
                    value: "*\\\\control.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\rundll32.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "RUNDLL32.EXE"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*shell32.dll*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*Control_RunDLL*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*.CPL*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*\\\\AppData\\\\Local\\\\Temp\\\\*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\rundll32.exe'; data_win_eventdata_parentImage matches '*\control.exe';
  data_win_eventdata_image matches '*\rundll32.exe', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://tria.ge/240226-fhbe7sdc39/behavioral1
  - https://bazaar.abuse.ch/browse/signature/RaspberryRobin/
  - https://attack.mitre.org/techniques/T1218/011/

response:
  message: >
    Potential Raspberry Robin CPL Execution Activity detected on host
    $agent_name$. Matched data_win_eventdata_parentImage:
    $data_win_eventdata_parentImage$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$. MITRE ATT&CK: T1218.011
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218.011
  custom_tags:
    - raspberry
    - robin
    - process_creation
    - sysmon
    - execution
    - stealth
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_parentImage:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Cc][Oo][Nn][Tt][Rr][Oo][Ll]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_image:/.*\\[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Rr][Uu][Nn][Dd][Ll][Ll]32\.[Ee][Xx][Ee]/) AND data_win_eventdata_commandLine:/.*[Ss][Hh][Ee][Ll][Ll]32\.[Dd][Ll][Ll].*/ AND data_win_eventdata_commandLine:/.*[Cc][Oo][Nn][Tt][Rr][Oo][Ll]_[Rr][Uu][Nn][Dd][Ll][Ll].*/ AND data_win_eventdata_commandLine:/.*\.[Cc][Pp][Ll].*/ AND data_win_eventdata_commandLine:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 2c6bea3a-ef58-4f2e-a775-4928f6b7c58a
    name: Raspberry Robin Initial Execution From External Drive
    reason: Raspberry Robin initial execution from a removable drive via LNK/cmd, the usual precursor of the CPL load.
  - id: a35c97c8-d9c4-4c89-a3e7-533dc0bcb73a
    name: Potential Raspberry Robin Dot Ending File
    reason: Raspberry Robin dot-ending file trick, the same worm's dropped-file artefact.
  - id: d52d2e87-eb03-4fac-961d-eb616da79788
    name: Raspberry Robin Subsequent Execution of Commands
    reason: Raspberry Robin subsequent command execution, the follow-on once the payload runs.
  - id: 0f3a9db2-c17a-480e-a723-d1f1c547ab6a
    name: Potential Raspberry Robin Aclui Dll SideLoading
    reason: Raspberry Robin aclui.dll sideloading, another post-compromise stage of the same family.
  - id: e593cf51-88db-4ee1-b920-37e89012a3c9
    name: Potentially Suspicious Rundll32 Activity
    reason: Suspicious rundll32 activity on the same host; broadens the proxy-execution picture.
  - id: 2569ed8c-1147-498a-9b8c-2ad3656b10ed
    name: Potential Renamed Rundll32 Execution
    reason: Renamed rundll32 evasion often used alongside Control_RunDLL loads.
  - id: 5cdb711b-5740-4fb2-ba88-f7945027afac
    name: Rundll32 UNC Path Execution
    reason: rundll32 UNC path execution, a related remote payload load.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Removable-drive LNK/cmd launch (worm entry)
    query: data_win_system_eventID:1 AND data_win_eventdata_image:*cmd.exe AND data_win_eventdata_commandLine:*.lnk* AND data_win_eventdata_commandLine:(*msiexec* OR *rundll32* OR *[Ee]xplorer*)
    pivot_on: host
    window: 4h
  - name: msiexec fetching remote package
    query: data_win_system_eventID:1 AND data_win_eventdata_image:*[Mm]siexec.exe AND data_win_eventdata_commandLine:*http* AND data_win_eventdata_commandLine:(*[Qq]n* OR *-q* OR */q*)
    pivot_on: host
    window: 4h
  - name: CPL or DLL dropped in Temp
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(*.[Cc][Pp][Ll] OR *.[Dd][Ll][Ll] OR *.[Dd][Aa][Tt]) AND data_win_eventdata_targetFilename:*Temp*
    pivot_on: host
    window: 2h
  - name: Raspberry Robin follow-on LOLBins
    query: data_win_system_eventID:1 AND data_win_eventdata_image:(*[Ff]odhelper.exe OR *[Oo]dbcconf.exe OR *[Dd]llhost.exe OR *[Rr]egsvr32.exe OR *[Cc]ontrol.exe)
    pivot_on: host
    window: 4h
  - name: Outbound connections by rundll32/msiexec (Tor/C2)
    query: data_win_system_eventID:3 AND data_win_eventdata_image:(*[Rr]undll32.exe OR *[Mm]siexec.exe OR *[Dd]llhost.exe OR *[Ff]odhelper.exe) AND data_win_eventdata_initiated:true
    pivot_on: host
    window: 4h
