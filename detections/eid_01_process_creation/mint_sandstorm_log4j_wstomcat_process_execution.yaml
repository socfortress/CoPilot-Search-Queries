name: Mint Sandstorm - Log4J Wstomcat Process Execution
id: 7c97c625-0350-4f0a-8943-f6cadc88125e
version: 1
schema_version: "1.0"
date: "2023-11-29"
author: Nasreddine Bencherchali (Nextron Systems), MSTIC (idea)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 7c97c625-0350-4f0a-8943-f6cadc88125e
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects Log4J Wstomcat process execution as seen in Mint Sandstorm activity.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - wildcard:
            data_win_eventdata_parentImage:
              value: "*\\\\ws_tomcatservice.exe"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_image"
        - bool:
            must_not:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\repadmin.exe"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_parentImage
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_parentImage matches
  '*\ws_tomcatservice.exe'; data_win_eventdata_image matches '*\repadmin.exe'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.microsoft.com/en-us/security/blog/2023/04/18/nation-state-threat-actor-mint-sandstorm-refines-tradecraft-to-attack-high-value-targets/

response:
  message: >
    Mint Sandstorm - Log4J Wstomcat Process Execution detected on host
    $agent_name$. Matched data_win_eventdata_parentImage:
    $data_win_eventdata_parentImage$. Matched data_win_eventdata_image:
    $data_win_eventdata_image$.
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_parentImage
      type: process
    - field: data_win_eventdata_image
      type: process

tags:
  asset_type: Endpoint
  custom_tags:
    - sandstorm
    - log4j
    - wstomcat
    - process_creation
    - sysmon
    - execution
    - emerging_threats
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ww][Ss]_[Tt][Oo][Mm][Cc][Aa][Tt][Ss][Ee][Rr][Vv][Ii][Cc][Ee]\.[Ee][Xx][Ee]/ AND _exists_:data_win_eventdata_image AND NOT (data_win_eventdata_image:/.*\\[Rr][Ee][Pp][Aa][Dd][Mm][Ii][Nn]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 3eb91f0a-0060-424a-a676-59f5fdd75610
    name: Potential CVE-2021-44228 Exploitation Attempt - VMware Horizon
    reason: Same Log4Shell RCE class (Java parent spawning shells); confirms the exploited Log4j vector on other Java apps.
  - id: dcfd6b40-42f9-469d-a433-2e53f7486664
    name: Detect Prohibited Applications Spawning cmd exe
    reason: A server app process spawning cmd is the generic form of this rule's ws_tomcatservice child execution.
  - id: 4ebc877f-4612-45cb-b3a5-8e3834db36c9
    name: Webshell Hacking Activity Patterns
    reason: After Log4j RCE on Tomcat actors recon and drop webshells with these command patterns.
  - id: 19b08b1c-861d-4e75-a1ef-ea0c1baf202b
    name: Suspicious Download Via Certutil.EXE
    reason: Post-RCE stage-2 retrieval via certutil is common in Mint Sandstorm Log4j intrusions.
  - id: 17769c90-230e-488b-a463-e05c08e9d48f
    name: Powershell Defender Exclusion
    reason: Defender exclusions are applied after the RCE foothold to protect dropped tooling.
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: Credential theft is the typical next step after exploiting the server.
  - id: ad720b90-25ad-43ff-9b5e-5c841facc8e5
    name: User Added to Local Administrators Group
    reason: Persistence via local admin account creation commonly follows.
  window: 6h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: All children of ws_tomcatservice
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Ww][Ss]_[Tt][Oo][Mm][Cc][Aa][Tt][Ss][Ee][Rr][Vv][Ii][Cc][Ee]\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 6h
  - name: Java processes spawning shells
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Jj][Aa][Vv][Aa][Ww]?\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*\\([Cc][Mm][Dd]|[Pp]ower[Ss]hell)\.[Ee][Xx][Ee]/
    pivot_on: host
    window: 6h
  - name: Tomcat webapp file drops
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*([Tt]omcat|[Ww]ebapps).*\.(jsp|jspx|war|class)/
    pivot_on: host
    window: 6h
  - name: Download and recon after RCE
    query: data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*([Dd]ownload([Ff]ile|[Ss]tring)|[Cc]ertutil.*urlcache|[Ww]hoami|[Nn]et +(user|group)|[Nn]ltest).*/
    pivot_on: host
    window: 4h
