name: Potential Cookies Session Hijacking
id: 5a6e1e16-07de-48d8-8aae-faa766c05e88
version: 1
schema_version: "1.0"
date: "2023-07-27"
author: Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 5a6e1e16-07de-48d8-8aae-faa766c05e88
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects execution of "curl.exe" with the "-c" flag in order to save cookie
  data.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\curl.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "curl.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - regexp:
                  data_win_eventdata_commandLine: ".*([ ]-c[ ]).*"
              - wildcard:
                  data_win_eventdata_commandLine:
                    value: "*--cookie-jar*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\curl.exe'; data_win_eventdata_originalFileName equals 'curl.exe';
  data_win_eventdata_commandLine matches the regex /.*([ ]-c[ ]).*/, among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://curl.se/docs/manpage.html

response:
  message: >
    Potential Cookies Session Hijacking detected on host $agent_name$. Matched
    data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  custom_tags:
    - cookies
    - session
    - hijacking
    - process_creation
    - sysmon
    - execution
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Cc][Uu][Rr][Ll]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_commandLine:/.*([ ]-c[ ]).*/ OR data_win_eventdata_commandLine:/.*--[Cc][Oo][Oo][Kk][Ii][Ee]-[Jj][Aa][Rr].*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 47147b5b-9e17-4d76-b8d2-7bac24c5ce1b
    name: Potential Browser Data Stealing
    reason: Direct access to browser cookie/login stores is the usual source of the cookies later replayed with curl
  - id: 6a69f62d-ce75-4b57-8dce-6351eb55b362
    name: Esentutl Steals Browser Information
    reason: Another LOLBin method to copy browser databases holding session cookies
  - id: 3e8207c5-fcd2-4ea6-9418-15d45b4890e4
    name: Potential Data Stealing Via Chromium Headless Debugging
    reason: Headless debugging is a cookie-extraction path preceding or substituting for curl replay
  - id: b3d34dc5-2efd-4ae3-845f-8ec14921f449
    name: Browser Started with Remote Debugging
    reason: Remote debugging port lets attacker dump live session cookies
  - id: 8ba484e8-4b97-11ec-b19a-acde48001122
    name: Possible Browser Pass View Parameter
    reason: Browser credential-viewer tools harvest the same stored web credentials
  - id: d0dae994-26c6-4d2d-83b5-b3c8b79ae513
    name: PUA - WebBrowserPassView Execution
    reason: Credential recovery tool commonly paired with cookie theft
  - id: e328cc73-f92a-42fb-b3fa-7c2cffda981a
    name: Curl File Upload To File Sharing Websites
    reason: Stolen browser data is often uploaded with curl afterwards
  - id: cb9cc1d1-e84e-4bdc-b7ad-c31b1b7908ec
    name: Insecure Transfer Via Curl.EXE
    reason: Same curl binary used for cleartext transfer of harvested data
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Browser cookie/login DB access commands
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(*Cookies* OR *cookies.sqlite* OR *Web\ Data*)
    pivot_on: host
    window: 4h
  - name: Browser remote debugging launch
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(*remote-debugging-port* OR *--headless*)
    pivot_on: host
    window: 4h
  - name: Curl executions with uploads or cookie args
    query: data_win_system_eventID:1 AND data_win_eventdata_image:/.*\\curl\.exe/ AND data_win_eventdata_commandLine:(*--cookie* OR *-F* OR *-T* OR *--data*)
    pivot_on: host
    window: 4h
  - name: Browser profile cookie files written or copied
    query: data_win_system_eventID:11 AND data_win_eventdata_targetFilename:(*Cookies* OR *cookies.sqlite*)
    pivot_on: host
    window: 4h
  - name: Curl network connections
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*\\curl\.exe/
    pivot_on: host
    window: 4h
