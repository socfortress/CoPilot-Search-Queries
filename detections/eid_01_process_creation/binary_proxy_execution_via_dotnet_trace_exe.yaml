name: Binary Proxy Execution Via Dotnet-Trace.EXE
id: 9257c05b-4a4a-48e5-a670-b7b073cf401b
version: 1
schema_version: "1.0"
date: "2024-01-02"
author: Jimmy Bayne (@bohops)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 9257c05b-4a4a-48e5-a670-b7b073cf401b
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects commandline arguments for executing a child process via
  dotnet-trace.exe. MITRE ATT&CK: T1218.

data_source:
  - Sysmon EventID 1 - Process Creation

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_image:
                    value: "*\\\\dotnet-trace.exe"
                    case_insensitive: true
              - term:
                  data_win_eventdata_originalFileName:
                    value: "dotnet-trace.dll"
                    case_insensitive: true
            minimum_should_match: 1
        - wildcard:
            data_win_eventdata_commandLine: "*-- *"
        - wildcard:
            data_win_eventdata_commandLine:
              value: "*collect*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_image
    - data_win_eventdata_originalFileName
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 1 (process creation) collected from the
  Microsoft-Windows-Sysmon/Operational channel by the Wazuh agent (eventchannel
  localfile entry in ossec.conf) and ingested into the wazuh-* indices. The
  detection looks for events where data_win_eventdata_image matches
  '*\dotnet-trace.exe'; data_win_eventdata_originalFileName equals
  'dotnet-trace.dll'; data_win_eventdata_commandLine matches '*-- *', among
  other conditions.

known_false_positives: >
  Legitimate usage of the utility in order to debug and trace a program.
  Baseline expected activity in your environment and tune this detection before
  relying on it for automated response.

references:
  - https://twitter.com/bohops/status/1740022869198037480
  - https://attack.mitre.org/techniques/T1218/

response:
  message: >
    Binary Proxy Execution Via Dotnet-Trace.EXE detected on host $agent_name$.
    Matched data_win_eventdata_image: $data_win_eventdata_image$. Matched
    data_win_eventdata_originalFileName: $data_win_eventdata_originalFileName$.
    MITRE ATT&CK: T1218
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_image
      type: process
    - field: data_win_eventdata_originalFileName
      type: file_name

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218
  custom_tags:
    - binary
    - proxy
    - dotnet
    - process_creation
    - sysmon
    - execution
    - stealth
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Dd][Oo][Tt][Nn][Ee][Tt]-[Tt][Rr][Aa][Cc][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_originalFileName:/[Dd][Oo][Tt][Nn][Ee][Tt]-[Tt][Rr][Aa][Cc][Ee]\.[Dd][Ll][Ll]/) AND data_win_eventdata_commandLine:/.*-- .*/ AND data_win_eventdata_commandLine:/.*[Cc][Oo][Ll][Ll][Ee][Cc][Tt].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d80d5c81-04ba-45b4-84e4-92eba40e0ad3
    name: Arbitrary DLL or Csproj Code Execution Via Dotnet.EXE
    reason: Sibling .NET host LOLBin (dotnet.exe) used to run arbitrary DLL/csproj code; same proxy-execution intent.
  - id: 53d8d3e1-ca33-4012-adf3-e05a4d652e34
    name: Process Memory Dump Via Dotnet-Dump
    reason: dotnet-dump from the same diagnostic toolset; attacker may follow with process memory dumping.
  - id: 148431ce-4b70-403d-8525-fcc2993f29ea
    name: Potential DLL Injection Or Execution Using Tracker.exe
    reason: Tracker.exe is another developer-tool LOLBin used to launch/inject a payload via signed binary.
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Child processes of dotnet-trace
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*[Dd]otnet-[Tt]race.*/
    pivot_on: host
    window: 1h
  - name: Other .NET host LOLBins
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Dd]otnet\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Dd]otnet-[Dd]ump.*/ OR data_win_eventdata_image:/.*[Dd]otnet-[Gg]cdump.*/) AND (data_win_eventdata_commandLine:/.*\.[Dd][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*\.[Cc][Ss][Pp][Rr][Oo][Jj].*/ OR data_win_eventdata_commandLine:/.*[Cc]ollect.*/)
    pivot_on: host
    window: 2h
  - name: Shells and script engines spawned by dev tools
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*[Pp]ower[Ss]hell.*/ OR data_win_eventdata_image:/.*[Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*[Mm]shta.*/) AND data_win_eventdata_parentImage:/.*[Dd]otnet.*/
    pivot_on: host
    window: 2h
  - name: Dropped binaries/scripts in user paths
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.([Ee][Xx][Ee]|[Dd][Ll][Ll]|[Pp][Ss]1|[Nn][Ee][Tt][Tt][Rr][Aa][Cc][Ee])/ AND (data_win_eventdata_targetFilename:/.*[Tt]emp.*/ OR data_win_eventdata_targetFilename:/.*[Uu]sers.*/)
    pivot_on: host
    window: 2h
