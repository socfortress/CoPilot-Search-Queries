name: Windows HTTP Network Communication From MSIExec
id: b0fd38c7-f71a-43a2-870e-f3ca06bcdd99
version: 1
schema_version: "1.0"
date: "2026-04-08"
author: SOCFortress LLC
status: production
type: Anomaly

description: >
  The following analytic detects MSIExec making HTTP or HTTPS network connections, typically over ports 80 or 443.
  This behavior is identified by monitoring process creation events where MSIExec is launched with suspicious command-line
  arguments containing URLs (http:// or https://). MSIExec is typically used for legitimate Windows Installer operations
  and does not normally perform direct network communication to the internet. This activity is unusual and potentially
  indicative of malicious behavior such as remote package installation, malware deployment, command and control (C2)
  communication, or data exfiltration. If confirmed malicious, an attacker could be using MSIExec to download malicious
  packages, communicate with external servers, or establish persistence on the target system.

data_source:
  - Sysmon EventID 1

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "1"
        - wildcard:
            data_win_eventdata_image: "*msiexec.exe"
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_commandLine: "*http://*"
              - wildcard:
                  data_win_eventdata_commandLine: "*https://*"
            minimum_should_match: 1
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - data_win_eventdata_image
    - data_win_eventdata_commandLine
    - data_win_eventdata_parentImage
    - data_win_eventdata_user
    - data_win_eventdata_processId
    - agent_name

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "YYYY-MM-DD 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "YYYY-MM-DD 23:59:59.999"

how_to_implement: >
  To successfully implement this search, you need to be ingesting logs with process creation data from your endpoints.
  Sysmon EventID 1 captures process creation events. Ensure that Sysmon is configured to capture the full command line
  arguments when MSIExec is executed. The detection specifically monitors for MSIExec process execution with HTTP or
  HTTPS URLs in the command line, which is a strong indicator of suspicious behavior. Monitor command-line arguments
  for /i (install package) or /a (administrative install) flags combined with remote URLs.

known_false_positives: >
  Legitimate administrative use of MSIExec to install packages from internal package repositories or configuration
  management systems may trigger this detection. Organizations using MSIExec for software distribution with HTTP/HTTPS
  URLs should baseline expected behavior. Filter on trusted internal URLs and administrative user accounts as needed.

references:
  - https://thedfirreport.com/2022/06/06/will-the-real-msiexec-please-stand-up-exploit-leads-to-data-exfiltration/
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1218.007/T1218.007.md
  - https://lolbas-project.github.io/lolbas/Binaries/Msiexec/

response:
  message: >
    MSIExec process detected performing network communication on $agent_name$ from user $data_win_eventdata_user$.
    CommandLine: $data_win_eventdata_commandLine$. Parent Process: $data_win_eventdata_parentImage$.
    This activity is suspicious and may indicate malware deployment or C2 communication.
  risk_score: 80
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 80
    - field: data_win_eventdata_user
      type: user
      score: 40
  threat_objects:
    - field: data_win_eventdata_commandLine
      type: command_line
    - field: data_win_eventdata_parentImage
      type: parent_process

tags:
  analytic_story:
    - APT37 Rustonotto and FadeStealer
    - Windows System Binary Proxy Execution MSIExec
    - SolarWinds WHD RCE Post Exploitation
    - Malicious Software Distribution
  asset_type: Endpoint
  mitre_attack_id:
    - T1218.007
  custom_tags:
    - msiexec
    - network_communication
    - http_https
    - signed_binary_proxy_execution
    - malware_deployment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"1" AND data_win_eventdata_image:"C:\\\\Windows\\\\System32\\\\msiexec.exe" AND data_win_eventdata_commandLine:/.*https.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: f7b5f842-a6af-4da5-9e95-e32478f3cd2f
    name: MsiExec Web Install
    reason: 'Same behaviour from the installer side: msiexec fetching a remote MSI; corroborates the URL install.'
  - id: 8150732a-0c9d-4a99-82b9-9efb9b90c40c
    name: Suspicious Msiexec Quiet Install From Remote Location
    reason: Quiet (/q) install from a URL suggests unattended payload delivery rather than a user-driven installer.
  - id: 6f4191bb-912b-48a8-9ce7-682769541e6d
    name: Suspicious Msiexec Execute Arbitrary DLL
    reason: Msiexec /y or /z DLL registration is the proxy-execution follow-on once a remote payload is on disk.
  - id: 4a2a2c3e-209f-4d01-b513-4155a540b469
    name: Suspicious MsiExec Embedding Parent
    reason: Msiexec -Embedding children show the downloaded package's custom actions spawning processes.
  - id: 1e53dd56-8d83-4eb4-a43e-b790a05510aa
    name: Always Install Elevated MSI Spawned Cmd And Powershell
    reason: A fetched MSI running as SYSTEM and spawning shells is the escalation outcome of a malicious install.
  - id: 5594e67a-7f92-4a04-b65d-1a42fd824a60
    name: MSI Installation From Web
    reason: Application-log confirmation that an MSI was actually installed from a web source.
  - id: c7c8aa1c-5aff-408e-828b-998e3620b341
    name: MSI Installation From Suspicious Locations
    reason: Shows whether the package landed in a temp or user-writable path before install.
  - id: e22a6eb2-f8a5-44b5-8b44-a2dbd47b1144
    name: Potential MsiExec Masquerading
    reason: A renamed or relocated msiexec would explain a URL-fetching installer evading name-based controls.
  window: 4h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Msiexec child processes
    query: data_win_system_eventID:1 AND data_win_eventdata_parentImage:/.*[Mm]siexec\.exe/ AND data_win_eventdata_image:(/.*[Cc]md\.exe/ OR /.*[Pp]ower[Ss]hell\.exe/ OR /.*[Pp]wsh\.exe/ OR /.*[Ww]script\.exe/ OR /.*[Rr]undll32\.exe/ OR /.*[Rr]egsvr32\.exe/)
    pivot_on: host
    window: 2h
  - name: Msiexec outbound network connections
    query: data_win_system_eventID:3 AND data_win_eventdata_image:/.*[Mm]siexec\.exe/ AND data_win_eventdata_initiated:true
    pivot_on: host
    window: 2h
  - name: DNS lookups by msiexec
    query: data_win_system_eventID:22 AND data_win_eventdata_image:/.*[Mm]siexec\.exe/
    pivot_on: host
    window: 2h
  - name: Executables and DLLs dropped by msiexec
    query: data_win_system_eventID:11 AND data_win_eventdata_image:/.*[Mm]siexec\.exe/ AND data_win_eventdata_targetFilename:(/.*\.[Dd][Ll][Ll]/ OR /.*\.[Ee][Xx][Ee]/ OR /.*\.[Mm][Ss][Ii]/)
    pivot_on: host
    window: 2h
  - name: Other remote-fetch utilities on the host
    query: data_win_system_eventID:1 AND data_win_eventdata_commandLine:(*http\:\/\/* OR *https\:\/\/*) AND data_win_eventdata_image:(/.*[Cc]url\.exe/ OR /.*[Cc]ertutil\.exe/ OR /.*[Bb]itsadmin\.exe/ OR /.*[Mm]shta\.exe/ OR /.*[Pp]ower[Ss]hell\.exe/)
    pivot_on: host
    window: 4h
