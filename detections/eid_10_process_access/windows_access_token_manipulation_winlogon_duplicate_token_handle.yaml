name: Windows Access Token Manipulation Winlogon Duplicate Token Handle
id: windows-access-token-winlogon-duplicate-handle-001
version: 1
schema_version: "1.0"
date: "2026-03-03"
author: SOCFortress LLC
status: production
type: Hunting

description: >
  Detects a process attempting to access winlogon.exe to duplicate its token 
  handle (GrantedAccess 0x1040). Winlogon.exe runs with SYSTEM privileges and 
  holds high-privilege security tokens. Brute Ratel C4 and other tools 
  duplicate the winlogon token to escalate privileges.

data_source:
  - Sysmon EventID 10

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "10"
        - wildcard:
            data_win_eventdata_targetImage: "*\\winlogon.exe*"
        - term:
            data_win_eventdata_grantedAccess: "0x1040"
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_sourceImage
    - data_win_eventdata_targetImage
    - data_win_eventdata_grantedAccess
    - data_win_eventdata_sourceProcessGUID
    - data_win_eventdata_targetProcessGUID

parameters:
  AGENT_NAME:
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    type: string
    required: true
    example: "lab"
  START_TIME:
    type: datetime
    default: "now-24h"
  END_TIME:
    type: datetime
    default: "now"

how_to_implement: >
  Requires Sysmon EventID 10 (ProcessAccess) configured to capture access 
  to winlogon.exe. Default Sysmon configs often exclude system processes 
  as targets — ensure winlogon.exe is not excluded in TargetImage rules.

known_false_positives: >
  Some legitimate applications may access winlogon.exe. Filter known 
  legitimate source processes.

references:
  - https://docs.microsoft.com/en-us/windows/win32/api/handleapi/nf-handleapi-duplicatehandle
  - https://attack.mitre.org/techniques/T1134/001/

response:
  message: >
    Winlogon token handle duplication on $agent_name$. 
    Source: $data_win_eventdata_sourceImage$. 
    Target: $data_win_eventdata_targetImage$. 
    GrantedAccess: $data_win_eventdata_grantedAccess$. 
    Possible privilege escalation. MITRE ATT&CK: T1134.001
  risk_score: 64
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 64
  threat_objects: []

tags:
  analytic_story:
    - Brute Ratel C4
    - Compromised Windows Host
  asset_type: Endpoint
  mitre_attack_id:
    - T1134.001
  custom_tags:
    - winlogon
    - token_duplication
    - privilege_escalation
    - brute_ratel
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\\\winlogon\.exe.*/ AND data_win_eventdata_grantedAccess:"0x1040"

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: windows-access-token-manipulation-sedebugprivilege-001
    name: Windows Access Token Manipulation SeDebugPrivilege
    reason: 'Required precursor: opening winlogon.exe (a protected SYSTEM process) with PROCESS_DUP_HANDLE needs SeDebugPrivilege enabled in the source token first. A 4703 enabling SeDebugPrivilege on this host moments before the winlogon access is the token-privilege step that makes this duplication possible, and both rules explicitly name Brute Ratel C4.'
  - id: 6309645e-122d-4c5b-bb2b-22e4f9c2fa42
    name: HackTool - Potential CobaltStrike Process Injection
    reason: 'Likely origin of the code that stole the token: Cobalt Strike / Brute Ratel run getsystem from an injected, unbacked beacon rather than a disk binary. A CS remote-thread injection on this host in-window points to the beacon that then duplicated winlogon''s SYSTEM token.'
  - id: d5601f8c-b26f-4ab0-9035-69e11a8d4ad2
    name: CobaltStrike Named Pipe
    reason: 'Corroborates the beacon from a second telemetry angle: a default Cobalt Strike named pipe (postex_/msagent_/status_) on this host confirms an active beacon is the process that issued the winlogon token-duplication this alert caught, matching this rule''s Brute Ratel C4 / Compromised Windows Host story.'
  - id: ecbc5e16-58e0-4521-9c60-eb9a7ea4ad34
    name: Meterpreter or Cobalt Strike Getsystem Service Installation - Security
    reason: 'Sibling getsystem technique with the same T1134.001 goal: getsystem can also reach SYSTEM by installing a service that impersonates a named pipe instead of duplicating winlogon''s token. A 4697 getsystem service install on this host means the operator tried the service route too, the same SYSTEM escalation from another path.'
  - id: 9bd04a79-dabe-4f1f-a5ff-92430265c96b
    name: Privilege Escalation via Named Pipe Impersonation
    reason: 'Sibling getsystem technique: cmd/powershell writing to \\.\pipe\ then impersonating the connecting SYSTEM client is the other classic route to SYSTEM. Seen on this host alongside the winlogon token theft, it shows the operator cycling through impersonation/token tricks to win SYSTEM.'
  - id: 02f7c9c1-1ae8-4c6a-8add-04693807f92f
    name: Potential Access Token Abuse
    reason: 'Confirmation the stolen token was used, not just opened: impersonating a duplicated token produces a 4624 Logon Type 9 (NewCredentials) via Advapi. This logon-side artifact on the host proves winlogon''s SYSTEM token was actually assumed after the handle was duplicated.'
  - id: a18dd26b-6450-46de-8c91-9659150cf088
    name: Potentially Suspicious GrantedAccess Flags On LSASS
    reason: 'Immediate follow-on once SYSTEM is held: with winlogon''s token the operator can now read LSASS. Suspicious GrantedAccess to lsass.exe on this host in-window is the credential-dumping step that typically follows a successful getsystem.'
  - id: b1bd3a59-c1fd-4860-9f40-4dd161a7d1f5
    name: HackTool - HandleKatz Duplicating LSASS Handle
    reason: 'Co-occurring use of the same evasive primitive: HandleKatz duplicates a handle to LSASS (PROCESS_DUP_HANDLE, 0x1440) exactly as this rule catches it against winlogon (0x1040). Both on one host reveal an operator leaning on handle duplication to touch protected processes while evading EDR open-handle hooks.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other SYSTEM-token / protected-process handle duplication on this host
    query: data_win_system_eventID:"10" AND (data_win_eventdata_targetImage:/.*\\[Ww][Ii][Nn][Ll][Oo][Gg][Oo][Nn]\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetImage:/.*\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetImage:/.*\\[Cc][Ss][Rr][Ss][Ss]\.[Ee][Xx][Ee]/) AND (data_win_eventdata_grantedAccess:/0[Xx]1040/ OR data_win_eventdata_grantedAccess:/0[Xx]1440/ OR data_win_eventdata_grantedAccess:/0[Xx]1410/ OR data_win_eventdata_grantedAccess:/0[Xx]143[Aa]/ OR data_win_eventdata_grantedAccess:/0[Xx]10[Cc]0/)
    pivot_on:
    - host
    window: 1h
  - name: SeDebugPrivilege enablement on this host (token-privilege precursor)
    query: data_win_system_eventID:"4703" AND data_win_eventdata_enabledPrivilegeList:/.*[Ss][Ee][Dd][Ee][Bb][Uu][Gg][Pp][Rr][Ii][Vv][Ii][Ll][Ee][Gg][Ee].*/
    pivot_on:
    - host
    window: 2h
  - name: SYSTEM token-impersonation logon on this host (getsystem artifact)
    query: data_win_system_eventID:"4624" AND data_win_eventdata_logonType:"9" AND data_win_eventdata_logonProcessName:/.*[Aa][Dd][Vv][Aa][Pp][Ii].*/
    pivot_on:
    - host
    window: 2h
  - name: Credential dumping - LSASS access and dump tooling on this host
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_grantedAccess:/0[Xx]1410/ OR data_win_eventdata_grantedAccess:/0[Xx]143[Aa]/ OR data_win_eventdata_grantedAccess:/0[Xx]1438/ OR data_win_eventdata_grantedAccess:/0[Xx]1440/ OR data_win_eventdata_grantedAccess:/0[Xx]1[Ff]0[Ff][Ff][Ff]/)) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Ll][Oo][Gg][Oo][Nn][Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd][Ss].*/))
    pivot_on:
    - host
    window: 1h
  - name: C2 beacon origin - remote-thread injection and Cobalt Strike / Brute Ratel named pipes on this host
    query: (data_win_system_eventID:"8") OR ((data_win_system_eventID:"17" OR data_win_system_eventID:"18") AND (data_win_eventdata_pipeName:/.*\\[Mm][Ss][Ss][Ee]-.*/ OR data_win_eventdata_pipeName:/.*\\[Pp][Oo][Ss][Tt][Ee][Xx]_.*/ OR data_win_eventdata_pipeName:/.*\\[Ss][Tt][Aa][Tt][Uu][Ss]_.*/ OR data_win_eventdata_pipeName:/.*\\[Mm][Ss][Aa][Gg][Ee][Nn][Tt]_.*/ OR data_win_eventdata_pipeName:/.*\\[Ii][Nn][Tt][Ee][Rr][Pp][Rr][Oo][Cc][Ee][Ss][Ss]_.*/))
    pivot_on:
    - host
    window: 2h
