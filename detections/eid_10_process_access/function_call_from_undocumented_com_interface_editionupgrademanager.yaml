name: Function Call From Undocumented COM Interface EditionUpgradeManager
id: fb3722e4-1a06-46b6-b772-253e2e7db933
version: 1
schema_version: "1.0"
date: "2023-11-30"
author: oscd.community, Dmitry Uchakin
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: fb3722e4-1a06-46b6-b772-253e2e7db933
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects function calls from the EditionUpgradeManager COM interface. Which is
  an interface that is not used by standard executables. MITRE ATT&CK:
  T1548.002.

data_source:
  - Sysmon EventID 10 - Process Access

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "10"
        
        - wildcard:
            data_win_eventdata_callTrace:
              value: "*editionupgrademanagerobj.dll*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_callTrace
    - data_win_eventdata_sourceImage
    - data_win_eventdata_targetImage
    - data_win_eventdata_grantedAccess

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 10 (process access) enabled in the Sysmon
  configuration for the monitored target processes and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_callTrace matches
  '*editionupgrademanagerobj.dll*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://www.snip2code.com/Snippet/4397378/UAC-bypass-using-EditionUpgradeManager-C/
  - https://gist.github.com/hfiref0x/de9c83966623236f5ebf8d9ae2407611
  - https://attack.mitre.org/techniques/T1548/002/

response:
  message: >
    Function Call From Undocumented COM Interface EditionUpgradeManager detected
    on host $agent_name$. Matched data_win_eventdata_callTrace:
    $data_win_eventdata_callTrace$. Matched data_win_eventdata_sourceImage:
    $data_win_eventdata_sourceImage$. MITRE ATT&CK: T1548.002
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_callTrace
      type: other
    - field: data_win_eventdata_sourceImage
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1548.002
  custom_tags:
    - function
    - undocumented
    - interface
    - process_access
    - sysmon
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"10" AND data_win_eventdata_callTrace:/.*[Ee][Dd][Ii][Tt][Ii][Oo][Nn][Uu][Pp][Gg][Rr][Aa][Dd][Ee][Mm][Aa][Nn][Aa][Gg][Ee][Rr][Oo][Bb][Jj]\.[Dd][Ll][Ll].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d38d2fa4-98e6-4a24-aff1-410b0c9ad177
    name: HackTool - UACMe Akagi Execution
    reason: This rule's reference PoC is by hfiref0x, author of UACMe, and EditionUpgradeManager is a UACMe method; Akagi is the most likely tool that instantiated the COM interface, caught here at process launch by its PE metadata on the same host.
  - id: 4f6c43e2-f989-4ea5-bcd8-843b49a0317c
    name: UAC Bypass Using WOW64 Logger DLL Hijack
    reason: 'Closest mechanical sibling: same Sysmon EID 10 ProcessAccess callTrace telemetry and the same UACMe toolkit (this is UACMe method 30). Both firing on one host signals an operator working through multiple UACMe bypass methods.'
  - id: 49f2f17b-b4c8-4172-a68b-d5bf95d05130
    name: UAC Bypass via ICMLuaUtil
    reason: Same auto-elevating Elevated COM interface family, instantiated through a dllhost.exe /Processid COM elevation moniker exactly as EditionUpgradeManager is; operators rotate between these COM methods, so an ICMLuaUtil attempt on the same host is the same campaign.
  - id: 4cbef972-f347-4170-b62a-8253f6168e6d
    name: UAC Bypass Using IDiagnostic Profile
    reason: Parallel auto-elevating COM interface abused via the identical dllhost /Processid moniker to reach High/System integrity; a natural alternative an operator tries alongside EditionUpgradeManager when probing COM UAC bypasses.
  - id: 3b4b232a-af90-427c-a22f-30b0c0837b95
    name: CMSTP Execution Process Access
    reason: Same detection shape - an auto-elevation COM DLL (cmlua.dll) appearing in a Sysmon EID 10 ProcessAccess callTrace; CMSTP's COM auto-elevate is the direct analogue of EditionUpgradeManager's, so the two co-occur when COM-based UAC bypasses are being tested.
  - id: 4ac47ed3-44c2-4b1f-9d51-bf46e8914126
    name: TrustedPath UAC Bypass Pattern
    reason: 'Precursor setup: abusing an auto-elevating COM object requires the caller to masquerade as a Microsoft-signed System32 binary, and the mock ''C:\Windows \System32'' directory is how that trust check is satisfied moments before the COM call fires.'
  - id: 0cbe38c0-270c-41d9-ab79-6e5a9a669290
    name: Trusted Path Bypass via Windows Directory Spoofing
    reason: 'Image-load half of the same trusted-path masquerade: a DLL loaded from the spoofed ''C:\Windows \System32'' path grants the spoofed process the high-integrity trust this COM auto-elevation bypass depends on.'
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: 'Follow-on payoff: the point of elevating to high integrity via this bypass is credential theft, and a comsvcs.dll MiniDump of LSASS requires exactly the administrator rights the UAC bypass just granted on this host.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: COM elevation-moniker surrogate (dllhost /Processid) spawning children on this host
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Dd][Ll][Ll][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ AND data_win_eventdata_parentCommandLine:/.*\/[Pp][Rr][Oo][Cc][Ee][Ss][Ss][Ii][Dd]:\{.*\}.*/
    pivot_on:
    - host
    window: 2h
  - name: Spoofed trusted Windows directory (extra-space System32/SysWOW64) image or DLL load on this host
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] \\[Ss][Yy][Ss][Tt][Ee][Mm]32\\.*/ OR data_win_eventdata_image:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] \\[Ss][Yy][Ss][Ww][Oo][Ww]64\\.*/)) OR (data_win_system_eventID:"7" AND (data_win_eventdata_imageLoaded:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] \\[Ss][Yy][Ss][Tt][Ee][Mm]32\\.*/ OR data_win_eventdata_imageLoaded:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] \\[Ss][Yy][Ss][Ww][Oo][Ww]64\\.*/))
    pivot_on:
    - host
    window: 2h
  - name: Other auto-elevating UAC-bypass binaries executing on this host (method rotation)
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Ff][Oo][Dd][Hh][Ee][Ll][Pp][Ee][Rr]|[Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr][Dd][Ee][Ff][Aa][Uu][Ll][Tt][Ss]|[Ss][Dd][Cc][Ll][Tt]|[Ee][Vv][Ee][Nn][Tt][Vv][Ww][Rr]|[Ww][Ss][Rr][Ee][Ss][Ee][Tt]|[Cc][Mm][Ss][Tt][Pp]|[Ss][Ll][Uu][Ii]|[Cc][Hh][Aa][Nn][Gg][Ee][Pp][Kk]|[Dd][Cc][Cc][Ww]|[Ii][Ss][Cc][Ss][Ii][Cc][Pp][Ll]|[Ww][Ii][Nn][Ss][Aa][Tt])\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\([Ff][Oo][Dd][Hh][Ee][Ll][Pp][Ee][Rr]|[Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr][Dd][Ee][Ff][Aa][Uu][Ll][Tt][Ss]|[Ss][Dd][Cc][Ll][Tt]|[Ee][Vv][Ee][Nn][Tt][Vv][Ww][Rr]|[Ww][Ss][Rr][Ee][Ss][Ee][Tt]|[Cc][Mm][Ss][Tt][Pp]|[Ss][Ll][Uu][Ii]|[Cc][Hh][Aa][Nn][Gg][Ee][Pp][Kk]|[Dd][Cc][Cc][Ww]|[Ii][Ss][Cc][Ss][Ii][Cc][Pp][Ll]|[Ww][Ii][Nn][Ss][Aa][Tt])\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 2h
  - name: Credential access after elevation - LSASS dump, SAM/SECURITY hive theft or known dumpers on this host
    query: (data_win_system_eventID:"1" AND ((data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll].*/ AND (data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*\#24.*/)) OR data_win_eventdata_commandLine:/.*[Ss][Aa][Vv][Ee].*[Hh][Kk][Ll][Mm].*\\([Ss][Aa][Mm]|[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy])/ OR data_win_eventdata_image:/.*\\([Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]|[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]64|[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz]|[Nn][Aa][Nn][Oo][Dd][Uu][Mm][Pp])\.[Ee][Xx][Ee]/)) OR (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_grantedAccess:/0[Xx]1[Ff][Ff][Ff][Ff][Ff]/ OR data_win_eventdata_grantedAccess:/0[Xx]1010/ OR data_win_eventdata_grantedAccess:/0[Xx]1410/ OR data_win_eventdata_grantedAccess:/0[Xx]1438/))
    pivot_on:
    - host
    window: 2h
  - name: Post-elevation defense evasion - Defender/AV disable or UAC teardown on this host
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee][Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Aa][Nn][Tt][Ii][Ss][Pp][Yy][Ww][Aa][Rr][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Tt][Oo][Pp] [Ww][Ii][Nn][Dd][Ee][Ff][Ee][Nn][Dd].*/ OR data_win_eventdata_commandLine:/.*[Ff][Ll][Tt][Mm][Cc].*[Uu][Nn][Ll][Oo][Aa][Dd].*/)) OR (data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee][Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_targetObject:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Aa][Nn][Tt][Ii][Ss][Pp][Yy][Ww][Aa][Rr][Ee].*/ OR data_win_eventdata_targetObject:/.*\\[Ee][Nn][Aa][Bb][Ll][Ee][Ll][Uu][Aa]/))
    pivot_on:
    - host
    window: 2h
