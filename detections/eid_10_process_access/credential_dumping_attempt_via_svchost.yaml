name: Credential Dumping Attempt Via Svchost
id: 174afcfa-6e40-4ae9-af64-496546389294
version: 1
schema_version: "1.0"
date: "2022-10-09"
author: Florent Labouyrie
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 174afcfa-6e40-4ae9-af64-496546389294
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects when a process tries to access the memory of svchost to potentially
  dump credentials. MITRE ATT&CK: T1548.

data_source:
  - Sysmon EventID 10 - Process Access

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "10"
        
        - wildcard:
            data_win_eventdata_targetImage:
              value: "*\\\\svchost.exe"
              case_insensitive: true
        - term:
            data_win_eventdata_grantedAccess:
              value: "0x143a"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_sourceImage"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_sourceImage:
                          value: "*\\\\services.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_sourceImage:
                          value: "*\\\\msiexec.exe"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetImage
    - data_win_eventdata_grantedAccess
    - data_win_eventdata_sourceImage

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 10 (process access) enabled in the Sysmon
  configuration for the monitored target processes and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetImage matches
  '*\svchost.exe'; data_win_eventdata_grantedAccess equals '0x143a';
  data_win_eventdata_sourceImage matches '*\services.exe', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - Internal Research
  - https://attack.mitre.org/techniques/T1548/

response:
  message: >
    Credential Dumping Attempt Via Svchost detected on host $agent_name$.
    Matched data_win_eventdata_targetImage: $data_win_eventdata_targetImage$.
    Matched data_win_eventdata_grantedAccess:
    $data_win_eventdata_grantedAccess$. MITRE ATT&CK: T1548
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetImage
      type: process
    - field: data_win_eventdata_grantedAccess
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1548
  custom_tags:
    - credential
    - dumping
    - svchost
    - process_access
    - sysmon
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ AND data_win_eventdata_grantedAccess:/0[Xx]143[Aa]/ AND _exists_:data_win_eventdata_sourceImage AND NOT (data_win_eventdata_sourceImage:/.*\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_sourceImage:/.*\\[Mm][Ss][Ii][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 166e9c50-8cd9-44af-815d-d1f0c0e90dde
    name: Suspicious Svchost Process Access
    reason: Sibling Sysmon EID 10 handle-open against the very same svchost.exe target; it fires on the full-access (0x1F3FFF) / thread-kill variant, so paired with this 0x143a alert the two map one actor abusing the service host from different angles.
  - id: a18dd26b-6450-46de-8c91-9659150cf088
    name: Potentially Suspicious GrantedAccess Flags On LSASS
    reason: Flags the IDENTICAL 0x143a access mask, but on lsass.exe; a tool opening svchost with 0x143a almost always opens LSASS the same way, so a near-simultaneous hit here is the credential-dump confirmation.
  - id: 5ef9853e-4d0e-4a70-846f-a9ca37d876da
    name: Potential Credential Dumping Activity Via LSASS
    reason: The LSASS-targeted counterpart of this detection (call-trace + dump access masks used by Mimikatz/NanoDump/Procdump); LSASS is the real credential prize the svchost memory access runs alongside or just before.
  - id: 3f3f3506-1895-401b-9cc3-e86b16e630d0
    name: Potential Direct Syscall of NtOpenProcess
    reason: Catches the EDR-evasion (direct-syscall, callTrace UNKNOWN) way of acquiring the exact process handle this rule saw; likely the same source process opening svchost stealthily to avoid hooked OpenProcess.
  - id: 6309645e-122d-4c5b-bb2b-22e4f9c2fa42
    name: HackTool - Potential CobaltStrike Process Injection
    reason: The CREATE_THREAD+VM_WRITE bits of 0x143a are injection-grade, not read-only; a Cobalt Strike beacon remote thread (EID 8) into svchost is the follow-on proving the open was to inject code into the trusted service host.
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: The canonical tool whose sekurlsa / process modules open LSA and service-host memory with exactly these rights; a Mimikatz command line on the same host corroborates that the svchost access is credential theft.
  - id: windows-access-token-manipulation-sedebugprivilege-001
    name: Windows Access Token Manipulation SeDebugPrivilege
    reason: SeDebugPrivilege is the prerequisite for opening another process's memory for read/write/thread-creation; a 4703 enabling it on the same host moments earlier is the precursor that makes this 0x143a open possible.
  - id: 4e87b8e2-2ee9-4b2a-a715-4727d297ece0
    name: Potential SAM Database Dump
    reason: 'Common same-host follow-on: once live process-memory access is in hand, operators export the on-disk SAM/SECURITY hives for offline credential cracking, broadening the harvest.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: LSASS memory access with credential-dump access masks on this host
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_grantedAccess:/0[Xx]143[Aa]/ OR data_win_eventdata_grantedAccess:/0[Xx]1438/ OR data_win_eventdata_grantedAccess:/0[Xx]1418/ OR data_win_eventdata_grantedAccess:/0[Xx]1410/ OR data_win_eventdata_grantedAccess:/0[Xx]1010/ OR data_win_eventdata_grantedAccess:/0[Xx]1[Ff][0-9A-Fa-f][Ff][Ff][Ff]/ OR data_win_eventdata_grantedAccess:/0[Xx]1[Ff][Ff][Ff][Ff][Ff]/)
    pivot_on:
    - host
    window: 1h
  - name: Remote-thread injection into svchost or lsass on this host
    query: data_win_system_eventID:"8" AND (data_win_eventdata_targetImage:/.*\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
  - name: Credential-dump / minidump tooling execution on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*(\\[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]|\\[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]64\.[Ee][Xx][Ee]|\\[Cc][Rr][Ee][Aa][Tt][Ee][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]|\\[Nn][Aa][Nn][Oo][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]|\\[Rr][Dd][Rr][Ll][Ee][Aa][Kk][Dd][Ii][Aa][Gg]\.[Ee][Xx][Ee]|\\[Ss][Qq][Ll][Dd][Uu][Mm][Pp][Ee][Rr]\.[Ee][Xx][Ee]|\\[Dd][Uu][Mm][Pp][Ee][Rr][Tt]\.[Ee][Xx][Ee])/ OR data_win_eventdata_commandLine:/.*([Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp]|[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll]|[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa]|[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz]|[Pp][Yy][Pp][Yy][Kk][Aa][Tt][Zz]).*/)
    pivot_on:
    - host
    window: 2h
  - name: SAM/SECURITY/SYSTEM hive export or NTDS/shadow-copy credential theft on this host
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\[Rr][Ee][Gg]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Ss][Aa][Vv][Ee].*([Hh][Kk][Ll][Mm]|[Ss][Aa][Mm]|[Ss][Yy][Ss][Tt][Ee][Mm]|[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]).*/) OR data_win_eventdata_commandLine:/.*([Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt]|[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll]|[Vv][Ss][Ss][Aa][Dd][Mm][Ii][Nn]|[Ee][Ss][Ee][Nn][Tt][Uu][Tt][Ll]).*/)
    pivot_on:
    - host
    window: 2h
  - name: Evasive (direct-syscall / unbacked call stack) handle to svchost or lsass on this host
    query: data_win_system_eventID:"10" AND data_win_eventdata_callTrace:/.*[Uu][Nn][Kk][Nn][Oo][Ww][Nn].*/ AND (data_win_eventdata_targetImage:/.*\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
