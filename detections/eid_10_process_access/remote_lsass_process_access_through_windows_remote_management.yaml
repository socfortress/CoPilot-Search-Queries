name: Remote LSASS Process Access Through Windows Remote Management
id: aa35a627-33fb-4d04-a165-d33b4afca3e8
version: 1
schema_version: "1.0"
date: "2023-11-29"
author: Patryk Prauze - ING Tech
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: aa35a627-33fb-4d04-a165-d33b4afca3e8
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: production
type: TTP

description: >
  Detects remote access to the LSASS process via WinRM. This could be a sign of
  credential dumping from tools like mimikatz. MITRE ATT&CK: T1003.001,
  T1059.001, T1021.006.

data_source:
  - Sysmon EventID 10 - Process Access

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "10"
        
        - wildcard:
            data_win_eventdata_targetImage:
              value: "*\\\\lsass.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_sourceImage:
              value: "*:\\\\Windows\\\\system32\\\\wsmprovhost.exe"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_grantedAccess"
        - bool:
            must_not:
              - term:
                  data_win_eventdata_grantedAccess:
                    value: "0x80000000"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetImage
    - data_win_eventdata_sourceImage
    - data_win_eventdata_grantedAccess

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 10 (process access) enabled in the Sysmon
  configuration for the monitored target processes and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetImage matches
  '*\lsass.exe'; data_win_eventdata_sourceImage matches
  '*:\Windows\system32\wsmprovhost.exe'; data_win_eventdata_grantedAccess equals
  '0x80000000'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://pentestlab.blog/2018/05/15/lateral-movement-winrm/
  - https://attack.mitre.org/techniques/T1003/001/
  - https://attack.mitre.org/techniques/T1059/001/
  - https://attack.mitre.org/techniques/T1021/006/

response:
  message: >
    Remote LSASS Process Access Through Windows Remote Management detected on
    host $agent_name$. Matched data_win_eventdata_targetImage:
    $data_win_eventdata_targetImage$. Matched data_win_eventdata_sourceImage:
    $data_win_eventdata_sourceImage$. MITRE ATT&CK: T1003.001, T1059.001,
    T1021.006
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetImage
      type: process
    - field: data_win_eventdata_sourceImage
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.001
    - T1059.001
    - T1021.006
  custom_tags:
    - lsass
    - management
    - process_access
    - sysmon
    - credential_access
    - execution
    - lateral_movement
    - s0002
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_sourceImage:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ww][Ss][Mm][Pp][Rr][Oo][Vv][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ AND _exists_:data_win_eventdata_grantedAccess AND NOT (data_win_eventdata_grantedAccess:/0[Xx]80000000/)

