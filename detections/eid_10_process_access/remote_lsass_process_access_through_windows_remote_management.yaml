name: Remote LSASS Process Access Through Windows Remote Management
id: aa35a627-33fb-4d04-a165-d33b4afca3e8
version: 1
schema_version: "1.0"
date: "2023-11-29"
author: Patryk Prauze - ING Tech
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: aa35a627-33fb-4d04-a165-d33b4afca3e8
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: production
type: TTP

description: >
  Detects remote access to the LSASS process via WinRM. This could be a sign of
  credential dumping from tools like mimikatz. MITRE ATT&CK: T1003.001,
  T1059.001, T1021.006.

data_source:
  - Sysmon EventID 10 - Process Access

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "10"
        
        - wildcard:
            data_win_eventdata_targetImage:
              value: "*\\\\lsass.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_sourceImage:
              value: "*:\\\\Windows\\\\system32\\\\wsmprovhost.exe"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_grantedAccess"
        - bool:
            must_not:
              - term:
                  data_win_eventdata_grantedAccess:
                    value: "0x80000000"
                    case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetImage
    - data_win_eventdata_sourceImage
    - data_win_eventdata_grantedAccess

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 10 (process access) enabled in the Sysmon
  configuration for the monitored target processes and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetImage matches
  '*\lsass.exe'; data_win_eventdata_sourceImage matches
  '*:\Windows\system32\wsmprovhost.exe'; data_win_eventdata_grantedAccess equals
  '0x80000000'.

known_false_positives: >
  Unlikely. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://pentestlab.blog/2018/05/15/lateral-movement-winrm/
  - https://attack.mitre.org/techniques/T1003/001/
  - https://attack.mitre.org/techniques/T1059/001/
  - https://attack.mitre.org/techniques/T1021/006/

response:
  message: >
    Remote LSASS Process Access Through Windows Remote Management detected on
    host $agent_name$. Matched data_win_eventdata_targetImage:
    $data_win_eventdata_targetImage$. Matched data_win_eventdata_sourceImage:
    $data_win_eventdata_sourceImage$. MITRE ATT&CK: T1003.001, T1059.001,
    T1021.006
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetImage
      type: process
    - field: data_win_eventdata_sourceImage
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.001
    - T1059.001
    - T1021.006
  custom_tags:
    - lsass
    - management
    - process_access
    - sysmon
    - credential_access
    - execution
    - lateral_movement
    - s0002
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_sourceImage:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ww][Ss][Mm][Pp][Rr][Oo][Vv][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ AND _exists_:data_win_eventdata_grantedAccess AND NOT (data_win_eventdata_grantedAccess:/0[Xx]80000000/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 734f8d9b-42b8-41b2-bcf5-abaf49d5a3c8
    name: Remote PowerShell Session Host Process (WinRM)
    reason: 'Same-host precursor/context: fires on the wsmprovhost.exe spawn this LSASS handle is opened from, confirming an interactive WinRM/PowerShell-Remoting session is live on the host - the remote foothold behind the dump.'
  - id: 5cc2cda8-f261-4d88-a2de-e9e193c86716
    name: Suspicious Processes Spawned by WinRM
    reason: 'Same-host co-occurrence: wsmprovhost.exe spawning cmd/powershell/certutil/bitsadmin is the in-session launcher an operator uses to run the LSASS dumper after connecting over WinRM.'
  - id: 84c174ab-d3ef-481f-9c86-a50d0b8e3edb
    name: PowerShell Get-Process LSASS in ScriptBlock
    reason: 'Same-session telemetry: the remote PowerShell session''s own 4104 script content referencing lsass (Get-Process lsass / Out-Minidump) exposes the dumping code executed inside the WinRM session.'
  - id: a49fa4d5-11db-418c-8473-1e014a8dd462
    name: Lsass Memory Dump via Comsvcs DLL
    reason: Same-host, same EID10 LSASS access via the most common fileless in-session dump method (rundll32 comsvcs.dll MiniDump) - confirms the access this rule saw from wsmprovhost was an actual credential dump.
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: Process-creation (EID1) view of that comsvcs MiniDump call - gives the analyst the rundll32 command line and the output .dmp path to pivot the exfiltration hunt on.
  - id: a18dd26b-6450-46de-8c91-9659150cf088
    name: Potentially Suspicious GrantedAccess Flags On LSASS
    reason: Same-host corroboration of dump-grade access rights on LSASS from a non-System32 tool (it whitelists wsmprovhost's System32 path), so it flags a dropped/temp dumper the operator ran in the session alongside this access.
  - id: a5a2d357-1ab8-4675-a967-ef9990a59391
    name: LSASS Process Memory Dump Files
    reason: 'Same-host follow-on artifact: creation of lsass.dmp/.rar/.zip confirms the dump succeeded and produced a credential file being staged for collection.'
  - id: ec570e53-4c76-45a9-804d-dc3f355ff7a7
    name: 7Zip Compressing Dump Files
    reason: 'Same-host exfil-staging follow-on: 7z compressing a .dmp/.dump is the operator packaging the harvested LSASS dump to carry off-host after the WinRM credential theft.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: WinRM session child processes on this host (what the operator ran in-session)
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Ww][Ss][Mm][Pp][Rr][Oo][Vv][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: LSASS dump techniques on this host (comsvcs MiniDump, procdump, dump files)
    query: ((data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp].*\.[Ee][Xx][Ee]/)) OR (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Ll][Ss][Aa][Ss][Ss].*\.([Dd][Mm][Pp]|[Rr][Aa][Rr]|[Zz][Ii][Pp])/))
    pivot_on:
    - host
    window: 1h
  - name: This account's network/NewCredentials/RDP logons across hosts (harvested-credential footprint)
    query: (data_win_system_eventID:"4624" OR data_win_system_eventID:"4625") AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"9" OR data_win_eventdata_logonType:"10")
    pivot_on:
    - user
    window: 6h
  - name: Lateral movement out from this host using harvested credentials
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Pp][Ss][Ee][Xx][Ee][Cc]|[Pp][Aa][Ee][Xx][Ee][Cc]|[Ww][Mm][Ii][Cc]|[Ww][Ii][Nn][Rr][Ss])\.[Ee][Xx][Ee]/ OR (data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Pp][Ww][Ss][Hh])\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Cc][Oo][Mm][Mm][Aa][Nn][Dd].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Ww]-[Pp][Ss][Ss][Ee][Ss][Ss][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ee][Nn][Tt][Ee][Rr]-[Pp][Ss][Ss][Ee][Ss][Ss][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*-[Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr][Nn][Aa][Mm][Ee].*/))))
    pivot_on:
    - host
    window: 2h
  - name: In-session credential-dumping / DCSync script content on this host
    query: data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz].*/ OR data_win_eventdata_scriptBlockText:/.*[Oo][Uu][Tt]-[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_scriptBlockText:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_scriptBlockText:/.*[Dd][Cc][Ss][Yy][Nn][Cc].*/ OR data_win_eventdata_scriptBlockText:/.*[Gg][Ee][Tt]-[Aa][Dd][Rr][Ee][Pp][Ll].*/ OR data_win_eventdata_scriptBlockText:/.*[Ll][Ss][Aa][Ss][Ss].*/)
    pivot_on:
    - host
    window: 1h
