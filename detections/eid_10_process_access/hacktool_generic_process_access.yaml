type: TTP

description: >
  Detects process access requests from hacktool processes based on their default
  image name. MITRE ATT&CK: T1003.001.

data_source:
  - Sysmon EventID 10 - Process Access

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "10"
        
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_sourceImage:
                    value: "*\\\\Akagi.exe"
                    case_insensitive: true
