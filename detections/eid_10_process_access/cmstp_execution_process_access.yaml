name: CMSTP Execution Process Access
id: 3b4b232a-af90-427c-a22f-30b0c0837b95
version: 1
schema_version: "1.0"
date: "2021-06-27"
author: Nik Seetharaman
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 3b4b232a-af90-427c-a22f-30b0c0837b95
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: production
type: TTP

description: >
  Detects various indicators of Microsoft Connection Manager Profile Installer
  execution. MITRE ATT&CK: T1218.003, T1559.001.

data_source:
  - Sysmon EventID 10 - Process Access

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "10"
        
        - wildcard:
            data_win_eventdata_callTrace:
              value: "*cmlua.dll*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_callTrace
    - data_win_eventdata_sourceImage
    - data_win_eventdata_targetImage
    - data_win_eventdata_grantedAccess

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 10 (process access) enabled in the Sysmon
  configuration for the monitored target processes and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_callTrace matches
  '*cmlua.dll*'.

known_false_positives: >
  Legitimate CMSTP use (unlikely in modern enterprise environments). Baseline
  expected activity in your environment and tune this detection before relying
  on it for automated response.

references:
  - https://web.archive.org/web/20190720093911/http://www.endurant.io/cmstp/detecting-cmstp-enabled-code-execution-and-uac-bypass-with-sysmon/
  - https://attack.mitre.org/techniques/T1218/003/
  - https://attack.mitre.org/techniques/T1559/001/

response:
  message: >
    CMSTP Execution Process Access detected on host $agent_name$. Matched
    data_win_eventdata_callTrace: $data_win_eventdata_callTrace$. Matched
    data_win_eventdata_sourceImage: $data_win_eventdata_sourceImage$. MITRE
    ATT&CK: T1218.003, T1559.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_callTrace
      type: other
    - field: data_win_eventdata_sourceImage
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1218.003
    - T1559.001
  custom_tags:
    - cmstp
    - process_access
    - sysmon
    - stealth
    - execution
    - g0069
    - g0080
    - car_2019_04_001
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"10" AND data_win_eventdata_callTrace:/.*[Cc][Mm][Ll][Uu][Aa]\.[Dd][Ll][Ll].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 4b60e6f2-bf39-47b4-b4ea-398e33cfe253
    name: CMSTP UAC Bypass via COM Object Access
    reason: 'The same CMSTPLUA auto-elevation seen from process creation: dllhost.exe spawning a High/System-integrity child under CLSID {3E5FC7F9-9A51-4367-9063-A120244FBEC7}, whose COM server is the exact cmlua.dll in this alert''s callTrace. If it also fires, the bypass succeeded and names the elevated payload.'
  - id: 49f2f17b-b4c8-4172-a68b-d5bf95d05130
    name: UAC Bypass via ICMLuaUtil
    reason: ICMLuaUtil is the elevated COM method exposed by cmlua.dll/CMSTPLUA that this process-access event reaches into; this catches the high-integrity child it launches via ShellExec on the same host.
  - id: e66779cc-383e-4224-a3a4-267eeb585c40
    name: Bypass UAC via CMSTP
    reason: 'The INF-driven sibling of this elevation: cmstp.exe installing a crafted .INF with its silent/auto flags. cmstp.exe also loads cmlua.dll, so this and the COM-object path are the two triggers that produce the cmlua.dll callTrace.'
  - id: 7d4cdc5a-0076-40ca-aac8-f7e714570e47
    name: CMSTP Execution Process Creation
    reason: Catches children spawned by cmstp.exe itself, confirming the binary ran (rather than a standalone COM object) and revealing what code it executed at elevation.
  - id: b6d235fc-1d38-4b12-adbe-325f06728f37
    name: CMSTP Execution Registry Event
    reason: The cmmgr32.exe registry footprint CMSTP writes while loading a connection profile/.INF; a co-occurring artifact that confirms genuine CMSTP activity rather than an unrelated cmlua.dll load.
  - id: e7888eb1-13b0-4616-bd99-4bc0c2b054b9
    name: Dllhost.EXE Execution Anomaly
    reason: dllhost.exe is the COM surrogate that hosts the auto-elevating CMSTPLUA object; an anomalous dllhost.exe on this host is the vehicle through which the ICMLuaUtil elevation in this alert was staged.
  - id: a18dd26b-6450-46de-8c91-9659150cf088
    name: Potentially Suspicious GrantedAccess Flags On LSASS
    reason: 'Immediate post-elevation objective: with the local-admin token this CMSTPLUA bypass just granted, the actor opens LSASS with dump access rights for credential theft - the same EID 10 process-access telemetry as this alert.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: CMSTPLUA COM surrogate elevation - the child spawned under the auto-elevating CLSID
    query: data_win_system_eventID:"1" AND data_win_eventdata_parentImage:/.*\\[Dd][Ll][Ll][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_parentCommandLine:/.*\{3[Ee]5[Ff][Cc]7[Ff]9-9[Aa]51-4367-9063-[Aa]120244[Ff][Bb][Ee][Cc]7\}.*/ OR data_win_eventdata_parentCommandLine:/.*\{[Dd]2[Ee]7041[Bb]-2927-42[Ff][Bb]-8[Ee]9[Ff]-7[Cc][Ee]93[Bb]6[Dd][Cc]937\}.*/)
    pivot_on:
    - host
    window: 1h
  - name: Malicious .INF payload dropped in a user-writable path (CMSTP consumes it)
    query: data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.[Ii][Nn][Ff]/ AND data_win_eventdata_targetFilename:/.*\\([Tt][Ee][Mm][Pp]|[Aa][Pp][Pp][Dd][Aa][Tt][Aa]|[Pp][Uu][Bb][Ll][Ii][Cc]|[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]|[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss])\\.*/
    pivot_on:
    - host
    window: 2h
  - name: High-integrity interpreter / LOLBin launched by the bypass
    query: data_win_system_eventID:"1" AND (data_win_eventdata_integrityLevel:/[Hh][Ii][Gg][Hh]/ OR data_win_eventdata_integrityLevel:/[Ss][Yy][Ss][Tt][Ee][Mm]/) AND data_win_eventdata_image:/.*\\([Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]|[Cc][Mm][Dd]|[Ww][Ss][Cc][Rr][Ii][Pp][Tt]|[Cc][Ss][Cc][Rr][Ii][Pp][Tt]|[Mm][Ss][Hh][Tt][Aa]|[Rr][Uu][Nn][Dd][Ll][Ll]32|[Rr][Ee][Gg][Ss][Vv][Rr]32)\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: Microsoft Defender disabled / tampered after elevation
    query: (data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee][Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg]/ OR data_win_eventdata_targetObject:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Aa][Nn][Tt][Ii][Ss][Pp][Yy][Ww][Aa][Rr][Ee]/ OR data_win_eventdata_targetObject:/.*[Tt][Aa][Mm][Pp][Ee][Rr][Pp][Rr][Oo][Tt][Ee][Cc][Tt][Ii][Oo][Nn]/)) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee][Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Ss][Tt][Oo][Pp].*[Ww][Ii][Nn][Dd][Ee][Ff][Ee][Nn][Dd].*/))
    pivot_on:
    - host
    window: 4h
  - name: Admin-level persistence created after elevation (service / scheduled task)
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_image:/.*\\[Ss][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Cc][Rr][Ee][Aa][Tt][Ee].*/) OR (data_win_eventdata_image:/.*\\[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*\/[Cc][Rr][Ee][Aa][Tt][Ee].*/) OR data_win_eventdata_commandLine:/.*[Nn][Ee][Ww]-[Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Ww]-[Ss][Cc][Hh][Ee][Dd][Uu][Ll][Ee][Dd][Tt][Aa][Ss][Kk].*/)
    pivot_on:
    - host
    window: 4h
