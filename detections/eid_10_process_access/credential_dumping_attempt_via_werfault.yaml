name: Credential Dumping Attempt Via WerFault
id: e5b33f7d-eb93-48b6-9851-09e1e610b6d7
version: 1
schema_version: "1.0"
date: "2023-11-29"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: e5b33f7d-eb93-48b6-9851-09e1e610b6d7
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects process LSASS memory dump using Mimikatz, NanoDump, Invoke-Mimikatz,
  Procdump or Taskmgr based on the CallTrace pointing to ntdll.dll, dbghelp.dll
  or dbgcore.dll for win10, server2016 and up. MITRE ATT&CK: T1003.001.

data_source:
  - Sysmon EventID 10 - Process Access

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "10"
        
        - wildcard:
            data_win_eventdata_sourceImage:
              value: "*\\\\WerFault.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetImage:
              value: "*\\\\lsass.exe"
              case_insensitive: true
        - term:
            data_win_eventdata_grantedAccess:
              value: "0x1FFFFF"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_sourceImage
    - data_win_eventdata_targetImage
    - data_win_eventdata_grantedAccess

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 10 (process access) enabled in the Sysmon
  configuration for the monitored target processes and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_sourceImage matches
  '*\WerFault.exe'; data_win_eventdata_targetImage matches '*\lsass.exe';
  data_win_eventdata_grantedAccess equals '0x1FFFFF'.

known_false_positives: >
  Actual failures in lsass.exe that trigger a crash dump (unlikely). Unknown
  cases in which WerFault accesses lsass.exe. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

references:
  - https://github.com/helpsystems/nanodump/commit/578116faea3d278d53d70ea932e2bbfe42569507
  - https://attack.mitre.org/techniques/T1003/001/

response:
  message: >
    Credential Dumping Attempt Via WerFault detected on host $agent_name$.
    Matched data_win_eventdata_sourceImage: $data_win_eventdata_sourceImage$.
    Matched data_win_eventdata_targetImage: $data_win_eventdata_targetImage$.
    MITRE ATT&CK: T1003.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_sourceImage
      type: process
    - field: data_win_eventdata_targetImage
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.001
  custom_tags:
    - credential
    - dumping
    - werfault
    - process_access
    - sysmon
    - credential_access
    - s0002
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"10" AND data_win_eventdata_sourceImage:/.*\\[Ww][Ee][Rr][Ff][Aa][Uu][Ll][Tt]\.[Ee][Xx][Ee]/ AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_grantedAccess:/0[Xx]1[Ff][Ff][Ff][Ff][Ff]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 9a4ccd1a-3526-4d99-b980-9f9c5d3a6ff3
    name: Potential Credential Dumping Via WER
    reason: 'Direct cause of this access: the LSASS Shtinkering ''WerFault.exe -u -p <lsass_pid> -ip -s'' spawned by a non-LSASS parent under an AUTHORITY account IS the process that then opens lsass.exe with 0x1FFFFF here - the EID 1 process-creation side of this same EID 10 access.'
  - id: c3e76af5-4ce0-4a14-9c9a-25ceb8fda182
    name: WerFault LSASS Process Memory Dump
    reason: 'Immediate result: within seconds of this 0x1FFFFF open, WerFault writes the lsass*.dmp to disk (EID 11) - the credential dump this access produces, and confirmation the attempt succeeded rather than a benign crash.'
  - id: 6902955a-01b7-432c-b32a-6f5f81d8f625
    name: LSASS Process Dump Artefact In CrashDumps Folder
    reason: 'Follow-on artifact in its native spot: the LSASS .dmp landing in WER''s LocalDumps/CrashDumps folder - WerFault''s default output location, exactly where the Shtinkering dump this access started gets left on disk.'
  - id: 33efc23c-6ea2-4503-8cfe-bdf82ce8f719
    name: Lsass Full Dump Request Via DumpType Registry Settings
    reason: 'Enabling precursor: WerFault only produces a usable full LSASS dump after HKLM\...\Windows Error Reporting\LocalDumps\lsass.exe\DumpType is set to 2 (Full Dump) - the registry prerequisite set minutes before this WerFault-on-LSASS access.'
  - id: 55e29995-75e7-451a-bef0-6225e2f13597
    name: Potential Credential Dumping Via LSASS SilentProcessExit Technique
    reason: 'Alternative setup on the same WER mechanism: registering a SilentProcessExit monitor on lsass.exe makes WerFault dump it on exit - the sibling WER-abuse precursor that yields this identical WerFault->LSASS access path.'
  - id: a18dd26b-6450-46de-8c91-9659150cf088
    name: Potentially Suspicious GrantedAccess Flags On LSASS
    reason: 'Co-occurring parallel dumping: other processes opening lsass.exe with dump-grade granted-access masks in the same burst - the operator falling back to a direct dumper (Mimikatz/procdump) alongside the WER attempt on the same host.'
  - id: ec570e53-4c76-45a9-804d-dc3f355ff7a7
    name: 7Zip Compressing Dump Files
    reason: 'Collection follow-on: 7-Zip compressing the resulting .dmp to stage the harvested LSASS memory for exfiltration (T1560.001) - the next hands-on step once the dump file exists.'
  - id: 941e5c45-cda7-4864-8cea-bbb7458d194a
    name: Suspicious Remote Logon with Explicit Credentials
    reason: 'Objective realised: credentials recovered from the LSASS dump used to authenticate to other hosts with explicit credentials (pass-the-hash / lateral movement) - the ''what next'' after the dump is parsed offline.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: 'WER-based LSASS dump chain: DumpType/SilentProcessExit setup, WerFault -p spawn and the lsass .dmp on this host'
    query: ((data_win_system_eventID:"13" AND data_win_eventdata_targetObject:/.*[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Ee][Rr][Rr][Oo][Rr] [Rr][Ee][Pp][Oo][Rr][Tt][Ii][Nn][Gg]\\[Ll][Oo][Cc][Aa][Ll][Dd][Uu][Mm][Pp][Ss].*/) OR ((data_win_system_eventID:"12" OR data_win_system_eventID:"13") AND data_win_eventdata_targetObject:/.*[Ss][Ii][Ll][Ee][Nn][Tt][Pp][Rr][Oo][Cc][Ee][Ss][Ss][Ee][Xx][Ii][Tt]\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee].*/) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Ww][Ee][Rr][Ff][Aa][Uu][Ll][Tt]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.* -[Pp] .*/) OR (data_win_system_eventID:"11" AND data_win_eventdata_image:/.*\\[Ww][Ee][Rr][Ff][Aa][Uu][Ll][Tt]\.[Ee][Xx][Ee]/ AND data_win_eventdata_targetFilename:/.*[Ll][Ss][Aa][Ss][Ss].*\.[Dd][Mm][Pp]/))
    pivot_on:
    - host
    window: 2h
  - name: Direct (non-WerFault) LSASS memory access and known credential-dump tooling on this host
    query: ((data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ AND NOT (data_win_eventdata_sourceImage:/.*\\[Ww][Ee][Rr][Ff][Aa][Uu][Ll][Tt]\.[Ee][Xx][Ee]/)) OR (data_win_system_eventID:"8" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp].*\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Nn][Aa][Nn][Oo][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Dd][Uu][Mm][Pp][Ee][Rr][Tt]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss].*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/)))
    pivot_on:
    - host
    window: 1h
  - name: LSASS dump file staged or compressed for exfiltration on this host
    query: ((data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\7[Zz].*\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Rr][Aa][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Rr][Aa][Rr]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Mm][Aa][Kk][Ee][Cc][Aa][Bb]\.[Ee][Xx][Ee]/ OR data_win_eventdata_description:/.*7-[Zz][Ii][Pp].*/) AND data_win_eventdata_commandLine:/.*\.([Dd][Mm][Pp]|[Dd][Uu][Mm][Pp]).*/) OR (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Ll][Ss][Aa][Ss][Ss].*\.([Dd][Mm][Pp]|[Hh][Dd][Mm][Pp]|7[Zz]|[Rr][Aa][Rr]|[Zz][Ii][Pp])/))
    pivot_on:
    - host
    window: 4h
  - name: This account authenticating to other hosts (use of harvested credentials)
    query: (data_win_system_eventID:"4648" OR (data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"9" OR data_win_eventdata_logonType:"10")))
    pivot_on:
    - user
    window: 6h
  - name: LSASS protection defeat enabling plaintext credentials (WDigest / RunAsPPL / Credential Guard) on this host
    query: ((data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*[Ww][Dd][Ii][Gg][Ee][Ss][Tt]\\[Uu][Ss][Ee][Ll][Oo][Gg][Oo][Nn][Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll].*/ OR data_win_eventdata_targetObject:/.*[Ll][Ss][Aa]\\[Rr][Uu][Nn][Aa][Ss][Pp][Pp][Ll].*/ OR data_win_eventdata_targetObject:/.*[Ll][Ss][Aa]\\[Ll][Ss][Aa][Cc][Ff][Gg][Ff][Ll][Aa][Gg][Ss].*/ OR data_win_eventdata_targetObject:/.*[Dd][Ee][Vv][Ii][Cc][Ee][Gg][Uu][Aa][Rr][Dd]\\[Ll][Ss][Aa][Cc][Ff][Gg][Ff][Ll][Aa][Gg][Ss].*/)) OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*[Rr][Uu][Nn][Aa][Ss][Pp][Pp][Ll].*/))
    pivot_on:
    - host
    window: 2h
