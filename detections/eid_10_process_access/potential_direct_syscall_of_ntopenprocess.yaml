(data_win_eventdata_sourceImage:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ee][Xx][Pp][Ll][Oo][Rr][Ee][Rr]\.[Ee][Xx][Ee]/ AND data_win_eventdata_targetImage:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Cc][Yy][Ll][Aa][Nn][Cc][Ee]\\[Dd][Ee][Ss][Kk][Tt][Oo][Pp]\\[Cc][Yy][Ll][Aa][Nn][Cc][Ee][Uu][Ii]\.[Ee][Xx][Ee]/) OR (data_win_eventdata_sourceImage:/.*[Aa][Mm][Aa][Zz][Oo][Nn][Ss][Ss][Mm][Aa][Gg][Ee][Nn][Tt][Ss][Ee][Tt][Uu][Pp]\.[Ee][Xx][Ee]/ AND data_win_eventdata_targetImage:/.*[Aa][Mm][Aa][Zz][Oo][Nn][Ss][Ss][Mm][Aa][Gg][Ee][Nn][Tt][Ss][Ee][Tt][Uu][Pp]\.[Ee][Xx][Ee]/) OR (data_win_eventdata_sourceImage:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt] [Vv][Ss] [Cc][Oo][Dd][Ee]\\[Cc][Oo][Dd][Ee]\.[Ee][Xx][Ee]/ AND data_win_eventdata_targetImage:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt] [Vv][Ss] [Cc][Oo][Dd][Ee]\\[Cc][Oo][Dd][Ee]\.[Ee][Xx][Ee]/) OR (data_win_eventdata_targetImage:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Tt][Ee][Aa][Mm][Ss]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt]\\[Tt][Ee][Aa][Mm][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_sourceImage:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Tt][Ee][Aa][Mm][Ss]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt]\\[Tt][Ee][Aa][Mm][Ss]\.[Ee][Xx][Ee]/) OR (data_win_eventdata_targetImage:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Dd][Ii][Ss][Cc][Oo][Rr][Dd]\\.*/ AND data_win_eventdata_targetImage:/.*\\[Dd][Ii][Ss][Cc][Oo][Rr][Dd]\.[Ee][Xx][Ee]/) OR (data_win_eventdata_sourceImage:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Yy][Aa][Mm][Mm][Ee][Rr][Dd][Ee][Ss][Kk][Tt][Oo][Pp]\\[Aa][Pp][Pp]-.*/ AND data_win_eventdata_sourceImage:/.*\\[Yy][Aa][Mm][Mm][Ee][Rr]\.[Ee][Xx][Ee]/ AND data_win_eventdata_targetImage:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Yy][Aa][Mm][Mm][Ee][Rr][Dd][Ee][Ss][Kk][Tt][Oo][Pp]\\[Aa][Pp][Pp]-.*/ AND data_win_eventdata_targetImage:/.*\\[Yy][Aa][Mm][Mm][Ee][Rr]\.[Ee][Xx][Ee]/ AND data_win_eventdata_grantedAccess:/0[Xx]1000/) OR data_win_eventdata_targetImage:/.*\\[Ee][Vv][Ee][Rr][Nn][Oo][Tt][Ee]\\[Ee][Vv][Ee][Rr][Nn][Oo][Tt][Ee]\.[Ee][Xx][Ee]/ OR (data_win_eventdata_sourceImage:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Aa][Dd][Oo][Bb][Ee]\\[Aa][Cc][Rr][Oo][Bb][Aa][Tt] [Dd][Cc]\\[Aa][Cc][Rr][Oo][Bb][Aa][Tt]\\.*/ AND data_win_eventdata_sourceImage:/.*\\[Aa][Cc][Rr][Oo][Cc][Ee][Ff]\.[Ee][Xx][Ee]/ AND data_win_eventdata_targetImage:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Aa][Dd][Oo][Bb][Ee]\\[Aa][Cc][Rr][Oo][Bb][Aa][Tt] [Dd][Cc]\\[Aa][Cc][Rr][Oo][Bb][Aa][Tt]\\.*/ AND data_win_eventdata_targetImage:/.*\\[Aa][Cc][Rr][Oo][Cc][Ee][Ff]\.[Ee][Xx][Ee]/))

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 5ef9853e-4d0e-4a70-846f-a9ca37d876da
    name: Potential Credential Dumping Activity Via LSASS
    reason: 'Prime co-occurring purpose of the handle: a direct NtOpenProcess to LSASS with dumper call-traces/access masks is exactly how NanoDump and similar evasive dumpers steal credentials, and NanoDump uses direct syscalls precisely to produce this UNKNOWN-callTrace open.'
  - id: a18dd26b-6450-46de-8c91-9659150cf088
    name: Potentially Suspicious GrantedAccess Flags On LSASS
    reason: 'Confirms intent via the same data_win_eventdata_grantedAccess field this alert emits: if the direct-syscall handle was opened to LSASS with VM_READ/ALL_ACCESS masks, it is credential theft rather than benign process access.'
  - id: b1bd3a59-c1fd-4860-9f40-4dd161a7d1f5
    name: HackTool - HandleKatz Duplicating LSASS Handle
    reason: 'Same technique family (T1106) and same evasive ethos: HandleKatz opens/duplicates an LSASS handle while minimising handle opens and userland footprint, the dump-side counterpart to this direct-syscall handle open on the same host.'
  - id: 6309645e-122d-4c5b-bb2b-22e4f9c2fa42
    name: HackTool - Potential CobaltStrike Process Injection
    reason: 'The expected follow-on named by this rule''s own FalconForce reference: direct syscalls + process access precede a Cobalt Strike beacon injecting a remote thread into the handle just opened.'
  - id: 02d1d718-dd13-41af-989d-ea85c7fab93f
    name: Rare Remote Thread Creation By Uncommon Source Image
    reason: 'Immediate injection follow-on: after opening the target with a direct syscall the unbacked/uncommon source process creates a remote thread into it (open handle -> WriteProcessMemory -> CreateRemoteThread chain).'
  - id: b7967e22-3d7e-409b-9ed5-cdae3f9243a1
    name: Malware Shellcode in Verclsid Target Process
    reason: 'Same EID 10 process-access surface used for injection rather than reads: a macro/loader opening a target to write shellcode, the injection sibling of this handle-open behaviour on the same host.'
  - id: d0d2f720-d14f-448d-8242-51ff396a334e
    name: HackTool - Generic Process Access
    reason: 'Operator corroboration: a known offensive tool performing process access on the same host within the window strongly reinforces that the UNKNOWN-callTrace open is tooling, not a false positive.'
  - id: d29ada0f-af45-4f27-8f32-f7b77c3dbc4e
    name: HackTool - SysmonEnte Execution
    reason: 'Evasion co-occurrence: an operator using direct syscalls to bypass EDR userland hooks commonly also tampers the telemetry itself; SysmonEnte abuses process access to blind Sysmon on the same host.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: LSASS opened with credential-dumping access masks on this host
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_grantedAccess:/0[Xx]1010/ OR data_win_eventdata_grantedAccess:/0[Xx]1410/ OR data_win_eventdata_grantedAccess:/0[Xx]1438/ OR data_win_eventdata_grantedAccess:/0[Xx]143[Aa]/ OR data_win_eventdata_grantedAccess:/0[Xx]147[Aa]/ OR data_win_eventdata_grantedAccess:/0[Xx]1[Ff][Ff][Ff][Ff][Ff]/)
    pivot_on:
    - host
    window: 1h
  - name: Remote-thread injection or further unbacked-memory process access on this host
    query: (data_win_system_eventID:"8") OR (data_win_system_eventID:"10" AND data_win_eventdata_callTrace:/.*[Uu][Nn][Kk][Nn][Oo][Ww][Nn].*/)
    pivot_on:
    - host
    window: 1h
  - name: Network egress from processes running in user-writable staging directories (beacon C2)
    query: data_win_system_eventID:"3" AND (data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_image:/.*\\[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]\\.*/)
    pivot_on:
    - host
    window: 2h
  - name: Execution of the injector binary from user-writable / temp staging directories on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Ll][Oo][Cc][Aa][Ll]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_image:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Rr][Oo][Aa][Mm][Ii][Nn][Gg]\\.*/ OR data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\.*/ OR data_win_eventdata_image:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_image:/.*\\[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]\\.*/)
    pivot_on:
    - host
    window: 4h
  - name: Process access targeting AV / EDR / Sysmon sensors on this host (sensor blinding)
