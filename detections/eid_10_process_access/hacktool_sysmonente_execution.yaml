name: HackTool - SysmonEnte Execution
id: d29ada0f-af45-4f27-8f32-f7b77c3dbc4e
version: 1
schema_version: "1.0"
date: "2026-06-29"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: d29ada0f-af45-4f27-8f32-f7b77c3dbc4e
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the use of SysmonEnte, a tool to attack the integrity of Sysmon. MITRE
  ATT&CK: T1685.001.

data_source:
  - Sysmon EventID 10 - Process Access

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "10"
        
        - bool:
            should:
              - bool:
                  must:
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_targetImage:
                                value: "*:\\\\Windows\\\\Sysmon.exe*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_targetImage:
                                value: "*:\\\\Windows\\\\Sysmon64.exe*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_targetImage:
                                value: "*:\\\\Windows\\\\Sysmon64a.exe*"
                                case_insensitive: true
                        minimum_should_match: 1
                    - term:
                        data_win_eventdata_grantedAccess:
                          value: "0x1400"
                          case_insensitive: true
                    - exists:
                        field: "data_win_eventdata_sourceImage"
                    - bool:
                        must_not:
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_sourceImage:
                                      value: "*:\\\\Program Files (x86)\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_sourceImage:
                                      value: "*:\\\\Program Files\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_sourceImage:
                                      value: "*:\\\\Windows\\\\System32\\\\*"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_sourceImage:
                                      value: "*:\\\\Windows\\\\SysWOW64\\\\*"
                                      case_insensitive: true
                                - bool:
                                    must:
                                      - wildcard:
                                          data_win_eventdata_sourceImage:
                                            value: "*:\\\\ProgramData\\\\Microsoft\\\\Windows Defender\\\\Platform\\\\*"
                                            case_insensitive: true
                                      - wildcard:
                                          data_win_eventdata_sourceImage:
                                            value: "*\\\\MsMpEng.exe"
                                            case_insensitive: true
                              minimum_should_match: 1
              - term:
                  data_win_eventdata_callTrace:
                    value: "Ente"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetImage
    - data_win_eventdata_grantedAccess
    - data_win_eventdata_sourceImage
    - data_win_eventdata_callTrace

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 10 (process access) enabled in the Sysmon
  configuration for the monitored target processes and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetImage matches
  '*:\Windows\Sysmon.exe*'; data_win_eventdata_targetImage matches
  '*:\Windows\Sysmon64.exe*'; data_win_eventdata_targetImage matches
  '*:\Windows\Sysmon64a.exe*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://codewhitesec.blogspot.com/2022/09/attacks-on-sysmon-revisited-sysmonente.html
  - https://github.com/codewhitesec/SysmonEnte/
  - https://github.com/codewhitesec/SysmonEnte/blob/fe267690fcc799fbda15398243615a30451d9099/screens/1.png
  - https://attack.mitre.org/techniques/T1685/001/

response:
  message: >
    HackTool - SysmonEnte Execution detected on host $agent_name$. Matched
    data_win_eventdata_targetImage: $data_win_eventdata_targetImage$. Matched
    data_win_eventdata_grantedAccess: $data_win_eventdata_grantedAccess$. MITRE
    ATT&CK: T1685.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetImage
      type: process
    - field: data_win_eventdata_grantedAccess
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685.001
  custom_tags:
    - hacktool
    - sysmonente
    - process_access
    - sysmon
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"10" AND (((data_win_eventdata_targetImage:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Mm][Oo][Nn]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_targetImage:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Mm][Oo][Nn]64\.[Ee][Xx][Ee].*/ OR data_win_eventdata_targetImage:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Mm][Oo][Nn]64[Aa]\.[Ee][Xx][Ee].*/) AND data_win_eventdata_grantedAccess:/0[Xx]1400/ AND _exists_:data_win_eventdata_sourceImage AND NOT (data_win_eventdata_sourceImage:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss] \([Xx]86\)\\.*/ OR data_win_eventdata_sourceImage:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\.*/ OR data_win_eventdata_sourceImage:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\.*/ OR data_win_eventdata_sourceImage:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Ww][Oo][Ww]64\\.*/ OR (data_win_eventdata_sourceImage:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Dd][Aa][Tt][Aa]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss] [Dd][Ee][Ff][Ee][Nn][Dd][Ee][Rr]\\[Pp][Ll][Aa][Tt][Ff][Oo][Rr][Mm]\\.*/ AND data_win_eventdata_sourceImage:/.*\\[Mm][Ss][Mm][Pp][Ee][Nn][Gg]\.[Ee][Xx][Ee]/))) OR data_win_eventdata_callTrace:/[Ee][Nn][Tt][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 8a7e90c5-fe6e-45dc-889e-057fe4378bd9
    name: HackTool - SysmonEOP Execution
    reason: 'Sibling Sysmon-integrity attack tool (CodeWhite / Wh04m1001 research): an operator blinding Sysmon with SysmonEnte commonly also drops/runs SysmonEOP (CVE-2022-41120 PoC) to defeat Sysmon via a different primitive on the same host.'
  - id: 4d7cda18-1b12-4e52-b45c-d28653210df8
    name: Sysmon Driver Unloaded Via Fltmc.EXE
    reason: 'Alternative Sysmon-blinding on the same host: fltmc unloading the SysmonDrv filter driver achieves the same kill as SysmonEnte''s in-memory tamper, a co-occurring or fallback method in the same defense-impairment step.'
  - id: 4d7f1827-1637-4def-8d8a-fd254f9454df
    name: Sysmon Application Crashed
    reason: 'Direct symptom and confirmation: SysmonEnte''s handle manipulation of the running Sysmon process frequently crashes it, so a sysmon.exe/sysmon64.exe Application Error on the same host right after the EID 10 access confirms the tamper succeeded.'
  - id: 37db85d1-b089-490a-a59a-c7b6f984f480
    name: Sysmon Discovery Via Default Driver Altitude Using Findstr.EXE
    reason: 'Precursor recon: attackers enumerate Sysmon''s default driver altitude (385201) to locate/confirm Sysmon even if renamed, right before attacking it, so expect this findstr discovery shortly before the SysmonEnte handle open.'
  - id: 18beca67-ab3e-4ee3-ba7a-a46ca8d7d0cc
    name: Sysmon Channel Reference Deletion
    reason: 'Co-occurring Sysmon-blinding via a different vector: disabling the Microsoft-Windows-Sysmon/Operational WINEVT channel stops Sysmon events reaching the log, the same objective (mute Sysmon) as SysmonEnte in the same step.'
  - id: 387df17d-3b04-448f-8669-9e7fd5e5fd8c
    name: Suspicious Process Access of MsMpEng by WerFaultSecure - EDR-Freeze
    reason: 'Parallel sensor-blinding by the same primitive: EDR-Freeze suspends the Defender engine (MsMpEng) through an EID 10 process handle, exactly as SysmonEnte abuses an EID 10 handle to Sysmon, so an actor muting Sysmon often freezes the AV engine in the same breath.'
  - id: 5ef9853e-4d0e-4a70-846f-a9ca37d876da
    name: Potential Credential Dumping Activity Via LSASS
    reason: 'The objective the blinding enables: once Sysmon is muted the operator proceeds to the LSASS credential theft they wanted hidden, so expect EID 10 LSASS access shortly after on the same host.'
  - id: 4916a35e-bfc4-47d0-8e25-a003d7067061
    name: Sysmon Driver Altitude Change
    reason: 'Co-occurring kernel-component tamper: changing SysmonDrv''s registry altitude evades or disables the Sysmon driver, and paired with the altitude discovery it is the registry-based route to the same blinding SysmonEnte performs in memory.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Other process-access handles opened to the Sysmon binary on this host
    query: data_win_system_eventID:"10" AND (data_win_eventdata_targetImage:/.*\\[Ss][Yy][Ss][Mm][Oo][Nn]\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetImage:/.*\\[Ss][Yy][Ss][Mm][Oo][Nn]64\.[Ee][Xx][Ee]/ OR data_win_eventdata_targetImage:/.*\\[Ss][Yy][Ss][Mm][Oo][Nn]64[Aa]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
  - name: LSASS credential access or dump on this host (the objective blinding enables)
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"8" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Ll][Ss][Aa][Ss][Ss].*\.[Dd][Mm][Pp]/)
    pivot_on:
    - host
    window: 2h
  - name: Other EDR/AV agent processes accessed via a process handle on this host
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\([Mm][Ss][Mm][Pp][Ee][Nn][Gg]|[Mm][Ss][Ss][Ee][Nn][Ss][Ee]|[Ss][Ee][Nn][Ss][Ee][Ii][Rr]|[Ss][Ee][Nn][Ss][Ee][Nn][Dd][Rr]|[Cc][Ss][Ff][Aa][Ll][Cc][Oo][Nn][Ss][Ee][Rr][Vv][Ii][Cc][Ee]|[Ss][Ee][Nn][Tt][Ii][Nn][Ee][Ll][Aa][Gg][Ee][Nn][Tt]|[Xx][Aa][Gg][Tt]|[Ee][Kk][Rr][Nn]|[Bb][Dd][Aa][Gg][Ee][Nn][Tt]|[Cc][Yy][Ll][Aa][Nn][Cc][Ee][Ss][Vv][Cc])\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: Sysmon service, driver or config tampered via command line on this host
    query: data_win_system_eventID:"1" AND ((data_win_eventdata_commandLine:/.*[Ss][Yy][Ss][Mm][Oo][Nn].*/ AND (data_win_eventdata_commandLine:/.*[Ss][Tt][Oo][Pp].*/ OR data_win_eventdata_commandLine:/.*[Uu][Nn][Ll][Oo][Aa][Dd].*/ OR data_win_eventdata_commandLine:/.*[Uu][Nn][Ii][Nn][Ss][Tt][Aa][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ee][Ll][Ee][Tt][Ee].*/)) OR (data_win_eventdata_image:/.*\\[Ff][Ll][Tt][Mm][Cc]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Uu][Nn][Ll][Oo][Aa][Dd].*/))
    pivot_on:
    - host
    window: 2h
  - name: Defender / event-log / audit-policy disablement around this host
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ww][Ee][Vv][Tt][Uu][Tt][Ii][Ll].*[Cc][Ll].*/ OR data_win_eventdata_commandLine:/.*[Cc][Ll][Ee][Aa][Rr]-[Ee][Vv][Ee][Nn][Tt][Ll][Oo][Gg].*/ OR data_win_eventdata_commandLine:/.*[Aa][Uu][Dd][Ii][Tt][Pp][Oo][Ll].*[Dd][Ii][Ss][Aa][Bb][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*[Dd][Ii][Ss][Aa][Bb][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee][Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Ss][Tt][Oo][Pp]-[Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/)) OR (data_win_system_eventID:"1102") OR (data_win_system_eventID:"104")
    pivot_on:
    - host
    window: 2h
