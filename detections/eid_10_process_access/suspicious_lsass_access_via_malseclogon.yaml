name: Suspicious LSASS Access Via MalSecLogon
id: 472159c5-31b9-4f56-b794-b766faa8b0a7
version: 1
schema_version: "1.0"
date: "2022-06-29"
author: Samir Bousseaden (original elastic rule), Nasreddine Bencherchali (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 472159c5-31b9-4f56-b794-b766faa8b0a7
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious access to LSASS handle via a call trace to "seclogon.dll"
  with a suspicious access right. MITRE ATT&CK: T1003.001.

data_source:
  - Sysmon EventID 10 - Process Access

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "10"
        
        - wildcard:
            data_win_eventdata_targetImage:
              value: "*\\\\lsass.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_sourceImage:
              value: "*\\\\svchost.exe"
              case_insensitive: true
        - term:
            data_win_eventdata_grantedAccess:
              value: "0x14c0"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_callTrace:
              value: "*seclogon.dll*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetImage
    - data_win_eventdata_sourceImage
    - data_win_eventdata_grantedAccess
    - data_win_eventdata_callTrace

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 10 (process access) enabled in the Sysmon
  configuration for the monitored target processes and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetImage matches
  '*\lsass.exe'; data_win_eventdata_sourceImage matches '*\svchost.exe';
  data_win_eventdata_grantedAccess equals '0x14c0', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/SBousseaden/status/1541920424635912196
  - https://github.com/elastic/detection-rules/blob/2bc1795f3d7bcc3946452eb4f07ae799a756d94e/rules/windows/credential_access_lsass_handle_via_malseclogon.toml
  - https://splintercod3.blogspot.com/p/the-hidden-side-of-seclogon-part-3.html
  - https://attack.mitre.org/techniques/T1003/001/

response:
  message: >
    Suspicious LSASS Access Via MalSecLogon detected on host $agent_name$.
    Matched data_win_eventdata_targetImage: $data_win_eventdata_targetImage$.
    Matched data_win_eventdata_sourceImage: $data_win_eventdata_sourceImage$.
    MITRE ATT&CK: T1003.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetImage
      type: process
    - field: data_win_eventdata_sourceImage
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.001
  custom_tags:
    - lsass
    - malseclogon
    - process_access
    - sysmon
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_sourceImage:/.*\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ AND data_win_eventdata_grantedAccess:/0[Xx]14[Cc]0/ AND data_win_eventdata_callTrace:/.*[Ss][Ee][Cc][Ll][Oo][Gg][Oo][Nn]\.[Dd][Ll][Ll].*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: b1bd3a59-c1fd-4860-9f40-4dd161a7d1f5
    name: HackTool - HandleKatz Duplicating LSASS Handle
    reason: 'Sibling evasive-handle technique on the same EID 10 sensor: both acquire an LSASS handle indirectly to avoid the attacker''s own process calling OpenProcess(lsass) that EDR hooks - MalSecLogon leaks one through seclogon/svchost, HandleKatz duplicates an existing one (0x1440 carries PROCESS_DUP_HANDLE). A hit on the same host means the operator is running handle-abuse LSASS dumping, the exact tradecraft family this alert belongs to.'
  - id: 5ef9853e-4d0e-4a70-846f-a9ca37d876da
    name: Potential Credential Dumping Activity Via LSASS
    reason: 'The memory-read step that follows the handle leak: once seclogon hands the operator an LSASS handle they MiniDumpWriteDump it, producing an EID 10 open with 0x1438/0x143a/0x1fffff masks and a dbgcore/dbghelp/ntdll call trace - exactly what this rule catches. Its firing on the same host confirms the stolen handle was actually used to read credentials, not merely opened.'
  - id: a18dd26b-6450-46de-8c91-9659150cf088
    name: Potentially Suspicious GrantedAccess Flags On LSASS
    reason: 'Complementary LSASS-access angle: this rule''s mask list deliberately does NOT include MalSecLogon''s 0x14c0, so it catches any OTHER suspicious access the operator makes to LSASS on the same host. Pairing it with this seclogon event shows whether this was a one-off probe or a sustained credential-dumping effort against the process.'
  - id: a5a2d357-1ab8-4675-a967-ef9990a59391
    name: LSASS Process Memory Dump Files
    reason: 'The payoff artifact on disk: the whole point of leaking an LSASS handle is to dump its memory, and this EID 11 rule fires when lsass*.dmp or known dumper file names are written. It proves the credential theft completed and hands the analyst the dump path to chase for compression and exfiltration.'
  - id: d474c8fe-bb69-4ea0-b7d9-f682b56d52d3
    name: HackTool - Doppelanger LSASS Dumper Execution
    reason: Another EDR-bypass LSASS dumper (process cloning) from the same tooling niche as seclogon abuse. Operators who reach for MalSecLogon carry a kit of LSASS-access bypasses, so a Doppelanger execution on the same host signals a deliberate effort to beat LSASS-dump detection - or the fallback they ran when MalSecLogon did not yield the dump.
  - id: windows-access-token-manipulation-sedebugprivilege-001
    name: Windows Access Token Manipulation SeDebugPrivilege
    reason: 'Common same-host precursor to the dump read: SeDebugPrivilege is the standard enabler for reading another process''s memory, toggled on by most dumpers and C2 getsystem-style tooling that would also run MalSecLogon, so a 4703 enabling it around this access flags the operator preparing to read LSASS. (MalSecLogon itself borrows seclogon''s privilege, so treat this as a corroborating precursor, not a strict prerequisite.)'
  - id: 8eef149c-bd26-49f2-9e5a-9b00e3af499b
    name: Pass the Hash Activity 2
    reason: 'End goal and next move: NTLM hashes recovered from the LSASS dump are replayed as type-3 NTLMSSP logons to move laterally without cracking passwords (T1550.002). Appearing for the same account on the heels of this access turns a credential-access alert into a confirmed, in-progress lateral-movement incident.'
  - id: 941e5c45-cda7-4864-8cea-bbb7458d194a
    name: Suspicious Remote Logon with Explicit Credentials
    reason: 'The other half of spending the stolen creds: clear-text credentials pulled from the LSASS dump are reused through explicit-credential remote logons (runas / 4648 feeding remote 4624, T1078). For the same account shortly after this dump it is the lateral-movement outcome that confirms the harvest is being used.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Secondary Logon (seclogon) / svchost handle acquisition on LSASS on this host
    query: ((data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_callTrace:/.*[Ss][Ee][Cc][Ll][Oo][Gg][Oo][Nn]\.[Dd][Ll][Ll].*/) OR (data_win_system_eventID:"10" AND data_win_eventdata_sourceImage:/.*\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/))
    pivot_on:
    - host
    window: 1h
  - name: LSASS memory read to a minidump (dump-grade access masks via dbghelp/dbgcore) on this host
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_grantedAccess:/0[Xx]1010/ OR data_win_eventdata_grantedAccess:/0[Xx]1038/ OR data_win_eventdata_grantedAccess:/0[Xx]1438/ OR data_win_eventdata_grantedAccess:/0[Xx]143[Aa]/ OR data_win_eventdata_grantedAccess:/0[Xx]1440/ OR data_win_eventdata_grantedAccess:/0[Xx]1[Ff][Ff][Ff][Ff][Ff]/) AND (data_win_eventdata_callTrace:/.*[Dd][Bb][Gg][Hh][Ee][Ll][Pp]\.[Dd][Ll][Ll].*/ OR data_win_eventdata_callTrace:/.*[Dd][Bb][Gg][Cc][Oo][Rr][Ee]\.[Dd][Ll][Ll].*/)
    pivot_on:
    - host
    window: 1h
  - name: LSASS dump file written and compressed/staged for exfiltration on this host
    query: (data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Ll][Ss][Aa][Ss][Ss].*\.[Dd][Mm][Pp]/ OR data_win_eventdata_targetFilename:/.*\.[Dd][Mm][Pp]/ OR data_win_eventdata_targetFilename:/.*\.[Dd][Uu][Mm][Pp]/)) OR (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\(7[Zz]|[Rr][Aa][Rr]|[Ww][Ii][Nn][Rr][Aa][Rr])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]-[Aa][Rr][Cc][Hh][Ii][Vv][Ee].*/) AND (data_win_eventdata_commandLine:/.*\.[Dd][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Ss][Ss].*/))
    pivot_on:
    - host
    window: 2h
  - name: This account's network / explicit-credential logons across hosts (harvested-credential reuse)
    query: (data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"9" OR data_win_eventdata_logonType:"10")) OR data_win_system_eventID:"4648" OR (data_win_system_eventID:"4625" AND data_win_eventdata_logonType:"3")
    pivot_on:
    - user
    window: 6h
  - name: Credential-dumping tool execution on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_image:/.*\\[Nn][Aa][Nn][Oo][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_image:/.*\\[Dd][Uu][Mm][Pp][Ee][Rr][Tt].*/ OR data_win_eventdata_image:/.*\\[Cc][Rr][Ee][Aa][Tt][Ee][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_image:/.*\\[Rr][Dd][Rr][Ll][Ee][Aa][Kk][Dd][Ii][Aa][Gg].*/ OR data_win_eventdata_image:/.*\\[Ss][Aa][Ff][Ee][Tt][Yy][Kk][Aa][Tt][Zz].*/ OR data_win_eventdata_image:/.*\\[Hh][Aa][Nn][Dd][Ll][Ee][Kk][Aa][Tt][Zz].*/ OR data_win_eventdata_image:/.*\\[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Pp][Yy][Pp][Yy][Kk][Aa][Tt][Zz].*/ OR data_win_eventdata_commandLine:/.*[Ll][Oo][Gg][Oo][Nn][Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd][Ss].*/)
    pivot_on:
    - host
    window: 2h
