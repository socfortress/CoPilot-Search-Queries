name: Credential Dumping Activity By Python Based Tool
id: f8be3e82-46a3-4e4e-ada5-8e538ae8b9c9
version: 1
schema_version: "1.0"
date: "2023-11-29"
author: Bhabesh Raj, Jonhnathan Ribeiro
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: f8be3e82-46a3-4e4e-ada5-8e538ae8b9c9
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: production
type: TTP

description: >
  Detects LSASS process access for potential credential dumping by a Python-like
  tool such as LaZagne or Pypykatz. MITRE ATT&CK: T1003.001.

data_source:
  - Sysmon EventID 10 - Process Access

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "10"
        
        - wildcard:
            data_win_eventdata_targetImage:
              value: "*\\\\lsass.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_callTrace:
              value: "*_ctypes.pyd+*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_callTrace:
              value: "*:\\\\Windows\\\\System32\\\\KERNELBASE.dll+*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_callTrace:
              value: "*:\\\\Windows\\\\SYSTEM32\\\\ntdll.dll+*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_callTrace:
                    value: "*python27.dll+*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_callTrace:
                    value: "*python3*.dll+*"
                    case_insensitive: true
            minimum_should_match: 1
        - term:
            data_win_eventdata_grantedAccess:
              value: "0x1FFFFF"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetImage
    - data_win_eventdata_callTrace
    - data_win_eventdata_grantedAccess
    - data_win_eventdata_sourceImage

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 10 (process access) enabled in the Sysmon
  configuration for the monitored target processes and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetImage matches
  '*\lsass.exe'; data_win_eventdata_callTrace matches '*_ctypes.pyd+*';
  data_win_eventdata_callTrace matches '*:\Windows\System32\KERNELBASE.dll+*',
  among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/bh4b3sh/status/1303674603819081728
  - https://github.com/skelsec/pypykatz
  - https://attack.mitre.org/techniques/T1003/001/

response:
  message: >
    Credential Dumping Activity By Python Based Tool detected on host
    $agent_name$. Matched data_win_eventdata_targetImage:
    $data_win_eventdata_targetImage$. Matched data_win_eventdata_callTrace:
    $data_win_eventdata_callTrace$. MITRE ATT&CK: T1003.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetImage
      type: process
    - field: data_win_eventdata_callTrace
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.001
  custom_tags:
    - credential
    - dumping
    - python
    - process_access
    - sysmon
    - credential_access
    - s0349
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_callTrace:/.*_[Cc][Tt][Yy][Pp][Ee][Ss]\.[Pp][Yy][Dd]\+.*/ AND data_win_eventdata_callTrace:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Kk][Ee][Rr][Nn][Ee][Ll][Bb][Aa][Ss][Ee]\.[Dd][Ll][Ll]\+.*/ AND data_win_eventdata_callTrace:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Nn][Tt][Dd][Ll][Ll]\.[Dd][Ll][Ll]\+.*/ AND (data_win_eventdata_callTrace:/.*[Pp][Yy][Tt][Hh][Oo][Nn]27\.[Dd][Ll][Ll]\+.*/ OR data_win_eventdata_callTrace:/.*[Pp][Yy][Tt][Hh][Oo][Nn]3.*\.[Dd][Ll][Ll]\+.*/) AND data_win_eventdata_grantedAccess:/0[Xx]1[Ff][Ff][Ff][Ff][Ff]/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: a29808fd-ef50-49ff-9c7a-59a9b040b404
    name: HackTool - Pypykatz Credentials Dumping Activity
    reason: 'Same tool this rule names: the EID 1 process-creation side of a Pypykatz run (pypykatz.exe/python.exe with live/registry args). On this host it confirms which Python tool opened LSASS and supplies the command line, parent process and user that the EID 10 access event alone does not carry.'
  - id: c2b86e67-b880-4eec-b045-50bc98ef4844
    name: HackTool - LaZagne Execution
    reason: The other tool this rule names. LaZagne's memory, -lsa_secrets, -hashdump and -pypykatz modules are precisely what reach into LSASS, so its execution on this host is the precursor process that produced this LSASS access event.
  - id: 5ef9853e-4d0e-4a70-846f-a9ca37d876da
    name: Potential Credential Dumping Activity Via LSASS
    reason: Sibling EID 10 LSASS-access detection whose mask set also includes 0x1fffff; it catches non-Python dumpers (Mimikatz, NanoDump, Procdump, Taskmgr), so it reveals whether the same intrusion dumped LSASS by more than one method on this host.
  - id: a18dd26b-6450-46de-8c91-9659150cf088
    name: Potentially Suspicious GrantedAccess Flags On LSASS
    reason: Fires on the broader family of suspicious LSASS grantedAccess masks (incl. 0x1f?fff). If the tool retried LSASS with a different access mask, or a second process touched LSASS, this confirms repeated credential-dumping access on the same host.
  - id: 10c14723-61c7-4c75-92ca-9af245723ad2
    name: HackTool - Potential Impacket Lateral Movement Activity
    reason: 'The dominant next move after an LSASS dump: the harvested credentials are used for wmiexec/smbexec/dcomexec/atexec lateral movement launched from this host (cmd.exe /Q /c redirected under wmiprvse/services).'
  - id: 8eef149c-bd26-49f2-9e5a-9b00e3af499b
    name: Pass the Hash Activity 2
    reason: 'Direct use of the NTLM hashes just extracted from LSASS: NTLM network logons (type 3 NtLmSsp keyLength 0, or type 9 seclogo) by the compromised account. Pivoting the stolen user shows where the hash was replayed.'
  - id: 42a993dd-bb3e-48c8-b372-4d6684c4106c
    name: HackTool - CrackMapExec Execution
    reason: Consumes dumped hashes/passwords (-H 'NTHASH', --local-auth, smb) to validate and spray them across the network; a common immediate follow-on to credential harvesting from this host.
  - id: fc028194-969d-4122-8abe-0470d5b8f12f
    name: Access to Browser Login Data
    reason: 'Attackers, and LaZagne''s own ''browsers'' module, rarely stop at LSASS: copying Chrome/Edge/Firefox Login Data is the same-campaign broadening of credential theft on this host and user.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Python credential-dumping tool execution on this host
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Pp][Yy][Tt][Hh][Oo][Nn].*\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ll][Aa][Zz][Aa][Gg][Nn][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Pp][Yy][Pp][Yy][Kk][Aa][Tt][Zz]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Pp][Yy][Pp][Yy][Kk][Aa][Tt][Zz].*/ OR data_win_eventdata_commandLine:/.*[Ll][Aa][Zz][Aa][Gg][Nn][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/))
    pivot_on:
    - host
    window: 2h
  - name: All LSASS-dump activity on this host (any method)
    query: ((data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\.[Dd][Mm][Pp]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*-[Mm][Aa] .*[Ll][Ss][Aa][Ss][Ss].*/ OR data_win_eventdata_commandLine:/.*[Nn][Aa][Nn][Oo][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/)))
    pivot_on:
    - host
    window: 1h
  - name: Authentication by the compromised account across the estate (credential reuse)
    query: (data_win_system_eventID:"4624" OR data_win_system_eventID:"4625" OR data_win_system_eventID:"4768" OR data_win_system_eventID:"4769" OR data_win_system_eventID:"4776")
    pivot_on:
    - user
    window: 6h
  - name: Lateral movement / remote execution launched from this host
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\[Pp][Ss][Ee][Xx][Ee].*\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Mm][Ii][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Ww][Ii][Nn][Rr][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_image:/.*\\[Cc][Rr][Aa][Cc][Kk][Mm][Aa][Pp][Ee][Xx][Ee][Cc]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ww][Mm][Ii][Pp][Rr][Vv][Ss][Ee]\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*\\[Ww][Ss][Mm][Pp][Rr][Oo][Vv][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ OR (data_win_eventdata_image:/.*\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Cc][Oo][Mm][Mm][Aa][Nn][Dd].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Ww]-[Pp][Ss][Ss][Ee][Ss][Ss][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*-[Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr][Nn][Aa][Mm][Ee].*/))))
    pivot_on:
    - host
    window: 2h
  - name: Broader secret-store theft on this host (SAM/SECURITY/SYSTEM hive, DPAPI, vault, browser)
    query: ((data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Rr][Ee][Gg]\.[Ee][Xx][Ee]/ AND data_win_eventdata_commandLine:/.*[Ss][Aa][Vv][Ee].*/ AND (data_win_eventdata_commandLine:/.*[Hh][Kk][Ll][Mm].*[Ss][Aa][Mm].*/ OR data_win_eventdata_commandLine:/.*[Hh][Kk][Ll][Mm].*[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy].*/ OR data_win_eventdata_commandLine:/.*[Hh][Kk][Ll][Mm].*[Ss][Yy][Ss][Tt][Ee][Mm].*/)) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\[Vv][Aa][Uu][Ll][Tt][Cc][Mm][Dd]\.[Ee][Xx][Ee]/) OR (data_win_system_eventID:"4104" AND (data_win_eventdata_scriptBlockText:/.*[Ll][Oo][Gg][Ii][Nn] [Dd][Aa][Tt][Aa].*/ OR data_win_eventdata_scriptBlockText:/.*[Dd][Pp][Aa][Pp][Ii].*/ OR data_win_eventdata_scriptBlockText:/.*[Vv][Aa][Uu][Ll][Tt].*/)))
    pivot_on:
    - host
    window: 2h
