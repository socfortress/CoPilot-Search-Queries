name: LSASS Access From Potentially White-Listed Processes
id: 4be8b654-0c01-4c9d-a10c-6b28467fc651
version: 1
schema_version: "1.0"
date: "2023-11-29"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 4be8b654-0c01-4c9d-a10c-6b28467fc651
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a possible process memory dump that uses a white-listed filename like
  TrolleyExpress.exe as a way to dump the LSASS process memory without Microsoft
  Defender interference. MITRE ATT&CK: T1003.001.

data_source:
  - Sysmon EventID 10 - Process Access

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "10"
        
        - wildcard:
            data_win_eventdata_targetImage:
              value: "*\\\\lsass.exe"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_sourceImage:
                    value: "*\\\\TrolleyExpress.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_sourceImage:
                    value: "*\\\\ProcessDump.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_sourceImage:
                    value: "*\\\\dump64.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_grantedAccess: "*10"
              - wildcard:
                  data_win_eventdata_grantedAccess: "*30"
              - wildcard:
                  data_win_eventdata_grantedAccess: "*50"
              - wildcard:
                  data_win_eventdata_grantedAccess: "*70"
              - wildcard:
                  data_win_eventdata_grantedAccess: "*90"
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "*B0"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "*D0"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "*F0"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_grantedAccess: "*18"
              - wildcard:
                  data_win_eventdata_grantedAccess: "*38"
              - wildcard:
                  data_win_eventdata_grantedAccess: "*58"
              - wildcard:
                  data_win_eventdata_grantedAccess: "*78"
              - wildcard:
                  data_win_eventdata_grantedAccess: "*98"
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "*B8"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "*D8"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "*F8"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "*1A"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "*3A"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "*5A"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "*7A"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "*9A"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "*BA"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "*DA"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "*FA"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "*0x14C2"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "*FF"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetImage
    - data_win_eventdata_sourceImage
    - data_win_eventdata_grantedAccess

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 10 (process access) enabled in the Sysmon
  configuration for the monitored target processes and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetImage matches
  '*\lsass.exe'; data_win_eventdata_sourceImage matches '*\TrolleyExpress.exe';
  data_win_eventdata_sourceImage matches '*\ProcessDump.exe', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/_xpn_/status/1491557187168178176
  - https://www.ired.team/offensive-security/credential-access-and-credential-dumping/dump-credentials-from-lsass-process-without-mimikatz
  - https://twitter.com/mrd0x/status/1460597833917251595
  - https://attack.mitre.org/techniques/T1003/001/

response:
  message: >
    LSASS Access From Potentially White-Listed Processes detected on host
    $agent_name$. Matched data_win_eventdata_targetImage:
    $data_win_eventdata_targetImage$. Matched data_win_eventdata_sourceImage:
    $data_win_eventdata_sourceImage$. MITRE ATT&CK: T1003.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetImage
      type: process
    - field: data_win_eventdata_sourceImage
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.001
  custom_tags:
    - lsass
    - white
    - listed
    - process_access
    - sysmon
    - credential_access
    - s0002
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_sourceImage:/.*\\[Tt][Rr][Oo][Ll][Ll][Ee][Yy][Ee][Xx][Pp][Rr][Ee][Ss][Ss]\.[Ee][Xx][Ee]/ OR data_win_eventdata_sourceImage:/.*\\[Pp][Rr][Oo][Cc][Ee][Ss][Ss][Dd][Uu][Mm][Pp]\.[Ee][Xx][Ee]/ OR data_win_eventdata_sourceImage:/.*\\[Dd][Uu][Mm][Pp]64\.[Ee][Xx][Ee]/) AND (data_win_eventdata_grantedAccess:/.*10/ OR data_win_eventdata_grantedAccess:/.*30/ OR data_win_eventdata_grantedAccess:/.*50/ OR data_win_eventdata_grantedAccess:/.*70/ OR data_win_eventdata_grantedAccess:/.*90/ OR data_win_eventdata_grantedAccess:/.*[Bb]0/ OR data_win_eventdata_grantedAccess:/.*[Dd]0/ OR data_win_eventdata_grantedAccess:/.*[Ff]0/ OR data_win_eventdata_grantedAccess:/.*18/ OR data_win_eventdata_grantedAccess:/.*38/ OR data_win_eventdata_grantedAccess:/.*58/ OR data_win_eventdata_grantedAccess:/.*78/ OR data_win_eventdata_grantedAccess:/.*98/ OR data_win_eventdata_grantedAccess:/.*[Bb]8/ OR data_win_eventdata_grantedAccess:/.*[Dd]8/ OR data_win_eventdata_grantedAccess:/.*[Ff]8/ OR data_win_eventdata_grantedAccess:/.*1[Aa]/ OR data_win_eventdata_grantedAccess:/.*3[Aa]/ OR data_win_eventdata_grantedAccess:/.*5[Aa]/ OR data_win_eventdata_grantedAccess:/.*7[Aa]/ OR data_win_eventdata_grantedAccess:/.*9[Aa]/ OR data_win_eventdata_grantedAccess:/.*[Bb][Aa]/ OR data_win_eventdata_grantedAccess:/.*[Dd][Aa]/ OR data_win_eventdata_grantedAccess:/.*[Ff][Aa]/ OR data_win_eventdata_grantedAccess:/.*0[Xx]14[Cc]2/ OR data_win_eventdata_grantedAccess:/.*[Ff][Ff]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 129966c9-de17-4334-a123-8b58172e664d
    name: Potential Windows Defender AV Bypass Via Dump64.EXE Rename
    reason: 'Precursor, same tool: dump64.exe is one of this rule''s three whitelisted source images. This fires when dump64.exe is renamed/placed to evade Defender — the process-creation launch of the very binary that then performs this LSASS read.'
  - id: 79b06761-465f-4f88-9ef2-150e24d3d737
    name: Potential SysInternals ProcDump Evasion
    reason: 'Precursor, same tool family: ProcDump/ProcessDump.exe (another of this rule''s source images) renamed or its dump output moved — the evasive launch of the process that reads LSASS here.'
  - id: 5afee48e-67dd-4e03-a783-f74259dcf998
    name: Potential LSASS Process Dump Via Procdump
    reason: 'Precursor, causal command line: procdump ''-ma lsass'' invocation — the exact command that produces the EID-10 LSASS memory read this detection catches.'
  - id: a18dd26b-6450-46de-8c91-9659150cf088
    name: Potentially Suspicious GrantedAccess Flags On LSASS
    reason: 'Co-occurring, same event: detects the suspicious grantedAccess masks on LSASS regardless of source image, so the identical EID-10 access trips both and confirms this was a memory read, not benign access.'
  - id: 9bd012ee-0dff-44d7-84a0-aa698cfd87a3
    name: LSASS Memory Access by Tool With Dump Keyword In Name
    reason: 'Co-occurring, overlapping population: two of this rule''s source images (ProcessDump.exe, dump64.exe) contain ''dump'', so this source-name heuristic fires on the same LSASS-access events — parallel corroboration.'
  - id: a5a2d357-1ab8-4675-a967-ef9990a59391
    name: LSASS Process Memory Dump Files
    reason: 'Follow-on, immediate artifact: the .dmp file the dumping tool writes to disk right after reading LSASS memory — the next step in the credential-dump sequence.'
  - id: 6902955a-01b7-432c-b32a-6f5f81d8f625
    name: LSASS Process Dump Artefact In CrashDumps Folder
    reason: 'Follow-on, on-disk outcome: an LSASS dump artefact landing in CrashDumps — another confirmation the memory read produced a completed dump file.'
  - id: ec570e53-4c76-45a9-804d-dc3f355ff7a7
    name: 7Zip Compressing Dump Files
    reason: 'Follow-on, collection/exfil prep: compression of a .dmp/.dump file — the staging step that typically follows a successful LSASS dump before exfiltration.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Dump-tool launch & LSASS-dump command lines on this host
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Tt][Rr][Oo][Ll][Ll][Ee][Yy][Ee][Xx][Pp][Rr][Ee][Ss][Ss]|[Pp][Rr][Oo][Cc][Ee][Ss][Ss][Dd][Uu][Mm][Pp]|[Dd][Uu][Mm][Pp]64|[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]|[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]64|[Nn][Aa][Nn][Oo][Dd][Uu][Mm][Pp]|[Rr][Dd][Rr][Ll][Ee][Aa][Kk][Dd][Ii][Aa][Gg])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Ss][Ss].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss].*/ OR data_win_eventdata_commandLine:/.*-[Mm][Aa] .*/))
    pivot_on:
    - host
    window: 1h
  - name: LSASS/memory dump file written to disk on this host
    query: (data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\.([Dd][Mm][Pp]|[Dd][Uu][Mm][Pp])/ OR data_win_eventdata_targetFilename:/.*[Ll][Ss][Aa][Ss][Ss].*/))
    pivot_on:
    - host
    window: 1h
  - name: Any LSASS memory access on this host (alternative dump methods)
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 1h
  - name: This account's logon activity across hosts (harvested-credential reuse)
    query: (data_win_system_eventID:"4624" OR data_win_system_eventID:"4625" OR data_win_system_eventID:"4648")
    pivot_on:
    - user
    window: 6h
  - name: Defender tampering & WDigest cleartext-credential enablement on this host
    query: ((data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee][Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Mm][Pp][Cc][Mm][Dd][Rr][Uu][Nn].*/ OR data_win_eventdata_commandLine:/.*[Ss][Tt][Oo][Pp].*[Ww][Ii][Nn][Dd][Ee][Ff][Ee][Nn][Dd].*/)) OR (data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*[Ww][Dd][Ii][Gg][Ee][Ss][Tt].*[Uu][Ss][Ee][Ll][Oo][Gg][Oo][Nn][Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll].*/ OR data_win_eventdata_targetObject:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee][Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_targetObject:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Aa][Nn][Tt][Ii][Ss][Pp][Yy][Ww][Aa][Rr][Ee].*/)))
    pivot_on:
    - host
    window: 4h
