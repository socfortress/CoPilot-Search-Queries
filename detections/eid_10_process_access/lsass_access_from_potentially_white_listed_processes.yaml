name: LSASS Access From Potentially White-Listed Processes
id: 4be8b654-0c01-4c9d-a10c-6b28467fc651
version: 1
schema_version: "1.0"
date: "2023-11-29"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 4be8b654-0c01-4c9d-a10c-6b28467fc651
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects a possible process memory dump that uses a white-listed filename like
  TrolleyExpress.exe as a way to dump the LSASS process memory without Microsoft
  Defender interference. MITRE ATT&CK: T1003.001.

data_source:
  - Sysmon EventID 10 - Process Access

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "10"
        
        - wildcard:
            data_win_eventdata_targetImage:
              value: "*\\\\lsass.exe"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_sourceImage:
                    value: "*\\\\TrolleyExpress.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_sourceImage:
                    value: "*\\\\ProcessDump.exe"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_sourceImage:
                    value: "*\\\\dump64.exe"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_grantedAccess: "*10"
              - wildcard:
                  data_win_eventdata_grantedAccess: "*30"
              - wildcard:
                  data_win_eventdata_grantedAccess: "*50"
              - wildcard:
                  data_win_eventdata_grantedAccess: "*70"
              - wildcard:
                  data_win_eventdata_grantedAccess: "*90"
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "*B0"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "*D0"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "*F0"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_grantedAccess: "*18"
              - wildcard:
                  data_win_eventdata_grantedAccess: "*38"
              - wildcard:
                  data_win_eventdata_grantedAccess: "*58"
              - wildcard:
                  data_win_eventdata_grantedAccess: "*78"
              - wildcard:
                  data_win_eventdata_grantedAccess: "*98"
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "*B8"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "*D8"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "*F8"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "*1A"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "*3A"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "*5A"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "*7A"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "*9A"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "*BA"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "*DA"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "*FA"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "*0x14C2"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "*FF"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetImage
    - data_win_eventdata_sourceImage
    - data_win_eventdata_grantedAccess

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 10 (process access) enabled in the Sysmon
  configuration for the monitored target processes and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetImage matches
  '*\lsass.exe'; data_win_eventdata_sourceImage matches '*\TrolleyExpress.exe';
  data_win_eventdata_sourceImage matches '*\ProcessDump.exe', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://twitter.com/_xpn_/status/1491557187168178176
  - https://www.ired.team/offensive-security/credential-access-and-credential-dumping/dump-credentials-from-lsass-process-without-mimikatz
  - https://twitter.com/mrd0x/status/1460597833917251595
  - https://attack.mitre.org/techniques/T1003/001/

response:
  message: >
    LSASS Access From Potentially White-Listed Processes detected on host
    $agent_name$. Matched data_win_eventdata_targetImage:
    $data_win_eventdata_targetImage$. Matched data_win_eventdata_sourceImage:
    $data_win_eventdata_sourceImage$. MITRE ATT&CK: T1003.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetImage
      type: process
    - field: data_win_eventdata_sourceImage
      type: process

