name: LSASS Memory Access by Tool With Dump Keyword In Name
id: 9bd012ee-0dff-44d7-84a0-aa698cfd87a3
version: 1
schema_version: "1.0"
date: "2023-11-29"
author: Florian Roth (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 9bd012ee-0dff-44d7-84a0-aa698cfd87a3
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects LSASS process access requests from a source process with the "dump"
  keyword in its image name. MITRE ATT&CK: T1003.001.

data_source:
  - Sysmon EventID 10 - Process Access

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "10"
        
        - wildcard:
            data_win_eventdata_targetImage:
              value: "*\\\\lsass.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_sourceImage:
              value: "*dump*"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_grantedAccess: "*10"
              - wildcard:
                  data_win_eventdata_grantedAccess: "*30"
              - wildcard:
                  data_win_eventdata_grantedAccess: "*50"
              - wildcard:
                  data_win_eventdata_grantedAccess: "*70"
              - wildcard:
                  data_win_eventdata_grantedAccess: "*90"
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "*B0"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "*D0"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "*F0"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_grantedAccess: "*18"
              - wildcard:
                  data_win_eventdata_grantedAccess: "*38"
              - wildcard:
                  data_win_eventdata_grantedAccess: "*58"
              - wildcard:
                  data_win_eventdata_grantedAccess: "*78"
              - wildcard:
                  data_win_eventdata_grantedAccess: "*98"
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "*B8"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "*D8"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "*F8"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "*1A"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "*3A"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "*5A"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "*7A"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "*9A"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "*BA"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "*DA"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "*FA"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "*0x14C2"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "*FF"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetImage
    - data_win_eventdata_sourceImage
    - data_win_eventdata_grantedAccess

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 10 (process access) enabled in the Sysmon
  configuration for the monitored target processes and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetImage matches
  '*\lsass.exe'; data_win_eventdata_sourceImage matches '*dump*';
  data_win_eventdata_grantedAccess matches '*10', among other conditions.

known_false_positives: >
  Rare programs that contain the word dump in their name and access lsass.
  Baseline expected activity in your environment and tune this detection before
  relying on it for automated response.

references:
  - https://twitter.com/_xpn_/status/1491557187168178176
  - https://www.ired.team/offensive-security/credential-access-and-credential-dumping/dump-credentials-from-lsass-process-without-mimikatz
  - https://attack.mitre.org/techniques/T1003/001/

response:
  message: >
    LSASS Memory Access by Tool With Dump Keyword In Name detected on host
    $agent_name$. Matched data_win_eventdata_targetImage:
    $data_win_eventdata_targetImage$. Matched data_win_eventdata_sourceImage:
    $data_win_eventdata_sourceImage$. MITRE ATT&CK: T1003.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetImage
      type: process
    - field: data_win_eventdata_sourceImage
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.001
  custom_tags:
    - lsass
    - memory
    - keyword
    - process_access
    - sysmon
    - credential_access
    - s0002
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_sourceImage:/.*[Dd][Uu][Mm][Pp].*/ AND (data_win_eventdata_grantedAccess:/.*10/ OR data_win_eventdata_grantedAccess:/.*30/ OR data_win_eventdata_grantedAccess:/.*50/ OR data_win_eventdata_grantedAccess:/.*70/ OR data_win_eventdata_grantedAccess:/.*90/ OR data_win_eventdata_grantedAccess:/.*[Bb]0/ OR data_win_eventdata_grantedAccess:/.*[Dd]0/ OR data_win_eventdata_grantedAccess:/.*[Ff]0/ OR data_win_eventdata_grantedAccess:/.*18/ OR data_win_eventdata_grantedAccess:/.*38/ OR data_win_eventdata_grantedAccess:/.*58/ OR data_win_eventdata_grantedAccess:/.*78/ OR data_win_eventdata_grantedAccess:/.*98/ OR data_win_eventdata_grantedAccess:/.*[Bb]8/ OR data_win_eventdata_grantedAccess:/.*[Dd]8/ OR data_win_eventdata_grantedAccess:/.*[Ff]8/ OR data_win_eventdata_grantedAccess:/.*1[Aa]/ OR data_win_eventdata_grantedAccess:/.*3[Aa]/ OR data_win_eventdata_grantedAccess:/.*5[Aa]/ OR data_win_eventdata_grantedAccess:/.*7[Aa]/ OR data_win_eventdata_grantedAccess:/.*9[Aa]/ OR data_win_eventdata_grantedAccess:/.*[Bb][Aa]/ OR data_win_eventdata_grantedAccess:/.*[Dd][Aa]/ OR data_win_eventdata_grantedAccess:/.*[Ff][Aa]/ OR data_win_eventdata_grantedAccess:/.*0[Xx]14[Cc]2/ OR data_win_eventdata_grantedAccess:/.*[Ff][Ff]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 8c0eca51-0f88-4db2-9183-fdfb10c703f9
    name: LSA PPL Protection Setting Modification via CommandLine
    reason: 'Enabler/precursor: disabling LSA RunAsPPL is the step that lets a user-mode tool open LSASS with the memory-read rights this rule keys on. Seen on the same host just before, it means the dump''s access was deliberately unblocked.'
  - id: d6a9b252-c666-4de6-8806-5561bbbd3bdc
    name: Wdigest Enable UseLogonCredential
    reason: 'Precursor prep: setting WDigest UseLogonCredential=1 forces cleartext passwords back into LSASS memory so the dump this rule caught yields plaintext, not just NTLM hashes. Classic staging before dumping.'
  - id: 5afee48e-67dd-4e03-a783-f74259dcf998
    name: Potential LSASS Process Dump Via Procdump
    reason: 'Same action, EID 1 side: ProcDump is itself a ''dump''-named tool, so its -ma/-mm launch against LSASS is the process-creation twin of this EID 10 access and names which binary opened LSASS.'
  - id: ffa6861c-4461-4f59-8a41-578c39f3f23e
    name: LSASS Dump Keyword In CommandLine
    reason: 'Same action, command-line side: ''lsass'' plus ''.dmp'' on a command line is the invocation that produced this memory read, corroborating intent and revealing the output filename to hunt for.'
  - id: a18dd26b-6450-46de-8c91-9659150cf088
    name: Potentially Suspicious GrantedAccess Flags On LSASS
    reason: 'Same EID 10 access judged by mask rather than tool name: catches the identical LSASS reads from source images lacking ''dump'' in the name (renamed binaries, comsvcs), expanding this single hit into every suspicious LSASS touch in the window.'
  - id: a5a2d357-1ab8-4675-a967-ef9990a59391
    name: LSASS Process Memory Dump Files
    reason: 'Direct artifact: the .dmp file landing on disk is the output of the exact memory read this rule detects. Its presence confirms the dump actually succeeded, not merely that LSASS was opened.'
  - id: ec570e53-4c76-45a9-804d-dc3f355ff7a7
    name: 7Zip Compressing Dump Files
    reason: 'Follow-on (Collection): compressing a .dmp/.dump archives the LSASS dump for exfiltration, the next hands-on step after the access this rule caught.'
  - id: 13bbd574-83ac-11ec-99d4-acde48001122
    name: Mimikatz PassTheTicket CommandLine Parameters
    reason: 'Follow-on (Lateral Movement): sekurlsa::tickets /export and kerberos::ptt consume the Kerberos tickets harvested from the LSASS memory this rule saw accessed. The payoff that turns a local dump into movement.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: All LSASS memory access on this host (renamed / alternative dumpers)
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: LSASS credential-dump tooling & command lines on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]|[Nn][Aa][Nn][Oo][Dd][Uu][Mm][Pp]|[Dd][Uu][Mm][Pp][Ee][Rr][Tt]|[Rr][Dd][Rr][Ll][Ee][Aa][Kk][Dd][Ii][Aa][Gg]|[Cc][Rr][Ee][Aa][Tt][Ee][Dd][Uu][Mm][Pp]|[Hh][Aa][Nn][Dd][Ll][Ee][Kk][Aa][Tt][Zz]|[Aa][Vv][Dd][Uu][Mm][Pp])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss].*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Ss][Ss].*\.[Dd][Mm][Pp].*/)
    pivot_on:
    - host
    window: 2h
  - name: LSASS-protection weakening on this host (WDigest cleartext / LSA PPL off)
    query: (data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*[Ww][Dd][Ii][Gg][Ee][Ss][Tt]\\[Uu][Ss][Ee][Ll][Oo][Gg][Oo][Nn][Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll]/ OR data_win_eventdata_targetObject:/.*[Ll][Ss][Aa]\\[Rr][Uu][Nn][Aa][Ss][Pp][Pp][Ll]/)) OR (data_win_system_eventID:"1" AND data_win_eventdata_commandLine:/.*\\[Cc][Oo][Nn][Tt][Rr][Oo][Ll]\\[Ll][Ss][Aa].*/ AND (data_win_eventdata_commandLine:/.*[Rr][Uu][Nn][Aa][Ss][Pp][Pp][Ll].*/ OR data_win_eventdata_commandLine:/.*[Uu][Ss][Ee][Ll][Oo][Gg][Oo][Nn][Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll].*/))
    pivot_on:
    - host
    window: 4h
  - name: LSASS dump file written or compressed for exfil on this host
    query: (data_win_system_eventID:"11" AND ((data_win_eventdata_targetFilename:/.*\\[Ll][Ss][Aa][Ss][Ss].*/ AND data_win_eventdata_targetFilename:/.*\.[Dd][Mm][Pp].*/) OR data_win_eventdata_targetFilename:/.*\\[Nn][Aa][Nn][Oo][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_targetFilename:/.*[Ll][Ss][Aa][Ss][Ss][Dd][Uu][Mm][Pp].*/)) OR (data_win_system_eventID:"1" AND data_win_eventdata_image:/.*\\(7[Zz]|[Ww][Ii][Nn][Rr][Aa][Rr]|[Rr][Aa][Rr])\.[Ee][Xx][Ee]/ AND (data_win_eventdata_commandLine:/.*\.[Dd][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*\.[Dd][Uu][Mm][Pp].*/))
    pivot_on:
    - host
    window: 4h
  - name: 'Harvested-credential reuse: pass-the-ticket & remote execution from this host'
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa]::.*/ OR data_win_eventdata_commandLine:/.*[Kk][Ee][Rr][Bb][Ee][Rr][Oo][Ss]::[Pp][Tt][Tt].*/ OR data_win_eventdata_commandLine:/.*\.[Kk][Ii][Rr][Bb][Ii].*/ OR data_win_eventdata_commandLine:/.*[Ii][Nn][Vv][Oo][Kk][Ee]-[Cc][Oo][Mm][Mm][Aa][Nn][Dd].*/ OR data_win_eventdata_commandLine:/.*[Ee][Nn][Tt][Ee][Rr]-[Pp][Ss][Ss][Ee][Ss][Ss][Ii][Oo][Nn].*/ OR data_win_eventdata_image:/.*\\([Pp][Ss][Ee][Xx][Ee][Cc]|[Pp][Aa][Ee][Xx][Ee][Cc]|[Ww][Mm][Ii][Cc]|[Ww][Ii][Nn][Rr][Ss])\.[Ee][Xx][Ee]/)
    pivot_on:
    - host
    window: 6h
