correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: d6a9b252-c666-4de6-8806-5561bbbd3bdc
    name: Wdigest Enable UseLogonCredential
    reason: 'Precursor defense-evasion: flipping WDigest UseLogonCredential=1 forces LSASS to cache plaintext passwords; seen on the same host before this handle open it shows the dump was deliberately staged to maximize the credential harvest.'
  - id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    name: Dump LSASS via comsvcs DLL
    reason: 'Precursor process-create: rundll32 loading comsvcs.dll MiniDumpW (#24) against LSASS is the exact command that opens the LSASS handle this rule flags - the EID-1 launch behind the EID-10 access.'
  - id: 5afee48e-67dd-4e03-a783-f74259dcf998
    name: Potential LSASS Process Dump Via Procdump
    reason: 'Precursor process-create: procdump -ma/-mm lsass.exe opens LSASS with the memory-read mask this rule catches; pairs the dumping command line with the handle-open it produces.'
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
