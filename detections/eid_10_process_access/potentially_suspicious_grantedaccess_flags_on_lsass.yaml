name: Potentially Suspicious GrantedAccess Flags On LSASS
id: a18dd26b-6450-46de-8c91-9659150cf088
version: 1
schema_version: "1.0"
date: "2026-06-29"
author: Florian Roth, Roberto Rodriguez, Dimitrios Slamaris, Mark Russinovich, Thomas Patzke, Teymur Kheirkhabarov, Sherif Eldeeb, James Dickenson, Aleksey Potapov, oscd.community
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: a18dd26b-6450-46de-8c91-9659150cf088
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects process access requests to LSASS process with potentially suspicious
  access flags. MITRE ATT&CK: T1003.001.

data_source:
  - Sysmon EventID 10 - Process Access

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "10"
        
        - wildcard:
            data_win_eventdata_targetImage:
              value: "*\\\\lsass.exe"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_grantedAccess: "*30"
              - wildcard:
                  data_win_eventdata_grantedAccess: "*50"
              - wildcard:
                  data_win_eventdata_grantedAccess: "*70"
              - wildcard:
                  data_win_eventdata_grantedAccess: "*90"
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "*B0"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "*D0"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "*F0"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_grantedAccess: "*18"
              - wildcard:
                  data_win_eventdata_grantedAccess: "*38"
              - wildcard:
                  data_win_eventdata_grantedAccess: "*58"
              - wildcard:
                  data_win_eventdata_grantedAccess: "*78"
              - wildcard:
                  data_win_eventdata_grantedAccess: "*98"
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "*B8"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "*D8"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "*F8"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "*1A"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "*3A"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "*5A"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "*7A"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "*9A"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "*BA"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "*DA"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "*FA"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "*0x14C2"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "0x100000*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "0x1418*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "0x1438*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "0x143a*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "0x1f0fff*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "0x1f1fff*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "0x1f2fff*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "0x1f3fff*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "0x40*"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_sourceImage"
        - exists:
            field: "data_win_eventdata_callTrace"
        - exists:
            field: "data_win_eventdata_grantedAccess"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_sourceImage:
                          value: "*:\\\\Program Files (x86)\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_sourceImage:
                          value: "*:\\\\Program Files\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_sourceImage:
                          value: "*:\\\\Windows\\\\System32\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_sourceImage:
                          value: "*:\\\\Windows\\\\SysWOW64\\\\*"
                          case_insensitive: true
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_sourceImage:
                                value: "*:\\\\ProgramData\\\\Microsoft\\\\Windows Defender\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_sourceImage:
                                value: "*\\\\MsMpEng.exe"
                                case_insensitive: true
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_callTrace:
                                value: "*|?:\\\\ProgramData\\\\Microsoft\\\\Windows Defender\\\\Definition Updates\\\\{*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_callTrace:
                                value: "*}\\\\mpengine.dll+*"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_grantedAccess:
                                value: "0x1418"
                                case_insensitive: true
                    - wildcard:
                        data_win_eventdata_callTrace:
                          value: "*|c:\\\\program files\\\\windows defender\\\\mprtp.dll*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_callTrace:
                          value: "*|c:\\\\program files\\\\windows defender\\\\MpClient.dll*"
                          case_insensitive: true
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_sourceImage:
                                value: "*\\\\explorer.exe"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_grantedAccess:
                                value: "0x401"
                                case_insensitive: true
                  minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_sourceImage"
        - exists:
            field: "data_win_eventdata_grantedAccess"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_sourceImage:
                          value: "*:\\\\ProgramData\\\\MALWAREBYTES\\\\MBAMSERVICE\\\\ctlrupdate\\\\mbupdatr.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_sourceImage:
                          value: "*\\\\AppData\\\\Local\\\\Programs\\\\Microsoft VS Code\\\\Code.exe"
                          case_insensitive: true
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_sourceImage:
                                value: "*:\\\\ProgramData\\\\VMware\\\\VMware Tools\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_sourceImage:
                                value: "*\\\\vmtoolsd.exe"
                                case_insensitive: true
                    - bool:
                        must:
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_sourceImage:
                                      value: "*\\\\PROCEXP64.EXE"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_sourceImage:
                                      value: "*\\\\PROCEXP.EXE"
                                      case_insensitive: true
                              minimum_should_match: 1
                          - term:
                              data_win_eventdata_grantedAccess:
                                value: "0x40"
                                case_insensitive: true
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_sourceImage:
                                value: "*\\\\MBAMInstallerService.exe"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_grantedAccess:
                                value: "0x40"
                                case_insensitive: true
                    - bool:
                        must:
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_sourceImage:
                                      value: "*\\\\aurora-agent-64.exe"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_sourceImage:
                                      value: "*\\\\aurora-agent.exe"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_sourceImage:
                                      value: "*\\\\thor.exe"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_sourceImage:
                                      value: "*\\\\thor64.exe"
                                      case_insensitive: true
                              minimum_should_match: 1
                          - term:
                              data_win_eventdata_grantedAccess:
                                value: "0x40"
                                case_insensitive: true
                    - bool:
                        must:
                          - bool:
                              should:
                                - wildcard:
                                    data_win_eventdata_sourceImage:
                                      value: "*\\\\handle.exe"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_sourceImage:
                                      value: "*\\\\handle64.exe"
                                      case_insensitive: true
                                - wildcard:
                                    data_win_eventdata_sourceImage:
                                      value: "*\\\\handle64a.exe"
                                      case_insensitive: true
                              minimum_should_match: 1
                          - term:
                              data_win_eventdata_grantedAccess:
                                value: "0x40"
                                case_insensitive: true
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_sourceImage:
                                value: "*\\\\AppData\\\\Local\\\\WebEx\\\\WebexHost.exe"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_grantedAccess:
                                value: "0x401"
                                case_insensitive: true
                    - wildcard:
                        data_win_eventdata_sourceImage:
                          value: "*\\\\SteamLibrary\\\\steamapps\\\\*"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetImage
    - data_win_eventdata_grantedAccess
    - data_win_eventdata_sourceImage
    - data_win_eventdata_callTrace

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 10 (process access) enabled in the Sysmon
  configuration for the monitored target processes and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetImage matches
  '*\lsass.exe'; data_win_eventdata_grantedAccess matches '*30';
  data_win_eventdata_grantedAccess matches '*50', among other conditions.

known_false_positives: >
  Legitimate software such as AV and EDR. Baseline expected activity in your
  environment and tune this detection before relying on it for automated
  response.

