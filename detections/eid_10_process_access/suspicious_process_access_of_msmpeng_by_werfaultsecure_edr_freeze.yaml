name: Suspicious Process Access of MsMpEng by WerFaultSecure - EDR-Freeze
id: 387df17d-3b04-448f-8669-9e7fd5e5fd8c
version: 1
schema_version: "1.0"
date: "2025-11-27"
author: Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 387df17d-3b04-448f-8669-9e7fd5e5fd8c
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects process access events where WerFaultSecure accesses MsMpEng.exe with
  dbgcore.dll or dbghelp.dll in the call trace, indicating potential EDR freeze
  techniques. This technique leverages WerFaultSecure.exe running as a Protected
  Process Light (PPL) with WinTCB protection level to call MiniDumpWriteDump and
  suspend EDR/AV processes, allowing malicious activity to execute undetected
  during the suspension period. MITRE ATT&CK: T1685.

data_source:
  - Sysmon EventID 10 - Process Access

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "10"
        
        - wildcard:
            data_win_eventdata_sourceImage:
              value: "*\\\\WerFaultSecure.exe"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_targetImage:
              value: "*\\\\MsMpEng.exe"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_callTrace:
                    value: "*\\\\dbgcore.dll*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_callTrace:
                    value: "*\\\\dbghelp.dll*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_sourceImage
    - data_win_eventdata_targetImage
    - data_win_eventdata_callTrace
    - data_win_eventdata_grantedAccess

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 10 (process access) enabled in the Sysmon
  configuration for the monitored target processes and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_sourceImage matches
  '*\WerFaultSecure.exe'; data_win_eventdata_targetImage matches
  '*\MsMpEng.exe'; data_win_eventdata_callTrace matches '*\dbgcore.dll*', among
  other conditions.

known_false_positives: >
  Legitimate Windows Error Reporting operations. Baseline expected activity in
  your environment and tune this detection before relying on it for automated
  response.

references:
  - https://blog.axelarator.net/hunting-for-edr-freeze/
  - https://attack.mitre.org/techniques/T1685/

response:
  message: >
    Suspicious Process Access of MsMpEng by WerFaultSecure - EDR-Freeze detected
    on host $agent_name$. Matched data_win_eventdata_sourceImage:
    $data_win_eventdata_sourceImage$. Matched data_win_eventdata_targetImage:
    $data_win_eventdata_targetImage$. MITRE ATT&CK: T1685
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_sourceImage
      type: process
    - field: data_win_eventdata_targetImage
      type: process

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685
  custom_tags:
    - msmpeng
    - werfaultsecure
    - freeze
    - process_access
    - sysmon
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"10" AND data_win_eventdata_sourceImage:/.*\\[Ww][Ee][Rr][Ff][Aa][Uu][Ll][Tt][Ss][Ee][Cc][Uu][Rr][Ee]\.[Ee][Xx][Ee]/ AND data_win_eventdata_targetImage:/.*\\[Mm][Ss][Mm][Pp][Ee][Nn][Gg]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_callTrace:/.*\\[Dd][Bb][Gg][Cc][Oo][Rr][Ee]\.[Dd][Ll][Ll].*/ OR data_win_eventdata_callTrace:/.*\\[Dd][Bb][Gg][Hh][Ee][Ll][Pp]\.[Dd][Ll][Ll].*/)

correlation:
  # Authored by the correlation engine for review.
  enrichment_searches:
  # NEW ad-hoc searches the engine runs around an alert from this rule, scoped to
  # the alert's host/user/IP within the window (not existing CoPilot Searches).
    - name: "Sysmon activity on this host in the window"
      query: 'data_win_system_channel:"Microsoft-Windows-Sysmon/Operational"'
      pivot_on: [host]
      window: 1h
    - name: "Process creation on this host"
      query: 'data_win_system_eventID:"1"'
      pivot_on: [host]
      window: 1h
    - name: "Network connections from this host"
      query: 'data_win_system_eventID:"3"'
      pivot_on: [host]
      window: 1h
    - name: "High-severity alerts on this host"
      query: 'rule_level:>=10'
      pivot_on: [host]
      window: 1h
