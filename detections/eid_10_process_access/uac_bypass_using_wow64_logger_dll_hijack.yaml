name: UAC Bypass Using WOW64 Logger DLL Hijack
id: 4f6c43e2-f989-4ea5-bcd8-843b49a0317c
version: 1
schema_version: "1.0"
date: "2022-10-09"
author: Christian Burkard (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 4f6c43e2-f989-4ea5-bcd8-843b49a0317c
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects the pattern of UAC Bypass using a WoW64 logger DLL hijack (UACMe 30).
  MITRE ATT&CK: T1548.002.

data_source:
  - Sysmon EventID 10 - Process Access

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "10"
        
        - wildcard:
            data_win_eventdata_sourceImage:
              value: "*:\\\\Windows\\\\SysWOW64\\\\*"
              case_insensitive: true
        - term:
            data_win_eventdata_grantedAccess:
              value: "0x1fffff"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_callTrace:
              value: "UNKNOWN(0000000000000000)|UNKNOWN(0000000000000000)|*"
              case_insensitive: true
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_sourceImage
    - data_win_eventdata_grantedAccess
    - data_win_eventdata_callTrace
    - data_win_eventdata_targetImage

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 10 (process access) enabled in the Sysmon
  configuration for the monitored target processes and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_sourceImage matches
  '*:\Windows\SysWOW64\*'; data_win_eventdata_grantedAccess equals '0x1fffff';
  data_win_eventdata_callTrace matches
  'UNKNOWN(0000000000000000)|UNKNOWN(0000000000000000)|*'.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/hfiref0x/UACME
  - https://attack.mitre.org/techniques/T1548/002/

response:
  message: >
    UAC Bypass Using WOW64 Logger DLL Hijack detected on host $agent_name$.
    Matched data_win_eventdata_sourceImage: $data_win_eventdata_sourceImage$.
    Matched data_win_eventdata_grantedAccess:
    $data_win_eventdata_grantedAccess$. MITRE ATT&CK: T1548.002
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_sourceImage
      type: process
    - field: data_win_eventdata_grantedAccess
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1548.002
  custom_tags:
    - bypass
    - wow64
    - logger
    - process_access
    - sysmon
    - privilege_escalation
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"10" AND data_win_eventdata_sourceImage:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Ww][Oo][Ww]64\\.*/ AND data_win_eventdata_grantedAccess:/0[Xx]1[Ff][Ff][Ff][Ff][Ff]/ AND data_win_eventdata_callTrace:/[Uu][Nn][Kk][Nn][Oo][Ww][Nn]\(0000000000000000\)\|[Uu][Nn][Kk][Nn][Oo][Ww][Nn]\(0000000000000000\)\|.*/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 6b98b92b-4f00-4f62-b4fe-4d1920215771
    name: Potential DLL Sideloading Of Non-Existent DLLs From System Folders
    reason: 'The exact precursor image-load: its match list literally includes C:\Windows\System32\wow64log.dll - the phantom DLL this UAC bypass plants. Sysmon logs that unsigned wow64log.dll load (EID 7) moments before the WoW64 process issues the full-access OpenProcess this rule catches (EID 10), so a co-fire on the same host pins the exact wow64log hijack.'
  - id: d38d2fa4-98e6-4a24-aff1-410b0c9ad177
    name: HackTool - UACMe Akagi Execution
    reason: 'The tool behind the technique: UACMe''s Akagi(64).exe implements method 30 (Wow64Logger), which is precisely this behaviour. Its EID-1 launch (by PE metadata/imphash) on the same host identifies the operator and confirms the bypass is UACMe-driven, not an incidental SysWOW64 access.'
  - id: a5ea83a7-05a5-44c1-be2e-addccbbd8c03
    name: UAC Bypass With Fake DLL
    reason: 'Co-occurring sibling of the same fake-DLL UAC-bypass class: dropping a fake dismcore.dll for the auto-elevating dism.exe to load (EID 7). An operator cycling UACMe methods often tries several; a co-fire shows which auto-elevate-plus-planted-DLL path actually took on the host.'
  - id: a18dd26b-6450-46de-8c91-9659150cf088
    name: Potentially Suspicious GrantedAccess Flags On LSASS
    reason: 'The canonical next step once high integrity is won: the same EID-10 process-access-rights abuse (grantedAccess incl. 0x1fffff) turned against lsass.exe to steal credentials. On the host right after the bypass it marks the pivot from privilege escalation to credential theft.'
  - id: a7ee1722-c3c5-aeff-3212-c777e4733217
    name: Disable Windows Defender AV Security Monitoring
    reason: 'Immediate follow-on the escalation enables: Set-MpPreference -Disable...Monitoring or ''sc stop/delete windefend'' needs the high-integrity rights the bypass just granted. Attackers routinely blind Defender right after escalating and before dropping tooling, so a co-fire signals hands-on abuse of the new privileges.'
  window: 2h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Planted wow64log.dll phantom DLL written or loaded on this host
    query: (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*\\[Ww][Oo][Ww]64[Ll][Oo][Gg]\.[Dd][Ll][Ll]/) OR (data_win_system_eventID:"7" AND data_win_eventdata_imageLoaded:/.*\\[Ww][Oo][Ww]64[Ll][Oo][Gg]\.[Dd][Ll][Ll]/)
    pivot_on:
    - host
    window: 2h
  - name: UACMe and auto-elevating UAC-bypass binaries on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*(\\[Aa][Kk][Aa][Gg][Ii]\.[Ee][Xx][Ee]|\\[Aa][Kk][Aa][Gg][Ii]64\.[Ee][Xx][Ee]|\\[Ff][Oo][Dd][Hh][Ee][Ll][Pp][Ee][Rr]\.[Ee][Xx][Ee]|\\[Ee][Vv][Ee][Nn][Tt][Vv][Ww][Rr]\.[Ee][Xx][Ee]|\\[Ss][Dd][Cc][Ll][Tt]\.[Ee][Xx][Ee]|\\[Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr][Dd][Ee][Ff][Aa][Uu][Ll][Tt][Ss]\.[Ee][Xx][Ee]|\\[Ss][Ll][Uu][Ii]\.[Ee][Xx][Ee]|\\[Ww][Ss][Rr][Ee][Ss][Ee][Tt]\.[Ee][Xx][Ee]|\\[Cc][Mm][Ss][Tt][Pp]\.[Ee][Xx][Ee]|\\[Ii][Ss][Cc][Ss][Ii][Cc][Pp][Ll]\.[Ee][Xx][Ee])/ OR data_win_eventdata_originalFileName:/[Aa][Kk][Aa][Gg][Ii].*\.[Ee][Xx][Ee]/ OR data_win_eventdata_parentImage:/.*(\\[Ff][Oo][Dd][Hh][Ee][Ll][Pp][Ee][Rr]\.[Ee][Xx][Ee]|\\[Ee][Vv][Ee][Nn][Tt][Vv][Ww][Rr]\.[Ee][Xx][Ee]|\\[Ss][Dd][Cc][Ll][Tt]\.[Ee][Xx][Ee]|\\[Cc][Oo][Mm][Pp][Uu][Tt][Ee][Rr][Dd][Ee][Ff][Aa][Uu][Ll][Tt][Ss]\.[Ee][Xx][Ee]|\\[Ss][Ll][Uu][Ii]\.[Ee][Xx][Ee]|\\[Ww][Ss][Rr][Ee][Ss][Ee][Tt]\.[Ee][Xx][Ee]|\\[Cc][Mm][Ss][Tt][Pp]\.[Ee][Xx][Ee])/)
    pivot_on:
    - host
    window: 2h
  - name: LSASS credential access or memory-dump on this host
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_grantedAccess:/.*0[Xx]1438.*/ OR data_win_eventdata_grantedAccess:/.*0[Xx]143[Aa].*/ OR data_win_eventdata_grantedAccess:/.*0[Xx]1410.*/ OR data_win_eventdata_grantedAccess:/.*0[Xx]1010.*/ OR data_win_eventdata_grantedAccess:/.*0[Xx]1[Ff][Ff][Ff][Ff][Ff].*/)) OR (data_win_system_eventID:"11" AND data_win_eventdata_targetFilename:/.*[Ll][Ss][Aa][Ss][Ss].*\.[Dd][Mm][Pp]/) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll].*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp].*[Ll][Ss][Aa][Ss][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ss][Aa][Vv][Ee].*[Hh][Kk][Ll][Mm].*[Ss][Aa][Mm].*/))
    pivot_on:
    - host
    window: 2h
  - name: Windows Defender tamper / AV-disable commands on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Ee][Tt]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*[Dd][Ii][Ss][Aa][Bb][Ll][Ee].*/ OR data_win_eventdata_commandLine:/.*[Aa][Dd][Dd]-[Mm][Pp][Pp][Rr][Ee][Ff][Ee][Rr][Ee][Nn][Cc][Ee].*[Ee][Xx][Cc][Ll][Uu][Ss][Ii][Oo][Nn].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Rr][Ee][Aa][Ll][Tt][Ii][Mm][Ee][Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Bb][Ee][Hh][Aa][Vv][Ii][Oo][Rr][Mm][Oo][Nn][Ii][Tt][Oo][Rr][Ii][Nn][Gg].*/ OR data_win_eventdata_commandLine:/.*[Tt][Aa][Mm][Pp][Ee][Rr][Pp][Rr][Oo][Tt][Ee][Cc][Tt][Ii][Oo][Nn].*/ OR (data_win_eventdata_commandLine:/.*[Ww][Ii][Nn][Dd][Ee][Ff][Ee][Nn][Dd].*/ AND (data_win_eventdata_commandLine:/.*[Ss][Tt][Oo][Pp].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ee][Ll][Ee][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Dd][Ii][Ss][Aa][Bb][Ll][Ee][Dd].*/)))
    pivot_on:
    - host
    window: 2h
  - name: Privileged service or scheduled-task persistence on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Ss][Cc].*[Cc][Rr][Ee][Aa][Tt][Ee].*[Bb][Ii][Nn][Pp][Aa][Tt][Hh].*/ OR data_win_eventdata_commandLine:/.*[Nn][Ee][Ww]-[Ss][Ee][Rr][Vv][Ii][Cc][Ee].*/ OR data_win_eventdata_commandLine:/.*[Ss][Cc][Hh][Tt][Aa][Ss][Kk][Ss].*[Cc][Rr][Ee][Aa][Tt][Ee].*/ OR data_win_eventdata_commandLine:/.*[Rr][Ee][Gg][Ii][Ss][Tt][Ee][Rr]-[Ss][Cc][Hh][Ee][Dd][Uu][Ll][Ee][Dd][Tt][Aa][Ss][Kk].*/ OR (data_win_eventdata_parentImage:/.*\\[Ss][Ee][Rr][Vv][Ii][Cc][Ee][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_image:/.*(\\[Cc][Mm][Dd]\.[Ee][Xx][Ee]|\\[Pp][Oo][Ww][Ee][Rr][Ss][Hh][Ee][Ll][Ll]\.[Ee][Xx][Ee]|\\[Pp][Ww][Ss][Hh]\.[Ee][Xx][Ee])/))
    pivot_on:
    - host
    window: 4h
