name: Suspicious Process Access to LSASS with Dbgcore/Dbghelp DLLs
id: 9f5c1d59-33be-4e60-bcab-85d2f566effd
version: 1
schema_version: "1.0"
date: "2025-11-27"
author: Swachchhanda Shrawan Poudel (Nextron Systems)
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 9f5c1d59-33be-4e60-bcab-85d2f566effd
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious process access to LSASS.exe from processes located in
  uncommon locations with dbgcore.dll or dbghelp.dll in the call trace. These
  DLLs contain functions like MiniDumpWriteDump that can be abused for
  credential dumping purposes. While modern tools like Mimikatz have moved to
  using ntdll.dll, dbgcore.dll and dbghelp.dll are still used by basic
  credential dumping utilities and legacy tools for LSASS memory access and
  process suspension techniques. MITRE ATT&CK: T1003.001, T1685.

data_source:
  - Sysmon EventID 10 - Process Access

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "10"
        
        - wildcard:
            data_win_eventdata_targetImage:
              value: "*\\\\lsass.exe"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_callTrace:
                    value: "*dbgcore.dll*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_callTrace:
                    value: "*dbghelp.dll*"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_sourceImage:
                    value: "*:\\\\Perflogs\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_sourceImage:
                    value: "*:\\\\Temp\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_sourceImage:
                    value: "*:\\\\Users\\\\Public\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_sourceImage:
                    value: "*\\\\$Recycle.Bin\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_sourceImage:
                    value: "*\\\\AppData\\\\Roaming\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_sourceImage:
                    value: "*\\\\Contacts\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_sourceImage:
                    value: "*\\\\Desktop\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_sourceImage:
                    value: "*\\\\Documents\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_sourceImage:
                    value: "*\\\\Downloads\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_sourceImage:
                    value: "*\\\\Favorites\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_sourceImage:
                    value: "*\\\\Favourites\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_sourceImage:
                    value: "*\\\\inetpub\\\\wwwroot\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_sourceImage:
                    value: "*\\\\Music\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_sourceImage:
                    value: "*\\\\Pictures\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_sourceImage:
                    value: "*\\\\Start Menu\\\\Programs\\\\Startup\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_sourceImage:
                    value: "*\\\\Users\\\\Default\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_sourceImage:
                    value: "*\\\\Videos\\\\*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_sourceImage:
                    value: "*\\\\Windows\\\\Temp\\\\*"
                    case_insensitive: true
            minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetImage
    - data_win_eventdata_callTrace
    - data_win_eventdata_sourceImage
    - data_win_eventdata_grantedAccess

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 10 (process access) enabled in the Sysmon
  configuration for the monitored target processes and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetImage matches
  '*\lsass.exe'; data_win_eventdata_callTrace matches '*dbgcore.dll*';
  data_win_eventdata_callTrace matches '*dbghelp.dll*', among other conditions.

known_false_positives: >
  Possibly during software installation or update processes. Baseline expected
  activity in your environment and tune this detection before relying on it for
  automated response.

references:
  - https://www.splunk.com/en_us/blog/security/you-bet-your-lsass-hunting-lsass-access.html
  - https://docs.microsoft.com/en-us/windows/win32/api/minidumpapiset/nf-minidumpwritedump
  - https://attack.mitre.org/techniques/T1003/001/
  - https://attack.mitre.org/techniques/T1685/

response:
  message: >
    Suspicious Process Access to LSASS with Dbgcore/Dbghelp DLLs detected on
    host $agent_name$. Matched data_win_eventdata_targetImage:
    $data_win_eventdata_targetImage$. Matched data_win_eventdata_callTrace:
    $data_win_eventdata_callTrace$. MITRE ATT&CK: T1003.001, T1685
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetImage
      type: process
    - field: data_win_eventdata_callTrace
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.001
    - T1685
  custom_tags:
    - lsass
    - dbgcore
    - dbghelp
    - process_access
    - sysmon
    - credential_access
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_callTrace:/.*[Dd][Bb][Gg][Cc][Oo][Rr][Ee]\.[Dd][Ll][Ll].*/ OR data_win_eventdata_callTrace:/.*[Dd][Bb][Gg][Hh][Ee][Ll][Pp]\.[Dd][Ll][Ll].*/) AND (data_win_eventdata_sourceImage:/.*:\\[Pp][Ee][Rr][Ff][Ll][Oo][Gg][Ss]\\.*/ OR data_win_eventdata_sourceImage:/.*:\\[Tt][Ee][Mm][Pp]\\.*/ OR data_win_eventdata_sourceImage:/.*:\\[Uu][Ss][Ee][Rr][Ss]\\[Pp][Uu][Bb][Ll][Ii][Cc]\\.*/ OR data_win_eventdata_sourceImage:/.*\\\$[Rr][Ee][Cc][Yy][Cc][Ll][Ee]\.[Bb][Ii][Nn]\\.*/ OR data_win_eventdata_sourceImage:/.*\\[Aa][Pp][Pp][Dd][Aa][Tt][Aa]\\[Rr][Oo][Aa][Mm][Ii][Nn][Gg]\\.*/ OR data_win_eventdata_sourceImage:/.*\\[Cc][Oo][Nn][Tt][Aa][Cc][Tt][Ss]\\.*/ OR data_win_eventdata_sourceImage:/.*\\[Dd][Ee][Ss][Kk][Tt][Oo][Pp]\\.*/ OR data_win_eventdata_sourceImage:/.*\\[Dd][Oo][Cc][Uu][Mm][Ee][Nn][Tt][Ss]\\.*/ OR data_win_eventdata_sourceImage:/.*\\[Dd][Oo][Ww][Nn][Ll][Oo][Aa][Dd][Ss]\\.*/ OR data_win_eventdata_sourceImage:/.*\\[Ff][Aa][Vv][Oo][Rr][Ii][Tt][Ee][Ss]\\.*/ OR data_win_eventdata_sourceImage:/.*\\[Ff][Aa][Vv][Oo][Uu][Rr][Ii][Tt][Ee][Ss]\\.*/ OR data_win_eventdata_sourceImage:/.*\\[Ii][Nn][Ee][Tt][Pp][Uu][Bb]\\[Ww][Ww][Ww][Rr][Oo][Oo][Tt]\\.*/ OR data_win_eventdata_sourceImage:/.*\\[Mm][Uu][Ss][Ii][Cc]\\.*/ OR data_win_eventdata_sourceImage:/.*\\[Pp][Ii][Cc][Tt][Uu][Rr][Ee][Ss]\\.*/ OR data_win_eventdata_sourceImage:/.*\\[Ss][Tt][Aa][Rr][Tt] [Mm][Ee][Nn][Uu]\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm][Ss]\\[Ss][Tt][Aa][Rr][Tt][Uu][Pp]\\.*/ OR data_win_eventdata_sourceImage:/.*\\[Uu][Ss][Ee][Rr][Ss]\\[Dd][Ee][Ff][Aa][Uu][Ll][Tt]\\.*/ OR data_win_eventdata_sourceImage:/.*\\[Vv][Ii][Dd][Ee][Oo][Ss]\\.*/ OR data_win_eventdata_sourceImage:/.*\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\.*/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: fe63010f-8823-4864-a96b-a7b4a0f7b929
    name: LSASS Process Reconnaissance Via Findstr.EXE
    reason: 'Precursor: before opening a handle, the operator resolves the LSASS PID with `tasklist | findstr lsass`. Finding this moments earlier on the same host confirms targeted, hands-on-keyboard LSASS dumping rather than a benign debugger.'
  - id: 5ef9853e-4d0e-4a70-846f-a9ca37d876da
    name: Potential Credential Dumping Activity Via LSASS
    reason: Same Sysmon EID10 LSASS open seen from the call-trace/access-mask angle (it keys on dbgcore/dbghelp/ntdll in callTrace plus 0x1038/0x1438 masks). It fires on the very same MiniDump handle this rule flags and, lacking the uncommon-location filter, also catches the same actor dumping from a trusted path.
  - id: a18dd26b-6450-46de-8c91-9659150cf088
    name: Potentially Suspicious GrantedAccess Flags On LSASS
    reason: 'Corroborates the GrantedAccess value this rule returns in _source: confirms the handle requested MiniDump-capable rights (PROCESS_VM_READ|QUERY_INFORMATION) on lsass.exe, independent of callTrace or source path.'
  - id: 9bd012ee-0dff-44d7-84a0-aa698cfd87a3
    name: LSASS Memory Access by Tool With Dump Keyword In Name
    reason: Same EID10 LSASS open when the source image is named *dump* — exactly the 'basic credential dumping utilities and legacy tools' this rule's description says still rely on dbghelp. A parallel hit names the dumper on the source side.
  - id: a49fa4d5-11db-418c-8473-1e014a8dd462
    name: Lsass Memory Dump via Comsvcs DLL
    reason: Alternative MiniDumpWriteDump path (`rundll32 comsvcs.dll, MiniDump`) the same operator commonly pivots to when a dbghelp-based dumper is blocked or fails; same EID10 target (lsass.exe) within the window indicates repeated dump attempts.
  - id: 5afee48e-67dd-4e03-a783-f74259dcf998
    name: Potential LSASS Process Dump Via Procdump
    reason: Another alternative LSASS dumper (`procdump -ma lsass`) the actor may run in parallel on the same host; procdump itself loads dbghelp to call MiniDumpWriteDump, so it is the same technique with a signed binary.
  - id: a5a2d357-1ab8-4675-a967-ef9990a59391
    name: LSASS Process Memory Dump Files
    reason: 'Direct follow-on and confirmation: the on-disk artifact the MiniDumpWriteDump call writes (lsass*.dmp / lsass.zip / lsass.rar / nanodump / proc_*.dmp). Its creation on the same host proves the dump succeeded and names the output file to seize.'
  - id: ec570e53-4c76-45a9-804d-dc3f355ff7a7
    name: 7Zip Compressing Dump Files
    reason: 'Next step after a successful dump: packaging the .dmp with 7-Zip for staging and exfiltration. Seeing it on the same host turns credential-access into an active collection/exfil incident.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: LSASS memory-dump file written to disk on this host
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Ll][Ss][Aa][Ss][Ss].*\.([Dd][Mm][Pp]|[Mm][Dd][Mm][Pp]|[Zz][Ii][Pp]|[Rr][Aa][Rr]|7[Zz])/ OR data_win_eventdata_targetFilename:/.*\\([Nn][Aa][Nn][Oo][Dd][Uu][Mm][Pp]|[Pp][Rr][Oo][Cc]_).*\.[Dd][Mm][Pp]/ OR data_win_eventdata_targetFilename:/.*\\[Ll][Ss][Aa][Ss][Ss][Dd][Uu][Mm][Pp].*/)
    pivot_on:
    - host
    window: 1h
  - name: Every process opening a handle to LSASS on this host
    query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/
    pivot_on:
    - host
    window: 1h
  - name: LSASS dump tools & LOLBin MiniDump commands executed on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]64|[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]|[Cc][Rr][Ee][Aa][Tt][Ee][Dd][Uu][Mm][Pp]|[Nn][Aa][Nn][Oo][Dd][Uu][Mm][Pp]|[Rr][Dd][Rr][Ll][Ee][Aa][Kk][Dd][Ii][Aa][Gg]|[Dd][Uu][Mm][Pp][Ee][Rr][Tt])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll].*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*[Ll][Ss][Aa][Ss][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/)
    pivot_on:
    - host
    window: 2h
  - name: Credential dump compressed for exfiltration on this host
    query: data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\(7[Zz]|7[Zz][Aa]|7[Zz][Rr]|[Rr][Aa][Rr]|[Ww][Ii][Nn][Rr][Aa][Rr]|[Mm][Aa][Kk][Ee][Cc][Aa][Bb]|[Tt][Aa][Rr])\.[Ee][Xx][Ee]/ OR data_win_eventdata_description:/.*7-[Zz][Ii][Pp].*/) AND data_win_eventdata_commandLine:/.*\.([Dd][Mm][Pp]|[Dd][Uu][Mm][Pp]).*/
    pivot_on:
    - host
    window: 4h
  - name: This account's remote & failed logons (harvested-credential reuse)
    query: (data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"9" OR data_win_eventdata_logonType:"10")) OR data_win_system_eventID:"4625"
    pivot_on:
    - user
    window: 6h
