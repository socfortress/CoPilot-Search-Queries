name: Potential Credential Dumping Activity Via LSASS
id: 5ef9853e-4d0e-4a70-846f-a9ca37d876da
version: 1
schema_version: "1.0"
date: "2026-06-29"
author: Samir Bousseaden, Michael Haag
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 5ef9853e-4d0e-4a70-846f-a9ca37d876da
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects process access requests to the LSASS process with specific call trace
  calls and access masks. This behaviour is expressed by many credential dumping
  tools such as Mimikatz, NanoDump, Invoke-Mimikatz, Procdump and even the
  Taskmgr dumping feature. MITRE ATT&CK: T1003.001.

data_source:
  - Sysmon EventID 10 - Process Access

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "10"
        
        - wildcard:
            data_win_eventdata_targetImage:
              value: "*\\\\lsass.exe"
              case_insensitive: true
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "*0x1038*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "*0x1438*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "*0x143a*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_grantedAccess:
                    value: "*0x1fffff*"
                    case_insensitive: true
            minimum_should_match: 1
        - bool:
            should:
              - wildcard:
                  data_win_eventdata_callTrace:
                    value: "*dbgcore.dll*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_callTrace:
                    value: "*dbghelp.dll*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_callTrace:
                    value: "*kernel32.dll*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_callTrace:
                    value: "*kernelbase.dll*"
                    case_insensitive: true
              - wildcard:
                  data_win_eventdata_callTrace:
                    value: "*ntdll.dll*"
                    case_insensitive: true
            minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_sourceUser"
        - bool:
            must_not:
              - bool:
                  should:
                    - wildcard:
                        data_win_eventdata_sourceUser:
                          value: "*AUTHORI*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_sourceUser:
                          value: "*AUTORI*"
                          case_insensitive: true
                  minimum_should_match: 1
        - exists:
            field: "data_win_eventdata_callTrace"
        - exists:
            field: "data_win_eventdata_grantedAccess"
        - exists:
            field: "data_win_eventdata_sourceImage"
        - bool:
            must_not:
              - bool:
                  should:
                    - bool:
                        must:
                          - wildcard:
                              data_win_eventdata_callTrace:
                                value: "*:\\\\Windows\\\\Temp\\\\asgard2-agent\\\\*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_callTrace:
                                value: "*\\\\thor\\\\thor64.exe+*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_callTrace:
                                value: "*|UNKNOWN(*"
                                case_insensitive: true
                          - term:
                              data_win_eventdata_grantedAccess:
                                value: "0x103800"
                                case_insensitive: true
                    - wildcard:
                        data_win_eventdata_sourceImage:
                          value: "*:\\\\Windows\\\\Sysmon64.exe"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_sourceImage:
                          value: "*:\\\\Windows\\\\Sysmon64a.exe"
                          case_insensitive: true
                  minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetImage
    - data_win_eventdata_grantedAccess
    - data_win_eventdata_callTrace
    - data_win_eventdata_sourceUser
    - data_win_eventdata_sourceImage

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 10 (process access) enabled in the Sysmon
  configuration for the monitored target processes and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetImage matches
  '*\lsass.exe'; data_win_eventdata_grantedAccess matches '*0x1038*';
  data_win_eventdata_grantedAccess matches '*0x1438*', among other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://web.archive.org/web/20230329170326/https://blog.menasec.net/2019/02/threat-hunting-21-procdump-or-taskmgr.html
  - https://web.archive.org/web/20230208123920/https://cyberwardog.blogspot.com/2017/03/chronicles-of-threat-hunter-hunting-for_22.html
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1003.001/T1003.001.md
  - https://research.splunk.com/endpoint/windows_possible_credential_dumping/
  - https://attack.mitre.org/techniques/T1003/001/

response:
  message: >
    Potential Credential Dumping Activity Via LSASS detected on host
    $agent_name$. Matched data_win_eventdata_targetImage:
    $data_win_eventdata_targetImage$. Matched data_win_eventdata_grantedAccess:
    $data_win_eventdata_grantedAccess$. MITRE ATT&CK: T1003.001
  risk_score: 50
  severity: medium
  risk_objects:
    - field: agent_name
      type: system
      score: 50
  threat_objects:
    - field: data_win_eventdata_targetImage
      type: process
    - field: data_win_eventdata_grantedAccess
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1003.001
  custom_tags:
    - credential
    - dumping
    - lsass
    - process_access
    - sysmon
    - credential_access
    - s0002
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_grantedAccess:/.*0[Xx]1038.*/ OR data_win_eventdata_grantedAccess:/.*0[Xx]1438.*/ OR data_win_eventdata_grantedAccess:/.*0[Xx]143[Aa].*/ OR data_win_eventdata_grantedAccess:/.*0[Xx]1[Ff][Ff][Ff][Ff][Ff].*/) AND (data_win_eventdata_callTrace:/.*[Dd][Bb][Gg][Cc][Oo][Rr][Ee]\.[Dd][Ll][Ll].*/ OR data_win_eventdata_callTrace:/.*[Dd][Bb][Gg][Hh][Ee][Ll][Pp]\.[Dd][Ll][Ll].*/ OR data_win_eventdata_callTrace:/.*[Kk][Ee][Rr][Nn][Ee][Ll]32\.[Dd][Ll][Ll].*/ OR data_win_eventdata_callTrace:/.*[Kk][Ee][Rr][Nn][Ee][Ll][Bb][Aa][Ss][Ee]\.[Dd][Ll][Ll].*/ OR data_win_eventdata_callTrace:/.*[Nn][Tt][Dd][Ll][Ll]\.[Dd][Ll][Ll].*/) AND _exists_:data_win_eventdata_sourceUser AND NOT (data_win_eventdata_sourceUser:/.*[Aa][Uu][Tt][Hh][Oo][Rr][Ii].*/ OR data_win_eventdata_sourceUser:/.*[Aa][Uu][Tt][Oo][Rr][Ii].*/) AND _exists_:data_win_eventdata_callTrace AND _exists_:data_win_eventdata_grantedAccess AND _exists_:data_win_eventdata_sourceImage AND NOT ((data_win_eventdata_callTrace:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Tt][Ee][Mm][Pp]\\[Aa][Ss][Gg][Aa][Rr][Dd]2-[Aa][Gg][Ee][Nn][Tt]\\.*/ AND data_win_eventdata_callTrace:/.*\\[Tt][Hh][Oo][Rr]\\[Tt][Hh][Oo][Rr]64\.[Ee][Xx][Ee]\+.*/ AND data_win_eventdata_callTrace:/.*\|[Uu][Nn][Kk][Nn][Oo][Ww][Nn]\(.*/ AND data_win_eventdata_grantedAccess:/0[Xx]103800/) OR data_win_eventdata_sourceImage:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Mm][Oo][Nn]64\.[Ee][Xx][Ee]/ OR data_win_eventdata_sourceImage:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Mm][Oo][Nn]64[Aa]\.[Ee][Xx][Ee]/)

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: 646ea171-dded-4578-8a4d-65e9822892e3
    name: Process Memory Dump Via Comsvcs.DLL
    reason: 'Process-creation view of the exact LOLBIN technique this rule catches: rundll32 comsvcs.dll MiniDump reading LSASS. On the same host it names the sourceImage/command line behind this EID 10 LSASS access.'
  - id: 5afee48e-67dd-4e03-a783-f74259dcf998
    name: Potential LSASS Process Dump Via Procdump
    reason: ProcDump (named in this rule's own description) run with -ma/-mm against LSASS is a process that performs this very memory read; its EID 1 identifies the dumper binary and dump flags behind the access.
  - id: a642964e-bead-4bed-8910-1bb4d63e3b4d
    name: HackTool - Mimikatz Execution
    reason: Mimikatz sekurlsa::logonpasswords calls OpenProcess on LSASS with the dump rights and MiniDump-style call trace this rule matches; the execution event identifies the tool performing the access.
  - id: a5a2d357-1ab8-4675-a967-ef9990a59391
    name: LSASS Process Memory Dump Files
    reason: 'Direct follow-on artifact: the .dmp written to disk by the LSASS memory read this rule caught, confirming a credential dump actually landed on the host.'
  - id: d6a9b252-c666-4de6-8806-5561bbbd3bdc
    name: Wdigest Enable UseLogonCredential
    reason: 'Precursor priming: setting WDigest UseLogonCredential=1 forces clear-text passwords back into LSASS memory so the subsequent dump yields plaintext; frequently flipped shortly before dumping.'
  - id: ec570e53-4c76-45a9-804d-dc3f355ff7a7
    name: 7Zip Compressing Dump Files
    reason: 'Follow-on collection/exfil staging: compressing a .dmp (the LSASS dump) with 7-Zip is the next step after the memory read, packaging harvested credentials to leave the host.'
  - id: 941e5c45-cda7-4864-8cea-bbb7458d194a
    name: Suspicious Remote Logon with Explicit Credentials
    reason: 'Follow-on lateral movement: credentials harvested from LSASS reused for explicit-credential (RunAs/overpass-the-hash) remote logons; pivot on the acting account.'
  - id: 4e87b8e2-2ee9-4b2a-a715-4727d297ece0
    name: Potential SAM Database Dump
    reason: 'Co-occurring credential-access expansion: operators dumping LSASS routinely also export the local SAM hive on the same host for offline hash cracking.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: LSASS/credential dump file written to disk on this host
    query: data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*[Ll][Ss][Aa][Ss][Ss].*\.([Dd][Mm][Pp]|[Dd][Uu][Mm][Pp])/ OR data_win_eventdata_targetFilename:/.*\.([Dd][Mm][Pp]|[Dd][Uu][Mm][Pp])/)
    pivot_on:
    - host
    window: 1h
  - name: LSASS-dumping tool or comsvcs/MiniDump LOLBIN executed on this host
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_image:/.*\\([Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]|[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp]64|[Ss][Qq][Ll][Dd][Uu][Mm][Pp][Ee][Rr]|[Cc][Rr][Ee][Aa][Tt][Ee][Dd][Uu][Mm][Pp]|[Rr][Dd][Rr][Ll][Ee][Aa][Kk][Dd][Ii][Aa][Gg]|[Dd][Uu][Mm][Pp][Ee][Rr][Tt]|[Nn][Aa][Nn][Oo][Dd][Uu][Mm][Pp]|[Mm][Ii][Mm][Ii][Kk][Aa][Tt][Zz])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Ss][Vv][Cc][Ss]\.[Dd][Ll][Ll].*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Mm][Ii][Nn][Ii][Dd][Uu][Mm][Pp].*[Ll][Ss][Aa][Ss][Ss].*/ OR data_win_eventdata_commandLine:/.*[Pp][Rr][Oo][Cc][Dd][Uu][Mm][Pp].*[Ll][Ss][Aa][Ss][Ss].*/ OR data_win_eventdata_commandLine:/.*[Ss][Ee][Kk][Uu][Rr][Ll][Ss][Aa].*/ OR data_win_eventdata_commandLine:/.*[Ll][Oo][Gg][Oo][Nn][Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd][Ss].*/))
    pivot_on:
    - host
    window: 1h
  - name: LSASS credential-exposure priming via registry (WDigest/PPL/CredGuard/SilentProcessExit)
    query: (data_win_system_eventID:"13" OR data_win_system_eventID:"12") AND (data_win_eventdata_targetObject:/.*[Ww][Dd][Ii][Gg][Ee][Ss][Tt]\\[Uu][Ss][Ee][Ll][Oo][Gg][Oo][Nn][Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll].*/ OR data_win_eventdata_targetObject:/.*[Ll][Ss][Aa]\\[Rr][Uu][Nn][Aa][Ss][Pp][Pp][Ll].*/ OR data_win_eventdata_targetObject:/.*[Ll][Ss][Aa]\\[Ll][Ss][Aa][Cc][Ff][Gg][Ff][Ll][Aa][Gg][Ss].*/ OR data_win_eventdata_targetObject:/.*[Ss][Ii][Ll][Ee][Nn][Tt][Pp][Rr][Oo][Cc][Ee][Ss][Ss][Ee][Xx][Ii][Tt]\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee].*/ OR data_win_eventdata_targetObject:/.*[Ii][Mm][Aa][Gg][Ee] [Ff][Ii][Ll][Ee] [Ee][Xx][Ee][Cc][Uu][Tt][Ii][Oo][Nn] [Oo][Pp][Tt][Ii][Oo][Nn][Ss]\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee].*/)
    pivot_on:
    - host
    window: 24h
  - name: Additional credential-store theft on this host (SAM/SYSTEM/NTDS/Vault)
    query: (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Rr][Ee][Gg].*[Ss][Aa][Vv][Ee].*[Hh][Kk][Ll][Mm].*([Ss][Aa][Mm]|[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy]|[Ss][Yy][Ss][Tt][Ee][Mm]).*/ OR data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss][Uu][Tt][Ii][Ll].*/ OR data_win_eventdata_commandLine:/.*[Nn][Tt][Dd][Ss]\.[Dd][Ii][Tt].*/ OR data_win_eventdata_image:/.*\\[Vv][Aa][Uu][Ll][Tt][Cc][Mm][Dd]\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Ll][Aa][Zz][Aa][Gg][Nn][Ee].*/))
    pivot_on:
    - host
    window: 2h
  - name: 'Harvested-credential reuse: logons by this account'
    query: (data_win_system_eventID:"4624" OR data_win_system_eventID:"4648" OR data_win_system_eventID:"4625")
    pivot_on:
    - user
    window: 6h
