name: HackTool - HandleKatz Duplicating LSASS Handle
id: b1bd3a59-c1fd-4860-9f40-4dd161a7d1f5
version: 1
schema_version: "1.0"
date: "2023-11-28"
author: Bhabesh Raj (rule), @thefLinkk
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: b1bd3a59-c1fd-4860-9f40-4dd161a7d1f5
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects HandleKatz opening LSASS to duplicate its handle to later dump the
  memory without opening any new handles. MITRE ATT&CK: T1106, T1003.001.

data_source:
  - Sysmon EventID 10 - Process Access

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "10"
        
        - wildcard:
            data_win_eventdata_targetImage:
              value: "*\\\\lsass.exe"
              case_insensitive: true
        - term:
            data_win_eventdata_grantedAccess:
              value: "0x1440"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_callTrace:
              value: "C:\\\\Windows\\\\System32\\\\ntdll.dll+*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_callTrace:
              value: "*|UNKNOWN(*"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_callTrace: "*)"
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetImage
    - data_win_eventdata_grantedAccess
    - data_win_eventdata_callTrace
    - data_win_eventdata_sourceImage

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 10 (process access) enabled in the Sysmon
  configuration for the monitored target processes and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetImage matches
  '*\lsass.exe'; data_win_eventdata_grantedAccess equals '0x1440';
  data_win_eventdata_callTrace matches 'C:\Windows\System32\ntdll.dll+*', among
  other conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/codewhitesec/HandleKatz
  - https://attack.mitre.org/techniques/T1106/
  - https://attack.mitre.org/techniques/T1003/001/

response:
  message: >
    HackTool - HandleKatz Duplicating LSASS Handle detected on host
    $agent_name$. Matched data_win_eventdata_targetImage:
    $data_win_eventdata_targetImage$. Matched data_win_eventdata_grantedAccess:
    $data_win_eventdata_grantedAccess$. MITRE ATT&CK: T1106, T1003.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetImage
      type: process
    - field: data_win_eventdata_grantedAccess
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1106
    - T1003.001
  custom_tags:
    - hacktool
    - handlekatz
    - duplicating
    - process_access
    - sysmon
    - execution
    - credential_access
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ AND data_win_eventdata_grantedAccess:/0[Xx]1440/ AND data_win_eventdata_callTrace:/[Cc]:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Nn][Tt][Dd][Ll][Ll]\.[Dd][Ll][Ll]\+.*/ AND data_win_eventdata_callTrace:/.*\|[Uu][Nn][Kk][Nn][Oo][Ww][Nn]\(.*/ AND data_win_eventdata_callTrace:/.*\)/

correlation:
  # Authored per-rule (behaviour-researched) for the correlation engine. Related CoPilot
  # Searches + telemetry pivots to run around an alert, scoped to its host/user/ip/domain.
  related_rules:
  - id: ca621ba5-54ab-4035-9942-d378e6fcde3c
    name: HackTool - HandleKatz LSASS Dumper Execution
    reason: The exact same tool seen from the EID 1 process-creation side (the HandleKatz binary and its command line). This EID 10 alert is HandleKatz's stealth core - duplicating an existing LSASS handle (grantedAccess 0x1440 carries PROCESS_DUP_HANDLE) instead of opening a fresh one - so a matching HandleKatz process-creation event on the same host in-window is the highest-confidence confirmation the hacktool genuinely ran.
  - id: d474c8fe-bb69-4ea0-b7d9-f682b56d52d3
    name: HackTool - Doppelanger LSASS Dumper Execution
    reason: 'Sibling evasive LSASS dumper: Doppelanger dumps LSASS via process cloning to defeat the same EDR hooks HandleKatz sidesteps with handle duplication. Operators routinely carry several such bypass dumpers, so its presence on the same host signals a toolkit built to beat LSASS-access detection rather than a one-off.'
  - id: 6309645e-122d-4c5b-bb2b-22e4f9c2fa42
    name: HackTool - Potential CobaltStrike Process Injection
    reason: 'Likely origin of the in-memory code: HandleKatz''s callTrace carries an UNKNOWN()/ntdll-only frame, meaning the caller is manually-mapped (unbacked) memory - the hallmark of a C2 beacon. A CobaltStrike remote-thread injection on the same host in-window points to the beacon that ran the fileless dumper.'
  - id: d5601f8c-b26f-4ab0-9035-69e11a8d4ad2
    name: CobaltStrike Named Pipe
    reason: 'Corroborates the beacon from a second angle: a default CobaltStrike named pipe (msagent_/postex_/status_) on the same host confirms an active beacon is the unbacked process that issued the LSASS handle-duplication call this alert caught.'
  - id: windows-access-token-manipulation-sedebugprivilege-001
    name: Windows Access Token Manipulation SeDebugPrivilege
    reason: 'Required precursor: duplicating a handle to LSASS (PROCESS_DUP_HANDLE) needs SeDebugPrivilege enabled in the source token. Event 4703 enabling that privilege on the host moments before the access is the token manipulation that makes HandleKatz''s LSASS reach possible.'
  - id: a18dd26b-6450-46de-8c91-9659150cf088
    name: Potentially Suspicious GrantedAccess Flags On LSASS
    reason: Co-occurring LSASS access with other suspicious access masks. If the actor also probed LSASS with granted-access flags beyond HandleKatz's 0x1440, this rule catches those attempts on the same host, widening a single-signature hit into the full picture of how LSASS was touched.
  - id: a5a2d357-1ab8-4675-a967-ef9990a59391
    name: LSASS Process Memory Dump Files
    reason: 'The payoff artifact on disk: HandleKatz reads LSASS memory and writes an (obfuscated) minidump. An EID 11 lsass*.dmp FileCreate proves the dump actually completed and hands the analyst the output path to chase for compression and exfiltration.'
  - id: 8eef149c-bd26-49f2-9e5a-9b00e3af499b
    name: Pass the Hash Activity 2
    reason: 'End goal and next move: NTLM hashes recovered from the LSASS dump are replayed (type-3 NTLMSSP logons) to move laterally without cracking passwords. Its appearance for the same account turns this credential-access alert into a confirmed, in-progress lateral-movement incident.'
  window: 1h
  enrichment_searches:
  # Behaviour-targeted hunts the engine runs around the alert (not a sweep).
  - name: Stealthy LSASS access with dump/handle-duplication granted-access masks on this host
    query: (data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*\\[Ll][Ss][Aa][Ss][Ss]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_grantedAccess:/0[Xx]1440/ OR data_win_eventdata_grantedAccess:/0[Xx]1040/ OR data_win_eventdata_grantedAccess:/0[Xx]1410/ OR data_win_eventdata_grantedAccess:/0[Xx]143[Aa]/ OR data_win_eventdata_grantedAccess:/0[Xx]1438/ OR data_win_eventdata_grantedAccess:/0[Xx]10[Ff][Ff]/ OR data_win_eventdata_grantedAccess:/0[Xx]1[Ff][Ff][Ff][Ff][Ff]/))
    pivot_on:
    - host
    window: 1h
  - name: 'Injected-beacon origin: remote-thread injection and CobaltStrike named pipes on this host'
    query: (data_win_system_eventID:"8") OR ((data_win_system_eventID:"17" OR data_win_system_eventID:"18") AND (data_win_eventdata_pipeName:/.*\\[Mm][Ss][Ss][Ee]-.*/ OR data_win_eventdata_pipeName:/.*\\[Pp][Oo][Ss][Tt][Ee][Xx]_.*/ OR data_win_eventdata_pipeName:/.*\\[Ss][Tt][Aa][Tt][Uu][Ss]_.*/ OR data_win_eventdata_pipeName:/.*\\[Mm][Ss][Aa][Gg][Ee][Nn][Tt]_.*/ OR data_win_eventdata_pipeName:/.*\\[Ii][Nn][Tt][Ee][Rr][Pp][Rr][Oo][Cc][Ee][Ss][Ss]_.*/))
    pivot_on:
    - host
    window: 2h
  - name: LSASS dump written to disk and compressed for exfiltration on this host
    query: (data_win_system_eventID:"11" AND (data_win_eventdata_targetFilename:/.*\.[Dd][Mm][Pp]/ OR data_win_eventdata_targetFilename:/.*[Ll][Ss][Aa][Ss][Ss].*\.[Dd][Mm][Pp].*/ OR data_win_eventdata_targetFilename:/.*\.[Dd][Uu][Mm][Pp]/)) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*\.[Dd][Mm][Pp].*/ OR data_win_eventdata_commandLine:/.*[Ll][Ss][Aa][Ss][Ss].*[Dd][Uu][Mm][Pp].*/) AND (data_win_eventdata_image:/.*\\(7[Zz]|7[Zz][Gg]|[Rr][Aa][Rr]|[Ww][Ii][Nn][Rr][Aa][Rr])\.[Ee][Xx][Ee]/ OR data_win_eventdata_commandLine:/.*[Cc][Oo][Mm][Pp][Rr][Ee][Ss][Ss]-[Aa][Rr][Cc][Hh][Ii][Vv][Ee].*/))
    pivot_on:
    - host
    window: 2h
  - name: SeDebugPrivilege enabled or RunAsPPL/WDigest LSASS-protection tampering on this host
    query: (data_win_system_eventID:"4703") OR (data_win_system_eventID:"13" AND (data_win_eventdata_targetObject:/.*[Rr][Uu][Nn][Aa][Ss][Pp][Pp][Ll].*/ OR data_win_eventdata_targetObject:/.*[Ll][Ss][Aa][Cc][Ff][Gg][Ff][Ll][Aa][Gg][Ss].*/ OR data_win_eventdata_targetObject:/.*[Ww][Dd][Ii][Gg][Ee][Ss][Tt]\\[Uu][Ss][Ee][Ll][Oo][Gg][Oo][Nn][Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll].*/)) OR (data_win_system_eventID:"1" AND (data_win_eventdata_commandLine:/.*[Rr][Uu][Nn][Aa][Ss][Pp][Pp][Ll].*/ OR data_win_eventdata_commandLine:/.*[Uu][Ss][Ee][Ll][Oo][Gg][Oo][Nn][Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll].*/))
    pivot_on:
    - host
    window: 4h
  - name: Harvested-credential replay by this account across the estate (pass-the-hash / lateral logons)
    query: (data_win_system_eventID:"4624" AND (data_win_eventdata_logonType:"3" OR data_win_eventdata_logonType:"9" OR data_win_eventdata_logonType:"10") AND (data_win_eventdata_logonProcessName:/[Nn][Tt][Ll][Mm][Ss][Ss][Pp]/ OR data_win_eventdata_logonProcessName:/[Ss][Ee][Cc][Ll][Oo][Gg][Oo]/)) OR (data_win_system_eventID:"4625" AND data_win_eventdata_logonType:"3")
    pivot_on:
    - user
    window: 6h
