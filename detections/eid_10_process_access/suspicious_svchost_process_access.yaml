name: Suspicious Svchost Process Access
id: 166e9c50-8cd9-44af-815d-d1f0c0e90dde
version: 1
schema_version: "1.0"
date: "2023-01-30"
author: Tim Burrell
source:
  format: sigma
  repository: SigmaHQ/sigma
  rule_id: 166e9c50-8cd9-44af-815d-d1f0c0e90dde
  commit: release-20260810
  license: DRL-1.1
converted_by: Moussa Amine — sigma2copilot v0.1.0
status: experimental
type: TTP

description: >
  Detects suspicious access to the "svchost" process such as that used by
  Invoke-Phantom to kill the thread of the Windows event logging service. MITRE
  ATT&CK: T1685.001.

data_source:
  - Sysmon EventID 10 - Process Access

search:
  index_pattern: "${INDEX_PATTERN}"
  size: 100
  sort:
    - timestamp: desc
  query:
    bool:
      must:
        - term:
            agent_name: "${AGENT_NAME}"
        - term:
            agent_labels_customer: "${CUSTOMER_CODE}"
        - term:
            data_win_system_eventID: "10"
        
        - wildcard:
            data_win_eventdata_targetImage:
              value: "*:\\\\Windows\\\\System32\\\\svchost.exe"
              case_insensitive: true
        - term:
            data_win_eventdata_grantedAccess:
              value: "0x1F3FFF"
              case_insensitive: true
        - wildcard:
            data_win_eventdata_callTrace:
              value: "*UNKNOWN*"
              case_insensitive: true
        - exists:
            field: "data_win_eventdata_sourceImage"
        - exists:
            field: "data_win_eventdata_callTrace"
        - bool:
            must_not:
              - bool:
                  must:
                    - wildcard:
                        data_win_eventdata_sourceImage:
                          value: "*:\\\\Program Files\\\\Microsoft Visual Studio\\\\*"
                          case_insensitive: true
                    - wildcard:
                        data_win_eventdata_sourceImage:
                          value: "*\\\\MSBuild\\\\Current\\\\Bin\\\\MSBuild.exe"
                          case_insensitive: true
                    - bool:
                        should:
                          - wildcard:
                              data_win_eventdata_callTrace:
                                value: "*Microsoft.Build.ni.dll*"
                                case_insensitive: true
                          - wildcard:
                              data_win_eventdata_callTrace:
                                value: "*System.ni.dll*"
                                case_insensitive: true
                        minimum_should_match: 1
        # ---- end generated ----
        - range:
            timestamp:
              gte: "${START_TIME}"
              lte: "${END_TIME}"
  _source:
    - timestamp
    - agent_name
    - data_win_system_eventID
    - data_win_eventdata_targetImage
    - data_win_eventdata_grantedAccess
    - data_win_eventdata_callTrace
    - data_win_eventdata_sourceImage

parameters:
  AGENT_NAME:
    description: "Target agent/host name"
    type: string
    required: true
    example: "DESKTOP-AM0HLGE"
  CUSTOMER_CODE:
    description: "Customer label for filtering"
    type: string
    required: true
    example: "lab"
  INDEX_PATTERN:
    description: "Elasticsearch index pattern"
    type: string
    required: true
    example: "wazuh-lab_*"
  START_TIME:
    description: "Query start time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now-24h"
    example: "2026-04-08 00:00:00.000"
  END_TIME:
    description: "Query end time (ISO 8601 or relative)"
    type: datetime
    required: false
    default: "now"
    example: "2026-04-08 23:59:59.999"

how_to_implement: >
  Requires Sysmon EventID 10 (process access) enabled in the Sysmon
  configuration for the monitored target processes and the
  Microsoft-Windows-Sysmon/Operational channel collected by the Wazuh agent. The
  detection looks for events where data_win_eventdata_targetImage matches
  '*:\Windows\System32\svchost.exe'; data_win_eventdata_grantedAccess equals
  '0x1F3FFF'; data_win_eventdata_callTrace matches '*UNKNOWN*', among other
  conditions.

known_false_positives: >
  Unknown. Baseline expected activity in your environment and tune this
  detection before relying on it for automated response.

references:
  - https://github.com/hlldz/Invoke-Phant0m
  - https://twitter.com/timbmsft/status/900724491076214784
  - https://attack.mitre.org/techniques/T1685/001/

response:
  message: >
    Suspicious Svchost Process Access detected on host $agent_name$. Matched
    data_win_eventdata_targetImage: $data_win_eventdata_targetImage$. Matched
    data_win_eventdata_grantedAccess: $data_win_eventdata_grantedAccess$. MITRE
    ATT&CK: T1685.001
  risk_score: 75
  severity: high
  risk_objects:
    - field: agent_name
      type: system
      score: 75
  threat_objects:
    - field: data_win_eventdata_targetImage
      type: process
    - field: data_win_eventdata_grantedAccess
      type: other

tags:
  asset_type: Endpoint
  mitre_attack_id:
    - T1685.001
  custom_tags:
    - svchost
    - process_access
    - sysmon
    - defense_impairment
  product:
    - Wazuh
  security_domain: endpoint

graylog:
  query: data_win_system_eventID:"10" AND data_win_eventdata_targetImage:/.*:\\[Ww][Ii][Nn][Dd][Oo][Ww][Ss]\\[Ss][Yy][Ss][Tt][Ee][Mm]32\\[Ss][Vv][Cc][Hh][Oo][Ss][Tt]\.[Ee][Xx][Ee]/ AND data_win_eventdata_grantedAccess:/0[Xx]1[Ff]3[Ff][Ff][Ff]/ AND data_win_eventdata_callTrace:/.*[Uu][Nn][Kk][Nn][Oo][Ww][Nn].*/ AND _exists_:data_win_eventdata_sourceImage AND _exists_:data_win_eventdata_callTrace AND NOT (data_win_eventdata_sourceImage:/.*:\\[Pp][Rr][Oo][Gg][Rr][Aa][Mm] [Ff][Ii][Ll][Ee][Ss]\\[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt] [Vv][Ii][Ss][Uu][Aa][Ll] [Ss][Tt][Uu][Dd][Ii][Oo]\\.*/ AND data_win_eventdata_sourceImage:/.*\\[Mm][Ss][Bb][Uu][Ii][Ll][Dd]\\[Cc][Uu][Rr][Rr][Ee][Nn][Tt]\\[Bb][Ii][Nn]\\[Mm][Ss][Bb][Uu][Ii][Ll][Dd]\.[Ee][Xx][Ee]/ AND (data_win_eventdata_callTrace:/.*[Mm][Ii][Cc][Rr][Oo][Ss][Oo][Ff][Tt]\.[Bb][Uu][Ii][Ll][Dd]\.[Nn][Ii]\.[Dd][Ll][Ll].*/ OR data_win_eventdata_callTrace:/.*[Ss][Yy][Ss][Tt][Ee][Mm]\.[Nn][Ii]\.[Dd][Ll][Ll].*/))

correlation:
  # Authored by the correlation engine for review.
  enrichment_searches:
  # NEW ad-hoc searches the engine runs around an alert from this rule, scoped to
  # the alert's host/user/IP within the window (not existing CoPilot Searches).
    - name: "Sysmon activity on this host in the window"
      query: 'data_win_system_channel:"Microsoft-Windows-Sysmon/Operational"'
      pivot_on: [host]
      window: 1h
    - name: "Process creation on this host"
      query: 'data_win_system_eventID:"1"'
      pivot_on: [host]
      window: 1h
    - name: "Network connections from this host"
      query: 'data_win_system_eventID:"3"'
      pivot_on: [host]
      window: 1h
    - name: "High-severity alerts on this host"
      query: 'rule_level:>=10'
      pivot_on: [host]
      window: 1h
